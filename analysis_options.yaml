include: package:very_good_analysis/analysis_options.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    invalid_annotation_target: ignore
    todo: ignore
    fixme: warning
    always_use_package_imports: ignore
    directives_ordering: ignore
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.config.dart"
    - "build/**"
    - "ios/**"
    - "android/**"

linter:
  rules:
    public_member_api_docs: false   # too noisy at scaffold stage; revisit after Plan 5
    avoid_print: true
    prefer_const_constructors: true
    sort_pub_dependencies: false    # pubspec is grouped by purpose, not alphabetized
