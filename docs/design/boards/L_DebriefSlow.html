@keyframes fx-pop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.12);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes fx-up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fx-sheet{from{transform:translateY(105%)}to{transform:translateY(0)}}

@keyframes fx-ring{0%{box-shadow:0 0 0 0 rgba(11,122,104,.38)}100%{box-shadow:0 0 0 16px rgba(11,122,104,0)}}
@keyframes fx-draw{from{stroke-dashoffset:26}to{stroke-dashoffset:0}}
@keyframes fx-burst{0%{transform:translate(0,0) rotate(0) scale(.2);opacity:0}7%{transform:translate(calc(var(--dx) * .12),calc(var(--dy) * .12)) rotate(calc(var(--r) * .1)) scale(1);opacity:1}75%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--r)) scale(1);opacity:0}}

@keyframes fx-rollout{from{transform:translateY(0);opacity:1}to{transform:translateY(-110%);opacity:0}}
@keyframes fx-rollin{from{transform:translateY(110%);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes fx-flame{0%{transform:scale(1)}35%{transform:scale(1.4) rotate(-8deg)}65%{transform:scale(.94) rotate(4deg)}100%{transform:scale(1)}}
@keyframes fx-stamp{0%{transform:scale(1.9) rotate(-14deg);opacity:0}55%{transform:scale(.94) rotate(-6deg);opacity:1}100%{transform:scale(1) rotate(-6deg);opacity:1}}
@keyframes fx-bounce{0%{transform:scale(1)}30%{transform:scale(.82)}65%{transform:scale(1.14)}100%{transform:scale(1)}}
@keyframes fx-draw-path{from{stroke-dashoffset:520}to{stroke-dashoffset:0}}
@keyframes fx-glow{0%,100%{opacity:.0}50%{opacity:1}}
.fx-pop{animation:fx-pop .5s cubic-bezier(.34,1.56,.64,1) both}
.fx-up{animation:fx-up .45s cubic-bezier(.2,.9,.3,1) both}
.fx-sheet{animation:fx-sheet .52s cubic-bezier(.2,1.15,.35,1) both}
.fx-draw path{stroke-dasharray:26;animation:fx-draw .38s cubic-bezier(.6,0,.3,1) both;animation-delay:var(--dd,.12s)}
.fx-conf{position:absolute;width:8px;height:12px;border-radius:2px;opacity:0;animation:fx-burst 1.1s cubic-bezier(.15,.7,.35,1) both;pointer-events:none}
.press{transition:transform .14s cubic-bezier(.3,0,.3,1)}
.press:active{transform:scale(.96)}
.opt{border:2px solid transparent;background:#FFFFFF;border-radius:16px;height:60px;padding:0 16px;display:flex;align-items:center;gap:14px;width:100%;text-align:left;cursor:pointer;box-sizing:border-box;transition:border-color .18s,background .18s,opacity .3s,transform .14s}
.opt:active{transform:scale(.98)}
.opt.sel{border-color:#0B7A68;background:#E4F1EE}
.opt.ok{border-color:#0B7A68;background:#E4F1EE;animation:fx-ring .7s ease-out .05s}
.opt.bad{border-color:#D70015;background:#FDE8EA;animation:fx-shake .42s cubic-bezier(.36,.07,.19,.97) both}
.opt.dim{opacity:.4}
.cta{transition:background .2s, color .2s, transform .14s}
.cta:active{transform:scale(.97)}
.cta.off{background:#EDEDF0 !important;color:#AEAEB2 !important}
.bar-fill{transition:width .6s cubic-bezier(.2,1.1,.35,1)}
.tab-ic.hit{animation:fx-bounce .42s cubic-bezier(.3,1.4,.5,1)}
.sw{transition:background .25s}
.knob{transition:transform .35s cubic-bezier(.34,1.56,.64,1)}
@media (prefers-reduced-motion: reduce){*{animation-duration:1ms !important;animation-delay:0ms !important;transition-duration:1ms !important}}

@keyframes fx-drop{from{transform:translateY(-140%);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes fx-lift{from{transform:translateY(0);opacity:1}to{transform:translateY(-140%);opacity:0}}
@keyframes fx-slide{from{transform:translateX(36px);opacity:0}to{transform:none;opacity:1}}
@keyframes fx-fadeout{from{opacity:1}to{opacity:0}}
.seg-pill{transition:transform .38s cubic-bezier(.3,1.25,.45,1)}
.clock{transition:color .3s}
.cellsel{animation:fx-pop .42s cubic-bezier(.34,1.56,.64,1) both}

@keyframes fx-spin{to{transform:rotate(360deg)}}
@keyframes fx-fadein{from{opacity:0}to{opacity:1}}
@keyframes fx-pulse{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes fx-sheetin{from{transform:translateY(-60px) rotate(-4deg);opacity:0}to{transform:translateY(0) rotate(var(--rot));opacity:1}}
.fx-spinner{animation:fx-spin .9s linear infinite}
.fx-ph{background:#EDEDF0;border-radius:6px;animation:fx-pulse 1.3s ease-in-out infinite}

<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F5F7; display: flex; flex-direction: column; overflow: hidden; position: relative; font-family: 'Geist', -apple-system, 'Helvetica Neue', sans-serif; color: #1D1D1F"><button class="press" onClick="{{replay}}" style="position: absolute; top: 12px; left: 50%; transform: translateX(-50%); z-index: 40; height: 30px; padding: 0 12px; border: 0; border-radius: 99px; background: rgba(29,29,31,0.06); color: #6E6E73; font-family: 'Geist', -apple-system, 'Helvetica Neue', sans-serif; font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 6px; cursor: pointer"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>Replay</button><sc-if value="{{show}}" hint-placeholder-val="{{true}}"><div style="flex-grow: 1; padding: 90px 16px 0; display: flex; flex-direction: column; gap: 28px"><div style="position: relative"><div style="animation: fx-fadeout .2s ease 1100ms both"><div style="display: flex; flex-direction: column; align-items: center; gap: 12px; padding-top: 14px"><div class="fx-ph" style="width: 120px; height: 70px; border-radius: 14px; "></div><div class="fx-ph" style="width: 90px; height: 12px; border-radius: 6px; "></div></div></div><div style="position: absolute; left: 0; right: 0; top: 0; animation: fx-fadein .3s ease 1160ms both"><div style="display: flex; flex-direction: column; align-items: center; gap: 4px"><div style="display: flex; align-items: baseline; gap: 8px"><div style="font-family: 'Geist', -apple-system, 'Helvetica Neue', sans-serif; font-size: 88px; font-weight: 700; color: #1D1D1F; line-height: 1.12; letter-spacing: -0.022em; font-variant-numeric: tabular-nums;">8</div><div style="font-family: 'Geist', -apple-system, 'Helvetica Neue', sans-serif; font-size: 26px; font-weight: 600; color: #6E6E73; line-height: 1.35; letter-spacing: -0.012em; ">of 10</div></div><div style="font-family: 'Geist', -apple-system, 'Helvetica Neue', sans-serif; font-size: 15px; font-weight: 400; color: #6E6E73; line-height: 1.35; letter-spacing: 0; ">11 minutes</div></div></div></div><div style="background: #FFFFFF; border-radius: 14px; overflow: hidden"><div style="position: relative"><div style="animation: fx-fadeout .2s ease 1300ms both"><div style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 0.5px solid #E3E3E8"><div class="fx-ph" style="width: 24px; height: 24px; border-radius: 99px; "></div><div style="flex-grow: 1; display: flex; flex-direction: column; gap: 7px"><div class="fx-ph" style="width: 55%; height: 13px; border-radius: 6px; "></div><div class="fx-ph" style="width: 32%; height: 10px; border-radius: 6px; "></div></div><div class="fx-ph" style="width: 44px; height: 13px; border-radius: 6px; "></div></div><div style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; "><div class="fx-ph" style="width: 24px; height: 24px; border-radius: 99px; "></div><div style="flex-grow: 1; display: flex; flex-direction: column; gap: 7px"><div class="fx-ph" style="width: 55%; height: 13px; border-radius: 6px; "></div><div class="fx-ph" style="width: 32%; height: 10px; border-radius: 6px; "></div></div><div class="fx-ph" style="width: 44px; height: 13px; border-radius: 6px; "></div></div></div><div style="position: absolute; left: 0; right: 0; top: 0; animation: fx-fadein .3s ease 1360ms both"><div style=""><div style="display: flex; align-items: center; gap: 12px; padding-left: 16px"><div style="flex-grow: 1; min-width: 0; display: flex; align-items: center; gap: 8px; padding: 11px 16px 11px 0; min-height: 22px; border-bottom: 0.5px solid #E3E3E8;"><div style="flex-grow: 1; min-width: 0"><div style="font-family: 'Geist', -apple-system, 'Helvetica Neue', sans-serif; font-size: 17px; font-weight: 400; color: #1D1D1F; line-height: 1.35; letter-spacing: -0.012em; ">Word problems</div></div><div style="font-family: 'Geist', -apple-system, 'Helvetica Neue', sans-serif; font-size: 17px; font-weight: 400; color: #6E6E73; line-height: 1.35; letter-spacing: -0.012em; font-variant-numeric: tabular-nums;">2 of 3</div></div></div><div style="display: flex; align-items: center; gap: 12px; padding-left: 16px"><div style="flex-grow: 1; min-width: 0; display: flex; align-items: center; gap: 8px; padding: 11px 16px 11px 0; min-height: 22px; "><div style="flex-grow: 1; min-width: 0"><div style="font-family: 'Geist', -apple-system, 'Helvetica Neue', sans-serif; font-size: 17px; font-weight: 400; color: #1D1D1F; line-height: 1.35; letter-spacing: -0.012em; ">Factoring</div></div><div style="font-family: 'Geist', -apple-system, 'Helvetica Neue', sans-serif; font-size: 17px; font-weight: 400; color: #6E6E73; line-height: 1.35; letter-spacing: -0.012em; font-variant-numeric: tabular-nums;">0 of 1</div></div></div></div></div></div></div></div></sc-if></div>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>

function makeConf(n, x, y, seed, delay) {
  let s = seed; const rnd = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
  const cols = ['#0B7A68', '#0B7A68', '#4FB39E', '#F2B632', '#1D1D1F', '#9AD3C4'];
  const out = [];
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2 + rnd() * 0.5; const r = 90 + rnd() * 120;
    const dx = Math.round(Math.cos(a) * r); const dy = Math.round(Math.sin(a) * r * 0.8 + 90 + rnd() * 60);
    out.push({ style: 'left:' + x + 'px;top:' + y + 'px;--dx:' + dx + 'px;--dy:' + dy + 'px;--r:' + Math.round(rnd() * 720 - 360) + 'deg;background:' + cols[i % cols.length] + ';animation-delay:' + (delay + Math.round(rnd() * 80)) + 'ms;width:' + (6 + Math.round(rnd() * 4)) + 'px' });
  }
  return out;
}

class Base extends DCLogic {
  later(ms, fn) { this.tos.push(setTimeout(fn, ms)); }

  count(key, target, dur, delay) {
    const t0 = performance.now();
    const tick = (now) => {
      const p = Math.max(0, Math.min(1, (now - t0 - delay) / dur));
      const e = 1 - Math.pow(1 - p, 3);
      this.setState({ [key]: Math.round(e * target) });
      if (p < 1) this.rafs.push(requestAnimationFrame(tick));
    };
    this.rafs.push(requestAnimationFrame(tick));
  }
  stopAll() { (this.rafs || []).forEach(cancelAnimationFrame); this.rafs = []; (this.tos || []).forEach(clearTimeout); this.tos = []; }
  componentWillUnmount() { this.stopAll(); }
  replay() { this.stopAll(); this.setState({ show: false }); this.tos.push(setTimeout(() => { this.setState({ show: true }); this.start(); }, 60)); }
  componentDidMount() { this.start(); }

}
class Component extends Base {
constructor(p) { super(p); this.state = { show: true }; this.rafs = []; this.tos = []; }
start() { this.later(3800, () => this.replay()); }
renderVals() { return { show: this.state.show, replay: () => this.replay() }; }
}

</script>
