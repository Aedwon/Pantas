name: pantas
description: Gamified Philippine exam reviewer with spaced repetition.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management & routing
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^14.0.0

  # Models / serialization
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Networking
  dio: ^5.7.0

  # Local persistence (used in Plan 2 — declared here to lock versions)
  drift: ^2.20.0
  sqlite3: ^2.4.0
  sqlcipher_flutter_libs: ^0.6.4
  path_provider: ^2.1.4
  path: ^1.9.0

  # Firebase (initialized here; deeper integration in Plans 2-4)
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_analytics: ^11.3.3
  firebase_crashlytics: ^4.1.3
  firebase_remote_config: ^5.1.3
  firebase_messaging: ^15.1.3
  firebase_app_check: ^0.3.1+5
  cloud_functions: ^5.1.3
  firebase_storage: ^12.3.2

  # Auth providers
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.2

  # IAP via RevenueCat
  purchases_flutter: ^8.0.0

  # Secure storage (Keychain / Keystore)
  flutter_secure_storage: ^9.2.2

  # Networking / caching
  cached_network_image: ^3.3.1

  # Util
  collection: ^1.19.0
  meta: ^1.15.0
  intl: ^0.20.0
  timezone: ^0.9.4

  # UI / fonts
  qr_flutter: ^4.1.0
  flutter_math_fork: ^0.7.2
  flutter_local_notifications: ^17.2.4
  app_settings: ^5.1.1
  url_launcher: ^6.3.0

  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # Lint
  very_good_analysis: ^6.0.0

  # Codegen
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.3
  drift_dev: ^2.20.0

  # Testing
  mocktail: ^1.0.4

  # Content tooling
  yaml: ^3.1.2

  crypto: any
flutter:
  uses-material-design: true
  generate: true   # enables ARB-driven l10n in Plan 2+
  assets:
    - assets/seed/content.db
  fonts:
    - family: SourceSans3
      fonts:
        - asset: assets/fonts/SourceSans3-Regular.ttf
        - asset: assets/fonts/SourceSans3-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SourceSans3-Bold.ttf
          weight: 700
