name: pantas
description: Gamified Philippine exam reviewer with spaced repetition.
publish_to: 'none'
version: 0.1.0+1

hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management & routing
  flutter_riverpod: ^2.5.1
  go_router: ^17.0.0

  # Models / serialization
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # Networking
  dio: ^5.11.0

  # Local persistence (used in Plan 2 — declared here to lock versions)
  drift: ^2.34.0
  sqlite3: ^3.5.0
  path_provider: ^2.1.6
  path: ^1.9.0

  # Firebase (initialized here; deeper integration in Plans 2-4)
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  firebase_analytics: ^12.0.0
  firebase_crashlytics: ^5.0.0
  firebase_remote_config: ^6.0.0
  firebase_messaging: ^16.0.0
  firebase_app_check: ^0.4.0
  cloud_functions: ^6.0.0
  firebase_storage: ^13.0.0

  # Auth providers
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.0.0

  # IAP via RevenueCat
  purchases_flutter: ^10.8.0

  # Secure storage (Keychain / Keystore)
  flutter_secure_storage: ^10.3.1

  # Networking / caching
  cached_network_image: ^3.3.1

  # Util
  collection: ^1.19.0
  meta: ^1.16.0
  intl: ^0.20.0
  timezone: ^0.11.0

  # UI / fonts
  qr_flutter: ^4.1.0
  flutter_math_fork: ^0.7.2
  flutter_local_notifications: ^22.0.0
  app_settings: ^8.0.0
  url_launcher: ^6.3.0

  uuid: ^4.6.0
  in_app_review: ^2.0.12
  cryptography: 2.9.0
  flutter_svg: ^2.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # Lint
  very_good_analysis: ^6.0.0

  # Codegen
  build_runner: ^2.4.13
  freezed: ^3.2.0
  json_serializable: ^6.8.0
  drift_dev: ^2.34.0

  # Testing
  mocktail: ^1.0.4

  # Content tooling
  yaml: ^3.1.2

  crypto: any
flutter:
  uses-material-design: true
  generate: true   # enables ARB-driven l10n in Plan 2+
  assets:
    - assets/fonts/OFL-Geist.txt
    - assets/fonts/OFL-SourceSerif4.txt
    - assets/fonts/phosphor/LICENSE
    - content/exams/catalog.json
    - assets/seed/content.db
    - assets/seed/lesson_links.json
    - assets/seed/content.manifest.json
    - assets/seed/content.manifest.sig
  fonts:
    - family: SourceSans3
      fonts:
        - asset: assets/fonts/SourceSans3-Regular.ttf
        - asset: assets/fonts/SourceSans3-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SourceSans3-Bold.ttf
          weight: 700
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-Regular.ttf
          weight: 400
        - asset: assets/fonts/Geist-Medium.ttf
          weight: 500
        - asset: assets/fonts/Geist-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Geist-Bold.ttf
          weight: 700
    - family: SourceSerif4
      fonts:
        - asset: assets/fonts/SourceSerif4-Regular.ttf
          weight: 400
        - asset: assets/fonts/SourceSerif4-Semibold.ttf
          weight: 600
    - family: Phosphor
      fonts:
        - asset: assets/fonts/phosphor/Phosphor.ttf
          weight: 400
