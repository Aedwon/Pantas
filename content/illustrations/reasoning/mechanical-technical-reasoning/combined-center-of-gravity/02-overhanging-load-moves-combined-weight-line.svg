<text x="256" y="113" fill="#050505" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="600"><tspan font-family="KaTeX_Main, serif" font-weight="400">1.1 m</tspan></text>
<line x1="22" y1="168" x2="326" y2="168" fill="none" stroke="#020202" stroke-width="2" stroke-linecap="round"/>
