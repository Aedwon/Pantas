<text x="257.5" y="64" fill="#010101" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="600"><tspan font-family="KaTeX_Main, serif" font-weight="400">120 kg</tspan></text>
<circle cx="222.5" cy="86" r="3.5" fill="#050505" stroke="none" stroke-width="2"/>
<line x1="222.5" y1="91" x2="222.5" y2="166" fill="none" stroke="#050505" stroke-width="2.5" stroke-linecap="round"/>
