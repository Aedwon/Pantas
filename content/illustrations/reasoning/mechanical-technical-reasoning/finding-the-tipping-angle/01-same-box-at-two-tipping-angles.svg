<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 255" width="360" height="255">
<title>Tipping angles of the same box in two positions</title>
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#030303"/><stop offset="1" stop-color="#030303"/></linearGradient><radialGradient id="shape" cx="0.4" cy="0.3" r="0.8"><stop offset="0" stop-color="#050505" stop-opacity="0.22"/><stop offset="1" stop-color="#050505" stop-opacity="0.12"/></radialGradient></defs>
<rect width="360" height="255" rx="14" fill="url(#bg)"/>
<polygon points="145,186 96.7,161.8 145.1,65.3 193.4,89.4" fill="url(#shape)" stroke="#020202" stroke-width="2" stroke-linejoin="round"/>
<line x1="30" y1="186" x2="164" y2="186" fill="none" stroke="#020202" stroke-width="2" stroke-linecap="round"/>
<circle cx="145" cy="186" r="3.5" fill="#010101" stroke="none" stroke-width="2"/>
<path d="M115 186 A30 30 0 0 1 118.2 172.6" fill="none" stroke="#050505" stroke-width="2.5" stroke-linejoin="round"/>
<text x="93" y="179" fill="#050505" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="600"><tspan font-family="KaTeX_Main, serif" font-weight="400">26.6°</tspan></text>
<text x="96" y="213" fill="#010101" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="600"><tspan font-family="KaTeX_Main, serif" font-weight="400">0.4 m × 0.8 m</tspan></text>
<polygon points="290,186 241.6,89.4 289.9,65.3 338.3,161.8" fill="url(#shape)" stroke="#020202" stroke-width="2" stroke-linejoin="round"/>
<line x1="175" y1="186" x2="309" y2="186" fill="none" stroke="#020202" stroke-width="2" stroke-linecap="round"/>
<circle cx="290" cy="186" r="3.5" fill="#010101" stroke="none" stroke-width="2"/>
<path d="M260 186 A30 30 0 0 1 276.6 159.2" fill="none" stroke="#050505" stroke-width="2.5" stroke-linejoin="round"/>
<text x="238" y="179" fill="#050505" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="600"><tspan font-family="KaTeX_Main, serif" font-weight="400">63.4°</tspan></text>
<text x="241" y="213" fill="#010101" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="600"><tspan font-family="KaTeX_Main, serif" font-weight="400">0.8 m × 0.4 m</tspan></text>
</svg>
