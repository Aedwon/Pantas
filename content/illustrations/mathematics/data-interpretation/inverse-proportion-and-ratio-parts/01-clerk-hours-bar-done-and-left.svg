<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 156" width="360" height="156">
<title>One bar of 120 clerk-hours: the first 40 done by 8 clerks in 5 hours, the last 80 left, shared by 6 clerks for 13 1/3 hours</title>
<rect width="360" height="156" rx="14" fill="#030303"/>
<text x="180" y="28" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="700" fill="#010101"><tspan x="180">Total 8 × 15 = 120 clerk-hours</tspan></text>
<path d="M24 42 V37 H336 V42" fill="none" stroke="#020202" stroke-width="1.2" stroke-opacity="0.7"/>
<rect x="24" y="46" width="104" height="40" fill="#050505" fill-opacity="0.45" stroke="#020202" stroke-width="1.2" stroke-opacity="0.7"/>
<rect x="128" y="46" width="208" height="40" fill="#010101" fill-opacity="0.08" stroke="#020202" stroke-width="1.2" stroke-opacity="0.7"/>
<text x="76" y="71" text-anchor="middle" font-family="Geist, sans-serif" font-size="12" font-weight="600" fill="#010101"><tspan x="76">Done 8 × 5 = 40</tspan></text>
<text x="232" y="71" text-anchor="middle" font-family="Geist, sans-serif" font-size="12" font-weight="600" fill="#010101"><tspan x="232">Left 120 - 40 = 80</tspan></text>
<path d="M128 94 V99 H336 V94" fill="none" stroke="#020202" stroke-width="1.2" stroke-opacity="0.7"/>
<text x="232" y="119" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="700" fill="#010101"><tspan x="232">80 / 6 = 13 1/3 hours</tspan></text>
<text x="232" y="137" text-anchor="middle" font-family="Geist, sans-serif" font-size="12" font-weight="400" fill="#020202"><tspan x="232">for 6 clerks</tspan></text>
</svg>
