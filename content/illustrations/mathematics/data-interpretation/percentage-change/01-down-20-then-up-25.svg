<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 160" width="360" height="160">
<title>A value falls from 100 to 80, a change of -20 or -20% of 100, then rises back to 100, a change of +20 or +25% of 80</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#030303"/><stop offset="1" stop-color="#030303"/></linearGradient>
</defs>
<rect width="360" height="160" rx="14" fill="url(#bg)"/>
<rect x="20" y="62" width="60" height="36" rx="8" fill="#010101" fill-opacity="0.08" stroke="#020202" stroke-width="1.2" stroke-opacity="0.7"/>
<rect x="150" y="62" width="60" height="36" rx="8" fill="#050505" fill-opacity="0.3" stroke="#020202" stroke-width="1.2" stroke-opacity="0.7"/>
<rect x="280" y="62" width="60" height="36" rx="8" fill="#010101" fill-opacity="0.08" stroke="#020202" stroke-width="1.2" stroke-opacity="0.7"/>
<text x="50" y="87" text-anchor="middle" font-family="Geist, sans-serif" font-size="20" font-weight="700" fill="#010101"><tspan x="50">100</tspan></text>
<text x="180" y="87" text-anchor="middle" font-family="Geist, sans-serif" font-size="20" font-weight="700" fill="#010101"><tspan x="180">80</tspan></text>
<text x="310" y="87" text-anchor="middle" font-family="Geist, sans-serif" font-size="20" font-weight="700" fill="#010101"><tspan x="310">100</tspan></text>
<path d="M62 62 Q115 20 168 62" fill="none" stroke="#020202" stroke-width="1.5" stroke-opacity="0.7"/>
<polygon points="168,62 157.1,59.7 163.3,51.9" fill="#020202" fill-opacity="0.7"/>
<path d="M192 98 Q245 140 298 98" fill="none" stroke="#020202" stroke-width="1.5" stroke-opacity="0.7"/>
<polygon points="298,98 293.3,108.1 287.1,100.3" fill="#020202" fill-opacity="0.7"/>
<text x="115" y="28" text-anchor="middle" font-family="Geist, sans-serif" font-size="12" font-weight="600" fill="#010101"><tspan x="115">-20 (-20% of 100)</tspan></text>
<text x="245" y="152" text-anchor="middle" font-family="Geist, sans-serif" font-size="12" font-weight="600" fill="#010101"><tspan x="245">+20 (+25% of 80)</tspan></text>
</svg>
