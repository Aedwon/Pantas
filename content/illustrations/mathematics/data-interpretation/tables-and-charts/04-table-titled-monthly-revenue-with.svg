<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" width="360" height="200">
<title>Table of monthly revenue for Months 1 to 3 with the three values highlighted</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#030303"/><stop offset="1" stop-color="#030303"/></linearGradient>
<radialGradient id="teal" cx="0.4" cy="0.3" r="0.8"><stop offset="0" stop-color="#050505" stop-opacity="0.22"/><stop offset="1" stop-color="#050505" stop-opacity="0.22"/></radialGradient>
<radialGradient id="sky" cx="0.4" cy="0.3" r="0.85"><stop offset="0" stop-color="#010101" stop-opacity="0.12"/><stop offset="1" stop-color="#010101" stop-opacity="0.12"/></radialGradient>
<radialGradient id="warm" cx="0.4" cy="0.3" r="0.9"><stop offset="0" stop-color="#050505" stop-opacity="0.45"/><stop offset="1" stop-color="#050505" stop-opacity="0.45"/></radialGradient>
</defs>
<rect width="360" height="200" rx="14" fill="url(#bg)"/>
<text x="180" y="44" text-anchor="middle" font-family="Geist, sans-serif" font-size="17" font-weight="700" fill="#010101"><tspan x="180">Monthly Revenue</tspan></text>
<rect x="16" y="70" width="328" height="92" rx="8" fill="#010101" fill-opacity="0.06"/>
<path d="M16 78 Q16 70 24 70 H336 Q344 70 344 78 V110 H16 Z" fill="#010101" fill-opacity="0.2"/>
<line x1="16" y1="110" x2="344" y2="110" stroke="#020202" stroke-width="1.5" stroke-linecap="butt" fill="none" stroke-opacity="0.4"/>
<line x1="124" y1="70" x2="124" y2="162" stroke="#020202" stroke-width="1.5" stroke-linecap="butt" fill="none" stroke-opacity="0.4"/>
<rect x="124" y="110" width="220" height="52" rx="6" fill="#050505" fill-opacity="0.28" stroke="#050505" stroke-width="2"/>
<text x="160.7" y="95" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="700" fill="#010101"><tspan x="160.7">Month 1</tspan></text>
<text x="234" y="95" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="700" fill="#010101"><tspan x="234">Month 2</tspan></text>
<text x="307.3" y="95" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="700" fill="#010101"><tspan x="307.3">Month 3</tspan></text>
<text x="70" y="131" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#010101"><tspan x="70">Revenue,</tspan><tspan x="70" dy="1.2em">pesos</tspan></text>
<text x="160.7" y="141" text-anchor="middle" font-family="Geist, sans-serif" font-size="15" font-weight="700" fill="#010101"><tspan x="160.7">40,000</tspan></text>
<text x="234" y="141" text-anchor="middle" font-family="Geist, sans-serif" font-size="15" font-weight="700" fill="#010101"><tspan x="234">50,000</tspan></text>
<text x="307.3" y="141" text-anchor="middle" font-family="Geist, sans-serif" font-size="15" font-weight="700" fill="#010101"><tspan x="307.3">60,000</tspan></text>
</svg>
