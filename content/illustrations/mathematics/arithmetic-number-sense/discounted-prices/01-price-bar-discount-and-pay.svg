<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 152" width="360" height="152">
<title>Bar for a listed price of Php 800 split into a 25% discount of Php 200 and 75% paid, Php 600</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#030303"/><stop offset="1" stop-color="#030303"/></linearGradient>
</defs>
<rect width="360" height="152" rx="14" fill="url(#bg)"/>
<text x="180" y="32" text-anchor="middle" font-family="Geist, sans-serif" font-size="16" font-weight="700" fill="#010101"><tspan x="180">Php 800 = 100%</tspan></text>
<path d="M20 62 V54 H340 V62" fill="none" stroke="#020202" stroke-width="1.5" stroke-opacity="0.7"/>
<path d="M20 80 Q20 72 28 72 H100 V136 H28 Q20 136 20 128 Z" fill="#050505" fill-opacity="0.45"/>
<path d="M100 72 H332 Q340 72 340 80 V128 Q340 136 332 136 H100 Z" fill="#010101" fill-opacity="0.06"/>
<rect x="20" y="72" width="320" height="64" rx="8" fill="none" stroke="#020202" stroke-width="1.5" stroke-opacity="0.7"/>
<line x1="100" y1="72" x2="100" y2="136" stroke="#020202" stroke-width="1.5" stroke-opacity="0.7"/>
<text x="60" y="94" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="700" fill="#010101"><tspan x="60">25%</tspan></text>
<text x="60" y="110" text-anchor="middle" font-family="Geist, sans-serif" font-size="12" font-weight="400" fill="#010101"><tspan x="60">discount</tspan></text>
<text x="60" y="126" text-anchor="middle" font-family="Geist, sans-serif" font-size="12" font-weight="600" fill="#010101"><tspan x="60">Php 200</tspan></text>
<text x="220" y="94" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="700" fill="#010101"><tspan x="220">75%</tspan></text>
<text x="220" y="110" text-anchor="middle" font-family="Geist, sans-serif" font-size="12" font-weight="400" fill="#010101"><tspan x="220">you pay</tspan></text>
<text x="220" y="126" text-anchor="middle" font-family="Geist, sans-serif" font-size="12" font-weight="600" fill="#010101"><tspan x="220">Php 600</tspan></text>
</svg>
