<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 210" width="360" height="210">
<title>Prime tiles of 48 and 180 with the shared tiles 2, 2, 3 outlined, giving GCF 12</title>
<rect width="360" height="210" rx="14" fill="#030303"/>
<text x="20" y="22" text-anchor="start" font-family="Geist, sans-serif" font-size="15" font-weight="600" fill="#010101">48 = 2</text>
<text x="67" y="16" text-anchor="start" font-family="Geist, sans-serif" font-size="12" font-weight="600" fill="#010101">4</text>
<text x="78" y="22" text-anchor="start" font-family="Geist, sans-serif" font-size="15" font-weight="600" fill="#010101">× 3</text>
<rect x="20" y="30" width="40" height="40" rx="6" fill="#050505" fill-opacity="0.22" stroke="#050505" stroke-width="3"/>
<rect x="66" y="30" width="40" height="40" rx="6" fill="#050505" fill-opacity="0.22" stroke="#050505" stroke-width="3"/>
<rect x="112" y="30" width="40" height="40" rx="6" fill="#050505" fill-opacity="0.22" stroke="#050505" stroke-width="3"/>
<rect x="176" y="30" width="40" height="40" rx="6" fill="#010101" fill-opacity="0.08" stroke="#020202" stroke-width="1.2" stroke-opacity="0.5"/>
<rect x="222" y="30" width="40" height="40" rx="6" fill="#010101" fill-opacity="0.08" stroke="#020202" stroke-width="1.2" stroke-opacity="0.5"/>
<text x="40" y="57" text-anchor="middle" font-family="Geist, sans-serif" font-size="18" font-weight="700" fill="#010101">2</text>
<text x="86" y="57" text-anchor="middle" font-family="Geist, sans-serif" font-size="18" font-weight="700" fill="#010101">2</text>
<text x="132" y="57" text-anchor="middle" font-family="Geist, sans-serif" font-size="18" font-weight="700" fill="#010101">3</text>
<text x="196" y="57" text-anchor="middle" font-family="Geist, sans-serif" font-size="18" font-weight="700" fill="#010101">2</text>
<text x="242" y="57" text-anchor="middle" font-family="Geist, sans-serif" font-size="18" font-weight="700" fill="#010101">2</text>
<text x="20" y="100" text-anchor="start" font-family="Geist, sans-serif" font-size="15" font-weight="600" fill="#010101">180 = 2</text>
<text x="76" y="94" text-anchor="start" font-family="Geist, sans-serif" font-size="12" font-weight="600" fill="#010101">2</text>
<text x="87" y="100" text-anchor="start" font-family="Geist, sans-serif" font-size="15" font-weight="600" fill="#010101">× 3</text>
<text x="111" y="94" text-anchor="start" font-family="Geist, sans-serif" font-size="12" font-weight="600" fill="#010101">2</text>
<text x="122" y="100" text-anchor="start" font-family="Geist, sans-serif" font-size="15" font-weight="600" fill="#010101">× 5</text>
<rect x="20" y="108" width="40" height="40" rx="6" fill="#050505" fill-opacity="0.22" stroke="#050505" stroke-width="3"/>
<rect x="66" y="108" width="40" height="40" rx="6" fill="#050505" fill-opacity="0.22" stroke="#050505" stroke-width="3"/>
<rect x="112" y="108" width="40" height="40" rx="6" fill="#050505" fill-opacity="0.22" stroke="#050505" stroke-width="3"/>
<rect x="176" y="108" width="40" height="40" rx="6" fill="#010101" fill-opacity="0.08" stroke="#020202" stroke-width="1.2" stroke-opacity="0.5"/>
<rect x="222" y="108" width="40" height="40" rx="6" fill="#010101" fill-opacity="0.08" stroke="#020202" stroke-width="1.2" stroke-opacity="0.5"/>
<text x="40" y="135" text-anchor="middle" font-family="Geist, sans-serif" font-size="18" font-weight="700" fill="#010101">2</text>
<text x="86" y="135" text-anchor="middle" font-family="Geist, sans-serif" font-size="18" font-weight="700" fill="#010101">2</text>
<text x="132" y="135" text-anchor="middle" font-family="Geist, sans-serif" font-size="18" font-weight="700" fill="#010101">3</text>
<text x="196" y="135" text-anchor="middle" font-family="Geist, sans-serif" font-size="18" font-weight="700" fill="#010101">3</text>
<text x="242" y="135" text-anchor="middle" font-family="Geist, sans-serif" font-size="18" font-weight="700" fill="#010101">5</text>
<text x="242" y="168" text-anchor="middle" font-family="Geist, sans-serif" font-size="12" font-weight="400" fill="#020202">only in 180</text>
<line x1="16" y1="176" x2="344" y2="176" stroke="#040404" stroke-width="1.5" fill="none"/>
<text x="116.5" y="200" text-anchor="start" font-family="Geist, sans-serif" font-size="15" font-weight="700" fill="#010101">GCF = 2</text>
<text x="174.5" y="194" text-anchor="start" font-family="Geist, sans-serif" font-size="12" font-weight="700" fill="#010101">2</text>
<text x="186" y="200" text-anchor="start" font-family="Geist, sans-serif" font-size="15" font-weight="700" fill="#010101">× 3 = 12</text>
</svg>
