<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 224" width="360" height="224">
<title>Two bars on a base of 200: 120% of 200 is 240, while 120% more than 200 is the 200 plus an added 240, a total of 440 (220%)</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#030303"/><stop offset="1" stop-color="#030303"/></linearGradient>
</defs>
<rect width="360" height="224" rx="14" fill="url(#bg)"/>
<text x="20" y="26" text-anchor="start" font-family="Geist, sans-serif" font-size="16" font-weight="700" fill="#010101"><tspan x="20">120% of 200</tspan></text>
<rect x="20" y="34" width="145.5" height="38" fill="#010101" fill-opacity="0.06"/>
<rect x="165.5" y="34" width="29" height="38" fill="#050505" fill-opacity="0.45"/>
<rect x="20" y="34" width="174.5" height="38" fill="none" stroke="#020202" stroke-width="1.5" stroke-opacity="0.7"/>
<line x1="165.5" y1="34" x2="165.5" y2="72" stroke="#020202" stroke-width="1.5" stroke-opacity="0.7"/>
<text x="92.7" y="58" text-anchor="middle" font-family="Geist, sans-serif" font-size="12" font-weight="600" fill="#010101"><tspan x="92.7">200 (100%)</tspan></text>
<path d="M20 80 V87 H194.5 V80" fill="none" stroke="#020202" stroke-width="1.5" stroke-opacity="0.7"/>
<text x="107.2" y="106" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="700" fill="#010101"><tspan x="107.2">240 (120%)</tspan></text>
<text x="20" y="138" text-anchor="start" font-family="Geist, sans-serif" font-size="16" font-weight="700" fill="#010101"><tspan x="20">120% more than 200</tspan></text>
<rect x="20" y="146" width="145.5" height="38" fill="#010101" fill-opacity="0.06"/>
<rect x="165.5" y="146" width="174.5" height="38" fill="#050505" fill-opacity="0.45"/>
<rect x="20" y="146" width="320" height="38" fill="none" stroke="#020202" stroke-width="1.5" stroke-opacity="0.7"/>
<line x1="165.5" y1="146" x2="165.5" y2="184" stroke="#020202" stroke-width="1.5" stroke-opacity="0.7"/>
<text x="92.7" y="170" text-anchor="middle" font-family="Geist, sans-serif" font-size="12" font-weight="600" fill="#010101"><tspan x="92.7">200 (100%)</tspan></text>
<text x="252.7" y="170" text-anchor="middle" font-family="Geist, sans-serif" font-size="12" font-weight="600" fill="#010101"><tspan x="252.7">240 (120%)</tspan></text>
<path d="M20 192 V199 H340 V192" fill="none" stroke="#020202" stroke-width="1.5" stroke-opacity="0.7"/>
<text x="180" y="218" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="700" fill="#010101"><tspan x="180">440 (220%)</tspan></text>
</svg>
