<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 216" width="360" height="216">
<title>The powers of i in a loop: i to the 1 is i, i squared is -1, i cubed is -i, i to the 4 is 1, then back to i</title>
<rect width="360" height="216" rx="14" fill="#030303"/>
<rect x="30" y="30" width="130" height="56" rx="10" fill="#010101" fill-opacity="0.08" stroke="#020202" stroke-width="1.2" stroke-opacity="0.7"/>
<rect x="200" y="30" width="130" height="56" rx="10" fill="#010101" fill-opacity="0.08" stroke="#020202" stroke-width="1.2" stroke-opacity="0.7"/>
<rect x="200" y="130" width="130" height="56" rx="10" fill="#010101" fill-opacity="0.08" stroke="#020202" stroke-width="1.2" stroke-opacity="0.7"/>
<rect x="30" y="130" width="130" height="56" rx="10" fill="#050505" fill-opacity="0.22" stroke="#050505" stroke-width="2"/>
<text x="76" y="55" text-anchor="start" font-family="Geist, sans-serif" font-size="16" font-weight="700" fill="#010101">i</text>
<text x="83" y="49" text-anchor="start" font-family="Geist, sans-serif" font-size="12" font-weight="700" fill="#010101">1</text>
<text x="94" y="55" text-anchor="start" font-family="Geist, sans-serif" font-size="16" font-weight="700" fill="#010101">= i</text>
<text x="95" y="75" text-anchor="middle" font-family="Geist, sans-serif" font-size="13" font-weight="400" fill="#020202">remainder 1</text>
<text x="239" y="55" text-anchor="start" font-family="Geist, sans-serif" font-size="16" font-weight="700" fill="#010101">i</text>
<text x="246" y="49" text-anchor="start" font-family="Geist, sans-serif" font-size="12" font-weight="700" fill="#010101">2</text>
<text x="257" y="55" text-anchor="start" font-family="Geist, sans-serif" font-size="16" font-weight="700" fill="#010101">= −1</text>
<text x="265" y="75" text-anchor="middle" font-family="Geist, sans-serif" font-size="13" font-weight="400" fill="#020202">remainder 2</text>
<text x="241" y="155" text-anchor="start" font-family="Geist, sans-serif" font-size="16" font-weight="700" fill="#010101">i</text>
<text x="248" y="149" text-anchor="start" font-family="Geist, sans-serif" font-size="12" font-weight="700" fill="#010101">3</text>
<text x="259" y="155" text-anchor="start" font-family="Geist, sans-serif" font-size="16" font-weight="700" fill="#010101">= −i</text>
<text x="265" y="175" text-anchor="middle" font-family="Geist, sans-serif" font-size="13" font-weight="400" fill="#020202">remainder 3</text>
<text x="74" y="155" text-anchor="start" font-family="Geist, sans-serif" font-size="16" font-weight="700" fill="#010101">i</text>
<text x="81" y="149" text-anchor="start" font-family="Geist, sans-serif" font-size="12" font-weight="700" fill="#010101">4</text>
<text x="92" y="155" text-anchor="start" font-family="Geist, sans-serif" font-size="16" font-weight="700" fill="#010101">= 1</text>
<text x="95" y="175" text-anchor="middle" font-family="Geist, sans-serif" font-size="13" font-weight="400" fill="#020202">remainder 0</text>
<line x1="164" y1="58" x2="190" y2="58" stroke="#050505" stroke-width="2.5" fill="none"/>
<polygon points="198,58 188,52 188,64" fill="#050505"/>
<line x1="265" y1="90" x2="265" y2="116" stroke="#050505" stroke-width="2.5" fill="none"/>
<polygon points="265,128 259,118 271,118" fill="#050505"/>
<line x1="196" y1="158" x2="170" y2="158" stroke="#050505" stroke-width="2.5" fill="none"/>
<polygon points="162,158 172,152 172,164" fill="#050505"/>
<line x1="95" y1="126" x2="95" y2="100" stroke="#050505" stroke-width="2.5" fill="none"/>
<polygon points="95,88 89,98 101,98" fill="#050505"/>
</svg>
