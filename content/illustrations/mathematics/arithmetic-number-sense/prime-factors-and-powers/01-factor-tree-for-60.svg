<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280" width="360" height="280">
<title>Factor tree for 60 ending in the primes 2, 2, 3 and 5</title>
<rect width="360" height="280" rx="14" fill="#030303"/>
<line x1="172" y1="44" x2="128" y2="74" stroke="#020202" stroke-width="1.5" fill="none"/>
<line x1="188" y1="44" x2="232" y2="74" stroke="#020202" stroke-width="1.5" fill="none"/>
<line x1="232" y1="104" x2="196" y2="134" stroke="#020202" stroke-width="1.5" fill="none"/>
<line x1="248" y1="104" x2="284" y2="134" stroke="#020202" stroke-width="1.5" fill="none"/>
<line x1="284" y1="164" x2="256" y2="194" stroke="#020202" stroke-width="1.5" fill="none"/>
<line x1="296" y1="164" x2="324" y2="194" stroke="#020202" stroke-width="1.5" fill="none"/>
<text x="180" y="36" text-anchor="middle" font-family="Geist, sans-serif" font-size="20" font-weight="700" fill="#010101">60</text>
<text x="240" y="96" text-anchor="middle" font-family="Geist, sans-serif" font-size="20" font-weight="700" fill="#010101">30</text>
<text x="290" y="156" text-anchor="middle" font-family="Geist, sans-serif" font-size="20" font-weight="700" fill="#010101">15</text>
<circle cx="120" cy="90" r="19" fill="#050505" fill-opacity="0.22" stroke="#050505" stroke-width="2.5"/>
<circle cx="190" cy="150" r="19" fill="#050505" fill-opacity="0.22" stroke="#050505" stroke-width="2.5"/>
<circle cx="250" cy="210" r="19" fill="#050505" fill-opacity="0.22" stroke="#050505" stroke-width="2.5"/>
<circle cx="330" cy="210" r="19" fill="#050505" fill-opacity="0.22" stroke="#050505" stroke-width="2.5"/>
<text x="120" y="97" text-anchor="middle" font-family="Geist, sans-serif" font-size="20" font-weight="700" fill="#010101">2</text>
<text x="190" y="157" text-anchor="middle" font-family="Geist, sans-serif" font-size="20" font-weight="700" fill="#010101">2</text>
<text x="250" y="217" text-anchor="middle" font-family="Geist, sans-serif" font-size="20" font-weight="700" fill="#010101">3</text>
<text x="330" y="217" text-anchor="middle" font-family="Geist, sans-serif" font-size="20" font-weight="700" fill="#010101">5</text>
