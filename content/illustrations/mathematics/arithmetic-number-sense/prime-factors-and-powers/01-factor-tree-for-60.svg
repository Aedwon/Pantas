<text x="123.5" y="266" text-anchor="start" font-family="Geist, sans-serif" font-size="16" font-weight="700" fill="#010101">60 = 2</text>
<text x="173.5" y="260" text-anchor="start" font-family="Geist, sans-serif" font-size="12" font-weight="700" fill="#010101">2</text>
<text x="185" y="266" text-anchor="start" font-family="Geist, sans-serif" font-size="16" font-weight="700" fill="#010101">× 3 × 5</text>
</svg>
