<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" width="360" height="220">
<title>Prime tiles for 4 and 6 share one 2, so testing both only proves divisibility by 12</title>
<rect width="360" height="220" rx="14" fill="#030303"/>
<text x="40" y="52" text-anchor="end" font-family="Geist, sans-serif" font-size="18" font-weight="700" fill="#010101">4 =</text>
<text x="40" y="122" text-anchor="end" font-family="Geist, sans-serif" font-size="18" font-weight="700" fill="#010101">6 =</text>
<rect x="56" y="24" width="48" height="40" rx="6" fill="#050505" fill-opacity="0.22" stroke="#050505" stroke-width="3"/>
<rect x="112" y="24" width="48" height="40" rx="6" fill="#010101" fill-opacity="0.08" stroke="#020202" stroke-width="1.2" stroke-opacity="0.5"/>
<rect x="56" y="94" width="48" height="40" rx="6" fill="#050505" fill-opacity="0.22" stroke="#050505" stroke-width="3"/>
<rect x="112" y="94" width="48" height="40" rx="6" fill="#010101" fill-opacity="0.08" stroke="#020202" stroke-width="1.2" stroke-opacity="0.5"/>
<line x1="80" y1="66" x2="80" y2="92" stroke="#050505" stroke-width="2" stroke-dasharray="4 3" fill="none"/>
<text x="80" y="52" text-anchor="middle" font-family="Geist, sans-serif" font-size="18" font-weight="700" fill="#010101">2</text>
<text x="136" y="52" text-anchor="middle" font-family="Geist, sans-serif" font-size="18" font-weight="700" fill="#010101">2</text>
<text x="80" y="122" text-anchor="middle" font-family="Geist, sans-serif" font-size="18" font-weight="700" fill="#010101">2</text>
<text x="136" y="122" text-anchor="middle" font-family="Geist, sans-serif" font-size="18" font-weight="700" fill="#010101">3</text>
<line x1="16" y1="152" x2="344" y2="152" stroke="#040404" stroke-width="1.5" fill="none"/>
<text x="180" y="180" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#010101">Tiles needed for both: 2 × 2 × 3 = 12</text>
<text x="180" y="204" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="400" fill="#020202">24 needs 2 × 2 × 2 × 3</text>
</svg>
