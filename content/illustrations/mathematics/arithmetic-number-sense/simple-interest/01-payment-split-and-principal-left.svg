<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 212" width="360" height="212">
<title>A Php 4,000 payment split into Php 1,080 interest and Php 2,920 for the principal, which takes a Php 18,000 principal down to Php 15,080</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#030303"/><stop offset="1" stop-color="#030303"/></linearGradient>
</defs>
<rect width="360" height="212" rx="14" fill="url(#bg)"/>
<text x="180" y="28" text-anchor="middle" font-family="Geist, sans-serif" font-size="16" font-weight="700" fill="#010101"><tspan x="180">Payment Php 4,000</tspan></text>
<path d="M20 44 V37 H340 V44" fill="none" stroke="#020202" stroke-width="1.5" stroke-opacity="0.7"/>
<path d="M20 56 Q20 48 28 48 H106.4 V96 H28 Q20 96 20 88 Z" fill="#010101" fill-opacity="0.06"/>
<path d="M106.4 48 H332 Q340 48 340 56 V88 Q340 96 332 96 H106.4 Z" fill="#050505" fill-opacity="0.45"/>
<rect x="20" y="48" width="320" height="48" rx="8" fill="none" stroke="#020202" stroke-width="1.5" stroke-opacity="0.7"/>
<line x1="106.4" y1="48" x2="106.4" y2="96" stroke="#020202" stroke-width="1.5" stroke-opacity="0.7"/>
<text x="63" y="68" text-anchor="middle" font-family="Geist, sans-serif" font-size="12" font-weight="400" fill="#010101"><tspan x="63">Interest</tspan></text>
<text x="63" y="85" text-anchor="middle" font-family="Geist, sans-serif" font-size="12" font-weight="600" fill="#010101"><tspan x="63">Php 1,080</tspan></text>
<text x="223" y="68" text-anchor="middle" font-family="Geist, sans-serif" font-size="12" font-weight="400" fill="#010101"><tspan x="223">Rest of payment</tspan></text>
<text x="223" y="85" text-anchor="middle" font-family="Geist, sans-serif" font-size="12" font-weight="600" fill="#010101"><tspan x="223">Php 2,920</tspan></text>
<text x="180" y="128" text-anchor="middle" font-family="Geist, sans-serif" font-size="16" font-weight="700" fill="#010101"><tspan x="180">Principal Php 18,000</tspan></text>
<path d="M20 144 V137 H340 V144" fill="none" stroke="#020202" stroke-width="1.5" stroke-opacity="0.7"/>
<path d="M20 156 Q20 148 28 148 H288.1 V196 H28 Q20 196 20 188 Z" fill="#010101" fill-opacity="0.06"/>
<path d="M288.1 148 H332 Q340 148 340 156 V188 Q340 196 332 196 H288.1 Z" fill="#050505" fill-opacity="0.45"/>
<rect x="20" y="148" width="320" height="48" rx="8" fill="none" stroke="#020202" stroke-width="1.5" stroke-opacity="0.7"/>
<line x1="288.1" y1="148" x2="288.1" y2="196" stroke="#020202" stroke-width="1.5" stroke-opacity="0.7"/>
<text x="154" y="168" text-anchor="middle" font-family="Geist, sans-serif" font-size="12" font-weight="400" fill="#010101"><tspan x="154">Principal left</tspan></text>
<text x="154" y="185" text-anchor="middle" font-family="Geist, sans-serif" font-size="12" font-weight="600" fill="#010101"><tspan x="154">Php 15,080</tspan></text>
<text x="314" y="177" text-anchor="middle" font-family="Geist, sans-serif" font-size="12" font-weight="600" fill="#010101"><tspan x="314">2,920</tspan></text>
</svg>
