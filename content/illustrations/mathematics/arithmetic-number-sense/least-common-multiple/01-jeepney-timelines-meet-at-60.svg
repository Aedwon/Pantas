<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 190" width="360" height="190">
<title>Two timelines, every 15 minutes and every 20 minutes, first share a mark at 60 minutes</title>
<rect width="360" height="190" rx="14" fill="#030303"/>
<text x="40" y="24" text-anchor="start" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#010101">Every 15 minutes</text>
<line x1="40" y1="68" x2="320" y2="68" stroke="#020202" stroke-width="2" fill="none"/>
<circle cx="40" cy="68" r="5" fill="#030303" stroke="#020202" stroke-width="1.5"/>
<circle cx="110" cy="68" r="6" fill="#010101"/>
<circle cx="180" cy="68" r="6" fill="#010101"/>
<circle cx="250" cy="68" r="6" fill="#010101"/>
<circle cx="320" cy="68" r="7" fill="#050505"/>
<text x="40" y="52" text-anchor="middle" font-family="Geist, sans-serif" font-size="13" font-weight="400" fill="#020202">0</text>
<text x="110" y="52" text-anchor="middle" font-family="Geist, sans-serif" font-size="13" font-weight="600" fill="#010101">15</text>
<text x="180" y="52" text-anchor="middle" font-family="Geist, sans-serif" font-size="13" font-weight="600" fill="#010101">30</text>
<text x="250" y="52" text-anchor="middle" font-family="Geist, sans-serif" font-size="13" font-weight="600" fill="#010101">45</text>
<text x="320" y="52" text-anchor="middle" font-family="Geist, sans-serif" font-size="13" font-weight="600" fill="#010101">60</text>
<text x="40" y="104" text-anchor="start" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#010101">Every 20 minutes</text>
<line x1="40" y1="148" x2="320" y2="148" stroke="#020202" stroke-width="2" fill="none"/>
<circle cx="40" cy="148" r="5" fill="#030303" stroke="#020202" stroke-width="1.5"/>
<circle cx="133.3" cy="148" r="6" fill="#010101"/>
<circle cx="226.7" cy="148" r="6" fill="#010101"/>
<circle cx="320" cy="148" r="7" fill="#050505"/>
<text x="40" y="132" text-anchor="middle" font-family="Geist, sans-serif" font-size="13" font-weight="400" fill="#020202">0</text>
<text x="133.3" y="132" text-anchor="middle" font-family="Geist, sans-serif" font-size="13" font-weight="600" fill="#010101">20</text>
<text x="226.7" y="132" text-anchor="middle" font-family="Geist, sans-serif" font-size="13" font-weight="600" fill="#010101">40</text>
<text x="320" y="132" text-anchor="middle" font-family="Geist, sans-serif" font-size="13" font-weight="600" fill="#010101">60</text>
<line x1="320" y1="36" x2="320" y2="162" stroke="#050505" stroke-width="2" stroke-dasharray="5 4" fill="none"/>
<text x="326" y="182" text-anchor="end" font-family="Geist, sans-serif" font-size="14" font-weight="700" fill="#010101">LCM = 60 min</text>
</svg>
