<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 208" width="360" height="208">
<title>Triangle with Part on top and Rate times Base on the bottom</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#030303"/><stop offset="1" stop-color="#030303"/></linearGradient>
</defs>
<rect width="360" height="208" rx="14" fill="url(#bg)"/>
<polygon points="180,24 330,184 30,184" fill="#010101" fill-opacity="0.06" stroke="#020202" stroke-width="1.5" stroke-opacity="0.7"/>
<line x1="99.4" y1="110" x2="260.6" y2="110" stroke="#020202" stroke-width="1.5" stroke-opacity="0.7"/>
<text x="180" y="91" text-anchor="middle" font-family="Geist, sans-serif" font-size="20" font-weight="700" fill="#010101"><tspan x="180">Part</tspan></text>
<text x="118" y="156" text-anchor="middle" font-family="Geist, sans-serif" font-size="20" font-weight="700" fill="#010101"><tspan x="118">Rate</tspan></text>
<text x="180" y="156" text-anchor="middle" font-family="Geist, sans-serif" font-size="22" font-weight="400" fill="#010101"><tspan x="180">×</tspan></text>
<text x="242" y="156" text-anchor="middle" font-family="Geist, sans-serif" font-size="20" font-weight="700" fill="#010101"><tspan x="242">Base</tspan></text>
</svg>
