<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 144" width="360" height="144">
<title>Bar for a base of 200 split into a part of 60, which is 30%, and a remainder of 140, which is 70%</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#030303"/><stop offset="1" stop-color="#030303"/></linearGradient>
</defs>
<rect width="360" height="144" rx="14" fill="url(#bg)"/>
<text x="180" y="32" text-anchor="middle" font-family="Geist, sans-serif" font-size="16" font-weight="700" fill="#010101"><tspan x="180">Base = 200 (100%)</tspan></text>
<path d="M20 62 V54 H340 V62" fill="none" stroke="#020202" stroke-width="1.5" stroke-opacity="0.7"/>
<path d="M20 80 Q20 72 28 72 H116 V120 H28 Q20 120 20 112 Z" fill="#050505" fill-opacity="0.45"/>
<path d="M116 72 H332 Q340 72 340 80 V112 Q340 120 332 120 H116 Z" fill="#010101" fill-opacity="0.06"/>
<rect x="20" y="72" width="320" height="48" rx="8" fill="none" stroke="#020202" stroke-width="1.5" stroke-opacity="0.7"/>
<line x1="116" y1="72" x2="116" y2="120" stroke="#020202" stroke-width="1.5" stroke-opacity="0.7"/>
<text x="68" y="93" text-anchor="middle" font-family="Geist, sans-serif" font-size="13" font-weight="700" fill="#010101"><tspan x="68">Part = 60</tspan></text>
<text x="68" y="109" text-anchor="middle" font-family="Geist, sans-serif" font-size="12" font-weight="400" fill="#010101"><tspan x="68">(Rate = 30%)</tspan></text>
<text x="228" y="101" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#010101"><tspan x="228">140 (70%)</tspan></text>
</svg>
