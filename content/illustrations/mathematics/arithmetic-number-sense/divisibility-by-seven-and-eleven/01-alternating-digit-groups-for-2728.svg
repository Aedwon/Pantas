<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 250" width="360" height="250">
<title>The digits of 2,728 split into odd positions summing to 4 and even positions summing to 15</title>
<rect width="360" height="250" rx="14" fill="#030303"/>
<text x="145" y="32" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#010101">odd positions: 2 + 2 = 4</text>
<path d="M75 78 C75 40 215 40 215 78" stroke="#050505" stroke-width="2.5" fill="none"/>
<circle cx="75" cy="78" r="4" fill="#050505"/>
<circle cx="215" cy="78" r="4" fill="#050505"/>
<rect x="47" y="82" width="56" height="56" rx="8" fill="#010101" fill-opacity="0.08" stroke="#020202" stroke-width="1.2" stroke-opacity="0.7"/>
<rect x="117" y="82" width="56" height="56" rx="8" fill="#010101" fill-opacity="0.08" stroke="#020202" stroke-width="1.2" stroke-opacity="0.7"/>
<rect x="187" y="82" width="56" height="56" rx="8" fill="#010101" fill-opacity="0.08" stroke="#020202" stroke-width="1.2" stroke-opacity="0.7"/>
<rect x="257" y="82" width="56" height="56" rx="8" fill="#010101" fill-opacity="0.08" stroke="#020202" stroke-width="1.2" stroke-opacity="0.7"/>
<text x="75" y="119" text-anchor="middle" font-family="Geist, sans-serif" font-size="24" font-weight="700" fill="#010101">2</text>
<text x="145" y="119" text-anchor="middle" font-family="Geist, sans-serif" font-size="24" font-weight="700" fill="#010101">7</text>
<text x="215" y="119" text-anchor="middle" font-family="Geist, sans-serif" font-size="24" font-weight="700" fill="#010101">2</text>
<text x="285" y="119" text-anchor="middle" font-family="Geist, sans-serif" font-size="24" font-weight="700" fill="#010101">8</text>
<path d="M145 142 C145 180 285 180 285 142" stroke="#020202" stroke-width="2.5" fill="none"/>
<circle cx="145" cy="142" r="4" fill="#020202"/>
<circle cx="285" cy="142" r="4" fill="#020202"/>
<text x="215" y="202" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#010101">even positions: 7 + 8 = 15</text>
<text x="180" y="236" text-anchor="middle" font-family="Geist, sans-serif" font-size="16" font-weight="700" fill="#010101">4 − 15 = −11</text>
</svg>
