<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 206" width="360" height="206">
<title>Six terms 4, 7, 10, 13, 16, 19 paired from the outside in, each pair summing to 23, so 3 pairs of 23 make 69</title>
<rect width="360" height="206" rx="14" fill="#030303"/>
<rect x="18" y="20" width="44" height="40" rx="6" fill="#010101" fill-opacity="0.1" stroke="#020202" stroke-width="1.2" stroke-opacity="0.7"/>
<rect x="74" y="20" width="44" height="40" rx="6" fill="#010101" fill-opacity="0.1" stroke="#020202" stroke-width="1.2" stroke-opacity="0.7"/>
<rect x="130" y="20" width="44" height="40" rx="6" fill="#010101" fill-opacity="0.1" stroke="#020202" stroke-width="1.2" stroke-opacity="0.7"/>
<rect x="186" y="20" width="44" height="40" rx="6" fill="#010101" fill-opacity="0.1" stroke="#020202" stroke-width="1.2" stroke-opacity="0.7"/>
<rect x="242" y="20" width="44" height="40" rx="6" fill="#010101" fill-opacity="0.1" stroke="#020202" stroke-width="1.2" stroke-opacity="0.7"/>
<rect x="298" y="20" width="44" height="40" rx="6" fill="#010101" fill-opacity="0.1" stroke="#020202" stroke-width="1.2" stroke-opacity="0.7"/>
<text x="40" y="46" text-anchor="middle" font-family="Geist, sans-serif" font-size="16" font-weight="600" fill="#010101">4</text>
<text x="96" y="46" text-anchor="middle" font-family="Geist, sans-serif" font-size="16" font-weight="600" fill="#010101">7</text>
<text x="152" y="46" text-anchor="middle" font-family="Geist, sans-serif" font-size="16" font-weight="600" fill="#010101">10</text>
<text x="208" y="46" text-anchor="middle" font-family="Geist, sans-serif" font-size="16" font-weight="600" fill="#010101">13</text>
<text x="264" y="46" text-anchor="middle" font-family="Geist, sans-serif" font-size="16" font-weight="600" fill="#010101">16</text>
<text x="320" y="46" text-anchor="middle" font-family="Geist, sans-serif" font-size="16" font-weight="600" fill="#010101">19</text>
<path d="M152 64 V82 H208 V64" fill="none" stroke="#020202" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M96 64 V114 H264 V64" fill="none" stroke="#020202" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M40 64 V146 H320 V64" fill="none" stroke="#020202" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="180" y="100" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#010101">10 + 13 = 23</text>
<text x="180" y="132" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#010101">7 + 16 = 23</text>
<text x="180" y="164" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#010101">4 + 19 = 23</text>
<rect x="88" y="173" width="184" height="28" rx="6" fill="#050505" fill-opacity="0.45"/>
<text x="180" y="193" text-anchor="middle" font-family="Geist, sans-serif" font-size="16" font-weight="700" fill="#010101">3 pairs × 23 = 69</text>
</svg>
