<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" width="360" height="200">
<title>Place-value strip for 0.0625: tenths 0, hundredths 6, thousandths 2, ten-thousandths 5, four places, so the denominator is 10,000</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#030303"/><stop offset="1" stop-color="#030303"/></linearGradient>
</defs>
<rect width="360" height="200" rx="14" fill="url(#bg)"/>
<text x="180" y="28" text-anchor="middle" font-family="Geist, sans-serif" font-size="16" font-weight="700" fill="#010101"><tspan x="180">0.0625</tspan></text>
<text x="60" y="66" text-anchor="middle" font-family="Geist, sans-serif" font-size="12" font-weight="400" fill="#010101"><tspan x="60">tenths</tspan></text>
<text x="140" y="66" text-anchor="middle" font-family="Geist, sans-serif" font-size="12" font-weight="400" fill="#010101"><tspan x="140">hundredths</tspan></text>
<text x="220" y="66" text-anchor="middle" font-family="Geist, sans-serif" font-size="12" font-weight="400" fill="#010101"><tspan x="220">thousandths</tspan></text>
<text x="300" y="52" text-anchor="middle" font-family="Geist, sans-serif" font-size="12" font-weight="400" fill="#010101"><tspan x="300">ten-</tspan></text>
<text x="300" y="66" text-anchor="middle" font-family="Geist, sans-serif" font-size="12" font-weight="400" fill="#010101"><tspan x="300">thousandths</tspan></text>
<rect x="20" y="74" width="80" height="44" fill="#050505" fill-opacity="0.45"/>
<rect x="100" y="74" width="80" height="44" fill="#010101" fill-opacity="0.06"/>
<rect x="180" y="74" width="80" height="44" fill="#010101" fill-opacity="0.06"/>
<rect x="260" y="74" width="80" height="44" fill="#010101" fill-opacity="0.06"/>
<rect x="20" y="74" width="320" height="44" rx="8" fill="none" stroke="#020202" stroke-width="1.5" stroke-opacity="0.7"/>
<line x1="100" y1="74" x2="100" y2="118" stroke="#020202" stroke-width="1.5" stroke-opacity="0.7"/>
<line x1="180" y1="74" x2="180" y2="118" stroke="#020202" stroke-width="1.5" stroke-opacity="0.7"/>
<line x1="260" y1="74" x2="260" y2="118" stroke="#020202" stroke-width="1.5" stroke-opacity="0.7"/>
<text x="60" y="105" text-anchor="middle" font-family="Geist, sans-serif" font-size="22" font-weight="700" fill="#010101"><tspan x="60">0</tspan></text>
<text x="140" y="105" text-anchor="middle" font-family="Geist, sans-serif" font-size="22" font-weight="700" fill="#010101"><tspan x="140">6</tspan></text>
<text x="220" y="105" text-anchor="middle" font-family="Geist, sans-serif" font-size="22" font-weight="700" fill="#010101"><tspan x="220">2</tspan></text>
<text x="300" y="105" text-anchor="middle" font-family="Geist, sans-serif" font-size="22" font-weight="700" fill="#010101"><tspan x="300">5</tspan></text>
<path d="M20 126 V133 H340 V126" fill="none" stroke="#020202" stroke-width="1.5" stroke-opacity="0.7"/>
<text x="180" y="156" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="700" fill="#010101"><tspan x="180">4 places, so 10,000</tspan></text>
<text x="180" y="180" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#010101"><tspan x="180">0.0625 = 625/10,000</tspan></text>
