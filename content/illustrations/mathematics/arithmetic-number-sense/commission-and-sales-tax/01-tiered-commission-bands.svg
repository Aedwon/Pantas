<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 150" width="360" height="150">
<title>Bar for total sales of Php 110,000 in three bands: the first Php 40,000 at 3%, the next Php 40,000 at 5%, and Php 30,000 above Php 80,000 at 8%</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#030303"/><stop offset="1" stop-color="#030303"/></linearGradient>
</defs>
<rect width="360" height="150" rx="14" fill="url(#bg)"/>
<text x="180" y="28" text-anchor="middle" font-family="Geist, sans-serif" font-size="16" font-weight="700" fill="#010101"><tspan x="180">Total sales: Php 110,000</tspan></text>
<path d="M20 46 V39 H340 V46" fill="none" stroke="#020202" stroke-width="1.5" stroke-opacity="0.7"/>
<path d="M20 58 Q20 50 28 50 H136.4 V130 H28 Q20 130 20 122 Z" fill="#050505" fill-opacity="0.12"/>
<rect x="136.4" y="50" width="116.4" height="80" fill="#050505" fill-opacity="0.28"/>
<path d="M252.8 50 H332 Q340 50 340 58 V122 Q340 130 332 130 H252.8 Z" fill="#050505" fill-opacity="0.5"/>
<rect x="20" y="50" width="320" height="80" rx="8" fill="none" stroke="#020202" stroke-width="1.5" stroke-opacity="0.7"/>
<line x1="136.4" y1="50" x2="136.4" y2="130" stroke="#020202" stroke-width="1.5" stroke-opacity="0.7"/>
<line x1="252.8" y1="50" x2="252.8" y2="130" stroke="#020202" stroke-width="1.5" stroke-opacity="0.7"/>
<text x="78" y="73" text-anchor="middle" font-family="Geist, sans-serif" font-size="12" font-weight="400" fill="#010101"><tspan x="78">First</tspan></text>
<text x="78" y="90" text-anchor="middle" font-family="Geist, sans-serif" font-size="12" font-weight="600" fill="#010101"><tspan x="78">Php 40,000</tspan></text>
<text x="78" y="112" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="700" fill="#010101"><tspan x="78">at 3%</tspan></text>
<text x="195" y="73" text-anchor="middle" font-family="Geist, sans-serif" font-size="12" font-weight="400" fill="#010101"><tspan x="195">Next</tspan></text>
<text x="195" y="90" text-anchor="middle" font-family="Geist, sans-serif" font-size="12" font-weight="600" fill="#010101"><tspan x="195">Php 40,000</tspan></text>
<text x="195" y="112" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="700" fill="#010101"><tspan x="195">at 5%</tspan></text>
<text x="296.4" y="68" text-anchor="middle" font-family="Geist, sans-serif" font-size="12" font-weight="400" fill="#010101"><tspan x="296.4">Above</tspan></text>
<text x="296.4" y="83" text-anchor="middle" font-family="Geist, sans-serif" font-size="12" font-weight="600" fill="#010101"><tspan x="296.4">Php 80,000</tspan></text>
<text x="296.4" y="98" text-anchor="middle" font-family="Geist, sans-serif" font-size="12" font-weight="400" fill="#010101"><tspan x="296.4">(Php 30,000)</tspan></text>
<text x="296.4" y="118" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="700" fill="#010101"><tspan x="296.4">at 8%</tspan></text>
</svg>
