<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 150" width="360" height="150">
<title>A bar of total length 2 cut into pieces 1, 1/2, 1/4 and 1/8 to scale, leaving a dashed gap that shrinks toward 2</title>
<rect width="360" height="150" rx="14" fill="#030303"/>
<path d="M20 40 V32 H340 V40" fill="none" stroke="#020202" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="180" y="24" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#010101">Total 2</text>
<rect x="20" y="46" width="160" height="36" fill="#050505" fill-opacity="0.4" stroke="#020202" stroke-width="1.2" stroke-opacity="0.7"/>
<rect x="180" y="46" width="80" height="36" fill="#010101" fill-opacity="0.15" stroke="#020202" stroke-width="1.2" stroke-opacity="0.7"/>
<rect x="260" y="46" width="40" height="36" fill="#050505" fill-opacity="0.4" stroke="#020202" stroke-width="1.2" stroke-opacity="0.7"/>
<rect x="300" y="46" width="20" height="36" fill="#010101" fill-opacity="0.15" stroke="#020202" stroke-width="1.2" stroke-opacity="0.7"/>
<rect x="320" y="46" width="20" height="36" fill="none" stroke="#020202" stroke-width="1.5" stroke-dasharray="4 3" stroke-opacity="0.9"/>
<text x="100" y="104" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#010101">1</text>
<text x="220" y="104" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#010101">1/2</text>
<text x="280" y="104" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#010101">1/4</text>
<text x="310" y="104" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#010101">1/8</text>
<line x1="330" y1="86" x2="330" y2="124" stroke="#020202" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 3"/>
<text x="340" y="140" text-anchor="end" font-family="Geist, sans-serif" font-size="14" font-weight="700" fill="#010101">approaches 2</text>
</svg>
