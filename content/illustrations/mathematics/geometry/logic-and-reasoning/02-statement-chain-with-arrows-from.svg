<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" width="360" height="360">
<title>Chain: an application is complete, then it is sent for review, then a tracking number is assigned; Rico's application is complete</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#030303"/><stop offset="1" stop-color="#030303"/></linearGradient>
<radialGradient id="o" cx="0.4" cy="0.3" r="0.8"><stop offset="0" stop-color="#050505" stop-opacity="0.22"/><stop offset="1" stop-color="#050505" stop-opacity="0.22"/></radialGradient>
<radialGradient id="i" cx="0.4" cy="0.3" r="0.85"><stop offset="0" stop-color="#010101" stop-opacity="0.12"/><stop offset="1" stop-color="#010101" stop-opacity="0.12"/></radialGradient>
<radialGradient id="g" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#050505" stop-opacity="0.7"/><stop offset="1" stop-color="#050505" stop-opacity="0"/></radialGradient>
</defs>
<rect width="360" height="360" rx="14" fill="url(#bg)"/>
<rect x="40" y="24" width="280" height="130" rx="10" fill="url(#o)" stroke="#020202" stroke-width="2"/>
<text x="180" y="50" text-anchor="middle" font-family="Geist, sans-serif" font-size="16" font-weight="700" fill="#010101">an application is complete</text>
<rect x="58" y="68" width="244" height="76" rx="8" fill="#030303" stroke="#050505" stroke-width="2"/>
<rect x="76" y="92" width="28" height="38" rx="3" fill="#010101" fill-opacity="0.05"/><polygon points="94,92 104,102 94,102" fill="#020202"/><line x1="81" y1="112" x2="99" y2="112" stroke="#020202" stroke-width="2" stroke-linecap="round"/><line x1="81" y1="120" x2="99" y2="120" stroke="#020202" stroke-width="2" stroke-linecap="round"/>
<text x="118" y="106" text-anchor="start" font-family="Geist, sans-serif" font-size="14" font-weight="700" fill="#050505"><tspan x="118">Rico's application</tspan><tspan x="118" dy="1.2em">is complete.</tspan></text>
<line x1="180" y1="158" x2="180.0" y2="179.0" stroke="#020202" stroke-width="2.5" stroke-linecap="round"/><polygon points="180,188 174.0,178.0 186.0,178.0" fill="#010101" fill-opacity="0.05"/>
<rect x="40" y="190" width="280" height="48" rx="10" fill="url(#o)" stroke="#020202" stroke-width="2"/>
<text x="180" y="220" text-anchor="middle" font-family="Geist, sans-serif" font-size="16" font-weight="700" fill="#010101">it is sent for review</text>
<line x1="180" y1="242" x2="180.0" y2="263.0" stroke="#020202" stroke-width="2.5" stroke-linecap="round"/><polygon points="180,272 174.0,262.0 186.0,262.0" fill="#010101" fill-opacity="0.05"/>
<rect x="40" y="274" width="280" height="64" rx="10" fill="url(#o)" stroke="#020202" stroke-width="2"/>
<text x="180" y="300" text-anchor="middle" font-family="Geist, sans-serif" font-size="16" font-weight="700" fill="#010101"><tspan x="180">a tracking number</tspan><tspan x="180" dy="1.2em">is assigned</tspan></text>
</svg>
