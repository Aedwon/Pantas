<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 268" width="360" height="268">
<title>Lines r and s cut by a transversal; two angles in the same corner position are labeled (5x + 10)° and (3x + 50)°</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#030303"/><stop offset="1" stop-color="#030303"/></linearGradient>
</defs>
<rect width="360" height="268" rx="14" fill="url(#bg)"/>
<line x1="16" y1="70" x2="344" y2="70" stroke="#010101" stroke-width="2" stroke-linecap="butt"/>
<text x="26" y="59" text-anchor="start" font-family="Geist, sans-serif" font-size="15" font-weight="600" fill="#010101"><tspan font-family="KaTeX_Math, serif" font-weight="400">r</tspan></text>
<line x1="16" y1="210" x2="344" y2="210" stroke="#010101" stroke-width="2" stroke-linecap="butt"/>
<text x="26" y="199" text-anchor="start" font-family="Geist, sans-serif" font-size="15" font-weight="600" fill="#010101"><tspan font-family="KaTeX_Math, serif" font-weight="400">s</tspan></text>
<line x1="137.6" y1="36" x2="213.3" y2="244" stroke="#010101" stroke-width="2" stroke-linecap="round"/>
<path d="M168 70 A18 18 0 0 0 143.8 53.1" fill="none" stroke="#050505" stroke-width="2" stroke-linecap="round"/>
<path d="M219 210 A18 18 0 0 0 194.8 193.1" fill="none" stroke="#050505" stroke-width="2" stroke-linecap="round"/>
<text x="186" y="36.2" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#050505"><tspan font-family="KaTeX_Main, serif" font-weight="400">(5</tspan><tspan font-family="KaTeX_Math, serif" font-weight="400">x</tspan><tspan font-family="KaTeX_Main, serif" font-weight="400"> + 10)°</tspan></text>
<text x="237" y="176.2" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#050505"><tspan font-family="KaTeX_Main, serif" font-weight="400">(3</tspan><tspan font-family="KaTeX_Math, serif" font-weight="400">x</tspan><tspan font-family="KaTeX_Main, serif" font-weight="400"> + 50)°</tspan></text>
</svg>
