<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 340" width="360" height="340">
<title>L-shaped floor split into an upper rectangle 2 m by 150 cm and a lower 1 m by 1 m square</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#030303"/><stop offset="1" stop-color="#030303"/></linearGradient>
<radialGradient id="o" cx="0.4" cy="0.3" r="0.8"><stop offset="0" stop-color="#050505" stop-opacity="0.22"/><stop offset="1" stop-color="#050505" stop-opacity="0.22"/></radialGradient>
<radialGradient id="i" cx="0.4" cy="0.3" r="0.85"><stop offset="0" stop-color="#010101" stop-opacity="0.12"/><stop offset="1" stop-color="#010101" stop-opacity="0.12"/></radialGradient>
<radialGradient id="g" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#050505" stop-opacity="0.7"/><stop offset="1" stop-color="#050505" stop-opacity="0"/></radialGradient>
</defs>
<rect width="360" height="340" rx="14" fill="url(#bg)"/>
<rect x="80" y="50" width="200" height="150" rx="0" fill="#010101" fill-opacity="0.05" stroke="#020202" stroke-width="2"/>
<rect x="80" y="200" width="100" height="100" rx="0" fill="#020202" stroke="#020202" stroke-width="2"/>
<line x1="80" y1="200" x2="180" y2="200" stroke="#020202" stroke-width="3" stroke-linecap="butt"/>
<line x1="283" y1="50" x2="283" y2="200" stroke="#050505" stroke-width="5" stroke-linecap="round"/>
<text x="180" y="38" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#010101">2 m</text>
<text x="293" y="130" text-anchor="start" font-family="Geist, sans-serif" font-size="15" font-weight="700" fill="#050505">150 cm</text>
<text x="72" y="255" text-anchor="end" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#010101">1 m</text>
<text x="130" y="322" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#010101">1 m</text>
</svg>
