<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280" width="360" height="280">
<title>Two similar rectangles with areas 20 cm² and 180 cm², smaller perimeter 18 cm, larger perimeter P</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0E2747"/><stop offset="1" stop-color="#143B63"/></linearGradient>
<radialGradient id="o" cx="0.4" cy="0.3" r="0.8"><stop offset="0" stop-color="#2FB5B0"/><stop offset="1" stop-color="#17697F"/></radialGradient>
<radialGradient id="i" cx="0.4" cy="0.3" r="0.85"><stop offset="0" stop-color="#6FD0FF"/><stop offset="1" stop-color="#2468C8"/></radialGradient>
<radialGradient id="g" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#FFD27A" stop-opacity="0.7"/><stop offset="1" stop-color="#FFD27A" stop-opacity="0"/></radialGradient>
</defs>
<rect width="360" height="280" rx="14" fill="url(#bg)"/>
<rect x="24" y="146" width="60" height="48" rx="4" fill="url(#i)" stroke="#B8F0FF" stroke-width="2"/>
<rect x="124" y="50" width="180" height="144" rx="4" fill="url(#i)" stroke="#B8F0FF" stroke-width="2"/>
<text x="54" y="134" text-anchor="middle" font-family="Source Sans 3, Arial, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">20 cm²</text>
<text x="214" y="38" text-anchor="middle" font-family="Source Sans 3, Arial, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">180 cm²</text>
<text x="54" y="216" text-anchor="middle" font-family="Source Sans 3, Arial, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF"><tspan x="54">Perimeter</tspan><tspan x="54" dy="1.2em">18 cm</tspan></text>
<rect x="150" y="201" width="128" height="50" rx="8" fill="none" stroke="#FFC857" stroke-width="2"/>
<text x="214" y="220" text-anchor="middle" font-family="Source Sans 3, Arial, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF"><tspan x="214">Perimeter</tspan><tspan x="214" dy="1.2em"><tspan font-weight="700" font-size="16" fill="#FFC857">P</tspan></tspan></text>
</svg>
