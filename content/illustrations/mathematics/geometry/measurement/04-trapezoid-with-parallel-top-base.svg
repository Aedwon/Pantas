<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" width="360" height="260">
<title>Trapezoid with top base 8 cm, bottom base 12 cm and perpendicular height 5 cm</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#030303"/><stop offset="1" stop-color="#030303"/></linearGradient>
<radialGradient id="o" cx="0.4" cy="0.3" r="0.8"><stop offset="0" stop-color="#050505" stop-opacity="0.22"/><stop offset="1" stop-color="#050505" stop-opacity="0.22"/></radialGradient>
<radialGradient id="i" cx="0.4" cy="0.3" r="0.85"><stop offset="0" stop-color="#010101" stop-opacity="0.12"/><stop offset="1" stop-color="#010101" stop-opacity="0.12"/></radialGradient>
<radialGradient id="g" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#050505" stop-opacity="0.7"/><stop offset="1" stop-color="#050505" stop-opacity="0"/></radialGradient>
</defs>
<rect width="360" height="260" rx="14" fill="url(#bg)"/>
<polygon points="72,175 288,175 252,85 108,85" fill="url(#i)" stroke="#020202" stroke-width="2" stroke-linejoin="round"/>
<line x1="150" y1="85" x2="150" y2="175" stroke="#050505" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 4"/>
<path d="M160 175 L160 165 L150 165" fill="none" stroke="#050505" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
<text x="160" y="135" text-anchor="start" font-family="Geist, sans-serif" font-size="15" font-weight="700" fill="#050505">5 cm</text>
<text x="180" y="72" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#010101">8 cm</text>
<text x="180" y="203" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#010101">12 cm</text>
</svg>
