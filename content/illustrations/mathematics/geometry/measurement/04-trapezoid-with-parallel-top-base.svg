<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" width="360" height="260">
<title>Trapezoid with top base 8 cm, bottom base 12 cm and perpendicular height 5 cm</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0E2747"/><stop offset="1" stop-color="#143B63"/></linearGradient>
<radialGradient id="o" cx="0.4" cy="0.3" r="0.8"><stop offset="0" stop-color="#2FB5B0"/><stop offset="1" stop-color="#17697F"/></radialGradient>
<radialGradient id="i" cx="0.4" cy="0.3" r="0.85"><stop offset="0" stop-color="#6FD0FF"/><stop offset="1" stop-color="#2468C8"/></radialGradient>
<radialGradient id="g" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#FFD27A" stop-opacity="0.7"/><stop offset="1" stop-color="#FFD27A" stop-opacity="0"/></radialGradient>
</defs>
<rect width="360" height="260" rx="14" fill="url(#bg)"/>
<polygon points="72,175 288,175 252,85 108,85" fill="url(#i)" stroke="#B8F0FF" stroke-width="2" stroke-linejoin="round"/>
<line x1="150" y1="85" x2="150" y2="175" stroke="#FFC857" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 4"/>
<path d="M160 175 L160 165 L150 165" fill="none" stroke="#FFC857" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
<text x="160" y="135" text-anchor="start" font-family="Geist, sans-serif" font-size="15" font-weight="700" fill="#FFC857">5 cm</text>
<text x="180" y="72" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">8 cm</text>
<text x="180" y="203" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">12 cm</text>
</svg>
