<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280" width="360" height="280">
<title>Two cubes with corresponding bottom edges labeled 2 cm and 6 cm</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#030303"/><stop offset="1" stop-color="#030303"/></linearGradient>
<radialGradient id="o" cx="0.4" cy="0.3" r="0.8"><stop offset="0" stop-color="#050505" stop-opacity="0.22"/><stop offset="1" stop-color="#050505" stop-opacity="0.22"/></radialGradient>
<radialGradient id="i" cx="0.4" cy="0.3" r="0.85"><stop offset="0" stop-color="#010101" stop-opacity="0.12"/><stop offset="1" stop-color="#010101" stop-opacity="0.12"/></radialGradient>
<radialGradient id="g" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#050505" stop-opacity="0.7"/><stop offset="1" stop-color="#050505" stop-opacity="0"/></radialGradient>
</defs>
<rect width="360" height="280" rx="14" fill="url(#bg)"/>
<polygon points="80,184 116,184 116,220 80,220" fill="#010101" fill-opacity="0.12" stroke="#020202" stroke-width="2" stroke-linejoin="round"/>
<polygon points="80,184 116,184 130,170 94,170" fill="#010101" fill-opacity="0.12" stroke="#020202" stroke-width="2" stroke-linejoin="round"/>
<polygon points="116,184 130,170 130,206 116,220" fill="#010101" fill-opacity="0.12" stroke="#020202" stroke-width="2" stroke-linejoin="round"/>
<polygon points="190,112 298,112 298,220 190,220" fill="#010101" fill-opacity="0.12" stroke="#020202" stroke-width="2" stroke-linejoin="round"/>
<polygon points="190,112 298,112 340,70 232,70" fill="#010101" fill-opacity="0.12" stroke="#020202" stroke-width="2" stroke-linejoin="round"/>
<polygon points="298,112 340,70 340,178 298,220" fill="#010101" fill-opacity="0.12" stroke="#020202" stroke-width="2" stroke-linejoin="round"/>
<line x1="80" y1="220" x2="116" y2="220" stroke="#050505" stroke-width="5" stroke-linecap="round"/>
<line x1="190" y1="220" x2="298" y2="220" stroke="#050505" stroke-width="5" stroke-linecap="round"/>
<text x="98" y="246" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="700" fill="#050505">2 cm</text>
<text x="244" y="246" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="700" fill="#050505">6 cm</text>
