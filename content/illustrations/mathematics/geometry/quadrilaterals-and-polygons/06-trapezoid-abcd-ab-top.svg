<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" width="360" height="260">
<title>Trapezoid ABCD with AB on top parallel to DC, angle A marked (2x + 10) degrees and angle D marked (3x + 20) degrees</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#030303"/><stop offset="1" stop-color="#030303"/></linearGradient>
</defs>
<rect width="360" height="260" rx="14" fill="url(#bg)"/>
<polygon points="50.3,75 225.3,75 309.7,185 69.7,185" fill="#050505" fill-opacity="0.22" stroke="#010101" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="132.8,70 142.8,75 132.8,80" fill="none" stroke="#020202" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="184.7,180 194.7,185 184.7,190" fill="none" stroke="#020202" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M76.3 75 A26 26 0 0 1 54.8 100.6" fill="none" stroke="#050505" stroke-width="2.5" stroke-linecap="round"/>
<path d="M65.2 159.4 A26 26 0 0 1 95.7 185" fill="none" stroke="#050505" stroke-width="2.5" stroke-linecap="round"/>

<text x="88.3" y="107" text-anchor="start" font-family="Geist, sans-serif" font-size="15" font-weight="600" fill="#050505"><tspan font-family="KaTeX_Main, serif" font-weight="400">(2</tspan><tspan font-family="KaTeX_Math, serif" font-weight="400">x</tspan><tspan font-family="KaTeX_Main, serif" font-weight="400"> + 10)°</tspan></text>
<text x="107.7" y="165" text-anchor="start" font-family="Geist, sans-serif" font-size="15" font-weight="600" fill="#050505"><tspan font-family="KaTeX_Main, serif" font-weight="400">(3</tspan><tspan font-family="KaTeX_Math, serif" font-weight="400">x</tspan><tspan font-family="KaTeX_Main, serif" font-weight="400"> + 20)°</tspan></text>
<text x="37.3" y="71" text-anchor="middle" font-family="Geist, sans-serif" font-size="16" font-weight="600" fill="#010101">A</text>
<text x="238.3" y="71" text-anchor="middle" font-family="Geist, sans-serif" font-size="16" font-weight="600" fill="#010101">B</text>
<text x="322.7" y="201" text-anchor="middle" font-family="Geist, sans-serif" font-size="16" font-weight="600" fill="#010101">C</text>
<text x="56.7" y="201" text-anchor="middle" font-family="Geist, sans-serif" font-size="16" font-weight="600" fill="#010101">D</text>
</svg>
