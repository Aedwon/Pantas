<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 400" width="360" height="400">
<title>Three four-sided figures: a convex quadrilateral, a concave arrowhead with a reflex angle of 225 degrees, and a bow-tie whose sides cross</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#030303"/><stop offset="1" stop-color="#030303"/></linearGradient>
</defs>
<rect width="360" height="400" rx="14" fill="url(#bg)"/>
<polygon points="22,106 44,34 124,28 142,92" fill="#050505" fill-opacity="0.22" stroke="#010101" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="168" y="58" text-anchor="start" font-family="Geist, sans-serif" font-size="15" font-weight="600" fill="#010101">Convex: all</text>
<text x="168" y="77" text-anchor="start" font-family="Geist, sans-serif" font-size="15" font-weight="600" fill="#010101">angles less</text>
<text x="168" y="96" text-anchor="start" font-family="Geist, sans-serif" font-size="15" font-weight="600" fill="#010101">than 180°</text>
<line x1="16" y1="135" x2="344" y2="135" stroke="#020202" stroke-width="1" stroke-linecap="round" stroke-opacity="0.3"/>
<polygon points="16,165.5 146,165.5 81,230.5 72.3,198" fill="#050505" fill-opacity="0.22" stroke="#010101" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M75.9 211.5 A14 14 0 1 0 60.2 191" fill="none" stroke="#050505" stroke-width="2.5" stroke-linecap="round"/>
<text x="86.3" y="182" text-anchor="start" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#050505">225°</text>
<text x="168" y="184" text-anchor="start" font-family="Geist, sans-serif" font-size="15" font-weight="600" fill="#010101">Concave: one</text>
<text x="168" y="203" text-anchor="start" font-family="Geist, sans-serif" font-size="15" font-weight="600" fill="#010101">angle greater</text>
<text x="168" y="222" text-anchor="start" font-family="Geist, sans-serif" font-size="15" font-weight="600" fill="#010101">than 180°</text>
<line x1="16" y1="261" x2="344" y2="261" stroke="#020202" stroke-width="1" stroke-linecap="round" stroke-opacity="0.3"/>
<polygon points="24,288 140,360 140,288 24,360" fill="#050505" fill-opacity="0.22" stroke="#010101" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="82" cy="324" r="4" fill="#010101"/>
<text x="168" y="319.5" text-anchor="start" font-family="Geist, sans-serif" font-size="15" font-weight="600" fill="#010101">Not simple:</text>
<text x="168" y="338.5" text-anchor="start" font-family="Geist, sans-serif" font-size="15" font-weight="600" fill="#010101">sides cross</text>
</svg>
