<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" width="360" height="300">
<title>Rhombus ABCD with diagonals AC of 16 cm and BD of 12 cm crossing at O, with side AB marked by a question mark</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#030303"/><stop offset="1" stop-color="#030303"/></linearGradient>
</defs>
<rect width="360" height="300" rx="14" fill="url(#bg)"/>
<polygon points="68,150 180,66 292,150 180,234" fill="#050505" fill-opacity="0.22" stroke="#010101" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="68" y1="150" x2="180" y2="66" stroke="#050505" stroke-width="3.5" stroke-linecap="round"/>
<line x1="68" y1="150" x2="292" y2="150" stroke="#020202" stroke-width="2" stroke-linecap="round"/>
<line x1="180" y1="66" x2="180" y2="234" stroke="#020202" stroke-width="2" stroke-linecap="round"/>
<circle cx="180" cy="150" r="4" fill="#010101"/>
<text x="188" y="125" text-anchor="start" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#010101">AC =</text>
<text x="188" y="141" text-anchor="start" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#010101">16 cm</text>
<text x="188" y="168" text-anchor="start" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#010101">BD =</text>
<text x="188" y="184" text-anchor="start" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#010101">12 cm</text>
<text x="108" y="92" text-anchor="middle" font-family="Geist, sans-serif" font-size="17" font-weight="700" fill="#050505">?</text>
<text x="56" y="155" text-anchor="middle" font-family="Geist, sans-serif" font-size="16" font-weight="600" fill="#010101">A</text>
<text x="180" y="54" text-anchor="middle" font-family="Geist, sans-serif" font-size="16" font-weight="600" fill="#010101">B</text>
<text x="304" y="155" text-anchor="middle" font-family="Geist, sans-serif" font-size="16" font-weight="600" fill="#010101">C</text>
<text x="180" y="254" text-anchor="middle" font-family="Geist, sans-serif" font-size="16" font-weight="600" fill="#010101">D</text>
<text x="165" y="171" text-anchor="middle" font-family="Geist, sans-serif" font-size="16" font-weight="600" fill="#010101">O</text>
</svg>
