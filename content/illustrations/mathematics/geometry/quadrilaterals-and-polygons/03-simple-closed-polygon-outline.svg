<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" width="360" height="300">
<title>A closed polygon outline partly hidden by a label box reading sum of interior angles equals 1440 degrees, with the question: sides n equals what</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#030303"/><stop offset="1" stop-color="#030303"/></linearGradient>
</defs>
<rect width="360" height="300" rx="14" fill="url(#bg)"/>
<polygon points="240,52 284,92 292,156 262,196 206,190 150,204 96,170 84,112 118,64 176,40" fill="#050505" fill-opacity="0.22" stroke="#010101" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="190" y="146" width="140" height="60" rx="8" fill="#030303" stroke="#020202" stroke-width="1.5"/>
<text x="260" y="169" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#010101">Sum of interior</text>
<text x="260" y="189" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#010101">angles = 1440°</text>
<text x="180" y="258" text-anchor="middle" font-family="Geist, sans-serif" font-size="16" font-weight="600" fill="#010101">Sides <tspan font-family="KaTeX_Math, serif" font-weight="400">n</tspan><tspan font-family="KaTeX_Main, serif" font-weight="400"> = </tspan><tspan fill="#050505">?</tspan></text>
</svg>
