<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" width="360" height="300">
<title>Quadrilateral PQRS with diagonals PR and QS crossing at O at a right angle, equal single ticks on PO and OR, equal double ticks on QO and OS, and PR longer than QS</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#030303"/><stop offset="1" stop-color="#030303"/></linearGradient>
</defs>
<rect width="360" height="300" rx="14" fill="url(#bg)"/>
<polygon points="55,150 180,70 305,150 180,230" fill="#050505" fill-opacity="0.22" stroke="#010101" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="55" y1="150" x2="305" y2="150" stroke="#020202" stroke-width="2" stroke-linecap="round"/>
<line x1="180" y1="70" x2="180" y2="230" stroke="#020202" stroke-width="2" stroke-linecap="round"/>
<circle cx="180" cy="150" r="4" fill="#010101"/>
<polyline points="180,138 192,138 192,150" fill="none" stroke="#050505" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="117.5" y1="143" x2="117.5" y2="157" stroke="#050505" stroke-width="2.5" stroke-linecap="round"/>
<line x1="242.5" y1="143" x2="242.5" y2="157" stroke="#050505" stroke-width="2.5" stroke-linecap="round"/>
<line x1="173" y1="106.5" x2="187" y2="106.5" stroke="#050505" stroke-width="2.5" stroke-linecap="round"/>
<line x1="173" y1="113.5" x2="187" y2="113.5" stroke="#050505" stroke-width="2.5" stroke-linecap="round"/>
<line x1="173" y1="186.5" x2="187" y2="186.5" stroke="#050505" stroke-width="2.5" stroke-linecap="round"/>
<line x1="173" y1="193.5" x2="187" y2="193.5" stroke="#050505" stroke-width="2.5" stroke-linecap="round"/>
<text x="42" y="155" text-anchor="middle" font-family="Geist, sans-serif" font-size="16" font-weight="600" fill="#010101">P</text>
<text x="180" y="57" text-anchor="middle" font-family="Geist, sans-serif" font-size="16" font-weight="600" fill="#010101">Q</text>
<text x="318" y="155" text-anchor="middle" font-family="Geist, sans-serif" font-size="16" font-weight="600" fill="#010101">R</text>
<text x="180" y="254" text-anchor="middle" font-family="Geist, sans-serif" font-size="16" font-weight="600" fill="#010101">S</text>
<text x="165" y="171" text-anchor="middle" font-family="Geist, sans-serif" font-size="16" font-weight="600" fill="#010101">O</text>
</svg>
