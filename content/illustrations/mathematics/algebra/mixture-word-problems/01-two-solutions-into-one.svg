<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" width="360" height="200">
<title>Two containers, x liters at 30% and 20 minus x liters at 10%, pour into one container of 20 liters at 20%</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#030303"/><stop offset="1" stop-color="#030303"/></linearGradient>
</defs>
<rect width="360" height="200" rx="14" fill="url(#bg)"/>
<path d="M12 40 V110 Q12 118 20 118 H92 Q100 118 100 110 V40" fill="none" stroke="#020202" stroke-width="1.5" stroke-opacity="0.7"/>
<path d="M13 40 H99 V110 Q99 117 92 117 H20 Q13 117 13 110 Z" fill="#050505" fill-opacity="0.45"/>
<path d="M136 40 V110 Q136 118 144 118 H216 Q224 118 224 110 V40" fill="none" stroke="#020202" stroke-width="1.5" stroke-opacity="0.7"/>
<path d="M137 40 H223 V110 Q223 117 216 117 H144 Q137 117 137 110 Z" fill="#050505" fill-opacity="0.15"/>
<path d="M256 24 V110 Q256 118 264 118 H344 Q352 118 352 110 V24" fill="none" stroke="#020202" stroke-width="1.5" stroke-opacity="0.7"/>
<path d="M257 24 H351 V110 Q351 117 344 117 H264 Q257 117 257 110 Z" fill="#050505" fill-opacity="0.3"/>
<text x="118" y="86" text-anchor="middle" font-family="Geist, sans-serif" font-size="22" font-weight="400" fill="#010101"><tspan x="118">+</tspan></text>
<line x1="230" y1="82" x2="250" y2="82" stroke="#020202" stroke-width="1.5" stroke-opacity="0.7"/>
<polygon points="254,82 247,78 247,86" fill="#020202" fill-opacity="0.7"/>
<text x="56" y="138" text-anchor="middle" font-family="Geist, sans-serif" font-size="13" font-weight="700" fill="#010101"><tspan x="56">x L</tspan></text>
<text x="56" y="154" text-anchor="middle" font-family="Geist, sans-serif" font-size="12" font-weight="600" fill="#010101"><tspan x="56">at 30%</tspan></text>
<text x="56" y="172" text-anchor="middle" font-family="Geist, sans-serif" font-size="12" font-weight="400" fill="#010101"><tspan x="56">0.30x</tspan></text>
<text x="56" y="187" text-anchor="middle" font-family="Geist, sans-serif" font-size="12" font-weight="400" fill="#010101"><tspan x="56">L pure</tspan></text>
<text x="180" y="138" text-anchor="middle" font-family="Geist, sans-serif" font-size="13" font-weight="700" fill="#010101"><tspan x="180">(20 - x) L</tspan></text>
<text x="180" y="154" text-anchor="middle" font-family="Geist, sans-serif" font-size="12" font-weight="600" fill="#010101"><tspan x="180">at 10%</tspan></text>
<text x="180" y="172" text-anchor="middle" font-family="Geist, sans-serif" font-size="12" font-weight="400" fill="#010101"><tspan x="180">0.10(20 - x)</tspan></text>
<text x="180" y="187" text-anchor="middle" font-family="Geist, sans-serif" font-size="12" font-weight="400" fill="#010101"><tspan x="180">L pure</tspan></text>
<text x="304" y="138" text-anchor="middle" font-family="Geist, sans-serif" font-size="13" font-weight="700" fill="#010101"><tspan x="304">20 L</tspan></text>
<text x="304" y="154" text-anchor="middle" font-family="Geist, sans-serif" font-size="12" font-weight="600" fill="#010101"><tspan x="304">at 20%</tspan></text>
<text x="304" y="172" text-anchor="middle" font-family="Geist, sans-serif" font-size="12" font-weight="400" fill="#010101"><tspan x="304">0.20(20)</tspan></text>
<text x="304" y="187" text-anchor="middle" font-family="Geist, sans-serif" font-size="12" font-weight="400" fill="#010101"><tspan x="304">= 4 L pure</tspan></text>
</svg>
