<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" width="360" height="200">
<title>Number line with an open circle at -1 and a ray shaded to the left for x less than -1</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0E2747"/><stop offset="1" stop-color="#143B63"/></linearGradient>
</defs>
<rect width="360" height="200" rx="14" fill="url(#bg)"/>
<text x="180" y="50" text-anchor="middle" font-family="Source Sans 3, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">x&lt;-1</text>
<line x1="42" y1="120" x2="318" y2="120" stroke="#D6E6F5" stroke-width="2.5" stroke-linecap="butt"/>
<polygon points="30,120 42,114 42,126" fill="#D6E6F5"/><polygon points="330,120 318,114 318,126" fill="#D6E6F5"/>
<line x1="180" y1="112" x2="180" y2="128" stroke="#D6E6F5" stroke-width="2" stroke-linecap="round"/>
<line x1="173" y1="120" x2="58" y2="120" stroke="#FFC857" stroke-width="8" stroke-linecap="butt"/>
<polygon points="44,120 60,108 60,132" fill="#FFC857"/>
<circle cx="180" cy="120" r="8" fill="#123358" stroke="#FFC857" stroke-width="3"/>
<text x="180" y="158" text-anchor="middle" font-family="Source Sans 3, Arial, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF">-1</text>
</svg>
