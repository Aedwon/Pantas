<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" width="360" height="200">
<title>Number line with an open circle at -1 and a ray shaded to the left for x less than -1</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#030303"/><stop offset="1" stop-color="#030303"/></linearGradient>
</defs>
<rect width="360" height="200" rx="14" fill="url(#bg)"/>
<text x="180" y="50" text-anchor="middle" font-family="Geist, sans-serif" font-size="18" font-weight="700" fill="#010101"><tspan font-family="KaTeX_Math, serif" font-weight="400">x</tspan><tspan font-family="KaTeX_Main, serif" font-weight="400"> &lt; −1</tspan></text>
<line x1="42" y1="120" x2="318" y2="120" stroke="#020202" stroke-width="2.5" stroke-linecap="butt"/>
<polygon points="30,120 42,114 42,126" fill="#020202"/><polygon points="330,120 318,114 318,126" fill="#020202"/>
<line x1="180" y1="112" x2="180" y2="128" stroke="#020202" stroke-width="2" stroke-linecap="round"/>
<line x1="173" y1="120" x2="58" y2="120" stroke="#050505" stroke-width="8" stroke-linecap="butt"/>
<polygon points="44,120 60,108 60,132" fill="#050505" fill-opacity="0.45"/>
<circle cx="180" cy="120" r="8" fill="#030303" stroke="#050505" stroke-width="3"/>
<text x="180" y="158" text-anchor="middle" font-family="Geist, sans-serif" font-size="16" font-weight="600" fill="#010101"><tspan font-family="KaTeX_Main, serif" font-weight="400">−1</tspan></text>
</svg>
