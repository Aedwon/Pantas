<text x="190" y="240" text-anchor="start" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#050505"><tspan font-family="KaTeX_Main, serif" font-weight="400">(2, 1)</tspan></text>
<text x="230" y="200" text-anchor="start" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#010101"><tspan font-family="KaTeX_Main, serif" font-weight="400">(3, 2)</tspan></text>
<text x="90" y="100" text-anchor="end" font-family="Geist, sans-serif" font-size="14" font-weight="400" fill="#020202">removed</text>
</svg>
