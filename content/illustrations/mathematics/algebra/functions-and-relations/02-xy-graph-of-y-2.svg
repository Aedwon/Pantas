<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" width="360" height="300">
<title>Graph of y = (x − 2)² + 1 for x ≥ 2: solid right half from the closed dot at (2, 1) through (3, 2), left half dashed and removed</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#030303"/><stop offset="1" stop-color="#030303"/></linearGradient>
</defs>
<rect width="360" height="300" rx="14" fill="url(#bg)"/>
<text x="150" y="32" text-anchor="middle" font-family="Geist, sans-serif" font-size="17" font-weight="700" fill="#010101"><tspan font-family="KaTeX_Math, serif" font-weight="400">y</tspan><tspan font-family="KaTeX_Main, serif" font-weight="400" dx="2">= (</tspan><tspan font-family="KaTeX_Math, serif" font-weight="400">x</tspan><tspan font-family="KaTeX_Main, serif" font-weight="400" dx="1">− 2)² + 1</tspan></text>
<text x="250" y="32" text-anchor="start" font-family="Geist, sans-serif" font-size="17" font-weight="700" fill="#050505"><tspan font-family="KaTeX_Math, serif" font-weight="400">x</tspan><tspan font-family="KaTeX_Main, serif" font-weight="400" dx="2">≥ 2</tspan></text>
<rect x="30" y="48" width="300" height="236" rx="8" fill="#010101" fill-opacity="0.05" stroke="#020202" stroke-width="1" stroke-opacity="0.4"/>
<line x1="36" y1="250" x2="324" y2="250" stroke="#020202" stroke-width="1.5"/>
<line x1="100" y1="54" x2="100" y2="270" stroke="#020202" stroke-width="1.5"/>
<polyline points="180.0,220.0 172.3,218.9 164.7,215.6 157.0,210.1 149.3,202.4 141.7,192.4 134.0,180.3 126.3,166.0 118.7,149.5 111.0,130.7 103.3,109.8 95.7,86.6 88.0,61.3" fill="none" stroke="#020202" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4"/>
<polyline points="180.0,220.0 187.7,218.9 195.3,215.6 203.0,210.1 210.7,202.4 218.3,192.4 226.0,180.3 233.7,166.0 241.3,149.5 249.0,130.7 256.7,109.8 264.3,86.6 272.0,61.3" fill="none" stroke="#050505" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
