<rect width="360" height="316" rx="14" fill="url(#bg)"/>
<rect x="80" y="20" width="200" height="52" rx="10" fill="#010101" fill-opacity="0.12" stroke="#020202" stroke-width="1.5" stroke-opacity="0.5"/>
<text x="180" y="51.2" text-anchor="middle" font-family="Geist, sans-serif" font-size="15" font-weight="600" fill="#010101">Inflated project cost</text>
<line x1="180" y1="76" x2="180" y2="119" stroke="#020202" stroke-width="3"/>
<polygon points="180,128 175,118 185,118" fill="#010101" fill-opacity="0.05"/>
