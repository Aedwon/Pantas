<polygon points="180,240 175,230 185,230" fill="#B8F0FF"/>
<text x="196" y="220" text-anchor="start" font-family="Geist, sans-serif" font-size="14" font-weight="400" fill="#D6E6F5">political effect</text>
<rect x="80" y="244" width="200" height="52" rx="10" fill="#2C6A98" stroke="#6FD0FF" stroke-width="1.5" stroke-opacity="0.5"/>
<text x="180" y="275.2" text-anchor="middle" font-family="Geist, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF">Lower trust</text>
