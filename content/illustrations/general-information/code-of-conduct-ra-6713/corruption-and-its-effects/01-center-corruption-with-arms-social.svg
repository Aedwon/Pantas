<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 420" width="360" height="420">
<title>Corruption at the center with social, economic, and political harms branching out</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#030303"/><stop offset="1" stop-color="#030303"/></linearGradient>
<radialGradient id="tl" cx="0.4" cy="0.3" r="0.8"><stop offset="0" stop-color="#050505" stop-opacity="0.22"/><stop offset="1" stop-color="#050505" stop-opacity="0.22"/></radialGradient>
<radialGradient id="sk" cx="0.4" cy="0.3" r="0.85"><stop offset="0" stop-color="#010101" stop-opacity="0.12"/><stop offset="1" stop-color="#010101" stop-opacity="0.12"/></radialGradient>
<radialGradient id="wm" cx="0.4" cy="0.3" r="0.9"><stop offset="0" stop-color="#050505" stop-opacity="0.45"/><stop offset="1" stop-color="#050505" stop-opacity="0.45"/></radialGradient>
<linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#010101" stop-opacity="0.12"/><stop offset="1" stop-color="#010101" stop-opacity="0.05"/></linearGradient>
<linearGradient id="land" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#050505" stop-opacity="0.22"/><stop offset="1" stop-color="#050505" stop-opacity="0.22"/></linearGradient>
<linearGradient id="cl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#030303"/><stop offset="1" stop-color="#020202"/></linearGradient>

</defs>
<rect width="360" height="420" rx="14" fill="url(#bg)"/>
<rect x="85" y="16" width="190" height="56" rx="10" fill="#010101" fill-opacity="0.12" stroke="#020202" stroke-width="1.5" stroke-opacity="0.5"/>
<text x="180" y="40.5" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#010101"><tspan x="180">Social: unfair access,</tspan><tspan x="180" dy="1.2em">lost trust</tspan></text>
<rect x="16" y="248" width="190" height="56" rx="10" fill="#010101" fill-opacity="0.12" stroke="#020202" stroke-width="1.5" stroke-opacity="0.5"/>
<text x="111" y="272.5" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#010101"><tspan x="111">Economic: wasted funds,</tspan><tspan x="111" dy="1.2em">higher costs</tspan></text>
<rect x="186" y="322" width="158" height="76" rx="10" fill="#010101" fill-opacity="0.12" stroke="#020202" stroke-width="1.5" stroke-opacity="0.5"/>
<text x="265" y="348.1" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#010101"><tspan x="265">Political: weaker</tspan><tspan x="265" dy="1.2em">accountability,</tspan><tspan x="265" dy="1.2em">lost election trust</tspan></text>
<line x1="180" y1="112" x2="180" y2="87" stroke="#020202" stroke-width="3"/>
<polygon points="180,78 185,88 175,88" fill="#010101" fill-opacity="0.05"/>
<line x1="150.4" y1="197.7" x2="118.8" y2="235.1" stroke="#020202" stroke-width="3"/>
<polygon points="113,242 115.6,231.1 123.3,237.6" fill="#010101" fill-opacity="0.05"/>
<line x1="202.8" y1="202.4" x2="257.8" y2="306" stroke="#020202" stroke-width="3"/>
<polygon points="262,314 252.9,307.5 261.7,302.8" fill="#010101" fill-opacity="0.05"/>
<circle cx="180" cy="160" r="48" fill="url(#wm)" stroke="#030303" stroke-width="1.5" stroke-opacity="0.35"/>
<text x="180" y="166" text-anchor="middle" font-family="Geist, sans-serif" font-size="16" font-weight="700" fill="#010101">Corruption</text>
</svg>
