<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" width="360" height="220">
<title>Timeline from January 1, 2026 approval (day 0) to March 2 (day 60) and April 1 (day 90) with the window between day 60 and day 90 shaded</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#030303"/><stop offset="1" stop-color="#030303"/></linearGradient>
<radialGradient id="teal" cx="0.4" cy="0.3" r="0.8"><stop offset="0" stop-color="#050505" stop-opacity="0.22"/><stop offset="1" stop-color="#050505" stop-opacity="0.22"/></radialGradient>
<radialGradient id="sky" cx="0.4" cy="0.3" r="0.85"><stop offset="0" stop-color="#010101" stop-opacity="0.12"/><stop offset="1" stop-color="#010101" stop-opacity="0.12"/></radialGradient>
<radialGradient id="warm" cx="0.4" cy="0.3" r="0.9"><stop offset="0" stop-color="#050505" stop-opacity="0.45"/><stop offset="1" stop-color="#050505" stop-opacity="0.45"/></radialGradient>
</defs>
<rect width="360" height="220" rx="14" fill="url(#bg)"/>
<line x1="30" y1="128" x2="330" y2="128" stroke="#020202" stroke-width="3" stroke-linecap="round" fill="none"/>
<rect x="230" y="116" width="100" height="24" rx="0" fill="#050505" fill-opacity="0.35"/>
<line x1="30" y1="114" x2="30" y2="142" stroke="#010101" stroke-width="3" stroke-linecap="butt" fill="none"/>
<line x1="230" y1="114" x2="230" y2="142" stroke="#050505" stroke-width="3.5" stroke-linecap="butt" fill="none"/>
<line x1="330" y1="114" x2="330" y2="142" stroke="#050505" stroke-width="3.5" stroke-linecap="butt" fill="none"/>
<line x1="30" y1="114" x2="30" y2="86" stroke="#020202" stroke-width="1.5" stroke-linecap="butt" fill="none"/>
<text x="16" y="60" text-anchor="start" font-family="Geist, sans-serif" font-size="15" font-weight="600" fill="#010101"><tspan x="16">January 1, 2026</tspan><tspan x="16" dy="1.2em">approval (day 0)</tspan></text>
<line x1="330" y1="114" x2="330" y2="86" stroke="#020202" stroke-width="1.5" stroke-linecap="butt" fill="none"/>
<text x="344" y="60" text-anchor="end" font-family="Geist, sans-serif" font-size="15" font-weight="600" fill="#050505"><tspan x="344">April 1 (day 90)</tspan></text>
<line x1="230" y1="142" x2="230" y2="164" stroke="#020202" stroke-width="1.5" stroke-linecap="butt" fill="none"/>
<text x="230" y="182" text-anchor="middle" font-family="Geist, sans-serif" font-size="15" font-weight="600" fill="#050505"><tspan x="230">March 2 (day 60)</tspan></text>
</svg>
