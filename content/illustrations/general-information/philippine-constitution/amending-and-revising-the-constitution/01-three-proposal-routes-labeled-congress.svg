<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" width="360" height="360">
<title>Three proposal routes lead to a plebiscite, then majority of votes cast, then valid change</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0E2747"/><stop offset="1" stop-color="#143B63"/></linearGradient>
<radialGradient id="teal" cx="0.4" cy="0.3" r="0.8"><stop offset="0" stop-color="#2FB5B0"/><stop offset="1" stop-color="#17697F"/></radialGradient>
<radialGradient id="sky" cx="0.4" cy="0.3" r="0.85"><stop offset="0" stop-color="#4DA9E0"/><stop offset="1" stop-color="#2468C8"/></radialGradient>
<radialGradient id="warm" cx="0.4" cy="0.3" r="0.9"><stop offset="0" stop-color="#FFD27A"/><stop offset="1" stop-color="#FFB347"/></radialGradient>
</defs>
<rect width="360" height="360" rx="14" fill="url(#bg)"/>
<rect x="12" y="16" width="109.3" height="84" rx="10" fill="url(#teal)"/>
<text x="66.7" y="58" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF"><tspan x="66.7">Congress</tspan></text>
<rect x="125.3" y="16" width="109.3" height="84" rx="10" fill="url(#teal)"/>
<text x="180" y="49" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF"><tspan x="180">constitutional</tspan><tspan x="180" dy="1.2em">convention</tspan></text>
<rect x="238.6" y="16" width="109.3" height="84" rx="10" fill="url(#sky)"/>
<text x="293.3" y="31" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF"><tspan x="293.3">people's</tspan><tspan x="293.3" dy="1.2em">initiative</tspan><tspan x="293.3" dy="1.2em">(amendments</tspan><tspan x="293.3" dy="1.2em">only)</tspan></text>
<rect x="100" y="140" width="160" height="40" rx="10" fill="url(#sky)"/>
<text x="180" y="166" text-anchor="middle" font-family="Geist, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF"><tspan x="180">plebiscite</tspan></text>
<line x1="66.7" y1="100" x2="116.6" y2="134.8" stroke="#D6E6F5" stroke-width="2.5" stroke-linecap="round" fill="none"/>
<polygon points="124,140 112.4,139.2 119.2,129.4" fill="#D6E6F5"/>
<line x1="180" y1="100" x2="180" y2="131" stroke="#D6E6F5" stroke-width="2.5" stroke-linecap="round" fill="none"/>
<polygon points="180,140 174,130 186,130" fill="#D6E6F5"/>
<line x1="293.3" y1="100" x2="243.4" y2="134.8" stroke="#D6E6F5" stroke-width="2.5" stroke-linecap="round" fill="none"/>
<polygon points="236,140 240.8,129.4 247.6,139.2" fill="#D6E6F5"/>
<line x1="180" y1="180" x2="180" y2="203" stroke="#D6E6F5" stroke-width="2.5" stroke-linecap="round" fill="none"/>
<polygon points="180,212 174,202 186,202" fill="#D6E6F5"/>
<rect x="70" y="212" width="220" height="46" rx="10" fill="url(#warm)"/>
<text x="180" y="241" text-anchor="middle" font-family="Geist, sans-serif" font-size="16" font-weight="700" fill="#0E2747"><tspan x="180">majority of votes cast</tspan></text>
<line x1="180" y1="258" x2="180" y2="289" stroke="#D6E6F5" stroke-width="2.5" stroke-linecap="round" fill="none"/>
<polygon points="180,298 174,288 186,288" fill="#D6E6F5"/>
<rect x="100" y="298" width="160" height="44" rx="10" fill="url(#teal)"/>
<text x="180" y="325" text-anchor="middle" font-family="Geist, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF"><tspan x="180">valid change</tspan></text>
</svg>
