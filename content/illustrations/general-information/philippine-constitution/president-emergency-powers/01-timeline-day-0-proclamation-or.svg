<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" width="360" height="480">
<title>Timeline for martial law and suspension of the privilege of the writ of habeas corpus: Day 0, within 48 hours, Day 60, with a separate detention rule and notes on revocation and review</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#030303"/><stop offset="1" stop-color="#030303"/></linearGradient>
<radialGradient id="teal" cx="0.4" cy="0.3" r="0.8"><stop offset="0" stop-color="#050505" stop-opacity="0.22"/><stop offset="1" stop-color="#050505" stop-opacity="0.22"/></radialGradient>
<radialGradient id="sky" cx="0.4" cy="0.3" r="0.85"><stop offset="0" stop-color="#010101" stop-opacity="0.12"/><stop offset="1" stop-color="#010101" stop-opacity="0.12"/></radialGradient>
<radialGradient id="warm" cx="0.4" cy="0.3" r="0.9"><stop offset="0" stop-color="#050505" stop-opacity="0.45"/><stop offset="1" stop-color="#050505" stop-opacity="0.45"/></radialGradient>
</defs>
<rect width="360" height="480" rx="14" fill="url(#bg)"/>
<rect x="30" y="16" width="110" height="44" rx="10" fill="url(#teal)"/>
<text x="85" y="43" text-anchor="middle" font-family="Geist, sans-serif" font-size="15" font-weight="700" fill="#010101"><tspan x="85" y="43">Martial law</tspan></text>
<rect x="150" y="16" width="180" height="44" rx="10" fill="url(#sky)"/>
<text x="240" y="34" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#010101"><tspan x="240" y="34">privilege of the writ</tspan><tspan x="240" y="51">of habeas corpus</tspan></text>
<line x1="40" y1="60" x2="40" y2="240" stroke="#020202" stroke-width="2.5" stroke-linecap="butt"/>
<circle cx="40" cy="100" r="9" fill="url(#teal)" stroke="#020202" stroke-width="2"/>
<text x="64" y="96.5" text-anchor="start" font-family="Geist, sans-serif" font-size="15" font-weight="700" fill="#010101"><tspan x="64" y="96.5">Day 0:</tspan></text>
<text x="64" y="113.5" text-anchor="start" font-family="Geist, sans-serif" font-size="14" font-weight="400" fill="#020202"><tspan x="64" y="113.5">proclamation or suspension</tspan></text>
<circle cx="40" cy="170" r="9" fill="url(#teal)" stroke="#020202" stroke-width="2"/>
<text x="64" y="166.5" text-anchor="start" font-family="Geist, sans-serif" font-size="15" font-weight="700" fill="#010101"><tspan x="64" y="166.5">Within 48 hours:</tspan></text>
<text x="64" y="183.5" text-anchor="start" font-family="Geist, sans-serif" font-size="14" font-weight="400" fill="#020202"><tspan x="64" y="183.5">report to Congress</tspan></text>
<circle cx="40" cy="240" r="9" fill="url(#teal)" stroke="#020202" stroke-width="2"/>
<text x="64" y="236.5" text-anchor="start" font-family="Geist, sans-serif" font-size="15" font-weight="700" fill="#010101"><tspan x="64" y="236.5">Day 60:</tspan></text>
<text x="64" y="253.5" text-anchor="start" font-family="Geist, sans-serif" font-size="14" font-weight="400" fill="#020202"><tspan x="64" y="253.5">initial limit</tspan></text>
<line x1="16" y1="284" x2="344" y2="284" stroke="#020202" stroke-width="1.5" stroke-opacity="0.4" stroke-linecap="butt"/>
<rect x="60" y="298" width="240" height="66" rx="10" fill="#050505" fill-opacity="0.45"/>
<text x="180" y="319.5" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="700" fill="#010101"><tspan x="180" y="319.5">Detained under suspension:</tspan><tspan x="180" y="336.5">charge in court within</tspan><tspan x="180" y="353.5">3 days or release</tspan></text>
<line x1="16" y1="378" x2="344" y2="378" stroke="#020202" stroke-width="1.5" stroke-opacity="0.4" stroke-linecap="butt"/>
<rect x="75" y="394" width="210" height="30" rx="8" fill="#010101" fill-opacity="0.05" stroke="#020202" stroke-width="1.5" stroke-opacity="0.4"/>
<text x="180" y="414" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#010101"><tspan x="180" y="414">Congress may revoke</tspan></text>
<rect x="75" y="434" width="210" height="30" rx="8" fill="#010101" fill-opacity="0.05" stroke="#020202" stroke-width="1.5" stroke-opacity="0.4"/>
<text x="180" y="454" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#010101"><tspan x="180" y="454">Supreme Court may review</tspan></text>
</svg>
