<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" width="360" height="360">
<title>Checklist of four voting requirements that must all pass to get Pass, otherwise Fail</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0E2747"/><stop offset="1" stop-color="#143B63"/></linearGradient>
<radialGradient id="tl" cx="0.4" cy="0.3" r="0.85"><stop offset="0" stop-color="#2FB5B0"/><stop offset="1" stop-color="#17697F"/></radialGradient>
</defs>
<rect width="360" height="360" rx="14" fill="url(#bg)"/>
<rect x="44" y="16" width="300" height="40" rx="8" fill="#1A4975" stroke="#6FD0FF" stroke-opacity="0.4" stroke-width="1.5"/>
<rect x="56" y="26" width="20" height="20" rx="3" fill="none" stroke="#F2F7FB" stroke-width="2"/>
<text x="88" y="41" text-anchor="start" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">Filipino citizen</text>
<line x1="24" y1="36" x2="44" y2="36" stroke="#B7CBDD" stroke-width="1.5" stroke-linecap="butt"/>
<rect x="44" y="60" width="300" height="40" rx="8" fill="#1A4975" stroke="#6FD0FF" stroke-opacity="0.4" stroke-width="1.5"/>
<rect x="56" y="70" width="20" height="20" rx="3" fill="none" stroke="#F2F7FB" stroke-width="2"/>
<text x="88" y="85" text-anchor="start" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">At least 18 on election day</text>
<line x1="24" y1="80" x2="44" y2="80" stroke="#B7CBDD" stroke-width="1.5" stroke-linecap="butt"/>
<rect x="44" y="104" width="300" height="40" rx="8" fill="#1A4975" stroke="#6FD0FF" stroke-opacity="0.4" stroke-width="1.5"/>
<rect x="56" y="114" width="20" height="20" rx="3" fill="none" stroke="#F2F7FB" stroke-width="2"/>
<text x="88" y="121" text-anchor="start" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF"><tspan x="88">At least 1 year in the</tspan><tspan x="88" dy="16">Philippines</tspan></text>
<line x1="24" y1="124" x2="44" y2="124" stroke="#B7CBDD" stroke-width="1.5" stroke-linecap="butt"/>
<rect x="44" y="148" width="300" height="40" rx="8" fill="#1A4975" stroke="#6FD0FF" stroke-opacity="0.4" stroke-width="1.5"/>
<rect x="56" y="158" width="20" height="20" rx="3" fill="none" stroke="#F2F7FB" stroke-width="2"/>
<text x="88" y="165" text-anchor="start" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF"><tspan x="88">At least 6 months in the</tspan><tspan x="88" dy="16">voting place</tspan></text>
<line x1="24" y1="168" x2="44" y2="168" stroke="#B7CBDD" stroke-width="1.5" stroke-linecap="butt"/>
<line x1="24" y1="36" x2="24" y2="206" stroke="#B7CBDD" stroke-width="1.5" stroke-linecap="butt"/>
<line x1="24" y1="206" x2="24" y2="278" stroke="#B7CBDD" stroke-width="1.5" stroke-linecap="butt"/>
<circle cx="24" cy="206" r="8" fill="#FFC857"/>
<line x1="24" y1="236" x2="242" y2="236" stroke="#D6E6F5" stroke-width="2" stroke-linecap="butt"/>
<polygon points="250,236 242,240.5 242,231.5" fill="#D6E6F5"/>
<line x1="24" y1="280" x2="242" y2="280" stroke="#D6E6F5" stroke-width="2" stroke-linecap="butt"/>
<polygon points="250,280 242,284.5 242,275.5" fill="#D6E6F5"/>
<text x="40" y="228" text-anchor="start" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#D6E6F5">only if all boxes pass</text>
<text x="40" y="272" text-anchor="start" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#D6E6F5">if any fails</text>
<rect x="250" y="220" width="94" height="32" rx="10" fill="url(#tl)"/>
<text x="297" y="241" text-anchor="middle" font-family="Geist, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Pass</text>
<rect x="250" y="264" width="94" height="32" rx="10" fill="#2C6A98"/>
<text x="297" y="285" text-anchor="middle" font-family="Geist, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Fail</text>
<text x="180" y="322" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="400" fill="#D6E6F5"><tspan x="180">Also check registration</tspan><tspan x="180" dy="16">and legal disqualifications.</tspan></text>
</svg>
