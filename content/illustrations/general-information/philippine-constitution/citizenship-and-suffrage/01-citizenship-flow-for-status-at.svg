<text x="264.0" y="367.5" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF"><tspan x="264.0" y="367.5">Citizenship not</tspan><tspan x="264.0" y="384.5">established through</tspan><tspan x="264.0" y="401.5">this route</tspan></text>
