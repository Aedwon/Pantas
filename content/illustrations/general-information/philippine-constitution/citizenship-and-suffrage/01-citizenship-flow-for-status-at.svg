<rect width="360" height="627" rx="14" fill="url(#bg)"/>
<text x="180" y="34" text-anchor="middle" font-family="Geist, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF"><tspan x="180" y="34">Citizenship flow</tspan><tspan x="180" y="53">before any later loss</tspan></text>
