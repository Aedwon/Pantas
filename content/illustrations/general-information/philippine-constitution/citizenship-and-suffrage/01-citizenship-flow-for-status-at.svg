<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 627" width="360" height="627">
<title>Flow for checking citizenship: Filipino father at birth, then Filipino mother, birth before January 17, 1973 and Section 1(3), valid election, or separate checks for citizenship at adoption or naturalization</title>
