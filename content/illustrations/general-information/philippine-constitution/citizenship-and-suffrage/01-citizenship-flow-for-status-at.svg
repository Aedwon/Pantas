<text x="87.75" y="501.5" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF"><tspan x="87.75" y="501.5">citizenship when</tspan><tspan x="87.75" y="518.5">the Constitution</tspan><tspan x="87.75" y="535.5">was adopted</tspan></text>
<line x1="155.5" y1="513.5" x2="157.5" y2="513.5" stroke="#D6E6F5" stroke-width="2" stroke-linecap="butt"/>
