<rect x="16" y="431" width="328" height="180" rx="10" fill="none" stroke="#6FD0FF" stroke-width="1.5" stroke-opacity="0.4"/>
<text x="180" y="449" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF"><tspan x="180" y="449">Check citizenship when the Constitution</tspan><tspan x="180" y="466">was adopted or naturalization under law</tspan></text>
