<text x="252.5" y="501.5" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF"><tspan x="252.5" y="501.5">Citizen, natural-born</tspan><tspan x="252.5" y="518.5">status needs</tspan><tspan x="252.5" y="535.5">separate checking</tspan></text>
