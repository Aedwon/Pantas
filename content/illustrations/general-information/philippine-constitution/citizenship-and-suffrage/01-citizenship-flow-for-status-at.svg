<text x="95.0" y="291.5" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="700" fill="#0E2747"><tspan x="95.0" y="291.5">Deemed</tspan><tspan x="95.0" y="308.5">natural-born</tspan></text>
