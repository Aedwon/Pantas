<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 580" width="360" height="580">
<title>Flow chart of five yes or no questions that lead to natural-born citizen, naturalized citizen, or not established</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0E2747"/><stop offset="1" stop-color="#143B63"/></linearGradient>
<linearGradient id="pill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFD27A"/><stop offset="1" stop-color="#FFB347"/></linearGradient>
</defs>
<rect width="360" height="580" rx="14" fill="url(#bg)"/>
<text x="180" y="30" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="400" fill="#D6E6F5"><tspan x="180">status at acquisition,</tspan><tspan x="180" dy="16">before any later loss</tspan></text>
<rect x="34" y="56" width="202" height="112" rx="8" fill="#1A4975" stroke="#6FD0FF" stroke-opacity="0.4" stroke-width="1.5"/>
<text x="135" y="73" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF"><tspan x="135">Already a citizen when</tspan><tspan x="135" dy="16">the Constitution was</tspan><tspan x="135" dy="16">adopted?</tspan></text>
<line x1="46" y1="114" x2="224" y2="114" stroke="#6FD0FF" stroke-width="1.5" stroke-linecap="butt" stroke-opacity="0.4"/>
<text x="135" y="129" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="400" fill="#B8F0FF"><tspan x="135">Citizen, natural-born</tspan><tspan x="135" dy="16">status needs separate</tspan><tspan x="135" dy="16">checking</tspan></text>
<text x="44" y="161" text-anchor="start" font-family="Geist, sans-serif" font-size="14" font-weight="700" fill="#9ADFFF">Yes</text>
<rect x="31" y="184" width="208" height="76" rx="8" fill="#1A4975" stroke="#6FD0FF" stroke-opacity="0.4" stroke-width="1.5"/>
<text x="135" y="201" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF"><tspan x="135">Covered by Article IV</tspan><tspan x="135" dy="16">Section 1(3), born before</tspan><tspan x="135" dy="16">January 17, 1973 to a</tspan><tspan x="135" dy="16">Filipino mother?</tspan></text>
<rect x="34" y="276" width="202" height="112" rx="8" fill="#1A4975" stroke="#6FD0FF" stroke-opacity="0.4" stroke-width="1.5"/>
<text x="135" y="293" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF"><tspan x="135">Validly elected upon</tspan><tspan x="135" dy="16">majority?</tspan></text>
<line x1="46" y1="318" x2="224" y2="318" stroke="#6FD0FF" stroke-width="1.5" stroke-linecap="butt" stroke-opacity="0.4"/>
<text x="150" y="333" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="400" fill="#D6E6F5"><tspan x="150">Citizenship not</tspan><tspan x="150" dy="16">established through</tspan><tspan x="150" dy="16">this route, check</tspan><tspan x="150" dy="16">another legal basis</tspan></text>
<text x="44" y="349" text-anchor="start" font-family="Geist, sans-serif" font-size="14" font-weight="700" fill="#9ADFFF">No</text>
<rect x="31" y="404" width="208" height="44" rx="8" fill="#1A4975" stroke="#6FD0FF" stroke-opacity="0.4" stroke-width="1.5"/>
<text x="135" y="421" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF"><tspan x="135">Filipino father or mother</tspan><tspan x="135" dy="16">at birth?</tspan></text>
<rect x="34" y="464" width="202" height="100" rx="8" fill="#1A4975" stroke="#6FD0FF" stroke-opacity="0.4" stroke-width="1.5"/>
<text x="135" y="481" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">Naturalized under law?</text>
<line x1="46" y1="488" x2="224" y2="488" stroke="#6FD0FF" stroke-width="1.5" stroke-linecap="butt" stroke-opacity="0.4"/>
<text x="150" y="503" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="400" fill="#B8F0FF">Naturalized citizen</text>
<text x="44" y="503" text-anchor="start" font-family="Geist, sans-serif" font-size="14" font-weight="700" fill="#9ADFFF">Yes</text>
<line x1="46" y1="510" x2="224" y2="510" stroke="#6FD0FF" stroke-width="1.5" stroke-linecap="butt" stroke-opacity="0.4"/>
<text x="150" y="525" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="400" fill="#D6E6F5"><tspan x="150">Citizenship not</tspan><tspan x="150" dy="16">established by these</tspan><tspan x="150" dy="16">routes.</tspan></text>
<text x="44" y="541" text-anchor="start" font-family="Geist, sans-serif" font-size="14" font-weight="700" fill="#9ADFFF">No</text>
<line x1="135" y1="168" x2="135" y2="177" stroke="#D6E6F5" stroke-width="2" stroke-linecap="butt"/>
<polygon points="135,184 131,177 139,177" fill="#D6E6F5"/>
<text x="143" y="180" text-anchor="start" font-family="Geist, sans-serif" font-size="14" font-weight="700" fill="#9ADFFF">No</text>
<line x1="135" y1="260" x2="135" y2="269" stroke="#D6E6F5" stroke-width="2" stroke-linecap="butt"/>
<polygon points="135,276 131,269 139,269" fill="#D6E6F5"/>
<text x="143" y="272" text-anchor="start" font-family="Geist, sans-serif" font-size="14" font-weight="700" fill="#9ADFFF">Yes</text>
<line x1="135" y1="448" x2="135" y2="457" stroke="#D6E6F5" stroke-width="2" stroke-linecap="butt"/>
<polygon points="135,464 131,457 139,457" fill="#D6E6F5"/>
<text x="143" y="460" text-anchor="start" font-family="Geist, sans-serif" font-size="14" font-weight="700" fill="#9ADFFF">No</text>
<polyline points="31,240 24,240 24,426 26,426" fill="none" stroke="#D6E6F5" stroke-width="2" stroke-linejoin="round"/>
<polygon points="31,426 23,421.5 23,430.5" fill="#D6E6F5"/>
<text x="24" y="232" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="700" fill="#9ADFFF">No</text>
<defs></defs><rect x="239" y="322" width="105" height="56" rx="10" fill="url(#pill)"/>
<text x="291.5" y="346" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="700" fill="#0E2747"><tspan x="291.5">Natural-born</tspan><tspan x="291.5" dy="16">citizen</tspan></text>
<polyline points="236,296 291.5,296 291.5,314" fill="none" stroke="#D6E6F5" stroke-width="2" stroke-linejoin="round"/>
<polygon points="291.5,322 287,314 296,314" fill="#D6E6F5"/>
<text x="244" y="290" text-anchor="start" font-family="Geist, sans-serif" font-size="14" font-weight="700" fill="#9ADFFF">Yes</text>
<polyline points="239,426 291.5,426 291.5,386" fill="none" stroke="#D6E6F5" stroke-width="2" stroke-linejoin="round"/>
<polygon points="291.5,378 287,386 296,386" fill="#D6E6F5"/>
<text x="244" y="420" text-anchor="start" font-family="Geist, sans-serif" font-size="14" font-weight="700" fill="#9ADFFF">Yes</text>
</svg>
