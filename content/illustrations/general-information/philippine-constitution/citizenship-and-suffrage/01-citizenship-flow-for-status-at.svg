<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 548" width="360" height="548">
<title>Flow chart of five yes or no questions that lead to natural-born citizen, naturalized citizen, or not established</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0E2747"/><stop offset="1" stop-color="#143B63"/></linearGradient>
<linearGradient id="pill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFD27A"/><stop offset="1" stop-color="#FFB347"/></linearGradient>
</defs>
<rect width="360" height="548" rx="14" fill="url(#bg)"/>
<text x="180" y="30" text-anchor="middle" font-family="Source Sans 3, Arial, sans-serif" font-size="14" font-weight="400" fill="#D6E6F5"><tspan x="180">status at acquisition,</tspan><tspan x="180" dy="16">before any later loss</tspan></text>
<rect x="34" y="56" width="202" height="112" rx="8" fill="#1A4975" stroke="#6FD0FF" stroke-opacity="0.4" stroke-width="1.5"/>
<text x="135" y="73" text-anchor="middle" font-family="Source Sans 3, Arial, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF"><tspan x="135">Already a citizen when</tspan><tspan x="135" dy="16">the Constitution was</tspan><tspan x="135" dy="16">adopted?</tspan></text>
<line x1="46" y1="114" x2="224" y2="114" stroke="#6FD0FF" stroke-width="1.5" stroke-linecap="butt" stroke-opacity="0.4"/>
<text x="135" y="129" text-anchor="middle" font-family="Source Sans 3, Arial, sans-serif" font-size="14" font-weight="400" fill="#B8F0FF"><tspan x="135">Citizen, natural-born</tspan><tspan x="135" dy="16">status needs separate</tspan><tspan x="135" dy="16">checking</tspan></text>
<text x="44" y="161" text-anchor="start" font-family="Source Sans 3, Arial, sans-serif" font-size="14" font-weight="700" fill="#9ADFFF">Yes</text>
<rect x="34" y="184" width="202" height="76" rx="8" fill="#1A4975" stroke="#6FD0FF" stroke-opacity="0.4" stroke-width="1.5"/>
<text x="135" y="201" text-anchor="middle" font-family="Source Sans 3, Arial, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF"><tspan x="135">Covered by Article IV</tspan><tspan x="135" dy="16">Section 1(3), born before</tspan><tspan x="135" dy="16">January 17, 1973 to a</tspan><tspan x="135" dy="16">Filipino mother?</tspan></text>
<rect x="34" y="276" width="202" height="96" rx="8" fill="#1A4975" stroke="#6FD0FF" stroke-opacity="0.4" stroke-width="1.5"/>
<text x="135" y="293" text-anchor="middle" font-family="Source Sans 3, Arial, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF"><tspan x="135">Validly elected upon</tspan><tspan x="135" dy="16">majority?</tspan></text>
<line x1="46" y1="318" x2="224" y2="318" stroke="#6FD0FF" stroke-width="1.5" stroke-linecap="butt" stroke-opacity="0.4"/>
<text x="135" y="333" text-anchor="middle" font-family="Source Sans 3, Arial, sans-serif" font-size="14" font-weight="400" fill="#D6E6F5"><tspan x="135">Citizenship not established</tspan><tspan x="135" dy="16">through this route,</tspan><tspan x="135" dy="16">check another legal basis</tspan></text>
<text x="44" y="349" text-anchor="start" font-family="Source Sans 3, Arial, sans-serif" font-size="14" font-weight="700" fill="#9ADFFF">No</text>
<rect x="34" y="388" width="202" height="44" rx="8" fill="#1A4975" stroke="#6FD0FF" stroke-opacity="0.4" stroke-width="1.5"/>
<text x="135" y="405" text-anchor="middle" font-family="Source Sans 3, Arial, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF"><tspan x="135">Filipino father or mother</tspan><tspan x="135" dy="16">at birth?</tspan></text>
<rect x="34" y="448" width="202" height="84" rx="8" fill="#1A4975" stroke="#6FD0FF" stroke-opacity="0.4" stroke-width="1.5"/>
<text x="135" y="465" text-anchor="middle" font-family="Source Sans 3, Arial, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">Naturalized under law?</text>
<line x1="46" y1="472" x2="224" y2="472" stroke="#6FD0FF" stroke-width="1.5" stroke-linecap="butt" stroke-opacity="0.4"/>
<text x="135" y="487" text-anchor="middle" font-family="Source Sans 3, Arial, sans-serif" font-size="14" font-weight="400" fill="#B8F0FF">Naturalized citizen</text>
<text x="44" y="487" text-anchor="start" font-family="Source Sans 3, Arial, sans-serif" font-size="14" font-weight="700" fill="#9ADFFF">Yes</text>
<line x1="46" y1="494" x2="224" y2="494" stroke="#6FD0FF" stroke-width="1.5" stroke-linecap="butt" stroke-opacity="0.4"/>
<text x="135" y="509" text-anchor="middle" font-family="Source Sans 3, Arial, sans-serif" font-size="14" font-weight="400" fill="#D6E6F5"><tspan x="135">Citizenship not established</tspan><tspan x="135" dy="16">by these routes.</tspan></text>
<text x="44" y="525" text-anchor="start" font-family="Source Sans 3, Arial, sans-serif" font-size="14" font-weight="700" fill="#9ADFFF">No</text>
<line x1="135" y1="168" x2="135" y2="177" stroke="#D6E6F5" stroke-width="2" stroke-linecap="butt"/>
<polygon points="135,184 131,177 139,177" fill="#D6E6F5"/>
<text x="143" y="180" text-anchor="start" font-family="Source Sans 3, Arial, sans-serif" font-size="14" font-weight="700" fill="#9ADFFF">No</text>
<line x1="135" y1="260" x2="135" y2="269" stroke="#D6E6F5" stroke-width="2" stroke-linecap="butt"/>
<polygon points="135,276 131,269 139,269" fill="#D6E6F5"/>
<text x="143" y="272" text-anchor="start" font-family="Source Sans 3, Arial, sans-serif" font-size="14" font-weight="700" fill="#9ADFFF">Yes</text>
<line x1="135" y1="432" x2="135" y2="441" stroke="#D6E6F5" stroke-width="2" stroke-linecap="butt"/>
<polygon points="135,448 131,441 139,441" fill="#D6E6F5"/>
<text x="143" y="444" text-anchor="start" font-family="Source Sans 3, Arial, sans-serif" font-size="14" font-weight="700" fill="#9ADFFF">No</text>
<polyline points="34,240 24,240 24,410 27,410" fill="none" stroke="#D6E6F5" stroke-width="2" stroke-linejoin="round"/>
<polygon points="34,410 26,405.5 26,414.5" fill="#D6E6F5"/>
<text x="24" y="232" text-anchor="middle" font-family="Source Sans 3, Arial, sans-serif" font-size="14" font-weight="700" fill="#9ADFFF">No</text>
<defs></defs><rect x="250" y="322" width="94" height="56" rx="10" fill="url(#pill)"/>
<text x="297" y="346" text-anchor="middle" font-family="Source Sans 3, Arial, sans-serif" font-size="14" font-weight="700" fill="#0E2747"><tspan x="297">Natural-born</tspan><tspan x="297" dy="16">citizen</tspan></text>
<polyline points="236,296 297,296 297,314" fill="none" stroke="#D6E6F5" stroke-width="2" stroke-linejoin="round"/>
<polygon points="297,322 292.5,314 301.5,314" fill="#D6E6F5"/>
<text x="244" y="290" text-anchor="start" font-family="Source Sans 3, Arial, sans-serif" font-size="14" font-weight="700" fill="#9ADFFF">Yes</text>
<polyline points="236,410 297,410 297,386" fill="none" stroke="#D6E6F5" stroke-width="2" stroke-linejoin="round"/>
<polygon points="297,378 292.5,386 301.5,386" fill="#D6E6F5"/>
<text x="244" y="404" text-anchor="start" font-family="Source Sans 3, Arial, sans-serif" font-size="14" font-weight="700" fill="#9ADFFF">Yes</text>
</svg>
