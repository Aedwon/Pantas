<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" width="360" height="480">
<title>Checks between Congress, President and Courts: veto, veto override and appointment consent, impeachment, judicial review</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0E2747"/><stop offset="1" stop-color="#143B63"/></linearGradient>
<radialGradient id="teal" cx="0.4" cy="0.3" r="0.8"><stop offset="0" stop-color="#2FB5B0"/><stop offset="1" stop-color="#17697F"/></radialGradient>
<radialGradient id="sky" cx="0.4" cy="0.3" r="0.85"><stop offset="0" stop-color="#4DA9E0"/><stop offset="1" stop-color="#2468C8"/></radialGradient>
<radialGradient id="warm" cx="0.4" cy="0.3" r="0.9"><stop offset="0" stop-color="#FFD27A"/><stop offset="1" stop-color="#FFB347"/></radialGradient>
</defs>
<rect width="360" height="480" rx="14" fill="url(#bg)"/>
<rect x="16" y="60" width="110" height="44" rx="10" fill="url(#teal)"/>
<text x="71" y="88" text-anchor="middle" font-family="Source Sans 3, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF"><tspan x="71">Congress</tspan></text>
<rect x="234" y="60" width="110" height="44" rx="10" fill="url(#sky)"/>
<text x="289" y="88" text-anchor="middle" font-family="Source Sans 3, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF"><tspan x="289">President</tspan></text>
<path d="M234 74 Q180 30 134 71" fill="none" stroke="#D6E6F5" stroke-width="2.5" stroke-linecap="round"/>
<polygon points="126,74 130,63 137.5,72.3" fill="#D6E6F5"/>
<text x="180" y="40" text-anchor="middle" font-family="Source Sans 3, Arial, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF"><tspan x="180">veto</tspan></text>
<path d="M126 92 Q180 136 226 95" fill="none" stroke="#D6E6F5" stroke-width="2.5" stroke-linecap="round"/>
<polygon points="234,92 230,103 222.5,93.7" fill="#D6E6F5"/>
<text x="210" y="150" text-anchor="middle" font-family="Source Sans 3, Arial, sans-serif" font-size="14" font-weight="400" fill="#D6E6F5"><tspan x="210">veto override</tspan><tspan x="210" dy="1.2em">and consent to listed</tspan><tspan x="210" dy="1.2em">appointments through</tspan><tspan x="210" dy="1.2em">the Commission on</tspan><tspan x="210" dy="1.2em">Appointments</tspan></text>
<line x1="62" y1="104" x2="62" y2="253" stroke="#D6E6F5" stroke-width="2.5" stroke-linecap="round" fill="none"/>
<polygon points="62,262 56,252 68,252" fill="#D6E6F5"/>
<text x="44" y="190" text-anchor="middle" font-family="Source Sans 3, Arial, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" transform="rotate(-90 44 190)"><tspan x="44">impeachment</tspan></text>
<rect x="16" y="262" width="90" height="44" rx="8" fill="#143B63" stroke="#6FD0FF" stroke-width="2"/>
<text x="61" y="280" text-anchor="middle" font-family="Source Sans 3, Arial, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF"><tspan x="61">impeachable</tspan><tspan x="61" dy="1.2em">officers</tspan></text>
<rect x="130" y="412" width="100" height="44" rx="10" fill="#2C6A98" stroke="#6FD0FF" stroke-width="2"/>
<text x="180" y="440" text-anchor="middle" font-family="Source Sans 3, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF"><tspan x="180">Courts</tspan></text>
<line x1="180" y1="412" x2="180" y2="338" stroke="#FFC857" stroke-width="3" stroke-linecap="round" fill="none"/>
<line x1="118" y1="338" x2="300" y2="338" stroke="#FFC857" stroke-width="3" stroke-linecap="round" fill="none"/>
<line x1="118" y1="338" x2="118" y2="118" stroke="#FFC857" stroke-width="3" stroke-linecap="round" fill="none"/>
<polygon points="118,104 125,116 111,116" fill="#FFC857"/>
<line x1="300" y1="338" x2="300" y2="118" stroke="#FFC857" stroke-width="3" stroke-linecap="round" fill="none"/>
<polygon points="300,104 307,116 293,116" fill="#FFC857"/>
<text x="172" y="382" text-anchor="end" font-family="Source Sans 3, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFC857"><tspan x="172">judicial review</tspan></text>
</svg>
