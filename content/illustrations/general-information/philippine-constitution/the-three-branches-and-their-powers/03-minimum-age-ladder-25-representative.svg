<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 380" width="360" height="380">
<title>Minimum age ladder: 25 Representative, 35 Senator COMELEC COA, 40 President Vice-President Supreme Court Member Ombudsman; age alone is not full qualification</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#030303"/><stop offset="1" stop-color="#030303"/></linearGradient>
<radialGradient id="teal" cx="0.4" cy="0.3" r="0.8"><stop offset="0" stop-color="#050505" stop-opacity="0.22"/><stop offset="1" stop-color="#050505" stop-opacity="0.22"/></radialGradient>
<radialGradient id="sky" cx="0.4" cy="0.3" r="0.85"><stop offset="0" stop-color="#010101" stop-opacity="0.12"/><stop offset="1" stop-color="#010101" stop-opacity="0.12"/></radialGradient>
<radialGradient id="warm" cx="0.4" cy="0.3" r="0.9"><stop offset="0" stop-color="#050505" stop-opacity="0.45"/><stop offset="1" stop-color="#050505" stop-opacity="0.45"/></radialGradient>
</defs>
<rect width="360" height="380" rx="14" fill="url(#bg)"/>
<line x1="20" y1="20" x2="20" y2="272" stroke="#020202" stroke-width="3" stroke-linecap="round" fill="none" stroke-opacity="0.5"/>
<line x1="340" y1="20" x2="340" y2="272" stroke="#020202" stroke-width="3" stroke-linecap="round" fill="none" stroke-opacity="0.5"/>
<rect x="30" y="24" width="300" height="104" rx="10" fill="#010101" fill-opacity="0.3"/>
<rect x="30" y="24" width="300" height="104" rx="10" fill="none" stroke="#020202" stroke-width="1.5" stroke-opacity="0.4"/>
<rect x="30" y="24" width="58" height="104" rx="10" fill="url(#sky)"/>
<text x="59" y="83" text-anchor="middle" font-family="Geist, sans-serif" font-size="20" font-weight="700" fill="#010101"><tspan x="59">40</tspan></text>
<text x="102" y="63" text-anchor="start" font-family="Geist, sans-serif" font-size="15" font-weight="600" fill="#010101"><tspan x="102">President, Vice-President,</tspan><tspan x="102" dy="1.2em">Supreme Court Member,</tspan><tspan x="102" dy="1.2em">Ombudsman</tspan></text>
<rect x="30" y="140" width="300" height="60" rx="10" fill="#010101" fill-opacity="0.3"/>
<rect x="30" y="140" width="300" height="60" rx="10" fill="none" stroke="#020202" stroke-width="1.5" stroke-opacity="0.4"/>
<rect x="30" y="140" width="58" height="60" rx="10" fill="url(#sky)"/>
<text x="59" y="177" text-anchor="middle" font-family="Geist, sans-serif" font-size="20" font-weight="700" fill="#010101"><tspan x="59">35</tspan></text>
<text x="102" y="175" text-anchor="start" font-family="Geist, sans-serif" font-size="15" font-weight="600" fill="#010101"><tspan x="102">Senator, COMELEC, COA</tspan></text>
<rect x="30" y="212" width="300" height="60" rx="10" fill="#010101" fill-opacity="0.3"/>
<rect x="30" y="212" width="300" height="60" rx="10" fill="none" stroke="#020202" stroke-width="1.5" stroke-opacity="0.4"/>
<rect x="30" y="212" width="58" height="60" rx="10" fill="url(#sky)"/>
<text x="59" y="249" text-anchor="middle" font-family="Geist, sans-serif" font-size="20" font-weight="700" fill="#010101"><tspan x="59">25</tspan></text>
<text x="102" y="247" text-anchor="start" font-family="Geist, sans-serif" font-size="15" font-weight="600" fill="#010101"><tspan x="102">Representative</tspan></text>
<rect x="16" y="294" width="328" height="70" rx="10" fill="#050505" fill-opacity="0.45"/>
<text x="180" y="322" text-anchor="middle" font-family="Geist, sans-serif" font-size="17" font-weight="700" fill="#010101"><tspan x="180">Age alone is not</tspan><tspan x="180" dy="1.2em">full qualification</tspan></text>
</svg>
