<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" width="360" height="360">
<title>Vertical bar chart titled Monthly Sales with bars for January 50, February 70, March 60 and April 90 on a 0 to 100 scale</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#030303"/><stop offset="1" stop-color="#030303"/></linearGradient>
</defs>
<rect width="360" height="360" rx="14" fill="url(#bg)"/>
<text x="180" y="32" text-anchor="middle" font-family="Geist, sans-serif" font-size="17" font-weight="700" fill="#010101"><tspan x="180">Monthly Sales</tspan></text>
<line x1="62" y1="300" x2="68" y2="300" stroke="#020202" stroke-width="1.5" stroke-linecap="round" fill="none"/>
<text x="58" y="305" text-anchor="end" font-family="Geist, sans-serif" font-size="14" font-weight="400" fill="#010101"><tspan x="58">0</tspan></text>
<line x1="68" y1="276" x2="344" y2="276" stroke="#020202" stroke-width="1" stroke-linecap="round" fill="none" stroke-opacity="0.2"/>
