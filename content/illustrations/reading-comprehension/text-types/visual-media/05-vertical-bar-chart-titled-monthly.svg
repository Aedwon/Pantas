<text x="28" y="180" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="700" fill="#050505" transform="rotate(-90 28 180)"><tspan x="28">Sales (thousands of pesos)</tspan></text>
<rect x="79.5" y="180" width="46" height="120" rx="4" fill="#010101" fill-opacity="0.12"/>
<text x="102.5" y="322" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#010101"><tspan x="102.5">January</tspan></text>
<rect x="148.5" y="132" width="46" height="168" rx="4" fill="#010101" fill-opacity="0.12"/>
