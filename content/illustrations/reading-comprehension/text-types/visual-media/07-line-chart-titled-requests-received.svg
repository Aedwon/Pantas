<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 340" width="360" height="340">
<title>Line chart titled Requests Received with points Monday 50, Tuesday 60, Wednesday 55, Thursday 65 joined in order</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#030303"/><stop offset="1" stop-color="#030303"/></linearGradient>
</defs>
<rect width="360" height="340" rx="14" fill="url(#bg)"/>
<text x="180" y="32" text-anchor="middle" font-family="Geist, sans-serif" font-size="17" font-weight="700" fill="#010101"><tspan x="180">Requests Received</tspan></text>
<line x1="54" y1="290" x2="60" y2="290" stroke="#020202" stroke-width="1.5" stroke-linecap="round" fill="none"/>
<text x="50" y="295" text-anchor="end" font-family="Geist, sans-serif" font-size="14" font-weight="400" fill="#010101"><tspan x="50">40</tspan></text>
<line x1="60" y1="250" x2="344" y2="250" stroke="#020202" stroke-width="1" stroke-linecap="round" fill="none" stroke-opacity="0.2"/>
<line x1="54" y1="250" x2="60" y2="250" stroke="#020202" stroke-width="1.5" stroke-linecap="round" fill="none"/>
<text x="50" y="255" text-anchor="end" font-family="Geist, sans-serif" font-size="14" font-weight="400" fill="#010101"><tspan x="50">45</tspan></text>
<line x1="60" y1="210" x2="344" y2="210" stroke="#020202" stroke-width="1" stroke-linecap="round" fill="none" stroke-opacity="0.2"/>
<line x1="54" y1="210" x2="60" y2="210" stroke="#020202" stroke-width="1.5" stroke-linecap="round" fill="none"/>
<text x="50" y="215" text-anchor="end" font-family="Geist, sans-serif" font-size="14" font-weight="400" fill="#010101"><tspan x="50">50</tspan></text>
<line x1="60" y1="170" x2="344" y2="170" stroke="#020202" stroke-width="1" stroke-linecap="round" fill="none" stroke-opacity="0.2"/>
<line x1="54" y1="170" x2="60" y2="170" stroke="#020202" stroke-width="1.5" stroke-linecap="round" fill="none"/>
<text x="50" y="175" text-anchor="end" font-family="Geist, sans-serif" font-size="14" font-weight="400" fill="#010101"><tspan x="50">55</tspan></text>
<line x1="60" y1="130" x2="344" y2="130" stroke="#020202" stroke-width="1" stroke-linecap="round" fill="none" stroke-opacity="0.2"/>
<line x1="54" y1="130" x2="60" y2="130" stroke="#020202" stroke-width="1.5" stroke-linecap="round" fill="none"/>
<text x="50" y="135" text-anchor="end" font-family="Geist, sans-serif" font-size="14" font-weight="400" fill="#010101"><tspan x="50">60</tspan></text>
<line x1="60" y1="90" x2="344" y2="90" stroke="#020202" stroke-width="1" stroke-linecap="round" fill="none" stroke-opacity="0.2"/>
<line x1="54" y1="90" x2="60" y2="90" stroke="#020202" stroke-width="1.5" stroke-linecap="round" fill="none"/>
<text x="50" y="95" text-anchor="end" font-family="Geist, sans-serif" font-size="14" font-weight="400" fill="#010101"><tspan x="50">65</tspan></text>
<line x1="60" y1="72" x2="60" y2="290" stroke="#020202" stroke-width="2" stroke-linecap="round" fill="none"/>
<line x1="60" y1="290" x2="344" y2="290" stroke="#020202" stroke-width="2" stroke-linecap="round" fill="none"/>
<text x="27" y="181" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#010101" transform="rotate(-90 27 181)"><tspan x="27">Requests</tspan></text>
<text x="95.5" y="312" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#010101"><tspan x="95.5">Monday</tspan></text>
<text x="166.5" y="312" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#010101"><tspan x="166.5">Tuesday</tspan></text>
<text x="237.5" y="312" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#010101"><tspan x="237.5">Wednesday</tspan></text>
<text x="308.5" y="312" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#010101"><tspan x="308.5">Thursday</tspan></text>
<polyline points="95.5,210 166.5,130 237.5,170 308.5,90" fill="none" stroke="#050505" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="95.5" cy="210" r="5.5" fill="#050505" fill-opacity="0.45" stroke="#020202" stroke-width="1.5"/>
<circle cx="166.5" cy="130" r="5.5" fill="#050505" fill-opacity="0.45" stroke="#020202" stroke-width="1.5"/>
<circle cx="237.5" cy="170" r="5.5" fill="#050505" fill-opacity="0.45" stroke="#020202" stroke-width="1.5"/>
<circle cx="308.5" cy="90" r="5.5" fill="#050505" fill-opacity="0.45" stroke="#020202" stroke-width="1.5"/>
