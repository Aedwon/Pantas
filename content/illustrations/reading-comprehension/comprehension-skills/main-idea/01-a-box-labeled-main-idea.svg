<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280" width="360" height="280">
<title>One main idea box joined by plain lines to three supporting detail boxes</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#030303"/><stop offset="1" stop-color="#030303"/></linearGradient>
<radialGradient id="tl" cx="0.4" cy="0.3" r="0.8"><stop offset="0" stop-color="#050505" stop-opacity="0.22"/><stop offset="1" stop-color="#050505" stop-opacity="0.22"/></radialGradient>
<radialGradient id="sk" cx="0.4" cy="0.3" r="0.85"><stop offset="0" stop-color="#010101" stop-opacity="0.12"/><stop offset="1" stop-color="#010101" stop-opacity="0.12"/></radialGradient>
<radialGradient id="wm" cx="0.4" cy="0.3" r="0.9"><stop offset="0" stop-color="#050505" stop-opacity="0.45"/><stop offset="1" stop-color="#050505" stop-opacity="0.45"/></radialGradient>
<linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#010101" stop-opacity="0.12"/><stop offset="1" stop-color="#010101" stop-opacity="0.05"/></linearGradient>
<linearGradient id="land" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#050505" stop-opacity="0.22"/><stop offset="1" stop-color="#050505" stop-opacity="0.22"/></linearGradient>
<linearGradient id="cl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#030303"/><stop offset="1" stop-color="#020202"/></linearGradient>

</defs>
<rect width="360" height="280" rx="14" fill="url(#bg)"/>
<path d="M180 64 L180 80 L70 80 L70 242" fill="none" stroke="#020202" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="70" y1="118" x2="90" y2="118" stroke="#020202" stroke-width="2.5" stroke-linecap="round"/>
<line x1="70" y1="180" x2="90" y2="180" stroke="#020202" stroke-width="2.5" stroke-linecap="round"/>
<line x1="70" y1="242" x2="90" y2="242" stroke="#020202" stroke-width="2.5" stroke-linecap="round"/>
<rect x="110" y="16" width="140" height="48" rx="10" fill="url(#wm)"/>
<text x="180" y="46" text-anchor="middle" font-family="Geist, sans-serif" font-size="16" font-weight="700" fill="#010101">Main idea</text>
<rect x="90" y="96" width="180" height="44" rx="10" fill="#010101" fill-opacity="0.12" stroke="#020202" stroke-width="1.5" stroke-opacity="0.5"/>
<text x="180" y="123.2" text-anchor="middle" font-family="Geist, sans-serif" font-size="15" font-weight="600" fill="#010101">Supporting detail</text>
<rect x="90" y="158" width="180" height="44" rx="10" fill="#010101" fill-opacity="0.12" stroke="#020202" stroke-width="1.5" stroke-opacity="0.5"/>
<text x="180" y="185.2" text-anchor="middle" font-family="Geist, sans-serif" font-size="15" font-weight="600" fill="#010101">Supporting detail</text>
<rect x="90" y="220" width="180" height="44" rx="10" fill="#010101" fill-opacity="0.12" stroke="#020202" stroke-width="1.5" stroke-opacity="0.5"/>
<text x="180" y="247.2" text-anchor="middle" font-family="Geist, sans-serif" font-size="15" font-weight="600" fill="#010101">Supporting detail</text>
</svg>
