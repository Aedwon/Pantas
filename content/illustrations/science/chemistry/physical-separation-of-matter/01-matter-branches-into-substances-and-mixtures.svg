<line x1="262" y1="138" x2="262" y2="159" fill="none" stroke="#020202" stroke-width="2" stroke-linecap="round"/>
<path d="M34 138 H17 V270 H20 M326 138 H343 V270 H340" fill="none" fill-opacity="1" stroke="#020202" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="121" y="21" width="118" height="40" rx="8" fill="#010101" fill-opacity="0.05" stroke="none" stroke-width="1.5"/>
<text x="180.0" y="46.0" fill="#010101" text-anchor="middle" font-size="14" font-weight="600" font-family="Geist, sans-serif">Matter</text>
<rect x="20" y="98" width="156" height="40" rx="8" fill="#010101" fill-opacity="0.05" stroke="none" stroke-width="1.5"/>
<text x="98.0" y="123.0" fill="#010101" text-anchor="middle" font-size="14" font-weight="600" font-family="Geist, sans-serif">Pure substance</text>
<rect x="184" y="98" width="156" height="40" rx="8" fill="#050505" fill-opacity="0.22" stroke="none" stroke-width="1.5"/>
<text x="262.0" y="123.0" fill="#010101" text-anchor="middle" font-size="14" font-weight="600" font-family="Geist, sans-serif">Mixture</text>
<rect x="20" y="159" width="156" height="50" rx="8" fill="#010101" fill-opacity="0.05" stroke="none" stroke-width="1.5"/>
<text x="98.0" y="189.0" fill="#010101" text-anchor="middle" font-size="14" font-weight="600" font-family="Geist, sans-serif">Element: O₂</text>
<rect x="20" y="231" width="156" height="78" rx="8" fill="#010101" fill-opacity="0.05" stroke="none" stroke-width="1.5"/>
<text x="98.0" y="275.0" fill="#010101" text-anchor="middle" font-size="14" font-weight="600" font-family="Geist, sans-serif">Compound: H₂O</text>
