<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 287" width="360" height="287">
<title>Show the measured heights on the chromatogram from the core concept.</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#030303"/><stop offset="1" stop-color="#030303"/></linearGradient>
<radialGradient id="depth" cx="0.4" cy="0.3" r="0.7"><stop offset="0" stop-color="#050505" stop-opacity="0.45"/><stop offset="1" stop-color="#050505" stop-opacity="0.12"/></radialGradient>
</defs>
<rect width="360" height="287" rx="14" fill="url(#bg)"/>
<rect x="61" y="20" width="173" height="248" rx="6" fill="#010101" fill-opacity="0.05" stroke="#020202" stroke-width="1.5"/>
<line x1="71" y1="45" x2="225" y2="45" fill="none" stroke="#020202" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 5"/>
<line x1="71" y1="225" x2="225" y2="225" fill="none" stroke="#020202" stroke-width="2" stroke-linecap="round"/>
<text x="146" y="36" fill="#010101" text-anchor="middle" font-size="14" font-weight="600" font-family="Geist, sans-serif">solvent front</text>
<text x="146" y="250" fill="#010101" text-anchor="middle" font-size="14" font-weight="600" font-family="Geist, sans-serif">pencil baseline</text>
<circle cx="95" cy="180" r="7" fill="url(#depth)" fill-opacity="1" stroke="#050505" stroke-width="1.5"/>
<text x="95" y="166" fill="#010101" text-anchor="middle" font-size="14" font-weight="600" font-family="Geist, sans-serif">A</text>
<line x1="105" y1="180" x2="242" y2="180" fill="none" stroke="#020202" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 5"/>
<text x="285" y="185" fill="#010101" text-anchor="middle" font-size="14" font-weight="600" font-family="Geist, sans-serif"><tspan font-family="KaTeX_Main, serif" font-weight="400">1.5 cm</tspan></text>
<circle cx="143" cy="135" r="7" fill="url(#depth)" fill-opacity="1" stroke="#050505" stroke-width="1.5"/>
<text x="143" y="121" fill="#010101" text-anchor="middle" font-size="14" font-weight="600" font-family="Geist, sans-serif">B</text>
<line x1="153" y1="135" x2="242" y2="135" fill="none" stroke="#020202" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 5"/>
<text x="285" y="140" fill="#010101" text-anchor="middle" font-size="14" font-weight="600" font-family="Geist, sans-serif"><tspan font-family="KaTeX_Main, serif" font-weight="400">3.0 cm</tspan></text>
<circle cx="190" cy="90" r="7" fill="url(#depth)" fill-opacity="1" stroke="#050505" stroke-width="1.5"/>
<text x="190" y="76" fill="#010101" text-anchor="middle" font-size="14" font-weight="600" font-family="Geist, sans-serif">C</text>
<line x1="200" y1="90" x2="242" y2="90" fill="none" stroke="#020202" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 5"/>
<text x="285" y="95" fill="#010101" text-anchor="middle" font-size="14" font-weight="600" font-family="Geist, sans-serif"><tspan font-family="KaTeX_Main, serif" font-weight="400">4.5 cm</tspan></text>
<line x1="225" y1="45" x2="246" y2="45" fill="none" stroke="#020202" stroke-width="2" stroke-linecap="round"/>
<text x="285" y="50" fill="#010101" text-anchor="middle" font-size="14" font-weight="600" font-family="Geist, sans-serif"><tspan font-family="KaTeX_Main, serif" font-weight="400">6.0 cm</tspan></text>
<line x1="241" y1="225" x2="248" y2="225" fill="none" stroke="#020202" stroke-width="2" stroke-linecap="round"/>
</svg>
