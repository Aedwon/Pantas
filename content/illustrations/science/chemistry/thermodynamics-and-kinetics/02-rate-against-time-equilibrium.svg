<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280" width="360" height="280">
<title>Rate against time: the forward rate falls and the reverse rate rises until they meet at equilibrium, then both continue at the same constant rate</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#030303"/><stop offset="1" stop-color="#030303"/></linearGradient>

</defs>
<rect width="360" height="280" rx="14" fill="url(#bg)"/>
<line x1="40" y1="230" x2="344" y2="230" stroke="#020202" stroke-width="1.5" stroke-linecap="round"/>
<line x1="40" y1="230" x2="40" y2="50" stroke="#020202" stroke-width="1.5" stroke-linecap="round"/>
<text x="40" y="38" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#010101">rate</text>
<text x="192" y="258" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#010101">time</text>
<path d="M40 62 C90 118 150 138 240 140" fill="none" stroke="#010101" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M40 230 C90 170 150 145 240 140" fill="none" stroke="#020202" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="240" y1="140" x2="340" y2="140" stroke="#050505" stroke-width="3" stroke-linecap="round"/>
<line x1="240" y1="146" x2="240" y2="230" stroke="#020202" stroke-width="1.5" stroke-dasharray="4 4" stroke-linecap="round"/>
<circle cx="240" cy="140" r="5.5" fill="#050505"/>
<text x="64" y="56" text-anchor="start" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#010101">forward rate</text>
<text x="100" y="214" text-anchor="start" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#020202">reverse rate</text>
<text x="252" y="120" text-anchor="start" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#050505">equilibrium</text>
</svg>
