<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 245" width="360" height="245">
<title>Show the reactant amounts used and left over in Example #1.</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#030303"/><stop offset="1" stop-color="#030303"/></linearGradient>
<radialGradient id="depth" cx="0.4" cy="0.3" r="0.7"><stop offset="0" stop-color="#050505" stop-opacity="0.45"/><stop offset="1" stop-color="#050505" stop-opacity="0.12"/></radialGradient>
</defs>
<rect width="360" height="245" rx="14" fill="url(#bg)"/>
<text x="180" y="38" fill="#010101" text-anchor="middle" font-size="14" font-weight="600" font-family="Geist, sans-serif"><tspan font-family="KaTeX_Main, serif" font-weight="400">N₂ + 3H₂ → 2NH₃</tspan></text>
<text x="26" y="106" fill="#010101" text-anchor="start" font-size="14" font-weight="600" font-family="Geist, sans-serif"><tspan font-family="KaTeX_Main, serif" font-weight="400">N₂</tspan></text>
<rect x="65" y="85" width="108" height="32" rx="0" fill="#030303" fill-opacity="1" stroke="#020202" stroke-width="1.5"/>
<rect x="65" y="85" width="81" height="32" rx="0" fill="#050505" fill-opacity="0.45" stroke="#020202" stroke-width="1.5"/>
<text x="119.0" y="74" fill="#010101" text-anchor="middle" font-size="14" font-weight="600" font-family="Geist, sans-serif"><tspan font-family="KaTeX_Main, serif" font-weight="400">4 mol</tspan></text>
<text x="105.5" y="106" fill="#010101" text-anchor="middle" font-size="14" font-weight="600" font-family="Geist, sans-serif"><tspan font-family="KaTeX_Main, serif" font-weight="400">3 mol</tspan></text>
<text x="26" y="202" fill="#010101" text-anchor="start" font-size="14" font-weight="600" font-family="Geist, sans-serif"><tspan font-family="KaTeX_Main, serif" font-weight="400">H₂</tspan></text>
<rect x="65" y="181" width="243" height="32" rx="0" fill="#030303" fill-opacity="1" stroke="#020202" stroke-width="1.5"/>
<rect x="65" y="181" width="243" height="32" rx="0" fill="#050505" fill-opacity="0.45" stroke="#020202" stroke-width="1.5"/>
<text x="186.5" y="170" fill="#010101" text-anchor="middle" font-size="14" font-weight="600" font-family="Geist, sans-serif"><tspan font-family="KaTeX_Main, serif" font-weight="400">9 mol</tspan></text>
<text x="186.5" y="202" fill="#010101" text-anchor="middle" font-size="14" font-weight="600" font-family="Geist, sans-serif"><tspan font-family="KaTeX_Main, serif" font-weight="400">9 mol</tspan></text>
<line x1="160" y1="117" x2="160" y2="134" fill="none" stroke="#020202" stroke-width="2" stroke-linecap="round"/>
<text x="160" y="154" fill="#010101" text-anchor="middle" font-size="14" font-weight="600" font-family="Geist, sans-serif"><tspan font-family="KaTeX_Main, serif" font-weight="400">1 mol left</tspan></text>
</svg>
