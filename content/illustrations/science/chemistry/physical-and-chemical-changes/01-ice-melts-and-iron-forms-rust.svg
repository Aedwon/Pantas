<path d="M94 221 C88 234 79 239 79 248 A15 15 0 0 0 109 248 C109 239 100 234 94 221 Z" fill="url(#depth)" fill-opacity="1" stroke="#020202" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
