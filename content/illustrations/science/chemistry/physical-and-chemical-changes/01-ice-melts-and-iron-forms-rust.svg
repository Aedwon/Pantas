<rect x="232" y="232" width="68" height="23" rx="4" fill="#010101" fill-opacity="0.12" stroke="#020202" stroke-width="1.5"/>
<path d="M233 240 L242 236 L249 241 L257 233 L267 236 L280 232 L291 239 L299 235 V251 H233 Z" fill="#050505" fill-opacity="0.45" stroke="#050505" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="94" y="113" fill="#010101" text-anchor="middle" font-size="14" font-weight="600" font-family="Geist, sans-serif">ice</text>
<text x="94" y="274" fill="#010101" text-anchor="middle" font-size="14" font-weight="600" font-family="Geist, sans-serif">water</text>
<text x="266" y="113" fill="#010101" text-anchor="middle" font-size="14" font-weight="600" font-family="Geist, sans-serif">iron</text>
<text x="266" y="274" fill="#010101" text-anchor="middle" font-size="14" font-weight="600" font-family="Geist, sans-serif">rust</text>
