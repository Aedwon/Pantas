<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 298" width="360" height="298">
<title>Compare melting ice with rusting iron.</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#030303"/><stop offset="1" stop-color="#030303"/></linearGradient>
<radialGradient id="depth" cx="0.4" cy="0.3" r="0.7"><stop offset="0" stop-color="#050505" stop-opacity="0.45"/><stop offset="1" stop-color="#050505" stop-opacity="0.12"/></radialGradient>
</defs>
<rect width="360" height="298" rx="14" fill="url(#bg)"/>
<rect x="18" y="17" width="152" height="264" rx="8" fill="#010101" fill-opacity="0.05" stroke="none" stroke-width="1.5"/>
<text x="94" y="43" fill="#010101" text-anchor="middle" font-size="15" font-weight="600" font-family="Geist, sans-serif">Physical change:</text>
<text x="94" y="65" fill="#010101" text-anchor="middle" font-size="14" font-weight="600" font-family="Geist, sans-serif">substance stays</text>
<text x="94" y="83" fill="#010101" text-anchor="middle" font-size="14" font-weight="600" font-family="Geist, sans-serif">the same</text>
