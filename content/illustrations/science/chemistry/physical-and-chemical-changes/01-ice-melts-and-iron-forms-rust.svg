<text x="266" y="43" fill="#010101" text-anchor="middle" font-size="15" font-weight="600" font-family="Geist, sans-serif">Chemical change:</text>
<text x="266" y="65" fill="#010101" text-anchor="middle" font-size="14" font-weight="600" font-family="Geist, sans-serif">new substance</text>
<text x="266" y="83" fill="#010101" text-anchor="middle" font-size="14" font-weight="600" font-family="Geist, sans-serif">forms</text>
