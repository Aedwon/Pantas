</defs>
<rect width="360" height="292" rx="14" fill="url(#bg)"/>
<rect x="17" y="19" width="326" height="76" rx="8" fill="#010101" fill-opacity="0.05" stroke="none" stroke-width="1.5"/>
<text x="107" y="53" fill="#010101" text-anchor="end" font-size="17" font-weight="600" font-family="Geist, sans-serif"><tspan font-family="KaTeX_Main, serif" font-weight="400">CH₃</tspan></text>
