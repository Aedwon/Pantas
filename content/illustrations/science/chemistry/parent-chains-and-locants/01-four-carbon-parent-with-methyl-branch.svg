<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 163" width="360" height="163">
<title>Show how a four-carbon parent chain is numbered.</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#030303"/><stop offset="1" stop-color="#030303"/></linearGradient>
<radialGradient id="depth" cx="0.4" cy="0.3" r="0.7"><stop offset="0" stop-color="#050505" stop-opacity="0.45"/><stop offset="1" stop-color="#050505" stop-opacity="0.12"/></radialGradient>
</defs>
<rect width="360" height="163" rx="14" fill="url(#bg)"/>
<line x1="139" y1="88" x2="139" y2="53" fill="none" stroke="#020202" stroke-width="2" stroke-linecap="round"/>
<line x1="57" y1="113" x2="139" y2="88" fill="none" stroke="#050505" stroke-width="3" stroke-linecap="round"/>
<line x1="139" y1="88" x2="221" y2="113" fill="none" stroke="#050505" stroke-width="3" stroke-linecap="round"/>
<line x1="221" y1="113" x2="303" y2="88" fill="none" stroke="#050505" stroke-width="3" stroke-linecap="round"/>
<circle cx="57" cy="113" r="3.5" fill="#050505" fill-opacity="1" stroke="none" stroke-width="1.5"/>
<text x="57" y="142" fill="#010101" text-anchor="middle" font-size="14" font-weight="600" font-family="Geist, sans-serif"><tspan font-family="KaTeX_Main, serif" font-weight="400">1</tspan></text>
<circle cx="139" cy="88" r="3.5" fill="#050505" fill-opacity="1" stroke="none" stroke-width="1.5"/>
<text x="139" y="117" fill="#010101" text-anchor="middle" font-size="14" font-weight="600" font-family="Geist, sans-serif"><tspan font-family="KaTeX_Main, serif" font-weight="400">2</tspan></text>
<circle cx="221" cy="113" r="3.5" fill="#050505" fill-opacity="1" stroke="none" stroke-width="1.5"/>
<text x="221" y="142" fill="#010101" text-anchor="middle" font-size="14" font-weight="600" font-family="Geist, sans-serif"><tspan font-family="KaTeX_Main, serif" font-weight="400">3</tspan></text>
<circle cx="303" cy="88" r="3.5" fill="#050505" fill-opacity="1" stroke="none" stroke-width="1.5"/>
<text x="303" y="117" fill="#010101" text-anchor="middle" font-size="14" font-weight="600" font-family="Geist, sans-serif"><tspan font-family="KaTeX_Main, serif" font-weight="400">4</tspan></text>
<text x="139" y="39" fill="#010101" text-anchor="middle" font-size="14" font-weight="600" font-family="Geist, sans-serif">methyl</text>
</svg>
