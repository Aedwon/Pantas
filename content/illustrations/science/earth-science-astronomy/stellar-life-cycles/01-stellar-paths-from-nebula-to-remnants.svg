  <text x="94" y="243" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#010101">red giant</text>
  <rect x="190.0" y="222" width="152" height="32" rx="7" fill="url(#tile)" stroke="#020202" stroke-width="1.5"/>
  <text x="266" y="243" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#010101">supergiant</text>
