  <polygon points="94.0,271.0 90.0,263.0 98.0,263.0" fill="#020202"/>
  <path d="M266 254 L266 271" fill="none" stroke="#020202" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="266.0,271.0 262.0,263.0 270.0,263.0" fill="#020202"/>
  <rect x="18.5" y="271" width="151" height="32" rx="7" fill="url(#tile)" stroke="#020202" stroke-width="1.5"/>
  <text x="94" y="292" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#010101">planetary nebula</text>
  <rect x="190.0" y="271" width="152" height="32" rx="7" fill="url(#tile)" stroke="#020202" stroke-width="1.5"/>
  <text x="266" y="292" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#010101">supernova</text>
  <path d="M94 303 L94 320" fill="none" stroke="#020202" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="94.0,320.0 90.0,312.0 98.0,312.0" fill="#020202"/>
  <path d="M266 303 L266 320" fill="none" stroke="#020202" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="266.0,320.0 262.0,312.0 270.0,312.0" fill="#020202"/>
  <rect x="18.5" y="320" width="151" height="32" rx="7" fill="url(#tile)" stroke="#020202" stroke-width="1.5"/>
  <text x="94" y="341" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#010101">white dwarf</text>
  <rect x="190" y="320" width="152" height="56" rx="7" fill="url(#tile)" stroke="#020202" stroke-width="1.5"/>
  <text x="266" y="342" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#010101">neutron star</text>
  <text x="266" y="362" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#010101">or black hole</text>
