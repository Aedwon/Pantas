  <rect x="98.0" y="67" width="164" height="32" rx="7" fill="url(#tile)" stroke="#020202" stroke-width="1.5"/>
  <text x="180" y="88" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#010101">protostar</text>
  <path d="M180 99 L180 116" fill="none" stroke="#020202" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
