<circle cx="180" cy="340" r="14" fill="none" stroke="#010101" stroke-width="1.8"/>
<line x1="180" y1="358" x2="180" y2="383.6" stroke="#020202" stroke-width="2" stroke-linecap="round"/>
<polygon points="180,390 175.5,382 184.5,382" fill="#020202"/>
<circle cx="172" cy="394" r="2.2" fill="#010101"/>
<circle cx="187" cy="403" r="2.2" fill="#010101"/>
<circle cx="180" cy="409" r="2.2" fill="#010101"/>
<circle cx="80" cy="240" r="14" fill="url(#eg)"/>
<path d="M80 226 A14 14 0 0 0 80 254 Z" fill="#010101" fill-opacity="0.32"/>
<circle cx="80" cy="240" r="14" fill="none" stroke="#010101" stroke-width="1.8"/>
