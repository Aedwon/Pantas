<polygon points="30,240 38,235.5 38,244.5" fill="#020202"/>
<circle cx="16" cy="228" r="2.2" fill="#010101"/>
<circle cx="26" cy="238" r="2.2" fill="#010101"/>
<circle cx="18" cy="250" r="2.2" fill="#010101"/>
<circle cx="280" cy="240" r="14" fill="url(#eg)"/>
<path d="M280 226 A14 14 0 0 1 280 254 Z" fill="#010101" fill-opacity="0.32"/>
<circle cx="280" cy="240" r="14" fill="none" stroke="#010101" stroke-width="1.8"/>
<line x1="298" y1="240" x2="323.6" y2="240" stroke="#020202" stroke-width="2" stroke-linecap="round"/>
<polygon points="330,240 322,244.5 322,235.5" fill="#020202"/>
<circle cx="336" cy="228" r="2.2" fill="#010101"/>
<circle cx="346" cy="238" r="2.2" fill="#010101"/>
<circle cx="338" cy="250" r="2.2" fill="#010101"/>
<line x1="169" y1="48" x2="191" y2="48" stroke="#050505" stroke-width="1.2" stroke-linecap="round"/>
<line x1="169" y1="48" x2="174" y2="62" stroke="#050505" stroke-width="1.2" stroke-linecap="round"/>
<line x1="191" y1="48" x2="186" y2="64" stroke="#050505" stroke-width="1.2" stroke-linecap="round"/>
<line x1="174" y1="62" x2="180" y2="63" stroke="#050505" stroke-width="1.2" stroke-linecap="round"/>
<line x1="180" y1="63" x2="186" y2="64" stroke="#050505" stroke-width="1.2" stroke-linecap="round"/>
<line x1="174" y1="62" x2="171" y2="78" stroke="#050505" stroke-width="1.2" stroke-linecap="round"/>
