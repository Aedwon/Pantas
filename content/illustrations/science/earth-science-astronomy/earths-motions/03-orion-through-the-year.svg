<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 424" width="360" height="424">
<title>Top view of Earth orbiting the Sun in March, June, September and December: the night side faces the star background, so Orion is seen at night in December and lost in daylight in June</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#030303"/><stop offset="1" stop-color="#030303"/></linearGradient>
<radialGradient id="eg" cx="0.4" cy="0.3" r="0.8"><stop offset="0" stop-color="#010101" stop-opacity="0.04"/><stop offset="1" stop-color="#010101" stop-opacity="0.18"/></radialGradient>
</defs>
<rect width="360" height="424" rx="14" fill="url(#bg)"/>
<circle cx="180" cy="240" r="100" fill="none" stroke="#020202" stroke-width="1.5"/>
<circle cx="180" cy="240" r="28" fill="url(#eg)" stroke="#010101" stroke-width="1.8"/>
<text x="180" y="245" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="700" fill="#010101">Sun</text>
<circle cx="180" cy="140" r="14" fill="url(#eg)"/>
<path d="M166 140 A14 14 0 0 1 194 140 Z" fill="#010101" fill-opacity="0.32"/>
<circle cx="180" cy="140" r="14" fill="none" stroke="#010101" stroke-width="1.8"/>
