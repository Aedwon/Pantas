<text x="154" y="118" text-anchor="end" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#010101">December</text>
<text x="224" y="112" text-anchor="start" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#050505">night side:</text>
<text x="224" y="128" text-anchor="start" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#050505">Orion seen</text>
<text x="16" y="184" text-anchor="start" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#010101">March</text>
<text x="344" y="184" text-anchor="end" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#010101">September</text>
<text x="162" y="368" text-anchor="end" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#010101">June</text>
<line x1="192" y1="326" x2="211.5" y2="98.4" stroke="#020202" stroke-width="1.8" stroke-dasharray="5 4" stroke-linecap="round"/>
<polygon points="212,92 215.8,100.4 206.8,99.6" fill="#020202"/>
<text x="216" y="40" text-anchor="start" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#010101">June: Orion on</text>
<text x="216" y="56" text-anchor="start" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#010101">the Sun side,</text>
<text x="216" y="72" text-anchor="start" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#010101">lost in daylight</text>
