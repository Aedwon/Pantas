<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 278" width="360" height="278">
<title>Side view of Earth at the June and December solstices: the axis tilts 23.4 degrees the same way both times, so the hemisphere leaning toward the Sun gets steeper rays</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#030303"/><stop offset="1" stop-color="#030303"/></linearGradient>
<radialGradient id="eg" cx="0.4" cy="0.3" r="0.8"><stop offset="0" stop-color="#010101" stop-opacity="0.04"/><stop offset="1" stop-color="#010101" stop-opacity="0.18"/></radialGradient>
</defs>
<rect width="360" height="278" rx="14" fill="url(#bg)"/>
<circle cx="180" cy="148" r="18" fill="url(#eg)" stroke="#010101" stroke-width="1.5"/>
<text x="180" y="184" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#010101">Sun</text>
<text x="88" y="34" text-anchor="middle" font-family="Geist, sans-serif" font-size="15" font-weight="700" fill="#010101">June solstice</text>
<circle cx="88" cy="148" r="34" fill="url(#eg)"/>
<path d="M88 114 A34 34 0 0 0 88 182 Z" fill="#010101" fill-opacity="0.14"/>
<circle cx="88" cy="148" r="34" fill="none" stroke="#010101" stroke-width="2"/>
<line x1="88" y1="104" x2="88" y2="192" stroke="#020202" stroke-width="1.5" stroke-dasharray="3 4" stroke-linecap="round"/>
<line x1="66.6" y1="197.6" x2="109.4" y2="98.4" stroke="#010101" stroke-width="2.2" stroke-linecap="round"/>
<line x1="56.8" y1="134.5" x2="119.2" y2="161.5" stroke="#020202" stroke-width="1.5" stroke-linecap="round"/>
<text x="121.4" y="96.4" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="700" fill="#010101">N</text>
<text x="54.6" y="211.6" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="700" fill="#010101">S</text>
<path d="M88 104 A44 44 0 0 1 105.5 107.6" fill="none" stroke="#010101" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="80" y="96" text-anchor="end" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#010101">23.4°</text>
<line x1="158" y1="120" x2="113.9" y2="120" stroke="#050505" stroke-width="2.2" stroke-linecap="round"/>
<polygon points="108.3,120 115.3,116 115.3,124" fill="#050505"/>
<line x1="158" y1="134" x2="125.6" y2="134" stroke="#050505" stroke-width="2.2" stroke-linecap="round"/>
<polygon points="120,134 127,130 127,138" fill="#050505"/>
<line x1="158" y1="148" x2="128.6" y2="148" stroke="#050505" stroke-width="2.2" stroke-linecap="round"/>
<polygon points="123,148 130,144 130,152" fill="#050505"/>
<line x1="158" y1="162" x2="125.6" y2="162" stroke="#020202" stroke-width="1.8" stroke-linecap="round"/>
<polygon points="120,162 127,158 127,166" fill="#020202"/>
<line x1="158" y1="176" x2="113.9" y2="176" stroke="#020202" stroke-width="1.8" stroke-linecap="round"/>
<polygon points="108.3,176 115.3,172 115.3,180" fill="#020202"/>
<text x="88" y="240" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#010101">Northern summer,</text>
<text x="88" y="256" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#010101">Southern winter</text>
<text x="270" y="34" text-anchor="middle" font-family="Geist, sans-serif" font-size="15" font-weight="700" fill="#010101">December solstice</text>
<circle cx="272" cy="148" r="34" fill="url(#eg)"/>
<path d="M272 114 A34 34 0 0 1 272 182 Z" fill="#010101" fill-opacity="0.14"/>
<circle cx="272" cy="148" r="34" fill="none" stroke="#010101" stroke-width="2"/>
<line x1="272" y1="104" x2="272" y2="192" stroke="#020202" stroke-width="1.5" stroke-dasharray="3 4" stroke-linecap="round"/>
<line x1="250.6" y1="197.6" x2="293.4" y2="98.4" stroke="#010101" stroke-width="2.2" stroke-linecap="round"/>
<line x1="240.8" y1="134.5" x2="303.2" y2="161.5" stroke="#020202" stroke-width="1.5" stroke-linecap="round"/>
<text x="305.4" y="96.4" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="700" fill="#010101">N</text>
<text x="238.6" y="211.6" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="700" fill="#010101">S</text>
<path d="M272 104 A44 44 0 0 1 289.5 107.6" fill="none" stroke="#010101" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="264" y="96" text-anchor="end" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#010101">23.4°</text>
<line x1="202" y1="120" x2="246.1" y2="120" stroke="#020202" stroke-width="1.8" stroke-linecap="round"/>
<polygon points="251.7,120 244.7,124 244.7,116" fill="#020202"/>
<line x1="202" y1="134" x2="234.4" y2="134" stroke="#020202" stroke-width="1.8" stroke-linecap="round"/>
<polygon points="240,134 233,138 233,130" fill="#020202"/>
<line x1="202" y1="148" x2="231.4" y2="148" stroke="#050505" stroke-width="2.2" stroke-linecap="round"/>
<polygon points="237,148 230,152 230,144" fill="#050505"/>
<line x1="202" y1="162" x2="234.4" y2="162" stroke="#050505" stroke-width="2.2" stroke-linecap="round"/>
<polygon points="240,162 233,166 233,158" fill="#050505"/>
<line x1="202" y1="176" x2="246.1" y2="176" stroke="#050505" stroke-width="2.2" stroke-linecap="round"/>
<polygon points="251.7,176 244.7,180 244.7,172" fill="#050505"/>
<text x="272" y="240" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#010101">Northern winter,</text>
<text x="272" y="256" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#010101">Southern summer</text>
</svg>
