<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 400" width="360" height="400">
<title>Two panels six months apart: in December Orion is on the night side of Earth, in June it is on the Sun side</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#030303"/><stop offset="1" stop-color="#030303"/></linearGradient>
<radialGradient id="eg" cx="0.4" cy="0.3" r="0.8"><stop offset="0" stop-color="#010101" stop-opacity="0.04"/><stop offset="1" stop-color="#010101" stop-opacity="0.18"/></radialGradient>
</defs>
<rect width="360" height="400" rx="14" fill="url(#bg)"/>
<rect x="16" y="16" width="328" height="176" rx="10" fill="#010101" fill-opacity="0.05"/>
<rect x="16" y="208" width="328" height="176" rx="10" fill="#010101" fill-opacity="0.05"/>
<text x="28" y="42" text-anchor="start" font-family="Geist, sans-serif" font-size="16" font-weight="700" fill="#010101">December</text>
<text x="28" y="234" text-anchor="start" font-family="Geist, sans-serif" font-size="16" font-weight="700" fill="#010101">June</text>
<circle cx="60" cy="104" r="20" fill="url(#eg)" stroke="#010101" stroke-width="1.8"/>
<text x="60" y="144" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#010101">Sun</text>
