<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" width="360" height="360">
  <title>Life through geologic time</title>
  <defs>
    <linearGradient id="bg"><stop offset="0" stop-color="#030303"/><stop offset="1" stop-color="#030303"/></linearGradient>
    <radialGradient id="shape" cx="0.4" cy="0.3" r="0.75"><stop offset="0" stop-color="#050505" stop-opacity="0.12"/><stop offset="1" stop-color="#050505" stop-opacity="0.27"/></radialGradient>
    <radialGradient id="muted" cx="0.4" cy="0.3" r="0.75"><stop offset="0" stop-color="#010101" stop-opacity="0.07"/><stop offset="1" stop-color="#010101" stop-opacity="0.16"/></radialGradient>
    <radialGradient id="tile" cx="0.4" cy="0.3" r="0.75"><stop offset="0" stop-color="#010101" stop-opacity="0.03"/><stop offset="1" stop-color="#010101" stop-opacity="0.07"/></radialGradient>
    <radialGradient id="focus" cx="0.4" cy="0.3" r="0.75"><stop offset="0" stop-color="#050505" stop-opacity="0.23"/><stop offset="1" stop-color="#050505" stop-opacity="0.45"/></radialGradient>
  </defs>
  <rect width="360" height="360" rx="14" fill="url(#bg)"/>
  <text x="24" y="31" text-anchor="start" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#010101">4.54 billion years ago</text>
  <text x="336" y="31" text-anchor="end" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#010101">today</text>
  <rect x="24" y="47" width="274.96" height="30" rx="4" fill="url(#muted)" stroke="#020202" stroke-width="1.5"/>
  <rect x="298.96" y="47" width="37.04" height="30" rx="0" fill="url(#focus)" stroke="#050505" stroke-width="1.5"/>
  <text x="151" y="67" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#010101">Precambrian</text>
  <text x="151" y="102" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="400" fill="#020202">about 88%</text>
  <path d="M317 78 V112 H274" fill="none" stroke="#020202" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="267" y="114" text-anchor="end" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#010101">Phanerozoic</text>
  <text x="267" y="133" text-anchor="end" font-family="Geist, sans-serif" font-size="14" font-weight="400" fill="#020202">about 12%</text>
  <path d="M298.96 79 V141 L24 160 M336 79 V160" fill="none" stroke="#050505" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="24" y="160" width="166.13" height="26" rx="0" fill="url(#shape)" stroke="#020202" stroke-width="1.5"/>
  <rect x="190.13" y="160" width="107.67" height="26" rx="0" fill="url(#focus)" stroke="#020202" stroke-width="1.5"/>
  <rect x="297.8" y="160" width="38.2" height="26" rx="0" fill="url(#shape)" stroke="#020202" stroke-width="1.5"/>
  <path d="M107.1 186 V205 H108" fill="none" stroke="#020202" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="108" y="220" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#010101">Paleozoic</text>
  <text x="22" y="239" text-anchor="start" font-family="Geist, sans-serif" font-size="14" font-weight="400" fill="#020202">539 to 252 million years ago</text>
  <path d="M243.97 186 V253 H180" fill="none" stroke="#020202" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="180" y="268" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#010101">Mesozoic</text>
  <text x="180" y="287" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="400" fill="#020202">252 to 66 million years ago</text>
  <path d="M317 186 V301 H180" fill="none" stroke="#020202" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="180" y="316" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#010101">Cenozoic</text>
  <text x="180" y="335" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="400" fill="#020202">66 million years ago to today</text>
</svg>
