<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 262" width="360" height="262">
  <title>Orbital tilt and crossing points</title>
  <defs>
    <linearGradient id="bg"><stop offset="0" stop-color="#030303"/><stop offset="1" stop-color="#030303"/></linearGradient>
    <radialGradient id="shape" cx="0.4" cy="0.3" r="0.75"><stop offset="0" stop-color="#050505" stop-opacity="0.12"/><stop offset="1" stop-color="#050505" stop-opacity="0.27"/></radialGradient>
    <radialGradient id="muted" cx="0.4" cy="0.3" r="0.75"><stop offset="0" stop-color="#010101" stop-opacity="0.07"/><stop offset="1" stop-color="#010101" stop-opacity="0.16"/></radialGradient>
    <radialGradient id="tile" cx="0.4" cy="0.3" r="0.75"><stop offset="0" stop-color="#010101" stop-opacity="0.03"/><stop offset="1" stop-color="#010101" stop-opacity="0.07"/></radialGradient>
    <radialGradient id="focus" cx="0.4" cy="0.3" r="0.75"><stop offset="0" stop-color="#050505" stop-opacity="0.23"/><stop offset="1" stop-color="#050505" stop-opacity="0.45"/></radialGradient>
  </defs>
  <rect width="360" height="262" rx="14" fill="url(#bg)"/>
  <ellipse cx="180" cy="94" rx="137" ry="28" fill="url(#muted)" stroke="#020202" stroke-width="1.6"/>
  <ellipse cx="180" cy="94" rx="137" ry="51" fill="url(#shape)" stroke="#050505" stroke-width="1.6"/>
  <text x="112" y="100" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#010101">Earth&#x27;s orbit</text>
  <text x="180" y="37" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#050505">Moon&#x27;s orbit</text>
  <path d="M180 42 L180 47" fill="none" stroke="#050505" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="43" cy="94" r="4" fill="#010101" stroke="none" stroke-width="1.6"/>
  <circle cx="317" cy="94" r="4" fill="#010101" stroke="none" stroke-width="1.6"/>
  <path d="M43 104 L61 159 H107 M317 104 L299 159 H253" fill="none" stroke="#020202" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="180" y="164" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#010101">crossing points</text>
  <path d="M32 227 L328 227" fill="none" stroke="#020202" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M32 239.95 L328 214.05" fill="none" stroke="#050505" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M284 227 A104 104 0 0 0 283.6 217.9" fill="none" stroke="#050505" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="279" y="202" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#050505">about 5°</text>
</svg>
