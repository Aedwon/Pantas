<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 262" width="360" height="262">
<title>Show how friction changes when sliding begins.</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#030303"/><stop offset="1" stop-color="#030303"/></linearGradient>
<radialGradient id="depth" cx="0.4" cy="0.3" r="0.8"><stop offset="0" stop-color="#050505" stop-opacity="0.28"/><stop offset="1" stop-color="#050505" stop-opacity="0.12"/></radialGradient>
</defs>
<rect x="0" y="0" width="360" height="262" rx="14" fill="url(#bg)" stroke="none" stroke-width="2"/>
<line x1="51" y1="213" x2="323" y2="213" fill="none" stroke="#020202" stroke-width="2.5"/>
<polygon points="329,213 319,209 319,217" fill="#020202"/>
<line x1="51" y1="213" x2="51" y2="38" fill="none" stroke="#020202" stroke-width="2.5"/>
<polygon points="51,32 47,42 55,42" fill="#020202"/>
<text x="42" y="28" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#010101"><tspan font-family="KaTeX_Math, serif" font-weight="400">f</tspan></text>
<text x="329" y="232" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#010101"><tspan font-family="KaTeX_Math, serif" font-weight="400">F</tspan></text>
<polyline points="51,213 170,94" fill="none" stroke="#050505" stroke-width="2" stroke-linejoin="round"/>
<circle cx="170" cy="94" r="4" fill="#050505" stroke="none" stroke-width="2"/>
<line x1="170" y1="97" x2="170" y2="145" fill="none" stroke="#020202" stroke-width="2" stroke-dasharray="4 4"/>
<line x1="170" y1="145" x2="314" y2="145" fill="none" stroke="#050505" stroke-width="2"/>
<text x="125" y="110" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#010101"><tspan font-family="KaTeX_Math, serif" font-weight="400">f</tspan><tspan font-family="KaTeX_Main, serif" font-weight="400"> = </tspan><tspan font-family="KaTeX_Math, serif" font-weight="400">F</tspan></text>
<text x="195" y="80" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#010101"><tspan font-family="KaTeX_Math, serif" font-weight="400">f</tspan><tspan font-family="KaTeX_Main, serif" font-weight="400">ₛ,ₘₐₓ = μₛ </tspan><tspan font-family="KaTeX_Main, serif" font-weight="400">N</tspan></text>
<text x="251" y="132" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#010101"><tspan font-family="KaTeX_Math, serif" font-weight="400">f</tspan><tspan font-family="KaTeX_Main, serif" font-weight="400">ₖ = μₖ </tspan><tspan font-family="KaTeX_Main, serif" font-weight="400">N</tspan></text>
<text x="108" y="235" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#010101">at rest</text>
<text x="245" y="235" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#010101">sliding</text>
</svg>
