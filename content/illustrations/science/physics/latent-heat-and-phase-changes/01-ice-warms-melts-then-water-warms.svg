<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 258" width="360" height="258">
<title>Show the flat part of the heating curve.</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#030303"/><stop offset="1" stop-color="#030303"/></linearGradient>
<radialGradient id="depth" cx="0.4" cy="0.3" r="0.8"><stop offset="0" stop-color="#050505" stop-opacity="0.28"/><stop offset="1" stop-color="#050505" stop-opacity="0.12"/></radialGradient>
</defs>
<rect x="0" y="0" width="360" height="258" rx="14" fill="url(#bg)" stroke="none" stroke-width="2"/>
<text x="22" y="33" text-anchor="start" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#010101">Temperature (°C)</text>
<text x="194" y="235" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#010101">Heat added</text>
<line x1="61" y1="205" x2="325" y2="205" fill="none" stroke="#020202" stroke-width="2.5"/>
<polygon points="331,205 321,201 321,209" fill="#020202"/>
<line x1="61" y1="205" x2="61" y2="55" fill="none" stroke="#020202" stroke-width="2.5"/>
<polygon points="61,49 57,59 65,59" fill="#020202"/>
<line x1="55" y1="65" x2="61" y2="65" fill="none" stroke="#020202" stroke-width="2"/>
<text x="48" y="70" text-anchor="end" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#010101"><tspan font-family="KaTeX_Main, serif" font-weight="400">20</tspan></text>
<line x1="55" y1="149" x2="61" y2="149" fill="none" stroke="#020202" stroke-width="2"/>
<text x="48" y="154" text-anchor="end" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#010101"><tspan font-family="KaTeX_Main, serif" font-weight="400">0</tspan></text>
<line x1="55" y1="191" x2="61" y2="191" fill="none" stroke="#020202" stroke-width="2"/>
<text x="48" y="196" text-anchor="end" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#010101"><tspan font-family="KaTeX_Main, serif" font-weight="400">−10</tspan></text>
<line x1="61" y1="149" x2="72.34" y2="149" fill="none" stroke="#020202" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="61" y1="65" x2="299" y2="65" fill="none" stroke="#020202" stroke-width="1" stroke-dasharray="4 4"/>
<polyline points="61,191 72.34,149 253.57,149 299,65" fill="none" stroke="#020202" stroke-width="2" stroke-linejoin="round"/>
<line x1="72.34" y1="149" x2="253.57" y2="149" fill="none" stroke="#050505" stroke-width="3"/>
<text x="105" y="202" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#010101">ice warms</text>
<text x="163" y="135" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#050505">ice melts</text>
<text x="218" y="104" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#010101">water warms</text>
</svg>
