meta:
  subject: 'science'
  topic: 'earth-science-astronomy'
  subtopic: 'minerals-and-rocks'
  exams: ["upcat", "dlsucet", "ustet", "dost-sei"]
questions:
  - id: q-earth-science-astronomy-minerals-and-rocks-0001
    type: identify
    difficulty: easy
    stem: |
      What is a naturally occurring, inorganic solid with an orderly internal structure and a characteristic chemical composition called?
    choices:
      - text: 'Mineral'
        correct: true
      - text: 'A rock'
        rationale: |
          This treats a whole aggregate as one mineral. Rocks contain minerals. Check the ordered structure and characteristic composition.
      - text: 'Sediment'
        rationale: |
          This names loose material instead of a substance type. Sediment can contain mineral grains. Check whether the definition concerns one mineral.
      - text: 'Magma'
        rationale: |
          This chooses molten material for a solid definition. Magma contains material that can form minerals. Check its current state.
    explanation: |
      A mineral is a natural inorganic solid. Its atoms have an orderly internal structure. It has a characteristic composition or a limited range of compositions.
    approved: true

  - id: q-earth-science-astronomy-minerals-and-rocks-0002
    type: identify
    difficulty: easy
    stem: |
      What is a mix of one or more minerals stuck together called?
    choices:
      - text: 'A rock'
        correct: true
      - text: 'A mineral'
        rationale: |
          This treats an aggregate as one mineral substance. The parts may be minerals. Check the whole rock versus its components.
      - text: 'Magma'
        rationale: |
          This treats a solid aggregate as molten rock. Both involve rock materials. Check whether it is melted.
      - text: 'A crystal'
        rationale: |
          This treats any mineral aggregate as one crystal. Crystals are ordered solids. Check whether different mineral grains are joined together.
    explanation: |
      A rock is an aggregate of one or more minerals or other consolidated mineral matter. Different minerals can occur together in the same rock.
    approved: true

  - id: q-earth-science-astronomy-minerals-and-rocks-0003
    type: identify
    difficulty: medium
    stem: |
      The Mohs hardness scale, used to measure mineral hardness, ranges from which two numbers?
    choices:
      - text: '1 (very soft) to 10 (very hard)'
        correct: true
      - text: '1 (very hard) to 10 (very soft)'
        rationale: |
          This reverses the scale. Both endpoints are remembered correctly. Check which endpoint represents greater scratch resistance.
      - text: '0 (very soft) to 100 (very hard)'
        rationale: |
          This substitutes a percentage-like range. Many measures use 100 as a maximum. Check the ten Mohs reference ranks.
      - text: '1 to 5 only'
        rationale: |
          This stops the scale halfway. Five is a familiar test-material hardness. Check the scale's hardest reference mineral.
    explanation: |
      The Mohs scale ranks scratch hardness from $1$ to $10$. Talc is the softest reference mineral at $1$. Diamond is the hardest at $10$.
    approved: true

  - id: q-earth-science-astronomy-minerals-and-rocks-0004
    type: classify
    difficulty: medium
    stem: |
      Mineral A can scratch Mineral B, but Mineral B cannot scratch Mineral A. Mineral C can scratch both A and B. Rank the three minerals from softest to hardest.
    choices:
      - text: 'B, A, C'
        correct: true
      - text: 'A, B, C'
        rationale: |
          This reverses A and B. The listed order may look natural. Check which mineral does the scratching.
      - text: 'C, A, B'
        rationale: |
          This reads the ranking hardest to softest. The comparisons are consistent in reverse. Check the requested direction.
      - text: 'B, C, A'
        rationale: |
          This places C below a mineral it scratches. C can look like the middle letter. Check C's scratch result against A.
    explanation: |
      A scratches B, so A is harder than B. C scratches both, so C is hardest. Softest to hardest is B, A, C.
    approved: true

  - id: q-earth-science-astronomy-minerals-and-rocks-0005
    type: identify
    difficulty: medium
    stem: |
      What is the term for the color of a mineral's powder, made by rubbing it on an unglazed tile?
    choices:
      - text: 'Streak'
        correct: true
      - text: 'Luster'
        rationale: |
          This uses reflected surface appearance for a powder-color test. Both are visible properties. Check powder versus reflected light.
      - text: 'Cleavage'
        rationale: |
          This chooses a breaking pattern. The tile can damage a sample. Check whether color or flat break planes are measured.
      - text: 'Fracture'
        rationale: |
          This chooses irregular breakage. Rubbing can remove material. Check whether the observation is powder color.
    explanation: |
      Streak is the color of a mineral's powder. Rubbing a suitable sample on an unglazed tile reveals this powder color.
    approved: true

  - id: q-earth-science-astronomy-minerals-and-rocks-0006
    type: classify
    difficulty: hard
    stem: |
      The mineral pyrite looks golden on the outside but leaves a dark greenish-black powder when scratched on an unglazed tile. A student identifies pyrite as "golden-colored" based on this streak test. Is this correct?
    choices:
      - text: 'No: the dark greenish-black powder is pyrite''s streak, which can be very different from its golden outer color; streak, not outer color, is what the scratch test reveals.'
        correct: true
      - text: 'Yes: the streak test always reveals the mineral''s outer color.'
        rationale: |
          This equates powder color with surface color. Both describe color. Check the actual powder left on the tile.
      - text: 'No: but only because pyrite does not actually have a streak.'
        rationale: |
          This denies the stated powder result. Some minerals are difficult to test on a tile. Check the observed powder in this setup.
      - text: 'Yes: pyrite''s streak and outer color are always identical.'
        rationale: |
          This assumes one mineral has only one kind of color observation. The surface looks golden. Check powder color separately.
    explanation: |
      The powder produced in the stated test is dark greenish-black. That is the sample's streak. Its golden surface color is a separate observation.
    approved: true

  - id: q-earth-science-astronomy-minerals-and-rocks-0007
    type: identify
    difficulty: medium
    stem: |
      What term describes how a mineral's surface reflects light, grouped mainly as metallic (shiny, like metal) or non-metallic (dull, glassy, pearly)?
    choices:
      - text: 'Luster'
        correct: true
      - text: 'Streak'
        rationale: |
          This substitutes powder color for light reflection. Both are appearance tests. Check whether the sample is powdered.
      - text: 'Cleavage'
        rationale: |
          This substitutes a break pattern for reflection. Smooth faces can look shiny. Check what property is being classified.
      - text: 'Hardness'
        rationale: |
          This substitutes scratch resistance for reflection. Both help identify minerals. Check whether scratching was tested.
    explanation: |
      Luster describes how a mineral's surface reflects light. Metallic and nonmetallic describe kinds of luster.
    approved: true

  - id: q-earth-science-astronomy-minerals-and-rocks-0008
    type: classify
    difficulty: medium
    stem: |
      A mineral breaks along smooth, flat planes because of weaker bonds in that direction. What is this property called, as opposed to breaking in a rough, irregular way?
    choices:
      - text: 'Cleavage'
        correct: true
      - text: 'Fracture'
        rationale: |
          This uses the general irregular-break term for ordered planes. Both involve breaking. Check whether the planes repeat regularly.
      - text: 'Streak'
        rationale: |
          This uses a powder-color property for break geometry. Broken material can make powder. Check which observation is described.
      - text: 'Luster'
        rationale: |
          This uses reflection for break geometry. Flat faces can reflect light. Check the cause and pattern of breaking.
    explanation: |
      Cleavage is breaking along regular flat planes. These planes reflect directions of weaker bonding in a mineral's internal structure.
    approved: true

  - id: q-earth-science-astronomy-minerals-and-rocks-0009
    type: identify
    difficulty: medium
    stem: |
      Which rock type forms when melted rock (magma or lava) cools and hardens?
    choices:
      - text: 'Igneous rock'
        correct: true
      - text: 'Sedimentary rock'
        rationale: |
          This uses sediment buildup for a cooled melt. Both form solid rock. Check whether grains or molten material are the starting point.
      - text: 'Metamorphic rock'
        rationale: |
          This confuses high temperature with solid-state change. Metamorphism also uses heat. Check whether the material actually melted.
      - text: 'Unconsolidated sediment'
        rationale: |
          This treats solidified melt as loose grains. Lava can produce fragments. Check whether the described material has hardened into rock.
    explanation: |
      Molten rock cools and becomes solid. The rock formed by this process is igneous.
    approved: true

  - id: q-earth-science-astronomy-minerals-and-rocks-0010
    type: classify
    difficulty: medium
    stem: |
      Lava cools very quickly on a volcano's surface, forming a rock with small or no visible crystals, such as basalt or obsidian. If the same magma had instead cooled slowly underground, what would the resulting igneous rock most likely look like?
    choices:
      - text: 'Larger crystals would generally develop.'
        correct: true
      - text: 'The crystal size would remain unchanged.'
        rationale: |
          This ignores the available growth time. The magma composition stays the same. Check cooling time as well as composition.
      - text: 'Only volcanic glass would form underground.'
        rationale: |
          This reverses the cooling condition that favors glass. Glass can form from molten material. Check whether cooling is very rapid.
      - text: 'The rock would become sedimentary without deposition.'
        rationale: |
          This changes the rock category because of its location. Burial also occurs in sedimentary settings. Check the actual formation process.
    explanation: |
      Slow cooling gives crystals more time to grow. Similar magma cooling slowly underground generally forms larger crystals than rapidly cooled lava.
    approved: true

  - id: q-earth-science-astronomy-minerals-and-rocks-0011
    type: identify
    difficulty: medium
    stem: |
      Which rock type forms when small pieces of rock, sand, shells, or other debris pile up in layers and get pressed and cemented together over time?
    choices:
      - text: 'Sedimentary'
        correct: true
      - text: 'Igneous'
        rationale: |
          This treats cementing grains as cooling melt. Both harden material. Check whether molten rock was present.
      - text: 'Metamorphic'
        rationale: |
          This treats compaction and cementation as alteration of existing solid rock. Pressure occurs in both settings. Check the starting material.
      - text: 'Unconsolidated'
        rationale: |
          This leaves the sediment loose after cementation. The material began as particles. Check whether grains have become joined into rock.
    explanation: |
      Loose sediment is pressed together and cemented into solid rock. This process produces sedimentary rock.
    approved: true

  - id: q-earth-science-astronomy-minerals-and-rocks-0012
    type: identify
    difficulty: medium
    stem: |
      Which rock type forms when an existing rock is changed by intense heat and pressure underground, without fully melting?
    choices:
      - text: 'Metamorphic'
        correct: true
      - text: 'Igneous'
        rationale: |
          This treats heat alone as proof of cooling from melt. Igneous rock does involve molten material. Check whether wholesale melting occurred.
      - text: 'Sedimentary'
        rationale: |
          This treats any pressure-driven change as sedimentary formation. Compaction also uses pressure. Check whether existing rock is being altered.
      - text: 'Unconsolidated'
        rationale: |
          This treats changed rock as loose sediment. Weathering can loosen grains. Check whether the process instead changes solid rock.
    explanation: |
      Heat, pressure, or active fluids can change existing rock while it stays largely solid. The changed rock is metamorphic.
    approved: true

  - id: q-earth-science-astronomy-minerals-and-rocks-0013
    type: classify
    difficulty: hard
    stem: |
      Sandstone is buried and changes into quartzite under heat and pressure without wholesale melting. How should quartzite be classified?
    choices:
      - text: 'Metamorphic'
        correct: true
      - text: 'Sedimentary'
        rationale: |
          This keeps the parent rock's category after transformation. Sandstone is sedimentary. Check the process that produced quartzite.
      - text: 'Igneous'
        rationale: |
          This treats heating as melting. Both igneous and metamorphic processes use heat. Check the stated absence of wholesale melting.
      - text: 'Unconsolidated'
        rationale: |
          This treats altered rock as loose grains. Sandstone contains cemented grains. Check whether the product is still solid rock.
    explanation: |
      The sandstone changes while remaining largely solid. Heat and pressure alter its minerals and texture. The resulting quartzite is metamorphic.
    approved: true

  - id: q-earth-science-astronomy-minerals-and-rocks-0014
    type: classify
    difficulty: medium
    stem: |
      Dissolved minerals precipitate from water and form a consolidated rock. Which classification follows from this formation process?
    choices:
      - text: 'Sedimentary'
        correct: true
      - text: 'Metamorphic'
        rationale: |
          This treats mineral growth as solid-state alteration of older rock. Both can change mineral textures. Check whether precipitation is the source.
      - text: 'Igneous'
        rationale: |
          This treats crystallization from water as cooling from molten rock. Both form solid minerals. Check water solution versus melt.
      - text: 'Unconsolidated'
        rationale: |
          This treats the consolidated deposit as loose material. Precipitates begin as small particles or crystals. Check the final rock's joined structure.
    explanation: |
      Sedimentary rocks can form when dissolved minerals precipitate from water. The solid mineral deposits build into rock.
    approved: true

  - id: q-earth-science-astronomy-minerals-and-rocks-0015
    type: classify
    difficulty: medium
    stem: |
      Limestone is heated and compressed underground without melting. Which rock can form from it?
    choices:
      - text: 'Marble'
        correct: true
      - text: 'Quartzite'
        rationale: |
          This uses sandstone's common metamorphic product for limestone. Both products are metamorphic. Check the parent rock.
      - text: 'Sandstone'
        rationale: |
          This changes carbonate rock into a sand-based sedimentary rock. Both can be pale rocks. Check the stated solid-state alteration.
      - text: 'Obsidian'
        rationale: |
          This treats heating as rapid cooling of a melt. Obsidian is volcanic glass. Check whether the limestone melted.
    explanation: |
      Heat and pressure can change limestone into marble without wholesale melting. This is a metamorphic transformation.
    approved: true

  - id: q-earth-science-astronomy-minerals-and-rocks-0016
    type: classify
    difficulty: hard
    stem: |
      A student memorized only one path through the rock cycle (igneous → sedimentary → metamorphic) and assumes every rock must always follow this exact order. Is this assumption correct?
    choices:
      - text: 'Several pathways exist when suitable processes occur.'
        correct: true
      - text: 'Every rock must follow one fixed three-type sequence.'
        rationale: |
          This treats one memorized path as compulsory. Diagrams often show a simple loop. Check whether other valid processes connect the rock types.
      - text: 'Every transformation requires the rock to melt first.'
        rationale: |
          This applies the molten stage to every rock-forming process. Igneous formation uses melt. Check sedimentary and solid-state pathways.
      - text: 'Metamorphic rock can never weather into sediment.'
        rationale: |
          This excludes a rock type from weathering. Metamorphic rocks can be tough. Check whether exposed rock can still break down.
    explanation: |
      The rock cycle is a network of possible transformations. Weathering, burial, heating, and melting create different paths. Each path needs suitable material and processes.
    approved: true

  - id: q-earth-science-astronomy-minerals-and-rocks-0017
    type: process-ordering
    difficulty: medium
    stem: |
      Which pathway can transform exposed granite into quartzite through a sedimentary stage?
    choices:
      - text: 'Weathering, quartz-rich sandstone formation, metamorphism'
        correct: true
      - text: 'Melting, volcanic glass formation, surface weathering'
        rationale: |
          This ends with weathered material instead of quartzite. Melting can change granite. Check the required sandstone parent stage.
      - text: 'Compaction of solid granite, melting, limestone formation'
        rationale: |
          This compacts intact granite and assigns limestone to the resulting material. Compaction is familiar from sediments. Check both starting grains and the quartz-rich precursor.
      - text: 'Limestone formation, weathering, rapid lava cooling'
        rationale: |
          This begins with the wrong parent material and ends with igneous rock. All are rock-cycle processes. Check the precursor and final rock.
    explanation: |
      Weathering of granite can release quartz grains. Quartz-rich sand can be deposited and cemented into sandstone. Heat and pressure can then change sandstone into quartzite.
    approved: true

  - id: q-earth-science-astronomy-minerals-and-rocks-0018
    type: predict-outcome
    difficulty: exam
    stem: |
      A geologist finds an unknown mineral sample. It can be scratched by a steel knife (hardness about 5.5) but can itself scratch glass (hardness about 5.5 as well, roughly tied). Its outer color is silvery, but rubbing it on an unglazed tile produces a black powder. Which two properties did the geologist use to gather the most reliable identifying clues, and why?
    choices:
      - text: 'Hardness (compared against known reference materials like a steel knife and glass) and streak (the black powder), since streak is more reliable than outer color, which can vary due to surface impurities.'
        correct: true
      - text: 'Only the mineral''s outer silvery color, since color alone is always sufficient for identification.'
        rationale: |
          This treats surface color as sufficient identification. The sample's silvery color is easy to notice. Check the actual scratch and powder tests.
      - text: 'Only luster, since hardness and streak provide no useful identifying information.'
        rationale: |
          This substitutes a surface-reflection test for the tests described. The silvery appearance may suggest luster. Check what was measured against reference materials and a tile.
      - text: 'Cleavage and fracture, since the scenario describes breaking patterns rather than hardness or color.'
        rationale: |
          This substitutes break geometry for scratching and powder color. All are mineral properties. Check whether any breaking pattern was reported.
    explanation: |
      The scratch comparisons test hardness. The powder on the tile tests streak. These observations give scratch resistance and powder color as identification clues; the stated approximate reference values do not establish a precise hardness.
    approved: true

  - id: q-earth-science-astronomy-minerals-and-rocks-0019
    type: compare-contrast
    difficulty: medium
    stem: |
      Why can obsidian be a rock while lacking the crystalline structure required in the introductory mineral definition?
    choices:
      - text: 'It is volcanic glass formed from rapidly cooled melt.'
        correct: true
      - text: 'Every rock must contain only one crystalline mineral.'
        rationale: |
          This requires one mineral and ignores noncrystalline material. Some rocks have one main mineral. Check whether the rock definition requires this.
      - text: 'Any natural solid automatically has an ordered atomic structure.'
        rationale: |
          This assumes solidity guarantees crystal order. Many minerals are solid. Check solid state separately from atomic arrangement.
      - text: 'Volcanic glass consists of crystals too large to identify.'
        rationale: |
          This reverses glass formation and crystal size. Slow cooling can grow large crystals. Check the effect of very rapid cooling.
    explanation: |
      Very rapid cooling can form volcanic glass. Its atoms do not have an ordered crystal structure. The material is still classified as igneous rock by its formation.
    approved: false

  - id: q-earth-science-astronomy-minerals-and-rocks-0020
    type: cause-effect
    difficulty: exam
    stem: |
      A metamorphic rock melts completely and the melt later cools into a solid mass. Which classification applies to the newly formed rock?
    choices:
      - text: 'Igneous'
        correct: true
      - text: 'Metamorphic'
        rationale: |
          This carries the former category through complete melting. The source was metamorphic. Check the final formation process.
      - text: 'Sedimentary'
        rationale: |
          This equates any reused rock material with sediment. Existing rocks can become sediment. Check whether weathering and cementation occurred.
      - text: 'Unconsolidated'
        rationale: |
          This treats hardened melt as loose particles. Molten material can fragment. Check the stated solid mass after cooling.
    explanation: |
      Complete melting produces molten rock. When that material cools and solidifies, it forms igneous rock. Classification follows the process that formed the new rock.
    approved: false
