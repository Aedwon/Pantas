meta:
  subject: science
  topic: earth-science-astronomy
  subtopic: fossils-and-geologic-time
  exams: ["upcat", "dlsucet", "ustet", "dost-sei"]
questions:
  - id: q-earth-science-astronomy-fossils-and-geologic-time-0001
    type: 'identify'
    difficulty: 'easy'
    stem: |
      What is any preserved trace of an ancient living thing, such as bones, shells, footprints, or imprints left in rock, called?
    choices:
      - text: 'A fossil'
        correct: true
      - text: 'A stratum'
        rationale: |
          This names the containing layer instead of biological evidence. Fossils often occur in strata. Check whether the question asks for the layer or evidence within it.
      - text: 'A half-life'
        rationale: |
          This selects a decay timescale. Fossils can be dated. Check the preserved-life definition.
      - text: 'An epoch'
        rationale: |
          This selects a time interval instead of a preserved object. Fossils represent past times. Check whether the answer names evidence or a time unit.
    explanation: |
      A fossil is preserved evidence of past life in a geological context. Bones, shells, and footprints are examples.
    approved: true

  - id: q-earth-science-astronomy-fossils-and-geologic-time-0002
    type: 'cause-effect'
    difficulty: 'medium'
    stem: |
      Why are fossils usually found inside sedimentary rock rather than igneous or metamorphic rock?
    choices:
      - text: 'Sedimentary rock forms in layers over time, which can trap and preserve remains before they decay, unlike igneous rock (formed from melting) or metamorphic rock (formed under intense heat and pressure that would destroy remains).'
        correct: true
      - text: 'Sedimentary rock is the only rock type that contains any minerals at all.'
        rationale: |
          This treats mineral content as unique to sedimentary rock. Fossils occur in mineral-bearing rocks. Check that other rock types also contain minerals.
      - text: 'Igneous and metamorphic rocks form more quickly than sedimentary rock, giving fossils less time to decay.'
        rationale: |
          This substitutes formation speed for preservation conditions. Time affects decay. Check burial and the intensity of heating or alteration.
      - text: 'Fossils are equally common in all three rock types, with no meaningful difference.'
        rationale: |
          This ignores how formation conditions affect preservation. All rocks can be examined. Check whether intense heat commonly destroys biological evidence.
    explanation: |
      Sediment can bury biological remains and traces under conditions that preserve them. High temperatures during rock formation can alter or destroy this evidence. Some fossils can survive mild metamorphism, so preservation is not an absolute rock-type rule.
    approved: true

  - id: q-earth-science-astronomy-fossils-and-geologic-time-0003
    type: 'identify'
    difficulty: 'medium'
    stem: |
      What is the study of rock layers (called strata) known as?
    choices:
      - text: 'Stratigraphy'
        correct: true
      - text: 'Radiometric dating'
        rationale: |
          This selects numerical isotope dating instead of the broader layer study. Both reconstruct history. Check whether the question asks about isotope measurements or layers.
      - text: 'Paleontology dating'
        rationale: |
          This selects fossil study with a dating label. Fossils occur in strata. Check whether layers rather than past organisms are the subject.
      - text: 'Superposition theory'
        rationale: |
          This selects one layer-ordering rule instead of the field studying strata. Superposition is important in stratigraphy. Check rule versus discipline.
    explanation: |
      Stratigraphy studies rock layers, called strata. It examines their order, relationships, and geological history.
    approved: true

  - id: q-earth-science-astronomy-fossils-and-geologic-time-0004
    type: 'identify'
    difficulty: 'medium'
    stem: |
      Which principle states that, in an undisturbed sequence of sedimentary rock layers, each layer is younger than the layer below it and older than the layer above it?
    choices:
      - text: 'Superposition'
        correct: true
      - text: 'Radiometric dating'
        rationale: |
          This selects a numerical measurement method. Both concern age. Check that the stem uses stacking order.
      - text: 'The isotope half-life relation'
        rationale: |
          This selects radioactive decay timing. A time comparison is requested. Check whether isotopes or layer positions are described.
      - text: 'The geologic time-scale framework'
        rationale: |
          This selects the overall history framework. It organizes geological intervals. Check which rule compares adjacent strata.
    explanation: |
      Superposition compares layers in an undisturbed sedimentary sequence. Lower layers formed before the layers deposited above them.
    approved: true

  - id: q-earth-science-astronomy-fossils-and-geologic-time-0005
    type: 'classify'
    difficulty: 'medium'
    stem: |
      A rock cliff shows four visible layers, labeled W, X, Y, and Z from bottom to top, with no signs of disturbance. Which layer is the oldest, and which is the youngest?
    choices:
      - text: 'W oldest; Z youngest'
        correct: true
      - text: 'Z oldest; W youngest'
        rationale: |
          This reverses the vertical order. Both end layers are identified. Check the undisturbed-deposition condition.
      - text: 'All four formed at exactly the same time'
        rationale: |
          This assumes all deposition happened at once. The layers form one cliff. Check their separate stacked sequence.
      - text: 'X oldest; Y youngest despite the stated stack'
        rationale: |
          This selects the middle layers as the extremes. They are visible in the stack. Check its bottom and top.
    explanation: |
      Superposition makes the bottom layer W oldest. Each overlying layer formed later. The top layer Z is youngest.
    approved: true

  - id: q-earth-science-astronomy-fossils-and-geologic-time-0006
    type: 'classify'
    difficulty: 'medium'
    stem: |
      Unreworked fossils were deposited with an undisturbed sedimentary sequence. A trilobite is in bottom Layer W and a mammal in top Layer Z. Which represented organism lived earlier?
    choices:
      - text: 'The trilobite in W'
        correct: true
      - text: 'The mammal in Z because it is nearer the surface'
        rationale: |
          This makes proximity to the present surface mean older deposition. The upper bed is exposed more recently. Check superposition for undisturbed layers.
      - text: 'Both must have lived at exactly the same time'
        rationale: |
          This treats two different beds as one time horizon. Both are in the same cliff. Check their separate depositional order.
      - text: 'Relative order cannot be inferred from the stated evidence'
        rationale: |
          This rejects relative ordering despite the supplied context. Numerical ages are absent. Check whether ordering requires a number of years.
    explanation: |
      In the stated unreworked sequence, fossils were deposited with their layers. W is below Z and is older. The trilobite represented in W therefore lived before the mammal represented in Z.
    approved: true

  - id: q-earth-science-astronomy-fossils-and-geologic-time-0007
    type: 'classify'
    difficulty: 'hard'
    stem: |
      A question asks, "How many years old is this rock layer?" A student tries to answer using only the Law of Superposition. Can superposition alone answer this question?
    choices:
      - text: 'No; it gives only relative order.'
        correct: true
      - text: 'Yes; it gives exact years for every layer.'
        rationale: |
          This turns relative position into an exact date. The sequence gives an order. Check whether any calibrated duration is supplied.
      - text: 'No; it cannot determine relative order either.'
        rationale: |
          This rejects superposition’s ordering function. Numerical ages are unavailable. Check that relative order can still be established.
      - text: 'Yes; it is identical to radiometric dating.'
        rationale: |
          This equates an isotope measurement with layer position. Both concern age. Check their different evidence and output.
    explanation: |
      Superposition gives relative order, older or younger. It does not measure elapsed years. Numerical ages need appropriate additional dating evidence.
    approved: true

  - id: q-earth-science-astronomy-fossils-and-geologic-time-0008
    type: 'classify'
    difficulty: 'hard'
    stem: |
      A rock formation has been folded and faulted by geological forces over time. A student applies "bottom is oldest" to this formation without any further evidence. Is this a safe assumption?
    choices:
      - text: 'No; reconstruct the original order.'
        correct: true
      - text: 'Yes; present height always establishes original deposition.'
        rationale: |
          This ignores disturbed positions. Superposition is a familiar rule. Check its undisturbed-sequence condition.
      - text: 'No; folded rocks can never preserve any fossil.'
        rationale: |
          This treats deformation as proof that no fossils survive. Folding can alter rock. Check preservation separately from layer orientation.
      - text: 'Yes; folds and faults cannot move layers relative to one another.'
        rationale: |
          This assumes geological forces cannot move strata relative to each other. The formation still has layers. Check faults and possible overturning.
    explanation: |
      Folding and faulting can change the original positions of layers. The depositional order must be reconstructed from field evidence before using present height as age order.
    approved: true

  - id: q-earth-science-astronomy-fossils-and-geologic-time-0009
    type: 'identify'
    difficulty: 'medium'
    stem: |
      Which dating method estimates a numerical age from parent and daughter isotope measurements in a suitable closed system?
    choices:
      - text: 'Radiometric dating'
        correct: true
      - text: 'Relative dating'
        rationale: |
          This selects order without numerical timing. Both concern rock history. Check the isotope measurements stated.
      - text: 'Stratigraphy'
        rationale: |
          This selects layer study rather than the specific isotope method. Rocks form strata. Check the type of evidence measured.
      - text: 'The Law of Superposition'
        rationale: |
          This selects a stacking rule. Superposition helps establish older and younger. Check whether it supplies isotope-based elapsed time.
    explanation: |
      Radiometric dating measures parent and daughter isotopes in a suitable dating system. Known decay behavior and sufficiently closed-system conditions allow an estimate of elapsed time.
    approved: true

  - id: q-earth-science-astronomy-fossils-and-geologic-time-0010
    type: 'identify'
    difficulty: 'medium'
    stem: |
      What is the time required for half of a radioactive parent isotope to decay in a closed system?
    choices:
      - text: 'Half-life'
        correct: true
      - text: 'A sedimentary stratum'
        rationale: |
          This selects a rock-layer label. Dating is often applied to rocks. Check the isotope-time definition.
      - text: 'A geologic epoch'
        rationale: |
          This selects a geologic time subdivision. Both measure time. Check whether the interval is defined by radioactive halving.
      - text: 'A superposition period'
        rationale: |
          This combines a layer-ordering law with a period label. Both are geology terms. Check the established term for decay timing.
    explanation: |
      A half-life is the time in which half the radioactive parent decays in the model. The immediate daughter can itself be radioactive.
    approved: true

  - id: q-earth-science-astronomy-fossils-and-geologic-time-0011
    type: 'simple-quantitative'
    difficulty: 'medium'
    stem: |
      A closed mineral’s dating clock began when it formed. A parent isotope with half-life 1 billion years now has one-quarter of its original amount remaining. What time has elapsed?
    choices:
      - text: '2 billion years'
        correct: true
      - text: '1 billion years'
        rationale: |
          This counts one halving. One half-life leaves half. Check the second halving needed to reach a quarter.
      - text: '4 billion years'
        rationale: |
          This uses the denominator four as the number of half-lives. A quarter is given. Check repeated halving rather than denominator size.
      - text: '0.25 billion years'
        rationale: |
          This multiplies duration by the remaining fraction. Both values are stated. Check that elapsed half-life count determines duration.
    explanation: |
      In the ideal halving model, the parent fraction goes $1\rightarrow\dfrac{1}{2}\rightarrow\dfrac{1}{4}$. Two half-lives have elapsed. At 1 billion years each, the duration is 2 billion years.
    approved: true

  - id: q-earth-science-astronomy-fossils-and-geologic-time-0012
    type: 'compare-contrast'
    difficulty: 'hard'
    stem: |
      A fault cuts two previously deposited rock layers. What relative age relation follows?
    choices:
      - text: 'Fault younger than both layers'
        correct: true
      - text: 'Fault older than both layers'
        rationale: |
          This treats the cutting feature as the first event. It visibly extends through the rocks. Check that those rocks must exist before being cut.
      - text: 'Fault and both layers exactly the same age'
        rationale: |
          This treats contact as simultaneous formation. Both layers meet the fault. Check the cross-cutting relationship.
      - text: 'Fault younger than only one of the layers it cuts'
        rationale: |
          This allows cutting one layer before that layer exists. The fault spans both. Check the requirement for every cut rock to predate the fault.
    explanation: |
      A fault cuts both sedimentary layers. It must have formed after the rocks it cuts. The fault is therefore younger than both layers.
    approved: true

  - id: q-earth-science-astronomy-fossils-and-geologic-time-0013
    type: 'classify'
    difficulty: 'hard'
    stem: |
      A student reasons, "Since one-quarter of the sample remains after 2 half-lives, one-eighth should remain after just 1 more half-life period entirely finishing the decay to zero." What is wrong with this reasoning?
    choices:
      - text: 'One eighth still remains in the model.'
        correct: true
      - text: 'After three modeled halvings the parent must be exactly zero.'
        rationale: |
          This stops the modeled decay at three cycles. The fractions get smaller. Check whether one eighth equals zero.
      - text: 'Every half-life removes the same fixed mass from the original.'
        rationale: |
          This subtracts a fixed amount each cycle. The first decrease is large. Check that each later decrease is half of what remains.
      - text: 'Only the first halving can be described by a half-life.'
        rationale: |
          This limits the definition to the first cycle. The first halving is easy to see. Check that the same rule applies to the remaining parent.
    explanation: |
      Each modeled half-life halves the amount remaining. After the third halving, $\dfrac{1}{4}\times\dfrac{1}{2}=\dfrac{1}{8}$. That is still a nonzero fraction in this model.
    approved: true

  - id: q-earth-science-astronomy-fossils-and-geologic-time-0014
    type: 'process-ordering'
    difficulty: 'medium'
    stem: |
      Arrange these units of the geologic time scale from largest to smallest: periods, eons, epochs, eras.
    choices:
      - text: 'Eons, eras, periods, epochs'
        correct: true
      - text: 'Eras, eons, periods, epochs'
        rationale: |
          This reverses eon and era. Both are large geological intervals. Check which contains the other.
      - text: 'Epochs, periods, eras, eons'
        rationale: |
          This reads the hierarchy backward. All requested terms are present. Check largest-to-smallest direction.
      - text: 'Eons, periods, eras, epochs'
        rationale: |
          This places period above era. Both subdivide larger intervals. Check that a period is contained within an era.
    explanation: |
      In the requested hierarchy, eons contain eras, eras contain periods, and periods contain epochs. The largest-to-smallest sequence is eon, era, period, epoch.
    approved: true

  - id: q-earth-science-astronomy-fossils-and-geologic-time-0015
    type: 'identify'
    difficulty: 'medium'
    stem: |
      Which informal span includes the Hadean, Archean, and Proterozoic eons, before the Phanerozoic?
    choices:
      - text: 'Precambrian'
        correct: true
      - text: 'The Paleozoic'
        rationale: |
          This selects the first era within the Phanerozoic. Paleozoic is early in familiar fossil history. Check whether the interval precedes the whole Phanerozoic.
      - text: 'The Mesozoic'
        rationale: |
          This selects the dinosaur-associated era. Mesozoic is ancient. Check the much earlier named eons.
      - text: 'The Cenozoic'
        rationale: |
          This selects the era after the end-Cretaceous extinction. Cenozoic is a formal era. Check the pre-Phanerozoic span.
    explanation: |
      Precambrian is the informal span before the Phanerozoic Eon. It includes Hadean, Archean, and Proterozoic time.
    approved: true

  - id: q-earth-science-astronomy-fossils-and-geologic-time-0016
    type: 'identify'
    difficulty: 'medium'
    stem: |
      Which era, whose name means "old life," includes the first fish, land plants, and early reptiles?
    choices:
      - text: 'The Paleozoic era'
        correct: true
      - text: 'The Mesozoic era'
        rationale: |
          This selects the following era associated with dinosaurs. Early reptiles may suggest that era. Check the earlier origins of the listed groups.
      - text: 'The Cenozoic era'
        rationale: |
          This selects the later mammal-radiation era. It includes many modern animals. Check the first appearances described.
      - text: 'The Precambrian'
        rationale: |
          This selects the pre-Phanerozoic span. It covers much of early Earth history. Check when the listed animal and land-plant groups diversified.
    explanation: |
      The Paleozoic contains the early history of fishes, land plants, and reptiles described in the question. Its name means old life.
    approved: true

  - id: q-earth-science-astronomy-fossils-and-geologic-time-0017
    type: 'identify'
    difficulty: 'medium'
    stem: |
      Which era, whose name means "middle life," is known as the age of the dinosaurs, and also saw the first mammals and flowering plants appear?
    choices:
      - text: 'The Mesozoic era'
        correct: true
      - text: 'The Paleozoic era'
        rationale: |
          This selects the preceding era. Paleozoic includes early vertebrate history. Check the dinosaur and flowering-plant clues together.
      - text: 'The Cenozoic era'
        rationale: |
          This selects the following era. Cenozoic includes mammal radiations. Check that mammals had appeared earlier too.
      - text: 'The Precambrian'
        rationale: |
          This selects the much earlier pre-Phanerozoic span. Both are ancient intervals. Check the dinosaur-associated era.
    explanation: |
      The Mesozoic is the era associated with dinosaurs. Early mammals and the rise of flowering plants also belong to its history.
    approved: true

  - id: q-earth-science-astronomy-fossils-and-geologic-time-0018
    type: 'identify'
    difficulty: 'medium'
    stem: |
      Which era, whose name means "new life," is the current era, often called the age of mammals, and is when humans evolved?
    choices:
      - text: 'The Cenozoic era'
        correct: true
      - text: 'The Mesozoic era'
        rationale: |
          This selects the era before Cenozoic. Mammals already existed then. Check the current-era and human-evolution clues.
      - text: 'The Paleozoic era'
        rationale: |
          This selects the earlier vertebrate-history era. It includes ancient animal development. Check the much later human lineage.
      - text: 'The Precambrian'
        rationale: |
          This selects the pre-Phanerozoic span. It covers most early Earth time. Check whether humans belong to that early interval.
    explanation: |
      The Cenozoic is the current era. It includes major mammal radiations and the much later evolution of humans.
    approved: true

  - id: q-earth-science-astronomy-fossils-and-geologic-time-0019
    type: 'classify'
    difficulty: 'hard'
    stem: |
      Which statement accurately places non-avian dinosaurs and mammals in the Mesozoic and Cenozoic?
    choices:
      - text: 'Early mammals coexisted with non-avian dinosaurs.'
        correct: true
      - text: 'Mammals first appeared only after the Mesozoic ended.'
        rationale: |
          This treats the later mammal radiation as mammals’ first appearance. The Cenozoic nickname emphasizes mammals. Check their earlier Mesozoic history.
      - text: 'All dinosaur lineages, including birds, ended with the Mesozoic.'
        rationale: |
          This treats every dinosaur lineage as extinct, including birds. The famous extinction affected non-avian dinosaurs. Check the lineage qualification.
      - text: 'Mesozoic and Cenozoic name exactly the same time interval.'
        rationale: |
          This treats two consecutive eras as the same interval. Both contain mammals. Check that Mesozoic precedes Cenozoic.
    explanation: |
      The Mesozoic included both non-avian dinosaurs and early mammals. Non-avian dinosaurs disappeared at its end. Mammals later diversified greatly in the Cenozoic.
    approved: true

  - id: q-earth-science-astronomy-fossils-and-geologic-time-0020
    type: 'classify'
    difficulty: 'medium'
    stem: |
      An undisturbed bed contains unreworked fossils deposited with the sediment, including non-avian dinosaurs and early flowering plants. Which era best fits?
    choices:
      - text: 'The Mesozoic era'
        correct: true
      - text: 'The Cenozoic era'
        rationale: |
          This selects later mammal-radiation history for a bed deposited with non-avian dinosaurs. Mammals also existed earlier. Check the dinosaur qualification.
      - text: 'The Paleozoic era'
        rationale: |
          This selects the earlier era before the listed dinosaur-and-flowering-plant combination. Some early vertebrates lived then. Check both fossil clues.
      - text: 'The Precambrian'
        rationale: |
          This selects the pre-Phanerozoic span. It covers ancient life. Check how much later the listed groups appeared.
    explanation: |
      The stated non-avian dinosaur and early flowering-plant fossils fit Mesozoic history. Their original depositional context supports placing the bed in that era.
    approved: true

  - id: q-earth-science-astronomy-fossils-and-geologic-time-0021
    type: 'predict-outcome'
    difficulty: 'exam'
    stem: |
      A geologist studies an undisturbed rock cliff with three layers, bottom to top: Layer 1, Layer 2, and Layer 3. Layer 1 contains a fossil of an early fish, Layer 2 contains a fossil of an early dinosaur, and Layer 3 contains a radioactive element with a half-life of 2 million years, of which only one-quarter of the original amount remains. Determine: (a) the relative order in which the three layers formed, (b) which era Layer 1's fossil most likely belongs to, and (c) the actual age of Layer 3.
    choices:
      - text: '(a) Layer 1 formed first (oldest), then Layer 2, then Layer 3 (youngest); (b) Layer 1''s early fish fossil belongs to the Paleozoic era; (c) Layer 3 is 4 million years old, since one-quarter remaining means two half-lives have passed (2 × 2 million years).'
        correct: true
      - text: '(a) Layer 3 formed first, then Layer 2, then Layer 1; (b) Layer 1''s fossil belongs to the Cenozoic era; (c) Layer 3 is 2 million years old.'
        rationale: |
          This reverses undisturbed layer order and counts only one half-life. The top layer can look most prominent. Check bottom-to-top order and repeated halving.
      - text: '(a) The layers cannot be ordered without radiometric dating on all three; (b) Layer 1''s fossil belongs to the Mesozoic era; (c) Layer 3 is 8 million years old.'
        rationale: |
          This rejects relative ordering and uses four half-lives for a quarter remaining. Numerical dates sound necessary for all comparisons. Check what superposition can establish and how many halvings give a quarter.
      - text: '(a) Layer 1 formed first, then Layer 2, then Layer 3; (b) Layer 1''s fossil belongs to the Mesozoic era; (c) Layer 3 is 1 million years old.'
        rationale: |
          This assigns the early-fish clue to the later dinosaur-associated era and halves the time incorrectly. Both involve old life and fractions. Check the fossil context and elapsed half-life count.
    explanation: |
      Superposition gives Layer 1, then Layer 2, then Layer 3 in depositional order. The intended early-fish association is Paleozoic. One-quarter parent remaining gives two half-lives, or $2\times2=4$ million years since the isotope clock began. Equating that clock with Layer 3 deposition also requires suitable minerals and dating assumptions.
    approved: true
