meta:
  subject: 'science'
  topic: 'earth-science-astronomy'
  subtopic: 'water-cycle-oceanography'
  exams: ["upcat", "dlsucet", "ustet", "dost-sei"]
questions:
  - id: q-earth-science-astronomy-water-cycle-oceanography-0001
    type: identify
    difficulty: easy
    stem: |
      What is the process called when heat from the Sun turns liquid water into water vapor, which rises into the atmosphere?
    choices:
      - text: 'Evaporation'
        correct: true
      - text: 'Condensation'
        rationale: |
          This reverses the state change. Both processes move water between gas and liquid. Check the starting state.
      - text: 'Precipitation'
        rationale: |
          This chooses falling water instead of vapor formation. Both move water in the cycle. Check state change versus falling.
      - text: 'Infiltration'
        rationale: |
          This chooses water entering soil. Both remove water from a surface. Check where the water goes.
    explanation: |
      Evaporation changes liquid water into water vapor. Solar heating supplies energy for water to enter the air as a gas.
    approved: true

  - id: q-earth-science-astronomy-water-cycle-oceanography-0002
    type: identify
    difficulty: easy
    stem: |
      What is the process called when rising water vapor cools and turns back into tiny liquid water droplets, forming clouds?
    choices:
      - text: 'Condensation'
        correct: true
      - text: 'Evaporation'
        rationale: |
          This reverses gas becoming liquid. Both are state changes. Check the direction.
      - text: 'Precipitation'
        rationale: |
          This confuses cloud formation with water falling. Droplets can later fall as rain. Check forming versus falling.
      - text: 'Runoff'
        rationale: |
          This selects flowing water on land. Clouds contain water too. Check atmosphere versus ground surface.
    explanation: |
      Condensation changes water vapor into liquid droplets. Cooling air can allow droplets to form clouds.
    approved: true

  - id: q-earth-science-astronomy-water-cycle-oceanography-0003
    type: identify
    difficulty: medium
    stem: |
      What is the process called when cloud droplets combine and grow heavy enough to fall back to Earth as rain, snow, sleet, or hail?
    choices:
      - text: 'Precipitation'
        correct: true
      - text: 'Evaporation'
        rationale: |
          This chooses liquid becoming gas. Both involve atmospheric water. Check whether water is falling or vaporizing.
      - text: 'Condensation'
        rationale: |
          This chooses droplet formation before the fall. Clouds form by condensation. Check the action described.
      - text: 'Transpiration'
        rationale: |
          This chooses leaf vapor loss instead of falling water. Plants add moisture to air. Check falling liquid or ice versus released vapor.
    explanation: |
      Water falling from clouds as rain, snow, sleet, or hail is precipitation. It returns water from the atmosphere to Earth's surface.
    approved: true

  - id: q-earth-science-astronomy-water-cycle-oceanography-0004
    type: identify
    difficulty: medium
    stem: |
      Which specific water-cycle process describes plants releasing water vapor through their leaves?
    choices:
      - text: 'Transpiration'
        correct: true
      - text: 'Evapotranspiration'
        rationale: |
          This uses the combined vapor-source term for leaf loss alone. It includes plant vapor along with other surface evaporation. Check the request for the plant-only process.
      - text: 'Condensation'
        rationale: |
          This reverses vapor release into liquid formation. Leaves can collect droplets. Check the direction of the state change.
      - text: 'Runoff'
        rationale: |
          This substitutes liquid surface flow for leaf vapor loss. Plants use liquid water. Check the form released to the air.
    explanation: |
      Transpiration is the release of water vapor from plants through their leaves. It adds plant-derived vapor to the air.
    approved: true

  - id: q-earth-science-astronomy-water-cycle-oceanography-0005
    type: classify
    difficulty: hard
    stem: |
      Evapotranspiration is reported for a forest and nearby lake. Which pair of sources does this combined term include?
    choices:
      - text: 'Leaf vapor loss and surface evaporation'
        correct: true
      - text: 'Leaf vapor loss and groundwater infiltration'
        rationale: |
          This substitutes soil entry for surface vapor loss. Groundwater supplies plants. Check whether both processes add vapor to air.
      - text: 'Cloud condensation and rainfall'
        rationale: |
          This selects processes that return atmospheric vapor to liquid water. Both affect moisture. Check vapor sources rather than cloud and rain formation.
      - text: 'Surface runoff and cloud condensation'
        rationale: |
          This combines liquid movement with vapor turning into droplets. Both belong to the water cycle. Check the meaning of evaporation plus transpiration.
    explanation: |
      Evapotranspiration combines evaporation with transpiration. It includes vapor entering air from surfaces and vapor released by plant leaves.
    approved: true

  - id: q-earth-science-astronomy-water-cycle-oceanography-0006
    type: classify
    difficulty: medium
    stem: |
      After a heavy rainstorm, some water soaks slowly into the soil, while the rest flows quickly over the ground surface into a nearby river. Identify which process is which.
    choices:
      - text: 'Soaking is infiltration; surface flow is runoff.'
        correct: true
      - text: 'Soaking is runoff; surface flow is infiltration.'
        rationale: |
          This swaps the two water paths. Both lead away from the original surface. Check into soil versus across soil.
      - text: 'Both are infiltration because both involve rainwater.'
        rationale: |
          This extends soaking to all rainwater. Some rain does enter soil. Check the path of the surface-flow portion.
      - text: 'Both are runoff because both water paths lead downward.'
        rationale: |
          This uses downward motion for both names. Both can move downhill. Check whether the water enters soil or stays above it.
    explanation: |
      Infiltration carries water into soil. Runoff carries water over the ground surface. The same rainfall can follow both paths.
    approved: true

  - id: q-earth-science-astronomy-water-cycle-oceanography-0007
    type: identify
    difficulty: medium
    stem: |
      After rainfall, soil absorbs water that later supplies groundwater. Which process first moves the water into the soil?
    choices:
      - text: 'Infiltration'
        correct: true
      - text: 'Runoff'
        rationale: |
          This selects surface flow rather than soil entry. Rainwater can reach streams. Check the underground destination.
      - text: 'Evaporation'
        rationale: |
          This changes liquid into vapor. Both can remove surface water. Check the state and destination.
      - text: 'Transpiration'
        rationale: |
          This chooses vapor leaving plants. Groundwater can supply roots. Check entry into soil versus release from leaves.
    explanation: |
      Infiltration moves surface water into soil. This can help replenish groundwater.
    approved: true

  - id: q-earth-science-astronomy-water-cycle-oceanography-0008
    type: identify
    difficulty: medium
    stem: |
      A formerly porous area is paved with a surface that blocks soil entry. Under otherwise similar rainfall, which response is expected?
    choices:
      - text: 'More surface runoff'
        correct: true
      - text: 'More infiltration beneath the pavement'
        rationale: |
          This reverses the effect of blocking soil entry. Rain still reaches the surface. Check the barrier to infiltration.
      - text: 'No runoff because rainfall cannot move on pavement'
        rationale: |
          This treats blocked entry as blocked movement. Pavement covers the soil. Check whether water can flow over its top.
      - text: 'All rainfall immediately becomes plant transpiration'
        rationale: |
          This requires leaves to remove every drop. Plants do release vapor. Check the stated paved surface and liquid rainfall.
    explanation: |
      The pavement prevents much of the water from entering the soil. More water remains at the surface. That water can flow away as runoff.
    approved: true

  - id: q-earth-science-astronomy-water-cycle-oceanography-0009
    type: classify
    difficulty: hard
    stem: |
      Which statement correctly compares evaporation and condensation?
    choices:
      - text: 'They reverse the liquid-gas state change.'
        correct: true
      - text: 'Both change liquid water into gas.'
        rationale: |
          This copies evaporation's direction onto both processes. Both involve liquid and gas. Check each starting state.
      - text: 'Both change water vapor into liquid.'
        rationale: |
          This copies condensation's direction onto both processes. Both involve vapor. Check whether the process starts with liquid.
      - text: 'They are names for liquid water moving into soil.'
        rationale: |
          This confuses state change with infiltration. All involve water movement. Check whether the state changes.
    explanation: |
      Evaporation changes liquid water into gas. Condensation changes gas into liquid. They reverse the same change of state.
    approved: true

  - id: q-earth-science-astronomy-water-cycle-oceanography-0010
    type: classify
    difficulty: medium
    stem: |
      A cloud's droplets have formed, but none are falling to the ground yet. Which statement describes the stages observed so far?
    choices:
      - text: 'Condensation occurred; precipitation has not begun.'
        correct: true
      - text: 'Precipitation occurred; condensation has not begun.'
        rationale: |
          This places falling water before forming droplets in this setup. Clouds often lead to rain. Check whether anything is falling.
      - text: 'Infiltration occurred; evaporation has not begun.'
        rationale: |
          This assigns a soil process to cloud formation. Both can store water. Check the location.
      - text: 'Runoff occurred; condensation has not begun.'
        rationale: |
          This assigns ground-surface flow to a cloud. Both contain liquid water. Check where movement occurs.
    explanation: |
      Cloud droplets form when vapor condenses. Precipitation is water falling from clouds. The given cloud has formed droplets but has not yet produced precipitation.
    approved: true

  - id: q-earth-science-astronomy-water-cycle-oceanography-0011
    type: identify
    difficulty: medium
    stem: |
      About what percentage of all the water on Earth is held in the oceans?
    choices:
      - text: 'About $96\%$'
        correct: true
      - text: 'About $71\%$'
        rationale: |
          This uses ocean surface-area coverage for water amount. Both are common ocean percentages. Check area versus water volume.
      - text: 'About $50\%$'
        rationale: |
          This assumes about half the water is outside oceans. Land occupies a large area. Check stored water rather than land area.
      - text: 'About $4\%$'
        rationale: |
          This uses the approximate non-ocean share as the ocean share. The two portions add to the whole. Check which reservoir is named.
    explanation: |
      Oceans hold about $96\%$ of Earth's total water. This percentage refers to the water amount, not the area covered by oceans.
    approved: true

  - id: q-earth-science-astronomy-water-cycle-oceanography-0012
    type: classify
    difficulty: hard
    stem: |
      A simplified inventory assigns $96\%$ of Earth's water to oceans. What share remains for all other reservoirs combined?
    choices:
      - text: '$4\%$'
        correct: true
      - text: '$96\%$'
        rationale: |
          This copies the ocean share for the rest. The given value is prominent. Check that the question asks for the remainder.
      - text: '$104\%$'
        rationale: |
          This adds instead of subtracting from the whole. $100+4$ gives 104. Check that a share cannot exceed the full inventory.
      - text: '$48\%$'
        rationale: |
          This halves the ocean share instead of finding the remainder. $96\div2=48$. Check the total-minus-part operation.
    explanation: |
      The whole inventory is $100\%$. Subtract the ocean share: $100-96=4$. Other reservoirs together hold $4\%$ in this simplified inventory.
    approved: true

  - id: q-earth-science-astronomy-water-cycle-oceanography-0013
    type: cause-effect
    difficulty: medium
    stem: |
      Why does most of the water vapor found in Earth's atmosphere come from the ocean rather than from lakes, rivers, or plants?
    choices:
      - text: 'Oceans expose a vast water surface to solar heating.'
        correct: true
      - text: 'Ocean salt turns into vapor more readily than water.'
        rationale: |
          This treats salt as the water vapor source. Ocean water is salty. Check which substance forms the vapor.
      - text: 'Plants and rivers provide no atmospheric water vapor.'
        rationale: |
          This excludes smaller vapor sources. Oceans provide the largest share. Check whether largest means only.
      - text: 'Water can evaporate only above an ocean surface.'
        rationale: |
          This makes evaporation depend on being an ocean. Ocean evaporation is common. Check whether other exposed water surfaces can lose water.
    explanation: |
      Oceans cover most of Earth's surface. Their broad exposed water surface receives solar energy. This makes ocean evaporation the largest source of atmospheric water vapor.
    approved: true

  - id: q-earth-science-astronomy-water-cycle-oceanography-0014
    type: identify
    difficulty: medium
    stem: |
      What term describes ocean water's saltiness, distinguishing it from most water in lakes and rivers?
    choices:
      - text: 'Saline'
        correct: true
      - text: 'Saturated'
        rationale: |
          This treats having salt as holding the maximum possible amount. Both describe a solution. Check salt presence versus the solubility limit.
      - text: 'Distilled'
        rationale: |
          This applies a purified-water description to natural seawater. Both are water. Check the dissolved salts.
      - text: 'Turbid'
        rationale: |
          This treats suspended particles as dissolved salt. Both affect water properties. Check cloudiness versus salt content.
    explanation: |
      Saline means salty. Ocean water contains dissolved salts, so it is saline.
    approved: true

  - id: q-earth-science-astronomy-water-cycle-oceanography-0015
    type: identify
    difficulty: medium
    stem: |
      Ocean water is layered based on two main factors. What are they?
    choices:
      - text: 'Temperature and density'
        correct: true
      - text: 'Salinity and color'
        rationale: |
          This uses visible color as a layering factor. Salinity can affect density. Check the pair asked for rather than color.
      - text: 'Depth and sunlight only, unrelated to temperature'
        rationale: |
          This ignores the link between sunlight and temperature. Depth changes light exposure. Check temperature and density together.
      - text: 'Wave height and wind speed'
        rationale: |
          This uses surface conditions as the layer classification. Wind and waves mix water. Check what distinguishes the deeper layers.
    explanation: |
      The lesson describes ocean layers using temperature and density. The typical surface is warmer and sunlit. Deep water is colder, denser, and beyond sunlight's reach.
    approved: true

  - id: q-earth-science-astronomy-water-cycle-oceanography-0016
    type: cause-effect
    difficulty: medium
    stem: |
      What drives ocean currents, and why are they important for redistributing heat around the planet?
    choices:
      - text: 'Wind, density differences, and rotation help move heat.'
        correct: true
      - text: 'Only lunar gravity drives all currents and heat transport.'
        rationale: |
          This treats a tidal influence as the sole current mechanism. The Moon affects ocean motion. Check wind and density too.
      - text: 'All currents flow without carrying energy between regions.'
        rationale: |
          This separates water movement from its heat content. Motion can be considered alone. Check whether warm water carries energy.
      - text: 'Only sunlight''s visible brightness sets current direction.'
        rationale: |
          This treats illumination as the only driver of motion. Sunlight warms surface water. Check wind, density, and rotation.
    explanation: |
      Wind and density differences help drive ocean currents, and Earth's rotation affects their motion. Moving water carries thermal energy. Currents therefore redistribute heat around the planet.
    approved: true

  - id: q-earth-science-astronomy-water-cycle-oceanography-0017
    type: predict-outcome
    difficulty: exam
    stem: |
      Heat from the Sun warms a large stretch of ocean, sending water vapor rising into the sky. High in the atmosphere, the vapor cools and forms clouds, which later release heavy rain over a mountainous region. Some of this rain seeps into the ground, and the rest flows down the mountainside into a river that eventually reaches the sea. Identify, in order, the water cycle stages this scenario describes.
    choices:
      - text: 'Evaporation, condensation, precipitation, infiltration and runoff'
        correct: true
      - text: 'Condensation, evaporation, precipitation, infiltration and runoff'
        rationale: |
          This reverses the first two state changes. Both involve air and water. Check the ocean-to-vapor step first.
      - text: 'Evaporation, precipitation, condensation, runoff without infiltration'
        rationale: |
          This puts rain before cloud formation and leaves out soil entry. Rain is a visible stage. Check the stated cloud and seeping steps.
      - text: 'Infiltration, runoff, condensation, evaporation without precipitation'
        rationale: |
          This starts with soil entry before the stated ocean evaporation and omits rain. The water cycle has several paths. Check the order in this particular scenario.
    explanation: |
      The ocean first releases vapor by evaporation. Cooling forms cloud droplets by condensation. Rain is precipitation. Soil entry is infiltration, and surface flow is runoff.
    approved: true

  - id: q-earth-science-astronomy-water-cycle-oceanography-0018
    type: compare-contrast
    difficulty: easy
    stem: |
      Which description best fits typical deep ocean water compared with the sunlit surface layer?
    choices:
      - text: 'Colder, denser, and unlit'
        correct: true
      - text: 'Warmer, denser, and strongly sunlit'
        rationale: |
          This carries surface heating and light into the deep ocean. Deep water can be dense. Check whether sunlight reaches it.
      - text: 'Colder, less dense, and strongly sunlit'
        rationale: |
          This combines the deep cold condition with surface light and low density. One detail fits. Check all three properties.
      - text: 'Warmer, less dense, and equally sunlit'
        rationale: |
          This transfers the whole surface pattern to the deep ocean. Both layers are water. Check temperature, density, and sunlight with depth.
    explanation: |
      Sunlight mainly warms upper ocean water. Deep water is beyond sunlight's reach. The lesson describes it as colder and denser than the surface layer.
    approved: false

  - id: q-earth-science-astronomy-water-cycle-oceanography-0019
    type: predict-outcome
    difficulty: hard
    stem: |
      A current carries warm surface water from one region to a cooler region. What is its direct contribution to the planet's heat distribution?
    choices:
      - text: 'It transports thermal energy.'
        correct: true
      - text: 'It makes the moving water lose all its heat.'
        rationale: |
          This assumes motion removes all energy. Water can cool along a route. Check whether it still carries heat while moving.
      - text: 'It prevents any heat from leaving the original region.'
        rationale: |
          This denies transport despite moving warm water. Heat may stay partly in a region. Check the energy carried by the moving water.
      - text: 'It changes all water in the receiving region into vapor.'
        rationale: |
          This assumes heat transport forces complete evaporation. Heat can support evaporation. Check whether every arrival requires a state change.
    explanation: |
      Warm water contains thermal energy. As the current moves that water, it carries energy to another region. This redistributes heat.
    approved: false

  - id: q-earth-science-astronomy-water-cycle-oceanography-0020
    type: classify
    difficulty: exam
    stem: |
      A diagram starts its water-cycle arrows at evaporation. Which interpretation is accurate?
    choices:
      - text: 'The chosen starting point helps show a continuous cycle.'
        correct: true
      - text: 'Evaporation was the first water process ever to occur.'
        rationale: |
          This turns a drawing convention into a historical claim. The first arrow looks like a beginning. Check description order versus Earth's history.
      - text: 'Water cannot enter the cycle through transpiration.'
        rationale: |
          This makes the diagram's first stage its only vapor source. Evaporation is important. Check the plant contribution.
      - text: 'Every water molecule must follow the identical arrow sequence.'
        rationale: |
          This turns one depicted route into a requirement for every molecule. A simple loop is easy to follow. Check alternative paths such as infiltration.
    explanation: |
      The water cycle has no true starting point. A diagram chooses one place to begin its description. Water keeps moving among reservoirs through different paths.
    approved: false
