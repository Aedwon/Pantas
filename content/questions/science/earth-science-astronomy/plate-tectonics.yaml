meta:
  subject: 'science'
  topic: 'earth-science-astronomy'
  subtopic: 'plate-tectonics'
  exams: ["upcat", "dlsucet", "ustet", "dost-sei"]
questions:
  - id: q-earth-science-astronomy-plate-tectonics-0001
    type: identify
    difficulty: easy
    stem: |
      What are the large pieces of Earth's rigid outer shell, which slowly move over the softer mantle beneath, called?
    choices:
      - text: 'Tectonic plates'
        correct: true
      - text: 'Pieces of the crust alone'
        rationale: |
          This leaves out the rigid uppermost mantle. The crust is the visible surface. Check the full lithosphere thickness.
      - text: 'Separate asthenosphere blocks'
        rationale: |
          This gives the weaker underlying region a rigid-block structure. It is connected with plate movement. Check which region is rigid.
      - text: 'Pieces of liquid mantle material'
        rationale: |
          This treats slow mantle flow as a liquid ocean. Liquids move easily. Check the mantle's mostly solid state.
    explanation: |
      Tectonic plates are pieces of the rigid lithosphere. They contain crust and rigid uppermost mantle. They move above weaker, mostly solid mantle rock.
    approved: true

  - id: q-earth-science-astronomy-plate-tectonics-0002
    type: identify
    difficulty: medium
    stem: |
      Which scientist assembled coastline, fossil, rock, and paleoclimate evidence for continental drift?
    choices:
      - text: 'Alfred Wegener'
        correct: true
      - text: 'Harry Hess'
        rationale: |
          This credits the later seafloor-spreading contributor with the named continental evidence. Both are part of tectonic history. Check the continental-drift proposal.
      - text: 'J. Tuzo Wilson'
        rationale: |
          This credits a later plate-tectonics contributor with Wegener's evidence. Both studied moving continents. Check the specific continental-drift work.
      - text: 'Arthur Holmes'
        rationale: |
          This credits a mantle-convection contributor with Wegener's evidence. Both tried to explain moving continents. Check evidence assembly versus a motion mechanism.
    explanation: |
      Alfred Wegener assembled evidence that separated continents had once been joined. Matching fossils, rocks, coastlines, and past climate clues supported his continental-drift proposal.
    approved: true

  - id: q-earth-science-astronomy-plate-tectonics-0003
    type: identify
    difficulty: medium
    stem: |
      In 1959, which scientist proposed seafloor spreading, explaining that new ocean floor forms at mid-ocean ridges and pushes older seafloor away?
    choices:
      - text: 'Harry Hess'
        correct: true
      - text: 'Alfred Wegener'
        rationale: |
          This chooses the earlier continental-drift proposer. Both concern moving continents. Check the specific ridge-based seafloor model.
      - text: 'Georges Lemaître'
        rationale: |
          This assigns a tectonic process to a cosmologist. Both study large systems. Check Earth history versus universe history.
      - text: 'Edwin Hubble'
        rationale: |
          This assigns a tectonic process to a galaxy observer. Both involve measured motion. Check which motion is being explained.
    explanation: |
      Harry Hess developed the seafloor-spreading model. New oceanic crust forms at ridges and moves away. His account was circulated around $1960$ and published in $1962$.
    approved: true

  - id: q-earth-science-astronomy-plate-tectonics-0004
    type: cause-effect
    difficulty: medium
    stem: |
      Matching fossils of a land reptile occur in corresponding ancient rocks in South America and Africa. How does this support continental drift?
    choices:
      - text: 'The continents may once have been joined.'
        correct: true
      - text: 'The present ocean must always have separated them.'
        rationale: |
          This treats present separation as permanent. The ocean is wide today. Check whether geography can change through time.
      - text: 'The reptiles must have evolved independently with identical histories.'
        rationale: |
          This requires separate identical histories instead of a former connection. Similar animals can occur in different places. Check corresponding fossil and rock evidence together.
      - text: 'All matching fossils must have formed after an ocean crossing.'
        rationale: |
          This assumes the current ocean existed during fossil formation. The fossils now face an ocean. Check the continents' past arrangement.
    explanation: |
      A land reptile could spread across connected land. Separation of that land later leaves matching fossils on different continents. This fits a formerly joined South America and Africa.
    approved: true

  - id: q-earth-science-astronomy-plate-tectonics-0005
    type: classify
    difficulty: hard
    stem: |
      What was a major weakness in Wegener's original continental-drift proposal?
    choices:
      - text: 'It lacked a convincing motion mechanism.'
        correct: true
      - text: 'It included no comparison of fossils on separate continents.'
        rationale: |
          This ignores a major part of Wegener's evidence. Fossils are easy to overlook beside coastlines. Check the evidence he assembled.
      - text: 'It required every continent to stay fixed forever.'
        rationale: |
          This reverses what drift proposes. Present coastlines seem fixed. Check whether the proposal involves motion.
      - text: 'It already explained seafloor magnetic stripes in full detail.'
        rationale: |
          This credits later ocean-floor work to the earlier proposal. Both support plate tectonics. Check the sequence of evidence.
    explanation: |
      Wegener assembled evidence for past continental connections. His proposal lacked a convincing explanation for how the continents moved. Later ocean-floor evidence helped develop plate tectonics.
    approved: true

  - id: q-earth-science-astronomy-plate-tectonics-0006
    type: identify
    difficulty: medium
    stem: |
      At which type of plate boundary do two plates move apart from each other, with magma rising to fill the gap and create new crust?
    choices:
      - text: 'Divergent'
        correct: true
      - text: 'Convergent'
        rationale: |
          This chooses plates moving together. Both boundary types can have magma. Check the direction of plate motion.
      - text: 'Transform'
        rationale: |
          This chooses lateral sliding. Both involve relative motion. Check separation versus sideways motion.
      - text: 'A subduction zone'
        rationale: |
          This selects a sinking-plate setting. Such settings can have volcanism. Check creation at a spreading center versus descent.
    explanation: |
      At a divergent boundary, plates move apart. Magma can rise and cool at the spreading center. This creates new oceanic crust.
    approved: true

  - id: q-earth-science-astronomy-plate-tectonics-0007
    type: identify
    difficulty: medium
    stem: |
      At which type of plate boundary do two plates move toward each other and collide, sometimes causing one plate to be pushed underneath the other?
    choices:
      - text: 'Convergent'
        correct: true
      - text: 'Divergent'
        rationale: |
          This reverses approach into separation. Both are boundaries. Check the motion described.
      - text: 'Transform'
        rationale: |
          This substitutes lateral sliding for approach. Both can cause earthquakes. Check whether plates move toward each other.
      - text: 'A spreading center'
        rationale: |
          This selects the new-crust setting. Both can change Earth's surface. Check the approaching plates.
    explanation: |
      Convergent plates move toward each other. Oceanic lithosphere may descend beneath another plate, or continental plates may collide.
    approved: true

  - id: q-earth-science-astronomy-plate-tectonics-0008
    type: identify
    difficulty: medium
    stem: |
      At which type of plate boundary do two plates slide past each other sideways, without creating or destroying crust?
    choices:
      - text: 'Transform'
        correct: true
      - text: 'Divergent'
        rationale: |
          This chooses separation and spreading. Both involve moving plates. Check sideways motion versus moving apart.
      - text: 'Convergent'
        rationale: |
          This chooses approach and collision. Both can produce earthquakes. Check the direction of motion.
      - text: 'A subduction zone'
        rationale: |
          This chooses descent of one plate. Both can have faults. Check lateral sliding versus sinking.
    explanation: |
      Transform plates slide laterally past each other. Crust is not systematically created or destroyed along the transform itself.
    approved: true

  - id: q-earth-science-astronomy-plate-tectonics-0009
    type: classify
    difficulty: medium
    stem: |
      Rocks on opposite sides of a fault move mainly horizontally past each other. Which fault type fits this motion?
    choices:
      - text: 'Strike-slip'
        correct: true
      - text: 'Reverse fault'
        rationale: |
          This chooses a compressional fault with mainly vertical displacement. Both can release stress. Check horizontal versus vertical motion.
      - text: 'Normal fault'
        rationale: |
          This chooses extension-related displacement. Both can form fractures. Check the motion along the fault.
      - text: 'Thrust fault'
        rationale: |
          This chooses a low-angle compressional fault. Both can produce earthquakes. Check the stated horizontal motion.
    explanation: |
      A strike-slip fault has mainly horizontal movement. Rocks slide past one another along the fault.
    approved: true

  - id: q-earth-science-astronomy-plate-tectonics-0010
    type: classify
    difficulty: hard
    stem: |
      A student assumes every convergent boundary produces the exact same outcome, regardless of which plates are involved. Is this correct?
    choices:
      - text: 'Oceanic subduction and continental collision can differ.'
        correct: true
      - text: 'Every convergence requires identical oceanic subduction.'
        rationale: |
          This applies one boundary outcome to every plate pair. Subduction is common. Check whether both plates are continental.
      - text: 'Every convergence creates a new spreading center.'
        rationale: |
          This reverses convergence into divergence. Both can reshape crust. Check approach versus separation.
      - text: 'Every convergence consists only of sideways sliding.'
        rationale: |
          This changes convergence into transform motion. Both can have faults. Check the motion toward each other.
    explanation: |
      Convergent boundaries bring plates together. An oceanic plate may subduct. When continental plates meet, they can collide, so the boundary outcome depends on the plates.
    approved: true

  - id: q-earth-science-astronomy-plate-tectonics-0011
    type: identify
    difficulty: medium
    stem: |
      What is a crack in Earth's crust where rock on either side has moved, and which produces an earthquake when built-up stress along it suddenly releases?
    choices:
      - text: 'A fault'
        correct: true
      - text: 'An unbroken rock layer'
        rationale: |
          This leaves out the fracture and movement. A layer can carry stress. Check whether there has been slip across a break.
      - text: 'A magma chamber'
        rationale: |
          This substitutes stored magma for a moving fracture. Volcanoes can have earthquakes. Check the structure actually described.
      - text: 'A seismic wave'
        rationale: |
          This chooses the traveling energy instead of its source fracture. Waves follow earthquake slip. Check source versus resulting disturbance.
    explanation: |
      A fault is a fracture or fracture zone along which rocks have moved. Sudden slip releases built-up stress and can produce an earthquake.
    approved: true

  - id: q-earth-science-astronomy-plate-tectonics-0012
    type: identify
    difficulty: medium
    stem: |
      Which type of seismic wave is the fastest, arriving first at a seismograph station, and can travel through both solids and liquids?
    choices:
      - text: 'P waves (primary waves)'
        correct: true
      - text: 'S waves (secondary waves)'
        rationale: |
          This substitutes the slower shear waves. Both begin at an earthquake. Check first arrival and liquid transmission.
      - text: 'Both P and S waves equally'
        rationale: |
          This gives different wave types the same speed and transmission behavior. They share an origin. Check the observed arrival order.
      - text: 'Neither type of wave can travel through liquid'
        rationale: |
          This applies shear-wave blockage to pressure waves. Liquid cannot support shear propagation. Check compression versus shear.
    explanation: |
      P waves are pressure waves. In the usual body-wave comparison, they travel faster than S waves and arrive first. They can pass through solids and liquids.
    approved: true

  - id: q-earth-science-astronomy-plate-tectonics-0013
    type: identify
    difficulty: medium
    stem: |
      Which type of seismic wave is slower than P waves and can only travel through solids, not liquids?
    choices:
      - text: 'S waves (secondary waves)'
        correct: true
      - text: 'P waves (primary waves)'
        rationale: |
          This uses the faster pressure-wave type. Both are earthquake waves. Check which requires shear rigidity.
      - text: 'Both P and S waves equally'
        rationale: |
          This gives distinct wave types equal properties. Both can travel through rock. Check their speeds and liquid behavior separately.
      - text: 'Neither type of wave can travel through solids'
        rationale: |
          This denies transmission through the starting rock. Both are seismic body waves. Check that solids support them.
    explanation: |
      S waves are shear waves. They move more slowly than P waves in the usual comparison. They need shear rigidity, so they travel through solids and cannot propagate through liquids.
    approved: true

  - id: q-earth-science-astronomy-plate-tectonics-0014
    type: classify
    difficulty: hard
    stem: |
      A choice claims "S waves are faster than P waves and can travel through both solids and liquids," swapping the two wave types' properties. Is this correct?
    choices:
      - text: 'No: this reverses the properties; P waves are actually faster and travel through both solids and liquids, while S waves are slower and travel through solids only.'
        correct: true
      - text: 'Yes: S waves are indeed faster and can travel through both solids and liquids.'
        rationale: |
          This switches pressure-wave properties onto shear waves. Both originate at earthquakes. Check arrival order and liquid transmission.
      - text: 'No: but only because neither P waves nor S waves can travel through solids.'
        rationale: |
          This denies propagation in rock. Liquids block shear waves. Check that solids can transmit both wave types.
      - text: 'Yes: P waves and S waves have identical speed and travel through identical materials.'
        rationale: |
          This gives two different wave types identical behavior. Both travel through rock. Check speed and shear rigidity.
    explanation: |
      P waves usually arrive before S waves because they travel faster through the same rock. P waves pass through solids and liquids. S waves propagate through solids, which can resist shear.
    approved: true

  - id: q-earth-science-astronomy-plate-tectonics-0015
    type: cause-effect
    difficulty: medium
    stem: |
      A seismograph station records the P wave from an earthquake arriving several seconds before the S wave. Why does a larger time gap between the two waves indicate a greater distance to the earthquake's origin?
    choices:
      - text: 'The faster wave gains more time over a longer trip.'
        correct: true
      - text: 'Both waves leave the source at increasingly different times.'
        rationale: |
          This turns a travel-time difference into separate release times. The arrivals are separated. Check that the comparison uses waves from one event.
      - text: 'A larger gap means a shorter trip for both waves.'
        rationale: |
          This reverses the distance-gap relation. Both waves take less time on short paths. Check whether the faster wave gains more lead on a long path.
      - text: 'The gap measures only the earthquake''s strength.'
        rationale: |
          This confuses arrival timing with amplitude. Strong earthquakes are easy to notice. Check which measurement relates to travel distance.
    explanation: |
      P waves travel faster than S waves through the same rock. Over a longer path, their arrival times separate more. A larger gap can therefore indicate a greater source distance.
    approved: true

  - id: q-earth-science-astronomy-plate-tectonics-0016
    type: classify
    difficulty: medium
    stem: |
      At which two types of plate boundaries do most volcanoes form?
    choices:
      - text: 'Convergent boundaries and divergent boundaries'
        correct: true
      - text: 'Transform boundaries and divergent boundaries'
        rationale: |
          This pairs spreading with sideways slip. Transforms can cause earthquakes. Check which boundary processes generate magma.
      - text: 'Transform boundaries and convergent boundaries'
        rationale: |
          This pairs subduction with sideways slip. Both involve faults. Check magma formation rather than earthquake occurrence.
      - text: 'Only at transform boundaries'
        rationale: |
          This uses sideways sliding as the only volcanic setting. Friction sounds like a heat source. Check spreading and subduction-related partial melting.
    explanation: |
      Divergent boundaries can supply magma at spreading centers. At many convergent boundaries, water released from the descending slab helps mantle rock partly melt. The magma can rise and feed volcanoes.
    approved: true

  - id: q-earth-science-astronomy-plate-tectonics-0017
    type: classify
    difficulty: hard
    stem: |
      The Hawaiian Islands are a volcanic island chain located in the middle of a tectonic plate, far from any plate boundary. A student claims this is impossible, since "all volcanoes form at plate boundaries." Is this claim correct?
    choices:
      - text: 'No: a hotspot is a place where magma rises from deep within the mantle, independent of any plate boundary, and can create volcanic islands like the Hawaiian Islands even in the middle of a plate.'
        correct: true
      - text: 'Yes: the Hawaiian Islands must actually sit exactly on a plate boundary.'
        rationale: |
          This relocates Hawaii to a boundary to fit a general rule. Many volcanoes are at boundaries. Check the stated interior location.
      - text: 'Yes: all volcanoes, without exception, form only at plate boundaries.'
        rationale: |
          This turns a common setting into an absolute requirement. Boundary volcanism is widespread. Check whether intraplate volcanism also occurs.
      - text: 'No: but only because the Hawaiian Islands are not actually volcanic in origin.'
        rationale: |
          This rejects the islands' volcanic origin to preserve the rule. The location is unusual for a boundary volcano. Check geological evidence of volcanic rock.
    explanation: |
      Hawaii is a volcanic chain within the Pacific Plate. A hotspot supplies magma beneath the moving plate. Repeated eruptions build volcanic islands as the plate moves across the source.
    approved: true

  - id: q-earth-science-astronomy-plate-tectonics-0018
    type: cause-effect
    difficulty: medium
    stem: |
      At a convergent boundary between an oceanic plate and a continental plate, the oceanic plate sinks beneath the continental plate. Why does the oceanic plate sink rather than the continental plate?
    choices:
      - text: 'The oceanic plate is denser than the continental plate, so in subduction, the denser plate is pushed underneath the less dense one.'
        correct: true
      - text: 'The continental plate is always denser, so it should sink instead, but friction prevents this.'
        rationale: |
          This reverses the typical density contrast and adds a friction explanation. Friction affects plate motion. Check the density of the lithosphere first.
      - text: 'Plate density has no role in determining which plate sinks during subduction.'
        rationale: |
          This removes buoyancy from the explanation. Plates are also pushed and pulled. Check how a dense slab can sink.
      - text: 'Both plates always sink equally at every convergent boundary.'
        rationale: |
          This assumes symmetric descent for unequal plates. Both approach the boundary. Check which plate becomes the descending slab.
    explanation: |
      Typical oceanic lithosphere is denser than continental lithosphere. When it is sufficiently dense relative to the material beneath it, its negative buoyancy helps it descend at a subduction zone.
    approved: true

  - id: q-earth-science-astronomy-plate-tectonics-0019
    type: cause-effect
    difficulty: medium
    stem: |
      Scientists first discovered that Earth's outer core is liquid partly by observing that S waves from earthquakes disappear on the far side of the planet, forming a "shadow zone." Why does this observation reveal the outer core's liquid state?
    choices:
      - text: 'Since S waves can only travel through solids and not liquids, their disappearance in a shadow zone on the far side of Earth indicates a liquid layer (the outer core) blocking them from passing through.'
        correct: true
      - text: 'S waves travel through both solids and liquids equally, so their disappearance must be caused by something other than the outer core.'
        rationale: |
          This gives shear waves liquid transmission. P waves can cross liquid. Check the specific wave type.
      - text: 'P waves, not S waves, are the type of wave that reveals information about the outer core.'
        rationale: |
          This excludes one kind of evidence because another also contributes. P-wave paths do reveal the core. Check that S-wave blockage provides separate information.
      - text: 'The shadow zone shows that the outer core is solid, not liquid.'
        rationale: |
          This reverses the state inference. Solid material can resist shear. Check which state prevents S-wave transmission.
    explanation: |
      S waves need a material that resists shear. Liquid outer-core material cannot transmit them. Their absence across paths through that layer supports its liquid state.
    approved: true

  - id: q-earth-science-astronomy-plate-tectonics-0020
    type: predict-outcome
    difficulty: exam
    stem: |
      A region sits where two continental plates are slowly colliding, with neither plate sinking beneath the other. Nearby, seismographs also detect a location where P waves consistently arrive shortly before S waves, and a separate volcanic island chain sits far from any mapped plate boundary. Identify: (a) the landform most likely produced by the colliding continental plates, (b) what the P-S wave gap tells scientists, and (c) what most likely explains the isolated volcanic island chain.
    choices:
      - text: '(a) A mountain range, since neither continental plate is dense enough to subduct; (b) the size of the gap indicates the earthquake''s distance from the station; (c) a hotspot, since the island chain is unrelated to any plate boundary.'
        correct: true
      - text: '(a) A deep ocean trench from subduction; (b) the gap indicates the earthquake''s magnitude; (c) the island chain must actually sit on an undiscovered plate boundary.'
        rationale: |
          This assumes subduction despite the stated collision without sinking, and uses timing as magnitude. Trenches and strong earthquakes are familiar tectonic features. Check each clue against the stated motion and wave measurement.
      - text: '(a) A mountain range; (b) the gap has no scientific use; (c) volcanic islands can only form at convergent boundaries.'
        rationale: |
          This discards travel-time information and excludes intraplate magma sources. Boundary volcanoes are common. Check whether the observations require a boundary.
      - text: '(a) A new ocean forming between the plates; (b) the gap indicates wind speed at the surface; (c) the island chain formed from a meteor impact.'
        rationale: |
          This applies separation to colliding plates and assigns unrelated causes to the other observations. Oceans can open when plates separate. Check the specified approach and the physical source of seismic and volcanic activity.
    explanation: |
      Continental collision can thicken crust and build mountains. A larger P-S arrival gap can indicate a greater distance to the earthquake source. Intraplate volcanic chains such as Hawaii can form above a hotspot as a plate moves over a magma source.
    approved: true
