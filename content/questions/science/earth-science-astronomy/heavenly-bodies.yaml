meta:
  subject: 'science'
  topic: 'earth-science-astronomy'
  subtopic: 'heavenly-bodies'
  exams: ["upcat", "dlsucet", "ustet", "dost-sei"]
questions:
  - id: q-earth-science-astronomy-heavenly-bodies-0001
    type: identify
    difficulty: easy
    stem: |
      What is a giant, glowing ball of hot gas that makes its own light and heat through nuclear reactions in its core, such as the Sun?
    choices:
      - text: 'A star'
        correct: true
      - text: 'A galaxy'
        rationale: |
          This treats a galaxy as one star. Galaxies contain shining stars. Check one body versus a whole system.
      - text: 'An asteroid'
        rationale: |
          This confuses reflected sunlight with light made inside a body. An asteroid can look bright. Check for nuclear fusion.
      - text: 'A comet'
        rationale: |
          This treats a bright comet as a star. Comets brighten near the Sun. Check the source of their energy.
    explanation: |
      A star is a ball of hot gas held together by gravity. Nuclear fusion in its core releases light and heat.
    approved: true

  - id: q-earth-science-astronomy-heavenly-bodies-0002
    type: identify
    difficulty: easy
    stem: |
      What is the name for a huge collection of billions of stars, gas, dust, and dark matter, all held together by gravity, such as our own Milky Way?
    choices:
      - text: 'A galaxy'
        correct: true
      - text: 'A star cluster'
        rationale: |
          This treats a group within a galaxy as the whole galaxy. Clusters also contain many stars. Check the system's scale and contents.
      - text: 'A solar system'
        rationale: |
          This confuses a planetary system with a galaxy. Both are held together by gravity. Check one star versus a vast stellar system.
      - text: 'A nebula'
        rationale: |
          This treats a gas cloud as an entire galaxy. Nebulae can contain forming stars. Check the full bound system.
    explanation: |
      A galaxy is a large system held together by gravity. It contains stars, gas, dust, and dark matter. The Milky Way contains our Solar System.
    approved: true

  - id: q-earth-science-astronomy-heavenly-bodies-0003
    type: identify
    difficulty: medium
    stem: |
      A several-kilometer-wide object made mainly of rock and metal orbits the Sun without a coma. Which classification best fits it?
    choices:
      - text: 'An asteroid'
        correct: true
      - text: 'A comet'
        rationale: |
          This uses orbit alone to choose an icy body. Comets also orbit the Sun. Check composition and activity.
      - text: 'A meteoroid'
        rationale: |
          This uses the small-particle term for a kilometer-scale body. Both are rocky space objects. Check the stated size.
      - text: 'A natural satellite'
        rationale: |
          This treats orbiting the Sun as orbiting a planet. Satellites also follow orbits. Check which body is being circled.
    explanation: |
      An asteroid is a relatively small rocky or metallic body orbiting the Sun. Its composition and orbit fit the description.
    approved: true

  - id: q-earth-science-astronomy-heavenly-bodies-0004
    type: identify
    difficulty: medium
    stem: |
      Most of the asteroids in our solar system are found in the asteroid belt. Where is this belt located?
    choices:
      - text: 'Between Mars and Jupiter'
        correct: true
      - text: 'Between the orbits of Earth and Mars'
        rationale: |
          This moves the belt one planet interval inward. Earth and Mars are neighbors. Check the Mars-to-Jupiter interval.
      - text: 'Beyond the orbit of Neptune'
        rationale: |
          This mixes up the main belt with an outer small-body region. The Kuiper Belt is beyond Neptune. Check which belt is named.
      - text: 'Between the Sun and Mercury'
        rationale: |
          This puts the belt inside the innermost planetary orbit. Small objects can pass near the Sun. Check where the main belt lies.
    explanation: |
      The main asteroid belt lies between the orbits of Mars and Jupiter. Many asteroids orbit in that region.
    approved: true

  - id: q-earth-science-astronomy-heavenly-bodies-0005
    type: classify
    difficulty: hard
    stem: |
      A survey finds a rocky, inactive asteroid on an orbit that crosses Earth's orbit. Which conclusion is supported?
    choices:
      - text: 'Asteroids can orbit outside the main belt.'
        correct: true
      - text: 'Its rocky composition must be incorrect.'
        rationale: |
          This treats belt membership as necessary for rocky composition. The belt is a familiar location. Check whether location changes composition.
      - text: 'Every asteroid follows an orbit beyond Jupiter.'
        rationale: |
          This places all asteroids beyond Jupiter. The belt sounds far from Earth. Check its Mars-to-Jupiter location.
      - text: 'An Earth-crossing orbit makes it a meteorite.'
        rationale: |
          This applies the landed-material name before impact. The orbit approaches Earth. Check whether material reached the ground.
    explanation: |
      The main belt contains many asteroids. Asteroids also follow other orbits, including near-Earth orbits. The surveyed object is an example.
    approved: true

  - id: q-earth-science-astronomy-heavenly-bodies-0006
    type: identify
    difficulty: medium
    stem: |
      Which object, sometimes nicknamed a "dirty snowball," is made mostly of ice, frozen gases, and dust, and develops a glowing tail when it nears the Sun?
    choices:
      - text: 'A comet'
        correct: true
      - text: 'An asteroid'
        rationale: |
          This chooses the rocky-body category for an icy active body. Both orbit the Sun. Check composition and activity.
      - text: 'A meteoroid'
        rationale: |
          This names a small space particle instead of an active icy body. Both can be small. Check the coma and tails.
      - text: 'A natural satellite'
        rationale: |
          This classifies by a planetary orbit that was not stated. Some moons have ice. Check orbit and comet activity.
    explanation: |
      A comet contains ices and dust. Solar heating releases gas and dust near the Sun. This material can form a coma and tails.
    approved: true

  - id: q-earth-science-astronomy-heavenly-bodies-0007
    type: cause-effect
    difficulty: medium
    stem: |
      Why does an active comet's ion tail generally extend away from the Sun?
    choices:
      - text: 'Solar wind carries charged gas outward.'
        correct: true
      - text: 'Gravity pulls the tail toward the Sun.'
        rationale: |
          This uses an inward pull to explain an outward tail. Gravity attracts matter. Check the solar wind's direction.
      - text: 'The comet leaves gas behind along its orbit.'
        rationale: |
          This treats the tail as a simple trail. Motion can leave material behind. Check how solar wind acts on charged gas.
      - text: 'Earth''s atmosphere pushes the tail outward.'
        rationale: |
          This uses Earth's air to explain a tail in space. Meteors interact with air. Check the object's location.
    explanation: |
      Solar heating releases gas from the comet. Some gas becomes electrically charged. The solar wind carries this charged gas away from the Sun.
    approved: true

  - id: q-earth-science-astronomy-heavenly-bodies-0008
    type: classify
    difficulty: hard
    stem: |
      A comet moves directly outward from the Sun while its ion tail is visible. Which direction does the ion tail generally extend?
    choices:
      - text: 'Outward, ahead of the comet''s motion.'
        correct: true
      - text: 'Inward, behind the comet''s motion.'
        rationale: |
          This assumes tails always trail behind. Familiar moving objects leave trails. Check the direction away from the Sun.
      - text: 'Sideways, perpendicular to its motion.'
        rationale: |
          This assumes an outward force acts sideways. A curved dust tail may suggest this. Check that the question specifies an ion tail.
      - text: 'Inward, toward the source of solar wind.'
        rationale: |
          This reverses solar wind flow. The Sun supplies the wind. Check that it travels outward.
    explanation: |
      Solar wind carries the charged gas outward from the Sun. The comet also moves outward in this setup. Its ion tail therefore extends ahead of it.
    approved: true

  - id: q-earth-science-astronomy-heavenly-bodies-0009
    type: classify
    difficulty: hard
    stem: |
      A comet approaches the Sun and develops a coma. Which change directly supplies the gas in that coma?
    choices:
      - text: 'Surface ice changes into gas.'
        correct: true
      - text: 'Rock fragments melt into liquid water.'
        rationale: |
          This treats rock as a source of water. Melting sounds like a heating effect. Check which material supplies vapor.
      - text: 'Nuclear fusion converts dust into gas.'
        rationale: |
          This gives a comet a star's energy process. Both appear bright. Check whether sunlight heats existing ice.
      - text: 'Atmospheric air sticks to the icy surface.'
        rationale: |
          This supplies air to a body in space. Gas does surround the nucleus. Check where the gas comes from.
    explanation: |
      Sunlight heats the comet's surface. Some surface ice changes directly into gas. The released gas forms part of the coma.
    approved: true

  - id: q-earth-science-astronomy-heavenly-bodies-0010
    type: identify
    difficulty: medium
    stem: |
      What is the name for a small chunk of rock or metal traveling through space, too small to be called an asteroid, before it enters Earth's atmosphere?
    choices:
      - text: 'A meteoroid'
        correct: true
      - text: 'A meteor'
        rationale: |
          This names the light phenomenon before entry. The rock may later produce a streak. Check its present location.
      - text: 'A meteorite'
        rationale: |
          This names landed material while it is still in space. It may eventually land. Check whether it reached the ground.
      - text: 'A comet'
        rationale: |
          This names an icy active body from a rocky particle description. Both travel in space. Check composition and activity.
    explanation: |
      A meteoroid is a small natural rock or particle traveling through space. This fragment has not entered Earth's atmosphere.
    approved: true

  - id: q-earth-science-astronomy-heavenly-bodies-0011
    type: identify
    difficulty: medium
    stem: |
      What is the visible streak of light produced when a meteoroid enters Earth's atmosphere at high speed called?
    choices:
      - text: 'A meteor'
        correct: true
      - text: 'A meteoroid'
        rationale: |
          This names the solid particle instead of the visible event. The particle causes the light. Check body versus phenomenon.
      - text: 'A meteorite'
        rationale: |
          This names material after it reaches the ground. Some particles survive. Check sky event versus landed material.
      - text: 'An asteroid'
        rationale: |
          This names an orbiting rocky body instead of a light event. Asteroids can supply fragments. Check what the streak itself is called.
    explanation: |
      A meteor is the light and related effects produced during high-speed atmospheric entry. The question asks for this visible phenomenon.
    approved: true

  - id: q-earth-science-astronomy-heavenly-bodies-0012
    type: identify
    difficulty: medium
    stem: |
      What do we call a piece of space rock if it survives its trip through Earth's atmosphere and lands on the ground?
    choices:
      - text: 'A meteorite'
        correct: true
      - text: 'A meteor'
        rationale: |
          This names the light seen during entry. Both terms concern one incoming object. Check light versus surviving material.
      - text: 'A meteoroid'
        rationale: |
          This names the particle before entry. It began in space. Check its location after landing.
      - text: 'An asteroid'
        rationale: |
          This names the source body instead of landed material. Asteroids can supply fragments. Check present classification versus origin.
    explanation: |
      A meteorite is material that survives atmospheric entry and reaches the ground. The described fragment has reached that stage.
    approved: true

  - id: q-earth-science-astronomy-heavenly-bodies-0013
    type: process-ordering
    difficulty: medium
    stem: |
      A small rock drifts through space, produces a bright streak during atmospheric entry, and leaves a fragment on the ground. Which sequence names the space particle, light phenomenon, and landed material?
    choices:
      - text: 'Meteoroid, then meteor, then meteorite'
        correct: true
      - text: 'Meteor, then meteoroid, then meteorite'
        rationale: |
          This swaps the space particle and its light event. The terms look similar. Check location and whether each is a body or light.
      - text: 'Meteorite, then meteor, then meteoroid'
        rationale: |
          This reverses the first and final stages. All names share a root. Check the ground stage last.
      - text: 'Meteor, then meteorite, then meteoroid'
        rationale: |
          This puts the landed stage before arrival. The similar terms can be mixed up. Check the sequence of locations.
    explanation: |
      The particle in space is a meteoroid. Its bright atmospheric streak is a meteor. Material surviving to the ground is a meteorite.
    approved: true

  - id: q-earth-science-astronomy-heavenly-bodies-0014
    type: classify
    difficulty: hard
    stem: |
      During a meteor shower, Earth passes through debris left along a comet's orbit. Why are many bright streaks seen in a short period?
    choices:
      - text: 'Many particles enter the atmosphere.'
        correct: true
      - text: 'Many stars fall toward Earth''s surface.'
        rationale: |
          This takes shooting star literally. Meteors look like moving lights. Check whether stars are small debris particles.
      - text: 'The comet''s nucleus splits above the clouds.'
        rationale: |
          This puts the comet above the clouds. Comets are the debris source. Check whether Earth enters an old stream in space.
      - text: 'The comet''s tail shines through Earth''s air.'
        rationale: |
          This treats tail light as individual streaks. Comet tails can glow. Check what produces each atmospheric flash.
    explanation: |
      Earth meets many small particles in the debris stream. Each can produce a meteor during atmospheric entry. Many entries close together make a meteor shower.
    approved: true

  - id: q-earth-science-astronomy-heavenly-bodies-0015
    type: identify
    difficulty: medium
    stem: |
      Roughly how often does the most famous comet, Halley's Comet, swing by Earth?
    choices:
      - text: 'Roughly every 76 years'
        correct: true
      - text: 'Roughly every 10 years'
        rationale: |
          This uses a shorter comet interval. Some comets return much faster. Check the measured period of this named comet.
      - text: 'Roughly every 200 years'
        rationale: |
          This uses a longer comet interval. Comet periods vary widely. Check Halley's own observed returns.
      - text: 'Roughly every 1,000 years'
        rationale: |
          This uses a very long comet interval. Some orbits take centuries. Check the record for Halley specifically.
    explanation: |
      Halley's Comet returns to the inner Solar System about every 76 years on average. These repeat visits follow its orbit around the Sun.
    approved: true

  - id: q-earth-science-astronomy-heavenly-bodies-0016
    type: predict-outcome
    difficulty: exam
    stem: |
      A rocky particle enters the atmosphere, produces a meteor, and is completely destroyed before reaching the ground. Which description fits the outcome?
    choices:
      - text: 'A meteor occurred without a meteorite.'
        correct: true
      - text: 'A meteorite formed without a meteor.'
        rationale: |
          This reverses the event and landed-material terms. They share a root. Check whether anything reached the ground.
      - text: 'The particle was a meteorite before entry.'
        rationale: |
          This uses the landed-material name before entry. The incoming object is already solid. Check whether atmospheric passage has ended.
      - text: 'The light was a meteoroid after entry.'
        rationale: |
          This names the light as the solid particle. The particle causes the event. Check body versus phenomenon.
    explanation: |
      The bright atmospheric event is a meteor. All incoming material was destroyed. No material reached the ground to become a meteorite.
    approved: true

  - id: q-earth-science-astronomy-heavenly-bodies-0017
    type: structure-function
    difficulty: easy
    stem: |
      Which process supplies the Sun's energy during the main part of its life?
    choices:
      - text: 'Nuclear fusion in its core'
        correct: true
      - text: 'Burning fuel with atmospheric oxygen'
        rationale: |
          This treats a star as a chemical fire. Fires also release heat. Check the process in the core.
      - text: 'Reflecting light from nearby stars'
        rationale: |
          This treats the Sun as a reflector. Planets are visible by reflected light. Check whether a star makes its own energy.
      - text: 'Friction caused by orbiting planets'
        rationale: |
          This gives planetary motion a role in core heating. Contact can produce friction. Check the Sun's internal energy source.
    explanation: |
      Nuclear fusion joins light atomic nuclei in the Sun's core. This releases energy. The energy reaches space as light and heat.
    approved: false

  - id: q-earth-science-astronomy-heavenly-bodies-0018
    type: compare-contrast
    difficulty: medium
    stem: |
      Which comparison between a comet's dust tail and ion tail is accurate?
    choices:
      - text: 'Dust can curve; charged gas responds strongly to solar wind.'
        correct: true
      - text: 'Both are solid streams that follow exactly the same path.'
        rationale: |
          This treats two types of material as one solid stream. Both form visible tails. Check dust versus charged gas.
      - text: 'Dust is driven by Earth''s air; charged gas is driven by gravity.'
        rationale: |
          This uses air and gravity to explain comet tail behavior in space. Both forces are familiar. Check sunlight and solar wind.
      - text: 'Both remain attached rigidly along the nucleus''s direction of motion.'
        rationale: |
          This treats loose material as rigid parts of the nucleus. Tails appear connected. Check whether released material can respond separately.
    explanation: |
      Dust responds to sunlight and keeps some orbital motion. Its tail can curve. Charged gas responds strongly to solar wind, which carries it away from the Sun.
    approved: false

  - id: q-earth-science-astronomy-heavenly-bodies-0019
    type: predict-outcome
    difficulty: hard
    stem: |
      An icy comet moves far from the Sun after an active close approach. With other factors unchanged, what is expected as solar heating weakens?
    choices:
      - text: 'Less gas and dust are released.'
        correct: true
      - text: 'Its ion tail points directly toward the Sun.'
        rationale: |
          This reverses the solar wind's direction. Outward motion may suggest a trailing tail. Check the wind's outward flow.
      - text: 'Its nucleus begins making energy by fusion.'
        rationale: |
          This turns solar heating into a star's energy process. The comet previously glowed. Check whether an icy nucleus supports stellar fusion.
      - text: 'Its gas release rises because sunlight weakens.'
        rationale: |
          This reverses the heating-release link. A receding comet can remain active. Check how less heat affects gas release.
    explanation: |
      Solar heating helps release gas and dust from a comet. Farther from the Sun, less heating reaches the surface. Usually, less material is released.
    approved: false

  - id: q-earth-science-astronomy-heavenly-bodies-0020
    type: classify
    difficulty: exam
    stem: |
      A telescope resolves an object into a vast gravitationally bound system of stars, gas, and dust. Which observation most directly distinguishes it from a single star?
    choices:
      - text: 'It contains many separate stars.'
        correct: true
      - text: 'It emits detectable visible light.'
        rationale: |
          This uses brightness to identify a whole system. Single stars also shine. Check whether separate stars are resolved.
      - text: 'Its material is affected by gravity.'
        rationale: |
          This treats gravity as unique to a galaxy. Stars also hold together by gravity. Check the contents of the system.
      - text: 'It contains very hot gaseous matter.'
        rationale: |
          This treats hot gas as unique to galaxies. Stars contain hot gas or plasma. Check for many separate stars.
    explanation: |
      A galaxy contains many stars in one large bound system. Seeing separate stars shows that the object is a system rather than one stellar body.
    approved: false
