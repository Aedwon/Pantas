meta:
  subject: science
  topic: earth-science-astronomy
  subtopic: heavenly-bodies
  exams: [ upcat, dlsucet, ustet, dost-sei ]
questions:
  - id: q-earth-science-astronomy-heavenly-bodies-0001
    type: identify
    difficulty: easy
    stem: |
      What is a giant, glowing ball of hot gas that makes its own light and heat through nuclear reactions in its core, such as the Sun?
    choices:
      - text: A star
        correct: true
      - text: A galaxy
        rationale: |
          You picked a large group of stars. A galaxy is a collection of billions of stars, gas, and dust held together by gravity.
      - text: An asteroid
        rationale: |
          You picked a non-luminous rocky body. Asteroids are small rocky or metallic objects that orbit stars without nuclear fusion.
      - text: A comet
        rationale: |
          You picked an icy body. Comets consist of ice and dust, producing tails near stars rather than fusing nuclear fuel.
    explanation: |
      A star is a giant, glowing ball of hot gas that makes its own light and heat through nuclear reactions in its core. The Sun is a star.
    approved: true

  - id: q-earth-science-astronomy-heavenly-bodies-0002
    type: identify
    difficulty: easy
    stem: |
      What is the name for a huge collection of billions of stars, gas, dust, and dark matter, all held together by gravity, such as our own Milky Way?
    choices:
      - text: A galaxy
        correct: true
      - text: A star
        rationale: |
          You picked a single stellar body. A star is an individual glowing sphere of gas, whereas a galaxy holds billions of stars.
      - text: An asteroid belt
        rationale: |
          You picked a planetary ring of rocks. An asteroid belt is a localized region of small rocky bodies within a star system.
      - text: A meteoroid
        rationale: |
          You picked a small space rock fragment. A meteoroid is a tiny rock in space, not a massive collection of stars.
    explanation: |
      A galaxy is a huge collection of billions of stars, held together by gravity, along with gas, dust, and dark matter. Our own galaxy is the Milky Way.
    approved: true

  - id: q-earth-science-astronomy-heavenly-bodies-0003
    type: identify
    difficulty: medium
    stem: |
      What is a rocky, metallic chunk of rock, smaller than a planet, that orbits the Sun?
    choices:
      - text: An asteroid
        correct: true
      - text: A comet
        rationale: |
          You picked an icy body. Comets are made of ice and dust, whereas asteroids are composed primarily of rock and metal.
      - text: A meteor
        rationale: |
          You picked atmospheric light streak. A meteor is the streak of light produced when a space rock burns in an atmosphere.
      - text: A galaxy
        rationale: |
          You picked a star system structure. A galaxy is a cosmic collection of billions of stars, not an individual solar system rock.
    explanation: |
      An asteroid is a rocky, metallic chunk of rock, smaller than a planet, that orbits the Sun.
    approved: true

  - id: q-earth-science-astronomy-heavenly-bodies-0004
    type: identify
    difficulty: medium
    stem: |
      Most of the asteroids in our solar system are found in the asteroid belt. Where is this belt located?
    choices:
      - text: Between the orbits of Mars and Jupiter
        correct: true
      - text: Between the orbits of Earth and Mars
        rationale: |
          You placed the belt too close to Earth. The main asteroid belt orbits between Mars and Jupiter.
      - text: Beyond the orbit of Neptune
        rationale: |
          You picked the Kuiper Belt location. The region beyond Neptune is the Kuiper Belt, home to icy bodies and dwarf planets.
      - text: Between the Sun and Mercury
        rationale: |
          You placed the belt too close to the Sun. The innermost solar system contains Mercury's orbit, not the main asteroid belt.
    explanation: |
      The asteroid belt lies between the orbits of Mars and Jupiter, not between Earth and Mars, and not beyond Neptune.
    approved: true

  - id: q-earth-science-astronomy-heavenly-bodies-0005
    type: classify
    difficulty: hard
    stem: |
      A choice places the asteroid belt between the orbits of Earth and Mars. Is this the correct location?
    choices:
      - text: 'No: the asteroid belt is located between the orbits of Mars and Jupiter, not between Earth and Mars.'
        correct: true
      - text: 'Yes: the asteroid belt is exactly where Earth and Mars orbit.'
        rationale: |
          You accepted the wrong location. The main asteroid belt lies between the orbits of Mars and Jupiter.
      - text: 'No: but only because there is no such thing as an asteroid belt.'
        rationale: |
          You denied the asteroid belt's existence. The main asteroid belt contains millions of rocky bodies between Mars and Jupiter.
      - text: 'Yes: the asteroid belt and the region beyond Neptune (the Kuiper Belt) are the same location.'
        rationale: |
          You confused the Asteroid Belt with the Kuiper Belt. The Asteroid Belt lies between Mars and Jupiter, while Kuiper Belt lies past Neptune.
    explanation: |
      The asteroid belt is anchored firmly between Mars and Jupiter. Some choices incorrectly place it between Earth and Mars, or beyond Neptune: the region beyond Neptune is actually a different region called the Kuiper Belt, home to many comets.
    approved: true

  - id: q-earth-science-astronomy-heavenly-bodies-0006
    type: identify
    difficulty: medium
    stem: |
      Which object, sometimes nicknamed a "dirty snowball," is made mostly of ice, frozen gases, and dust, and develops a glowing tail when it nears the Sun?
    choices:
      - text: A comet
        correct: true
      - text: An asteroid
        rationale: |
          You picked a rocky object. Asteroids consist of rock and metal without volatile ice, so they do not form glowing tails near the Sun.
      - text: A meteor
        rationale: |
          You picked an atmospheric streak. A meteor is a streak of light caused by atmospheric friction, not an icy deep-space body.
      - text: A star
        rationale: |
          You picked a luminous gas sphere. Stars generate heat via fusion, while comets are small icy bodies heated by external solar radiation.
    explanation: |
      A comet is made mostly of ice, frozen gases, and dust, nicknamed a "dirty snowball." Its ice vaporizes near the Sun, forming a glowing tail.
    approved: true

  - id: q-earth-science-astronomy-heavenly-bodies-0007
    type: cause-effect
    difficulty: medium
    stem: |
      Why does a comet's tail always point away from the Sun, no matter which direction the comet itself is traveling?
    choices:
      - text: Heat and pressure from the Sun turn some of the comet's ice into gas and blow this gas and dust away from the Sun, so the tail's direction depends on the Sun's position, not the comet's motion.
        correct: true
      - text: The tail is simply the trail of dust left behind the comet's path, like exhaust from a moving vehicle.
        rationale: |
          You assumed the tail follows trajectory motion. Solar wind and radiation pressure push gas and dust away from the Sun, regardless of travel direction.
      - text: Gravity from the Sun pulls the tail directly toward the Sun at all times.
        rationale: |
          You reversed solar wind interaction. Solar radiation pressure pushes vaporized gases away from the Sun, pointing the tail outward.
      - text: The tail forms randomly and has no consistent relationship to the Sun's position.
        rationale: |
          You claimed tail orientation is random. Solar wind consistently pushes comet dust and ion tails directly away from the Sun.
    explanation: |
      The tail forms because heat and pressure from the Sun push gas and dust off the comet, away from the Sun. This means the tail's direction depends on the Sun's position, never on the direction the comet is traveling.
    approved: true

  - id: q-earth-science-astronomy-heavenly-bodies-0008
    type: classify
    difficulty: hard
    stem: |
      A comet is moving away from the Sun, back out toward deep space. In which direction does its tail point?
    choices:
      - text: Away from the Sun, meaning, in this case, the tail actually points ahead of the comet, leading the way outward, since the tail's direction depends only on the Sun's position.
        correct: true
      - text: Toward the Sun, since the tail always trails behind wherever the comet came from.
        rationale: |
          You pointed the tail toward the Sun. Solar wind pushes dust and gas away from the Sun, so the tail points away from the Sun.
      - text: In the same direction the comet is traveling, trailing directly behind it.
        rationale: |
          You assumed the tail trails behind the moving body. Solar wind forces the tail away from the Sun, pushing it ahead of an outward-bound comet.
      - text: The comet has no tail at all once it starts moving away from the Sun.
        rationale: |
          You assumed the tail vanishes instantly upon turning away. While receding, remaining solar heat and wind continue pushing a tail away from the Sun.
    explanation: |
      The tail's direction depends on the Sun's position, never on the comet's direction of travel. Since the comet is moving away from the Sun, its tail (still pointing away from the Sun) ends up leading in front of the comet as it travels outward.
    approved: true

  - id: q-earth-science-astronomy-heavenly-bodies-0009
    type: classify
    difficulty: hard
    stem: |
      A description mentions an object with a visible glowing tail as it passes near the Sun. A student classifies this object as an asteroid. Is this correct?
    choices:
      - text: 'No: asteroids are rocky and do not develop tails, since they lack the ice that vaporizes near the Sun; an object with a visible tail is a comet.'
        correct: true
      - text: 'Yes: all objects orbiting the Sun develop tails when they pass close by.'
        rationale: |
          You assumed all solar system bodies form tails. Only bodies containing volatile ice (comets) sublimate to form glowing tails.
      - text: 'No: but only because asteroids never pass close to the Sun.'
        rationale: |
          You assumed asteroids never orbit near the Sun. Some near-Earth asteroids pass close to the Sun without developing tails due to lack of ice.
      - text: 'Yes: asteroids and comets are simply two different names for the same object.'
        rationale: |
          You treated asteroids and comets as identical. Asteroids are rocky/metallic bodies, whereas comets are icy bodies.
    explanation: |
      A description mentioning a "dirty snowball" or a visible tail describes a comet, not an asteroid. Asteroids are rocky and metallic, and do not develop tails, since they lack the ice that vaporizes near the Sun.
    approved: true

  - id: q-earth-science-astronomy-heavenly-bodies-0010
    type: identify
    difficulty: medium
    stem: |
      What is the name for a small chunk of rock or metal traveling through space, too small to be called an asteroid, before it enters Earth's atmosphere?
    choices:
      - text: A meteoroid
        correct: true
      - text: A meteor
        rationale: |
          You picked the atmospheric streak term. A meteor is the visible light streak while burning in air; in space, it is a meteoroid.
      - text: A meteorite
        rationale: |
          You picked the landed rock term. A meteorite is a surviving rock fragment that hits the ground.
      - text: A comet
        rationale: |
          You picked an icy deep-space body. Small rocky fragments traveling in space are meteoroids, not icy comets.
    explanation: |
      A meteoroid is a small chunk of rock or metal traveling through space, too small to be called an asteroid.
    approved: true

  - id: q-earth-science-astronomy-heavenly-bodies-0011
    type: identify
    difficulty: medium
    stem: |
      What do we call a small space rock once it enters Earth's atmosphere and burns up, creating a streak of light known as a "shooting star"?
    choices:
      - text: A meteor
        correct: true
      - text: A meteoroid
        rationale: |
          You picked the space-stage term. The rock is a meteoroid while floating in space, becoming a meteor once burning in atmosphere.
      - text: A meteorite
        rationale: |
          You picked the ground-stage term. A meteorite is the rock fragment after it survives atmospheric entry and hits the earth.
      - text: An asteroid
        rationale: |
          You picked a large space body. Asteroids are much larger orbiting bodies, whereas glowing atmospheric streaks are meteors.
    explanation: |
      A meteor is the name given to the same chunk of rock once it enters Earth's atmosphere and burns up, creating the streak of light known as a "shooting star."
    approved: true

  - id: q-earth-science-astronomy-heavenly-bodies-0012
    type: identify
    difficulty: medium
    stem: |
      What do we call a piece of space rock if it survives its trip through Earth's atmosphere and lands on the ground?
    choices:
      - text: A meteorite
        correct: true
      - text: A meteor
        rationale: |
          You picked the atmospheric light streak term. The atmospheric streak is a meteor, while the grounded rock is a meteorite.
      - text: A meteoroid
        rationale: |
          You picked the outer space stage term. Small rocks in space are meteoroids; once on the ground, they are meteorites.
      - text: An asteroid
        rationale: |
          You picked a minor planet term. Large rocky bodies orbiting the Sun are asteroids, whereas landed fragments are meteorites.
    explanation: |
      A meteorite is what we call a piece of space rock that survives the trip through the atmosphere and lands on the ground.
    approved: true

  - id: q-earth-science-astronomy-heavenly-bodies-0013
    type: process-ordering
    difficulty: medium
    stem: |
      A small rock breaks off from an asteroid and drifts through space, then enters Earth's atmosphere and burns brightly, and finally a fragment lands in a field. Name what this object is called at each of the three stages, in order.
    choices:
      - text: Meteoroid, then meteor, then meteorite
        correct: true
      - text: Meteor, then meteoroid, then meteorite
        rationale: |
          You swapped space and atmospheric names. It is a meteoroid in space, becoming a meteor when burning in the atmosphere.
      - text: Meteorite, then meteor, then meteoroid
        rationale: |
          You reversed the entire sequence. The sequence begins as a meteoroid in space and ends as a meteorite on the ground.
      - text: Meteor, then meteorite, then meteoroid
        rationale: |
          You jumbled the three stages. Floating in space is meteoroid, burning in air is meteor, and landing on ground is meteorite.
    explanation: |
      While drifting through space, it is a meteoroid. While burning and streaking light across the sky, it is a meteor. Once the surviving fragment lands on the ground, it is a meteorite: three names for one object, based on where it is at the time.
    approved: true

  - id: q-earth-science-astronomy-heavenly-bodies-0014
    type: classify
    difficulty: hard
    stem: |
      A question describes a rock fragment found sitting inside a museum display case, having landed in a crater years earlier. A student calls this object a "meteor." Is this the correct term?
    choices:
      - text: 'No: an object found lying on the ground or in a museum, after landing, is a meteorite; "meteor" refers only to the bright streak of light seen while it is still burning in the sky.'
        correct: true
      - text: 'Yes: "meteor" and "meteorite" both describe the same landed object.'
        rationale: |
          You treated meteor and meteorite as synonyms. "Meteor" is the flash of light in the sky, whereas "meteorite" is the landed rock.
      - text: 'No: but only because objects that land on Earth are called asteroids instead.'
        rationale: |
          You misnamed landed space rocks as asteroids. Small landed space fragments are meteorites.
      - text: 'Yes: any space rock is called a meteor regardless of its location.'
        rationale: |
          You ignored location-based terminology. Location dictates naming: meteoroid (space), meteor (atmosphere), meteorite (ground).
    explanation: |
      These two words differ by only two letters, and test-makers exploit that. If the question describes something found lying in a crater or a museum, it is a meteorite; if it describes a bright streak seen at night, it is a meteor.
    approved: true

  - id: q-earth-science-astronomy-heavenly-bodies-0015
    type: identify
    difficulty: medium
    stem: |
      Roughly how often does the most famous comet, Halley's Comet, swing by Earth?
    choices:
      - text: Roughly every 76 years
        correct: true
      - text: Roughly every 10 years
        rationale: |
          You picked too short an orbital period. Halley's Comet takes approximately 75–76 years to complete one orbit.
      - text: Roughly every 200 years
        rationale: |
          You picked a long-period comet timeframe. Short-period Halley's Comet returns about every 76 years.
      - text: Roughly every 1,000 years
        rationale: |
          You picked a millennium timeframe. Halley's Comet has a famous 76-year orbital period.
    explanation: |
      Halley's Comet, the most famous comet, swings by Earth roughly every 76 years.
    approved: true

  - id: q-earth-science-astronomy-heavenly-bodies-0016
    type: predict-outcome
    difficulty: exam
    stem: |
      A small rocky fragment breaks off from an object in the asteroid belt and eventually collides with Earth's atmosphere, burning up as a bright streak in the night sky. A large surviving piece is later discovered in the desert. At the exact moment it was burning up and visible in the sky, what was this object correctly called, and what would it be called if a stargazer saw it moments before it entered the atmosphere?
    choices:
      - text: While burning and visible in the sky, it was a meteor; moments before entering the atmosphere, while still traveling through space, it would have been called a meteoroid.
        correct: true
      - text: While burning and visible in the sky, it was a meteorite; moments before entering the atmosphere, it would have been called a meteor.
        rationale: |
          You swapped meteor and meteorite. Burning in air is a meteor; in space before entry, it is a meteoroid.
      - text: It was called a meteorite at every stage, from space to sky to ground.
        rationale: |
          You used meteorite for all stages. The suffix changes with stage: meteoroid (space) $\rightarrow$ meteor (sky) $\rightarrow$ meteorite (ground).
      - text: While burning and visible in the sky, it was a meteoroid; moments before entering the atmosphere, it would have been called a meteorite.
        rationale: |
          You inverted meteoroid and meteorite. In space it is a meteoroid; burning in sky is a meteor; landed on ground is a meteorite.
    explanation: |
      The naming follows location: floating in space, it is a meteoroid; burning and streaking light in Earth's sky, it is a meteor; once the surviving fragment lands on the ground, it becomes a meteorite. The same object earns each name only once it reaches that stage.
    approved: true
