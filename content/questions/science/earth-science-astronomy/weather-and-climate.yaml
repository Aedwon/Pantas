meta:
  subject: 'science'
  topic: 'earth-science-astronomy'
  subtopic: 'weather-and-climate'
  exams: ["upcat", "dlsucet", "ustet", "dost-sei"]
questions:
  - id: q-earth-science-astronomy-weather-and-climate-0001
    type: identify
    difficulty: easy
    stem: |
      What is the short-term condition of the air at a specific place and time, such as today's temperature, rain, or wind, called?
    choices:
      - text: 'Weather'
        correct: true
      - text: 'Climate'
        rationale: |
          This uses a long-term pattern for one day's conditions. Climate is based on weather data. Check the timescale.
      - text: 'Global warming'
        rationale: |
          This uses a global temperature trend for local conditions. Today's temperature can be part of the data. Check local event versus long-term global average.
      - text: 'A monsoon'
        rationale: |
          This uses a seasonal wind system for the general atmospheric state. Monsoons affect daily conditions. Check whether a specific wind regime is being described.
    explanation: |
      Weather is the state of the atmosphere at a particular place and time. Today's temperature, rain, and wind describe weather.
    approved: true

  - id: q-earth-science-astronomy-weather-and-climate-0002
    type: identify
    difficulty: easy
    stem: |
      What is the long-term average pattern of weather in a region over many years called?
    choices:
      - text: 'Climate'
        correct: true
      - text: 'Weather'
        rationale: |
          This names short-term conditions. Climate is built from many weather observations. Check the years-long pattern.
      - text: 'A typhoon'
        rationale: |
          This names one kind of storm. Storms can influence a region's climate statistics. Check event versus pattern.
      - text: 'A monsoon'
        rationale: |
          This names a seasonal wind system. Monsoons help shape climate. Check the broader long-term statistical pattern.
    explanation: |
      Climate describes weather patterns over many years. It includes averages and the range and frequency of conditions.
    approved: true

  - id: q-earth-science-astronomy-weather-and-climate-0003
    type: classify
    difficulty: medium
    stem: |
      Which evidence is most useful for assessing whether a region's climate has changed?
    choices:
      - text: 'Comparable weather records over many years'
        correct: true
      - text: 'The temperature measured on one cold morning'
        rationale: |
          This uses one temperature observation as a long-term record. Unusual cold is noticeable. Check whether it represents many years.
      - text: 'One afternoon''s cloud cover in the region'
        rationale: |
          This uses brief cloud conditions for a climate shift. Clouds affect weather. Check the timescale of the evidence.
      - text: 'One storm''s rainfall measured at a single station'
        rationale: |
          This uses one storm instead of a pattern of events. Heavy rain can be memorable. Check how often such events occur over many years.
    explanation: |
      Climate is a long-term statistical pattern. Comparable records over many years allow changes in that pattern to be assessed.
    approved: true

  - id: q-earth-science-astronomy-weather-and-climate-0004
    type: classify
    difficulty: medium
    stem: |
      Which term includes persistent changes in rainfall, ice, sea level, and temperature?
    choices:
      - text: 'Climate change'
        correct: true
      - text: 'Global warming alone'
        rationale: |
          This uses temperature rise alone for the broader set. Warming drives many changes. Check the full range of climate properties.
      - text: 'A single tropical cyclone'
        rationale: |
          This uses one storm for persistent system changes. Storms can affect rainfall. Check event versus long-term changes.
      - text: 'One day''s local weather'
        rationale: |
          This uses brief local conditions for lasting changes. Weather supplies climate data. Check the duration and breadth.
    explanation: |
      Climate change includes persistent changes throughout the climate system. These can include temperature, rainfall patterns, ice, and sea level.
    approved: true

  - id: q-earth-science-astronomy-weather-and-climate-0005
    type: classify
    difficulty: hard
    stem: |
      A person argues, "It was unusually cold this week, so global warming must not be real." Is this a valid argument?
    choices:
      - text: 'A cold week can occur during global warming.'
        correct: true
      - text: 'A single cold week measures the entire global climate.'
        rationale: |
          This treats a local short interval as a global long-term sample. The cold is real and noticeable. Check spatial coverage and duration.
      - text: 'Warming means every place must be hotter on every day.'
        rationale: |
          This turns a trend in averages into a rule for every observation. Warming describes increasing temperature. Check average versus each day.
      - text: 'A cold local week cancels all past global measurements.'
        rationale: |
          This allows one observation to erase an entire record. Recent conditions feel relevant. Check the full set of measurements.
    explanation: |
      Local weather varies from day to day. Global warming is a long-term rise in Earth's average surface temperature. A cold local week can occur within that rising long-term average.
    approved: true

  - id: q-earth-science-astronomy-weather-and-climate-0006
    type: identify
    difficulty: medium
    stem: |
      Which lowest atmospheric layer contains nearly all ordinary weather?
    choices:
      - text: 'The troposphere'
        correct: true
      - text: 'The stratosphere'
        rationale: |
          This chooses the next layer above the usual weather region. Aircraft can travel near this boundary. Check the lowest layer.
      - text: 'The mesosphere'
        rationale: |
          This chooses a much higher meteor-ablation region. Both regions have atmospheric phenomena. Check the altitude of ordinary storms.
      - text: 'The thermosphere'
        rationale: |
          This chooses the thin upper atmosphere. Its particles have high temperatures. Check where dense lower air and ordinary weather occur.
    explanation: |
      The troposphere begins at Earth's surface. Nearly all ordinary clouds, rain, and storms occur there. Its upper boundary varies with latitude and other conditions.
    approved: true

  - id: q-earth-science-astronomy-weather-and-climate-0007
    type: identify
    difficulty: medium
    stem: |
      Which atmospheric layer contains most atmospheric ozone, which absorbs harmful solar ultraviolet radiation?
    choices:
      - text: 'Stratosphere'
        correct: true
      - text: 'Troposphere'
        rationale: |
          This chooses the surface weather layer. Some ozone exists lower down. Check the location of most atmospheric ozone.
      - text: 'Mesosphere'
        rationale: |
          This chooses the layer above the stratosphere. Both are above ordinary weather. Check the ozone-rich region.
      - text: 'Thermosphere'
        rationale: |
          This chooses a much higher thin region. Upper atmosphere also absorbs energetic radiation. Check where most ozone is found.
    explanation: |
      Most atmospheric ozone is in the stratosphere. It absorbs much of the Sun's harmful ultraviolet radiation.
    approved: true

  - id: q-earth-science-astronomy-weather-and-climate-0008
    type: identify
    difficulty: medium
    stem: |
      Which layer, roughly $50$-$85$ km above Earth, is where most visible meteors lose material during atmospheric entry?
    choices:
      - text: 'The mesosphere'
        correct: true
      - text: 'The stratosphere'
        rationale: |
          This chooses the ozone-rich region below the main meteor-ablation zone. Both are upper-air layers. Check the stated height range.
      - text: 'The thermosphere'
        rationale: |
          This chooses a region above the main visible meteor zone. Entry begins high in the atmosphere. Check where most visible ablation occurs.
      - text: 'The exosphere'
        rationale: |
          This chooses the very thin outer fringe. Space particles approach from outside. Check where the air is dense enough for the stated meteor effects.
    explanation: |
      Most visible meteors ablate in the mesosphere. Ablation means incoming material is heated and lost during high-speed entry.
    approved: true

  - id: q-earth-science-astronomy-weather-and-climate-0009
    type: identify
    difficulty: medium
    stem: |
      Which atmospheric layer begins near $85$ km and extends hundreds of kilometers upward, with high particle temperatures but very thin gas?
    choices:
      - text: 'Thermosphere'
        correct: true
      - text: 'Troposphere'
        rationale: |
          This chooses dense lower air. Warm surface weather is familiar. Check the altitude and low density.
      - text: 'Mesosphere'
        rationale: |
          This chooses the region just below the stated boundary. The names are adjacent in the layer list. Check where the thermosphere starts.
      - text: 'Stratosphere'
        rationale: |
          This chooses the ozone-rich layer much lower down. It can warm with height. Check the stated starting altitude.
    explanation: |
      The thermosphere starts near $85$ km. Its few particles can have high kinetic energy, which gives a high measured temperature. The gas is extremely thin.
    approved: true

  - id: q-earth-science-astronomy-weather-and-climate-0010
    type: identify
    difficulty: medium
    stem: |
      Which atmospheric layer is the outermost layer, fading gradually into outer space, and where satellites orbit?
    choices:
      - text: 'The exosphere'
        correct: true
      - text: 'The thermosphere'
        rationale: |
          This chooses a satellite-containing region that is not outermost. Many spacecraft do orbit there. Check the outermost clue.
      - text: 'The mesosphere'
        rationale: |
          This chooses the meteor region rather than the outer fringe. It lies above ordinary weather. Check the full layer order.
      - text: 'The stratosphere'
        rationale: |
          This chooses the ozone region much lower down. It is above much weather. Check the outermost location.
    explanation: |
      The exosphere is the outermost very thin atmospheric region. It gradually merges with space. Some satellites orbit within it.
    approved: true

  - id: q-earth-science-astronomy-weather-and-climate-0011
    type: process-ordering
    difficulty: medium
    stem: |
      Arrange Earth's five atmospheric layers in order from the ground up: exosphere, mesosphere, stratosphere, thermosphere, troposphere.
    choices:
      - text: 'Troposphere, stratosphere, mesosphere, thermosphere, exosphere'
        correct: true
      - text: 'Troposphere, mesosphere, stratosphere, thermosphere, exosphere'
        rationale: |
          This swaps the ozone and meteor layers. Their names are close in the list. Check that stratosphere lies below mesosphere.
      - text: 'Exosphere, thermosphere, mesosphere, stratosphere, troposphere'
        rationale: |
          This gives the space-to-ground order. It uses every layer. Check the requested direction.
      - text: 'Stratosphere, troposphere, mesosphere, exosphere, thermosphere'
        rationale: |
          This swaps the bottom and top pairs. All names are familiar. Check the surface layer and the outermost layer.
    explanation: |
      Starting at the ground, the layers are troposphere, stratosphere, mesosphere, thermosphere, and exosphere.
    approved: true

  - id: q-earth-science-astronomy-weather-and-climate-0012
    type: classify
    difficulty: medium
    stem: |
      Two soundings place the tropopause near $6$ km at a polar site and near $19$ km at an equatorial site. Which interpretation fits atmospheric layers?
    choices:
      - text: 'The troposphere''s upper boundary varies with latitude.'
        correct: true
      - text: 'One sounding must be wrong because every boundary is fixed.'
        rationale: |
          This treats approximate layer heights as universal constants. Textbooks often give one number. Check latitude-dependent ranges.
      - text: 'The equatorial troposphere begins only at $19$ km.'
        rationale: |
          This treats the upper boundary as the bottom. The altitude is prominent. Check that the troposphere starts at the surface.
      - text: 'Both sites must be measuring the boundary of the exosphere.'
        rationale: |
          This assigns low atmospheric heights to the outermost fringe. Both are boundaries. Check the layer and scale.
    explanation: |
      The troposphere is generally shallower near the poles and deeper near the equator. Its upper boundary is not at one fixed altitude worldwide. Both reported heights fit the lesson's approximate heights.
    approved: true

  - id: q-earth-science-astronomy-weather-and-climate-0013
    type: classify
    difficulty: hard
    stem: |
      Why does the thermosphere's high gas temperature alone not imply intense heating of an object by contact with that gas?
    choices:
      - text: 'Too few gas particles transfer much heat.'
        correct: true
      - text: 'Its particles have very low kinetic energy.'
        rationale: |
          This denies the stated high temperature. Thin air may suggest cold. Check particle energy separately from particle number.
      - text: 'Gas temperature determines contact heating regardless of density.'
        rationale: |
          This ignores how many particles contact the object. Temperature is important. Check density as well.
      - text: 'The gas is dense enough to behave like hot liquid water.'
        rationale: |
          This treats very thin gas as a dense fluid. Both can transfer heat. Check the actual particle density.
    explanation: |
      The thermosphere contains very few gas particles. Each may carry high kinetic energy. Their low number means little energy is transferred by contact compared with dense hot air.
    approved: true

  - id: q-earth-science-astronomy-weather-and-climate-0014
    type: classify
    difficulty: hard
    stem: |
      Which statement correctly describes the ozone layer's protective role?
    choices:
      - text: 'It absorbs harmful ultraviolet radiation.'
        correct: true
      - text: 'It produces most of the oxygen breathed by animals.'
        rationale: |
          This confuses an oxygen-containing gas with the main source of breathable oxygen. Ozone's name suggests oxygen. Check its radiation-absorption role.
      - text: 'It stops all visible sunlight from reaching Earth.'
        rationale: |
          This extends absorption to all sunlight. Ozone does absorb radiation. Check ultraviolet versus visible light.
      - text: 'It mainly absorbs infrared radiation emitted by Earth.'
        rationale: |
          This confuses ozone protection with the greenhouse effect. Both involve radiation and atmospheric gases. Check incoming ultraviolet versus outgoing infrared energy.
    explanation: |
      Ozone in the stratosphere absorbs much of the Sun's harmful ultraviolet radiation. This reduces that radiation reaching the surface.
    approved: true

  - id: q-earth-science-astronomy-weather-and-climate-0015
    type: identify
    difficulty: medium
    stem: |
      What is the Philippine name for the warm, moist southwest monsoon that commonly brings rain to western areas?
    choices:
      - text: 'Habagat'
        correct: true
      - text: 'Amihan'
        rationale: |
          This reverses the wind direction. Both are monsoons. Check southwest versus northeast.
      - text: 'El Niño'
        rationale: |
          This substitutes a Pacific climate variation for a seasonal wind system. It affects Philippine weather. Check the named wind direction.
      - text: 'La Niña'
        rationale: |
          This substitutes a Pacific climate variation for a monsoon. It can influence rainfall. Check seasonal winds rather than ocean-temperature variation.
    explanation: |
      Habagat is the southwest monsoon. Warm, moist southwesterly flow commonly brings rain to western parts of the Philippines.
    approved: true

  - id: q-earth-science-astronomy-weather-and-climate-0016
    type: identify
    difficulty: medium
    stem: |
      What is the Philippine name for the cooler northeast monsoon, which can bring rain to eastern areas?
    choices:
      - text: 'Amihan'
        correct: true
      - text: 'Habagat'
        rationale: |
          This chooses the opposite seasonal wind. Both influence rainfall. Check the northeast direction.
      - text: 'El Niño'
        rationale: |
          This uses a Pacific climate variation for a monsoon. Dry conditions can occur during it. Check the seasonal wind system.
      - text: 'La Niña'
        rationale: |
          This uses a Pacific climate variation for the northeast monsoon. Both can affect rain. Check the prevailing wind direction.
    explanation: |
      Amihan is the northeast monsoon. It brings cooler northeasterly flow and can produce substantial rain along eastern exposures.
    approved: true

  - id: q-earth-science-astronomy-weather-and-climate-0017
    type: classify
    difficulty: medium
    stem: |
      Habagat is established while a tropical cyclone also affects the Philippines. Which relationship is accurate?
    choices:
      - text: 'They are distinct systems whose effects can overlap.'
        correct: true
      - text: 'Every tropical cyclone is part of the monsoon itself.'
        rationale: |
          This merges overlapping systems into one. Cyclones can enhance monsoon rain. Check seasonal flow versus an individual storm.
      - text: 'A tropical cyclone automatically changes southwest flow into Amihan.'
        rationale: |
          This assumes any cyclone changes the seasonal wind system. Cyclones have circulating winds. Check the prevailing monsoon pattern.
      - text: 'Habagat exists only inside a tropical cyclone''s center.'
        rationale: |
          This confines a broad wind system to a storm center. Both can produce rain. Check their different scales.
    explanation: |
      Habagat is a seasonal wind system. A tropical cyclone is an organized storm. They can occur together and affect the same region.
    approved: true

  - id: q-earth-science-astronomy-weather-and-climate-0018
    type: classify
    difficulty: hard
    stem: |
      Cool northeasterly monsoon winds bring persistent rain to the eastern Philippines. Which statement is supported?
    choices:
      - text: 'Amihan can bring substantial eastern rain.'
        correct: true
      - text: 'Rain anywhere means the monsoon must be Habagat.'
        rationale: |
          This uses rain alone to identify the southwest monsoon. Habagat often brings rain. Check wind direction and exposure.
      - text: 'Amihan must be dry in every Philippine region.'
        rationale: |
          This turns cooler conditions into universal dryness. Many western areas are drier then. Check eastern exposures separately.
      - text: 'Wind direction has no role in monsoon identification.'
        rationale: |
          This discards the main wind-system clue. Rain is highly visible. Check the prevailing northeast flow.
    explanation: |
      Amihan brings northeasterly flow. Eastern areas exposed to that flow can receive substantial rain. Rainfall therefore differs across the country during the same monsoon.
    approved: true

  - id: q-earth-science-astronomy-weather-and-climate-0019
    type: identify
    difficulty: medium
    stem: |
      What criterion distinguishes PAGASA's tropical cyclone intensity categories, including typhoon?
    choices:
      - text: 'Sustained wind strength'
        correct: true
      - text: 'The calendar month when the storm forms'
        rationale: |
          This uses season rather than intensity. Some months have more cyclones. Check the measured wind criterion.
      - text: 'The monsoon name in effect during the storm'
        rationale: |
          This uses a separate wind system as a storm category. Cyclones can occur during monsoons. Check the cyclone's sustained wind strength.
      - text: 'The number of provinces under rainfall warnings'
        rationale: |
          This uses warning coverage rather than storm intensity. Large impacts can seem like greater strength. Check the classification measurement.
    explanation: |
      PAGASA classifies tropical cyclones by sustained wind strength. Typhoon is one of these intensity categories.
    approved: true

  - id: q-earth-science-astronomy-weather-and-climate-0020
    type: cause-effect
    difficulty: medium
    stem: |
      Why does the buildup of greenhouse gases, like carbon dioxide, in the atmosphere cause global warming?
    choices:
      - text: 'They absorb and re-emit outgoing infrared energy.'
        correct: true
      - text: 'They block all incoming visible sunlight permanently.'
        rationale: |
          This turns the effect into complete sunlight blockage. Clouds can reduce sunlight. Check outgoing infrared versus incoming light.
      - text: 'They make Earth''s surface stop emitting infrared energy.'
        rationale: |
          This removes the radiation that supplies the interaction. A warmer surface emits radiation. Check emission and subsequent absorption.
      - text: 'They affect only upper-air temperature and never the surface.'
        rationale: |
          This isolates the effect from the lower atmosphere. Some gases occur high up. Check energy returned toward the surface.
    explanation: |
      Earth's warmed surface emits infrared radiation. Greenhouse gases absorb some of it and re-emit energy, including toward the surface. This slows energy loss to space and changes the balance of incoming and outgoing energy.
    approved: true

  - id: q-earth-science-astronomy-weather-and-climate-0021
    type: classify
    difficulty: medium
    stem: |
      A news report says, "This year's typhoon was unusually strong." A separate scientific report says, "Average global temperatures have risen over the past century, and sea levels are slowly rising as a result." Which report describes a weather event, and which describes climate change?
    choices:
      - text: 'The storm is weather; the long-term trend is climate change.'
        correct: true
      - text: 'Both are weather because both involve temperature or storms.'
        rationale: |
          This ignores duration because both reports involve the atmosphere. Weather does involve storms and temperature. Check event versus century-long trend.
      - text: 'Both are climate change because both sound unusual.'
        rationale: |
          This uses unusualness instead of timescale. Both reports may sound striking. Check whether a long-term pattern is measured.
      - text: 'The storm is climate change; the long-term trend is weather.'
        rationale: |
          This reverses the two timescales. Both contain weather-related observations. Check one storm versus many decades.
    explanation: |
      The typhoon report describes an individual weather event. The century-long report describes a persistent change in climate statistics.
    approved: true

  - id: q-earth-science-astronomy-weather-and-climate-0022
    type: predict-outcome
    difficulty: exam
    stem: |
      A tropical cyclone occurs outside the usual peak season. Which conclusion follows from Philippine cyclone climatology?
    choices:
      - text: 'Cyclones can occur outside the July-to-October peak.'
        correct: true
      - text: 'The reported storm cannot be a tropical cyclone.'
        rationale: |
          This treats a peak as an exclusive time window. Most events cluster seasonally. Check can occur versus most common.
      - text: 'The peak season must last every month of the year.'
        rationale: |
          This removes seasonality because one off-peak event occurs. Exceptions are noticeable. Check frequency distribution across the year.
      - text: 'Every off-peak cyclone proves a long-term climate shift.'
        rationale: |
          This uses one event to prove a lasting trend. Timing can matter in climate data. Check a many-year pattern rather than one occurrence.
    explanation: |
      The western North Pacific can produce tropical cyclones throughout the year. July through October is the peak, when many occur. A peak does not limit all occurrences to those months.
    approved: true
