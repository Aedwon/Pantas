meta:
  subject: science
  topic: earth-science-astronomy
  subtopic: earths-subsystems
  exams: ["upcat", "ustet", "dost-sei"]
questions:
  - id: q-earth-science-astronomy-earths-subsystems-0001
    type: 'identify'
    difficulty: 'easy'
    stem: |
      Which Earth subsystem is the solid, rocky part of Earth, including the crust and the uppermost rigid part of the mantle?
    choices:
      - text: 'The lithosphere'
        correct: true
      - text: 'The hydrosphere'
        rationale: |
          This selects water instead of the rocky mechanical layer. Ice can also be solid. Check material and layer definition, not state alone.
      - text: 'The atmosphere'
        rationale: |
          This selects the gaseous envelope. Air lies above the surface. Check the crust-and-mantle description.
      - text: 'The biosphere'
        rationale: |
          This selects organisms and ecosystems. They occur on land. Check the layer’s defining material and rigidity.
    explanation: |
      The lithosphere is the rigid outer mechanical layer. It includes the crust and rigid uppermost mantle.
    approved: true

  - id: q-earth-science-astronomy-earths-subsystems-0002
    type: 'identify'
    difficulty: 'easy'
    stem: |
      In a four-sphere model that includes atmospheric water and ice in the water system, which sphere includes oceans, groundwater, ice, and water vapor?
    choices:
      - text: 'The hydrosphere'
        correct: true
      - text: 'The lithosphere'
        rationale: |
          This selects the rock category for all water. Groundwater occurs within rock. Check the material being emphasized.
      - text: 'The atmosphere'
        rationale: |
          This selects the location of atmospheric water as if it covers every water reservoir. Vapor occurs in air. Check the oceans and groundwater included in the stem.
      - text: 'The biosphere'
        rationale: |
          This selects life because organisms need water. Water participates in ecosystems. Check whether the question emphasizes living organisms or water itself.
    explanation: |
      Under the stated convention, the hydrosphere includes Earth’s water in liquid, frozen, and atmospheric forms. It emphasizes water participating in the global water system.
    approved: true

  - id: q-earth-science-astronomy-earths-subsystems-0003
    type: 'identify'
    difficulty: 'medium'
    stem: |
      Which Earth subsystem is the layer of gases surrounding Earth, mostly nitrogen and oxygen, held in place by gravity?
    choices:
      - text: 'The atmosphere'
        correct: true
      - text: 'The hydrosphere'
        rationale: |
          This selects the water system because air can contain moisture. Water vapor is one component. Check the entire gas envelope.
      - text: 'The lithosphere'
        rationale: |
          This selects the rocky layer. The gas rests above land. Check whether the specified material is gas or rock.
      - text: 'The biosphere'
        rationale: |
          This selects living organisms because they breathe air. Air supports life. Check the envelope rather than its biological users.
    explanation: |
      The atmosphere is the envelope of gases around Earth. Nitrogen and oxygen are major components of that surrounding air.
    approved: true

  - id: q-earth-science-astronomy-earths-subsystems-0004
    type: 'identify'
    difficulty: 'medium'
    stem: |
      Which Earth subsystem includes every living thing on Earth and the places where they live?
    choices:
      - text: 'The biosphere'
        correct: true
      - text: 'The atmosphere'
        rationale: |
          This substitutes the air environment for all life. Some organisms occur in air. Check the living-system definition.
      - text: 'The hydrosphere'
        rationale: |
          This substitutes water environments for all life. Aquatic organisms are living. Check that life also occurs elsewhere.
      - text: 'The lithosphere'
        rationale: |
          This substitutes the rocky environment for all life. Soil supports organisms. Check the living organisms themselves.
    explanation: |
      The biosphere includes living organisms and ecosystems where life occurs. It extends across land, water, and other habitats.
    approved: true

  - id: q-earth-science-astronomy-earths-subsystems-0005
    type: 'classify'
    difficulty: 'medium'
    stem: |
      Which sphere most directly includes the living coral animals in a reef?
    choices:
      - text: 'Biosphere'
        correct: true
      - text: 'Hydrosphere'
        rationale: |
          This classifies the surrounding water instead of the animals. Coral lives in the ocean. Check the feature specifically emphasized.
      - text: 'Lithosphere'
        rationale: |
          This classifies the skeleton material instead of the living animals. Coral has a hard skeleton. Check living tissue versus material.
      - text: 'Atmosphere'
        rationale: |
          This classifies exchanged gases instead of organisms. Coral uses gases in water. Check the living-animal focus.
    explanation: |
      The question emphasizes living coral animals. Living organisms are part of the biosphere. The whole reef also interacts with water and solid materials.
    approved: true

  - id: q-earth-science-astronomy-earths-subsystems-0006
    type: 'classify'
    difficulty: 'medium'
    stem: |
      A four-sphere model of Earth has no separate cryosphere. In this model, where is a glacier primarily classified?
    choices:
      - text: 'Hydrosphere'
        correct: true
      - text: 'Lithosphere'
        rationale: |
          This assigns all solids to the rock sphere. Glacier ice is solid. Check whether it is water or rock.
      - text: 'Atmosphere'
        rationale: |
          This selects air because weather affects ice. Glaciers respond to climate. Check their own material.
      - text: 'Biosphere'
        rationale: |
          This selects life because ice can host organisms. Some microbes live in ice. Check the glacier’s water rather than those organisms.
    explanation: |
      A glacier is frozen water. In a four-sphere model with no separate cryosphere, frozen water belongs to the hydrosphere.
    approved: true

  - id: q-earth-science-astronomy-earths-subsystems-0007
    type: 'classify'
    difficulty: 'hard'
    stem: |
      A four-sphere model of Earth has no separate cryosphere. A student assigns polar ice to the lithosphere because it is solid. Is that assignment correct?
    choices:
      - text: 'No; ice remains in the water system.'
        correct: true
      - text: 'Yes; ice is a solid, so it is part of the lithosphere.'
        rationale: |
          This treats every solid as part of the rock sphere. Ice and rock can both be hard. Check what each is made of.
      - text: 'Yes; a model that names a cryosphere would place polar ice in the lithosphere.'
        rationale: |
          This mixes up a model with a separate ice sphere and the model in the question. Such models treat ice as its own sphere, not as rock. Check which model the question states.
      - text: 'No; frozen water belongs to the atmosphere.'
        rationale: |
          This links ice to the atmosphere because snow and cold air come from weather. Polar ice is not a gas. Check the material of the ice itself.
    explanation: |
      In this four-sphere model, ice belongs to the water system. It is frozen $H_2O$, so it is part of the hydrosphere.
    approved: true

  - id: q-earth-science-astronomy-earths-subsystems-0008
    type: 'classify'
    difficulty: 'medium'
    stem: |
      Which sphere is the gaseous envelope that supports weather and scatters incoming radiation?
    choices:
      - text: 'Atmosphere'
        correct: true
      - text: 'Rigid lithosphere alone'
        rationale: |
          This assigns air-envelope functions to the rigid rocky layer. Earth’s surface also affects radiation. Check the surrounding gases.
      - text: 'Living biosphere alone'
        rationale: |
          This uses organisms’ gas exchange as the whole air envelope. Life exchanges gases. Check the physical envelope itself.
      - text: 'Ocean hydrosphere alone'
        rationale: |
          This makes ocean water the entire weather-supporting envelope. Water is involved in weather. Check the sphere composed of surrounding gases.
    explanation: |
      The atmosphere contains the surrounding gases. It supports weather processes and absorbs and scatters incoming radiation.
    approved: true

  - id: q-earth-science-astronomy-earths-subsystems-0009
    type: 'classify'
    difficulty: 'medium'
    stem: |
      Which broader Earth-system term includes the core, beyond the rigid outer lithosphere?
    choices:
      - text: 'Geosphere'
        correct: true
      - text: 'Lithosphere only'
        rationale: |
          This applies the outer-layer term to the full interior. The core is within Earth. Check the lithosphere’s crust-and-uppermost-mantle limit.
      - text: 'Hydrosphere'
        rationale: |
          This assigns the core to the water system. Parts of the interior may be fluid. Check that fluid metal is not water.
      - text: 'Atmosphere'
        rationale: |
          This treats the interior as the gas envelope. Both are large Earth components. Check the sphere’s material and location.
    explanation: |
      Geosphere is the broader solid-Earth and interior concept. It includes the core as well as the crust and mantle.
    approved: true

  - id: q-earth-science-astronomy-earths-subsystems-0010
    type: 'classify'
    difficulty: 'hard'
    stem: |
      A colony of bacteria lives deep underground, within cracks in solid rock. A student classifies these bacteria as part of the lithosphere, since that is where they are found. Is this correct?
    choices:
      - text: 'No; living bacteria are biosphere.'
        correct: true
      - text: 'Yes; anything within rock is only lithosphere.'
        rationale: |
          This uses location alone to remove living organisms from the life sphere. The bacteria occupy rock. Check what feature is emphasized.
      - text: 'Yes; bacteria are nonliving solid-Earth material.'
        rationale: |
          This treats a microscopic organism as nonliving. Bacteria are tiny. Check their cellular living nature.
      - text: 'No; because no organism can live underground.'
        rationale: |
          This assumes living things cannot inhabit rock cracks. Surface life is familiar. Check the stated underground colony.
    explanation: |
      The specified bacteria are living organisms. They are therefore part of the biosphere. Their rocky habitat also connects their ecosystem with the geosphere.
    approved: true

  - id: q-earth-science-astronomy-earths-subsystems-0011
    type: 'cause-effect'
    difficulty: 'medium'
    stem: |
      A volcanic eruption transfers ash and gases from the solid-Earth system into the surrounding air. Which source-and-destination pair is directly emphasized?
    choices:
      - text: 'Geosphere to atmosphere'
        correct: true
      - text: 'Atmosphere to geosphere'
        rationale: |
          This reverses the direction. Ash does settle back on the ground later. Check which way the material moves when the volcano erupts.
      - text: 'Geosphere to hydrosphere'
        rationale: |
          This keeps the right source but names the wrong destination. Ash can land in water. Check where the question says the ash and gases go.
      - text: 'Biosphere to atmosphere'
        rationale: |
          This names the wrong source. Living things also release gases into air. Check what the question names as the source.
    explanation: |
      Volcanic material comes from the geosphere. Erupted ash and gases enter the atmosphere. This transfers material between those systems.
    approved: true

  - id: q-earth-science-astronomy-earths-subsystems-0012
    type: 'classify'
    difficulty: 'hard'
    stem: |
      Water already in rock cracks freezes and helps break the rock. Living roots then grow into it. In the four-sphere model, which directly described systems participate?
    choices:
      - text: 'Geosphere, hydrosphere, biosphere'
        correct: true
      - text: 'Geosphere, atmosphere, biosphere'
        rationale: |
          This treats the water in the cracks as air. Frozen water and air can both seem to sit in the open spaces. Check what is freezing in the cracks.
      - text: 'Geosphere, hydrosphere'
        rationale: |
          This leaves out the roots. The water and rock are easy to see first. Check the living roots in the last sentence.
      - text: 'Hydrosphere, biosphere'
        rationale: |
          This leaves out the rock. The rock is the thing being broken. Check what the water and roots are acting on.
    explanation: |
      Rock is part of the solid-Earth system. Water in cracks is hydrosphere, and living roots are biosphere. The stated process therefore directly represents all three.
    approved: true

  - id: q-earth-science-astronomy-earths-subsystems-0013
    type: 'compare-contrast'
    difficulty: 'medium'
    stem: |
      Why can water vapor in the air be discussed under both atmosphere and hydrosphere in some models?
    choices:
      - text: 'It is located in the air and is also part of the water cycle.'
        correct: true
      - text: 'It changes into a different substance when it evaporates.'
        rationale: |
          This confuses a change of state with a change of substance. Water vapor looks nothing like liquid water. Check that vapor is still $H_2O$.
      - text: 'It forms mainly from carbon dioxide released by living things.'
        rationale: |
          This confuses a product of respiration with water vapor. Living things do release gases into air. Check which substance is named.
      - text: 'It comes from the lithosphere before it reaches the air.'
        rationale: |
          This names rock as the source of the vapor. Soil is part of the ground. Check what water in the air is made of.
    explanation: |
      Atmospheric water has a location in the atmosphere and participates in the global water cycle. Depending on the stated convention, it can be discussed in both atmosphere and hydrosphere terms.
    approved: true

  - id: q-earth-science-astronomy-earths-subsystems-0014
    type: 'cause-effect'
    difficulty: 'medium'
    stem: |
      Plants take in carbon dioxide from the air and draw up water through their roots from the ground. Which two subsystems are directly interacting with the biosphere in this description?
    choices:
      - text: 'Atmosphere and hydrosphere'
        correct: true
      - text: 'Atmosphere and lithosphere'
        rationale: |
          This replaces the water with the ground it sits in. Roots grow in soil. Check what the roots actually take up.
      - text: 'Hydrosphere and lithosphere'
        rationale: |
          This counts the water but misses the carbon dioxide from the air. Roots visibly draw water. Check the gas the plants take in.
      - text: 'Biosphere and hydrosphere'
        rationale: |
          This counts the plants themselves as one of the two. The question asks what interacts with the plants. Check which subsystems the plants take material from.
    explanation: |
      Carbon dioxide comes from the air, linking plants with the atmosphere. Water taken through roots links them with the hydrosphere. The living plants are biosphere.
    approved: true

  - id: q-earth-science-astronomy-earths-subsystems-0015
    type: 'predict-outcome'
    difficulty: 'exam'
    stem: |
      A heavy rainstorm causes a landslide that exposes fresh rock on a hillside. Over the following months, mosses begin growing on the exposed rock, and the surrounding air becomes more humid as water evaporates from the wet soil. Which choice correctly matches each part of this chain of events to its Earth subsystem?
    choices:
      - text: 'Rock: geosphere; soil water: hydrosphere; mosses: biosphere; humid air: atmosphere.'
        correct: true
      - text: 'Rock: biosphere; soil water: hydrosphere; mosses: geosphere; humid air: atmosphere.'
        rationale: |
          This swaps the rock and the mosses. Mosses grow on the rock, so the two seem joined. Check which one is living.
      - text: 'Rock: hydrosphere; soil water: geosphere; mosses: biosphere; humid air: atmosphere.'
        rationale: |
          This swaps the rock and the water. Wet soil and rock are found together. Check which one is liquid water.
      - text: 'Rock: geosphere; soil water: hydrosphere; mosses: atmosphere; humid air: biosphere.'
        rationale: |
          This swaps the mosses and the air. Mosses take in gases and the air feels moist. Check which one is a living thing.
    explanation: |
      The landslide exposes rock in the solid-Earth system. Rain and evaporating water involve hydrosphere; air humidity involves atmosphere. Growing mosses and plants involve biosphere.
    approved: true

  - id: q-earth-science-astronomy-earths-subsystems-0016
    type: 'process-ordering'
    difficulty: 'easy'
    stem: |
      A plant takes up water and releases some as vapor into air. Which sequence tracks the emphasized transfer?
    choices:
      - text: 'Hydrosphere to biosphere to atmosphere'
        correct: true
      - text: 'Geosphere to biosphere to atmosphere'
        rationale: |
          This names the soil as the source. Roots do sit in soil. Check what material the plant takes up.
      - text: 'Atmosphere to biosphere to hydrosphere'
        rationale: |
          This reverses the whole sequence. Plants can be wet from rain. Check which way the water moves in the question.
      - text: 'Hydrosphere to atmosphere to biosphere'
        rationale: |
          This puts the stages in the wrong order. Vapor does end up in air. Check that the vapor comes from the plant.
    explanation: |
      Water taken up is part of the hydrosphere. The living plant is biosphere. Vapor released into air connects with the atmosphere.
    approved: false

  - id: q-earth-science-astronomy-earths-subsystems-0017
    type: 'cause-effect'
    difficulty: 'medium'
    stem: |
      Rainwater directly weathers a granite surface. Which interaction is emphasized?
    choices:
      - text: 'Hydrosphere with geosphere'
        correct: true
      - text: 'Biosphere with atmosphere only'
        rationale: |
          This introduces organisms and excludes the contacting rock and water. Many environmental events involve life. Check what is directly described.
      - text: 'Only atmosphere, because rain came from clouds'
        rationale: |
          This counts water’s earlier location but omits its contact with rock. Rain forms in clouds. Check the current interaction.
      - text: 'Only biosphere, because all weathering must involve plants'
        rationale: |
          This assumes every weathering process requires living roots. Roots can weather rock. Check whether organisms are named here.
    explanation: |
      Rainwater is water in the hydrosphere. The granite surface is rock in the geosphere. Their contact directly links those systems.
    approved: false

  - id: q-earth-science-astronomy-earths-subsystems-0018
    type: 'predict-outcome'
    difficulty: 'hard'
    stem: |
      Plants that return water vapor to air are removed from a plot. With other conditions comparable, which direct transfer is reduced?
    choices:
      - text: 'Biosphere to atmosphere water transfer at the plot'
        correct: true
      - text: 'Geosphere to atmosphere ash transfer at the plot'
        rationale: |
          This substitutes an eruption process for the stated plant process. Both release material to air. Check the source material.
      - text: 'Atmosphere to biosphere water transfer at the plot'
        rationale: |
          This reverses the direction of the transfer. Plants and air exchange gases. Check which way the water vapor moves.
      - text: 'Hydrosphere to geosphere water transfer at the plot'
        rationale: |
          This picks a water movement that does not depend on the plants. Vegetation affects water systems. Check the specific direct transfer described.
    explanation: |
      The removed plants supplied water vapor to air. With fewer of those plants, their direct contribution to this transfer is reduced.
    approved: false

  - id: q-earth-science-astronomy-earths-subsystems-0019
    type: 'compare-contrast'
    difficulty: 'hard'
    stem: |
      Two lessons classify atmospheric water differently. What is the best way to compare their sphere models?
    choices:
      - text: 'Check each model’s stated definitions.'
        correct: true
      - text: 'Count how many spheres each model lists.'
        rationale: |
          This compares the number of spheres, not where water is placed. Two models can list the same number. Check how each model defines its spheres.
      - text: 'Compare how large each sphere is drawn in the diagrams.'
        rationale: |
          This compares the drawing, not the classification. Diagram sizes are easy to see. Check the definitions the lessons give.
      - text: 'Compare the example locations each lesson uses.'
        rationale: |
          This compares examples, which can match even when the models differ. Examples are easy to compare. Check the stated definitions of each sphere.
    explanation: |
      Sphere models may draw boundaries differently. Compare their definitions while recognizing that water moves through connected Earth systems.
    approved: false

  - id: q-earth-science-astronomy-earths-subsystems-0020
    type: 'classify'
    difficulty: 'exam'
    stem: |
      Soil contains mineral particles, water, air spaces, and living roots. Which assignment of these parts to Earth spheres fits Earth-system science?
    choices:
      - text: 'Minerals: geosphere; water: hydrosphere; air spaces: atmosphere; roots: biosphere.'
        correct: true
      - text: 'Minerals: geosphere; water: atmosphere; air spaces: hydrosphere; roots: biosphere.'
        rationale: |
          This swaps the water and the air spaces. Both fill gaps between particles. Check which one is liquid.
      - text: 'Minerals: geosphere; water: hydrosphere; air spaces: atmosphere; roots: geosphere.'
        rationale: |
          This puts the roots with the ground they grow in. Roots touch soil minerals. Check which part is alive.
      - text: 'Minerals: biosphere; water: hydrosphere; air spaces: atmosphere; roots: geosphere.'
        rationale: |
          This swaps the minerals and the roots. Soil is often linked to plants. Check which part is rock material and which is living.
    explanation: |
      Soil combines solid materials, water, air, and living organisms. It is a place where geosphere, hydrosphere, atmosphere, and biosphere interact.
    approved: false
