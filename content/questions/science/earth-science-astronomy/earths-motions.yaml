meta:
  subject: science
  topic: earth-science-astronomy
  subtopic: earths-motions
  exams: ["upcat", "dlsucet", "ustet", "dost-sei"]
questions:
  - id: q-earth-science-astronomy-earths-motions-0001
    type: 'identify'
    difficulty: 'easy'
    stem: |
      Earth spinning on its own axis, taking about 24 hours to complete, is called what motion?
    choices:
      - text: 'Rotation'
        correct: true
      - text: 'Revolution'
        rationale: |
          This substitutes orbital travel for spin. Both are regular Earth motions. Check whether Earth turns around its own axis or travels around the Sun.
      - text: 'Precession'
        rationale: |
          This substitutes long-term axis-direction change for daily spin. Both involve the axis. Check the timescale.
      - text: 'Orbit'
        rationale: |
          This selects the orbital path rather than spinning. Orbit and rotation sound related. Check the center of the stated motion.
    explanation: |
      Rotation is Earth spinning around its own axis. The mean solar day from this motion is about 24 hours.
    approved: true

  - id: q-earth-science-astronomy-earths-motions-0002
    type: 'identify'
    difficulty: 'easy'
    stem: |
      Earth travels around the Sun in a seasonal year of about 365.24 days. What is this motion called?
    choices:
      - text: 'Revolution'
        correct: true
      - text: 'Daily rotation'
        rationale: |
          This selects daily axis spin. Both motions repeat. Check whether the path is around Earth’s axis or the Sun.
      - text: 'Long-term precession'
        rationale: |
          This selects slow axis-direction change. Both are cycles. Check the roughly one-year timescale.
      - text: 'Axial inclination'
        rationale: |
          This treats an axis angle as the orbital motion itself. Tilt matters for seasons. Check whether the question describes angle or travel.
    explanation: |
      Revolution is Earth’s travel around the Sun. A seasonal year is about 365.24 days. Revolution together with axial tilt produces the yearly seasonal cycle.
    approved: true

  - id: q-earth-science-astronomy-earths-motions-0003
    type: 'identify'
    difficulty: 'medium'
    stem: |
      The slow, circular wobble of Earth's tilted axis itself, taking about 26,000 years to complete one full cycle, is called what motion?
    choices:
      - text: 'Precession'
        correct: true
      - text: 'Rotation'
        rationale: |
          This selects daily spin around the axis. The axis is involved in both. Check whether the axis direction itself changes.
      - text: 'Revolution'
        rationale: |
          This selects the annual path around the Sun. Both follow recurring cycles. Check the much longer timescale.
      - text: 'Axial tilt'
        rationale: |
          This names the inclination angle instead of its direction change. Tilted axes can precess. Check angle versus motion.
    explanation: |
      Precession is the slow change in the direction of Earth’s rotation axis. The direction traces roughly a cone over about 26,000 years.
    approved: true

  - id: q-earth-science-astronomy-earths-motions-0004
    type: 'identify'
    difficulty: 'medium'
    stem: |
      About how far is Earth’s rotation axis tilted from the perpendicular to its orbital plane?
    choices:
      - text: 'About $23.4^\circ$'
        correct: true
      - text: 'About $90.0^\circ$'
        rationale: |
          This uses a right angle instead of Earth’s small departure from the perpendicular. The reference direction is perpendicular. Check the angle between axis and that reference.
      - text: 'About $45.0^\circ$'
        rationale: |
          This selects half a right angle. It is a familiar geometric value. Check Earth’s stated inclination.
      - text: 'About $0^\circ$'
        rationale: |
          This removes the inclination. An axis can be perpendicular to an orbital plane. Check the tilt responsible for the main seasonal contrasts.
    explanation: |
      Earth’s axis is inclined about $23.4^\circ$ from the perpendicular to its orbital plane. This inclination changes sunlight angle and daylight across the annual orbit.
    approved: true

  - id: q-earth-science-astronomy-earths-motions-0005
    type: 'classify'
    difficulty: 'medium'
    stem: |
      Which of Earth's three motions directly causes day and night?
    choices:
      - text: 'Rotation'
        correct: true
      - text: 'Revolution'
        rationale: |
          This assigns the daily cycle to a yearly orbit. Revolution changes Earth’s position around the Sun. Check the timescale.
      - text: 'Precession'
        rationale: |
          This assigns the daily cycle to the slow axis wobble. Both involve Earth’s axis. Check the much longer precession cycle.
      - text: 'The Sun orbiting Earth each day'
        rationale: |
          This assumes the Sun’s own travel around Earth causes the cycle. The Sun appears to cross the sky. Check Earth’s eastward spin.
    explanation: |
      Rotation turns a location toward sunlight and then away from it. This produces the normal daily alternation of daylight and night.
    approved: true

  - id: q-earth-science-astronomy-earths-motions-0006
    type: 'classify'
    difficulty: 'medium'
    stem: |
      Which of Earth's three motions, combined with axial tilt, directly causes the seasons?
    choices:
      - text: 'Revolution'
        correct: true
      - text: 'Rotation'
        rationale: |
          This assigns a yearly effect to daily spin. Rotation changes which side faces the Sun. Check the annual timescale.
      - text: 'Precession'
        rationale: |
          This assigns annual seasons to the long axis-direction cycle. Precession changes the pole direction. Check its thousands-of-years timescale.
      - text: 'Only changing Earth-Sun distance'
        rationale: |
          This treats changing Earth-Sun distance as the main seasonal driver. The orbit is not perfectly circular. Check opposite seasonal sunlight conditions in the hemispheres.
    explanation: |
      As Earth revolves with a tilted axis, each hemisphere receives changing sunlight angles and daylight lengths. This creates the yearly seasonal cycle.
    approved: true

  - id: q-earth-science-astronomy-earths-motions-0007
    type: 'classify'
    difficulty: 'medium'
    stem: |
      Which of Earth's three motions is responsible for slowly shifting which star the axis points toward, over thousands of years?
    choices:
      - text: 'Precession'
        correct: true
      - text: 'Rotation'
        rationale: |
          This uses spin around a fixed direction to explain changing axis direction. Stars move across the sky nightly. Check whether the pole direction itself changes.
      - text: 'Revolution'
        rationale: |
          This uses one orbital cycle to explain a long-term pole shift. Earth’s yearly position changes. Check the motion of the axis direction.
      - text: 'Distance changes with no change in axis direction'
        rationale: |
          This uses orbit size alone to change pole direction. Distance can change along an orbit. Check whether the axis orientation changes.
    explanation: |
      Precession slowly changes where the rotation axis points in space. Over long times, a different star can lie nearest the celestial pole.
    approved: true

  - id: q-earth-science-astronomy-earths-motions-0008
    type: 'classify'
    difficulty: 'hard'
    stem: |
      A student says "rotation causes the seasons, and revolution causes day and night," mixing up the two terms. Is this correct?
    choices:
      - text: 'No; daily spin and yearly orbit have different roles.'
        correct: true
      - text: 'Yes; either word can be used for either motion.'
        rationale: |
          This treats the terms as interchangeable. Both describe motion. Check the center and timescale of each.
      - text: 'No; rotation alone produces both the day and all annual seasons.'
        rationale: |
          This assigns both effects to daily spin alone. Rotation is easy to observe through daylight. Check the annual orbit and tilt.
      - text: 'No; revolution alone produces both the day and all annual seasons.'
        rationale: |
          This assigns both effects to the annual orbit alone. Revolution is a major Earth motion. Check the daily spin.
    explanation: |
      Rotation is spin around Earth’s axis and produces the daily light-dark cycle. Revolution is travel around the Sun and, with tilt, produces the seasonal cycle.
    approved: true

  - id: q-earth-science-astronomy-earths-motions-0009
    type: 'cause-effect'
    difficulty: 'hard'
    stem: |
      During Northern Hemisphere summer, temperate Southern Hemisphere regions experience winter. Why does this contradict Earth-Sun distance as the main seasonal cause?
    choices:
      - text: 'Opposite tilts give opposite sunlight conditions.'
        correct: true
      - text: 'The hemispheres have different Earth-Sun distances all year.'
        rationale: |
          This makes distance the cause of opposite seasons. Both hemispheres share almost the same Earth-Sun distance. Check their different tilts toward the Sun.
      - text: 'The hemispheres orbit the Sun at independently different speeds.'
        rationale: |
          This assigns separate orbital speeds to parts of Earth. The locations are far apart. Check that they travel around the Sun as one planet.
      - text: 'Daily rotation makes one hemisphere always have summer.'
        rationale: |
          This treats daily spin as the annual contrast. Both affect sunlight. Check the annual tilt-and-orbit geometry.
    explanation: |
      When the Northern Hemisphere is tilted toward the Sun, it has longer days and more direct sunlight. The Southern Hemisphere is tilted away at the same time. This explains opposite summer and winter seasons.
    approved: true

  - id: q-earth-science-astronomy-earths-motions-0010
    type: 'cause-effect'
    difficulty: 'hard'
    stem: |
      What mainly causes Earth’s axial precession?
    choices:
      - text: 'Moon and Sun gravity acting on the equatorial bulge'
        correct: true
      - text: 'Sunlight heating the axis into a different direction'
        rationale: |
          This assigns the torque to sunlight heating rather than gravity. The Sun influences Earth in several ways. Check the axis-direction mechanism.
      - text: 'The annual orbit, which is the same motion as precession'
        rationale: |
          This treats the annual orbit itself as a direct synonym for precession. Both involve the Sun. Check the slow gravitational turning effect.
      - text: 'Daily rotation preventing every change in axis direction'
        rationale: |
          This treats rotation alone as a guarantee of an unchanged axis forever. Earth spins each day. Check external gravitational torques.
    explanation: |
      The Moon and Sun exert gravitational torques on Earth’s equatorial bulge. These torques slowly change the direction of the rotation axis.
    approved: true

  - id: q-earth-science-astronomy-earths-motions-0011
    type: 'cause-effect'
    difficulty: 'medium'
    stem: |
      A sidereal day, measured against the distant stars, is about 23 hours and 56 minutes: a few minutes shorter than the familiar 24-hour solar day. Why is the solar day slightly longer?
    choices:
      - text: 'Orbital travel requires some extra spin.'
        correct: true
      - text: 'Distant stars approach Earth by a day’s worth of distance.'
        rationale: |
          This uses stellar distance changes to explain the day lengths. Distant stars are the reference. Check the changing direction to the Sun during Earth’s orbit.
      - text: 'Random spin changes explain the reference difference.'
        rationale: |
          This replaces a regular geometric difference with random spin changes. Day length can vary slightly. Check the consistent solar-versus-stellar reference difference.
      - text: 'Both references always give exactly equal day lengths.'
        rationale: |
          This ignores the change of reference direction. Both measure Earth’s rotation. Check the orbit’s effect on the Sun’s apparent direction.
    explanation: |
      Earth advances along its orbit while spinning. To face the Sun in the same direction again, it must rotate a little farther than one turn relative to distant stars. The mean solar day is therefore slightly longer.
    approved: true

  - id: q-earth-science-astronomy-earths-motions-0012
    type: 'identify'
    difficulty: 'medium'
    stem: |
      Which star does Earth's axis currently point toward, useful for navigation in the Northern Hemisphere?
    choices:
      - text: 'Polaris, the North Star'
        correct: true
      - text: 'The Sun'
        rationale: |
          This selects the star at the center of Earth’s orbit instead of near the celestial pole. The Sun is familiar for direction finding. Check the north-axis sky direction.
      - text: 'Sirius'
        rationale: |
          This selects a bright star rather than the one near the pole. Brightness makes Sirius easy to notice. Check position relative to the north celestial pole.
      - text: 'Proxima Centauri'
        rationale: |
          This selects a nearby star rather than a pole-direction star. Nearness can sound useful for navigation. Check sky direction rather than distance from Earth.
    explanation: |
      Polaris lies close to the north celestial pole, the sky direction of Earth’s northward rotation axis. This makes it a useful northern direction reference.
    approved: true

  - id: q-earth-science-astronomy-earths-motions-0013
    type: 'cause-effect'
    difficulty: 'medium'
    stem: |
      Why does the Gregorian calendar add leap days using its four-year and century-exception rules?
    choices:
      - text: 'To track the non-integer seasonal year'
        correct: true
      - text: 'To add a full day of rotation lost every four years'
        rationale: |
          This attributes the accumulated fraction to slowing daily spin. Day length and year length are different. Check the annual seasonal cycle.
      - text: 'To make arbitrary changes unrelated to Earth’s year'
        rationale: |
          This removes the relationship to the seasonal year. Calendar rules are conventions. Check what recurring astronomical cycle they track.
      - text: 'To complete one precession cycle every four years'
        rationale: |
          This assigns a calendar correction to a very long axis cycle. Precession affects seasonal-year details over long times. Check the roughly annual fraction being compensated.
    explanation: |
      A seasonal year is about 365.24 days rather than exactly 365. Leap-day rules compensate for the accumulated fraction and keep the calendar aligned with seasons. Century exceptions make the adjustment more accurate.
    approved: true

  - id: q-earth-science-astronomy-earths-motions-0014
    type: 'predict-outcome'
    difficulty: 'exam'
    stem: |
      Suppose Earth keeps rotating and orbiting but its axis becomes perpendicular to its orbital plane. What happens to the main tilt-driven seasonal contrast?
    choices:
      - text: 'It is greatly reduced.'
        correct: true
      - text: 'It must remain exactly as strong because the orbit remains.'
        rationale: |
          This treats the orbit alone as reproducing the full tilt-driven contrast. Revolution would still occur. Check what changing hemisphere tilt contributes.
      - text: 'It becomes stronger because the axis has no tilt.'
        rationale: |
          This reverses the effect of removing the cause. Tilt creates the contrast. Check the hypothetical reduction in tilt.
      - text: 'Day and night cease because zero tilt stops rotation.'
        rationale: |
          This treats lack of tilt as stopping Earth’s rotation. Axis orientation and spin are different. Check that daily rotation remains in the setup.
    explanation: |
      The tilted axis gives each hemisphere changing sunlight angles and day lengths during the orbit. Removing that tilt would greatly reduce this main seasonal contrast.
    approved: true

  - id: q-earth-science-astronomy-earths-motions-0015
    type: 'identify'
    difficulty: 'easy'
    stem: |
      Earth rotates eastward. What apparent daily motion does this create for the Sun?
    choices:
      - text: 'East to west across the sky'
        correct: true
      - text: 'West to east across the sky'
        rationale: |
          This gives the Sun’s apparent motion the same direction as Earth’s spin. Eastward is stated. Check the reversal between observer motion and apparent sky motion.
      - text: 'No motion because Earth’s orbit is yearly'
        rationale: |
          This uses the yearly orbit to ignore daily spin. Revolution takes a year. Check the daily motion in the question.
      - text: 'A direction determined only by the precession cycle'
        rationale: |
          This substitutes a slow axis-direction change. Precession affects the pole over long times. Check the daily timescale.
    explanation: |
      Earth’s eastward spin makes the Sun appear to move in the opposite direction across the sky. It generally rises in the east and sets in the west.
    approved: false

  - id: q-earth-science-astronomy-earths-motions-0016
    type: 'compare-contrast'
    difficulty: 'medium'
    stem: |
      Which reference defines a sidereal day?
    choices:
      - text: 'Distant stars'
        correct: true
      - text: 'The Sun returning to the same sky direction'
        rationale: |
          This uses the solar reference instead. Both measure a day. Check whether the reference is the Sun or distant stars.
      - text: 'The next Gregorian leap day'
        rationale: |
          This uses a calendar adjustment instead of a rotation reference. Leap days are astronomical corrections. Check the daily motion being measured.
      - text: 'One seasonal orbit around the Sun'
        rationale: |
          This uses a year instead of a day. Both are recurring motions. Check the spin-versus-orbit distinction.
    explanation: |
      A sidereal day measures Earth’s rotation relative to distant stars. It is about 23 hours 56 minutes.
    approved: false

  - id: q-earth-science-astronomy-earths-motions-0017
    type: 'classify'
    difficulty: 'medium'
    stem: |
      Which listed year is a Gregorian leap year?
    choices:
      - text: '2000'
        correct: true
      - text: '1900'
        rationale: |
          This applies the divisible-by-4 rule without the century exception. 1900 is divisible by 4. Check divisibility by 400 for a century.
      - text: '2100'
        rationale: |
          This applies the divisible-by-4 rule to a century without the stronger test. 2100 passes the first test. Check the 400-year rule.
      - text: '2023'
        rationale: |
          This overlooks the basic divisibility-by-4 test. Nearby years may be leap years. Check the listed year itself.
    explanation: |
      A century year must be divisible by 400 to be a leap year. Since $2000/400=5$, 2000 qualifies.
    approved: false

  - id: q-earth-science-astronomy-earths-motions-0018
    type: 'process-ordering'
    difficulty: 'hard'
    stem: |
      Which test order correctly applies Gregorian leap-year rules?
    choices:
      - text: 'Check 4; for centuries, check 400.'
        correct: true
      - text: 'Check 4; every passing century is automatically leap.'
        rationale: |
          This stops before the century exception. Most divisible-by-4 years qualify. Check whether the year ends a century.
      - text: 'Check 100; every passing year is automatically leap.'
        rationale: |
          This treats the century exception as automatic inclusion. Century years need special care. Check the stronger 400 test.
      - text: 'Check 400; every non-century year must also pass 400.'
        rationale: |
          This applies the century requirement to every year. Divisibility by 400 guarantees a leap year. Check whether the year is actually a century.
    explanation: |
      First check divisibility by 4. A century year also needs divisibility by 400. Non-century years passing the first test are leap years.
    approved: false

  - id: q-earth-science-astronomy-earths-motions-0019
    type: 'simple-quantitative'
    difficulty: 'hard'
    stem: |
      Earth’s axis is $23.4^\circ$ from the perpendicular to its orbital plane. What is its acute angle with the plane?
    choices:
      - text: '$66.6^\circ$'
        correct: true
      - text: '$23.4^\circ$'
        rationale: |
          This uses the perpendicular-reference angle as the plane-reference angle. The tilt number is given. Check the requested reference.
      - text: '$113.4^\circ$'
        rationale: |
          This adds the tilt to 90 instead of finding the acute complement. A right angle is involved. Check that the answer is acute.
      - text: '$46.8^\circ$'
        rationale: |
          This doubles the tilt. Two directions are mentioned. Check that a plane and perpendicular are separated by 90 degrees.
    explanation: |
      The plane and its perpendicular form $90^\circ$. Subtract the tilt: $90-23.4=66.6^\circ$.
    approved: false

  - id: q-earth-science-astronomy-earths-motions-0020
    type: 'predict-outcome'
    difficulty: 'exam'
    stem: |
      At one point in Earth’s orbit, the Northern Hemisphere is tilted toward the Sun. Which sunlight pattern supports its summer season?
    choices:
      - text: 'Longer days and more direct rays'
        correct: true
      - text: 'Shorter days and less direct rays'
        rationale: |
          This uses the away-from-Sun pattern. Both patterns occur seasonally. Check which hemisphere is tilted toward the Sun.
      - text: 'Longer days but no change in sunlight angle'
        rationale: |
          This includes daylight change but ignores ray angle. Longer days matter. Check the tilt’s effect on how directly sunlight arrives.
      - text: 'Equal day lengths and angles in both hemispheres everywhere'
        rationale: |
          This treats tilt as giving identical geometry everywhere. Both hemispheres share one Earth. Check their opposite orientations to the Sun.
    explanation: |
      The hemisphere tilted toward the Sun receives longer daylight and more direct sunlight. Both increase solar energy received and support summer conditions.
    approved: false
