meta:
  subject: 'science'
  topic: 'earth-science-astronomy'
  subtopic: 'origin-of-the-universe'
  exams: ["upcat", "dlsucet", "ustet", "dost-sei"]
questions:
  - id: q-earth-science-astronomy-origin-of-the-universe-0001
    type: identify
    difficulty: easy
    stem: |
      About how many years ago does the Big Bang theory say the universe began?
    choices:
      - text: '13.8 billion years ago'
        correct: true
      - text: 'About 4.6 billion years ago'
        rationale: |
          This uses the Solar System's age for the universe. Both are origin dates. Check which system is being dated.
      - text: 'About 100 million years ago'
        rationale: |
          This uses an Earth-history timescale for cosmic history. Millions and billions can be confused. Check the scale of the universe's age.
      - text: 'About 1 billion years ago'
        rationale: |
          This shortens the cosmic age to one billion years. Billion sounds very large. Check the full stated estimate.
    explanation: |
      The universe has expanded and cooled from an early hot, dense state for about $13.8$ billion years. This is the age used in the Big Bang model.
    approved: true

  - id: q-earth-science-astronomy-origin-of-the-universe-0002
    type: identify
    difficulty: medium
    stem: |
      Which physicist first proposed the Big Bang theory, in 1927, using Einstein's equations for gravity?
    choices:
      - text: 'Georges Lemaître'
        correct: true
      - text: 'Edwin Hubble'
        rationale: |
          This credits observational work with the earlier theoretical proposal. Hubble is closely linked with cosmic expansion. Check the dated contribution being asked about.
      - text: 'Arno Penzias'
        rationale: |
          This assigns early expansion theory to a later radiation discoverer. Penzias supplied important supporting evidence. Check theory versus later observation.
      - text: 'Robert Wilson'
        rationale: |
          This assigns early expansion theory to a later radiation discoverer. Wilson helped detect background radiation. Check the type and date of the contribution.
    explanation: |
      Georges Lemaître published an expanding-universe model in $1927$ using Einstein's equations. This was an important step toward Big Bang cosmology. His primeval-atom proposal followed in $1931$.
    approved: true

  - id: q-earth-science-astronomy-origin-of-the-universe-0003
    type: identify
    difficulty: medium
    stem: |
      In 1929, which astronomer found that almost every distant galaxy is moving away from Earth, faster the farther away it is?
    choices:
      - text: 'Edwin Hubble'
        correct: true
      - text: 'Georges Lemaître'
        rationale: |
          This chooses the earlier expanding-universe theorist for Hubble's dated study. Both names concern expansion. Check the year and the observational contribution.
      - text: 'Arno Penzias'
        rationale: |
          This chooses a background-radiation discoverer. That discovery also supports cosmology. Check galaxy distances versus microwave radiation.
      - text: 'Robert Wilson'
        rationale: |
          This chooses a background-radiation discoverer. That work also studied the universe. Check the specific observation and date.
    explanation: |
      Edwin Hubble's $1929$ study linked galaxy distance with recession speed. More distant galaxies generally receded faster in that relation. This supported cosmic expansion.
    approved: true

  - id: q-earth-science-astronomy-origin-of-the-universe-0004
    type: cause-effect
    difficulty: medium
    stem: |
      Distant galaxies generally show greater cosmological redshift at greater distances. How does this support an earlier denser universe?
    choices:
      - text: 'Expansion implies smaller past distances.'
        correct: true
      - text: 'It places Earth at the center of all galaxies.'
        rationale: |
          This treats an observer's position as a unique center. Galaxies appear to recede from us. Check that expansion can be seen from other galaxies too.
      - text: 'It shows space has had the same size throughout time.'
        rationale: |
          This ignores the inferred change in distance. A static model may seem simpler. Check what expansion means for past separations.
      - text: 'It means all distant galaxies are approaching Earth.'
        rationale: |
          This reverses cosmological redshift's meaning in this setting. Motion changes light wavelengths. Check whether the wavelengths are stretched.
    explanation: |
      The distance-redshift pattern supports expanding space. Tracing that expansion backward gives smaller separations and greater density in the past. This fits an early hot, dense universe.
    approved: true

  - id: q-earth-science-astronomy-origin-of-the-universe-0005
    type: identify
    difficulty: medium
    stem: |
      What is the faint microwave radiation observed across the sky and interpreted as a relic of the hot early universe called?
    choices:
      - text: 'Cosmic microwave background'
        correct: true
      - text: 'Radiation from the first generation of stars'
        rationale: |
          This assigns the radiation to stars that formed later. Stars do emit light. Check whether the radiation was released before stars existed.
      - text: 'Visible sunlight reflected by distant galaxies'
        rationale: |
          This uses nearby sunlight to explain a whole-sky relic signal. Reflected light is common in astronomy. Check the early-universe origin and microwave spectrum.
      - text: 'Thermal radiation from the present-day Solar System'
        rationale: |
          This uses a local modern source for a cosmic early signal. Warm objects emit radiation. Check whether the source fits the all-sky relic evidence.
    explanation: |
      The cosmic microwave background is relic radiation from the young universe. It was released when neutral atoms formed and light could travel freely. Expansion has stretched it into microwaves.
    approved: true

  - id: q-earth-science-astronomy-origin-of-the-universe-0006
    type: classify
    difficulty: hard
    stem: |
      A student claims the cosmic microwave background is "the light from the first stars." Is this correct?
    choices:
      - text: 'It was released before the first stars formed.'
        correct: true
      - text: 'It is the combined visible light of the first stars.'
        rationale: |
          This confuses early cosmic radiation with stellar light. Stars are familiar light sources. Check the timeline.
      - text: 'It was emitted when the Solar System formed.'
        rationale: |
          This uses a much later local origin event. The Solar System also formed from gas. Check the difference between cosmic and solar ages.
      - text: 'It is light produced only by present-day galaxies.'
        rationale: |
          This assigns a relic signal to current galaxies. Galaxies emit radiation. Check whether a modern source fits the early-universe signal.
    explanation: |
      The CMB was released about $380,000$ years after the Big Bang, when neutral atoms formed. This happened before the first stars. The radiation records that early stage.
    approved: true

  - id: q-earth-science-astronomy-origin-of-the-universe-0007
    type: classify
    difficulty: hard
    stem: |
      A choice credits Edwin Hubble with "inventing" the Big Bang theory in 1929. Is this accurate?
    choices:
      - text: 'No: Georges Lemaître first proposed the Big Bang theory in 1927; Hubble''s 1929 observation of galaxies moving apart provided strong supporting evidence for a theory that already existed.'
        correct: true
      - text: 'Yes: Hubble was the first person to propose the Big Bang theory.'
        rationale: |
          This attributes the theoretical proposal to the observer. Hubble's name is prominent in cosmology. Check his role in measuring recession.
      - text: 'No: but only because no one proposed the Big Bang theory before 1965.'
        rationale: |
          This dates theory from later background-radiation evidence. The 1965 discovery was influential. Check whether expansion models already existed.
      - text: 'Yes: Lemaître and Hubble proposed the theory together in the same year.'
        rationale: |
          This combines separate contributions into one joint event. The two scientists studied related ideas. Check their publication dates and roles.
    explanation: |
      Lemaître developed an expanding-universe model in $1927$. Hubble's $1929$ observations supported expansion. Lemaître's primeval-atom idea was proposed later, in $1931$.
    approved: true

  - id: q-earth-science-astronomy-origin-of-the-universe-0008
    type: classify
    difficulty: hard
    stem: |
      A student pictures the Big Bang as an explosion that happened at one specific location in space, with matter flying outward into empty space that already existed around it. Is this an accurate picture of the Big Bang?
    choices:
      - text: 'Space itself expands without a known spatial center.'
        correct: true
      - text: 'Matter explodes from one point into existing empty space.'
        rationale: |
          This applies the geometry of a local explosion to the universe. The name Big Bang suggests a blast. Check whether space itself expands.
      - text: 'Galaxies expand only outward from Earth''s location.'
        rationale: |
          This treats Earth's observing position as the center. Distant galaxies generally recede from us. Check whether other observers can see expansion too.
      - text: 'Space stays fixed while matter fills one empty corner.'
        rationale: |
          This treats space as a fixed container. A filling-container picture is easy to imagine. Check the model's changing distances in space.
    explanation: |
      The Big Bang model describes space expanding from an earlier hot, dense state. It has no known central point in ordinary space.
    approved: true

  - id: q-earth-science-astronomy-origin-of-the-universe-0009
    type: identify
    difficulty: medium
    stem: |
      What is the name for the hypothesis explaining that the Sun and planets formed from one giant, slowly spinning cloud of gas and dust?
    choices:
      - text: 'The nebular hypothesis'
        correct: true
      - text: 'The Big Bang theory'
        rationale: |
          This uses the universe's early evolution for a later local collapse. Both are origin models. Check the system and scale.
      - text: 'The cosmic microwave background'
        rationale: |
          This chooses observed radiation instead of a formation model. CMB concerns early history. Check observation versus process.
      - text: 'Hubble''s law'
        rationale: |
          This uses galaxy recession for planet formation. Both describe space. Check collapse and accretion in a local disk.
    explanation: |
      The nebular model describes Solar System formation from a collapsing gas-and-dust cloud. The cloud formed a disk with the young Sun at its center.
    approved: true

  - id: q-earth-science-astronomy-origin-of-the-universe-0010
    type: process-ordering
    difficulty: medium
    stem: |
      Which sequence fits the nebular model of Solar System formation?
    choices:
      - text: 'Cloud collapse, rotating disk, planetesimals, planets'
        correct: true
      - text: 'Planets, cloud collapse, rotating disk, planetesimals'
        rationale: |
          This forms planets before their source cloud collapses. The final bodies are familiar. Check what material supplies them.
      - text: 'Rotating disk, planets, cloud collapse, planetesimals'
        rationale: |
          This makes planets before the source collapse and small-body stage. Disk and planets are linked. Check the growth sequence.
      - text: 'Planetesimals, planets, cloud collapse, rotating disk'
        rationale: |
          This puts small and large bodies before their source disk. Accretion does link them. Check when the disk forms.
    explanation: |
      Gravity first collapses part of a cloud. The material forms a rotating disk. Solid particles gather into planetesimals, which can grow into planets.
    approved: true

  - id: q-earth-science-astronomy-origin-of-the-universe-0011
    type: cause-effect
    difficulty: medium
    stem: |
      According to the nebular hypothesis, why does the collapsing cloud of gas and dust spin faster and faster as it gets smaller?
    choices:
      - text: 'Angular momentum is conserved.'
        correct: true
      - text: 'Nearby starlight must apply an increasing turning force.'
        rationale: |
          This requires an outside push for faster rotation. External forces can change spin. Check whether contraction alone conserves angular momentum.
      - text: 'Only gas escaping the cloud can increase its rotation.'
        rationale: |
          This requires mass loss to change spin. Removing matter can affect rotation. Check the stated shrinking cloud.
      - text: 'Gravity must remove all rotation as the cloud contracts.'
        rationale: |
          This treats inward gravity as automatically stopping rotation. Gravity causes collapse. Check whether collapse removes angular momentum.
    explanation: |
      A collapsing cloud can keep nearly the same angular momentum while its size decreases. Material moves closer to the rotation axis. The cloud then spins faster.
    approved: true

  - id: q-earth-science-astronomy-origin-of-the-universe-0012
    type: cause-effect
    difficulty: medium
    stem: |
      According to the nebular hypothesis, why do all the planets in the solar system orbit the Sun in nearly the same flat plane and in the same direction?
    choices:
      - text: 'Planets inherited motion from a rotating disk.'
        correct: true
      - text: 'Solar gravity forces every orbit into one plane.'
        rationale: |
          This treats central gravity as choosing one plane by itself. Gravity keeps planets in orbit. Check whether an orbit can have a different tilt.
      - text: 'Each planet''s independent origin accidentally gave the same plane.'
        rationale: |
          This replaces a shared origin with coincidence. Separate planets look like independent bodies. Check their source disk.
      - text: 'The planets'' present rotation axes force a common orbital plane.'
        rationale: |
          This confuses a planet's spin axis with its orbit. Both involve rotation. Check spin about an axis versus travel around the Sun.
    explanation: |
      The planets formed from material in a flattened rotating disk. Their orbits largely kept that disk's plane and direction of motion.
    approved: true

  - id: q-earth-science-astronomy-origin-of-the-universe-0013
    type: classify
    difficulty: hard
    stem: |
      An answer choice describes a giant, slowly spinning cloud of gas and dust collapsing to form a star and planets, but labels this process "the Big Bang." Is this labeling correct?
    choices:
      - text: 'This is nebular collapse, a Solar System process.'
        correct: true
      - text: 'This is cosmic expansion, the early universe process.'
        rationale: |
          This swaps local collapse with large-scale expansion. Both involve cosmic gas. Check the direction of change and the scale.
      - text: 'Any cloud collapse is the beginning of all space.'
        rationale: |
          This makes a local cloud the origin of all space. A new star system is a beginning. Check what system is forming.
      - text: 'Both models require every galaxy to become one star.'
        rationale: |
          This combines unrelated scales. Galaxies contain stars. Check whether the models require a galaxy to collapse into one star.
    explanation: |
      Gravity collapses a local cloud into a star-forming disk. Accretion in that disk forms planets. This is the nebular model's Solar System process.
    approved: true

  - id: q-earth-science-astronomy-origin-of-the-universe-0014
    type: classify
    difficulty: medium
    stem: |
      Which timing comparison is consistent with the Big Bang and nebular models?
    choices:
      - text: 'The Solar System formed later.'
        correct: true
      - text: 'The Solar System and universe began at the same moment.'
        rationale: |
          This combines two distinct origin times. Both models describe early stages. Check their different ages.
      - text: 'The Solar System formed before space began expanding.'
        rationale: |
          This reverses the age relation. The Solar System is very old. Check whether it is older than the universe.
      - text: 'The universe formed when the Sun''s disk made its planets.'
        rationale: |
          This makes a local disk the universe's origin. Planet formation is a major event. Check the scale and timeline.
    explanation: |
      The universe is about $13.8$ billion years old. The Solar System began forming about $4.6$ billion years ago. Solar System formation happened much later.
    approved: true

  - id: q-earth-science-astronomy-origin-of-the-universe-0015
    type: predict-outcome
    difficulty: exam
    stem: |
      Which piece of evidence best supports the idea that the universe is still expanding today: the leftover heat detected in every direction of the sky, or the observation that distant galaxies are moving away faster the farther they are?
    choices:
      - text: 'The distance-recession-speed relation'
        correct: true
      - text: 'Background radiation''s presence without galaxy-motion data'
        rationale: |
          This uses an early thermal relic alone as a current motion measurement. The CMB supports the early hot state. Check which evidence measures galaxy recession.
      - text: 'The direction in which planets revolve around the Sun'
        rationale: |
          This uses local orbital motion for cosmic expansion. Both are motion in space. Check the scale of the observation.
      - text: 'The number of planets orbiting a nearby star'
        rationale: |
          This uses a local object count for changing galaxy distances. Planet counts describe systems. Check whether they measure recession.
    explanation: |
      On large scales, more distant galaxies generally recede faster. This relation supports increasing separation as space expands. It directly addresses ongoing expansion.
    approved: true

  - id: q-earth-science-astronomy-origin-of-the-universe-0016
    type: identify
    difficulty: easy
    stem: |
      Which observation is one of the three main lines of evidence for a hot early universe?
    choices:
      - text: 'Abundances of light elements'
        correct: true
      - text: 'The present number of planetary moons'
        rationale: |
          This uses local system structure for early cosmic chemistry. Moons formed from Solar System material. Check the scale and composition evidence.
      - text: 'The daily rising of stars in the eastern sky'
        rationale: |
          This uses Earth's rotation for the universe's early state. Stars appear to rise daily. Check the cause of that apparent motion.
      - text: 'The length of Earth''s present ocean tides'
        rationale: |
          This uses a local gravitational cycle for early cosmic history. Tides involve astronomical bodies. Check whether the observation tests early light-element production.
    explanation: |
      The hot early universe produced light elements. Observed hydrogen, helium, and some lithium abundances broadly fit the predicted pattern. This supports the Big Bang model.
    approved: false

  - id: q-earth-science-astronomy-origin-of-the-universe-0017
    type: predict-outcome
    difficulty: medium
    stem: |
      In the nebular model, what can happen as solid particles repeatedly collide and stick together in a protoplanetary disk?
    choices:
      - text: 'They grow into planetesimals.'
        correct: true
      - text: 'They produce the cosmic microwave background.'
        rationale: |
          This assigns a cosmic early signal to later dust collisions. Both processes release energy. Check the event's scale and time.
      - text: 'They turn the whole universe into a rotating disk.'
        rationale: |
          This extends a local disk process to all space. The disk is a flattened structure. Check how much material belongs to it.
      - text: 'They make every distant galaxy approach the Sun.'
        rationale: |
          This connects local particle growth to galaxy recession. Gravity does affect bodies. Check whether this disk controls distant galaxies.
    explanation: |
      Collisions can join solid particles into larger clumps. Continued accumulation is called accretion. It can produce planetesimals and larger planetary bodies.
    approved: false

  - id: q-earth-science-astronomy-origin-of-the-universe-0018
    type: compare-contrast
    difficulty: hard
    stem: |
      Which distinction separates cosmic expansion from the first stage of Solar System formation?
    choices:
      - text: 'Space expands; a local cloud collapses.'
        correct: true
      - text: 'Space collapses; a local cloud expands.'
        rationale: |
          This reverses both processes. Expansion and collapse are easy to swap. Check increasing versus decreasing separations.
      - text: 'Both require a blast from the Sun''s present core.'
        rationale: |
          This makes the Sun cause events before its formation. The Sun supplies present energy. Check when the Sun formed.
      - text: 'Both are the outward flow of material from one galactic center.'
        rationale: |
          This assigns one center to both processes. A disk does have a center. Check whether cosmic expansion has a known spatial center.
    explanation: |
      Cosmic expansion increases large-scale separations in space. Nebular formation begins when gravity pulls part of a local cloud inward. These describe different scales and directions of change.
    approved: false

  - id: q-earth-science-astronomy-origin-of-the-universe-0019
    type: process-ordering
    difficulty: hard
    stem: |
      Which sequence correctly places the release of the CMB, the first stars, and Solar System formation in time?
    choices:
      - text: 'CMB release, first stars, Solar System formation'
        correct: true
      - text: 'First stars, Solar System formation, CMB release'
        rationale: |
          This puts the early radiation after stars and planets. Many sky signals come from stars. Check that CMB release preceded stars.
      - text: 'Solar System formation, CMB release, first stars'
        rationale: |
          This puts the Solar System before the early cosmic signal. The Solar System is old. Check the much older cosmic timeline.
      - text: 'CMB release, Solar System formation, first stars'
        rationale: |
          This puts our star system before the first stars. The Sun is a star. Check that earlier stars existed before it.
    explanation: |
      The CMB was released before the first stars formed. The Solar System formed much later from a cloud containing gas and dust. This gives the listed order.
    approved: false

  - id: q-earth-science-astronomy-origin-of-the-universe-0020
    type: classify
    difficulty: exam
    stem: |
      Which claim goes beyond what the Big Bang model alone establishes?
    choices:
      - text: 'It identifies the ultimate cause of the universe''s beginning.'
        correct: true
      - text: 'It describes an earlier hot, dense state and later expansion.'
        rationale: |
          This treats the model's core description as an unsupported extra claim. Early density and expansion are central. Check evolution versus ultimate cause.
      - text: 'It is supported by measurements of relic microwave radiation.'
        rationale: |
          This mistakes an observed supporting signal for a claim beyond the model. The CMB is measured. Check evidence versus an unestablished cause.
      - text: 'It accounts for broad patterns in primordial light-element abundances.'
        rationale: |
          This treats a tested chemical prediction as an ultimate-origin claim. Light-element abundances support early evolution. Check predictions versus what caused the beginning.
    explanation: |
      The Big Bang model describes the early universe's evolution. By itself, it does not establish an ultimate cause or what preceded the earliest times that current physics can describe.
    approved: false
