meta:
  subject: 'science'
  topic: 'earth-science-astronomy'
  subtopic: 'layers-of-the-earth'
  exams: ["upcat", "dlsucet", "ustet", "dost-sei"]
questions:
  - id: q-earth-science-astronomy-layers-of-the-earth-0001
    type: identify
    difficulty: easy
    stem: |
      What is the thin, outermost, solid layer of Earth that we live on called?
    choices:
      - text: 'The crust'
        correct: true
      - text: 'The mantle'
        rationale: |
          This chooses the thick layer beneath the surface. Mantle rock is solid too. Check which layer is outermost.
      - text: 'The outer core'
        rationale: |
          This chooses a deep liquid layer. Its name includes outer. Check whether outer means outside the whole Earth or outside the inner core.
      - text: 'The inner core'
        rationale: |
          This chooses Earth's central layer. It is solid too. Check surface versus center.
    explanation: |
      The crust is Earth's thin outermost compositional layer. It is the solid surface layer on which we live.
    approved: true

  - id: q-earth-science-astronomy-layers-of-the-earth-0002
    type: identify
    difficulty: medium
    stem: |
      What is the approximate global average thickness of continental crust?
    choices:
      - text: 'About 35 km'
        correct: true
      - text: 'About 7 km'
        rationale: |
          This uses typical oceanic thickness. Both are crust. Check which crust type is named.
      - text: 'About 70 km'
        rationale: |
          This uses a thick mountain-belt value as a global average. Continental thickness can reach this value. Check average versus local maximum.
      - text: 'About 2,900 km'
        rationale: |
          This uses the depth of the mantle's base as crust thickness. Both describe Earth's layers. Check crust versus mantle.
    explanation: |
      Continental crust averages about $35$ km thick globally. Its thickness varies, and some mountain regions have much thicker crust.
    approved: true

  - id: q-earth-science-astronomy-layers-of-the-earth-0003
    type: classify
    difficulty: medium
    stem: |
      A research team wants to drill through Earth's crust to study the mantle below, and chooses to drill from the ocean floor rather than from land. Why does this make their task easier?
    choices:
      - text: 'Oceanic crust is typically thinner.'
        correct: true
      - text: 'Oceanic crust contains no solid rock.'
        rationale: |
          This treats an ocean floor as liquid instead of rock. Water covers the floor. Check the solid crust beneath the water.
      - text: 'Oceanic crust is hotter than the mantle beneath it.'
        rationale: |
          This confuses depth with the temperature trend. The ocean floor lies below sea level. Check that deeper mantle is generally hotter.
      - text: 'Oceanic crust has no mantle beneath it.'
        rationale: |
          This removes the mantle under ocean basins. Oceans look different from continents. Check that both crust types overlie mantle.
    explanation: |
      Typical oceanic crust is about $6$-$7$ km thick. Continental crust averages about $35$ km. A thinner crust means less crustal rock to drill through.
    approved: true

  - id: q-earth-science-astronomy-layers-of-the-earth-0004
    type: identify
    difficulty: medium
    stem: |
      Which mostly solid, magnesium- and iron-rich silicate layer extends from the base of the crust to about $2,900$ km depth?
    choices:
      - text: 'The mantle'
        correct: true
      - text: 'The crust'
        rationale: |
          This chooses the thin surface layer. Crust also contains silicates. Check the stated depth range.
      - text: 'The outer core'
        rationale: |
          This chooses liquid metal instead of silicate rock. Both regions contain iron. Check whether the iron is in rock or metallic liquid.
      - text: 'The inner core'
        rationale: |
          This chooses the solid metallic center. Both layers are solid and iron-bearing. Check composition and location.
    explanation: |
      The mantle is mainly solid silicate rock rich in magnesium and iron. It extends from beneath the crust to about $2,900$ km depth.
    approved: true

  - id: q-earth-science-astronomy-layers-of-the-earth-0005
    type: classify
    difficulty: hard
    stem: |
      A student claims the mantle cannot possibly flow, since it is described as solid rock, and solid things "cannot move." Is this correct?
    choices:
      - text: 'Solid mantle rock can deform slowly.'
        correct: true
      - text: 'Solid mantle rock is rigid at every timescale.'
        rationale: |
          This applies everyday short-term rigidity to geologic time. Solid rocks feel hard. Check the timescale of deformation.
      - text: 'The entire mantle is a global liquid magma ocean.'
        rationale: |
          This equates slow flow with a liquid ocean. Liquids readily flow. Check whether all flow requires melting.
      - text: 'Mantle motion requires the rock to become gas.'
        rationale: |
          This assumes only gases can move freely. Gas flows easily. Check whether solid material can gradually change shape.
    explanation: |
      Mantle rock is mostly solid. Under high temperatures and stresses, it can deform slowly over geologic time. Slow deformation allows flow without complete melting.
    approved: true

  - id: q-earth-science-astronomy-layers-of-the-earth-0006
    type: identify
    difficulty: medium
    stem: |
      Which layer, made mostly of liquid iron and nickel, generates Earth's magnetic field as it flows?
    choices:
      - text: 'The outer core'
        correct: true
      - text: 'The inner core'
        rationale: |
          This assigns the flowing-fluid role to a solid layer. Both core layers are metallic. Check the state of the material.
      - text: 'The mantle'
        rationale: |
          This treats slow rock flow as the metallic-fluid source. Mantle rock can deform. Check composition as well as motion.
      - text: 'The crust'
        rationale: |
          This treats local rock magnetism as the global field source. Some crustal rocks are magnetic. Check the source of the large-scale field.
    explanation: |
      The outer core contains liquid metal rich in iron and nickel. Moving, electrically conducting fluid there helps generate Earth's magnetic field.
    approved: true

  - id: q-earth-science-astronomy-layers-of-the-earth-0007
    type: identify
    difficulty: medium
    stem: |
      Which layer, at the very center of Earth, is made of iron and nickel and stays solid despite being the hottest layer of all?
    choices:
      - text: 'The inner core'
        correct: true
      - text: 'The outer core'
        rationale: |
          This chooses the core layer that surrounds the center. Both are metal-rich. Check liquid versus solid.
      - text: 'The mantle'
        rationale: |
          This chooses solid rock instead of central metal. Both contain iron. Check silicate rock versus metallic core.
      - text: 'The crust'
        rationale: |
          This chooses the outermost solid layer. Both are solid. Check the position at Earth's center.
    explanation: |
      The inner core lies at Earth's center. It is iron-rich and solid. Enormous pressure allows it to remain solid at high temperature.
    approved: true

  - id: q-earth-science-astronomy-layers-of-the-earth-0008
    type: cause-effect
    difficulty: hard
    stem: |
      The inner core has the highest temperature of any layer inside Earth, yet it is solid, while the cooler outer core above it is liquid. What explains this?
    choices:
      - text: 'Pressure raises the melting point.'
        correct: true
      - text: 'The inner core is colder than the outer core.'
        rationale: |
          This changes the stated temperature relation. Cooling often makes solids. Check the role of pressure at the center.
      - text: 'The inner core contains no iron or nickel.'
        rationale: |
          This explains the state by removing the stated metals. Different materials do melt differently. Check the given iron-rich composition.
      - text: 'High temperature prevents any metal from melting.'
        rationale: |
          This reverses heating's effect on melting. The hottest layer is solid here. Check temperature together with pressure.
    explanation: |
      Pressure at Earth's center is enormous. This raises the temperature needed to melt the iron-rich material. The inner core's temperature stays below that melting point, so it remains solid.
    approved: true

  - id: q-earth-science-astronomy-layers-of-the-earth-0009
    type: classify
    difficulty: hard
    stem: |
      In a high-pressure experiment, iron remains solid at a temperature that would melt it at lower pressure. Which Earth layer provides a comparable case?
    choices:
      - text: 'The inner core'
        correct: true
      - text: 'The liquid outer core'
        rationale: |
          This chooses the core region where metal is liquid. Both layers have high pressure. Check which is the solid high-pressure example.
      - text: 'The oceanic crust'
        rationale: |
          This chooses thin surface rock instead of compressed metal. Ocean depth creates pressure. Check the much greater pressure at Earth's center.
      - text: 'The continental crust'
        rationale: |
          This chooses surface rock instead of deep compressed metal. Thick crust bears weight. Check whether the described material and pressure fit the central core.
    explanation: |
      The inner core is iron-rich and under enormous pressure. Its high melting temperature lets it stay solid despite intense heat.
    approved: true

  - id: q-earth-science-astronomy-layers-of-the-earth-0010
    type: process-ordering
    difficulty: medium
    stem: |
      List Earth's four main layers in order, starting from the outermost layer and ending at the very center.
    choices:
      - text: 'Crust, mantle, outer core, inner core'
        correct: true
      - text: 'Crust, outer core, mantle, inner core'
        rationale: |
          This places the core above mantle. Outer sounds near the surface. Check that outer core is still below the mantle.
      - text: 'Mantle, crust, outer core, inner core'
        rationale: |
          This puts mantle above the surface crust. Both are rocky layers. Check the outermost layer first.
      - text: 'Crust, mantle, inner core, outer core'
        rationale: |
          This reverses the two core regions. Their names are similar. Check that the outer core surrounds the inner core.
    explanation: |
      From outside inward, the layers are crust, mantle, outer core, and inner core. The inner core is at the center.
    approved: true

  - id: q-earth-science-astronomy-layers-of-the-earth-0011
    type: classify
    difficulty: medium
    stem: |
      Which comparison describes the lithosphere and asthenosphere?
    choices:
      - text: 'Rigid outer region above a weaker mantle region.'
        correct: true
      - text: 'Liquid outer region above a solid metallic region.'
        rationale: |
          This equates mechanical weakness with liquid and metal. The deeper region flows slowly. Check its solid silicate composition.
      - text: 'Weak outer region above a rigid surface region.'
        rationale: |
          This reverses their mechanical properties and order. Both names describe Earth's outer regions. Check which region is rigid and above the other.
      - text: 'Two liquid regions within the metallic core.'
        rationale: |
          This places mantle-related regions inside the core. Both core layers differ in state. Check where the named regions occur.
    explanation: |
      The lithosphere is the rigid outer region. Beneath it lies the weaker asthenosphere, where mostly solid mantle rock can deform slowly.
    approved: true

  - id: q-earth-science-astronomy-layers-of-the-earth-0012
    type: cause-effect
    difficulty: medium
    stem: |
      Scientists cannot dig down to directly observe Earth's outer core, yet they are confident it is liquid. How do they know this?
    choices:
      - text: 'S-wave absence and P-wave behavior reveal a liquid layer.'
        correct: true
      - text: 'Direct drilling samples show liquid at the center of Earth.'
        rationale: |
          This treats an indirect inference as direct sampling. Drilling does collect crustal samples. Check how little of Earth has been drilled.
      - text: 'S waves travel through the outer core faster than through rock.'
        rationale: |
          This makes S waves pass through a liquid. Wave speed often reveals materials. Check whether that wave type can be transmitted at all.
      - text: 'Surface rock hardness proves that deeper material is liquid.'
        rationale: |
          This extends a surface property to all depths. Hardness describes rock. Check which evidence probes the deep interior.
    explanation: |
      S waves cannot travel through liquid. Direct S waves do not pass through the outer core. Changes in P waves supply further evidence that this layer is liquid.
    approved: true

  - id: q-earth-science-astronomy-layers-of-the-earth-0013
    type: classify
    difficulty: medium
    stem: |
      A certain type of earthquake wave can only travel through solid material and cannot pass through liquid. Based on this, would this wave type be able to pass through the outer core?
    choices:
      - text: 'No, liquid blocks these shear waves.'
        correct: true
      - text: 'Yes, their speed simply rises in liquid.'
        rationale: |
          This treats a transmission limit as a speed change. Waves often change speed between materials. Check whether shear waves travel in liquid.
      - text: 'Yes, because the outer core is solid iron.'
        rationale: |
          This confuses the inner core's state with the outer core's. Both are iron-rich. Check which core layer is liquid.
      - text: 'No, because all earthquake waves stop at every boundary.'
        rationale: |
          This applies S-wave blockage to every wave and boundary. Boundaries do change paths. Check whether P waves can continue through liquid.
    explanation: |
      The outer core is liquid. S waves require a material that can resist shear. They therefore cannot pass through the outer core.
    approved: true

  - id: q-earth-science-astronomy-layers-of-the-earth-0014
    type: identify
    difficulty: medium
    stem: |
      What causes Earth's magnetic field?
    choices:
      - text: 'The flow of liquid, metallic material in the outer core'
        correct: true
      - text: 'The solid rock of the mantle'
        rationale: |
          This gives a rock layer the role of a conducting metal fluid. The mantle moves slowly. Check its silicate composition.
      - text: 'The thin crust at Earth''s surface'
        rationale: |
          This gives surface magnetism the role of generating the global field. Some crustal minerals are magnetic. Check local magnetism versus the large-scale field.
      - text: 'The solid inner core alone, without any flow'
        rationale: |
          This treats unmoving solid metal as the whole source. Iron is associated with magnets. Check the need for moving conducting fluid.
    explanation: |
      Moving, electrically conducting liquid metal in the outer core helps generate Earth's magnetic field. The liquid is rich in iron and nickel.
    approved: true

  - id: q-earth-science-astronomy-layers-of-the-earth-0015
    type: classify
    difficulty: hard
    stem: |
      Crust beneath a major mountain belt is about $70$ km thick. Which interpretation is most consistent with Earth's crust?
    choices:
      - text: 'It is unusually thick continental crust.'
        correct: true
      - text: 'It is the usual thickness of oceanic crust.'
        rationale: |
          This assigns a mountain-belt thickness to oceanic crust. Both are crust. Check the much smaller oceanic average.
      - text: 'All continental crust has this exact thickness.'
        rationale: |
          This treats a local value as universal. Continental crust is generally thick. Check regional variation.
      - text: 'It must be mantle because crust cannot vary.'
        rationale: |
          This denies crustal thickness variation. The number is larger than the average. Check whether averages allow unusually thick regions.
    explanation: |
      Continental crust averages roughly $35$ km thick. Beneath some major mountain belts it can reach about $70$ km. The reported value fits thick continental crust.
    approved: true

  - id: q-earth-science-astronomy-layers-of-the-earth-0016
    type: predict-outcome
    difficulty: exam
    stem: |
      An earthquake occurs, and scientists observe that a certain wave type (one that only travels through solid material) fails to reach detectors on the exact opposite side of Earth, while a different wave type (one that can travel through both solid and liquid) does reach those detectors, though bent from its expected path. What can scientists conclude about Earth's interior from this pattern?
    choices:
      - text: 'A liquid layer blocks S waves and bends P waves.'
        correct: true
      - text: 'The entire interior is solid because P waves arrive.'
        rationale: |
          This treats P-wave passage as proof of solidity. P waves also cross solids. Check whether they can cross liquid too.
      - text: 'The entire interior is liquid because S waves are absent.'
        rationale: |
          This extends one liquid layer to the whole interior. S-wave absence reveals a barrier. Check the solid layers through which waves already traveled.
      - text: 'Both wave types must travel through identical material.'
        rationale: |
          This assumes different wave types have the same transmission limits. Both come from earthquakes. Check shear waves versus pressure waves.
    explanation: |
      S waves do not pass through liquid. P waves can cross liquid but change speed and direction at boundaries. Together, this behavior supports a liquid outer core.
    approved: true

  - id: q-earth-science-astronomy-layers-of-the-earth-0017
    type: classify
    difficulty: easy
    stem: |
      A crustal sample is basaltic, and its crustal region is about $7$ km thick. Which classification fits best?
    choices:
      - text: 'Oceanic crust'
        correct: true
      - text: 'Continental crust'
        rationale: |
          This relies on the general word crust but misses composition and thickness. Continental crust is solid too. Check its greater average thickness.
      - text: 'Upper mantle rock'
        rationale: |
          This chooses the rock layer below the crust. Mantle rock also has iron and magnesium. Check the crustal setting.
      - text: 'Liquid outer core'
        rationale: |
          This mistakes iron in rock for liquid metal. Both can contain iron. Check basalt and the solid surface location.
    explanation: |
      Oceanic crust is largely basaltic and typically about $6$-$7$ km thick. Both clues fit oceanic crust.
    approved: false

  - id: q-earth-science-astronomy-layers-of-the-earth-0018
    type: predict-outcome
    difficulty: medium
    stem: |
      A P wave meets a boundary between solid mantle and liquid outer core. What is possible?
    choices:
      - text: 'It enters the liquid and changes path.'
        correct: true
      - text: 'It must stop because every liquid blocks P waves.'
        rationale: |
          This applies the S-wave limit to P waves. Both are seismic waves. Check which wave type crosses liquid.
      - text: 'It becomes an S wave that crosses the liquid freely.'
        rationale: |
          This gives shear waves a liquid-transmission ability. Waves can change at boundaries. Check whether an S wave can cross liquid.
      - text: 'It must keep the same speed and direction everywhere.'
        rationale: |
          This ignores the effect of material properties. The wave continues traveling. Check whether continuation requires an unchanged path.
    explanation: |
      P waves can travel through solid and liquid. At a boundary their speed can change. This can bend their path.
    approved: false

  - id: q-earth-science-astronomy-layers-of-the-earth-0019
    type: compare-contrast
    difficulty: hard
    stem: |
      Use average crustal thicknesses of $35$ km for continental crust and $7$ km for oceanic crust. How many times as thick is the continental crust in this comparison?
    choices:
      - text: '5 times'
        correct: true
      - text: '28 times'
        rationale: |
          This subtracts the thicknesses instead of finding a ratio. $35-7$ gives a difference of 28 km. Check that times as thick calls for division.
      - text: '42 times'
        rationale: |
          This adds the thicknesses. $35+7$ gives their combined thickness. Check whether a sum answers a ratio question.
      - text: '245 times'
        rationale: |
          This multiplies the thicknesses. $35\times7$ gives 245. Check that the required ratio has no distance unit.
    explanation: |
      To compare thicknesses, divide the larger by the smaller. $35\div7=5$. The continental value is five times the oceanic value.
    approved: false

  - id: q-earth-science-astronomy-layers-of-the-earth-0020
    type: structure-function
    difficulty: exam
    stem: |
      Which evidence best supports a claim about the physical state of Earth's outer core?
    choices:
      - text: 'Measured paths of earthquake waves'
        correct: true
      - text: 'Solid samples recovered by drilling to the outer core'
        rationale: |
          This assumes drilling has reached the core. Drills do recover crustal rock. Check their depth relative to the core.
      - text: 'Visual photographs taken from the inner core'
        rationale: |
          This assumes direct cameras reached the central layers. Photographs can show surface features. Check access to the deep interior.
      - text: 'The thickness of a single surface sediment layer'
        rationale: |
          This extends a shallow layer measurement to deep core state. Layers do provide geological evidence. Check whether the observation probes the core.
    explanation: |
      Seismic waves pass through deep Earth and respond to the material there. Their paths and transmission reveal layer properties. This provides evidence about the outer core's physical state.
    approved: false
