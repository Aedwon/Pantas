meta:
  subject: "science"
  topic: "biology"
  subtopic: "cell-biology"
  exams: ["upcat", "dlsucet", "ustet", "dost-sei"]
questions:
  - id: q-biology-cell-biology-0001
    type: "identify-organelle"
    difficulty: "easy"
    stem: |
      Which structure contains most of a typical eukaryotic cell's DNA and helps regulate its activities?
    choices:
      - text: "Nucleus"
        correct: true
      - text: "Mitochondrion"
        rationale: |
          This confuses supplying ATP with holding most of the cell's instructions. Mitochondria do contain some DNA, so they can seem to fit. Check which structure holds most of the DNA.
      - text: "Ribosome"
        rationale: |
          This confuses reading instructions with storing them. Ribosomes use mRNA to build proteins, so they seem to control the instructions. Check where most DNA is kept.
      - text: "Golgi apparatus"
        rationale: |
          This confuses sorting proteins with regulating their production. The Golgi directs proteins to destinations, so it can seem to direct the cell. Check which structure contains most DNA.
    explanation: |
      The nucleus contains most of a eukaryotic cell's DNA. This DNA carries instructions that help regulate cell activities.
    approved: true

  - id: q-biology-cell-biology-0002
    type: "identify-organelle"
    difficulty: "easy"
    stem: |
      Which organelle carries out major stages of aerobic respiration that produce much of a eukaryotic cell's ATP?
    choices:
      - text: "Mitochondrion"
        correct: true
      - text: "Ribosome"
        rationale: |
          This confuses making proteins with making ATP. Both processes build useful cell products, so they can seem alike. Check whether the product is a protein or a usable energy carrier.
      - text: "Nucleus"
        rationale: |
          This confuses regulating cell activities with supplying their energy. The nucleus provides instructions, so it seems responsible for every task. Check where major stages of aerobic ATP production occur.
      - text: "Central vacuole"
        rationale: |
          This confuses storing food with releasing energy from it. A vacuole can hold nutrients, so it seems a likely energy source. Check whether the organelle stores materials or makes ATP.
    explanation: |
      Mitochondria carry out major stages of aerobic respiration. These stages release energy from food to make ATP, which cells use to do work.
    approved: true

  - id: q-biology-cell-biology-0003
    type: "identify-organelle"
    difficulty: "easy"
    stem: |
      Which structure directly joins amino acids according to the instructions in mRNA?
    choices:
      - text: "Ribosome"
        correct: true
      - text: "Golgi apparatus"
        rationale: |
          This confuses changing and packaging a protein with building it. Both are parts of protein handling, so the Golgi seems to fit. Check which structure directly reads mRNA.
      - text: "Mitochondrion"
        rationale: |
          This confuses an organelle containing protein-making structures with the structure doing the work. Mitochondria contain their own ribosomes, so they can seem to fit. Check which structure directly joins amino acids.
      - text: "Cell membrane"
        rationale: |
          This confuses a protein's destination with its builder. Many proteins become part of the cell membrane, so the membrane seems involved. Check where mRNA is translated.
    explanation: |
      A ribosome reads the instructions in mRNA. It joins amino acids in the order needed to build a protein.
    approved: true

  - id: q-biology-cell-biology-0004
    type: "structure-function"
    difficulty: "easy"
    stem: |
      A cell organelle modifies, sorts, and packages proteins, then ships
      them to where they are needed inside or outside the cell. Which
      organelle is this?
    choices:
      - text: "Golgi apparatus"
        correct: true
      - text: "Rough endoplasmic reticulum"
        rationale: |
          This confuses earlier protein processing with final sorting and packaging. The rough ER also handles proteins, so the jobs overlap in memory. Check which organelle directs proteins to different destinations.
      - text: "Nucleus"
        rationale: |
          This confuses sending instructions with sending proteins. The nucleus controls gene activity, so it can seem to manage delivery too. Check whether the question asks about DNA or protein packages.
      - text: "Mitochondrion"
        rationale: |
          This confuses providing ATP for delivery with sorting the cargo. Protein handling needs energy, so mitochondria seem involved. Check which organelle packages proteins.
    explanation: |
      The Golgi apparatus changes, sorts, and packages proteins. It directs them to the parts of the cell or the outside locations where they are needed.
    approved: true

  - id: q-biology-cell-biology-0005
    type: "structure-function"
    difficulty: "medium"
    stem: |
      Which structure is covered in ribosomes and helps build and process
      proteins?
    choices:
      - text: "Rough endoplasmic reticulum"
        correct: true
      - text: "Smooth endoplasmic reticulum"
        rationale: |
          This confuses the two forms of ER. Both are membrane networks and make cell materials, so their names are easy to swap. Check whether ribosomes are attached.
      - text: "Golgi apparatus"
        rationale: |
          This confuses later protein packaging with protein building at the ER. The Golgi also processes proteins, so it seems similar. Check which structure has ribosomes on its surface.
      - text: "Lysosome"
        rationale: |
          This confuses breaking down proteins with making them. Lysosomes act on proteins during digestion, so they seem related. Check whether the task builds a protein or breaks one down.
    explanation: |
      Ribosomes on the rough ER build proteins. The rough ER helps process many proteins that will be sent to membranes, organelles, or outside the cell.
    approved: true

  - id: q-biology-cell-biology-0006
    type: "structure-function"
    difficulty: "medium"
    stem: |
      Which structure acts as a thin, flexible barrier that controls which
      substances enter and leave the cell?
    choices:
      - text: "Cell membrane"
        correct: true
      - text: "Cellulose cell wall"
        rationale: |
          This confuses external support with selective entry and exit. A cell wall surrounds the cell, so it seems like the main barrier. Check which layer selects substances crossing into the cell.
      - text: "Smooth endoplasmic reticulum"
        rationale: |
          This confuses an internal membrane network with the cell's boundary. The smooth ER is made of membranes, so it seems plausible. Check whether it separates the cell from its surroundings.
      - text: "Central vacuole membrane"
        rationale: |
          This confuses the vacuole's boundary with the whole cell's boundary. Both membranes control movement across themselves. Check whether the boundary surrounds the vacuole or the cell.
    explanation: |
      The cell membrane is selectively permeable. It allows some substances to cross and controls movement between the cell and its surroundings.
    approved: true

  - id: q-biology-cell-biology-0007
    type: "classify"
    difficulty: "medium"
    stem: |
      In a comparison of typical animal and land-plant cells, which structure is associated with the animal-type centrosome?
    choices:
      - text: "Centrioles"
        correct: true
      - text: "Cellulose cell wall"
        rationale: |
          This reverses the plant and animal comparison. A wall helps hold a cell's shape, so it can seem useful in either type. Check whether typical animal cells have a cellulose wall.
      - text: "Chloroplasts"
        rationale: |
          This reverses the photosynthetic plant and animal comparison. Both cell types need food, so both may seem to make it in chloroplasts. Check which cell type carries out photosynthesis.
      - text: "Large central vacuole"
        rationale: |
          This confuses small storage compartments with the large plant vacuole. Animal cells also store materials, so the structure seems possible. Check whether the question names a large central vacuole.
    explanation: |
      A typical animal cell has a centrosome containing centrioles. Most land-plant cells lack this animal-type arrangement.
    approved: true

  - id: q-biology-cell-biology-0008
    type: "classify"
    difficulty: "medium"
    stem: |
      Which organelle commonly carries out intracellular digestion in a typical animal cell?
    choices:
      - text: "Lysosome"
        correct: true
      - text: "Cell wall"
        rationale: |
          This confuses a supporting outer structure with an internal digestive organelle. Both help maintain the cell, so their roles can seem similar. Check whether the structure is inside the cell.
      - text: "Chloroplast"
        rationale: |
          This confuses making food with breaking materials down. Both change substances in a cell, so they seem like related tasks. Check whether the process is photosynthesis or digestion.
      - text: "Central vacuole"
        rationale: |
          This applies the usual plant digestive compartment to an animal cell. A central vacuole can carry out digestion in plants, so its function seems to fit. Check which cell type the question specifies.
    explanation: |
      Lysosomes commonly digest materials inside animal cells. They help break down large molecules and worn cell parts.
    approved: true

  - id: q-biology-cell-biology-0009
    type: "classify"
    difficulty: "medium"
    stem: |
      In a comparison of typical land-plant and animal cells, a cell has a cellulose wall, a large central vacuole, and chloroplasts. Which identification best fits these observations?
    choices:
      - text: "Plant cell"
        correct: true
      - text: "Animal cell"
        rationale: |
          This treats the visible covering as an animal cell membrane. Both cells have a boundary, so the wall can be misidentified. Check the wall together with the large vacuole and chloroplasts.
      - text: "It cannot be either type of cell"
        rationale: |
          This rejects a familiar cell type because several features appear together. A cell can contain all three structures, so the extra clues do not create a conflict. Check each feature against a typical plant cell.
      - text: "Both are equally likely"
        rationale: |
          This assumes shared cell features make both types equally likely. Both types have membranes and cytoplasm, so they seem similar. Check the wall, large central vacuole, and chloroplasts as a group.
    explanation: |
      These structures match a cell wall, a central vacuole, and chloroplasts. Together they fit a typical photosynthetic land-plant cell in this comparison.
    approved: true

  - id: q-biology-cell-biology-0010
    type: "compare-contrast"
    difficulty: "medium"
    stem: |
      Which statement correctly tells apart diffusion and osmosis?
    choices:
      - text: "Osmosis moves water; diffusion can move other particles too."
        correct: true
      - text: "Diffusion moves only water; osmosis can move other particles."
        rationale: |
          This reverses the broad process and its water-specific form. Both names describe passive movement, so they are easy to swap. Check which term specifically names water crossing a membrane.
      - text: "Osmosis uses cellular energy; diffusion is a passive process."
        rationale: |
          This treats water movement as energy-powered pumping. Cells regulate water balance, so every water movement may seem to cost energy. Check whether the movement itself uses cellular energy.
      - text: "Osmosis moves solute across membranes; diffusion moves water."
        rationale: |
          This makes osmosis a solute-transfer process. Solute differences drive water movement, so the solute may seem to be what crosses. Check which substance actually moves during osmosis.
    explanation: |
      Diffusion is the net movement of particles down their concentration gradient. Osmosis is the net movement of water across a selectively permeable membrane. Osmosis is a kind of diffusion.
    approved: true

  - id: q-biology-cell-biology-0011
    type: "compare-contrast"
    difficulty: "hard"
    stem: |
      For an uncharged solute, which comparison of net movement by diffusion and active transport is correct?
    choices:
      - text: "Diffusion goes down the gradient; active transport goes against it."
        correct: true
      - text: "Diffusion goes against the gradient; active transport goes down it."
        rationale: |
          This reverses the two directions. Both processes can move a solute across a membrane, so direction can be overlooked. Check whether net movement is down or against the concentration gradient.
      - text: "Diffusion and active transport both move against the same gradient."
        rationale: |
          This assigns the active-transport direction to diffusion too. The solute can move randomly in either direction, which may seem to allow net uphill diffusion. Check net movement, not one particle's motion.
      - text: "Diffusion and active transport both move down the same gradient."
        rationale: |
          This assigns the diffusion direction to both processes. Movement down a gradient is familiar, so it seems universal. Check which process uses energy to move against the gradient.
    explanation: |
      For an uncharged solute, diffusion has net movement from higher to lower concentration. Active transport moves the solute against its concentration gradient using energy.
    approved: true

  - id: q-biology-cell-biology-0012
    type: "cause-effect"
    difficulty: "medium"
    stem: |
      A red blood cell is placed in a solution with a lower concentration of nonpenetrating solutes than its cytoplasm. The membrane allows water to cross. What is expected initially?
    choices:
      - text: "It gains water and swells."
        correct: true
      - text: "It loses water and shrinks."
        rationale: |
          This reverses the water flow for a dilute external solution. The low outside solute level can be mistaken for a pull on water. Check which side has more nonpenetrating solute.
      - text: "Water enters and leaves at equal rates, keeping its volume fixed."
        rationale: |
          This treats a concentration difference as a balance. Water does move both ways, so those movements may seem to cancel. Check whether their net rates are equal under these conditions.
      - text: "It gains water but stays firm behind a rigid cell wall."
        rationale: |
          This gives an animal cell a plant cell wall. A wall would limit swelling, so the protective result seems reasonable. Check whether a red blood cell has that structure.
    explanation: |
      The outside solution has less nonpenetrating solute than the cell. Water enters by osmosis, increasing the cell's volume. A red blood cell can burst if enough water enters.
    approved: true

  - id: q-biology-cell-biology-0013
    type: "cause-effect"
    difficulty: "hard"
    stem: |
      A red blood cell placed in a salt solution shrinks. Which interpretation best explains this observation?
    choices:
      - text: "The outside is hypertonic; water leaves the cell."
        correct: true
      - text: "The outside is hypotonic; water leaves the cell."
        rationale: |
          This swaps hypertonic and hypotonic. Shrinking shows water loss, so the right effect is paired with the wrong label. Check which term means the outside has more nonpenetrating solute.
      - text: "The outside is isotonic; equal water flow shrinks the cell."
        rationale: |
          This assumes the mere presence of salt makes a solution isotonic. Cells also contain solutes, so a salty solution can seem balanced. Check the observed volume change before assigning tonicity.
      - text: "The outside is hypertonic; water entering shrinks the cell."
        rationale: |
          This reverses the direction needed to explain shrinking. Hypertonic is the correct label, so the rest may seem correct too. Check whether gaining water would increase or decrease volume.
    explanation: |
      Shrinking means the cell has lost water overall. An external solution that causes this loss is hypertonic to the cell. It has a higher effective concentration of nonpenetrating solutes.
    approved: true

  - id: q-biology-cell-biology-0014
    type: "cause-effect"
    difficulty: "medium"
    stem: |
      A red blood cell is in an isotonic solution, and its membrane permits water movement. Which statement correctly describes osmosis at equilibrium?
    choices:
      - text: "Water enters and leaves at equal rates."
        correct: true
      - text: "Water stops crossing the membrane in either direction."
        rationale: |
          This mistakes unchanged volume for no molecular movement. The cell looks the same size, so water can seem still. Check whether balanced movement can occur without a net change.
      - text: "Water moves only into the cell, causing it to swell."
        rationale: |
          This treats equal solute concentration as a one-way inward signal. Water normally enters some cells, so that direction seems familiar. Check whether the outside is actually hypotonic.
      - text: "Water moves only out of the cell, causing it to shrink."
        rationale: |
          This treats equal solute concentration as a one-way outward signal. Salt solutions can make cells shrink, so outward flow seems likely. Check whether the outside is actually hypertonic.
    explanation: |
      An isotonic solution causes no net change in cell volume. Water still crosses the membrane in both directions. The amounts entering and leaving balance.
    approved: true

  - id: q-biology-cell-biology-0015
    type: "process-ordering"
    difficulty: "hard"
    stem: |
      For a protein destined for secretion, put the listed steps in order.
      1. Golgi apparatus packages the protein for delivery
      2. Ribosome builds the protein
      3. Rough endoplasmic reticulum processes the protein
    choices:
      - text: "2, 3, 1"
        correct: true
      - text: "1, 2, 3"
        rationale: |
          This puts packaging before protein building. Packaging sounds like preparation, so it may seem to come first. Check whether a protein exists yet to be packaged.
      - text: "3, 2, 1"
        rationale: |
          This puts processing before the protein is built. The ribosome is attached to the ER, so their tasks can be confused. Check which listed step makes the protein chain.
      - text: "2, 1, 3"
        rationale: |
          This sends the protein to the Golgi before ER processing. Both organelles process proteins, so their order may seem flexible. Check the route of a secreted protein through the cell.
    explanation: |
      The ribosome builds the protein. The rough ER helps process it. The Golgi apparatus then sorts and packages it for delivery. The order of the listed steps is 2, 3, 1.
    approved: true

  - id: q-biology-cell-biology-0016
    type: "predict-outcome"
    difficulty: "exam"
    stem: |
      An ATP-powered pump moves an uncharged nutrient into a cell against its concentration gradient. The membrane also allows passive diffusion of that nutrient. ATP is depleted while the concentration gradient remains. What is expected immediately?
    choices:
      - text: "The pump stops; passive outward movement can continue."
        correct: true
      - text: "The pump keeps moving nutrient inward at the same rate."
        rationale: |
          This assumes the pump can work without its energy source. The concentration difference is already present, so continued pumping may seem possible. Check whether the stated pump requires ATP directly.
      - text: "The pump speeds up inward transport as ATP becomes depleted."
        rationale: |
          This mistakes removal of ATP as a signal to increase transport. A cell short of energy may need more nutrient, so faster uptake seems useful. Check whether the pump still has the energy it needs.
      - text: "The pump stops and all passive nutrient movement stops too."
        rationale: |
          This treats passive movement as ATP-powered too. The pump has stopped, so all transport may seem stopped. Check whether the membrane also permits movement down the gradient.
    explanation: |
      The pump uses ATP directly to move the nutrient against its concentration gradient. Without ATP, the pump stops. Because the membrane also permits passive nutrient movement, nutrient can move outward down its gradient.
    approved: true

  - id: q-biology-cell-biology-0017
    type: "structure-function"
    difficulty: "easy"
    stem: |
      A liver cell produces lipids and processes some harmful substances. Which organelle is most directly associated with these functions?
    choices:
      - text: "Smooth ER"
        correct: true
      - text: "Rough endoplasmic reticulum"
        rationale: |
          This swaps the two forms of ER. Both are membrane networks involved in making cell products. Check whether the job mainly concerns lipids or ribosome-made proteins.
      - text: "Golgi apparatus"
        rationale: |
          This confuses processing harmful substances with sorting products for delivery. The Golgi also modifies cell materials, so it seems relevant. Check which organelle has the lipid-making and detoxification roles.
      - text: "Large central vacuole"
        rationale: |
          This confuses storage or digestion with detoxification in a liver cell. Vacuoles can hold unwanted materials, so they seem useful here. Check the cell type and the named functions.
    explanation: |
      Smooth ER has roles in making lipids and detoxification. Detoxification is the processing of harmful substances so they can be removed or made less harmful.
    approved: false

  - id: q-biology-cell-biology-0018
    type: "compare-contrast"
    difficulty: "medium"
    stem: |
      A typical animal cell and a typical land-plant cell are placed in strongly hypotonic solutions. Which feature most directly helps the plant cell resist bursting as water enters?
    choices:
      - text: "Cell wall"
        correct: true
      - text: "Chloroplast"
        rationale: |
          This confuses making food with resisting physical expansion. Chloroplasts are a familiar plant-cell feature, so they seem to explain any plant advantage. Check which structure provides rigid support.
      - text: "Golgi apparatus"
        rationale: |
          This confuses handling membrane materials with holding the cell's shape. The Golgi helps deliver cell products, so it may seem able to prevent bursting. Check which structure physically resists expansion.
      - text: "Smooth endoplasmic reticulum"
        rationale: |
          This confuses making lipids with providing a rigid outer layer. Lipids form membranes, so more lipid seems protective. Check whether a flexible membrane supplies the support of a wall.
    explanation: |
      As water enters, the plant cell contents press against the cell wall. The wall resists further expansion. This creates turgor pressure and helps the cell stay firm.
    approved: false

  - id: q-biology-cell-biology-0019
    type: "predict-outcome"
    difficulty: "hard"
    stem: |
      A plant cell membrane permits water to cross but not the dissolved sugar used in an experiment. The external sugar concentration is increased above the concentration inside the cell. What is the expected initial change?
    choices:
      - text: "Water leaves; turgor decreases."
        correct: true
      - text: "Water enters; turgor increases."
        rationale: |
          This reverses the water flow toward more nonpenetrating solute. More sugar can seem like more food that helps the cell fill. Check the direction of osmosis before predicting pressure.
      - text: "Sugar enters; the central vacuole expands."
        rationale: |
          This assumes the sugar crosses the membrane. Dissolved sugar can seem free to spread like water. Check the stated permeability of the membrane.
      - text: "Water movement stops; turgor remains unchanged."
        rationale: |
          This treats a cell wall as a barrier to all water movement. The wall keeps the cell's shape, so its internal pressure may seem fixed. Check whether water can still cross the membrane.
    explanation: |
      The outside now has more nonpenetrating solute. Water moves out of the cell by osmosis. The contents press less firmly against the wall, so turgor pressure decreases.
    approved: false

  - id: q-biology-cell-biology-0020
    type: "classify"
    difficulty: "exam"
    stem: |
      A transporter uses an existing ion gradient to move a nutrient against its own concentration gradient. The transporter does not split ATP directly. Which classification is correct?
    choices:
      - text: "Secondary active transport"
        correct: true
      - text: "Passive diffusion of the nutrient"
        rationale: |
          This assumes a transporter must split ATP to do active transport. There is no direct ATP use here, so passive movement seems likely. Check whether the nutrient moves against its own gradient.
      - text: "Osmosis through the transporter"
        rationale: |
          This treats any membrane movement as osmosis. A transporter crosses a membrane, so the term may seem broad enough. Check whether the moving substance is water.
      - text: "Primary active transport using ATP directly"
        rationale: |
          This confuses the source of a gradient with the energy used by this transporter. ATP may have helped build the ion gradient earlier. Check whether this transporter uses ATP directly or uses the stored gradient.
    explanation: |
      The nutrient moves against its own gradient, so its transport needs energy. The transporter takes that energy from an ion gradient. This is secondary active transport.
    approved: false
