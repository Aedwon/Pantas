meta:
  subject: science
  topic: biology
  subtopic: evolution
  exams: [ upcat, dlsucet, ustet, dost-sei ]
questions:
  - id: q-biology-evolution-0001
    type: identify
    difficulty: easy
    stem: |
      In 1859, which scientist proposed natural selection as the main driving mechanism of evolution?
    choices:
      - text: Charles Darwin
        correct: true
      - text: Gregor Mendel
        rationale: |
          You picked the one who worked out how traits pass from parent to child,
          not how species change over time.
      - text: Carl Linnaeus
        rationale: |
          You picked the one who built the naming system for organisms.
      - text: Louis Pasteur
        rationale: |
          You picked the one who showed that germs cause disease.
    explanation: |
      Charles Darwin proposed natural selection in 1859, describing evolution as "descent with modification."
    approved: true

  - id: q-biology-evolution-0002
    type: identify
    difficulty: easy
    stem: |
      Darwin summarized evolution with the phrase "descent with modification." What does this phrase mean?
    choices:
      - text: Species descend from shared ancestors, but change over time.
        correct: true
      - text: Species descend from more advanced ancestors and become simpler over time.
        rationale: |
          You added a direction. Descent with modification says species change, not
          that they climb towards better.
      - text: Species never change once they first appear.
        rationale: |
          You said species never change, and the phrase is about change.
      - text: Species always modify themselves intentionally to survive.
        rationale: |
          You made the change deliberate. Nothing chooses its own traits.
    explanation: |
      "Descent with modification" captures both halves of evolution: organisms are descended from common ancestors (descent), yet gradually change across generations (modification).
    approved: true

  - id: q-biology-evolution-0003
    type: process-ordering
    difficulty: medium
    stem: |
      Put the four steps of the natural selection chain of reasoning in the correct order: Advantage, Inheritance, Variation, Limited resources.
    choices:
      - text: Variation, Limited resources, Advantage, Inheritance
        correct: true
      - text: Limited resources, Variation, Advantage, Inheritance
        rationale: |
          You put scarcity first. The differences have to exist before scarcity can
          favour any of them.
      - text: Variation, Advantage, Limited resources, Inheritance
        rationale: |
          You put the advantage before the scarcity that creates it. A trait only
          helps when something is in short supply.
      - text: Inheritance, Variation, Advantage, Limited resources
        rationale: |
          You put inheritance first. A trait is inherited after it has been
          favoured, not before.
    explanation: |
      The chain runs: Variation (individuals naturally differ) → Limited resources (not everyone survives) → Advantage (better-suited individuals survive and reproduce more) → Inheritance (the advantageous trait is passed on).
    approved: true

  - id: q-biology-evolution-0004
    type: cause-effect
    difficulty: medium
    stem: |
      A population of insects contains some individuals naturally resistant to a pesticide. After years of pesticide use, most insects in the population are now resistant. What best explains this outcome?
    choices:
      - text: The resistant insects survived and reproduced far more successfully than non-resistant ones, passing the heritable resistance trait to more offspring each generation.
        correct: true
      - text: The pesticide directly changed the insects' genes to make them resistant.
        rationale: |
          You made the pesticide change the insects. It kills the ones without the
          trait; it does not write the trait.
      - text: Non-resistant insects individually developed resistance during their lifetimes after repeated exposure.
        rationale: |
          You had individuals develop resistance in their own lifetime. An insect
          cannot become resistant by being sprayed.
      - text: Resistance is not heritable, so its increase across generations is due to random chance alone.
        rationale: |
          You said the trait is not passed on. It has to be, or the population could
          not shift.
    explanation: |
      Resistance already existed as natural variation before the pesticide was used. The pesticide killed off non-resistant insects, so resistant ones survived, reproduced, and passed the heritable trait on: making resistance more common each generation.
    approved: true

  - id: q-biology-evolution-0005
    type: identify
    difficulty: medium
    stem: |
      What term describes the formation of a brand-new species, commonly triggered by geographic separation?
    choices:
      - text: Speciation
        correct: true
      - text: Natural selection
        rationale: |
          You picked the process that shifts traits within a species. A new species
          is the outcome, not the mechanism.
      - text: Inheritance
        rationale: |
          You picked the passing of traits to offspring.
      - text: Variation
        rationale: |
          You picked the differences between individuals, which is where selection
          starts rather than where it ends.
    explanation: |
      Speciation is the formation of a new species, often beginning when a population becomes geographically separated into two non-interbreeding groups.
    approved: true

  - id: q-biology-evolution-0006
    type: cause-effect
    difficulty: medium
    stem: |
      Why does geographic separation (such as an ocean or mountain range dividing a population) often lead to speciation over time?
    choices:
      - text: Each separated group faces different environmental pressures and accumulates different adaptations through natural selection, until they become too genetically different to interbreed.
        correct: true
      - text: Geographic separation directly and instantly creates a new species with no other steps required.
        rationale: |
          You made separation itself the cause. Separation only allows the two
          groups to drift apart under different pressures.
      - text: Separated groups always evolve in exactly the same way, so they never become distinct species.
        rationale: |
          You had them evolve identically. Different places apply different
          pressures.
      - text: Geographic separation prevents natural selection from acting on either group.
        rationale: |
          You said separation stops selection. Each side still faces its own.
    explanation: |
      Once isolated, each group experiences different environmental pressures, so natural selection favors different traits in each. Given enough generations, the accumulated genetic differences become too great for successful interbreeding, resulting in two separate species.
    approved: true

  - id: q-biology-evolution-0007
    type: classify
    difficulty: medium
    stem: |
      Darwin's finches, which spread across different Galápagos islands and evolved distinctly different beak shapes suited to each island's food source, are a classic example of what process?
    choices:
      - text: Speciation through geographic separation
        correct: true
      - text: Inheritance of acquired traits within a single lifetime
        rationale: |
          You picked traits gained in one lifetime. A beak shape is inherited, not
          acquired by trying.
      - text: Natural selection with no variation involved
        rationale: |
          You said there was no variation. The beaks differed to begin with, which
          is what selection worked on.
      - text: A population with no environmental pressures
        rationale: |
          You said there were no pressures. Different food on each island is the
          pressure.
    explanation: |
      The finches became geographically separated across islands, faced different food-source pressures, and evolved different beak shapes until they became distinct species: a textbook case of speciation through geographic separation.
    approved: true

  - id: q-biology-evolution-0008
    type: classify
    difficulty: hard
    stem: |
      A student claims, "A giraffe stretched its neck to reach high leaves during its life, so its offspring were born with longer necks." What is wrong with this reasoning?
    choices:
      - text: Natural selection does not change an individual's traits during its own lifetime; a stretched neck is not a heritable change and cannot be passed to offspring.
        correct: true
      - text: 'Nothing is wrong: traits gained through use during an individual''s life are always passed to its offspring.'
        rationale: |
          You accepted the stretching. A neck stretched in one lifetime is not
          written back into the offspring.
      - text: The reasoning is wrong only because giraffes cannot stretch their necks at all.
        rationale: |
          You made it about reaching. The reach is not the error; passing on a
          stretch is.
      - text: The reasoning is wrong only because giraffes do not have offspring.
        rationale: |
          You made it about diet. What giraffes eat is not the flaw in the
          reasoning.
    explanation: |
      This is the "use it or lose it" misconception. What actually happens: some giraffes were naturally born with slightly longer necks (variation), which gave them an advantage in a food-scarce environment, and this heritable trait spread through survival and reproduction, not through stretching during an individual's lifetime.
    approved: true

  - id: q-biology-evolution-0009
    type: classify
    difficulty: hard
    stem: |
      A student assumes "survival of the fittest" means the strongest or biggest individuals always survive. Is this correct?
    choices:
      - text: 'No: "fittest" means best suited to the environment, which is not necessarily the strongest or biggest; even a small, camouflaged individual can be more fit if it survives and reproduces better.'
        correct: true
      - text: 'Yes: fitness always refers to raw physical strength or size.'
        rationale: |
          You read fitness as strength. It means suited to the surroundings, and
          sometimes that means small or well hidden.
      - text: 'No: fitness actually refers only to intelligence, never physical traits.'
        rationale: |
          You read fitness as intelligence. It is about fit to the environment,
          whatever that takes.
      - text: 'Yes: the largest individual in a population is always the fittest.'
        rationale: |
          You read fitness as size. The largest animal often needs the most food,
          which can be a disadvantage.
    explanation: |
      "Fittest" means best suited to reproductive success in a specific environment. A tiny, camouflaged insect may be more fit than a larger, more visible one if camouflage helps it survive and reproduce better.
    approved: true

  - id: q-biology-evolution-0010
    type: classify
    difficulty: hard
    stem: |
      An answer choice describes evolution as organisms "trying to evolve" toward a more advanced or ideal form. Is this an accurate description of natural selection?
    choices:
      - text: 'No: evolution has no goal or direction; it simply favors whatever traits happen to suit the current environment, with no foresight involved.'
        correct: true
      - text: 'Yes: evolution always moves species toward a more advanced, ideal form.'
        rationale: |
          You gave evolution a destination. It has none; it only tracks whatever
          survives now.
      - text: 'No: but only because evolution never changes populations at all.'
        rationale: |
          You said populations never change, and they do.
      - text: 'Yes: organisms actively choose which traits to evolve toward.'
        rationale: |
          You let organisms choose their traits. Nothing chooses.
    explanation: |
      Natural selection has no foresight or goal. It simply reflects which existing traits happened to help individuals survive and reproduce in their specific environment at the time: there is no "better" or "more advanced" direction it aims toward.
    approved: true

  - id: q-biology-evolution-0011
    type: classify
    difficulty: hard
    stem: |
      A student claims that pesticide exposure caused resistance to first appear in the insect population, as a direct response to the pesticide. Is this consistent with how natural selection works?
    choices:
      - text: 'No: the resistant trait already existed as natural variation before the pesticide was used; the pesticide only determined which existing insects survived and reproduced.'
        correct: true
      - text: 'Yes: the pesticide directly created the resistant trait in response to the insects'' need to survive.'
        rationale: |
          You had the pesticide create the trait. It was already there in a few
          insects before any spraying.
      - text: 'No: but only because pesticides cannot affect insect populations at all.'
        rationale: |
          You said pesticides cannot affect insects, and they plainly do: they kill
          the ones without the trait.
      - text: 'Yes: natural selection requires an environmental pressure to first generate new traits.'
        rationale: |
          You said selection needs a pressure to create the variation. The pressure
          sorts variation that already exists.
    explanation: |
      Natural selection acts on variation that already exists in a population: it does not generate new traits in direct response to an environmental pressure. The pesticide-resistant trait existed before the pesticide was introduced; the pesticide simply favored the insects that already had it.
    approved: true

  - id: q-biology-evolution-0012
    type: compare-contrast
    difficulty: medium
    stem: |
      How are natural selection and speciation related to each other?
    choices:
      - text: 'Natural selection is the process that gradually shifts a population''s traits; when it acts differently on two geographically separated groups over many generations, it can eventually produce speciation: the formation of separate species.'
        correct: true
      - text: They are unrelated processes that never occur together.
        rationale: |
          You separated them completely. Selection is the process that pushes two
          groups far enough apart to become species.
      - text: Speciation always happens first, causing natural selection to begin afterward.
        rationale: |
          You put speciation first. The split follows the sorting, not the other way
          round.
      - text: Natural selection and speciation are simply two different names for the exact same single-generation process.
        rationale: |
          You called them the same thing. One is the mechanism and one is the
          outcome.
    explanation: |
      Natural selection is the generation-by-generation mechanism that shifts a population's traits. When two separated groups experience different selective pressures long enough, their accumulated differences can result in speciation: the two groups becoming distinct species.
    approved: true

  - id: q-biology-evolution-0013
    type: identify
    difficulty: medium
    stem: |
      For a trait to become more common in a population through natural selection, which of these must be true about the trait?
    choices:
      - text: It must be heritable (able to be passed genetically to offspring).
        correct: true
      - text: It must be gained through effort or use during an individual's lifetime.
        rationale: |
          You picked a trait gained by effort. Something learned or built in one
          lifetime is not passed on.
      - text: It must make the individual larger than average.
        rationale: |
          You picked size. Bigger is not automatically better suited.
      - text: It must appear only after an environmental pressure begins.
        rationale: |
          You had the trait appear after the pressure. It has to be there first for
          the pressure to act on.
    explanation: |
      A trait spreads through a population only if it is heritable. If a proposed answer skips heredity (does not mention the trait being passed on), it is describing something other than natural selection.
    approved: true

  - id: q-biology-evolution-0014
    type: predict-outcome
    difficulty: exam
    stem: |
      A single population of lizards is split by a newly formed river into two groups that can no longer interbreed. One side of the river has mostly rocky terrain, and the other has mostly sandy terrain. Over many generations, what is the most likely outcome?
    choices:
      - text: Natural selection favors different camouflage and body adaptations suited to each terrain, and given enough generations, the two groups could become too genetically different to interbreed, forming two separate species.
        correct: true
      - text: Both groups will evolve in exactly the same way, since they came from the same original population.
        rationale: |
          You had both sides change identically. The two riverbanks are different
          places with different pressures.
      - text: Neither group will experience any further evolution, since the split already occurred.
        rationale: |
          You froze both groups. Each still faces selection where it stands.
      - text: The two groups will automatically merge back into one species once the river dries up, regardless of how many generations have passed.
        rationale: |
          You had them merge. The river is what stops them meeting.
    explanation: |
      This is speciation through geographic separation: different environmental pressures (rocky vs. sandy terrain) drive different adaptations in each isolated group, and enough accumulated genetic difference over time can make the two groups unable to interbreed: forming separate species.
    approved: true
