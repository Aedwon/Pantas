meta:
  subject: science
  topic: biology
  subtopic: evolution
  exams: [upcat, dlsucet, ustet, dost-sei]
questions:
  - id: q-biology-evolution-0001
    type: 'identify'
    difficulty: 'easy'
    stem: |
      Who published On the Origin of Species in 1859?
    choices:
      - text: 'Charles Darwin'
        correct: true
      - text: 'Alfred Russel Wallace'
        rationale: |
          This confuses joint development of natural selection with authorship of this book. Wallace independently developed natural selection, so the name fits the subject. Check the named publication and date.
      - text: 'Gregor Johann Mendel'
        rationale: |
          This confuses the study of inheritance with this book on evolution. Mendel studied how traits pass to offspring. Check which scientist wrote the named book.
      - text: 'Jean-Baptiste Lamarck'
        rationale: |
          This confuses an earlier account of species change with Darwin’s book. Lamarck also discussed evolution, so the subject fits. Check the author of the named publication.
    explanation: |
      Charles Darwin published On the Origin of Species in 1859. The book explained descent with modification and natural selection.
    approved: true

  - id: q-biology-evolution-0002
    type: 'identify'
    difficulty: 'easy'
    stem: |
      Darwin summarized evolution with the phrase "descent with modification." What does this phrase mean?
    choices:
      - text: 'Species descend from shared ancestors, but change over time.'
        correct: true
      - text: 'Species descend from more advanced ancestors and become simpler over time.'
        rationale: |
          This adds a required direction toward simplicity. Descendants do differ from ancestors, which makes a direction seem possible. Check whether the phrase states a fixed goal.
      - text: 'Species never change once they first appear.'
        rationale: |
          This removes change from the idea. Descendants often resemble their parents, so permanence can seem reasonable. Check what modification means.
      - text: 'Species always modify themselves intentionally to survive.'
        rationale: |
          This treats inherited change as a deliberate choice. Useful traits can look designed for survival. Check whether organisms choose new inherited traits.
    explanation: |
      Descendants inherit traits from ancestors. Heritable differences can build up across generations. Shared ancestry and these changes together explain descent with modification.
    approved: true

  - id: q-biology-evolution-0003
    type: 'process-ordering'
    difficulty: 'medium'
    stem: |
      A population already has an inherited coat-color difference. A habitat change makes one color harder for predators to see. Which sequence describes selection from this starting point?
    choices:
      - text: 'Inherited variation, survival difference, offspring difference, population change'
        correct: true
      - text: 'Survival difference, inherited variation, offspring difference, population change'
        rationale: |
          This puts the survival difference before the given variation. Predation is the visible change, so it may seem to come first. Check what the starting population already contains.
      - text: 'Population change, survival difference, inherited variation, offspring difference'
        rationale: |
          This places the population result before its causes. A common color is the easiest change to see. Check what must happen before its frequency rises.
      - text: 'Inherited variation, population change, offspring difference, survival difference'
        rationale: |
          This changes the population before different numbers of offspring are produced. A helpful color may seem to spread immediately. Check that inherited change is tracked across generations.
    explanation: |
      The inherited color difference exists first. Predators then leave more survivors of one color. Those survivors leave more offspring on average. That color becomes more common across generations.
    approved: true

  - id: q-biology-evolution-0004
    type: 'cause-effect'
    difficulty: 'medium'
    stem: |
      Some insects already carry a heritable pesticide-resistance variant. Spraying leaves these insects with more surviving offspring on average. Why does resistance become common?
    choices:
      - text: 'Resistant insects leave more descendants.'
        correct: true
      - text: 'Spraying gives every survivor the needed allele.'
        rationale: |
          This makes the pesticide create a needed allele in every survivor. Resistance is useful after spraying, so a direct change seems convenient. Check whether the stem says the variant already existed.
      - text: 'Exposure trains each insect to resist the spray.'
        rationale: |
          This treats inherited resistance as training during one lifetime. Repeated exposure can suggest practice. Check whether the change is in individual behavior or inherited population traits.
      - text: 'Resistance spreads without being inherited.'
        rationale: |
          This leaves out inheritance. Survivors can be easy to count without following their offspring. Check how the variant reaches the next generation.
    explanation: |
      Resistant insects leave more surviving offspring. Their offspring can inherit the resistance variant. Over generations, that variant becomes more common.
    approved: true

  - id: q-biology-evolution-0005
    type: 'identify'
    difficulty: 'medium'
    stem: |
      What term describes the formation of a brand-new species, commonly triggered by geographic separation?
    choices:
      - text: 'Speciation'
        correct: true
      - text: 'Natural selection'
        rationale: |
          This confuses a mechanism of evolutionary change with the formation of species. Selection can help populations diverge. Check whether the question asks for a mechanism or the new-species outcome.
      - text: 'Inheritance'
        rationale: |
          This confuses passing traits to offspring with forming new species. Inheritance happens across generations of a lineage. Check whether distinct lineages are being formed.
      - text: 'Variation'
        rationale: |
          This confuses differences among individuals with a new-species outcome. Variation supplies material for evolution. Check whether the question describes diversity within a group or separate species.
    explanation: |
      Speciation is the formation of new species. In sexually reproducing populations, lasting reproductive isolation can help separate lineages form.
    approved: true

  - id: q-biology-evolution-0006
    type: 'cause-effect'
    difficulty: 'medium'
    stem: |
      How can geographic isolation contribute to allopatric speciation?
    choices:
      - text: 'Reduced gene flow allows populations to diverge.'
        correct: true
      - text: 'A physical barrier instantly creates new species.'
        rationale: |
          This equates geographic separation with completed speciation. The groups are already apart, so they look like separate species. Check whether reproductive isolation has developed.
      - text: 'Isolation prevents any new mutations from arising.'
        rationale: |
          This confuses isolation from other populations with a halt in genetic change. Fewer incoming alleles may seem like no new variants. Check whether mutations can still arise within each group.
      - text: 'Shared ancestry forces identical future changes.'
        rationale: |
          This treats a common past as a fixed future. Related groups share many traits at first. Check whether selection and chance can differ after separation.
    explanation: |
      A geographic barrier can reduce gene flow. Selection, mutation, and chance changes can then make the populations differ. They may become separate species if lasting reproductive isolation develops.
    approved: true

  - id: q-biology-evolution-0007
    type: 'classify'
    difficulty: 'medium'
    stem: |
      Related finch lineages diversified into species with different feeding niches in the Galápagos. What is this pattern called?
    choices:
      - text: 'Adaptive radiation'
        correct: true
      - text: 'Inheritance of acquired traits'
        rationale: |
          This treats inherited beak differences as changes acquired by use. Feeding affects which beaks work well. Check whether the traits were inherited or developed by effort.
      - text: 'Evolution without genetic variation'
        rationale: |
          This removes variation from the explanation. All the finches are related, which can suggest they began alike in every trait. Check whether inherited differences can arise and spread.
      - text: 'Permanent geographic isolation'
        rationale: |
          This assumes separated lineages can never exchange genes again. Island geography makes permanent isolation sound plausible. Check whether the term describes diversity of niches or an absolute barrier.
    explanation: |
      Adaptive radiation occurs when related lineages diversify into different ecological roles. The finch lineages share ancestry and have different feeding traits.
    approved: true

  - id: q-biology-evolution-0008
    type: 'classify'
    difficulty: 'hard'
    stem: |
      An animal gains larger muscles through exercise. Why does that alone not establish evolution by natural selection?
    choices:
      - text: 'The acquired muscle gain need not be inherited.'
        correct: true
      - text: 'Any useful change is automatically inherited.'
        rationale: |
          This equates usefulness with inheritance. Stronger muscles may help survival. Check whether the acquired change alters what offspring inherit.
      - text: 'Only harmful acquired changes reach offspring.'
        rationale: |
          This makes harm determine inheritance. Useful and harmful traits can both affect survival, which may blur the distinction. Check how a trait is passed on instead of judging its value.
      - text: 'Effort creates exactly the inherited trait needed.'
        rationale: |
          This treats need and effort as a source of targeted inherited traits. Training can produce a useful body change. Check whether the change is demonstrated in the offspring’s inherited variants.
    explanation: |
      Exercise can change an individual’s muscles. Natural selection changes populations when inherited variants differ in reproductive success. Muscle growth alone does not show such an inherited population change.
    approved: true

  - id: q-biology-evolution-0009
    type: 'classify'
    difficulty: 'hard'
    stem: |
      Which measure most directly represents evolutionary fitness?
    choices:
      - text: 'Relative reproductive success'
        correct: true
      - text: 'Maximum adult body strength'
        rationale: |
          This confuses evolutionary fitness with physical fitness. Strength sometimes helps survival and mating. Check how many descendants a trait helps produce.
      - text: 'Total years lived by an adult'
        rationale: |
          This treats long life as the whole measure. Living longer may provide more chances to reproduce. Check whether those chances actually result in descendants.
      - text: 'Ability to win every contest'
        rationale: |
          This treats winning contests as the definition. Competition can affect mating success. Check reproductive results rather than victory alone.
    explanation: |
      Evolutionary fitness means reproductive success compared with others in the population. An individual has higher fitness when it contributes more surviving offspring to later generations.
    approved: true

  - id: q-biology-evolution-0010
    type: 'classify'
    difficulty: 'hard'
    stem: |
      Which statement describes how natural selection favors traits?
    choices:
      - text: 'Current fitness determines selection.'
        correct: true
      - text: 'All lineages move toward one ideal body form.'
        rationale: |
          This gives evolution a single destination. Some changes look more complex, which can suggest progress toward an ideal. Check whether the environment always rewards the same trait.
      - text: 'Individuals choose useful inherited mutations.'
        rationale: |
          This gives individuals control over inherited mutation. Useful traits can appear well matched to a problem. Check whether usefulness proves deliberate choice.
      - text: 'Future needs determine which traits arise now.'
        rationale: |
          This treats future need as a cause of present variation. A helpful trait can seem to anticipate a challenge. Check whether selection acts on current differences and conditions.
    explanation: |
      Natural selection favors inherited traits that improve reproductive success under current conditions. It has no foresight or planned final form.
    approved: true

  - id: q-biology-evolution-0011
    type: 'classify'
    difficulty: 'hard'
    stem: |
      A resistance allele is detected in stored insect samples collected before spraying began. What does this evidence establish?
    choices:
      - text: 'The allele existed before pesticide exposure.'
        correct: true
      - text: 'The pesticide created that allele in response to need.'
        rationale: |
          This reverses the timing of the evidence. Resistance becomes noticeable after spraying, so the spray can seem to create it. Check when the positive samples were collected.
      - text: 'Every insect already carried the resistance allele.'
        rationale: |
          This turns presence in some samples into presence in every insect. Detecting an allele proves it exists. Check whether the evidence measures every individual.
      - text: 'Natural selection cannot affect that resistance allele.'
        rationale: |
          This assumes an existing allele cannot be selected. The allele’s earlier presence may seem to make spraying irrelevant. Check whether exposure can change reproductive success.
    explanation: |
      The samples were collected before pesticide use. Finding the allele in those samples shows that it was already present. Later spraying can favor insects carrying it.
    approved: true

  - id: q-biology-evolution-0012
    type: 'compare-contrast'
    difficulty: 'medium'
    stem: |
      Which statement correctly relates natural selection and speciation?
    choices:
      - text: 'Selection can help isolate breeding groups.'
        correct: true
      - text: 'Selection always creates a new species at once.'
        rationale: |
          This makes selection and speciation immediate equivalents. Selected traits can help lineages diverge. Check whether a trait-frequency change alone proves a new species.
      - text: 'Speciation requires selection and excludes drift.'
        rationale: |
          This makes selection the only possible cause. Adaptation is a common explanation for divergence. Check whether mutation and drift can also change separated populations.
      - text: 'Speciation and selection mean the same change.'
        rationale: |
          This confuses a mechanism with an outcome. Both concern evolutionary change. Check whether the term describes shifting trait frequencies or forming species.
    explanation: |
      Natural selection can favor different inherited traits in different populations. Those differences can contribute to reproductive isolation and speciation. Other evolutionary mechanisms can also contribute.
    approved: true

  - id: q-biology-evolution-0013
    type: 'identify'
    difficulty: 'medium'
    stem: |
      For a trait to become more common in a population through natural selection, which of these must be true about the trait?
    choices:
      - text: 'It must be heritable.'
        correct: true
      - text: 'It must be acquired through repeated use.'
        rationale: |
          This confuses an acquired change with inherited variation. Repeated use can improve a trait in one lifetime. Check whether offspring inherit it.
      - text: 'It must increase adult size above average.'
        rationale: |
          This treats size as a universal advantage. Larger bodies help in some environments. Check whether the trait improves reproductive success under the stated conditions.
      - text: 'It must arise only after a pressure begins.'
        rationale: |
          This makes environmental pressure create the trait on demand. The trait becomes useful when conditions change. Check whether it can already exist before the pressure.
    explanation: |
      A trait must be heritable for its advantage to carry into later generations. Selection can make it more common when carriers leave more surviving offspring.
    approved: true

  - id: q-biology-evolution-0014
    type: 'predict-outcome'
    difficulty: 'exam'
    stem: |
      A river stops gene flow between two lizard populations. Their habitats differ. Which outcome is possible over many generations?
    choices:
      - text: 'Divergence may lead to reproductive isolation.'
        correct: true
      - text: 'The barrier guarantees immediate speciation.'
        rationale: |
          This confuses a geographic barrier with a completed species boundary. The lizards cannot meet now, which looks like reproductive isolation. Check whether they would still interbreed if contact resumed.
      - text: 'Common ancestry prevents any future divergence.'
        rationale: |
          This treats shared ancestry as a limit on change. The groups initially share many variants. Check whether their environments and chance events can differ.
      - text: 'Evolution stops until the populations reunite.'
        rationale: |
          This assumes gene exchange is required for all evolution. Isolation stops incoming alleles, which may seem to stop change. Check whether local mutation, drift, and selection still occur.
    explanation: |
      Reduced gene flow allows differences to build up through selection, mutation, and drift. Lasting reproductive isolation may develop. If it does, the populations may become separate species.
    approved: true

  - id: q-biology-evolution-0015
    type: 'identify'
    difficulty: 'easy'
    stem: |
      Which evolutionary mechanism introduces new DNA variants?
    choices:
      - text: 'Mutation'
        correct: true
      - text: 'Natural selection'
        rationale: |
          This confuses generating variants with favoring them. Selection changes which inherited variants become common. Check whether the process makes a new variant or sorts existing ones.
      - text: 'Differential survival'
        rationale: |
          This confuses survival differences with changes in DNA. Survivors influence future allele frequencies. Check whether a new DNA sequence is being created.
      - text: 'Movement of existing alleles'
        rationale: |
          This confuses moving a variant with creating it. Migration can bring a new allele into a population. Check whether the allele is new in DNA or only new to that group.
    explanation: |
      Mutation changes DNA. Such changes can create new versions of a gene, called alleles.
    approved: false

  - id: q-biology-evolution-0016
    type: 'identify'
    difficulty: 'medium'
    stem: |
      Plants from one valley reproduce with plants in another, introducing existing alleles into the second population. Which mechanism is described?
    choices:
      - text: 'Gene flow'
        correct: true
      - text: 'Genetic drift'
        rationale: |
          This confuses movement between populations with chance sampling within one. Both can change allele frequencies. Check whether the alleles arrived from another population.
      - text: 'New mutation'
        rationale: |
          This confuses an incoming allele with a newly changed DNA sequence. The allele is new to the receiving group. Check whether it already existed elsewhere.
      - text: 'Natural selection'
        rationale: |
          This assumes every frequency change follows a reproductive advantage. The newcomers can change frequencies just by breeding. Check whether an advantage is stated.
    explanation: |
      Gene flow moves alleles between populations through reproduction. Migrants can add inherited variants to the population they join.
    approved: false

  - id: q-biology-evolution-0017
    type: 'cause-effect'
    difficulty: 'medium'
    stem: |
      A storm kills individuals regardless of an inherited trait. By chance, the survivors have a different allele frequency. Which process explains the change?
    choices:
      - text: 'Genetic drift'
        correct: true
      - text: 'Natural selection'
        rationale: |
          This assumes every survival difference is caused by the trait. Survivors do shape the next generation. Check whether the trait affected the chance of surviving.
      - text: 'Directed mutation'
        rationale: |
          This treats an environmental event as creating a needed allele. A sudden event can appear to cause a targeted change. Check whether the alleles already existed.
      - text: 'Gene flow'
        rationale: |
          This confuses a changed allele mixture with alleles entering from elsewhere. Both alter frequencies. Check whether migrants or outside breeding are mentioned.
    explanation: |
      Genetic drift changes allele frequencies by chance. The storm did not favor the trait, but the random survivors carried a different mixture of alleles.
    approved: false

  - id: q-biology-evolution-0018
    type: 'compare-contrast'
    difficulty: 'hard'
    stem: |
      Which distinction between selection and genetic drift is correct?
    choices:
      - text: 'Selection depends on fitness; drift depends on chance.'
        correct: true
      - text: 'Selection changes DNA; drift creates needed mutations.'
        rationale: |
          This confuses frequency changes with creating DNA variants. Both mechanisms can make a variant more common. Check whether either mechanism must produce a new mutation.
      - text: 'Selection occurs in individuals; drift never affects populations.'
        rationale: |
          This confuses where selection acts with what evolves. Individuals differ in success, which can hide the population result. Check allele-frequency change across generations.
      - text: 'Selection requires migration; drift requires geographic separation.'
        rationale: |
          This assigns unnecessary location requirements. Migration and separation can affect evolution. Check the defining cause of the frequency change.
    explanation: |
      Selection changes frequencies through differences in reproductive success linked to inherited traits. Drift changes frequencies through chance sampling.
    approved: false

  - id: q-biology-evolution-0019
    type: 'predict-outcome'
    difficulty: 'hard'
    stem: |
      An inherited dark coat reduces offspring survival on pale ground but improves it on dark ground. Which prediction best follows?
    choices:
      - text: 'The favored coat color can change with habitat.'
        correct: true
      - text: 'Dark coats must be favored in every habitat.'
        rationale: |
          This treats an advantage in one place as universal. Dark coats do help on dark ground. Check whether the background stays the same.
      - text: 'Pale coats must always evolve into dark coats.'
        rationale: |
          This gives evolution a fixed color direction. One color may become common in one habitat. Check which color improves success under each condition.
      - text: 'Each animal chooses the coat needed for its habitat.'
        rationale: |
          This treats inherited color as an individual choice. Matching the background looks useful. Check whether variation is inherited or deliberately selected by the animal.
    explanation: |
      A trait’s advantage depends on conditions. The same coat color can lower reproductive success in one habitat and raise it in another.
    approved: false

  - id: q-biology-evolution-0020
    type: 'classify'
    difficulty: 'exam'
    stem: |
      A chromosome-number change in plants produces a breeding group reproductively isolated from nearby plants without geographic separation. Which kind of speciation fits?
    choices:
      - text: 'Sympatric speciation'
        correct: true
      - text: 'Allopatric speciation'
        rationale: |
          This assumes all speciation starts with a physical barrier. Reproductive isolation does separate breeding groups. Check whether the separation is geographic.
      - text: 'Gene flow without isolation'
        rationale: |
          This overlooks the stated reproductive barrier. Nearby plants may seem able to exchange alleles. Check whether the new group can breed with them.
      - text: 'Adaptation without speciation'
        rationale: |
          This treats the change as only a useful trait. Some inherited changes affect adaptation alone. Check whether reproductive isolation is also stated.
    explanation: |
      Sympatric speciation occurs without a geographic barrier. A chromosome-number change can create reproductive isolation among plants in the same area.
    approved: false
