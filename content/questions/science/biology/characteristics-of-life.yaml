meta:
  subject: science
  topic: biology
  subtopic: characteristics-of-life
  exams:
    - upcat
    - dlsucet
    - ustet
    - dost-sei
questions:
  - id: q-biology-characteristics-of-life-0001
    type: identify
    difficulty: easy
    stem: |
      Every living thing is made of one or more of what basic unit?
    choices:
      - text: Cells
        correct: true
      - text: Organs
      - text: Tissues
      - text: Molecules
    explanation: |
      Cellular organization is a core characteristic of life: every living thing is made of one or more cells, the basic building blocks of life.
    approved: true
  - id: q-biology-characteristics-of-life-0002
    type: identify
    difficulty: easy
    stem: |
      What characteristic of life describes an organism keeping its internal conditions stable even when the outside environment changes, like sweating to cool down on a hot day?
    choices:
      - text: Homeostasis
        correct: true
      - text: Metabolism
      - text: Adaptation
      - text: Growth and development
    explanation: |
      Homeostasis is the maintenance of stable internal conditions despite changes in the external environment.
    approved: true
  - id: q-biology-characteristics-of-life-0003
    type: identify
    difficulty: easy
    stem: |
      What characteristic of life describes an organism producing new individuals of the same kind?
    choices:
      - text: Reproduction
        correct: true
      - text: Growth and development
      - text: Response to stimuli
      - text: Metabolism
    explanation: |
      Reproduction is the ability to produce new individuals of the same kind, either asexually or sexually.
    approved: true
  - id: q-biology-characteristics-of-life-0004
    type: identify
    difficulty: medium
    stem: |
      What characteristic of life describes living things gradually changing traits, over many generations, that help them survive and reproduce better in their environment?
    choices:
      - text: Adaptation (through evolution)
        correct: true
      - text: Homeostasis
      - text: Growth and development
      - text: Response to stimuli
    explanation: |
      Adaptation through evolution describes gradual trait changes across generations that improve survival and reproduction in a given environment.
    approved: true
  - id: q-biology-characteristics-of-life-0005
    type: classify
    difficulty: medium
    stem: |
      A mushroom absorbs nutrients from decaying wood to fuel its activities. Which characteristic of life does this directly demonstrate?
    choices:
      - text: Metabolism
        correct: true
      - text: Reproduction
      - text: Response to stimuli
      - text: Adaptation
    explanation: |
      Using energy absorbed from the environment (nutrients from decaying wood) is metabolism.
    approved: true
  - id: q-biology-characteristics-of-life-0006
    type: classify
    difficulty: medium
    stem: |
      A mushroom releases spores that grow into new mushrooms. Which characteristic of life does this directly demonstrate?
    choices:
      - text: Reproduction
        correct: true
      - text: Metabolism
      - text: Homeostasis
      - text: Response to stimuli
    explanation: |
      Producing new individuals (new mushrooms, via spores) is reproduction.
    approved: true
  - id: q-biology-characteristics-of-life-0007
    type: classify
    difficulty: hard
    stem: |
      A virus can reproduce, but only after hijacking a host cell's internal machinery: outside of a host cell, it is completely inactive. Does this fact alone make a virus fully alive?
    choices:
      - text: No: reproduction is only one characteristic; a virus still lacks cells and independent metabolism, which most biologists require for something to be fully alive.
        correct: true
      - text: Yes: the ability to reproduce, on its own, is enough to be classified as fully alive.
      - text: No: viruses cannot reproduce under any circumstances.
      - text: Yes: since it can reproduce inside a host, it counts the same as any living cell.
    explanation: |
      A single characteristic is never enough. Viruses fail the "made of cells" and "independent metabolism" requirements, which is why most biologists classify them as borderline, not fully alive.
    approved: true
  - id: q-biology-characteristics-of-life-0008
    type: classify
    difficulty: hard
    stem: |
      Most biologists do not classify viruses as fully "living," even though viruses can reproduce and evolve. Why?
    choices:
      - text: Viruses are not made of cells and cannot carry out metabolism or maintain homeostasis on their own.
        correct: true
      - text: Viruses cannot reproduce or evolve at all.
      - text: Viruses are too small to be studied by biologists.
      - text: Viruses only exist in humans, not in other organisms.
    explanation: |
      Viruses show some characteristics of life (reproduction, evolution) but fail others (no cells, no independent metabolism or homeostasis), placing them at the border between living and non-living.
    approved: true
  - id: q-biology-characteristics-of-life-0009
    type: classify
    difficulty: medium
    stem: |
      A car engine "consumes" gasoline and produces motion, which might resemble metabolism. Is a car engine considered living?
    choices:
      - text: No: it is not made of cells, cannot reproduce itself, and cannot maintain homeostasis, grow, or adapt.
        correct: true
      - text: Yes: consuming fuel for energy is enough to be classified as living.
      - text: No: but only because it does not produce any motion.
      - text: Yes: any machine that uses fuel is considered alive.
    explanation: |
      Resembling one characteristic (using energy) is not enough. The engine fails every other requirement, no cells, no reproduction, no homeostasis, no growth, no adaptation, so it is non-living.
    approved: true
  - id: q-biology-characteristics-of-life-0010
    type: classify
    difficulty: medium
    stem: |
      A crystal in a mineral solution grows larger over time by adding more material in a repeating pattern. Is the crystal considered living?
    choices:
      - text: No: this growth is just repeated chemical bonding, not cellular growth, and the crystal cannot reproduce, respond to stimuli, or maintain homeostasis.
        correct: true
      - text: Yes: growing larger over time is enough to be classified as living.
      - text: No: but only because crystals are too small to be alive.
      - text: Yes: any object that grows is automatically living.
    explanation: |
      Resembling one characteristic (growth) is not enough. The crystal fails every other requirement, so it is non-living, despite appearing to "grow."
    approved: true
  - id: q-biology-characteristics-of-life-0011
    type: classify
    difficulty: hard
    stem: |
      A fire spreads across a field, consuming fuel (plant material and oxygen) for energy and growing larger. A student argues the fire must be alive, since it grows and uses energy. Is this correct?
    choices:
      - text: No: the fire cannot reproduce itself, does not maintain homeostasis, and is not made of cells; resembling growth and energy use alone is not enough.
        correct: true
      - text: Yes: anything that grows and consumes energy is alive.
      - text: No: but only because fire cannot spread across a field.
      - text: Yes: fire reproduces by spreading to new fuel sources.
    explanation: |
      Fire mimics "growth" (spreading) and "metabolism" (consuming fuel for energy), but it fails the other characteristics of life: it has no cells, cannot reproduce itself, and cannot maintain homeostasis. It is non-living.
    approved: true
  - id: q-biology-characteristics-of-life-0012
    type: classify
    difficulty: hard
    stem: |
      A rock rolls down a hill after being pushed. A student describes this as the rock "responding to a stimulus." Is this a correct use of the term?
    choices:
      - text: No: response to stimuli means an organism actively reacting in a controlled, biological way, not simply obeying gravity or physical forces.
        correct: true
      - text: Yes: any movement caused by an outside force counts as response to stimuli.
      - text: No: but only because rocks are too large to respond to anything.
      - text: Yes: gravity is itself considered a biological stimulus.
    explanation: |
      True response to stimuli involves an organism actively reacting, like a plant growing toward light or an animal fleeing danger, not an object simply obeying gravity or another physical force.
    approved: true
  - id: q-biology-characteristics-of-life-0013
    type: compare-contrast
    difficulty: medium
    stem: |
      Which statement correctly tells apart asexual and sexual reproduction?
    choices:
      - text: Asexual reproduction involves one parent producing offspring; sexual reproduction involves two parents combining genetic material.
        correct: true
      - text: Asexual reproduction always involves two parents; sexual reproduction always involves one parent.
      - text: Both types of reproduction always require exactly two parents.
      - text: Asexual reproduction only happens in plants; sexual reproduction only happens in animals.
    explanation: |
      Asexual reproduction (like a bacterium splitting in two) involves a single parent. Sexual reproduction involves two parents combining their genetic material.
    approved: true
  - id: q-biology-characteristics-of-life-0014
    type: predict-outcome
    difficulty: exam
    stem: |
      An organism is observed to be made of cells, uses chemical reactions to obtain energy, maintains stable internal conditions, grows over time, produces offspring, reacts to changes in its environment, and shows trait changes across generations. Based on this full description, should it be classified as alive?
    choices:
      - text: Yes: it demonstrates all seven characteristics of life together, meeting the requirement for being classified as alive.
        correct: true
      - text: No: demonstrating all seven characteristics together actually disqualifies something from being alive.
      - text: It cannot be determined without knowing the organism's exact species.
      - text: Only the reproduction and growth characteristics matter; the rest are irrelevant.
    explanation: |
      An organism showing all seven characteristics of life together, cellular organization, metabolism, homeostasis, growth, reproduction, response to stimuli, and adaptation, meets the full requirement to be classified as alive.
    approved: true
