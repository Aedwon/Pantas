meta:
  subject: "science"
  topic: "biology"
  subtopic: "characteristics-of-life"
  exams: ["upcat", "dlsucet", "ustet", "dost-sei"]
questions:
  - id: q-biology-characteristics-of-life-0001
    type: "identify"
    difficulty: "easy"
    stem: |
      What is the basic structural and functional unit of known living organisms?
    choices:
      - text: "Cells"
        correct: true
      - text: "Organs"
        rationale: |
          This confuses a whole body part with the basic living unit. Organs perform important functions, so they seem like the smallest useful parts. Check whether single-celled organisms have organs.
      - text: "Tissues"
        rationale: |
          This confuses a group of cells with one basic living unit. Tissues form much of a complex organism, so they seem fundamental. Check whether an organism can live as just one cell.
      - text: "Molecules"
        rationale: |
          This confuses the components of living matter with a complete living unit. Cells contain molecules, so molecules seem like the smallest possible answer. Check which unit can carry out the basic functions of life.
    explanation: |
      A cell is the basic structural and functional unit of known living organisms. An organism can consist of one cell or many cells.
    approved: true

  - id: q-biology-characteristics-of-life-0002
    type: "identify"
    difficulty: "easy"
    stem: |
      What characteristic of life describes an organism keeping its internal conditions stable even when the outside environment changes, like sweating to cool down on a hot day?
    choices:
      - text: "Homeostasis"
        correct: true
      - text: "Metabolism"
        rationale: |
          This confuses all chemical reactions with the specific regulation they support. Sweating and heat production depend on metabolism, so the broad term seems to fit. Check whether the question emphasizes internal regulation.
      - text: "Adaptation"
        rationale: |
          This confuses a short-term temperature response with evolutionary change. Both help an organism cope with conditions. Check whether the change occurs within an individual or across generations.
      - text: "Growth and development"
        rationale: |
          This confuses regulation with changes in size and form. Both happen during an organism's life, so they can seem similar. Check whether internal temperature or body development is being described.
    explanation: |
      Homeostasis regulates internal conditions within ranges that allow an organism to live. Sweating can help keep body temperature within such a range.
    approved: true

  - id: q-biology-characteristics-of-life-0003
    type: "identify"
    difficulty: "easy"
    stem: |
      What characteristic of life describes an organism producing new individuals of the same kind?
    choices:
      - text: "Reproduction"
        correct: true
      - text: "Growth and development"
        rationale: |
          This confuses making a larger individual with making a new one. Both involve an increase in living material. Check whether there is a new organism or a change to the existing one.
      - text: "Response to stimuli"
        rationale: |
          This confuses an environmental response with the production of offspring. A stimulus can trigger reproduction, so the processes may seem identical. Check whether the question asks about the trigger or the resulting new individuals.
      - text: "Metabolism"
        rationale: |
          This confuses the reactions supporting reproduction with reproduction itself. Making offspring uses energy and materials, so metabolism is involved. Check which term names the production of new organisms.
    explanation: |
      Reproduction produces new organisms. It allows a living lineage to continue through new individuals.
    approved: true

  - id: q-biology-characteristics-of-life-0004
    type: "identify"
    difficulty: "medium"
    stem: |
      Which property describes heritable traits becoming more common in a population across generations because they improve survival and reproduction in its environment?
    choices:
      - text: "Adaptation"
        correct: true
      - text: "Homeostasis"
        rationale: |
          This confuses population change with internal regulation. Both can help living things survive changing conditions. Check whether the change is across generations or inside one organism.
      - text: "Growth and development"
        rationale: |
          This confuses development within one life with inherited change over generations. Both change biological traits, so the time scale can be overlooked. Check whether descendants or one growing individual are described.
      - text: "Response to stimuli"
        rationale: |
          This confuses an individual response with a population's inherited changes. Both involve the environment, so they can sound similar. Check whether trait frequencies change across generations.
    explanation: |
      Evolutionary adaptation occurs in populations across generations. Heritable traits that help survival and reproduction can become more common in a particular environment.
    approved: true

  - id: q-biology-characteristics-of-life-0005
    type: "classify"
    difficulty: "medium"
    stem: |
      A mushroom absorbs nutrients from decaying wood to fuel its activities. Which characteristic of life does this directly demonstrate?
    choices:
      - text: "Metabolism"
        correct: true
      - text: "Reproduction"
        rationale: |
          This confuses obtaining resources with producing offspring. Nutrients can support reproduction, so they seem to demonstrate it. Check whether any new mushrooms are described.
      - text: "Response to stimuli"
        rationale: |
          This confuses using nutrients with reacting to a changed condition. Decaying wood is part of the surroundings, so any interaction can seem like a stimulus response. Check whether the observation describes a reaction to change or energy use.
      - text: "Adaptation"
        rationale: |
          This confuses the use of a resource with inherited population change. Feeding helps survival, so it can seem like an adaptation occurring now. Check whether the description compares generations.
    explanation: |
      Metabolism includes chemical reactions that transform nutrients and release usable energy. The mushroom uses these reactions to support its activities.
    approved: true

  - id: q-biology-characteristics-of-life-0006
    type: "classify"
    difficulty: "medium"
    stem: |
      A mushroom releases spores that grow into new mushrooms. Which characteristic of life does this directly demonstrate?
    choices:
      - text: "Reproduction"
        correct: true
      - text: "Metabolism"
        rationale: |
          This confuses the energy needed for spore production with the production of new organisms. Making spores uses chemical reactions, so metabolism seems relevant. Check which property the new mushrooms demonstrate most directly.
      - text: "Homeostasis"
        rationale: |
          This confuses a living system continuing its lineage with keeping internal conditions regulated. Both maintain life in a broad sense. Check whether the observation reports internal regulation or offspring.
      - text: "Response to stimuli"
        rationale: |
          This confuses a possible trigger for spore release with the outcome described. A mushroom can react to its environment, so releasing spores seems like a response. Check whether the stem emphasizes a stimulus or new mushrooms.
    explanation: |
      The spores produce new mushrooms. Producing new organisms demonstrates reproduction.
    approved: true

  - id: q-biology-characteristics-of-life-0007
    type: "classify"
    difficulty: "hard"
    stem: |
      A virus contains genetic material enclosed in a protein coat but has no cellular organization. Which property of living organisms is directly absent from this description of the virus?
    choices:
      - text: "Cellular organization"
        correct: true
      - text: "Heritable genetic information"
        rationale: |
          This assumes genetic material requires a complete cell. DNA is found in cells, so the two features can seem inseparable. Check whether the described virus already contains genetic material.
      - text: "Evolution across generations"
        rationale: |
          This assumes a cell-free entity cannot evolve. Evolution is a property of living populations, so it may seem impossible outside cells. Check whether viral populations can change across generations.
      - text: "Replication within living host cells"
        rationale: |
          This assumes absence of cells prevents any replication. Cellular machinery is needed, so copying may seem impossible. Check whether a virus can use a host cell's machinery.
    explanation: |
      Viruses are acellular, meaning they are not made of cells. Genetic material inside a protein coat does not form the cellular organization of an organism.
    approved: true

  - id: q-biology-characteristics-of-life-0008
    type: "classify"
    difficulty: "hard"
    stem: |
      Most biologists do not classify viruses as fully "living," even though viruses can reproduce and evolve. Why?
    choices:
      - text: "They lack cells and independent metabolism."
        correct: true
      - text: "Replication means their particles contain complete living cells."
        rationale: |
          This treats replication as proof of a complete cell. Viruses make new copies in hosts, so they can seem to have every cellular property. Check whether replication uses their own cellular machinery.
      - text: "Evolution means they carry out independent cellular metabolism."
        rationale: |
          This treats evolution as proof of independent metabolism. Viral populations change over generations, so they can seem self-sustaining. Check whether genetic change supplies a cell's energy-processing system.
      - text: "A protein coat provides all the functions of a complete cell."
        rationale: |
          This assumes a protein coat replaces all cell structures. A coat encloses genetic material, so it resembles a cell boundary. Check whether the enclosed system is organized as a cell.
    explanation: |
      Viruses are not made of cells and lack independent metabolism and cellular homeostasis. They use host-cell machinery to replicate. Introductory biology therefore usually does not classify them as living organisms.
    approved: true

  - id: q-biology-characteristics-of-life-0009
    type: "classify"
    difficulty: "medium"
    stem: |
      A car engine "consumes" gasoline and produces motion, which might resemble metabolism. Is a car engine considered living?
    choices:
      - text: "No; fuel use alone does not establish life."
        correct: true
      - text: "Yes; burning gasoline is the same as cellular metabolism."
        rationale: |
          This equates fuel combustion with cellular metabolism. Both release energy, so they look similar. Check whether chemical reactions occur within an organized living cell.
      - text: "Yes; producing motion proves biological growth and development."
        rationale: |
          This equates mechanical movement with biological development. Movement is easy to observe, so it can seem like evidence of life. Check whether the machine undergoes cell-based growth and development.
      - text: "Yes; temperature control makes an engine a cellular organism."
        rationale: |
          This treats any regulation as cellular organization. Machines can control temperature, so they can resemble one life property. Check whether a regulated system is actually made of living cells.
    explanation: |
      A car engine is a nonliving machine. It transforms fuel energy without cellular organization or a self-sustaining biological system. Fuel use alone does not establish life.
    approved: true

  - id: q-biology-characteristics-of-life-0010
    type: "classify"
    difficulty: "medium"
    stem: |
      A crystal in a mineral solution grows larger over time by adding more material in a repeating pattern. Is the crystal considered living?
    choices:
      - text: "No; crystal growth lacks cellular organization."
        correct: true
      - text: "Yes; every increase in size requires living cells."
        rationale: |
          This treats every size increase as biological growth. Crystals and organisms can both become larger, so the visible result looks alike. Check whether the growth belongs to a cellular biological system.
      - text: "Yes; an ordered mineral lattice is a group of living cells."
        rationale: |
          This treats an ordered pattern as cellular organization. Crystals have repeating structure, so that order can look like life. Check whether the repeating units are cells or a mineral lattice.
      - text: "Yes; repeating a mineral pattern is biological reproduction."
        rationale: |
          This treats adding mineral material as biological reproduction. The pattern repeats while the crystal grows, so it can look like copying. Check whether new organisms with inherited biological information are produced.
    explanation: |
      A crystal grows by adding material to its repeating structure. This is physical growth without cellular organization or a biological system. It is therefore not classified as an organism.
    approved: true

  - id: q-biology-characteristics-of-life-0011
    type: "classify"
    difficulty: "hard"
    stem: |
      A fire spreads to new fuel but has no cells or inherited biological traits. Which statement correctly evaluates the claim that this spread is evolutionary adaptation?
    choices:
      - text: "It is not an inherited population change."
        correct: true
      - text: "It is adaptation because any spread changes an environment."
        rationale: |
          This confuses spreading into new places with inherited population change. Both can increase the area occupied, so the result looks similar. Check whether traits change across generations of organisms.
      - text: "It is adaptation because any object can evolve as it changes."
        rationale: |
          This confuses physical change over time with evolutionary adaptation. A fire changes size and intensity, so it seems to evolve. Check whether the changes involve inherited biological traits.
      - text: "It is adaptation because burning more fuel is reproductive success."
        rationale: |
          This treats successful fuel use as biological reproductive success. More burning produces more fire, so it resembles an expanding lineage. Check whether there are cells and inherited traits passed to offspring.
    explanation: |
      Evolutionary adaptation changes a population across generations. Fire spreading to new fuel does not show inherited changes in a population of organisms. It is combustion, a nonliving chemical process.
    approved: true

  - id: q-biology-characteristics-of-life-0012
    type: "classify"
    difficulty: "hard"
    stem: |
      A rock rolls downhill after being pushed. Does this motion demonstrate the biological response-to-stimuli property of life?
    choices:
      - text: "No; it is passive motion under physical forces."
        correct: true
      - text: "Yes; every movement after an outside event is biological response."
        rationale: |
          This treats any physical motion as a regulated biological response. Both follow an outside event, so the sequence looks similar. Check whether a cellular system detects and responds.
      - text: "Yes; the rock's movement proves it is carrying out metabolism."
        rationale: |
          This treats movement as proof of energy-processing reactions. Moving objects have energy, so their motion can seem metabolic. Check whether cellular chemical reactions are involved.
      - text: "Yes; changing position demonstrates biological growth and development."
        rationale: |
          This confuses displacement with growth and development. The rock changes its position over time, so it seems to undergo an ordered change. Check whether the object's biological form or size is developing.
    explanation: |
      The rock's motion results from a push and gravity. This does not demonstrate a regulated response by a cellular biological system. Motion alone cannot establish life.
    approved: true

  - id: q-biology-characteristics-of-life-0013
    type: compare-contrast
    difficulty: medium
    stem: |
      Which statement correctly tells apart asexual and sexual reproduction?
    choices:
      - text: Asexual reproduction involves one parent producing offspring; sexual reproduction involves two parents combining genetic material.
        correct: true
      - text: Asexual reproduction always involves two parents; sexual reproduction always involves one parent.
        rationale: |
          You swapped parent counts. Asexual reproduction requires 1 parent; sexual reproduction requires 2 parents.
      - text: Both types of reproduction always require exactly two parents.
        rationale: |
          You required 2 parents for asexual reproduction. Asexual reproduction produces genetically identical clones from 1 parent.
      - text: Asexual reproduction only happens in plants; sexual reproduction only happens in animals.
        rationale: |
          You restricted reproduction modes by kingdom. Bacteria, fungi, animals, and plants can reproduce asexually or sexually.
    explanation: |
      Asexual reproduction (like a bacterium splitting in two) involves a single parent. Sexual reproduction involves two parents combining their genetic material.
    approved: true
  - id: q-biology-characteristics-of-life-0014
    type: "predict-outcome"
    difficulty: "exam"
    stem: |
      A cellular lineage uses nutrients, regulates internal conditions, grows, responds to its environment, and produces new organisms. Inherited traits also change in its populations across generations. Which conclusion is supported?
    choices:
      - text: "The evidence supports a living biological system."
        correct: true
      - text: "It is nonliving unless one individual evolves during its own lifetime."
        rationale: |
          This requires an individual to show inherited population change during its own lifetime. The observations include evolution, so they can seem to concern one organism. Check whether evolution is measured across generations.
      - text: "It is nonliving unless every individual personally produces offspring."
        rationale: |
          This makes reproduction by each individual necessary for life. Reproduction is a major life property, so it seems like a strict individual test. Check whether sterile members of a living lineage can still be alive.
      - text: "It cannot be considered living despite the combined cellular evidence."
        rationale: |
          This treats each property as insufficient even when they occur together in cells. Single-trait examples can mislead, so every judgment may seem uncertain. Check whether the evidence describes a complete cellular biological system.
    explanation: |
      Cellular organization together with metabolism, regulation, growth, response, reproduction in a lineage, and population evolution supports classification as living. These properties are considered together, rather than as one isolated behavior.
    approved: true

  - id: q-biology-characteristics-of-life-0015
    type: "identify"
    difficulty: "easy"
    stem: |
      Which property is demonstrated when one bacterial cell carries out the functions needed to maintain itself?
    choices:
      - text: "Cellular organization"
        correct: true
      - text: "Organization into multiple tissues"
        rationale: |
          This assumes life requires groups of specialized cells. Tissues are common in familiar plants and animals, so they seem necessary. Check whether the described organism has one cell.
      - text: "Organization into specialized organs"
        rationale: |
          This assumes every living system needs organs. Organs perform important functions in animals, so they seem universal. Check whether one cell can perform the needed functions.
      - text: "Dependence on a multicellular body"
        rationale: |
          This assumes a single cell must belong to a larger organism. Familiar body cells depend on surrounding tissues, so all cells may seem dependent. Check whether the bacterium is itself the organism.
    explanation: |
      A bacterium is a single-celled organism. Its one cell is an organized living system that performs the functions needed for life.
    approved: false

  - id: q-biology-characteristics-of-life-0016
    type: "structure-function"
    difficulty: "medium"
    stem: |
      A mammal increases sweating when its body temperature rises. Which function of this response is most directly related to homeostasis?
    choices:
      - text: "Keeping temperature within a suitable range"
        correct: true
      - text: "Making internal temperature perfectly constant at all times"
        rationale: |
          This treats regulation as perfect constancy. The body limits temperature changes, so complete stability can seem the goal. Check whether homeostasis allows conditions to vary within a range.
      - text: "Creating an inherited heat-resistance trait during that day"
        rationale: |
          This confuses a short-term physiological response with inherited adaptation. Sweating helps in heat, so it can seem to create an evolutionary trait. Check whether the change happens within an individual or across generations.
      - text: "Producing offspring with the same body temperature"
        rationale: |
          This confuses regulation with reproduction. Both help living systems continue, so the purpose may seem similar. Check whether sweating changes internal conditions or produces new organisms.
    explanation: |
      Sweating can increase heat loss from the body. This helps regulate body temperature within a range suitable for life. Homeostasis allows some variation while keeping conditions workable.
    approved: false

  - id: q-biology-characteristics-of-life-0017
    type: "classify"
    difficulty: "medium"
    stem: |
      A sterile animal grows, responds to its environment, and maintains itself through cellular metabolism. Which statement about its living status is correct?
    choices:
      - text: "It is alive despite being unable to reproduce."
        correct: true
      - text: "It is nonliving because every individual must produce offspring."
        rationale: |
          This applies a lineage property as a strict test for each individual. Reproduction is central to life, so the requirement seems reasonable. Check whether sterile organisms still perform cellular life functions.
      - text: "It is alive only until it reaches reproductive age and remains sterile."
        rationale: |
          This makes age determine life only through reproductive ability. Young animals do not reproduce yet, so postponing the rule seems to help. Check whether becoming older removes their cells and metabolism.
      - text: "It is nonliving because sterility proves that it lacks living cells."
        rationale: |
          This treats one missing ability as evidence that all cell functions are absent. Reproduction uses living cells, so its failure can seem to imply no cells. Check the cell-based functions already observed.
    explanation: |
      Reproduction is a property of living lineages. An individual can remain alive even when it cannot produce offspring. Sterility does not remove its cells or their life functions.
    approved: false

  - id: q-biology-characteristics-of-life-0018
    type: "compare-contrast"
    difficulty: "hard"
    stem: |
      Which observation represents evolutionary adaptation rather than a response or development within one individual?
    choices:
      - text: "An inherited protective trait becomes common across generations."
        correct: true
      - text: "One animal moves into shade when the afternoon temperature rises."
        rationale: |
          This confuses immediate behavior with inherited population change. Moving into shade helps survival, so it can seem evolutionary. Check whether the observation spans generations.
      - text: "One seedling grows taller while supplied with water and nutrients."
        rationale: |
          This confuses individual growth with population adaptation. The plant changes while using environmental resources, so it seems to adapt. Check whether a trait becomes more common in descendants.
      - text: "One person sweats more during a single period of physical exercise."
        rationale: |
          This confuses regulation during activity with inherited adaptation. Sweating helps the body tolerate heat, so it sounds like an adaptive change. Check whether the change concerns one person or a population across generations.
    explanation: |
      Evolutionary adaptation concerns inherited changes in a population across generations. A useful inherited trait can become more common when its carriers leave more offspring.
    approved: false

  - id: q-biology-characteristics-of-life-0019
    type: "predict-outcome"
    difficulty: "hard"
    stem: |
      An experiment observes a dormant seed before and after suitable water and warmth are supplied. It then develops into a seedling. Which interpretation best fits the framework for life?
    choices:
      - text: "Life functions can be less visible during dormancy."
        correct: true
      - text: "Dormancy makes the seed nonliving matter until water creates life."
        rationale: |
          This equates low visible activity with absence of life. A dormant seed can look unchanged, so it seems inert. Check whether suitable conditions allow its existing biological system to resume activity.
      - text: "A living individual must visibly grow and reproduce at every moment."
        rationale: |
          This turns characteristic life properties into nonstop requirements. Growth and reproduction are familiar signs of life, so their pauses seem disqualifying. Check whether the framework requires every activity at every moment.
      - text: "The seed became alive solely because any size increase proves life."
        rationale: |
          This uses growth alone as proof. The seedling is larger than the seed, so size change seems enough. Check the cellular biological system behind the development.
    explanation: |
      A living system need not display every property visibly at every moment. A dormant seed can later resume growth under suitable conditions. Its ordered development is part of the life of the existing organism.
    approved: false

  - id: q-biology-characteristics-of-life-0020
    type: "classify"
    difficulty: "exam"
    stem: |
      A mushroom absorbs nutrients, increases in size, releases spores that become new mushrooms, and grows differently when its surroundings change. Which observation most directly demonstrates response to stimuli?
    choices:
      - text: "Changed growth following a change in surroundings"
        correct: true
      - text: "Nutrient absorption that supplies chemical energy for the fungus"
        rationale: |
          This confuses energy processing with a response to environmental change. Nutrients come from the surroundings, so uptake can seem to be the response named here. Check which observation links a change in conditions to changed behavior.
      - text: "Increase in the mushroom's overall size during its development"
        rationale: |
          This confuses growth itself with a response that alters growth. Both involve the mushroom becoming larger, so they seem alike. Check whether a stimulus caused a change in the pattern.
      - text: "Release of spores that establish new mushrooms in nearby soil"
        rationale: |
          This confuses reproduction with response to stimuli. Spore release may have environmental triggers, so it seems relevant. Check which observation explicitly reports a changed response to changed surroundings.
    explanation: |
      The change in surroundings is the stimulus. The mushroom changes how it grows in response. This directly demonstrates response to stimuli.
    approved: false
