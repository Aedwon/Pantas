meta:
  subject: science
  topic: biology
  subtopic: taxonomy-and-classification
  exams: [upcat, dlsucet, ustet, dost-sei]
questions:
  - id: q-biology-taxonomy-and-classification-0001
    type: 'process-ordering'
    difficulty: 'medium'
    stem: |
      Arrange these traditional ranks from broadest to most specific: Family, Kingdom, Species, Phylum, Domain, Genus, Class, Order.
    choices:
      - text: 'Domain, Kingdom, Phylum, Class, Order, Family, Genus, Species'
        correct: true
      - text: 'Kingdom, Domain, Phylum, Class, Order, Family, Genus, Species'
        rationale: |
          This places kingdom above domain. Older classroom systems began with kingdom, so that order can seem familiar. Check which rank contains kingdoms in this framework.
      - text: 'Domain, Kingdom, Class, Phylum, Order, Family, Genus, Species'
        rationale: |
          This swaps class and phylum. Both are intermediate ranks, so they can be confused. Check that phylum contains classes.
      - text: 'Species, Genus, Family, Order, Class, Phylum, Kingdom, Domain'
        rationale: |
          This reverses the requested direction. All eight ranks are present. Check whether the list must begin broad or specific.
    explanation: |
      The traditional order is Domain, Kingdom, Phylum, Class, Order, Family, Genus, Species. Each listed rank contains the more specific groups below it.
    approved: true

  - id: q-biology-taxonomy-and-classification-0002
    type: 'identify'
    difficulty: 'easy'
    stem: |
      Which list names the three domains in the three-domain framework?
    choices:
      - text: 'Bacteria, Archaea, and Eukarya'
        correct: true
      - text: 'Bacteria, Archaea, and Protista'
        rationale: |
          This replaces Eukarya with a traditional eukaryotic kingdom. Protists are diverse eukaryotes, so the name seems broad. Check whether each name is a domain.
      - text: 'Animalia, Plantae, and Protista'
        rationale: |
          This uses traditional eukaryotic kingdoms as domains. These names cover many organisms. Check which rank the three-domain framework assigns them.
      - text: 'Bacteria, Animalia, and Eukarya'
        rationale: |
          This replaces Archaea with an animal kingdom. Animalia is a major group, so it can seem like a domain. Check whether it belongs within Eukarya.
    explanation: |
      The three-domain framework uses Bacteria, Archaea, and Eukarya. Each name identifies a domain.
    approved: true

  - id: q-biology-taxonomy-and-classification-0003
    type: 'cause-effect'
    difficulty: 'medium'
    stem: |
      Why has modern systematics revised the traditional grouping called Kingdom Protista?
    choices:
      - text: 'It is not one natural evolutionary lineage.'
        correct: true
      - text: 'Its members all lack membrane-enclosed nuclei.'
        rationale: |
          This confuses protists with prokaryotes. Some protists are single-celled, which can suggest simple cells. Check whether their cells have a membrane-enclosed nucleus.
      - text: 'Its members are all one identical species.'
        rationale: |
          This treats a broad kingdom as a species. The old label groups many organisms together. Check whether sharing a broad label makes them one species.
      - text: 'It contains only organisms with no shared ancestry.'
        rationale: |
          This confuses a nonnatural group with a lack of any ancestry. The members do not form one complete lineage as grouped. Check whether this means no common ancestry at all.
    explanation: |
      The traditional Protista group does not contain one common ancestor and all its descendants as a single natural lineage. Molecular evidence has led scientists to revise how these eukaryotes are grouped.
    approved: true

  - id: q-biology-taxonomy-and-classification-0004
    type: 'classify'
    difficulty: 'medium'
    stem: |
      Which statement correctly labels the two parts of *Panthera leo*?
    choices:
      - text: '*Panthera* is the genus; *leo* is the epithet.'
        correct: true
      - text: '*leo* is the genus; *Panthera* is the epithet.'
        rationale: |
          This reverses the two name parts. Both words identify the organism together. Check that the capitalized first word is the genus.
      - text: '*Panthera leo* is the complete genus name.'
        rationale: |
          This assigns the full binomial to the genus. Both words are italicized, so they can look like one genus label. Check which part is shared by species in that genus.
      - text: '*leo* alone is the complete species name.'
        rationale: |
          This treats the epithet as a complete species name. The second word distinguishes species within a genus. Check whether the genus is also included.
    explanation: |
      The first part, *Panthera*, is the genus. The second part, *leo*, is the specific epithet. Both parts together form the species name *Panthera leo*.
    approved: true

  - id: q-biology-taxonomy-and-classification-0005
    type: 'identify'
    difficulty: 'medium'
    stem: |
      Which scientist standardized and popularized binomial nomenclature in the eighteenth century?
    choices:
      - text: 'Carl Linnaeus'
        correct: true
      - text: 'Charles Darwin'
        rationale: |
          This confuses explaining evolutionary change with standardizing scientific naming. Both subjects concern species. Check whether the question asks about names or evolution.
      - text: 'Gregor Mendel'
        rationale: |
          This confuses inheritance research with taxonomy. Both organize knowledge about organisms. Check whether the contribution concerns breeding patterns or scientific names.
      - text: 'Louis Pasteur'
        rationale: |
          This confuses work on microbes with standardizing taxonomy. Microbes also need scientific names. Check which scientist is associated with binomial nomenclature.
    explanation: |
      Carl Linnaeus standardized and popularized two-part species names. His work helped establish the naming approach used in taxonomy.
    approved: true

  - id: q-biology-taxonomy-and-classification-0006
    type: 'cause-effect'
    difficulty: 'medium'
    stem: |
      A biologist finds that villagers in different regions call the same plant by three completely different common names. Why does the biologist prefer to use the plant's scientific (binomial) name in a research paper?
    choices:
      - text: 'It reduces ambiguity across regions.'
        correct: true
      - text: 'It guarantees names never change with new evidence.'
        rationale: |
          This confuses standardization with permanent names. A common naming system encourages consistency. Check whether new taxonomic evidence can lead to a revision.
      - text: 'It is defined by each village’s preferred local language.'
        rationale: |
          This applies local common-name practice to scientific nomenclature. Local names are familiar to each village. Check whether the system aims for local variation or standardized communication.
      - text: 'It removes the need to identify the species itself.'
        rationale: |
          This assumes a naming rule makes identification unnecessary. A formal label sounds precise. Check whether the correct species must still be identified before its name is used.
    explanation: |
      A standardized scientific name helps people in different regions refer to the same organism. Naming rules and records can also track synonyms and later revisions.
    approved: true

  - id: q-biology-taxonomy-and-classification-0007
    type: 'classify'
    difficulty: 'hard'
    stem: |
      Two organisms belong to the same family but different genera. Which statement fits the traditional hierarchy?
    choices:
      - text: 'A family can contain several genera.'
        correct: true
      - text: 'A genus must contain several families.'
        rationale: |
          This reverses the two ranks. Both are close to species in the list. Check whether family or genus comes first from broad to specific.
      - text: 'Different genera must belong to different domains.'
        rationale: |
          This assumes a difference at one narrow rank forces a difference at every broad rank. Names separate groups at many levels. Check whether different genera can share a family.
      - text: 'A family and a genus are the same rank.'
        rationale: |
          This treats adjacent ranks as interchangeable. Family and genus both describe related organisms. Check their separate positions in the hierarchy.
    explanation: |
      Family is a broader rank than genus. One family can therefore include several genera, with species grouped inside those genera.
    approved: true

  - id: q-biology-taxonomy-and-classification-0008
    type: 'classify'
    difficulty: 'hard'
    stem: |
      Which version follows standard typeset binomial capitalization and italics?
    choices:
      - text: '*Homo sapiens*'
        correct: true
      - text: '*Homo Sapiens*'
        rationale: |
          This capitalizes the specific epithet as well as the genus. Both words form a formal name, which can suggest title capitals. Check that only the genus begins with a capital.
      - text: '*homo sapiens*'
        rationale: |
          This removes the capital from the genus. Lowercase is correct for the second word. Check each word’s role separately.
      - text: 'Homo sapiens'
        rationale: |
          This omits italics in typeset text. The capitalization is correct, so the name looks nearly finished. Check both capitalization and type style.
    explanation: |
      The genus begins with a capital, and the specific epithet is lowercase. Both parts are italicized, giving *Homo sapiens*.
    approved: true

  - id: q-biology-taxonomy-and-classification-0009
    type: 'compare-contrast'
    difficulty: 'hard'
    stem: |
      What cellular feature do Bacteria and Archaea share in the three-domain framework?
    choices:
      - text: 'No membrane-enclosed nucleus'
        correct: true
      - text: 'A membrane-enclosed nuclear compartment'
        rationale: |
          This applies a eukaryotic feature to prokaryotes. All cells contain genetic material, which can suggest a nucleus. Check whether the DNA is enclosed in a nuclear membrane.
      - text: 'Membership in the domain Eukarya'
        rationale: |
          This confuses being living cells with being eukaryotic. Eukarya contains many kinds of organisms. Check which domains lack a membrane-enclosed nucleus.
      - text: 'Placement in a single shared bacterial domain'
        rationale: |
          This treats their shared cell feature as proof of one domain. Both are prokaryotic. Check whether the framework still places them in separate domains.
    explanation: |
      Bacteria and Archaea are prokaryotic lineages. Their cells lack a membrane-enclosed nucleus.
    approved: true

  - id: q-biology-taxonomy-and-classification-0010
    type: 'identify'
    difficulty: 'medium'
    stem: |
      Which traditional rank lies directly between order and genus?
    choices:
      - text: 'Family'
        correct: true
      - text: 'Species'
        rationale: |
          This chooses a rank below genus. Species and genus are closely linked in naming. Check the position between order and genus.
      - text: 'Class rank'
        rationale: |
          This chooses a rank above order. Class contains orders, so it is nearby. Check whether the requested rank is narrower or broader than order.
      - text: 'Kingdom'
        rationale: |
          This chooses a much broader rank. Kingdom contains several levels of grouping. Check the two neighboring ranks specified in the stem.
    explanation: |
      The local rank sequence is order, family, genus. Family is directly below order and above genus.
    approved: true

  - id: q-biology-taxonomy-and-classification-0011
    type: 'cause-effect'
    difficulty: 'medium'
    stem: |
      Why is the epithet *sapiens* alone insufficient as the complete human species name?
    choices:
      - text: 'The genus must be included.'
        correct: true
      - text: 'The epithet must be written entirely in capitals.'
        rationale: |
          This treats capitalization as the missing information. Name formatting does matter. Check whether the problem is letter case or an absent name part.
      - text: 'Only the genus counts as a species name.'
        rationale: |
          This removes the specific epithet. The genus identifies a broader group. Check whether a species name includes both parts.
      - text: 'Scientific species names require three main words.'
        rationale: |
          This confuses a binomial with names that include extra ranks. Subspecies names may add another part. Check how many main parts a binomial species name has.
    explanation: |
      A binomial species name contains a genus and a specific epithet. The complete name is *Homo sapiens*. The epithet alone leaves out the genus.
    approved: true

  - id: q-biology-taxonomy-and-classification-0012
    type: 'classify'
    difficulty: 'medium'
    stem: |
      An organism’s cells have membrane-enclosed nuclei. Which domain contains it?
    choices:
      - text: 'Eukarya'
        correct: true
      - text: 'Bacteria'
        rationale: |
          This assigns a eukaryotic cell feature to a prokaryotic domain. Bacteria contain DNA, so a nucleus may seem possible. Check whether that DNA has a nuclear membrane.
      - text: 'Archaea'
        rationale: |
          This assigns a nucleus to the other prokaryotic domain. Archaea are distinct from bacteria, which can suggest eukaryotic cells. Check whether their cells have a membrane-enclosed nucleus.
      - text: 'Protista'
        rationale: |
          This substitutes a traditional kingdom for a domain. Many protists have nuclei. Check which rank the question asks for.
    explanation: |
      A membrane-enclosed nucleus is a eukaryotic feature. Organisms with these cells belong to Eukarya.
    approved: true

  - id: q-biology-taxonomy-and-classification-0013
    type: 'compare-contrast'
    difficulty: 'medium'
    stem: |
      Why are traditional rank labels not an exact numerical measure of evolutionary distance?
    choices:
      - text: 'Ranks are categories, not equal units of time.'
        correct: true
      - text: 'Each rank always represents an equal time interval.'
        rationale: |
          This turns conventional categories into equal time steps. The ordered list can resemble a scale. Check whether a rank has a fixed age attached to it.
      - text: 'All species within a kingdom are equally related.'
        rationale: |
          This treats a broad category as one degree of relatedness. All members share the category. Check whether some have a more recent common ancestor than others.
      - text: 'Sharing any rank proves identical DNA sequences.'
        rationale: |
          This confuses relatedness with genetic identity. Shared ranks indicate grouping. Check whether that grouping requires every DNA sequence to match.
    explanation: |
      Taxonomic ranks are categories used to organize organisms. They do not represent equal amounts of time or genetic change. Evolutionary relatedness is evaluated through common ancestry and evidence.
    approved: true

  - id: q-biology-taxonomy-and-classification-0014
    type: 'predict-outcome'
    difficulty: 'exam'
    stem: |
      New molecular evidence changes the inferred ancestry of a named organism. What may taxonomists do?
    choices:
      - text: 'Revise its classification and scientific name.'
        correct: true
      - text: 'Keep every rank and name unchanged forever.'
        rationale: |
          This treats classification as permanent. Standard names promote consistency, so permanence seems helpful. Check whether the classification can respond to new evidence.
      - text: 'Replace scientific naming with local common names.'
        rationale: |
          This confuses revising scientific classification with abandoning it. Local names can be familiar and stable. Check whether standardized rules can still support a revised name.
      - text: 'Ignore molecular evidence if appearance is similar.'
        rationale: |
          This gives appearance absolute priority. Similar-looking organisms can seem closely related. Check whether molecular evidence can reveal a different ancestry.
    explanation: |
      Classification represents hypotheses about relationships. New evidence can change those hypotheses. Taxonomists may revise the groups and the names that reflect them.
    approved: true

  - id: q-biology-taxonomy-and-classification-0015
    type: 'identify'
    difficulty: 'easy'
    stem: |
      In the traditional hierarchy, which listed rank is the most specific?
    choices:
      - text: 'Species'
        correct: true
      - text: 'Genus rank'
        rationale: |
          This chooses the group used as the first part of a species name. Genus is closely associated with species. Check whether it can contain multiple species.
      - text: 'Family rank'
        rationale: |
          This chooses a group broader than genus. A family can seem like a small group. Check its position relative to genus and species.
      - text: 'Order rank'
        rationale: |
          This chooses a group broader than family. It is below class, so it may seem narrow. Check whether narrower listed ranks still follow it.
    explanation: |
      Species is the most specific of these traditional ranks. Genus contains species, and broader ranks contain genera.
    approved: false

  - id: q-biology-taxonomy-and-classification-0016
    type: 'classify'
    difficulty: 'medium'
    stem: |
      A cell lacks a membrane-enclosed nucleus. Based only on that observation, which domain assignment is justified?
    choices:
      - text: 'Bacteria or Archaea'
        correct: true
      - text: 'Bacteria alone, with certainty'
        rationale: |
          This assumes every prokaryote is bacterial. Bacteria are familiar examples of cells without nuclei. Check whether another domain has the same feature.
      - text: 'Archaea alone, with certainty'
        rationale: |
          This assigns every cell without a nucleus to Archaea. Archaea do have that feature. Check whether bacteria also share it.
      - text: 'Eukarya alone, with certainty'
        rationale: |
          This reverses the nuclear criterion. All three domains contain cells and DNA. Check which has a membrane-enclosed nucleus.
    explanation: |
      Both Bacteria and Archaea lack a membrane-enclosed nucleus. That observation alone does not distinguish those two domains.
    approved: false

  - id: q-biology-taxonomy-and-classification-0017
    type: 'compare-contrast'
    difficulty: 'medium'
    stem: |
      Which description best captures the broader focus of systematics?
    choices:
      - text: 'Study of evolutionary relationships'
        correct: true
      - text: 'Rules for capitalizing species names alone'
        rationale: |
          This limits the field to name formatting. Naming is part of taxonomy and is closely related. Check whether the question asks for the broader study of ancestry.
      - text: 'Counting organs without considering ancestry'
        rationale: |
          This leaves ancestry out of classification evidence. Anatomy can provide useful evidence. Check whether the observations are used to infer relationships.
      - text: 'Keeping all historical groupings permanently fixed'
        rationale: |
          This treats classifications as unchangeable. Older groupings can remain familiar. Check whether new evidence is allowed to revise a relationship hypothesis.
    explanation: |
      Systematics studies evolutionary relationships. It uses evidence about ancestry to inform classification.
    approved: false

  - id: q-biology-taxonomy-and-classification-0018
    type: 'cause-effect'
    difficulty: 'hard'
    stem: |
      Two organisms look similar, but molecular evidence places them in different lineages. Which explanation can account for the resemblance?
    choices:
      - text: 'Convergent evolution'
        correct: true
      - text: 'Necessarily identical recent ancestry'
        rationale: |
          This treats resemblance as proof of a recent shared ancestor. Relatives often look alike. Check whether independent evidence supports the proposed ancestry.
      - text: 'Appearance fixing their classification forever'
        rationale: |
          This makes appearance override later evidence. Visible features are useful for classification. Check whether they can have evolved independently.
      - text: 'A shared epithet proving the same species'
        rationale: |
          This treats the second name part as a complete species identity. Epithets can look like unique labels. Check the full name and the ancestry evidence.
    explanation: |
      Similar traits can evolve separately in different lineages. This is convergent evolution. Molecular evidence can help distinguish that resemblance from a recent shared origin.
    approved: false

  - id: q-biology-taxonomy-and-classification-0019
    type: 'classify'
    difficulty: 'hard'
    stem: |
      How should the term "protist" be understood in the lesson’s modern classification discussion?
    choices:
      - text: 'An informal label for diverse eukaryotes'
        correct: true
      - text: 'A fourth domain containing all simple cells'
        rationale: |
          This elevates an informal group to a domain. Some members are small and single-celled. Check whether the term names a domain or diverse eukaryotes.
      - text: 'One settled monophyletic kingdom of all eukaryotes'
        rationale: |
          This treats the old kingdom as a settled complete lineage. Traditional lists often present it beside other kingdoms. Check what molecular evidence showed about that grouping.
      - text: 'A species name shared by all unicellular organisms'
        rationale: |
          This treats a broad informal category as one species. Some protists share a simple body form. Check whether a common label makes their full species names identical.
    explanation: |
      Protist is an informal term for diverse eukaryotes outside animals, land plants, and fungi. The old catch-all Protista kingdom is not one natural lineage.
    approved: false

  - id: q-biology-taxonomy-and-classification-0020
    type: 'predict-outcome'
    difficulty: 'exam'
    stem: |
      A classification includes domain, kingdom, phylum, class, order, family, genus, and species. A researcher adds an intermediate rank. What follows?
    choices:
      - text: 'The eight-rank list was not exhaustive.'
        correct: true
      - text: 'Adding a rank makes the species name nonbinomial.'
        rationale: |
          This confuses classification ranks with parts of a species name. Both organize how organisms are described. Check whether the change adds a rank or changes the binomial itself.
      - text: 'All existing rank relationships must be reversed.'
        rationale: |
          This assumes greater detail changes the broad-to-specific direction. A longer hierarchy can look different. Check whether the added rank simply fits between existing ones.
      - text: 'An intermediate rank creates a fourth domain.'
        rationale: |
          This confuses an intermediate category with a new highest-level group. Both are classification changes. Check where the added rank sits.
    explanation: |
      The familiar eight ranks are a useful classroom list. Real classifications may include intermediate ranks and unranked groups. Adding one does not make the shorter list exhaustive.
    approved: false
