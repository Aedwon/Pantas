meta:
  subject: science
  topic: biology
  subtopic: human-anatomy-physiology
  exams: [upcat, dlsucet, ustet, dost-sei]
questions:
  - id: q-biology-human-anatomy-physiology-0001
    type: 'process-ordering'
    difficulty: 'medium'
    stem: |
      Put these digestive organs in the correct order that food travels through: large intestine, stomach, esophagus, small intestine, mouth.
    choices:
      - text: 'Mouth, esophagus, stomach, small intestine, large intestine'
        correct: true
      - text: 'Mouth, stomach, esophagus, small intestine, large intestine'
        rationale: |
          This swaps the esophagus and stomach. Both carry food after swallowing, so their order can be confused. Check which tube connects the mouth to the stomach.
      - text: 'Mouth, esophagus, small intestine, stomach, large intestine'
        rationale: |
          This swaps the stomach and small intestine. Both carry out chemical digestion. Check which organ receives food directly from the esophagus.
      - text: 'Large intestine, small intestine, stomach, esophagus, mouth'
        rationale: |
          This reverses the food path. The same organs appear, so the list can look complete. Check that the sequence starts where food enters.
    explanation: |
      Food enters the mouth, then passes through the esophagus to the stomach. It next enters the small intestine, where most digestion and nutrient absorption occur. It then reaches the large intestine.
    approved: true

  - id: q-biology-human-anatomy-physiology-0002
    type: 'classify'
    difficulty: 'medium'
    stem: |
      Blood leaves the heart, travels to the lungs to pick up oxygen, and returns to the heart. What type of circulation is this?
    choices:
      - text: 'Pulmonary'
        correct: true
      - text: 'Systemic'
        rationale: |
          This chooses the circuit to other body tissues. Both circuits start and end at the heart. Check whether the destination is the lungs or the rest of the body.
      - text: 'Pulmonary and systemic together'
        rationale: |
          This combines both circuits for a lung-only route. The circuits work together, so both labels seem relevant. Check the specific route described.
      - text: 'Only a tissue-exchange pathway'
        rationale: |
          This names local exchange instead of the whole circuit. Gas exchange occurs in small lung vessels. Check whether the question describes just exchange or the complete heart-lung route.
    explanation: |
      Pulmonary circulation is the circuit between the heart and lungs. Blood exchanges gases in the lungs and returns to the heart.
    approved: true

  - id: q-biology-human-anatomy-physiology-0003
    type: 'classify'
    difficulty: 'medium'
    stem: |
      A person deliberately decides to kick a ball. What type of muscle control and muscle type is involved?
    choices:
      - text: 'Voluntary control, skeletal muscle'
        correct: true
      - text: 'Involuntary control, smooth muscle'
        rationale: |
          This assigns organ-wall muscle to a deliberate limb movement. Both types contract, so their jobs can be confused. Check whether the movement is consciously chosen and moves the skeleton.
      - text: 'Involuntary control, cardiac muscle'
        rationale: |
          This assigns heart muscle to a limb. Both produce movement without needing a new decision for every contraction. Check where cardiac muscle is found.
      - text: 'Voluntary control, cardiac muscle'
        rationale: |
          This assumes cardiac muscle can be directed like a limb. Both skeletal and cardiac muscle contract. Check the tissue’s location and usual control.
    explanation: |
      A deliberate, chosen movement like kicking a ball is voluntary, controlled by skeletal muscle, which is attached to bones.
    approved: true

  - id: q-biology-human-anatomy-physiology-0004
    type: 'classify'
    difficulty: 'medium'
    stem: |
      A person's heart continues beating steadily while they sleep, with no conscious effort. What type of muscle control and muscle type is involved?
    choices:
      - text: 'Involuntary cardiac muscle'
        correct: true
      - text: 'Usually voluntary skeletal muscle'
        rationale: |
          This assigns limb-muscle control to the heart. Both tissues are striated, so they can seem similar. Check the tissue’s location and usual control.
      - text: 'Involuntary smooth muscle tissue'
        rationale: |
          This assigns organ-wall smooth muscle to the heart wall. Both operate involuntarily. Check whether the pumping tissue is smooth or cardiac.
      - text: 'Usually voluntary smooth muscle'
        rationale: |
          This gives smooth muscle voluntary control. Muscle movement may seem to require a decision. Check whether this tissue normally acts without conscious choice.
    explanation: |
      Cardiac muscle forms the heart’s pumping tissue. Its rhythm starts within the heart and does not require a conscious decision. This is involuntary activity.
    approved: true

  - id: q-biology-human-anatomy-physiology-0005
    type: 'identify'
    difficulty: 'easy'
    stem: |
      Which endocrine gland is often called the body's "master gland"?
    choices:
      - text: 'Pituitary'
        correct: true
      - text: 'Thyroid gland'
        rationale: |
          This confuses regulation of metabolic rate with the traditional master-gland label. Thyroid hormones affect many tissues. Check which gland sends regulatory signals to several other glands.
      - text: 'Adrenal glands'
        rationale: |
          This confuses stress-related hormones with the master-gland label. Adrenal hormones have wide effects. Check which gland regulates several other endocrine glands.
      - text: 'Endocrine pancreas'
        rationale: |
          This confuses blood-glucose regulation with the master-gland label. Insulin and glucagon affect many cells. Check which gland has the traditional nickname.
    explanation: |
      The pituitary is traditionally called the master gland because several of its hormones regulate other endocrine glands. Its own activity is regulated by the hypothalamus and feedback signals.
    approved: true

  - id: q-biology-human-anatomy-physiology-0006
    type: 'cause-effect'
    difficulty: 'medium'
    stem: |
      Why is the traditional name "master gland" an incomplete description of the pituitary?
    choices:
      - text: 'The hypothalamus regulates it.'
        correct: true
      - text: 'It has no effect on other endocrine glands.'
        rationale: |
          This rejects all regulatory action by the pituitary. Its activity is controlled by other signals, which can make it seem powerless. Check whether being regulated prevents a gland from regulating others.
      - text: 'It releases only digestive enzymes.'
        rationale: |
          This confuses endocrine signals with digestive secretions. Some organs have both jobs. Check whether pituitary products are hormones or digestive enzymes.
      - text: 'It works independently of hormone feedback.'
        rationale: |
          This treats the nickname as proof of independent control. A master label can imply no outside regulation. Check whether feedback and the hypothalamus still act.
    explanation: |
      The hypothalamus regulates pituitary activity. Feedback signals also help control the endocrine network. The pituitary therefore does not control the system on its own.
    approved: true

  - id: q-biology-human-anatomy-physiology-0007
    type: 'identify'
    difficulty: 'medium'
    stem: |
      What are the kidney’s functional units that filter blood plasma and modify the resulting fluid?
    choices:
      - text: 'Nephrons'
        correct: true
      - text: 'Alveoli'
        rationale: |
          This confuses lung gas-exchange sacs with kidney units. Both provide exchange surfaces. Check whether the organ is exchanging gases or forming urine.
      - text: 'Capillaries'
        rationale: |
          This confuses small blood vessels with the full kidney unit. Capillaries do take part in filtration. Check whether the unit also includes tubules that modify the filtered fluid.
      - text: 'Ureters'
        rationale: |
          This confuses urine transport with urine formation. Ureters carry the kidney’s output. Check whether the structure processes blood or carries finished urine.
    explanation: |
      Nephrons are the kidney’s functional units. They filter blood plasma, then reabsorb useful substances and secrete others. These steps help form the final urine.
    approved: true

  - id: q-biology-human-anatomy-physiology-0008
    type: 'identify'
    difficulty: 'medium'
    stem: |
      What is the main waste product removed by the kidneys, produced from the breakdown of proteins?
    choices:
      - text: 'Urea'
        correct: true
      - text: 'Glucose'
        rationale: |
          This treats a useful nutrient as the main protein-related nitrogen waste. Kidneys do filter glucose. Check that useful glucose is normally reabsorbed.

      - text: 'Insulin'
        rationale: |
          This treats a hormone as the protein-related waste. Insulin is itself a protein. Check its signaling role rather than its chemical class alone.

      - text: 'Bile'
        rationale: |
          This treats a liver-produced digestive fluid as urinary nitrogen waste. The liver also makes urea. Check whether the substance enters digestion or is carried to kidneys.

    explanation: |
      Breaking down amino acids from proteins produces nitrogen that the liver converts into urea. Urea travels in the blood. The kidneys excrete some of it in urine.

    approved: true

  - id: q-biology-human-anatomy-physiology-0009
    type: 'classify'
    difficulty: 'medium'
    stem: |
      A fresh cut triggers rapid inflammation and phagocyte activity. Which immune response is described?
    choices:
      - text: 'Innate immunity'
        correct: true
      - text: 'Antigen-specific memory response'
        rationale: |
          This confuses a rapid first response with recall of a specific antigen. Memory responses can also be fast. Check whether earlier exposure or memory cells are stated.
      - text: 'Antibody secretion by plasma cells'
        rationale: |
          This substitutes a specific adaptive product for the stated inflammatory response. Antibodies fight infections too. Check which cells and actions the stem names.
      - text: 'Adaptive clonal-memory response'
        rationale: |
          This assumes speed proves adaptive memory. Repeated exposures can trigger fast adaptive responses. Check whether the described response relies on stored antigen-specific memory.
    explanation: |
      Inflammation and phagocytes are parts of innate immunity. These defenses respond quickly to injury and broad signs of infection.
    approved: true

  - id: q-biology-human-anatomy-physiology-0010
    type: 'classify'
    difficulty: 'medium'
    stem: |
      Years after recovering from a specific virus, a person is exposed to it again, and their body fights it off quickly using memory cells from the earlier infection. What type of immunity is this?
    choices:
      - text: 'Adaptive immunity'
        correct: true
      - text: 'Innate barrier defense'
        rationale: |
          This confuses rapid recall with a general physical barrier. Skin barriers act quickly too. Check whether the response depends on a specific earlier infection.
      - text: 'Innate inflammatory defense'
        rationale: |
          This uses speed alone to classify the response. Inflammation can begin quickly. Check whether antigen-specific memory cells are involved.
      - text: 'Innate antigen-specific memory'
        rationale: |
          This assigns antigen-specific memory cells to innate immunity. Innate responses can also be rapid. Check which immune arm includes memory B and T cells.
    explanation: |
      Memory B and T cells belong to adaptive immunity. After earlier exposure, they can help produce a faster, stronger response to the same antigen.
    approved: true

  - id: q-biology-human-anatomy-physiology-0011
    type: 'classify'
    difficulty: 'hard'
    stem: |
      Which feature defines an artery?
    choices:
      - text: 'It carries blood away from the heart.'
        correct: true
      - text: 'It always carries oxygen-rich blood.'
        rationale: |
          This uses oxygen level to define the vessel. Many diagrams show oxygen-rich systemic arteries. Check the flow direction rather than the color used in a diagram.
      - text: 'It always carries oxygen-poor blood.'
        rationale: |
          This also uses oxygen level to define the vessel. Pulmonary arteries carry oxygen-poor blood, which can suggest this rule. Check whether that holds for every artery.
      - text: 'It carries blood back toward the heart.'
        rationale: |
          This reverses the direction. Both vessel types connect to the heart. Check whether blood is leaving or returning.
    explanation: |
      An artery carries blood away from the heart. The definition depends on the direction of blood flow.
    approved: true

  - id: q-biology-human-anatomy-physiology-0012
    type: 'structure-function'
    difficulty: 'hard'
    stem: |
      Which statement correctly describes the source and regulation of normal heartbeat?
    choices:
      - text: 'An intrinsic pacemaker starts the rhythm.'
        correct: true
      - text: 'The brain stem starts each individual beat.'
        rationale: |
          This confuses nervous regulation with starting every beat. The brain stem helps regulate cardiovascular activity. Check whether the heart has its own rhythm source.
      - text: 'A conscious decision starts each individual beat.'
        rationale: |
          This treats heartbeat like a chosen limb movement. Some muscles do follow conscious decisions. Check whether beating continues during sleep.
      - text: 'Smooth muscle in the heart wall sets the rhythm.'
        rationale: |
          This confuses smooth and cardiac muscle. Both are involuntary. Check which tissue forms the heart’s pumping wall.
    explanation: |
      The heart has its own pacemaker that starts its rhythm. Nerves and hormones can change that rhythm. A conscious decision is not needed for each beat.
    approved: true

  - id: q-biology-human-anatomy-physiology-0013
    type: 'structure-function'
    difficulty: 'hard'
    stem: |
      Which pair correctly matches the pancreas’s digestive and endocrine outputs?
    choices:
      - text: 'Digestive enzymes; insulin'
        correct: true
      - text: 'Insulin; digestive enzymes'
        rationale: |
          This reverses the two outputs. Both are pancreatic products. Check which enters the intestine and which enters blood.
      - text: 'Bile; digestive enzymes'
        rationale: |
          This assigns bile to the pancreas and enzymes to its endocrine role. Both help digestion. Check the organ that makes bile and the route of endocrine secretion.
      - text: 'Bile; stored urine'
        rationale: |
          This mixes liver secretion and urinary storage with pancreatic roles. All concern body fluids. Check the organ and output named in each role.
    explanation: |
      The pancreas sends digestive enzymes into the small intestine. Its endocrine tissue sends hormones such as insulin into the blood. These are two different roles of the same organ.
    approved: true

  - id: q-biology-human-anatomy-physiology-0014
    type: 'identify'
    difficulty: 'hard'
    stem: |
      Which cells are the major antibody-secreting descendants of activated B cells?
    choices:
      - text: 'Plasma cells'
        correct: true
      - text: 'Memory T cells'
        rationale: |
          This confuses memory lymphocytes with antibody-secreting cells. Both are parts of adaptive immunity. Check which cell type secretes antibodies.
      - text: 'Innate phagocytes'
        rationale: |
          This confuses engulfing material with secreting antibodies. Phagocytes also defend against pathogens. Check the specific defense action described.
      - text: 'Nervous-system cells'
        rationale: |
          This confuses information signals with immune secretion. Nerve cells help coordinate body functions. Check whether the cell is an immune descendant of a B cell.
    explanation: |
      Activated B cells can develop into plasma cells. Plasma cells secrete antibodies that recognize specific targets.
    approved: true

  - id: q-biology-human-anatomy-physiology-0015
    type: 'identify'
    difficulty: 'medium'
    stem: |
      In the heart, which chambers receive blood coming into the heart?
    choices:
      - text: 'The atria (upper chambers)'
        correct: true
      - text: 'The ventricles (lower chambers)'
        rationale: |
          This chooses the chambers that pump blood out. Ventricles receive blood after it passes through atria. Check which chambers connect directly to returning veins.

      - text: 'Both the atria and ventricles equally'
        rationale: |
          This treats all chambers as equally direct entry points. Blood passes through both chamber types. Check where returning veins first connect.

      - text: 'Neither: blood enters directly into the arteries'
        rationale: |
          This reverses incoming and outgoing vessels. Arteries connect with the heart. Check that arteries carry blood away and veins return it.

    explanation: |
      Blood returning through veins enters the atria. These upper chambers receive incoming blood from the body and lungs.

    approved: true

  - id: q-biology-human-anatomy-physiology-0016
    type: 'structure-function'
    difficulty: 'easy'
    stem: |
      Where does most nutrient absorption from digested food occur?
    choices:
      - text: 'Small intestine'
        correct: true
      - text: 'Large intestine'
        rationale: |
          This confuses water absorption with most nutrient absorption. The large intestine absorbs water and electrolytes. Check which substances and which main site the question names.
      - text: 'Stomach lining'
        rationale: |
          This confuses digestion with the main absorption site. Food is mixed and digested in the stomach. Check where most nutrients enter the body.
      - text: 'Esophagus wall'
        rationale: |
          This confuses transporting food with absorbing it. Food passes through the esophagus. Check whether the organ mainly transports or absorbs.
    explanation: |
      Most digested nutrients are absorbed in the small intestine. The lesson identifies it as the main site of nutrient absorption.
    approved: false

  - id: q-biology-human-anatomy-physiology-0017
    type: 'cause-effect'
    difficulty: 'medium'
    stem: |
      How does bile help enzymes digest fat?
    choices:
      - text: 'It divides fat into smaller droplets.'
        correct: true
      - text: 'It breaks fat molecules as an enzyme.'
        rationale: |
          This confuses emulsification with enzyme action. Bile helps fat digestion, so it can seem to be an enzyme. Check whether it changes droplet size or chemically breaks molecules.
      - text: 'It converts every fat molecule into protein.'
        rationale: |
          This confuses improving fat digestion with changing fat into another nutrient. Digestion does change food molecules. Check whether bile changes the nutrient type or the droplet size.
      - text: 'It stores fat inside the gallbladder wall.'
        rationale: |
          This confuses bile storage with fat digestion. The gallbladder stores bile. Check what substance is stored and what bile does to fat.
    explanation: |
      Bile emulsifies fat, dividing it into small droplets. Smaller droplets expose more surface area to fat-digesting enzymes.
    approved: false

  - id: q-biology-human-anatomy-physiology-0018
    type: 'structure-function'
    difficulty: 'medium'
    stem: |
      Which structures exchange oxygen and carbon dioxide between inhaled air and lung capillary blood?
    choices:
      - text: 'Alveoli'
        correct: true
      - text: 'Main bronchi'
        rationale: |
          This confuses carrying air with exchanging gases with blood. Bronchi direct air through the lungs. Check where air reaches the gas-exchange surface.
      - text: 'Upper trachea'
        rationale: |
          This confuses the main airway with lung gas-exchange sacs. Air does pass through the trachea. Check whether the structure carries air or exchanges it with blood.
      - text: 'Nasal passages'
        rationale: |
          This confuses the entry path with the exchange site. Air enters through the nose. Check where oxygen actually diffuses into lung capillary blood.
    explanation: |
      Alveoli are small lung air sacs where gases diffuse between air and blood. Oxygen enters blood, and carbon dioxide moves into the air.
    approved: false

  - id: q-biology-human-anatomy-physiology-0019
    type: 'process-ordering'
    difficulty: 'hard'
    stem: |
      Which sequence shows the normal route of urine after it is formed?
    choices:
      - text: 'Kidneys, ureters, bladder, urethra'
        correct: true
      - text: 'Kidneys, urethra, bladder, ureters'
        rationale: |
          This swaps the two similar tube names. Ureter and urethra both carry urine. Check which connects kidneys to the bladder.
      - text: 'Bladder, kidneys, ureters, urethra'
        rationale: |
          This puts storage before formation. The bladder holds urine, which may make it seem like the source. Check where urine is made.
      - text: 'Kidneys, bladder, ureters, urethra'
        rationale: |
          This skips the kidney-to-bladder tubes before storage. The bladder is the next major organ. Check the tubes urine uses to reach it.
    explanation: |
      Urine leaves the kidneys through the ureters. The bladder stores it. It then passes out through the urethra.
    approved: false

  - id: q-biology-human-anatomy-physiology-0020
    type: 'compare-contrast'
    difficulty: 'exam'
    stem: |
      Which pair correctly matches the endocrine pancreatic hormones to their usual effects on blood glucose?
    choices:
      - text: 'Insulin lowers it; glucagon raises it.'
        correct: true
      - text: 'Insulin raises it; glucagon lowers it.'
        rationale: |
          This reverses the effects of the two hormones. Both come from the pancreas. Check which is associated with lowering blood glucose.
      - text: 'Both raise it after every meal.'
        rationale: |
          This gives both hormones the same effect. They both regulate the same quantity. Check whether their usual actions oppose each other.
      - text: 'Both lower it whenever food is scarce.'
        rationale: |
          This gives both hormones a glucose-lowering role. Both participate in glucose regulation. Check whether low food supply makes raising glucose useful.
    explanation: |
      Insulin generally lowers blood glucose. Glucagon generally raises it. These different effects help regulate glucose in the blood.
    approved: false
