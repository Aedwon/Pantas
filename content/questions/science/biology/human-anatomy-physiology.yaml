meta:
  subject: science
  topic: biology
  subtopic: human-anatomy-physiology
  exams: [upcat, ustet, dost-sei]
questions:
  - id: q-biology-human-anatomy-physiology-0001
    type: 'process-ordering'
    difficulty: 'medium'
    stem: |
      Put these digestive organs in the correct order that food travels through: large intestine, stomach, esophagus, small intestine, mouth.
    choices:
      - text: 'Mouth, esophagus, stomach, small intestine, large intestine'
        correct: true
      - text: 'Mouth, stomach, esophagus, small intestine, large intestine'
        rationale: |
          This swaps the esophagus and stomach. Both carry food after swallowing, so their order can be confused. Check which tube connects the mouth to the stomach.
      - text: 'Mouth, esophagus, small intestine, stomach, large intestine'
        rationale: |
          This swaps the stomach and small intestine. Both carry out chemical digestion. Check which organ receives food directly from the esophagus.
      - text: 'Large intestine, small intestine, stomach, esophagus, mouth'
        rationale: |
          This reverses the food path. The same organs appear, so the list can look complete. Check that the sequence starts where food enters.
    explanation: |
      Food enters the mouth, then passes through the esophagus to the stomach. It next enters the small intestine, where most digestion and nutrient absorption occur. It then reaches the large intestine.
    approved: true

  - id: q-biology-human-anatomy-physiology-0002
    type: 'classify'
    difficulty: 'medium'
    stem: |
      Blood leaves the heart, travels to the lungs to pick up oxygen, and returns to the heart. What type of circulation is this?
    choices:
      - text: 'Pulmonary'
        correct: true
      - text: 'Systemic'
        rationale: |
          This chooses the circuit to other body tissues. Both circuits start and end at the heart. Check whether the destination is the lungs or the rest of the body.
      - text: 'Pulmonary and systemic together'
        rationale: |
          This combines both circuits for a lung-only route. The circuits work together, so both labels seem relevant. Check the specific route described.
      - text: 'Only a tissue-exchange pathway'
        rationale: |
          This names local exchange instead of the whole circuit. Gas exchange occurs in small lung vessels. Check whether the question describes just exchange or the complete heart-lung route.
    explanation: |
      Pulmonary circulation is the circuit between the heart and lungs. Blood exchanges gases in the lungs and returns to the heart.
    approved: true

  - id: q-biology-human-anatomy-physiology-0007
    type: 'identify'
    difficulty: 'medium'
    stem: |
      What are the kidney’s functional units that filter blood plasma and modify the resulting fluid?
    choices:
      - text: 'Nephrons'
        correct: true
      - text: 'Alveoli'
        rationale: |
          This confuses lung gas-exchange sacs with kidney units. Both provide exchange surfaces. Check whether the organ is exchanging gases or forming urine.
      - text: 'Capillaries'
        rationale: |
          This confuses small blood vessels with the full kidney unit. Capillaries do take part in filtration. Check whether the unit also includes tubules that modify the filtered fluid.
      - text: 'Ureters'
        rationale: |
          This confuses urine transport with urine formation. Ureters carry the kidney’s output. Check whether the structure processes blood or carries finished urine.
    explanation: |
      Nephrons are the kidney’s functional units. They filter blood plasma, then reabsorb useful substances and secrete others. These steps help form the final urine.
    approved: true

  - id: q-biology-human-anatomy-physiology-0008
    type: 'identify'
    difficulty: 'medium'
    stem: |
      What is the main waste product removed by the kidneys, produced from the breakdown of proteins?
    choices:
      - text: 'Urea'
        correct: true
      - text: 'Glucose'
        rationale: |
          This treats a useful nutrient as the main protein-related nitrogen waste. Kidneys do filter glucose. Check that useful glucose is normally reabsorbed.

      - text: 'Insulin'
        rationale: |
          This treats a hormone as the protein-related waste. Insulin is itself a protein. Check its signaling role rather than its chemical class alone.

      - text: 'Bile'
        rationale: |
          This treats a liver-produced digestive fluid as urinary nitrogen waste. The liver also makes urea. Check whether the substance enters digestion or is carried to kidneys.

    explanation: |
      Breaking down amino acids from proteins produces nitrogen that the liver converts into urea. Urea travels in the blood. The kidneys excrete some of it in urine.

    approved: true

  - id: q-biology-human-anatomy-physiology-0011
    type: 'classify'
    difficulty: 'hard'
    stem: |
      Which feature defines an artery?
    choices:
      - text: 'It carries blood away from the heart.'
        correct: true
      - text: 'It always carries oxygen-rich blood.'
        rationale: |
          This uses oxygen level to define the vessel. Many diagrams show oxygen-rich systemic arteries. Check the flow direction rather than the color used in a diagram.
      - text: 'It always carries oxygen-poor blood.'
        rationale: |
          This also uses oxygen level to define the vessel. Pulmonary arteries carry oxygen-poor blood, which can suggest this rule. Check whether that holds for every artery.
      - text: 'It carries blood back toward the heart.'
        rationale: |
          This reverses the direction. Both vessel types connect to the heart. Check whether blood is leaving or returning.
    explanation: |
      An artery carries blood away from the heart. The definition depends on the direction of blood flow.
    approved: true

  - id: q-biology-human-anatomy-physiology-0015
    type: 'identify'
    difficulty: 'medium'
    stem: |
      In the heart, which chambers receive blood coming into the heart?
    choices:
      - text: 'The atria (upper chambers)'
        correct: true
      - text: 'The ventricles (lower chambers)'
        rationale: |
          This chooses the chambers that pump blood out. Ventricles receive blood after it passes through atria. Check which chambers connect directly to returning veins.

      - text: 'Both the atria and ventricles equally'
        rationale: |
          This treats all chambers as equally direct entry points. Blood passes through both chamber types. Check where returning veins first connect.

      - text: 'Neither: blood enters directly into the arteries'
        rationale: |
          This reverses incoming and outgoing vessels. Arteries connect with the heart. Check that arteries carry blood away and veins return it.

    explanation: |
      Blood returning through veins enters the atria. These upper chambers receive incoming blood from the body and lungs.

    approved: true

  - id: q-biology-human-anatomy-physiology-0016
    type: 'structure-function'
    difficulty: 'easy'
    stem: |
      Where does most nutrient absorption from digested food occur?
    choices:
      - text: 'Small intestine'
        correct: true
      - text: 'Large intestine'
        rationale: |
          This confuses water absorption with most nutrient absorption. The large intestine absorbs water and electrolytes. Check which substances and which main site the question names.
      - text: 'Stomach lining'
        rationale: |
          This confuses digestion with the main absorption site. Food is mixed and digested in the stomach. Check where most nutrients enter the body.
      - text: 'Esophagus wall'
        rationale: |
          This confuses transporting food with absorbing it. Food passes through the esophagus. Check whether the organ mainly transports or absorbs.
    explanation: |
      Most digested nutrients are absorbed in the small intestine. The lesson identifies it as the main site of nutrient absorption.
    approved: false

  - id: q-biology-human-anatomy-physiology-0017
    type: 'cause-effect'
    difficulty: 'medium'
    stem: |
      How does bile help enzymes digest fat?
    choices:
      - text: 'It divides fat into smaller droplets.'
        correct: true
      - text: 'It breaks fat molecules as an enzyme.'
        rationale: |
          This confuses emulsification with enzyme action. Bile helps fat digestion, so it can seem to be an enzyme. Check whether it changes droplet size or chemically breaks molecules.
      - text: 'It converts every fat molecule into protein.'
        rationale: |
          This confuses improving fat digestion with changing fat into another nutrient. Digestion does change food molecules. Check whether bile changes the nutrient type or the droplet size.
      - text: 'It stores fat inside the gallbladder wall.'
        rationale: |
          This confuses bile storage with fat digestion. The gallbladder stores bile. Check what substance is stored and what bile does to fat.
    explanation: |
      Bile emulsifies fat, dividing it into small droplets. Smaller droplets expose more surface area to fat-digesting enzymes.
    approved: false

  - id: q-biology-human-anatomy-physiology-0018
    type: 'structure-function'
    difficulty: 'medium'
    stem: |
      Which structures exchange oxygen and carbon dioxide between inhaled air and lung capillary blood?
    choices:
      - text: 'Alveoli'
        correct: true
      - text: 'Main bronchi'
        rationale: |
          This confuses carrying air with exchanging gases with blood. Bronchi direct air through the lungs. Check where air reaches the gas-exchange surface.
      - text: 'Upper trachea'
        rationale: |
          This confuses the main airway with lung gas-exchange sacs. Air does pass through the trachea. Check whether the structure carries air or exchanges it with blood.
      - text: 'Nasal passages'
        rationale: |
          This confuses the entry path with the exchange site. Air enters through the nose. Check where oxygen actually diffuses into lung capillary blood.
    explanation: |
      Alveoli are small lung air sacs where gases diffuse between air and blood. Oxygen enters blood, and carbon dioxide moves into the air.
    approved: false

  - id: q-biology-human-anatomy-physiology-0019
    type: 'process-ordering'
    difficulty: 'hard'
    stem: |
      Which sequence shows the normal route of urine after it is formed?
    choices:
      - text: 'Kidneys, ureters, bladder, urethra'
        correct: true
      - text: 'Kidneys, urethra, bladder, ureters'
        rationale: |
          This swaps the two similar tube names. Ureter and urethra both carry urine. Check which connects kidneys to the bladder.
      - text: 'Bladder, kidneys, ureters, urethra'
        rationale: |
          This puts storage before formation. The bladder holds urine, which may make it seem like the source. Check where urine is made.
      - text: 'Kidneys, bladder, ureters, urethra'
        rationale: |
          This skips the kidney-to-bladder tubes before storage. The bladder is the next major organ. Check the tubes urine uses to reach it.
    explanation: |
      Urine leaves the kidneys through the ureters. The bladder stores it. It then passes out through the urethra.
    approved: false

  - id: q-biology-human-anatomy-physiology-0021
    type: 'identify'
    difficulty: 'easy'
    stem: |
      Several kinds of tissue work together as one unit to do a particular job, such as the stomach churning food. What is this unit called?
    choices:
      - text: 'An organ'
        correct: true
      - text: 'A cell'
        rationale: |
          This picks the smallest unit of life. Every part of the body is built from cells, so a cell can seem like the answer. Check whether the unit has one kind of cell or several tissues.
      - text: 'A tissue'
        rationale: |
          This picks a group of similar cells. Tissues are the parts that the unit is built from, so they seem close. Check whether the unit combines several tissue types.
      - text: 'An organ system'
        rationale: |
          This picks a group of organs. The stomach works with other organs, so a system can seem right. Check whether the unit is one organ or several organs together.
    explanation: |
      A tissue is a group of similar cells. An organ is made of several tissues that work together as one unit. The stomach has muscle, lining, and other tissues, so it is an organ.
    approved: false

  - id: q-biology-human-anatomy-physiology-0022
    type: 'cause-effect'
    difficulty: 'medium'
    stem: |
      At rest, the diaphragm contracts and flattens during inhalation. Which change follows in the chest?
    choices:
      - text: 'The chest space gets bigger, its pressure drops, and air flows in.'
        correct: true
      - text: 'The chest space gets smaller, its pressure rises, and air flows out.'
        rationale: |
          This describes the diaphragm relaxing. Contracting and relaxing are two parts of one breath, so they are easy to swap. Check whether the muscle is contracting or relaxing.
      - text: 'The chest space gets bigger, its pressure rises, and air flows in.'
        rationale: |
          This pairs a bigger space with higher pressure. Air does flow in, so the ending seems right. Check what a bigger space does to the pressure inside it.
      - text: 'The chest space gets smaller, its pressure drops, and air flows in.'
        rationale: |
          This pairs a smaller space with lower pressure. Air does flow in, so the ending seems right. Check that air flows out when the chest space gets smaller.
    explanation: |
      When the diaphragm contracts, it flattens. The chest space gets bigger, so the pressure inside drops below the pressure outside. Air then flows into the lungs.
    approved: false

  - id: q-biology-human-anatomy-physiology-0023
    type: 'classify'
    difficulty: 'hard'
    stem: |
      In a person after birth, which vessels carry oxygen-poor blood away from the heart?
    choices:
      - text: 'The pulmonary arteries'
        correct: true
      - text: 'The pulmonary veins'
        rationale: |
          This gives the vein name to the heart-to-lung vessels because oxygen-poor blood is usually found in veins. Names depend on direction. Check whether the blood moves away from or toward the heart.
      - text: 'The systemic arteries'
        rationale: |
          These carry blood away from the heart, so they seem to fit. After birth they carry oxygen-rich blood. Check the oxygen content as well as the direction.
      - text: 'The venae cavae'
        rationale: |
          These large veins do carry oxygen-poor blood, so they seem to fit. They carry it toward the heart. Check the direction of flow.
    explanation: |
      Arteries carry blood away from the heart, and veins carry blood toward it. The pulmonary arteries take oxygen-poor blood from the heart to the lungs.
    approved: false

  - id: q-biology-human-anatomy-physiology-0024
    type: 'structure-function'
    difficulty: 'medium'
    stem: |
      The pancreas sends bicarbonate into the small intestine. What does the bicarbonate do there?
    choices:
      - text: 'It neutralizes the stomach acid that arrives with the food.'
        correct: true
      - text: 'It breaks large fat drops into tiny droplets.'
        rationale: |
          This gives the job of bile to bicarbonate. Both enter the small intestine during digestion, so they can be mixed up. Check which organ makes bile.
      - text: 'It splits starch into smaller sugar molecules.'
        rationale: |
          This treats bicarbonate as an enzyme. The pancreas also sends enzymes, so its outputs can blur together. Check whether bicarbonate neutralizes acid or splits food.
      - text: 'It stores bile until the body needs it.'
        rationale: |
          This gives the job of the gallbladder to bicarbonate. Both are linked to the gallbladder and liver, so they can be mixed. Check which organ stores bile.
    explanation: |
      Food leaves the stomach mixed with acid. The pancreas adds bicarbonate to the small intestine. Bicarbonate neutralizes the acid, so the intestine's enzymes can work.
    approved: false

  - id: q-biology-human-anatomy-physiology-0025
    type: 'identify'
    difficulty: 'easy'
    stem: |
      Which organ absorbs water and electrolytes and compacts the leftover material into feces?
    choices:
      - text: 'The large intestine'
        correct: true
      - text: 'The stomach'
        rationale: |
          This picks the organ that churns food and adds acid. It handles food early on, so it can seem to handle all of it. Check which organ comes last on the food path.
      - text: 'The esophagus'
        rationale: |
          This picks the tube that pushes food down by wave-like squeezing. Food moves through it, so it seems involved. Check whether this organ absorbs anything or only moves food.
      - text: 'The small intestine'
        rationale: |
          This picks the main site of nutrient absorption. Absorption is the right idea, so it seems to fit. Check which organ forms feces from the leftover material.
    explanation: |
      The large intestine is the last organ on the food path. It absorbs water and electrolytes from the leftover material. It then compacts what remains into feces.
    approved: false

  - id: q-biology-human-anatomy-physiology-0026
    type: 'structure-function'
    difficulty: 'medium'
    stem: |
      Why does the inner wall of the small intestine have villi?
    choices:
      - text: 'They give a very large surface for absorbing nutrients into the blood.'
        correct: true
      - text: 'They make bile, which breaks fat into tiny droplets.'
        rationale: |
          This gives the job of the liver to the villi. Both are linked to fat digestion, so they can be mixed. Check which organ makes bile.
      - text: 'They chew food into smaller pieces before it is absorbed.'
        rationale: |
          This gives the job of teeth to the villi. Both help prepare food. Check whether villi break food apart or increase surface.
      - text: 'They add acid and a protein-splitting enzyme to the food.'
        rationale: |
          This gives the job of the stomach to the villi. Both are found in digestive organs. Check which organ adds acid and begins protein digestion.
    explanation: |
      Villi are tiny finger-like folds. They make the inner wall of the small intestine much larger. A larger wall has more room to move nutrients into the blood.
    approved: false

  - id: q-biology-human-anatomy-physiology-0027
    type: 'classify'
    difficulty: 'hard'
    stem: |
      A student says the urinary system is the only system that excretes wastes. Which fact shows the student is wrong?
    choices:
      - text: 'The lungs remove carbon dioxide, which is a metabolic waste.'
        correct: true
      - text: 'The bladder stores urine before it leaves the body.'
        rationale: |
          This is true, but the bladder belongs to the urinary system. Urine is the best-known waste route, so it seems relevant. Check whether the fact names an organ outside the urinary system.
      - text: 'The nephron reabsorbs useful substances and much of the water.'
        rationale: |
          This is true, but it describes the kidney. The kidney is central to excretion, so it seems relevant. Check whether the fact names an organ outside the urinary system.
      - text: 'The ureters carry urine from the kidneys to the bladder.'
        rationale: |
          This is true, but the ureters belong to the urinary system. The urine path is easy to remember, so it seems relevant. Check whether the fact names an organ outside the urinary system.
    explanation: |
      Excretion is the removal of metabolic wastes. The urinary system is the main route, but it is not the only one. The lungs remove carbon dioxide, and the skin removes water, salts, and a little urea in sweat.
    approved: false

  - id: q-biology-human-anatomy-physiology-0028
    type: 'process-ordering'
    difficulty: 'hard'
    stem: |
      Blood returns from the body through the venae cavae. Which sequence shows its next stops before it leaves the heart through the aorta?
    choices:
      - text: 'Right atrium, right ventricle, lungs, left atrium, left ventricle'
        correct: true
      - text: 'Left atrium, left ventricle, lungs, right atrium, right ventricle'
        rationale: |
          This starts on the wrong side of the heart. The left side sends blood to the body, so it can seem to be the first stop. Check which atrium receives blood from the venae cavae.
      - text: 'Right atrium, right ventricle, left atrium, left ventricle, lungs'
        rationale: |
          This skips the lungs until the end. The four chambers are easy to list in order, so the sequence seems complete. Check where the blood picks up oxygen before the left atrium.
      - text: 'Right ventricle, right atrium, lungs, left ventricle, left atrium'
        rationale: |
          This swaps each atrium and ventricle. Both are chambers on the same side, so their order is easy to reverse. Check which chamber receives blood first.
    explanation: |
      Blood from the body enters the right atrium and moves to the right ventricle. The ventricle pumps it to the lungs. It returns to the left atrium and then the left ventricle, which pumps it into the aorta.
    approved: false

  - id: q-biology-human-anatomy-physiology-0029
    type: 'identify'
    difficulty: 'easy'
    stem: |
      Which protein in red blood cells binds most of the oxygen carried in the blood?
    choices:
      - text: 'Hemoglobin'
        correct: true
      - text: 'Urea'
        rationale: |
          This picks a waste made by the liver. Urea is in the blood, so it can seem to be a blood carrier. Check whether the substance carries oxygen or is a waste.
      - text: 'Bile'
        rationale: |
          This picks a fluid made by the liver. Bile is an important digestive fluid, so it seems familiar. Check whether the substance is found in red blood cells.
      - text: 'Salivary amylase'
        rationale: |
          This picks an enzyme that starts to split starch. It is a protein, so it can seem to fit the question. Check whether the protein binds oxygen.
    explanation: |
      Most oxygen travels inside red blood cells. It is bound to a protein called hemoglobin. The blood carries the oxygen from the lungs to the body.
    approved: false

  - id: q-biology-human-anatomy-physiology-0030
    type: 'predict-outcome'
    difficulty: 'medium'
    stem: |
      After hard exercise, blood reaches the lung capillaries with little oxygen and much carbon dioxide. How do the gases move at an alveolus?
    choices:
      - text: 'Oxygen diffuses into the blood, and carbon dioxide diffuses into the alveolar air.'
        correct: true
      - text: 'Oxygen diffuses into the alveolar air, and carbon dioxide diffuses into the blood.'
        rationale: |
          This reverses both directions. Gas exchange moves both gases, so the directions are easy to swap. Check which side has more of each gas.
      - text: 'Both gases diffuse into the blood because the capillary wall is thin.'
        rationale: |
          A thin wall helps diffusion, so this seems right. Diffusion moves each gas from where it is more concentrated. Check which side has more carbon dioxide.
      - text: 'Both gases diffuse into the alveolar air because breathing is faster.'
        rationale: |
          Faster breathing helps remove gas, so this seems right. Each gas still moves by its own difference in amount. Check which side has less oxygen.
    explanation: |
      Diffusion moves a substance from more concentrated to less concentrated. The alveolar air has more oxygen than the blood, so oxygen moves into the blood. The blood has more carbon dioxide than the alveolar air, so carbon dioxide moves out.
    approved: false
