    - dost-sei
questions:
  - id: q-biology-human-anatomy-physiology-0001
    type: process-ordering
    difficulty: medium
    stem: |
      Put these digestive organs in the correct order that food travels through: large intestine, stomach, esophagus, small intestine, mouth.
    choices:
      - text: Mouth, esophagus, stomach, small intestine, large intestine
        correct: true
      - text: Mouth, stomach, esophagus, small intestine, large intestine
      - text: Mouth, esophagus, small intestine, stomach, large intestine
      - text: Large intestine, small intestine, stomach, esophagus, mouth
    explanation: |
      Food travels: mouth (chewing begins) → esophagus (pushes food down) → stomach (mixes with acid) → small intestine (most digestion and absorption) → large intestine (absorbs water, forms waste).
    approved: true
  - id: q-biology-human-anatomy-physiology-0002
    type: classify
    difficulty: medium
    stem: |
      Blood leaves the heart, travels to the lungs to pick up oxygen, and returns to the heart. What type of circulation is this?
    choices:
      - text: Pulmonary circulation
        correct: true
      - text: Systemic circulation
      - text: Capillary circulation
      - text: 'Neither: blood does not circulate to the lungs.'
    explanation: |
      Pulmonary circulation moves blood between the heart and the lungs specifically to pick up oxygen.
    approved: true
  - id: q-biology-human-anatomy-physiology-0003
    type: classify
    difficulty: medium
    stem: |
      A person deliberately decides to kick a ball. What type of muscle control and muscle type is involved?
    choices:
      - text: Voluntary control, skeletal muscle
        correct: true
      - text: Involuntary control, smooth muscle
      - text: Involuntary control, cardiac muscle
      - text: Voluntary control, cardiac muscle
    explanation: |
      A deliberate, chosen movement like kicking a ball is voluntary, controlled by skeletal muscle, which is attached to bones.
    approved: true
  - id: q-biology-human-anatomy-physiology-0004
    type: classify
    difficulty: medium
    stem: |
      A person's heart continues beating steadily while they sleep, with no conscious effort. What type of muscle control and muscle type is involved?
    choices:
      - text: Involuntary control, cardiac muscle
        correct: true
      - text: Voluntary control, skeletal muscle
      - text: Involuntary control, smooth muscle
      - text: Voluntary control, smooth muscle
    explanation: |
      The heart beats automatically, without conscious control, powered by cardiac muscle, found only in the heart.
    approved: true
  - id: q-biology-human-anatomy-physiology-0005
    type: identify
    difficulty: easy
    stem: |
      Which endocrine gland is often called the body's "master gland"?
    choices:
      - text: The pituitary gland
        correct: true
      - text: The thyroid
      - text: The adrenal glands
      - text: The pancreas
    explanation: |
      The pituitary gland is called the "master gland" because it releases hormones that control many other glands.
    approved: true
  - id: q-biology-human-anatomy-physiology-0006
    type: cause-effect
    difficulty: medium
    stem: |
      Why is the pituitary gland often called the body's "master gland"?
    choices:
      - text: It releases hormones that control other glands, telling them when to release their own hormones.
        correct: true
      - text: It is the largest gland in the human body.
      - text: It is the only gland that releases hormones directly into the blood.
      - text: It is located in the same place as every other gland.
    explanation: |
      Unlike most glands, which act directly on body tissues, the pituitary gland manages and coordinates the activity of many other endocrine glands.
    approved: true
  - id: q-biology-human-anatomy-physiology-0007
    type: identify
    difficulty: medium
    stem: |
      What are the millions of tiny filtering units inside the kidney called?
    choices:
      - text: Nephrons
        correct: true
      - text: Alveoli
      - text: Capillaries
      - text: Ureters
    explanation: |
      Nephrons are the kidney's tiny filtering units, removing waste and excess water from the blood to form urine.
    approved: true
  - id: q-biology-human-anatomy-physiology-0008
    type: identify
    difficulty: medium
    stem: |
      What is the main waste product removed by the kidneys, produced from the breakdown of proteins?
    choices:
      - text: Urea
        correct: true
      - text: Glucose
      - text: Insulin
      - text: Bile
    explanation: |
      Urea is a waste product from protein breakdown, filtered out of the blood by the kidneys and excreted in urine.
    approved: true
  - id: q-biology-human-anatomy-physiology-0009
    type: classify
    difficulty: medium
    stem: |
      A person cuts their finger, and skin plus general immune cells respond immediately to prevent infection. What type of immunity is this?
    choices:
      - text: Innate immunity, since it is a fast, general first line of defense.
        correct: true
      - text: Adaptive immunity, since it targets one specific germ.
      - text: 'Neither: cuts do not trigger any immune response.'
      - text: Both types equally, at the exact same time.
    explanation: |
      Innate immunity is the body's fast, general first line of defense, like the skin barrier and general immune cells: it responds quickly but is not targeted at a specific germ.
    approved: true
  - id: q-biology-human-anatomy-physiology-0010
    type: classify
    difficulty: medium
    stem: |
      Years after recovering from a specific virus, a person is exposed to it again, and their body fights it off quickly using memory cells from the earlier infection. What type of immunity is this?
    choices:
      - text: Adaptive immunity, since it uses memory from a past specific infection.
        correct: true
      - text: Innate immunity, since it responds immediately.
      - text: 'Neither: memory cells are not part of the immune system.'
      - text: Both types equally, at the exact same time.
    explanation: |
      Adaptive immunity is slower to build the first time, but equips the body with long-term memory, allowing a fast, specific response on repeat exposure to the same pathogen.
    approved: true
  - id: q-biology-human-anatomy-physiology-0011
    type: classify
    difficulty: hard
    stem: |
      A student assumes arteries always carry oxygen-rich blood, since arteries are usually associated with oxygenated blood in diagrams. Is this the correct way to define arteries?
    choices:
      - text: 'No: arteries are defined by direction (carrying blood away from the heart), not by oxygen content, which actually varies between pulmonary and systemic circulation.'
        correct: true
      - text: 'Yes: arteries are defined strictly by carrying oxygen-rich blood.'
      - text: 'No: arteries are defined by carrying oxygen-poor blood instead.'
      - text: 'Yes: veins and arteries are defined identically.'
    explanation: |
      Arteries carry blood away from the heart, and veins carry blood back: this direction-based definition, not oxygen content, is what distinguishes them (pulmonary arteries, for example, actually carry oxygen-poor blood).
    approved: true
  - id: q-biology-human-anatomy-physiology-0012
    type: classify
    difficulty: hard
    stem: |
      A student assumes cardiac muscle must be voluntary, since it looks striated (striped) like skeletal muscle, which is voluntary. Is this correct?
    choices:
      - text: 'No: cardiac muscle is striated but completely involuntary; you cannot consciously stop your heart from beating.'
        correct: true
      - text: 'Yes: all striated muscle is voluntary.'
      - text: 'No: cardiac muscle is actually smooth, not striated.'
      - text: 'Yes: cardiac muscle can be controlled consciously, just like skeletal muscle.'
    explanation: |
      Both skeletal and cardiac muscle appear striated, but only skeletal muscle is voluntary. Cardiac muscle remains completely involuntary despite its striated appearance.
    approved: true
  - id: q-biology-human-anatomy-physiology-0013
    type: classify
    difficulty: hard
    stem: |
      A student assumes the pancreas belongs only to the digestive system, since it releases digestive enzymes. Is this correct?
    choices:
      - text: 'No: the pancreas also belongs to the endocrine system, releasing insulin and glucagon directly into the bloodstream.'
        correct: true
      - text: 'Yes: the pancreas belongs only to the digestive system.'
      - text: 'No: the pancreas actually belongs only to the endocrine system, not the digestive system.'
      - text: 'Yes: no organ can belong to more than one body system.'
    explanation: |
      The pancreas serves two systems: its digestive role releases enzymes into the small intestine, while its endocrine role releases insulin and glucagon directly into the blood.
    approved: true
  - id: q-biology-human-anatomy-physiology-0014
    type: classify
    difficulty: hard
    stem: |
      A student claims innate immunity has long-term memory, just like adaptive immunity. Is this correct?
    choices:
      - text: 'No: only adaptive immunity builds memory; innate immunity is always fast but never targets one specific germ and does not remember past infections.'
        correct: true
      - text: 'Yes: both innate and adaptive immunity build long-term memory equally.'
      - text: 'No: but only because innate immunity does not respond to infections at all.'
      - text: 'Yes: innate immunity is actually slower than adaptive immunity, but still remembers.'
    explanation: |
      Innate immunity trades specificity for speed and does not build memory. Adaptive immunity trades initial speed for precision and long-term memory, which is why repeat infections are fought off faster.
    approved: true
  - id: q-biology-human-anatomy-physiology-0015
    type: identify
    difficulty: medium
    stem: |
      In the heart, which chambers receive blood coming into the heart?
    choices:
      - text: The atria (upper chambers)
        correct: true
      - text: The ventricles (lower chambers)
      - text: Both the atria and ventricles equally
      - text: 'Neither: blood enters directly into the arteries'
    explanation: |
      Blood flows into the heart through the atria (upper chambers) first, then moves into the ventricles (lower chambers), which pump blood back out to the lungs or body.
    approved: true
