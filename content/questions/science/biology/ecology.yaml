meta:
  subject: science
  topic: biology
  subtopic: ecology
  exams: [ upcat, dlsucet, ustet, dost-sei ]
questions:
  - id: q-biology-ecology-0001
    type: identify
    difficulty: easy
    stem: |
      A pond, with its fish, plants, water, and mud all interacting together in one specific area, is best described as what?
    choices:
      - text: An ecosystem
        correct: true
      - text: A biome
        rationale: |
          You picked the larger grouping. A biome gathers many ecosystems that share
          a climate. One pond is a single ecosystem.
      - text: A food web
        rationale: |
          You picked a feeding diagram. A food web shows who eats whom, not the
          whole place including its water and mud.
      - text: A trophic level
        rationale: |
          You picked one step in a feeding chain. A trophic level is a position, not
          a place.
    explanation: |
      An ecosystem is a community of living things interacting with each other and their non-living environment in a specific area, like a pond.
    approved: true

  - id: q-biology-ecology-0002
    type: identify
    difficulty: easy
    stem: |
      A large-scale grouping of many ecosystems that share a similar climate and similar types of plants and animals, such as a desert or tropical rainforest, is called what?
    choices:
      - text: A biome
        correct: true
      - text: An ecosystem
        rationale: |
          You picked the smaller unit. An ecosystem is one place and its living
          things. A biome gathers many of those under one climate.
      - text: A food chain
        rationale: |
          You picked a feeding sequence. A food chain runs through organisms, not
          across climates.
      - text: A biogeochemical cycle
        rationale: |
          You picked a chemical route. A cycle moves an element around, and it is
          not a grouping of places.
    explanation: |
      A biome is a much larger-scale grouping of ecosystems that share a similar climate and similar plant and animal life, like a desert, rainforest, grassland, or tundra.
    approved: true

  - id: q-biology-ecology-0003
    type: process-ordering
    difficulty: medium
    stem: |
      Arrange these into a correct food chain, from producer to top predator: a hawk, grass, a frog, a grasshopper.
    choices:
      - text: Grass, grasshopper, frog, hawk
        correct: true
      - text: Grass, frog, grasshopper, hawk
        rationale: |
          You put the frog before the grasshopper. The frog eats the grasshopper, so
          it comes after it.
      - text: Hawk, frog, grasshopper, grass
        rationale: |
          You ran the chain backwards. It starts with the producer and ends with the
          top predator.
      - text: Grasshopper, grass, frog, hawk
        rationale: |
          You started with the grasshopper. Nothing eats grass before the
          grasshopper does, so grass is first.
    explanation: |
      Grass (producer) is eaten by the grasshopper (primary consumer), which is eaten by the frog (secondary consumer), which is eaten by the hawk (tertiary consumer).
    approved: true

  - id: q-biology-ecology-0004
    type: classify
    difficulty: medium
    stem: |
      In the food chain grass → grasshopper → frog → hawk, which trophic level does the grass occupy?
    choices:
      - text: Producer, the first trophic level
        correct: true
      - text: Primary consumer, the second trophic level
        rationale: |
          You picked the level above. A primary consumer eats the producer, and the
          grass is what gets eaten.
      - text: Secondary consumer, the third trophic level
        rationale: |
          You counted two levels too far. The grass has nothing below it in this
          chain.
      - text: Tertiary consumer, the fourth trophic level
        rationale: |
          You picked the top of the chain. The grass is at the bottom, where the
          energy enters.
    explanation: |
      Grass makes its own food through photosynthesis, making it the producer, the first trophic level in the chain.
    approved: true

  - id: q-biology-ecology-0005
    type: classify
    difficulty: medium
    stem: |
      In the food chain grass → grasshopper → frog → hawk, which trophic level does the frog occupy?
    choices:
      - text: Secondary consumer, the third trophic level
        correct: true
      - text: Producer, the first trophic level
        rationale: |
          You picked the bottom of the chain. The frog eats other animals, so it
          cannot be the producer.
      - text: Primary consumer, the second trophic level
        rationale: |
          You counted one level too low. The grasshopper is the primary consumer,
          and the frog eats it.
      - text: Tertiary consumer, the fourth trophic level
        rationale: |
          You picked the top. The hawk eats the frog, so the frog is one level
          below.
    explanation: |
      The frog eats the grasshopper (a primary consumer), making the frog a secondary consumer, the third trophic level.
    approved: true

  - id: q-biology-ecology-0006
    type: classify
    difficulty: medium
    stem: |
      In the food chain grass → grasshopper → frog → hawk, which trophic level does the hawk occupy?
    choices:
      - text: Tertiary consumer, the fourth (top) trophic level
        correct: true
      - text: Secondary consumer, the third trophic level
        rationale: |
          You counted one level too low. The frog is the secondary consumer, and the
          hawk eats the frog.
      - text: Primary consumer, the second trophic level
        rationale: |
          You counted two levels too low. The grasshopper holds that place.
      - text: Producer, the first trophic level
        rationale: |
          You picked the bottom. The hawk makes no food of its own.
    explanation: |
      The hawk eats the frog (a secondary consumer), and since nothing eats the hawk in this chain, it is the tertiary consumer, the top trophic level.
    approved: true

  - id: q-biology-ecology-0007
    type: simple-quantitative
    difficulty: medium
    stem: |
      A trophic level of producers contains 10,000 kilocalories of energy. Using the 10% rule, how much energy is passed on to the primary consumers?
    choices:
      - text: "1,000 kilocalories"
        correct: true
      - text: "100 kilocalories"
        rationale: |
          You applied the ten per cent rule twice. One step up takes one tenth, so
          it is 1,000.
      - text: "5,000 kilocalories"
        rationale: |
          You halved the energy. The rule passes on a tenth, not a half.
      - text: "9,000 kilocalories"
        rationale: |
          You gave what is lost rather than what passes on. Nine tenths is lost, and
          one tenth arrives.
    explanation: |
      The 10% rule means only 10% of energy passes to the next level: $10{,}000 \times 0.10 = 1{,}000$ kilocalories.
    approved: true

  - id: q-biology-ecology-0008
    type: simple-quantitative
    difficulty: hard
    stem: |
      A trophic level of producers contains 10,000 kilocalories of energy. Using the 10% rule, how much energy is available to the secondary consumers (two trophic levels up from producers)?
    choices:
      - text: "100 kilocalories"
        correct: true
      - text: "1,000 kilocalories"
        rationale: |
          You stopped after one step. Two steps up means a tenth of a tenth.
      - text: "1 kilocalorie"
        rationale: |
          You applied the rule three times. There are only two steps here.
      - text: "9,900 kilocalories"
        rationale: |
          You gave the energy lost rather than the energy that arrives.
    explanation: |
      Apply the 10% rule one level at a time: $10{,}000 \times 0.10 = 1{,}000$ kilocalories reach the primary consumers, then $1{,}000 \times 0.10 = 100$ kilocalories reach the secondary consumers. Multiplying by 10% only once and skipping straight to the secondary consumers is a common mistake.
    approved: true

  - id: q-biology-ecology-0009
    type: classify
    difficulty: medium
    stem: |
      A diagram shows a hawk eating both frogs and snakes, snakes eating both frogs and mice, and frogs eating both grasshoppers and crickets: many overlapping, interconnected feeding relationships. Is this best described as a food chain or a food web?
    choices:
      - text: A food web, since it shows many interconnected, overlapping food chains rather than one simple straight-line sequence.
        correct: true
      - text: A food chain, since food chains always include more than four organisms.
        rationale: |
          You called it a chain. A chain is a single line, and this diagram has
          animals eating more than one thing each.
      - text: 'Neither: this diagram does not describe feeding relationships.'
        rationale: |
          You said it shows no feeding at all, and every arrow in it is one animal
          eating another.
      - text: A biogeochemical cycle, since energy is moving between organisms.
        rationale: |
          You picked a chemical cycle. Those move an element around; this moves food
          between animals.
    explanation: |
      A food chain is a single, straight-line sequence. Once multiple predators share prey, or one predator eats several prey types, the diagram is showing a food web: the more realistic, interconnected picture.
    approved: true

  - id: q-biology-ecology-0010
    type: identify
    difficulty: medium
    stem: |
      Which biogeochemical cycle involves carbon moving between the atmosphere (as carbon dioxide), living things (through photosynthesis and respiration), and long-term storage like fossil fuels?
    choices:
      - text: The carbon cycle
        correct: true
      - text: The nitrogen cycle
        rationale: |
          You picked the cycle that runs through proteins and the air's nitrogen
          gas, not through carbon dioxide.
      - text: The phosphorus cycle
        rationale: |
          You picked the cycle with no gas stage at all. Phosphorus stays in rock,
          soil and water.
      - text: The water cycle
        rationale: |
          You picked the cycle that moves water rather than carbon.
    explanation: |
      The carbon cycle moves carbon between the atmosphere, living things, and long-term storage such as fossil fuels.
    approved: true

  - id: q-biology-ecology-0011
    type: identify
    difficulty: medium
    stem: |
      What is the term for the process, carried out mainly by certain bacteria, that converts nitrogen gas in the air into a usable form for plants?
    choices:
      - text: Nitrogen fixation
        correct: true
      - text: Photosynthesis
        rationale: |
          You picked the process that makes food from light. It uses carbon dioxide,
          not nitrogen gas.
      - text: Cellular respiration
        rationale: |
          You picked the process that releases energy from food. It has nothing to
          do with nitrogen.
      - text: Transpiration
        rationale: |
          You picked water leaving a plant's leaves.
    explanation: |
      Nitrogen fixation is carried out mainly by certain bacteria, converting atmospheric nitrogen gas into a usable form, like ammonia or nitrates, that plants can absorb.
    approved: true

  - id: q-biology-ecology-0012
    type: cause-effect
    difficulty: medium
    stem: |
      Nitrogen gas makes up about 78% of Earth's atmosphere, yet plants and animals cannot use it directly from the air. Why is nitrogen fixation a necessary step in the nitrogen cycle?
    choices:
      - text: Nitrogen gas exists in a very stable, unusable chemical form for most living things, so nitrogen-fixing bacteria must first convert it into a usable form like ammonia or nitrates before plants can absorb it.
        correct: true
      - text: Plants can already absorb nitrogen gas directly from the air without any bacterial help.
        rationale: |
          You said plants can use it straight from the air, and the question begins
          from the fact that they cannot.
      - text: Nitrogen fixation removes nitrogen from the atmosphere permanently, so it never returns to plants or animals.
        rationale: |
          You said fixation removes it permanently. It converts nitrogen into a
          usable form, and the cycle returns it.
      - text: Nitrogen gas is toxic to bacteria, so fixation exists only to protect the bacteria themselves.
        rationale: |
          You called the gas toxic. It is unreactive rather than poisonous, and that
          is exactly the problem.
    explanation: |
      Nitrogen gas is too chemically stable for most living things to use directly. Nitrogen-fixing bacteria convert it into usable forms like ammonia or nitrates, which plants absorb through their roots and pass up the food chain.
    approved: true

  - id: q-biology-ecology-0013
    type: classify
    difficulty: hard
    stem: |
      A student describes phosphorus as "evaporating into the atmosphere" as part of its biogeochemical cycle, similar to water. Is this accurate?
    choices:
      - text: 'No: unlike carbon, nitrogen, and water, the phosphorus cycle has almost no gas phase; phosphorus moves mainly through rock, soil, and water.'
        correct: true
      - text: 'Yes: phosphorus evaporates into the atmosphere just like water does.'
        rationale: |
          You accepted the evaporation step. Phosphorus has no gas stage: it moves
          through rock, soil and water instead.
      - text: 'No: but only because phosphorus does not exist in rocks or soil at all.'
        rationale: |
          You said it is not in rocks, and rock is where most of it sits.
      - text: 'Yes: all biogeochemical cycles include an atmospheric gas phase.'
        rationale: |
          You said every cycle has a gas stage. Phosphorus is the one that does not.
    explanation: |
      The phosphorus cycle is the exception among the major biogeochemical cycles: it has almost no gas phase, moving mainly through rock, soil, and water rather than the atmosphere.
    approved: true

  - id: q-biology-ecology-0014
    type: classify
    difficulty: medium
    stem: |
      A bee collects nectar from a flower for food, and in the process, pollinates the flower, helping it reproduce. Both the bee and the flower benefit. What type of symbiotic relationship is this?
    choices:
      - text: Mutualism
        correct: true
      - text: Commensalism
        rationale: |
          You picked the one where only one side gains. Both gain here: the bee gets
          food and the flower gets pollinated.
      - text: Parasitism
        rationale: |
          You picked the one where a side is harmed. Neither is harmed here.
      - text: Competition
        rationale: |
          You picked the one where both want the same resource. These two are
          trading, not competing.
    explanation: |
      Mutualism describes a relationship where both species benefit: here, the bee gets nectar and the flower gets pollinated.
    approved: true

  - id: q-biology-ecology-0015
    type: classify
    difficulty: medium
    stem: |
      A bird builds its nest in a tree, gaining shelter, while the tree is neither helped nor harmed by the bird's presence. What type of symbiotic relationship is this?
    choices:
      - text: Commensalism
        correct: true
      - text: Mutualism
        rationale: |
          You picked the one where both gain. The tree gains nothing from the nest.
      - text: Parasitism
        rationale: |
          You picked the one where a side is harmed. The tree is not harmed.
      - text: Competition
        rationale: |
          You picked the one where both want the same thing. The bird wants shelter,
          and the tree is not after it.
    explanation: |
      Commensalism describes a relationship where one species benefits (the bird gains shelter) while the other is unaffected (the tree is neither helped nor harmed).
    approved: true

  - id: q-biology-ecology-0016
    type: classify
    difficulty: medium
    stem: |
      A mosquito feeds on a human's blood, potentially spreading disease, while the human is harmed by the bite and possible infection. What type of symbiotic relationship is this?
    choices:
      - text: Parasitism
        correct: true
      - text: Mutualism
        rationale: |
          You picked the one where both gain. The person gains nothing from being
          bitten.
      - text: Commensalism
        rationale: |
          You picked the one where nobody is harmed. The bite harms the person.
      - text: Competition
        rationale: |
          You picked the one where both want the same resource. Here one is the
          resource.
    explanation: |
      Parasitism describes a relationship where the parasite (the mosquito) benefits, while the host (the human) is harmed.
    approved: true

  - id: q-biology-ecology-0017
    type: classify
    difficulty: hard
    stem: |
      A remora (a small fish) attaches to a shark to hitch a ride and pick up leftover food scraps. Careful observation shows the shark is not measurably helped or harmed by the remora's presence. A student labels this relationship "mutualism" since the remora is clearly benefiting from the shark. Is this the correct classification?
    choices:
      - text: 'No: since the shark receives no measurable benefit, this is commensalism, not mutualism; mutualism requires both species to benefit.'
        correct: true
      - text: 'Yes: any relationship where one species benefits from another is automatically mutualism.'
        rationale: |
          You called it mutualism because one side gains. Both sides have to gain,
          and the shark gains nothing measurable.
      - text: 'No: this is actually parasitism, since the remora is taking food scraps from the shark.'
        rationale: |
          You called it parasitism. The remora takes leftovers rather than anything
          the shark still needs.
      - text: 'Yes: since the shark tolerates the remora, both species must be benefiting equally.'
        rationale: |
          You read tolerance as benefit. Being unbothered is not the same as
          gaining.
    explanation: |
      Students often assume any close relationship where one species clearly benefits must be mutualism. But since the shark receives no measurable benefit and is simply unaffected, this relationship is commensalism, not mutualism.
    approved: true

  - id: q-biology-ecology-0018
    type: predict-outcome
    difficulty: exam
    stem: |
      An ecosystem's producers contain 100,000 kilocalories of energy. Applying the 10% rule at each step, and knowing energy pyramids rarely support more than four or five trophic levels, what happens to the energy available by the time it reaches the tertiary consumers (three levels up from producers)?
    choices:
      - text: Only about 100 kilocalories remain, which explains why energy pyramids are wide at the bottom and narrow at the top, and why food chains rarely extend beyond four or five levels.
        correct: true
      - text: "Exactly 10,000 kilocalories remain, since the 10% rule is applied only once regardless of how many levels are crossed."
        rationale: |
          You applied the ten per cent rule once. Three steps up means a tenth of a
          tenth of a tenth.
      - text: "All 100,000 kilocalories remain, since energy is never lost between trophic levels."
        rationale: |
          You said nothing is lost. Most of the energy is lost as heat at every
          step, which is why the chain is short.
      - text: "The energy increases at each level, since predators are more efficient than producers."
        rationale: |
          You said energy grows upward. Nothing at a higher level can hold more
          energy than the level feeding it.
    explanation: |
      Applying the 10% rule three times in a row (once per level crossed) gives $100{,}000 \times 0.10 \times 0.10 \times 0.10 = 100$ kilocalories. This dramatic, repeated energy loss is exactly why energy pyramids narrow sharply at higher levels and why food chains rarely have more than four or five levels.
    approved: true
