meta:
  subject: science
  topic: biology
  subtopic: ecology
  exams: [upcat, dlsucet, ustet, dost-sei]
questions:
  - id: q-biology-ecology-0001
    type: 'identify'
    difficulty: 'easy'
    stem: |
      A pond, with its fish, plants, water, and mud all interacting together in one specific area, is best described as what?
    choices:
      - text: 'An ecosystem'
        correct: true
      - text: 'A biome'
        rationale: |
          This confuses one interacting system with a large climate region. A pond can belong to a biome, so the names seem related. Check whether the question describes one site or many ecosystems.
      - text: 'A food web'
        rationale: |
          This reduces an ecosystem to feeding links. Fish eating plants makes a food web seem relevant. Check whether the description includes water and mud as well as feeding.
      - text: 'A trophic level'
        rationale: |
          This confuses a whole ecosystem with a feeding position. Fish and plants occupy trophic levels within the pond. Check whether the term describes a role or the entire system.
    explanation: |
      An ecosystem is a community of living things interacting with each other and their non-living environment in a specific area, like a pond.
    approved: true

  - id: q-biology-ecology-0002
    type: 'identify'
    difficulty: 'easy'
    stem: |
      A large-scale grouping of many ecosystems that share a similar climate and similar types of plants and animals, such as a desert or tropical rainforest, is called what?
    choices:
      - text: 'A biome'
        correct: true
      - text: 'An ecosystem'
        rationale: |
          This confuses one interacting system with a regional grouping. Both include living things and their environment. Check whether shared climate groups many ecosystems.
      - text: 'A food chain'
        rationale: |
          This confuses a feeding path with a climate region. Each region contains feeding relationships. Check whether the grouping is based on feeding or climate and vegetation.
      - text: 'A biogeochemical cycle'
        rationale: |
          This confuses an element cycle with a regional grouping. Elements move through every ecosystem. Check whether the description follows an element or groups ecosystems.
    explanation: |
      A biome is a much larger-scale grouping of ecosystems that share a similar climate and similar plant and animal life, like a desert, rainforest, grassland, or tundra.
    approved: true

  - id: q-biology-ecology-0003
    type: 'process-ordering'
    difficulty: 'medium'
    stem: |
      In a simplified chain, grasshoppers eat grass, frogs eat grasshoppers, and hawks eat frogs. Which sequence shows energy flow from producer to final consumer?
    choices:
      - text: 'Grass, grasshopper, frog, hawk'
        correct: true
      - text: 'Grass, frog, grasshopper, hawk'
        rationale: |
          This places a predator before its prey. Grass still comes first, so the sequence partly fits. Check each link by asking which organism supplies food to the next.
      - text: 'Hawk, frog, grasshopper, grass'
        rationale: |
          This follows predation backward. Starting with the largest predator can look like the start of the chain. Check that energy moves from food to the organism eating it.
      - text: 'Grasshopper, grass, frog, hawk'
        rationale: |
          This puts the herbivore before its food. The grasshopper is the first animal, which can seem like the starting point. Check that the producer comes before its consumer.
    explanation: |
      Grass (producer) is eaten by the grasshopper (primary consumer), which is eaten by the frog (secondary consumer), which is eaten by the hawk (tertiary consumer).
    approved: true

  - id: q-biology-ecology-0004
    type: 'classify'
    difficulty: 'medium'
    stem: |
      In the food chain grass → grasshopper → frog → hawk, which trophic level does the grass occupy?
    choices:
      - text: 'Producer, the first trophic level'
        correct: true
      - text: 'Primary consumer, the second trophic level'
        rationale: |
          This treats being eaten as being a consumer. Grass is part of a feeding chain, which can cause the mix-up. Check whether the organism makes food or eats another organism.
      - text: 'Secondary consumer, the third trophic level'
        rationale: |
          This assigns a predator level to a plant. The plant supports predators indirectly, so the roles can seem linked. Check what the organism itself eats.
      - text: 'Tertiary consumer, the fourth trophic level'
        rationale: |
          This assigns the final consumer role to the energy source. Both ends matter to the chain. Check which end receives sunlight and makes food.
    explanation: |
      Grass uses sunlight to make food. This makes it a producer at the first trophic level.
    approved: true

  - id: q-biology-ecology-0005
    type: 'classify'
    difficulty: 'medium'
    stem: |
      A pond snail feeds on algae, and a fish feeds on the snails. In this chain, what is the fish?
    choices:
      - text: 'Secondary consumer'
        correct: true
      - text: 'A primary producer'
        rationale: |
          This confuses taking in food with making food. Fish supply food to larger animals, so they can seem like producers. Check whether the organism makes organic food from light or chemicals.
      - text: 'A primary consumer'
        rationale: |
          This skips the snail between algae and fish. The fish is the first large animal, which can hide that step. Check whether it eats a producer or another consumer.
      - text: 'A tertiary consumer'
        rationale: |
          This counts the producer as a consumer. There are three organisms, so the fish can seem to be the third consumer. Check that consumer counting begins after the producer.
    explanation: |
      Algae make food. The snail eats algae and is a primary consumer. The fish eats that primary consumer, so it is a secondary consumer.
    approved: true

  - id: q-biology-ecology-0006
    type: 'compare-contrast'
    difficulty: 'medium'
    stem: |
      A bird eats both seeds from plants and insects that eat those plants. What can be concluded about its feeding roles?
    choices:
      - text: 'It can occupy different trophic levels.'
        correct: true
      - text: 'It must always be a primary consumer.'
        rationale: |
          This uses only the seed-feeding role. Seeds do come directly from producers, so that role fits part of its diet. Check every stated food source.
      - text: 'It must always be a secondary consumer.'
        rationale: |
          This uses only the insect-feeding role. Eating an herbivore does place it above a primary consumer. Check whether it also eats plant material.
      - text: 'It becomes a producer when eating seeds.'
        rationale: |
          This confuses eating plant food with producing food. Seeds contain stored food from plants. Check whether the bird makes that food or consumes it.
    explanation: |
      Eating seeds makes the bird a primary consumer. Eating plant-eating insects makes it a secondary consumer. Its feeding position depends on the food source.
    approved: true

  - id: q-biology-ecology-0007
    type: 'simple-quantitative'
    difficulty: 'medium'
    stem: |
      Assume that 10% of energy at each trophic level transfers to the next. Producers have 10,000 kilocalories available. How much transfers to primary consumers?
    choices:
      - text: '1,000 kilocalories'
        correct: true
      - text: '100 kilocalories'
        rationale: |
          This applies the transfer factor twice. Two steps would give this amount, which can seem reasonable for animals above plants. Check how many feeding steps the question names.
      - text: '5,000 kilocalories'
        rationale: |
          This transfers half the energy. Sharing energy between levels can suggest an equal split. Check the stated percentage before calculating.
      - text: '9,000 kilocalories'
        rationale: |
          This finds the 90% that does not transfer. Subtracting a loss from the total can make this number seem relevant. Check whether the question asks for energy transferred or energy left behind.
    explanation: |
      Primary consumers are one feeding step above producers. With the stated assumption, multiply once: $10{,}000 \times 0.10 = 1{,}000$ kilocalories.
    approved: true

  - id: q-biology-ecology-0008
    type: 'simple-quantitative'
    difficulty: 'hard'
    stem: |
      Assume that 10% of energy transfers at each feeding step. Secondary consumers receive 100 kilocalories. How much energy was available to the producers two steps earlier?
    choices:
      - text: '10,000 kilocalories'
        correct: true
      - text: '1,000 kilocalories'
        rationale: |
          This works backward through only one transfer. It correctly undoes one 10% step. Check the number of steps from producers to secondary consumers.
      - text: '1 kilocalorie'
        rationale: |
          This multiplies twice while moving backward. Multiplying by 10% works when moving toward higher consumers. Check the direction before choosing multiplication or division.
      - text: '1,000,000 kilocalories'
        rationale: |
          This divides by 1% twice instead of 10% twice. Both percentages can look like small transfer rates. Check the stated rate before undoing each transfer.
    explanation: |
      Work backward through two transfers. Divide by $0.10$ to get $1{,}000$ kilocalories at primary consumers. Divide by $0.10$ again to get $10{,}000$ kilocalories at producers.
    approved: true

  - id: q-biology-ecology-0009
    type: 'classify'
    difficulty: 'medium'
    stem: |
      A feeding diagram links several predators to shared prey, and some predators eat several prey species. Which feature makes the diagram a food web?
    choices:
      - text: 'Several feeding paths connect.'
        correct: true
      - text: 'Only one feeding path is shown.'
        rationale: |
          This treats a network as a single chain. Any one route through the diagram looks like a chain. Check whether other routes branch from it.
      - text: 'All organisms have the same diet.'
        rationale: |
          This confuses shared prey with identical diets. Predators may share some prey without eating every same species. Check all links for each predator.
      - text: 'Energy returns from predators to plants.'
        rationale: |
          This confuses cycling matter with energy flow. Both move through organisms, so they can seem to follow the same pattern. Check whether arrows show food going to its consumer.
    explanation: |
      A food web connects many feeding paths. Shared prey and multiple food sources join those paths into one network.
    approved: true

  - id: q-biology-ecology-0010
    type: 'identify'
    difficulty: 'medium'
    stem: |
      Which biogeochemical cycle involves carbon moving between the atmosphere (as carbon dioxide), living things (through photosynthesis and respiration), and long-term storage like fossil fuels?
    choices:
      - text: 'The carbon cycle'
        correct: true
      - text: 'The nitrogen cycle'
        rationale: |
          This substitutes nitrogen for carbon. Both cycles involve organisms and the atmosphere. Check which element is present in carbon dioxide.
      - text: 'The phosphorus cycle'
        rationale: |
          This substitutes phosphorus for carbon. Both can be stored in rocks and living things. Check which cycle includes carbon dioxide and fossil carbon.
      - text: 'The water cycle'
        rationale: |
          This substitutes water movement for carbon movement. Water is involved in photosynthesis, so the processes seem connected. Check which substance the question follows.
    explanation: |
      The carbon cycle moves carbon between the atmosphere, living things, and long-term storage such as fossil fuels.
    approved: true

  - id: q-biology-ecology-0011
    type: 'identify'
    difficulty: 'medium'
    stem: |
      Which microbial process converts atmospheric nitrogen gas directly into ammonia?
    choices:
      - text: 'Nitrogen fixation'
        correct: true
      - text: 'Nitrification'
        rationale: |
          This mixes fixation with the later conversion of ammonium into nitrite and nitrate. Both make nitrogen available in soil. Check the starting substance and direct product.
      - text: 'Denitrification'
        rationale: |
          This reverses the movement of nitrogen between soil and air. Both processes involve nitrogen gas. Check whether gas is being used or returned to the air.
      - text: 'Nitrogen assimilation'
        rationale: |
          This confuses making a usable nitrogen compound with taking it into an organism. Both help nitrogen enter living things. Check whether the step changes nitrogen gas or absorbs an existing compound.
    explanation: |
      Nitrogen fixation changes nitrogen gas, $N_2$, into ammonia, $NH_3$. This supplies nitrogen in a form that organisms can use.
    approved: true

  - id: q-biology-ecology-0012
    type: 'cause-effect'
    difficulty: 'medium'
    stem: |
      Why does biological nitrogen fixation help most plants obtain nitrogen?
    choices:
      - text: 'It fixes nitrogen gas as ammonia.'
        correct: true
      - text: 'It converts nitrate into nitrogen gas.'
        rationale: |
          This confuses fixation with denitrification. Both change nitrogen between gas and soil compounds. Check whether the process makes nitrogen available or sends it back to the air.
      - text: 'It converts ammonium directly into nitrate.'
        rationale: |
          This confuses fixation with nitrification. Nitrate is useful to plants, so this later step seems like fixation. Check whether the starting material is nitrogen gas or ammonium.
      - text: 'It converts carbon dioxide into plant sugar.'
        rationale: |
          This confuses nitrogen supply with food production. Plants need both nitrogen and sugar to grow. Check which element the named process changes.
    explanation: |
      Most plants cannot use nitrogen gas directly because its atoms are joined by a strong bond. Nitrogen-fixing microbes change it into ammonia. This nitrogen can enter plants or undergo further changes in soil.
    approved: true

  - id: q-biology-ecology-0013
    type: 'classify'
    difficulty: 'hard'
    stem: |
      Which statement best describes the main reservoirs in the phosphorus cycle?
    choices:
      - text: 'Rock, soil, and water hold its main stores.'
        correct: true
      - text: 'Atmospheric phosphorus gas holds its main store.'
        rationale: |
          This gives phosphorus a large gas reservoir like nitrogen. Comparing element cycles can make that pattern seem universal. Check whether this cycle has a major gas phase.
      - text: 'Living organisms hold its only major store.'
        rationale: |
          This ignores stores outside living things. Phosphorus is needed by cells, so organisms seem central. Check where it is stored before organisms absorb it.
      - text: 'Ocean water holds its only major store.'
        rationale: |
          This leaves out rocks and soils. Water carries phosphorus, so oceans seem like the whole reservoir. Check both land and water stores.
    explanation: |
      Phosphorus mainly moves through rocks, soil, water, and living things. Its cycle has no major atmospheric gas reservoir.
    approved: true

  - id: q-biology-ecology-0014
    type: 'classify'
    difficulty: 'medium'
    stem: |
      A bee collects nectar from a flower for food, and in the process, pollinates the flower, helping it reproduce. Both the bee and the flower benefit. What type of symbiotic relationship is this?
    choices:
      - text: 'Mutualism'
        correct: true
      - text: 'Commensalism'
        rationale: |
          This treats one partner as unaffected. The bee gets food, so its benefit is easy to notice first. Check the stated effect on both species.
      - text: 'Parasitism'
        rationale: |
          This treats the flower as harmed. Taking nectar may look like taking something from a host. Check whether pollination gives the flower a benefit.
      - text: 'Competition'
        rationale: |
          This treats the two partners as rivals for a resource. Their use of the same flower can suggest competition. Check whether both seek the same limited resource or gain different benefits.
    explanation: |
      Mutualism describes a relationship where both species benefit: here, the bee gets nectar and the flower gets pollinated.
    approved: true

  - id: q-biology-ecology-0015
    type: 'classify'
    difficulty: 'medium'
    stem: |
      A bird builds its nest in a tree, gaining shelter, while the tree is neither helped nor harmed by the bird's presence. What type of symbiotic relationship is this?
    choices:
      - text: 'Commensal (+,0)'
        correct: true
      - text: 'Mutualism (+,+)'
        rationale: |
          This assumes shelter for the bird also benefits the tree. A close relationship can look like a shared gain. Check for a stated benefit to each partner.
      - text: 'Parasitism (+,-)'
        rationale: |
          This assumes the nest harms the tree. An organism living on another can suggest parasitism. Check the stated effect on the tree.
      - text: 'Competition (-,-)'
        rationale: |
          This assumes sharing space means competing. The bird and tree occur in the same place. Check whether both seek the same limited resource.
    explanation: |
      Commensalism describes a relationship where one species benefits (the bird gains shelter) while the other is unaffected (the tree is neither helped nor harmed).
    approved: true

  - id: q-biology-ecology-0016
    type: 'classify'
    difficulty: 'medium'
    stem: |
      A mosquito feeds on a human's blood, potentially spreading disease, while the human is harmed by the bite and possible infection. What type of symbiotic relationship is this?
    choices:
      - text: 'Parasitism'
        correct: true
      - text: 'Mutualism'
        rationale: |
          This assumes both species gain from the interaction. Close contact can be mistaken for cooperation. Check whether a benefit is stated for the human.
      - text: 'Commensalism'
        rationale: |
          This treats the host as unaffected. The mosquito benefits, which fits part of this category. Check whether the host is harmed.
      - text: 'Competition'
        rationale: |
          This confuses feeding on a host with competing for a resource. Both interactions can cause harm. Check whether the species are rivals or one feeds from the other.
    explanation: |
      Parasitism describes a relationship where the parasite (the mosquito) benefits, while the host (the human) is harmed.
    approved: true

  - id: q-biology-ecology-0017
    type: 'classify'
    difficulty: 'hard'
    stem: |
      A remora gains transport and food scraps from a shark. Measurements show no detectable net effect on the shark. How should this relationship be classified under that evidence?
    choices:
      - text: 'Commensal (+,0)'
        correct: true
      - text: 'Mutualism (+,+)'
        rationale: |
          This counts one benefit as a benefit to both partners. The remora clearly gains, which can make the whole relationship seem beneficial. Check the measured effect on the shark.
      - text: 'Parasitism (+,-)'
        rationale: |
          This assumes taking scraps harms the shark. Getting food from another animal can look parasitic. Check whether harm was actually found.
      - text: 'Competition (-,-)'
        rationale: |
          This assumes the species compete for the same food. Food scraps can suggest a shared resource. Check whether the evidence shows a cost from competition.
    explanation: |
      The remora benefits, and the shark has no detectable net gain or harm. This pattern, one benefit and one neutral effect, is commensalism.
    approved: true

  - id: q-biology-ecology-0018
    type: 'predict-outcome'
    difficulty: 'exam'
    stem: |
      Assume a 10% energy transfer at each feeding step. Producers have 100,000 kilocalories available. How much reaches tertiary consumers?
    choices:
      - text: '100 kilocalories'
        correct: true
      - text: '10,000 kilocalories'
        rationale: |
          This applies the factor once. One step from producers does give this amount. Check how many steps reach tertiary consumers.
      - text: '100,000 kilocalories'
        rationale: |
          This assumes all producer energy transfers. Energy is conserved overall, which can make full transfer seem reasonable. Check whether energy used or lost as heat remains available as food.
      - text: '1,000 kilocalories'
        rationale: |
          This applies the factor twice. It correctly reaches secondary consumers. Check the difference between secondary and tertiary.
    explanation: |
      Tertiary consumers are three steps above producers. Apply the stated transfer factor three times: $100{,}000 \times 0.10 \times 0.10 \times 0.10 = 100$ kilocalories.
    approved: true

  - id: q-biology-ecology-0019
    type: 'structure-function'
    difficulty: 'medium'
    stem: |
      Which role do decomposers serve in an ecosystem?
    choices:
      - text: 'They return nutrients from dead matter.'
        correct: true
      - text: 'They return heat to producers as food.'
        rationale: |
          This confuses nutrient recycling with energy recycling. Both nutrients and energy pass through decomposers. Check whether heat can be reused as food energy by producers.
      - text: 'They create nitrogen atoms from sunlight.'
        rationale: |
          This confuses recycling elements with creating them. Microbes can change nitrogen compounds, which may seem like making nitrogen. Check whether atoms are rearranged or created.
      - text: 'They stop nutrient movement through soil.'
        rationale: |
          This confuses breaking down matter with locking nutrients away. Dead material may appear inactive. Check whether decomposition releases nutrients into the environment.
    explanation: |
      Decomposers break down dead organisms and wastes. This releases nutrients that can move through the environment and be used again.
    approved: false

  - id: q-biology-ecology-0020
    type: 'process-ordering'
    difficulty: 'exam'
    stem: |
      Which sequence follows nitrogen from atmospheric gas to nitrate in soil?
    choices:
      - text: 'Fixation, then nitrification'
        correct: true
      - text: 'Nitrification, then fixation'
        rationale: |
          This reverses the two microbial steps. Both produce forms plants can use. Check which process starts with nitrogen gas.
      - text: 'Denitrification, then assimilation'
        rationale: |
          This starts with returning nitrogen gas to the air. Both names belong to the nitrogen cycle. Check the direction named in the question.
      - text: 'Assimilation, then denitrification'
        rationale: |
          This starts with uptake into living matter. Plants use nitrate, so assimilation sounds relevant. Check which steps produce nitrate before it is absorbed.
    explanation: |
      Fixation changes nitrogen gas into ammonia, which can become ammonium in soil water. Nitrification then changes ammonium into nitrite and nitrate.
    approved: false
