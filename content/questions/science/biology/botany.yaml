meta:
  subject: "science"
  topic: "biology"
  subtopic: "botany"
  exams: ["upcat", "dlsucet", "ustet", "dost-sei"]
questions:
  - id: q-biology-botany-0001
    type: "identify"
    difficulty: "easy"
    stem: |
      Which plant tissue forms the outer covering, protecting the plant and controlling gas exchange and water loss?
    choices:
      - text: "Dermal tissue"
        correct: true
      - text: "Vascular tissue"
        rationale: |
          This confuses transport with surface protection. Vascular tissue moves materials the plant needs, so it can seem protective. Check whether the question asks about the outside covering or internal transport.
      - text: "Ground tissue"
        rationale: |
          This confuses the inside tissue with the outside covering. Ground tissue supports much of the plant, which can sound like protection. Check where the tissue is located.
      - text: "Xylem"
        rationale: |
          This confuses water transport with control of water loss. Xylem carries water, so it seems related to water balance. Check whether water is being carried inside or lost at the surface.
    explanation: |
      Dermal tissue covers the outside of a plant. It protects the plant and helps control gas exchange and water loss.
    approved: true

  - id: q-biology-botany-0002
    type: "identify"
    difficulty: "easy"
    stem: |
      Which vascular tissue carries water and minerals upward from the roots to the rest of the plant?
    choices:
      - text: "Xylem"
        correct: true
      - text: "Phloem"
        rationale: |
          This swaps the two vascular tissues. Phloem carries dissolved food, which can sound like the same transport job. Check whether the material being carried is sugar or water.
      - text: "Dermal tissue"
        rationale: |
          This confuses controlling water loss with carrying water. Dermal tissue helps limit water loss at the surface. Check whether the question asks about a covering or a transport path.
      - text: "Ground tissue"
        rationale: |
          This confuses storing materials with moving them between organs. Ground tissue can store water and food, so it seems related. Check whether the task is storage or long-distance transport.
    explanation: |
      Xylem carries water and dissolved minerals from the roots through the plant. The main water stream moves toward the leaves.
    approved: true

  - id: q-biology-botany-0003
    type: "identify"
    difficulty: "medium"
    stem: |
      Which vascular tissue carries sugars made through photosynthesis to wherever the plant needs energy or storage?
    choices:
      - text: "Phloem"
        correct: true
      - text: "Xylem"
        rationale: |
          This swaps sugar transport with water transport. Xylem is a vascular tissue too, so the names are easy to mix up. Check which material each tissue carries.
      - text: "Dermal tissue"
        rationale: |
          This confuses exchange at the surface with transport through the plant. Dermal tissue controls gas exchange, which plants need to make sugar. Check whether the question asks about exchanging gases or carrying sugar.
      - text: "Ground tissue"
        rationale: |
          This confuses making or storing sugar with distributing it. Ground tissue can do photosynthesis and store food. Check whether the sugar must move to a different organ.
    explanation: |
      Phloem carries sugars from a source to a sink. A source makes or releases sugar. A sink uses or stores it.
    approved: true

  - id: q-biology-botany-0004
    type: "classify"
    difficulty: "medium"
    stem: |
      Which plant tissue makes up most of a plant's body, filling the space between dermal and vascular tissue, and handles photosynthesis, storage, and support?
    choices:
      - text: "Ground tissue"
        correct: true
      - text: "Dermal tissue"
        rationale: |
          This confuses the covering with the tissue inside it. Dermal tissue is found around the plant body, so it can seem to cover all its needs. Check whether the question asks about the surface or the space inside.
      - text: "Xylem"
        rationale: |
          This confuses a supporting transport tissue with the whole tissue system described. Xylem helps support a plant while carrying water. Check whether the tissue also handles photosynthesis and storage.
      - text: "Phloem"
        rationale: |
          This confuses sugar transport with sugar storage. Phloem carries sugars to storage areas, so it seems related. Check whether the tissue carries food or forms the storage area.
    explanation: |
      Ground tissue fills much of the space inside a plant. Depending on its location, it makes food, stores materials, or supports the plant.
    approved: true

  - id: q-biology-botany-0005
    type: "classify"
    difficulty: "medium"
    stem: |
      A gardener notices a plant's stem transporting water from its roots to its topmost leaves, while a separate set of cells in the same stem transports sugar made in the leaves down toward the roots. Which tissue transports the water, and which transports the sugar?
    choices:
      - text: "Xylem carries water; phloem carries sugar."
        correct: true
      - text: "Phloem carries water; xylem carries sugar."
        rationale: |
          This reverses the jobs of the vascular tissues. Both carry dissolved materials, so swapping their names can seem harmless. Check the substance before choosing the tissue.
      - text: "Xylem carries both water and sugar in the stem."
        rationale: |
          This assigns both transport jobs to xylem. Its water stream makes it seem able to carry all plant supplies. Check which tissue distributes sugar from sources to sinks.
      - text: "Ground tissue carries both water and sugar."
        rationale: |
          This assigns long-distance transport to ground tissue. Ground tissue stores food and water, so it seems to handle both. Check whether the question describes storage or flow through the stem.
    explanation: |
      Xylem carries the water and dissolved minerals from the roots. Phloem carries sugar from the mature leaves, which are sources, to the roots, which are sinks.
    approved: true

  - id: q-biology-botany-0006
    type: "classify"
    difficulty: "hard"
    stem: |
      Which comparison of the main conducting cells at maturity is correct?
    choices:
      - text: "Xylem conductors are dead; phloem conductors live."
        correct: true
      - text: "Xylem conductors live; phloem conductors are dead."
        rationale: |
          This reverses which conducting cells stay alive. Water and sugar both move through tubes, so their cells can seem alike. Check the mature cell type in each tissue.
      - text: "Conducting cells in both xylem and phloem stay alive."
        rationale: |
          This extends the living state of phloem to xylem conductors. Both belong to vascular tissue, so they may seem to share this feature. Check conducting cells separately from other cells in the tissue.
      - text: "Conducting cells in both xylem and phloem are dead."
        rationale: |
          This extends the dead state of xylem conductors to phloem. Both carry materials through the plant, so hollow dead tubes seem possible for both. Check whether phloem conducting cells remain living.
    explanation: |
      The main water-conducting xylem cells are dead at maturity. Phloem conducting cells remain alive and work with companion cells.
    approved: true

  - id: q-biology-botany-0007
    type: "identify"
    difficulty: "medium"
    stem: |
      What term describes a plant's directional growth response to light?
    choices:
      - text: "Phototropism"
        correct: true
      - text: "Gravitropism"
        rationale: |
          This confuses the light stimulus with gravity. A shoot often grows upward toward light, so both responses can appear together. Check what stimulus the question names.
      - text: "Thigmotropism"
        rationale: |
          This confuses light with touch. Both can cause a plant to bend as it grows. Check whether the plant responds to light or physical contact.
      - text: "Negative gravitropism"
        rationale: |
          This uses a gravity response for a light response. Growing away from something makes the negative label sound useful. Check the stimulus before choosing positive or negative.
    explanation: |
      Phototropism is directional growth in response to light. The direction can be toward or away from the light.
    approved: true

  - id: q-biology-botany-0008
    type: "identify"
    difficulty: "medium"
    stem: |
      What term describes a plant's directional growth response to gravity?
    choices:
      - text: "Gravitropism"
        correct: true
      - text: "Phototropism"
        rationale: |
          This confuses light with gravity. Shoots often grow upward and toward light, so the two responses can look similar. Check which stimulus is named.
      - text: "Thigmotropism"
        rationale: |
          This confuses touch with gravity. Contact with soil may seem to cause root growth downward. Check whether the response is to contact or to the direction of gravity.
      - text: "Negative phototropism"
        rationale: |
          This treats growth away from light as a gravity response. Both can describe a direction of growth. Check the stimulus before the direction label.
    explanation: |
      Gravitropism is directional growth in response to gravity. Roots typically grow with gravity, while shoots typically grow against it.
    approved: true

  - id: q-biology-botany-0009
    type: "classify"
    difficulty: "medium"
    stem: |
      A climbing vine's tendrils are observed curling tightly around a fence post after making physical contact with it. What tropism does this demonstrate?
    choices:
      - text: "Positive thigmotropism, a growth response to touch"
        correct: true
      - text: "Positive phototropism, a growth response to light"
        rationale: |
          This confuses climbing toward light with responding to touch. A vine often climbs into brighter areas, so light seems relevant. Check which event starts the curling.
      - text: "Negative gravitropism, a growth response to gravity"
        rationale: |
          This confuses upward climbing with growth away from gravity. A fence post supports upward growth, so gravity seems relevant. Check whether the tendril curls after contact.
      - text: "Negative thigmotropism, a growth response to touch"
        rationale: |
          This reverses the direction of the touch response. Curling can look like a movement away on one side of the tendril. Check whether the overall growth wraps toward the support.
    explanation: |
      Touch is the stimulus, so this is thigmotropism. The tendril grows toward and around the support, making the response positive.
    approved: true

  - id: q-biology-botany-0010
    type: "classify"
    difficulty: "medium"
    stem: |
      A plant's stem is observed bending and growing toward a nearby window, in the direction of the incoming light. What is this tropic response called?
    choices:
      - text: "Positive phototropism"
        correct: true
      - text: "Negative phototropism"
        rationale: |
          This reverses the direction label. Bending can seem like turning away from the original position. Check direction relative to the light, not the old stem position.
      - text: "Positive gravitropism"
        rationale: |
          This confuses growth toward light with growth with gravity. Light near a window may come from above or below. Check which stimulus the stem is described as following.
      - text: "Negative gravitropism"
        rationale: |
          This substitutes growth against gravity for growth toward light. Shoots often do both, so the label can seem right. Check which stimulus this observation tests.
    explanation: |
      The stem grows toward the light. Growth toward a stimulus is positive, and a response to light is phototropism.
    approved: true

  - id: q-biology-botany-0011
    type: "classify"
    difficulty: "medium"
    stem: |
      In an experiment, the direction of side lighting is reversed while gravity stays unchanged. A root changes its growth direction to bend away from the new light source. What response to light does this observation demonstrate?
    choices:
      - text: "Negative phototropism"
        correct: true
      - text: "Positive phototropism"
        rationale: |
          This reverses the direction label. The root reacts to light, which can make positive sound like the natural label. Check whether it grows toward or away from the light.
      - text: "Positive gravitropism"
        rationale: |
          This substitutes a gravity response for the observed light response. Roots commonly grow with gravity, so the label is familiar. Check which condition changed in the experiment.
      - text: "Negative gravitropism"
        rationale: |
          This confuses growth away from light with growth away from gravity. The word negative seems to fit either. Check which stimulus the root is moving away from.
    explanation: |
      The root changes its growth direction away from the light. A growth response to light is phototropism. Growth away from that stimulus is negative.
    approved: true

  - id: q-biology-botany-0012
    type: "classify"
    difficulty: "hard"
    stem: |
      A student observes a stem growing toward a light source and concludes that the plant's roots must also grow toward the light, since it is "the same plant responding to the same stimulus." Is this reasoning correct?
    choices:
      - text: "No; root responses to light vary."
        correct: true
      - text: "Yes; every organ must respond identically to light."
        rationale: |
          This assumes all plant organs have the same response. They share one plant body, so a shared response seems likely. Check whether observations of shoots also establish the root response.
      - text: "No; every root must always grow away from light."
        rationale: |
          This turns a common shoot response into a fixed opposite root response. Roots and shoots often grow in different directions, so that rule seems useful. Check whether root light responses can vary.
      - text: "No; roots are completely unable to respond to light."
        rationale: |
          This confuses lack of evidence with lack of any response. Roots often grow underground, so light can seem irrelevant to them. Check whether roots can respond under different conditions.
    explanation: |
      A shoot commonly grows toward light. Root responses to light vary with the species and conditions. The shoot response alone cannot tell us how the roots will grow.
    approved: true

  - id: q-biology-botany-0013
    type: "identify"
    difficulty: "medium"
    stem: |
      What is the transfer of pollen from an anther to the stigma of a flower of the same species called?
    choices:
      - text: "Pollination"
        correct: true
      - text: "Fertilization"
        rationale: |
          This confuses pollen transfer with sperm joining an egg. Both are steps in sexual reproduction, so they can seem like one event. Check whether gametes have joined.
      - text: "Pollen-tube growth"
        rationale: |
          This confuses landing on the stigma with growing a tube afterward. Both involve pollen, so the events can blend together. Check whether the stem describes transfer or growth.
      - text: "Seed formation"
        rationale: |
          This confuses pollen transfer with the later formation of a seed. Pollination can lead to seeds, so the final result seems to name the event. Check which stage is actually described.
    explanation: |
      Pollination transfers pollen from an anther to a stigma of a flower of the same species. The transfer can occur within one plant or between plants.
    approved: true

  - id: q-biology-botany-0014
    type: "identify"
    difficulty: "medium"
    stem: |
      What is the term for a male sex cell from pollen joining with a female egg cell inside a flower's ovule, forming a zygote?
    choices:
      - text: "Fertilization"
        correct: true
      - text: "Pollination"
        rationale: |
          This confuses pollen transfer with gamete fusion. Pollination starts the route to fertilization, so it seems to name the whole process. Check whether sperm and egg have joined.
      - text: "Pollen-tube growth"
        rationale: |
          This confuses sperm delivery with sperm joining the egg. The pollen tube brings sperm to the ovule, so its growth seems like the final step. Check whether the event is transport or fusion.
      - text: "Seed formation"
        rationale: |
          This confuses the first new cell with the later seed. Both follow successful sexual reproduction, so the stages seem interchangeable. Check whether the question names a zygote or a seed.
    explanation: |
      Fertilization is the joining of a sperm cell with an egg cell. This forms a zygote, the first cell of the new plant.
    approved: true

  - id: q-biology-botany-0015
    type: "classify"
    difficulty: "hard"
    stem: |
      A bee deposits pollen on the stigma of a flower of the same species. No gamete fusion is observed. Which reproductive event has been directly observed?
    choices:
      - text: "Pollination only"
        correct: true
      - text: "Fertilization only"
        rationale: |
          This treats pollen contact as gamete fusion. Both involve male reproductive material reaching a flower. Check whether the observation reports sperm joining an egg.
      - text: "Pollination and fertilization"
        rationale: |
          This assumes pollen transfer proves later gamete fusion. Fertilization often follows pollination, so the link seems automatic. Check whether both events were observed.
      - text: "Pollen-tube growth only"
        rationale: |
          This treats all pollen movement as pollen-tube growth. A tube does grow after pollen reaches a suitable stigma. Check whether pollen was carried onto the stigma or grew within the flower.
    explanation: |
      Pollen being placed on a stigma is pollination. That transfer is the event described in this observation.
    approved: true

  - id: q-biology-botany-0016
    type: "predict-outcome"
    difficulty: "exam"
    stem: |
      A typical seedling is placed sideways in a pot under uniform lighting. As it grows, which root and shoot directions are expected in response to gravity?
    choices:
      - text: "Root down; shoot up."
        correct: true
      - text: "Root down; shoot down."
        rationale: |
          This gives shoots the same gravity response as roots. The two parts share a starting position, so matching directions seem likely. Check each organ's typical response separately.
      - text: "Root up; shoot upward."
        rationale: |
          This gives roots the same gravity response as shoots. Upward shoot growth is easy to see, so it can seem to describe the whole seedling. Check where roots typically grow.
      - text: "Root up; shoot downward."
        rationale: |
          This reverses the typical gravity responses. Roots and shoots do grow in opposite directions, so half of the pattern seems right. Check which organ grows with gravity.
    explanation: |
      Gravity guides the typical growth of a seedling. The root grows downward with gravity, called positive gravitropism. The shoot grows upward against gravity, called negative gravitropism.
    approved: true

  - id: q-biology-botany-0017
    type: "structure-function"
    difficulty: "easy"
    stem: |
      After fertilization in a flowering plant, which structure develops into the seed?
    choices:
      - text: "Ovule"
        correct: true
      - text: "Ovary"
        rationale: |
          This swaps the future seed with the future fruit. The ovary surrounds the ovules, so they are closely linked. Check which structure is inside the ovary.
      - text: "Stigma"
        rationale: |
          This confuses where pollen lands with where a seed forms. The stigma is part of the female reproductive organ, so it seems plausible. Check where the egg and developing embryo are located.
      - text: "Anther"
        rationale: |
          This confuses the pollen-producing part with the seed-producing structure. Both belong to the flower and help reproduction. Check which part holds the ovule.
    explanation: |
      The ovule develops into a seed. The seed contains the plant embryo and its supporting tissues.
    approved: false

  - id: q-biology-botany-0018
    type: "predict-outcome"
    difficulty: "medium"
    stem: |
      In spring, stored sugar in a root is released and delivered to a growing shoot above it. Which statement describes this transport?
    choices:
      - text: "Phloem carries sugar from root to shoot."
        correct: true
      - text: "Phloem must move sugar from shoot to root."
        rationale: |
          This assumes phloem transport is always downward. Mature leaves often send sugar to roots, so that pattern seems fixed. Check where the source and sink are in this case.
      - text: "Xylem carries sugar upward from the root."
        rationale: |
          This assigns any upward flow to xylem. The sugar moves upward here, so the direction seems to identify the tissue. Check the material being carried before its direction.
      - text: "Ground tissue carries sugar through the stem."
        rationale: |
          This confuses releasing stored sugar with carrying it between organs. Ground tissue can store sugar, so it seems responsible for the whole journey. Check which tissue handles long-distance sugar transport.
    explanation: |
      The root is a source because it releases stored sugar. The growing shoot is a sink because it uses sugar. Phloem carries sugar from this source to this sink.
    approved: false

  - id: q-biology-botany-0019
    type: "cause-effect"
    difficulty: "hard"
    stem: |
      In a flowering plant, one sperm forms a zygote, but the second fertilization event fails. Which tissue would fail to form normally as a direct result?
    choices:
      - text: "Endosperm"
        correct: true
      - text: "Plant embryo"
        rationale: |
          This confuses the two products of double fertilization. Both support a new plant, so they seem to have the same origin. Check which event has already formed a zygote.
      - text: "Pollen tube"
        rationale: |
          This places a delivery structure after fertilization. The pollen tube carries sperm, so it seems part of either fertilization event. Check whether sperm could reach the ovule before the tube formed.
      - text: "Ovary wall"
        rationale: |
          This confuses the ovary surrounding the ovules with a tissue formed by sperm fusion. Both contribute to the final fruit and seed. Check which tissue the second fertilization event creates.
    explanation: |
      Double fertilization includes an event that forms endosperm. Endosperm supplies food to the developing embryo. If that second event fails, endosperm does not form normally.
    approved: false

  - id: q-biology-botany-0020
    type: "process-ordering"
    difficulty: "exam"
    stem: |
      Which sequence gives the usual order of events leading to an embryo in a flowering plant?
    choices:
      - text: "Pollination, pollen-tube growth, gamete fusion, zygote development"
        correct: true
      - text: "Pollen-tube growth, pollination, gamete fusion, zygote development"
        rationale: |
          This places pollen-tube growth before pollen reaches the stigma. Pollen already contains cells that can make a tube, so growth may seem possible first. Check where the tube begins growing in this sequence.
      - text: "Pollination, gamete fusion, pollen-tube growth, zygote development"
        rationale: |
          This places gamete fusion before sperm delivery. Pollen transfer may seem to put sperm directly beside the egg. Check how sperm reaches the ovule.
      - text: "Pollination, pollen-tube growth, zygote development, gamete fusion"
        rationale: |
          This places zygote development before the event that makes the zygote. Growth and fertilization both happen inside the ovule, so their order can blur. Check what must exist before it can develop.
    explanation: |
      Pollen first reaches the stigma. A pollen tube grows and delivers sperm to the ovule. A sperm joins the egg to make a zygote. The zygote then develops into an embryo.
    approved: false
