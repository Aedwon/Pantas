meta:
  subject: science
  topic: biology
  subtopic: genetics-and-heredity
  exams: [upcat, dlsucet, ustet, dost-sei]
questions:
  - id: q-biology-genetics-and-heredity-0001
    type: 'identify'
    difficulty: 'easy'
    stem: |
      An organism's actual genetic makeup, such as $Tt$, is called its what?
    choices:
      - text: 'Genotype'
        correct: true
      - text: 'Phenotype'
        rationale: |
          This confuses inherited alleles with an observed trait. Alleles influence what is seen, so the terms seem linked. Check whether the answer names gene versions or a characteristic.
      - text: 'Allele'
        rationale: |
          This treats one gene version as the complete genotype. An allele is part of a genotype. Check whether the notation names one version or the pair at a locus.
      - text: 'Pedigree'
        rationale: |
          This confuses an individual’s genotype with a family record. A family chart can track inherited traits. Check whether the term describes the individual or a chart.
    explanation: |
      Genotype refers to the actual genetic makeup of an organism, such as the letters $Tt$.
    approved: true

  - id: q-biology-genetics-and-heredity-0002
    type: 'identify'
    difficulty: 'easy'
    stem: |
      How a genotype is physically expressed, such as "tall," is called its what?
    choices:
      - text: 'Phenotype'
        correct: true
      - text: 'Allelic state'
        rationale: |
          This names the alleles instead of the observable characteristic. Alleles affect height, so their state seems relevant. Check whether the question asks for genes or the measured trait.
      - text: 'Gene variant'
        rationale: |
          This names a version of a gene instead of its observed effect. Gene variants can influence appearance. Check whether the answer describes DNA or a characteristic.
      - text: 'Pedigree pattern'
        rationale: |
          This names a family pattern instead of a trait. Pedigrees show how traits occur in families. Check whether the question describes one individual or generations.
    explanation: |
      A phenotype is an observable characteristic, such as height. It develops from the interaction of genetic makeup and environment.
    approved: true

  - id: q-biology-genetics-and-heredity-0003
    type: 'simple-quantitative'
    difficulty: 'medium'
    stem: |
      Two heterozygous pea plants are crossed, $Tt \times Tt$. Under complete dominance, $T$ produces tall plants. What is the probability that one offspring is tall?
    choices:
      - text: '$\dfrac{3}{4}$'
        correct: true
      - text: '$\dfrac{1}{4}$'
        rationale: |
          This counts only the recessive combination. There is one of it among four equally likely outcomes. Check whether the requested phenotype is tall or short.
      - text: '$\dfrac{1}{2}$'
        rationale: |
          This counts only heterozygous outcomes as tall. Two boxes contain one copy of each allele. Check whether the dominant homozygote is also tall.
      - text: '$\dfrac{4}{4}$'
        rationale: |
          This assumes two tall parents cannot have a short offspring. Each parent does show the dominant trait. Check whether both can pass a recessive allele.
    explanation: |
      Each parent passes $T$ or $t$ with equal probability. The four equally likely combinations are $TT$, $Tt$, $Tt$, and $tt$. Three produce the tall phenotype, so the probability is $\dfrac{3}{4}$.
    approved: true

  - id: q-biology-genetics-and-heredity-0004
    type: 'predict-outcome'
    difficulty: 'medium'
    stem: |
      A cross has a $\dfrac{1}{4}$ probability of a recessive phenotype for each offspring. What can be concluded about the next four offspring?
    choices:
      - text: 'Their actual phenotypes can vary.'
        correct: true
      - text: 'Exactly one must show the recessive trait.'
        rationale: |
          This treats expected probability as a guaranteed family count. One in four sounds like a fixed schedule. Check whether the statement is a probability or an exact requirement.
      - text: 'None can show the recessive trait together.'
        rationale: |
          This assumes separate offspring cannot share a recessive outcome. The outcome is less common, so repeated cases may seem impossible. Check whether each offspring still has that chance.
      - text: 'All must show the dominant trait at birth.'
        rationale: |
          This assumes dominance prevents recessive offspring. A dominant phenotype is more likely in this cross. Check whether the recessive probability is zero.
    explanation: |
      A Punnett-square probability describes each offspring’s chance. It does not guarantee the exact results in a small group. Four offspring can have different combinations of phenotypes.
    approved: true

  - id: q-biology-genetics-and-heredity-0005
    type: 'classify'
    difficulty: 'medium'
    stem: |
      A red snapdragon flower is crossed with a white snapdragon flower, and all offspring have pink flowers, a blend of the two parent colors. What pattern of inheritance is this?
    choices:
      - text: 'Incomplete dominance'
        correct: true
      - text: 'Codominance'
        rationale: |
          This confuses an intermediate trait with both allele effects being separately detectable. Both patterns involve two alleles in a heterozygote. Check whether the measured phenotype is intermediate.
      - text: 'Multiple alleles'
        rationale: |
          This confuses the number of allele versions with their expression. A trait can have several alleles in a population. Check whether the evidence counts alleles or describes the heterozygote.
      - text: 'Sex-linked inheritance'
        rationale: |
          This assumes the color gene is on a sex chromosome. Inherited traits can be sex-linked, which makes the label familiar. Check whether chromosome location is stated.
    explanation: |
      The heterozygous flowers have an intermediate pink color. A heterozygote with a measured trait between the two homozygotes shows incomplete dominance.
    approved: true

  - id: q-biology-genetics-and-heredity-0006
    type: 'classify'
    difficulty: 'medium'
    stem: |
      A person with blood type A and a person with blood type B have a child with blood type AB, showing both the A and B traits fully, without blending. What pattern of inheritance is this?
    choices:
      - text: 'Codominance'
        correct: true
      - text: 'Incomplete dominance'
        rationale: |
          This confuses both markers being present with an intermediate marker. Both patterns involve heterozygotes. Check whether the two effects remain detectable.
      - text: 'Simple dominant-recessive inheritance'
        rationale: |
          This assumes one allele hides the other. That happens under complete dominance. Check whether both A and B markers are expressed.
      - text: 'Sex-linked inheritance'
        rationale: |
          This confuses allele expression with chromosome location. Both describe inheritance patterns. Check whether the evidence concerns both markers or a sex chromosome.
    explanation: |
      An AB individual has both A and B markers on red blood cells. Both alleles contribute detectable effects in the heterozygote. This is codominance.
    approved: true

  - id: q-biology-genetics-and-heredity-0007
    type: 'identify'
    difficulty: 'medium'
    stem: |
      In ordinary double-stranded DNA, which base pairs with adenine?
    choices:
      - text: 'Thymine'
        correct: true
      - text: 'Cytosine'
        rationale: |
          This substitutes the partner of guanine. Cytosine is a DNA base, so it seems possible. Check the specific pairing rule for adenine.
      - text: 'Guanine'
        rationale: |
          This chooses another DNA base without using the pairing rule. Guanine belongs in DNA. Check which base pairs with adenine.
      - text: 'Adenine'
        rationale: |
          This assumes matching letters pair together. Identical names can look like matching partners. Check whether DNA uses identical or complementary base pairs.
    explanation: |
      Adenine pairs with thymine in ordinary double-stranded DNA. These matching bases join the two strands.
    approved: true

  - id: q-biology-genetics-and-heredity-0008
    type: 'identify'
    difficulty: 'medium'
    stem: |
      When DNA is transcribed into mRNA, which base takes the place of thymine?
    choices:
      - text: 'Uracil'
        correct: true
      - text: 'Guanine'
        rationale: |
          This chooses a base already shared by DNA and RNA. Guanine is a familiar base name. Check which standard base differs between the two alphabets.

      - text: 'Cytosine'
        rationale: |
          This chooses a base already shared by DNA and RNA. Cytosine occurs in both. Check the T-versus-U distinction.

      - text: 'Adenine'
        rationale: |
          This confuses thymine’s DNA partner with RNA’s replacement base. Adenine pairs with thymine in DNA. Check whether the question asks for a partner or the RNA-specific base.

    explanation: |
      Standard RNA uses uracil, U, where standard DNA uses thymine, T. During transcription, a DNA-template adenine pairs with uracil in the RNA being made.

    approved: true

  - id: q-biology-genetics-and-heredity-0009
    type: 'process-ordering'
    difficulty: 'medium'
    stem: |
      For a typical protein-coding gene, order these stages: 1. Translation; 2. DNA template; 3. Transcription; 4. Protein product.
    choices:
      - text: '2, 3, 1, 4'
        correct: true
      - text: '2, 1, 3, 4'
        rationale: |
          This puts RNA reading before RNA production. The names both describe information transfer. Check which step must supply RNA first.
      - text: '4, 3, 1, 2'
        rationale: |
          This begins with the protein product. Protein can affect cells, so it may seem like a source of instructions. Check which molecule supplies the template here.
      - text: '2, 3, 4, 1'
        rationale: |
          This puts the product before its assembly step. Transcription does make a molecule. Check whether that product is RNA or protein.
    explanation: |
      Transcription uses the DNA template to make RNA. Translation reads the RNA to build an amino-acid chain. The chain is processed into the protein product.
    approved: true

  - id: q-biology-genetics-and-heredity-0010
    type: 'classify'
    difficulty: 'hard'
    stem: |
      Two unaffected parents have an affected child. Assume a single autosomal gene, complete penetrance, and no new mutation. Which inheritance model fits?
    choices:
      - text: 'Recessive'
        correct: true
      - text: 'Completely dominant'
        rationale: |
          This assumes an unaffected parent can hide a fully expressed dominant allele. Carriers can hide recessive alleles, so the idea seems transferable. Check the complete-penetrance assumption.
      - text: 'Both models equally'
        rationale: |
          This ignores the stated inheritance assumptions. Real pedigrees can have exceptions. Check whether the question has excluded new mutations and incomplete expression.
      - text: 'Neither model fits'
        rationale: |
          This overlooks unaffected recessive carriers. The parents do not show the trait. Check whether they can still carry and pass a recessive allele.
    explanation: |
      Both unaffected parents can carry one recessive allele. Each can pass it to the child. A child with two copies shows the recessive trait under the stated model.
    approved: true

  - id: q-biology-genetics-and-heredity-0011
    type: 'cause-effect'
    difficulty: 'hard'
    stem: |
      Two plants have the same genotype at a height-related locus but grow to different heights in different conditions. Which conclusion is supported?
    choices:
      - text: 'Environment can affect phenotype.'
        correct: true
      - text: 'Different heights prove different alleles at that locus.'
        rationale: |
          This treats a visible difference as proof of an allele difference. Genotype can influence height. Check whether the genotype was already stated to be the same.
      - text: 'Phenotype is determined only by the named genotype.'
        rationale: |
          This leaves out environmental effects. Single-gene classroom examples often hold conditions fixed. Check whether the growing conditions differ.
      - text: 'Environmental change must rewrite that gene.'
        rationale: |
          This assumes changing a trait must change its DNA. The plant’s height changes, which can look like genetic change. Check whether the evidence shows a DNA change or only a phenotype change.
    explanation: |
      An observable trait can depend on both genes and the environment. Different growing conditions can therefore produce different heights even with the same genotype at the named locus.
    approved: true

  - id: q-biology-genetics-and-heredity-0012
    type: 'classify'
    difficulty: 'hard'
    stem: |
      Which observation distinguishes codominance from incomplete dominance?
    choices:
      - text: 'Both allele effects are detectable.'
        correct: true
      - text: 'The heterozygote has an intermediate trait.'
        rationale: |
          This describes incomplete dominance instead. Both patterns differ from complete dominance. Check whether the trait is intermediate or both effects are detectable.
      - text: 'One allele fully masks the other allele.'
        rationale: |
          This describes complete dominance. An allele can mask another in some inheritance models. Check whether both effects are visible in the pattern asked about.
      - text: 'Only one allele is present in the genotype.'
        rationale: |
          This confuses allele expression with the number inherited. One visible effect may seem to mean one allele. Check the two alleles present at a diploid locus.
    explanation: |
      In codominance, both alleles contribute detectable effects in the heterozygote. Blood type AB shows this through the presence of both A and B markers.
    approved: true

  - id: q-biology-genetics-and-heredity-0013
    type: 'classify'
    difficulty: 'hard'
    stem: |
      A student writes an mRNA sequence that includes thymine (T) instead of uracil (U). Is this correct?
    choices:
      - text: 'No: mRNA uses uracil in place of thymine; a correct mRNA sequence should never include thymine.'
        correct: true
      - text: 'Yes: mRNA and DNA both use thymine identically.'
        rationale: |
          This copies DNA’s standard base alphabet into mRNA. Both carry genetic information. Check whether the sequence is labeled DNA or RNA.

      - text: 'No: but only because mRNA never contains adenine either.'
        rationale: |
          This removes adenine along with thymine. The two molecules have one main alphabet difference. Check the shared A, C, and G bases.

      - text: 'Yes: uracil and thymine are interchangeable in every context.'
        rationale: |
          This treats the two related bases as interchangeable in sequence notation. Both pair with adenine in their usual molecules. Check the RNA-specific U letter.

    explanation: |
      Standard mRNA sequence notation uses A, U, C, and G. Its RNA-specific letter is U rather than T. The stated sequence should use uracil in that position.

    approved: true

  - id: q-biology-genetics-and-heredity-0014
    type: 'cause-effect'
    difficulty: 'hard'
    stem: |
      Two genes lie close together on the same chromosome. Why may their inheritance depart from independent-assortment expectations?
    choices:
      - text: 'Their alleles tend to be inherited together.'
        correct: true
      - text: 'Their closeness prevents all mutation in either gene.'
        rationale: |
          This confuses linkage with a ban on mutation. Closely linked alleles often stay together. Check whether being linked stops DNA from changing.
      - text: 'Their chromosome forces every allele to be dominant.'
        rationale: |
          This confuses chromosome position with dominance. Both affect inheritance outcomes. Check whether dominance describes location or expression in a heterozygote.
      - text: 'Their location removes one allele during fertilization.'
        rationale: |
          This confuses linked transmission with losing an allele. Gametes carry fewer chromosome copies than body cells. Check whether fertilization restores pairs or removes alleles.
    explanation: |
      Nearby genes on one chromosome are linked. They tend to pass together because recombination is less likely to separate close loci. Their inheritance can differ from independent assortment.
    approved: true

  - id: q-biology-genetics-and-heredity-0015
    type: 'simple-quantitative'
    difficulty: 'exam'
    stem: |
      A plant with genotype $Aa$ is crossed with $aa$. Under complete dominance, $A$ produces the dominant phenotype. What is the probability that one offspring shows it?
    choices:
      - text: '$\dfrac{1}{2}$'
        correct: true
      - text: '$\dfrac{3}{4}$'
        rationale: |
          This uses the dominant probability from crossing two heterozygotes. That familiar cross has two parents carrying the dominant allele. Check the second parent’s genotype.
      - text: '$\dfrac{1}{4}$'
        rationale: |
          This counts one dominant outcome among four while missing its second equal chance. A four-box square can make one cell seem like the whole result. Check repeated genotypes as well as distinct ones.
      - text: '$\dfrac{4}{4}$'
        rationale: |
          This assumes a dominant parent passes the dominant allele every time. The parent does show the trait. Check whether it also carries a recessive allele.
    explanation: |
      The $Aa$ parent passes $A$ or $a$ with equal probability. The $aa$ parent passes $a$. The equally likely offspring are $Aa$ and $aa$. One of the two shows the dominant phenotype, so the probability is $\dfrac{1}{2}$.
    approved: true

  - id: q-biology-genetics-and-heredity-0016
    type: 'structure-function'
    difficulty: 'easy'
    stem: |
      What does a ribosome read during translation?
    choices:
      - text: 'mRNA codons'
        correct: true
      - text: 'A family pedigree'
        rationale: |
          This confuses a record of inheritance with instructions for protein assembly. Both contain information about traits. Check whether the information is inside the cell or on a family chart.
      - text: 'The two parental genotypes'
        rationale: |
          This confuses inheritance prediction with protein production. Parental genotypes help predict offspring. Check whether translation reads a cross or an RNA sequence.
      - text: 'A chromosome-pairing pattern'
        rationale: |
          This confuses gamete formation with RNA reading. Both involve genetic material. Check whether the process separates chromosomes or builds an amino-acid chain.
    explanation: |
      During translation, a ribosome reads mRNA in three-base units called codons. These units specify amino acids or a translation signal.
    approved: false

  - id: q-biology-genetics-and-heredity-0017
    type: 'identify'
    difficulty: 'medium'
    stem: |
      A heterozygous diploid cell has alleles $A$ and $a$. A normal haploid gamete receives one of them. Which law describes this separation?
    choices:
      - text: 'Law of segregation'
        correct: true
      - text: 'Law of independent assortment'
        rationale: |
          This confuses separation of one allele pair with relationships between different genes. Both occur during gamete formation. Check whether one locus or several loci are being considered.
      - text: 'Complete-dominance model'
        rationale: |
          This confuses allele transmission with allele expression. Dominance affects the heterozygote’s phenotype. Check whether the question asks what a gamete receives or what a trait looks like.
      - text: 'Codominant-expression model'
        rationale: |
          This confuses expression of both alleles with their separation. Both alleles are present in the starting cell. Check the number of copies that enters one haploid gamete.
    explanation: |
      The law of segregation states that the two alleles at a diploid locus separate during gamete formation. Each haploid gamete receives one of them.
    approved: false

  - id: q-biology-genetics-and-heredity-0018
    type: 'classify'
    difficulty: 'medium'
    stem: |
      A gene has several allele versions in a population. How many copies at that ordinary locus does one diploid individual normally carry?
    choices:
      - text: 'Two'
        correct: true
      - text: 'One'
        rationale: |
          This applies the haploid count to a diploid individual. Gametes do carry one copy. Check whether the question describes a gamete or a diploid individual.
      - text: 'Three'
        rationale: |
          This confuses multiple alleles in a population with extra copies in one individual. Several versions exist across the population. Check the individual’s number of chromosome sets.
      - text: 'As many as occur in the population'
        rationale: |
          This confuses the population’s variety with one individual’s genotype. All versions are possible within the population. Check how many chromosome copies one diploid individual has.
    explanation: |
      Diploid means there are two chromosome sets. At an ordinary locus, one copy comes from each parent, so the individual carries two copies.
    approved: false

  - id: q-biology-genetics-and-heredity-0019
    type: 'compare-contrast'
    difficulty: 'hard'
    stem: |
      Which pair of genes is most likely to assort independently under a simple inheritance model?
    choices:
      - text: 'Genes on different chromosomes'
        correct: true
      - text: 'Nearby genes on the same chromosome'
        rationale: |
          This ignores linkage between nearby loci. Both genes are present in the same individual. Check whether their shared chromosome tends to carry them together.
      - text: 'Two alleles at the same gene locus'
        rationale: |
          This treats the two alleles of one gene as different genes. The letters may differ. Check whether the question concerns separate loci or separation at one locus.
      - text: 'Genes that code for the same observable trait'
        rationale: |
          This uses similarity of function to predict chromosome assortment. Both genes affect a trait, so they seem connected. Check chromosome location instead of the trait they influence.
    explanation: |
      Different chromosome pairs generally assort independently during gamete formation. Genes on different chromosomes therefore usually follow independent-assortment expectations.
    approved: false

  - id: q-biology-genetics-and-heredity-0020
    type: 'process-ordering'
    difficulty: 'exam'
    stem: |
      A eukaryotic nuclear gene produces a protein. Which sequence follows the lesson’s information-flow model?
    choices:
      - text: 'Nuclear transcription, mRNA exit, ribosome translation'
        correct: true
      - text: 'Ribosome translation, nuclear transcription, mRNA exit'
        rationale: |
          This reads the message before it is made. Translation and transcription have similar names. Check which step first produces RNA.
      - text: 'mRNA exit, ribosome translation, nuclear transcription'
        rationale: |
          This sends a message out before transcription produces it. mRNA does need to reach ribosomes. Check when the RNA becomes available.
      - text: 'Nuclear transcription, protein completion, ribosome translation'
        rationale: |
          This puts the finished protein before its assembly. Transcription produces a new molecule. Check whether that molecule is RNA or protein.
    explanation: |
      The nuclear gene is transcribed to RNA in the nucleus. Processed mRNA leaves the nucleus. A ribosome then translates it into an amino-acid chain.
    approved: false
