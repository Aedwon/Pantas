    choices:
      - text: "An affected female in generation III"
        correct: true
      - text: "An unaffected female in generation III"
        rationale: |
          A circle does show a female. Check what the shading tells you about the trait.
      - text: "An affected male in generation III"
        rationale: |
          The shading does show the trait. Check which shape stands for a male.
      - text: "An affected female in generation II"
        rationale: |
          The line joins the child to parents in row II. Read the row where the child's own symbol sits.
    explanation: |
