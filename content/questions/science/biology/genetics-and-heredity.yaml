  - id: q-biology-genetics-and-heredity-0028
    approved: true
    lesson: lesson-biology-identifying-x-linked-pedigrees
    keyPoint: 1
    type: "classify"
    difficulty: "exam"
    stem: |
      A father shows a rare X-linked recessive trait. The mother has two copies of the dominant allele. Their daughter later has a son who shows the trait. Which route can explain the grandson's allele?
    choices:
      - text: "The grandfather passed it through his daughter."
        correct: true
      - text: "The grandfather passed it straight to his daughter's son."
        rationale: |
          Both males show the same trait, so a direct link may seem likely. Trace the grandson's X through his own parents.
      - text: "The grandfather passed it to the daughter's partner."
        rationale: |
          A son's father gives him a sex chromosome. Check whether the chromosome he gives his son is X or Y.
      - text: "The grandfather passed it through the daughter's mother."
        rationale: |
          The daughter receives an X from her mother, so that route may seem possible. Check which grandparent has the recessive allele.
    explanation: |
      The daughter gets her father's X with the allele. She can pass that X to her son, who shows the trait.

  - id: q-biology-genetics-and-heredity-0029
    approved: true
    lesson: lesson-biology-identifying-x-linked-pedigrees
    keyPoint: 1
    type: "classify"
    difficulty: "exam"
    stem: |
      A girl shows a recessive trait. Her biological father is unaffected. Assume one gene, no new mutations, and that every person with the genotype for the trait shows it. What does this pedigree tell you about an X-linked recessive explanation?
    choices:
      - text: "It is ruled out by the father's phenotype."
        correct: true
      - text: "It is supported because a daughter gets both X chromosomes from her mother."
        rationale: |
          A mother can pass a recessive allele to a child. Count how many X chromosomes the daughter gets from each parent.
      - text: "It remains possible because the father gave his daughter a Y chromosome."
        rationale: |
          A father passes a Y to a son, so the same route may seem possible here. Check what a daughter gets from her father.
      - text: "It remains possible because a father can carry a hidden recessive allele on his only X."
        rationale: |
          Carriers can look unaffected when they have two X chromosomes. Check whether the father has a second X with a dominant allele.
    explanation: |
      The girl would need the recessive allele on both X chromosomes. Her father would need to give her one. He has only one X, so he would show the trait if he had the allele.
