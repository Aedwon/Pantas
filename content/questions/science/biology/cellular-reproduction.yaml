meta:
  subject: "science"
  topic: "biology"
  subtopic: "cellular-reproduction"
  exams: ["upcat", "ustet", "dost-sei"]
questions:
  - id: q-biology-cellular-reproduction-0004
    type: "simple-quantitative"
    difficulty: "medium"
    stem: |
      A normal human somatic cell completes one mitotic division and cytokinesis without errors. Which result is expected?
    choices:
      - text: "2 cells, 46 chromosomes each"
        correct: true
      - text: "4 cells, 23 chromosomes each"
        rationale: |
          This applies the meiotic outcome to mitosis. Both begin after DNA copying, so the extra divisions can seem to occur in either process. Check whether one or two nuclear divisions are specified.
      - text: "2 cells, 23 chromosomes each"
        rationale: |
          This halves chromosome number during mitosis. The copied DNA is split between two nuclei, so halving the original count seems natural. Check whether each chromosome was copied before separation.
      - text: "4 cells, 46 chromosomes each"
        rationale: |
          This doubles the number of cells instead of separating one cell into two. DNA replication can be mistaken for another cell division. Check how many cytokinesis events are specified.
    explanation: |
      Mitosis preserves chromosome-set number. A normal human somatic cell has 46 chromosomes. After normal mitosis and cytokinesis, it produces two daughter cells, each with 46 chromosomes.
    approved: true

  - id: q-biology-cellular-reproduction-0005
    type: "identify"
    difficulty: "easy"
    stem: |
      During which phase of mitosis do chromosomes line up along the middle of the cell?
    choices:
      - text: "Metaphase"
        correct: true
      - text: "Prophase"
        rationale: |
          This confuses chromosome condensation with central alignment. Condensed chromosomes become visible early, so their arrangement may seem complete then. Check whether they have reached the spindle's center.
      - text: "Anaphase"
        rationale: |
          This confuses alignment with separation. The spindle acts in both stages, so they can look similar. Check whether sister chromatids are still joined.
      - text: "Telophase"
        rationale: |
          This confuses an aligned group with the two groups at the end. Both give chromosomes an organized position. Check whether new nuclei are forming around separated sets.
    explanation: |
      During metaphase, duplicated chromosomes align at the center of the spindle. Their sister chromatids are attached to opposite poles.
    approved: true

  - id: q-biology-cellular-reproduction-0006
    type: "identify"
    difficulty: "easy"
    stem: |
      At the beginning of mitosis, chromosomes condense and the spindle starts to form. Which phase is this?
    choices:
      - text: "Prophase"
        correct: true
      - text: "Metaphase"
        rationale: |
          This places early chromosome condensation at the alignment stage. Both stages show visible chromosomes, so they seem alike. Check whether the chromosomes are just condensing or already centered.
      - text: "Anaphase"
        rationale: |
          This confuses making chromosomes compact with pulling copies apart. Both change how chromosomes look, so they may be mixed up. Check whether sister chromatids have separated.
      - text: "Telophase"
        rationale: |
          This uses the final phase for the start of division. New nuclei and compact chromosomes both seem like changes in nuclear structure. Check whether mitosis is beginning or ending.
    explanation: |
      Prophase begins mitosis with chromosome condensation and spindle formation. The copied chromosomes become compact and easier to see.
    approved: true

  - id: q-biology-cellular-reproduction-0007
    type: "identify"
    difficulty: "easy"
    stem: |
      During which phase of mitosis do the sister chromatids separate and get pulled to opposite ends of the cell?
    choices:
      - text: "Anaphase"
        correct: true
      - text: "Prophase"
        rationale: |
          This confuses preparing the chromosomes with separating them. The spindle starts forming early, so its pulling action may seem to start then. Check whether chromatids are still joined.
      - text: "Metaphase"
        rationale: |
          This confuses alignment with separation. Chromosomes attach to the spindle and line up before they separate. Check whether the question describes staying centered or moving apart.
      - text: "Telophase"
        rationale: |
          This confuses the result of separation with the separation itself. Chromosomes are at opposite poles by telophase, so the phase seems to fit. Check whether movement or nuclear-envelope formation is described.
    explanation: |
      During anaphase, sister chromatids separate. Each separated chromatid moves toward an opposite spindle pole.
    approved: true

  - id: q-biology-cellular-reproduction-0008
    type: "identify"
    difficulty: "easy"
    stem: |
      During which phase of mitosis do nuclear envelopes form around chromosome sets at opposite poles?
    choices:
      - text: "Telophase"
        correct: true
      - text: "Prophase"
        rationale: |
          This reverses nuclear-envelope breakdown and re-formation. Both involve changes to the nucleus, so the terms can be swapped. Check whether envelopes are appearing or disappearing.
      - text: "Metaphase"
        rationale: |
          This confuses central alignment with the formation of two nuclei. Both organize chromosomes, so the events may seem equivalent. Check whether the chromosomes form one central group or two separated sets.
      - text: "Anaphase"
        rationale: |
          This confuses chromosome movement with the later formation of nuclei. Separation brings the sets to opposite poles, so it seems to include the whole result. Check which stage rebuilds nuclear envelopes.
    explanation: |
      During telophase, the chromosomes have reached opposite poles. Nuclear envelopes form around the two sets, producing two daughter nuclei.
    approved: true

  - id: q-biology-cellular-reproduction-0009
    type: "classify"
    difficulty: "hard"
    stem: |
      A diploid cell forms two diploid daughter nuclei but its cytoplasm does not divide. Which interpretation is correct?
    choices:
      - text: "Mitosis occurred; cytokinesis did not."
        correct: true
      - text: "Cytokinesis occurred; nuclear division did not."
        rationale: |
          This swaps nuclear and cytoplasmic division. The two processes usually overlap, so their names can seem interchangeable. Check which event makes daughter nuclei.
      - text: "Neither process occurred because only one cell remains."
        rationale: |
          This treats one remaining cell as proof that no division occurred. The outer boundary has not split, so internal division can be overlooked. Check the number of nuclei separately from the number of cells.
      - text: "Meiosis I occurred because exactly two nuclei formed."
        rationale: |
          This treats two nuclei as proof of a meiotic division. Meiosis I also produces two nuclei, so the count alone seems enough. Check whether chromosome-set number was reduced.
    explanation: |
      Mitosis divides the nucleus, while cytokinesis divides the cytoplasm. A cell can complete nuclear division without splitting its cytoplasm. It then contains two nuclei in one cell.
    approved: true

  - id: q-biology-cellular-reproduction-0012
    type: "process-ordering"
    difficulty: "hard"
    stem: |
      A complete description of mitosis begins with chromosome condensation and ends with two new nuclei. Which two phases must be added, in order, to describe central alignment and then sister-chromatid separation?
    choices:
      - text: "Metaphase, anaphase"
        correct: true
      - text: "Anaphase, metaphase"
        rationale: |
          This separates chromatids before central alignment. Both steps involve spindle attachments, so the order can seem interchangeable. Check whether chromosomes line up before being pulled apart.
      - text: "Prophase, metaphase"
        rationale: |
          This places two starting-phase names between prophase and telophase. Those names are familiar, so they can look like valid missing steps. Check which phase names the description already includes.
      - text: "Telophase, metaphase"
        rationale: |
          This places nuclear re-formation before chromosome alignment. Both organize genetic material, so the order may not stand out. Check whether two separated sets must arrive before new nuclei form.
    explanation: |
      Metaphase places chromosomes at the spindle's center. Anaphase then separates sister chromatids toward opposite poles. These listed events occur between the beginning of mitosis and formation of daughter nuclei.
    approved: true

  - id: q-biology-cellular-reproduction-0014
    type: "process-ordering"
    difficulty: "medium"
    stem: |
      Put the four phases of mitosis in the correct order.
      1. Anaphase
      2. Telophase
      3. Prophase
      4. Metaphase
    choices:
      - text: "3, 4, 1, 2"
        correct: true
      - text: "3, 1, 4, 2"
        rationale: |
          This puts chromatid separation before chromosome alignment. Both involve the spindle, so swapping them can seem harmless. Check which event prepares the chromosomes for separation.
      - text: "4, 3, 1, 2"
        rationale: |
          This puts alignment before chromosome condensation. Visible aligned chromosomes can hide the earlier preparation step. Check which phase starts mitosis.
      - text: "3, 4, 2, 1"
        rationale: |
          This puts nuclear-envelope formation before chromosome separation. Both are late events, so their order can blur. Check whether chromosomes must reach opposite poles before envelopes form.
    explanation: |
      Prophase begins chromosome condensation and spindle formation. Metaphase aligns chromosomes at the center. Anaphase separates sister chromatids. Telophase forms daughter nuclei. The listed order is 3, 4, 1, 2.
    approved: true

  - id: q-biology-cellular-reproduction-0016
    type: "identify"
    difficulty: "easy"
    stem: |
      During which part of interphase is the cell's DNA replicated?
    choices:
      - text: "S phase"
        correct: true
      - text: "$G_1$ phase"
        rationale: |
          This confuses cell growth with DNA copying. A growing cell makes many materials, so replication seems possible then. Check which phase specifically copies DNA.
      - text: "$G_2$ phase"
        rationale: |
          This confuses final preparation with the earlier copying step. The cell prepares for division in this phase, so replication may seem part of that preparation. Check whether DNA was already copied during S phase.
      - text: "Mitotic metaphase"
        rationale: |
          This places copying at the chromosome-alignment stage. Duplicated chromosomes are visible then, so their copying may seem to happen then too. Check whether their copies existed before mitosis began.
    explanation: |
      DNA replication occurs during S phase. Each chromosome is copied before the cell begins nuclear division.
    approved: false

  - id: q-biology-cellular-reproduction-0021
    type: "classify"
    difficulty: "easy"
    stem: |
      Which statement correctly describes sister chromatids in a cell that has copied its DNA without errors before mitosis?
    choices:
      - text: "They are the two identical copies of one chromosome, joined at the centromere."
        correct: true
      - text: "They are the two chromosomes of a pair, one from each parent."
        rationale: |
          This describes homologs. Both words name pairs of chromosome parts, so they are easy to mix. Check whether the pair is one chromosome copied or two chromosomes from two parents.
      - text: "They are two different chromosomes held together by spindle fibers."
        rationale: |
          The spindle does attach to chromosomes, so this seems to fit. Sister chromatids are joined by the centromere. Check what holds the two copies together.
      - text: "They are the two daughter cells formed after cytokinesis."
        rationale: |
          Sisters seem to mean two cells that came from one. Chromatids are parts of a chromosome. Check whether the term names cells or copies of DNA.
    explanation: |
      Before a cell divides, it copies each chromosome. If the copying has no errors, the two copies are identical. They stay joined at the centromere. Each copy is a sister chromatid.
    approved: false

  - id: q-biology-cellular-reproduction-0022
    type: "simple-quantitative"
    difficulty: "medium"
    stem: |
      A human skin cell in $G_1$ has $46$ chromosomes. How many chromatids does it have at metaphase of mitosis?
    choices:
      - text: "$92$"
        correct: true
      - text: "$46$"
        rationale: |
          This counts chromosomes and forgets the copying in S phase. The chromosome number does stay at 46, so it seems right. Check how many chromatids each copied chromosome has.
      - text: "$23$"
        rationale: |
          This halves the number, as in a gamete. The cell is not haploid. Check whether mitosis reduces the chromosome number.
      - text: "$184$"
        rationale: |
          This doubles the number twice. Copying happens once in S phase. Check that each chromosome has two chromatids, not four.
    explanation: |
      In S phase, each of the $46$ chromosomes is copied. Each chromosome then has two chromatids. At metaphase, the cell has $46 \times 2 = 92$ chromatids.
    approved: false

  - id: q-biology-cellular-reproduction-0023
    type: "simple-quantitative"
    difficulty: "hard"
    stem: |
      A human cell with $46$ chromosomes divides by mitosis. In anaphase and telophase, before cytokinesis, how many chromosomes does the whole cell hold?
    choices:
      - text: "$92$ chromosomes"
        correct: true
      - text: "$46$ chromosomes"
        rationale: |
          This is the count before the chromatids separate. The cell began with 46, so it seems to stay the same. Check when each chromatid starts to count as a chromosome.
      - text: "$46$ chromosomes with $92$ chromatids"
        rationale: |
          This describes the cell from S phase to metaphase. The numbers are familiar, so they seem right. Check whether the chromatids have separated.
      - text: "$23$ chromosomes"
        rationale: |
          This is the count in a gamete. The cell has not yet divided and is not haploid. Check whether mitosis reduces the chromosome number.
    explanation: |
      In anaphase the sister chromatids separate. Each chromatid is then counted as its own chromosome. So the whole cell briefly holds $46 \times 2 = 92$ chromosomes, until cytokinesis shares them between two cells.
    approved: false

  - id: q-biology-cellular-reproduction-0024
    type: "identify"
    difficulty: "easy"
    stem: |
      What does a haploid cell contain?
    choices:
      - text: "One chromosome of each kind, one from every homologous pair"
        correct: true
      - text: "A random half of the chromosomes, with some kinds missing"
        rationale: |
          A half seems to mean any half. A haploid cell has one of every kind. Check whether each kind of chromosome is present.
      - text: "Two chromosomes of each kind, one from each parent"
        rationale: |
          This describes a diploid cell. Both words describe sets of chromosomes, so they are easy to mix. Check how many of each kind the cell holds.
      - text: "Half of every chromosome, cut along its length"
        rationale: |
          This pictures halving each chromosome. Chromosomes are not cut lengthwise into haploid halves. Check that the cell holds whole chromosomes.
    explanation: |
      A haploid cell has $n$ chromosomes. It holds exactly one chromosome of each kind, so one from every homologous pair. In humans, $n = 23$.
    approved: false

  - id: q-biology-cellular-reproduction-0025
    type: "predict-outcome"
    difficulty: "medium"
    stem: |
      A haploid cell divides by mitosis and cytokinesis without errors. What is the result?
    choices:
      - text: "Two haploid cells with the same chromosome number"
        correct: true
      - text: "Two diploid cells"
        rationale: |
          This doubles the chromosome number. Copying in S phase makes twice the DNA, so a double set seems right. Check how the copies are shared between the daughter cells.
      - text: "Four haploid cells"
        rationale: |
          This applies the meiotic outcome to mitosis. Both processes start after DNA copying. Check how many nuclear divisions mitosis has.
      - text: "Two cells with half the chromosome number"
        rationale: |
          This halves the chromosome number in mitosis. Halving is the point of meiosis. Check whether mitosis keeps the parent's chromosome number.
    explanation: |
      Mitosis keeps the chromosome number the same. A haploid parent cell makes two daughter cells, and each is haploid. A diploid parent would make two diploid cells.
    approved: false

  - id: q-biology-cellular-reproduction-0026
    type: "identify"
    difficulty: "easy"
    stem: |
      In a plant cell, what forms across the middle of the cell during cytokinesis?
    choices:
      - text: "A cell plate that becomes a new cell wall"
        correct: true
      - text: "A membrane that pinches inward and splits the cell"
        rationale: |
          This describes cytokinesis in animal cells. Both are cytokinesis, so they are easy to swap. Check whether the cell has a cell wall.
      - text: "A spindle that pulls the chromosomes apart"
        rationale: |
          The spindle is active during division, so it seems to divide the cell. It moves chromosomes and does not divide the cytoplasm. Check which structure divides the cytoplasm.
      - text: "A nuclear envelope around each chromosome set"
        rationale: |
          New nuclear envelopes form at the end of mitosis, so this seems to fit. They divide the nucleus, not the cytoplasm. Check which process this part of the question describes.
    explanation: |
      In plant cells, a new cell wall called the cell plate forms across the middle. It divides the cytoplasm into two cells.
    approved: false

  - id: q-biology-cellular-reproduction-0027
    type: "identify"
    difficulty: "easy"
    stem: |
      Many specialized cells rest in a state where they do not divide. What is this state called?
    choices:
      - text: "$G_0$"
        correct: true
      - text: "$G_1$"
        rationale: |
          This is the growth part of interphase. A cell in $G_1$ is still part of the cell cycle, so it seems to fit. Check whether the cell is cycling or resting.
      - text: "$G_2$"
        rationale: |
          This is the part of interphase where the cell gets ready to divide. A cell in $G_2$ is about to divide. Check whether the cell is resting.
      - text: "S phase"
        rationale: |
          This is the part of interphase where DNA is copied. A cell in S phase is preparing to divide. Check whether the cell is resting.
    explanation: |
      Not every cell is always cycling. Many specialized cells rest in a non-dividing state called $G_0$.
    approved: false

  - id: q-biology-cellular-reproduction-0028
    type: "structure-function"
    difficulty: "medium"
    stem: |
      What is the job of the spindle in mitosis?
    choices:
      - text: "Its fibers attach to the centromeres and move the chromosomes."
        correct: true
      - text: "It copies the DNA before mitosis begins."
        rationale: |
          Mitosis follows copying, so the two seem linked. The copying happens in S phase. Check whether the spindle makes DNA or moves chromosomes.
      - text: "It divides the cytoplasm after the nucleus divides."
        rationale: |
          Cytokinesis follows mitosis, and the spindle is active near its end, so the two seem linked. Dividing the cytoplasm is cytokinesis. Check what the spindle attaches to.
      - text: "It forms a new nuclear envelope around each set."
        rationale: |
          New envelopes form at the end of mitosis, as the spindle finishes its work. Envelopes are separate from the spindle. Check what the spindle is made of.
    explanation: |
      The spindle is a set of fibers made of microtubules. In mitosis the fibers attach to the centromeres of the chromosomes. They line the chromosomes up and then pull the sister chromatids to opposite poles.
    approved: false

  - id: q-biology-cellular-reproduction-0029
    type: "cause-effect"
    difficulty: "hard"
    stem: |
      Why are the daughter cells of mitosis described as genetically very close to the parent cell, and not as absolutely identical?
    choices:
      - text: "Mutations or chromosome-sorting errors can occur."
        correct: true
      - text: "Each daughter cell gets only half of the parent's chromosomes."
        rationale: |
          This describes meiosis. Both are cell divisions, so the results can be mixed. Check whether mitosis keeps the chromosome number.
      - text: "Crossing over swaps pieces between homologs in prophase."
        rationale: |
          Crossing over does change DNA. It is part of meiosis and not of ordinary mitosis. Check which division the lesson links to crossing over.
      - text: "The daughter cells copy their DNA only after cytokinesis."
        rationale: |
          Copying and dividing are linked, so the order seems flexible. Copying happens in S phase, before mitosis. Check when the DNA is copied.
    explanation: |
      DNA is copied before mitosis. Copying errors can change the DNA, and chromosomes can sometimes be sorted incorrectly during mitosis. So the daughter cells are almost, but not always exactly, the same as the parent cell.
    approved: false

  - id: q-biology-cellular-reproduction-0030
    type: "classify"
    difficulty: "hard"
    stem: |
      Which statement correctly describes a homologous pair of chromosomes?
    choices:
      - text: "They have the same genes in the same order and may carry different alleles."
        correct: true
      - text: "They are identical copies joined at a centromere."
        rationale: |
          This describes sister chromatids. Both are pairs of similar chromosome parts, so they are easy to mix. Check whether the two parts came from one chromosome or two parents.
      - text: "They have the same alleles at every gene, one from each parent."
        rationale: |
          Same genes seem to mean same alleles. Homologs are not copies of each other. Check whether an allele can differ between the two.
      - text: "They carry different genes in a different order."
        rationale: |
          A mother's and father's chromosomes seem to differ. Homologs carry the same genes. Check whether the genes and their order match.
    explanation: |
      Homologs are the two chromosomes of a pair, one from the mother and one from the father. They carry the same genes in the same order. At a gene, they may carry the same allele or different alleles.
    approved: false

  - id: q-biology-cellular-reproduction-0031
    type: "process-ordering"
    difficulty: "medium"
    stem: |
      Which sequence shows the cell cycle of a dividing eukaryotic cell in the correct order?
    choices:
      - text: "$G_1$, S phase, $G_2$, mitosis, cytokinesis"
        correct: true
      - text: "S phase, $G_1$, $G_2$, mitosis, cytokinesis"
        rationale: |
          This starts with DNA copying. Copying is the most important step, so it seems to come first. Check that the cell first grows in $G_1$.
      - text: "$G_1$, $G_2$, S phase, mitosis, cytokinesis"
        rationale: |
          This puts the two gap phases together before copying. The letters seem to run in a pattern. Check that the DNA is copied before the cell gets ready to divide.
      - text: "$G_1$, S phase, $G_2$, cytokinesis, mitosis"
        rationale: |
          This divides the cytoplasm before the nucleus. Cytokinesis ends in two cells, so it seems to be last in some order. Check that the nucleus divides first.
    explanation: |
      The cell first grows in $G_1$. Its DNA is copied in S phase, and it gets ready in $G_2$. Mitosis then divides the nucleus, and cytokinesis divides the cytoplasm.
    approved: false
