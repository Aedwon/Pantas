meta:
  subject: science
  topic: biology
  subtopic: human-body-control-movement-and-defense
  exams: [upcat, ustet, dost-sei]
questions:
  - id: q-biology-human-anatomy-physiology-0003
    type: 'classify'
    difficulty: 'medium'
    stem: |
      A person deliberately decides to kick a ball. What type of muscle control and muscle type is involved?
    choices:
      - text: 'Voluntary control, skeletal muscle'
        correct: true
      - text: 'Involuntary control, smooth muscle'
        rationale: |
          This assigns organ-wall muscle to a deliberate limb movement. Both types contract, so their jobs can be confused. Check whether the movement is consciously chosen and moves the skeleton.
      - text: 'Involuntary control, cardiac muscle'
        rationale: |
          This assigns heart muscle to a limb. Both produce movement without needing a new decision for every contraction. Check where cardiac muscle is found.
      - text: 'Voluntary control, cardiac muscle'
        rationale: |
          This assumes cardiac muscle can be directed like a limb. Both skeletal and cardiac muscle contract. Check the tissue’s location and usual control.
    explanation: |
      A deliberate, chosen movement like kicking a ball is voluntary, controlled by skeletal muscle, which is attached to bones.
    approved: true

  - id: q-biology-human-anatomy-physiology-0004
    type: 'classify'
    difficulty: 'medium'
    stem: |
      A person's heart continues beating steadily while they sleep, with no conscious effort. What type of muscle control and muscle type is involved?
    choices:
      - text: 'Involuntary cardiac muscle'
        correct: true
      - text: 'Usually voluntary skeletal muscle'
        rationale: |
          This assigns limb-muscle control to the heart. Both tissues are striated, so they can seem similar. Check the tissue’s location and usual control.
      - text: 'Involuntary smooth muscle tissue'
        rationale: |
          This assigns organ-wall smooth muscle to the heart wall. Both operate involuntarily. Check whether the pumping tissue is smooth or cardiac.
      - text: 'Usually voluntary smooth muscle'
        rationale: |
          This gives smooth muscle voluntary control. Muscle movement may seem to require a decision. Check whether this tissue normally acts without conscious choice.
    explanation: |
      Cardiac muscle forms the heart’s pumping tissue. Its rhythm starts within the heart and does not require a conscious decision. This is involuntary activity.
    approved: true

  - id: q-biology-human-anatomy-physiology-0005
    type: 'identify'
    difficulty: 'easy'
    stem: |
      Which endocrine gland is often called the body's "master gland"?
    choices:
      - text: 'Pituitary'
        correct: true
      - text: 'Thyroid gland'
        rationale: |
          This confuses regulation of metabolic rate with the traditional master-gland label. Thyroid hormones affect many tissues. Check which gland sends regulatory signals to several other glands.
      - text: 'Adrenal glands'
        rationale: |
          This confuses stress-related hormones with the master-gland label. Adrenal hormones have wide effects. Check which gland regulates several other endocrine glands.
      - text: 'Endocrine pancreas'
        rationale: |
          This confuses blood-glucose regulation with the master-gland label. Insulin and glucagon affect many cells. Check which gland has the traditional nickname.
    explanation: |
      The pituitary is traditionally called the master gland because several of its hormones regulate other endocrine glands. Its own activity is regulated by the hypothalamus and feedback signals.
    approved: true

  - id: q-biology-human-anatomy-physiology-0006
    type: 'cause-effect'
    difficulty: 'medium'
    stem: |
      Why is the traditional name "master gland" an incomplete description of the pituitary?
    choices:
      - text: 'The hypothalamus regulates it.'
        correct: true
      - text: 'It has no effect on other endocrine glands.'
        rationale: |
          This rejects all regulatory action by the pituitary. Its activity is controlled by other signals, which can make it seem powerless. Check whether being regulated prevents a gland from regulating others.
      - text: 'It releases only digestive enzymes.'
        rationale: |
          This confuses endocrine signals with digestive secretions. Some organs have both jobs. Check whether pituitary products are hormones or digestive enzymes.
      - text: 'It works independently of hormone feedback.'
        rationale: |
          This treats the nickname as proof of independent control. A master label can imply no outside regulation. Check whether feedback and the hypothalamus still act.
    explanation: |
      The hypothalamus regulates pituitary activity. Feedback signals also help control the endocrine network. The pituitary therefore does not control the system on its own.
    approved: true

  - id: q-biology-human-anatomy-physiology-0009
    type: 'classify'
    difficulty: 'medium'
    stem: |
      A fresh cut triggers rapid inflammation and phagocyte activity. Which immune response is described?
    choices:
      - text: 'Innate immunity'
        correct: true
      - text: 'Antigen-specific memory response'
        rationale: |
          This confuses a rapid first response with recall of a specific antigen. Memory responses can also be fast. Check whether earlier exposure or memory cells are stated.
      - text: 'Antibody secretion by plasma cells'
        rationale: |
          This substitutes a specific adaptive product for the stated inflammatory response. Antibodies fight infections too. Check which cells and actions the stem names.
      - text: 'Adaptive clonal-memory response'
        rationale: |
          This assumes speed proves adaptive memory. Repeated exposures can trigger fast adaptive responses. Check whether the described response relies on stored antigen-specific memory.
    explanation: |
      Inflammation and phagocytes are parts of innate immunity. These defenses respond quickly to injury and broad signs of infection.
    approved: true

  - id: q-biology-human-anatomy-physiology-0010
    type: 'classify'
    difficulty: 'medium'
    stem: |
      Years after recovering from a specific virus, a person is exposed to it again, and their body fights it off quickly using memory cells from the earlier infection. What type of immunity is this?
    choices:
      - text: 'Adaptive immunity'
        correct: true
      - text: 'Innate barrier defense'
        rationale: |
          This confuses rapid recall with a general physical barrier. Skin barriers act quickly too. Check whether the response depends on a specific earlier infection.
      - text: 'Innate inflammatory defense'
        rationale: |
          This uses speed alone to classify the response. Inflammation can begin quickly. Check whether antigen-specific memory cells are involved.
      - text: 'Innate antigen-specific memory'
        rationale: |
          This assigns antigen-specific memory cells to innate immunity. Innate responses can also be rapid. Check which immune arm includes memory B and T cells.
    explanation: |
      Memory B and T cells belong to adaptive immunity. After earlier exposure, they can help produce a faster, stronger response to the same antigen.
    approved: true

  - id: q-biology-human-anatomy-physiology-0012
    type: 'structure-function'
    difficulty: 'hard'
    stem: |
      Which statement correctly describes the source and regulation of normal heartbeat?
    choices:
      - text: 'An intrinsic pacemaker starts the rhythm.'
        correct: true
      - text: 'The brain stem starts each individual beat.'
        rationale: |
          This confuses nervous regulation with starting every beat. The brain stem helps regulate cardiovascular activity. Check whether the heart has its own rhythm source.
      - text: 'A conscious decision starts each individual beat.'
        rationale: |
          This treats heartbeat like a chosen limb movement. Some muscles do follow conscious decisions. Check whether beating continues during sleep.
      - text: 'Smooth muscle in the heart wall sets the rhythm.'
        rationale: |
          This confuses smooth and cardiac muscle. Both are involuntary. Check which tissue forms the heart’s pumping wall.
    explanation: |
      The heart has its own pacemaker that starts its rhythm. Nerves and hormones can change that rhythm. A conscious decision is not needed for each beat.
    approved: true

  - id: q-biology-human-anatomy-physiology-0013
    type: 'structure-function'
    difficulty: 'hard'
    stem: |
      Which pair correctly matches the pancreas’s digestive and endocrine outputs?
    choices:
      - text: 'Digestive enzymes; insulin'
        correct: true
      - text: 'Insulin; digestive enzymes'
        rationale: |
          This reverses the two outputs. Both are pancreatic products. Check which enters the intestine and which enters blood.
      - text: 'Bile; digestive enzymes'
        rationale: |
          This assigns bile to the pancreas and enzymes to its endocrine role. Both help digestion. Check the organ that makes bile and the route of endocrine secretion.
      - text: 'Bile; stored urine'
        rationale: |
          This mixes liver secretion and urinary storage with pancreatic roles. All concern body fluids. Check the organ and output named in each role.
    explanation: |
      The pancreas sends digestive enzymes into the small intestine. Its endocrine tissue sends hormones such as insulin into the blood. These are two different roles of the same organ.
    approved: true

  - id: q-biology-human-anatomy-physiology-0014
    type: 'identify'
    difficulty: 'hard'
    stem: |
      Which cells are the major antibody-secreting descendants of activated B cells?
    choices:
      - text: 'Plasma cells'
        correct: true
      - text: 'Memory T cells'
        rationale: |
          This confuses memory lymphocytes with antibody-secreting cells. Both are parts of adaptive immunity. Check which cell type secretes antibodies.
      - text: 'Innate phagocytes'
        rationale: |
          This confuses engulfing material with secreting antibodies. Phagocytes also defend against pathogens. Check the specific defense action described.
      - text: 'Nervous-system cells'
        rationale: |
          This confuses information signals with immune secretion. Nerve cells help coordinate body functions. Check whether the cell is an immune descendant of a B cell.
    explanation: |
      Activated B cells can develop into plasma cells. Plasma cells secrete antibodies that recognize specific targets.
    approved: true

  - id: q-biology-human-anatomy-physiology-0020
    type: 'compare-contrast'
    difficulty: 'exam'
    stem: |
      Which pair correctly matches the endocrine pancreatic hormones to their usual effects on blood glucose?
    choices:
      - text: 'Insulin lowers it; glucagon raises it.'
        correct: true
      - text: 'Insulin raises it; glucagon lowers it.'
        rationale: |
          This reverses the effects of the two hormones. Both come from the pancreas. Check which is associated with lowering blood glucose.
      - text: 'Both raise it after every meal.'
        rationale: |
          This gives both hormones the same effect. They both regulate the same quantity. Check whether their usual actions oppose each other.
      - text: 'Both lower it whenever food is scarce.'
        rationale: |
          This gives both hormones a glucose-lowering role. Both participate in glucose regulation. Check whether low food supply makes raising glucose useful.
    explanation: |
      Insulin generally lowers blood glucose. Glucagon generally raises it. These different effects help regulate glucose in the blood.
    approved: false

  - id: q-biology-human-body-control-movement-and-defense-0001
    type: 'process-ordering'
    difficulty: 'medium'
    stem: |
      A person touches a hot pan and pulls the hand away. Which sequence shows the path of the signal?
    choices:
      - text: 'Receptor, sensory neuron, spinal cord, motor neuron, effector muscle'
        correct: true
      - text: 'Receptor, motor neuron, spinal cord, sensory neuron, effector muscle'
        rationale: |
          This swaps the two kinds of neurons. Both carry signals, so their names are easy to exchange. Check which neuron carries signals toward the central nervous system.
      - text: 'Effector muscle, motor neuron, spinal cord, sensory neuron, receptor'
        rationale: |
          This reverses the whole path. The same parts appear, so the list looks complete. Check that the path begins where the stimulus is detected.
      - text: 'Receptor, sensory neuron, effector muscle, spinal cord, motor neuron'
        rationale: |
          This skips the central nervous system before the motor neuron. The muscle is the visible result, so it seems to come next. Check where the signal turns around in a reflex.
    explanation: |
      The skin receptor detects the heat. A sensory neuron carries the signal to the spinal cord. A motor neuron carries it from the spinal cord to the arm muscle, which pulls the hand away.
    approved: false

  - id: q-biology-human-body-control-movement-and-defense-0002
    type: 'identify'
    difficulty: 'easy'
    stem: |
      Which structure joins a muscle to a bone?
    choices:
      - text: 'A tendon'
        correct: true
      - text: 'A ligament'
        rationale: |
          This picks the structure that joins bone to bone. The two names sound alike and both are strong cords. Check whether the structure connects two bones or a muscle and a bone.
      - text: 'A joint'
        rationale: |
          This picks the place where bones meet. Muscles pull across joints, so a joint can seem to link them. Check whether a joint is a cord or a meeting place.
      - text: 'A motor neuron'
        rationale: |
          This picks the cell that carries signals to a muscle. It reaches the muscle, so it can seem to join it. Check whether the structure holds a muscle to a bone or only signals it.
    explanation: |
      A tendon joins a muscle to a bone. When the muscle shortens, the tendon pulls on the bone. A ligament joins one bone to another bone.
    approved: false

  - id: q-biology-human-body-control-movement-and-defense-0003
    type: 'cause-effect'
    difficulty: 'medium'
    stem: |
      Why do skeletal muscles such as the biceps and triceps work in pairs?
    choices:
      - text: 'A muscle can only pull, so a partner muscle pulls the bone the opposite way.'
        correct: true
      - text: 'A muscle can only push, so a partner muscle pushes the bone the opposite way.'
        rationale: |
          This reverses what a muscle can do. A limb seems to be pushed when it straightens. Check whether a muscle makes force by shortening or by lengthening.
      - text: 'One muscle is voluntary, so a partner muscle must be involuntary.'
        rationale: |
          This mixes up muscle types. Both control types exist in the body, so the idea seems reasonable. Check that biceps and triceps are both skeletal muscles.
      - text: 'Skeletal muscle is striated, so a smooth muscle partner pulls it back.'
        rationale: |
          This mixes up muscle types. Striated and smooth muscle are both real, so the pair seems reasonable. Check that the biceps and triceps are both skeletal.
    explanation: |
      A muscle makes force only by shortening, so it can pull but not push. The biceps pulls the forearm one way. The triceps pulls it the other way.
    approved: false

  - id: q-biology-human-body-control-movement-and-defense-0004
    type: 'classify'
    difficulty: 'easy'
    stem: |
      Which cells carry signals toward the central nervous system?
    choices:
      - text: 'Sensory neurons'
        correct: true
      - text: 'Motor neurons'
        rationale: |
          These carry signals the other way, to muscles and glands. Both are neurons in the peripheral nervous system, so they are easy to mix. Check whether the signal goes toward or away from the brain and spinal cord.
      - text: 'Glial cells'
        rationale: |
          These are in the nervous system, so they seem to fit. They protect and feed neurons rather than carry signals. Check which cells carry the electrical signal.
      - text: 'Muscle cells'
        rationale: |
          These respond to signals, so they seem linked to them. They are effectors and do not carry a signal to the central nervous system. Check which cells do the carrying.
    explanation: |
      Sensory neurons carry signals from receptors toward the brain and spinal cord. Motor neurons carry signals away from them, to muscles and glands.
    approved: false

  - id: q-biology-human-body-control-movement-and-defense-0005
    type: 'classify'
    difficulty: 'hard'
    stem: |
      Blood glucose falls too low, and the pancreas releases glucagon. Glucagon makes the liver release stored glucose into the blood. How is this response classified?
    choices:
      - text: 'Negative feedback, because the response reverses the change.'
        correct: true
      - text: 'Positive feedback, because the response raises the glucose level.'
        rationale: |
          This links positive with going up. Glucose does rise, so the word seems to fit. Check whether the response reverses or adds to the original change.
      - text: 'Negative feedback, because the glucose level went down.'
        rationale: |
          The name is right, but the reason is wrong. A fall in level is the change, not the feedback type. Check whether the type depends on the response rather than the direction.
      - text: 'Neither, because only insulin forms a feedback loop.'
        rationale: |
          Insulin is the best-known loop, so it can seem to be the only one. The lesson shows a second loop for low glucose. Check what glucagon does after a fall.
    explanation: |
      In negative feedback, the response reverses the change. Glucose fell, and glucagon makes it rise again. The name does not depend on whether the level goes up or down.
    approved: false

  - id: q-biology-human-body-control-movement-and-defense-0006
    type: 'identify'
    difficulty: 'medium'
    stem: |
      Which hormone, made by the hypothalamus and released by the posterior pituitary, tells the kidneys to keep more water?
    choices:
      - text: 'Antidiuretic hormone (ADH)'
        correct: true
      - text: 'Oxytocin'
        rationale: |
          The posterior pituitary also releases this hormone, so it seems to fit. It is not the one that tells the kidneys to keep water. Check which hormone acts on the kidneys.
      - text: 'Glucagon'
        rationale: |
          This is a hormone from the pancreas, so it seems to be a general hormone answer. It acts on blood glucose. Check which gland releases it.
      - text: 'Testosterone'
        rationale: |
          This is a well-known hormone, so it can seem to fit any question. The testes make it. Check which gland releases the hormone in the question.
    explanation: |
      The hypothalamus makes ADH, and the posterior pituitary releases it. ADH tells the kidneys to keep more water, so less water leaves in urine.
    approved: false

  - id: q-biology-human-body-control-movement-and-defense-0007
    type: 'identify'
    difficulty: 'medium'
    stem: |
      Where does fertilization most often happen?
    choices:
      - text: 'In the uterine tube'
        correct: true
      - text: 'In the uterus'
        rationale: |
          This is where the zygote attaches later, so it seems to be the place where the new cell starts. Check where the sperm meets the oocyte before the zygote moves along.
      - text: 'In the ovary'
        rationale: |
          The ovary holds the developing oocytes, so it seems to be the meeting place. The oocyte leaves it at ovulation. Check where the oocyte goes after it is released.
      - text: 'In the testis'
        rationale: |
          This is where sperm are made, so it can seem to be the meeting place. The sperm travel out of the male body. Check where the sperm meets the oocyte.
    explanation: |
      An ovary releases an oocyte, and it enters the uterine tube. Sperm that reach the tube can fuse with it there. The zygote then moves toward the uterus and attaches to its lining.
    approved: false

  - id: q-biology-human-body-control-movement-and-defense-0008
    type: 'cause-effect'
    difficulty: 'medium'
    stem: |
      Why can a vaccine protect a person from a disease without causing the disease?
    choices:
      - text: 'It gives a safe look at an antigen, so memory cells form.'
        correct: true
      - text: 'It trains phagocytes to remember the pathogen.'
        rationale: |
          Phagocytes act in the immune response, so this seems reasonable. They belong to innate immunity, which builds no memory. Check which cells stay behind after a response.
      - text: 'It supplies antibodies that match any antigen.'
        rationale: |
          Antibodies are important in immunity, so this seems reasonable. Each antibody binds one particular antigen. Check whether an antibody is specific or general.
      - text: 'It makes the skin and mucus barriers stronger against that germ.'
        rationale: |
          Barriers are part of the body's defense, so this seems reasonable. They act the same way for every germ. Check which defense is specific to one antigen.
    explanation: |
      A vaccine shows the immune system an antigen without the disease. The body forms memory cells. If the real germ comes later, the response is faster and stronger.
    approved: false

  - id: q-biology-human-body-control-movement-and-defense-0009
    type: 'classify'
    difficulty: 'medium'
    stem: |
      Which bones belong to the appendicular skeleton?
    choices:
      - text: 'The limb bones and the shoulder and hip girdles'
        correct: true
      - text: 'The skull, vertebral column, and rib cage'
        rationale: |
          These bones belong to the axial skeleton. Both groups are parts of the skeleton, and the names are close. Check which group includes the limbs.
      - text: 'The skull and the shoulder girdle'
        rationale: |
          This pairs the skull with the shoulder girdle. The shoulder girdle is appendicular, but the skull is axial, so the pair looks half right. Check where the skull belongs.
      - text: 'The vertebral column and the hip girdle'
        rationale: |
          This pairs the vertebral column with the hip girdle. The hip girdle is appendicular, but the vertebral column is axial, so the pair looks half right. Check where the vertebral column belongs.
    explanation: |
      The appendicular skeleton is the limbs and the girdles that attach them to the body. The shoulder and hip girdles are included. The skull, vertebral column, and rib cage form the axial skeleton.
    approved: false

  - id: q-biology-human-body-control-movement-and-defense-0010
    type: 'structure-function'
    difficulty: 'medium'
    stem: |
      Which brain region has centers that control breathing and blood pressure?
    choices:
      - text: 'The brain stem'
        correct: true
      - text: 'The cerebrum'
        rationale: |
          This region handles thinking and voluntary movement. A runner moves on purpose, so it seems involved. Check whether breathing control is automatic.
      - text: 'The cerebellum'
        rationale: |
          This region helps with coordination, timing, and balance. Running needs balance, so it seems involved. Check which region has the centers for breathing.
      - text: 'The hypothalamus'
        rationale: |
          This region sits above the pituitary and controls it. It sounds like a control center, so it seems to fit. Check which region the lesson links to breathing and blood pressure.
    explanation: |
      The brain stem has the centers that control breathing and blood pressure. It works automatically. During exercise it can raise the breathing rate and the heart rate.
    approved: false
