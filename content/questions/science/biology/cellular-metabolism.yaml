meta:
  subject: "science"
  topic: "biology"
  subtopic: "cellular-metabolism"
  exams: ["upcat", "dlsucet", "ustet", "dost-sei", "acet"]
questions:
  - id: q-biology-cellular-metabolism-0001
    type: "identify"
    difficulty: "easy"
    stem: |
      In the simplified net equation for oxygenic photosynthesis, carbon dioxide, water, and light energy are inputs. Which substances are the overall products?
    choices:
      - text: "Glucose and oxygen"
        correct: true
      - text: "Carbon dioxide and water"
        rationale: |
          This lists reactants as products. These substances appear in the photosynthesis equation, so they look familiar. Check which side of the arrow contains the products.
      - text: "ATP and water"
        rationale: |
          This confuses the net products of photosynthesis with products of aerobic respiration. ATP is involved in energy transfer, so it seems to fit an energy-capturing process. Check the overall equation named in the question.
      - text: "Glucose and carbon dioxide"
        rationale: |
          This keeps glucose but treats carbon dioxide as an output. Carbon dioxide is a gas exchanged by plants, so it can seem like a released product. Check whether carbon is being taken in to build glucose.
    explanation: |
      In the simplified net equation, oxygenic photosynthesis uses carbon dioxide, water, and light energy. It forms glucose, which stores energy, and releases oxygen.
    approved: true

  - id: q-biology-cellular-metabolism-0003
    type: "identify"
    difficulty: "medium"
    stem: |
      In a photosynthetic plant cell, which organelle carries out photosynthesis?
    choices:
      - text: "Chloroplast"
        correct: true
      - text: "Mitochondrion"
        rationale: |
          This confuses releasing energy from food with capturing light to make food. Both organelles handle energy, so they are easy to swap. Check which one contains the photosynthetic machinery.
      - text: "Nucleus"
        rationale: |
          This confuses storing genetic instructions with carrying out photosynthesis. The nucleus controls gene activity, so it can seem to perform the process itself. Check the organelle where light energy is captured.
      - text: "Ribosome"
        rationale: |
          This confuses making the proteins needed for photosynthesis with the process itself. Ribosomes build cell proteins, so they help indirectly. Check which organelle carries out photosynthesis.
    explanation: |
      Plant cells carry out photosynthesis in chloroplasts. Chlorophyll in these organelles captures light energy.
    approved: true

  - id: q-biology-cellular-metabolism-0005
    type: "cause-effect"
    difficulty: "medium"
    stem: |
      A photosynthetic plant cell has chloroplasts whose light-capturing machinery is damaged. Other conditions remain suitable. Which process is most directly reduced?
    choices:
      - text: "Glucose production from carbon dioxide"
        correct: true
      - text: "ATP production by mitochondrial respiration"
        rationale: |
          This treats a damaged chloroplast as a damaged mitochondrion. Both help manage energy, so the organelles can be mixed up. Check which process directly depends on chloroplast light capture.
      - text: "Glucose breakdown during cytosolic glycolysis"
        rationale: |
          This confuses the location of glycolysis with the location of photosynthesis. Both use or produce glucose, so they seem connected to the same compartment. Check where glycolysis occurs.
      - text: "Carbon fixation increasing without light capture"
        rationale: |
          This assumes losing light capture can increase food production. A cell may need more food when stressed, so an increase sounds useful. Check whether its energy input has increased or decreased.
    explanation: |
      Chloroplasts use light energy to build organic molecules from carbon dioxide. Damaging their light-capturing machinery reduces photosynthesis, so less glucose can be made from carbon dioxide.
    approved: true

  - id: q-biology-cellular-metabolism-0007
    type: "cause-effect"
    difficulty: "medium"
    stem: |
      Which event supplies the oxygen gas released during oxygenic photosynthesis?
    choices:
      - text: "Water splitting in the light reactions"
        correct: true
      - text: "Carbon dioxide splitting in the light reactions"
        rationale: |
          This assigns the released gas to the wrong input molecule. Carbon dioxide contains oxygen atoms, so it seems a possible source. Check which substance is split to release oxygen during the light reactions.
      - text: "Glucose breakdown during aerobic respiration"
        rationale: |
          This treats glucose breakdown as the source of oxygen gas. Glucose contains oxygen atoms and stores energy, so breaking it seems able to release both. Check the gas used during aerobic respiration.
      - text: "Conversion of sunlight directly into oxygen atoms"
        rationale: |
          This treats sunlight as a source of atoms. Light powers photosynthesis, so it may seem to supply the oxygen itself. Check whether energy input provides matter or drives a reaction.
    explanation: |
      The oxygen gas released by oxygenic photosynthesis comes from water. Water is split during the light-dependent reactions, releasing oxygen.
    approved: true

  - id: q-biology-cellular-metabolism-0009
    type: "classify"
    difficulty: "hard"
    stem: |
      An equation shows carbon dioxide, water, and light energy forming glucose and oxygen. Which process does it describe?
    choices:
      - text: "Oxygenic photosynthesis"
        correct: true
      - text: "Aerobic cellular respiration"
        rationale: |
          This confuses an energy-producing pathway with an energy-storing one. Both involve glucose, so either name may seem right. Check whether glucose is being made or broken down.
      - text: "Photosynthesis and respiration with identical inputs"
        rationale: |
          This assumes both pathways have identical inputs. Their overall equations contain many of the same substances. Check which substances are on the input side.
      - text: "Fermentation powered directly by sunlight"
        rationale: |
          This confuses the absence of oxygen input with fermentation. Fermentation can occur without oxygen, so that clue seems useful. Check whether light and carbon dioxide are being used to build glucose.
    explanation: |
      The equation uses light energy to build glucose from carbon dioxide and water. That describes the simplified net reaction of oxygenic photosynthesis.
    approved: true

  - id: q-biology-cellular-metabolism-0013
    type: "identify"
    difficulty: "medium"
    stem: |
      Identify the missing product in this equation, and name the process it represents: $6CO_2 + 6H_2O + \text{light energy} \rightarrow C_6H_{12}O_6 + \, ?$
    choices:
      - text: "$6O_2$; oxygenic photosynthesis"
        correct: true
      - text: "$6CO_2$; aerobic cellular respiration"
        rationale: |
          This uses the familiar respiration output without following the equation. Carbon dioxide appears in both overall reactions, so the process names can be swapped. Check whether glucose is on the product side.
      - text: "ATP; aerobic cellular respiration"
        rationale: |
          This assumes ATP is the final output of any energy-related equation. ATP is used within photosynthesis, so it seems relevant. Check the simplified net equation rather than intermediate reactions.
      - text: "$6H_2O$; oxygenic photosynthesis"
        rationale: |
          This repeats water as the missing net product. Water contains oxygen, so it can seem to fit the blank. Check which gas appears as a product in the simplified equation.
    explanation: |
      Count the oxygen atoms on the left: $6 \times 2 + 6 = 18$. Glucose on the right holds $6$ of them. That leaves $18 - 6 = 12$ oxygen atoms. Each $O_2$ molecule has $2$ atoms, so $12 \div 2 = 6$ molecules. The missing product is $6O_2$. Carbon dioxide, water, and light go in and make glucose and oxygen, so the process is oxygenic photosynthesis.
    approved: true

  - id: q-biology-cellular-metabolism-0021
    type: "identify"
    difficulty: "easy"
    stem: |
      Which group of biomolecules includes DNA and RNA?
    choices:
      - text: "Nucleic acids"
        correct: true
      - text: "Proteins"
        rationale: |
          DNA carries the instructions for building proteins, so the two seem linked. Proteins are chains of amino acids. Check which group stores and uses genetic information.
      - text: "Lipids"
        rationale: |
          Lipids include fats and oils, which are stored in cells. Cells hold many stored materials. Check which group is made of fats, oils, phospholipids and steroids.
      - text: "Carbohydrates"
        rationale: |
          Carbohydrates are the usual fuel in cells. DNA contains a sugar, so the link seems close. Check which group stores genetic information.
    explanation: |
      DNA and RNA store and use genetic information. The group of biomolecules with this job is called nucleic acids.
    approved: false

  - id: q-biology-cellular-metabolism-0022
    type: "cause-effect"
    difficulty: "easy"
    stem: |
      A cell breaks off the last phosphate group from an ATP molecule. What happens?
    choices:
      - text: "ADP forms, and energy is released for cell work"
        correct: true
      - text: "ADP forms, and the cell must take in energy"
        rationale: |
          This gets the molecule right but the energy wrong. Breaking a bond takes some energy, so the cell seems to spend energy here. Check that the whole reaction, ATP to ADP, releases energy for cell work.
      - text: "A new ATP forms, and energy is released"
        rationale: |
          This treats the new molecule as ATP. ATP is the energy molecule, so it seems to be the product. Check that ATP loses one phosphate and becomes ADP.
      - text: "ADP forms, and the cell stores the energy in the phosphate"
        rationale: |
          This says the energy is stored when the phosphate leaves. The phosphate does carry energy while attached. Check that breaking it off releases energy for cell work.
    explanation: |
      ATP has three phosphate groups. When the last one breaks off, ATP becomes ADP. This releases energy that the cell can use for its work.
    approved: false

  - id: q-biology-cellular-metabolism-0023
    type: "structure-function"
    difficulty: "easy"
    stem: |
      What does an enzyme do in a chemical reaction in a cell?
    choices:
      - text: "It lowers the energy needed to start the reaction and is not used up"
        correct: true
      - text: "It supplies the energy for the reaction and is then used up"
        rationale: |
          This gives the job of ATP to the enzyme. Enzymes work with energy, so the link seems fair. Check that an enzyme comes out of the reaction unchanged.
      - text: "It joins the products and leaves with them when the reaction ends"
        rationale: |
          This treats the enzyme like a reactant. Reactants end up in the products. Check that the enzyme is ready to work again after the reaction.
      - text: "It raises the energy the reaction needs so the cell can control the timing"
        rationale: |
          This reverses the effect on the starting energy. Cells do control their reactions. Check that an enzyme makes a reaction easier to start.
    explanation: |
      An enzyme speeds up a reaction by making it easier to start. It lowers the energy the reaction needs to get going. The enzyme is not used up, so it can work again.
    approved: false

  - id: q-biology-cellular-metabolism-0024
    type: "identify"
    difficulty: "medium"
    stem: |
      Which of these is an organic molecule?
    choices:
      - text: "Glucose"
        correct: true
      - text: "Carbon dioxide"
        rationale: |
          This molecule has a carbon atom, so it seems organic. It is a carbon compound but is not called organic. Check for a carbon-based molecule of living things, such as a sugar, fat, or protein.
      - text: "Oxygen gas"
        rationale: |
          Oxygen gas is vital for living things, so it seems linked to life. It has no carbon. Check for a carbon-based molecule, such as a sugar, fat, or protein.
      - text: "Water"
        rationale: |
          Water is in every cell, so it seems like a biological molecule. It has no carbon. Check for a carbon-based molecule, such as a sugar, fat, or protein.
    explanation: |
      Glucose, $C_6H_{12}O_6$, is a carbon-based sugar. Living things make sugars, so glucose is an organic molecule.
    approved: false

  - id: q-biology-cellular-metabolism-0025
    type: "identify"
    difficulty: "medium"
    stem: |
      Which molecules are the main part of cell membranes?
    choices:
      - text: "Phospholipids, a kind of lipid"
        correct: true
      - text: "Cellulose, a kind of carbohydrate"
        rationale: |
          Cellulose is also a structural molecule. It makes the cell walls of plants, not the membrane. Check which molecules form the membrane around every cell.
      - text: "Starch, a kind of carbohydrate"
        rationale: |
          Starch is a big molecule found in plant cells. It stores sugar for fuel. Check which group is built for the membrane, not for fuel storage.
      - text: "DNA, a kind of nucleic acid"
        rationale: |
          DNA is in cells, so it seems close to the membrane. It stores genetic information inside the cell. Check which group has fats and oils.
    explanation: |
      Phospholipids are the main molecules of cell membranes. They are a kind of lipid.
    approved: false

  - id: q-biology-cellular-metabolism-0026
    type: "cause-effect"
    difficulty: "medium"
    stem: |
      An enzyme works best at 37 degrees Celsius. A sample is heated to 85 degrees Celsius and then cooled back to 37 degrees Celsius. The enzyme no longer works. What is the best explanation?
    choices:
      - text: "Heat changed the enzyme's shape, so its active site no longer fits the substrate"
        correct: true
      - text: "Heat used up the enzyme while it sped up the reaction"
        rationale: |
          This treats the enzyme like a reactant. Reactants are used up. Check that an enzyme comes out of a reaction unchanged.
      - text: "Heat changed the substrate, so the enzyme has nothing to bind"
        rationale: |
          The substrate matters for the fit. The question says the enzyme itself no longer works. Check what heat does to the shape of a protein.
      - text: "Cooling slowed the enzyme but left its shape unchanged"
        rationale: |
          Cold does slow enzymes without breaking their shape. The sample was cooled to 37 degrees Celsius, the best temperature. Check what the earlier heating did.
    explanation: |
      High heat changes the shape of an enzyme. This is called denaturing. The active site no longer fits the substrate. Cooling does not usually bring the shape back, so the enzyme stays inactive.
    approved: false

  - id: q-biology-cellular-metabolism-0027
    type: "identify"
    difficulty: "medium"
    stem: |
      Where do the light reactions of photosynthesis happen in a plant cell, and what do they make?
    choices:
      - text: "In the thylakoid membranes; they make ATP, NADPH and oxygen gas"
        correct: true
      - text: "In the stroma; they make ATP, NADPH and oxygen gas"
        rationale: |
          The products are right but the place is wrong. The stroma is the fluid around the thylakoids. Check where the chlorophyll sits.
      - text: "In the thylakoid membranes; they make a three-carbon sugar"
        rationale: |
          The place is right but the product is wrong. Sugar is the final goal of photosynthesis. Check which stage turns carbon dioxide into sugar.
      - text: "In the stroma; they make a three-carbon sugar"
        rationale: |
          This describes the Calvin cycle. The two stages are linked, so they are easy to swap. Check which stage needs light-made ATP and NADPH.
    explanation: |
      The light reactions happen in the thylakoid membranes. Chlorophyll absorbs light there. The energy splits water, releases oxygen gas, and makes ATP and NADPH.
    approved: false

  - id: q-biology-cellular-metabolism-0028
    type: "identify"
    difficulty: "medium"
    stem: |
      Which set of inputs does the Calvin cycle use to make a three-carbon sugar?
    choices:
      - text: "Carbon dioxide, ATP and NADPH"
        correct: true
      - text: "Water, light and carbon dioxide"
        rationale: |
          These are the inputs of the whole process. The Calvin cycle is one stage. Check which stage uses water and light.
      - text: "Oxygen gas, ATP and NADPH"
        rationale: |
          The ATP and NADPH are right. Oxygen gas is a product of the light reactions, not an input. Check which gas the cycle takes in to build sugar.
      - text: "Water, ADP and NADP+"
        rationale: |
          These are the leftovers of the Calvin cycle and the light-reaction inputs. They look like what goes back and forth. Check what the Calvin cycle needs to build sugar.
    explanation: |
      The Calvin cycle happens in the stroma. It uses the ATP and NADPH from the light reactions. It also uses carbon dioxide, which it turns into a three-carbon sugar.
    approved: false

  - id: q-biology-cellular-metabolism-0029
    type: "cause-effect"
    difficulty: "hard"
    stem: |
      Cyanobacteria are prokaryotes that carry out photosynthesis and release oxygen. Where do their light reactions and Calvin cycle take place?
    choices:
      - text: "Inside the cell, because they have no chloroplasts"
        correct: true
      - text: "In chloroplasts, as in plants and algae"
        rationale: |
          This applies the plant rule to a bacterium. The photosynthesis stages are the same kind. Check that a chloroplast is an organelle of eukaryotes.
      - text: "In mitochondria, which prokaryotes have in place of chloroplasts"
        rationale: |
          Mitochondria also handle energy in cells. A prokaryote has no membrane-bound organelles. Check what a prokaryote lacks.
      - text: "Nowhere, because prokaryotes cannot carry out photosynthesis"
        rationale: |
          This says photosynthesis needs organelles. Plants use chloroplasts, so the link seems fair. Check that cyanobacteria release oxygen.
    explanation: |
      A prokaryote has no membrane-bound organelles. Cyanobacteria have no chloroplasts and no stroma. They run both stages of photosynthesis inside the cell.
    approved: false

  - id: q-biology-cellular-metabolism-0030
    type: "simple-quantitative"
    difficulty: "hard"
    stem: |
      By the simplified net equation of photosynthesis, how many molecules of oxygen gas are released when a plant makes 3 molecules of glucose?
    choices:
      - text: "18"
        correct: true
      - text: "6"
        rationale: |
          This counts the oxygen for one glucose only. The equation shows $6O_2$ with one glucose. Check how many glucose molecules the question asks about.
      - text: "9"
        rationale: |
          This adds $6$ and $3$ instead of multiplying them. Adding feels natural with two numbers. Check that each glucose comes with $6O_2$.
      - text: "36"
        rationale: |
          This counts oxygen atoms, not molecules. Each $O_2$ molecule has two atoms. Check the unit asked for in the question.
    explanation: |
      The equation shows $6O_2$ released for each glucose. For $3$ glucose molecules, multiply: $3\times6=18$ molecules of oxygen gas.
    approved: false

  - id: q-biology-cellular-metabolism-0031
    type: "compare-contrast"
    difficulty: "hard"
    stem: |
      Compared with the same mass of carbohydrate, how much energy does a fat provide?
    choices:
      - text: "More energy, which is why fats and oils store a lot of energy"
        correct: true
      - text: "Less energy, because sugars are the usual fuel for cells"
        rationale: |
          Sugars are the usual fuel, which seems to make them the richest. Usual fuel does not mean the most energy per gram. Check what the lesson says about fats and oils.
      - text: "The same energy, because cells break down both in the same pathways"
        rationale: |
          Cells can feed fats into the same pathways as sugars. That does not make the energy equal. Check the amount of energy per gram.
      - text: "No energy, because fats are only used to build membranes"
        rationale: |
          Phospholipids do build membranes. Fats and oils also store energy. Check the jobs of lipids.
    explanation: |
      Fats give more energy per gram than carbohydrates do. Fats and oils store a lot of energy for this reason. Cells can break them down and feed the pieces into the same pathways as sugar.
    approved: false

  - id: q-biology-cellular-metabolism-0032
    type: "classify"
    difficulty: "hard"
    stem: |
      Which pair contains two eukaryotes?
    choices:
      - text: "Fungi and algae"
        correct: true
      - text: "Bacteria and fungi"
        rationale: |
          Bacteria are common microbes, like fungi. Bacteria have no nucleus. Check which of the two has a nucleus.
      - text: "Cyanobacteria and algae"
        rationale: |
          Both carry out photosynthesis and release oxygen. Cyanobacteria are prokaryotes. Check which one has no nucleus.
      - text: "Bacteria and plants"
        rationale: |
          Plants are eukaryotes, which seems to make the pair work. Bacteria are prokaryotes. Check which of the two lacks a nucleus.
    explanation: |
      A eukaryote has a nucleus and organelles. Fungi and algae both have cells with a nucleus, so both are eukaryotes.
    approved: false

  - id: q-biology-cellular-metabolism-0033
    type: "cause-effect"
    difficulty: "exam"
    stem: |
      What happens to ADP after a cell uses the energy from ATP?
    choices:
      - text: "It can gain a phosphate to become ATP again, so the molecules are reused"
        correct: true
      - text: "It is used up completely, so the cell must take in new ATP molecules"
        rationale: |
          This treats ATP like a fuel that burns away. Energy is released, so it seems to be consumed. Check that other reactions add a phosphate back to ADP.
      - text: "It has three phosphate groups and carries more energy than ATP"
        rationale: |
          This swaps the two molecules. The name ADP has a D for two. Check how many phosphate groups ATP has.
      - text: "It is a waste product that the cell removes after use"
        rationale: |
          Energy is released, so what is left seems like waste. A cell does not throw it away. Check that ADP can gain a phosphate and become ATP again.
    explanation: |
      ADP has two phosphate groups. Other reactions in the cell can add a phosphate back to ADP. That makes ATP again, so the same molecules are used again and again.
    approved: false

  - id: q-biology-cellular-metabolism-0034
    type: "structure-function"
    difficulty: "exam"
    stem: |
      Which description fits an electron carrier such as NADPH?
    choices:
      - text: "It picks up electrons in one place and drops them off in another"
        correct: true
      - text: "It speeds up a reaction and stays unchanged afterward"
        rationale: |
          This describes an enzyme. Both help reactions, so they are easy to confuse. Check that a carrier moves electrons between places.
      - text: "It absorbs red and blue light in the thylakoid membranes"
        rationale: |
          This describes chlorophyll. NADPH is also made in the light reactions. Check which molecule absorbs light.
      - text: "It splits water to release oxygen gas in the stroma"
        rationale: |
          NADPH is made in the light reactions, so its electron-carrying job is easy to mix up with water splitting, which also happens there. Water is split in the thylakoid membranes, not by NADPH. Check that NADPH carries electrons to the Calvin cycle.
    explanation: |
      An electron carrier picks up electrons in one place and drops them off in another. NADPH is made in the light reactions. The Calvin cycle uses it to turn carbon dioxide into sugar.
    approved: false
