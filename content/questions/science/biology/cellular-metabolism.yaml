questions:
  - id: q-biology-cellular-metabolism-0001
    type: identify
    difficulty: easy
    stem: |
      Photosynthesis uses carbon dioxide, water, and light energy as raw materials. What are its two products?
    choices:
      - text: Glucose and oxygen
        correct: true
      - text: Carbon dioxide and water
        rationale: |
          You listed the raw materials, not the products. Carbon dioxide and
          water go into photosynthesis. Glucose and oxygen come out of it.
      - text: ATP and water
        rationale: |
          You picked outputs of cellular respiration, not photosynthesis. ATP
          is made when the cell breaks down glucose. Photosynthesis makes
          glucose and oxygen.
      - text: Glucose and carbon dioxide
        rationale: |
          You got one product right but swapped the other. Glucose is a
          product of photosynthesis, but carbon dioxide is one of its raw
          materials. The second product is oxygen.
    explanation: |
      Photosynthesis combines carbon dioxide, water, and light energy to produce glucose (the plant's food) and oxygen (released as a byproduct).
    approved: true
  - id: q-biology-cellular-metabolism-0002
    type: identify
    difficulty: easy
    stem: |
      Cellular respiration uses glucose and oxygen as raw materials. What are its products?
    choices:
      - text: Carbon dioxide, water, and ATP (energy)
        correct: true
      - text: Glucose and oxygen
        rationale: |
          You listed the raw materials of cellular respiration, not the
          products. Glucose and oxygen go in. Carbon dioxide, water, and ATP
          come out.
      - text: Only oxygen
        rationale: |
          You named a raw material of cellular respiration, not a product.
          Oxygen is consumed during respiration. The products are carbon
          dioxide, water, and ATP.
      - text: Light energy and glucose
        rationale: |
          You described inputs of photosynthesis, not outputs of cellular
          respiration. Cellular respiration breaks down glucose to release
          ATP, carbon dioxide, and water.
    explanation: |
      Cellular respiration breaks down glucose and oxygen to produce carbon dioxide, water, and usable energy stored as ATP.
    approved: true
  - id: q-biology-cellular-metabolism-0003
    type: identify
    difficulty: medium
    stem: |
      In which organelle does photosynthesis take place?
    choices:
      - text: Chloroplast
        correct: true
      - text: Mitochondrion
        rationale: |
          You picked the organelle for cellular respiration, not
          photosynthesis. The mitochondrion breaks down glucose into ATP.
          The chloroplast is the one that uses sunlight to make glucose.
      - text: Nucleus
        rationale: |
          You picked the organelle that stores DNA and controls the cell. The
          nucleus does not capture sunlight or make glucose. Photosynthesis
          happens in the chloroplast.
      - text: Ribosome
        rationale: |
          You picked the organelle that builds proteins. The ribosome reads
          DNA instructions to make proteins. Photosynthesis happens in the
          chloroplast.
    explanation: |
      Photosynthesis happens inside the chloroplast, using chlorophyll to capture sunlight.
    approved: true
  - id: q-biology-cellular-metabolism-0004
    type: identify
    difficulty: medium
    stem: |
      In which organelle does cellular respiration mainly take place?
    choices:
      - text: Mitochondrion
        correct: true
      - text: Chloroplast
        rationale: |
          You picked the organelle for photosynthesis, not cellular
          respiration. The chloroplast captures sunlight to make glucose.
          The mitochondrion breaks down glucose to make ATP.
      - text: Nucleus
        rationale: |
          You picked the organelle that stores DNA and controls the cell. The
          nucleus does not break down glucose. Cellular respiration happens
          mainly in the mitochondrion.
      - text: Ribosome
        rationale: |
          You picked the organelle that builds proteins. The ribosome reads
          DNA instructions to link amino acids. Cellular respiration happens
          in the mitochondrion.
    explanation: |
      Cellular respiration mainly happens inside the mitochondrion, which is why it is often called the cell's "powerhouse."
    approved: true
  - id: q-biology-cellular-metabolism-0005
    type: classify
    difficulty: medium
    stem: |
      A student examines a green, disc-shaped organelle under a microscope. Which process does this organelle perform?
    choices:
      - text: Photosynthesis, since this describes a chloroplast.
        correct: true
      - text: Cellular respiration, since this describes a mitochondrion.
        rationale: |
          You named the wrong organelle. A mitochondrion is bean-shaped with
          folded inner membranes and is not green. A green, disc-shaped
          organelle is a chloroplast, which does photosynthesis.
      - text: Both processes equally.
        rationale: |
          You split the function between both processes, but a single organelle
          does one job. The green, disc-shaped chloroplast does photosynthesis.
          The mitochondrion does cellular respiration.
      - text: 'Neither: this organelle does not perform any energy process.'
        rationale: |
          You said the organelle has no energy role, but the chloroplast is
          central to energy capture. It uses chlorophyll to convert sunlight
          into glucose through photosynthesis.
    explanation: |
      A green, disc-shaped organelle matches the chloroplast, whose green color comes from chlorophyll, and which performs photosynthesis.
    approved: true
  - id: q-biology-cellular-metabolism-0006
    type: classify
    difficulty: medium
    stem: |
      A student examines a bean-shaped organelle with folded inner membranes under a microscope. Which process does this organelle perform?
    choices:
      - text: Cellular respiration, since this describes a mitochondrion.
        correct: true
      - text: Photosynthesis, since this describes a chloroplast.
        rationale: |
          You named the wrong organelle. Photosynthesis happens in a
          chloroplast, which is green and disc-shaped. The one described here
          has no pigment and a folded interior.
      - text: Both processes equally.
        rationale: |
          You split the function between both processes, but each organelle
          does one job. The bean-shaped mitochondrion does cellular
          respiration. The chloroplast does photosynthesis.
      - text: 'Neither: this organelle does not perform any energy process.'
        rationale: |
          You said the organelle has no energy role, but the mitochondrion is
          the cell's main energy-releasing structure. It breaks down glucose
          into ATP through cellular respiration.
    explanation: |
      A bean-shaped organelle with folded inner membranes matches the mitochondrion, which performs cellular respiration.
    approved: true
  - id: q-biology-cellular-metabolism-0007
    type: cause-effect
    difficulty: medium
    stem: |
      Why does the oxygen that animals breathe in ultimately come from plants?
    choices:
      - text: Photosynthesis in plants produces oxygen as a byproduct while making glucose, which animals then use in cellular respiration.
        correct: true
      - text: Animals produce their own oxygen internally, unrelated to plants.
        rationale: |
          You said animals make their own oxygen, but animals cannot produce
          oxygen. They consume it during cellular respiration and get it from
          the oxygen plants release during photosynthesis.
      - text: Plants absorb oxygen from animals and store it for later use.
        rationale: |
          You reversed the direction. Plants release oxygen as a byproduct of
          photosynthesis. Animals breathe that oxygen in. Plants do not
          absorb and store oxygen from animals.
      - text: Oxygen is created directly by the Sun, unrelated to any living process.
        rationale: |
          You removed living things from the oxygen cycle entirely. The Sun
          provides the energy for photosynthesis, but the oxygen is made by
          plants, not by the Sun directly.
    explanation: |
      Photosynthesis releases oxygen as a byproduct of making glucose. This oxygen becomes available for animals (and plants themselves) to use as a raw material in cellular respiration.
    approved: true
  - id: q-biology-cellular-metabolism-0008
    type: classify
    difficulty: hard
    stem: |
      A student claims, "Plants only perform photosynthesis; only animals perform cellular respiration." Is this correct?
    choices:
      - text: 'No: plants perform both photosynthesis (to make food) and cellular respiration (to use that food for energy), just like animal cells.'
        correct: true
      - text: 'Yes: plants never need ATP energy, unlike animals.'
        rationale: |
          You said plants do not need ATP, but every living cell needs ATP to
          do work. Plant cells use cellular respiration to convert their own
          glucose into ATP energy just like animal cells do.
      - text: 'No: plants only perform cellular respiration, never photosynthesis.'
        rationale: |
          You kept the error but reversed it. Plants do perform photosynthesis.
          That is how they make glucose. They also perform cellular respiration
          to convert that glucose into usable ATP.
      - text: 'Yes: only animal cells contain mitochondria.'
        rationale: |
          You said plant cells lack mitochondria, but that is not true. Plant
          cells have both chloroplasts and mitochondria. They use the
          mitochondria to perform cellular respiration.
    explanation: |
      Plant cells need ATP energy just as much as animal cells do. To get it, they also perform cellular respiration, breaking down some of the glucose they produced through photosynthesis.
    approved: true
  - id: q-biology-cellular-metabolism-0009
    type: classify
    difficulty: hard
    stem: |
      A student writes an equation with "light energy" as one of the inputs, but labels it cellular respiration. Is this labeling correct?
    choices:
      - text: 'No: an equation with light energy as an input describes photosynthesis, not cellular respiration.'
        correct: true
      - text: 'Yes: light energy is always an input for cellular respiration.'
        rationale: |
          You accepted the label, but light energy is not an input for cellular
          respiration. Cellular respiration breaks down glucose and oxygen to
          release ATP. Light energy is an input for photosynthesis.
      - text: 'No: but only because light energy is never used by any biological process.'
        rationale: |
          You got the label wrong but gave the wrong reason. Light energy is
          used by a biological process. Photosynthesis uses it to make
          glucose. That is why the equation describes photosynthesis, not
          cellular respiration.
      - text: 'Yes: photosynthesis and cellular respiration use identical inputs.'
        rationale: |
          You said the two processes share the same inputs, but they do not.
          Photosynthesis needs light energy, carbon dioxide, and water.
          Cellular respiration needs glucose and oxygen.
    explanation: |
      Light energy is a defining input of photosynthesis. Cellular respiration's defining output is ATP energy, not an input of light: mixing these up reverses the two equations.
    approved: true
  - id: q-biology-cellular-metabolism-0010
    type: classify
    difficulty: hard
    stem: |
      A student says the mitochondrion is where photosynthesis happens, since it is also involved in energy production. Is this correct?
    choices:
      - text: 'No: the chloroplast performs photosynthesis; the mitochondrion performs cellular respiration.'
        correct: true
      - text: 'Yes: both processes happen in the mitochondrion.'
        rationale: |
          You put photosynthesis in the mitochondrion, but that is wrong. The
          mitochondrion performs cellular respiration. Photosynthesis happens
          in the chloroplast, which contains chlorophyll to capture sunlight.
      - text: 'No: but only because neither organelle is involved in energy production.'
        rationale: |
          You said neither organelle handles energy, but that is the opposite
          of the truth. The mitochondrion releases energy through cellular
          respiration. The chloroplast captures energy through photosynthesis.
      - text: 'Yes: the mitochondrion is simply another name for the chloroplast.'
        rationale: |
          You treated the two as the same organelle, but they are different.
          The chloroplast is green, disc-shaped, and does photosynthesis.
          The mitochondrion is bean-shaped and does cellular respiration.
    explanation: |
      Chloroplasts (found only in plant-type cells) capture light energy for photosynthesis. Mitochondria (found in nearly all cells) release energy from glucose through cellular respiration: different organelles, different processes.
    approved: true
  - id: q-biology-cellular-metabolism-0011
    type: classify
    difficulty: hard
    stem: |
      A student lists oxygen as one of the products of cellular respiration. Is this correct?
    choices:
      - text: 'No: cellular respiration consumes oxygen as a raw material; it does not produce it. Oxygen is a product of photosynthesis instead.'
        correct: true
      - text: 'Yes: cellular respiration always produces oxygen as a byproduct.'
        rationale: |
          You accepted oxygen as a product, but cellular respiration consumes
          oxygen, it does not make it. Oxygen is used to break down glucose.
          The products are carbon dioxide, water, and ATP.
      - text: 'No: cellular respiration produces glucose instead of oxygen.'
        rationale: |
          You got the verdict right but named the wrong product. Cellular
          respiration does not produce glucose. It breaks glucose down into
          carbon dioxide, water, and ATP.
      - text: 'Yes: both photosynthesis and cellular respiration produce oxygen.'
        rationale: |
          You said both processes release oxygen, but cellular respiration
          consumes oxygen as a raw material. Only photosynthesis releases
          oxygen as a byproduct.
    explanation: |
      Cellular respiration uses oxygen as an input to release energy, producing carbon dioxide and water as byproducts. Oxygen is strictly consumed here, not produced: it is photosynthesis that produces oxygen.
    approved: true
  - id: q-biology-cellular-metabolism-0012
    type: compare-contrast
    difficulty: medium
    stem: |
      How are photosynthesis and cellular respiration related to each other?
    choices:
      - text: "They are essentially opposite processes: the products of one are the raw materials the other needs, and vice versa."
        correct: true
      - text: They are identical processes that happen in the same organelle.
        rationale: |
          You said both processes are the same, but they are opposites.
          Photosynthesis builds glucose and releases oxygen. Cellular
          respiration breaks glucose down and consumes oxygen. They also
          happen in different organelles.
      - text: They are completely unrelated processes with no shared substances.
        rationale: |
          You said the two processes share nothing, but they are directly
          linked. The glucose and oxygen that photosynthesis produces are
          exactly what cellular respiration needs as inputs.
      - text: Cellular respiration is simply an early stage of photosynthesis.
        rationale: |
          You put cellular respiration inside photosynthesis, but they are
          separate processes in separate organelles. Cellular respiration
          breaks down the glucose that photosynthesis already made.
    explanation: |
      Photosynthesis's products (glucose and oxygen) are exactly what cellular respiration needs as reactants, and respiration's products (carbon dioxide and water) are exactly what photosynthesis needs: making them mirror-image processes.
    approved: true
  - id: q-biology-cellular-metabolism-0013
    type: identify
    difficulty: medium
    stem: |
      Identify the missing product in this equation, and name the process it represents: $6CO_2 + 6H_2O + \text{light energy} \rightarrow C_6H_{12}O_6 + \, ?$
    choices:
      - text: 6O2 (oxygen gas); this is photosynthesis.
        correct: true
      - text: 6CO2 (carbon dioxide); this is cellular respiration.
        rationale: |
          You named a raw material of this equation as its product. Carbon
          dioxide appears on the left side as an input. The missing product
          is oxygen gas, and the equation describes photosynthesis.
      - text: ATP (energy); this is cellular respiration.
        rationale: |
          You picked the product of cellular respiration, not photosynthesis.
          ATP is released when glucose breaks down. This equation shows
          glucose being built, not broken down, so the missing product is
          oxygen gas.
      - text: 6H2O (water); this is photosynthesis.
        rationale: |
          You named a raw material as the missing product. Water appears on
          the left side as an input. The equation is photosynthesis, but the
          missing product is oxygen gas, not water.
    explanation: |
      This equation matches photosynthesis (carbon dioxide, water, and light energy combining to form glucose). The complete equation also produces oxygen gas ($6O_2$) as the other product.
    approved: true
  - id: q-biology-cellular-metabolism-0014
    type: predict-outcome
    difficulty: exam
    stem: |
      A plant cell is observed performing photosynthesis during the day while sunlight is available. At the same time, is this plant cell also performing cellular respiration?
    choices:
      - text: 'Yes: plant cells perform cellular respiration continuously, alongside photosynthesis, to convert some of their own glucose into usable ATP energy.'
        correct: true
      - text: 'No: plant cells only perform cellular respiration at night, never during the day.'
        rationale: |
          You restricted cellular respiration to nighttime, but plant cells
          need ATP energy all day, every day. Cellular respiration runs
          continuously in plant cells, even while photosynthesis is also
          happening.
      - text: 'No: plant cells never perform cellular respiration at all.'
        rationale: |
          You said plant cells skip cellular respiration entirely, but plant
          cells need ATP just as much as animal cells do. They get it by
          performing cellular respiration in their mitochondria.
      - text: 'Yes: but only because the plant has stopped photosynthesizing for the day.'
        rationale: |
          You said photosynthesis and cellular respiration cannot happen at the
          same time, but they can and do. During the day, plant cells run
          both processes simultaneously in different organelles.
    explanation: |
      Photosynthesis happens mainly during the day, but cellular respiration happens continuously in plant cells, just like in animal cells, since plant cells constantly need ATP energy for their own life processes.
    approved: true
