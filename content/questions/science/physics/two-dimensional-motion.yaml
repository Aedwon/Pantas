meta:
  subject: "science"
  topic: "physics"
  subtopic: "two-dimensional-motion"
  exams: ["upcat", "dlsucet", "ustet", "dost-sei"]
questions:
  - id: q-physics-two-dimensional-motion-0001
    type: "simple-quantitative"
    difficulty: "medium"
    stem: |
      A ball leaves a table horizontally at $4\,\mathrm{m/s}$ and hits the floor after $0.6\,\mathrm s$. Neglect air resistance. What horizontal distance does it travel?
    choices:
      - text: "$2.4\\,\\mathrm m$"
        correct: true
      - text: "$4.6\\,\\mathrm m$"
        rationale: |
          This adds speed and time. Both numbers are given. Check the product needed for constant-velocity distance.
      - text: "$0.24\\,\\mathrm m$"
        rationale: |
          This changes $4$ to $0.4$ while multiplying. The decimal in time can distract. Check each given value.
      - text: "$6.67\\,\\mathrm m$"
        rationale: |
          This divides speed by time. Division is used for rates. Check that distance accumulates with duration.
    explanation: |
      Horizontal acceleration is zero in this model. Thus $\Delta x=v_xt=(4)(0.6)=2.4\,\mathrm m$.
    approved: true

  - id: q-physics-two-dimensional-motion-0002
    type: "simple-quantitative"
    difficulty: "hard"
    stem: |
      A ball leaves a ledge horizontally at $6\,\mathrm{m/s}$ and lands $3\,\mathrm m$ away horizontally. With no drag and $g=10\,\mathrm{m/s^2}$, what is the ledge height?
    choices:
      - text: "$1.25\\,\\mathrm m$"
        correct: true
      - text: "$3\\,\\mathrm m$"
        rationale: |
          This reports horizontal range as height. Both are distances. Check the separate vertical motion.
      - text: "$2.5\\,\\mathrm m$"
        rationale: |
          This omits the one-half factor in the vertical drop. The squared time is needed. Check the full rest-start displacement formula.
      - text: "$5\\,\\mathrm m$"
        rationale: |
          This uses $gt$ as a distance. That product gives vertical speed. Check the squared-time dependence of height.
    explanation: |
      Use the horizontal motion to find $t=\dfrac36=0.5\,\mathrm s$. The initial vertical velocity is zero. Height is $\dfrac12gt^2=\dfrac12(10)(0.5)^2=1.25\,\mathrm m$.
    approved: true

  - id: q-physics-two-dimensional-motion-0003
    type: "simple-quantitative"
    difficulty: "medium"
    stem: |
      A projectile’s launch components are $12\,\mathrm{m/s}$ horizontally and $5\,\mathrm{m/s}$ upward. What is its initial speed?
    choices:
      - text: "$13\\,\\mathrm{m/s}$"
        correct: true
      - text: "$17\\,\\mathrm{m/s}$"
        rationale: |
          This adds perpendicular components directly. Both contribute to motion. Check the right-triangle magnitude.
      - text: "$7\\,\\mathrm{m/s}$"
        rationale: |
          This subtracts component magnitudes as though they opposed each other. The components are on different axes. Check their right angle.
      - text: "$169\\,\\mathrm{m/s}$"
        rationale: |
          This reports the sum of component squares without a square root. That sum is an intermediate value. Check speed versus speed squared.
    explanation: |
      Initial speed is the magnitude of the component vector. Thus $v_0=\sqrt{12^2+5^2}=\sqrt{169}=13\,\mathrm{m/s}$.
    approved: true

  - id: q-physics-two-dimensional-motion-0004
    type: "simple-quantitative"
    difficulty: "hard"
    stem: |
      In ideal uniform gravity, a projectile’s initial upward velocity is $20\,\mathrm{m/s}$. With $g=9.8\,\mathrm{m/s^2}$, how long until its highest point?
    choices:
      - text: "About $2.04\\,\\mathrm s$"
        correct: true
      - text: "About $0.49\\,\\mathrm s$"
        rationale: |
          This divides gravity by initial vertical speed. Both belong in the time relation. Check the order needed to give seconds.
      - text: "$20\\,\\mathrm s$"
        rationale: |
          This uses initial vertical speed as time. The given twenty is prominent. Check the gravitational slowing rate.
      - text: "About $4.08\\,\\mathrm s$"
        rationale: |
          This doubles the rise time and gives an equal-height round-trip duration. Flight-time formulas are familiar. Check that only the ascent is requested.
    explanation: |
      At the top, $v_y=0$. From $v_y=v_{y0}-gt$, $t=20/9.8\approx2.04\,\mathrm s$.
    approved: true

  - id: q-physics-two-dimensional-motion-0005
    type: "classify"
    difficulty: "easy"
    stem: |
      A satellite follows a circular orbit at constant speed. Is it accelerating?
    choices:
      - text: "Yes, its velocity direction changes."
        correct: true
      - text: "No, because only speed changes count as acceleration."
        rationale: |
          This treats velocity as speed alone. The speed is constant. Check the changing direction.
      - text: "No, because a complete orbit returns to the start."
        rationale: |
          This uses final position to decide instantaneous acceleration. The path repeats. Check the continual turning.
      - text: "Yes, because its speed must be increasing continuously."
        rationale: |
          This invents a speed increase. Acceleration often increases speed. Check the stated constant speed.
    explanation: |
      Velocity includes direction. The satellite’s direction changes as it follows the circle. That change requires inward acceleration.
    approved: true

  - id: q-physics-two-dimensional-motion-0006
    type: "identify"
    difficulty: "medium"
    stem: |
      In uniform circular motion, where does the acceleration point?
    choices:
      - text: "Toward the circle’s center"
        correct: true
      - text: "Away from the center"
        rationale: |
          This reverses inward turning acceleration. An outward feeling is familiar during turns. Check the direction needed to keep the path circular.
      - text: "Along the tangent in the direction of motion"
        rationale: |
          This uses velocity’s direction for acceleration. The object moves tangentially. Check which direction changes that velocity.
      - text: "Along the tangent opposite the motion"
        rationale: |
          This treats turning as slowing down. Both alter velocity. Check the stated constant speed.
    explanation: |
      The inward acceleration continuously changes velocity’s direction. It points toward the center of the circle.
    approved: true

  - id: q-physics-two-dimensional-motion-0007
    type: "classify"
    difficulty: "hard"
    stem: |
      For ideal projectile motion in a local horizontal-vertical frame, which horizontal-displacement equation is valid?
    choices:
      - text: "$\\Delta x=v_{x0}t$"
        correct: true
      - text: "$\\Delta x=v_{x0}t+\\dfrac12gt^2$"
        rationale: |
          This adds gravity to horizontal motion. Gravity does affect the projectile. Check its vertical direction.
      - text: "$\\Delta x=\\dfrac12gt^2$"
        rationale: |
          This replaces horizontal motion with a fall-distance formula. The same time is shared. Check which component has acceleration.
      - text: "$\\Delta x=v_{x0}t-gt$"
        rationale: |
          This mixes a velocity-change term with displacement. The vertical equation contains $gt$. Check both units and axis.
    explanation: |
      In ideal projectile motion, gravity has no horizontal component. Horizontal velocity stays constant. Horizontal displacement is initial horizontal velocity times time.
    approved: true

  - id: q-physics-two-dimensional-motion-0008
    type: "classify"
    difficulty: "hard"
    stem: |
      A satellite’s circular orbit is maintained by gravity alone. Should an additional independent centripetal force be added to gravity in its force diagram?
    choices:
      - text: "No, gravity supplies the inward force."
        correct: true
      - text: "Yes, centripetal force is a separate interaction."
        rationale: |
          This treats a force requirement as another physical force. The name sounds like a distinct force. Check the actual interaction supplying the inward acceleration.
      - text: "Yes, an outward force must balance gravity during orbit."
        rationale: |
          This assumes constant speed means zero net force. The speed is steady. Check changing velocity direction.
      - text: "No, because a satellite needs no force at constant speed."
        rationale: |
          This removes gravity from the turning motion. Straight-line constant velocity needs no net force. Check the curved path.
    explanation: |
      Centripetal force names the net inward force required for circular motion. Here gravity is that force. There is no additional centripetal interaction to draw.
    approved: true

  - id: q-physics-two-dimensional-motion-0009
    type: "classify"
    difficulty: "hard"
    stem: |
      A projectile is launched at $25\,\mathrm{m/s}$, $40^\circ$ above horizontal. What values belong in the separate horizontal and vertical equations?
    choices:
      - text: "The corresponding velocity components"
        correct: true
      - text: "The full speed of $25\\,\\mathrm{m/s}$ in both equations"
        rationale: |
          This copies the total magnitude to both axes. The speed is directly given. Check the perpendicular components of one vector.
      - text: "The full speed horizontally and zero vertically"
        rationale: |
          This treats an angled launch as a horizontal launch. The horizontal motion is uniform. Check the nonzero upward launch angle.
      - text: "Zero horizontally and the full speed vertically"
        rationale: |
          This treats an angled launch as vertical only. Gravity acts vertically. Check the initial horizontal component.
    explanation: |
      Resolve the launch vector: $v_{x0}=25\cos40^\circ$ and $v_{y0}=25\sin40^\circ$. Each axis equation uses its own component.
    approved: true

  - id: q-physics-two-dimensional-motion-0010
    type: "predict-outcome"
    difficulty: "hard"
    stem: |
      Two ideal projectiles have equal launch speed, equal launch height, and equal landing height. Their launch angles are $30^\circ$ and $60^\circ$. Which spends longer in the air?
    choices:
      - text: "The $60^\\circ$ launch"
        correct: true
      - text: "The $30^\\circ$ launch because it travels more horizontally per second"
        rationale: |
          This uses horizontal speed to set fall time. The lower-angle projectile has more horizontal speed. Check the vertical launch component.
      - text: "Both because their total launch speeds match"
        rationale: |
          This uses total speed instead of vertical component. The magnitudes are equal. Check the different sine factors.
      - text: "Neither because angle never affects flight time"
        rationale: |
          This ignores vertical launch direction. Gravity is the same for both. Check the initial upward velocities.
    explanation: |
      For return to launch height, flight time is $2v_{y0}/g$. The $60^\circ$ launch has the greater upward component at the same total speed. It stays airborne longer.
    approved: true

  - id: q-physics-two-dimensional-motion-0011
    type: "predict-outcome"
    difficulty: "medium"
    stem: |
      Two balls leave the same height at the same instant with zero initial vertical velocity. One is dropped and one is launched horizontally. Neglect drag. Which reaches the level floor first?
    choices:
      - text: "They arrive together."
        correct: true
      - text: "The dropped ball because it follows the shorter path"
        rationale: |
          This uses total path length to set vertical fall time. The launched ball has a curved path. Check the identical vertical motion.
      - text: "The launched ball because horizontal speed adds to gravity"
        rationale: |
          This treats horizontal velocity as vertical acceleration. The launched ball moves faster overall. Check the axes separately.
      - text: "The launched ball only if it has a small horizontal speed"
        rationale: |
          This makes fall time depend on horizontal speed. Faster motion looks longer-ranging. Check the unchanged vertical initial conditions.
    explanation: |
      Both balls start with zero vertical velocity at the same height. Their downward accelerations are equal. They have the same vertical fall time.
    approved: true

  - id: q-physics-two-dimensional-motion-0012
    type: "classify"
    difficulty: "hard"
    stem: |
      What conditions produce the parabolic path of the introductory projectile model?
    choices:
      - text: "Uniform gravity with negligible air resistance"
        correct: true
      - text: "Any trajectory after launch, regardless of drag or gravity"
        rationale: |
          This makes the ideal shape universal. Many drawings show parabolas. Check the model’s assumptions.
      - text: "Constant horizontal acceleration equal to gravity"
        rationale: |
          This adds gravity on the horizontal axis. Both coordinates change. Check gravity’s vertical direction.
      - text: "Zero acceleration in both directions throughout flight"
        rationale: |
          This removes the cause of curvature. Horizontal velocity is constant. Check the downward vertical acceleration.
    explanation: |
      Uniform gravity gives constant vertical acceleration and zero horizontal acceleration. With negligible drag, eliminating the shared time gives a parabola.
    approved: true

  - id: q-physics-two-dimensional-motion-0013
    type: "predict-outcome"
    difficulty: "medium"
    stem: |
      An ideal projectile has a nonzero horizontal component and reaches the highest point of its upward-then-downward path. Which velocity remains?
    choices:
      - text: "Only its unchanged horizontal velocity"
        correct: true
      - text: "No velocity because it pauses vertically"
        rationale: |
          This extends the vertical pause to both components. The top is a turning point. Check the initial horizontal component.
      - text: "Only its greatest upward velocity"
        rationale: |
          This reverses the ascent’s slowing trend. The projectile is highest. Check vertical velocity at the turning point.
      - text: "Both components at their initial values"
        rationale: |
          This ignores gravity’s effect on vertical velocity. Horizontal velocity is unchanged. Check the upward component separately.
    explanation: |
      At the top, vertical velocity is zero. Horizontal velocity stays at its nonzero launch value in this model. Total velocity is horizontal.
    approved: true

  - id: q-physics-two-dimensional-motion-0014
    type: "simple-quantitative"
    difficulty: "exam"
    stem: |
      An ideal projectile starts with upward component $14.7\,\mathrm{m/s}$ and lands at launch height. With $g=9.8\,\mathrm{m/s^2}$, what is its flight time?
    choices:
      - text: "$3\\,\\mathrm s$"
        correct: true
      - text: "$1.5\\,\\mathrm s$"
        rationale: |
          This gives only the rise time. Dividing upward speed by gravity finds the top. Check the descent back to the same height.
      - text: "$4.5\\,\\mathrm s$"
        rationale: |
          This counts three ascent-time intervals. The trajectory has a rise and a fall. Check that those two equal durations make the total.
      - text: "$0.67\\,\\mathrm s$"
        rationale: |
          This divides gravity by initial vertical speed. Both numbers are used. Check the ratio’s units.
    explanation: |
      Time to the top is $14.7/9.8=1.5\,\mathrm s$. Returning to the same height takes another $1.5\,\mathrm s$. Total time is $3\,\mathrm s$.
    approved: true

  - id: q-physics-two-dimensional-motion-0015
    approved: false
    type: "simple-quantitative"
    difficulty: "easy"
    stem: |
      A body travels at constant speed $6\,\mathrm{m/s}$ around a circle of radius $3\,\mathrm m$. What is its centripetal acceleration magnitude?
    choices:
      - text: "$12\\,\\mathrm{m/s^2}$"
        correct: true
      - text: "$2\\,\\mathrm{m/s^2}$"
        rationale: |
          This divides speed by radius without squaring speed. Both appear in the formula. Check the exponent on speed.
      - text: "$108\\,\\mathrm{m/s^2}$"
        rationale: |
          This multiplies speed squared by radius. The speed square is right. Check the denominator.
      - text: "$0\\,\\mathrm{m/s^2}$"
        rationale: |
          This assumes constant speed means constant velocity. Speed is unchanged. Check the turning direction.
    explanation: |
      $a_c=v^2/r=6^2/3=36/3=12\,\mathrm{m/s^2}$ inward.

  - id: q-physics-two-dimensional-motion-0016
    approved: false
    type: "predict-outcome"
    difficulty: "medium"
    stem: |
      A car follows a level circular road without slipping. Which real force supplies the horizontal inward acceleration?
    choices:
      - text: "Static friction from the road"
        correct: true
      - text: "Kinetic friction from sliding tires"
        rationale: |
          This assumes friction always requires sliding. Friction supplies the turn. Check the stated no-slip condition.
      - text: "Gravity directed horizontally toward the center"
        rationale: |
          This redirects the car’s weight. Gravity is a real force. Check its vertical direction on a level road.
      - text: "An extra force unrelated to tire-road contact"
        rationale: |
          This treats centripetal force as a new interaction. The inward force has a name. Check the actual contact supplying it.
    explanation: |
      The tires do not slip relative to the road. Static friction provides the horizontal inward force needed for the turn.

  - id: q-physics-two-dimensional-motion-0017
    approved: false
    type: "predict-outcome"
    difficulty: "hard"
    stem: |
      In uniform circular motion, radius is fixed and speed doubles. What happens to centripetal acceleration magnitude?
    choices:
      - text: "It quadruples."
        correct: true
      - text: "It doubles because speed doubles"
        rationale: |
          This uses a linear speed dependence. The speed factor is two. Check the speed square.
      - text: "It halves because faster motion spends less time turning"
        rationale: |
          This uses travel time instead of the acceleration formula. Faster motion completes circles sooner. Check $v^2/r$.
      - text: "It stays unchanged because radius is unchanged"
        rationale: |
          This considers only the radius. One variable stays fixed. Check the changed speed.
    explanation: |
      At fixed radius, $a_c\propto v^2$. Doubling speed multiplies $v^2$ by four. Acceleration quadruples.

  - id: q-physics-two-dimensional-motion-0018
    approved: false
    type: "simple-quantitative"
    difficulty: "hard"
    stem: |
      An object of mass $2\,\mathrm{kg}$ moves at $5\,\mathrm{m/s}$ on a circular path of radius $10\,\mathrm m$. What net inward force is required?
    choices:
      - text: "$5\\,\\mathrm N$"
        correct: true
      - text: "$1\\,\\mathrm N$"
        rationale: |
          This uses $mv/r$ without squaring speed. Mass and radius are included. Check the speed exponent.
      - text: "$2.5\\,\\mathrm N$"
        rationale: |
          This reports centripetal acceleration as force. The acceleration calculation is relevant. Check the mass factor.
      - text: "$50\\,\\mathrm N$"
        rationale: |
          This omits division by radius. The product $mv^2$ is part of the formula. Check the full radial-force relation.
    explanation: |
      The net inward force is $F=mv^2/r=(2)(25)/10=5\,\mathrm N$.

  - id: q-physics-two-dimensional-motion-0019
    approved: false
    type: "process-ordering"
    difficulty: "hard"
    stem: |
      Which order correctly solves an ideal horizontal-launch problem when height and horizontal speed are known?
    choices:
      - text: "Find vertical fall time, then use it in horizontal motion."
        correct: true
      - text: "Find one time for horizontal motion and another for vertical motion."
        rationale: |
          This separates the component clocks. Each component has its own equation. Check that both describe the same object at the same instant.
      - text: "Use horizontal speed as initial vertical speed, then find fall time."
        rationale: |
          This copies one component into the other. A launch speed is given. Check the horizontal-launch direction.
      - text: "Add the vertical drop to the horizontal range before finding time."
        rationale: |
          This combines perpendicular displacements as one axis. Both are lengths. Check separate equations linked by shared time.
    explanation: |
      The known height and vertical initial condition give fall time. The same time belongs in the horizontal displacement equation.

  - id: q-physics-two-dimensional-motion-0020
    approved: false
    type: "classify"
    difficulty: "exam"
    stem: |
      In a circular orbit at constant speed, how are instantaneous velocity and centripetal acceleration oriented?
    choices:
      - text: "Velocity tangent; acceleration inward"
        correct: true
      - text: "Both tangent because speed is constant"
        rationale: |
          This gives acceleration the velocity direction. Tangential motion is visible. Check which direction turns the velocity.
      - text: "Both inward because gravity points inward"
        rationale: |
          This gives velocity the gravity direction. Gravity supplies acceleration. Check the direction of motion along the orbit.
      - text: "Velocity inward; acceleration tangent"
        rationale: |
          This swaps the two vectors. Both are part of orbital motion. Check the path tangent and the center direction.
    explanation: |
      Velocity points along the circle’s tangent. Centripetal acceleration points toward the center. They are perpendicular in uniform circular motion.
