meta:
  subject: "science"
  topic: "physics"
  subtopic: "momentum-and-impulse"
  exams: ["upcat", "dlsucet", "ustet", "dost-sei"]
questions:
  - id: q-physics-momentum-and-impulse-0001
    type: "simple-quantitative"
    difficulty: "easy"
    stem: |
      Find the momentum magnitude of a $1000\,\mathrm{kg}$ car moving at $20\,\mathrm{m/s}$.
    choices:
      - text: "20,000 kg m/s"
        correct: true
      - text: "1,020 kg m/s"
        rationale: |
          This adds mass and speed. Both numbers describe the car. Check that momentum uses their product.
      - text: "50 kg m/s"
        rationale: |
          This divides mass by speed. Division appears in other motion formulas. Check the units of momentum.
      - text: "980 kg m/s"
        rationale: |
          This subtracts speed from mass. A difference can seem like a motion change. Check that unlike units cannot be subtracted.
    explanation: |
      Momentum magnitude is mass times speed. Thus $p=(1000)(20)=20000\,\mathrm{kg\,m/s}$.
    approved: true

  - id: q-physics-momentum-and-impulse-0002
    type: "simple-quantitative"
    difficulty: "medium"
    stem: |
      A 0.5 kg ball traveling at 10 m/s is caught and brought to a complete stop in 0.2 seconds. Find the magnitude of the average force exerted to stop it.
    choices:
      - text: "25 N"
        correct: true
      - text: "5 N"
        rationale: |
          This reports momentum change as a force. The mass-speed product is required. Check the further division by stopping time.
      - text: "1 N"
        rationale: |
          This multiplies momentum change by stopping time. The product formula for impulse sounds familiar. Check how to isolate average force.
      - text: "50 N"
        rationale: |
          This divides speed by time but leaves out mass. The result resembles an acceleration. Check that force requires mass times acceleration.
    explanation: |
      Take the original motion as positive. The momentum change is $0-(0.5)(10)=-5\,\mathrm{kg\,m/s}$. Average force is $\dfrac{-5}{0.2}=-25\,\mathrm N$. Its magnitude is $25\,\mathrm N$.
    approved: true

  - id: q-physics-momentum-and-impulse-0003
    type: "simple-quantitative"
    difficulty: "medium"
    stem: |
      A 3 kg cart moving at 4 m/s collides with a stationary 1 kg cart, and the two carts stick together after the collision. Find their combined velocity afterward.
       Assume negligible external horizontal impulse.
    choices:
      - text: "3 m/s"
        correct: true
      - text: "4 m/s"
        rationale: |
          This retains the moving cart’s initial velocity after adding the second cart. That velocity is directly given. Check the total moving mass afterward.
      - text: "12 m/s"
        rationale: |
          This reports initial momentum as final velocity. The product of mass and velocity is needed. Check that momentum must be divided by combined mass.
      - text: "2 m/s"
        rationale: |
          This averages the two velocities without weighting by mass. A shared velocity can suggest a simple average. Check the unequal cart masses.
    explanation: |
      With negligible external horizontal impulse, total momentum stays the same. Initially it is $(3)(4)=12\,\mathrm{kg\,m/s}$. The combined mass is $3+1=4\,\mathrm{kg}$. Thus $v_f=\dfrac{12}{4}=3\,\mathrm{m/s}$ in the original direction.
    approved: true

  - id: q-physics-momentum-and-impulse-0004
    type: "classify"
    difficulty: "medium"
    stem: |
      Two identical billiard balls collide and bounce apart. Measurements show both the total momentum and the total kinetic energy are the same before and after the collision. Classify this collision.
    choices:
      - text: "Elastic"
        correct: true
      - text: "Inelastic"
        rationale: |
          This selects a collision whose ordinary kinetic energy decreases. Real collisions often do that. Check the measured unchanged kinetic energy.
      - text: "Perfectly inelastic"
        rationale: |
          This selects the sticking-together case. It is also a collision category. Check that these balls bounce apart.
      - text: "Inelastic merely because they bounce apart"
        rationale: |
          This treats bouncing apart alone as proof of energy loss. Real balls often lose some kinetic energy. Check the stated measurements.
    explanation: |
      An elastic collision conserves the system’s total kinetic energy as well as total momentum. Those are the measured conditions here.
    approved: true

  - id: q-physics-momentum-and-impulse-0005
    type: "classify"
    difficulty: "medium"
    stem: |
      Two carts collide and momentum is conserved, but the total kinetic energy after the collision is less than before (some energy converted to heat and sound). Classify this collision.
    choices:
      - text: "Inelastic"
        correct: true
      - text: "Elastic"
        rationale: |
          This uses momentum conservation alone to infer elasticity. Elastic collisions also conserve momentum. Check kinetic energy separately.
      - text: "Not a valid collision"
        rationale: |
          This calls any energy transformation invalid. The kinetic energy changed. Check the total energy across all forms.
      - text: "A collision where momentum was not conserved"
        rationale: |
          This assumes kinetic-energy loss requires momentum loss. Both are conserved in an elastic collision. Check the stated momentum measurement.
    explanation: |
      The system’s kinetic energy decreases and is converted into other forms. That makes this an inelastic collision. Total energy remains conserved.
    approved: true

  - id: q-physics-momentum-and-impulse-0006
    type: "classify"
    difficulty: "hard"
    stem: |
      Two moving cars crumple and stick together during a collision with negligible external impulse. Which statement describes the two-car system?
    choices:
      - text: "Momentum is conserved; kinetic energy decreases."
        correct: true
      - text: "Both momentum and kinetic energy must be conserved."
        rationale: |
          This treats the collision as elastic. Momentum does remain constant here. Check the crumpling and sticking.
      - text: "Total energy is destroyed when kinetic energy decreases."
        rationale: |
          This treats transformed energy as destroyed. Less motion remains. Check energy in deformation, heat, and sound.
      - text: "Momentum cannot be conserved if kinetic energy changes."
        rationale: |
          This ties two different conservation tests together. Both hold for elastic collisions. Check the external-impulse condition separately.
    explanation: |
      The cars form a perfectly inelastic collision. With negligible external impulse, total momentum is conserved. Kinetic energy becomes other energy forms as the cars deform.
    approved: true

  - id: q-physics-momentum-and-impulse-0007
    type: "classify"
    difficulty: "hard"
    stem: |
      A moving cart collides with a stationary cart, and they stick together. A student calculates the combined mass afterward using only the moving cart's mass, leaving out the stationary cart's mass. Is this correct?
    choices:
      - text: "No, both masses must be included."
        correct: true
      - text: "Yes: a stationary object's mass does not need to be included after a collision."
        rationale: |
          This omits the cart that started at rest. Its initial momentum is zero. Check mass separately from initial momentum.
      - text: "No: only the stationary cart's mass should be used instead."
        rationale: |
          This omits the moving cart instead. The stationary cart receives motion. Check that both carts remain joined.
      - text: "No, the stationary mass should be subtracted."
        rationale: |
          This subtracts the stationary mass from the moving mass. The stationary cart initially resists motion. Check that joined masses add.
    explanation: |
      Both carts contribute to the combined mass after sticking. The initially stationary cart had zero initial momentum, but it still has mass.
    approved: true

  - id: q-physics-momentum-and-impulse-0008
    type: "classify"
    difficulty: "hard"
    stem: |
      A question asks for the impulse delivered during a collision, and a student reports only the peak force value, without considering the time of contact. Is this a complete answer?
    choices:
      - text: "No, impulse needs the force-time area."
        correct: true
      - text: "Yes: impulse and force are the exact same quantity."
        rationale: |
          This treats force and impulse as the same quantity. Both describe an interaction. Check newtons versus newton-seconds.
      - text: "No: impulse only depends on time, never on force."
        rationale: |
          This omits force and uses duration alone. Contact time affects impulse. Check the full force-time area.
      - text: "Yes: as long as the force value given is the average force."
        rationale: |
          This omits time even when average force is known. Average force is the correct force summary. Check the duration needed for impulse.
    explanation: |
      Impulse depends on the force throughout the contact interval. It is the area under the force-time curve, or average force times duration. A peak force alone does not determine that area.
    approved: true

  - id: q-physics-momentum-and-impulse-0009
    type: "classify"
    difficulty: "hard"
    stem: |
      Two carts move directly toward each other before colliding. A student adds their momenta as two positive numbers, ignoring that they move in opposite directions. Is this correct?
    choices:
      - text: "No, opposing momenta have opposite signs."
        correct: true
      - text: "Yes: momentum is always added as positive values, regardless of direction."
        rationale: |
          This adds magnitudes as if both carts moved in one direction. Both speeds are positive magnitudes. Check the signed velocities.
      - text: "No: but only because one of the carts must actually be stationary."
        rationale: |
          This assumes all collision setups include a stationary object. Such examples are common. Check that both carts here move.
      - text: "Yes: direction only matters for velocity, not momentum."
        rationale: |
          This treats momentum as independent of velocity’s direction. Mass has no direction. Check that multiplying velocity by positive mass keeps its direction.
    explanation: |
      Momentum has direction. Choose one direction as positive. The cart moving the other way has negative momentum, so their signed momenta must be added.
    approved: true

  - id: q-physics-momentum-and-impulse-0010
    type: "simple-quantitative"
    difficulty: "medium"
    stem: |
      A $2000\,\mathrm{kg}$ truck moves at $3\,\mathrm{m/s}$ and a $500\,\mathrm{kg}$ car at $12\,\mathrm{m/s}$. Compare their momentum magnitudes.
    choices:
      - text: "Equal magnitudes of $6000\\,\\mathrm{kg\\,m/s}$"
        correct: true
      - text: "The truck has more momentum, since it has more mass."
        rationale: |
          This compares mass alone. The truck is heavier. Check the product of mass and speed.
      - text: "The car has more momentum, since it moves faster."
        rationale: |
          This compares speed alone. The car is faster. Check the mass factor too.
      - text: "Their momenta cannot be compared without knowing their directions."
        rationale: |
          This requires direction to compare magnitudes. Momentum vectors do require direction. Check that the question asks only for size.
    explanation: |
      The truck’s momentum magnitude is $(2000)(3)=6000\,\mathrm{kg\,m/s}$. The car’s is $(500)(12)=6000\,\mathrm{kg\,m/s}$. Their magnitudes are equal.
    approved: true

  - id: q-physics-momentum-and-impulse-0011
    type: "simple-quantitative"
    difficulty: "hard"
    stem: |
      A $2\,\mathrm{kg}$ ball hits a wall at $+3\,\mathrm{m/s}$ and rebounds at $-2\,\mathrm{m/s}$. What impulse acts on the ball?
    choices:
      - text: "$-10\\,\\mathrm{N\\,s}$"
        correct: true
      - text: "$-2\\,\\mathrm{N\\,s}$"
        rationale: |
          This subtracts speed magnitudes instead of signed velocities. The speed falls from three to two. Check the rebound’s opposite direction.
      - text: "$+10\\,\\mathrm{N\\,s}$"
        rationale: |
          This reverses the impulse direction. The magnitude can be found from the speed sum. Check final momentum minus initial momentum.
      - text: "$-5\\,\\mathrm{N\\,s}$"
        rationale: |
          This reports velocity change without multiplying by mass. The signed difference is correct. Check the mass factor.
    explanation: |
      Impulse is the momentum change: $J=m(v_f-v_i)=2(-2-3)=-10\,\mathrm{N\,s}$. The sign points opposite the initial motion.
    approved: true

  - id: q-physics-momentum-and-impulse-0012
    type: "simple-quantitative"
    difficulty: "medium"
    stem: |
      A constant force of $15\,\mathrm N$ acts in one direction for $3\,\mathrm s$. What impulse does it deliver?
    choices:
      - text: "45 kg m/s"
        correct: true
      - text: "18 kg m/s"
        rationale: |
          This adds force and time. Both are given. Check that impulse is a product for constant force.
      - text: "5 kg m/s"
        rationale: |
          This divides force by time. Rates often involve division. Check that impulse accumulates over duration.
      - text: "12 kg m/s"
        rationale: |
          This subtracts time from force. The two values are easy to combine. Check that their units cannot be subtracted.
    explanation: |
      For a constant force, impulse is $J=F\Delta t$. Thus $J=(15)(3)=45\,\mathrm{N\,s}$. This equals $45\,\mathrm{kg\,m/s}$.
    approved: true

  - id: q-physics-momentum-and-impulse-0013
    type: "simple-quantitative"
    difficulty: "exam"
    stem: |
      A 2 kg cart moves at +5 m/s. A 3 kg cart moves at -4 m/s (toward the first cart, in the opposite direction). They collide and stick together. Find their combined velocity afterward.
       External horizontal impulse is negligible.
    choices:
      - text: "-0.4 m/s"
        correct: true
      - text: "0.4 m/s"
        rationale: |
          This drops the net momentum’s negative sign. Speed is often reported positively. Check the requested signed velocity.
      - text: "-2 m/s"
        rationale: |
          This reports total momentum as velocity. The negative total is calculated correctly. Check division by combined mass.
      - text: "4.4 m/s"
        rationale: |
          This adds momentum magnitudes without direction signs. Both carts have positive mass. Check the opposing velocities before summing.
    explanation: |
      Initial total momentum is $(2)(5)+(3)(-4)=10-12=-2\,\mathrm{kg\,m/s}$. Negligible external impulse keeps this total unchanged. The joined mass is $5\,\mathrm{kg}$, so $v_f=-2/5=-0.4\,\mathrm{m/s}$.
    approved: true

  - id: q-physics-momentum-and-impulse-0014
    type: "predict-outcome"
    difficulty: "exam"
    stem: |
      A car's airbag deploys during a collision, extending the time over which the passenger's momentum changes to zero, compared to hitting a hard dashboard directly. Why does this reduce injury?
    choices:
      - text: "A longer stop reduces the average force."
        correct: true
      - text: "The airbag reduces the total change in momentum the passenger experiences."
        rationale: |
          This assumes stopping over longer time reduces the required momentum change. The gentler stop feels smaller. Check the same initial and final velocities.
      - text: "The airbag has no effect on force, only on the passenger's final velocity."
        rationale: |
          This ignores the time dependence of average force. The final velocity is zero either way. Check the ratio of momentum change to duration.
      - text: "The airbag works by making the passenger's mass smaller during the collision."
        rationale: |
          This attributes protection to reduced mass. The body becomes less strongly accelerated. Check that the passenger’s mass stays the same.
    explanation: |
      The initial and final velocities set the momentum change. Extending the stopping time spreads that change over a longer interval. From $F_{\mathrm{avg}}=\Delta p/\Delta t$, the average force magnitude is smaller.
    approved: true

  - id: q-physics-momentum-and-impulse-0015
    approved: false
    type: "identify"
    difficulty: "easy"
    stem: |
      Which quantity is equal to the change in momentum?
    choices:
      - text: "Impulse"
        correct: true
      - text: "Peak force"
        rationale: |
          This uses the strongest instantaneous force. A strong hit is noticeable. Check the force over the whole interval.
      - text: "Contact duration"
        rationale: |
          This uses time alone. Longer contact affects the interaction. Check that force magnitude also matters.
      - text: "Kinetic energy"
        rationale: |
          This substitutes another motion quantity. Both can change in collisions. Check momentum’s units and vector direction.
    explanation: |
      The impulse-momentum theorem states that impulse equals change in momentum: $
      ec J=\Delta
      ec p$.

  - id: q-physics-momentum-and-impulse-0016
    approved: false
    type: "structure-function"
    difficulty: "medium"
    stem: |
      What does the signed area under a force-time graph represent?
    choices:
      - text: "Impulse"
        correct: true
      - text: "Average force"
        rationale: |
          This treats area as graph height. Force is the vertical variable. Check the extra time factor in area.
      - text: "Final momentum in every case"
        rationale: |
          This ignores the initial momentum. Impulse changes momentum. Check change versus final value.
      - text: "Change in speed without reference to mass"
        rationale: |
          This omits the mass link between impulse and velocity change. A push changes motion. Check the momentum theorem.
    explanation: |
      Each small force-time area adds a small impulse. The full signed area gives the total impulse and hence the momentum change.

  - id: q-physics-momentum-and-impulse-0017
    approved: false
    type: "predict-outcome"
    difficulty: "medium"
    stem: |
      For a fixed nonzero momentum change, stopping time is doubled. What happens to the average force magnitude?
    choices:
      - text: "It is halved."
        correct: true
      - text: "It doubles because force acts for longer."
        rationale: |
          This uses duration to increase force rather than spread a fixed change. Longer action can produce more impulse if force stays fixed. Check what is fixed here.
      - text: "It stays unchanged because final momentum is the same."
        rationale: |
          This ignores duration in average force. The endpoint is unchanged. Check the momentum-change-to-time ratio.
      - text: "It becomes zero because the stop is gentler."
        rationale: |
          This extends a reduced force to no force. A longer stop is less abrupt. Check the nonzero momentum change.
    explanation: |
      Average force magnitude is $|\Delta p|/\Delta t$. With the same numerator and twice the duration, it is half as large.

  - id: q-physics-momentum-and-impulse-0018
    approved: false
    type: "classify"
    difficulty: "hard"
    stem: |
      A ball hits a fixed wall. Is momentum conserved for the ball alone during the impact?
    choices:
      - text: "No, the wall gives the ball an external impulse."
        correct: true
      - text: "Yes, because every collision conserves each object’s momentum."
        rationale: |
          This applies system conservation to one object. Collision examples often conserve total momentum. Check the chosen system boundary.
      - text: "Yes, because the wall does not move visibly."
        rationale: |
          This assumes an unmoving source cannot change momentum. The wall appears stationary. Check its force on the ball.
      - text: "No, because momentum conservation is impossible for any larger system."
        rationale: |
          This extends the ball-only failure to every system. The ball’s momentum changes. Check including wall and Earth in a larger system.
    explanation: |
      The system contains only the ball. The wall lies outside that system and exerts an impulse on it. The ball’s momentum changes.

  - id: q-physics-momentum-and-impulse-0019
    approved: false
    type: "compare-contrast"
    difficulty: "hard"
    stem: |
      What distinguishes a perfectly inelastic collision from other inelastic collisions?
    choices:
      - text: "The bodies stick together afterward."
        correct: true
      - text: "Only perfectly inelastic collisions can conserve momentum."
        rationale: |
          This ties momentum conservation to sticking. Sticking makes the calculation simple. Check the external-impulse condition for every system.
      - text: "Perfectly inelastic collisions preserve all kinetic energy."
        rationale: |
          This swaps the elastic and sticking cases. Both are named collision types. Check energy transformed during sticking.
      - text: "All inelastic collisions must separate with equal speeds."
        rationale: |
          This invents a final-speed condition. The bodies interact strongly. Check the shared velocity only when they stick.
    explanation: |
      In a perfectly inelastic collision, the bodies remain joined and move with one final velocity. Other inelastic collisions can leave them separated.

  - id: q-physics-momentum-and-impulse-0020
    approved: false
    type: "simple-quantitative"
    difficulty: "exam"
    stem: |
      A force-time pulse rises linearly from zero to $40\,\mathrm N$ in $0.10\,\mathrm s$, then falls linearly to zero in another $0.10\,\mathrm s$. What is the impulse magnitude?
    choices:
      - text: "$4\\,\\mathrm{N\\,s}$"
        correct: true
      - text: "$8\\,\\mathrm{N\\,s}$"
        rationale: |
          This uses peak force over the full duration. The peak is given clearly. Check the triangular area instead of a rectangle.
      - text: "$2\\,\\mathrm{N\\,s}$"
        rationale: |
          This counts only one half of the pulse. Each half lasts 0.10 second. Check both rise and fall intervals.
      - text: "$40\\,\\mathrm{N\\,s}$"
        rationale: |
          This reports peak force as impulse. The largest graph value is prominent. Check the duration and area units.
    explanation: |
      The force-time area is a triangle of base $0.20\,\mathrm s$ and height $40\,\mathrm N$. Its area is $\dfrac12(0.20)(40)=4\,\mathrm{N\,s}$.
