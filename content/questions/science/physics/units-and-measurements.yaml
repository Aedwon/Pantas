meta:
  subject: "science"
  topic: "physics"
  subtopic: "units-and-measurements"
  exams: ["upcat", "dlsucet", "ustet", "dost-sei"]
questions:
  - id: q-physics-units-and-measurements-0001
    type: "identify"
    difficulty: "easy"
    stem: |
      What is the SI base unit for length?
    choices:
      - text: "Meter"
        correct: true
      - text: "Centimeter"
        rationale: |
          This selects a prefixed length unit instead of the base unit. Centimeters are familiar measurements. Check that the question asks for the unprefixed SI length base unit.
      - text: "Kilometer"
        rationale: |
          This selects a larger prefixed length unit. Kilometers are common in travel. Check base unit versus a scaled unit.
      - text: "Millimeter"
        rationale: |
          This selects a smaller prefixed unit. Small measurements use it often. Check the base unit rather than its thousandth.
    explanation: |
      The meter, symbol $m$, is the SI base unit of length.
    approved: true

  - id: q-physics-units-and-measurements-0002
    type: "identify"
    difficulty: "easy"
    stem: |
      What is the SI base unit for mass?
    choices:
      - text: "Kilogram"
        correct: true
      - text: "Gram"
        rationale: |
          This picks the common gram instead of the SI mass base unit. Most other base-unit names have no prefix. Check the special base-unit name kilogram.
      - text: "Milligram"
        rationale: |
          This selects a smaller prefixed unit. Small measurements use it often. Check the base unit rather than its thousandth.
      - text: "Newton"
        rationale: |
          This mixes weight with mass. A scale may report force. Check the quantity named in the question.
    explanation: |
      The kilogram, symbol $kg$, is the SI base unit of mass.
    approved: true

  - id: q-physics-units-and-measurements-0003
    type: "identify"
    difficulty: "easy"
    stem: |
      What is the SI base unit for time?
    choices:
      - text: "Second"
        correct: true
      - text: "Minute"
        rationale: |
          This uses a familiar time unit that is not the SI base unit. Clocks often show minutes. Check the base unit second.
      - text: "Hour"
        rationale: |
          This uses a larger common time interval. Travel times often use hours. Check the SI base unit.
      - text: "Millisecond"
        rationale: |
          This selects a smaller prefixed unit. Small measurements use it often. Check the base unit rather than its thousandth.
    explanation: |
      The second, symbol $s$, is the SI base unit of time.
    approved: true

  - id: q-physics-units-and-measurements-0004
    type: "identify"
    difficulty: "medium"
    stem: |
      What is the SI base unit for amount of substance?
    choices:
      - text: "Mole"
        correct: true
      - text: "Kilogram"
        rationale: |
          This confuses amount of substance with mass. Chemical samples can be weighed. Check the unit assigned to amount of substance.
      - text: "Particle count alone"
        rationale: |
          This confuses a pure count with the named SI amount unit. Amount concerns particles. Check which unit represents amount of substance.
      - text: "Candela"
        rationale: |
          This confuses amount of substance with luminous intensity. Both are SI base quantities. Check the quantity paired with each unit.
    explanation: |
      The mole, symbol $mol$, is the SI base unit for amount of substance.
    approved: true

  - id: q-physics-units-and-measurements-0005
    type: "simple-quantitative"
    difficulty: "easy"
    stem: |
      Convert $350\,\mathrm{cm}$ to meters.
    choices:
      - text: "$3.5\\,\\mathrm m$"
        correct: true
      - text: "$35\\,\\mathrm m$"
        rationale: |
          This divides by ten instead of one hundred. A decimal shift is needed. Check the centi prefix.
      - text: "$0.35\\,\\mathrm m$"
        rationale: |
          This uses the milli conversion factor instead of centi. Both are smaller metric units. Check the prefix named in the stem.
      - text: "$350\\,\\mathrm m$"
        rationale: |
          This changes the unit without changing the number. The physical length remains the same. Check that each meter contains 100 centimeters.
    explanation: |
      Use $1\,\mathrm m=100\,\mathrm{cm}$. Then $350\,\mathrm{cm}\times\dfrac{1\,\mathrm m}{100\,\mathrm{cm}}=3.5\,\mathrm m$.
    approved: true

  - id: q-physics-units-and-measurements-0006
    type: "simple-quantitative"
    difficulty: "medium"
    stem: |
      Convert $5000\,\mathrm m$ to kilometers.
    choices:
      - text: "$5\\,\\mathrm{km}$"
        correct: true
      - text: "$50\\,\\mathrm{km}$"
        rationale: |
          This divides by 100. A hundred is familiar from centimeter conversion. Check the kilo factor of 1000.
      - text: "$0.5\\,\\mathrm{km}$"
        rationale: |
          This divides by 10000. Moving the decimal too far gives this value. Check exactly three places for kilo.
      - text: "$500\\,\\mathrm{km}$"
        rationale: |
          This divides by ten only. The number must get smaller. Check how many meters make a kilometer.
    explanation: |
      One kilometer is $1000$ meters. Thus $5000/1000=5\,\mathrm{km}$.
    approved: true

  - id: q-physics-units-and-measurements-0007
    type: "simple-quantitative"
    difficulty: "hard"
    stem: |
      Convert $90\,\mathrm{km/h}$ to meters per second.
    choices:
      - text: "$25\\,\\mathrm{m/s}$"
        correct: true
      - text: "$90\\,\\mathrm{m/s}$"
        rationale: |
          This relabels the speed without converting. Both are speed units. Check both length and time factors.
      - text: "$324\\,\\mathrm{m/s}$"
        rationale: |
          This multiplies by 3.6 instead of dividing. The same factor is used in reverse conversion. Check the starting unit.
      - text: "$1500\\,\\mathrm{m/s}$"
        rationale: |
          This converts kilometers to meters but uses 60 seconds per hour. Sixty belongs to minute conversion. Check the full hour-to-second relation.
    explanation: |
      Use both conversion factors: $90\times\dfrac{1000}{3600}=25$. The units become meters per second.
    approved: true

  - id: q-physics-units-and-measurements-0008
    type: "simple-quantitative"
    difficulty: "hard"
    stem: |
      A speed is $15\,\mathrm{m/s}$. What is it in kilometers per hour?
    choices:
      - text: "$54\\,\\mathrm{km/h}$"
        correct: true
      - text: "$4.17\\,\\mathrm{km/h}$"
        rationale: |
          This divides by 3.6 in the wrong conversion direction. That factor works from kilometers per hour to meters per second. Check the starting units.
      - text: "$15\\,\\mathrm{km/h}$"
        rationale: |
          This changes only the unit label. The speed is physically unchanged. Check the numerical conversion factor.
      - text: "$0.015\\,\\mathrm{km/h}$"
        rationale: |
          This converts meters to kilometers but ignores seconds to hours. One conversion is correct. Check both parts of the compound unit.
    explanation: |
      Convert meters to kilometers and seconds in the denominator to hours: $15\times\dfrac{1}{1000}\times3600=54\,\mathrm{km/h}$.
    approved: true

  - id: q-physics-units-and-measurements-0009
    type: "simple-quantitative"
    difficulty: "medium"
    stem: |
      From $F=ma$, what SI base-unit combination represents force?
    choices:
      - text: "$\\mathrm{kg\\,m/s^2}$"
        correct: true
      - text: "$\\mathrm{kg/s^2}$"
        rationale: |
          This drops the meter from acceleration. Mass and time remain. Check the length change in acceleration.
      - text: "$\\mathrm{m/s^2}$"
        rationale: |
          This reports acceleration’s units alone. Acceleration is in the formula. Check the mass multiplier.
      - text: "$\\mathrm{kg\\,m/s}$"
        rationale: |
          This uses velocity instead of acceleration. Both describe motion. Check the extra time denominator in acceleration.
    explanation: |
      Mass has units $\mathrm{kg}$ and acceleration has units $\mathrm{m/s^2}$. Their product is $\mathrm{kg\,m/s^2}$, the newton.
    approved: true

  - id: q-physics-units-and-measurements-0010
    type: "classify"
    difficulty: "hard"
    stem: |
      For converting $250\,\mathrm{cm}$ into meters, is the factor $\dfrac{100\,\mathrm{cm}}{1\,\mathrm m}$ oriented correctly?
    choices:
      - text: "No, the centimeters do not cancel."
        correct: true
      - text: "Yes, matching units multiply to cancel automatically."
        rationale: |
          This cancels two numerator units. Both say centimeters. Check that cancellation needs one numerator and one denominator.
      - text: "No, centimeters and meters describe different physical quantities."
        rationale: |
          This treats different unit sizes as different quantities. Their names differ. Check that both measure length.
      - text: "Yes, any orientation of equal measurements gives the desired unit."
        rationale: |
          This confuses a factor equal to one with correct cancellation. Both reciprocal factors equal one. Check the unit left after multiplication.
    explanation: |
      The starting centimeters are in the numerator. The factor needs centimeters in the denominator. Use $\dfrac{1\,\mathrm m}{100\,\mathrm{cm}}$ so the remaining unit is meters.
    approved: true

  - id: q-physics-units-and-measurements-0011
    type: "classify"
    difficulty: "hard"
    stem: |
      A student divides $2\,\mathrm{km}$ by $4\,\mathrm s$, gets the numerical value $0.5$, and reports $0.5\,\mathrm{m/s}$ without conversion. What is wrong?
    choices:
      - text: "The calculation gives kilometers per second."
        correct: true
      - text: "Kilometers cannot appear in any physical formula."
        rationale: |
          This bans a valid unit. SI base units are often preferred. Check whether the issue is calculation or incorrect labeling.
      - text: "Seconds must always be converted to hours before finding speed."
        rationale: |
          This assumes only one speed-unit pair is allowed. Kilometers per hour is familiar. Check the desired final unit.
      - text: "Rounding 0.5 more accurately would fix the meter label."
        rationale: |
          This replaces unit conversion with rounding. The arithmetic is simple. Check the missing kilometer-to-meter factor.
    explanation: |
      The units of the quotient are kilometers per second. So the result is $0.5\,\mathrm{km/s}=500\,\mathrm{m/s}$. Conversion is required before applying the meter-per-second label.
    approved: true

  - id: q-physics-units-and-measurements-0012
    type: "simple-quantitative"
    difficulty: "hard"
    stem: |
      Convert $2\,\mathrm{m^2}$ into square centimeters.
    choices:
      - text: "$20000\\,\\mathrm{cm^2}$"
        correct: true
      - text: "$200\\,\\mathrm{cm^2}$"
        rationale: |
          This applies the length factor only once. One meter is 100 centimeters. Check that area has two length factors.
      - text: "$2000\\,\\mathrm{cm^2}$"
        rationale: |
          This uses a factor of 1000. That number is familiar from kilo conversion. Check the squared centimeter conversion.
      - text: "$20\\,\\mathrm{cm^2}$"
        rationale: |
          This treats each meter as ten centimeters and uses one factor. A decimal shift seems sufficient. Check both the prefix and the area exponent.
    explanation: |
      Since $1\,\mathrm m=100\,\mathrm{cm}$, $1\,\mathrm{m^2}=100^2\,\mathrm{cm^2}=10000\,\mathrm{cm^2}$. Multiply by two to get $20000\,\mathrm{cm^2}$.
    approved: true

  - id: q-physics-units-and-measurements-0013
    type: "simple-quantitative"
    difficulty: "exam"
    stem: |
      Convert $3\,\mathrm{m^3}$ into cubic centimeters.
    choices:
      - text: "$3000000\\,\\mathrm{cm^3}$"
        correct: true
      - text: "$300\\,\\mathrm{cm^3}$"
        rationale: |
          This uses the linear factor of 100. The length conversion is familiar. Check the three dimensions of volume.
      - text: "$30000\\,\\mathrm{cm^3}$"
        rationale: |
          This uses the area factor of 100 squared. Squaring is needed for area. Check that the quantity here is volume.
      - text: "$300000\\,\\mathrm{cm^3}$"
        rationale: |
          This shifts by five decimal places instead of six. The number must increase greatly. Check $100^3$.
    explanation: |
      Volume conversion cubes the length factor: $1\,\mathrm{m^3}=100^3\,\mathrm{cm^3}=1000000\,\mathrm{cm^3}$. Thus three cubic meters is $3000000\,\mathrm{cm^3}$.
    approved: true

  - id: q-physics-units-and-measurements-0014
    type: "predict-outcome"
    difficulty: "exam"
    stem: |
      A speed calculation ends with units of seconds per meter instead of meters per second. What should be checked first?
    choices:
      - text: "The orientation of ratios and conversion factors"
        correct: true
      - text: "Only the rounding, since reciprocal units mean the same thing"
        rationale: |
          This treats reciprocal units as interchangeable. Both contain meters and seconds. Check which unit is in the numerator.
      - text: "Only the final digit, because units cannot reveal a setup error"
        rationale: |
          This ignores dimensional evidence. Arithmetic may look plausible. Check the units throughout the calculation.
      - text: "Whether speed has no physical dimension after all"
        rationale: |
          This removes the expected units to accept the result. Some quantities are dimensionless. Check the definition of speed as distance per time.
    explanation: |
      Speed is length divided by time. Reversed units indicate a setup that calculates a reciprocal quantity. Check ratio orientation and unit cancellation.
    approved: true

  - id: q-physics-units-and-measurements-0015
    approved: false
    type: "identify"
    difficulty: "easy"
    stem: |
      Which SI base quantity uses the ampere?
    choices:
      - text: "Electric current"
        correct: true
      - text: "Luminous intensity"
        rationale: |
          This confuses two electrical-light associations. Lamps run on electric current. Check the base quantity measured in amperes.
      - text: "Amount of substance"
        rationale: |
          This confuses current with a quantity involving particles. Charges can be carried by particles. Check the SI base-quantity list.
      - text: "Mass"
        rationale: |
          This treats a current reading as a measure of material amount. Conductors contain matter. Check the quantity linked to ampere.
    explanation: |
      The ampere, symbol $A$, is the SI base unit for electric current.

  - id: q-physics-units-and-measurements-0016
    approved: false
    type: "identify"
    difficulty: "medium"
    stem: |
      Which pair correctly matches a base quantity with its SI unit?
    choices:
      - text: "Luminous intensity, candela"
        correct: true
      - text: "Luminous intensity, mole"
        rationale: |
          This swaps light measurement with amount of substance. Both are less familiar base quantities. Check their named SI units.
      - text: "Luminous intensity, kelvin"
        rationale: |
          This uses a temperature unit for light intensity. Hot objects can glow. Check the quantity being measured.
      - text: "Luminous intensity, ampere"
        rationale: |
          This uses electric current to label light intensity. Electric lamps consume current. Check the light quantity independently.
    explanation: |
      Candela, symbol $cd$, is the SI base unit for luminous intensity.

  - id: q-physics-units-and-measurements-0017
    approved: false
    type: "classify"
    difficulty: "medium"
    stem: |
      Which is an SI base unit rather than a derived unit?
    choices:
      - text: "Kelvin"
        correct: true
      - text: "Newton"
        rationale: |
          This selects a familiar named SI unit as a base unit. Named units can sound fundamental. Check its combination of mass, length, and time units.
      - text: "Meter per second"
        rationale: |
          This selects a unit built from two base units. Speed is a basic motion idea. Check the compound unit.
      - text: "Square meter"
        rationale: |
          This selects an area unit built by multiplying length units. Meter itself is a base unit. Check the squared form.
    explanation: |
      Kelvin is the SI base unit of thermodynamic temperature. It belongs to the list of seven base units.

  - id: q-physics-units-and-measurements-0018
    approved: false
    type: "cause-effect"
    difficulty: "hard"
    stem: |
      Why does multiplying by a correctly oriented conversion factor preserve a physical length?
    choices:
      - text: "The factor is a ratio of equal lengths."
        correct: true
      - text: "The factor has a numerical value of one even after units are removed."
        rationale: |
          This confuses a physical ratio with its bare numerical values. Both measurements are equivalent. Check the different unit sizes.
      - text: "The factor changes both the object and its measurement unit."
        rationale: |
          This treats conversion as physically resizing the object. The written number changes. Check whether the actual length changes.
      - text: "The new unit cancels all dimensions automatically."
        rationale: |
          This turns conversion into a dimensionless result. One unwanted unit does cancel. Check that the desired unit remains.
    explanation: |
      A conversion factor compares equivalent measurements of one quantity. The ratio equals one physically. Multiplication changes its numerical expression and units while preserving the length.

  - id: q-physics-units-and-measurements-0019
    approved: false
    type: "simple-quantitative"
    difficulty: "hard"
    stem: |
      Express $0.025\,\mathrm m$ in millimeters.
    choices:
      - text: "$25\\,\\mathrm{mm}$"
        correct: true
      - text: "$2.5\\,\\mathrm{mm}$"
        rationale: |
          This uses the centimeter factor of 100. Both prefixes describe small units. Check the milli factor.
      - text: "$0.000025\\,\\mathrm{mm}$"
        rationale: |
          This divides by 1000 instead of multiplying. Converting to a smaller unit changes the count. Check which unit is smaller.
      - text: "$0.025\\,\\mathrm{mm}$"
        rationale: |
          This changes the label only. The physical length stays fixed. Check how many millimeters make one meter.
    explanation: |
      Milli means one-thousandth. There are $1000\,\mathrm{mm}$ in a meter. Thus $0.025\times1000=25\,\mathrm{mm}$.

  - id: q-physics-units-and-measurements-0020
    approved: false
    type: "simple-quantitative"
    difficulty: "exam"
    stem: |
      Convert $2\,\mathrm{g/cm^3}$ into $\mathrm{kg/m^3}$. Use $1\,\mathrm{kg}=1000\,\mathrm g$ and $1\,\mathrm m=100\,\mathrm{cm}$.
    choices:
      - text: "$2000\\,\\mathrm{kg/m^3}$"
        correct: true
      - text: "$0.002\\,\\mathrm{kg/m^3}$"
        rationale: |
          This converts grams to kilograms but leaves cubic centimeters unchanged. One unit conversion is right. Check the volume denominator too.
      - text: "$2\\,\\mathrm{kg/m^3}$"
        rationale: |
          This applies only a linear centimeter factor while converting mass. Both mass and length units change. Check the cube on volume.
      - text: "$2000000\\,\\mathrm{kg/m^3}$"
        rationale: |
          This converts cubic centimeters to cubic meters but leaves grams unchanged. The volume factor is large. Check grams to kilograms too.
    explanation: |
      One gram is $0.001\,\mathrm{kg}$ and one cubic centimeter is $10^{-6}\,\mathrm{m^3}$. Thus $2\,\mathrm{g/cm^3}=\dfrac{2(0.001)}{10^{-6}}=2000\,\mathrm{kg/m^3}$.
