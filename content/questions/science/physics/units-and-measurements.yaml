questions:
  - id: q-physics-units-and-measurements-0001
    type: identify
    difficulty: easy
    stem: |
      What is the SI base unit for length?
    choices:
      - text: Meter
        correct: true
      - text: Kilogram
        rationale: |
          You picked mass base unit. Kilogram ($\text{kg}$) is the SI base unit for mass.
      - text: Second
        rationale: |
          You picked time base unit. Second ($\text{s}$) is the SI base unit for time.
      - text: Kelvin
        rationale: |
          You picked temperature base unit. Kelvin ($\text{K}$) is the SI base unit for thermodynamic temperature.
    explanation: |
      The meter (m) is the SI base unit for length.
    approved: true
  - id: q-physics-units-and-measurements-0002
    type: identify
    difficulty: easy
    stem: |
      What is the SI base unit for mass?
    choices:
      - text: Kilogram
        correct: true
      - text: Meter
        rationale: |
          You picked length base unit. Meter ($\text{m}$) is the SI base unit for spatial distance.
      - text: Second
        rationale: |
          You picked time base unit. Second ($\text{s}$) is the SI base unit for time.
      - text: Ampere
        rationale: |
          You picked electric current base unit. Ampere ($\text{A}$) is the SI base unit for electric current.
    explanation: |
      The kilogram (kg) is the SI base unit for mass.
    approved: true
  - id: q-physics-units-and-measurements-0003
    type: identify
    difficulty: easy
    stem: |
      What is the SI base unit for time?
    choices:
      - text: Second
        correct: true
      - text: Meter
        rationale: |
          You picked length base unit. Meter ($\text{m}$) measures length.
      - text: Kilogram
        rationale: |
          You picked mass base unit. Kilogram ($\text{kg}$) measures mass.
      - text: Candela
        rationale: |
          You picked luminous intensity base unit. Candela ($\text{cd}$) measures luminous intensity.
    explanation: |
