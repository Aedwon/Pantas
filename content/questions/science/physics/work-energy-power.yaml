meta:
  subject: "science"
  topic: "physics"
  subtopic: "work-energy-power"
  exams: ["upcat", "dlsucet", "ustet", "dost-sei"]
questions:
  - id: q-physics-work-energy-power-0001
    type: "simple-quantitative"
    difficulty: "easy"
    stem: |
      A constant force of $20\,\mathrm N$ acts through $5\,\mathrm m$ of displacement in the force’s direction. What work does this force do?
    choices:
      - text: "$100\\,\\mathrm J$"
        correct: true
      - text: "$25\\,\\mathrm J$"
        rationale: |
          This adds force and displacement. Both numbers are given. Check the product in the work formula.
      - text: "$500\\,\\mathrm J$"
        rationale: |
          This squares the displacement before multiplying by force. Squares appear in energy formulas. Check that constant-force work uses the first power of displacement.
      - text: "$15\\,\\mathrm J$"
        rationale: |
          This subtracts displacement from force. A difference can sound like energy change. Check that these units cannot be subtracted.
    explanation: |
      Force and displacement are parallel, so $W=Fd$. Thus $W=(20)(5)=100\,\mathrm J$.
    approved: true

  - id: q-physics-work-energy-power-0002
    type: "simple-quantitative"
    difficulty: "easy"
    stem: |
      A $4\,\mathrm{kg}$ object moves at speed $5\,\mathrm{m/s}$. What is its kinetic energy?
    choices:
      - text: "$50\\,\\mathrm J$"
        correct: true
      - text: "$10\\,\\mathrm J$"
        rationale: |
          This uses $\dfrac12mv$ without squaring speed. The mass and one-half factor are included. Check the exponent.
      - text: "$100\\,\\mathrm J$"
        rationale: |
          This omits the one-half factor. The speed square is right. Check the full energy formula.
      - text: "$20\\,\\mathrm J$"
        rationale: |
          This computes momentum’s magnitude $mv$ instead of kinetic energy. Both describe motion. Check the requested quantity.
    explanation: |
      $KE=\dfrac12mv^2=\dfrac12(4)(5^2)=2(25)=50\,\mathrm J$.
    approved: true

  - id: q-physics-work-energy-power-0003
    type: "simple-quantitative"
    difficulty: "easy"
    stem: |
      A $3\,\mathrm{kg}$ book is $4\,\mathrm m$ above a chosen zero level near Earth. With $g=9.8\,\mathrm{m/s^2}$, what is its gravitational potential energy?
    choices:
      - text: "$117.6\\,\\mathrm J$"
        correct: true
      - text: "$12\\,\\mathrm J$"
        rationale: |
          This uses mass times height and omits gravity. Both quantities are stated. Check the full $mgh$ product.
      - text: "$29.4\\,\\mathrm J$"
        rationale: |
          This uses weight alone and omits height. Weight is part of the energy calculation. Check force times height.
      - text: "$117600\\,\\mathrm J$"
        rationale: |
          This enters the mass as 3000 grams while keeping SI gravity and height. Grams measure the same mass. Check that SI work calculation needs kilograms.
    explanation: |
      Near Earth, $PE=mgh$ relative to the chosen zero. Here $PE=(3)(9.8)(4)=117.6\,\mathrm J$.
    approved: true

  - id: q-physics-work-energy-power-0004
    type: "simple-quantitative"
    difficulty: "medium"
    stem: |
      A $5\,\mathrm{kg}$ object starts from rest on a frictionless slide $2\,\mathrm m$ above its bottom. Neglect drag and use $g=9.8\,\mathrm{m/s^2}$. What is its bottom speed?
    choices:
      - text: "About $6.26\\,\\mathrm{m/s}$"
        correct: true
      - text: "$39.2\\,\\mathrm{m/s}$"
        rationale: |
          This reports the calculated speed squared as speed. The energy equation gives a square. Check the final square root.
      - text: "$98\\,\\mathrm{m/s}$"
        rationale: |
          This reports potential energy as speed. The top energy is an intermediate value. Check the kinetic-energy equation and units.
      - text: "About $4.43\\,\\mathrm{m/s}$"
        rationale: |
          This uses $v=\sqrt{gh}$ and omits the factor of two. The square root is needed. Check the one-half coefficient in kinetic energy.
    explanation: |
      With mechanical energy conserved, $mgh=\dfrac12mv^2$. Cancel mass to get $v=\sqrt{2gh}=\sqrt{2(9.8)(2)}=\sqrt{39.2}\approx6.26\,\mathrm{m/s}$.
    approved: true

  - id: q-physics-work-energy-power-0005
    type: "simple-quantitative"
    difficulty: "medium"
    stem: |
      A motor does $300\,\mathrm J$ of work in $5\,\mathrm s$. What is its average power?
    choices:
      - text: "$60\\,\\mathrm W$"
        correct: true
      - text: "$1500\\,\\mathrm W$"
        rationale: |
          This multiplies work by duration. Both values are given. Check that power is work per time.
      - text: "$5\\,\\mathrm W$"
        rationale: |
          This relabels duration as power. The time is explicitly stated. Check joules per second.
      - text: "$295\\,\\mathrm W$"
        rationale: |
          This subtracts time from work. The result uses both numbers. Check that their units cannot be subtracted.
    explanation: |
      Average power is $P=W/\Delta t=300/5=60\,\mathrm W$.
    approved: true

  - id: q-physics-work-energy-power-0006
    type: "predict-outcome"
    difficulty: "hard"
    stem: |
      An object’s speed doubles while its mass stays fixed. How does its kinetic energy change?
    choices:
      - text: "It quadruples."
        correct: true
      - text: "It doubles because speed doubles."
        rationale: |
          This assumes a linear speed dependence. Both quantities increase. Check the speed square.
      - text: "It halves because faster travel takes less time."
        rationale: |
          This imports duration into the energy formula. Faster travel can reduce a trip’s time. Check the variables in kinetic energy.
      - text: "It stays unchanged because mass is fixed."
        rationale: |
          This considers only mass. One quantity is unchanged. Check the changed speed.
    explanation: |
      $KE=\dfrac12mv^2$. Replacing $v$ with $2v$ multiplies $v^2$ by four. Kinetic energy quadruples.
    approved: true

  - id: q-physics-work-energy-power-0007
    type: "classify"
    difficulty: "hard"
    stem: |
      A person’s upward force holds a rigid box stationary. What mechanical work does that force do on the box while it remains still?
    choices:
      - text: "$0\\,\\mathrm J$"
        correct: true
      - text: "Positive work proportional to holding time"
        rationale: |
          This confuses muscular energy use with work on the unmoving box. Holding it is tiring. Check displacement in the work formula.
      - text: "Work numerically equal to the box’s weight"
        rationale: |
          This reports force as energy. The upward force is large. Check the displacement factor and units.
      - text: "Negative work because the force opposes gravity"
        rationale: |
          This assigns a sign without displacement. The force does oppose gravity. Check whether any motion occurs.
    explanation: |
      The box’s displacement is zero. A force acting through zero displacement does zero mechanical work on it.
    approved: true

  - id: q-physics-work-energy-power-0008
    type: "classify"
    difficulty: "hard"
    stem: |
      A block slides down a ramp and friction does negative work. Can its initial and final $KE+PE$ be set equal while ignoring that work?
    choices:
      - text: "No, friction changes mechanical energy."
        correct: true
      - text: "Yes, total energy conservation makes $KE+PE$ constant in every process."
        rationale: |
          This equates total energy with mechanical energy alone. Total energy is conserved. Check energy transferred into thermal forms.
      - text: "No, because gravity stops acting during sliding."
        rationale: |
          This removes the gravitational interaction. The block is moving. Check that gravity continues to act.
      - text: "Yes, any friction force does zero work."
        rationale: |
          This generalizes perpendicular-force work to friction. Some forces do no work. Check friction opposite the sliding displacement.
    explanation: |
      Friction transfers mechanical energy into other forms. Include its work as $W_{\mathrm{nc}}=\Delta(KE+PE)$. Total energy remains conserved.
    approved: true

  - id: q-physics-work-energy-power-0009
    type: "compare-contrast"
    difficulty: "hard"
    stem: |
      Two machines do $1000\,\mathrm J$ each. A takes $2\,\mathrm s$ and B takes $10\,\mathrm s$. How do their average powers compare?
    choices:
      - text: "A has five times B’s power."
        correct: true
      - text: "Their powers are equal because work is equal."
        rationale: |
          This ignores different durations. The work amounts match. Check work per second.
      - text: "B has five times A’s power because it runs longer."
        rationale: |
          This reverses the time dependence. B operates for more seconds. Check equal work divided by time.
      - text: "A has twice B’s power because A takes two seconds."
        rationale: |
          This treats one duration as the ratio. A’s time is two seconds. Check the two durations together.
    explanation: |
      $P_A=1000/2=500\,\mathrm W$. $P_B=1000/10=100\,\mathrm W$. Their ratio is $500/100=5$.
    approved: true

  - id: q-physics-work-energy-power-0010
    type: "simple-quantitative"
    difficulty: "medium"
    stem: |
      An object initially has $50\,\mathrm J$ of kinetic energy. The net work on it is $+200\,\mathrm J$. What is its final kinetic energy?
    choices:
      - text: "$250\\,\\mathrm J$"
        correct: true
      - text: "$150\\,\\mathrm J$"
        rationale: |
          This subtracts initial energy from the work. The theorem contains a difference. Check how to isolate final energy.
      - text: "$200\\,\\mathrm J$"
        rationale: |
          This reports energy change as final energy. Net work equals the change. Check the nonzero initial kinetic energy.
      - text: "$-150\\,\\mathrm J$"
        rationale: |
          This subtracts positive work from initial energy. Work can reduce energy when negative. Check the stated positive sign.
    explanation: |
      Net work equals kinetic-energy change: $W_{\mathrm{net}}=KE_f-KE_i$. Therefore $KE_f=50+200=250\,\mathrm J$.
    approved: true

  - id: q-physics-work-energy-power-0011
    type: "simple-quantitative"
    difficulty: "hard"
    stem: |
      A $4\,\mathrm{kg}$ object has $72\,\mathrm J$ of kinetic energy. What is its speed?
    choices:
      - text: "$6\\,\\mathrm{m/s}$"
        correct: true
      - text: "$18\\,\\mathrm{m/s}$"
        rationale: |
          This divides kinetic energy by mass and reports the result as speed. Mass division is part of the rearrangement. Check the one-half factor and square root.
      - text: "$36\\,\\mathrm{m/s}$"
        rationale: |
          This reports speed squared as speed. Rearrangement gives this squared value. Check the final square root.
      - text: "About $4.24\\,\\mathrm{m/s}$"
        rationale: |
          This uses $\sqrt{KE/m}$ and omits the factor of two. Taking a square root is needed. Check the full rearranged equation.
    explanation: |
      From $72=\dfrac12(4)v^2=2v^2$, get $v^2=36$. Speed is the nonnegative magnitude, so $v=6\,\mathrm{m/s}$.
    approved: true

  - id: q-physics-work-energy-power-0012
    type: "predict-outcome"
    difficulty: "medium"
    stem: |
      Two objects have the same speed. A has three times B’s mass. How do their kinetic energies compare?
    choices:
      - text: "A has three times B’s energy."
        correct: true
      - text: "A has nine times B’s energy."
        rationale: |
          This squares the mass factor. A square appears in the energy formula. Check that it applies to speed.
      - text: "Both have the same energy because speeds match."
        rationale: |
          This ignores mass. The speeds are equal. Check both factors in kinetic energy.
      - text: "A has one-third B’s energy."
        rationale: |
          This puts mass in the denominator. Greater mass can suggest less acceleration. Check the energy formula at fixed speed.
    explanation: |
      At equal speed, $KE=\dfrac12mv^2$ is proportional to mass. Three times the mass gives three times the kinetic energy.
    approved: true

  - id: q-physics-work-energy-power-0013
    type: "simple-quantitative"
    difficulty: "exam"
    stem: |
      A motor supplies constant output power $200\,\mathrm W$ for $10\,\mathrm s$. How much work does it do?
    choices:
      - text: "$2000\\,\\mathrm J$"
        correct: true
      - text: "$20\\,\\mathrm J$"
        rationale: |
          This divides power by time. Division is used to find power from work. Check the inverse operation for work.
      - text: "$210\\,\\mathrm J$"
        rationale: |
          This adds power and time. Both are given. Check joules per second multiplied by seconds.
      - text: "$20000\\,\\mathrm J$"
        rationale: |
          This uses 100 seconds instead of 10 seconds. An extra zero increases the product. Check the stated duration.
    explanation: |
      Work is power times duration: $W=P\Delta t=(200)(10)=2000\,\mathrm J$.
    approved: true

  - id: q-physics-work-energy-power-0014
    type: "predict-outcome"
    difficulty: "medium"
    stem: |
      A frictionless pendulum is partway between a turning point and its lowest point. Choose the lowest point as zero gravitational potential energy. Which description applies?
    choices:
      - text: "Both kinetic and potential energy are positive."
        correct: true
      - text: "All energy is kinetic because the pendulum is moving."
        rationale: |
          This ignores elevation above the chosen zero. Motion does give kinetic energy. Check height as well.
      - text: "All energy is potential because the pendulum is above the lowest point."
        rationale: |
          This ignores its nonzero speed. Elevation gives potential energy. Check whether it is at the turning point.
      - text: "Total mechanical energy is zero because the zero level was chosen."
        rationale: |
          This applies the potential-energy zero to all energy. A reference height was chosen. Check the sum of kinetic and potential energy.
    explanation: |
      At an intermediate position, the pendulum has speed and is above the chosen zero height. Its kinetic and potential energies are both positive. Their sum stays constant without nonconservative work.
    approved: true

  - id: q-physics-work-energy-power-0015
    type: "simple-quantitative"
    difficulty: "exam"
    stem: |
      An object falls from rest near Earth without air resistance and reaches speed $14\,\mathrm{m/s}$. Using $g=9.8\,\mathrm{m/s^2}$, what height has it fallen?
    choices:
      - text: "$10\\,\\mathrm m$"
        correct: true
      - text: "$14\\,\\mathrm m$"
        rationale: |
          This relabels speed as height. The speed is directly given. Check the energy relation and units.
      - text: "$19.6\\,\\mathrm m$"
        rationale: |
          This reports $2g$ instead of dividing speed squared by it. That factor belongs in the formula. Check which part is the denominator.
      - text: "$137.2\\,\\mathrm m$"
        rationale: |
          This multiplies speed by gravity. Both values are used in fall problems. Check the squared speed and division in the height relation.
    explanation: |
      Energy conservation gives $mgh=\dfrac12mv^2$. Cancel mass and solve: $h=v^2/(2g)=196/19.6=10\,\mathrm m$.
    approved: true

  - id: q-physics-work-energy-power-0016
    approved: false
    type: "simple-quantitative"
    difficulty: "easy"
    stem: |
      A constant $30\,\mathrm N$ force acts perpendicular to a $4\,\mathrm m$ displacement. What work does that force do?
    choices:
      - text: "$0\\,\\mathrm J$"
        correct: true
      - text: "$120\\,\\mathrm J$"
        rationale: |
          This multiplies force and displacement without the angle factor. That works for parallel motion. Check the perpendicular direction.
      - text: "$7.5\\,\\mathrm J$"
        rationale: |
          This divides force by displacement. The two numbers are given. Check the work formula and angle.
      - text: "$-120\\,\\mathrm J$"
        rationale: |
          This treats perpendicular as opposite. Opposing forces do negative work. Check 90 degrees versus 180 degrees.
    explanation: |
      Work is $Fd\cos\theta$. At $90^\circ$, $\cos90^\circ=0$, so this force does zero work.

  - id: q-physics-work-energy-power-0017
    approved: false
    type: "simple-quantitative"
    difficulty: "medium"
    stem: |
      A constant $40\,\mathrm N$ force acts $60^\circ$ from a $3\,\mathrm m$ displacement. Use $\cos60^\circ=1/2$. What work does it do?
    choices:
      - text: "$60\\,\\mathrm J$"
        correct: true
      - text: "$120\\,\\mathrm J$"
        rationale: |
          This omits the angle factor. The force magnitude is forty. Check its component along displacement.
      - text: "$240\\,\\mathrm J$"
        rationale: |
          This divides by cosine instead of multiplying. The half factor is given. Check projection of the force along displacement.
      - text: "$20\\,\\mathrm J$"
        rationale: |
          This projects the force but omits displacement. The along-path component is needed. Check the three-meter travel.
    explanation: |
      $W=Fd\cos60^\circ=(40)(3)(1/2)=60\,\mathrm J$.

  - id: q-physics-work-energy-power-0018
    approved: false
    type: "simple-quantitative"
    difficulty: "hard"
    stem: |
      A moving object has initial kinetic energy $100\,\mathrm J$. The net work on it is $-30\,\mathrm J$. What is its final kinetic energy?
    choices:
      - text: "$70\\,\\mathrm J$"
        correct: true
      - text: "$130\\,\\mathrm J$"
        rationale: |
          This ignores the negative work sign. Adding a work magnitude seems natural. Check whether work adds or removes kinetic energy.
      - text: "$30\\,\\mathrm J$"
        rationale: |
          This reports the magnitude of the energy change as final energy. The work amount is given. Check the initial energy.
      - text: "$-70\\,\\mathrm J$"
        rationale: |
          This reverses the result’s sign. Negative work does remove energy. Check that kinetic energy remains a nonnegative quantity.
    explanation: |
      $KE_f=KE_i+W_{\mathrm{net}}=100-30=70\,\mathrm J$.

  - id: q-physics-work-energy-power-0019
    approved: false
    type: "compare-contrast"
    difficulty: "hard"
    stem: |
      The zero reference for gravitational potential energy is shifted downward by a fixed distance. What happens to predictions of kinetic-energy changes for the same motion?
    choices:
      - text: "They stay the same."
        correct: true
      - text: "They increase because every potential-energy value increases."
        rationale: |
          This confuses absolute reference values with differences. The listed potential energies do increase. Check final minus initial potential energy.
      - text: "They decrease because the new zero is lower."
        rationale: |
          This assigns a physical effect to a bookkeeping choice. The reference moved downward. Check the unchanged gravitational force and motion.
      - text: "They vanish because potential energy is arbitrary."
        rationale: |
          This treats an arbitrary zero as no meaningful energy change. The zero is chosen. Check that differences remain fixed.
    explanation: |
      Changing the zero adds the same constant to all potential-energy values. The difference between two positions is unchanged. Predictions using that difference stay the same.

  - id: q-physics-work-energy-power-0020
    approved: false
    type: "classify"
    difficulty: "exam"
    stem: |
      Can $PE=mgh$ with one constant near-Earth $g$ be used without qualification for a very large orbital altitude change?
    choices:
      - text: "No, gravity changes significantly with distance."
        correct: true
      - text: "Yes, $g$ is exactly constant at every distance from Earth."
        rationale: |
          This extends a near-surface approximation to space. Many introductory problems use one $g$. Check the altitude range.
      - text: "Yes, potential energy never depends on the gravitational field."
        rationale: |
          This removes the field from energy differences. Height appears prominently in $mgh$. Check the gravity factor.
      - text: "No, because gravitational potential energy exists only at ground level."
        rationale: |
          This limits an energy property to one height. Ground is often chosen as zero. Check zero reference versus where the interaction exists.
    explanation: |
      The $mgh$ form assumes gravity is approximately uniform over the height change. At very large changes, its variation matters. A more general gravitational potential-energy relation is needed.
