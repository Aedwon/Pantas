meta:
  subject: "science"
  topic: "physics"
  subtopic: "gravity-and-keplers-laws"
  exams: ["upcat", "dlsucet", "ustet", "dost-sei"]
questions:
  - id: q-physics-gravity-and-keplers-laws-0001
    type: "simple-quantitative"
    difficulty: "medium"
    stem: |
      Two fixed spherical masses are moved to three times their original center-to-center separation. What fraction of the original gravitational force remains?
    choices:
      - text: "$\\dfrac19$"
        correct: true
      - text: "$\\dfrac13$"
        rationale: |
          This omits squaring the separation factor. The distance triples. Check the exponent in the denominator.
      - text: "$3$"
        rationale: |
          This makes force grow with separation. A larger distance suggests a larger result. Check the inverse relation.
      - text: "$1$"
        rationale: |
          This ignores separation because the masses are fixed. Masses do matter. Check the distance term too.
    explanation: |
      With masses fixed, force varies as $1/r^2$. Tripling $r$ multiplies $r^2$ by $9$. The force becomes $\dfrac19$ of its original size.
    approved: true

  - id: q-physics-gravity-and-keplers-laws-0002
    type: "predict-outcome"
    difficulty: "medium"
    stem: |
      At fixed separation, one of two point masses is doubled. The other remains unchanged. What happens to their gravitational force magnitude?
    choices:
      - text: "It doubles."
        correct: true
      - text: "It quadruples because mass is squared."
        rationale: |
          This transfers the distance exponent to mass. Gravity contains a square. Check which variable is squared.
      - text: "It halves because the larger mass has more inertia."
        rationale: |
          This confuses force with acceleration response. Larger mass resists acceleration. Check the mass product in the force law.
      - text: "It stays unchanged because separation is fixed."
        rationale: |
          This considers only distance. The distance term is unchanged. Check the changed mass in the numerator.
    explanation: |
      The law gives $F=Gm_1m_2/r^2$. Doubling one mass doubles the mass product. At fixed separation, the force doubles.
    approved: true

  - id: q-physics-gravity-and-keplers-laws-0003
    type: "identify"
    difficulty: "hard"
    stem: |
      For two nonoverlapping spherical bodies with spherically symmetric mass distributions, what distance is used in Newton’s gravitational force formula?
    choices:
      - text: "Center-to-center distance"
        correct: true
      - text: "The gap between their nearest surfaces"
        rationale: |
          This uses the most visible gap. Surface separation is easy to measure. Check where each spherical body’s effective mass is located.
      - text: "The sum of their diameters regardless of spacing"
        rationale: |
          This uses object size instead of separation. Both bodies have measurable diameters. Check the distance between centers.
      - text: "The distance from one center to the other body’s nearest surface"
        rationale: |
          This combines two different reference points. One center is correctly identified. Check that both masses use their centers.
    explanation: |
      For spherically symmetric bodies outside each other, their gravitational effect can be calculated as if their masses were at their centers. The distance is between those centers.
    approved: true

  - id: q-physics-gravity-and-keplers-laws-0004
    type: "identify"
    difficulty: "easy"
    stem: |
      Which of Kepler's laws states that planets orbit the Sun in elliptical paths, with the Sun at one focus?
    choices:
      - text: "Kepler’s First Law"
        correct: true
      - text: "Kepler's Second Law (Law of Equal Areas)"
        rationale: |
          This selects the equal-area law. It also involves time, so it can sound relevant. Check equal intervals versus a whole-orbit period.
      - text: "Kepler's Third Law (Law of Harmonies)"
        rationale: |
          This selects the period-size law. It also describes orbits. Check whether the statement concerns an orbital ratio or the feature asked for.
      - text: "Newton's Law of Universal Gravitation"
        rationale: |
          This selects the gravitational force law. Gravity causes orbital motion. Check which law directly states the observed orbital pattern.
    explanation: |
      The first law describes orbital shape: an ellipse with the Sun at one focus. A circle is its zero-eccentricity special case.
    approved: true

  - id: q-physics-gravity-and-keplers-laws-0005
    type: "identify"
    difficulty: "easy"
    stem: |
      Which of Kepler's laws states that a line connecting a planet to the Sun sweeps out equal areas in equal time intervals?
    choices:
      - text: "Kepler’s Second Law"
        correct: true
      - text: "Kepler's First Law (Law of Ellipses)"
        rationale: |
          This selects the shape law. Shape relates to orbit size, so it sounds relevant. Check whether the statement concerns shape or the requested relationship.
      - text: "Kepler's Third Law (Law of Harmonies)"
        rationale: |
          This selects the period-size law. It also describes orbits. Check whether the statement concerns an orbital ratio or the feature asked for.
      - text: "Newton's Law of Universal Gravitation"
        rationale: |
          This selects the gravitational force law. Gravity causes orbital motion. Check which law directly states the observed orbital pattern.
    explanation: |
      The second law states that the Sun-planet line sweeps equal areas in equal time intervals.
    approved: true

  - id: q-physics-gravity-and-keplers-laws-0006
    type: "identify"
    difficulty: "easy"
    stem: |
      Which of Kepler’s laws relates orbital period squared to semimajor axis cubed for planets orbiting the same dominant star?
    choices:
      - text: "Kepler’s Third Law"
        correct: true
      - text: "Kepler's First Law (Law of Ellipses)"
        rationale: |
          This selects the shape law. Shape relates to orbit size, so it sounds relevant. Check whether the statement concerns shape or the requested relationship.
      - text: "Kepler's Second Law (Law of Equal Areas)"
        rationale: |
          This selects the equal-area law. It also involves time, so it can sound relevant. Check equal intervals versus a whole-orbit period.
      - text: "Newton's Law of Universal Gravitation"
        rationale: |
          This selects the gravitational force law. Gravity causes orbital motion. Check which law directly states the observed orbital pattern.
    explanation: |
      The third law states $T^2\propto a^3$ for planets around the same dominant central mass. Here $a$ is the semimajor axis.
    approved: true

  - id: q-physics-gravity-and-keplers-laws-0007
    type: "classify"
    difficulty: "medium"
    stem: |
      In a noncircular elliptical orbit about the Sun, where is the planet’s speed greatest?
    choices:
      - text: "At perihelion"
        correct: true
      - text: "At aphelion because that part of the orbit is farther away"
        rationale: |
          This reverses the near-far speed trend. Greater distance can suggest more travel. Check the equal-area rule.
      - text: "At every point because orbital speed is constant"
        rationale: |
          This imports circular-orbit speed into a noncircular orbit. The motion repeats. Check the changing distance from the Sun.
      - text: "At aphelion because gravitational attraction is weakest there"
        rationale: |
          This confuses weaker gravity with greater speed. Weak forces can suggest less slowing. Check the speed pattern within this orbit.
    explanation: |
      Kepler’s second law requires equal areas in equal times. Near perihelion, the Sun-planet line is shortest. The planet moves fastest there to sweep the required area.
    approved: true

  - id: q-physics-gravity-and-keplers-laws-0008
    type: "simple-quantitative"
    difficulty: "hard"
    stem: |
      Two planets orbit the same dominant star. Planet A has three times Planet B’s orbital period. What is the ratio $a_A^3/a_B^3$ of their semimajor axes cubed?
    choices:
      - text: "$9$"
        correct: true
      - text: "$3$"
        rationale: |
          This uses the period ratio without squaring it. The factor of three is stated directly. Check the exponent on period.
      - text: "$27$"
        rationale: |
          This cubes the period ratio. The orbital-size term is cubed. Check which exponent belongs to period.
      - text: "$1$"
        rationale: |
          This assumes the shared star makes orbital size equal. The central mass is common. Check the different periods.
    explanation: |
      For the same dominant star, $\dfrac{a_A^3}{a_B^3}=\left(\dfrac{T_A}{T_B}\right)^2$. The ratio is $3^2=9$.
    approved: true

  - id: q-physics-gravity-and-keplers-laws-0009
    type: "classify"
    difficulty: "hard"
    stem: |
      According to Newton’s law, which interaction occurs between two isolated point masses?
    choices:
      - text: "Mutual attraction"
        correct: true
      - text: "Repulsion if the two masses are equal"
        rationale: |
          This imports a like-charge rule into gravity. Equal properties can suggest repulsion. Check that mass in this model attracts mass.
      - text: "Attraction only if at least one mass is a planet"
        rationale: |
          This limits gravity to astronomical objects. Planetary examples are common. Check that the law applies to every mass.
      - text: "A force only on the smaller mass"
        rationale: |
          This treats the larger body as an unaffected source. Its motion can be hard to notice. Check that each body attracts the other.
    explanation: |
      Every mass attracts another mass in Newton’s model. The force on each body points toward the other.
    approved: true

  - id: q-physics-gravity-and-keplers-laws-0010
    type: "classify"
    difficulty: "hard"
    stem: |
      How does a circular orbit fit Kepler’s first law?
    choices:
      - text: "It is an ellipse with zero eccentricity."
        correct: true
      - text: "It is excluded because ellipses cannot be circles."
        rationale: |
          This treats the two names as disjoint categories. Drawings often show stretched ellipses. Check the zero-eccentricity special case.
      - text: "It puts the Sun at both ends of a diameter."
        rationale: |
          This confuses foci with endpoints. Ellipses have two foci. Check where the foci meet in a circle.
      - text: "It proves every elliptical orbit has the Sun at its geometric center."
        rationale: |
          This generalizes the circular case. A circle’s center coincides with its foci. Check a noncircular ellipse.
    explanation: |
      A circle is the zero-eccentricity case of an ellipse. Its two foci coincide at the center. The Sun at one focus then lies at the center.
    approved: true

  - id: q-physics-gravity-and-keplers-laws-0011
    type: "predict-outcome"
    difficulty: "hard"
    stem: |
      A planet sweeps an area $A$ in one month near perihelion. In an equal one-month interval near aphelion, what area does it sweep in the two-body model?
    choices:
      - text: "$A$"
        correct: true
      - text: "$2A$ because the planet is farther from the Sun"
        rationale: |
          This uses distance alone to scale area. A longer Sun-planet line matters geometrically. Check the equal-time condition.
      - text: "$A/2$ because the planet travels more slowly"
        rationale: |
          This uses speed alone to scale area. Speed is lower at aphelion. Check the compensating greater distance from the Sun.
      - text: "$0$ because the planet stops at aphelion"
        rationale: |
          This confuses slowest speed with a stop. Aphelion is a turning point in radial distance. Check that orbital motion continues.
    explanation: |
      Kepler’s second law states that equal time intervals give equal swept areas. Both intervals last one month. Each therefore sweeps area $A$.
    approved: true

  - id: q-physics-gravity-and-keplers-laws-0012
    type: "compare-contrast"
    difficulty: "hard"
    stem: |
      For small planets orbiting the same dominant star, which relation is Kepler’s third law?
    choices:
      - text: "$T^2\\propto a^3$"
        correct: true
      - text: "$T\\propto a$"
        rationale: |
          This drops both exponents. Larger orbits do have longer periods. Check the precise powers in the law.
      - text: "$T^3\\propto a^2$"
        rationale: |
          This swaps the powers. Both a square and a cube belong in the law. Check which quantity receives each.
      - text: "$T^2\\propto a$"
        rationale: |
          This keeps the period square but omits the axis cube. Half the relation looks familiar. Check the power on orbital size.
    explanation: |
      Kepler’s third law relates orbital period squared to semimajor axis cubed. For the same central mass, $T^2/a^3$ has the same value.
    approved: true

  - id: q-physics-gravity-and-keplers-laws-0013
    type: "compare-contrast"
    difficulty: "medium"
    stem: |
      How did Kepler’s and Newton’s contributions to planetary motion differ?
    choices:
      - text: "Kepler found orbital patterns; Newton explained their cause."
        correct: true
      - text: "Newton found the orbital patterns before Kepler supplied gravity."
        rationale: |
          This reverses the historical roles. Both are associated with planetary laws. Check who used Brahe’s observations.
      - text: "Kepler described motion while Newton proved gravity was unrelated."
        rationale: |
          This separates the laws completely. Their equations look different. Check that gravity can produce the orbital patterns.
      - text: "Newton’s gravity made all of Kepler’s orbital patterns false."
        rationale: |
          This treats a later explanation as a rejection. Later theories can replace earlier ones. Check the two-body conditions under which the laws agree.
    explanation: |
      Kepler found mathematical patterns in planetary observations. Newton later explained those patterns using gravity and the laws of motion under the two-body approximation.
    approved: true

  - id: q-physics-gravity-and-keplers-laws-0014
    type: "simple-quantitative"
    difficulty: "exam"
    stem: |
      Two fixed point masses have separation $r$. What new separation would make the gravitational force four times larger?
    choices:
      - text: "$r/2$"
        correct: true
      - text: "$2r$"
        rationale: |
          This enlarges separation when force must grow. The factors two and four suggest squaring. Check whether force increases or decreases with distance.
      - text: "$r/4$"
        rationale: |
          This treats force as inversely proportional to plain distance. A factor of four is requested. Check the distance square.
      - text: "$4r$"
        rationale: |
          This treats force as directly proportional to distance. Both are quantities that can change. Check the denominator of the force law.
    explanation: |
      For a force factor of $4$, the distance-squared denominator must become $\dfrac14$ as large. Its square root is $\dfrac12$. The new separation is $r/2$.
    approved: true

  - id: q-physics-gravity-and-keplers-laws-0015
    approved: false
    type: "structure-function"
    difficulty: "easy"
    stem: |
      In Kepler’s first law, what role does the Sun’s position have in a noncircular planetary ellipse?
    choices:
      - text: "It occupies one focus."
        correct: true
      - text: "It occupies the geometric center of every ellipse."
        rationale: |
          This extends a circular picture to a noncircular orbit. The center is a natural reference point. Check the first law’s focus statement.
      - text: "It occupies the point farthest from both foci."
        rationale: |
          This treats the Sun as an endpoint of the ellipse. Endpoints are easy to see. Check the named focus position.
      - text: "It lies outside the ellipse and pulls the planet along its edge."
        rationale: |
          This separates the attraction source from the enclosed orbit. A remote pull may seem possible. Check that the Sun lies at a focus inside the ellipse.
    explanation: |
      Kepler’s first law places the Sun at one focus of the orbital ellipse. In a noncircular ellipse that focus is offset from the geometric center.

  - id: q-physics-gravity-and-keplers-laws-0016
    approved: false
    type: "simple-quantitative"
    difficulty: "medium"
    stem: |
      A planet’s perihelion distance is $2$ units and its aphelion distance is $6$ units. What is its semimajor axis?
    choices:
      - text: "$4$ units"
        correct: true
      - text: "$8$ units"
        rationale: |
          This adds the extreme distances without halving. Their sum gives the major-axis length. Check that the semimajor axis is half of that.
      - text: "$2$ units"
        rationale: |
          This uses the closest distance alone. Perihelion is a key orbit point. Check both extremes in the semimajor-axis relation.
      - text: "$3$ units"
        rationale: |
          This halves only the aphelion distance. The word semi suggests halving. Check which full length should be halved.
    explanation: |
      The semimajor axis is half the sum of the two extreme distances. Thus $a=\dfrac{2+6}{2}=4$ units.

  - id: q-physics-gravity-and-keplers-laws-0017
    approved: false
    type: "simple-quantitative"
    difficulty: "hard"
    stem: |
      Two small planets orbit the same dominant star. One orbit has four times the semimajor axis of the other. What is the ratio of their orbital periods?
    choices:
      - text: "$8$"
        correct: true
      - text: "$4$"
        rationale: |
          This assumes period grows directly with axis. Both increase together. Check the square and cube in the relation.
      - text: "$16$"
        rationale: |
          This squares the axis ratio. A square appears in the law. Check that axis is cubed and period is squared.
      - text: "$64$"
        rationale: |
          This finds the ratio of period squares but reports it as the period ratio. Cubing the axis ratio is required. Check the final square root.
    explanation: |
      Kepler’s third law gives $\left(\dfrac{T_1}{T_2}\right)^2=4^3=64$. Taking the positive square root gives $T_1/T_2=8$.

  - id: q-physics-gravity-and-keplers-laws-0018
    approved: false
    type: "predict-outcome"
    difficulty: "hard"
    stem: |
      Two negligible-mass planets have equal orbital semimajor axes about different stars. Star A has four times Star B’s mass. How does the period about A compare with that about B?
    choices:
      - text: "It is half as long."
        correct: true
      - text: "It is the same because the orbital sizes match."
        rationale: |
          This uses a common-star ratio for different stars. Equal axes look sufficient. Check the central mass in the Newtonian law.
      - text: "It is twice as long because the star is heavier."
        rationale: |
          This makes stronger gravity produce a longer period at fixed size. The mass factor matters. Check whether central mass is in the numerator or denominator.
      - text: "It is one-quarter as long because the star is four times heavier."
        rationale: |
          This uses the period-squared ratio as the period ratio. A factor of four is stated. Check the square root.
    explanation: |
      At fixed $a$, $T^2=\dfrac{4\pi^2a^3}{GM}$ is inversely proportional to star mass. Four times the mass gives one-quarter of the period squared. The period is therefore halved.

  - id: q-physics-gravity-and-keplers-laws-0019
    approved: false
    type: "process-ordering"
    difficulty: "hard"
    stem: |
      A small planet moves from perihelion toward aphelion in a noncircular orbit. Which sequence describes its distance and speed?
    choices:
      - text: "Distance increases; speed decreases."
        correct: true
      - text: "Distance increases; speed increases."
        rationale: |
          This assumes longer radius requires greater speed. More distant travel sounds larger. Check the within-orbit speed pattern.
      - text: "Distance decreases; speed increases."
        rationale: |
          This gives the return trip from aphelion. The two named points are familiar. Check the stated starting point.
      - text: "Distance remains fixed; speed remains fixed."
        rationale: |
          This applies the circular case. Orbits repeat regularly. Check the noncircular condition.
    explanation: |
      Perihelion is the closest point and aphelion is the farthest. On that part of the orbit, distance grows while speed falls in accordance with the equal-area rule.

  - id: q-physics-gravity-and-keplers-laws-0020
    approved: false
    type: "classify"
    difficulty: "exam"
    stem: |
      Which measurements directly test Kepler’s third law for several small planets around the same dominant star?
    choices:
      - text: "Periods and semimajor axes"
        correct: true
      - text: "Current distances and current speeds at arbitrary points"
        rationale: |
          This uses instantaneous measurements for whole-orbit quantities. Position and speed are observable. Check which quantities appear in the third law.
      - text: "Planet diameters and surface temperatures"
        rationale: |
          This uses physical appearance instead of orbit measurements. Planet properties can correlate with location. Check period and orbital size.
      - text: "Perihelion distances alone for all orbits"
        rationale: |
          This substitutes one extreme distance for the semimajor axis. Perihelion is easy to name. Check the shape of each orbit.
    explanation: |
      The third law compares each whole-orbit period squared with its semimajor axis cubed. Measuring those quantities tests whether their ratio is common for planets around the same dominant star.
