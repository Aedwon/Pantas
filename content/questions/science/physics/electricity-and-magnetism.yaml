meta:
  subject: "science"
  topic: "physics"
  subtopic: "electricity-and-magnetism"
  exams: ["upcat", "dlsucet", "ustet", "dost-sei"]
questions:
  - id: q-physics-electricity-and-magnetism-0001
    type: "simple-quantitative"
    difficulty: "medium"
    stem: |
      Two fixed point charges are moved to twice their original separation. What is the new force magnitude relative to the original?
    choices:
      - text: "$\\dfrac14$"
        correct: true
      - text: "$\\dfrac12$"
        rationale: |
          This omits the square of distance. The separation doubles, so halving seems natural. Check the exponent on distance.
      - text: "$2$"
        rationale: |
          This makes force increase with distance. The doubled separation suggests a doubled result. Check whether distance is in the numerator or denominator.
      - text: "$1$"
        rationale: |
          This ignores separation. The charges are unchanged. Check all variables in Coulomb’s law.
    explanation: |
      With fixed charges, $F\propto1/r^2$. Doubling separation multiplies the denominator by $2^2=4$. The new magnitude is $\dfrac14$ of the original.
    approved: true

  - id: q-physics-electricity-and-magnetism-0002
    type: "simple-quantitative"
    difficulty: "hard"
    stem: |
      One of two point charges is doubled while their separation is doubled. The other charge stays fixed. What is the new force magnitude relative to the original?
    choices:
      - text: "$\\dfrac12$"
        correct: true
      - text: "$2$"
        rationale: |
          This changes only the charge. Doubling charge does increase force at fixed distance. Check the simultaneous distance change.
      - text: "$\\dfrac14$"
        rationale: |
          This changes only the separation. The inverse-square rule is familiar. Check the doubled charge too.
      - text: "$1$"
        rationale: |
          This cancels two factors of two directly. Both charge and distance double. Check that distance is squared.
    explanation: |
      Coulomb’s law gives $F\propto q_1q_2/r^2$. The charge product doubles and the distance squared becomes four times as large. Thus $F_{\mathrm{new}}=\dfrac24F_{\mathrm{old}}=\dfrac12F_{\mathrm{old}}$.
    approved: true

  - id: q-physics-electricity-and-magnetism-0003
    type: "simple-quantitative"
    difficulty: "easy"
    stem: |
      An ohmic resistor of $10\,\Omega$ carries $2\,\mathrm A$. What is the voltage across it?
    choices:
      - text: "$20\\,\\mathrm V$"
        correct: true
      - text: "$5\\,\\mathrm V$"
        rationale: |
          This divides resistance by current. Division is used in other forms of Ohm’s law. Check how to isolate voltage.
      - text: "$12\\,\\mathrm V$"
        rationale: |
          This adds current and resistance. Both numbers are given. Check that the law calls for a product.
      - text: "$8\\,\\mathrm V$"
        rationale: |
          This subtracts current from resistance. A difference can sound like potential difference. Check the quantities and their units.
    explanation: |
      Ohm’s law is $V=IR$. Multiply current by resistance: $V=(2)(10)=20\,\mathrm V$.
    approved: true

  - id: q-physics-electricity-and-magnetism-0004
    type: "simple-quantitative"
    difficulty: "medium"
    stem: |
      An ohmic resistor has $24\,\mathrm V$ across it and carries $3\,\mathrm A$. What is its resistance?
    choices:
      - text: "$8\\,\\Omega$"
        correct: true
      - text: "$72\\,\\Omega$"
        rationale: |
          This multiplies voltage and current. That product is familiar from power calculations. Check which quantity is being found.
      - text: "$21\\,\\Omega$"
        rationale: |
          This subtracts current from voltage. It uses both given values. Check that unlike units cannot be subtracted.
      - text: "$27\\,\\Omega$"
        rationale: |
          This adds voltage and current. It combines the numbers without rearranging. Check the division needed to isolate resistance.
    explanation: |
      Rearrange $V=IR$ as $R=\dfrac VI$. Then $R=\dfrac{24}{3}=8\,\Omega$.
    approved: true

  - id: q-physics-electricity-and-magnetism-0005
    type: "simple-quantitative"
    difficulty: "medium"
    stem: |
      An ohmic resistor of $5\,\Omega$ is connected across $15\,\mathrm V$. What current flows?
    choices:
      - text: "$3\\,\\mathrm A$"
        correct: true
      - text: "$75\\,\\mathrm A$"
        rationale: |
          This multiplies voltage and resistance. The product form of the law looks familiar. Check which quantity must be isolated.
      - text: "$10\\,\\mathrm A$"
        rationale: |
          This subtracts resistance from voltage. Resistance may sound like something to take away. Check the formula instead of subtracting unlike units.
      - text: "$20\\,\\mathrm A$"
        rationale: |
          This adds resistance to voltage. Both values are given. Check that increased resistance should reduce current at fixed voltage.
    explanation: |
      Current is $I=\dfrac VR$. Substitute: $I=\dfrac{15}{5}=3\,\mathrm A$.
    approved: true

  - id: q-physics-electricity-and-magnetism-0006
    type: "predict-outcome"
    difficulty: "medium"
    stem: |
      Two bulbs are connected in series. One fails open. What happens to current through the other bulb?
    choices:
      - text: "It stops."
        correct: true
      - text: "It stays unchanged because each bulb has a separate path."
        rationale: |
          This applies parallel behavior to series wiring. Independent lamps are familiar. Check the single path in series.
      - text: "It increases because one bulb no longer uses current."
        rationale: |
          This treats an open bulb as a removed resistance with a connected wire. One fewer working bulb sounds like less resistance. Check whether the path is still complete.
      - text: "It decreases but remains nonzero through the gap."
        rationale: |
          This treats an open gap as merely high resistance. Dimness can seem like partial failure. Check the stated open-circuit condition.
    explanation: |
      Series components share one current path. An open bulb breaks that path. No current flows through the other bulb.
    approved: true

  - id: q-physics-electricity-and-magnetism-0007
    type: "predict-outcome"
    difficulty: "medium"
    stem: |
      Two bulbs occupy separate parallel branches across an ideal fixed-voltage source. One branch fails open. What happens to the other bulb?
    choices:
      - text: "It remains lit."
        correct: true
      - text: "It goes dark because the failed branch opens every path."
        rationale: |
          This uses series behavior for parallel wiring. Both bulbs share a source. Check each branch’s complete path.
      - text: "It becomes dimmer because its voltage must fall."
        rationale: |
          This assumes the source voltage is divided among branches. Voltage division is familiar from series circuits. Check the fixed voltage across parallel branches.
      - text: "It becomes brighter because it receives the other branch’s current."
        rationale: |
          This treats total current as fixed. Current divides before failure, so redistribution seems plausible. Check that the ideal source fixes voltage rather than total current.
    explanation: |
      The remaining branch still forms a complete path. It keeps the same voltage from the ideal source. Its bulb remains lit.
    approved: true

  - id: q-physics-electricity-and-magnetism-0008
    type: "identify"
    difficulty: "easy"
    stem: |
      What is the interaction between two stationary positive point charges?
    choices:
      - text: "Repulsion"
        correct: true
      - text: "Attraction"
        rationale: |
          This reverses the like-charge rule. Charges interact in either direction. Check whether their signs match.
      - text: "No force because their signs cancel"
        rationale: |
          This treats matching signs as cancellation. Cancellation occurs in some sums. Check the product of two nonzero charges.
      - text: "Attraction at large separation and repulsion nearby"
        rationale: |
          This lets distance change the type of force. Distance changes its strength. Check that the signs determine attraction or repulsion.
    explanation: |
      Two positive charges have like signs. Each experiences a force directed away from the other. This is repulsion.
    approved: true

  - id: q-physics-electricity-and-magnetism-0009
    type: "identify"
    difficulty: "easy"
    stem: |
      What is the interaction between a stationary positive point charge and a stationary negative point charge?
    choices:
      - text: "Attraction"
        correct: true
      - text: "Repulsion"
        rationale: |
          This applies the like-charge rule to opposite signs. Repulsion is a familiar charge effect. Check the two signs.
      - text: "No force because the total charge may be zero"
        rationale: |
          This confuses net charge with force between charges. Equal opposite charges can sum to zero. Check whether each charge still experiences a field.
      - text: "Repulsion if the negative charge is larger"
        rationale: |
          This makes size determine force direction. Unequal magnitudes change strength. Check signs separately from magnitudes.
    explanation: |
      The charges have opposite signs. Each is pulled toward the other. This is attraction.
    approved: true

  - id: q-physics-electricity-and-magnetism-0010
    type: "structure-function"
    difficulty: "hard"
    stem: |
      An electric field at a point is defined using the force on which reference charge?
    choices:
      - text: "A positive test charge"
        correct: true
      - text: "A negative test charge with no sign correction"
        rationale: |
          This reverses the field’s reference direction. Electrons are familiar negative charges. Check the positive-test-charge convention.
      - text: "An uncharged particle with no electric force"
        rationale: |
          This removes the response used to define the field. Neutral particles seem less disturbing. Check how force per charge could be measured.
      - text: "Any charge, with field magnitude equal to force alone"
        rationale: |
          This omits division by charge. Force is the direct observable. Check that field is force per unit charge.
    explanation: |
      The electric field is force per unit positive test charge: $\vec E=\vec F/q$. Its direction is the force direction on that positive charge.
    approved: true

  - id: q-physics-electricity-and-magnetism-0011
    type: "compare-contrast"
    difficulty: "hard"
    stem: |
      Two unequal ideal resistors are connected in parallel across the same source. Which quantity must be equal for both branches?
    choices:
      - text: "Voltage"
        correct: true
      - text: "Current"
        rationale: |
          This carries the series-current rule into parallel wiring. Both branches share a source. Check that unequal resistance can give unequal current.
      - text: "Resistance"
        rationale: |
          This confuses shared connections with identical components. The branches look similar. Check the stated unequal resistors.
      - text: "Voltage divided by current"
        rationale: |
          This treats each branch’s resistance as common. Ohm’s law links these values. Check that the voltage-to-current ratio is the resistance.
    explanation: |
      Both branches connect across the same two source terminals. They therefore have the same potential difference, or voltage.
    approved: true

  - id: q-physics-electricity-and-magnetism-0012
    type: "predict-outcome"
    difficulty: "hard"
    stem: |
      A magnetic flux through a closed conducting loop decreases. What does Lenz’s law say about the induced magnetic effect?
    choices:
      - text: "It opposes the decrease in flux."
        correct: true
      - text: "It always opposes the direction of the original field."
        rationale: |
          This substitutes field direction for change in flux. The word opposes sounds like reversal. Check whether the flux is increasing or decreasing.
      - text: "It reinforces the decrease in flux."
        rationale: |
          This makes induction strengthen the change. A changing system may seem to keep changing. Check Lenz’s opposition to the change.
      - text: "It has no effect unless the flux becomes zero."
        rationale: |
          This waits for a zero field before induction. A vanishing field seems dramatic. Check whether flux is already changing.
    explanation: |
      The induced effect acts against the change that caused it. For decreasing flux, it tends to support the original flux and oppose its decrease.
    approved: true

  - id: q-physics-electricity-and-magnetism-0013
    type: "cause-effect"
    difficulty: "hard"
    stem: |
      A straight wire carries conventional current upward. If its direction reverses, what happens to the surrounding magnetic field’s direction?
    choices:
      - text: "It reverses."
        correct: true
      - text: "It stays the same because the wire has not moved."
        rationale: |
          This treats field direction as fixed by location alone. The wire’s position is unchanged. Check the current direction in the right-hand rule.
      - text: "It points along the wire instead of around it."
        rationale: |
          This confuses current direction with field direction. Both reverse with the setup. Check which direction the thumb and curled fingers represent.
      - text: "It points radially outward instead of circling."
        rationale: |
          This uses electric-field geometry for a current-produced field. Both fields surround sources. Check the circular magnetic pattern.
    explanation: |
      Point the right thumb along the new conventional current. The fingers curl in the opposite direction around the wire. The magnetic field direction reverses.
    approved: true

  - id: q-physics-electricity-and-magnetism-0014
    type: "predict-outcome"
    difficulty: "medium"
    stem: |
      A vertical straight wire carries conventional current upward. Viewed from above looking down, with current directed toward the viewer, which way does the magnetic field circle?
    choices:
      - text: "Counterclockwise"
        correct: true
      - text: "Clockwise"
        rationale: |
          This reverses the viewing direction or uses the left hand. Either change flips the apparent circle. Check that current points toward the viewer.
      - text: "Radially outward"
        rationale: |
          This substitutes positive-charge field lines for wire magnetism. Both involve electrical sources. Check the curled-finger pattern.
      - text: "Parallel to the current"
        rationale: |
          This follows the thumb instead of the fingers. The thumb gives a clear direction. Check what the curled fingers show.
    explanation: |
      Point the right thumb upward along the current. Viewed from above, the fingers curl counterclockwise. This gives the magnetic field direction.
    approved: true

  - id: q-physics-electricity-and-magnetism-0015
    type: "simple-quantitative"
    difficulty: "exam"
    stem: |
      A $4\,\Omega$ resistor and an $8\,\Omega$ resistor are connected in series across $24\,\mathrm V$. What current passes through the $8\,\Omega$ resistor?
    choices:
      - text: "$2\\,\\mathrm A$"
        correct: true
      - text: "$3\\,\\mathrm A$"
        rationale: |
          This assigns all source voltage to the larger resistor. It uses that resistor alone. Check the total series resistance first.
      - text: "$6\\,\\mathrm A$"
        rationale: |
          This uses only the smaller resistor. Its smaller resistance suggests more current. Check that the same current passes through both series resistors.
      - text: "$9\\,\\mathrm A$"
        rationale: |
          This adds currents calculated as if both resistors were parallel. Adding branch currents is familiar. Check the stated series connection.
    explanation: |
      The series resistance is $4+8=12\,\Omega$. The loop current is $I=\dfrac{24}{12}=2\,\mathrm A$. The same current passes through each resistor.
    approved: true

  - id: q-physics-electricity-and-magnetism-0016
    approved: false
    type: "simple-quantitative"
    difficulty: "medium"
    stem: |
      Two $6\,\Omega$ ideal resistors are connected in parallel. What is their equivalent resistance?
    choices:
      - text: "$3\\,\\Omega$"
        correct: true
      - text: "$12\\,\\Omega$"
        rationale: |
          This adds resistances as in series. The two values are easy to total. Check that parallel connections add reciprocal resistances.
      - text: "$6\\,\\Omega$"
        rationale: |
          This keeps one branch’s resistance. Both branches use the same value. Check the additional current path.
      - text: "$\\dfrac13\\,\\Omega$"
        rationale: |
          This stops at the reciprocal result. The sum of reciprocals is the visible calculation. Check that the requested quantity is resistance, not its reciprocal.
    explanation: |
      For parallel resistors, $\dfrac1{R_{\mathrm{eq}}}=\dfrac16+\dfrac16=\dfrac13$. Taking the reciprocal gives $R_{\mathrm{eq}}=3\,\Omega$.

  - id: q-physics-electricity-and-magnetism-0017
    approved: false
    type: "classify"
    difficulty: "medium"
    stem: |
      A device’s resistance changes strongly as it warms, giving a curved voltage-current graph. How should it be classified over that range?
    choices:
      - text: "Non-ohmic"
        correct: true
      - text: "Ohmic with constant resistance"
        rationale: |
          This applies Ohm’s law to every device. Resistance is an electrical property. Check whether voltage is proportional to current over the range.
      - text: "An open circuit at every voltage"
        rationale: |
          This mistakes nonlinearity for no conduction. A curved graph differs from the usual straight line. Check whether current is still measured.
      - text: "An ideal fixed resistor in all conditions"
        rationale: |
          This ignores the stated temperature change. Resistors are commonly idealized. Check whether that idealization matches the data.
    explanation: |
      An ohmic device has a straight-line voltage-current relation with constant resistance under the stated conditions. This device changes resistance over the range. It is non-ohmic there.

  - id: q-physics-electricity-and-magnetism-0018
    approved: false
    type: "cause-effect"
    difficulty: "hard"
    stem: |
      A magnetic flux through an open conducting loop changes. Which outcome is possible even though no sustained current flows around the loop?
    choices:
      - text: "An induced emf"
        correct: true
      - text: "No induced effect of any kind"
        rationale: |
          This equates emf with conduction current. They often occur together in a closed loop. Check whether the path must be closed for emf or for current.
      - text: "A sustained current across the open gap"
        rationale: |
          This ignores the break in the conducting path. Changing flux can drive current in closed loops. Check whether this loop is closed.
      - text: "An emf only if the magnetic flux is constant"
        rationale: |
          This reverses the induction condition. A strong constant field can seem sufficient. Check change in flux over time.
    explanation: |
      Changing magnetic flux induces an emf. An open path prevents a sustained conduction current around the loop. The emf can still be present.

  - id: q-physics-electricity-and-magnetism-0019
    approved: false
    type: "compare-contrast"
    difficulty: "hard"
    stem: |
      Which observation distinguishes ordinary magnetic poles from electric charges?
    choices:
      - text: "Ordinary magnets retain paired poles."
        correct: true
      - text: "Positive and negative electric charges cannot be separated."
        rationale: |
          This applies paired magnetic poles to charges. The two naming systems sound similar. Check whether a body can carry net electric charge.
      - text: "A cut magnet yields one isolated north pole and one isolated south pole."
        rationale: |
          This treats a magnet as two separable charges. The original ends have different pole names. Check whether each piece becomes a smaller magnet.
      - text: "Magnetic field lines begin at isolated poles and never return."
        rationale: |
          This applies an electric-field pattern to magnetism. Lines are drawn outside both types of sources. Check that ordinary magnetic field lines form closed loops.
    explanation: |
      Ordinary magnets have north and south poles together. Cutting a magnet produces smaller magnets with paired poles. Isolated magnetic monopoles have not been observed.

  - id: q-physics-electricity-and-magnetism-0020
    approved: false
    type: "process-ordering"
    difficulty: "exam"
    stem: |
      Which order correctly applies the right-hand rule for the magnetic field around a straight wire?
    choices:
      - text: "Identify conventional current, align the thumb, read the finger curl."
        correct: true
      - text: "Identify electron flow, align the right thumb with it, read the finger curl."
        rationale: |
          This uses electron flow without reversing it. Electrons carry current in metals. Check the conventional-current direction.
      - text: "Identify current, align the fingers along it, read the thumb as field direction."
        rationale: |
          This swaps the roles of thumb and fingers. Both are parts of the rule. Check which one represents current.
      - text: "Identify current, align the left thumb, read the finger curl."
        rationale: |
          This substitutes the left hand. The same gesture appears similar. Check the required hand.
    explanation: |
      First determine conventional current. Point the right thumb in that direction. The curled fingers show the field direction around the wire.
