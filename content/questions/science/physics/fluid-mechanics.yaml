questions:
  - id: q-physics-fluid-mechanics-0001
    type: simple-quantitative
    difficulty: easy
    stem: |
      An object has a mass of 300 g and a volume of 150 cm³. Find its density. (Use $\rho = \dfrac{m}{V}$.)
    choices:
      - text: 2 g/cm^3
        correct: true
      - text: 0.5 g/cm^3
        rationale: |
          You inverted mass and volume ($\dfrac{V}{m} = \dfrac{150}{300}$). Density is $\rho = \dfrac{m}{V} = \dfrac{300}{150} = 2\text{ g/cm}^3$.
      - text: 450 g/cm^3
        rationale: |
          You added mass and volume ($300 + 150$). Calculate density using division: $\rho = \dfrac{m}{V}$.
      - text: 150 g/cm^3
        rationale: |
          You subtracted volume from mass ($300 - 150$). Calculate density using division: $\rho = \dfrac{m}{V} = 2\text{ g/cm}^3$.
    explanation: |
      $\rho = \dfrac{m}{V} = \dfrac{300}{150} = 2$ g/cm³.
    approved: true
  - id: q-physics-fluid-mechanics-0002
    type: classify
    difficulty: easy
    stem: |
      An object has a density of 0.8 g/cm³. It is placed in water, which has a density of 1.0 g/cm³. Will the object float or sink?
    choices:
      - text: Float, since its density is less than water's density.
        correct: true
      - text: Sink, since its density is less than water's density.
        rationale: |
          You inverted the float/sink criteria. Lower density objects float in denser fluids.
      - text: Stay perfectly suspended, neither floating nor sinking.
        rationale: |
          You assumed neutral buoyancy. Neutral buoyancy requires exact density matching ($0.8 = 1.0$), which is untrue here.
      - text: It cannot be determined without knowing the object's shape.
        rationale: |
          You claimed shape determines buoyancy. Buoyancy depends directly on average density relative to the fluid.
    explanation: |
      An object less dense than the surrounding fluid floats. Since 0.8 g/cm³ is less than water's 1.0 g/cm³, the object floats.
    approved: true
  - id: q-physics-fluid-mechanics-0003
    type: classify
    difficulty: medium
    stem: |
      An object has a density of 1.2 g/cm³. It is placed in water, which has a density of 1.0 g/cm³. Will the object float or sink?
    choices:
      - text: Sink, since its density is greater than water's density.
        correct: true
      - text: Float, since its density is greater than water's density.
        rationale: |
          You inverted buoyancy principles. Objects denser than the surrounding fluid sink.
      - text: Stay perfectly suspended, neither floating nor sinking.
        rationale: |
          You assumed neutral buoyancy. Neutral buoyancy requires equal densities ($1.2 = 1.0$), which is false here.
      - text: It cannot be determined without knowing the object's mass.
        rationale: |
          You claimed mass knowledge is required. Relative density alone determines floating or sinking.
    explanation: |
      An object denser than the surrounding fluid sinks. Since 1.2 g/cm³ is greater than water's 1.0 g/cm³, the object sinks.
    approved: true
  - id: q-physics-fluid-mechanics-0004
    type: simple-quantitative
    difficulty: medium
    stem: |
      A solid block, fully submerged in water, displaces 250 cm³ of water. Water has a density of 1 g/cm³. Find the buoyant force on the block. (Use $g = 9.8 \text{ m/s}^2$.)
    choices:
      - text: 2.45 N
        correct: true
      - text: 250 N
        rationale: |
          You used volume in $\text{cm}^3$ directly as force in Newtons. Convert $250\text{ cm}^3$ water to mass ($0.25\text{ kg}$) and multiply by $g = 9.8\text{ m/s}^2$.
      - text: 24.5 N
        rationale: |
          You miscalculated unit conversion ($2.5\text{ kg}$ instead of $0.25\text{ kg}$). $0.25 \times 9.8 = 2.45\text{ N}$.
      - text: 0.25 N
        rationale: |
          You reported mass of displaced water ($0.25\text{ kg}$) without multiplying by $g = 9.8\text{ m/s}^2$.
    explanation: |
      Mass of displaced water: $(1)(250) = 250$ g $= 0.25$ kg. Weight (buoyant force): $W = mg = (0.25)(9.8) = 2.45$ N.
    approved: true
  - id: q-physics-fluid-mechanics-0005
    type: identify
    difficulty: medium
    stem: |
      What is the formula for pressure?
    choices:
      - text: P = F/A
        correct: true
      - text: P = F x A
        rationale: |
          You multiplied force by area. Pressure is force per unit area: $P = \dfrac{F}{A}$.
      - text: P = m/V
        rationale: |
          You picked density formula ($\rho = \dfrac{m}{V}$). Pressure is force per unit area ($P = \dfrac{F}{A}$).
      - text: P = mg
        rationale: |
          You picked weight formula ($W = mg$). Pressure divides force by contact area.
    explanation: |
      Pressure is force spread over an area: $P = \dfrac{F}{A}$.
    approved: true
  - id: q-physics-fluid-mechanics-0006
    type: cause-effect
    difficulty: medium
    stem: |
      According to Bernoulli's Principle, what happens to a fluid's pressure as its speed increases?
    choices:
      - text: The pressure decreases.
        correct: true
      - text: The pressure increases.
        rationale: |
          You inverted Bernoulli's relationship. Fluid acceleration creates a localized pressure decrease.
      - text: The pressure stays exactly the same.
        rationale: |
          You assumed pressure is speed-independent. Fluid velocity changes alter internal pressure inverse-proportionally.
      - text: Pressure and speed are unrelated.
        rationale: |
          You denied fluid dynamics principles. Bernoulli's Principle explicitly relates fluid speed to internal pressure.
    explanation: |
      Bernoulli's Principle describes an inverse relationship: as a fluid's speed increases, its pressure decreases.
    approved: true
  - id: q-physics-fluid-mechanics-0007
    type: cause-effect
    difficulty: hard
    stem: |
      Air moves faster over the curved top of an airplane wing than beneath its flatter bottom. Using Bernoulli's Principle, explain why this creates lift.
    choices:
      - text: Faster air above the wing has lower pressure; slower air below has higher pressure, and the higher pressure below pushes the wing up more than the lower pressure above pushes it down.
        correct: true
      - text: Faster air above the wing has higher pressure, directly pushing the wing upward.
        rationale: |
          You assigned higher pressure to faster air. Bernoulli's Principle states faster air produces lower pressure.
      - text: The wing's shape has no effect on air pressure at all.
        rationale: |
          You denied aerodynamic shape effects. Wing curvature forces air over the top to travel faster, creating pressure differences.
      - text: Lift is caused entirely by the airplane's engines, not by air pressure differences.
        rationale: |
          You attributed lift solely to thrust engines. Engines provide forward speed; wing airflow pressure differences generate aerodynamic lift.
    explanation: |
      By Bernoulli's Principle, faster-moving air has lower pressure. The pressure difference between the slower (higher-pressure) air below and faster (lower-pressure) air above creates a net upward force: lift.
    approved: true
  - id: q-physics-fluid-mechanics-0008
    type: classify
    difficulty: hard
    stem: |
      A student calculates the buoyant force on a submerged brass block by using the brass's own density, instead of the water's density. Is this correct?
    choices:
      - text: 'No: Archimedes'' Principle uses the density of the displaced fluid (water), not the density of the submerged object itself.'
        correct: true
      - text: 'Yes: buoyant force always depends on the submerged object''s own density.'
        rationale: |
          You used object density. Archimedes' Principle specifies that buoyant force equals the weight of displaced fluid.
      - text: 'No: buoyant force does not depend on density at all.'
        rationale: |
          You claimed density is irrelevant. Displaced fluid weight calculation requires fluid density.
      - text: 'Yes: as long as the object is denser than the fluid.'
        rationale: |
          You made fluid principles depend on object sinking. Displaced fluid density determines buoyant force regardless of relative density.
    explanation: |
      The buoyant force equals the weight of the displaced fluid, calculated using the fluid's own density and the displaced volume, not any property of the submerged object itself.
    approved: true
  - id: q-physics-fluid-mechanics-0009
    type: classify
    difficulty: hard
    stem: |
      A student assumes a massive steel ship must sink, since steel is much denser than water, while a small pebble would float since it is "so small." Is this reasoning correct?
    choices:
      - text: 'No: floating and sinking depend on overall average density compared to the fluid, not size or mass alone; the ship''s hollow shape gives it a low average density, letting it float, while a small solid steel pebble would sink.'
        correct: true
      - text: 'Yes: larger objects always sink regardless of their shape.'
        rationale: |
          You made floating depend on size. Floating depends on average density ($m/V$), not total size.
      - text: 'No: but only because ships are not really made of steel.'
        rationale: |
          You denied steel construction. Ships are constructed of dense steel, but incorporate large air-filled hollow volumes.
      - text: 'Yes: smaller objects always float regardless of their material.'
        rationale: |
          You assumed small items always float. A small solid steel pebble sinks because its density exceeds water's density.
    explanation: |
      A ship's hollow, air-filled shape gives it a low overall average density, even though its material (steel) is much denser than water. Size and mass alone cannot predict floating or sinking: the object's overall average density relative to the fluid is what matters.
    approved: true
  - id: q-physics-fluid-mechanics-0010
    type: classify
    difficulty: hard
    stem: |
      A student assumes that faster-moving fluid has higher pressure than slower-moving fluid. Is this correct?
    choices:
      - text: "No: Bernoulli's Principle states the opposite: faster-moving fluid has lower pressure, not higher."
        correct: true
      - text: 'Yes: faster-moving fluid always has higher pressure.'
        rationale: |
          You reversed Bernoulli's Law. High fluid velocity corresponds to low static pressure.
      - text: 'No: but only for fluids moving through a narrow pipe.'
        rationale: |
          You restricted Bernoulli's Principle to pipe geometry. Bernoulli's Principle applies to fluid flow in open and closed systems.
      - text: 'Yes: this is exactly what causes airplane lift.'
        rationale: |
          You misapplied wing lift theory. Airplane lift requires lower pressure above the wing, created by faster airflow.
    explanation: |
      Reversing Bernoulli's actual relationship (faster means lower pressure) would incorrectly predict a downward force on an airplane wing instead of the real upward lift force that keeps planes flying.
    approved: true
  - id: q-physics-fluid-mechanics-0011
    type: classify
    difficulty: hard
    stem: |
      A student assumes water pressure is the same at every depth in a swimming pool. Is this correct?
    choices:
      - text: 'No: pressure increases with depth, since deeper water must support the weight of all the water above it.'
        correct: true
      - text: 'Yes: fluid pressure never changes with depth.'
        rationale: |
          You assumed hydrostatic pressure is constant. Hydrostatic pressure increases linearly with depth ($P = \rho g h$).
      - text: 'No: pressure actually decreases with depth.'
        rationale: |
          You inverted depth pressure trend. Pressure increases with depth as overlying fluid weight accumulates.
      - text: 'Yes: pressure only depends on the pool''s total volume, not depth.'
        rationale: |
          You substituted total volume for depth. Fluid pressure depends strictly on depth column height ($h$), not total volume.
    explanation: |
      Pressure in a fluid increases with depth, since fluid deeper down supports the weight of the fluid above it. Treating pressure as constant throughout a container ignores this depth dependence.
    approved: true
  - id: q-physics-fluid-mechanics-0012
    type: simple-quantitative
    difficulty: hard
    stem: |
      An object has a mass of 450 g and a volume of 500 cm³. Find its density, and determine whether it would float or sink in water (density 1.0 g/cm³).
    choices:
      - text: 0.9 g/cm^3; it would float.
        correct: true
      - text: 1.1 g/cm^3; it would sink.
        rationale: |
          You inverted mass and volume division ($\dfrac{500}{450} \approx 1.1$). Density is $\dfrac{450}{500} = 0.9\text{ g/cm}^3$.
      - text: 0.9 g/cm^3; it would sink.
        rationale: |
          You calculated density correctly ($0.9$) but inverted float status. Since $0.9 < 1.0$, the object floats.
      - text: 225 g/cm^3; it would float.
        rationale: |
          You multiplied or miscalculated mass and volume. Calculate density by division $\dfrac{450}{500} = 0.9\text{ g/cm}^3$.
    explanation: |
      $\rho = \dfrac{450}{500} = 0.9$ g/cm³. Since 0.9 is less than water's density (1.0), the object would float.
    approved: true
  - id: q-physics-fluid-mechanics-0013
    type: simple-quantitative
    difficulty: exam
    stem: |
      A block, fully submerged in water, displaces 400 cm³ of water. Water has a density of 1 g/cm³. Find the buoyant force on the block. (Use $g = 9.8 \text{ m/s}^2$.)
    choices:
      - text: 3.92 N
        correct: true
      - text: 400 N
        rationale: |
          You used displaced volume directly as force in Newtons. Convert $400\text{ cm}^3$ to $0.4\text{ kg}$ and multiply by $g = 9.8\text{ m/s}^2$.
      - text: 39.2 N
        rationale: |
          You made a decimal conversion error ($400\text{ g} = 0.4\text{ kg}$). $F_b = 0.4 \times 9.8 = 3.92\text{ N}$.
      - text: 0.4 N
        rationale: |
          You reported displaced water mass in kilograms ($0.4\text{ kg}$) without multiplying by $g = 9.8\text{ m/s}^2$.
    explanation: |
      Mass of displaced water: $(1)(400) = 400$ g $= 0.4$ kg. Weight (buoyant force): $W = mg = (0.4)(9.8) = 3.92$ N.
    approved: true
  - id: q-physics-fluid-mechanics-0014
    type: predict-outcome
    difficulty: exam
    stem: |
      A block of solid steel sinks in water, but a steel ship of much greater total mass floats. What explains this apparent contradiction?
    choices:
      - text: The ship's hollow, air-filled shape gives it a much lower overall average density than solid steel, making its average density less than water's, unlike the solid block.
        correct: true
      - text: Ships are not actually made of steel, unlike the solid block.
        rationale: |
          You denied steel ship construction. Modern ships use massive steel hulls engineered with hollow interior spaces.
      - text: Water becomes less dense around large objects.
        rationale: |
          You claimed water density changes around large items. Water density remains constant ($1.0\text{ g/cm}^3$).
      - text: The ship's greater mass alone is what allows it to float.
        rationale: |
          You attributed floating to mass magnitude. Heavy objects sink unless shaped to encompass sufficient volume to lower average density.
    explanation: |
      Floating depends on overall average density, not the density of the raw material alone. The ship's hollow shape spreads its steel mass across a much larger volume, lowering its average density below water's, even though solid steel itself is much denser than water.
    approved: true
