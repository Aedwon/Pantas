meta:
  subject: "science"
  topic: "physics"
  subtopic: "fluid-mechanics"
  exams: ["upcat", "dlsucet", "ustet", "dost-sei"]
questions:
  - id: q-physics-fluid-mechanics-0001
    type: "simple-quantitative"
    difficulty: "easy"
    stem: |
      An object has a mass of 300 g and a volume of 150 cm³. Find its density. (Use $\rho = \dfrac{m}{V}$.)
    choices:
      - text: "2 g/cm^3"
        correct: true
      - text: "0.5 g/cm^3"
        rationale: |
          This computes $150/300$, volume divided by mass. It uses the right values in reverse order. Check the meaning of mass per unit volume.
      - text: "450 g/cm^3"
        rationale: |
          This adds $300$ and $150$. Both measurements describe the object. Check whether their units permit addition.
      - text: "150 g/cm^3"
        rationale: |
          This subtracts $150$ from $300$. Finding a difference can seem useful. Check that density is a ratio, not a difference.
    explanation: |
      Density is mass divided by volume. Thus $\rho=\dfrac{300}{150}=2\,\mathrm{g/cm^3}$.
    approved: true

  - id: q-physics-fluid-mechanics-0002
    type: "classify"
    difficulty: "easy"
    stem: |
      A rigid object of average density $0.8\,\mathrm{g/cm^3}$ is released fully under water of density $1.0\,\mathrm{g/cm^3}$. No other forces act. What is its initial motion?
    choices:
      - text: "It rises."
        correct: true
      - text: "It sinks because its density is lower."
        rationale: |
          This reverses the density comparison. Density is the relevant property. Check whether displaced water weighs more than the object.
      - text: "It stays suspended because any submerged object is balanced."
        rationale: |
          This assumes immersion guarantees equilibrium. Buoyancy does act upward. Check whether buoyancy equals weight.
      - text: "It remains at the same depth because volume is constant."
        rationale: |
          This confuses fixed volume with fixed position. The object is rigid. Check the net vertical force.
    explanation: |
      When fully submerged, it displaces its full volume of denser water. That water weighs more than the object. Buoyant force exceeds weight, so it rises.
    approved: true

  - id: q-physics-fluid-mechanics-0003
    type: "predict-outcome"
    difficulty: "medium"
    stem: |
      A freely floating rigid object is moved from water of density $1.0\,\mathrm{g/cm^3}$ to a liquid of density $0.6\,\mathrm{g/cm^3}$. Its average density is $0.8\,\mathrm{g/cm^3}$. What happens without other forces?
    choices:
      - text: "It sinks in the new liquid."
        correct: true
      - text: "It floats with less of its volume submerged."
        rationale: |
          This uses the effect of a denser fluid for a less dense one. Changing liquids changes support. Check the direction of the density change.
      - text: "It stays suspended anywhere in the new liquid."
        rationale: |
          This assumes the densities match. Both are below water’s density. Check their actual comparison.
      - text: "It keeps exactly the same submerged volume in both liquids."
        rationale: |
          This assumes displacement depends only on the object. Its weight is unchanged. Check the weight of each unit volume of liquid.
    explanation: |
      The object is denser than the new liquid. Even full displacement cannot provide a buoyant force equal to its weight. It sinks.
    approved: true

  - id: q-physics-fluid-mechanics-0004
    type: "simple-quantitative"
    difficulty: "medium"
    stem: |
      A solid block, fully submerged in water, displaces 250 cm³ of water. Water has a density of 1 g/cm³. Find the buoyant force on the block. (Use $g = 9.8 \text{ m/s}^2$.)
    choices:
      - text: "2.45 N"
        correct: true
      - text: "250 N"
        rationale: |
          This treats $250\,\mathrm{cm^3}$ as a force. The displaced volume is prominent. Check that a force requires mass times acceleration.
      - text: "24.5 N"
        rationale: |
          This converts $250\,\mathrm g$ to $2.5\,\mathrm{kg}$. A decimal shift is needed, so one place can be missed. Check that grams become kilograms by dividing by $1000$.
      - text: "0.25 N"
        rationale: |
          This reports the mass as a force without multiplying by $g$. The converted mass is part of the calculation. Check the difference between kilograms and newtons.
    explanation: |
      The displaced water has mass $(1)(250)=250\,\mathrm g=0.25\,\mathrm{kg}$. Buoyant force equals its weight: $F_B=(0.25)(9.8)=2.45\,\mathrm N$.
    approved: true

  - id: q-physics-fluid-mechanics-0005
    type: "identify"
    difficulty: "medium"
    stem: |
      What is the formula for pressure?
    choices:
      - text: "$P=F_\\perp/A$"
        correct: true
      - text: "$P=F_\\perp A$"
        rationale: |
          This multiplies force by area. More area can seem to mean more pressure. Check what per unit area means.
      - text: "$P=m/V$"
        rationale: |
          This uses the density formula. Both density and pressure describe fluids. Check mass per volume versus force per area.
      - text: "$P=mg$"
        rationale: |
          This uses the weight formula. Weight can supply a force. Check the area term needed for pressure.
    explanation: |
      Pressure is normal force per unit area: $P=\dfrac{F_\perp}{A}$. A given force spread over more area produces less pressure.
    approved: true

  - id: q-physics-fluid-mechanics-0008
    type: "classify"
    difficulty: "hard"
    stem: |
      A student calculates the buoyant force on a submerged brass block by using the brass's own density, instead of the water's density. Is this correct?
    choices:
      - text: "No, the displaced water’s density is used."
        correct: true
      - text: "Yes: buoyant force always depends on the submerged object's own density."
        rationale: |
          This substitutes object density for fluid density. The brass block is the object being studied. Check whose displaced weight defines buoyancy.
      - text: "No: buoyant force does not depend on density at all."
        rationale: |
          This removes density entirely. Volume is prominent in displacement. Check how displaced volume is converted into mass.
      - text: "Yes: as long as the object is denser than the fluid."
        rationale: |
          This makes the fluid rule depend on whether the object sinks. Density comparisons predict sinking. Check the source of buoyant force for any immersed object.
    explanation: |
      Buoyant force is the weight of displaced water. Its calculation uses water’s density and the volume displaced: $F_B=\rho_{\mathrm{water}}gV_{\mathrm{displaced}}$.
    approved: true

  - id: q-physics-fluid-mechanics-0009
    type: "classify"
    difficulty: "hard"
    stem: |
      A student argues that object size alone decides whether it floats. Which property is needed for the simple free-immersion comparison?
    choices:
      - text: "Average density"
        correct: true
      - text: "Total mass"
        rationale: |
          This uses heaviness alone. Heavy objects often sink in everyday experience. Check how mass is spread over the whole volume.
      - text: "Surface area"
        rationale: |
          This uses visible contact area alone. Wide objects can seem easier to support. Check the weight and displaced-fluid volume.
      - text: "Longest dimension"
        rationale: |
          This turns size into a floating rule. Large objects look heavy. Check a mass-to-volume ratio rather than one length.
    explanation: |
      Average density is total mass divided by total volume. Comparing it with fluid density shows whether displaced fluid can support the object under the simple stated model.
    approved: true

  - id: q-physics-fluid-mechanics-0011
    type: "classify"
    difficulty: "hard"
    stem: |
      A student assumes water pressure is the same at every depth in a swimming pool. Is this correct?
    choices:
      - text: "No, pressure increases with depth."
        correct: true
      - text: "Yes: fluid pressure never changes with depth."
        rationale: |
          This confuses equal directional pressure at a point with equal pressure at all depths. Both involve fluid pressure. Check location separately from direction.
      - text: "No: pressure actually decreases with depth."
        rationale: |
          This reverses the depth trend. Distance from the surface changes. Check the added weight of the water above.
      - text: "Yes: pressure only depends on the pool's total volume, not depth."
        rationale: |
          This uses total pool volume instead of local depth. A larger pool holds more water. Check the depth term in the hydrostatic relation.
    explanation: |
      For water at rest, $P=P_0+\rho gh$. Greater depth means more overlying water and a larger $\rho gh$ term. Pressure therefore increases with depth.
    approved: true

  - id: q-physics-fluid-mechanics-0012
    type: "simple-quantitative"
    difficulty: "hard"
    stem: |
      An object has a mass of 450 g and a volume of 500 cm³. Find its density, and determine whether it would float or sink in water (density 1.0 g/cm³).
      Assume a rigid object placed freely, with no extra forces or trapped bubbles.
    choices:
      - text: "0.9 g/cm^3; it would float."
        correct: true
      - text: "1.1 g/cm^3; it would sink."
        rationale: |
          This reverses the ratio to $500/450$. Both numbers belong in density. Check which is mass and which is volume.
      - text: "0.9 g/cm^3; it would sink."
        rationale: |
          This gets density but reverses the floating rule. Greater fluid density can sound like stronger sinking. Check whether displaced water can support the object before full immersion.
      - text: "$0.0009\\,\\mathrm{g/cm^3}$; it would float."
        rationale: |
          This treats $450\,\mathrm g$ as $0.45\,\mathrm g$ before dividing by $500\,\mathrm{cm^3}$. A conversion may seem needed. Check that both original units already match the requested density.
    explanation: |
      The average density is $\rho=\dfrac{450}{500}=0.9\,\mathrm{g/cm^3}$. It is below water’s $1.0\,\mathrm{g/cm^3}$. Under the stated conditions the object floats partly submerged.
    approved: true

  - id: q-physics-fluid-mechanics-0013
    type: "predict-outcome"
    difficulty: "exam"
    stem: |
      A rigid fully submerged block is lowered farther into a constant-density liquid. Gravity is unchanged. How does its buoyant force change?
    choices:
      - text: "It stays the same."
        correct: true
      - text: "It increases because pressure is higher at every point."
        rationale: |
          This uses absolute pressure instead of the pressure difference across the object. Deeper pressure is higher. Check unchanged displaced volume.
      - text: "It decreases because the surface is farther away."
        rationale: |
          This makes buoyancy weaken with distance from the surface. Surface position is noticeable. Check the displaced-fluid weight.
      - text: "It becomes equal to the block’s weight at every depth."
        rationale: |
          This assumes full immersion guarantees equilibrium. Buoyancy opposes weight. Check whether displaced-fluid weight matches object weight.
    explanation: |
      Archimedes’ principle gives $F_B=\rho_{\mathrm{fluid}}gV_{\mathrm{displaced}}$. Density, gravity, and displaced volume are unchanged. The buoyant force stays the same.
    approved: true

  - id: q-physics-fluid-mechanics-0014
    type: "predict-outcome"
    difficulty: "exam"
    stem: |
      Water enters a hollow steel ship while its outer shape remains unchanged. How does flooding affect its ability to float?
    choices:
      - text: "It adds mass and can make the ship sink."
        correct: true
      - text: "It lowers average density because water is lighter than steel."
        rationale: |
          This uses material density instead of total mass over exterior volume. Water is less dense than steel. Check that entering water still adds mass.
      - text: "It guarantees more buoyancy without deeper immersion."
        rationale: |
          This treats internal water as additional external displacement. Both involve water volume. Check which water the hull actually displaces.
      - text: "It makes no difference because the hull is still steel."
        rationale: |
          This considers only the hull’s material. Its steel remains unchanged. Check the total mass the buoyant force must support.
    explanation: |
      Flooding increases the ship’s total mass. Its weight rises, so it must displace more water to remain balanced. If the hull cannot provide enough displacement, the ship sinks.
    approved: true

  - id: q-physics-fluid-mechanics-0015
    approved: false
    type: "identify"
    difficulty: "easy"
    stem: |
      Which pair consists entirely of fluids?
    choices:
      - text: "Water and air"
        correct: true
      - text: "Ice and liquid water"
        rationale: |
          This groups all forms of water as fluids. Ice and liquid share the same substance. Check whether each flows as a fluid.
      - text: "Steel and air"
        rationale: |
          This includes a rigid solid with a gas. Both can transmit forces. Check whether each flows.
      - text: "Rock and ice"
        rationale: |
          This groups natural materials without checking state. Both occur in Earth systems. Check whether they are rigid solids here.
    explanation: |
      Liquids and gases are fluids because they can flow. Water is a liquid and air is a gas.

  - id: q-physics-fluid-mechanics-0016
    approved: false
    type: "simple-quantitative"
    difficulty: "medium"
    stem: |
      A perpendicular force of $600\,\mathrm N$ acts over $0.20\,\mathrm{m^2}$. What is the pressure?
    choices:
      - text: "$3000\\,\\mathrm{Pa}$"
        correct: true
      - text: "$120\\,\\mathrm{Pa}$"
        rationale: |
          This multiplies $600$ by $0.20$. Both are given quantities. Check that pressure is force per area.
      - text: "$15000\\,\\mathrm{Pa}$"
        rationale: |
          This squares the area value again before dividing. Area is already given in square meters. Check that the pressure formula uses the stated area only once.
      - text: "$300\\,\\mathrm{Pa}$"
        rationale: |
          This divides by $2.0$ instead of $0.20$. A decimal place was lost. Check the area as written.
    explanation: |
      Pressure is $P=\dfrac FA=\dfrac{600}{0.20}=3000\,\mathrm{N/m^2}=3000\,\mathrm{Pa}$.

  - id: q-physics-fluid-mechanics-0017
    approved: false
    type: "simple-quantitative"
    difficulty: "hard"
    stem: |
      Water of density $1000\,\mathrm{kg/m^3}$ is at rest. Use $g=10\,\mathrm{m/s^2}$. How much greater is pressure at $5\,\mathrm m$ depth than at $2\,\mathrm m$ depth?
    choices:
      - text: "$30000\\,\\mathrm{Pa}$"
        correct: true
      - text: "$50000\\,\\mathrm{Pa}$"
        rationale: |
          This uses the deeper depth alone. The lower point is the main target. Check that the question asks for a difference.
      - text: "$70000\\,\\mathrm{Pa}$"
        rationale: |
          This adds the two depths. Both measurements are present. Check the vertical separation between points.
      - text: "$3000\\,\\mathrm{Pa}$"
        rationale: |
          This omits gravitational acceleration. Density times depth looks almost complete. Check the factors in the hydrostatic pressure term.
    explanation: |
      The depth difference is $5-2=3\,\mathrm m$. The pressure difference is $\rho g\Delta h=(1000)(10)(3)=30000\,\mathrm{Pa}$.

  - id: q-physics-fluid-mechanics-0018
    approved: false
    type: "compare-contrast"
    difficulty: "hard"
    stem: |
      Two fully submerged objects have equal external volume but different masses. They are in the same constant-density liquid under the same gravity. How do their buoyant forces compare?
    choices:
      - text: "They are equal."
        correct: true
      - text: "The heavier object receives more buoyant force."
        rationale: |
          This uses object weight to set buoyancy. Floating objects do balance their weight. Check displaced fluid for these fully submerged objects.
      - text: "The lighter object receives more buoyant force."
        rationale: |
          This assumes greater upward motion means greater buoyancy. Lighter objects may rise. Check net force separately from buoyant force.
      - text: "Their buoyant forces equal their respective weights."
        rationale: |
          This applies floating equilibrium to every immersed object. Buoyancy points upward. Check whether either object is in equilibrium.
    explanation: |
      Equal fully submerged volumes displace equal volumes of the same liquid. The displaced fluid weights are equal. Their buoyant forces are equal.

  - id: q-physics-fluid-mechanics-0019
    approved: false
    type: "structure-function"
    difficulty: "hard"
    stem: |
      What feature of fluid pressure produces buoyancy on a submerged object?
    choices:
      - text: "Higher pressure on lower surfaces"
        correct: true
      - text: "Equal pressure on every surface at all depths"
        rationale: |
          This confuses all-direction action at a point with uniform pressure everywhere. Fluids press in all directions. Check pressure at different depths.
      - text: "A downward pull exerted by the free surface"
        rationale: |
          This imagines the visible surface pulling the object downward. Water above the object may suggest a downward action. Check that buoyancy is upward and comes from pressure increasing with depth.
      - text: "Gravity acting upward on the submerged object"
        rationale: |
          This reverses the direction of weight. Buoyancy acts upward. Check which force comes from gravity and which from the fluid.
    explanation: |
      Fluid pressure increases with depth. The lower surfaces receive greater pressure than higher surfaces. The resulting pressure forces combine into an upward buoyant force.

  - id: q-physics-fluid-mechanics-0021
    type: "predict-outcome"
    difficulty: "medium"
    stem: |
      A uniform solid block has a density of 600 kg/m^3. It floats at rest in water. How much of the block's volume is below the water surface?
    choices:
      - text: "60% of its volume"
        correct: true
      - text: "40% of its volume"
        rationale: |
          This gives the part above the surface. The two parts add to the whole. Check which part the question asks about.
      - text: "50% of its volume"
        rationale: |
          This assumes a floating block sits half in. Floating blocks do sit partly under. Check that the fraction below is $\dfrac{\rho_{object}}{\rho_{fluid}}$.
      - text: "100% of its volume"
        rationale: |
          This treats a floating block as fully under. A block less dense than water rises until it floats. Check that the buoyant force equals the weight with less than the whole volume under.
    explanation: |
      A floating block has a buoyant force equal to its weight. The fraction below the surface is $\dfrac{\rho_{object}}{\rho_{fluid}}=\dfrac{600}{1000}=0.60$. So $60\%$ of the block is below the surface.
    approved: false

  - id: q-physics-fluid-mechanics-0022
    type: "simple-quantitative"
    difficulty: "medium"
    stem: |
      A hydraulic lift has a small piston of area 10 cm^2 and a large piston of area 200 cm^2. A force of 50 N pushes on the small piston. Neglect friction, and assume both pistons are at the same height. What force acts on the large piston?
    choices:
      - text: "1000 N"
        correct: true
      - text: "2.5 N"
        rationale: |
          This multiplies by the area ratio the wrong way. The small piston is the input. Check that the large piston gives the larger force.
      - text: "250 N"
        rationale: |
          This adds the input force and the large area. Numbers with different units cannot be added. Check that the pressure is the same at both pistons.
      - text: "500 N"
        rationale: |
          This multiplies the force by the small area. The area is in the problem, so it seems to be used. Check that the equation uses the ratio of the two areas.
    explanation: |
      The pressure change is the same at both pistons. $F_2=F_1\dfrac{A_2}{A_1}=50\times\dfrac{200}{10}=1000$ N.
    approved: false

  - id: q-physics-fluid-mechanics-0023
    type: "simple-quantitative"
    difficulty: "hard"
    stem: |
      A diver is 8.0 m below the surface of a freshwater lake that is open to the air. Atmospheric pressure is $1.01\times10^5\ \mathrm{Pa}$, water density is $1000\ \mathrm{kg/m^3}$, and $g=9.8\ \mathrm{m/s^2}$. What is the absolute pressure at the diver?
    choices:
      - text: "1.79 × 10^5 Pa"
        correct: true
      - text: "7.84 × 10^4 Pa"
        rationale: |
          This is the gauge pressure, $\rho gh$. The depth term is the main part of the answer. Check that the question asks for the absolute pressure.
      - text: "1.01 × 10^5 Pa"
        rationale: |
          This is the pressure at the surface. The atmosphere is part of the answer. Check that pressure increases with depth.
      - text: "8.08 × 10^5 Pa"
        rationale: |
          This multiplies atmospheric pressure by the depth. The depth is in the question, so it seems to scale the pressure. Check that the formula adds $\rho gh$ to $P_0$.
    explanation: |
      Absolute pressure is $P=P_0+\rho gh$. First, $\rho gh=(1000)(9.8)(8.0)=7.84\times10^4$ Pa. Then $P=1.01\times10^5+0.784\times10^5\approx1.79\times10^5$ Pa.
    approved: false

  - id: q-physics-fluid-mechanics-0024
    type: "simple-quantitative"
    difficulty: "hard"
    stem: |
      A solid object has a mass of 5.0 kg and a volume of $2.0\times10^{-3}\ \mathrm{m^3}$. It hangs from a spring scale and is fully submerged in water of density $1000\ \mathrm{kg/m^3}$. Use $g=9.8\ \mathrm{m/s^2}$. What does the scale read?
    choices:
      - text: "29.4 N"
        correct: true
      - text: "19.6 N"
        rationale: |
          This is the buoyant force alone. The buoyant force is part of the problem. Check that the scale reads the weight minus the buoyant force.
      - text: "49 N"
        rationale: |
          This is the weight in air. The scale holds the object, so it seems to read the weight. Check that the water pushes the object up.
      - text: "68.6 N"
        rationale: |
          This adds the buoyant force to the weight. The water seems to add a push on the object. Check that the buoyant force acts upward and reduces the reading.
    explanation: |
      The weight in air is $mg=5.0\times9.8=49$ N. The buoyant force is $\rho_{fluid}gV=(1000)(9.8)(2.0\times10^{-3})=19.6$ N. The scale reads $W-F_B=49-19.6=29.4$ N.
    approved: false
