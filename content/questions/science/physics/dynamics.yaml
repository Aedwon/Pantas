meta:
  subject: "science"
  topic: "physics"
  subtopic: "dynamics"
  exams: ["upcat", "dlsucet", "ustet", "dost-sei"]
questions:
  - id: q-physics-dynamics-0001
    type: "simple-quantitative"
    difficulty: "easy"
    stem: |
      A 5 kg object experiences a net force of 20 N. Find its acceleration. (Use $F_{net} = ma$.)
    choices:
      - text: "4 m/s^2"
        correct: true
      - text: "100 m/s^2"
        rationale: |
          This multiplies $20$ by $5$. Multiplication appears in $F=ma$, so it can seem natural. Check which quantity is unknown before rearranging.
      - text: "15 m/s^2"
        rationale: |
          This subtracts $5$ from $20$. Subtraction looks like a way to find what remains. Check that mass and force have different units and cannot be subtracted.
      - text: "0.25 m/s^2"
        rationale: |
          This divides mass by force. Both values belong in the calculation, so the order can be missed. Check that acceleration has units of force divided by mass.
    explanation: |
      Acceleration is net force divided by mass: $a=\dfrac{F_{\mathrm{net}}}{m}$. Substitute the values: $a=\dfrac{20}{5}=4\,\mathrm{m/s^2}$.
    approved: true

  - id: q-physics-dynamics-0002
    type: "simple-quantitative"
    difficulty: "medium"
    stem: |
      An 8 kg object accelerates at 3 m/s². Find the net force acting on it.
    choices:
      - text: "24 N"
        correct: true
      - text: "11 N"
        rationale: |
          This adds $8$ and $3$. Combining the given values can look useful. Check the multiplication in $F=ma$.
      - text: "2.67 N"
        rationale: |
          This divides $8$ by $3$. Division is used when finding mass, so it looks familiar. Check which quantity the question asks for.
      - text: "5 N"
        rationale: |
          This subtracts $3$ from $8$. Subtraction can look like a net-force step. Check whether the given values are two forces.
    explanation: |
      Net force equals mass times acceleration: $F=ma$. Multiply $8$ by $3$: $F=24\,\mathrm N$.
    approved: true

  - id: q-physics-dynamics-0003
    type: "simple-quantitative"
    difficulty: "medium"
    stem: |
      A net force of 50 N causes an object to accelerate at 2 m/s². Find the object's mass.
    choices:
      - text: "25 kg"
        correct: true
      - text: "100 kg"
        rationale: |
          This multiplies force by acceleration. The product form of the law looks familiar. Check how to isolate mass.
      - text: "48 kg"
        rationale: |
          This subtracts $2$ from $50$. Subtraction can suggest a remaining quantity. Check that force and acceleration cannot be subtracted.
      - text: "52 kg"
        rationale: |
          This adds $50$ and $2$. Both numbers are given, so combining them looks useful. Check the units before adding.
    explanation: |
      Rearrange $F=ma$ to get $m=\dfrac{F}{a}$. Then $m=\dfrac{50}{2}=25\,\mathrm{kg}$.
    approved: true

  - id: q-physics-dynamics-0004
    type: "identify"
    difficulty: "easy"
    stem: |
      In an inertial frame, which law states that velocity stays constant when the net external force is zero?
    choices:
      - text: "The First Law"
        correct: true
      - text: "The Second Law"
        rationale: |
          This selects the acceleration law. It also connects force and motion, so it sounds relevant. Check whether the statement describes unchanged velocity or a calculated acceleration.
      - text: "The Third Law"
        rationale: |
          This selects the interaction-pair law. It mentions forces, so the wording can sound familiar. Check whether two different objects are involved.
      - text: "The Law of Universal Gravitation"
        rationale: |
          This selects gravitational attraction. Gravity is a common force, so it can seem relevant. Check whether the statement applies to all forces or only gravity.
    explanation: |
      The first law describes inertia. In an inertial frame, zero net force means constant velocity, including rest.
    approved: true

  - id: q-physics-dynamics-0005
    type: "identify"
    difficulty: "easy"
    stem: |
      Which of Newton's laws states that for every action force, there is an equal and opposite reaction force?
    choices:
      - text: "The Third Law"
        correct: true
      - text: "The First Law"
        rationale: |
          This confuses inertia with an interaction pair. Both are laws of motion. Check whether the statement is about one object or two interacting objects.
      - text: "The Second Law"
        rationale: |
          This confuses net force with paired forces. Both involve force. Check whether the forces act on the same object or different objects.
      - text: "The Law of Conservation of Momentum"
        rationale: |
          This selects a conservation principle instead of the stated law. Momentum conservation is related to interactions. Check which law directly names the two forces.
    explanation: |
      The third law describes one interaction between two objects. The forces are equal in strength, opposite in direction, and act on different objects.
    approved: true

  - id: q-physics-dynamics-0006
    type: "classify"
    difficulty: "medium"
    stem: |
      A book rests on a table. According to Newton's Third Law, which pair of forces are true action-reaction partners?
    choices:
      - text: "Book on table and table on book"
        correct: true
      - text: "The book's weight and the normal force, both acting on the book."
        rationale: |
          This pairs forces on the same book. They balance at rest, so their equal size looks convincing. Check that third-law partners act on different objects.
      - text: "The table's weight and the floor's normal force on the table."
        rationale: |
          This pairs forces on the same table. They can seem related through support. Check the object receiving each force.
      - text: "There is no true action-reaction pair in this scenario."
        rationale: |
          This assumes an interaction at rest has no force pair. Nothing moves, so the forces may seem absent. Check whether the book and table still press on each other.
    explanation: |
      The book pushes down on the table. The table pushes up on the book with an equally strong force. These are the two sides of the same contact interaction.
    approved: true

  - id: q-physics-dynamics-0008
    type: "classify"
    difficulty: "hard"
    stem: |
      A student says the weight and normal force acting on a resting book form a Newton's Third Law action-reaction pair, since they are equal and opposite. Is this correct?
    choices:
      - text: "No, both forces act on the book."
        correct: true
      - text: "Yes: any two equal and opposite forces are automatically a Third Law pair."
        rationale: |
          This treats equal and opposite forces as sufficient. Balanced forces have those features too. Check that the forces act on different objects.
      - text: "No: weight and normal force are never equal in any situation."
        rationale: |
          This rejects the observed balance. The forces have different sources, which can suggest unequal sizes. Check the book’s zero vertical acceleration.
      - text: "Yes: but only when the book is accelerating."
        rationale: |
          This ties an interaction pair to acceleration. Force is linked to acceleration, so that sounds plausible. Check which objects receive the forces.
    explanation: |
      These forces both act on the book. They balance its vertical motion at rest. A third-law pair requires two forces from one interaction acting on different objects.
    approved: true

  - id: q-physics-dynamics-0009
    type: "classify"
    difficulty: "hard"
    stem: |
      A student assumes that doubling an object's mass, while keeping the net force the same, will double its acceleration. Is this correct?
    choices:
      - text: "No, the acceleration is halved."
        correct: true
      - text: "Yes: doubling the mass always doubles the acceleration for the same force."
        rationale: |
          This makes acceleration grow with mass. The product $ma$ can suggest a direct link. Check what stays fixed before comparing.
      - text: "No: doubling the mass has no effect on acceleration at all."
        rationale: |
          This ignores mass in the force law. The same force may seem to guarantee the same motion. Check the denominator in $a=F/m$.
      - text: "No, the acceleration is quartered."
        rationale: |
          This applies an inverse-square relation to mass. Some other physics laws use squares. Check the first power of mass in Newton’s second law.
    explanation: |
      For fixed net force, $a=\dfrac{F}{m}$. Replacing $m$ with $2m$ gives $a_{\mathrm{new}}=\dfrac{F}{2m}=\dfrac{a}{2}$. The acceleration is halved.
    approved: true

  - id: q-physics-dynamics-0011
    type: "predict-outcome"
    difficulty: "hard"
    stem: |
      A passenger stands on a horizontal elevator floor. The elevator accelerates upward. How does the normal force compare with the passenger’s weight?
    choices:
      - text: "It is greater than the weight."
        correct: true
      - text: "It equals the weight during any elevator motion."
        rationale: |
          This assumes every horizontal support gives the resting result. The floor remains level. Check whether vertical acceleration is zero.
      - text: "It is less than the weight during upward acceleration."
        rationale: |
          This reverses the direction of the net force. Upward motion and downward gravity compete. Check which force must be larger for upward acceleration.
      - text: "It is zero because the elevator is moving."
        rationale: |
          This removes support during motion. Weightlessness is associated with some falling motion. Check whether the passenger is in free fall.
    explanation: |
      Upward acceleration requires an upward net force. Thus $N-mg=ma>0$. The floor must push with a force greater than the passenger’s weight.
    approved: true

  - id: q-physics-dynamics-0012
    type: "identify"
    difficulty: "easy"
    stem: |
      What is the formula for an object's weight?
    choices:
      - text: "$W = mg$"
        correct: true
      - text: "$W = ma$"
        rationale: |
          This uses the object’s motion acceleration for gravity. Both are accelerations, so their roles can be mixed up. Check that weight uses local gravitational acceleration.
      - text: "$W = m/g$"
        rationale: |
          This divides mass by gravity. Division is common when rearranging formulas. Check that greater gravitational acceleration gives greater weight.
      - text: "$W = g/m$"
        rationale: |
          This divides gravity by mass. Both values are relevant, so their order may seem enough. Check that increasing mass should increase weight.
    explanation: |
      Near Earth, weight is mass times gravitational acceleration: $W=mg$. It is a gravitational force directed toward Earth.
    approved: true

  - id: q-physics-dynamics-0013
    type: "simple-quantitative"
    difficulty: "hard"
    stem: |
      A 10 kg object slides on a horizontal surface. A horizontal 50 N push acts in the direction of its motion, while friction opposes the motion with a force of 20 N. Find the object's acceleration.
    choices:
      - text: "3 m/s^2"
        correct: true
      - text: "5 m/s^2"
        rationale: |
          This uses the push alone. The push is the larger force, so it can seem to set the motion. Check every horizontal force before dividing by mass.
      - text: "7 m/s^2"
        rationale: |
          This adds opposing forces. Adding all magnitudes may look like finding a total. Check the direction of each force.
      - text: "2 m/s^2"
        rationale: |
          This uses friction alone. Friction causes acceleration too, so it seems relevant. Check the combined force rather than one force.
    explanation: |
      First find the net horizontal force: $50-20=30\,\mathrm N$. Then divide by mass: $a=\dfrac{30}{10}=3\,\mathrm{m/s^2}$.
    approved: true

  - id: q-physics-dynamics-0014
    type: "classify"
    difficulty: "medium"
    stem: |
      A box sits at rest on a flat, horizontal table, with no other forces applied. Which forces should appear on its free body diagram?
    choices:
      - text: "Downward weight and upward normal force"
        correct: true
      - text: "Only weight, since the table does not exert any force."
        rationale: |
          This leaves out the table’s contact force. Gravity is visible in the formula, so it can dominate attention. Check what prevents downward acceleration.
      - text: "Only normal force, since the box has no weight while resting."
        rationale: |
          This leaves out gravity at rest. No motion can seem to mean no gravitational effect. Check whether mass is still present in Earth’s field.
      - text: "Weight, normal force, and friction, even though the box is not sliding or being pushed."
        rationale: |
          This adds friction without a force trying to slide the box. Contact can suggest friction must act. Check whether horizontal force balance needs it.
    explanation: |
      Earth pulls the box down through gravity. The table pushes it up through contact. At rest, the upward normal force equals the downward weight.
    approved: true

  - id: q-physics-dynamics-0018
    approved: false
    type: "compare-contrast"
    difficulty: "hard"
    stem: |
      Which statement distinguishes a balanced-force pair from a third-law pair?
    choices:
      - text: "Balanced forces act on one object; third-law partners act on two."
        correct: true
      - text: "Both pairs always act on the same object at rest."
        rationale: |
          This uses equilibrium to classify every pair. Equal forces can suggest rest. Check the object receiving each force.
      - text: "Only third-law pairs can have equal and opposite forces."
        rationale: |
          This excludes equal forces in equilibrium. The third-law wording emphasizes equality. Check the resting-book force balance.
      - text: "Third-law partners act one after the other during an interaction."
        rationale: |
          This reads action and reaction as a time sequence. The names suggest one follows the other. Check that the interaction forces are simultaneous.
    explanation: |
      Balanced forces cancel on one object. Third-law partners are equal and opposite sides of an interaction between two objects.

  - id: q-physics-dynamics-0019
    approved: false
    type: "structure-function"
    difficulty: "hard"
    stem: |
      Why does a free-body diagram of a swimmer omit the force the swimmer exerts on the water?
    choices:
      - text: "It shows forces on the swimmer."
        correct: true
      - text: "The swimmer exerts no force while moving at steady speed."
        rationale: |
          This confuses zero net force with no interaction. Steady speed can make it seem that no forces are acting. Check individual forces separately from their total.
      - text: "The force on the water is smaller than the force on the swimmer."
        rationale: |
          This assumes the moving object receives the stronger partner. Motion can seem to require an unequal pair. Check Newton’s third law.
      - text: "The force on the water cancels the force on the swimmer in that diagram."
        rationale: |
          This cancels forces acting on different objects. The pair is equal and opposite. Check the chosen object’s boundary.
    explanation: |
      A free-body diagram includes external forces acting on the chosen object. Here the chosen object is the swimmer. The swimmer’s force on water acts on the water.

  - id: q-physics-dynamics-0021
    type: "simple-quantitative"
    difficulty: "easy"
    stem: |
      A worker pushes a crate across a level floor with a horizontal force of 80 N. The crate moves in a straight line at a constant 1.5 m/s. What is the friction force on the crate?
    choices:
      - text: "80 N, opposite to the motion"
        correct: true
      - text: "0 N, because the crate is not accelerating"
        rationale: |
          This says no acceleration means no force. The net force is zero, but single forces still act. Check that the push and friction cancel.
      - text: "80 N, in the direction of the motion"
        rationale: |
          This gets the size right but the direction wrong. Friction resists sliding. Check which way friction must point to cancel the push.
      - text: "160 N, opposite to the motion"
        rationale: |
          This adds the push and its reaction. The two equal 80 N forces can tempt you to add their sizes. Equal pairs act on different objects. Check that the net force on the crate is zero.
    explanation: |
      The crate moves at a constant velocity, so the net force on it is zero. The push of $80$ N forward must be canceled by friction. Friction is $80$ N backward.
    approved: false

  - id: q-physics-dynamics-0022
    type: "simple-quantitative"
    difficulty: "medium"
    stem: |
      An astronaut has a mass of 70 kg on Earth. On the Moon, $g=1.6\ \mathrm{m/s^2}$. Use $g=9.8\ \mathrm{m/s^2}$ on Earth. What are the astronaut's mass and weight on the Moon?
    choices:
      - text: "70 kg and 112 N"
        correct: true
      - text: "11 kg and 112 N"
        rationale: |
          This treats mass as changing with $g$. Weight changes with place, so mass seems to change. Check that mass is the amount of matter.
      - text: "70 kg and 686 N"
        rationale: |
          This gives the weight on Earth. The mass is right. Check that the weight uses the $g$ of the Moon.
      - text: "70 kg and 44 N"
        rationale: |
          This divides the mass by $g$ instead of multiplying. Dividing gives a smaller number, which seems fair for the Moon. Check the formula $W=mg$.
    explanation: |
      Mass is the same everywhere, so the mass is $70$ kg. Weight uses the Moon's $g$. $W=mg=70\times1.6=112$ N.
    approved: false

  - id: q-physics-dynamics-0023
    type: "simple-quantitative"
    difficulty: "medium"
    stem: |
      A 4.0 kg book rests on a level table. A hand pushes straight down on the book with a force of 20 N, and the book stays at rest. Use $g=9.8\ \mathrm{m/s^2}$. What is the normal force on the book?
    choices:
      - text: "59.2 N"
        correct: true
      - text: "39.2 N"
        rationale: |
          This equals the weight alone. On a level table the normal force often equals the weight. Check that the downward push of the hand also needs a balancing force.
      - text: "19.2 N"
        rationale: |
          This subtracts the push from the weight. That is the case for a pull upward. Check the direction of the hand's push.
      - text: "20 N"
        rationale: |
          This copies the force of the hand. The hand is the new force in the problem. Check that the table also supports the weight of the book.
    explanation: |
      The book is at rest, so the net force is zero. Take up as positive. $N-mg-20=0$. The weight is $mg=4.0\times9.8=39.2$ N. So $N=39.2+20=59.2$ N.
    approved: false

  - id: q-physics-dynamics-0024
    type: "simple-quantitative"
    difficulty: "hard"
    stem: |
      A 2.0 kg box rests on a smooth, level table. A hand pulls it with a 10 N force at $60^\circ$ above the horizontal. Use $\cos60^\circ=0.50$ and $\sin60^\circ=0.866$. What is the box's acceleration along the table?
    choices:
      - text: "2.5 m/s^2"
        correct: true
      - text: "5.0 m/s^2"
        rationale: |
          This divides the full pull by the mass. The pull is the force in the problem. Check that only the part along the table speeds up the box.
      - text: "4.3 m/s^2"
        rationale: |
          This uses the sine part of the pull, which points upward. Sine and cosine are easy to swap. Check which part of the pull lies along the table.
      - text: "0.25 m/s^2"
        rationale: |
          This divides $\cos60^\circ$ by the mass without multiplying by the force. The angle part looks like the whole answer. Check that the $10$ N force is multiplied by $\cos60^\circ$ before dividing by the mass.
    explanation: |
      Only the part of the pull along the table accelerates the box. That part is $10\cos60^\circ=10\times0.50=5.0$ N. Then $a=\dfrac{5.0}{2.0}=2.5\ \mathrm{m/s^2}$.
    approved: false

  - id: q-physics-dynamics-0025
    type: "cause-effect"
    difficulty: "hard"
    stem: |
      A horse pulls a cart forward. By Newton's third law, the cart pulls back on the horse with a force of the same size. Why can the cart still accelerate forward?
    choices:
      - text: "The two forces act on different objects, so they do not cancel on the cart"
        correct: true
      - text: "The horse's pull is stronger than the cart's pull on the horse"
        rationale: |
          This says the pair can be unequal. The cart speeds up forward, so the horse's force can seem stronger. The third law makes them equal in size. Check that interaction pairs are always the same size.
      - text: "The cart's pull on the horse starts only after the cart is moving"
        rationale: |
          This says the reaction comes later. The words action and reaction can sound like a time sequence. The two forces act at the same time. Check the timing in the third law.
      - text: "The two forces cancel, but the cart has less inertia than the horse"
        rationale: |
          This says they cancel and then uses inertia to explain the motion. A smaller mass does speed up more easily, but only when the net force is not zero. Forces cancel only if they act on one object. Check which object each force acts on.
    explanation: |
      The horse pulls on the cart, and the cart pulls on the horse. These forces act on different objects, so they cannot cancel each other. The cart accelerates when the net force on the cart, such as the pull from the horse minus friction, is forward.
    approved: false

  - id: q-physics-dynamics-0026
    type: "simple-quantitative"
    difficulty: "exam"
    stem: |
      A 60 kg person stands on a scale in an elevator that accelerates upward at $2.0\ \mathrm{m/s^2}$. Use $g=9.8\ \mathrm{m/s^2}$. What is the normal force of the scale on the person?
    choices:
      - text: "708 N"
        correct: true
      - text: "588 N"
        rationale: |
          This equals the weight, $mg$. The normal force equals the weight when the vertical acceleration is zero and just these two vertical forces act. Check that the elevator is accelerating.
      - text: "468 N"
        rationale: |
          This uses $m(g-a)$, which is for an elevator accelerating downward. Gravity points down and the acceleration points up, so their opposite directions can tempt you to subtract the sizes. Check the direction of the acceleration.
      - text: "120 N"
        rationale: |
          This is $ma$ alone. The acceleration is in the problem, so it seems to give the force. Check that the normal force also supports the weight.
    explanation: |
      Take up as positive. The net force is $N-mg=ma$. So $N=m(g+a)=60\times(9.8+2.0)=60\times11.8=708$ N.
    approved: false
