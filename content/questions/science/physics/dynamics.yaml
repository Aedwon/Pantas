meta:
  subject: science
  topic: physics
  subtopic: dynamics
  exams:
    - upcat
    - dlsucet
    - ustet
    - dost-sei
questions:
  - id: q-physics-dynamics-0001
    type: simple-quantitative
    difficulty: easy
    stem: |
      A 5 kg object experiences a net force of 20 N. Find its acceleration. (Use $F_{net} = ma$.)
    choices:
      - text: 4 m/s^2
        correct: true
      - text: 100 m/s^2
      - text: 15 m/s^2
      - text: 0.25 m/s^2
    explanation: |
      $a = \dfrac{F_{net}}{m} = \dfrac{20}{5} = 4$ m/s².
    approved: true
  - id: q-physics-dynamics-0002
    type: simple-quantitative
    difficulty: medium
    stem: |
      An 8 kg object accelerates at 3 m/s². Find the net force acting on it.
    choices:
      - text: 24 N
        correct: true
      - text: 11 N
      - text: 2.67 N
      - text: 5 N
    explanation: |
      $F_{net} = ma = (8)(3) = 24$ N.
    approved: true
  - id: q-physics-dynamics-0003
    type: simple-quantitative
    difficulty: medium
    stem: |
      A net force of 50 N causes an object to accelerate at 2 m/s². Find the object's mass.
    choices:
      - text: 25 kg
        correct: true
      - text: 100 kg
      - text: 48 kg
      - text: 52 kg
    explanation: |
      $m = \dfrac{F_{net}}{a} = \dfrac{50}{2} = 25$ kg.
    approved: true
  - id: q-physics-dynamics-0004
    type: identify
    difficulty: easy
    stem: |
      Which of Newton's laws states that an object at rest stays at rest, and an object in motion stays in motion, unless acted on by a net external force?
    choices:
      - text: The First Law (Law of Inertia)
        correct: true
      - text: The Second Law
      - text: The Third Law
      - text: The Law of Universal Gravitation
    explanation: |
      This is Newton's First Law, also called the Law of Inertia: an object resists changes to its state of motion unless a net force acts on it.
    approved: true
  - id: q-physics-dynamics-0005
    type: identify
    difficulty: easy
    stem: |
      Which of Newton's laws states that for every action force, there is an equal and opposite reaction force?
    choices:
      - text: The Third Law
        correct: true
      - text: The First Law
      - text: The Second Law
      - text: The Law of Conservation of Momentum
    explanation: |
      This is Newton's Third Law: action and reaction forces are equal in magnitude, opposite in direction, and act on two different objects.
    approved: true
  - id: q-physics-dynamics-0006
    type: classify
    difficulty: medium
    stem: |
      A book rests on a table. According to Newton's Third Law, which pair of forces are true action-reaction partners?
    choices:
      - text: The book pushing down on the table, and the table pushing up on the book.
        correct: true
      - text: The book's weight and the normal force, both acting on the book.
      - text: The table's weight and the floor's normal force on the table.
      - text: There is no true action-reaction pair in this scenario.
    explanation: |
      True Newton's Third Law pairs act on two different objects: here, the book pushes down on the table, and the table pushes back up on the book with an equal, opposite force.
    approved: true
  - id: q-physics-dynamics-0007
    type: classify
    difficulty: medium
    stem: |
      A heavy crate requires a push of 200 N to just begin sliding, but only 150 N to keep it sliding at constant speed once moving. Which value is the maximum static friction, and which is the kinetic friction?
    choices:
      - text: 200 N is the maximum static friction; 150 N is the kinetic friction.
        correct: true
      - text: 150 N is the maximum static friction; 200 N is the kinetic friction.
      - text: Both values represent kinetic friction at different speeds.
      - text: Both values represent static friction at different speeds.
    explanation: |
      The force needed to just start the crate moving overcomes the maximum static friction (200 N). The lower force needed to keep it moving at constant speed matches the kinetic friction (150 N), which is typically less than the maximum static friction.
    approved: true
  - id: q-physics-dynamics-0008
    type: classify
    difficulty: hard
    stem: |
      A student says the weight and normal force acting on a resting book form a Newton's Third Law action-reaction pair, since they are equal and opposite. Is this correct?
    choices:
      - text: No: both forces act on the same object (the book), which makes them a balanced-force pair (First Law), not a Third Law action-reaction pair.
        correct: true
      - text: Yes: any two equal and opposite forces are automatically a Third Law pair.
      - text: No: weight and normal force are never equal in any situation.
      - text: Yes: but only when the book is accelerating.
    explanation: |
      Third Law pairs always act on two different objects. Weight and normal force both act on the same book: they happen to balance (a First Law equilibrium), which is a separate fact from Third Law pairing.
    approved: true
  - id: q-physics-dynamics-0009
    type: classify
    difficulty: hard
    stem: |
      A student assumes that doubling an object's mass, while keeping the net force the same, will double its acceleration. Is this correct?
    choices:
      - text: No: mass and acceleration are inversely related in Newton's Second Law; doubling the mass halves the acceleration instead.
        correct: true
      - text: Yes: doubling the mass always doubles the acceleration for the same force.
      - text: No: doubling the mass has no effect on acceleration at all.
      - text: Yes: mass and acceleration are directly related.
    explanation: |
      $F_{net} = ma$ means $a = \dfrac{F_{net}}{m}$. For a fixed force, increasing mass decreases acceleration: doubling the mass halves the acceleration, it does not double it.
    approved: true
  - id: q-physics-dynamics-0010
    type: classify
    difficulty: hard
    stem: |
      A student assumes that once an object is sliding, kinetic friction becomes negligible and can safely be ignored. Is this correct?
    choices:
      - text: No: kinetic friction is roughly constant once sliding begins and can be strong enough to eventually stop the object if no other force keeps pushing it.
        correct: true
      - text: Yes: kinetic friction always becomes zero once an object starts sliding.
      - text: No: but only because kinetic friction increases the longer an object slides.
      - text: Yes: friction only matters before an object starts moving.
    explanation: |
      Kinetic friction continues to act on a sliding object, opposing its motion. Without a continued applied force, a sliding object will eventually decelerate to a stop due to this friction.
    approved: true
  - id: q-physics-dynamics-0011
    type: classify
    difficulty: hard
    stem: |
      A student assumes the normal force on an object always equals its weight ($mg$), in every situation. Is this correct?
    choices:
      - text: No: the normal force equals weight only on a horizontal surface with no other vertical forces acting; it must be recalculated in other situations, like on an incline.
        correct: true
      - text: Yes: the normal force always equals $mg$, regardless of the surface or other forces.
      - text: No: the normal force is always greater than weight in every situation.
      - text: Yes: but only for objects that are not accelerating.
    explanation: |
      Normal force only equals $mg$ when the surface is horizontal and no other vertical forces are involved. On an incline, or with an additional applied force, the normal force must be found from the actual vertical force balance in that specific situation.
    approved: true
  - id: q-physics-dynamics-0012
    type: identify
    difficulty: easy
    stem: |
      What is the formula for an object's weight?
    choices:
      - text: W = mg
        correct: true
      - text: W = ma
      - text: W = m/g
      - text: W = g/m
    explanation: |
      Weight is the force of gravity pulling an object downward, calculated as mass times the acceleration due to gravity: $W = mg$.
    approved: true
  - id: q-physics-dynamics-0013
    type: simple-quantitative
    difficulty: hard
    stem: |
      A 10 kg object is pushed with an applied force of 50 N, while friction opposes its motion with a force of 20 N. Find the object's acceleration.
    choices:
      - text: 3 m/s^2
        correct: true
      - text: 5 m/s^2
      - text: 7 m/s^2
      - text: 2 m/s^2
    explanation: |
      The net force is the applied force minus the opposing friction: $50 - 20 = 30$ N. Then $a = \dfrac{F_{net}}{m} = \dfrac{30}{10} = 3$ m/s².
    approved: true
  - id: q-physics-dynamics-0014
    type: classify
    difficulty: medium
    stem: |
      A box sits at rest on a flat, horizontal table, with no other forces applied. Which forces should appear on its free body diagram?
    choices:
      - text: Weight (pulling down) and normal force (pushing up), equal in magnitude since the box is not accelerating.
        correct: true
      - text: Only weight, since the table does not exert any force.
      - text: Only normal force, since the box has no weight while resting.
      - text: Weight, normal force, and friction, even though the box is not sliding or being pushed.
    explanation: |
      With nothing else pushing or pulling the box, only weight and normal force act on it. Since the box is at rest (not accelerating), these two forces must be equal and opposite, balancing each other.
    approved: true
  - id: q-physics-dynamics-0015
    type: predict-outcome
    difficulty: exam
    stem: |
      A box rests on a ramp inclined at an angle, rather than on a flat horizontal surface. Does the normal force on the box still equal its full weight, $mg$?
    choices:
      - text: No: on an incline, the normal force is less than the full weight, since only part of the weight presses directly into the ramp's surface.
        correct: true
      - text: Yes: the normal force always equals $mg$, regardless of the surface's angle.
      - text: No: the normal force is always greater than the full weight on an incline.
      - text: Yes: but only if the box is sliding down the ramp.
    explanation: |
      On an incline, weight has a component pressing into the surface and a component along the surface. Only the perpendicular component is balanced by the normal force, making it less than the box's full weight: normal force must be recalculated from the actual geometry, not assumed equal to $mg$.
    approved: true
