meta:
  subject: "science"
  topic: "physics"
  subtopic: "waves-and-sound"
  exams: ["upcat", "dlsucet", "ustet", "dost-sei"]
questions:
  - id: q-physics-waves-and-sound-0001
    type: "simple-quantitative"
    difficulty: "easy"
    stem: |
      A wave has frequency $5\,\mathrm{Hz}$ and wavelength $2\,\mathrm m$. Find its speed.
    choices:
      - text: "$10\\,\\mathrm{m/s}$"
        correct: true
      - text: "$7\\,\\mathrm{m/s}$"
        rationale: |
          This adds frequency and wavelength. Both numbers are given. Check the product in the wave relation.
      - text: "$2.5\\,\\mathrm{m/s}$"
        rationale: |
          This divides frequency by wavelength. Division finds other wave quantities. Check which quantity is requested.
      - text: "$0.4\\,\\mathrm{m/s}$"
        rationale: |
          This divides wavelength by frequency. The ratio has familiar inputs. Check the multiplication needed for speed.
    explanation: |
      Wave speed is $v=f\lambda$. Thus $v=(5)(2)=10\,\mathrm{m/s}$.
    approved: true

  - id: q-physics-waves-and-sound-0002
    type: "simple-quantitative"
    difficulty: "medium"
    stem: |
      A sound wave travels at $340\,\mathrm{m/s}$ with frequency $170\,\mathrm{Hz}$. What is its wavelength?
    choices:
      - text: "$2\\,\\mathrm m$"
        correct: true
      - text: "$0.5\\,\\mathrm m$"
        rationale: |
          This reverses speed and frequency in the division. Both belong in the calculation. Check the units needed for length.
      - text: "$510\\,\\mathrm m$"
        rationale: |
          This adds speed and frequency. Adding given values can seem useful. Check the ratio obtained from $v=f\lambda$.
      - text: "$170\\,\\mathrm m$"
        rationale: |
          This relabels frequency as a length. The frequency is explicitly given. Check cycles per second versus meters.
    explanation: |
      Rearrange $v=f\lambda$: $\lambda=v/f=340/170=2\,\mathrm m$.
    approved: true

  - id: q-physics-waves-and-sound-0003
    type: "simple-quantitative"
    difficulty: "medium"
    stem: |
      A wave travels at $300\,\mathrm{m/s}$ with wavelength $5\,\mathrm m$. What is its frequency?
    choices:
      - text: "$60\\,\\mathrm{Hz}$"
        correct: true
      - text: "$1500\\,\\mathrm{Hz}$"
        rationale: |
          This multiplies speed by wavelength. Multiplication appears in the wave equation. Check how to isolate frequency.
      - text: "$295\\,\\mathrm{Hz}$"
        rationale: |
          This subtracts wavelength from speed. Both numbers are given. Check that their units cannot be subtracted.
      - text: "$6\\,\\mathrm{Hz}$"
        rationale: |
          This uses 30 instead of 300 for speed. A zero can be lost in division. Check the original value.
    explanation: |
      Frequency is $f=v/\lambda=300/5=60\,\mathrm{Hz}$.
    approved: true

  - id: q-physics-waves-and-sound-0004
    type: "classify"
    difficulty: "easy"
    stem: |
      A sound pressure disturbance propagates through air. Which wave category describes it?
    choices:
      - text: "Mechanical"
        correct: true
      - text: "Electromagnetic because air has charged particles"
        rationale: |
          This uses microscopic charge to classify the wave. Matter contains charges. Check that the disturbance is pressure in a medium.
      - text: "Nonmechanical because sound carries no visible object"
        rationale: |
          This assumes mechanical waves must visibly carry matter along. Sound is invisible. Check oscillating air pressure.
      - text: "Electromagnetic whenever sound is loud"
        rationale: |
          This makes classification depend on amplitude. Loudness changes perception. Check whether a medium is still required.
    explanation: |
      The pressure disturbance propagates through matter. Air is its medium. That makes sound a mechanical wave.
    approved: true

  - id: q-physics-waves-and-sound-0005
    type: "classify"
    difficulty: "easy"
    stem: |
      Sunlight propagates across interplanetary vacuum. Which wave category permits that?
    choices:
      - text: "Electromagnetic"
        correct: true
      - text: "Mechanical because the Sun contains matter"
        rationale: |
          This classifies the traveling wave by its source material. The source is physical. Check the medium needed along the path.
      - text: "Mechanical because sunlight has energy"
        rationale: |
          This treats energy transport as exclusive to mechanical waves. Both wave categories transfer energy. Check the vacuum condition.
      - text: "Mechanical whenever the source is very hot"
        rationale: |
          This makes propagation type depend on source temperature. The Sun is hot. Check whether material particles are needed along the path.
    explanation: |
      Electromagnetic waves are disturbances of electric and magnetic fields. They can propagate through vacuum. Sunlight belongs to this category.
    approved: true

  - id: q-physics-waves-and-sound-0006
    type: "identify"
    difficulty: "medium"
    stem: |
      What is the distance between adjacent wave points in the same phase, such as crest to crest?
    choices:
      - text: "Wavelength"
        correct: true
      - text: "Frequency"
        rationale: |
          This confuses spatial repetition with cycles per second. Both describe repetition. Check distance versus rate.
      - text: "Amplitude"
        rationale: |
          This uses the maximum disturbance from equilibrium. Both are measured in length for a string wave. Check height versus spacing.
      - text: "Wave speed"
        rationale: |
          This uses distance traveled per time. A wave crest moves. Check whether the question includes a time interval.
    explanation: |
      Wavelength is the distance over which a periodic wave repeats its phase. Adjacent crests are one wavelength apart.
    approved: true

  - id: q-physics-waves-and-sound-0007
    type: "classify"
    difficulty: "medium"
    stem: |
      In a string wave, the string’s disturbance is perpendicular to propagation. How is the disturbance orientation classified?
    choices:
      - text: "Transverse"
        correct: true
      - text: "Longitudinal"
        rationale: |
          This selects a parallel disturbance. Both are mechanical-wave orientations. Check perpendicular versus parallel.
      - text: "Neither because mechanical waves have no orientation"
        rationale: |
          This confuses wave category with disturbance direction. The wave is mechanical. Check the string’s actual oscillation direction.
      - text: "Longitudinal because particles return to equilibrium"
        rationale: |
          This uses oscillation alone to infer parallel motion. Both types oscillate locally. Check the relation to propagation direction.
    explanation: |
      Transverse means the disturbance is perpendicular to the direction the wave travels. The string motion meets that definition.
    approved: true

  - id: q-physics-waves-and-sound-0008
    type: "classify"
    difficulty: "medium"
    stem: |
      In a spring wave, coils oscillate parallel to propagation and form compressions. Which orientation classification applies?
    choices:
      - text: "Longitudinal"
        correct: true
      - text: "Transverse"
        rationale: |
          This selects perpendicular motion. Both types can use springs. Check the stated parallel oscillation.
      - text: "Neither because compressions are not disturbances"
        rationale: |
          This rejects pressure or spacing changes as waves. Crests are easier to picture. Check the repeating compression pattern.
      - text: "Transverse whenever the compression amplitude is small"
        rationale: |
          This makes orientation depend on size. Amplitude does describe the disturbance. Check direction independently of amplitude.
    explanation: |
      The spring coils move parallel to propagation. That is a longitudinal disturbance, producing compressions and expansions.
    approved: true

  - id: q-physics-waves-and-sound-0009
    type: "cause-effect"
    difficulty: "medium"
    stem: |
      A steady siren moves toward a stationary listener at subsonic speed in still air. How does observed frequency compare with emitted frequency?
    choices:
      - text: "It is higher."
        correct: true
      - text: "It is lower because wavefronts are farther apart ahead"
        rationale: |
          This reverses the wavefront spacing. Source motion changes spacing. Check successive emissions toward the listener.
      - text: "It is equal because the siren’s emitted frequency is fixed"
        rationale: |
          This equates emitted and observed frequencies despite motion. The siren does emit steadily. Check the arrival intervals.
      - text: "It is higher because sound itself travels faster in the air"
        rationale: |
          This assigns the Doppler shift to propagation speed. Higher frequency is the observed result. Check the unchanged air conditions.
    explanation: |
      Successive wavefronts are emitted from positions closer to the listener. They arrive more frequently than for a stationary source. Observed frequency is higher.
    approved: true

  - id: q-physics-waves-and-sound-0010
    type: "cause-effect"
    difficulty: "medium"
    stem: |
      A steady siren recedes from a stationary listener in still air. How does observed frequency compare with emitted frequency?
    choices:
      - text: "It is lower."
        correct: true
      - text: "It is higher because separation increases"
        rationale: |
          This reverses the arrival-rate trend. Distance is changing. Check the increasing spacing of successive wavefronts toward the listener.
      - text: "It is equal because the source frequency is constant"
        rationale: |
          This ignores source motion during emission. The source frequency is fixed. Check the listener’s arrival intervals.
      - text: "It becomes zero immediately because the source moves away"
        rationale: |
          This turns a lower frequency into no sound. The source is farther away. Check ongoing arrival of wavefronts.
    explanation: |
      Successive wavefronts reaching the listener are spaced farther apart by the receding source. They arrive less frequently. Observed frequency is lower.
    approved: true

  - id: q-physics-waves-and-sound-0011
    type: "classify"
    difficulty: "hard"
    stem: |
      An astronaut sees an explosion across a vacuum gap with no solid connection to its source. Can ordinary sound from it travel directly across the gap?
    choices:
      - text: "No, sound needs a material medium."
        correct: true
      - text: "Yes, because light and sound are both waves"
        rationale: |
          This gives all waves the same medium requirement. Both transfer energy. Check mechanical versus electromagnetic propagation.
      - text: "Yes, if the sound source is loud enough"
        rationale: |
          This lets amplitude replace the missing medium. Loud sounds are easier to hear in air. Check whether any matter spans the gap.
      - text: "No, because no energetic event can occur in space"
        rationale: |
          This rejects the event rather than the sound path. Space lacks air. Check energy release separately from sound transmission.
    explanation: |
      Sound is a mechanical disturbance transmitted through matter. The vacuum gap supplies no medium. It prevents direct ordinary sound transmission across that gap.
    approved: true

  - id: q-physics-waves-and-sound-0012
    type: "compare-contrast"
    difficulty: "hard"
    stem: |
      How does sound in air differ from the transverse disturbance on a string?
    choices:
      - text: "Air motion is parallel; string motion is perpendicular."
        correct: true
      - text: "Both are transverse because all mechanical waves are transverse."
        rationale: |
          This generalizes string behavior to every medium. Both are mechanical waves. Check the air pressure disturbance.
      - text: "Both are electromagnetic because energy travels without bulk matter transport."
        rationale: |
          This confuses no bulk transport with no required medium. Particles mainly oscillate locally. Check whether matter is required for propagation.
      - text: "Air motion is perpendicular; string motion is parallel."
        rationale: |
          This reverses the two orientations. Both involve oscillation. Check compressions in air and sideways motion of the string.
    explanation: |
      Sound in air is longitudinal, with disturbance parallel to propagation. The stated transverse string wave has disturbance perpendicular to propagation.
    approved: true

  - id: q-physics-waves-and-sound-0013
    type: "classify"
    difficulty: "hard"
    stem: |
      A siren approaches a listener in air whose properties remain fixed. Does the higher observed pitch mean sound’s propagation speed relative to that air increased?
    choices:
      - text: "No, source motion changes wavefront spacing."
        correct: true
      - text: "Yes, the moving source adds its speed to sound’s air-relative speed"
        rationale: |
          This treats sound like an object carried by the source. The source is moving. Check that propagation is set by the medium.
      - text: "No, because the propagation speed actually falls during approach"
        rationale: |
          This substitutes a speed decrease for the spacing change. Wave quantities are related. Check the unchanged medium conditions.
      - text: "Yes, pitch is another name for propagation speed"
        rationale: |
          This confuses cycles per second with distance per second. Both can increase numerically. Check frequency versus speed units.
    explanation: |
      The air’s properties set the propagation speed relative to it. The moving source changes the spacing of wavefronts. The listener receives them at a higher frequency.
    approved: true

  - id: q-physics-waves-and-sound-0014
    type: "predict-outcome"
    difficulty: "hard"
    stem: |
      A listener moves toward a stationary siren through still air. The siren emits at fixed frequency. What changes for the listener?
    choices:
      - text: "Wavefronts are encountered more often."
        correct: true
      - text: "Wavefront spacing in the air decreases because the listener moves"
        rationale: |
          This uses moving-source spacing changes for a moving observer. Both produce Doppler shifts. Check which object moves during emission.
      - text: "Wavefronts are encountered less often during approach"
        rationale: |
          This reverses the encounter-rate change. Motion affects arrival intervals. Check movement toward incoming wavefronts.
      - text: "No frequency change can occur unless the source moves"
        rationale: |
          This excludes observer motion from Doppler shifts. A moving siren is the familiar example. Check the relative encounter rate.
    explanation: |
      The stationary source sets a fixed wavefront spacing in the air. A listener moving toward it encounters those wavefronts more often. Observed frequency increases.
    approved: true

  - id: q-physics-waves-and-sound-0015
    type: "process-ordering"
    difficulty: "exam"
    stem: |
      A steady siren approaches and then recedes from a stationary listener in still air. What is the observed pitch sequence relative to the emitted pitch?
    choices:
      - text: "Higher during approach, lower during recession"
        correct: true
      - text: "Lower during approach, higher during recession"
        rationale: |
          This reverses both shifts. Source motion matters. Check compressed spacing ahead and expanded spacing behind.
      - text: "Unchanged throughout because emission is steady"
        rationale: |
          This ignores motion between source and listener. The emitted pitch is fixed. Check observed arrival rate.
      - text: "Higher throughout because the siren remains in motion"
        rationale: |
          This uses motion alone without its direction. The source moves throughout. Check approach versus separation.
    explanation: |
      Approach brings wavefronts more frequently, raising observed pitch. Recession spaces their arrival farther apart, lowering it.
    approved: true

  - id: q-physics-waves-and-sound-0016
    approved: false
    type: "identify"
    difficulty: "easy"
    stem: |
      Which wave property is measured in hertz?
    choices:
      - text: "Frequency"
        correct: true
      - text: "Wavelength"
        rationale: |
          This substitutes spatial repeat length. Both describe wave cycles. Check cycles per second.
      - text: "Amplitude"
        rationale: |
          This substitutes maximum disturbance size. Bigger waves are noticeable. Check the time-based unit.
      - text: "Propagation speed"
        rationale: |
          This substitutes distance per second. Both involve seconds. Check cycles versus distance.
    explanation: |
      Hertz means cycles per second. Frequency counts those cycles.

  - id: q-physics-waves-and-sound-0017
    approved: false
    type: "predict-outcome"
    difficulty: "medium"
    stem: |
      For a linear wave whose transported power is proportional to amplitude squared, what happens when amplitude doubles?
    choices:
      - text: "Power quadruples."
        correct: true
      - text: "Power doubles because amplitude doubles"
        rationale: |
          This assumes a direct linear relation. Both increase together. Check the stated square dependence.
      - text: "Power stays unchanged because frequency is unchanged"
        rationale: |
          This considers only frequency. Wave power can depend on several properties. Check the explicitly stated amplitude relation.
      - text: "Power halves because oscillations become farther from equilibrium"
        rationale: |
          This reverses the amplitude effect. The disturbance becomes larger. Check the positive square dependence.
    explanation: |
      With $P\propto A^2$, changing amplitude to $2A$ makes power proportional to $4A^2$. It quadruples.

  - id: q-physics-waves-and-sound-0018
    approved: false
    type: "classify"
    difficulty: "hard"
    stem: |
      Which statement about sound speed is supported by the lesson?
    choices:
      - text: "It depends on the medium and its state."
        correct: true
      - text: "It is exactly $340\\,\\mathrm{m/s}$ in every material"
        rationale: |
          This treats a common air approximation as universal. The number appears in many problems. Check the specified medium.
      - text: "It changes solely with the sound’s loudness"
        rationale: |
          This uses perception to set propagation speed. Loudness is noticeable. Check material properties and conditions.
      - text: "It must equal light speed because both carry energy"
        rationale: |
          This gives all energy-carrying waves one speed. Both are waves. Check their different propagation mechanisms.
    explanation: |
      Sound speed depends on the medium and conditions such as temperature. Room-temperature air values are approximations for that situation.

  - id: q-physics-waves-and-sound-0019
    approved: false
    type: "predict-outcome"
    difficulty: "hard"
    stem: |
      A periodic wave enters another medium. Its frequency stays fixed and its speed halves. What happens to wavelength?
    choices:
      - text: "It halves."
        correct: true
      - text: "It doubles because a slower wave stretches out"
        rationale: |
          This reverses the speed-wavelength relation. The speed decreases. Check the fixed frequency in $v=f\lambda$.
      - text: "It stays unchanged because the source is unchanged"
        rationale: |
          This extends fixed frequency to fixed wavelength. The source sets frequency. Check the changed speed.
      - text: "It becomes one-quarter because speed is squared"
        rationale: |
          This adds an exponent absent from the relation. Some wave-energy rules use squares. Check the speed equation.
    explanation: |
      Wavelength is $\lambda=v/f$. At fixed frequency, halving speed halves wavelength.

  - id: q-physics-waves-and-sound-0020
    approved: false
    type: "compare-contrast"
    difficulty: "exam"
    stem: |
      Why can electromagnetic waves be transverse in vacuum while a transverse string wave needs a string?
    choices:
      - text: "Fields oscillate in light; matter oscillates in the string."
        correct: true
      - text: "Vacuum contains a hidden string that vibrates for every light wave"
        rationale: |
          This adds a material medium where none is required. The string example is concrete. Check the electromagnetic field description.
      - text: "Electromagnetic waves are never transverse without air"
        rationale: |
          This makes transverse light require matter. Mechanical transverse waves do use matter. Check field oscillations in vacuum.
      - text: "String particles travel permanently alongside each passing crest"
        rationale: |
          This confuses local oscillation with bulk transport. The disturbance travels. Check the particles’ motion around equilibrium.
    explanation: |
      In light, electric and magnetic fields oscillate perpendicular to propagation. They do not need material particles. In a string wave, the material itself oscillates.
