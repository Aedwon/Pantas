meta:
  subject: "science"
  topic: "physics"
  subtopic: "scalars-and-vectors"
  exams: ["upcat", "dlsucet", "ustet", "dost-sei"]
questions:
  - id: q-physics-scalars-and-vectors-0001
    type: "classify"
    difficulty: "easy"
    stem: |
      A car’s total path length is $50\,\mathrm{km}$. How is path length classified?
    choices:
      - text: "Scalar"
        correct: true
      - text: "Vector because the car moved"
        rationale: |
          This treats all motion quantities as vectors. Motion has direction. Check whether the named quantity is path length or position change.
      - text: "Vector because kilometers are used"
        rationale: |
          This uses the unit to classify the quantity. Displacement also uses kilometers. Check the quantity’s definition.
      - text: "Neither because only a number and unit are given"
        rationale: |
          This assumes a direction is required for every physical measurement. Direction matters for vectors. Check the scalar definition.
    explanation: |
      Path length is the total distance traveled. It is specified by a size and unit, so it is scalar.
    approved: true

  - id: q-physics-scalars-and-vectors-0002
    type: "classify"
    difficulty: "easy"
    stem: |
      A car’s displacement is $50\,\mathrm{km}$ north. How is displacement classified?
    choices:
      - text: "Vector"
        correct: true
      - text: "Scalar because it is measured in kilometers"
        rationale: |
          This treats a length unit as proof of a scalar. Distance has the same unit. Check the difference between distance and displacement.
      - text: "Scalar whenever only its magnitude is requested"
        rationale: |
          This uses the requested information to change the quantity’s type. A magnitude alone is a scalar value. Check that displacement itself remains a vector.
      - text: "A speed because a direction is supplied"
        rationale: |
          This confuses change in position with a rate. Cars have speed. Check the absence of a time denominator.
    explanation: |
      Displacement is change in position. It has magnitude and direction and adds by vector rules.
    approved: true

  - id: q-physics-scalars-and-vectors-0003
    type: "classify"
    difficulty: "easy"
    stem: |
      A temperature reading is $30^\circ\mathrm C$. Which statement classifies the quantity correctly?
    choices:
      - text: "Temperature is scalar."
        correct: true
      - text: "Temperature is vector because it can rise or fall."
        rationale: |
          This treats numerical increase as spatial direction. The words rise and fall suggest directions. Check whether the quantity has a spatial orientation.
      - text: "Temperature becomes vector below zero Celsius."
        rationale: |
          This confuses a negative scalar with a directed vector. Negative values appear in vector components. Check the quantity’s definition.
      - text: "Temperature becomes vector when measured north of a city."
        rationale: |
          This uses the location word to change the quantity. North gives measurement context. Check what is measured rather than where.
    explanation: |
      Temperature has a numerical value and a unit. It has no spatial direction, so it is scalar even when its value is negative.
    approved: true

  - id: q-physics-scalars-and-vectors-0004
    type: "compare-contrast"
    difficulty: "medium"
    stem: |
      A runner completes one nonzero lap of a circular track and returns to the start. Which pair describes distance and displacement?
    choices:
      - text: "Positive distance; zero displacement"
        correct: true
      - text: "Zero distance; zero displacement"
        rationale: |
          This treats matching endpoints as no travel. The runner returns home. Check the path actually covered.
      - text: "Positive distance; equal positive displacement magnitude"
        rationale: |
          This treats path length as net position change. A full lap has length. Check the coincident endpoints.
      - text: "Zero distance; positive displacement magnitude"
        rationale: |
          This reverses path length and net change. Both quantities describe the trip. Check their definitions.
    explanation: |
      The full lap has positive path length. Final and initial positions are the same, so displacement is zero.
    approved: true

  - id: q-physics-scalars-and-vectors-0005
    type: "simple-quantitative"
    difficulty: "medium"
    stem: |
      A hiker walks $6\,\mathrm{km}$ east then $8\,\mathrm{km}$ north. What is the displacement magnitude?
    choices:
      - text: "$10\\,\\mathrm{km}$"
        correct: true
      - text: "$14\\,\\mathrm{km}$"
        rationale: |
          This adds path lengths. That gives distance traveled. Check the perpendicular displacement components.
      - text: "$2\\,\\mathrm{km}$"
        rationale: |
          This subtracts magnitudes as if directions were opposite. Both displacements have direction. Check the right angle between them.
      - text: "$48\\,\\mathrm{km}$"
        rationale: |
          This multiplies the component magnitudes. The product can describe a rectangle’s area. Check the units and vector-length formula.
    explanation: |
      The displacements are perpendicular. Thus $R=\sqrt{6^2+8^2}=\sqrt{100}=10\,\mathrm{km}$.
    approved: true

  - id: q-physics-scalars-and-vectors-0006
    type: "classify"
    difficulty: "medium"
    stem: |
      A resultant displacement has positive east and positive north components. Which quadrant or direction contains it?
    choices:
      - text: "Northeast"
        correct: true
      - text: "Northwest"
        rationale: |
          This reverses the horizontal component. North is retained. Check the positive east component.
      - text: "Southeast"
        rationale: |
          This reverses the vertical component. East is retained. Check the positive north component.
      - text: "Southwest"
        rationale: |
          This reverses both components. Diagonal motion is still recognized. Check the sign of each component separately.
    explanation: |
      The east component points right on a map and the north component points up. Their resultant points northeast.
    approved: true

  - id: q-physics-scalars-and-vectors-0007
    type: "simple-quantitative"
    difficulty: "medium"
    stem: |
      Forces of $500\,\mathrm N$ left and $350\,\mathrm N$ right act on a rope. What is their resultant?
    choices:
      - text: "$150\\,\\mathrm N$ left"
        correct: true
      - text: "$850\\,\\mathrm N$ left"
        rationale: |
          This adds opposing magnitudes. Both forces act on the rope. Check opposite signs before addition.
      - text: "$150\\,\\mathrm N$ right"
        rationale: |
          This finds the magnitude but selects the smaller force’s direction. One team pulls right. Check which force is larger.
      - text: "$850\\,\\mathrm N$ right"
        rationale: |
          This adds opposing magnitudes and follows the rightward force. Right is often chosen positive. Check both magnitude and sign of the sum.
    explanation: |
      Take right positive. The total is $-500+350=-150\,\mathrm N$. The negative sign means $150\,\mathrm N$ left.
    approved: true

  - id: q-physics-scalars-and-vectors-0008
    type: "simple-quantitative"
    difficulty: "hard"
    stem: |
      A force of $20\,\mathrm N$ acts $30^\circ$ above the positive horizontal axis. Use $\cos30^\circ=\sqrt3/2$ and $\sin30^\circ=1/2$. What are $(F_x,F_y)$?
    choices:
      - text: "$(10\\sqrt3,10)\\,\\mathrm N$"
        correct: true
      - text: "$(10,10\\sqrt3)\\,\\mathrm N$"
        rationale: |
          This swaps sine and cosine. Both components use those functions. Check the angle’s horizontal reference.
      - text: "$(20,0)\\,\\mathrm N$"
        rationale: |
          This places the entire force horizontally. The angle is closer to horizontal. Check the nonzero upward component.
      - text: "$(0,20)\\,\\mathrm N$"
        rationale: |
          This places the entire force vertically. The force points partly upward. Check the nonzero horizontal component.
    explanation: |
      $F_x=20\cos30^\circ=10\sqrt3\,\mathrm N$. $F_y=20\sin30^\circ=10\,\mathrm N$. Both are positive in this quadrant.
    approved: true

  - id: q-physics-scalars-and-vectors-0009
    type: "simple-quantitative"
    difficulty: "hard"
    stem: |
      A force of $8\,\mathrm N$ points $60^\circ$ above the negative horizontal axis. Use $\cos60^\circ=1/2$ and $\sin60^\circ=\sqrt3/2$. What are $(F_x,F_y)$?
    choices:
      - text: "$(-4,4\\sqrt3)\\,\\mathrm N$"
        correct: true
      - text: "$(4,4\\sqrt3)\\,\\mathrm N$"
        rationale: |
          This treats leftward motion as positive horizontal. The reference angle is acute. Check the quadrant.
      - text: "$(-4,-4\\sqrt3)\\,\\mathrm N$"
        rationale: |
          This gives the upward component a negative sign. The horizontal component is correctly negative. Check above versus below the axis.
      - text: "$(-4\\sqrt3,4)\\,\\mathrm N$"
        rationale: |
          This swaps the adjacent and opposite components. The signs are right. Check the reference angle’s axis.
    explanation: |
      The force points left and up. Hence $F_x=-8\cos60^\circ=-4\,\mathrm N$ and $F_y=8\sin60^\circ=4\sqrt3\,\mathrm N$.
    approved: true

  - id: q-physics-scalars-and-vectors-0010
    type: "predict-outcome"
    difficulty: "hard"
    stem: |
      Two nonzero vectors have fixed magnitudes. Their directions change from identical to perpendicular. What happens to the magnitude of their sum?
    choices:
      - text: "It decreases."
        correct: true
      - text: "It increases because a right angle adds an extra dimension."
        rationale: |
          This treats another direction as extra magnitude. The geometry does change. Check the length of the resulting diagonal versus the sum of side lengths.
      - text: "It stays the sum of their magnitudes for every angle."
        rationale: |
          This ignores direction in addition. The magnitudes are fixed. Check the same-direction condition for simple addition.
      - text: "It becomes zero whenever they are perpendicular."
        rationale: |
          This treats perpendicular vectors as opposite vectors. Both directions differ. Check the difference between 90 and 180 degrees.
    explanation: |
      In one direction the magnitude is $A+B$. At a right angle it is $\sqrt{A^2+B^2}$. For two nonzero magnitudes, that is smaller than $A+B$.
    approved: true

  - id: q-physics-scalars-and-vectors-0011
    type: "classify"
    difficulty: "hard"
    stem: |
      A first-quadrant vector’s angle is measured from the positive vertical axis. Which component uses cosine of that angle?
    choices:
      - text: "The vertical component"
        correct: true
      - text: "The horizontal component for every angle definition"
        rationale: |
          This memorizes cosine as horizontal. That holds for an angle from the horizontal. Check which component is adjacent here.
      - text: "Both components because the vector is positive"
        rationale: |
          This uses sign to choose a trig function. Both components are positive. Check adjacent versus opposite sides.
      - text: "Neither component because trigonometry requires a horizontal angle"
        rationale: |
          This rejects another valid reference axis. Many examples start from horizontal. Check the right triangle formed by the components.
    explanation: |
      Cosine gives adjacent side divided by hypotenuse. With the angle measured from the vertical, the vertical component is adjacent.
    approved: true

  - id: q-physics-scalars-and-vectors-0012
    type: "compare-contrast"
    difficulty: "medium"
    stem: |
      Which distinction is correct?
    choices:
      - text: "Scalars need magnitude; vectors also need direction."
        correct: true
      - text: "Scalars require spatial direction; vectors never do."
        rationale: |
          This reverses the definitions. Both types have values and units. Check whether direction belongs to the quantity.
      - text: "Both types add by ordinary magnitude addition in every case."
        rationale: |
          This ignores vector geometry. Simple addition works in matching directions. Check other orientations.
      - text: "A quantity changes type whenever its sentence includes north."
        rationale: |
          This uses sentence wording as the definition. North is a direction word. Check the named physical quantity.
    explanation: |
      Scalars are specified by a magnitude and unit. Vectors also have direction and follow vector-addition rules.
    approved: true

  - id: q-physics-scalars-and-vectors-0013
    type: "simple-quantitative"
    difficulty: "hard"
    stem: |
      Forces of $800\,\mathrm N$ right and $800\,\mathrm N$ left act on the same object. What is their resultant?
    choices:
      - text: "$0\\,\\mathrm N$"
        correct: true
      - text: "$1600\\,\\mathrm N$ right"
        rationale: |
          This adds the opposing magnitudes. Both forces are 800 newtons. Check their directions.
      - text: "$1600\\,\\mathrm N$ left"
        rationale: |
          This adds magnitudes and selects left. The left force is real. Check the equally strong right force.
      - text: "$800\\,\\mathrm N$ with unknown direction"
        rationale: |
          This retains one force and ignores the other. Each force has that size. Check the vector total.
    explanation: |
      Taking right positive, $F_{\mathrm{net}}=800-800=0\,\mathrm N$.
    approved: true

  - id: q-physics-scalars-and-vectors-0014
    type: "predict-outcome"
    difficulty: "exam"
    stem: |
      A vector’s Cartesian components are both multiplied by three. How does its magnitude change?
    choices:
      - text: "It triples."
        correct: true
      - text: "It becomes nine times larger."
        rationale: |
          This stops at the change in the sum of squared components. Each square increases ninefold. Check the square root for magnitude.
      - text: "It becomes six times larger."
        rationale: |
          This adds the two scale factors. Both components triple. Check the common scale factor in the vector length.
      - text: "It stays unchanged because its direction is unchanged."
        rationale: |
          This confuses direction with magnitude. Scaling preserves direction. Check the increased component lengths.
    explanation: |
      The new magnitude is $\sqrt{(3V_x)^2+(3V_y)^2}=3\sqrt{V_x^2+V_y^2}$. It is three times the original magnitude.
    approved: true

  - id: q-physics-scalars-and-vectors-0015
    approved: false
    type: "identify"
    difficulty: "easy"
    stem: |
      Which quantity remains a vector even when a question requests only its magnitude?
    choices:
      - text: "Force"
        correct: true
      - text: "Speed"
        rationale: |
          This treats any motion quantity as a vector. Speed relates to velocity. Check speed’s lack of direction.
      - text: "Energy"
        rationale: |
          This treats the ability to cause motion as a directed quantity. Energy is related to force and motion. Check how energy is added.
      - text: "Mass"
        rationale: |
          This confuses inertia with a directed response. Mass appears in force equations. Check whether mass itself has spatial direction.
    explanation: |
      Force is a vector quantity. Asking for its magnitude alone does not change the type of force.

  - id: q-physics-scalars-and-vectors-0016
    approved: false
    type: "simple-quantitative"
    difficulty: "medium"
    stem: |
      Two displacement vectors of $7\,\mathrm m$ and $9\,\mathrm m$ point in exactly the same direction. What is their sum’s magnitude?
    choices:
      - text: "$16\\,\\mathrm m$"
        correct: true
      - text: "$2\\,\\mathrm m$"
        rationale: |
          This subtracts magnitudes as though the vectors were opposite. The numbers can be compared. Check the stated same direction.
      - text: "$\\sqrt{130}\\,\\mathrm m$"
        rationale: |
          This uses perpendicular-vector addition. Squaring the sides is a familiar method. Check the angle between vectors.
      - text: "$63\\,\\mathrm m$"
        rationale: |
          This multiplies the magnitudes. Both describe displacements. Check that vector addition is not multiplication.
    explanation: |
      For vectors in the same direction, magnitudes add. The sum is $7+9=16\,\mathrm m$ in that direction.

  - id: q-physics-scalars-and-vectors-0017
    approved: false
    type: "process-ordering"
    difficulty: "hard"
    stem: |
      Which sequence correctly adds vectors using Cartesian components?
    choices:
      - text: "Resolve, sum each axis, reconstruct magnitude and direction."
        correct: true
      - text: "Add magnitudes first, then ignore the directions."
        rationale: |
          This starts with scalar addition. Same-direction vectors permit it. Check whether the vectors share a direction.
      - text: "Sum horizontal and vertical values together as one number."
        rationale: |
          This combines unlike component directions. All components are numerical. Check separate axis sums.
      - text: "Reconstruct each magnitude, then subtract every pair."
        rationale: |
          This assumes all vectors oppose each other. Subtraction is useful in some one-dimensional cases. Check the actual directions.
    explanation: |
      Resolve every vector into horizontal and vertical components. Add corresponding components separately. Use the resulting pair to find magnitude and direction.

  - id: q-physics-scalars-and-vectors-0018
    approved: false
    type: "simple-quantitative"
    difficulty: "hard"
    stem: |
      Three displacements are $+4\,\mathrm m$ east, $+3\,\mathrm m$ north, and $2\,\mathrm m$ west. What are the resultant east and north components?
    choices:
      - text: "$(2,3)\\,\\mathrm m$"
        correct: true
      - text: "$(6,3)\\,\\mathrm m$"
        rationale: |
          This adds westward distance as eastward. Both horizontal segments have length. Check the westward sign.
      - text: "$(4,1)\\,\\mathrm m$"
        rationale: |
          This subtracts the westward segment from the north component. The subtraction is needed on one axis. Check which axis the segment belongs to.
      - text: "$(9,0)\\,\\mathrm m$"
        rationale: |
          This places the total path length along one axis. Adding all lengths gives nine. Check separate horizontal and vertical components.
    explanation: |
      The east component is $4-2=2\,\mathrm m$. The north component remains $3\,\mathrm m$. The component pair is $(2,3)\,\mathrm m$.

  - id: q-physics-scalars-and-vectors-0019
    approved: false
    type: "classify"
    difficulty: "hard"
    stem: |
      A vector has $V_x<0$ and $V_y>0$. In which quadrant does it lie?
    choices:
      - text: "Quadrant II"
        correct: true
      - text: "Quadrant I"
        rationale: |
          This ignores the negative horizontal sign. The vertical component is positive. Check both signs.
      - text: "Quadrant III"
        rationale: |
          This ignores the positive vertical sign. The horizontal component is negative. Check both signs.
      - text: "Quadrant IV"
        rationale: |
          This reverses the two signs. One positive and one negative can be confused. Check left versus right and up versus down.
    explanation: |
      Negative horizontal means left. Positive vertical means up. Left and up place the vector in quadrant II.

  - id: q-physics-scalars-and-vectors-0020
    approved: false
    type: "simple-quantitative"
    difficulty: "exam"
    stem: |
      A displacement has components $-3\,\mathrm m$ and $-3\,\mathrm m$ along the positive east and north axes. What are its magnitude and direction?
    choices:
      - text: "$3\\sqrt2\\,\\mathrm m$, southwest"
        correct: true
      - text: "$6\\,\\mathrm m$, southwest"
        rationale: |
          This adds perpendicular magnitudes directly. Both components are negative. Check the Pythagorean length.
      - text: "$3\\sqrt2\\,\\mathrm m$, northeast"
        rationale: |
          This gets the length but drops both signs. Squares remove signs in magnitude. Check the quadrant separately.
      - text: "$0\\,\\mathrm m$, no direction"
        rationale: |
          This treats equal perpendicular components as opposing. Their sizes match. Check that east-west and north-south are different axes.
    explanation: |
      The magnitude is $\sqrt{(-3)^2+(-3)^2}=3\sqrt2\,\mathrm m$. Both components point negatively, so the vector points southwest.
