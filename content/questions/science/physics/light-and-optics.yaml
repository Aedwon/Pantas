meta:
  subject: "science"
  topic: "physics"
  subtopic: "light-and-optics"
  exams: ["upcat", "dlsucet", "ustet", "dost-sei"]
questions:
  - id: q-physics-light-and-optics-0001
    type: "simple-quantitative"
    difficulty: "easy"
    stem: |
      A ray strikes a plane mirror at $40^\circ$ from the normal. What is its angle of reflection from the normal?
    choices:
      - text: "$40^\\circ$"
        correct: true
      - text: "$50^\\circ$"
        rationale: |
          This measures from the surface instead. The two reference lines are perpendicular. Check that both angles use the normal.
      - text: "$80^\\circ$"
        rationale: |
          This doubles the incidence angle. The angle between the two rays involves both sides. Check that the requested angle is between the reflected ray and normal.
      - text: "$20^\\circ$"
        rationale: |
          This halves the incidence angle. A bounce can suggest splitting an angle. Check the equality in the reflection law.
    explanation: |
      The reflection angle equals the incidence angle when both are measured from the normal. It is $40^\circ$.
    approved: true

  - id: q-physics-light-and-optics-0002
    type: "simple-quantitative"
    difficulty: "medium"
    stem: |
      An incident ray makes $55^\circ$ with a plane mirror’s surface. What angle does the reflected ray make with the normal?
    choices:
      - text: "$35^\\circ$"
        correct: true
      - text: "$55^\\circ$"
        rationale: |
          This uses the surface angle as the normal angle. The given angle is explicit. Check the reference line.
      - text: "$110^\\circ$"
        rationale: |
          This doubles the given surface angle. The ray separation can seem relevant. Check the single reflected-ray angle requested.
      - text: "$90^\\circ$"
        rationale: |
          This reports the angle between surface and normal. That angle is fixed. Check the ray’s angle instead.
    explanation: |
      The normal is perpendicular to the surface. The incidence angle is $90^\circ-55^\circ=35^\circ$. Reflection preserves that normal-based angle.
    approved: true

  - id: q-physics-light-and-optics-0007
    type: "identify"
    difficulty: "medium"
    stem: |
      Which relation states the law of reflection, with angles measured from the normal?
    choices:
      - text: "$\\theta_i=\\theta_r$"
        correct: true
      - text: "$\\theta_i+\\theta_r=90^\\circ$"
        rationale: |
          This assumes the two ray angles are complementary. The surface and normal are perpendicular. Check that both angles use the same normal.
      - text: "$\\theta_r=2\\theta_i$"
        rationale: |
          This uses the angle between the rays as the reflection angle. Both sides of the normal contribute to that angle. Check the reflected ray’s single angle.
      - text: "$\\theta_r=\\theta_i/2$"
        rationale: |
          This divides the incident angle between two rays. Reflection involves two rays. Check that their normal-based angles are equal.
    explanation: |
      The incident and reflected rays make equal angles with the normal. Therefore $\theta_i=\theta_r$.
    approved: true

  - id: q-physics-light-and-optics-0008
    type: "identify"
    difficulty: "medium"
    stem: |
      What is the name for the change in a ray’s direction as it crosses obliquely from air into water?
    choices:
      - text: "Refraction"
        correct: true
      - text: "Reflection"
        rationale: |
          This returns the ray to its original medium. Boundaries can reflect light too. Check whether the stated ray crosses the boundary.
      - text: "Diffraction"
        rationale: |
          This uses bending around edges or small openings. Both can change light’s direction. Check whether the cause here is a change of medium.
      - text: "Convergence"
        rationale: |
          This names rays coming together. Lenses can refract rays into a focus. Check the boundary process rather than the resulting ray pattern.
    explanation: |
      The ray changes propagation speed at the air-water boundary. At oblique incidence, this changes its direction according to Snell’s law. That process is refraction.
    approved: true

  - id: q-physics-light-and-optics-0009
    type: "process-ordering"
    difficulty: "medium"
    stem: |
      Order radio waves, visible light, X-rays, and gamma rays from longest to shortest wavelength.
    choices:
      - text: "Radio, visible, X-ray, gamma"
        correct: true
      - text: "Gamma, X-ray, visible, radio"
        rationale: |
          This reverses the requested order. It is the short-to-long sequence. Check the direction named in the stem.
      - text: "Visible, radio, gamma, X-ray"
        rationale: |
          This puts visible light before radio and reverses the high-frequency end. Visible light is familiar. Check the full spectrum sequence.
      - text: "Radio, gamma, X-ray, visible"
        rationale: |
          This puts the shortest waves near the longest. All are electromagnetic waves. Check the relative positions of visible and gamma radiation.
    explanation: |
      The lesson’s long-to-short order is radio, microwave, infrared, visible, ultraviolet, X-ray, gamma. Keeping just the four named bands gives radio, visible, X-ray, gamma.
    approved: true

  - id: q-physics-light-and-optics-0010
    type: "identify"
    difficulty: "medium"
    stem: |
      Which visible color has the longest wavelength?
    choices:
      - text: "Red"
        correct: true
      - text: "Violet"
        rationale: |
          This chooses the opposite end of the visible range. Violet has high frequency. Check the inverse frequency-wavelength relation.
      - text: "Blue"
        rationale: |
          This picks a short-wavelength color. Blue is a strong visible color. Check its position relative to the red end.
      - text: "Green"
        rationale: |
          This selects a middle color. Green can seem central to vision. Check the wavelength extreme being asked for.
    explanation: |
      Red lies at the longest-wavelength end of the visible spectrum.
    approved: true

  - id: q-physics-light-and-optics-0011
    type: "predict-outcome"
    difficulty: "medium"
    stem: |
      Red and violet light travel in vacuum. Which has the higher frequency?
    choices:
      - text: "Violet because its wavelength is shorter"
        correct: true
      - text: "Red because its wavelength is longer"
        rationale: |
          This makes frequency grow with wavelength. Red has the longer wavelength. Check the fixed product $f\lambda=c$.
      - text: "Both have equal frequency because their speeds match"
        rationale: |
          This confuses equal speed with equal frequency. Both travel at $c$. Check their different wavelengths.
      - text: "Their frequencies cannot be compared because intensities are not given"
        rationale: |
          This substitutes brightness for frequency. Light intensity is noticeable. Check that color supplies the wavelength comparison.
    explanation: |
      In vacuum, $c=f\lambda$. Violet has a shorter wavelength than red. With the same speed, its frequency is higher.
    approved: true

  - id: q-physics-light-and-optics-0013
    type: "compare-contrast"
    difficulty: "hard"
    stem: |
      Which distinction correctly describes reflected and transmitted refracted rays at a boundary?
    choices:
      - text: "Reflection returns; refraction crosses."
        correct: true
      - text: "Reflection crosses into the other medium; refraction returns."
        rationale: |
          This swaps the two processes. Both occur at boundaries. Check which ray remains in the original medium.
      - text: "Both processes always return light to the incident medium."
        rationale: |
          This applies the reflected-ray behavior to transmission. Both can redirect light. Check whether the boundary is crossed.
      - text: "Refraction changes direction only, with no possible speed change."
        rationale: |
          This ignores the propagation-speed change. Bending is the visible effect. Check the refractive indices.
    explanation: |
      Reflection sends a ray back into the incident medium. Refraction involves light transmitted across the boundary into another optical medium. Its speed can change there.
    approved: true

  - id: q-physics-light-and-optics-0014
    type: "classify"
    difficulty: "hard"
    stem: |
      How does visible light fit into the electromagnetic spectrum?
    choices:
      - text: "It is one narrow wavelength band."
        correct: true
      - text: "It includes radio waves and X-rays because all are light."
        rationale: |
          This confuses the broad physics meaning of light with visible light. All are electromagnetic radiation. Check what human eyes detect.
      - text: "It is the entire spectrum because only visible waves carry energy."
        rationale: |
          This limits energy transport to what eyes see. Visibility is familiar. Check invisible radiation such as infrared.
      - text: "It is separate from electromagnetic waves because it has color."
        rationale: |
          This treats color as a different wave type. Color is a visible sensation. Check that visible light is electromagnetic radiation.
    explanation: |
      Visible light is the narrow band detected by human eyes. It lies between infrared and ultraviolet in the electromagnetic spectrum.
    approved: true

  - id: q-physics-light-and-optics-0015
    type: "compare-contrast"
    difficulty: "hard"
    stem: |
      A radio wave and an X-ray propagate in vacuum. How do their speeds compare?
    choices:
      - text: "They are equal."
        correct: true
      - text: "The X-ray is faster."
        rationale: |
          This uses frequency to change vacuum speed. X-rays have shorter wavelengths. Check the common speed $c$.
      - text: "The radio wave is faster."
        rationale: |
          This uses wavelength to change vacuum speed. Radio waves have long wavelengths. Check the fixed speed for electromagnetic waves in vacuum.
      - text: "Their speeds depend on how bright their sources are."
        rationale: |
          This uses intensity to set propagation speed. Stronger signals can seem faster. Check the vacuum-speed rule.
    explanation: |
      Both are electromagnetic waves. In vacuum, all electromagnetic waves propagate at the same speed $c$.
    approved: true

  - id: q-physics-light-and-optics-0016
    approved: false
    type: "predict-outcome"
    difficulty: "easy"
    stem: |
      A ray enters higher-index glass from air exactly along the normal. What happens to its transmitted direction?
    choices:
      - text: "It stays along the normal."
        correct: true
      - text: "It bends toward the surface."
        rationale: |
          This assumes every new medium requires a bend. The speed changes. Check the zero incidence angle.
      - text: "It bends sideways because glass slows it."
        rationale: |
          This treats a speed change as sufficient for a directional change. Refraction often bends rays. Check the normal-incidence exception.
      - text: "It undergoes total internal reflection from air into glass."
        rationale: |
          This applies the high-to-low-index condition in reverse. Reflection can occur at boundaries. Check the direction of the index change.
    explanation: |
      At normal incidence, the incident angle is zero. Snell’s law then gives a zero transmitted angle. The ray slows in glass while continuing along the normal.

  - id: q-physics-light-and-optics-0017
    approved: false
    type: "predict-outcome"
    difficulty: "medium"
    stem: |
      A ray crosses obliquely from water into air below the critical angle. What happens to its direction?
    choices:
      - text: "It bends away from the normal."
        correct: true
      - text: "It bends toward the normal."
        rationale: |
          This applies the higher-index-entry rule in reverse. Crossing into a medium changes direction. Check that air has the lower index.
      - text: "It remains unchanged at every incidence angle."
        rationale: |
          This generalizes normal incidence to an oblique ray. Some rays cross without turning. Check the stated nonzero angle.
      - text: "It bends along the normal regardless of incidence angle."
        rationale: |
          This assumes every ray is forced to zero angle. The normal is the reference line. Check Snell’s relation between the two angles.
    explanation: |
      Water has the higher refractive index. Below the critical angle, transmitted light entering air speeds up and bends away from the normal.

  - id: q-physics-light-and-optics-0018
    approved: false
    type: "compare-contrast"
    difficulty: "hard"
    stem: |
      A light wave crosses from air into ordinary glass. Which wave property remains unchanged across the boundary?
    choices:
      - text: "Frequency"
        correct: true
      - text: "Speed"
        rationale: |
          This applies the vacuum speed to material propagation. All light has speed $c$ in vacuum. Check the refractive index.
      - text: "Wavelength"
        rationale: |
          This assumes the spacing between wave crests cannot change. The source remains the same. Check the changed speed at fixed frequency.
      - text: "Direction for every incidence angle"
        rationale: |
          This generalizes the normal-incidence case. Some rays do stay straight. Check whether incidence is oblique.
    explanation: |
      The source sets the frequency, which stays the same across the boundary. The changed propagation speed changes wavelength.

  - id: q-physics-light-and-optics-0019
    approved: false
    type: "classify"
    difficulty: "hard"
    stem: |
      What conditions allow total internal reflection at a boundary?
    choices:
      - text: "Higher-to-lower index; incidence above the critical angle"
        correct: true
      - text: "Lower-to-higher index; incidence above any chosen angle"
        rationale: |
          This reverses the required index direction. Large angles can seem sufficient. Check which side has the higher index.
      - text: "Higher-to-lower index; incidence exactly along the normal"
        rationale: |
          This replaces the critical-angle threshold with normal incidence. The index direction is right. Check the required angle.
      - text: "Equal indices on both sides; any nonzero incidence angle"
        rationale: |
          This treats any boundary as sufficient. Two materials can meet there. Check that an index contrast and critical-angle condition are needed.
    explanation: |
      Total internal reflection can occur when light travels from higher to lower refractive index. The incidence angle must exceed the critical angle.

  - id: q-physics-light-and-optics-0020
    approved: false
    type: "simple-quantitative"
    difficulty: "exam"
    stem: |
      Light of frequency $5.0\times10^{14}\,\mathrm{Hz}$ travels in vacuum at $3.0\times10^8\,\mathrm{m/s}$. What is its wavelength?
    choices:
      - text: "$6.0\\times10^{-7}\\,\\mathrm m$"
        correct: true
      - text: "$1.67\\times10^6\\,\\mathrm m$"
        rationale: |
          This divides frequency by speed. Both quantities are given. Check that wavelength equals speed divided by frequency.
      - text: "$1.5\\times10^{23}\\,\\mathrm m$"
        rationale: |
          This multiplies speed and frequency. Their product can look like combining wave quantities. Check how to isolate wavelength in $c=f\lambda$.
      - text: "$6.0\\times10^{-6}\\,\\mathrm m$"
        rationale: |
          This shifts the final power of ten by one place. The coefficient six looks right. Check conversion from $0.6\times10^{-6}$ to standard scientific notation.
    explanation: |
      From $c=f\lambda$, $\lambda=\dfrac cf$. Thus $\lambda=\dfrac{3.0\times10^8}{5.0\times10^{14}}=0.6\times10^{-6}=6.0\times10^{-7}\,\mathrm m$.
