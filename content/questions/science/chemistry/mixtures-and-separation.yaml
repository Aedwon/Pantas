meta:
  subject: science
  topic: chemistry
  subtopic: mixtures-and-separation
  exams: ["upcat", "dlsucet", "ustet", "dost-sei"]
questions:
  - id: q-chemistry-mixtures-and-separation-0001
    type: 'classify'
    difficulty: 'easy'
    stem: |
      A clear sugar-water solution has all sugar fully dissolved and uniform composition throughout. How is it classified?
    choices:
      - text: 'Homogeneous'
        correct: true
      - text: 'Heterogeneous'
        rationale: |
          This treats several substances as separate phases. Sugar and water are different substances. Check whether they are uniformly dissolved.
      - text: 'A compound'
        rationale: |
          This treats a uniform solution as one compound. It looks like one material. Check whether the sugar-water ratio can vary.
      - text: 'An element'
        rationale: |
          This treats one-looking material as one element. The liquid appears simple. Check that it contains several compounds.
    explanation: |
      A fully dissolved sugar solution has uniform composition at the scale considered. It is a homogeneous mixture.
    approved: true

  - id: q-chemistry-mixtures-and-separation-0002
    type: 'classify'
    difficulty: 'easy'
    stem: |
      A bowl of vegetable soup clearly shows separate chunks of carrots, potatoes, and celery. Is this mixture homogeneous or heterogeneous?
    choices:
      - text: 'Nonuniform'
        correct: true
      - text: 'Homogeneous'
        rationale: |
          This treats the contents of one bowl as uniformly composed. The soup is one sample. Check its different regions.
      - text: 'One compound'
        rationale: |
          This treats a recipe as a fixed chemical substance. Ingredients are combined. Check whether they retain their identities.
      - text: 'One element'
        rationale: |
          This treats the sample as one atom type. It has one common name. Check the distinct substances in its ingredients.
    explanation: |
      The soup has distinct vegetable pieces and liquid regions with different composition. This makes it a heterogeneous, or nonuniform, mixture.
    approved: true

  - id: q-chemistry-mixtures-and-separation-0003
    type: 'classify'
    difficulty: 'easy'
    stem: |
      Clean air is a uniform blend of gases with no visible separate parts. Is this mixture homogeneous or heterogeneous?
    choices:
      - text: 'Homogeneous'
        correct: true
      - text: 'Heterogeneous'
        rationale: |
          This assumes different gases create separate visible phases. Air contains several gases. Check whether composition is uniform.
      - text: 'A compound'
        rationale: |
          This treats several gases as one fixed chemical formula. They occupy the same space. Check whether their identities remain distinct.
      - text: 'An element'
        rationale: |
          This treats invisible matter as one atom type. The gases cannot be seen separately. Check the stated blend of gases.
    explanation: |
      A well-mixed clean-air sample has the same gas composition throughout at ordinary sampling scales. It is a homogeneous mixture.
    approved: true

  - id: q-chemistry-mixtures-and-separation-0004
    type: 'identify'
    difficulty: 'medium'
    stem: |
      An air cleaner passes dusty air through a porous barrier that retains dust. Which separation method is being used?
    choices:
      - text: 'Filtration'
        correct: true
      - text: 'Distillation'
        rationale: |
          This uses vaporization and condensation for suspended dust. Distillation separates by volatility. Check whether the separation uses a porous barrier.
      - text: 'Chromatography'
        rationale: |
          This uses a mobile and stationary phase method for bulk dust. Both are separation methods. Check what the filter physically retains.
      - text: 'Evaporation'
        rationale: |
          This expects loss of a solvent to remove dust. Evaporation can recover dissolved solids. Check that the fluid here is already a gas.
    explanation: |
      A suitable filter retains solid dust particles while air passes through. Filtration can separate suspended solids from gases as well as liquids.
    approved: true

  - id: q-chemistry-mixtures-and-separation-0005
    type: 'predict-outcome'
    difficulty: 'easy'
    stem: |
      A student must retain suspended sand while letting liquid water pass through, without heating the mixture. Which method fits?
    choices:
      - text: 'Filtration'
        correct: true
      - text: 'Distillation'
        rationale: |
          This uses heating and condensation when a particle barrier is requested. Distillation can recover water. Check the no-heating condition.
      - text: 'Chromatography'
        rationale: |
          This applies a dissolved-component method to suspended sand. Chromatography separates many solutes. Check whether the particles remain undissolved.
      - text: 'Evaporation'
        rationale: |
          This lets water escape instead of passing it through a barrier. Evaporation can leave sand behind. Check how the stem requires the water to be handled.
    explanation: |
      Undissolved sand particles can be retained by a suitable filter. Liquid water passes through, so filtration separates them without heating.
    approved: true

  - id: q-chemistry-mixtures-and-separation-0006
    type: 'predict-outcome'
    difficulty: 'medium'
    stem: |
      Saltwater is left until its water escapes as vapor, without collection, leaving salt behind. Which process is used?
    choices:
      - text: 'Evaporation'
        correct: true
      - text: 'Filtration'
        rationale: |
          This treats dissolved salt as filterable solid grains. Salt was originally solid. Check whether it is now dissolved.
      - text: 'Chromatography'
        rationale: |
          This selects differential movement through two phases. It is a separation method. Check whether the described operation simply removes solvent.
      - text: 'Distillation'
        rationale: |
          This adds vapor collection to a process where vapor escapes. Both methods involve vaporization. Check whether a condenser collects the vapor.
    explanation: |
      Evaporation lets the solvent leave as vapor without collecting it. Nonvolatile dissolved salt remains in the container.
    approved: true

  - id: q-chemistry-mixtures-and-separation-0007
    type: 'predict-outcome'
    difficulty: 'medium'
    stem: |
      A laboratory separates a bulk volatile-liquid mixture by heating it and collecting condensed vapor in a second vessel. Which method is used?
    choices:
      - text: 'Distillation'
        correct: true
      - text: 'Evaporation'
        rationale: |
          This lets vapor escape without recovery. Evaporation also changes liquid to gas. Check the need to condense and collect it.
      - text: 'Filtration'
        rationale: |
          This uses a particle barrier for dissolved liquids. A filter separates some mixtures. Check whether the components pass through together.
      - text: 'Chromatography'
        rationale: |
          This uses differential phase distribution instead of the specified vapor-and-condenser process. Both can separate substances. Check the apparatus described.
    explanation: |
      Distillation vaporizes part of a liquid mixture and condenses the vapor for collection. Differences in volatility give the collected liquid a different composition.
    approved: true

  - id: q-chemistry-mixtures-and-separation-0008
    type: 'predict-outcome'
    difficulty: 'medium'
    stem: |
      A student wants to find out whether a sample of black ink is really a single pure dye or a blend of several different colored dyes. Which technique is most appropriate?
    choices:
      - text: 'Chromatography'
        correct: true
      - text: 'Ordinary filtration'
        rationale: |
          This expects ordinary filter paper to retain dissolved dyes by size. The paper looks like a filter. Check whether the method needs solvent movement to separate dyes.
      - text: 'Simple evaporation'
        rationale: |
          This removes solvent while leaving dyes together. The dyes become visible afterward. Check whether individual components separate into bands.
      - text: 'Simple distillation'
        rationale: |
          This focuses on volatility rather than dye movement. Distillation is a familiar separation. Check whether components distribute differently along the paper.
    explanation: |
      In suitable paper chromatography, dye components move differently through mobile and stationary phases. Separated colored bands provide evidence of several dye components.
    approved: true

  - id: q-chemistry-mixtures-and-separation-0009
    type: 'compare-contrast'
    difficulty: 'hard'
    stem: |
      A student uses evaporation to try to separate an alcohol-water mixture, planning to keep both liquids. Why does this approach fail?
    choices:
      - text: 'The escaping vapor is not collected.'
        correct: true
      - text: 'Evaporation cannot occur in a liquid mixture.'
        rationale: |
          This says a liquid mixture cannot evaporate. Solids are often the recovered residue. Check what state actually becomes vapor.
      - text: 'Evaporation destroys both components’ chemical identities.'
        rationale: |
          This treats a phase change as destroying molecules. Heating is involved. Check whether chemical identity must change during vaporization.
      - text: 'Evaporation requires a chromatography stationary phase.'
        rationale: |
          This imports a chromatography requirement. Many separations use phases. Check whether evaporation requires a fixed separation medium.
    explanation: |
      Ordinary evaporation allows vapor to escape. That escaping material is not recovered. Keeping it requires condensation and collection.
    approved: true

  - id: q-chemistry-mixtures-and-separation-0010
    type: 'compare-contrast'
    difficulty: 'hard'
    stem: |
      A student tries to use filtration to separate salt that is fully dissolved in water. Why does this approach fail?
    choices:
      - text: 'Dissolved ions pass through ordinary filter paper.'
        correct: true
      - text: 'Filtration can be used on gases but never on liquids.'
        rationale: |
          This excludes liquid filtration. Filters are also used for dusty air. Check whether filters can retain suspended solids in liquids.
      - text: 'Salt’s compound status prevents removing it from water.'
        rationale: |
          This confuses separating a mixture with decomposing a compound. Salt is a compound. Check whether the goal is to remove it from water or split its elements.
      - text: 'Dissolving makes salt grains larger than the filter pores.'
        rationale: |
          This assumes invisible dissolved ions have become large trapped grains. Salt began as crystals. Check its present dissolved state.
    explanation: |
      Dissolved salt is dispersed as ions in water. Those ions pass through ordinary filter paper with the water. The filter therefore does not separate this true solution.
    approved: true

  - id: q-chemistry-mixtures-and-separation-0011
    type: 'compare-contrast'
    difficulty: 'medium'
    stem: |
      A student assumes that because saltwater looks completely uniform (homogeneous), it must be impossible to separate back into salt and water. Is this assumption correct?
    choices:
      - text: 'No; physical properties still allow separation.'
        correct: true
      - text: 'Yes; uniform composition makes separation impossible.'
        rationale: |
          This treats uniformity as permanent chemical combination. The sample looks like one substance. Check whether the components retain their identities.
      - text: 'No; saltwater is one compound rather than a mixture.'
        rationale: |
          This calls variable-composition saltwater a compound. It contains salt, which is itself a compound. Check the entire sample’s composition.
      - text: 'Yes; only visibly nonuniform mixtures can be separated.'
        rationale: |
          This excludes homogeneous mixtures from physical separation. Visible parts are easier to sort. Check whether volatility can distinguish dissolved components.
    explanation: |
      Salt and water retain distinct identities in solution. Their physical properties allow separation. Distillation can collect water while nonvolatile salt remains.
    approved: true

  - id: q-chemistry-mixtures-and-separation-0012
    type: 'cause-effect'
    difficulty: 'medium'
    stem: |
      At this composition, liquid A is more volatile than liquid B, and both enter the vapor during distillation. How does the condensed vapor compare with the starting liquid?
    choices:
      - text: 'It is enriched in A.'
        correct: true
      - text: 'It is enriched in B.'
        rationale: |
          This reverses the enrichment. Both components enter vapor. Check which is more volatile at the stated composition.
      - text: 'It contains only A until every A molecule is gone.'
        rationale: |
          This treats enrichment as exclusive evaporation. Lower-boiling examples are familiar. Check whether both volatile components contribute.
      - text: 'It must have exactly the starting liquid composition.'
        rationale: |
          This assumes vapor always copies the liquid ratio. Both phases contain the same components. Check the stated volatility difference.
    explanation: |
      For the stated mixture, A is more volatile. Both components contribute to the vapor, but the vapor has a larger proportion of A than the liquid. Condensing it enriches A.
    approved: true

  - id: q-chemistry-mixtures-and-separation-0013
    type: 'predict-outcome'
    difficulty: 'hard'
    stem: |
      During paper chromatography, one dye in a black ink sample travels much farther up the paper than another dye. What does this tell us about the faster-traveling dye?
    choices:
      - text: 'It moves more readily relative to retention.'
        correct: true
      - text: 'It must have weaker paper attraction regardless of solvent.'
        rationale: |
          This infers one stationary-phase attraction without considering solvent interaction. Weak retention can increase travel. Check both phases together.
      - text: 'Its solvent interaction alone determines every movement.'
        rationale: |
          This treats the solvent interaction as the only cause. Better carriage can increase travel. Check retention by the stationary phase too.
      - text: 'It necessarily has a higher boiling point than the other dye.'
        rationale: |
          This assigns distance solely to boiling point. Boiling point matters in distillation. Check the phase distribution governing chromatography.
    explanation: |
      The farther-traveling dye is carried more effectively by the mobile phase relative to its retention in the stationary phase. The result depends on interactions with both phases.
    approved: true

  - id: q-chemistry-mixtures-and-separation-0014
    type: 'compare-contrast'
    difficulty: 'medium'
    stem: |
      Dissolved components interact with the solvent while retaining their identities. Which conclusion is justified?
    choices:
      - text: 'Interactions can occur in a mixture.'
        correct: true
      - text: 'Every interaction creates a single new compound.'
        rationale: |
          This treats any interaction as forming a new pure substance. Chemical bonding can form compounds. Check whether composition and identities actually change.
      - text: 'Mixtures can have no intermolecular interactions.'
        rationale: |
          This treats retained identity as absence of every interaction. Mixtures remain mixtures. Check whether solvation can still occur.
      - text: 'Any uniform solution has a fixed chemical formula.'
        rationale: |
          This treats uniformity as fixed chemical composition. A solution looks consistent. Check whether its component proportions can vary.
    explanation: |
      Mixture components can interact through solvation or intermolecular forces while retaining their chemical identities. Interaction alone does not turn the mixture into one compound.
    approved: true

  - id: q-chemistry-mixtures-and-separation-0015
    type: 'predict-outcome'
    difficulty: 'exam'
    stem: |
      A laboratory sample contains suspended grit and a nonvolatile dissolved salt in water. Which sequence first removes grit without heating, then recovers water by condensation?
    choices:
      - text: 'Filtration, then distillation'
        correct: true
      - text: 'Chromatography, then evaporation'
        rationale: |
          This uses dye analysis and then lets vapor escape. Both are separation methods. Check the required grit-removal and water-collection stages.
      - text: 'Distillation, then filtration'
        rationale: |
          This reverses the requested stage order. Both named methods can be useful. Check that suspended grit must be removed first without heating.
      - text: 'Filtration with no further separation'
        rationale: |
          This stops after suspended particles are removed. The water looks clearer. Check that dissolved salt remains after ordinary filtration.
    explanation: |
      First, filtration removes suspended grit without heating. Second, distillation vaporizes and condenses water, separating it from the nonvolatile dissolved salt.
    approved: true

  - id: q-chemistry-mixtures-and-separation-0016
    type: 'structure-function'
    difficulty: 'easy'
    stem: |
      In paper chromatography, which phase moves in a definite direction?
    choices:
      - text: 'Mobile phase'
        correct: true
      - text: 'Stationary paper phase'
        rationale: |
          This reverses the phase roles. The paper supports the separation. Check which phase the solvent moves through.
      - text: 'The dry support before solvent is added'
        rationale: |
          This treats the support itself as the moving carrier. Paper is part of the setup. Check what moves after solvent is added.
      - text: 'Both phases must remain motionless throughout'
        rationale: |
          This removes the motion needed to carry components. Stationary sounds like the whole setup. Check which phase is specifically called mobile.
    explanation: |
      The mobile phase is the moving fluid. It carries components along the stationary phase as they distribute differently between them.
    approved: false

  - id: q-chemistry-mixtures-and-separation-0017
    type: 'process-ordering'
    difficulty: 'medium'
    stem: |
      Which sequence describes collection of a distillate?
    choices:
      - text: 'Vaporize, condense, collect'
        correct: true
      - text: 'Condense, vaporize, discard the vapor'
        rationale: |
          This reverses the phase-change order and loses the vapor. Both changes belong to distillation. Check that vapor exists before it can condense.
      - text: 'Filter, dry the retained solid, discard the fluid'
        rationale: |
          This follows a solid-filtration sequence. Collection is involved. Check whether a distillate comes from condensed vapor.
      - text: 'Evaporate to dryness, then collect escaping vapor later'
        rationale: |
          This lets vapor escape before collection. Evaporation can leave residue. Check whether the vapor must be captured as it forms.
    explanation: |
      Heating produces vapor. Cooling turns it into liquid. The liquid is collected as the distillate.
    approved: false

  - id: q-chemistry-mixtures-and-separation-0018
    type: 'predict-outcome'
    difficulty: 'hard'
    stem: |
      Two volatile liquids have close boiling behavior. Which method can improve their separation through repeated vaporization-condensation steps?
    choices:
      - text: 'Fractional distillation'
        correct: true
      - text: 'Ordinary single-pass filter paper'
        rationale: |
          This treats dissolved liquids as suspended particles. A filter is a separation tool. Check whether their volatility rather than size is the useful difference.
      - text: 'Evaporation without any vapor collection'
        rationale: |
          This loses the volatile material to the surroundings. Both components can evaporate. Check whether the separated vapor is recovered.
      - text: 'One simple vaporization guaranteed to give pure components'
        rationale: |
          This assumes one step always gives purity. Vapor is often enriched in one component. Check whether enrichment means complete separation.
    explanation: |
      Fractional distillation provides repeated vapor-liquid stages. Each suitable stage can enrich the more volatile component, improving separation.
    approved: false

  - id: q-chemistry-mixtures-and-separation-0019
    type: 'cause-effect'
    difficulty: 'hard'
    stem: |
      Why can an azeotrope limit ordinary distillation?
    choices:
      - text: 'Vapor and liquid compositions can match.'
        correct: true
      - text: 'All liquid components stop having any vapor pressure.'
        rationale: |
          This treats lack of further enrichment as lack of vaporization. Distillation heats the mixture. Check whether vapor still forms.
      - text: 'The mixture must become a single new chemical element.'
        rationale: |
          This treats equal phase composition as a chemical transformation. The mixture behaves in a special way. Check whether the components retain their identities.
      - text: 'Every molecule becomes too large to pass filter paper.'
        rationale: |
          This substitutes particle size for vapor-liquid equilibrium. Filter size affects another technique. Check which phases distillation compares.
    explanation: |
      At an azeotropic composition, vapor and liquid have the same composition. Condensing that vapor does not change the component ratio at that point.
    approved: false

  - id: q-chemistry-mixtures-and-separation-0020
    type: 'compare-contrast'
    difficulty: 'exam'
    stem: |
      A dissolved solid is needed with improved purity. Why might controlled recrystallization be preferable to simply evaporating everything to dryness?
    choices:
      - text: 'Some impurities can remain in solution.'
        correct: true
      - text: 'Every impurity always joins the desired crystals.'
        rationale: |
          This assumes crystallization captures every dissolved substance together. Evaporation to dryness can retain impurities. Check which substances stay dissolved during controlled crystallization.
      - text: 'Recrystallization requires changing the solid’s chemical identity.'
        rationale: |
          This treats physical purification as a required reaction. The solid changes form. Check whether chemical identity must change.
      - text: 'Evaporation always leaves only the pure desired substance.'
        rationale: |
          This assumes solvent removal guarantees purity. A dry residue looks isolated. Check whether nonvolatile impurities also remain.
    explanation: |
      Recrystallization uses differences in solubility. Under suitable conditions the desired solid forms crystals while some impurities remain dissolved.
    approved: false
