meta:
  subject: science
  topic: chemistry
  subtopic: chemical-bonding
  exams: [upcat, dlsucet, ustet, dost-sei]
questions:
  - id: q-chemistry-chemical-bonding-0001
    type: 'classify'
    difficulty: 'easy'
    stem: |
      Which dominant bonding model describes crystalline $NaCl$?
    choices:
      - text: 'Ionic'
        correct: true
      - text: 'Polar covalent'
        rationale: |
          This treats the lattice as shared electron density between discrete pairs. Polar bonds also involve unequal charge distribution. Check whether the structure is an ion lattice.
      - text: 'Metallic'
        rationale: |
          This applies elemental-metal bonding to a salt. Sodium is a metal, so the model seems familiar. Check whether the solid contains oppositely charged ions.
      - text: 'Nonpolar covalent'
        rationale: |
          This treats the attraction as nearly equal electron sharing. Both models hold particles together. Check whether NaCl is a lattice of ions or a nonpolar molecule.
    explanation: |
      Crystalline sodium chloride contains positive and negative ions in an extended lattice. Their electrical attraction holds the solid together.
    approved: true

  - id: q-chemistry-chemical-bonding-0002
    type: 'classify'
    difficulty: 'easy'
    stem: |
      Carbon and oxygen, both nonmetals, bond together to form $CO_2$. What type of bond is this?
    choices:
      - text: 'Covalent'
        correct: true
      - text: 'Ionic lattice'
        rationale: |
          This confuses bonds inside a molecule with an extended ion lattice. Oxygen can occur in ionic compounds too. Check the molecular structure specified here.
      - text: 'Metallic bonding'
        rationale: |
          This substitutes a metal’s delocalized-electron model. Electrons are involved in both models. Check whether the substance is an elemental metal.
      - text: 'Only electrostatic ion attraction'
        rationale: |
          This assumes the atoms have become separate oppositely charged ions. Oxygen attracts electrons strongly. Check whether shared density remains between the bonded nuclei.
    explanation: |
      Within a carbon dioxide molecule, bonded atoms share electron density. That shared density is attracted by both nuclei, which is covalent bonding.
    approved: true

  - id: q-chemistry-chemical-bonding-0003
    type: 'classify'
    difficulty: 'easy'
    stem: |
      A bar of pure copper is made entirely of copper atoms bonded to each other. What type of bond holds it together?
    choices:
      - text: 'Metallic'
        correct: true
      - text: 'Ionic lattice'
        rationale: |
          This treats the solid as a lattice of positive and negative ions. Metal particles can be described with positive cores. Check whether the negative charge is in anions or delocalized electrons.
      - text: 'Localized covalent pairs'
        rationale: |
          This restricts the bonding to isolated shared pairs. Sharing electrons is a familiar bond model. Check whether the electrons extend through the solid.
      - text: 'Only attraction between separate molecules'
        rationale: |
          This treats a metal as a molecular solid. Attractions between molecules hold some solids together. Check whether copper consists of separate molecules or a metallic lattice.
    explanation: |
      Copper is held together by metallic bonding. Valence electrons are spread through the solid and help hold the metal particles together.
    approved: true

  - id: q-chemistry-chemical-bonding-0004
    type: 'classify'
    difficulty: 'medium'
    stem: |
      An electronegativity difference of 0.4 is used only as a rough guide. Which description is best supported?
    choices:
      - text: 'Nearly equal or weakly polar sharing'
        correct: true
      - text: 'Complete electron transfer in every compound'
        rationale: |
          This turns a small difference into complete transfer. Unequal attraction does affect sharing. Check whether the difference is large or small.
      - text: 'Strongly ionic behavior with no possible exception'
        rationale: |
          This treats an approximate guide as an exception-free law. Textbook cutoffs can look exact. Check the lesson’s warning about a bonding continuum.
      - text: 'Metallic bonding determined by this number alone'
        rationale: |
          This uses one difference value to define metallic structure. Metal atoms may have similar values. Check the actual substance and its electron model.
    explanation: |
      A small electronegativity difference suggests nearly equal sharing or weak polarity. The boundary is approximate. Bonding classification may also depend on the actual compound.
    approved: true

  - id: q-chemistry-chemical-bonding-0005
    type: 'classify'
    difficulty: 'medium'
    stem: |
      HF has an electronegativity difference near 1.9 but is described as polar covalent. What does this example show?
    choices:
      - text: 'Numeric cutoffs have exceptions.'
        correct: true
      - text: 'Any difference above 1.8 guarantees an ionic lattice.'
        rationale: |
          This applies a rough boundary as a guarantee. The value exceeds a familiar cutoff. Check whether the stated compound is an exception.
      - text: 'Polar covalent bonds require zero electronegativity difference.'
        rationale: |
          This confuses polar sharing with equal sharing. Both are covalent. Check whether a polar bond has unequal attraction.
      - text: 'A compound’s structure never matters to bond classification.'
        rationale: |
          This ignores evidence beyond the number. A single cutoff is easy to use. Check whether structure and actual bonding behavior also matter.
    explanation: |
      HF is a polar covalent example despite a difference above some classroom cutoffs. Electronegativity difference is a guide. It is not an absolute definition of bonding.
    approved: true

  - id: q-chemistry-chemical-bonding-0006
    type: 'classify'
    difficulty: 'medium'
    stem: |
      Two bonded atoms share electrons, but one attracts the shared density more strongly. Which description fits?
    choices:
      - text: 'Polar covalent'
        correct: true
      - text: 'Nonpolar covalent'
        rationale: |
          This ignores the unequal attraction. Both descriptions involve sharing. Check whether the sharing is nearly equal or clearly uneven.
      - text: 'Metallic electron sea'
        rationale: |
          This substitutes electrons delocalized through a metal for sharing in a bond. Both involve mobile electron density. Check whether the setup names a metal solid or two bonded atoms.
      - text: 'Only an ionic crystal lattice'
        rationale: |
          This treats unequal sharing as proof of a separate ion lattice. Strongly unequal attraction can suggest ionic character. Check whether the stem still describes shared density.
    explanation: |
      A covalent bond shares electron density. Unequal attraction makes that shared density unevenly distributed. This is polar covalent bonding.
    approved: true

  - id: q-chemistry-chemical-bonding-0007
    type: 'classify'
    difficulty: 'medium'
    stem: |
      A central atom has 2 electron groups around it, with no lone pairs. What molecular shape does VSEPR theory predict?
    choices:
      - text: 'Linear'
        correct: true
      - text: 'Trigonal planar'
        rationale: |
          This uses the arrangement for three groups. A planar shape can seem suitable for any small group count. Check the number of electron regions.
      - text: 'Tetrahedral'
        rationale: |
          This uses the arrangement for four groups. Groups do repel and spread in space. Check how many regions need positions.
      - text: 'Bent'
        rationale: |
          This assumes an unmentioned lone-pair influence. Many familiar two-bond molecules are bent. Check whether the stem gives any lone pairs.
    explanation: |
      Two electron groups spread in opposite directions around the central atom. With both groups bonded to atoms and no lone pairs, the molecular shape is linear, with an ideal angle of $180^\circ$.
    approved: true

  - id: q-chemistry-chemical-bonding-0008
    type: 'classify'
    difficulty: 'medium'
    stem: |
      A central atom is bonded to three other atoms: one through a double bond and two through single bonds. It has no lone pairs. What electron-group geometry is predicted?
    choices:
      - text: 'Trigonal planar'
        correct: true
      - text: 'Tetrahedral arrangement'
        rationale: |
          This counts the double bond as two groups. Four drawn bond lines can look like four regions. Check that one bond axis counts once.
      - text: 'Linear arrangement'
        rationale: |
          This counts only the single bonds. Single lines can be easier to notice than a multiple bond. Check every bonded-atom direction.
      - text: 'Bent molecular form'
        rationale: |
          This adds a lone-pair-shaped molecular label. Two single bonds are present, so water may come to mind. Check the third bonded atom and the absence of lone pairs.
    explanation: |
      Each bond axis counts as one electron group, even for a double bond. There are three groups. They form a trigonal planar electron-group arrangement.
    approved: true

  - id: q-chemistry-chemical-bonding-0009
    type: 'classify'
    difficulty: 'medium'
    stem: |
      Which ideal geometry has four bonding directions spread in three dimensions at angles of about $109.5^\circ$?
    choices:
      - text: 'Tetrahedral'
        correct: true
      - text: 'Trigonal planar'
        rationale: |
          This chooses the flat arrangement for three groups. Both names describe symmetric shapes. Check the given number of directions and angle.
      - text: 'Linear'
        rationale: |
          This chooses two opposite directions. A straight arrangement maximizes separation for two groups. Check whether four directions are specified.
      - text: 'Bent'
        rationale: |
          This chooses a two-bond molecular shape. Bent molecules can have compressed angles. Check whether the stem describes four symmetric bonding directions.
    explanation: |
      Four bonding directions spread through three dimensions in a tetrahedral arrangement. Its ideal angle is about $109.5^\circ$.
    approved: true

  - id: q-chemistry-chemical-bonding-0010
    type: 'classify'
    difficulty: 'hard'
    stem: |
      Water has two bonding groups and two lone pairs around oxygen. Which pair gives its electron-group geometry and molecular geometry?
    choices:
      - text: 'Tetrahedral; bent'
        correct: true
      - text: 'Tetrahedral; tetrahedral'
        rationale: |
          This treats lone pairs as bonded-atom positions. All four groups do affect repulsion. Check whether molecular shape names electron groups or atoms.
      - text: 'Linear; linear'
        rationale: |
          This counts the two bonds and ignores the lone pairs. Two bonding groups may suggest a line. Check the total electron-group count first.
      - text: 'Trigonal planar; bent'
        rationale: |
          This omits one of the four groups. Three-group geometry is a familiar intermediate case. Check that both lone pairs count.
    explanation: |
      Water has four electron groups, giving a tetrahedral electron-group arrangement. Molecular geometry describes the atom positions. With two bonded hydrogen atoms, water’s molecular shape is bent.
    approved: true

  - id: q-chemistry-chemical-bonding-0011
    type: 'compare-contrast'
    difficulty: 'hard'
    stem: |
      A student claims that covalent bonds always share electrons equally between the two atoms. Is this claim correct?
    choices:
      - text: 'Covalent sharing can be unequal.'
        correct: true
      - text: 'Every covalent bond shares density exactly equally.'
        rationale: |
          This applies the nonpolar case to every covalent bond. Sharing can sound like equal division. Check whether the two atoms attract the electrons equally.
      - text: 'Any unequal attraction proves complete electron transfer.'
        rationale: |
          This turns uneven sharing into a completely ionic description. A large imbalance can suggest transfer. Check whether density is still shared between nuclei.
      - text: 'Only elemental metals can share any electron density.'
        rationale: |
          This restricts sharing to metallic bonding. Metals do have delocalized electrons. Check whether covalent bonds also share density.
    explanation: |
      Covalent bonds share electron density. Different attractions by the bonded atoms can make that sharing unequal. Unequal sharing produces bond polarity.
    approved: true

  - id: q-chemistry-chemical-bonding-0012
    type: 'structure-function'
    difficulty: 'medium'
    stem: |
      Why is "formula unit" generally preferable to "molecule" for the simplest composition ratio of an ionic solid?
    choices:
      - text: 'Its ions form an extended lattice.'
        correct: true
      - text: 'Each cation has exactly one permanently assigned anion.'
        rationale: |
          This treats ionic bonding as a fixed partnership between one pair. Formula ratios can resemble paired units. Check whether attractions extend through the lattice.
      - text: 'The solid consists of separate neutral covalent molecules.'
        rationale: |
          This substitutes a molecular model for a typical ionic solid. A chemical formula can look like a molecule formula. Check whether the structure is an ion lattice.
      - text: 'Its ions have no attractions beyond an isolated pair.'
        rationale: |
          This restricts electrical attraction to one pair. Two opposite charges do attract. Check whether each ion also interacts with surrounding ions.
    explanation: |
      An ionic solid is an extended lattice of interacting ions. A formula unit states the simplest ion ratio in that lattice.
    approved: true

  - id: q-chemistry-chemical-bonding-0013
    type: 'classify'
    difficulty: 'medium'
    stem: |
      For basic VSEPR counting, how many electron groups does a triple bond contribute around a central atom?
    choices:
      - text: 'One group'
        correct: true
      - text: 'Three groups'
        rationale: |
          This counts each bond line separately. A triple bond is drawn with three lines. Check that VSEPR counts regions, not lines.
      - text: 'Two groups'
        rationale: |
          This counts the additional lines beyond a single bond. Two extra lines can seem like extra groups. Check the full bond axis as one region.
      - text: 'No groups'
        rationale: |
          This counts only single bonds. Multiple bonds look different in Lewis structures. Check that every bond axis contributes a group.
    explanation: |
      A triple bond follows one direction between two atoms. Basic VSEPR counts that bond axis as one electron-density group.
    approved: true

  - id: q-chemistry-chemical-bonding-0014
    type: 'cause-effect'
    difficulty: 'medium'
    stem: |
      Why do atoms bond together with other atoms in the first place?
    choices:
      - text: 'A lower-energy bonded arrangement can form.'
        correct: true
      - text: 'A universal octet must form in every bonded species.'
        rationale: |
          This treats a useful main-group guideline as a universal cause. Many simple Lewis structures do satisfy octets. Check the lesson’s duet, odd-electron, and other exceptions.
      - text: 'Bond formation always raises the system’s energy.'
        rationale: |
          This reverses the energy change for stable bond formation. Breaking a bond does require energy. Check whether the process forms a bond or breaks one.
      - text: 'Every atom must gain electrons before it can bond.'
        rationale: |
          This applies electron gain to every bonding model. Some ions do form by gaining electrons. Check whether sharing or electron loss can also occur.
    explanation: |
      Bonding occurs when the nuclei and electrons can form a lower-energy arrangement under the relevant conditions. Lower energy helps make the bonded arrangement stable.
    approved: true

  - id: q-chemistry-chemical-bonding-0015
    type: 'predict-outcome'
    difficulty: 'exam'
    stem: |
      A central atom has 3 bonding electron groups and 1 lone pair (4 total electron groups). Using the same reasoning that makes water's shape bent instead of tetrahedral, what can you predict about this molecule's shape?
    choices:
      - text: 'The molecular shape is not tetrahedral.'
        correct: true
      - text: 'Lone pairs never change molecular geometry.'
        rationale: |
          This removes the influence of a lone pair. Lone pairs do not mark atom positions, which can suggest they do not matter. Check whether their electron density still repels bonding groups.
      - text: 'Only two groups count, giving a linear shape.'
        rationale: |
          This miscounts both bond regions and lone pairs. A straight shape is familiar for small counts. Check the three bonds plus the one lone pair.
      - text: 'Only the three bonds count, giving a planar shape.'
        rationale: |
          This ignores the lone pair when arranging the groups. Three bonding regions alone suggest a planar arrangement. Check the total electron-group count before naming molecular shape.
    explanation: |
      All four electron groups affect the arrangement. One group is a lone pair, leaving only three bonded-atom positions. Molecular shape describes those three atom positions, so it is not a four-atom tetrahedron.
    approved: true

  - id: q-chemistry-chemical-bonding-0016
    type: 'identify'
    difficulty: 'easy'
    stem: |
      Which statement describes a Lewis structure?
    choices:
      - text: 'Valence-electron bookkeeping'
        correct: true
      - text: 'Exact paths followed by orbiting electrons'
        rationale: |
          This treats the drawing as an electron trajectory. Dots and lines can look like literal positions. Check whether the model records electrons or traces motion.
      - text: 'A complete map of all nuclear particles'
        rationale: |
          This confuses bonding electrons with nuclear structure. Both are parts of atoms. Check which particles the Lewis model represents.
      - text: 'A guaranteed scale drawing of molecular shape'
        rationale: |
          This treats a bonding diagram as an exact three-dimensional shape. Bond lines suggest a layout. Check whether a separate geometry model is needed.
    explanation: |
      A Lewis structure keeps track of valence electrons, bonds, lone pairs, and formal charges. It is a model for this information.
    approved: false

  - id: q-chemistry-chemical-bonding-0017
    type: 'classify'
    difficulty: 'medium'
    stem: |
      Which atom follows a duet rather than an octet in simple Lewis structures?
    choices:
      - text: 'Hydrogen'
        correct: true
      - text: 'Carbon atom'
        rationale: |
          This assigns hydrogen’s exception to a common octet example. Carbon forms several bonds. Check which atom the lesson identifies with a duet.
      - text: 'Nitrogen atom'
        rationale: |
          This confuses a lone pair with a two-electron shell limit. Nitrogen often has lone pairs. Check whether the total represented valence-shell count is two or eight.
      - text: 'Fluorine atom'
        rationale: |
          This confuses one bonding pair with the whole electron shell. Fluorine often forms one bond. Check the additional lone pairs in its usual Lewis pattern.
    explanation: |
      Hydrogen follows a duet rule in simple Lewis structures. Its usual bonding pattern is represented by two electrons in its first shell.
    approved: false

  - id: q-chemistry-chemical-bonding-0018
    type: 'cause-effect'
    difficulty: 'medium'
    stem: |
      How do delocalized electrons help explain a metal’s electrical conductivity?
    choices:
      - text: 'They can move through the solid.'
        correct: true
      - text: 'They are fixed permanently between one isolated pair.'
        rationale: |
          This localizes the electrons that explain conductivity. Shared pairs are a familiar bonding picture. Check whether electrons can move beyond one pair.
      - text: 'They carry current only after the metal melts.'
        rationale: |
          This applies the mobility rule for ionic solids to metals. Melting can free ions in a salt. Check whether electrons in a metal are already mobile in the solid.
      - text: 'They conduct only between two bonded neighbors.'
        rationale: |
          This limits delocalized electrons to one neighboring pair. Bond drawings often connect just two atoms. Check whether the electrons extend through the whole solid.
    explanation: |
      Delocalized valence electrons are spread through a metal. Their movement can carry electrical charge through the solid.
    approved: false

  - id: q-chemistry-chemical-bonding-0019
    type: 'predict-outcome'
    difficulty: 'hard'
    stem: |
      In VSEPR, how do lone pairs usually affect nearby bond angles compared with an ideal arrangement of bonding groups only?
    choices:
      - text: 'They compress nearby bond angles.'
        correct: true
      - text: 'They always expand every angle to 180 degrees.'
        rationale: |
          This makes greater repulsion mean every angle becomes a straight line. Spreading apart is the basic VSEPR idea. Check how a lone pair pushes the remaining bonding groups.
      - text: 'They remove all repulsion between bonding groups.'
        rationale: |
          This treats the lone pair as a shield against all repulsion. Its added density changes the arrangement. Check whether electron groups still repel.
      - text: 'They have no effect because no atom is attached.'
        rationale: |
          This confuses absence of a bonded atom with absence of electron density. Molecular shape names atoms. Check whether a lone pair still affects the electron arrangement.
    explanation: |
      Lone pairs usually repel more strongly than bonding groups. This can push bonding groups closer together and make nearby bond angles smaller.
    approved: false

  - id: q-chemistry-chemical-bonding-0020
    type: 'compare-contrast'
    difficulty: 'exam'
    stem: |
      Why may several resonance structures be used for one species?
    choices:
      - text: 'To represent delocalized electron density.'
        correct: true
      - text: 'The species contains a different nucleus for each drawing.'
        rationale: |
          This changes nuclei when the model concerns electrons. Several drawings look like several arrangements. Check whether the atom framework or electron bookkeeping changes.
      - text: 'The molecule changes from one drawing to the next.'
        rationale: |
          This treats drawings as molecules taking turns. Multiple diagrams can resemble successive stages. Check whether they are representations of one delocalized structure.
      - text: 'Resonance removes the need to conserve valence electrons.'
        rationale: |
          This treats several drawings as permission to change electron totals. Bond placement may vary. Check that each valid structure uses the species’ valence-electron count.
    explanation: |
      Some species have electron density spread beyond the pattern in one Lewis drawing. Several resonance drawings help represent that distribution. They describe one species.
    approved: false
