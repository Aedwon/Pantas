meta:
  subject: science
  topic: chemistry
  subtopic: mole-concept
  exams: ["upcat", "dlsucet", "ustet", "dost-sei"]
questions:
  - id: q-chemistry-mole-concept-0001
    type: 'simple-quantitative'
    difficulty: 'easy'
    stem: |
      Using element molar masses H = 1 g/mol and O = 16 g/mol, find the molar mass of $H_2O$.
    choices:
      - text: '18 g/mol'
        correct: true
      - text: '17 g/mol'
        rationale: |
          This counts only one hydrogen. The symbol H appears once. Check its subscript.
      - text: '16 g/mol'
        rationale: |
          This uses oxygen’s contribution alone. Oxygen is much heavier. Check that every element is included.
      - text: '19 g/mol'
        rationale: |
          This counts three hydrogens. Water has three atoms in total. Check which element has the subscript 2.
    explanation: |
      Water’s formula contains two hydrogens and one oxygen. Using the given molar-mass contributions, $M=2(1)+16=18$ g/mol.
    approved: true

  - id: q-chemistry-mole-concept-0002
    type: 'simple-quantitative'
    difficulty: 'easy'
    stem: |
      When finding $CO_2$ molar mass from element molar masses, which contribution is multiplied by 2?
    choices:
      - text: 'Oxygen’s contribution'
        correct: true
      - text: 'Carbon’s contribution'
        rationale: |
          This assigns oxygen’s subscript to carbon. Carbon is first in the formula. Check which symbol the 2 follows.
      - text: 'Both carbon and oxygen contributions'
        rationale: |
          This treats the subscript as applying to the entire formula. Both elements are present. Check whether parentheses group them.
      - text: 'Neither element’s molar-mass contribution'
        rationale: |
          This ignores subscripts in molar-mass calculation. Adding each element once is simple. Check the represented atom counts.
    explanation: |
      The subscript 2 belongs to oxygen. Its molar-mass contribution must be multiplied by 2, while carbon’s contribution is counted once.
    approved: true

  - id: q-chemistry-mole-concept-0003
    type: 'simple-quantitative'
    difficulty: 'medium'
    stem: |
      How many moles are in 54 grams of water (molar mass 18 g/mol)?
    choices:
      - text: '3 mol'
        correct: true
      - text: '2.0 mol'
        rationale: |
          This treats each mole as 27 g instead of the given 18 g. The sample mass is 54 g. Check the supplied mass per mole.
      - text: '36 mol'
        rationale: |
          This subtracts 18 from 54. Both numbers describe mass-related quantities. Check that division cancels the gram units.
      - text: '0.33 mol'
        rationale: |
          This divides molar mass by sample mass. Both belong in the calculation. Check which order gives mol rather than inverse mol.
    explanation: |
      Amount equals mass divided by molar mass. $n=\dfrac{54\,\mathrm g}{18\,\mathrm{g/mol}}=3$ mol.
    approved: true

  - id: q-chemistry-mole-concept-0004
    type: 'simple-quantitative'
    difficulty: 'medium'
    stem: |
      Using $N_A=6.022\times10^{23}\,\mathrm{mol^{-1}}$ for this calculation, how many water molecules are in 3 mol?
    choices:
      - text: '$1.8066\times10^{24}$ molecules'
        correct: true
      - text: '$6.022\times10^{23}$ molecules'
        rationale: |
          This reports the count for one mole. Avogadro’s value is familiar. Check the actual mole amount.
      - text: '$1.8066\times10^{23}$ molecules'
        rationale: |
          This moves the decimal left without raising the exponent. Scientific notation needs one leading digit. Check that rescaling preserves the value.
      - text: '$3\times10^{23}$ molecules'
        rationale: |
          This omits the factor 6.022. The exponent is memorable. Check the whole supplied constant.
    explanation: |
      Use $N=nN_A$. With the stated rounded constant, $N=3(6.022\times10^{23})=18.066\times10^{23}=1.8066\times10^{24}$ molecules.
    approved: true

  - id: q-chemistry-mole-concept-0005
    type: 'simple-quantitative'
    difficulty: 'hard'
    stem: |
      Using 18 g/mol for water and $N_A=6.022\times10^{23}\,\mathrm{mol^{-1}}$, how many molecules are in 45 g water?
    choices:
      - text: '$1.5055\times10^{24}$ molecules'
        correct: true
      - text: '2.5 molecules'
        rationale: |
          This labels the mole amount as a molecule count. The division gives 2.5. Check the unit before multiplying by N_A.
      - text: '$6.022\times10^{23}$ molecules'
        rationale: |
          This gives the count for one mole. Avogadro’s number is familiar. Check how much substance the mass represents.
      - text: '$2.7099\times10^{25}$ molecules'
        rationale: |
          This multiplies grams by N_A directly, giving about $2.7099\times10^{25}$. Mass is the starting quantity. Check whether the molar-mass factor is included.
    explanation: |
      First find $n=45/18=2.5$ mol. Then $N=2.5(6.022\times10^{23})=1.5055\times10^{24}$ molecules using the supplied constant.
    approved: true

  - id: q-chemistry-mole-concept-0006
    type: 'classify'
    difficulty: 'hard'
    stem: |
      Is a one-line grams-to-entities calculation using the factor $N_A/M$ valid, with M in g/mol?
    choices:
      - text: 'Yes; its units cancel correctly.'
        correct: true
      - text: 'No; moles must always be written as a separate step.'
        rationale: |
          This insists the intermediate must be written separately. Two-step teaching is common. Check whether a combined factor cancels units correctly.
      - text: 'No; only N_A may appear in an entity conversion.'
        rationale: |
          This uses N_A alone to convert grams. It connects moles and entities. Check the missing molar-mass factor.
      - text: 'Yes; but only for gas-phase substances.'
        rationale: |
          This restricts the conversion to gases. Gas calculations often use moles. Check whether the mole definition depends on state.
    explanation: |
      The combined conversion is $N=m\dfrac{N_A}{M}$. Mass in grams cancels the grams in molar mass, and the mole units cancel too. A separately written intermediate mole amount is not required.
    approved: true

  - id: q-chemistry-mole-concept-0007
    type: 'identify'
    difficulty: 'hard'
    stem: |
      Which unit describes molar mass when sample mass is measured in grams?
    choices:
      - text: 'g/mol'
        correct: true
      - text: 'mol/g'
        rationale: |
          This uses the reciprocal of mass per amount. Both grams and moles belong in the relation. Check which is the numerator.
      - text: 'g alone'
        rationale: |
          This drops the amount unit. A mole has a mass in grams. Check that molar mass is a ratio, not a sample mass.
      - text: 'entities alone'
        rationale: |
          This reports a count of entities rather than mass per amount. The mole connects quantities. Check which property is requested.
    explanation: |
      Molar mass is mass divided by amount of substance. Grams divided by moles gives the unit g/mol.
    approved: true

  - id: q-chemistry-mole-concept-0008
    type: 'classify'
    difficulty: 'medium'
    stem: |
      Which distinction between relative atomic mass and molar mass is correct?
    choices:
      - text: 'Atomic ratio versus mass per mole'
        correct: true
      - text: 'Identical quantities with identical units'
        rationale: |
          This treats similar numbers as identical units. Introductory tables connect them. Check their definitions and units.
      - text: 'Both are integer nucleon counts for a nuclide'
        rationale: |
          This calls a weighted atomic quantity an integer nucleon count. Mass number is an integer. Check whether an isotope average is involved.
      - text: 'Both are the gram mass of one individual atom'
        rationale: |
          This treats molar mass as one atom’s gram mass. Both relate to mass. Check whether the amount is one atom or one mole.
    explanation: |
      Relative atomic mass is an isotope-weighted atomic-scale ratio. Molar mass is mass per mole, often in g/mol. Similar numerical values do not make them the same physical quantity.
    approved: true

  - id: q-chemistry-mole-concept-0009
    type: 'classify'
    difficulty: 'medium'
    stem: |
      Which statement correctly describes the modern SI Avogadro constant?
    choices:
      - text: '$6.02214076\times10^{23}\,\mathrm{mol^{-1}}$ exactly'
        correct: true
      - text: '$6.022\times10^{23}\,\mathrm{mol^{-1}}$ exactly'
        rationale: |
          This calls a rounded value exact. The four-digit form is widely used. Check all digits in the defining value.
      - text: '$6.02214076\times10^{24}\,\mathrm{mol^{-1}}$ exactly'
        rationale: |
          This uses an exponent one power too large. The leading digits look familiar. Check the exponent in the SI definition.
      - text: 'It still has measurement uncertainty in the SI definition.'
        rationale: |
          This treats a defining constant as uncertain. Constants were historically measured. Check the current exact definition.
    explanation: |
      The SI fixes $N_A$ exactly at $6.02214076\times10^{23}\,\mathrm{mol^{-1}}$. Shorter decimal forms are rounded representations.
    approved: true

  - id: q-chemistry-mole-concept-0010
    type: 'simple-quantitative'
    difficulty: 'medium'
    stem: |
      A 2 mol sample of $NaCl$ has mass 117 g. What molar mass follows from these data?
    choices:
      - text: '58.5 g/mol'
        correct: true
      - text: '35.5 g/mol'
        rationale: |
          This omits sodium’s contribution and copies chlorine’s familiar molar mass. Chloride is present. Check the entire measured mass per mole.
      - text: '46 g/mol'
        rationale: |
          This doubles sodium’s molar mass instead of using the sample ratio. Sodium is in the formula. Check what 117 g and 2 mol describe.
      - text: '23 g/mol'
        rationale: |
          This copies sodium’s molar mass alone. Sodium is one component. Check that the sample is the whole compound.
    explanation: |
      Molar mass equals mass divided by amount. $M=\dfrac{117\,\mathrm g}{2\,\mathrm{mol}}=58.5$ g/mol.
    approved: true

  - id: q-chemistry-mole-concept-0011
    type: 'compare-contrast'
    difficulty: 'hard'
    stem: |
      Compare 1 mol of water molecules and 1 mol of NaCl formula units, using molar masses 18 and 58.5 g/mol.
    choices:
      - text: 'Equal entity counts; different masses'
        correct: true
      - text: 'Equal entity counts and equal gram masses'
        rationale: |
          This treats equal moles as equal grams. Both amounts use mol units. Check each substance’s mass per mole.
      - text: 'More NaCl formula units because its molar mass is greater'
        rationale: |
          This assigns more entities to the heavier sample. NaCl has greater molar mass. Check what one mole counts.
      - text: 'More water molecules because its molar mass is smaller'
        rationale: |
          This assigns more entities to the lighter sample. Water molecules weigh less. Check that the specified mole counts are already equal.
    explanation: |
      One mole of water has mass 18 g, and one mole of NaCl has mass 58.5 g. Equal mole amounts therefore have equal specified entity counts but different masses.
    approved: true

  - id: q-chemistry-mole-concept-0012
    type: 'simple-quantitative'
    difficulty: 'exam'
    stem: |
      What ion amounts are represented by 2 mol of NaCl formula units?
    choices:
      - text: '2 mol sodium ions and 2 mol chloride ions'
        correct: true
      - text: '1 mol sodium ions and 1 mol chloride ions'
        rationale: |
          This splits the amount between the two ion types. There are two types in each unit. Check each type’s one-per-unit ratio.
      - text: '4 mol sodium ions and 4 mol chloride ions'
        rationale: |
          This adds both ion types and assigns the total to each one. Four moles of ions are represented overall. Check each type separately.
      - text: '2 mol of each element’s neutral atoms and no ions'
        rationale: |
          This treats formula units as containing no ions. A unit is not a discrete molecule. Check what the ionic formula ratio represents.
    explanation: |
      One NaCl formula unit represents one sodium ion and one chloride ion. Two moles of formula units therefore represent 2 mol of each ion.
    approved: true

  - id: q-chemistry-mole-concept-0013
    type: 'simple-quantitative'
    difficulty: 'exam'
    stem: |
      For glucose, $C_6H_{12}O_6$, use element molar masses C = 12, H = 1, and O = 16 g/mol. Find its molar mass.
    choices:
      - text: '180 g/mol'
        correct: true
      - text: '96 g/mol'
        rationale: |
          This includes only oxygen’s $6(16)$ contribution. Oxygen is the largest contribution. Check every element.
      - text: '168 g/mol'
        rationale: |
          This adds carbon and oxygen but omits the 12 hydrogens. Their individual mass is small. Check that their total still counts.
      - text: '84 g/mol'
        rationale: |
          This includes carbon and hydrogen but omits oxygen. The first two terms sum to 84. Check all three element symbols.
    explanation: |
      Use each subscript: $6(12)+12(1)+6(16)=72+12+96=180$ g/mol.
    approved: true

  - id: q-chemistry-mole-concept-0014
    type: 'predict-outcome'
    difficulty: 'medium'
    stem: |
      A nonzero sample has less mass than one mole of its substance. What follows about its amount?
    choices:
      - text: 'There is less than 1 mole present.'
        correct: true
      - text: 'There is exactly 1 mole present.'
        rationale: |
          This assigns a full mole to a smaller mass. One-mole mass is known. Check whether the masses are equal.
      - text: 'There is more than 1 mole present.'
        rationale: |
          This reverses how amount depends on mass. Larger samples have more moles. Check whether this sample is smaller.
      - text: 'Nothing can be concluded without doing the division.'
        rationale: |
          This assumes an exact quotient is needed for a comparison. Division gives the exact amount. Check whether the relative mass already determines the side of 1 mol.
    explanation: |
      One mole has mass M when molar mass is M g/mol. A smaller positive sample mass gives $n=m/M<1$ mol.
    approved: true

  - id: q-chemistry-mole-concept-0015
    type: 'identify'
    difficulty: 'easy'
    stem: |
      In 1 mol of crystalline NaCl, which entity is normally being counted?
    choices:
      - text: 'Formula units'
        correct: true
      - text: 'Separate NaCl molecules in the crystal'
        rationale: |
          This treats an ionic lattice as discrete molecules. The formula resembles a molecular formula. Check the crystal’s extended structure.
      - text: 'Only sodium nuclei, with no chloride counted'
        rationale: |
          This counts only one part of the formula. Sodium is present. Check the full specified NaCl entity.
      - text: 'Only chloride ions, with no sodium represented'
        rationale: |
          This counts only the anion. Chloride is present. Check that each formula unit also represents sodium.
    explanation: |
      Crystalline NaCl is an ion lattice. Its formula units state the simplest sodium-to-chloride ratio used to count the substance.
    approved: false

  - id: q-chemistry-mole-concept-0016
    type: 'simple-quantitative'
    difficulty: 'medium'
    stem: |
      A sample contains $3.01107038\times10^{23}$ specified entities. Using exact $N_A$, what is its amount?
    choices:
      - text: '0.5 mol'
        correct: true
      - text: '2.0 mol'
        rationale: |
          This inverts the ratio. Both counts are in the calculation. Check that less than one mole’s entity count gives less than one mole.
      - text: '1.0 mol'
        rationale: |
          This assumes any large entity count is one mole. The exponent is familiar. Check the leading coefficient.
      - text: '0.5 g'
        rationale: |
          This gives a mass unit for an amount calculation. Grams are used in other conversions. Check the requested quantity.
    explanation: |
      Use $n=N/N_A$. The entity count is half of $6.02214076\times10^{23}$, so $n=0.5$ mol.
    approved: false

  - id: q-chemistry-mole-concept-0017
    type: 'simple-quantitative'
    difficulty: 'medium'
    stem: |
      Using a molar mass of 18 g/mol, what mass is 0.25 mol water?
    choices:
      - text: '4.5 g'
        correct: true
      - text: '72 g'
        rationale: |
          This divides 18 by 0.25 instead of multiplying. Division finds moles from mass in another setup. Check which variable is unknown.
      - text: '18.25 g'
        rationale: |
          This adds amount to molar mass. Both given numbers are used. Check whether their units can be added.
      - text: '0.25 g'
        rationale: |
          This treats moles as grams. The amount is 0.25. Check the mass-per-mole conversion factor.
    explanation: |
      Use $m=nM$. Multiply $0.25\,\mathrm{mol}$ by $18\,\mathrm{g/mol}$ to obtain 4.5 g.
    approved: false

  - id: q-chemistry-mole-concept-0018
    type: 'simple-quantitative'
    difficulty: 'hard'
    stem: |
      How many moles of oxygen atoms are represented by 1 mol of $O_2$ molecules?
    choices:
      - text: '2.0 mol'
        correct: true
      - text: '1.0 mol'
        rationale: |
          This counts molecules as single atoms. One mole is stated. Check the two atoms in each specified molecule.
      - text: '0.5 mol'
        rationale: |
          This divides by the subscript instead of multiplying. The subscript gives a conversion factor. Check whether converting to the smaller entity increases the count.
      - text: '4 mol'
        rationale: |
          This applies the factor 2 twice. Both the formula and mole amount matter. Check that each molecule contributes two atoms once.
    explanation: |
      Each $O_2$ molecule contains two oxygen atoms. Multiply the mole count of molecules by 2 to get 2 mol of oxygen atoms.
    approved: false

  - id: q-chemistry-mole-concept-0019
    type: 'predict-outcome'
    difficulty: 'hard'
    stem: |
      A measured amount is 2.0 mol. Why does multiplying it by exact $N_A$ not automatically justify eight significant digits in the entity count?
    choices:
      - text: 'The measured amount limits precision.'
        correct: true
      - text: 'N_A has uncertain digits in the modern SI.'
        rationale: |
          This assigns uncertainty to a defining constant. Constants used to be measured. Check the exact modern SI definition.
      - text: 'Every multiplication requires exactly one significant digit.'
        rationale: |
          This imposes a fixed digit count on every product. Rounding rules can be remembered as shortcuts. Check the actual precision of the input.
      - text: 'Entity counts can never be reported using scientific notation.'
        rationale: |
          This rejects scientific notation for large counts. Entities are discrete. Check that notation can still express an estimated large count.
    explanation: |
      N_A is exact in the SI. The given measured amount has limited precision, so the reported entity count must reflect that input.
    approved: false

  - id: q-chemistry-mole-concept-0020
    type: 'compare-contrast'
    difficulty: 'exam'
    stem: |
      What changed in the 2019 SI definition of the mole?
    choices:
      - text: 'It uses a fixed entity count.'
        correct: true
      - text: 'It is now defined by exactly 12 g of carbon-12.'
        rationale: |
          This retains the older carbon-12-based definition. Carbon-12 remains important in atomic mass. Check the modern defining constant.
      - text: 'Its definition depends on the substance’s physical state.'
        rationale: |
          This makes amount depend on gas, liquid, or solid state. Gas laws often use moles. Check the state-independent entity definition.
      - text: 'Its entity count changes with each element’s molar mass.'
        rationale: |
          This confuses mass per mole with entities per mole. Elements have different molar masses. Check what stays the same for one mole.
    explanation: |
      The modern mole is defined by the exact Avogadro constant. It contains exactly $6.02214076\times10^{23}$ specified entities.
    approved: false
