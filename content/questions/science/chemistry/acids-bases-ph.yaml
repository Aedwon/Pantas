meta:
  subject: science
  topic: chemistry
  subtopic: acids-bases-ph
  exams: [upcat, dlsucet, ustet, dost-sei]
questions:
  - id: q-chemistry-acids-bases-ph-0001
    type: 'classify'
    difficulty: 'easy'
    stem: |
      An aqueous solution at $25 ^\circ\mathrm{C}$ has pH 2. How is it classified?
    choices:
      - text: 'Acidic'
        correct: true
      - text: 'Neutral'
        rationale: |
          This treats any solution containing water as neutral. Water itself is neutral under the stated conditions. Check the measured pH against 7.
      - text: 'Basic'
        rationale: |
          This reverses the acid and base sides of the scale. Both are departures from neutrality. Check whether pH is below or above 7.
      - text: 'Cannot be determined from pH alone'
        rationale: |
          This overlooks the stated temperature. Temperature can matter for neutral pH. Check whether the question supplies the standard 25-degree condition.
    explanation: |
      At $25 ^\circ\mathrm{C}$, an acidic solution has pH below 7. Since $2 < 7$, this solution is acidic.
    approved: true

  - id: q-chemistry-acids-bases-ph-0002
    type: 'classify'
    difficulty: 'easy'
    stem: |
      An aqueous solution at $25 ^\circ\mathrm{C}$ has pH exactly 7. How is it classified?
    choices:
      - text: 'Neutral'
        correct: true
      - text: 'Acidic'
        rationale: |
          This treats the presence of hydronium as proof of acidity. Neutral water still contains hydronium. Check whether its level exceeds the hydroxide level.
      - text: 'Basic'
        rationale: |
          This treats the presence of hydroxide as proof of basicity. Neutral water still contains hydroxide. Check whether its level exceeds the hydronium level.
      - text: 'Cannot be determined from pH alone'
        rationale: |
          This overlooks the given temperature. Neutral pH can vary with temperature. Check whether the problem gives the standard 25-degree condition.
    explanation: |
      At $25 ^\circ\mathrm{C}$, pH 7 is the neutral value. Hydronium and hydroxide levels are equal under this condition.
    approved: true

  - id: q-chemistry-acids-bases-ph-0003
    type: 'classify'
    difficulty: 'easy'
    stem: |
      An aqueous solution at $25 ^\circ\mathrm{C}$ has pH 11. How is it classified?
    choices:
      - text: 'Basic'
        correct: true
      - text: 'Acidic'
        rationale: |
          This treats a larger pH as greater acidity. Ordinary scales often rise with the measured amount. Check the direction of the pH scale.
      - text: 'Neutral'
        rationale: |
          This treats an aqueous solution as automatically neutral. Water is the solvent. Check whether the measured pH equals the neutral value.
      - text: 'Cannot be determined from pH alone'
        rationale: |
          This overlooks the given temperature. Neutral pH can depend on temperature. Check whether the standard 25-degree condition is stated.
    explanation: |
      At $25 ^\circ\mathrm{C}$, a basic solution has pH above 7. Since $11 > 7$, this solution is basic.
    approved: true

  - id: q-chemistry-acids-bases-ph-0004
    type: 'simple-quantitative'
    difficulty: 'medium'
    stem: |
      Under comparable dilute conditions, solution A has pH 3 and solution B has pH 5. Which comparison of hydronium levels is correct?
    choices:
      - text: 'A has 100 times B’s hydronium level.'
        correct: true
      - text: 'B has 100 times A’s hydronium level.'
        rationale: |
          This reverses the pH direction. Five is larger than three, which suggests more on an ordinary scale. Check that pH rises as hydronium level falls.
      - text: 'A has 2 times B’s hydronium level.'
        rationale: |
          This uses the pH difference as a linear multiplier. Subtracting gives a two-unit gap. Check that the gap is the exponent in a power of 10.
      - text: 'A and B have equal hydronium levels.'
        rationale: |
          This ignores the measured pH difference. Both solutions are acidic, so they may seem equivalent. Check whether sharing a category means having the same hydronium level.
    explanation: |
      The lower pH belongs to the higher hydronium level. The difference is $5-3=2$ units. Each unit is a factor of 10, so $10^2=100$. A has 100 times B’s hydronium level.
    approved: true

  - id: q-chemistry-acids-bases-ph-0005
    type: 'simple-quantitative'
    difficulty: 'medium'
    stem: |
      For a dilute aqueous solution, $[H_3O^+]=1.0\times10^{-7}\,\mathrm{M}$. Using $\mathrm{pH}\approx-\log_{10}[H_3O^+]$, what is its approximate pH?
    choices:
      - text: '7'
        correct: true
      - text: '-7'
        rationale: |
          This omits the minus sign before the logarithm. The concentration exponent is negative, so that value looks ready to use. Check the full formula.
      - text: '14'
        rationale: |
          This doubles the exponent magnitude. The familiar 0-to-14 scale can make 14 seem like a related answer. Check whether the formula calls for doubling.
      - text: '0.0000001'
        rationale: |
          This reports the concentration instead of pH. The given decimal is a valid concentration. Check that pH requires taking a logarithm.
    explanation: |
      The base-10 logarithm of $10^{-7}$ is $-7$. The negative sign in the pH formula changes this to $7$.
    approved: true

  - id: q-chemistry-acids-bases-ph-0006
    type: 'classify'
    difficulty: 'medium'
    stem: |
      Acid X completely breaks apart into ions when dissolved in water, with essentially none of the original molecule remaining. Acid Y only partially breaks apart, with most of it remaining as the original molecule. Classify each.
    choices:
      - text: 'X strong; Y weak'
        correct: true
      - text: 'X weak; Y strong'
        rationale: |
          This reverses the strength definitions. Both acids produce ions, so the labels may be swapped. Check which one ionizes essentially completely.
      - text: 'Both essentially fully ionizing'
        rationale: |
          This overlooks Y’s incomplete ionization. Both produce some ions. Check whether some ionization means essentially complete ionization.
      - text: 'Both only partially ionizing'
        rationale: |
          This overlooks X’s essentially complete ionization. Real solutions have equilibria, which can suggest both are weak. Check the extent stated for each acid.
    explanation: |
      X ionizes essentially completely in water, so it is strong. Y ionizes only partly, so it is weak. This classification describes ionization.
    approved: true

  - id: q-chemistry-acids-bases-ph-0007
    type: 'identify'
    difficulty: 'easy'
    stem: |
      Under the Arrhenius model, which ion concentration does an acid increase in aqueous solution?
    choices:
      - text: 'Hydronium'
        correct: true
      - text: 'Hydroxide ions'
        rationale: |
          This uses the Arrhenius base ion. Acids and bases both change ionic levels. Check whether hydronium or hydroxide increases.
      - text: 'Sodium ions'
        rationale: |
          This picks a common spectator ion instead of the defining acid ion. Sodium ions appear in many dissolved salts. Check which ion determines Arrhenius acidity.
      - text: 'Chloride ions'
        rationale: |
          This uses an ion found with hydrochloric acid as the general definition. Chloride is present in that example. Check the ion common to Arrhenius acids, not one acid’s spectator ion.
    explanation: |
      An Arrhenius acid increases hydronium, $H_3O^+$, in water. The notation $H^+(aq)$ is often used as shorthand for this aqueous acid behavior.
    approved: true

  - id: q-chemistry-acids-bases-ph-0008
    type: 'identify'
    difficulty: 'easy'
    stem: |
      Under the Arrhenius model, which ion concentration does a base increase in aqueous solution?
    choices:
      - text: '$OH^-$'
        correct: true
      - text: '$H_3O^+$'
        rationale: |
          This uses the Arrhenius acid ion. Both kinds of solution contain ions. Check which defining ion increases for a base.
      - text: '$Na^+$'
        rationale: |
          This substitutes a common companion ion for hydroxide. Sodium hydroxide contains sodium, so that ion seems relevant. Check which ion defines the base behavior.
      - text: '$Cl^-$'
        rationale: |
          This confuses a salt spectator with the defining base ion. Chloride can remain after neutralization. Check which ion increases when the base acts in water.
    explanation: |
      An Arrhenius base increases hydroxide ions, $OH^-$, in aqueous solution.
    approved: true

  - id: q-chemistry-acids-bases-ph-0009
    type: 'identify'
    difficulty: 'medium'
    stem: |
      Under the Brønsted-Lowry definition, which is broader than the Arrhenius definition, what is an acid?
    choices:
      - text: 'A proton donor'
        correct: true
      - text: 'A proton acceptor'
        rationale: |
          This reverses acid and base roles. Both partners take part in proton transfer. Check which gives the proton and which receives it.
      - text: 'A hydroxide donor only'
        rationale: |
          This confuses the broader definition with hydroxide-based chemistry. Hydroxide is important in common base reactions. Check whether the definition concerns donating a proton.
      - text: 'A neutral salt producer only'
        rationale: |
          This uses one possible reaction outcome as the definition. Salt formation is familiar in acid-base reactions. Check the reacting substance’s proton-transfer role.
    explanation: |
      A Brønsted-Lowry acid donates a proton. This definition describes proton transfer and is not restricted to the Arrhenius aqueous model.
    approved: true

  - id: q-chemistry-acids-bases-ph-0010
    type: 'classify'
    difficulty: 'hard'
    stem: |
      A concentrated solution is reported to have pH below 0. Which conclusion follows from the lesson?
    choices:
      - text: 'The familiar range is not a hard limit.'
        correct: true
      - text: 'The value must be invalid because pH cannot be negative.'
        rationale: |
          This treats the classroom drawing as a mathematical limit. Many diagrams stop at zero. Check whether the lesson allows values outside that familiar range.
      - text: 'The solution must be neutral because zero is the minimum.'
        rationale: |
          This confuses the end of a drawn scale with neutrality. Zero may look like a baseline. Check the definition of neutrality rather than the edge of the drawing.
      - text: 'A negative pH proves a negative hydronium concentration.'
        rationale: |
          This treats pH as the concentration itself. A negative value can suggest a negative amount. Check whether pH is an amount or a negative logarithm.
    explanation: |
      The common 0-to-14 pH scale is a useful classroom range. It is not an absolute boundary. Concentrated solutions can have pH below 0.
    approved: true

  - id: q-chemistry-acids-bases-ph-0011
    type: 'classify'
    difficulty: 'hard'
    stem: |
      At a temperature other than $25 ^\circ\mathrm{C}$, a solution has equal hydronium and hydroxide levels. How should it be classified?
    choices:
      - text: 'Neutral'
        correct: true
      - text: 'Acidic whenever its pH is below 7'
        rationale: |
          This applies the 25-degree divider at every temperature. The familiar scale uses 7 as neutral. Check the equality condition and the stated temperature.
      - text: 'Basic whenever its pH is above 7'
        rationale: |
          This also applies the fixed 7 divider regardless of temperature. A pH above 7 is basic at 25 degrees. Check whether 7 is neutral under the given conditions.
      - text: 'Unclassifiable without an acid’s strength'
        rationale: |
          This confuses acid strength with the neutrality condition. Strength affects ionization in acid solutions. Check whether equal hydronium and hydroxide already establish neutrality.
    explanation: |
      Neutrality means equal hydronium and hydroxide levels under the relevant solution model. The neutral pH changes with temperature, so it need not be exactly 7.
    approved: true

  - id: q-chemistry-acids-bases-ph-0012
    type: 'classify'
    difficulty: 'hard'
    stem: |
      Which statement correctly distinguishes acid strength from concentration?
    choices:
      - text: 'Strength is extent of ionization.'
        correct: true
      - text: 'Strength is amount dissolved per unit volume.'
        rationale: |
          This uses the concentration definition for strength. Concentrated acid often has a low pH. Check whether the property describes ionization or amount per volume.
      - text: 'Dilution converts every strong acid into a weak acid.'
        rationale: |
          This treats a smaller amount per volume as a change in intrinsic acid strength. Dilution can change pH. Check whether it changes the acid’s identity or just its concentration.
      - text: 'Concentration is the fraction ionized in water.'
        rationale: |
          This swaps the concentration definition with ionization extent. Both affect solution behavior. Check whether concentration counts amount per volume.
    explanation: |
      Acid strength describes how fully an acid ionizes in water. Concentration describes the amount dissolved per unit volume. A strong acid can be dilute.
    approved: true

  - id: q-chemistry-acids-bases-ph-0013
    type: 'classify'
    difficulty: 'hard'
    stem: |
      Which statement about acid-base neutralization is correct?
    choices:
      - text: 'It is fundamentally proton transfer.'
        correct: true
      - text: 'It always produces water and a final pH of 7.'
        rationale: |
          This treats the strong-acid/strong-hydroxide example as universal. That common reaction forms water. Check whether every base is hydroxide and whether the amounts and conditions support pH 7.
      - text: 'It can occur only when hydroxide is a reactant.'
        rationale: |
          This restricts all acid-base chemistry to one familiar base ion. Hydroxide participates in common examples. Check whether another substance can accept a proton.
      - text: 'It is defined by the permanent removal of all ions.'
        rationale: |
          This confuses reacting ions with eliminating every ion. Hydronium and hydroxide can form water. Check whether spectator ions remain in solution.
    explanation: |
      In the Brønsted-Lowry model, an acid transfers a proton to a base. Some such reactions form water. The products and final pH depend on the reacting substances and conditions.
    approved: true

  - id: q-chemistry-acids-bases-ph-0014
    type: 'predict-outcome'
    difficulty: 'exam'
    stem: |
      Hydrochloric acid ($HCl$) reacts with sodium hydroxide ($NaOH$), producing sodium chloride ($NaCl$) and water. Why is this classified as a neutralization reaction?
    choices:
      - text: '$H_3O^+$ transfers a proton to $OH^-$.'
        correct: true
      - text: '$Na^+$ transfers a proton to $Cl^-$.'
        rationale: |
          This assigns proton transfer to spectator ions. Sodium and chloride appear in the overall equation. Check which reactants actually contain and accept the transferred proton.
      - text: '$Cl^-$ becomes the only reactive base in water.'
        rationale: |
          This confuses a remaining ion with the reacting hydroxide. Chloride is present in the salt solution. Check which base consumes hydronium in this reaction.
      - text: '$Na^+$ and $Cl^-$ permanently leave the solution.'
        rationale: |
          This assumes spectator ions vanish when neutralization occurs. The solution’s acidity can change strongly. Check whether dissolved salt ions remain after the reacting ions form water.
    explanation: |
      In this aqueous reaction, hydronium reacts with hydroxide. The net ionic equation is $H_3O^++OH^-\rightarrow2H_2O$. Sodium and chloride remain as spectator ions.
    approved: true

  - id: q-chemistry-acids-bases-ph-0015
    type: 'simple-quantitative'
    difficulty: 'exam'
    stem: |
      Under comparable dilute conditions, one solution has a hydronium level $10^6$ times that of another. How much lower is its pH?
    choices:
      - text: '6 units'
        correct: true
      - text: '1,000,000 units'
        rationale: |
          This uses the concentration multiplier as a pH difference. A million-fold change sounds like a huge pH gap. Check that pH uses the exponent of the power of 10.
      - text: '60 units'
        rationale: |
          This multiplies the exponent by 10. Each unit does represent a tenfold change. Check whether the exponent counts steps or must itself be multiplied.
      - text: '0.000001 units'
        rationale: |
          This takes the reciprocal of the concentration factor as the pH difference. Lower pH can suggest a reciprocal number. Check that the logarithm converts a power of 10 to its exponent.
    explanation: |
      Each pH unit corresponds to a factor of 10 in hydronium level. A factor of $10^6$ therefore corresponds to six pH units. The higher hydronium level has the lower pH.
    approved: true

  - id: q-chemistry-acids-bases-ph-0016
    type: 'identify'
    difficulty: 'easy'
    stem: |
      Which role defines a Brønsted-Lowry base?
    choices:
      - text: 'Accepting a proton'
        correct: true
      - text: 'Donating a proton'
        rationale: |
          This swaps the acid and base roles. Both participate in the same transfer. Check which partner receives the proton.
      - text: 'Producing water in every reaction'
        rationale: |
          This makes one common product the definition. Hydroxide neutralization often produces water. Check whether every proton acceptor must make water.
      - text: 'Having pH 7 under every condition'
        rationale: |
          This confuses being a base with being neutral. The terms sound related to balancing acidity. Check the proton-transfer role rather than a fixed pH.
    explanation: |
      A Brønsted-Lowry base accepts a proton from an acid. This defines its role in a proton-transfer reaction.
    approved: false

  - id: q-chemistry-acids-bases-ph-0017
    type: 'classify'
    difficulty: 'medium'
    stem: |
      In $NH_3+HCl\rightarrow NH_4Cl$, which substance accepts the proton?
    choices:
      - text: '$NH_3$'
        correct: true
      - text: '$HCl$'
        rationale: |
          This assigns the receiving role to the proton donor. HCl participates in the transfer. Check which formula gains hydrogen.
      - text: '$NH_4Cl$'
        rationale: |
          This names the overall product as the reacting base. The product includes ammonium, which has received a proton. Check which substance existed before the transfer.
      - text: '$H_2O$'
        rationale: |
          This assumes water must be involved in every neutralization. It appears in many classroom examples. Check the reactants actually given in this equation.
    explanation: |
      Ammonia, $NH_3$, gains a proton and becomes ammonium, $NH_4^+$. It therefore acts as the Brønsted-Lowry base.
    approved: false

  - id: q-chemistry-acids-bases-ph-0018
    type: 'compare-contrast'
    difficulty: 'hard'
    stem: |
      Two unspecified acid solutions have different pH values. What can the lower pH establish by itself?
    choices:
      - text: 'Greater hydrogen-ion activity'
        correct: true
      - text: 'Necessarily greater intrinsic acid strength'
        rationale: |
          This equates solution pH with intrinsic acid strength. Strong acids often produce many ions. Check whether concentration is also known.
      - text: 'Necessarily more total acid molecules in the bottle'
        rationale: |
          This equates activity with the total number of molecules in a container. More acid can sometimes lower pH. Check whether volume and ionization are specified.
      - text: 'Complete ionization of every acid molecule'
        rationale: |
          This uses pH alone to infer complete ionization. A very acidic solution can seem strongly ionized. Check whether the extent of ionization is actually measured.
    explanation: |
      Lower pH means greater hydrogen-ion activity. Both acid strength and concentration can affect pH, so the pH comparison alone describes the solution’s hydrogen-ion activity.
    approved: false

  - id: q-chemistry-acids-bases-ph-0019
    type: 'predict-outcome'
    difficulty: 'hard'
    stem: |
      A strong acid and a strong hydroxide react, but excess acid remains after reaction. Which conclusion is justified?
    choices:
      - text: 'The mixture need not be neutral.'
        correct: true
      - text: 'The word neutralization guarantees pH 7.'
        rationale: |
          This treats the reaction name as a guaranteed final pH. Balanced classroom examples often end near neutrality. Check whether one reactant remains in excess.
      - text: 'All spectator ions disappear with the excess acid.'
        rationale: |
          This confuses reacting acid with spectator ions. Some ions are consumed by the reaction. Check whether every dissolved ion participates.
      - text: 'The unreacted acid changes into a weak acid.'
        rationale: |
          This confuses the amount left over with acid strength. The reaction reduces the amount of acid. Check whether its ionization behavior changes just because less remains.
    explanation: |
      Neutralization uses acid and base in their reacting amounts. If acid remains, the reaction has not removed all its acid contribution. The final mixture is therefore not guaranteed to be neutral.
    approved: false

  - id: q-chemistry-acids-bases-ph-0020
    type: 'cause-effect'
    difficulty: 'exam'
    stem: |
      In dilute water at fixed temperature, hydronium concentration increases by a factor of 10. What happens to pH?
    choices:
      - text: 'It falls by 1 unit.'
        correct: true
      - text: 'It rises by 1 unit.'
        rationale: |
          This misses the minus sign in the pH relation. A larger concentration can suggest a larger scale reading. Check the sign before the logarithm.
      - text: 'It falls by 10 units.'
        rationale: |
          This treats a tenfold concentration change as ten pH units. The factor is 10. Check how many powers of 10 it represents.
      - text: 'It becomes exactly 7.'
        rationale: |
          This assumes any concentration change ends at neutrality. Seven is a familiar reference value. Check whether the final hydronium and hydroxide levels are stated to be equal.
    explanation: |
      Using $\mathrm{pH}\approx-\log_{10}[H_3O^+]$, a tenfold increase raises the logarithm by 1. The minus sign therefore lowers pH by 1 unit.
    approved: false
