meta:
  subject: science
  topic: chemistry
  subtopic: nuclear-chemistry
  exams: ["upcat", "dlsucet", "ustet", "dost-sei"]
questions:
  - id: q-chemistry-nuclear-chemistry-0001
    type: 'identify'
    difficulty: 'easy'
    stem: |
      A nucleus ejects a particle identical to a helium nucleus (2 protons and 2 neutrons). What type of decay is this?
    choices:
      - text: 'Alpha decay'
        correct: true
      - text: 'Beta-minus'
        rationale: |
          This treats a helium nucleus as a beta particle. Both are emitted radiation. Check the emitted particle’s composition.
      - text: 'Gamma emission'
        rationale: |
          This treats a massive nuclear particle as a photon. Both carry energy. Check whether the emission contains nucleons.
      - text: 'Nuclear fission'
        rationale: |
          This treats a small helium emission as division into major fragments. Both involve a nucleus. Check the size and identity of the emitted material.
    explanation: |
      An alpha particle is a helium-4 nucleus with two protons and two neutrons. Emitting that particle is alpha decay.
    approved: true

  - id: q-chemistry-nuclear-chemistry-0002
    type: 'identify'
    difficulty: 'easy'
    stem: |
      A neutron in a nucleus becomes a proton, emitting an electron and an antineutrino. Which process is this?
    choices:
      - text: 'Beta-minus'
        correct: true
      - text: 'Alpha decay'
        rationale: |
          This substitutes a helium-nucleus emission for electron emission. Both are nuclear processes. Check which particle is emitted.
      - text: 'Gamma emission'
        rationale: |
          This substitutes a photon for the electron. Both emissions carry energy. Check whether a neutron-to-proton conversion occurs.
      - text: 'Nuclear fusion'
        rationale: |
          This treats one nucleus’s internal conversion as two nuclei combining. Both can change nuclides. Check the number of starting nuclei.
    explanation: |
      In beta-minus decay, a neutron becomes a proton. An electron and an antineutrino are emitted.
    approved: true

  - id: q-chemistry-nuclear-chemistry-0003
    type: 'identify'
    difficulty: 'easy'
    stem: |
      An excited nucleus emits a high-energy photon without changing its atomic or mass number. Which process is this?
    choices:
      - text: 'Gamma decay'
        correct: true
      - text: 'Alpha decay'
        rationale: |
          This selects a decay that removes a helium nucleus. Alpha radiation carries energy. Check whether nucleon counts change.
      - text: 'Beta decay'
        rationale: |
          This selects a process that converts a neutron to a proton. Beta radiation carries energy. Check whether atomic number changes.
      - text: 'Fission'
        rationale: |
          This selects division into smaller nuclei. Fission releases energy. Check whether the original nucleus remains with unchanged A and Z.
    explanation: |
      An excited nucleus emits a high-energy photon and moves to a lower nuclear energy state. Its proton and nucleon counts stay unchanged. This is gamma emission.
    approved: true

  - id: q-chemistry-nuclear-chemistry-0004
    type: 'simple-quantitative'
    difficulty: 'medium'
    stem: |
      An atom with atomic number 88 and mass number 226 undergoes alpha decay. Find the resulting atomic number and mass number.
    choices:
      - text: 'Atomic number 86, mass number 222'
        correct: true
      - text: 'Atomic number 89, mass number 222'
        rationale: |
          This combines beta-minus’s Z increase with alpha’s A decrease. Both decays change nuclei. Check the emitted particle’s proton count.
      - text: 'Atomic number 86, mass number 226'
        rationale: |
          This subtracts the two protons but ignores their loss from A. Atomic number is tracked correctly. Check all four emitted nucleons.
      - text: 'Atomic number 90, mass number 230'
        rationale: |
          This adds the alpha particle instead of emitting it. Its counts are two and four. Check the direction of transfer.
    explanation: |
      Alpha emission removes two protons and four nucleons. The daughter has $Z=88-2=86$ and $A=226-4=222$.
    approved: true

  - id: q-chemistry-nuclear-chemistry-0005
    type: 'simple-quantitative'
    difficulty: 'medium'
    stem: |
      A nucleus with atomic number 15 and mass number 32 undergoes beta-minus decay. Find its daughter’s atomic and mass numbers.
    choices:
      - text: 'Atomic number 16, mass number 32'
        correct: true
      - text: 'Atomic number 14, mass number 32'
        rationale: |
          This uses the Z decrease of positron emission or electron capture. Several beta-related processes exist. Check that the stem specifies beta-minus.
      - text: 'Atomic number 16, mass number 28'
        rationale: |
          This applies alpha’s four-nucleon loss to beta-minus. Both are decay modes. Check whether the emitted electron is a nucleon.
      - text: 'Atomic number 15, mass number 33'
        rationale: |
          This adds a nucleon rather than converting one. A new proton appears. Check that one neutron disappears at the same time.
    explanation: |
      Beta-minus converts one neutron to one proton. Thus $Z=15+1=16$, while the total nucleon count stays $A=32$.
    approved: true

  - id: q-chemistry-nuclear-chemistry-0006
    type: 'classify'
    difficulty: 'medium'
    stem: |
      Inside a nuclear power plant reactor, a large uranium nucleus splits apart into two smaller nuclei. What nuclear process is this?
    choices:
      - text: 'Fission'
        correct: true
      - text: 'Fusion'
        rationale: |
          This reverses splitting into joining. Both processes release energy. Check whether heavy nuclei split or light nuclei combine.
      - text: 'Alpha decay'
        rationale: |
          This treats major-fragment division as one helium emission. Both can reduce the original nucleus. Check the size of the products.
      - text: 'Beta decay'
        rationale: |
          This treats division of a nucleus as a neutron-to-proton conversion. Both can lead to a different nuclide. Check the reaction pattern.
    explanation: |
      Fission divides a heavy nucleus into smaller nuclei. The process releases energy and commonly neutrons. It supplies heat in commercial fission power reactors.
    approved: true

  - id: q-chemistry-nuclear-chemistry-0007
    type: 'classify'
    difficulty: 'medium'
    stem: |
      The Sun’s proton-proton chain converts four hydrogen nuclei into helium-4 through several steps. Which overall nuclear process powers it?
    choices:
      - text: 'Fusion'
        correct: true
      - text: 'Fission'
        rationale: |
          This calls combination a splitting process. Both processes release energy. Check whether nuclei combine or a heavy nucleus divides.
      - text: 'Alpha decay'
        rationale: |
          This treats production of helium as emission of a preexisting alpha particle. Helium appears in both descriptions. Check the nuclear reaction sequence.
      - text: 'Beta decay'
        rationale: |
          This treats the entire chain as one electron-emission decay. Some nuclear conversions occur within the chain. Check the overall joining of light nuclei.
    explanation: |
      Fusion combines light nuclei. In the Sun’s proton-proton chain, several steps give a net conversion of four hydrogen nuclei into helium-4, other particles, and energy.
    approved: true

  - id: q-chemistry-nuclear-chemistry-0008
    type: 'classify'
    difficulty: 'hard'
    stem: |
      A student calculates the result of alpha decay by decreasing only the atomic number by 2, leaving the mass number unchanged. Is this correct?
    choices:
      - text: 'No; A also decreases by 4.'
        correct: true
      - text: 'Yes; only Z changes in alpha emission.'
        rationale: |
          This ignores the mass carried by the emitted protons and neutrons. The Z change is correct. Check the full emitted particle.
      - text: 'No; only A changes and Z stays fixed.'
        rationale: |
          This ignores the lost protons when updating Z. Four nucleons leave. Check how many are protons.
      - text: 'Yes; alpha emission leaves both A and Z unchanged.'
        rationale: |
          This treats particle emission as energy-only emission. All decays carry energy. Check whether a helium nucleus also leaves.
    explanation: |
      An alpha particle contains two protons and two neutrons. Removing it decreases Z by 2 and A by 4.
    approved: true

  - id: q-chemistry-nuclear-chemistry-0009
    type: 'cause-effect'
    difficulty: 'hard'
    stem: |
      What can sustain a fission chain reaction under suitable conditions?
    choices:
      - text: 'Released neutrons cause further fissions.'
        correct: true
      - text: 'Outer electrons cause every nucleus to split.'
        rationale: |
          This assigns nuclear triggering to emitted outer electrons. Chemical reactions involve electrons. Check which particles induce the reactor fissions.
      - text: 'Released heat guarantees every neighboring nucleus splits.'
        rationale: |
          This treats released heat as sufficient to trigger every further fission. Heat is produced. Check the role of neutrons and suitable conditions.
      - text: 'Every fission always sustains a chain regardless of conditions.'
        rationale: |
          This treats chain-reaction conditions as irrelevant. Fission releases neutrons. Check whether enough cause further fissions rather than escaping or being absorbed elsewhere.
    explanation: |
      Fission often releases neutrons. If enough of those neutrons cause further fissions, the process can sustain a chain reaction.
    approved: true

  - id: q-chemistry-nuclear-chemistry-0010
    type: 'classify'
    difficulty: 'hard'
    stem: |
      A student assumes that since gamma decay causes no change to atomic number or mass number, the resulting nucleus must have transformed into a different element. Is this correct?
    choices:
      - text: 'No; proton count stays unchanged.'
        correct: true
      - text: 'Yes; every gamma emission creates a new element.'
        rationale: |
          This treats any decay as an element change. Many decays do alter Z. Check whether gamma changes proton number.
      - text: 'No; gamma emission cannot involve the nucleus.'
        rationale: |
          This treats no Z change as proof that the nucleus is uninvolved. Its composition stays fixed. Check whether its energy state can change.
      - text: 'Yes; every radioactive process removes protons.'
        rationale: |
          This assumes radioactivity requires proton loss. Alpha emission does remove protons. Check the defining gamma process.
    explanation: |
      Element identity depends on proton count, Z. Gamma emission leaves Z unchanged while lowering the nucleus’s energy. The element therefore remains the same.
    approved: true

  - id: q-chemistry-nuclear-chemistry-0011
    type: 'classify'
    difficulty: 'hard'
    stem: |
      Which statement about gamma shielding is accurate?
    choices:
      - text: 'Dense shielding reduces intensity.'
        correct: true
      - text: 'An ordinary paper sheet stops every gamma photon.'
        rationale: |
          This applies thin alpha shielding to gamma photons. Paper blocks external alpha particles. Check the radiation type.
      - text: 'No element change means gamma radiation cannot penetrate.'
        rationale: |
          This equates no element change with weak penetration. Gamma emission leaves Z unchanged. Check the properties of the emitted radiation separately.
      - text: 'A lead barrier guarantees every gamma photon is stopped.'
        rationale: |
          This treats shielding as an all-or-nothing barrier. Dense lead reduces intensity. Check whether attenuation guarantees zero transmitted photons.
    explanation: |
      Gamma photons can penetrate deeply. Dense or thick shielding reduces their intensity by attenuating the radiation. Ordinary shielding does not guarantee that every photon is stopped.
    approved: true

  - id: q-chemistry-nuclear-chemistry-0012
    type: 'compare-contrast'
    difficulty: 'medium'
    stem: |
      In the usual introductory comparison of alpha, beta-minus, and gamma radiation, which order goes from lower to higher penetration?
    choices:
      - text: 'Alpha (weakest) < beta < gamma (strongest)'
        correct: true
      - text: 'Gamma (weakest) < beta < alpha (strongest)'
        rationale: |
          This reverses the usual comparison. Gamma has no electric charge. Check the introductory shielding examples.
      - text: 'Beta (weakest) < alpha < gamma (strongest)'
        rationale: |
          This swaps alpha and beta-minus. Both are charged particles. Check which is readily stopped by thin paper.
      - text: 'All three have exactly the same penetrating power.'
        rationale: |
          This treats all radiation as having equal range. All carry energy. Check the different particle and photon interactions.
    explanation: |
      In the usual introductory comparison, alpha radiation has the shortest range in matter, beta-minus is intermediate, and gamma is more penetrating. Actual penetration also depends on radiation energy and material.
    approved: true

  - id: q-chemistry-nuclear-chemistry-0013
    type: 'simple-quantitative'
    difficulty: 'exam'
    stem: |
      An atom with atomic number 90 and mass number 230 undergoes alpha decay twice in a row. Find the final atomic number and mass number.
    choices:
      - text: 'Atomic number 86, mass number 222'
        correct: true
      - text: 'Atomic number 88, mass number 226'
        rationale: |
          This applies only one decay. That is a valid intermediate result. Check the number of specified emissions.
      - text: 'Atomic number 82, mass number 214'
        rationale: |
          This applies four alpha emissions. Each decrease uses an alpha count. Check that only two emissions occur.
      - text: 'Atomic number 86, mass number 230'
        rationale: |
          This changes Z but leaves A fixed. The proton count has been updated. Check the total nucleons emitted in both steps.
    explanation: |
      Each alpha emission removes 2 from Z and 4 from A. First: $Z=88$, $A=226$. Second: $Z=86$, $A=222$.
    approved: true

  - id: q-chemistry-nuclear-chemistry-0014
    type: 'compare-contrast'
    difficulty: 'exam'
    stem: |
      A claim says fusion releases more energy than fission without naming reactions or a comparison basis. What is needed to assess it?
    choices:
      - text: 'Specify reactions and energy per event or mass.'
        correct: true
      - text: 'Assume every fusion event exceeds every fission event.'
        rationale: |
          This turns a comparison into an exception-free per-event claim. Fusion is very energy-dense per fuel mass. Check the basis and particular reaction.
      - text: 'Assume every fission and fusion event releases equal energy.'
        rationale: |
          This treats different nuclear processes as equal-energy events. Both release energy. Check their actual reactions and measurement basis.
      - text: 'Assume equal fuel masses necessarily give equal energies.'
        rationale: |
          This assumes the same fuel mass produces the same energy automatically. Mass is a possible comparison basis. Check the reaction’s released energy per unit mass.
    explanation: |
      An energy comparison needs a stated basis. Energy per event and energy per unit fuel mass compare different quantities. The particular fission and fusion reactions must also be specified.
    approved: true

  - id: q-chemistry-nuclear-chemistry-0015
    type: 'identify'
    difficulty: 'easy'
    stem: |
      Which nuclear quantity determines element identity?
    choices:
      - text: 'Atomic number Z'
        correct: true
      - text: 'Mass number A'
        rationale: |
          This uses total nucleons to identify the element. A labels nuclides. Check which count is specifically the proton count.
      - text: 'Nuclear energy level'
        rationale: |
          This treats an energy-state change as an element change. Gamma emission changes nuclear energy. Check whether proton number also changes.
      - text: 'Number of orbital electrons'
        rationale: |
          This treats ion charge as element identity. Electrons determine atomic charge balance. Check whether the nucleus has changed its proton count.
    explanation: |
      Atomic number Z is the number of protons. It determines which element the nucleus belongs to.
    approved: false

  - id: q-chemistry-nuclear-chemistry-0016
    type: 'simple-quantitative'
    difficulty: 'medium'
    stem: |
      In positron emission, how do A and Z change?
    choices:
      - text: 'A unchanged; Z decreases by 1'
        correct: true
      - text: 'A unchanged; Z increases by 1'
        rationale: |
          This uses beta-minus bookkeeping. Both processes are beta-related. Check which nucleon becomes which.
      - text: 'A decreases by 4; Z decreases by 2'
        rationale: |
          This uses alpha bookkeeping. Both emit particles. Check whether a four-nucleon particle is emitted.
      - text: 'A increases by 1; Z unchanged'
        rationale: |
          This treats nucleon conversion as nucleon addition. A neutron appears. Check that it replaces a proton.
    explanation: |
      A proton converts to a neutron. The nucleon total stays the same, and there is one fewer proton. Thus A is unchanged and Z falls by 1.
    approved: false

  - id: q-chemistry-nuclear-chemistry-0017
    type: 'compare-contrast'
    difficulty: 'hard'
    stem: |
      Which distinguishes electron capture from positron emission?
    choices:
      - text: 'Capture absorbs an electron; positron emission emits a positron.'
        correct: true
      - text: 'Capture emits an electron; positron emission captures a positron.'
        rationale: |
          This reverses the incoming and outgoing particles. Both names refer to particles. Check the word capture.
      - text: 'Capture raises Z; positron emission always lowers A by 4.'
        rationale: |
          This mixes beta-minus and alpha changes into these processes. Several decay rules are familiar. Check their common proton-to-neutron conversion.
      - text: 'Capture changes no nuclear particle; positron emission adds protons.'
        rationale: |
          This removes the nuclear change from capture and reverses positron bookkeeping. Capture starts with an atomic electron. Check the resulting proton-to-neutron change.
    explanation: |
      Electron capture takes an inner atomic electron into the nuclear process. Positron emission releases a positron. Both convert a proton to a neutron and decrease Z by 1.
    approved: false

  - id: q-chemistry-nuclear-chemistry-0018
    type: 'predict-outcome'
    difficulty: 'hard'
    stem: |
      Alpha particles have low external penetration. Which conclusion about alpha-emitting material follows?
    choices:
      - text: 'Internal contamination can still be hazardous.'
        correct: true
      - text: 'Paper shielding makes every exposure route harmless.'
        rationale: |
          This extends external shielding to material inside the body. Paper can block an outside source. Check whether that barrier is between the source and exposed tissue.
      - text: 'Low penetration means alpha particles cannot ionize matter.'
        rationale: |
          This confuses low range with no ionization. Alpha particles stop quickly. Check whether stopping can involve strong interaction with matter.
      - text: 'The material cannot affect living tissue in any circumstance.'
        rationale: |
          This turns limited penetration into zero biological effect. External shielding is effective. Check the internal-contamination case.
    explanation: |
      Alpha particles can strongly ionize material over short distances. Alpha-emitting material inside the body can therefore be hazardous.
    approved: false

  - id: q-chemistry-nuclear-chemistry-0019
    type: 'process-ordering'
    difficulty: 'exam'
    stem: |
      A nucleus undergoes alpha decay followed by beta-minus decay. What are the combined changes?
    choices:
      - text: 'A decreases by 4; Z decreases by 1'
        correct: true
      - text: 'A decreases by 4; Z decreases by 3'
        rationale: |
          This lowers Z for beta-minus instead of raising it. Alpha already lowers Z. Check beta-minus’s neutron-to-proton conversion.
      - text: 'A unchanged; Z decreases by 1'
        rationale: |
          This tracks only net proton change and ignores alpha’s nucleons. The Z change is partly correct. Check the mass number too.
      - text: 'A decreases by 5; Z decreases by 1'
        rationale: |
          This counts the emitted electron as one lost nucleon. An electron leaves. Check what particles contribute to mass number.
    explanation: |
      Alpha decay gives $A-4$ and $Z-2$. Beta-minus then leaves A fixed and raises Z by 1. The final values are $A-4$ and $Z-1$.
    approved: false

  - id: q-chemistry-nuclear-chemistry-0020
    type: 'compare-contrast'
    difficulty: 'exam'
    stem: |
      Which distinguishes ordinary chemical reactions from nuclear reactions?
    choices:
      - text: 'Chemical reactions leave nuclear counts unchanged.'
        correct: true
      - text: 'Chemical reactions routinely change an element’s proton count.'
        rationale: |
          This treats chemical bonding as a nuclear transformation. Products can be new substances. Check whether element identity changes through proton count.
      - text: 'Nuclear reactions rearrange only outer electrons.'
        rationale: |
          This assigns chemical-electron rearrangement to nuclear reactions. Atoms have electrons and nuclei. Check which region defines a nuclear process.
      - text: 'Every nuclear reaction must produce a different element.'
        rationale: |
          This turns a possible element change into a requirement. Many nuclear reactions alter Z. Check gamma emission’s unchanged Z.
    explanation: |
      Ordinary chemical reactions rearrange electrons and preserve nuclear proton and neutron counts. Nuclear processes involve nuclei and can change nuclides.
    approved: false
