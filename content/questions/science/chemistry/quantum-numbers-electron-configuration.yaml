meta:
  subject: science
  topic: chemistry
  subtopic: quantum-numbers-electron-configuration
  exams: ["upcat", "dlsucet", "ustet", "dost-sei"]
questions:
  - id: q-chemistry-quantum-numbers-electron-configuration-0001
    type: 'identify'
    difficulty: 'easy'
    stem: |
      What is the maximum number of electrons an $s$ orbital can hold?
    choices:
      - text: '2'
        correct: true
      - text: '6'
        rationale: |
          This uses a whole p subshell’s capacity for one orbital. A p subshell has three orbitals. Check whether the question asks about one orbital.
      - text: '10'
        rationale: |
          This uses a whole d subshell’s capacity. It has several orbitals. Check the single-orbital limit.
      - text: '14'
        rationale: |
          This uses a whole f subshell’s capacity. It contains seven orbitals. Check the single-orbital limit.
    explanation: |
      A single orbital holds at most two electrons. By the Pauli exclusion principle, those two electrons have opposite spin quantum numbers.
    approved: true

  - id: q-chemistry-quantum-numbers-electron-configuration-0002
    type: 'compare-contrast'
    difficulty: 'easy'
    stem: |
      Which statement correctly distinguishes a p subshell from one p orbital?
    choices:
      - text: 'Subshell: six; one orbital: two.'
        correct: true
      - text: 'Subshell: six; one orbital: six.'
        rationale: |
          This gives six electrons to one orbital. Six is the full subshell capacity. Check the distinction between an orbital and a subshell.
      - text: 'Subshell: two; one orbital: two.'
        rationale: |
          This gives a whole subshell the capacity of one orbital. Two is the orbital limit. Check the three orbitals in p.
      - text: 'Subshell: ten; one orbital: two.'
        rationale: |
          This mixes the d subshell’s total with the p single-orbital limit. Both are familiar capacities. Check the named subshell.
    explanation: |
      A p subshell contains three orbitals. Each holds at most two electrons. Thus the subshell can hold six, while one p orbital holds two.
    approved: true

  - id: q-chemistry-quantum-numbers-electron-configuration-0003
    type: 'simple-quantitative'
    difficulty: 'easy'
    stem: |
      For a d subshell, $\ell=2$. How many orbital labels are allowed by $m_\ell=-\ell,\ldots,+\ell$?
    choices:
      - text: '5 orbitals'
        correct: true
      - text: '10 orbitals'
        rationale: |
          This counts electrons at full occupancy rather than orbitals. Ten is the d electron capacity. Check what m_l labels.
      - text: '3 orbitals'
        rationale: |
          This uses the p subshell’s three orbital labels. Both are subshells. Check the given l value.
      - text: '2 orbitals'
        rationale: |
          This uses only the positive magnitude l. The value is 2. Check the integers from -l through +l, including zero.
    explanation: |
      A d subshell has $\ell=2$. The possible $m_\ell$ values are $-2,-1,0,1,2$. These five labels identify five orbitals.
    approved: true

  - id: q-chemistry-quantum-numbers-electron-configuration-0004
    type: 'simple-quantitative'
    difficulty: 'medium'
    stem: |
      Neutral nitrogen has atomic number 7. Which ground-state electron configuration follows the filling rules?
    choices:
      - text: '$1s^2\,2s^2\,2p^3$'
        correct: true
      - text: '$1s^2\,2s^2\,2p^5$'
        rationale: |
          This assigns five electrons to 2p and gives nine overall. A p subshell can hold five. Check the specified total.
      - text: '$1s^2\,2s^3\,2p^2$'
        rationale: |
          This puts three electrons in the single 2s orbital. The sum is seven. Check individual-orbital capacity as well as total count.
      - text: '$1s^2\,2s^2\,2p^4$'
        rationale: |
          This assigns four to 2p and gives eight overall. The lower shells are filled correctly. Check the remaining electrons.
    explanation: |
      Neutral nitrogen has seven electrons. Put two in 1s and two in 2s. The remaining three occupy 2p, giving $1s^2\,2s^2\,2p^3$.
    approved: true

  - id: q-chemistry-quantum-numbers-electron-configuration-0005
    type: 'simple-quantitative'
    difficulty: 'medium'
    stem: |
      An atom’s $2p^4$ ground-state subshell has four electrons in three equal-energy orbitals. Which occupancy pattern follows Hund and Pauli rules?
    choices:
      - text: '2, 1, 1'
        correct: true
      - text: '2, 2, 0'
        rationale: |
          This pairs two orbitals before occupying the third. The total count is four. Check Hund’s singly-before-pairing rule.
      - text: '3, 1, 0'
        rationale: |
          This puts three electrons into one orbital. The total is four. Check the two-electron orbital limit.
      - text: '4, 0, 0'
        rationale: |
          This puts every electron into one orbital. Keeping them together seems simple. Check both orbital capacity and Hund’s distribution.
    explanation: |
      Four electrons enter three equal-energy p orbitals. First place one in each with parallel spins. The fourth pairs with one, giving occupancies $2,1,1$ in any orbital order.
    approved: true

  - id: q-chemistry-quantum-numbers-electron-configuration-0006
    type: 'cause-effect'
    difficulty: 'hard'
    stem: |
      For neutral potassium’s ground state, does the electron after the argon core occupy 4s or 3d?
    choices:
      - text: '4s'
        correct: true
      - text: '3d because its n is smaller'
        rationale: |
          This uses n alone to decide energy. Three is smaller than four. Check the observed potassium ordering.
      - text: 'Both equally in the ground state'
        rationale: |
          This assumes different subshells have equal energies. Both are available labels. Check potassium’s ground-state configuration.
      - text: 'Neither because 3d subshells never exist'
        rationale: |
          This treats one filling order as making 3d nonexistent. 4s fills here first. Check that later elements can occupy 3d.
    explanation: |
      For neutral potassium, the next electron occupies 4s after the argon core. Its observed ground-state configuration is $[Ar]4s^1$. The relevant energy ordering favors 4s in this case.
    approved: true

  - id: q-chemistry-quantum-numbers-electron-configuration-0007
    type: 'classify'
    difficulty: 'hard'
    stem: |
      A student writes the configuration $1s^2\ 2s^2\ 2p^8$ for an atom. Is this a valid electron configuration?
    choices:
      - text: 'No; 2p exceeds its subshell capacity.'
        correct: true
      - text: 'Yes; the correct total permits any subshell count.'
        rationale: |
          This checks total electrons but not allowed occupation. A sum can match an atom. Check each subshell’s capacity.
      - text: 'No; 2s must always be filled after 2p.'
        rationale: |
          This reverses the ordinary 2s-2p order. Both are in shell 2. Check the introductory ground-state order.
      - text: 'Yes; the second-shell octet means 2p alone holds eight.'
        rationale: |
          This assigns the whole second-shell octet to p alone. Eight is a familiar shell count. Check that 2s and 2p are separate subshells.
    explanation: |
      The 2p superscript describes the whole p subshell. It contains three orbitals, each holding at most two electrons. Its maximum is six, so $2p^8$ exceeds that capacity.
    approved: true

  - id: q-chemistry-quantum-numbers-electron-configuration-0008
    type: 'classify'
    difficulty: 'hard'
    stem: |
      Three electrons must be placed into a set of three separate $p$ orbitals of the same energy. Which arrangement correctly follows Hund's Rule?
    choices:
      - text: 'One in each, with parallel spins.'
        correct: true
      - text: 'A pair in one, one in another, and the third empty.'
        rationale: |
          This pairs before filling the third orbital. The total count is still three. Check the singly-first ground-state rule.
      - text: 'All three in one orbital with no other occupation.'
        rationale: |
          This puts three into one orbital. A single box can look convenient. Check the two-electron limit.
      - text: 'Every distribution has the same ground-state energy.'
        rationale: |
          This treats every distribution as the same energy. Electron count stays fixed. Check the lowest-energy arrangement required by Hund’s rule.
    explanation: |
      Hund’s rule places electrons singly in equal-energy orbitals with parallel spins before pairing. Three electrons therefore occupy the three orbitals one each with parallel spins.
    approved: true

  - id: q-chemistry-quantum-numbers-electron-configuration-0009
    type: 'cause-effect'
    difficulty: 'medium'
    stem: |
      Can two electrons occupying the same orbital have the same spin?
    choices:
      - text: 'No; paired spins must be opposite.'
        correct: true
      - text: 'Yes; spin does not matter within one orbital.'
        rationale: |
          This ignores the fourth quantum number. The electrons share one orbital. Check Pauli’s full four-number restriction.
      - text: 'No; two electrons can never share any orbital.'
        rationale: |
          This makes the orbital limit one instead of two. Single occupation occurs before pairing. Check that opposite-spin pairing is allowed.
      - text: 'Yes; s orbitals are exempt from the spin restriction.'
        rationale: |
          This exempts s from Pauli. It has one orbital per subshell. Check that the exclusion rule applies to all orbitals.
    explanation: |
      Electrons in one orbital share n, l, and m_l. Pauli forbids identical sets of all four quantum numbers. Their spin quantum numbers must therefore be opposite.
    approved: true

  - id: q-chemistry-quantum-numbers-electron-configuration-0010
    type: 'simple-quantitative'
    difficulty: 'hard'
    stem: |
      A neutral atom has $1s^2\,2s^2\,2p^6\,3s^2\,3p^3$. What is its atomic number?
    choices:
      - text: '15'
        correct: true
      - text: '13'
        rationale: |
          This omits the 3s contribution of two electrons. The other terms sum to 13. Check every term.
      - text: '17'
        rationale: |
          This reads 3p as five instead of three electrons. A 3p^5 configuration is familiar. Check the actual superscript.
      - text: '5'
        rationale: |
          This counts only the outer 3s and 3p electrons. Those total five. Check all shells for the neutral atom’s Z.
    explanation: |
      Add the occupancies: $2+2+6+2+3=15$ electrons. A neutral atom has the same electron and proton counts, so $Z=15$.
    approved: true

  - id: q-chemistry-quantum-numbers-electron-configuration-0011
    type: 'simple-quantitative'
    difficulty: 'hard'
    stem: |
      An atom has the electron configuration $1s^2\ 2s^2\ 2p^6\ 3s^2\ 3p^3$. How many electrons are in its outermost energy level?
    choices:
      - text: '5'
        correct: true
      - text: '3'
        rationale: |
          This counts only 3p. It is the last term. Check every term with the highest n.
      - text: '15'
        rationale: |
          This sums all shells rather than the outer shell. Fifteen is the total. Check the requested shell.
      - text: '8'
        rationale: |
          This reports a filled-shell capacity rather than actual occupation. Eight is a familiar octet. Check the stated superscripts.
    explanation: |
      The highest principal shell is n=3. Its 3s and 3p occupancies are two and three. Their sum is $2+3=5$ outer-shell electrons.
    approved: true

  - id: q-chemistry-quantum-numbers-electron-configuration-0012
    type: 'predict-outcome'
    difficulty: 'exam'
    stem: |
      Neutral sodium (atomic number 11) has the configuration $1s^2\ 2s^2\ 2p^6\ 3s^1$. What is the correct electron configuration for the sodium ion $Na^+$?
    choices:
      - text: '$1s^2\,2s^2\,2p^6$'
        correct: true
      - text: '$1s^2\,2s^2\,2p^6\,3s^1$'
        rationale: |
          This leaves the neutral configuration unchanged. It is shown in the stem. Check the positive charge.
      - text: '$1s^2\,2s^2\,2p^6\,3s^2$'
        rationale: |
          This adds an electron instead of removing one. The sign is attached to the ion. Check how a cation forms.
      - text: '$1s^2\,2s^2\,2p^5$'
        rationale: |
          This removes two electrons. The result has nine. Check the specified single positive charge.
    explanation: |
      A $1+$ ion has one fewer electron than neutral sodium. The outer 3s electron is removed. The result is $1s^2\,2s^2\,2p^6$ with ten electrons.
    approved: true

  - id: q-chemistry-quantum-numbers-electron-configuration-0013
    type: 'predict-outcome'
    difficulty: 'exam'
    stem: |
      A transition-metal atom has the configuration $[Ar]4s^2\,3d^5$. Which subshell generally loses electrons first when it forms a cation?
    choices:
      - text: '4s'
        correct: true
      - text: '3d because it is written last'
        rationale: |
          This reverses removal order by following the last-written subshell. 3d is occupied after 4s in the simple filling pattern. Check ionization rather than filling.
      - text: '3p in the argon core'
        rationale: |
          This removes an inner 3p electron first. It has n=3. Check which occupied shell has the highest principal number.
      - text: '1s because it was filled first'
        rationale: |
          This removes a core 1s electron first. It was filled first. Check the outer electrons for ordinary cation formation.
    explanation: |
      Transition-metal cations generally lose the highest-n 4s electrons before 3d electrons. Filling order and electron-removal order are different rules.
    approved: true

  - id: q-chemistry-quantum-numbers-electron-configuration-0014
    type: 'predict-outcome'
    difficulty: 'exam'
    stem: |
      An ion has the electron configuration $1s^2\ 2s^2\ 2p^6$ and a charge of 1+. What is the atomic number of its neutral parent atom?
    choices:
      - text: '11'
        correct: true
      - text: '10'
        rationale: |
          This reports the ion’s electron count as Z. Ten electrons are present. Check the charge difference between electrons and protons.
      - text: '9'
        rationale: |
          This subtracts the positive charge. A plus sign indicates a deficit of electrons. Check whether proton count is larger or smaller.
      - text: '12'
        rationale: |
          This adds two for a one-unit charge. Positive charge needs adjustment. Check its magnitude.
    explanation: |
      The ion has $2+2+6=10$ electrons. A $1+$ charge means it has one more proton than electron. Thus $Z=10+1=11$.
    approved: true

  - id: q-chemistry-quantum-numbers-electron-configuration-0015
    type: 'identify'
    difficulty: 'easy'
    stem: |
      Which quantum number identifies the principal shell?
    choices:
      - text: 'n'
        correct: true
      - text: 'The subshell label l only'
        rationale: |
          This substitutes subshell type for principal shell. Both are orbital labels. Check which specifies the main shell.
      - text: 'The orbital label m_l only'
        rationale: |
          This substitutes an individual orbital label. It distinguishes orbitals within a subshell. Check the principal-shell label.
      - text: 'The spin label m_s only'
        rationale: |
          This substitutes spin for shell. It is one of the four numbers. Check which has positive-integer shell values.
    explanation: |
      The principal quantum number n identifies the principal shell. Its allowed values are positive integers.
    approved: false

  - id: q-chemistry-quantum-numbers-electron-configuration-0016
    type: 'simple-quantitative'
    difficulty: 'medium'
    stem: |
      For n=3, which list gives the allowed l values?
    choices:
      - text: '0, 1, 2'
        correct: true
      - text: '1, 2, 3'
        rationale: |
          This starts at 1 and ends at n. Principal shell values start at 1. Check that l starts at zero.
      - text: '0, 1, 2, 3'
        rationale: |
          This includes l=n. The shell number is 3. Check the upper limit n-1.
      - text: '-2, -1, 0, 1, 2'
        rationale: |
          This uses the symmetric range for m_l. Both are quantum numbers. Check which range applies to l.
    explanation: |
      Allowed l values run from 0 through n-1. For n=3, they are 0, 1, and 2.
    approved: false

  - id: q-chemistry-quantum-numbers-electron-configuration-0017
    type: 'classify'
    difficulty: 'hard'
    stem: |
      Which pair of n and l is forbidden?
    choices:
      - text: 'n=2, l=2'
        correct: true
      - text: 'n=3, l=2'
        rationale: |
          This treats l=2 as always forbidden. Some lower shells lack d subshells. Check whether n-1 permits 2 for n=3.
      - text: 'n=4, l=3'
        rationale: |
          This rejects the f label in shell 4. The l value is large. Check the permitted maximum for n=4.
      - text: 'n=1, l=0'
        rationale: |
          This assumes l must be positive. Principal n is positive. Check that an s subshell has l=0.
    explanation: |
      For n=2, l may be 0 or 1. The pair n=2, l=2 exceeds the allowed limit l=n-1.
    approved: false

  - id: q-chemistry-quantum-numbers-electron-configuration-0018
    type: 'identify'
    difficulty: 'hard'
    stem: |
      Which pair gives the two allowed electron spin quantum numbers?
    choices:
      - text: '$+0.5$ and $-0.5$'
        correct: true
      - text: '$+1.0$ and $-1.0$'
        rationale: |
          This uses whole-number signs instead of half values. Other quantum labels use integers. Check the distinct spin range.
      - text: '$0$ and $+1.0$'
        rationale: |
          This mixes zero with a positive integer. Orbital labels may include zero. Check the allowed m_s values.
      - text: '$0$ and $-1.0$'
        rationale: |
          This mixes zero with a negative integer. Magnetic labels may be negative. Check the separate spin rule.
    explanation: |
      The electron spin quantum number has two allowed values: $+\dfrac{1}{2}$ and $-\dfrac{1}{2}$. Opposite-spin electrons can share an orbital.
    approved: false

  - id: q-chemistry-quantum-numbers-electron-configuration-0019
    type: 'compare-contrast'
    difficulty: 'exam'
    stem: |
      Why can Aufbau filling order not always be read backward to remove electrons from a transition-metal atom?
    choices:
      - text: 'Subshell energies depend on occupancy.'
        correct: true
      - text: 'All subshell energies stay fixed for every atom and ion.'
        rationale: |
          This treats the practical filling pattern as a fixed universal energy list. The diagonal order is familiar. Check the dependence on occupancy and atom.
      - text: 'An ion must always lose the last-written subshell first.'
        rationale: |
          This treats notation order as ionization order. The last term often looks newest. Check actual cation-removal behavior.
      - text: 'Transition-metal ions never lose any outer-shell electrons.'
        rationale: |
          This confuses complex valence behavior with no electron loss. Transition metals have variable charges. Check how cations form.
    explanation: |
      Relative subshell energies change with atomic number and occupation. Transition-metal cations commonly lose 4s before 3d even though 4s was filled earlier.
    approved: false

  - id: q-chemistry-quantum-numbers-electron-configuration-0020
    type: 'predict-outcome'
    difficulty: 'exam'
    stem: |
      A simple diagonal filling prediction disagrees with an observed ground-state configuration for chromium or copper. Which should be used for the actual atom?
    choices:
      - text: 'The observed configuration'
        correct: true
      - text: 'The diagonal prediction must override the observation'
        rationale: |
          This treats the shortcut as exception-free. It predicts many configurations well. Check known exceptions.
      - text: 'Any arrangement with the right total is equally valid'
        rationale: |
          This checks electron total but ignores energy and occupancy rules. Several arrangements can share a total. Check the actual lowest-energy occupation.
      - text: 'The atom must lack s or d orbitals entirely'
        rationale: |
          This treats a filling exception as missing orbital types. The pattern differs. Check that the orbitals still exist.
    explanation: |
      The simple Aufbau pattern has known exceptions, including chromium and copper. Observed ground-state configurations describe the actual occupation.
    approved: false
