meta:
  subject: science
  topic: chemistry
  subtopic: gas-laws
  exams: ["upcat", "dlsucet", "ustet", "dost-sei"]
questions:
  - id: q-chemistry-gas-laws-0001
    type: 'simple-quantitative'
    difficulty: 'medium'
    stem: |
      A fixed sample of ideal gas occupies 5 liters at 3 atm. At constant temperature, its pressure increases to 15 atm. What is its new volume?
    choices:
      - text: '1 liter'
        correct: true
      - text: '5 liters'
        rationale: |
          This keeps volume fixed while pressure changes. The amount is fixed. Check whether fixed amount also means fixed volume.
      - text: '3 liters'
        rationale: |
          This copies the initial pressure number as a volume. The number 3 is in the data. Check the quantity and unit being calculated.
      - text: '25 liters'
        rationale: |
          This multiplies by the pressure factor instead of dividing. Pressure rises fivefold. Check that Boyle’s relationship is inverse.
    explanation: |
      For a fixed ideal-gas sample at constant temperature, $P_1V_1=P_2V_2$. Substitute $3\times5=15V_2$. Dividing by 15 gives $V_2=1$ liter.
    approved: true

  - id: q-chemistry-gas-laws-0002
    type: 'simple-quantitative'
    difficulty: 'medium'
    stem: |
      A fixed ideal-gas sample occupies 4 liters at 200 K. It is heated to 400 K at constant pressure. What is its new volume?
    choices:
      - text: '8 liters'
        correct: true
      - text: '2 liters'
        rationale: |
          This inverts the temperature ratio. Cooling would shrink the gas. Check whether temperature rises or falls.
      - text: '4 liters'
        rationale: |
          This treats fixed pressure as fixed volume. Pressure stays steady. Check which variable can change.
      - text: '16 liters'
        rationale: |
          This uses $400/100$ instead of $400/200$. The final temperature is 400 K. Check the stated initial temperature.
    explanation: |
      At fixed pressure and amount, $V_2=V_1\dfrac{T_2}{T_1}$. Thus $V_2=4\times\dfrac{400}{200}=8$ liters.
    approved: true

  - id: q-chemistry-gas-laws-0003
    type: 'simple-quantitative'
    difficulty: 'medium'
    stem: |
      A sealed, rigid container holds gas at 2 atm and 250 K. If it is heated to 500 K, what is the new pressure? (Gay-Lussac's Law: $\dfrac{P_1}{T_1} = \dfrac{P_2}{T_2}$)
    choices:
      - text: '4 atm'
        correct: true
      - text: '2 atm'
        rationale: |
          This treats a rigid container as keeping pressure fixed. Its size stays fixed. Check what heating changes.
      - text: '1 atm'
        rationale: |
          This inverts the temperature ratio. Boyle’s law uses an inverse relation. Check the pressure-temperature relation.
      - text: '8 atm'
        rationale: |
          This doubles pressure twice. Temperature doubles once. Check the ratio $T_2/T_1$.
    explanation: |
      At fixed amount and volume, $P_2=P_1\dfrac{T_2}{T_1}$. Thus $P_2=2\times\dfrac{500}{250}=4$ atm.
    approved: true

  - id: q-chemistry-gas-laws-0004
    type: 'simple-quantitative'
    difficulty: 'medium'
    stem: |
      A movable piston contains 2 moles of ideal gas in 3 liters. Gas is added until there are 6 moles, at unchanged pressure and temperature. What is the new volume?
    choices:
      - text: '9 liters'
        correct: true
      - text: '3 liters'
        rationale: |
          This keeps volume fixed while amount changes. Temperature and pressure are fixed. Check whether the piston can move.
      - text: '6 liters'
        rationale: |
          This copies the final mole count as volume. Six is the new amount. Check the starting volume per mole.
      - text: '1 liter'
        rationale: |
          This inverts the amount ratio. Some gas laws are inverse. Check Avogadro’s direct relationship.
    explanation: |
      At fixed pressure and temperature, $V_2=V_1\dfrac{n_2}{n_1}$. Thus $V_2=3\times\dfrac{6}{2}=9$ liters.
    approved: true

  - id: q-chemistry-gas-laws-0005
    type: 'simple-quantitative'
    difficulty: 'hard'
    stem: |
      A fixed ideal-gas sample is at 2 atm, 4 liters, and 200 K. Its pressure changes to 4 atm and its temperature to 400 K. Find its new volume.
    choices:
      - text: '4 liters'
        correct: true
      - text: '8 liters'
        rationale: |
          This accounts for heating but not pressure. Temperature doubles. Check both changing variables.
      - text: '2 liters'
        rationale: |
          This accounts for pressure but not heating. Pressure doubles. Check the temperature factor too.
      - text: '16 liters'
        rationale: |
          This puts the pressure factor in the numerator. Both variables double. Check which relation to volume is inverse.
    explanation: |
      For the fixed sample, $V_2=V_1\dfrac{P_1}{P_2}\dfrac{T_2}{T_1}$. Substitute $4\times\dfrac{2}{4}\times\dfrac{400}{200}=4$ liters.
    approved: true

  - id: q-chemistry-gas-laws-0006
    type: 'simple-quantitative'
    difficulty: 'hard'
    stem: |
      How many moles of gas are in a 10-liter container at a pressure of 3 atm and a temperature of 300 K? (Use $R = 0.0821 \, \text{L·atm/(mol·K)}$.)
    choices:
      - text: 'About 1.22 moles'
        correct: true
      - text: 'About 0.82 moles'
        rationale: |
          This inverts the fraction to RT/PV. Both products are needed. Check which way division isolates n.
      - text: 'About 3.00 moles'
        rationale: |
          This copies the pressure as the mole count. Pressure is 3 atm. Check the requested quantity and units.
      - text: 'About 24.63 moles'
        rationale: |
          This stops after calculating RT. That product is part of the equation. Check that the entire expression isolates n.
    explanation: |
      Rearrange to $n=\dfrac{PV}{RT}$. Substitute $n=\dfrac{3\times10}{0.0821\times300}=\dfrac{30}{24.63}\approx1.22$ moles.
    approved: true

  - id: q-chemistry-gas-laws-0007
    type: 'classify'
    difficulty: 'hard'
    stem: |
      Which temperature replaces $25^\circ C$ in a proportional gas-law calculation using kelvin?
    choices:
      - text: '298.15 K'
        correct: true
      - text: '25 K'
        rationale: |
          This treats Celsius as an absolute scale. Its intervals match kelvin’s. Check the different zero points.
      - text: '298 K exactly'
        rationale: |
          This uses 273 as an exact offset. It is a familiar classroom approximation. Check whether rounding is permitted.
      - text: '6828.75 K'
        rationale: |
          This multiplies by the offset. Some unit conversions multiply. Check that this conversion adds 273.15.
    explanation: |
      Temperature ratios require an absolute scale. Add 273.15 to convert Celsius to kelvin. Thus $25^\circ C=298.15$ K.
    approved: true

  - id: q-chemistry-gas-laws-0008
    type: 'classify'
    difficulty: 'hard'
    stem: |
      A fixed ideal-gas sample is compressed at constant temperature. Which description fits Boyle’s law?
    choices:
      - text: 'Smaller volume, higher pressure'
        correct: true
      - text: 'Smaller volume, lower pressure'
        rationale: |
          This assumes pressure and volume move together. Other gas laws use direct relations. Check Boyle’s inverse relationship.
      - text: 'Smaller volume, unchanged pressure'
        rationale: |
          This confuses fixed temperature with fixed pressure. One variable is held steady. Check which one the stem fixes.
      - text: 'Smaller volume, fewer moles automatically'
        rationale: |
          This assumes compression removes gas. Gas can escape from an open system. Check that the amount is fixed.
    explanation: |
      For a fixed ideal-gas amount at constant temperature, PV stays constant. A smaller V therefore requires a larger P.
    approved: true

  - id: q-chemistry-gas-laws-0009
    type: 'classify'
    difficulty: 'hard'
    stem: |
      A fixed ideal-gas sample changes pressure, volume, and temperature. Which two-state relation includes all three changes?
    choices:
      - text: 'Combined gas law'
        correct: true
      - text: 'Boyle’s law at fixed temperature'
        rationale: |
          This applies Boyle’s law despite changing temperature. Pressure and volume appear. Check the fixed-temperature condition.
      - text: 'Charles’s law at fixed pressure'
        rationale: |
          This applies Charles’s law despite changing pressure. Volume and temperature appear. Check the fixed-pressure condition.
      - text: 'Pressure-temperature law at fixed volume'
        rationale: |
          This applies the pressure-temperature law despite changing volume. Pressure and temperature appear. Check the fixed-volume condition.
    explanation: |
      For the same amount of ideal gas, $PV/T$ is constant between states. The combined relation includes the pressure, volume, and temperature changes.
    approved: true

  - id: q-chemistry-gas-laws-0010
    type: 'classify'
    difficulty: 'hard'
    stem: |
      A problem gives a single set of values for pressure, volume, moles, and temperature, all at one moment, with no "before and after" comparison. Which law should be used?
    choices:
      - text: 'Ideal gas law, $PV=nRT$'
        correct: true
      - text: 'Combined gas law between two states'
        rationale: |
          This chooses a comparison without a second state. Several variables are known. Check whether the equation includes n directly.
      - text: 'Boyle’s law at fixed amount and temperature'
        rationale: |
          This selects Boyle’s law because P and V appear. They are two known variables. Check whether amount and temperature also enter directly.
      - text: 'Avogadro’s law at fixed pressure and temperature'
        rationale: |
          This selects Avogadro’s law because n appears. Amount is known. Check whether pressure and temperature enter the equation too.
    explanation: |
      The ideal gas law $PV=nRT$ directly relates pressure, volume, amount, and absolute temperature at one state.
    approved: true

  - id: q-chemistry-gas-laws-0011
    type: 'predict-outcome'
    difficulty: 'medium'
    stem: |
      Under which conditions is a real gas generally closest to ideal behavior?
    choices:
      - text: 'Low pressure, high temperature'
        correct: true
      - text: 'High pressure, low temperature'
        rationale: |
          This favors crowding and strong attraction effects. High pressure may seem easier to measure. Check where ideal assumptions work best.
      - text: 'Low pressure, low temperature'
        rationale: |
          This treats low pressure alone as enough. Spaced-out particles help. Check how low temperature strengthens attraction effects.
      - text: 'High pressure, high temperature'
        rationale: |
          This treats heating alone as enough. High temperature helps. Check whether high pressure still makes particle volume important.
    explanation: |
      Real gases are usually closest to ideal behavior at low pressure and high temperature. Particle volume and attractions then have smaller effects on the gas model.
    approved: true

  - id: q-chemistry-gas-laws-0012
    type: 'identify'
    difficulty: 'medium'
    stem: |
      A fixed ideal-gas sample is heated under a movable piston at constant pressure. Which quantity remains constant?
    choices:
      - text: '$V/T$ with T in kelvin'
        correct: true
      - text: '$VT$ with T in kelvin'
        rationale: |
          This uses a product for a direct relation. Both variables increase. Check which ratio remains constant.
      - text: '$V/T$ with T in Celsius'
        rationale: |
          This uses Celsius in a ratio. Celsius is convenient for measurement. Check that the scale is absolute.
      - text: '$PV$ despite changing temperature'
        rationale: |
          This applies constant PV while temperature changes. Boyle’s law is familiar. Check its fixed-temperature condition.
    explanation: |
      Charles’s law keeps V/T constant for a fixed gas amount at constant pressure. T must be in kelvin.
    approved: true

  - id: q-chemistry-gas-laws-0013
    type: 'cause-effect'
    difficulty: 'medium'
    stem: |
      More ideal gas is added to a rigid vessel at constant temperature. What happens?
    choices:
      - text: 'Pressure rises.'
        correct: true
      - text: 'Volume rises while pressure stays fixed.'
        rationale: |
          This applies constant-pressure expansion to a rigid vessel. Avogadro’s law allows volume change. Check whether the walls can move.
      - text: 'Pressure stays fixed because temperature is fixed.'
        rationale: |
          This assumes fixed temperature fixes pressure. Temperature remains steady. Check the changed amount.
      - text: 'Pressure falls as the amount increases.'
        rationale: |
          This inverts pressure’s relation to amount. Some gas relations are inverse. Check the fixed-temperature, fixed-volume equation.
    explanation: |
      From $P=nRT/V$, pressure rises with amount at fixed temperature and volume. Adding gas to a rigid vessel therefore raises pressure.
    approved: true

  - id: q-chemistry-gas-laws-0014
    type: 'simple-quantitative'
    difficulty: 'exam'
    stem: |
      A sealed, rigid ideal-gas container is at 2 atm and $27^\circ C$. It is heated to $327^\circ C$. Find its new pressure, rounded to the nearest atm.
    choices:
      - text: '4 atm'
        correct: true
      - text: '24 atm'
        rationale: |
          This uses $327/27$, giving about 24 atm. Celsius values are stated. Check that both ratio values use kelvin.
      - text: '2 atm'
        rationale: |
          This keeps pressure unchanged because the container is rigid. Rigidity fixes volume. Check what heating changes.
      - text: '8 atm'
        rationale: |
          This doubles pressure twice. The kelvin ratio is close to two. Check that the factor is applied once.
    explanation: |
      Convert with 273.15: $T_1=300.15$ K and $T_2=600.15$ K. Then $P_2=2\times\dfrac{600.15}{300.15}\approx4.00$ atm.
    approved: true

  - id: q-chemistry-gas-laws-0015
    type: 'classify'
    difficulty: 'exam'
    stem: |
      For $R=0.0821\,\mathrm{L\,atm\,mol^{-1}\,K^{-1}}$, which pressure and volume units go directly into $PV=nRT$?
    choices:
      - text: 'atm and L'
        correct: true
      - text: 'kPa and L'
        rationale: |
          This keeps kilopascals with an atmosphere-based R. Both measure pressure. Check the pressure unit printed in R.
      - text: 'atm and mL'
        rationale: |
          This keeps milliliters with a liter-based R. Both measure volume. Check the volume unit printed in R.
      - text: 'atm and L, with Celsius for T'
        rationale: |
          This uses Celsius with a kelvin-based R. Celsius is familiar. Check the absolute-temperature requirement.
    explanation: |
      This value of R uses liters, atmospheres, moles, and kelvin. Use pressure in atm and volume in L with those units.
    approved: true

  - id: q-chemistry-gas-laws-0016
    type: 'identify'
    difficulty: 'easy'
    stem: |
      Which condition is required by Boyle’s law for a fixed gas sample?
    choices:
      - text: 'Constant temperature'
        correct: true
      - text: 'Constant pressure during every change'
        rationale: |
          This imports Charles’s fixed-pressure condition. Both are gas laws. Check which quantity Boyle holds fixed.
      - text: 'Constant volume during every change'
        rationale: |
          This forbids the volume change being compared. Rigid containers are familiar. Check Boyle’s changing variables.
      - text: 'An amount that changes proportionally with volume'
        rationale: |
          This imports Avogadro’s changing-amount relation. Amount is a gas variable. Check that the same gas sample is used.
    explanation: |
      Boyle’s law relates pressure and volume at fixed temperature and fixed gas amount.
    approved: false

  - id: q-chemistry-gas-laws-0017
    type: 'compare-contrast'
    difficulty: 'medium'
    stem: |
      What distinguishes Avogadro’s law from the combined gas law?
    choices:
      - text: 'Avogadro varies amount; the combined law fixes it.'
        correct: true
      - text: 'Both require the amount to change in every comparison.'
        rationale: |
          This carries changing amount into the combined law. Both compare gas states. Check the fixed-sample condition.
      - text: 'Avogadro fixes volume; the combined law fixes pressure.'
        rationale: |
          This reverses the variables held fixed. Different laws fix different quantities. Check each equation’s conditions.
      - text: 'Both permit Celsius in temperature ratios.'
        rationale: |
          This ignores absolute temperature. Celsius shares kelvin’s interval size. Check the scale’s zero point.
    explanation: |
      Avogadro’s law compares volume and amount at fixed pressure and temperature. The combined law compares two states of a fixed gas amount.
    approved: false

  - id: q-chemistry-gas-laws-0018
    type: 'simple-quantitative'
    difficulty: 'hard'
    stem: |
      Two ideal-gas samples have the same pressure. A has volume V and temperature T. B has volume 2V and temperature 2T. Compare their mole amounts.
    choices:
      - text: 'They are equal.'
        correct: true
      - text: 'B has twice as many moles.'
        rationale: |
          This counts volume’s factor but omits temperature’s. Larger volume can mean more gas. Check both factors.
      - text: 'B has half as many moles.'
        rationale: |
          This counts temperature’s factor but omits volume’s. Hotter gas can occupy more space. Check the ratio V/T.
      - text: 'B has four times as many moles.'
        rationale: |
          This multiplies both factors. Both variables double. Check which factor belongs in the denominator.
    explanation: |
      Use $n=PV/(RT)$. For B, $n_B=P(2V)/(R(2T))=PV/(RT)=n_A$. The factors of 2 cancel.
    approved: false

  - id: q-chemistry-gas-laws-0019
    type: 'process-ordering'
    difficulty: 'hard'
    stem: |
      Before calculating n from $PV=nRT$, which preparation avoids unit errors?
    choices:
      - text: 'Convert T to kelvin; match P and V to R.'
        correct: true
      - text: 'Insert Celsius; add 273.15 to the mole answer.'
        rationale: |
          This applies a temperature offset to moles. Adding 273.15 is familiar. Check what quantity is converted.
      - text: 'Use any pressure unit if volume is in liters.'
        rationale: |
          This treats liters as enough unit consistency. Volume is one relevant unit. Check pressure in R too.
      - text: 'Match P and V but ignore R’s temperature unit.'
        rationale: |
          This omits the absolute-temperature requirement. Pressure and volume may match. Check all units in R.
    explanation: |
      Convert the temperature to kelvin. Make pressure and volume units match R. Then rearrange and calculate the amount.
    approved: false

  - id: q-chemistry-gas-laws-0020
    type: 'simple-quantitative'
    difficulty: 'exam'
    stem: |
      A gas warms from $20^\circ C$ to $30^\circ C$. What is its temperature increase in kelvin?
    choices:
      - text: '10 K'
        correct: true
      - text: '283.15 K'
        rationale: |
          This adds the offset to a difference. Absolute readings need the offset. Check whether the requested quantity is a reading or change.
      - text: '303.15 K'
        rationale: |
          This reports the final reading alone. It is 303.15 K. Check that the question asks for an increase.
      - text: '1.5 K'
        rationale: |
          This divides the Celsius readings. Ratios occur in gas laws. Check that an increase here means subtraction.
    explanation: |
      The readings are 293.15 K and 303.15 K. Subtract: $303.15-293.15=10$ K. The conversion offset cancels.
    approved: false
