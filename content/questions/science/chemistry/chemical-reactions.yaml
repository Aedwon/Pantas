questions:
  - id: q-chemistry-chemical-reactions-0001
    type: identify
    difficulty: easy
    stem: |
      Classify this reaction: $2H_2 + O_2 \rightarrow 2H_2O$
    choices:
      - text: Synthesis
        correct: true
      - text: Decomposition
        rationale: |
          You picked the opposite reaction type. Decomposition breaks one complex substance down into simpler ones, but here two substances combine into one.
      - text: Single replacement
        rationale: |
          You picked a replacement reaction. Single replacement requires a lone element swapping into a compound, not two elements combining.
      - text: Double replacement
        rationale: |
          You picked partner-swapping. Double replacement involves two compounds exchanging ions, whereas this reaction combines simple elements.
    explanation: |
      Two simple substances ($H_2$ and $O_2$) combine into one product ($H_2O$). Multiple substances merging into one is synthesis.
    approved: true
  - id: q-chemistry-chemical-reactions-0002
    type: identify
    difficulty: easy
    stem: |
      Classify this reaction: $2H_2O_2 \rightarrow 2H_2O + O_2$
    choices:
      - text: Decomposition
        correct: true
      - text: Synthesis
        rationale: |
          You picked the reaction that builds compounds. Synthesis merges simple reactants into a single product, while this reaction breaks one reactant down.
      - text: Single replacement
        rationale: |
          You looked for an element swap. Single replacement has a free element trade places with an element in a compound, which is not happening here.
      - text: Combustion
        rationale: |
          You picked rapid oxygen reaction. Combustion requires a hydrocarbon reacting with oxygen to yield $CO_2$ and $H_2O$.
    explanation: |
      One compound ($H_2O_2$) breaks down into two simpler substances ($H_2O$ and $O_2$). One substance splitting into many is decomposition.
    approved: true
  - id: q-chemistry-chemical-reactions-0003
    type: identify
    difficulty: easy
    stem: |
      Classify this reaction: $Zn + 2HCl \rightarrow ZnCl_2 + H_2$
    choices:
      - text: Single replacement
        correct: true
      - text: Double replacement
        rationale: |
          You assumed both reactants trade partners. Double replacement starts with two compounds, but zinc here is a free lone element.
      - text: Synthesis
        rationale: |
          You picked the combining reaction. Synthesis produces a single combined product, but this reaction produces two distinct products.
      - text: Decomposition
        rationale: |
          You picked the breaking-down reaction. Decomposition starts with a single reactant breaking apart, but here two reactants are present.
    explanation: |
      Zinc, a single free element, swaps places with hydrogen inside the compound $HCl$. One free element replacing another element in a compound is single replacement.
    approved: true
  - id: q-chemistry-chemical-reactions-0004
    type: identify
    difficulty: medium
    stem: |
      Classify this reaction: $AgNO_3 + NaCl \rightarrow AgCl + NaNO_3$
    choices:
      - text: Double replacement
        correct: true
      - text: Single replacement
        rationale: |
          You looked for a single element swap. Single replacement requires one lone element, but both $AgNO_3$ and $NaCl$ are compounds.
      - text: Synthesis
        rationale: |
          You picked the combining reaction. Synthesis merges reactants into a single product, but two new compounds are formed here.
      - text: Decomposition
        rationale: |
          You picked the breaking-down reaction. Decomposition starts with a single compound reactant, but two compound reactants are present here.
    explanation: |
      Both reactants are already compounds (no lone free element), and they simply trade partners: silver pairs with chloride, and sodium pairs with nitrate. Two compounds trading parts is double replacement.
    approved: true
  - id: q-chemistry-chemical-reactions-0005
    type: identify
    difficulty: medium
    stem: |
      Classify this reaction: $CH_4 + 2O_2 \rightarrow CO_2 + 2H_2O$
    choices:
      - text: Combustion
        correct: true
      - text: Synthesis
        rationale: |
          You picked the combining reaction. Synthesis forms a single product, but combustion produces two products ($CO_2$ and $H_2O$).
      - text: Single replacement
        rationale: |
          You identified oxygen as a lone element swapping. Oxygen reacts with a hydrocarbon to burn it, which defines combustion.
      - text: Decomposition
        rationale: |
          You focused on methane breaking down. Methane reacts with oxygen gas in a combustion process rather than decomposing spontaneously.
    explanation: |
      A carbon-hydrogen compound reacts with oxygen, releasing energy and producing carbon dioxide and water: the signature pattern of combustion.
    approved: true
  - id: q-chemistry-chemical-reactions-0006
    type: simple-quantitative
    difficulty: medium
    stem: |
      Balance this equation by finding the correct coefficient for $H_2$: $N_2 + \_\_H_2 \rightarrow 2NH_3$
    choices:
      - text: "3"
        correct: true
      - text: "2"
        rationale: |
          You used the subscript from $NH_3$ or $H_2$. To balance 6 total hydrogen atoms ($2 \times 3$), you need a coefficient of 3 since $3 \times 2 = 6$.
      - text: "6"
        rationale: |
          You used the total hydrogen atom count as the coefficient. Since $H_2$ comes in pairs, divide the 6 needed hydrogens by 2 to get 3.
      - text: "1"
        rationale: |
          You assumed no multiplier was needed. A coefficient of 1 gives only 2 hydrogen atoms on the left, failing to match the 6 on the right.
    explanation: |
      With a coefficient of 2 on $NH_3$, the right side has 6 hydrogen atoms ($2 \times 3$). To match 6 hydrogen atoms on the left, $H_2$ needs a coefficient of 3, since $3 \times 2 = 6$.
    approved: true
  - id: q-chemistry-chemical-reactions-0007
    type: simple-quantitative
    difficulty: medium
    stem: |
      Balance this equation by finding the correct coefficient for $O_2$: $CH_4 + \_\_O_2 \rightarrow CO_2 + 2H_2O$
    choices:
      - text: "2"
        correct: true
      - text: "1"
        rationale: |
          You counted oxygen in $CO_2$ only. Product oxygen comes from both $CO_2$ (2) and $2H_2O$ (2), requiring 4 oxygen atoms total.
      - text: "3"
        rationale: |
          You overcounted the required $O_2$ molecules. A coefficient of 3 gives 6 oxygen atoms ($3 \times 2$), exceeding the 4 needed.
      - text: "4"
        rationale: |
          You used the total atom count as the coefficient. You need 4 oxygen atoms total, which requires 2 $O_2$ molecules since $2 \times 2 = 4$.
    explanation: |
      On the right, $CO_2$ contributes 2 oxygen atoms and $2H_2O$ contributes 2 more, totaling 4. Since each $O_2$ molecule supplies 2 oxygen atoms, a coefficient of 2 gives $2 \times 2 = 4$ oxygen atoms on the left, matching the right side.
    approved: true
  - id: q-chemistry-chemical-reactions-0008
    type: simple-quantitative
    difficulty: hard
    stem: |
      Balance this equation by finding the correct coefficient for $Fe$: $\_\_Fe + 3O_2 \rightarrow 2Fe_2O_3$
    choices:
      - text: "4"
        correct: true
      - text: "2"
        rationale: |
          You used the subscript of $Fe_2$. The product $2Fe_2O_3$ has 2 formula units, each with 2 iron atoms, giving $2 \times 2 = 4$ iron atoms total.
      - text: "3"
        rationale: |
          You matched the coefficient of $O_2$. Iron and oxygen are balanced independently; iron needs 4 atoms to balance $2Fe_2O_3$.
      - text: "6"
        rationale: |
          You used the total oxygen atom count ($3 \times 2 = 6$). Iron atoms total 4 on the right, requiring a coefficient of 4.
    explanation: |
      The right side has $2 \times 2 = 4$ iron atoms (from $2Fe_2O_3$). To match, $Fe$ needs a coefficient of 4 on the left. (Checking oxygen: $3 \times 2 = 6$ on the left, and $2 \times 3 = 6$ on the right: also balanced.)
    approved: true
  - id: q-chemistry-chemical-reactions-0009
    type: classify
    difficulty: hard
    stem: |
      A student tries to balance an equation containing $H_2O$ by changing it to $H_2O_2$ instead of adding a coefficient in front of it. Is this a valid way to balance the equation?
    choices:
      - text: 'No: changing a subscript creates an entirely different substance (hydrogen peroxide), not a balanced version of water.'
        correct: true
      - text: 'Yes: subscripts and coefficients can be adjusted interchangeably to balance an equation.'
        rationale: |
          You assumed subscripts can be altered. Subscripts define chemical identity; changing them changes the compound itself.
      - text: 'Yes: as long as the total atom count comes out even on both sides.'
        rationale: |
          You prioritized atom counts over compound identity. Changing subscripts alters chemical formulas, creating invalid reactions.
      - text: 'No: but only because $H_2O_2$ does not really exist.'
        rationale: |
          You questioned the existence of hydrogen peroxide. $H_2O_2$ is real, but modifying subscripts changes the reaction's actual compounds.
    explanation: |
      Only coefficients (numbers in front of a formula) may be changed to balance an equation. Changing the subscript inside a formula changes the substance's identity entirely: $H_2O_2$ is hydrogen peroxide, a completely different compound from water.
    approved: true
  - id: q-chemistry-chemical-reactions-0010
    type: classify
    difficulty: hard
    stem: |
      A student adjusts an equation's coefficients until nitrogen atoms match on both sides, then declares the equation balanced without checking hydrogen. Is this equation confirmed to be balanced?
    choices:
      - text: 'No: every element''s atom count must match on both sides, not just nitrogen; hydrogen still needs to be checked.'
        correct: true
      - text: 'Yes: matching just one element is enough to confirm the whole equation is balanced.'
        rationale: |
          You assumed balancing one element balances all. Every single element in an equation must be verified on both sides.
      - text: 'Yes: hydrogen automatically balances whenever nitrogen does.'
        rationale: |
          You assumed linked balancing. Nitrogen and hydrogen counts depend on different coefficients and must be checked separately.
      - text: 'No: but only because nitrogen itself was checked incorrectly.'
        rationale: |
          You focused on nitrogen's calculation. Even if nitrogen is correct, an equation remains unbalanced until all elements are checked.
    explanation: |
      An equation is balanced only when every single element matches on both sides. Stopping after checking just one element (like nitrogen) can miss an imbalance in another element (like hydrogen).
    approved: true
  - id: q-chemistry-chemical-reactions-0011
    type: compare-contrast
    difficulty: hard
    stem: |
      Which statement correctly tells apart synthesis and decomposition reactions?
    choices:
      - text: Synthesis combines multiple substances into one product; decomposition breaks one substance into multiple products.
        correct: true
      - text: Synthesis breaks one substance into multiple products; decomposition combines multiple substances into one.
        rationale: |
          You swapped the two definitions. Synthesis builds a single complex product, while decomposition splits a compound.
      - text: Both reaction types always involve exactly the same number of reactants and products.
        rationale: |
          You assumed equal reactant and product counts. Synthesis has multiple reactants and one product; decomposition has the reverse.
      - text: Synthesis only happens with elements; decomposition only happens with compounds.
        rationale: |
          You added overly strict reactant rules. Synthesis can combine compounds (like $CaO + H_2O$), and decomposition can yield compounds.
    explanation: |
      These are mirror-image reactions: synthesis is many merging into one, and decomposition is one splitting into many. Checking which side of the arrow has more separate substances tells them apart.
    approved: true
  - id: q-chemistry-chemical-reactions-0012
    type: compare-contrast
    difficulty: hard
    stem: |
      Which statement correctly tells apart single replacement and double replacement reactions?
    choices:
      - text: Single replacement has one free element swapping into a compound; double replacement has two compounds trading their parts with each other.
        correct: true
      - text: Single replacement always involves two compounds; double replacement always involves one free element.
        rationale: |
          You swapped the reactant patterns. Single replacement starts with a lone element and a compound; double replacement starts with two compounds.
      - text: Both reaction types are identical, just with different names.
        rationale: |
          You treated the two reactions as identical. The presence of a free lone element in single replacement distinguishes the two.
      - text: Single replacement only happens with metals; double replacement only happens with nonmetals.
        rationale: |
          You restricted replacement by metal status. Nonmetals like halogens also participate in single replacement reactions.
    explanation: |
      If only one reactant is a lone element and the other is a compound, it is single replacement. If both reactants are already compounds and simply trade partners, it is double replacement.
    approved: true
  - id: q-chemistry-chemical-reactions-0013
    type: cause-effect
    difficulty: medium
    stem: |
      Why must a chemical equation be balanced, with the same number of atoms of each element on both sides?
    choices:
      - text: Because matter cannot be created or destroyed in a chemical reaction (the Law of Conservation of Mass).
        correct: true
      - text: Because chemical equations are only a stylistic convention with no physical meaning.
        rationale: |
          You treated balancing as arbitrary style. Balancing reflects the physical conservation of matter in real reactions.
      - text: Because unbalanced equations are illegal to write on an exam.
        rationale: |
          You cited test rules instead of physical law. Conservation of mass is the underlying scientific law requiring balance.
      - text: Because only reactions with equal numbers of reactants and products actually occur.
        rationale: |
          You confused molecule counts with atom counts. Reactant and product molecule counts can differ as long as atom counts match.
    explanation: |
      The Law of Conservation of Mass says atoms are neither created nor destroyed in a reaction: every atom present in the reactants must still be accounted for in the products, which is exactly what a balanced equation shows.
    approved: true
  - id: q-chemistry-chemical-reactions-0014
    type: simple-quantitative
    difficulty: exam
    stem: |
      Balance this equation by finding the correct coefficient for $Al$: $\_\_Al + 3O_2 \rightarrow 2Al_2O_3$
    choices:
      - text: "4"
        correct: true
      - text: "2"
        rationale: |
          You used the subscript from $Al_2$. The product $2Al_2O_3$ contains $2 \times 2 = 4$ aluminum atoms total.
      - text: "3"
        rationale: |
          You copied the coefficient of $O_2$. Aluminum and oxygen must be balanced separately based on their atom counts.
      - text: "6"
        rationale: |
          You used the total oxygen count ($3 \times 2 = 6$). Aluminum atoms total 4 on the right, so 4 $Al$ atoms are needed.
    explanation: |
      The right side has $2 \times 2 = 4$ aluminum atoms (from $2Al_2O_3$). To match, $Al$ needs a coefficient of 4. (Checking oxygen: $3 \times 2 = 6$ on the left, and $2 \times 3 = 6$ on the right: also balanced.)
    approved: true
  - id: q-chemistry-chemical-reactions-0015
    type: identify
    difficulty: exam
    stem: |
      Classify this reaction: $2KClO_3 \rightarrow 2KCl + 3O_2$
    choices:
      - text: Decomposition
        correct: true
      - text: Synthesis
        rationale: |
          You picked the combining reaction. Synthesis merges multiple reactants into one product, but here one reactant splits.
      - text: Single replacement
        rationale: |
          You looked for an element swap. Single replacement requires a lone element reactant swapping into a compound.
      - text: Double replacement
        rationale: |
          You looked for ion swapping. Double replacement requires two compound reactants trading ionic partners.
    explanation: |
      One compound ($KClO_3$) breaks apart into two different simpler substances ($KCl$ and $O_2$). Even though it produces two separate products instead of just one, this is still a single substance splitting apart: decomposition.
    approved: true
