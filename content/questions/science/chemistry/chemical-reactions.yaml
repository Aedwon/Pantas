meta:
  subject: science
  topic: chemistry
  subtopic: chemical-reactions
  exams: ["upcat", "dlsucet", "ustet", "dost-sei"]
questions:
  - id: q-chemistry-chemical-reactions-0001
    type: 'identify'
    difficulty: 'easy'
    stem: |
      Using the reactant-and-product pattern, classify $2H_2+O_2\rightarrow2H_2O$.
    choices:
      - text: 'Synthesis'
        correct: true
      - text: 'Decomposition'
        rationale: |
          This reverses the direction of the pattern. Water could be broken down in a different reaction. Check which side has the single substance.
      - text: 'Single replacement'
        rationale: |
          This reads an element reactant as replacing another element. Free elements occur in replacement reactions. Check whether a compound is also a reactant.
      - text: 'Double replacement'
        rationale: |
          This reads any two-reactant equation as an ion swap. Double replacement also uses two reactants. Check whether both reactants are compounds.
    explanation: |
      Hydrogen and oxygen are two reactant substances. They form one product substance, water. This matches the combination, or synthesis, pattern.
    approved: true

  - id: q-chemistry-chemical-reactions-0002
    type: 'identify'
    difficulty: 'easy'
    stem: |
      Classify this reaction: $2H_2O_2 \rightarrow 2H_2O + O_2$
    choices:
      - text: 'Decomposition'
        correct: true
      - text: 'Synthesis'
        rationale: |
          This reverses the pattern. The equation links related substances. Check whether the single compound is a reactant or product.
      - text: 'Single replacement'
        rationale: |
          This treats the free oxygen product as a free-element reactant. Replacement involves an element. Check which side of the arrow it is on.
      - text: 'Combustion'
        rationale: |
          This identifies combustion just because oxygen appears. Combustion commonly consumes oxygen. Check whether oxygen is consumed or produced here.
    explanation: |
      One reactant substance, hydrogen peroxide, forms water and oxygen. One substance forming several products matches decomposition.
    approved: true

  - id: q-chemistry-chemical-reactions-0003
    type: 'identify'
    difficulty: 'easy'
    stem: |
      Classify this reaction: $Zn + 2HCl \rightarrow ZnCl_2 + H_2$
    choices:
      - text: 'Single replacement'
        correct: true
      - text: 'Double replacement'
        rationale: |
          This counts two reactants and assumes both are compounds. Two compounds can exchange ions. Check whether zinc is an element or compound.
      - text: 'Synthesis'
        rationale: |
          This focuses on zinc joining chlorine. A new compound does form. Check whether there is one product or more than one.
      - text: 'Decomposition'
        rationale: |
          This focuses on hydrogen leaving hydrogen chloride. A compound is broken up in part. Check whether another reactant participates.
    explanation: |
      Zinc begins as a free element and displaces hydrogen from hydrogen chloride. Zinc chloride and hydrogen form. This matches single replacement.
    approved: true

  - id: q-chemistry-chemical-reactions-0004
    type: 'identify'
    difficulty: 'medium'
    stem: |
      Aqueous silver nitrate and sodium chloride form solid $AgCl$: $AgNO_3+NaCl\rightarrow AgCl+NaNO_3$. Which introductory pattern fits?
    choices:
      - text: 'Double replacement'
        correct: true
      - text: 'Single replacement'
        rationale: |
          This treats an ion as a free-element reactant. Silver appears in the formula. Check whether it begins in a compound.
      - text: 'Synthesis'
        rationale: |
          This focuses on forming silver chloride alone. That product is important. Check the full equation’s two-product pattern.
      - text: 'Decomposition'
        rationale: |
          This focuses on the nitrate group remaining intact. Products are rearranged. Check whether the equation begins with one reactant or two.
    explanation: |
      Silver ions and chloride ions form solid silver chloride. The remaining sodium and nitrate ions stay in solution. The ion exchange and precipitate match double replacement.
    approved: true

  - id: q-chemistry-chemical-reactions-0005
    type: 'identify'
    difficulty: 'medium'
    stem: |
      Methane burns completely in sufficient oxygen: $CH_4+2O_2\rightarrow CO_2+2H_2O$. Which reaction label applies?
    choices:
      - text: 'Combustion'
        correct: true
      - text: 'Synthesis'
        rationale: |
          This treats any joining with oxygen as a one-product pattern. Reactants do interact. Check the number of product substances.
      - text: 'Single replacement'
        rationale: |
          This treats the oxygen reactant as displacing one element. Oxygen begins as an element. Check whether an element is released as a product.
      - text: 'Decomposition'
        rationale: |
          This focuses on methane breaking into parts. Its atoms are rearranged. Check whether it reacts with an additional substance.
    explanation: |
      Methane reacts with oxygen and releases energy. With sufficient oxygen, complete combustion converts its carbon to carbon dioxide and its hydrogen to water.
    approved: true

  - id: q-chemistry-chemical-reactions-0006
    type: 'simple-quantitative'
    difficulty: 'medium'
    stem: |
      Balance this equation by finding the correct coefficient for $H_2$: $N_2 + \_\_H_2 \rightarrow 2NH_3$
    choices:
      - text: '3'
        correct: true
      - text: '2'
        rationale: |
          This copies the coefficient of ammonia instead of counting hydrogen. The visible 2 looks like a matching multiplier. Check atoms per molecule too.
      - text: '6'
        rationale: |
          This uses the hydrogen atom total as the molecule count. Six atoms are needed. Check how many atoms each $H_2$ already contains.
      - text: '1'
        rationale: |
          This ignores the product coefficient when counting hydrogen. One molecule appears in the formula. Check the entire term, including its coefficient.
    explanation: |
      The products contain $2\times3=6$ hydrogen atoms. Each $H_2$ supplies two. The needed coefficient is $6\div2=3$.
    approved: true

  - id: q-chemistry-chemical-reactions-0007
    type: 'simple-quantitative'
    difficulty: 'medium'
    stem: |
      Balance this equation by finding the correct coefficient for $O_2$: $CH_4 + \_\_O_2 \rightarrow CO_2 + 2H_2O$
    choices:
      - text: '2'
        correct: true
      - text: '1'
        rationale: |
          This counts oxygen in carbon dioxide but omits water. Carbon dioxide has an oxygen subscript. Check every product containing oxygen.
      - text: '3'
        rationale: |
          This treats the 2 before water as two oxygens per molecule, giving six total. The coefficient and subscript can look alike. Check which multiplies whole molecules.
      - text: '4'
        rationale: |
          This uses the oxygen atom total as the $O_2$ count. Four atoms are needed. Check that each oxygen molecule supplies a pair.
    explanation: |
      Carbon dioxide contains two oxygen atoms. The two water molecules contain two more. Four oxygen atoms require $4\div2=2$ molecules of $O_2$.
    approved: true

  - id: q-chemistry-chemical-reactions-0008
    type: 'simple-quantitative'
    difficulty: 'hard'
    stem: |
      Balance this equation by finding the correct coefficient for $Fe$: $\_\_Fe + 3O_2 \rightarrow 2Fe_2O_3$
    choices:
      - text: '4'
        correct: true
      - text: '2'
        rationale: |
          This counts one formula unit instead of two. The subscript gives two irons per unit. Check the coefficient multiplying the formula.
      - text: '3'
        rationale: |
          This copies oxygen’s coefficient for iron. Coefficients are visible before both reactants. Check each element independently.
      - text: '6'
        rationale: |
          This uses the total oxygen count for iron. Six oxygen atoms are present. Check which element the missing coefficient multiplies.
    explanation: |
      Two formula units of $Fe_2O_3$ contain $2\times2=4$ iron atoms. Put 4 before Fe. Oxygen also balances: each side contains six oxygen atoms.
    approved: true

  - id: q-chemistry-chemical-reactions-0009
    type: 'classify'
    difficulty: 'hard'
    stem: |
      A student tries to balance an equation containing $H_2O$ by changing it to $H_2O_2$ instead of adding a coefficient in front of it. Is this a valid way to balance the equation?
    choices:
      - text: 'No; it changes the substance.'
        correct: true
      - text: 'Yes; subscripts and coefficients do the same job.'
        rationale: |
          This treats subscripts as interchangeable with coefficients. Both are numbers in equations. Check whether the number changes a formula or its amount.
      - text: 'Yes; matching atom totals permits new formulas.'
        rationale: |
          This ignores substance identity once atom totals match. Matching totals is necessary. Check that the original formulas stay unchanged.
      - text: 'No; coefficients must also remain unchanged.'
        rationale: |
          This forbids all numerical changes. Formulas must stay fixed. Check whether coefficients can change amounts without changing substances.
    explanation: |
      Subscripts define the substance. $H_2O$ is water, and $H_2O_2$ is hydrogen peroxide. Balance the given substances by changing their coefficients.
    approved: true

  - id: q-chemistry-chemical-reactions-0010
    type: 'classify'
    difficulty: 'hard'
    stem: |
      A student adjusts an equation's coefficients until nitrogen atoms match on both sides, then declares the equation balanced without checking hydrogen. Is this equation confirmed to be balanced?
    choices:
      - text: 'No; hydrogen must also be checked.'
        correct: true
      - text: 'Yes; one matching element confirms the equation.'
        rationale: |
          This assumes one balanced element guarantees the rest. All elements share the same coefficients. Check each element’s separate atom count.
      - text: 'Yes; hydrogen always follows nitrogen’s balance.'
        rationale: |
          This assumes hydrogen follows nitrogen automatically. Both appear in the same compound. Check the hydrogen subscripts and coefficients too.
      - text: 'No; matching nitrogen must itself be incorrect.'
        rationale: |
          This assumes nitrogen was wrong without evidence. The overall equation is unconfirmed. Check unchecked elements before rejecting a completed nitrogen count.
    explanation: |
      Every element must have the same atom total on both sides. Matching nitrogen confirms only nitrogen’s balance. Hydrogen must also be checked.
    approved: true

  - id: q-chemistry-chemical-reactions-0011
    type: 'compare-contrast'
    difficulty: 'hard'
    stem: |
      Which statement correctly tells apart synthesis and decomposition reactions?
    choices:
      - text: 'Synthesis combines; decomposition splits.'
        correct: true
      - text: 'Synthesis splits; decomposition combines.'
        rationale: |
          This reverses the two patterns. Each joins one side with several substances. Check the direction of the arrow.
      - text: 'Both require equal reactant and product molecule counts.'
        rationale: |
          This counts molecules instead of distinct substances. Coefficients can change molecule counts. Check the separate formulas on each side.
      - text: 'Synthesis always starts only with elemental substances.'
        rationale: |
          This limits synthesis to elements. Familiar examples combine elements. Check whether compounds can also combine into one product.
    explanation: |
      In the simple pattern scheme, synthesis has several reactant substances and one product. Decomposition has one reactant substance and several products.
    approved: true

  - id: q-chemistry-chemical-reactions-0012
    type: 'compare-contrast'
    difficulty: 'hard'
    stem: |
      Which statement correctly tells apart single replacement and double replacement reactions?
    choices:
      - text: 'Single starts with an element; double exchanges ions.'
        correct: true
      - text: 'Single exchanges ions; double starts with an element.'
        rationale: |
          This reverses the starting materials. Both patterns replace partners. Check whether there is a free-element reactant.
      - text: 'Single needs a driving force; double always proceeds.'
        rationale: |
          This assumes any pair of dissolved salts must react. Ion swapping can be written on paper. Check for a precipitate, gas, or weak electrolyte.
      - text: 'Single applies only to metals; double only to nonmetals.'
        rationale: |
          This limits replacement to metals. Metal examples are common. Check the reaction pattern instead of relying only on element class.
    explanation: |
      Single replacement involves an element displacing another from a compound. Double replacement exchanges ions between compounds when a driving force allows the reaction.
    approved: true

  - id: q-chemistry-chemical-reactions-0013
    type: 'cause-effect'
    difficulty: 'medium'
    stem: |
      Why must a chemical equation be balanced, with the same number of atoms of each element on both sides?
    choices:
      - text: 'Each element’s atoms are conserved.'
        correct: true
      - text: 'Reactant and product molecule counts must match.'
        rationale: |
          This confuses molecule counts with atom counts. Coefficients do count molecules or units. Check each element, not only the number of units.
      - text: 'Every product must have the mass of one reactant.'
        rationale: |
          This treats one reactant’s total mass as every product’s mass. Total mass is conserved. Check whether mass can be distributed among several products.
      - text: 'Only the sum of all atoms must match.'
        rationale: |
          This balances only the sum of all atoms. Equal totals can look convincing. Check every element separately.
    explanation: |
      An ordinary chemical reaction rearranges atoms. It conserves the number of atoms of each element. A balanced equation records those conserved totals.
    approved: true

  - id: q-chemistry-chemical-reactions-0014
    type: 'simple-quantitative'
    difficulty: 'exam'
    stem: |
      The equation $8Al+6O_2\rightarrow4Al_2O_3$ is balanced. Which coefficient ratio gives its simplest whole-number form?
    choices:
      - text: '$4:3:2$'
        correct: true
      - text: '$8:6:4$'
        rationale: |
          This keeps an equivalent but unreduced ratio. The equation is already balanced. Check whether all coefficients share a factor.
      - text: '$4:3:4$'
        rationale: |
          This halves only the reactants. The reactant coefficients look reducible. Check that every coefficient changes by the same factor.
      - text: '$8:6:2$'
        rationale: |
          This halves only the product. Reducing the largest product count seems useful. Check the atom totals on both sides.
    explanation: |
      The coefficients $8:6:4$ share a factor of 2. Divide all three by 2 to obtain $4:3:2$. This preserves atom balance and gives the smallest whole-number ratio.
    approved: true

  - id: q-chemistry-chemical-reactions-0015
    type: 'cause-effect'
    difficulty: 'exam'
    stem: |
      Which observation can provide a driving force for an aqueous double-displacement reaction?
    choices:
      - text: 'Formation of a gas'
        correct: true
      - text: 'Writing different ion partners on paper'
        rationale: |
          This assumes all symbolic swaps are reactions. A balanced equation can be written for many ion pairs. Check for a chemical driving force.
      - text: 'Keeping all ions unchanged in solution'
        rationale: |
          This makes unchanged dissolved ions into products of a net reaction. Their arrangement on paper changes. Check whether their chemical form actually changes.
      - text: 'Only counting the reactants as two salts'
        rationale: |
          This treats the number of salts as proof of chemical change. Two salts match the familiar double-replacement setup. Check whether a gas, precipitate, or weak electrolyte actually forms.
    explanation: |
      A gas can leave a solution as it forms. Its formation changes which species remain dissolved. Gas formation can therefore drive an ion-exchange reaction.
    approved: true

  - id: q-chemistry-chemical-reactions-0016
    type: 'identify'
    difficulty: 'easy'
    stem: |
      Which numbers are changed to balance a chemical equation without changing its substances?
    choices:
      - text: 'Coefficients before formulas'
        correct: true
      - text: 'Subscripts inside each formula'
        rationale: |
          This changes substance identity instead of amount. Subscripts also change atom counts. Check whether the formula stays the same.
      - text: 'Atomic numbers of the elements'
        rationale: |
          This changes the elements themselves. Atomic numbers identify atoms. Check whether an ordinary reaction changes nuclei.
      - text: 'Charges assigned to every ion'
        rationale: |
          This changes ion identity instead of quantity. Charge is important in ionic equations. Check whether balancing can be done with coefficients.
    explanation: |
      Coefficients multiply the amounts of substances. Changing them changes atom totals without changing the substance formulas.
    approved: false

  - id: q-chemistry-chemical-reactions-0017
    type: 'process-ordering'
    difficulty: 'medium'
    stem: |
      For complete hydrocarbon combustion, which balancing order efficiently leaves oxygen until last?
    choices:
      - text: 'Carbon, hydrogen, oxygen'
        correct: true
      - text: 'Oxygen, carbon, then ignore hydrogen'
        rationale: |
          This omits the hydrogen check. Oxygen occurs in several products and can attract attention first. Check every element before finishing.
      - text: 'Hydrogen, oxygen, then change carbon subscripts'
        rationale: |
          This changes a chemical formula. Carbon counts may still need adjustment. Check that only coefficients change.
      - text: 'Carbon, oxygen, then ignore water’s hydrogen'
        rationale: |
          This skips hydrogen in water. Carbon dioxide’s oxygens can dominate the count. Check all atoms in every product.
    explanation: |
      Balance carbon first. Balance hydrogen by adjusting water. Then count all product oxygens and balance oxygen gas.
    approved: false

  - id: q-chemistry-chemical-reactions-0018
    type: 'predict-outcome'
    difficulty: 'hard'
    stem: |
      A hydrocarbon burns with insufficient oxygen. Which product may appear in addition to water?
    choices:
      - text: 'Carbon monoxide'
        correct: true
      - text: 'Only carbon dioxide in every case'
        rationale: |
          This assumes combustion is always complete. Carbon dioxide is the usual complete-combustion carbon product. Check oxygen supply.
      - text: 'A mandatory single product with no water'
        rationale: |
          This forces combustion into a one-product synthesis pattern. Oxygen and fuel combine. Check the fuel’s carbon and hydrogen products.
      - text: 'Unchanged fuel as the only possible material'
        rationale: |
          This treats limited oxygen as preventing all reaction. Some fuel may remain unburned. Check whether partial combustion can still occur.
    explanation: |
      Insufficient oxygen can cause incomplete combustion. Some carbon can form carbon monoxide during this partial reaction.
    approved: false

  - id: q-chemistry-chemical-reactions-0019
    type: 'compare-contrast'
    difficulty: 'hard'
    stem: |
      A reaction is called both synthesis and oxidation-reduction. What does this imply?
    choices:
      - text: 'The labels describe different aspects.'
        correct: true
      - text: 'One label must be discarded as chemically false.'
        rationale: |
          This assumes classifications cannot overlap. A single label feels simpler. Check what property each classification describes.
      - text: 'Every synthesis reaction has the same products.'
        rationale: |
          This treats a pattern as a fixed product identity. Synthesis has one product substance. Check whether different reactants can yield different products.
      - text: 'The five classroom patterns cover all classifications.'
        rationale: |
          This treats a useful scheme as exhaustive. The five labels are commonly taught. Check whether other chemical features define additional classes.
    explanation: |
      A pattern label describes how reactants and products are arranged. A redox label describes oxidation-state changes. One reaction can fit both descriptions.
    approved: false

  - id: q-chemistry-chemical-reactions-0020
    type: 'classify'
    difficulty: 'exam'
    stem: |
      Two soluble salts are mixed. All ions remain unchanged and dissolved. What follows from the complete ionic equation?
    choices:
      - text: 'No net ionic reaction'
        correct: true
      - text: 'A reaction occurs because partners can be rewritten'
        rationale: |
          This treats a symbolic rearrangement as chemical evidence. New formula pairings can be written. Check whether any species actually changes.
      - text: 'Every dissolved ion must have become a precipitate'
        rationale: |
          This assumes an ion swap forces precipitation. Some mixtures do form solids. Check the stated observation that all ions remain dissolved.
      - text: 'A gas must form whenever two salts are mixed'
        rationale: |
          This makes gas formation automatic. Gas can drive some exchanges. Check whether a gas-forming change is observed or specified.
    explanation: |
      Unchanged ions appear on both sides of the complete ionic equation. Canceling them leaves no net ionic change. These observations give no net ionic reaction.
    approved: false
