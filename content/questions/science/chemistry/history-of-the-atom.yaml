meta:
  subject: science
  topic: chemistry
  subtopic: history-of-the-atom
  exams: ["upcat", "dlsucet", "ustet", "dost-sei"]
questions:
  - id: q-chemistry-history-of-the-atom-0001
    type: 'identify'
    difficulty: 'easy'
    stem: |
      Which scientist proposed that atoms are simple, indivisible solid spheres, with no internal parts?
    choices:
      - text: 'John Dalton'
        correct: true
      - text: 'J.J. Thomson'
        rationale: |
          This assigns the indivisible model to the researcher who identified electrons. Thomson also used a sphere picture. Check whether the model contains smaller particles.
      - text: 'Rutherford'
        rationale: |
          This assigns an indivisible sphere to a nuclear model. Both are historical atomic pictures. Check whether a separate nucleus is included.
      - text: 'Niels Bohr'
        rationale: |
          This assigns indivisibility to a model with electron energy levels. Bohr modeled atoms. Check whether electrons are internal parts.
    explanation: |
      Dalton proposed that matter consists of indivisible atoms. The solid-sphere drawing is a teaching representation of that historical model.
    approved: true

  - id: q-chemistry-history-of-the-atom-0002
    type: 'identify'
    difficulty: 'easy'
    stem: |
      Which scientist proposed the "plum pudding model," with negative electrons scattered throughout a positively charged material?
    choices:
      - text: 'J.J. Thomson'
        correct: true
      - text: 'John Dalton'
        rationale: |
          This assigns embedded electrons to Dalton’s model. Both use a sphere picture. Check whether Dalton’s historical model included electrons.
      - text: 'Rutherford'
        rationale: |
          This assigns diffuse positive charge to a nuclear model. Rutherford studied atomic charge. Check whether that charge is spread out or concentrated.
      - text: 'Erwin Schrödinger'
        rationale: |
          This assigns the historical pudding model to wave mechanics. Both describe electrons. Check whether the model uses embedded particles or quantum states.
    explanation: |
      Thomson’s plum pudding model placed negative electrons inside diffuse positive charge. The positive charge was spread through the atom.
    approved: true

  - id: q-chemistry-history-of-the-atom-0003
    type: 'identify'
    difficulty: 'easy'
    stem: |
      Who developed the 1911 nuclear interpretation of alpha scattering, concentrating positive charge and most atomic mass in a tiny nucleus?
    choices:
      - text: 'Rutherford'
        correct: true
      - text: 'J.J. Thomson'
        rationale: |
          This chooses the diffuse-charge model. Thomson’s model included positive charge. Check whether it concentrated that charge in a nucleus.
      - text: 'Niels Bohr'
        rationale: |
          This selects the later quantized hydrogen model. Bohr also used a nucleus. Check the 1911 scattering interpretation named in the question.
      - text: 'John Dalton'
        rationale: |
          This selects an indivisible model. Dalton’s model preceded the others. Check whether it had a separate nucleus.
    explanation: |
      Rutherford interpreted alpha-scattering results in 1911 using a nuclear model. It placed nearly all positive charge and mass in a very small nucleus.
    approved: true

  - id: q-chemistry-history-of-the-atom-0004
    type: 'identify'
    difficulty: 'medium'
    stem: |
      Who introduced the 1913 hydrogen model with allowed electron energy states that reproduced its line spectrum?
    choices:
      - text: 'Niels Bohr'
        correct: true
      - text: 'Rutherford'
        rationale: |
          This selects the nuclear model without Bohr’s energy restriction. Rutherford provided the nuclear starting point. Check which model added quantized hydrogen states in 1913.
      - text: 'Erwin Schrödinger'
        rationale: |
          This selects later wave mechanics. Quantum mechanics also uses energy states. Check the specific date and hydrogen model.
      - text: 'J.J. Thomson'
        rationale: |
          This selects the diffuse-charge model. Thomson discovered electrons. Check whether it included Bohr’s nuclear energy levels.
    explanation: |
      Bohr’s 1913 model allowed specific electron energy states. Transitions between these states explained hydrogen’s line spectrum.
    approved: true

  - id: q-chemistry-history-of-the-atom-0005
    type: 'identify'
    difficulty: 'medium'
    stem: |
      Which researcher developed the 1926 wave equation that became a key foundation of wave mechanics?
    choices:
      - text: 'Erwin Schrödinger'
        correct: true
      - text: 'Niels Bohr'
        rationale: |
          This assigns the wave equation to the fixed-orbit hydrogen model. Bohr used quantization. Check whether the question asks about the 1926 equation.
      - text: 'Rutherford'
        rationale: |
          This assigns wave mechanics to the nuclear interpretation. Rutherford established the nucleus. Check which later contribution describes electron states mathematically.
      - text: 'John Dalton'
        rationale: |
          This assigns quantum wave mechanics to Dalton. His theory was important historically. Check its period and lack of electron substructure.
    explanation: |
      Schrödinger developed a wave equation in 1926. It was a key contribution to quantum mechanics and the description of electron states.
    approved: true

  - id: q-chemistry-history-of-the-atom-0006
    type: 'cause-effect'
    difficulty: 'medium'
    stem: |
      In Rutherford's gold foil experiment, most of the fired particles passed straight through the thin gold foil without deflecting. What did this result reveal about the atom?
    choices:
      - text: 'Most atomic volume contains little mass.'
        correct: true
      - text: 'No positively charged region exists anywhere.'
        rationale: |
          This treats weak deflection as absence of any positive charge. Most particles pass through. Check the evidence from rare strong deflections too.
      - text: 'Dense matter fills the whole atom’s volume.'
        rationale: |
          This treats the atom as filled with dense matter. A solid-sphere drawing looks substantial. Check how most fast particles traversed it.
      - text: 'Electrons occupy fixed paths uniformly spaced everywhere.'
        rationale: |
          This uses passage through foil to determine an exact electron arrangement. Electrons are part of atoms. Check what the observation directly says about concentrated mass.
    explanation: |
      Most alpha particles passed through with little deflection. This supported an atom whose mass is concentrated in a region much smaller than the atom’s full volume.
    approved: true

  - id: q-chemistry-history-of-the-atom-0007
    type: 'cause-effect'
    difficulty: 'medium'
    stem: |
      In Rutherford's gold foil experiment, a small number of fired particles bounced back sharply instead of passing through. What did this result reveal about the atom?
    choices:
      - text: 'A small, dense, positive nucleus'
        correct: true
      - text: 'Positive charge spread through the entire volume'
        rationale: |
          This spreads the positive charge through the full volume. Thomson’s model used positive charge. Check whether diffuse charge explains large-angle scattering.
      - text: 'Heavy negative electrons filling the whole atom'
        rationale: |
          This treats negative electrons as the massive scattering centers. Electrons are charged particles. Check which region contains most atomic mass.
      - text: 'No internal charge capable of affecting alpha particles'
        rationale: |
          This infers no internal charge from particles that passed through. Most particles were only weakly deflected. Check what the rare strong deflections require.
    explanation: |
      Rare large-angle deflections require a strong, concentrated electrical interaction. They supported a very small, positively charged nucleus containing most atomic mass.
    approved: true

  - id: q-chemistry-history-of-the-atom-0008
    type: 'compare-contrast'
    difficulty: 'hard'
    stem: |
      Which statement correctly tells apart Thomson's model and Rutherford's model?
    choices:
      - text: 'Thomson: diffuse charge; Rutherford: nucleus.'
        correct: true
      - text: 'Thomson: nucleus; Rutherford: diffuse charge.'
        rationale: |
          This reverses the charge distributions. Both models include positive charge. Check which one introduced a concentrated nucleus.
      - text: 'Both put all positive charge in the same small nucleus.'
        rationale: |
          This assumes both already had a nucleus. They both included electrons. Check where each located positive charge.
      - text: 'Thomson replaced Rutherford’s earlier diffuse-charge model.'
        rationale: |
          This reverses the historical order. Later models can replace earlier ones. Check that Thomson’s diffuse-charge model preceded the nuclear model.
    explanation: |
      Thomson spread positive charge through the atom. Rutherford concentrated it in a small nucleus. This is the central difference between their charge models.
    approved: true

  - id: q-chemistry-history-of-the-atom-0009
    type: 'classify'
    difficulty: 'hard'
    stem: |
      Which scientist is credited with discovering the electron itself?
    choices:
      - text: 'J.J. Thomson'
        correct: true
      - text: 'Rutherford'
        rationale: |
          This credits the nuclear interpretation with electron discovery. Rutherford studied atomic structure. Check which experiment used cathode rays.
      - text: 'Niels Bohr'
        rationale: |
          This credits hydrogen energy levels with the discovery. Bohr’s model includes electrons. Check whether they were known before his model.
      - text: 'John Dalton'
        rationale: |
          This credits the early indivisible model. Dalton developed atomic theory. Check whether his historical atoms contained known subatomic particles.
    explanation: |
      Thomson’s cathode-ray experiments identified a universal negatively charged constituent of atoms. This particle was the electron.
    approved: true

  - id: q-chemistry-history-of-the-atom-0010
    type: 'compare-contrast'
    difficulty: 'hard'
    stem: |
      A student says Bohr's fixed-orbit model is the current, scientifically accepted model of the atom. Is this correct?
    choices:
      - text: 'No; modern structure uses quantum orbitals.'
        correct: true
      - text: 'Yes; fixed Bohr paths describe every atom completely.'
        rationale: |
          This treats Bohr’s circular paths as the full current description. The model explains hydrogen well. Check its limits for general atomic structure.
      - text: 'No; Rutherford’s classical paths give the full modern model.'
        rationale: |
          This treats Rutherford’s classical paths as sufficient. His nucleus remains important. Check whether the electron description also needs quantum mechanics.
      - text: 'No; Dalton’s indivisible sphere is the full modern model.'
        rationale: |
          This treats Dalton’s indivisible sphere as current. The picture is easy to remember. Check the experimentally established substructure.
    explanation: |
      Modern atomic structure uses quantum states and orbitals. An orbital describes an electron’s state and spatial probability distribution.
    approved: true

  - id: q-chemistry-history-of-the-atom-0011
    type: 'predict-outcome'
    difficulty: 'exam'
    stem: |
      For fast alpha particles passing through thin foil, what scattering would Thomson’s diffuse-positive-charge model mainly predict?
    choices:
      - text: 'Small deflections'
        correct: true
      - text: 'Frequent large backward deflections'
        rationale: |
          This treats diffuse charge as a dense reflecting region. Positive charge repels alpha particles. Check whether it is concentrated enough for frequent backward scattering.
      - text: 'Complete absorption of every particle'
        rationale: |
          This treats a thin foil as absorbing every fast particle. Matter can stop particles under some conditions. Check the stated thin-foil setup.
      - text: 'Attraction toward every region of positive charge'
        rationale: |
          This reverses electrostatic repulsion into attraction. Both the model’s positive charge and alpha particles carry positive charge. Check their charge signs.
    explanation: |
      Diffuse positive charge would mainly produce modest deflections of fast alpha particles. The charge would be spread out, giving a weaker interaction along most paths.
    approved: true

  - id: q-chemistry-history-of-the-atom-0012
    type: 'cause-effect'
    difficulty: 'hard'
    stem: |
      Which observation did Bohr’s model explain especially well?
    choices:
      - text: 'Hydrogen’s discrete spectral lines'
        correct: true
      - text: 'Most alpha particles passing through thin gold foil'
        rationale: |
          This assigns scattering evidence to Bohr. His model includes a nucleus. Check which observation concerns light rather than scattering.
      - text: 'A small positive region causing strong alpha scattering'
        rationale: |
          This assigns nuclear charge evidence to the spectral model. Positive charge attracts electrons. Check what the line-spectrum result measures.
      - text: 'Cathode rays containing a negative atomic constituent'
        rationale: |
          This assigns cathode-ray evidence to Bohr. His model contains electrons. Check whether their identification preceded his theory.
    explanation: |
      Bohr allowed specific energy states in hydrogen. A transition between them releases or absorbs a specific energy. These transitions explained hydrogen’s discrete spectral lines.
    approved: true

  - id: q-chemistry-history-of-the-atom-0013
    type: 'process-ordering'
    difficulty: 'exam'
    stem: |
      Order these historical developments from earliest to latest.
      1. Rutherford’s nuclear model
      2. Dalton’s atomic theory
      3. 1920s quantum mechanics
      4. Thomson’s plum pudding model
      5. Bohr’s hydrogen model
    choices:
      - text: '2, 4, 1, 5, 3'
        correct: true
      - text: '2, 1, 4, 5, 3'
        rationale: |
          This puts the nuclear model before the diffuse-charge model. Both concern positive charge. Check which model the scattering interpretation replaced.
      - text: '4, 2, 1, 3, 5'
        rationale: |
          This puts Thomson before Dalton and wave mechanics before Bohr. Each is a familiar name. Check the early atomic theory and the later quantum sequence.
      - text: '2, 4, 5, 1, 3'
        rationale: |
          This puts Bohr before the nuclear model. Both contain a nucleus. Check which model Bohr used as his starting point.
    explanation: |
      The listed sequence is Dalton, Thomson, Rutherford, Bohr, then 1920s quantum mechanics. In the given numbering, it is $2,4,1,5,3$.
    approved: true

  - id: q-chemistry-history-of-the-atom-0014
    type: 'cause-effect'
    difficulty: 'exam'
    stem: |
      Which account of the alpha-scattering research is historically accurate?
    choices:
      - text: 'Geiger and Marsden measured; Rutherford interpreted.'
        correct: true
      - text: 'Rutherford personally made every measurement with no help.'
        rationale: |
          This assigns every task to Rutherford alone. The experiment often bears his name. Check who made key measurements.
      - text: 'Thomson measured the foil scattering in his cathode-ray work.'
        rationale: |
          This assigns scattering measurements to cathode-ray research. Thomson also studied atoms experimentally. Check the type of particles and apparatus.
      - text: 'Bohr made the foil measurements to construct the 1913 model.'
        rationale: |
          This assigns the scattering work to the later hydrogen model. Bohr used Rutherford’s nucleus. Check the order of the research.
    explanation: |
      Geiger and Marsden made key alpha-scattering measurements within Rutherford’s research program. Rutherford developed the nuclear interpretation.
    approved: true

  - id: q-chemistry-history-of-the-atom-0015
    type: 'identify'
    difficulty: 'easy'
    stem: |
      Which Dalton-era assumption is contradicted by isotopes?
    choices:
      - text: 'Same-element atoms have identical masses.'
        correct: true
      - text: 'Matter can be described using atoms.'
        rationale: |
          This rejects the atomic concept itself. Dalton’s theory had limitations. Check which particular assumption isotope evidence changes.
      - text: 'Compounds contain atoms of different elements.'
        rationale: |
          This rejects compounds containing different elements. Isotopes are different forms of one element. Check that element identity and compound composition are different questions.
      - text: 'Chemical reactions rearrange atoms into products.'
        rationale: |
          This rejects chemical rearrangement. Isotopes show internal atomic differences. Check whether this evidence changes what ordinary chemical reactions do.
    explanation: |
      Isotopes are atoms of the same element with different neutron counts. Their masses differ. This contradicts identical mass for every atom of one element.
    approved: false

  - id: q-chemistry-history-of-the-atom-0016
    type: 'cause-effect'
    difficulty: 'medium'
    stem: |
      Why did electron discovery challenge an indivisible-atom model?
    choices:
      - text: 'It showed atoms have smaller parts.'
        correct: true
      - text: 'It showed every atom contains a separate molecule.'
        rationale: |
          This confuses a subatomic particle with a molecule. Both are smaller-scale objects. Check whether a molecule is made of atoms.
      - text: 'It showed atoms of all elements have the same mass.'
        rationale: |
          This treats a shared constituent as identical whole-atom mass. Electrons occur in atoms. Check whether nuclei can still differ.
      - text: 'It showed positive charge must fill the whole volume.'
        rationale: |
          This treats electron evidence as proof of one positive-charge layout. Thomson proposed such a layout later. Check what electron discovery alone establishes.
    explanation: |
      The electron is a constituent of atoms. Discovering this smaller particle showed that an atom has internal structure.
    approved: false

  - id: q-chemistry-history-of-the-atom-0017
    type: 'classify'
    difficulty: 'medium'
    stem: |
      For which class is the Bohr model especially successful?
    choices:
      - text: 'One-electron atoms and ions'
        correct: true
      - text: 'All neutral many-electron atoms exactly'
        rationale: |
          This extends a simple model to every electron interaction. Bohr’s model is widely taught. Check its stated many-electron limits.
      - text: 'Every molecule regardless of its electrons'
        rationale: |
          This extends an atomic model to arbitrary molecules. Molecules contain atoms. Check whether the model describes general molecular bonding.
      - text: 'Only species without any nucleus'
        rationale: |
          This removes the nuclear starting point. Electron levels are emphasized. Check what attracts the electron in the model.
    explanation: |
      Bohr’s model explains hydrogen and hydrogen-like one-electron ions especially well. These systems have one electron interacting with a nucleus.
    approved: false

  - id: q-chemistry-history-of-the-atom-0018
    type: 'compare-contrast'
    difficulty: 'hard'
    stem: |
      In the quantum model, what does an electron cloud represent?
    choices:
      - text: 'A probability or electron-density distribution'
        correct: true
      - text: 'A literal fuzzy material filling the entire nucleus'
        rationale: |
          This treats the visualization as a new material. The word cloud suggests something physical. Check what quantity the picture represents.
      - text: 'A visible trajectory around the nucleus at every instant'
        rationale: |
          This turns a probability picture into a known path. Orbit drawings are familiar. Check whether quantum states specify classical trajectories.
      - text: 'A drawing of all neutrons scattered through the atom'
        rationale: |
          This confuses electron density with neutron positions. Both are atomic constituents. Check which particle the visualization describes.
    explanation: |
      An electron cloud visualizes electron probability or density. It is based on quantum states rather than a literal cloud of material.
    approved: false

  - id: q-chemistry-history-of-the-atom-0019
    type: 'identify'
    difficulty: 'hard'
    stem: |
      Which description best fits the development of modern quantum mechanics?
    choices:
      - text: 'Work by several researchers'
        correct: true
      - text: 'A complete model created by Schrödinger alone'
        rationale: |
          This gives an entire theory to one major contributor. Schrödinger’s equation is foundational. Check the other contributions named in the lesson.
      - text: 'A literal photograph of Dalton’s solid atomic spheres'
        rationale: |
          This treats a historical drawing as observed evidence. The solid sphere is a familiar image. Check whether it was a microscopic photograph.
      - text: 'A single measurement that proved every electron path'
        rationale: |
          This treats theory development as one complete path measurement. Experiments guide models. Check whether the quantum description uses known classical paths.
    explanation: |
      De Broglie, Heisenberg, Schrödinger, Born, and others contributed to quantum mechanics. The model developed through several mathematical and experimental contributions.
    approved: false

  - id: q-chemistry-history-of-the-atom-0020
    type: 'predict-outcome'
    difficulty: 'exam'
    stem: |
      A model explains older results but fails on a new reliable experiment. What should researchers do?
    choices:
      - text: 'Revise the model’s limits or description.'
        correct: true
      - text: 'Discard the new result solely to preserve the model.'
        rationale: |
          This gives the model priority over reliable evidence. It has explained earlier results. Check whether a scientific model must also address new observations.
      - text: 'Declare every earlier successful prediction meaningless.'
        rationale: |
          This assumes one failure erases every earlier success. A model can have limited accuracy. Check which conditions it still explains.
      - text: 'Treat the model as a photograph that cannot be changed.'
        rationale: |
          This treats a model as an exact observed image. Atomic pictures are familiar. Check whether the model is a testable representation.
    explanation: |
      Models describe evidence and have limits. New reliable evidence can reveal those limits. Researchers then improve the description while accounting for established results.
    approved: false
