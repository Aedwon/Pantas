meta:
  subject: science
  topic: chemistry
  subtopic: atomic-structure
  exams: [upcat, dlsucet, ustet, dost-sei]
questions:
  - id: q-chemistry-atomic-structure-0001
    type: 'simple-quantitative'
    difficulty: 'easy'
    stem: |
      A neutral atom has an atomic number of 17 and a mass number of 35. How many neutrons does it have?
    choices:
      - text: '18'
        correct: true
      - text: '17'
        rationale: |
          This uses atomic number as neutron count. Atomic number does give a particle count. Check that it counts protons.
      - text: '35'
        rationale: |
          This treats all nuclear particles as neutrons. Mass number does count particles in the nucleus. Check that it also includes protons.
      - text: '52'
        rationale: |
          This adds the two numbers, $35+17=52$. Both numbers describe nuclear particles. Check that the proton count is already included in mass number.
    explanation: |
      Mass number counts protons and neutrons. Subtract the 17 protons from the total of 35: $N=35-17=18$. The atom has 18 neutrons.
    approved: true

  - id: q-chemistry-atomic-structure-0002
    type: 'simple-quantitative'
    difficulty: 'easy'
    stem: |
      A nuclide contains 11 protons and 12 neutrons. What is its mass number?
    choices:
      - text: '23'
        correct: true
      - text: '11'
        rationale: |
          This reports only the proton count. It is the atomic number and identifies the element. Check that mass number also includes neutrons.
      - text: '12'
        rationale: |
          This reports only the neutron count. Neutrons contribute to nuclear mass. Check that protons are also counted.
      - text: '1'
        rationale: |
          This subtracts the two counts, $12-11=1$. Subtraction is used when finding neutrons from a given mass number. Check which quantity is requested here.
    explanation: |
      Mass number adds the proton and neutron counts. Here, $A=11+12=23$.
    approved: true

  - id: q-chemistry-atomic-structure-0003
    type: 'classify'
    difficulty: 'medium'
    stem: |
      One chlorine atom has 17 protons and 18 neutrons. Another chlorine atom has 17 protons and 20 neutrons. Are these two atoms isotopes of each other?
    choices:
      - text: 'Isotopes of the same element'
        correct: true
      - text: 'Atoms of different elements'
        rationale: |
          This makes neutron number define element identity. Neutrons change the atom’s mass. Check which particle count defines the element.
      - text: 'Ions defined by their neutron difference'
        rationale: |
          This confuses a neutron difference with a charge difference. Both change particle counts. Check whether the changed particles are neutral or charged.
      - text: 'Nuclides with the same mass number'
        rationale: |
          This assumes the same proton count means the same total nucleon count. Both are chlorine. Check whether their different neutron counts change the sum.
    explanation: |
      Both atoms have 17 protons, so they are the same element. Their neutron counts differ. This makes them different isotopes of that element.
    approved: true

  - id: q-chemistry-atomic-structure-0004
    type: 'simple-quantitative'
    difficulty: 'medium'
    stem: |
      A neutral nitrogen atom has 7 protons. It gains 3 electrons. What is the resulting ion charge?
    choices:
      - text: '$3-$'
        correct: true
      - text: '$3+$'
        rationale: |
          This reverses the sign of the added electrons. Gaining particles can sound like a positive change. Check that electrons carry negative charge.
      - text: '$4-$'
        rationale: |
          This subtracts the gained count from the proton count, then attaches a minus sign. The numbers 7 and 3 are both given. Check that charge uses the final total electron count.
      - text: '$10-$'
        rationale: |
          This uses the final electron count as the charge magnitude. There are 10 electrons after the gain. Check that positive protons offset part of that negative charge.
    explanation: |
      The neutral atom starts with 7 electrons. Gaining 3 gives $7+3=10$. Net charge is protons minus electrons: $7-10=-3$, giving $3-$.
    approved: true

  - id: q-chemistry-atomic-structure-0005
    type: 'simple-quantitative'
    difficulty: 'medium'
    stem: |
      A magnesium ion has 12 protons and a charge of 2+. How many electrons does it have?
    choices:
      - text: '10'
        correct: true
      - text: '12'
        rationale: |
          This uses the neutral electron count. A magnesium atom has the same proton number as its ion. Check whether the positive charge indicates fewer electrons.
      - text: '14'
        rationale: |
          This adds the charge magnitude, $12+2=14$. Adding can seem natural for a plus sign. Check whether a positive ion lost or gained electrons.
      - text: '2'
        rationale: |
          This uses the charge magnitude as the total electron count. The number 2 measures an imbalance. Check the total count using the proton number.
    explanation: |
      Use charge = protons minus electrons. A $2+$ ion has two fewer electrons than its 12 protons. The count is $12-2=10$.
    approved: true

  - id: q-chemistry-atomic-structure-0006
    type: 'simple-quantitative'
    difficulty: 'medium'
    stem: |
      An ion has 9 protons and 10 electrons. What is its charge?
    choices:
      - text: '$1-$'
        correct: true
      - text: '$1+$'
        rationale: |
          This subtracts in the reverse order, $10-9=1$. Both orders give a magnitude of one. Check that the rule is protons minus electrons.
      - text: '$9-$'
        rationale: |
          This uses the proton count and attaches a negative sign. Protons do contribute charge. Check that electrons also contribute to the net total.
      - text: '$10-$'
        rationale: |
          This uses total electrons as the negative charge magnitude. Electrons are negative. Check that the nine protons offset nine of them.
    explanation: |
      Subtract electrons from protons: $9-10=-1$. The ion has charge $1-$.
    approved: true

  - id: q-chemistry-atomic-structure-0007
    type: 'cause-effect'
    difficulty: 'medium'
    stem: |
      A neutral atom loses two electrons without a nuclear change. How is the result classified?
    choices:
      - text: 'Cation'
        correct: true
      - text: 'Anion'
        rationale: |
          This treats losing particles as a negative charge change. Removal sounds like subtraction. Check the sign of the particles being removed.
      - text: 'Different isotope'
        rationale: |
          This confuses electron removal with a neutron change. Both alter particle counts. Check which count distinguishes isotopes.
      - text: 'Different element'
        rationale: |
          This confuses an electron change with a proton change. The atom’s charge has changed. Check which particle number defines the element.
    explanation: |
      Removing negative electrons leaves more protons than electrons. The atom becomes positively charged. A positive ion is called a cation.
    approved: true

  - id: q-chemistry-atomic-structure-0008
    type: 'classify'
    difficulty: 'medium'
    stem: |
      The bonded group $NH_4^+$ has a net positive charge. Which description is correct?
    choices:
      - text: 'A polyatomic cation'
        correct: true
      - text: 'A neutral molecule only'
        rationale: |
          This ignores the net charge on a bonded group. A multi-atom group can look like an ordinary molecule. Check the charge shown on the formula.
      - text: 'A monatomic anion'
        rationale: |
          This misreads both atom count and charge. Nitrogen is one element in the formula. Check the hydrogen atoms and the positive sign.
      - text: 'An isotope of nitrogen'
        rationale: |
          This confuses a nitrogen-containing group with a nitrogen isotope. The formula includes nitrogen. Check whether the difference concerns neutron number or bonding and charge.
    explanation: |
      $NH_4^+$ contains a bonded group of atoms, so it is polyatomic. Its positive charge makes it a cation.
    approved: true

  - id: q-chemistry-atomic-structure-0009
    type: 'classify'
    difficulty: 'hard'
    stem: |
      Which quantity is usually an isotope-weighted value rather than a nucleon count for one nuclide?
    choices:
      - text: 'Standard atomic weight'
        correct: true
      - text: 'Mass number of a specified nuclide'
        rationale: |
          This confuses a single-nuclide count with an isotope-weighted value. Both relate to atomic mass. Check whether the value averages isotopes or counts nucleons.
      - text: 'Proton count in a specified nucleus'
        rationale: |
          This confuses element identity with average atomic mass. Proton count is used for every isotope. Check whether abundance changes that integer count.
      - text: 'Neutron count in a specified nucleus'
        rationale: |
          This confuses neutron variation with an average across isotopes. Isotopes do have different neutron counts. Check whether the question names one specified nucleus or a weighted value.
    explanation: |
      Standard atomic weight reflects isotope masses and their abundances. It is commonly not a whole number. It differs from the mass number of one specified nuclide.
    approved: true

  - id: q-chemistry-atomic-structure-0010
    type: 'classify'
    difficulty: 'hard'
    stem: |
      A classmate says an atom "became an isotope" after losing one proton. Is this description correct?
    choices:
      - text: 'Its element changes.'
        correct: true
      - text: 'Only its charge changes as in electron loss.'
        rationale: |
          This treats losing a proton like losing an electron. Both particles carry charge. Check which count defines the element.
      - text: 'Its original element stays fixed if mass is unchanged.'
        rationale: |
          This uses mass number to preserve identity. Nucleon totals can match across different nuclides. Check whether the proton count still matches.
      - text: 'Its original element stays fixed if neutrons remain.'
        rationale: |
          This uses unchanged neutrons to preserve identity. Neutrons help define an isotope’s mass. Check which particle count actually names the element.
    explanation: |
      Proton count is the atomic number. Changing that count changes the element’s identity.
    approved: true

  - id: q-chemistry-atomic-structure-0011
    type: 'classify'
    difficulty: 'hard'
    stem: |
      A monatomic ion has 15 protons, but its charge is not stated. What can be concluded about its electron count?
    choices:
      - text: 'It differs from 15 but is not fixed.'
        correct: true
      - text: 'It is exactly 15 because proton count fixes electrons.'
        rationale: |
          This applies the neutral-atom equality to an ion. Atomic number does fix proton count. Check whether the species is neutral.
      - text: 'It must be exactly 14 for every positive or negative ion.'
        rationale: |
          This assumes every ion has lost exactly one electron. Some cations do form that way. Check whether a sign and magnitude of charge are given.
      - text: 'It must be exactly 16 for every positive or negative ion.'
        rationale: |
          This assumes every ion has gained exactly one electron. Some anions do form that way. Check whether the question gives that particular charge.
    explanation: |
      A monatomic ion has a nonzero net charge, so its proton and electron counts differ. The exact electron count requires the ion’s charge.
    approved: true

  - id: q-chemistry-atomic-structure-0012
    type: 'simple-quantitative'
    difficulty: 'hard'
    stem: |
      A nuclide has atomic number 8 and mass number 18. Another nuclide of the same element has mass number 16. Which describes the first nuclide?
    choices:
      - text: '10 neutrons; a different isotope'
        correct: true
      - text: '18 neutrons; a different element'
        rationale: |
          This treats mass number as neutron count and mass difference as a new element. Both quantities concern the nucleus. Check proton count for identity and subtract it from mass number for neutrons.
      - text: '8 neutrons; a different isotope'
        rationale: |
          This uses atomic number for neutron count. The number 8 appears in both nuclides. Check whether it counts protons or neutrons.
      - text: '10 neutrons; a different element'
        rationale: |
          This interprets different mass as a different element. The neutron calculation is correct. Check whether the atomic number changes.
    explanation: |
      Its neutron count is $18-8=10$. Both nuclides have the same atomic number but different mass numbers. They are different isotopes of the same element.
    approved: true

  - id: q-chemistry-atomic-structure-0013
    type: 'simple-quantitative'
    difficulty: 'exam'
    stem: |
      An iron atom has an atomic number of 26. One of its isotopes has 30 neutrons. This isotope then forms an ion with a charge of 3+. How many electrons does this ion have?
    choices:
      - text: '23'
        correct: true
      - text: '29'
        rationale: |
          This adds three instead of subtracting, $26+3=29$. A plus sign can suggest addition. Check whether positive charge indicates electron gain or loss.
      - text: '26'
        rationale: |
          This uses the neutral count of 26. The atom and its ion share atomic number. Check the electron change indicated by $3+$.
      - text: '33'
        rationale: |
          This adds three to the neutron count, $30+3=33$. Both counts are in the stem. Check that electrons are found from protons and charge, not neutrons.
    explanation: |
      The ion has 26 protons. A $3+$ charge means three fewer electrons than protons. Subtract: $26-3=23$ electrons.
    approved: true

  - id: q-chemistry-atomic-structure-0014
    type: 'compare-contrast'
    difficulty: 'medium'
    stem: |
      Neutral hydrogen-1, hydrogen-2, and hydrogen-3 each have one proton, but different neutron counts. Which property must they share?
    choices:
      - text: 'Electron count'
        correct: true
      - text: 'Neutron count'
        rationale: |
          This assumes atoms of the same element have the same neutrons. Their names share hydrogen. Check the stated isotope difference.
      - text: 'Mass number'
        rationale: |
          This assumes element identity fixes mass number. The proton count is the same. Check whether adding different neutron counts gives the same total.
      - text: 'Total nucleon count'
        rationale: |
          This ignores neutrons when counting nucleons. All three nuclei have one proton. Check that nucleons include both protons and neutrons.
    explanation: |
      Each atom is neutral, so its electron count equals its proton count. All three have one proton. Therefore each has one electron.
    approved: true

  - id: q-chemistry-atomic-structure-0015
    type: 'predict-outcome'
    difficulty: 'exam'
    stem: |
      A neutral phosphorus-31 atom has 15 protons and 16 neutrons. It loses one electron. Which quantities remain unchanged?
    choices:
      - text: 'Atomic number and mass number'
        correct: true
      - text: 'Atomic number and net charge'
        rationale: |
          This correctly preserves atomic number but also preserves charge. The nuclear identity is unchanged. Check whether electron loss creates a proton-electron imbalance.
      - text: 'Electron count and mass number'
        rationale: |
          This correctly preserves mass number but also preserves electron count. Electrons contribute little mass. Check whether little mass means their count stays unchanged.
      - text: 'Electron count and net charge'
        rationale: |
          This preserves both quantities directly affected by electron removal. The nuclear counts do stay unchanged. Check which quantities describe electrons and electrical imbalance.
    explanation: |
      Only an electron is removed. Proton and neutron counts stay unchanged. Atomic number counts protons, and mass number counts protons plus neutrons, so both remain the same.
    approved: true

  - id: q-chemistry-atomic-structure-0016
    type: 'identify'
    difficulty: 'easy'
    stem: |
      Which main subatomic particle has zero electric charge?
    choices:
      - text: 'Neutron'
        correct: true
      - text: 'Proton'
        rationale: |
          This confuses the two main nuclear particles. Both have similar masses. Check their charge signs.
      - text: 'Electron'
        rationale: |
          This confuses small mass with no charge. Electrons are much lighter than nuclear particles. Check whether mass and electric charge are the same property.
      - text: 'Atomic cation'
        rationale: |
          This confuses a stable charged species with a neutral particle. A cation can be stable. Check whether its name indicates positive charge.
    explanation: |
      A neutron carries no net electric charge. Its charge is zero.
    approved: false

  - id: q-chemistry-atomic-structure-0017
    type: 'structure-function'
    difficulty: 'medium'
    stem: |
      Why is nearly all ordinary atomic mass concentrated in the nucleus?
    choices:
      - text: 'Protons and neutrons are much heavier than electrons.'
        correct: true
      - text: 'Electrons account for nearly all an atom’s mass.'
        rationale: |
          This equates the large region occupied by electrons with most of the mass. The electron cloud extends around the nucleus. Check particle masses instead of space occupied.
      - text: 'Positive charge has mass but negative charge has none.'
        rationale: |
          This assigns mass according to charge sign. Nuclear protons are both heavy and positive. Check that neutrons have mass despite zero charge and electrons have mass despite negative charge.
      - text: 'All particles outside the nucleus must be massless.'
        rationale: |
          This treats a very small mass as exactly zero. Electron mass is tiny compared with nuclear mass. Check whether negligible in a rough total means absent.
    explanation: |
      Protons and neutrons are in the nucleus and each has a mass close to one atomic mass unit. Electrons have much smaller masses. The nuclear particles therefore account for nearly all the atom’s mass.
    approved: false

  - id: q-chemistry-atomic-structure-0018
    type: 'compare-contrast'
    difficulty: 'hard'
    stem: |
      Which statement distinguishes an orbital from a literal planetary orbit?
    choices:
      - text: 'An orbital describes an electron’s quantum state.'
        correct: true
      - text: 'An orbital specifies one fixed circular electron path.'
        rationale: |
          This treats a teaching ring as an actual path. Bohr-style diagrams show simple rings. Check whether the modern model describes a trajectory or a probability distribution.
      - text: 'An orbital gives a neutron’s route around the nucleus.'
        rationale: |
          This assigns electron regions to neutrons. Both are atomic constituents. Check where neutrons and electrons occur in the introductory model.
      - text: 'An orbital replaces all probability with a known trajectory.'
        rationale: |
          This turns a quantum description into certainty about a classical path. A drawn region can look like a known route. Check the role of probability in the orbital model.
    explanation: |
      An orbital describes an electron’s quantum state and its associated probability distribution. It is not a fixed classical path.
    approved: false

  - id: q-chemistry-atomic-structure-0019
    type: 'process-ordering'
    difficulty: 'hard'
    stem: |
      A question gives a monatomic ion’s atomic number and signed charge. Which sequence finds its electron count?
    choices:
      - text: 'Use atomic number for protons, then subtract charge.'
        correct: true
      - text: 'Use atomic number for neutrons, then add charge.'
        rationale: |
          This assigns atomic number to neutrons and adds charge. Atomic number is a particle count, so the first step looks familiar. Check which particle it actually counts.
      - text: 'Use charge for protons, then subtract atomic number.'
        rationale: |
          This treats charge as a total proton count. Charge is a difference between counts. Check whether it identifies total protons or their imbalance with electrons.
      - text: 'Use mass number for electrons, then subtract charge.'
        rationale: |
          This substitutes mass number for electron count. Both appear in atomic problems. Check whether mass number counts nuclear particles or electrons.
    explanation: |
      Atomic number gives the proton count. Since charge equals protons minus electrons, electron count equals protons minus the signed charge.
    approved: false

  - id: q-chemistry-atomic-structure-0020
    type: 'predict-outcome'
    difficulty: 'exam'
    stem: |
      A nuclide gains a neutron while its proton and electron counts stay the same. Which result follows?
    choices:
      - text: 'Mass number rises; charge stays unchanged.'
        correct: true
      - text: 'Atomic number rises; charge becomes more positive.'
        rationale: |
          This treats a neutron as an added proton. Both occur in the nucleus. Check which count defines atomic number and which particle is charged.
      - text: 'Mass number stays unchanged; charge becomes negative.'
        rationale: |
          This ignores the neutron’s mass contribution and gives it negative charge. The atom did gain a particle. Check that a neutron adds to nucleon count but carries no charge.
      - text: 'Atomic number falls; electron count rises.'
        rationale: |
          This invents changes in particles that the stem holds fixed. Nuclear changes can sound like several counts must change. Check each count explicitly stated to stay the same.
    explanation: |
      Mass number is protons plus neutrons. Adding one neutron raises that total by one. Neutrons have zero charge, and the charged particle counts remain unchanged.
    approved: false
