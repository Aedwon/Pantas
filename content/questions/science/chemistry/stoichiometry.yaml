meta:
  subject: science
  topic: chemistry
  subtopic: stoichiometry
  exams: ["upcat", "dlsucet", "ustet", "dost-sei"]
questions:
  - id: q-chemistry-stoichiometry-0001
    type: 'simple-quantitative'
    difficulty: 'medium'
    stem: |
      For the reaction $N_2 + 3H_2 \rightarrow 2NH_3$, a chemist starts with 5 moles of $N_2$ and 12 moles of $H_2$. Which reactant is limiting?
    choices:
      - text: '$H_2$'
        correct: true
      - text: '$N_2$'
        rationale: |
          This compares raw amounts without coefficients. Nitrogen has fewer moles. Check the required 1:3 ratio.
      - text: 'Neither; both amounts match exactly'
        rationale: |
          This assumes the starting ratio exactly matches the equation. Both reactants are present. Check their amounts against the coefficients.
      - text: '$NH_3$, because it is the product'
        rationale: |
          This selects product as a limiting reactant. Ammonia appears in the equation. Check which side supplies the starting reactants.
    explanation: |
      Each mole of $N_2$ requires 3 mol $H_2$. Five moles would require 15 mol $H_2$. Only 12 are present, so $H_2$ is limiting.
    approved: true

  - id: q-chemistry-stoichiometry-0002
    type: 'simple-quantitative'
    difficulty: 'medium'
    stem: |
      A reaction's theoretical yield is 80 grams. In the actual experiment, 68 grams were collected. Find the percent yield.
    choices:
      - text: '85%'
        correct: true
      - text: '68%'
        rationale: |
          This labels the actual gram value as percent. Sixty-eight is given. Check the required ratio.
      - text: '80%'
        rationale: |
          This labels the theoretical gram value as percent. Eighty is given. Check which yield belongs in the numerator.
      - text: '118%'
        rationale: |
          This reverses the fraction to $80/68$, about 118%. Both masses are used. Check actual divided by theoretical.
    explanation: |
      Percent yield is $\dfrac{\text{actual}}{\text{theoretical}}\times100\%$. Substitute $\dfrac{68}{80}\times100\%=85\%$.
    approved: true

  - id: q-chemistry-stoichiometry-0003
    type: 'simple-quantitative'
    difficulty: 'medium'
    stem: |
      A compound contains 3 moles of carbon, 6 moles of hydrogen, and 3 moles of oxygen. Find its empirical formula.
    choices:
      - text: '$CH_2O$'
        correct: true
      - text: '$C_3H_6O_3$'
        rationale: |
          This keeps the unreduced composition. It preserves the element ratio. Check whether all subscripts share a factor.
      - text: '$CH_3O$'
        rationale: |
          This divides hydrogen by 2 while the others use 3. The hydrogen amount is six. Check that all amounts use one divisor.
      - text: '$C_2H_4O_2$'
        rationale: |
          This divides all counts by 1.5 but leaves a reducible ratio. Whole numbers result. Check for a remaining common factor.
    explanation: |
      Divide each mole amount by 3: $3:6:3$ becomes $1:2:1$. The empirical formula is $CH_2O$.
    approved: true

  - id: q-chemistry-stoichiometry-0004
    type: 'simple-quantitative'
    difficulty: 'hard'
    stem: |
      A compound has the empirical formula $CH_2O$ (empirical formula mass = 30 g/mol) and an actual molar mass of 180 g/mol. Find its molecular formula.
    choices:
      - text: '$C_6H_{12}O_6$'
        correct: true
      - text: '$C_3H_6O_3$'
        rationale: |
          This halves the factor after finding it. Six is the required mass ratio. Check whether any halving is justified.
      - text: '$C_2H_4O_2$'
        rationale: |
          This uses the hydrogen subscript 2 as the formula multiplier. It is visible in the empirical formula. Check the molar-mass ratio instead.
      - text: '$C_{12}H_{24}O_{12}$'
        rationale: |
          This applies hydrogen’s 2 as an extra factor to the whole formula. Hydrogen has a subscript 2. Check that each original subscript already receives the mass-ratio multiplier.
    explanation: |
      The factor is $180/30=6$. Multiply each empirical subscript by 6. This gives $C_6H_{12}O_6$.
    approved: true

  - id: q-chemistry-stoichiometry-0005
    type: 'classify'
    difficulty: 'hard'
    stem: |
      A student assumes the reactant with the smaller number of starting moles is always the limiting reactant, without checking the balanced equation's ratio. Is this a safe assumption?
    choices:
      - text: 'No; compare through the equation ratio.'
        correct: true
      - text: 'Yes; the smaller mole count is always limiting.'
        rationale: |
          This uses raw mole counts alone. A smaller sample seems likely to run out first. Check the balanced coefficients.
      - text: 'Yes; raw counts determine limits for all gas reactions.'
        rationale: |
          This makes gas phase an exception to stoichiometry. Many gas examples use ratios. Check that coefficients apply to all stated phases.
      - text: 'No; the larger mole count is always limiting.'
        rationale: |
          This reverses the raw-count rule without using ratios. More moles can still be insufficient. Check the product possible from each reactant.
    explanation: |
      Balanced coefficients determine the required reactant ratio. The limiting reactant is the one that can form less of the same product from its available amount.
    approved: true

  - id: q-chemistry-stoichiometry-0006
    type: 'classify'
    difficulty: 'hard'
    stem: |
      A student calculates percent yield by dividing theoretical yield by actual yield, instead of actual by theoretical. Is this the correct formula?
    choices:
      - text: 'No; divide actual by theoretical.'
        correct: true
      - text: 'Yes; either division order gives the same percentage.'
        rationale: |
          This treats division order as interchangeable. Both yields appear. Check which is the measured amount in the numerator.
      - text: 'No; theoretical should be divided by theoretical.'
        rationale: |
          This divides the theoretical value by itself. That produces 100% automatically. Check that actual yield is included.
      - text: 'Yes; theoretical divided by actual defines yield.'
        rationale: |
          This accepts the inverse ratio. Theoretical yield is the reference value. Check that it belongs in the denominator.
    explanation: |
      The definition is actual yield divided by theoretical yield, multiplied by 100%. It compares the experimentally obtained amount with the calculated maximum.
    approved: true

  - id: q-chemistry-stoichiometry-0007
    type: 'compare-contrast'
    difficulty: 'hard'
    stem: |
      A compound's empirical formula is $CH_2O$ and its molecular formula is $C_6H_{12}O_6$ (glucose). A student says these two formulas describe two different substances. Is this correct?
    choices:
      - text: 'No; they are two formula representations.'
        correct: true
      - text: 'Yes; different representations always mean different substances.'
        rationale: |
          This treats different representations as necessarily different substances. The formulas look different. Check whether one is the reduced ratio of the other.
      - text: 'No; glucose cannot have a molecular formula at all.'
        rationale: |
          This removes molecular composition from a molecular substance. Glucose has an empirical formula too. Check the actual molecule’s atom counts.
      - text: 'Yes; the empirical formula names a separate reaction product.'
        rationale: |
          This treats a ratio as a separate reaction product. The two formulas contain the same elements. Check whether a formula representation is a physical sample.
    explanation: |
      The empirical formula gives the simplest atom ratio. The molecular formula gives actual atom counts in one glucose molecule. Dividing its subscripts by 6 gives the empirical ratio.
    approved: true

  - id: q-chemistry-stoichiometry-0008
    type: 'classify'
    difficulty: 'hard'
    stem: |
      A compound has 4 moles of carbon, 8 moles of hydrogen, and 2 moles of oxygen. A student divides carbon and hydrogen by 4, but oxygen by 2, getting a ratio of 1, 2, 1. Is this a correct way to find the empirical formula?
    choices:
      - text: 'No; use one common divisor.'
        correct: true
      - text: 'Yes; each element may use a different convenient divisor.'
        rationale: |
          This allows different divisors for different elements. Each result may be a whole number. Check whether the relative proportions are preserved.
      - text: 'No; empirical counts must never be reduced.'
        rationale: |
          This leaves every count unreduced. The original composition is valid. Check whether it is already the simplest whole-number ratio.
      - text: 'Yes; obtaining familiar whole numbers is sufficient.'
        rationale: |
          This accepts a ratio obtained with unequal divisors. The result looks familiar. Check one common divisor for every element.
    explanation: |
      Use the same divisor to preserve composition. Divide $4,8,2$ by 2 to get $2,4,1$. The simplest formula is $C_2H_4O$.
    approved: true

  - id: q-chemistry-stoichiometry-0009
    type: 'simple-quantitative'
    difficulty: 'medium'
    stem: |
      For $2Al+3Cl_2\rightarrow2AlCl_3$, start with 6 mol Al and 8 mol $Cl_2$. After ideal completion, how much Al remains?
    choices:
      - text: '$\dfrac{2}{3}$ mol'
        correct: true
      - text: '2 mol'
        rationale: |
          This subtracts reactant amounts directly, $8-6$. Both are in moles. Check the reaction’s unequal coefficients.
      - text: '0 mol'
        rationale: |
          This assumes all aluminum reacts. The sample contains both reactants. Check whether enough chlorine is supplied.
      - text: '$\dfrac{8}{3}$ mol'
        rationale: |
          This divides chlorine moles by its coefficient and reports that as leftover aluminum. The factor 3 is relevant. Check the amount consumed and subtract it from the starting aluminum.
    explanation: |
      Eight moles of $Cl_2$ consume $8\times\dfrac{2}{3}=\dfrac{16}{3}$ mol Al. Six moles Al are available. The remainder is $6-\dfrac{16}{3}=\dfrac{2}{3}$ mol.
    approved: true

  - id: q-chemistry-stoichiometry-0010
    type: 'simple-quantitative'
    difficulty: 'medium'
    stem: |
      An experiment isolates 20 g product at 80% yield. What is the theoretical yield?
    choices:
      - text: '25 g'
        correct: true
      - text: '16 g'
        rationale: |
          This multiplies actual yield by 0.80 instead of dividing. The percentage is familiar. Check whether the maximum should exceed the actual amount.
      - text: '19.2 g'
        rationale: |
          This subtracts the yield fraction from the mass. Both numbers appear. Check that a percentage is a multiplier, not a gram quantity.
      - text: '0.25 g'
        rationale: |
          This treats 80% as 80 rather than 0.80. The numeral is stated. Check the percent conversion.
    explanation: |
      The yield fraction is $80/100=0.80$. Thus $20=0.80\times\text{theoretical yield}$. Divide: $20/0.80=25$ g.
    approved: true

  - id: q-chemistry-stoichiometry-0011
    type: 'simple-quantitative'
    difficulty: 'medium'
    stem: |
      Two molecular substances have formulas $C_2H_4$ and $C_4H_8$. Which empirical formula do they share?
    choices:
      - text: '$CH_2$'
        correct: true
      - text: '$C_2H_4$'
        rationale: |
          This keeps one molecule’s actual counts instead of the simplest ratio. $C_2H_4$ is given. Check the common factor.
      - text: '$C_4H_8$'
        rationale: |
          This keeps the larger molecule’s counts. $C_4H_8$ is given. Check the smallest whole-number ratio.
      - text: '$C_2H$'
        rationale: |
          This reverses the element ratio. The same two elements appear. Check which subscript belongs to hydrogen.
    explanation: |
      Reduce $C_2H_4$ by 2 and $C_4H_8$ by 4. Both give the $1:2$ carbon-to-hydrogen ratio, $CH_2$.
    approved: true

  - id: q-chemistry-stoichiometry-0012
    type: 'classify'
    difficulty: 'exam'
    stem: |
      A proposed empirical formula has molar mass 46 g/mol, but a precise molecular-mass result gives a clearly non-integer multiple. What should be done?
    choices:
      - text: 'Recheck data and the empirical formula.'
        correct: true
      - text: 'Round the multiplier without checking measurement tolerance.'
        rationale: |
          This rounds a substantial non-integer ratio without checking consistency. Two is nearby. Check whether measurement tolerance justifies that change.
      - text: 'Use fractional subscripts in the molecular formula.'
        rationale: |
          This uses fractional molecular subscripts. The mass ratio was calculated. Check that a molecule contains whole atom counts.
      - text: 'Set the multiplier to one regardless of the molecular mass.'
        rationale: |
          This forces every empirical formula to be the molecular formula. The empirical unit has a known mass. Check whether the measured molecular mass matches.
    explanation: |
      For a molecular substance, the molecular formula is a whole-number multiple of its empirical formula. A non-integer mass ratio beyond justified uncertainty signals inconsistent data or an incorrect empirical formula.
    approved: true

  - id: q-chemistry-stoichiometry-0013
    type: 'predict-outcome'
    difficulty: 'exam'
    stem: |
      For the reaction $N_2 + 3H_2 \rightarrow 2NH_3$, a chemist starts with 4 moles of $N_2$ and 9 moles of $H_2$ (so $H_2$ is the limiting reactant). How many moles of $NH_3$ can be produced?
    choices:
      - text: '6 mol'
        correct: true
      - text: '9 mol'
        rationale: |
          This copies hydrogen’s amount directly to ammonia. Hydrogen is limiting. Check the 3:2 reactant-product ratio.
      - text: '4 mol'
        rationale: |
          This copies nitrogen’s starting amount as product. Nitrogen is available. Check the limiting reactant and product coefficient.
      - text: '3 mol'
        rationale: |
          This computes nitrogen consumed, $9/3$, but reports it as ammonia. The division uses a correct coefficient. Check which substance’s amount it gives.
    explanation: |
      The limiting 9 mol $H_2$ determines the maximum ammonia. The balanced ratio gives $9\times\dfrac{2}{3}=6$ mol $NH_3$.
    approved: true

  - id: q-chemistry-stoichiometry-0014
    type: 'classify'
    difficulty: 'medium'
    stem: |
      A balanced equation predicts a maximum possible product amount before any experiment is run. What is this predicted amount called?
    choices:
      - text: 'Theoretical yield'
        correct: true
      - text: 'Actual isolated yield'
        rationale: |
          This names the measured isolated amount. Experiments collect product. Check whether the value is calculated before the experiment.
      - text: 'Measured percent yield'
        rationale: |
          This names a percentage comparing two yields. It is a useful performance measure. Check whether the question asks for an amount or a ratio.
      - text: 'Empirical-formula ratio'
        rationale: |
          This names a simplest composition ratio. Empirical formulas use ratios. Check whether the quantity is a product amount.
    explanation: |
      The theoretical yield is the calculated maximum product from the limiting reactant under the stated ideal reaction. It is determined before experimental losses.
    approved: true

  - id: q-chemistry-stoichiometry-0015
    type: 'process-ordering'
    difficulty: 'easy'
    stem: |
      Which sequence identifies a limiting reactant from reactant masses?
    choices:
      - text: 'Convert moles, compare product yields, choose smaller.'
        correct: true
      - text: 'Choose the smaller gram mass, then ignore the balanced coefficients.'
        rationale: |
          This compares masses directly. A smaller mass may look likely to run out. Check the molar masses and reaction ratio.
      - text: 'Add the reactant masses, then choose the largest coefficient.'
        rationale: |
          This adds masses without assigning a reactant limit. Mass is conserved. Check what each reactant can form separately.
      - text: 'Choose the reactant with the smaller molar mass in every case.'
        rationale: |
          This treats molar mass as the limit criterion. It is needed for conversion. Check available amount relative to required ratio.
    explanation: |
      Convert each mass to moles. Use the balanced coefficients to find the same product amount from each reactant. The smaller predicted amount identifies the limiting reactant.
    approved: false

  - id: q-chemistry-stoichiometry-0016
    type: 'classify'
    difficulty: 'medium'
    stem: |
      An experiment reports a product mass giving 105% yield. Which interpretation is reasonable?
    choices:
      - text: 'Check for retained solvent or impurities.'
        correct: true
      - text: 'Pure product must exceed the stoichiometric maximum.'
        rationale: |
          This treats extra measured mass as extra pure product. The balance records more mass. Check whether all of it is the specified product.
      - text: 'The percent-yield definition is automatically invalid.'
        rationale: |
          This rejects the definition because a measurement exceeds the expected pure maximum. The percentage is unusual. Check product purity and measurement assumptions.
      - text: 'Any reported result over 100% is mathematically impossible.'
        rationale: |
          This confuses the true product maximum with what a balance may report. The ideal limit is 100%. Check whether measured mass can include other material.
    explanation: |
      A measured product mass can include solvent or impurities. Such extra mass can give an apparent yield above 100%. The result calls for checking purity, measurement, and reaction assumptions.
    approved: false

  - id: q-chemistry-stoichiometry-0017
    type: 'simple-quantitative'
    difficulty: 'hard'
    stem: |
      Normalized empirical mole ratios are C:H:O = $1:1.5:1$. What simplest whole-number ratio follows?
    choices:
      - text: '2:3:2'
        correct: true
      - text: '1:2:1'
        rationale: |
          This rounds 1.5 alone to 2. Whole subscripts are needed. Check whether joint scaling preserves the exact ratio.
      - text: '2:1.5:2'
        rationale: |
          This scales carbon and oxygen but not hydrogen. Some values become whole. Check that all ratios receive the same factor.
      - text: '1:1:1'
        rationale: |
          This drops the half in hydrogen. Simple integers are tempting. Check that the composition ratio is preserved.
    explanation: |
      Multiply every ratio by 2. The result is $2:3:2$, which contains whole numbers and has no common factor.
    approved: false

  - id: q-chemistry-stoichiometry-0018
    type: 'compare-contrast'
    difficulty: 'hard'
    stem: |
      Why is crystalline NaCl normally described by formula units rather than a molecular formula?
    choices:
      - text: 'It forms an extended ionic lattice.'
        correct: true
      - text: 'Its lattice consists of separate covalent NaCl molecules.'
        rationale: |
          This applies the discrete-molecule model to an ionic solid. The formula looks compact. Check its extended structure.
      - text: 'It contains only one element and no compound ratio.'
        rationale: |
          This treats one formula as one element. NaCl is one substance. Check its sodium and chlorine composition.
      - text: 'Its empirical formula changes with the size of a crystal.'
        rationale: |
          This treats more units as a changed ratio. Larger crystals contain more ions. Check whether the simplest composition stays the same.
    explanation: |
      NaCl forms an extended lattice of ions. Its formula unit gives the simplest ion ratio in that structure.
    approved: false

  - id: q-chemistry-stoichiometry-0019
    type: 'predict-outcome'
    difficulty: 'exam'
    stem: |
      In a reaction with one limiting and one excess reactant, the ideal reaction consumes the limiting reactant fully. What is left?
    choices:
      - text: 'Some excess reactant may remain.'
        correct: true
      - text: 'Both reactants must be consumed in equal mole amounts.'
        rationale: |
          This confuses complete consumption with equal mole use. The reaction consumes both. Check the balanced ratio and available amounts.
      - text: 'The limiting reactant must remain while the excess disappears.'
        rationale: |
          This reverses limiting and excess. Both labels describe reactants. Check which runs out first.
      - text: 'Every product is automatically collected at 100% experimental yield.'
        rationale: |
          This treats theoretical completion as perfect recovery. The ideal reaction forms product. Check whether laboratory collection can still lose some.
    explanation: |
      The excess reactant was supplied beyond the amount needed to consume the limiting reactant. Some of it therefore remains under the stated ideal reaction model.
    approved: false

  - id: q-chemistry-stoichiometry-0020
    type: 'simple-quantitative'
    difficulty: 'exam'
    stem: |
      A molecular formula is $C_4H_8$, with an empirical-formula mass of 14 g/mol. What molecular molar mass follows?
    choices:
      - text: '56 g/mol'
        correct: true
      - text: '14 g/mol'
        rationale: |
          This uses one empirical unit’s mass for the whole molecule. Four such ratios occur. Check the molecular-to-empirical factor.
      - text: '28 g/mol'
        rationale: |
          This uses hydrogen’s subscript ratio as only two units. The molecule has eight hydrogens. Check that each CH2 unit already has two.
      - text: '3.5 g/mol'
        rationale: |
          This divides 14 by four instead of multiplying. Four is the factor. Check whether the whole molecule is heavier than one empirical unit.
    explanation: |
      The empirical ratio is $CH_2$. The molecule has four such units. Multiply $4\times14=56$ g/mol.
    approved: false
