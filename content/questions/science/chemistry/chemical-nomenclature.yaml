meta:
  subject: science
  topic: chemistry
  subtopic: chemical-nomenclature
  exams: ["upcat", "dlsucet", "ustet", "dost-sei"]
questions:
  - id: q-chemistry-chemical-nomenclature-0001
    type: 'identify'
    difficulty: 'easy'
    stem: |
      Potassium ($K$) and bromine ($Br$) combine to form an ionic compound. What is its name?
    choices:
      - text: 'Potassium bromide'
        correct: true
      - text: 'Potassium bromine'
        rationale: |
          This keeps the neutral element name for an anion. Bromine is the familiar element name. Check whether the anion needs the ending -ide.
      - text: 'Bromide potassium'
        rationale: |
          This reverses the cation and anion. Both names identify the ions. Check that the positive ion comes first.
      - text: 'Potassium monobromide'
        rationale: |
          This applies molecular prefixes to an ionic salt. The formula has one of each ion. Check which naming system the compound requires.
    explanation: |
      Name the cation first: potassium. Change the monatomic bromine anion to bromide. The name is potassium bromide.
    approved: true

  - id: q-chemistry-chemical-nomenclature-0002
    type: 'identify'
    difficulty: 'easy'
    stem: |
      What is the correct name for $CO$ (one carbon atom, one oxygen atom)?
    choices:
      - text: 'Carbon monoxide'
        correct: true
      - text: 'Carbon oxide'
        rationale: |
          This omits the second element’s count. The prefix mono- is often dropped on the first element. Check whether the element is first or second.
      - text: 'Monocarbon oxide'
        rationale: |
          This moves mono- to carbon and leaves oxygen’s count unstated. Each element has one atom. Check which element normally keeps mono-.
      - text: 'Carbon dioxide'
        rationale: |
          This assigns two oxygen atoms to a one-oxygen formula. Di- is a familiar prefix. Check oxygen’s subscript.
    explanation: |
      For this binary molecular compound, the first element is carbon. One oxygen atom gives monoxide. The name is carbon monoxide.
    approved: true

  - id: q-chemistry-chemical-nomenclature-0003
    type: 'identify'
    difficulty: 'easy'
    stem: |
      What composition is specified by the name carbon dioxide?
    choices:
      - text: 'One carbon and two oxygen atoms'
        correct: true
      - text: 'Two carbon and one oxygen atom'
        rationale: |
          This reads di- as the carbon count. Carbon appears first in the name. Check which element the prefix is attached to.
      - text: 'One carbon and one oxygen atom'
        rationale: |
          This reads di- as the total number of atoms. The name contains a number prefix. Check each element’s count separately.
      - text: 'Two carbon and two oxygen atoms'
        rationale: |
          This applies di- to both elements. The name has two element names and one count prefix. Check which element actually carries di-.
    explanation: |
      Di- means two, and oxide names oxygen in this binary molecular compound. Carbon dioxide has one carbon atom and two oxygen atoms.
    approved: true

  - id: q-chemistry-chemical-nomenclature-0004
    type: 'classify'
    difficulty: 'medium'
    stem: |
      Copper can form either $Cu^+$ or $Cu^{2+}$. In the compound $CuO$ (with oxide, $O^{2-}$), what is copper's charge here, and what is the compound's name?
    choices:
      - text: '$Cu^{2+}$; copper(II) oxide'
        correct: true
      - text: '$Cu^+$; copper(I) oxide'
        rationale: |
          This assigns $1+$ to copper without balancing oxide. Copper can have that charge in other compounds. Check the charge total for this formula.
      - text: 'Unknown charge; copper oxide'
        rationale: |
          This treats a variable-charge metal as impossible to identify. Copper has more than one possible charge. Check the known anion charge and the ratio.
      - text: '$Cu^{2+}$; copper(I) oxide'
        rationale: |
          This uses I for a $2+$ ion. The formula has one copper atom. Check that the Roman numeral records charge, not atom count.
    explanation: |
      One oxide ion contributes $2-$ charge. One copper ion must contribute $2+$ to give zero total charge. The Stock name is copper(II) oxide.
    approved: true

  - id: q-chemistry-chemical-nomenclature-0005
    type: 'classify'
    difficulty: 'medium'
    stem: |
      Iron can form either $Fe^{2+}$ or $Fe^{3+}$. What is the correct name for $FeCl_3$?
    choices:
      - text: 'Iron(III) chloride'
        correct: true
      - text: 'Iron(II) chloride'
        rationale: |
          This chooses a possible iron charge without balancing three chlorides. Iron(II) compounds do exist. Check the total negative charge.
      - text: 'Iron chloride'
        rationale: |
          This leaves the iron charge unstated. The element names sound complete. Check whether iron can have more than one charge.
      - text: 'Triiron monochloride'
        rationale: |
          This moves the chlorine count onto iron and uses a molecular prefix. The subscript 3 is visible. Check which element carries that subscript and which naming system applies.
    explanation: |
      Each chloride contributes $1-$ charge. Three chlorides contribute $3-$. Iron must be $3+$, so the name is iron(III) chloride.
    approved: true

  - id: q-chemistry-chemical-nomenclature-0006
    type: 'classify'
    difficulty: 'medium'
    stem: |
      What is the correct name for $N_2O_5$ (two nitrogen atoms, five oxygen atoms)?
    choices:
      - text: 'Dinitrogen pentoxide'
        correct: true
      - text: 'Nitrogen pentoxide'
        rationale: |
          This omits nitrogen’s count. Mono- is often omitted on a first element. Check whether there is one nitrogen atom or more.
      - text: 'Dinitrogen pentaoxide'
        rationale: |
          This keeps the extra a before oxide. Penta- does mean five. Check the standard contracted spelling pentoxide.
      - text: 'Pentanitrogen dioxide'
        rationale: |
          This applies the oxygen count to nitrogen and the nitrogen count to oxygen. Both prefixes are present. Check each prefix against its element’s subscript.
    explanation: |
      Two nitrogen atoms give dinitrogen. Five oxygen atoms give pentoxide, with the a in penta- dropped before oxide. The name is dinitrogen pentoxide.
    approved: true

  - id: q-chemistry-chemical-nomenclature-0007
    type: 'simple-quantitative'
    difficulty: 'medium'
    stem: |
      Write the chemical formula for calcium nitrate, given that calcium forms $Ca^{2+}$ and the nitrate ion is $NO_3^-$.
    choices:
      - text: '$Ca(NO_3)_2$'
        correct: true
      - text: '$Ca_2NO_3$'
        rationale: |
          This assigns the 2 to calcium instead of nitrate. The calcium charge is 2+. Check the charge sum for the proposed ratio.
      - text: '$CaNO_3$'
        rationale: |
          This uses one nitrate per calcium. A one-to-one formula is a common first guess. Check whether the charges cancel.
      - text: '$Ca_2(NO_3)_2$'
        rationale: |
          This doubles the calcium count without providing enough nitrate. Both subscripts look balanced. Check positive and negative charge totals.
    explanation: |
      Calcium contributes $2+$. Each nitrate contributes $1-$, so two nitrates balance one calcium. Keep each nitrate together in parentheses: $Ca(NO_3)_2$.
    approved: true

  - id: q-chemistry-chemical-nomenclature-0008
    type: 'simple-quantitative'
    difficulty: 'hard'
    stem: |
      Write the chemical formula for aluminum sulfate, given that aluminum forms $Al^{3+}$ and the sulfate ion is $SO_4^{2-}$.
    choices:
      - text: '$Al_2(SO_4)_3$'
        correct: true
      - text: '$Al_3(SO_4)_2$'
        rationale: |
          This puts each charge on its own ion as a count. The numbers 3 and 2 look familiar. Check the resulting total charges.
      - text: '$AlSO_4$'
        rationale: |
          This assumes a one-to-one ratio. Both ions carry multiple charges. Check whether their charge sizes are equal.
      - text: '$Al_2SO_4$'
        rationale: |
          This counts two aluminums but only one sulfate. The aluminum subscript matches part of the answer. Check the number of whole sulfate ions.
    explanation: |
      Two aluminum ions give $2\times3=6$ positive charges. Three sulfate ions give $3\times2=6$ negative charges. This smallest balanced ratio gives $Al_2(SO_4)_3$.
    approved: true

  - id: q-chemistry-chemical-nomenclature-0009
    type: 'classify'
    difficulty: 'hard'
    stem: |
      What does III specify in iron(III) chloride?
    choices:
      - text: 'The charge of each iron ion'
        correct: true
      - text: 'The number of iron atoms per unit'
        rationale: |
          This uses the numeral as an atom count. Roman numerals represent numbers. Check whether Stock notation describes charge or composition.
      - text: 'The charge of each chloride ion'
        rationale: |
          This assigns the numeral to the anion charge. Chloride appears in the same name. Check which ion the numeral follows.
      - text: 'The number of chlorine molecules'
        rationale: |
          This reads a charge label as a molecular prefix. Prefixes also give numbers. Check whether the compound is ionic or molecular.
    explanation: |
      In a simple ionic Stock name, the Roman numeral gives the metal ion’s charge. III identifies iron as $Fe^{3+}$.
    approved: true

  - id: q-chemistry-chemical-nomenclature-0010
    type: 'classify'
    difficulty: 'hard'
    stem: |
      Which rule explains why carbon monoxide omits mono- on carbon but keeps it in monoxide?
    choices:
      - text: 'Omit mono- only on the first element.'
        correct: true
      - text: 'Omit mono- on every one-atom element.'
        rationale: |
          This drops mono- on both elements. Both may have one atom. Check which position in the name allows the omission.
      - text: 'Omit every prefix on the first element.'
        rationale: |
          This drops every numerical prefix on the first element. Mono- is often absent there. Check whether the first element has more than one atom.
      - text: 'Omit prefixes whenever charge is balanced.'
        rationale: |
          This applies an ionic rule to molecular names. Ionic names usually omit count prefixes. Check the substance’s naming class.
    explanation: |
      In the binary molecular prefix system, the first element usually omits mono- when its count is one. The second element keeps its count prefix.
    approved: true

  - id: q-chemistry-chemical-nomenclature-0011
    type: 'classify'
    difficulty: 'hard'
    stem: |
      Which name correctly retains the polyatomic ion name in $NaOH$?
    choices:
      - text: 'Sodium hydroxide'
        correct: true
      - text: 'Sodium hydroxide-ide'
        rationale: |
          This adds a second suffix to an established ion name. Monatomic anions do use -ide. Check whether the anion has one atom or several.
      - text: 'Sodium oxide'
        rationale: |
          This changes a polyatomic ion into a single-element anion name. Oxygen is part of hydroxide. Check whether hydrogen must remain part of the ion.
      - text: 'Sodium monohydroxide'
        rationale: |
          This applies a molecular count prefix to an ionic compound. One hydroxide group is present. Check the naming class.
    explanation: |
      Hydroxide is the established name of $OH^-$. Polyatomic ions keep their names in ionic compounds. $NaOH$ is sodium hydroxide.
    approved: true

  - id: q-chemistry-chemical-nomenclature-0012
    type: 'classify'
    difficulty: 'medium'
    stem: |
      Which formula is the sulfite ion listed in the lesson?
    choices:
      - text: '$SO_3^{2-}$'
        correct: true
      - text: '$SO_5^{2-}$'
        rationale: |
          This adds oxygen in the -ite member of this pair. Both names refer to sulfur oxyanions. Check the listed formulas for the pair.
      - text: '$SO_4^{2-}$'
        rationale: |
          This uses the sulfate formula for sulfite. Both ions have the same charge. Check the oxygen count too.
      - text: '$SO_4^-$'
        rationale: |
          This changes the charge but retains sulfate’s oxygen count. A suffix change suggests a different ion. Check both composition and charge in the known formula.
    explanation: |
      The lesson lists sulfite as $SO_3^{2-}$. It has three oxygens and a $2-$ charge. In this known sulfur oxyanion pair, sulfite has fewer oxygens than sulfate.
    approved: true

  - id: q-chemistry-chemical-nomenclature-0013
    type: 'classify'
    difficulty: 'medium'
    stem: |
      For a binary molecular compound named by the Greek-prefix system, what do the prefixes specify?
    choices:
      - text: 'Atom counts'
        correct: true
      - text: 'Positive metal-ion charges'
        rationale: |
          This applies ionic naming to a molecular compound. Some compound names do use ion names. Check whether the stem specifies molecules or ions.
      - text: 'The charges of all anions'
        rationale: |
          This treats numerical prefixes as metal charges. Both systems use numbers. Check whether the name reports atom counts or oxidation states.
      - text: 'Only the identities of its elements'
        rationale: |
          This leaves composition unspecified. Element names identify the ingredients. Check whether different atom counts can produce different compounds.
    explanation: |
      For a binary molecular compound in the prefix system, numerical prefixes state atom counts. The first element usually omits mono- for one atom. The second uses a prefix and an -ide ending.
    approved: true

  - id: q-chemistry-chemical-nomenclature-0014
    type: 'process-ordering'
    difficulty: 'exam'
    stem: |
      Which procedure correctly writes a simple ionic formula from given ion charges?
    choices:
      - text: 'Balance, reduce ratios, group repeated polyatomic ions.'
        correct: true
      - text: 'Name first, guess counts, then disregard total charge.'
        rationale: |
          This names the compound before deciding its composition. Names are the final goal. Check the charge-balanced ion ratio before assigning a formula.
      - text: 'Reduce ion charges, copy them as subscripts, then name.'
        rationale: |
          This reduces charge sizes before finding a balanced ion ratio. Simplifying numbers is useful. Check that each ion’s actual charge stays unchanged.
      - text: 'Parenthesize all anions, assume one-to-one, then name.'
        rationale: |
          This adds parentheses to every anion before checking its type and count. Repeated polyatomic ions need them. Check whether the ion is polyatomic and repeated.
    explanation: |
      Balance the ion charges first. Reduce the balanced counts to the smallest whole-number ratio. Then use parentheses if a polyatomic ion occurs more than once.
    approved: true

  - id: q-chemistry-chemical-nomenclature-0015
    type: 'predict-outcome'
    difficulty: 'exam'
    stem: |
      Iron can form either $Fe^{2+}$ or $Fe^{3+}$. The compound $Fe_2O_3$ contains 2 iron atoms and 3 oxide ions ($O^{2-}$). What is iron's charge in this compound, and what is the compound's correct name?
    choices:
      - text: '$Fe^{3+}$; iron(III) oxide'
        correct: true
      - text: '$Fe^{2+}$; iron(II) oxide'
        rationale: |
          This uses a familiar $2+$ iron charge without checking neutrality. Iron(II) is a real ion. Check the total charge of this formula.
      - text: '$Fe^{6+}$; iron(VI) oxide'
        rationale: |
          This gives one iron ion the positive charge for both ions. Six positive charges are needed in total. Check how many irons share that total.
      - text: 'Unknown charge; iron oxide'
        rationale: |
          This treats a variable-charge metal as unknowable. Iron does have multiple charges. Check whether oxide’s charge and the formula determine this one.
    explanation: |
      Three oxide ions give $3\times2=6$ negative charges. The two iron ions must total $6+$, so each is $3+$. The name is iron(III) oxide.
    approved: true

  - id: q-chemistry-chemical-nomenclature-0016
    type: 'identify'
    difficulty: 'easy'
    stem: |
      Which name applies to $NH_4Cl$, containing $NH_4^+$ and $Cl^-$?
    choices:
      - text: 'Ammonium chloride'
        correct: true
      - text: 'Ammonium chlorine'
        rationale: |
          This retains the neutral element name. Chlorine is the familiar name. Check whether the negative ion takes -ide.
      - text: 'Nitrogen hydrogen chloride'
        rationale: |
          This splits a named polyatomic ion into element names. Ammonium contains nitrogen and hydrogen. Check whether the ion must remain a named unit.
      - text: 'Ammonium monochloride'
        rationale: |
          This adds a molecular prefix to an ionic salt. One chloride is present. Check whether ionic naming uses that count prefix.
    explanation: |
      Name the polyatomic cation ammonium first. Name the monatomic anion chloride second. The result is ammonium chloride.
    approved: false

  - id: q-chemistry-chemical-nomenclature-0017
    type: 'compare-contrast'
    difficulty: 'medium'
    stem: |
      How do formulas for simple ionic compounds differ from formulas for binary molecules?
    choices:
      - text: 'Ionic ratios are reduced; molecular counts are retained.'
        correct: true
      - text: 'Both formulas always use the smallest element ratio.'
        rationale: |
          This reduces a molecule’s actual atom counts. Reducing ratios is required for ionic formulas. Check which class the formula represents.
      - text: 'Both formulas always report the number of molecules.'
        rationale: |
          This confuses atom or ion counts with molecule counts. A formula does contain subscripts. Check what the subscripts count.
      - text: 'Ionic formulas use prefixes; molecular formulas use charges.'
        rationale: |
          This reverses how the formulas are obtained. Both systems involve numbers. Check whether neutrality or molecular naming prefixes give the counts.
    explanation: |
      An ionic formula states the smallest whole-number ion ratio. A molecular formula states the actual atom counts in one molecule.
    approved: false

  - id: q-chemistry-chemical-nomenclature-0018
    type: 'predict-outcome'
    difficulty: 'medium'
    stem: |
      Criss-crossing $Ca^{2+}$ and $O^{2-}$ gives $Ca_2O_2$. Which formula should be reported after applying the simplest-ratio rule?
    choices:
      - text: '$CaO$'
        correct: true
      - text: '$Ca_2O_2$'
        rationale: |
          This leaves the balanced ratio unreduced. Criss-crossing produced those counts. Check for a common factor in the subscripts.
      - text: '$CaO_2$'
        rationale: |
          This reduces only calcium’s count. The original ratio contains two of each. Check that both counts are divided by the same factor.
      - text: '$Ca_2O$'
        rationale: |
          This reduces only oxide’s count. Removing one subscript can seem enough. Check that ratio reduction changes both counts together.
    explanation: |
      The charges cancel with one calcium and one oxide. Reduce the $2:2$ counts to $1:1$. The formula is $CaO$.
    approved: false

  - id: q-chemistry-chemical-nomenclature-0019
    type: 'cause-effect'
    difficulty: 'hard'
    stem: |
      Why does $Ca(NO_3)_2$ need parentheses around nitrate?
    choices:
      - text: 'Two whole nitrate ions are present.'
        correct: true
      - text: 'Two oxygen atoms must be counted.'
        rationale: |
          This applies the outside subscript to oxygen alone. Oxygen already has a subscript. Check whether the 2 multiplies one atom or the whole group.
      - text: 'The nitrate ion has a charge of $2-$.'
        rationale: |
          This treats a count as the ion’s charge. A 2 appears outside the parentheses. Check the charge notation separately.
      - text: 'Every ion always needs parentheses.'
        rationale: |
          This treats a repeated-ion rule as universal. Many polyatomic formulas use parentheses. Check whether more than one whole ion is present.
    explanation: |
      The outside subscript 2 applies to the whole $NO_3$ group. Parentheses keep the nitrate ion together when it is repeated.
    approved: false

  - id: q-chemistry-chemical-nomenclature-0020
    type: 'classify'
    difficulty: 'exam'
    stem: |
      Which statement about -ate and -ite is justified by the nomenclature rule?
    choices:
      - text: 'Compare known ions in the same oxyanion family.'
        correct: true
      - text: 'Any -ate ion has more oxygen than every -ite ion.'
        rationale: |
          This compares unrelated families. The -ate member often has more oxygen within a pair. Check that both ions have the same central element.
      - text: 'The suffix alone gives every ion’s charge and formula.'
        rationale: |
          This turns a suffix into a complete formula rule. Familiar names suggest useful patterns. Check a known formula rather than inferring charge from the suffix.
      - text: 'Every -ate and -ite pair differs by exactly one oxygen.'
        rationale: |
          This makes familiar pairs an exception-free count rule. Sulfate and sulfite differ by one oxygen. Check whether the particular pair is known.
    explanation: |
      The pattern compares related oxyanions of the same central element. Their established formulas must still be known. The suffix alone does not define all oxyanions.
    approved: false
