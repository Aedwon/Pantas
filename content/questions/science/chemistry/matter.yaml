meta:
  subject: science
  topic: chemistry
  subtopic: matter
  exams: ["upcat", "dlsucet", "ustet", "dost-sei"]
questions:
  - id: q-chemistry-matter-0001
    type: 'classify'
    difficulty: 'easy'
    stem: |
      Pure oxygen gas ($O_2$) is made of only one type of atom. How should it be classified?
    choices:
      - text: 'Element'
        correct: true
      - text: 'Compound'
        rationale: |
          This treats two atoms per molecule as two elements. The subscript 2 is visible. Check whether the atoms are different elements.
      - text: 'Mixture'
        rationale: |
          This treats several oxygen molecules as several substances. A sample has many particles. Check whether more than one substance is present.
      - text: 'Solution'
        rationale: |
          This treats a pure gas as a solution. Solutions can be uniform gases. Check whether the sample contains multiple components.
    explanation: |
      Pure oxygen contains only oxygen atoms. An element contains one chemical element and cannot be decomposed into simpler substances by ordinary chemical reactions.
    approved: true

  - id: q-chemistry-matter-0002
    type: 'classify'
    difficulty: 'easy'
    stem: |
      Table salt ($NaCl$) is made of sodium and chlorine chemically bonded together in a fixed ratio. How should it be classified?
    choices:
      - text: 'Compound'
        correct: true
      - text: 'Element'
        rationale: |
          This treats a fixed composition as one element. The sample is pure. Check how many elements its formula contains.
      - text: 'Homogeneous mixture'
        rationale: |
          This treats two element names as separately mixed substances. Both elements are present. Check whether they are chemically combined in a fixed ratio.
      - text: 'Heterogeneous mixture'
        rationale: |
          This treats visible salt grains as unlike components. A bulk sample can have many grains. Check whether each grain is the same substance.
    explanation: |
      Pure sodium chloride contains sodium and chlorine chemically combined in a definite ratio. This makes it a compound.
    approved: true

  - id: q-chemistry-matter-0003
    type: 'classify'
    difficulty: 'easy'
    stem: |
      A glass of lemonade contains water, sugar, and lemon juice combined in amounts that can be adjusted to taste. How should it be classified?
    choices:
      - text: 'Mixture'
        correct: true
      - text: 'Compound'
        rationale: |
          This treats one drink as one fixed chemical formula. The drink has a familiar name. Check whether its ingredient proportions can vary.
      - text: 'Element'
        rationale: |
          This treats a uniform-looking drink as one atom type. A single sample can look simple. Check the different substances it contains.
      - text: 'Pure substance'
        rationale: |
          This treats a named beverage as a pure chemical. It may look consistent. Check whether water, sugar, and lemon components remain present.
    explanation: |
      Lemonade combines several substances in proportions that can vary. Its components retain their identities. It is a mixture.
    approved: true

  - id: q-chemistry-matter-0004
    type: 'classify'
    difficulty: 'medium'
    stem: |
      Saltwater looks completely uniform, with no visible particles of salt floating in it. A student concludes it must be a compound. Is the student correct?
    choices:
      - text: 'No; saltwater is a mixture.'
        correct: true
      - text: 'Yes; every uniform sample is a compound.'
        rationale: |
          This treats uniform appearance as proof of fixed chemical composition. Compounds can look uniform. Check whether the component ratio can vary.
      - text: 'No; variable composition prevents classification.'
        rationale: |
          This treats variable composition as impossible to classify. It lacks one fixed formula. Check the definition of a mixture.
      - text: 'Yes; dissolved salt cannot be separated physically.'
        rationale: |
          This treats dissolution as permanent chemical combination. The salt is no longer visible. Check whether a suitable physical separation can recover components.
    explanation: |
      The amount of salt dissolved in a given amount of water can vary. Saltwater therefore has variable composition and is a mixture.
    approved: true

  - id: q-chemistry-matter-0005
    type: 'cause-effect'
    difficulty: 'easy'
    stem: |
      An ice cube is left on a table and turns into a puddle of water. Name this phase change.
    choices:
      - text: 'Melting'
        correct: true
      - text: 'Freezing'
        rationale: |
          This reverses the direction. Freezing connects the same states. Check which state comes first.
      - text: 'Evaporation'
        rationale: |
          This selects a liquid-to-gas process. Water can evaporate. Check whether gas is the stated final state.
      - text: 'Sublimation'
        rationale: |
          This selects a change that skips liquid. Ice can sublime under some conditions. Check that the stem describes a liquid puddle.
    explanation: |
      The starting state is solid ice. The ending state is liquid water. A solid-to-liquid change is melting.
    approved: true

  - id: q-chemistry-matter-0006
    type: 'cause-effect'
    difficulty: 'easy'
    stem: |
      Water vapor touches a cold glass window and turns into liquid droplets on the surface. Name this phase change.
    choices:
      - text: 'Condensing'
        correct: true
      - text: 'Evaporation'
        rationale: |
          This reverses the state change. Evaporation also involves water and air. Check the starting and ending phases.
      - text: 'Freezing'
        rationale: |
          This treats a cold surface as necessarily making ice. Cooling can freeze water. Check whether the product is a liquid or solid.
      - text: 'Deposition'
        rationale: |
          This treats all vapor on a cold surface as frost formation. Deposition starts from gas. Check whether the final material is solid.
    explanation: |
      The water begins as gas and ends as liquid droplets. Gas-to-liquid change is condensation.
    approved: true

  - id: q-chemistry-matter-0007
    type: 'cause-effect'
    difficulty: 'medium'
    stem: |
      At ordinary atmospheric pressure, solid carbon dioxide changes directly into carbon dioxide gas, with no liquid phase. Name the phase change.
    choices:
      - text: 'Sublimation'
        correct: true
      - text: 'Evaporation'
        rationale: |
          This assumes a liquid stage. Evaporation makes a gas. Check the stated initial phase.
      - text: 'Melting'
        rationale: |
          This assumes the disappearing solid becomes liquid. Many solids melt when warmed. Check whether a liquid phase forms.
      - text: 'Condensing'
        rationale: |
          This reverses the gas formation. Condensation can make visible droplets. Check the carbon dioxide’s own starting and ending states.
    explanation: |
      The carbon dioxide starts as a solid and changes directly to gas. A solid-to-gas phase change is sublimation.
    approved: true

  - id: q-chemistry-matter-0008
    type: 'cause-effect'
    difficulty: 'medium'
    stem: |
      On a very cold morning, water vapor in the air turns directly into ice crystals (frost) on a car window, without first forming liquid water. Name this phase change.
    choices:
      - text: 'Deposition'
        correct: true
      - text: 'Freezing'
        rationale: |
          This assumes liquid water formed first. Frost is frozen-looking water. Check the explicitly stated initial gas phase.
      - text: 'Sublimation'
        rationale: |
          This reverses the direction. Sublimation connects solid and gas. Check which phase is the product.
      - text: 'Condensing'
        rationale: |
          This chooses the process ending in liquid. Both start with vapor. Check whether droplets or crystals form.
    explanation: |
      Water begins as vapor and becomes solid ice directly. Gas-to-solid change is deposition.
    approved: true

  - id: q-chemistry-matter-0009
    type: 'cause-effect'
    difficulty: 'medium'
    stem: |
      Is melting an endothermic or an exothermic phase change?
    choices:
      - text: 'Endothermic; heat enters.'
        correct: true
      - text: 'Exothermic; heat leaves the sample.'
        rationale: |
          This reverses the energy direction. A substance changes phase. Check whether heat enters or leaves the melting sample.
      - text: 'Endothermic; heat leaves the sample.'
        rationale: |
          This pairs the term endothermic with heat leaving. The right classification term appears. Check its definition.
      - text: 'Exothermic; phase changes transfer no heat.'
        rationale: |
          This assumes a physical change needs no heat transfer. Chemical identity remains the same. Check that a phase change can still absorb energy.
    explanation: |
      At a given pressure, melting requires energy input to the substance. A process that absorbs energy is endothermic.
    approved: true

  - id: q-chemistry-matter-0010
    type: 'cause-effect'
    difficulty: 'medium'
    stem: |
      Is freezing an endothermic or an exothermic phase change?
    choices:
      - text: 'Exothermic; heat leaves.'
        correct: true
      - text: 'Endothermic; heat enters the sample.'
        rationale: |
          This reverses heat flow during freezing. The material becomes solid. Check whether the freezing sample releases latent heat.
      - text: 'Exothermic; heat enters the sample.'
        rationale: |
          This pairs exothermic with heat absorption. The correct term is present. Check what the term means.
      - text: 'Endothermic; added heat causes freezing.'
        rationale: |
          This confuses removal of heat with a requirement to add heat. Temperature changes are involved. Check the direction of energy transfer.
    explanation: |
      At a given pressure, freezing releases energy from the substance to its surroundings. A process that releases energy is exothermic.
    approved: true

  - id: q-chemistry-matter-0011
    type: 'classify'
    difficulty: 'medium'
    stem: |
      "Iron is attracted to a magnet." Is this a physical property or a chemical property?
    choices:
      - text: 'Physical property'
        correct: true
      - text: 'Chemical property'
        rationale: |
          This assumes a magnetic interaction forms a new chemical species. Iron responds to a magnet. Check whether its identity changes.
      - text: 'Physical change'
        rationale: |
          This treats a characteristic as a described event. Iron could move toward a magnet. Check whether the statement describes a capacity or a completed change.
      - text: 'Chemical change'
        rationale: |
          This treats magnetism as a reaction producing new matter. A visible response occurs. Check whether new chemical products are specified.
    explanation: |
      Magnetic attraction can be observed without changing iron’s chemical identity. It describes a characteristic of iron, so it is a physical property.
    approved: true

  - id: q-chemistry-matter-0012
    type: 'classify'
    difficulty: 'hard'
    stem: |
      "Iron can react with oxygen and moisture to form rust." Is this describing a chemical property or a chemical change?
    choices:
      - text: 'Chemical property'
        correct: true
      - text: 'Chemical change already completed'
        rationale: |
          This reads a possible reaction as completed. Rust is named. Check the word can in the statement.
      - text: 'Physical property of iron’s surface'
        rationale: |
          This treats a surface reaction as only physical. Rust forms at the surface. Check whether the chemical identity changes.
      - text: 'Physical change with no new substance'
        rationale: |
          This treats the statement as a physical event. The sample could look different after rusting. Check whether it describes an ability or an event.
    explanation: |
      The statement describes iron’s ability to react. That ability is a chemical property because the possible reaction forms rust.
    approved: true

  - id: q-chemistry-matter-0013
    type: 'classify'
    difficulty: 'hard'
    stem: |
      An iron nail reacts with oxygen and moisture, forming a reddish-brown rust coating. How is this completed event classified?
    choices:
      - text: 'Chemical change'
        correct: true
      - text: 'Chemical property of iron’s reactivity'
        rationale: |
          This treats a completed reaction as only a general ability. Iron’s tendency to rust is a property. Check whether rust has already formed.
      - text: 'Physical change caused only by reshaping'
        rationale: |
          This uses appearance alone to classify the event. The nail’s shape can change. Check the stated formation of a new substance.
      - text: 'Physical property of the visible coating'
        rationale: |
          This treats an event as a static description. The coating is visible. Check whether the question describes the transformation that formed it.
    explanation: |
      The iron has reacted to form rust. This is an event producing new chemical substances, so it is a chemical change.
    approved: true

  - id: q-chemistry-matter-0014
    type: 'classify'
    difficulty: 'medium'
    stem: |
      A sheet of paper is torn into several pieces. Is this a physical change or a chemical change?
    choices:
      - text: 'Physical change'
        correct: true
      - text: 'Chemical change'
        rationale: |
          This assumes making pieces creates new substances. The appearance changes. Check whether chemical identity changes.
      - text: 'Physical property'
        rationale: |
          This treats an event as a characteristic. Paper has physical properties. Check whether the statement describes an action.
      - text: 'Chemical property'
        rationale: |
          This treats tearing as a reaction capacity. The paper can undergo changes. Check whether tearing forms chemical products.
    explanation: |
      Tearing changes the paper’s size and shape. Its chemical substances stay the same. The event is a physical change.
    approved: true

  - id: q-chemistry-matter-0015
    type: 'compare-contrast'
    difficulty: 'hard'
    stem: |
      A student claims that boiling water into steam creates a new substance, since steam looks and behaves so differently from liquid water. Which statement correctly evaluates this claim?
    choices:
      - text: 'Boiling changes water’s phase.'
        correct: true
      - text: 'Boiling creates a chemically different substance.'
        rationale: |
          This treats different phases as different chemical species. Gas and liquid behave differently. Check whether their chemical formulas change.
      - text: 'Boiling turns pure water into a mixture of substances.'
        rationale: |
          This treats separated vapor as necessarily several substances. Vapors can be mixtures in some cases. Check that this sample is pure water.
      - text: 'Boiling is chemical because every heat-absorbing change is chemical.'
        rationale: |
          This treats heat input as proof of a reaction. Boiling requires energy. Check whether new chemical species form.
    explanation: |
      Boiling pure water changes liquid $H_2O$ into gaseous $H_2O$. Its chemical identity stays the same. This is a physical phase change.
    approved: true

  - id: q-chemistry-matter-0016
    type: 'predict-outcome'
    difficulty: 'exam'
    stem: |
      A student burns a small piece of paper. It turns into ash and smoke while releasing noticeable heat. Which pair correctly describes this event?
    choices:
      - text: 'Chemical change; exothermic'
        correct: true
      - text: 'Physical change; exothermic'
        rationale: |
          This treats burning as only a shape change. Paper’s appearance changes greatly. Check whether new chemical substances form.
      - text: 'Chemical change; endothermic'
        rationale: |
          This reverses the observed heat transfer. Heat is involved. Check whether the reaction releases or absorbs it.
      - text: 'Physical change; endothermic'
        rationale: |
          This confuses both chemical identity and heat direction. The event changes appearance and involves heat. Check the new products and outward heat flow separately.
    explanation: |
      Burning produces new chemical substances, so it is a chemical change. Heat leaves the reacting paper, so the process is exothermic.
    approved: true

  - id: q-chemistry-matter-0017
    type: 'classify'
    difficulty: 'easy'
    stem: |
      A sample has a definite volume but flows to take its container’s shape under ordinary conditions. Which state fits?
    choices:
      - text: 'Liquid'
        correct: true
      - text: 'Crystalline solid'
        rationale: |
          This focuses only on definite volume. Solids also have definite volume. Check whether the sample flows.
      - text: 'Gas at equilibrium'
        rationale: |
          This focuses only on taking a container’s shape. Gases do that too. Check whether volume is fixed or expands to fill available space.
      - text: 'Plasma filling a vessel'
        rationale: |
          This focuses on fluid motion. Plasma can move through a vessel. Check whether the sample is an ionized gas or a definite-volume liquid.
    explanation: |
      A liquid retains a definite volume under ordinary conditions. It flows, so its shape follows the container.
    approved: false

  - id: q-chemistry-matter-0018
    type: 'compare-contrast'
    difficulty: 'medium'
    stem: |
      Which statement distinguishes crystalline and amorphous solids?
    choices:
      - text: 'Crystals have long-range order.'
        correct: true
      - text: 'Only crystals have a definite volume.'
        rationale: |
          This equates definite volume with crystalline order. Both are solid properties in familiar examples. Check whether an amorphous solid can retain volume.
      - text: 'Amorphous solids always fill any vessel like gases.'
        rationale: |
          This confuses lack of a repeating lattice with the gas state. Disorder may sound like gas motion. Check whether the material is still solid.
      - text: 'Every solid has exactly the same repeating lattice.'
        rationale: |
          This generalizes a crystal drawing to every solid. Textbooks often show fixed grids. Check the amorphous category.
    explanation: |
      Crystalline solids have an ordered pattern extending through the material. Amorphous solids such as glass lack that long-range repeating pattern.
    approved: false

  - id: q-chemistry-matter-0019
    type: 'identify'
    difficulty: 'hard'
    stem: |
      Which feature defines plasma in the introductory matter classification?
    choices:
      - text: 'An ionized gas'
        correct: true
      - text: 'Any gas hotter than room temperature'
        rationale: |
          This substitutes high temperature for ionization. Heating can produce plasma. Check whether the gas contains the defining charged particles.
      - text: 'A liquid with all particles arranged in a lattice'
        rationale: |
          This substitutes a crystal arrangement for the plasma state. Both are states of matter. Check the gas and ionization description.
      - text: 'A gas containing only electrically neutral particles'
        rationale: |
          This removes the charged particles. Ordinary gases can be mostly neutral. Check the feature that makes plasma distinct.
    explanation: |
      Plasma is an ionized gas containing charged particles. Its charged particles can show collective behavior.
    approved: false

  - id: q-chemistry-matter-0020
    type: 'compare-contrast'
    difficulty: 'exam'
    stem: |
      Which correctly distinguishes evaporation from boiling?
    choices:
      - text: 'Evaporation is at the surface; boiling is throughout.'
        correct: true
      - text: 'Evaporation is throughout; boiling is only at the surface.'
        rationale: |
          This reverses the locations. Both processes produce vapor. Check whether bubbles form through the liquid or molecules leave its surface.
      - text: 'Evaporation always needs the boiling temperature first.'
        rationale: |
          This assumes all vaporization requires boiling conditions. Boiling is a familiar way to make vapor. Check whether a surface can lose molecules below the boiling point.
      - text: 'Boiling changes chemical identity; evaporation never does.'
        rationale: |
          This treats different vaporization methods as different chemistry. Boiling is more visible. Check whether the substance’s chemical identity changes.
    explanation: |
      Evaporation is vaporization at the liquid surface and can occur below the boiling point. Boiling occurs throughout the liquid when its vapor pressure reaches the surrounding pressure.
    approved: false
