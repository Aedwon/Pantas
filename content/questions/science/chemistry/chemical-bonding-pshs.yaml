questions:
  - id: q-chemistry-chemical-bonding-pshs-0001
    lesson: lesson-chemistry-bonding-and-material-properties
    keyPoint: 1
    type: 'predict-outcome'
    difficulty: 'medium'
    stem: |
      A student wants to dissolve a thin film of nonpolar grease on a tile.
      She can rinse it with water or with a nonpolar liquid. Which prediction
      about the rinse is best supported by the polarity of the substances?
    choices:
      - text: 'The nonpolar liquid works better because its polarity matches the grease.'
        correct: true
      - text: 'Water works better because its polar molecules attract nonpolar grease more strongly.'
        rationale: |
          This treats strong attraction as a feature of water with any substance.
          Water does attract many polar substances. Check the polarity of the grease.
      - text: 'Water works better because opposite polarities attract like opposite charges.'
        rationale: |
          Opposite charges do attract. This treats polar and nonpolar molecules
          as if they had opposite charges. Check what the two labels say about
          how charge is spread out in each molecule.
      - text: 'Both work equally well because the grease has the same polarity in either rinse.'
        rationale: |
          The grease has the same polarity in both tests. This leaves out the
          liquid. Check how each liquid attracts the grease.
      - text: 'Neither works well because a nonpolar liquid and grease cannot attract each other.'
        rationale: |
          This treats a lack of polarity as a lack of any attraction. Polar
          molecules have an uneven spread of charge, which makes their attraction
          easier to picture. Check which kind of liquid usually dissolves a
          nonpolar substance.
    explanation: |
      The grease and the nonpolar liquid are both nonpolar. The grease mixes
      more easily with that liquid, so more of the film dissolves.

  - id: q-chemistry-chemical-bonding-pshs-0002
    lesson: lesson-chemistry-bonding-and-material-properties
    keyPoint: 1
    type: 'cause-effect'
    difficulty: 'medium'
    stem: |
      A sharp tap shifts a layer of ions in a dry salt crystal. The crystal
      splits along that layer. Which change best explains the split?
    choices:
      - text: 'Ions with the same charge move next to each other and repel.'
        correct: true
      - text: 'Ions with opposite charges move next to each other and repel.'
        rationale: |
          Repulsion can push the layers apart. This reverses which charges
          repel. Check what happens when a positive ion is next to a negative ion.
      - text: 'Ions trade electrons during the tap and lose the charges that hold them together.'
        rationale: |
          Gaining or losing electrons can change an ion's charge. This assumes
          that a shift in the layer changes the ions themselves. Check whether
          the tap changes their charges or their spots.
      - text: 'Ions with opposite charges move closer and pull the layers apart.'
        rationale: |
          Opposite charges do pull on each other. This treats that pull as a
          force that opens a gap. Check which way the layers would move if
          they attracted each other.
      - text: 'Ions spread out as the layer melts and flows away from the crystal.'
        rationale: |
          Ions can move from their fixed spots when a crystal melts. This
          mistakes the shift from a tap for melting. Check whether the test
          ends with liquid or broken pieces of solid.
    explanation: |
      The tap slides one layer past the next. Ions with the same charge end up
      side by side. They push away from each other, and the crystal splits.

  - id: q-chemistry-chemical-bonding-pshs-0003
    lesson: lesson-chemistry-bonding-and-material-properties
    keyPoint: 1
    type: 'compare-contrast'
    difficulty: 'hard'
    stem: |
      A class uses a bulb to test a metal strip and a dry salt crystal. The
      bulb lights with the strip but stays dark with the crystal or with pure
      water. It lights when the crystal is dissolved in that water. What
      carries charge through the strip and through the salt solution?
    choices:
      - text: 'Electrons in the strip and ions in the solution.'
        correct: true
      - text: 'Electrons in the strip and free electrons from the salt in the solution.'
        rationale: |
          Electrons carry charge through the metal. This applies the same
          idea to the solution. Check which charged particles in the crystal
          can move once the salt dissolves.
      - text: 'Moving metal ions in the strip and dissolved salt ions in the solution.'
        rationale: |
          Both materials contain ions. This assumes the metal ions travel
          through the strip like ions in water. Check which particles can
          travel through a solid metal during the test.
      - text: 'Ions in the strip and electrons released by the salt into the solution.'
        rationale: |
          This swaps the roles of ions and electrons. Both can carry charge
          if they can move. Check which can move in each material.
      - text: 'Electrons in the strip and polar water molecules in the solution.'
        rationale: |
          Water molecules are polar, so they attract the salt ions. This
          treats the water molecules as the carriers of charge. Check what
          happens when the class tests pure water by itself.
    explanation: |
      Electrons can move through the solid metal and carry charge. When the
      salt dissolves, its ions can move through the water and carry charge there.
