      kind: "figure-matrix"
      rows: 3
      cols: 3
      cells:
        - form: "square"
          size: "small"
          fill: "black"
        - form: "square"
          size: "small"
          fill: "white"
        - form: "square"
          size: "small"
          fill: "black"
        - form: "square"
          size: "medium"
          fill: "black"
        - form: "square"
          size: "medium"
          fill: "white"
        - form: "square"
          size: "medium"
          fill: "black"
        - form: "square"
          size: "large"
          fill: "black"
        - "blank"
        - form: "square"
          size: "large"
          fill: "black"
    stem: |
      Which figure completes the blank cell under the simplest consistent row and column rules?
    choices:
      - text: "Large white square"
        correct: true
      - text: "Large black square"
        rationale: |
          This places the blank in the final column instead of the middle. The neighboring bottom squares are black. Locate the actual empty cell.
      - text: "Medium white square"
        rationale: |
          This gets the column fill but copies the size above. Medium belongs to the middle row. Check the bottom-row size.
      - text: "Small white square"
        rationale: |
          This gets fill but copies the first-row size. Small appears at the top. Follow the size increase down to the blank.
    explanation: |
      Size is constant across each row and grows small, medium, large down columns. Fill is black, white, black across each row. The blank is in the bottom middle, so it is large and white.
    approved: true
  - id: "q-spatial-abstract-reasoning-figure-matrices-0005"
    type: "figure-matrix"
    difficulty: "medium"
    figure: "figure-matrices-05"
    figureSpec:
      kind: "figure-matrix"
      rows: 2
      cols: 3
      cells:
        - form: "circle"
          line: 90
        - form: "circle"
          line: 0
        - form: "circle"
          lines:
            - 90
            - 0
        - form: "square"
          line: 45
        - form: "square"
          line: 135
        - "blank"
    stem: |
      Which figure completes the blank cell under the simplest consistent row and column rules?
    choices:
      - text: "Square with both diagonal rays"
        correct: true
      - text: "Square with only the upper-right ray"
        rationale: |
          This keeps only the first feature. That ray appears in the row. Check that the completed row combines both inputs.
      - text: "Square with only the lower-right ray"
        rationale: |
          This keeps only the second feature. It is the latest input. Check the two-feature result in the completed row.
      - text: "Square with rays up and right"
        rationale: |
          This copies the first row's ray directions. Both rows use union. Combine the second row's actual directions.
    explanation: |
      The third cell in the first row contains both rays from its first two cells. Apply that union to the square row. The blank therefore keeps both diagonal rays, one upper-right and one lower-right.
    approved: true
  - id: "q-spatial-abstract-reasoning-figure-matrices-0006"
    type: "figure-matrix"
    difficulty: "medium"
    figure: "figure-matrices-06"
    figureSpec:
      kind: "figure-matrix"
      rows: 2
      cols: 3
      cells:
        - form: "square"
          size: "small"
          fill: 0.5
        - form: "square"
          size: "small"
          fill: 0.5
          rotation: 180
        - form: "square"
          size: "small"
          fill: "black"
        - form: "square"
          size: "large"
          fill: 0.5
        - form: "square"
          size: "large"
          fill: 0.5
          rotation: 180
        - "blank"
    stem: |
      Which figure completes the blank cell under the simplest consistent row and column rules?
    choices:
      - text: "Fully black square"
        correct: true
      - text: "Fully white square"
        rationale: |
          This treats combining fill as erasing it. The half areas are complementary. Check their combined coverage.
      - text: "Bottom-half-filled square"
        rationale: |
          This keeps only the first shaded area. It is visible in the first cell. Include the second cell's top half too.
      - text: "Top-half-filled square"
        rationale: |
          This keeps only the second shaded area. It is visible in the second cell. Include the first cell's bottom half too.
    explanation: |
      In each row, the third cell combines the filled areas of the first two. Bottom-half and top-half fill together cover the whole square. The missing square is fully black.
    approved: true
  - id: "q-spatial-abstract-reasoning-figure-matrices-0007"
    type: "figure-matrix"
    difficulty: "medium"
    figure: "figure-matrices-07"
    figureSpec:
      kind: "figure-matrix"
      rows: 2
      cols: 2
      cells:
        - form: "circle"
          dot: "top-left"
        - form: "circle"
          dot: "top-right"
        - form: "square"
          dot: "top-left"
        - "blank"
    stem: |
      Which figure completes the blank cell under the simplest consistent row and column rules?
    choices:
      - text: "Square with dot at top-right"
        correct: true
      - text: "Square with dot at top-left"
        rationale: |
          This preserves the starting corner. Both left cells have that dot. Apply the change across the completed row.
      - text: "Square with dot at bottom-right"
        rationale: |
          This takes two corner steps instead of one. Bottom-right follows top-right. Match the single step in the first row.
      - text: "Square with dot at bottom-left"
        rationale: |
          This moves counter-clockwise. Both directions can lead to a neighboring corner. Check the direction in the completed row.
    explanation: |
      Across the top row the dot moves one corner clockwise, from top-left to top-right. The bottom row starts with a top-left dot too. Its missing square therefore needs a top-right dot.
    approved: true
  - id: "q-spatial-abstract-reasoning-figure-matrices-0008"
