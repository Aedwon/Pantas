          This combines rays but copies the preceding row's size. Medium appears above. Follow size down to the final row.
      - text: "Large square with only the up ray"
        rationale: |
          This follows size but keeps only one input ray. Up appears in the second input. Check the combined rays in completed rows.
      - text: "Large square with only the right ray"
        rationale: |
          This follows size but keeps only the first input ray. Right appears at the row start. Include the second input too.
    explanation: |
      Across each row, the last cell combines the first two rays. Down each column, size grows small, medium, large. The missing cell therefore has the large size and both up and right rays.
    approved: true
  - id: "q-spatial-abstract-reasoning-figure-matrices-0015"
    type: "figure-matrix"
