        - form: "square"
          dot: "top-right"
        - form: "pentagon"
          dot: "bottom-right"
        - "blank"
    stem: |
      Which figure completes the blank cell under the simplest consistent row and column rules?
    choices:
      - text: "Pentagon with dot at bottom-left"
        correct: true
      - text: "Pentagon with dot at top-right"
        rationale: |
          This copies the first row's final location. That location is part of the example. Reflect the bottom row's own dot.
      - text: "Pentagon with dot at bottom-right"
        rationale: |
          This keeps the starting location. A regular outline may look similar after reflection. Track the marked dot.
      - text: "Square with dot at bottom-left"
        rationale: |
          This gets the dot but copies the first row's outline. Both rows use the same reflection. Preserve the bottom row's pentagon.
    explanation: |
      Across the first row, the marked shape is reflected left to right: top-left dot becomes top-right. Apply that same reflection to the bottom-left shape's bottom-right dot. Its new dot is bottom-left, and its pentagon outline is kept.
    approved: true
  - id: "q-spatial-abstract-reasoning-figure-matrices-0011"
