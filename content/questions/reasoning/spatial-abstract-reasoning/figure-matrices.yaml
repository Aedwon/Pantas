    stem: |
      Which figure completes the blank cell under the simplest consistent row and column rules?
    choices:
      - text: "Circle with four dots"
        correct: true
      - text: "Circle with five dots"
        rationale: |
          This adds two to the last known count as if it were a sequence step. The last input has three. Use the sum relationship shown in both completed rows.
      - text: "Circle with three dots"
        rationale: |
          This copies the second input count. Three appears beside the blank. Combine both inputs.
      - text: "Circle with two dots"
        rationale: |
          This uses the difference $3-1$ instead of the sum. Both numbers occur in the last row. Check the completed-row operation.
    explanation: |
      The last dot count in each row equals the first two counts added together. The completed rows show $1+2=3$ and $2+2=4$. The final row therefore gives $1+3=4$ dots.
    approved: false
