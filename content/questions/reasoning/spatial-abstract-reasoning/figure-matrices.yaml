      Which figure completes the blank cell under the simplest consistent row and column rules?
    choices:
      - text: "Arrow pointing down"
        correct: true
      - text: "Arrow pointing up"
        rationale: |
          This restarts after only two states. Up appears at the top. Continue the quarter-turn from right.
      - text: "Arrow pointing left"
        rationale: |
          This reverses the right arrow to its opposite instead of taking a quarter-turn. Left opposes right. Check that the shown step is 90 degrees.
      - text: "Arrow pointing right"
        rationale: |
          This repeats the cell above the blank. Right is the middle-row direction. Continue one more turn.
    explanation: |
      Both columns follow up, right, down. Each step down a column turns the arrow 90 degrees clockwise. The blank at the bottom left therefore points down.
    approved: true
