      - text: "Circle"
        rationale: |
          This repeats a shape already in the bottom row. Circle is just beside the blank. Check the one-of-each outline rule.
      - text: "Square"
        rationale: |
          This repeats the bottom row's first outline. Each row starts differently. Check all three positions, not only the first.
      - text: "Pentagon"
        rationale: |
          This invents a new outline to avoid repetition. The blank needs an absent member. Choose from the three-outline set used in every completed row.
    explanation: |
      Each row and each column contains one circle, one triangle, and one square. The bottom row already has square and circle. Triangle completes both that row and the last column.
    approved: false
  - id: "q-spatial-abstract-reasoning-figure-matrices-0016"
    type: "figure-matrix"
    difficulty: "medium"
