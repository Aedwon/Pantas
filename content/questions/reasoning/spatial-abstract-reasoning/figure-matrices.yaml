meta:
  subject: "reasoning"
  topic: "spatial-abstract-reasoning"
  subtopic: "figure-matrices"
  exams:
    - "acet"
    - "ustet"
    - "dost-sei"
    - "cse-pro"
questions:
  - id: "q-spatial-abstract-reasoning-figure-matrices-0001"
    type: "figure-matrix"
    difficulty: "easy"
    figure: "figure-matrices-01"
    figureSpec:
      kind: "figure-matrix"
      rows: 2
      cols: 2
      cells:
        - form: "triangle"
          line: 0
        - form: "triangle"
          line: 90
        - form: "square"
          line: 180
        - "blank"
    stem: |
      Which figure completes the blank cell under the simplest consistent row and column rules?
    choices:
      - text: "Square with line pointing left"
        correct: true
      - text: "Square with line pointing down"
        rationale: |
          This retains the starting direction. A square itself looks unchanged by a quarter turn. Track the internal line that distinguishes the orientations.
      - text: "Square with line pointing right"
        rationale: |
          This copies the first row's final direction. Both rows use the same rule. Apply the turn to the second row's different starting line.
      - text: "Triangle with line pointing left"
        rationale: |
          This rotates the line correctly but copies the first row's outline. The transformation is shared. Keep the second row's square outline.
    explanation: |
      Across the first row, the internal line turns 90 degrees clockwise from up to right. In the second row, apply that same turn from down to left. The row keeps its square outline.
    approved: true
  - id: "q-spatial-abstract-reasoning-figure-matrices-0002"
    type: "figure-matrix"
    difficulty: "easy"
    figure: "figure-matrices-02"
    figureSpec:
      kind: "figure-matrix"
      rows: 3
      cols: 3
      cells:
        - form: "circle"
          dots: 1
        - form: "circle"
          dots: 2
        - form: "circle"
          dots: 3
        - form: "circle"
          dots: 2
        - form: "circle"
          dots: 3
        - form: "circle"
          dots: 4
        - form: "circle"
          dots: 3
        - form: "circle"
          dots: 4
        - "blank"
    stem: |
      Which figure completes the blank cell under the simplest consistent row and column rules?
    choices:
      - text: "Circle with five dots"
        correct: true
      - text: "Circle with four dots"
        rationale: |
          This repeats the adjacent count. Four occurs beside and above the blank. Continue the one-dot increase.
      - text: "Circle with six dots"
        rationale: |
          This skips the next count. Both directions increase. Check that the row and column rules do not each add a separate extra dot.
      - text: "Circle with three dots"
        rationale: |
          This restarts the bottom row instead of continuing it. Three begins that row. Check the progression to four and then the blank.
    explanation: |
      Dot counts increase by one across each row and down each column. The bottom row begins three, four, so the blank needs five dots. The last column also continues three, four, five.
    approved: true
  - id: "q-spatial-abstract-reasoning-figure-matrices-0003"
    type: "figure-matrix"
    difficulty: "medium"
    figure: "figure-matrices-03"
    figureSpec:
      kind: "figure-matrix"
      rows: 3
      cols: 2
      cells:
        - form: "square"
          size: "small"
        - form: "square"
          size: "small"
        - form: "square"
          size: "medium"
        - form: "square"
          size: "medium"
        - form: "square"
          size: "large"
        - "blank"
    stem: |
      Which figure completes the blank cell under the simplest consistent row and column rules?
    choices:
      - text: "Large square"
        correct: true
      - text: "Medium square"
        rationale: |
          This repeats the cell immediately above the blank. Medium is the last known size in that column. Continue the same three-size progression.
      - text: "Small square"
        rationale: |
          This restarts from the top. Small appears in the first row. Check that the blank is in the bottom row.
      - text: "Large triangle"
        rationale: |
          This follows size but changes the constant outline. A triangle also has a visible size. Check that every supplied cell is a square.
    explanation: |
      Each column follows small, medium, large from top to bottom. The blank is the bottom cell of the second column. It therefore has a large square.
    approved: true
  - id: "q-spatial-abstract-reasoning-figure-matrices-0004"
    type: "figure-matrix"
    difficulty: "medium"
    figure: "figure-matrices-04"
