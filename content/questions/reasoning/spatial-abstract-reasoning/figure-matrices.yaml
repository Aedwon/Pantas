      - text: "Medium triangle with three dots"
        rationale: |
          This gets dots but copies the row above. Medium is its size. Check the size progression down the last column.
      - text: "Small triangle with three dots"
        rationale: |
          This gets dots but copies the top row's size. The first row provides three dots too. Track the bottom row's size separately.
    explanation: |
      Within each row, dot counts increase one, two, three. Down each column, triangle size grows small, medium, large. The blank combines bottom-row large size with third-column three dots.
    approved: true
  - id: "q-spatial-abstract-reasoning-figure-matrices-0009"
