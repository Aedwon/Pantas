          This gets direction but copies the middle row's outline. The square is directly above the blank. Continue the outline change to the bottom row.
      - text: "Pentagon with line pointing upper-right"
        rationale: |
          This gets outline but repeats the adjacent line. Upper-right is beside the blank. Continue the clockwise 45-degree line step.
      - text: "Triangle with line pointing right"
        rationale: |
          This gets direction but repeats the top row's outline. The first completed row is an obvious model. Preserve the bottom row's outline.
    explanation: |
      Outline changes down the rows from triangle to square to pentagon. The internal line changes across each row from up to upper-right to right. The blank combines pentagon outline with a right-pointing line.
    approved: true
