      - text: "White star"
        rationale: |
          This repeats the second column fill. White is next to the blank. Continue the alternating row pattern.
      - text: "Half-filled star"
        rationale: |
          This averages black and white instead of alternating. Both fills appear. Check that no completed cell uses a partial fill.
      - text: "Black circle"
        rationale: |
          This follows fill but changes the constant outline. Black is the expected fill. Keep the star shape shown throughout.
    explanation: |
      Each row has fill states black, white, black. The missing cell is third in the bottom row. It therefore has black fill like the third cell in the completed row.
    approved: true
  - id: "q-spatial-abstract-reasoning-figure-matrices-0012"
