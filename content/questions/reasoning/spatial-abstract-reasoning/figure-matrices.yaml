    stem: |
      Which figure completes the blank cell under the simplest consistent row and column rules?
    choices:
      - text: "Square with only the lower-right ray"
        correct: true
      - text: "Square with all three diagonal rays"
        rationale: |
          This uses union instead of overlap. All the rays occur in the inputs. Check that the completed output kept only the common ray.
      - text: "Square with only the upper-right ray"
        rationale: |
          This chooses a ray present in only the first input. It is prominent there. Compare both inputs for a shared direction.
      - text: "Square with only the lower-left ray"
        rationale: |
          This chooses a ray present in only the second input. It is most recent. Check which direction appears in both.
    explanation: |
      In the completed row, the third cell keeps the ray shared by both preceding cells. Up is shared in the first row. In the square row, the shared ray points lower-right, so that is the blank's only ray.
    approved: true
  - id: "q-spatial-abstract-reasoning-figure-matrices-0010"
    type: "figure-matrix"
    difficulty: "medium"
    figure: "figure-matrices-10"
    figureSpec:
