meta:
  subject: reasoning
  topic: spatial-abstract-reasoning
  subtopic: more-figure-rules
  exams: [pshs-nce]
questions:
  - id: q-spatial-abstract-reasoning-more-figure-rules-0001
    lesson: lesson-spatial-abstract-reasoning-comparing-counts-in-figures
    keyPoint: 1
    type: odd-figure
    difficulty: easy
    figure: more-figure-rules-01
    figureSpec:
      kind: "figure-series"
      items:
        - form: "triangle"
          dots: 3
        - form: "square"
          dots: 4
        - form: "pentagon"
          dots: 5
        - form: "square"
          dots: 4
        - form: "triangle"
          dots: 2
      blank: false
    stem: |
      Compare sides and dots within each figure. Which figure does not have the same number of each?
    choices:
      - text: "Second figure"
        rationale: |
          This counts only the horizontal sides of the square. The top and bottom form a clear pair. Count both vertical sides too.
      - text: "Fifth figure"
        correct: true
      - text: "First figure"
        rationale: |
          This treats a triangle as having only two sloping sides. Those sides stand out. Count its bottom side too.
      - text: "Third figure"
        rationale: |
          This picks the largest dot count. Five dots stand out. Check that the pentagon also has five sides.
      - text: "Fourth figure"
        rationale: |
          This rejects the repeated square. Repetition may look like an error. Compare its four sides with its four dots.
    explanation: |
      The fifth figure has three sides and two dots. The other figures have equal side and dot counts.
  - id: q-spatial-abstract-reasoning-more-figure-rules-0002
    lesson: lesson-spatial-abstract-reasoning-comparing-counts-in-figures
    keyPoint: 2
    type: odd-figure
    difficulty: easy
    figure: more-figure-rules-02
    figureSpec:
      kind: "shape-row"
      shapes:
        - form: "triangle"
        - form: "triangle"
        - form: "triangle"
        - form: "triangle"
    stem: |
      Compare the number of shapes in the row with the number of sides on one shape. Which relationship holds?
    choices:
      - text: "Twice as many shapes as sides"
        rationale: |
          This treats pairs of triangles as a doubling rule. The row can be split into pairs. Compare four with twice three.
      - text: "Three more shapes than sides"
        rationale: |
          This uses the side count as the difference. Each triangle has three sides. Subtract three from the four shapes.
      - text: "The same number of shapes and sides"
        rationale: |
          This matches the counts without counting the full row. Triangles suggest three. Count all four separate triangles.
      - text: "One fewer shape than sides"
        rationale: |
          This reverses which count is larger. The counts differ by one. Check whether four is greater or less than three.
      - text: "One more shape than sides"
        correct: true
    explanation: |
      There are four triangles. One triangle has three sides. Since $4-3=1$, there is one more shape than sides.
  - id: q-spatial-abstract-reasoning-more-figure-rules-0003
    lesson: lesson-spatial-abstract-reasoning-transferring-rules-in-visual-analogies
    keyPoint: 2
    type: analogy
    difficulty: easy
    stem: |
      Square is to cube as circle is to which solid? Use the flat-shape to solid relationship taught in the lesson.
    choices:
      - text: "Flat ring"
        rationale: |
          This keeps a circular outline but stays flat. A ring resembles a circle. Check that the second member of each pair must be solid.
      - text: "Cone"
        rationale: |
          This chooses a solid with one circular base. That base suggests a circle. Check the named relationship from the lesson.
      - text: "Cylinder"
        rationale: |
          This chooses a solid with circular ends. Those ends look like circles. Recall the circle-to-solid pair used in the lesson.
      - text: "Sphere"
        correct: true
      - text: "Square pyramid"
        rationale: |
          This carries the first pair's square into the second pair. A pyramid is also solid. Match the circle instead.
    explanation: |
      The lesson pairs a flat square with a cube. It pairs a flat circle with a sphere, which is ball-shaped.
  - id: q-spatial-abstract-reasoning-more-figure-rules-0004
    lesson: lesson-spatial-abstract-reasoning-one-of-each-rules-in-figure-grids
    keyPoint: 1
    type: figure-matrix
    difficulty: easy
    figure: more-figure-rules-04
    figureSpec:
      kind: "figure-matrix"
      rows: 3
      cols: 3
      cells:
        - form: "pentagon"
        - form: "triangle"
        - form: "circle"
        - form: "circle"
        - "blank"
        - form: "triangle"
        - form: "triangle"
        - form: "circle"
        - form: "pentagon"
    stem: |
      Every row and column must contain one circle, one triangle, and one pentagon. Which shape fills the blank?
    choices:
      - text: "Triangle"
        rationale: |
          This copies the shape above the blank. It seems to continue the column. Check that each column needs three different shapes.
      - text: "Square"
        rationale: |
          This adds a new shape to avoid a repeat. A square is different from the neighbors. Use only the three named shapes.
      - text: "Five-point star"
        rationale: |
          This confuses five points with five sides. Both suggest five. Check the outline of the pentagons in the grid.
      - text: "Pentagon"
        correct: true
      - text: "Circle"
        rationale: |
          This repeats the shape at the left of the blank. That shape is easy to copy. Check whether the middle row already has a circle.
    explanation: |
      The middle row has a circle and a triangle. It needs a pentagon. The middle column also needs a pentagon.
  - id: q-spatial-abstract-reasoning-more-figure-rules-0005
    lesson: lesson-spatial-abstract-reasoning-comparing-counts-in-figures
    keyPoint: 2
    type: odd-figure
    difficulty: easy
    figure: more-figure-rules-05
    figureSpec:
      kind: "shape-row"
      shapes:
        - form: "pentagon"
        - form: "pentagon"
        - form: "pentagon"
        - form: "pentagon"
    stem: |
      Compare the number of shapes shown with the number of sides on one shape. Which statement is true?
    choices:
      - text: "Four times as many shapes as sides"
        rationale: |
          This uses all twenty sides as the shape count. There are five sides on each shape. Count whole shapes separately.
      - text: "One fewer shape than sides"
        correct: true
      - text: "Two fewer shapes than sides"
        rationale: |
          This counts a pentagon as having six sides. Its sloping edges can be miscounted. Trace one outline once.
      - text: "One more shape than sides"
        rationale: |
          This reverses the comparison. The counts differ by one. Check whether four is smaller or larger than five.
      - text: "Equal numbers of shapes and sides"
        rationale: |
          This skips one edge while tracing the pentagon. That makes four sides seem to match the four shapes. Count all five edges.
    explanation: |
      The row has four pentagons. Each pentagon has five sides. Since $5-4=1$, there is one fewer shape than sides.
  - id: q-spatial-abstract-reasoning-more-figure-rules-0006
    lesson: lesson-spatial-abstract-reasoning-comparing-counts-in-figures
    keyPoint: 1
    type: odd-figure
    difficulty: medium
    figure: more-figure-rules-06
    figureSpec:
      kind: "shape-row"
      shapes:
        - form: "square"
          dots: 3
        - form: "pentagon"
          dots: 4
        - form: "triangle"
          dots: 2
        - form: "hexagon"
          dots: 4
        - form: "rectangle"
          dots: 3
    stem: |
      Four figures have one fewer dot than sides. Count from left to right. Which figure breaks that rule?
    choices:
      - text: "Second figure"
        rationale: |
          This selects the largest matching dot count. Four dots stand out. Subtract four dots from five sides.
      - text: "Third figure"
        rationale: |
          This rejects the smallest count. Two dots seem unlike the other figures. Compare them with the triangle's three sides.
      - text: "Fifth figure"
        rationale: |
          This uses side lengths instead of the number of sides. The rectangle has unequal lengths. Count its four sides.
      - text: "Fourth figure"
        correct: true
      - text: "First figure"
        rationale: |
          This expects dots to equal sides. Three dots look too few for a square. Check the stated difference of one.
    explanation: |
      The fourth figure has six sides and four dots. Its difference is two. Each other figure has one fewer dot than sides.
  - id: q-spatial-abstract-reasoning-more-figure-rules-0007
    lesson: lesson-spatial-abstract-reasoning-comparing-counts-in-figures
    keyPoint: 1
    type: odd-figure
    difficulty: medium
    figure: more-figure-rules-07
    figureSpec:
      kind: "shape-row"
      shapes:
        - form: "triangle"
          dots: 3
        - form: "square"
          dots: 4
        - form: "hexagon"
          dots: 4
        - form: "rectangle"
          dots: 4
        - form: "rhombus"
          dots: 4
    stem: |
      The rule requires equal side and dot counts. How many dots must be added to the hexagon to make every figure fit?
    choices:
      - text: "Four dots"
        rationale: |
          This copies the existing dot count as the amount to add. Four dots are visible. Find the difference between six and four.
      - text: "One dot"
        rationale: |
          This applies a one-fewer-dot rule. Adding one brings the count to five. Check the required equality with six sides.
      - text: "Two dots"
        correct: true
      - text: "Three dots"
        rationale: |
          This counts a side twice while tracing the hexagon. Seven can result from repeating the first side. Count each edge once.
      - text: "Six dots"
        rationale: |
          This gives the final dot count as the amount to add. A hexagon needs six dots in total. Subtract the four already present.
    explanation: |
      A hexagon has six sides and currently has four dots. Adding $6-4=2$ dots gives equal counts.
  - id: q-spatial-abstract-reasoning-more-figure-rules-0008
    lesson: lesson-spatial-abstract-reasoning-comparing-counts-in-figures
    keyPoint: 2
    type: odd-figure
    difficulty: medium
    figure: more-figure-rules-08
    figureSpec:
      kind: "shape-row"
      shapes:
        - form: "hexagon"
        - form: "hexagon"
        - form: "hexagon"
        - form: "hexagon"
        - form: "hexagon"
    stem: |
      The row must have one more shape than the number of sides on one shape. How many more copies of the shown shape are needed?
    choices:
      - text: "Six copies"
        rationale: |
          This gives the side count as the number to add. A hexagon has six sides. Account for the five copies already shown.
      - text: "Seven copies"
        rationale: |
          This gives the final number of shapes as the number to add. Seven is the target total. Subtract the five existing shapes.
      - text: "Two copies"
        correct: true
      - text: "Three copies"
        rationale: |
          This adds one twice after reaching equal counts. The extra-one rule can be counted twice. Compute seven minus the five shown.
      - text: "One copy"
        rationale: |
          This makes the shape count equal the side count. Six seems like the target. Check that the rule asks for one more than six.
    explanation: |
      A hexagon has six sides. The rule needs $6+1=7$ copies. Five are shown, so add $7-5=2$ copies.
  - id: q-spatial-abstract-reasoning-more-figure-rules-0009
    lesson: lesson-spatial-abstract-reasoning-transferring-rules-in-visual-analogies
    keyPoint: 2
    type: analogy
    difficulty: medium
    stem: |
      Sphere is to circle as cube is to ___.
    choices:
      - text: "Sphere"
        rationale: |
          This repeats the first solid. Both a sphere and a cube have depth. Check that each second member must be flat.
      - text: "Triangle"
        rationale: |
          This uses another flat polygon. A triangle can form a face of some solids. Recall which flat shape the lesson pairs with a cube.
      - text: "Square"
        correct: true
      - text: "Square pyramid"
        rationale: |
          This keeps the square association but selects another solid. The name includes square. Check whether the answer must be flat.
      - text: "Circular ring"
        rationale: |
          This carries over the first pair's circle and adds an opening. The round outline seems familiar. Match the cube to its own flat partner.
    explanation: |
      Reversing circle-to-sphere gives sphere-to-circle. Reversing square-to-cube gives cube-to-square.
  - id: q-spatial-abstract-reasoning-more-figure-rules-0010
    lesson: lesson-spatial-abstract-reasoning-one-of-each-rules-in-figure-grids
    keyPoint: 2
    type: figure-matrix
    difficulty: medium
    figure: more-figure-rules-10
    figureSpec:
      kind: "figure-matrix"
      rows: 3
      cols: 3
      cells:
        - form: "triangle"
          dots: 1
        - form: "square"
          dots: 2
        - form: "circle"
          dots: 3
        - form: "circle"
          dots: 2
        - form: "triangle"
          dots: 3
        - form: "square"
          dots: 1
        - form: "square"
          dots: 3
        - form: "circle"
          dots: 1
        - "blank"
    stem: |
      Each row and column uses triangle, square, and circle once. It also uses one, two, and three dots once. What fills the blank?
    choices:
      - text: "Triangle with three dots"
        rationale: |
          This copies the center triangle and its three dots. Its shape fits the blank. Check the bottom row's missing dot count.
      - text: "Triangle with one dot"
        rationale: |
          This copies the top-left triangle as a complete figure. Its outline is right. Check whether one dot already occurs in the blank's row.
      - text: "Triangle with two dots"
        correct: true
      - text: "Square with two dots"
        rationale: |
          This solves dots but repeats the bottom row's first outline. That square has three dots. Check shapes independently of counts.
      - text: "Circle with two dots"
        rationale: |
          This solves dots but copies the outline beside the blank. A circle is nearby. Check which outline is absent from the bottom row.
    explanation: |
      The bottom row needs a triangle and two dots. The last column also needs a triangle and two dots. The two rules agree.
  - id: q-spatial-abstract-reasoning-more-figure-rules-0011
    lesson: lesson-spatial-abstract-reasoning-one-of-each-rules-in-figure-grids
    keyPoint: 2
    type: figure-matrix
    difficulty: medium
    figure: more-figure-rules-11
    figureSpec:
      kind: "figure-matrix"
      rows: 3
      cols: 3
      cells:
        - form: "circle"
          size: "small"
        - form: "square"
          size: "medium"
        - form: "triangle"
          size: "large"
        - form: "triangle"
          size: "medium"
        - form: "circle"
          size: "large"
        - form: "square"
          size: "small"
        - form: "square"
          size: "large"
        - "blank"
        - form: "circle"
          size: "medium"
    stem: |
      Each row and column contains each shape once and each size once. The shapes are circle, square, and triangle. The sizes are small, medium, and large. Which figure fills the blank?
    choices:
      - text: "Small square"
        rationale: |
          This solves size but repeats the bottom row's square. Small can be paired with any outline. Check the missing shape separately.
      - text: "Medium triangle"
        rationale: |
          This solves the outline but copies the size to the right. Medium is already present. Check the three-size rule.
      - text: "Large triangle"
        rationale: |
          This solves the outline but copies the size to the left. Large is already in the bottom row. Check the missing size in that row.
      - text: "Small triangle"
        correct: true
      - text: "Small circle"
        rationale: |
          This solves size but repeats the circle at the right. That circle attracts attention near the blank. Check the bottom row's full shape set.
    explanation: |
      The bottom row already has a square and a circle. It needs a triangle. Its large and medium figures leave small as the missing size.
  - id: q-spatial-abstract-reasoning-more-figure-rules-0012
    lesson: lesson-spatial-abstract-reasoning-one-of-each-rules-in-figure-grids
    keyPoint: 2
    type: figure-matrix
    difficulty: medium
    figure: more-figure-rules-12
    figureSpec:
      kind: "figure-matrix"
      rows: 3
      cols: 3
      cells:
        - form: "circle"
          dots: 1
          size: "large"
        - form: "circle"
          dots: 2
          size: "small"
        - form: "circle"
          dots: 3
          size: "medium"
        - form: "circle"
          dots: 3
          size: "small"
        - form: "circle"
          dots: 1
          size: "medium"
        - "blank"
        - form: "circle"
          dots: 2
          size: "medium"
        - form: "circle"
          dots: 3
          size: "large"
        - form: "circle"
          dots: 1
          size: "small"
    stem: |
      Each row and column uses one, two, and three dots once. Each also uses small, medium, and large once. Which circle completes the grid?
    choices:
      - text: "Large circle with two dots"
        correct: true
      - text: "Large circle with three dots"
        rationale: |
          This finds size but copies the count directly above. Three appears in the same column. Check its missing count.
      - text: "Large circle with one dot"
        rationale: |
          This finds size but copies the middle cell's dot count. One is nearby. Check whether the middle row already contains one dot.
      - text: "Medium circle with two dots"
        rationale: |
          This finds the missing count but copies the neighboring size. Medium is closest to the blank. Check that each size occurs only once.
      - text: "Small circle with two dots"
        rationale: |
          This finds the missing count but repeats the size at the left end of the middle row. Small is visible there. Check the row's absent size.
    explanation: |
      The middle row has three dots and one dot, so it needs two dots. Its small and medium circles leave large. The last column confirms both features.
  - id: q-spatial-abstract-reasoning-more-figure-rules-0013
    lesson: lesson-spatial-abstract-reasoning-one-of-each-rules-in-figure-grids
    keyPoint: 2
    type: figure-matrix
    difficulty: hard
    figure: more-figure-rules-13
    figureSpec:
      kind: "figure-matrix"
      rows: 3
      cols: 3
      cells:
        - form: "triangle"
          fill: "white"
        - form: "circle"
          fill: 0.5
        - form: "square"
          fill: "black"
        - form: "square"
          fill: 0.5
        - "blank"
        - form: "circle"
          fill: "white"
        - form: "circle"
          fill: "black"
        - form: "square"
          fill: "white"
        - form: "triangle"
          fill: 0.5
    stem: |
      Each row and column must use every shape once and every fill once. The shapes are triangle, circle, and square. The fills are white, bottom half black, and all black. What fills the blank?
    choices:
      - text: "White triangle"
        rationale: |
          This solves shape but copies the first triangle's fill. That triangle is an obvious model. Check the middle row's missing fill.
      - text: "Black square"
        rationale: |
          This solves fill but repeats the square to the left. Its fill changes, so it looks new. Check shapes without their fills.
      - text: "Bottom-half-black triangle"
        rationale: |
          This solves shape but copies the last triangle's fill. The outline matches. Check whether half black is already in the middle row.
      - text: "Black circle"
        rationale: |
          This solves fill but repeats the circle to the right. Black is the absent fill. Find the absent shape separately.
      - text: "Black triangle"
        correct: true
    explanation: |
      The middle row needs a triangle. It has half-black and white figures, so its missing fill is all black. The middle column gives the same result.
  - id: q-spatial-abstract-reasoning-more-figure-rules-0014
    lesson: lesson-spatial-abstract-reasoning-one-of-each-rules-in-figure-grids
    keyPoint: 2
    type: figure-matrix
    difficulty: hard
    figure: more-figure-rules-14
    figureSpec:
      kind: "figure-matrix"
      rows: 3
      cols: 3
      cells:
        - form: "circle"
          line: 0
        - form: "square"
          line: 90
        - "blank"
        - form: "triangle"
          line: 90
        - form: "circle"
          line: 180
        - form: "square"
          line: 0
        - form: "square"
          line: 180
        - form: "triangle"
          line: 0
        - form: "circle"
          line: 90
    stem: |
      Every row and column must contain circle, square, and triangle once each. The internal rays must point up, right, and down once each too. Which figure fills the blank?
    choices:
      - text: "Circle with ray down"
        rationale: |
          This gets the ray but repeats the first outline. The circle differs in direction, so it seems new. Count outlines without their rays.
      - text: "Triangle with ray up"
        rationale: |
          This gets the shape but copies the first ray in the row. Up is easy to identify. Check which direction the top row lacks.
      - text: "Square with ray down"
        rationale: |
          This gets the ray but repeats the neighboring outline. Down is the missing direction. Check the missing shape independently.
      - text: "Triangle with ray right"
        rationale: |
          This gets the shape but repeats the adjacent ray. Right appears beside the blank. Check that each direction is used only once.
      - text: "Triangle with ray down"
        correct: true
    explanation: |
      The top row needs a triangle and a downward ray. The last column already has square and circle, with up and right rays. It confirms the same answer.
  - id: q-spatial-abstract-reasoning-more-figure-rules-0015
    lesson: lesson-spatial-abstract-reasoning-one-of-each-rules-in-figure-grids
    keyPoint: 2
    type: figure-matrix
    difficulty: hard
    figure: more-figure-rules-15
    figureSpec:
      kind: "figure-matrix"
      rows: 3
      cols: 3
      cells:
        - form: "square"
          size: "small"
        - form: "triangle"
          size: "medium"
        - form: "pentagon"
          size: "large"
        - "blank"
        - form: "pentagon"
          size: "small"
        - form: "square"
          size: "medium"
        - form: "pentagon"
          size: "medium"
        - form: "square"
          size: "large"
        - form: "triangle"
          size: "small"
    stem: |
      Every row and column uses each shape once and each size once. Shapes are square, triangle, and pentagon. Sizes are small, medium, and large. Which proposed figure gets the missing shape right but the size wrong?
    choices:
      - text: "Medium pentagon"
        rationale: |
          This accepts a different size as the only error. A pentagon is already in the middle row. Check both features of the proposed answer.
      - text: "Small triangle"
        correct: true
      - text: "Small square"
        rationale: |
          This focuses on the wrong size but also repeats a shape. The middle row already has a small pentagon. Check the middle row's absent outline.
      - text: "Large triangle"
        rationale: |
          This answers what would correctly fill the blank. Both features fit. Check that the question asks for a wrong size.
      - text: "Large square"
        rationale: |
          This identifies only one wrong feature but reverses which one. Large is the required size. Check whether the proposed outline is the missing triangle.
    explanation: |
      The middle row needs a triangle. Its small and medium shapes leave large as the required size. A small triangle has the needed outline and the wrong size.
  - id: q-spatial-abstract-reasoning-more-figure-rules-0016
    lesson: lesson-spatial-abstract-reasoning-comparing-counts-in-figures
    keyPoint: 1
    type: odd-figure
    difficulty: hard
    figure: more-figure-rules-16
    figureSpec:
      kind: "figure-series"
      items:
        - form: "triangle"
          dots: 1
        - form: "square"
          dots: 3
        - form: "pentagon"
          dots: 4
        - form: "square"
          dots: 2
        - form: "triangle"
          dots: 2
      blank: false
    stem: |
      Every figure must have one fewer dot than sides. Add dots only, keeping all outlines. How many dots in total must be added to fix the row?
    choices:
      - text: "Two dots"
        correct: true
      - text: "One dot"
        rationale: |
          This fixes only one faulty figure. The first triangle is short by one. Check the fourth figure as well.
      - text: "Four dots"
        rationale: |
          This makes both faulty figures have as many dots as sides. Equality is familiar. Check that the rule requires one fewer dot.
      - text: "Five dots"
        rationale: |
          This adds the target counts of the faulty figures. Two and three are their final counts. Subtract the dots already present.
      - text: "Three dots"
        rationale: |
          This adds two dots to the first triangle to make its counts equal, then adds one dot to the square. Equal counts may seem right. Check that the triangle needs one fewer dot than sides.
    explanation: |
      The first triangle needs two dots, so add one. The fourth figure is a square and needs three dots, so add one there too. The total is $1+1=2$ dots.
  - id: q-spatial-abstract-reasoning-more-figure-rules-0017
    lesson: lesson-spatial-abstract-reasoning-one-of-each-rules-in-figure-grids
    keyPoint: 2
    type: figure-matrix
    difficulty: hard
    figure: more-figure-rules-17
    figureSpec:
      kind: "figure-matrix"
      rows: 3
      cols: 3
      cells:
        - form: "circle"
          dots: 3
        - "blank"
        - form: "square"
          dots: 2
        - form: "square"
          dots: 1
        - form: "circle"
          dots: 2
        - form: "triangle"
          dots: 3
        - form: "triangle"
          dots: 2
        - form: "square"
          dots: 3
        - form: "circle"
          dots: 1
    stem: |
      Each row and column contains circle, triangle, and square once. Dot counts one, two, and three also appear once in every row and column. Which figure belongs in the blank?
    choices:
      - text: "Triangle with two dots"
        rationale: |
          This follows shape but copies the count below. Two belongs to the center circle. Check the top row's missing count.
      - text: "Circle with one dot"
        rationale: |
          This follows count but repeats the first shape in the row. One dot differs from that circle's count. Check outlines alone.
      - text: "Square with one dot"
        rationale: |
          This follows count but repeats the last shape in the row. The changed count may hide the repeated shape. Check each feature separately.
      - text: "Triangle with three dots"
        rationale: |
