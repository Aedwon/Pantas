questions:
  - id: q-spatial-abstract-reasoning-paper-folding-and-cutting-0001
    type: paper-folding
    difficulty: easy
    figure: paper-folding-and-cutting-01
    stem: |
      A square paper is folded exactly in half (vertically, left side onto right side). A small triangular notch is cut out of the folded paper, entirely within one layer (not on the fold line itself). How many notches appear when the paper is fully unfolded?
    choices:
      - text: "2 notches"
        correct: true
      - text: "1 notch"
      - text: "4 notches"
      - text: "3 notches"
    explanation: |
      One fold means the cut passes through 2 layers, so unfolding reveals $2^1 = 2$ notches.
    approved: true

  - id: q-spatial-abstract-reasoning-paper-folding-and-cutting-0002
    type: paper-folding
    difficulty: easy
    figure: paper-folding-and-cutting-02
    stem: |
      A square paper is folded in half vertically, then folded in half again horizontally (into a quarter-square). A small circular hole is cut through all the folded layers at once. How many holes appear when fully unfolded?
    choices:
      - text: "4 holes"
        correct: true
      - text: "2 holes"
      - text: "8 holes"
      - text: "1 hole"
    explanation: |
      Two folds mean the cut passes through $2^2 = 4$ layers, so unfolding reveals 4 holes.
    approved: true

  - id: q-spatial-abstract-reasoning-paper-folding-and-cutting-0003
    type: paper-folding
    difficulty: medium
    figure: paper-folding-and-cutting-03
    stem: |
      A rectangular paper is folded in half three separate times (each fold halving it again). A cut is made through all the layers at once. How many holes appear when fully unfolded?
    choices:
      - text: "8 holes"
        correct: true
      - text: "6 holes"
      - text: "3 holes"
      - text: "16 holes"
    explanation: |
      Three folds mean $2^3 = 8$ layers are cut through simultaneously, so unfolding reveals 8 separate holes.
    approved: true

  - id: q-spatial-abstract-reasoning-paper-folding-and-cutting-0004
    type: paper-folding
    difficulty: medium
    figure: paper-folding-and-cutting-04
    stem: |
      A square paper is folded in half vertically, then folded in half again horizontally (into a quarter-square). A small circular hole is cut near the corner where all the folded edges meet (the center of the original square). Where will the resulting holes appear when unfolded?
    choices:
      - text: Four small holes, one in each quadrant, all positioned near the center of the original square
        correct: true
      - text: Four small holes, one in each quadrant, all positioned near the four outer corners of the original square
      - text: One single hole at the exact center, with no other holes elsewhere
      - text: Four holes scattered randomly with no symmetric relationship to each other
    explanation: |
      Since the cut is positioned at the center corner (where all folds meet), each of the 4 layers corresponds to one of the 4 quadrants, and unfolding reveals 4 small holes, each mirrored close to the center point in its own quadrant.
    approved: true

  - id: q-spatial-abstract-reasoning-paper-folding-and-cutting-0005
    type: paper-folding
    difficulty: medium
    figure: paper-folding-and-cutting-05
    stem: |
      Using the same two-fold setup as before (folded into a quarter-square), a notch is cut this time along the outer edge of the folded paper, far from the center corner where the folds meet. Where will the resulting holes appear when unfolded?
    choices:
      - text: Four notches, one along each outer edge/corner region of the original square, symmetric about both fold lines
        correct: true
      - text: Four notches, all clustered near the exact center of the original square
      - text: A single connected notch spanning the entire outer edge of the square
      - text: Two notches only, since the cut is far from one of the fold lines
    explanation: |
      Since the cut is on the outer edge (far from the fold-meeting corner), reflecting it across both fold lines places the four resulting holes near the four outer edges of the original square, not near the center.
    approved: true

  - id: q-spatial-abstract-reasoning-paper-folding-and-cutting-0006
    type: paper-folding
    difficulty: medium
    figure: paper-folding-and-cutting-06
    stem: |
      A square paper is folded exactly in half (vertically, left side onto right side). A triangular notch is cut exactly on the folded edge (the fold line itself), at the vertical midpoint. What does the unfolded paper look like?
    choices:
      - text: A single diamond-shaped hole straddling the center fold line, not two fully separate notches
        correct: true
      - text: Two completely separate triangular notches, one on each side of the fold line
      - text: No hole at all, since cutting on the fold line does not go through any paper
      - text: Four separate notches, since cutting on a fold line doubles the usual count
    explanation: |
      A cut positioned exactly on a fold line typically becomes a single connected shape straddling that line once unfolded, rather than the usual number of fully separate holes.
    approved: true

  - id: q-spatial-abstract-reasoning-paper-folding-and-cutting-0007
    type: paper-folding
    difficulty: hard
    figure: paper-folding-and-cutting-07
    stem: |
      A student folds a paper 3 separate times and predicts the cut will produce only 3 holes when unfolded, reasoning "one fold, one hole." Is this reasoning correct?
    choices:
      - text: No — each additional fold doubles the number of layers a single cut passes through, so 3 folds produce $2^3=8$ holes, not simply 3.
        correct: true
      - text: Yes — the number of holes always equals the number of folds.
      - text: Yes — but only because paper cannot be folded more than 3 times.
      - text: No — but only because 3 folds actually produce fewer holes than 3.
    explanation: |
      Assuming folds produce holes on a simple one-to-one basis is a common miscounting error. The total hole count follows $2^{\text{folds}}$ (doubling with each fold), not a simple "one hole per fold" count.
    approved: true

  - id: q-spatial-abstract-reasoning-paper-folding-and-cutting-0008
    type: paper-folding
    difficulty: hard
    figure: paper-folding-and-cutting-08
    stem: |
      A paper is folded in half twice (into a quarter-square), giving 4 layers. A cut is made that crosses one of the fold lines directly, rather than sitting entirely within one layer's interior. A student predicts this will still produce exactly 4 fully separate holes when unfolded, using the standard $2^{\text{folds}}$ formula. Is this prediction correct?
    choices:
      - text: No — a cut that crosses a fold line directly gets reflected across that fold line, merging what would otherwise be separate holes into fewer, larger connected shapes, rather than 4 fully separate holes.
        correct: true
      - text: Yes — the $2^{\text{folds}}$ formula always applies regardless of where the cut is positioned relative to the fold lines.
      - text: Yes — cuts crossing fold lines always produce more holes than the formula predicts, not fewer.
      - text: No — but only because cuts can never cross a fold line.
    explanation: |
      If the cut crosses a fold line directly (rather than sitting entirely within one folded layer's interior), unfolding may connect what would otherwise be separate holes into one continuous connected shape, changing the expected count.
    approved: true

  - id: q-spatial-abstract-reasoning-paper-folding-and-cutting-0009
    type: paper-folding
    difficulty: hard
    figure: paper-folding-and-cutting-09
    stem: |
      A paper is folded twice: first vertically (fold A), then horizontally (fold B). While working backwards to predict hole positions, a student undoes fold A first, then fold B, reflecting the cut across fold A's line first. Is this the correct order to undo the folds?
    choices:
      - text: No — folds must be undone in reverse order, meaning the most recently made fold (fold B, made second) should be reflected first, then fold A; undoing them out of order can place the resulting holes in the wrong locations even if the count is correct.
        correct: true
      - text: Yes — folds can be undone in any order, since the final hole positions do not depend on the order of unfolding.
      - text: Yes — folds should always be undone in the same order they were originally made, not reversed.
      - text: No — but only because only one fold can ever be undone at a time regardless of order.
    explanation: |
      Each "undo fold" step must reflect the cut's position across the correct fold line for that specific step, working from the last fold made back to the first. Undoing folds out of order can produce holes in the wrong location even if the total count is correct.
    approved: true

  - id: q-spatial-abstract-reasoning-paper-folding-and-cutting-0010
    type: paper-folding
    difficulty: medium
    figure: paper-folding-and-cutting-10
    stem: |
      A square paper is folded in half four separate times (each fold halving it again). A cut is made through all the layers at once, entirely within one layer's interior. How many holes appear when fully unfolded?
    choices:
      - text: "16 holes"
        correct: true
      - text: "8 holes"
      - text: "4 holes"
      - text: "12 holes"
    explanation: |
      Four folds mean $2^4 = 16$ layers are cut through simultaneously, so unfolding reveals 16 separate holes.
    approved: true

  - id: q-spatial-abstract-reasoning-paper-folding-and-cutting-0011
    type: paper-folding
    difficulty: medium
    figure: paper-folding-and-cutting-11
    stem: |
      A square paper is folded in half once (vertically). A small notch is cut entirely within the interior of the folded layer, away from the fold line and away from the paper's outer edges. How many separate notches appear when unfolded, and are they connected or fully separate?
    choices:
      - text: "2 fully separate notches, one mirrored on each side of the fold line"
        correct: true
      - text: 1 connected notch straddling the fold line
      - text: "4 fully separate notches"
      - text: No notches, since the cut is not on the fold line or an outer edge
    explanation: |
      A cut positioned away from all fold lines becomes multiple separate holes, one per layer. With one fold (2 layers), unfolding reveals 2 fully separate notches, mirrored across the fold line.
    approved: true

  - id: q-spatial-abstract-reasoning-paper-folding-and-cutting-0012
    type: paper-folding
    difficulty: hard
    figure: paper-folding-and-cutting-12
    stem: |
      A square paper is folded in half vertically, then folded in half again horizontally (into a quarter-square). A notch is cut near one specific corner of the folded quarter-square — not the corner where both folds meet, and not along an outer edge, but the corner diagonally opposite the all-folds corner. Predict how many notches appear when unfolded, and their general position.
    choices:
      - text: "4 notches, one in each quadrant, each mirrored to the position diagonally opposite the center within its own quadrant"
        correct: true
      - text: "4 notches, all clustered at the exact center of the original square"
      - text: "2 notches only, since this corner is not the all-folds corner"
      - text: "1 notch, since cuts away from the all-folds corner do not get mirrored"
    explanation: |
      Regardless of which specific point on the folded shape is cut, two folds always produce $2^2 = 4$ holes when the cut is away from any fold line. Each hole is mirrored into its own quadrant at the position corresponding to where the cut was made on the folded shape.
    approved: true

  - id: q-spatial-abstract-reasoning-paper-folding-and-cutting-0013
    type: paper-folding
    difficulty: hard
    figure: paper-folding-and-cutting-13
    stem: |
      Two square papers are each folded twice into a quarter-square (4 layers). On paper 1, a notch is cut near the all-folds center corner. On paper 2, an identical-sized notch is cut near the outer edge, far from the center. Both papers are then unfolded. Do the two papers end up with the same hole count, the same hole positions, or neither?
    choices:
      - text: Both papers end up with the same hole count (4 holes each, since both used 2 folds), but different hole positions — paper 1's holes cluster near the center, while paper 2's holes appear near the outer edges.
        correct: true
      - text: Both papers end up with the same hole count and the same hole positions, since both used the same number of folds and the same notch size.
      - text: The two papers end up with different hole counts, since cut position affects the total number of holes.
      - text: Neither paper produces any holes, since folding twice cancels out any cut made afterward.
    explanation: |
      The number of folds determines the hole count ($2^{\text{folds}}$), independent of where exactly the cut is placed (as long as it's away from any fold line). But the specific position of the cut on the folded shape determines where each of those holes ends up once unfolded — so the count matches, but the positions differ.
    approved: true

  - id: q-spatial-abstract-reasoning-paper-folding-and-cutting-0014
    type: paper-folding
    difficulty: exam
    figure: paper-folding-and-cutting-14
    stem: |
      A rectangular paper is folded in half vertically (fold A), then folded in half again horizontally (fold B), then folded in half a third time along a diagonal (fold C). A small triangular notch is cut through all the layers at once, entirely within one layer's interior, away from any fold line. Determine: (a) how many notches appear when fully unfolded, and (b) in what order the folds should be undone to correctly trace each notch's final position.
    choices:
      - text: "(a) $2^3 = 8$ notches; (b) undo fold C first (the most recently made fold), then fold B, then fold A last, reflecting the cut's position at each step in that reverse order."
        correct: true
      - text: "(a) 3 notches, one per fold; (b) undo the folds in the same order they were made: A, then B, then C."
      - text: "(a) 6 notches; (b) the order of undoing folds does not matter for the final positions."
      - text: "(a) 8 notches; (b) undo fold A first, then B, then C, following the original folding order."
    explanation: |
      Three folds mean $2^3=8$ layers are cut through, producing 8 notches. To correctly trace each notch's position, folds must be undone in reverse order — the most recently made fold (C) first, then B, then A — reflecting the cut's position across the correct fold line at each step.
    approved: true
