questions:
  - id: "q-spatial-abstract-reasoning-paper-folding-and-cutting-0001"
    type: "paper-folding"
    difficulty: "easy"
    figure: "paper-folding-and-cutting-01"
    figureSpec:
      kind: "paper-fold"
      folds:
        - "vertical"
      cut: "hole"
      at: "interior"
      sheet: "square"
      showUnfolded: false
    stem: |
      The square is folded once as shown. A shallow circular cut removes paper from only the top layer, leaving the lower layer intact. The cut is away from the crease and outer edges. How many holes appear when opened?
    choices:
      - text: "One hole"
        correct: true
      - text: "Two holes"
        rationale: |
          This assumes the cut passed through both folded layers. A half-fold does give two layers. Count only layers actually cut.
      - text: "Four holes"
        rationale: |
          This doubles twice for a single fold. Reflection doubles copies only when both layers are cut. Check fold count and cut depth separately.
      - text: "No holes"
        rationale: |
          This assumes a partial-depth cut cannot remove one complete layer. The lower layer stays intact. Check that the top layer is cut all the way through.
    explanation: |
      Only one paper layer is cut. Opening the fold changes that layer's position but cannot make a hole in the uncut layer. The sheet therefore has one hole.
    approved: true
  - id: "q-spatial-abstract-reasoning-paper-folding-and-cutting-0002"
    type: "paper-folding"
    difficulty: "easy"
    figure: "paper-folding-and-cutting-02"
    figureSpec:
      kind: "paper-fold"
      folds:
        - "vertical"
        - "horizontal"
      cut: "hole"
      at: "interior"
      sheet: "square"
      showUnfolded: false
    stem: |
      The square is folded along the shown vertical and horizontal creases. A small circular punch goes through all four layers away from both creases and outer edges. How many separate holes appear on fully opening it?
    choices:
      - text: "Four holes"
        correct: true
      - text: "Two holes"
        rationale: |
          This reverses only one fold. The last opening step doubles the cut. Reverse the remaining fold too.
      - text: "Eight holes"
        rationale: |
          This counts an extra doubling. Two creases are shown. Count the four layers cut, not an imagined third fold.
      - text: "One hole"
        rationale: |
          This assumes the copies merge at a crease. The punch is an interior cut. Check the condition that it touches no crease.
    explanation: |
      Undoing the last fold gives two separate copies. Undoing the first fold reflects both again, giving four. They remain separate because the punch does not touch either crease.
    approved: true
  - id: "q-spatial-abstract-reasoning-paper-folding-and-cutting-0003"
    type: "paper-folding"
    difficulty: "medium"
    figure: "paper-folding-and-cutting-03"
    figureSpec:
      kind: "paper-fold"
      folds:
        - "vertical"
        - "horizontal"
        - "vertical"
      cut: "hole"
      at: "interior"
      sheet: "rectangle"
      showUnfolded: false
    stem: |
      The rectangle undergoes the three complete half-folds shown. A small interior punch crosses all eight layers without touching any crease. How many separate holes appear on fully opening it?
    choices:
      - text: "Eight holes"
        correct: true
      - text: "Six holes"
        rationale: |
          This multiplies three folds by two. Each fold doubles the current layers. Repeat multiplication by two at every step.
      - text: "Three holes"
        rationale: |
          This assigns one hole to each fold. There are three folding steps. Count the layers pierced by the single punch.
      - text: "Sixteen holes"
        rationale: |
          This uses four doublings instead of three. Sixteen is another power of two. Count the shown half-folds.
    explanation: |
      Each complete half-fold doubles the layers at this punch. Three doublings give $2 \times 2 \times 2=8$. With no crease touching the punch, the eight reflected copies remain separate.
    approved: true
  - id: "q-spatial-abstract-reasoning-paper-folding-and-cutting-0004"
    type: "paper-folding"
    difficulty: "medium"
    figure: "paper-folding-and-cutting-04"
    figureSpec:
      kind: "paper-fold"
      folds:
        - "vertical"
        - "horizontal"
      cut: "hole"
      at: "corner"
      sheet: "square"
      showUnfolded: false
    stem: |
      In the shown two-fold square, the small punch is near the folded corner made by both creases, but touches neither crease. It pierces every layer. Where do its separate copies lie on opening?
    choices:
      - text: "Near the center, in all four quadrants"
        correct: true
      - text: "Near the four original outer corners"
        rationale: |
          This confuses the crease corner with an outer corner. Both are packet corners. Trace the corner back to the original sheet.
      - text: "One connected opening at the exact center"
        rationale: |
          This treats a nearby punch as a crease-touching one. The punch is close to the creases. Check that it touches neither.
      - text: "Four copies only in the right half"
        rationale: |
          This reverses the horizontal fold but leaves the vertical fold unopened. The packet is on the right. Reflect across both creases.
    explanation: |
      The folded corner corresponds to the original sheet center. Reflecting a nearby interior punch across both creases places a copy on each side of each center line. The four copies remain near the center.
    approved: true
  - id: "q-spatial-abstract-reasoning-paper-folding-and-cutting-0005"
    type: "paper-folding"
    difficulty: "medium"
    figure: "paper-folding-and-cutting-05"
    figureSpec:
      kind: "paper-fold"
      folds:
        - "vertical"
        - "horizontal"
      cut: "hole"
      at: "edge"
      sheet: "square"
      showUnfolded: false
    stem: |
      The two-fold square is punched as shown, near its right outer edge but not touching that edge or either crease. The punch passes through all layers. Which arrangement appears on opening?
    choices:
      - text: "Two holes near each side edge"
        correct: true
      - text: "One hole near each of the four corners"
        rationale: |
          This sends side-edge copies to corner regions. Both are near the boundary. Reflect the actual midpoint-height punch position.
      - text: "Four holes clustered at the center"
        rationale: |
          This uses the creases as the punch location. The folds meet at the center. Check the displayed cut near the outer edge.
      - text: "Two holes only near the right edge"
        rationale: |
          This opens only the horizontal fold. That creates two right-side copies. Undo the vertical fold as well.
    explanation: |
      The horizontal reflection produces an upper and lower copy near the right edge. The vertical reflection produces their counterparts near the left edge. Thus there are two holes near each side edge.
    approved: true
  - id: "q-spatial-abstract-reasoning-paper-folding-and-cutting-0006"
    type: "paper-folding"
    difficulty: "medium"
    figure: "paper-folding-and-cutting-06"
    figureSpec:
      kind: "paper-fold"
      folds:
        - "vertical"
      cut: "notch"
      at: "on-fold"
      sheet: "square"
      showUnfolded: false
    stem: |
      The shown square is folded vertically. The marked triangular notch has its base along the folded edge at its midpoint and passes through both layers. On opening, how are the removed regions connected?
    choices:
      - text: "One symmetric connected opening"
        correct: true
      - text: "Two separate triangular openings"
        rationale: |
          This treats a crease cut like an interior punch. Two layers are cut. Check whether the reflected halves touch.
      - text: "No opening because the cut touches a crease"
        rationale: |
          This treats a crease as absent paper. The cut lies at the fold. Check that it removes material from both folded layers.
      - text: "Four separate openings"
        rationale: |
          This doubles for a crease and again for the fold. Only one fold is present. Reflect once and check connectedness.
    explanation: |
      Opening reflects the cut across the vertical crease. The two removed halves meet along that crease. Together they form one connected opening symmetric about the crease.
    approved: true
  - id: "q-spatial-abstract-reasoning-paper-folding-and-cutting-0007"
    type: "paper-folding"
    difficulty: "medium"
    figure: "paper-folding-and-cutting-07"
    figureSpec:
      kind: "paper-fold"
      folds:
        - "vertical"
        - "horizontal"
        - "vertical"
      cut: "hole"
      at: "interior"
      sheet: "square"
      showUnfolded: false
    stem: |
      The shown packet results from three complete half-folds. Which condition is needed before concluding that one punch produces eight separate openings?
    choices:
      - text: "All layers cut; no crease touched"
        correct: true
      - text: "It cuts only the uppermost layer"
        rationale: |
          This treats the packet's total layers as all pierced. Eight layers are present. Check the cut depth.
      - text: "Its center lies on the latest crease"
        rationale: |
          This ignores joining at a crease. All layers can still be cut there. Check whether reflected copies touch.
      - text: "It is made at the common folded corner"
        rationale: |
          This assumes eight layers mean eight separated copies even at intersecting creases. A folded corner has many layers. Check whether copies meet at that point.
    explanation: |
      Three complete half-folds make eight layers. A punch through all of them gives eight copies if it stays away from the creases and the copies do not join. That is the condition needed for eight separate openings.
    approved: true
  - id: "q-spatial-abstract-reasoning-paper-folding-and-cutting-0008"
    type: "paper-folding"
    difficulty: "hard"
    figure: "paper-folding-and-cutting-08"
    figureSpec:
      kind: "paper-fold"
      folds:
        - "vertical"
        - "horizontal"
      cut: "notch"
      at: "on-fold"
      sheet: "square"
      showUnfolded: false
    stem: |
      The shown two-fold packet has a small cut centered on its vertical folded edge, away from the horizontal crease and all outer edges. It crosses every layer. How many connected openings appear after fully opening?
    choices:
      - text: "Two separate connected openings"
        correct: true
      - text: "Four separate openings"
        rationale: |
          This uses four layers as four separated holes. All layers are cut. Check that pairs meet across the vertical crease.
      - text: "One connected opening"
        rationale: |
          This joins copies across both creases. The cut touches only one crease. Check its separation from the horizontal crease.
      - text: "Eight separate openings"
        rationale: |
          This treats touching a crease as another doubling. The cut crosses the fold. Check that touching can join copies rather than create a new fold.
    explanation: |
      Undo the horizontal fold to make two separate cut locations. At each location, opening the vertical fold joins reflected halves along that crease. The final sheet has two connected openings.
    approved: true
  - id: "q-spatial-abstract-reasoning-paper-folding-and-cutting-0009"
    type: "paper-folding"
    difficulty: "hard"
    figure: "paper-folding-and-cutting-09"
    figureSpec:
      kind: "paper-fold"
      folds:
        - "vertical"
        - "horizontal"
      cut: "hole"
      at: "interior"
      sheet: "square"
      showUnfolded: false
    stem: |
      The paper is folded vertically first and horizontally second, as shown. Which order physically reverses those two folds?
    choices:
      - text: "Horizontal first, then vertical"
        correct: true
      - text: "Vertical first, then horizontal"
        rationale: |
          This uses the original order for undoing. Vertical was the first fold made. Start with the most recent fold when reversing the process.
      - text: "Both creases are removed by one vertical reflection"
        rationale: |
          This treats two different fold axes as one. Both lines are visible. Apply a reflection for each opened fold.
      - text: "Horizontal twice, without opening the vertical fold"
        rationale: |
          This repeats the last operation but leaves an earlier fold. Horizontal is opened first. Check which folded part remains afterward.
    explanation: |
      The horizontal fold was made last, so open it first. The vertical fold is then accessible in its earlier state and is opened next. This reverses the sequence.
    approved: true
  - id: "q-spatial-abstract-reasoning-paper-folding-and-cutting-0010"
    type: "paper-folding"
    difficulty: "hard"
    figure: "paper-folding-and-cutting-10"
    figureSpec:
      kind: "paper-fold"
      folds:
        - "vertical"
        - "horizontal"
        - "vertical"
      cut: "hole"
      at: "on-fold"
      sheet: "square"
      showUnfolded: false
    stem: |
      The shown three-fold packet has a small cut centered on its most recent vertical crease. It pierces all layers and touches no earlier crease or outside edge. How many connected openings remain after all folds are opened?
    choices:
      - text: "Four connected openings"
        correct: true
      - text: "Eight separate openings"
        rationale: |
          This uses the eight-layer count without accounting for joins. All layers were pierced. Check the cut on the newest crease.
      - text: "Two joined openings"
        rationale: |
          This joins at an extra crease that the cut does not touch. The packet has several creases. Track which one contains the cut.
      - text: "Sixteen separate openings"
        rationale: |
          This counts four folds even though three are drawn. Sixteen matches four doublings. Count the actual sequence and crease joins.
    explanation: |
      Opening the latest crease joins each pair of cut halves, leaving one opening in that stage. The earlier horizontal and vertical folds each double its separate positions. That gives $1 \times 2 \times 2=4$ connected openings.
    approved: true
  - id: "q-spatial-abstract-reasoning-paper-folding-and-cutting-0011"
    type: "paper-folding"
    difficulty: "hard"
    figure: "paper-folding-and-cutting-11"
    figureSpec:
      kind: "paper-fold"
      folds:
        - "vertical"
      cut: "hole"
      at: "interior"
      sheet: "square"
      showUnfolded: false
    stem: |
      The square is folded vertically as shown and punched through both layers at an interior point. After unfolding, how do the two holes relate to that crease?
    choices:
      - text: "Same height; equal opposite offsets"
        correct: true
      - text: "Different heights; same sideways position"
        rationale: |
          This uses horizontal reflection instead of vertical reflection. Both are mirror operations. Check the axis of the shown fold.
      - text: "Same height; unequal opposite offsets"
        rationale: |
          This reflects direction without preserving distance. The holes lie on opposite sides. Match each distance to the crease.
      - text: "Same height; both on the same side"
        rationale: |
          This leaves the folded-away half unreflected. The punch begins on one side. Place its mirror on the other side.
    explanation: |
      Reflection across a vertical crease preserves height and reverses the sideways offset. The two holes therefore lie at the same height and equally far on opposite sides of the crease.
    approved: true
  - id: "q-spatial-abstract-reasoning-paper-folding-and-cutting-0012"
    type: "paper-folding"
    difficulty: "hard"
    figure: "paper-folding-and-cutting-12"
    figureSpec:
      kind: "paper-fold"
      folds:
        - "vertical"
        - "horizontal"
      cut: "hole"
      at: "fold-corner"
      sheet: "square"
      showUnfolded: false
    stem: |
      The two-fold square is punched exactly at the corner formed by both folded edges, as shown. A small cut pierces all layers. How does the opening count differ from an off-crease interior punch?
    choices:
      - text: "One connected central opening"
        correct: true
      - text: "Four separate interior openings"
        rationale: |
          This applies the off-crease count at the crease intersection. There are four layers. Check where the reflected portions meet.
      - text: "Two separate openings along one crease"
        rationale: |
          This joins at only one crease. One fold can merge a pair. Check that the cut lies at both creases.
      - text: "Four openings at the outer corners"
        rationale: |
          This confuses the common folded corner with original outer corners. Both are called corners. Trace the fold intersection to the sheet center.
    explanation: |
      The cut touches both creases at their intersection. Reflected portions meet there as the two folds open. They form one connected opening at the center.
    approved: true
  - id: "q-spatial-abstract-reasoning-paper-folding-and-cutting-0013"
    type: "paper-folding"
    difficulty: "hard"
    figure: "paper-folding-and-cutting-13"
    figureSpec:
      kind: "paper-fold"
      folds:
        - "vertical"
        - "horizontal"
      cut: "hole"
      at: "edge"
      sheet: "square"
      showUnfolded: false
    stem: |
      The two-fold packet has an interior punch near its right outer edge, as shown. It touches no crease or sheet boundary. On fully opening, which statement describes the pattern's symmetry?
    choices:
      - text: "Reflection symmetry about both creases"
        correct: true
      - text: "Reflection symmetry only about the vertical crease"
        rationale: |
          This ignores the horizontal unfolding step. The vertical crease is prominent. Trace both openings.
      - text: "Reflection symmetry only about the horizontal crease"
        rationale: |
          This stops before restoring the left half. Horizontal is opened first. Reflect those copies across the earlier vertical crease too.
      - text: "No symmetry because the punch is off-center"
        rationale: |
          This treats a displaced starting cut as a displaced final pattern. The punch begins away from the center. Check the reflected partners created by each fold.
    explanation: |
      The punch is reflected across the horizontal crease and then across the vertical crease. Each resulting location has a matching reflected partner across both lines. The final pattern has both reflection symmetries.
    approved: true
  - id: "q-spatial-abstract-reasoning-paper-folding-and-cutting-0014"
    type: "paper-folding"
    difficulty: "hard"
    figure: "paper-folding-and-cutting-14"
    figureSpec:
      kind: "paper-fold"
      folds:
        - "vertical"
        - "horizontal"
        - "vertical"
      cut: "hole"
      at: "interior"
      sheet: "rectangle"
      showUnfolded: false
    stem: |
      The rectangle is folded in the shown order: vertical, horizontal, then vertical again. A small interior punch crosses all layers away from creases. Which sequence correctly traces the cut back to the full sheet?
    choices:
      - text: "Last vertical, horizontal, first vertical"
        correct: true
      - text: "First vertical, horizontal, newest vertical"
        rationale: |
          This uses folding order as unfolding order. Both outer steps are vertical. Keep track of their different crease positions.
      - text: "Horizontal, newest vertical, first vertical"
        rationale: |
          This opens the middle operation before the newest one. Horizontal is a familiar cross-fold. Undo the last operation first.
      - text: "Newest vertical, first vertical, horizontal"
        rationale: |
          This correctly starts at the last fold but skips the middle one. Both vertical folds share a direction. Follow the sequence backward without grouping by direction.
    explanation: |
      Reverse the most recent vertical fold first. Then reverse the horizontal fold. Finally reverse the original vertical fold, reflecting each current cut position at every step.
    approved: true
  - id: "q-spatial-abstract-reasoning-paper-folding-and-cutting-0015"
    type: "paper-folding"
    difficulty: "easy"
    figure: "paper-folding-and-cutting-15"
    figureSpec:
      kind: "paper-fold"
      folds:
        - "vertical"
        - "horizontal"
      cut: "hole"
      at: "interior"
      sheet: "square"
      showUnfolded: false
    stem: |
      The shown paper has two half-folds and a punch through all four layers away from the creases. After opening only the last, horizontal fold, how many hole locations are visible in the still vertically folded sheet?
    choices:
      - text: "Two locations"
        correct: true
      - text: "Four locations"
        rationale: |
          This opens both folds mentally. Full unfolding gives four. Stop after the one stated step.
      - text: "One location"
        rationale: |
          This ignores the last fold's reflection. One punch was made. Account for its copy in the opened layer.
      - text: "Eight locations"
        rationale: |
          This doubles three times instead of once. The original packet has four layers. Count visible positions after only the requested opening step.
    explanation: |
      Opening the last fold reflects the punched location across its horizontal crease. That creates two positions in the still folded right half. The earlier vertical fold remains unopened.
    approved: false
  - id: "q-spatial-abstract-reasoning-paper-folding-and-cutting-0016"
    type: "paper-folding"
    difficulty: "medium"
    figure: "paper-folding-and-cutting-16"
    figureSpec:
      kind: "paper-fold"
      folds:
        - "vertical"
        - "horizontal"
      cut: "hole"
      at: "interior"
      sheet: "square"
      showUnfolded: false
    stem: |
      After opening only the last, horizontal fold of the shown two-fold square, which describes the two copies of the off-crease punch before the vertical fold is opened?
    choices:
      - text: "Vertically aligned on opposite sides"
        correct: true
      - text: "Same height; left and right"
        rationale: |
          This uses the first vertical crease instead of the last horizontal one. Both are visible. Undo the most recent fold first.
      - text: "Both directly on the horizontal crease"
        rationale: |
          This moves the punch onto the reflection axis. The punch is away from it. Preserve its distance from the crease.
      - text: "One at each outer corner of the sheet"
        rationale: |
          This fully unfolds and sends inset punches to boundary corners. The paper remains vertically folded. Reflect only the shown interior location across the last crease.
    explanation: |
      Reflection across a horizontal crease keeps the sideways coordinate and reverses the vertical offset. Both copies stay in the vertically folded half, one above and one below that crease.
    approved: false
  - id: "q-spatial-abstract-reasoning-paper-folding-and-cutting-0017"
    type: "paper-folding"
    difficulty: "hard"
    figure: "paper-folding-and-cutting-17"
    figureSpec:
      kind: "paper-fold"
      folds:
        - "horizontal"
      cut: "notch"
      at: "interior"
      sheet: "square"
      showUnfolded: false
    stem: |
      The shown horizontal half-fold has a triangular interior cut pointing upward in the lower folded half. The cut passes through both layers away from the crease. What orientation does the reflected cut have in the upper half after opening?
    choices:
      - text: "Downward"
        correct: true
      - text: "Upward"
        rationale: |
          This copies the cut without reflecting its orientation. The triangle shape stays the same size. Check how a horizontal mirror changes up and down.
      - text: "Leftward"
        rationale: |
          This rotates the triangle by a quarter-turn. Opening can look like turning the paper. Use reflection across the horizontal crease.
      - text: "Rightward"
        rationale: |
          This rotates the triangle in the other quarter-turn direction. A sideways point is a possible orientation. Reflect vertical direction rather than rotating it.
    explanation: |
      A horizontal reflection reverses up and down. The upward-pointing triangle in the lower half therefore has a downward-pointing reflected partner in the upper half.
    approved: false
  - id: "q-spatial-abstract-reasoning-paper-folding-and-cutting-0018"
    type: "paper-folding"
    difficulty: "hard"
    figure: "paper-folding-and-cutting-18"
    figureSpec:
      kind: "paper-fold"
      folds:
        - "vertical"
        - "vertical"
      cut: "hole"
      at: "on-fold"
      sheet: "square"
      showUnfolded: false
    stem: |
      The square is folded vertically twice, leaving its rightmost quarter as shown. The cut lies on the latest crease but not the first crease. After full unfolding, where do the connected openings lie relative to the original middle crease?
    choices:
      - text: "On opposite sides, equally far from it"
        correct: true
      - text: "Both exactly on the original middle crease"
        rationale: |
          This treats both vertical creases as the same line. Their directions match. Locate the second crease halfway across the already folded half.
      - text: "Both in the original right half only"
        rationale: |
          This stops before reversing the first fold. The packet is initially on the right. Reflect the remaining pattern across the original middle crease.
      - text: "At unrelated distances on the two sides"
        rationale: |
          This changes distance while reflecting. The two positions are on different halves. Preserve perpendicular distance from the first crease.
    explanation: |
      The latest crease is halfway across the already folded right half. Opening that crease joins the cut there. Opening the first fold then makes its mirror on the left side, equally far from the original middle crease.
    approved: false
  - id: "q-spatial-abstract-reasoning-paper-folding-and-cutting-0019"
    type: "paper-folding"
    difficulty: "exam"
    figure: "paper-folding-and-cutting-19"
    figureSpec:
      kind: "paper-fold"
      folds:
        - "vertical"
        - "horizontal"
        - "vertical"
      cut: "hole"
      at: "interior"
      sheet: "rectangle"
      showUnfolded: false
    stem: |
      The rectangle has the shown vertical, horizontal, vertical half-folds. A small interior punch crosses all eight layers. After full opening, how are the hole positions arranged?
    choices:
      - text: "Two rows and four columns"
        correct: true
      - text: "Four rows and two columns"
        rationale: |
          This swaps the fold directions. There are three folds. Count horizontal folds for row positions and vertical folds for column positions.
      - text: "One row and eight columns"
        rationale: |
          This treats every fold as vertical. Eight copies is the total. Check the horizontal fold that produces two heights.
      - text: "Eight rows and one column"
        rationale: |
          This treats every fold as horizontal. The holes do multiply. Check the two vertical folds that produce sideways copies.
    explanation: |
      The horizontal fold gives two reflected vertical positions. The two vertical folds give four reflected sideways positions. Together those independent positions make two rows and four columns.
    approved: false
  - id: "q-spatial-abstract-reasoning-paper-folding-and-cutting-0020"
    type: "paper-folding"
    difficulty: "exam"
    figure: "paper-folding-and-cutting-20"
    figureSpec:
      kind: "paper-fold"
      folds:
        - "vertical"
        - "horizontal"
      cut: "hole"
      at: "interior"
      sheet: "square"
      showUnfolded: false
    stem: |
      The two-fold square has an interior punch through all four layers away from the creases. On full opening, how do diagonally opposite holes compare in distance from the original sheet center?
    choices:
      - text: "They are equally far from the center"
        correct: true
      - text: "The lower-right hole is always farther"
        rationale: |
          This treats the starting packet position as a larger final distance. The punch begins in the lower right. Check the equal offsets created by reflection.
      - text: "Their distances depend on the unfolding speed"
        rationale: |
          This makes the opening process change cut geometry. The paper moves while opening. Trace the fixed reflected locations on the flat sheet.
      - text: "Opposite holes must meet at the center"
        rationale: |
          This treats reflected offsets as cancellation of hole positions. Their offsets have opposite signs. Check that the punch never touched a crease.
    explanation: |
      The creases meet at the original center. Reflecting across each crease reverses the horizontal and vertical offsets while preserving their sizes. A diagonally opposite hole therefore has the same distance from the center.
