questions:
  - id: q-spatial-abstract-reasoning-labeling-three-shape-regions-0001
    approved: true
    lesson: lesson-spatial-abstract-reasoning-labeling-three-shape-regions
    keyPoint: 1
    type: statement-inference
    difficulty: easy
    stem: |
      Three circles have the same center. Circle A has radius 2 cm, B has radius 5 cm, and C has radius 8 cm. Which circles contain a point 4 cm from the common center?
    choices:
      - text: "B and C only"
        correct: true
      - text: "A and B only"
        rationale: |
          This picks the two smaller circles. Their sizes are easy to compare. Keep every radius greater than 4 cm.
      - text: "B only"
        rationale: |
          This stops at the smallest circle that contains the point. B does contain it. Check the larger circle too.
      - text: "A, B, and C"
        rationale: |
          This uses the shared center as proof that all three contain the point. Their centers match. Their radii differ, so check A separately.
    explanation: |
      The distance of 4 cm is greater than A's radius. It is less than the radii of B and C.

  - id: q-spatial-abstract-reasoning-labeling-three-shape-regions-0002
    approved: true
    lesson: lesson-spatial-abstract-reasoning-labeling-three-shape-regions
    keyPoint: 1
    type: statement-inference
    difficulty: medium
    stem: |
      Three rectangles have their bottom edges on the same horizontal line. All are 4 units tall. Along that line, A spans positions 0 to 6, B spans 2 to 8, and C spans 4 to 10. Point P is 2 units directly above position 3. Which rectangles contain P?
    choices:
      - text: "Rectangles A and B only"
        correct: true
      - text: "Rectangle B only"
        rationale: |
          This counts the rectangle that starts nearest P. B starts at 2. Check whether P also lies before the right edge of A.
      - text: "Rectangles B and C only"
        rationale: |
          This counts the last two rectangles in the list. Their spans overlap farther right. Check whether P reaches position 4.
      - text: "Rectangles A, B, and C"
        rationale: |
          This treats a shared height as a shared interior. P is at the right height for all three. Compare its horizontal position with each left edge.
    explanation: |
      P is between the bottom and top of all three rectangles. Position 3 lies in A and B, while C starts farther right at position 4.
