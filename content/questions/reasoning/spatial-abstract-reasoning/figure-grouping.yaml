meta:
  subject: "reasoning"
  topic: "spatial-abstract-reasoning"
  subtopic: "figure-grouping"
  exams:
    - "acet"
    - "ustet"
    - "dost-sei"
    - "cse-pro"
questions:
  - id: "q-spatial-abstract-reasoning-figure-grouping-0001"
    type: "odd-figure"
    difficulty: "easy"
    figure: "figure-grouping-01"
    figureSpec:
      kind: "shape-row"
      shapes:
        - form: "square"
        - form: "rectangle"
        - form: "rhombus"
        - form: "triangle"
    stem: |
      Group the figures by number of sides. Which does not belong?
    choices:
      - text: "Triangle"
        correct: true
      - text: "Square"
        rationale: |
          This groups by equal side lengths instead of side count. The square has four equal sides. Count its boundary segments.
      - text: "Rectangle"
        rationale: |
          This groups by width and height instead of side count. The rectangle is wider than it is tall. Count its four boundary segments.
      - text: "Rhombus"
        rationale: |
          This treats a rotated-looking outline as having a different side count. Its orientation stands out. Count sides without using orientation.
    explanation: |
      The square, rectangle, and rhombus each have four sides. The triangle has three sides and breaks that shared count.
    approved: true
  - id: "q-spatial-abstract-reasoning-figure-grouping-0002"
    type: "odd-figure"
    difficulty: "easy"
    figure: "figure-grouping-02"
    figureSpec:
      kind: "shape-row"
      shapes:
        - form: "circle"
        - form: "square"
        - form: "triangle"
        - form: "blob"
    stem: |
      Group the figures by whether their outlines have a reflection axis. Which lacks one?
    choices:
      - text: "Irregular blob"
        correct: true
      - text: "Circle"
        rationale: |
          This groups by curved versus straight boundary. The circle has no straight sides. Test reflection symmetry rather than boundary type.
      - text: "Square"
        rationale: |
          This groups by four equal sides. The square has that feature. Check whether its halves can match in reflection.
      - text: "Triangle"
        rationale: |
          This groups by side count. The triangle has three sides. Check its vertical reflection axis.
    explanation: |
      The circle, square, and equilateral triangle each have an axis along which reflected halves match. The irregular blob has no such axis.
    approved: true
  - id: "q-spatial-abstract-reasoning-figure-grouping-0003"
    type: "odd-figure"
    difficulty: "medium"
    figure: "figure-grouping-03"
    figureSpec:
      kind: "shape-row"
      shapes:
        - form: "circle"
          lines: 1
        - form: "circle"
          lines: 2
        - form: "circle"
          lines: 3
        - form: "circle"
          lines: 2
          through: "off"
    stem: |
      Considering whether the internal lines pass through the circle center, which figure does not belong?
    choices:
      - text: "The rightmost circle"
        correct: true
      - text: "The leftmost circle"
        rationale: |
          This selects the smallest line count. That circle has only one line. Check line position rather than number.
      - text: "The second circle from the left"
        rationale: |
          This selects an even line count. It has two lines. Check whether those lines pass through the center.
      - text: "The third circle from the left"
        rationale: |
          This selects the most divided circle. It has three lines. Check the common point where they meet.
    explanation: |
      The first three circles have lines passing through their centers. The rightmost has lines meeting below its center. It breaks the shared center-crossing rule.
    approved: true
  - id: "q-spatial-abstract-reasoning-figure-grouping-0004"
    type: "odd-figure"
    difficulty: "medium"
    figure: "figure-grouping-04"
    figureSpec:
      kind: "shape-row"
      shapes:
        - form: "square"
          dots: 1
        - form: "triangle"
          dots: 1
        - form: "circle"
          dots: 1
        - form: "pentagon"
          dots: 1
        - form: "hexagon"
          dots: 2
    stem: |
      Considering internal dot counts, which figure does not belong?
    choices:
      - text: "Hexagon"
        correct: true
      - text: "Circle"
        rationale: |
          This selects the curved outline rather than the internal count. The circle looks unlike the polygons. Count its dots.
      - text: "Triangle"
        rationale: |
          This selects the fewest sides. The triangle has three. Check the internal feature named in the stem.
      - text: "Pentagon"
        rationale: |
          This selects an uncommon outer shape. The pentagon has five sides. Compare its dot count with the other figures.
    explanation: |
      The square, triangle, circle, and pentagon each contain one dot. The hexagon contains two dots and breaks that shared count.
    approved: true
  - id: "q-spatial-abstract-reasoning-figure-grouping-0005"
    type: "odd-figure"
    difficulty: "medium"
    figure: "figure-grouping-05"
    figureSpec:
      kind: "shape-row"
      shapes:
        - form: "square"
        - form: "triangle"
        - form: "rectangle"
        - form: "circle"
    stem: |
      Group the outlines by straight-sided versus curved boundaries. Which does not belong?
    choices:
      - text: "Circle"
        correct: true
      - text: "Square"
        rationale: |
          This selects equal sides instead of boundary type. Its sides match in length. Check whether each boundary segment is straight.
      - text: "Triangle"
        rationale: |
          This selects a different side count. It has three sides. Compare straight versus curved edges.
      - text: "Rectangle"
        rationale: |
          This selects an elongated outline. The rectangle is wider than tall. Check the type of each boundary segment.
    explanation: |
      The square, triangle, and rectangle have only straight boundary segments. The circle has a curved boundary.
    approved: true
  - id: "q-spatial-abstract-reasoning-figure-grouping-0006"
    type: "odd-figure"
    difficulty: "medium"
    figure: "figure-grouping-06"
    figureSpec:
      kind: "shape-row"
      shapes:
        - form: "pentagon"
        - form: "pentagon"
        - form: "hexagon"
        - form: "pentagon"
    stem: |
      Three outlines match in side count. Which outline breaks that count?
    choices:
      - text: "Third figure from the left"
        correct: true
      - text: "First figure from the left"
        rationale: |
          This chooses an endpoint in the row. The first position can look separated from the others. Count sides instead of row position.
      - text: "Second figure from the left"
        rationale: |
          This chooses a matching pentagon because it is near the center. Its placement stands out. Count its five sides.
      - text: "Fourth figure from the left"
        rationale: |
          This chooses the last position as a pattern endpoint. The last figure is visually isolated at the edge. Compare its side count.
    explanation: |
      The first, second, and fourth figures are pentagons with five sides. The third is a hexagon with six sides.
    approved: true
  - id: "q-spatial-abstract-reasoning-figure-grouping-0007"
    type: "odd-figure"
    difficulty: "medium"
    figure: "figure-grouping-07"
    figureSpec:
      kind: "figure-series"
      items:
        - form: "square"
          line: 30
        - form: "square"
          dot: "top"
        - form: "square"
          dot: "top-left"
        - form: "square"
          dots: 2
      blank: false
    stem: |
      Considering reflection symmetry of the complete figures, including internal marks, which figure does not belong?
    choices:
      - text: "The leftmost square"
        correct: true
      - text: "Second square from the left"
        rationale: |
          This assumes any off-center dot removes symmetry. Its top dot is off-center. Check the vertical axis through that dot.
      - text: "Third square from the left"
        rationale: |
          This treats a corner dot as always asymmetric. Its dot is in one corner. Check the diagonal through that corner and the center.
      - text: "Rightmost square"
        rationale: |
          This assumes two dots necessarily break symmetry. Two marks appear inside. Check their matching placement on either side of the vertical axis.
    explanation: |
      The first square has a radial line at 30 degrees, which is not one of the square's reflection axes. The other figures each preserve a vertical or diagonal axis through their marks. The first complete figure therefore lacks reflection symmetry.
    approved: true
  - id: "q-spatial-abstract-reasoning-figure-grouping-0008"
    type: "odd-figure"
    difficulty: "medium"
    figure: "figure-grouping-08"
    figureSpec:
      kind: "shape-row"
      shapes:
        - form: "rhombus"
        - form: "square"
        - form: "rectangle"
        - form: "triangle"
    stem: |
      A student excludes the first figure because its outline looks rotated. Under grouping by side count, which figure should be excluded?
    choices:
      - text: "The rightmost figure"
        correct: true
      - text: "The leftmost figure"
        rationale: |
          This treats orientation as a side-count difference. The slanted appearance catches attention. Count its boundary segments.
      - text: "Second figure from the left"
        rationale: |
          This singles out the upright square. It looks more regular than the first. Check the shared four-sided feature.
      - text: "Third figure from the left"
        rationale: |
          This singles out the wider rectangle. Its proportions differ. Check that it still has four sides.
    explanation: |
      Rotation does not change side count. The first three outlines each have four sides. The rightmost triangle has three.
    approved: true
  - id: "q-spatial-abstract-reasoning-figure-grouping-0009"
    type: "odd-figure"
    difficulty: "medium"
    figure: "figure-grouping-09"
    figureSpec:
      kind: "shape-row"
      shapes:
        - form: "circle"
          lines: 2
        - form: "circle"
          lines: 2
        - form: "circle"
          lines: 2
        - form: "circle"
          lines: 1
    stem: |
      Group these figures by the number of internal lines. Which does not belong?
    choices:
      - text: "The rightmost circle"
        correct: true
      - text: "The leftmost circle"
        rationale: |
          This picks the start of the row. Its first position makes it noticeable. Count its lines.
      - text: "Second circle from the left"
        rationale: |
          This selects a matching figure because it is central. The two cuts intersect visibly. Count lines rather than regions.
      - text: "Third circle from the left"
        rationale: |
          This mistakes the same pattern for a new count. It repeats the two-line figure. Trace both full cuts.
    explanation: |
      The first three circles have two internal lines each. The rightmost has one. It breaks the common line-count rule.
    approved: true
  - id: "q-spatial-abstract-reasoning-figure-grouping-0010"
    type: "odd-figure"
    difficulty: "medium"
    figure: "figure-grouping-10"
    figureSpec:
      kind: "shape-row"
      shapes:
        - form: "triangle"
        - form: "triangle"
        - form: "triangle"
        - form: "rhombus"
    stem: |
      The rule "all outlines have straight sides" includes every shown figure. Which more specific rule groups exactly three and excludes one?
    choices:
      - text: "Three sides"
        correct: true
      - text: "At least three sides"
        rationale: |
          This keeps the rule too broad. Every figure has at least three sides. Check that the proposed rule must leave exactly one out.
      - text: "At least one reflection axis"
        rationale: |
          This uses a feature shared by all these regular outlines. Symmetry is visible. Check whether it excludes any figure.
      - text: "A closed boundary"
        rationale: |
          This uses closure, which every figure shares. All outlines enclose space. Check whether the rule splits the group.
    explanation: |
      The first three figures are triangles. Each has three sides. That shared count separates them from the four-sided rhombus.
    approved: true
  - id: "q-spatial-abstract-reasoning-figure-grouping-0011"
    type: "odd-figure"
    difficulty: "medium"
    figure: "figure-grouping-11"
    figureSpec:
      kind: "figure-series"
      items:
        - form: "triangle"
          fill: "black"
        - form: "circle"
          fill: "black"
        - form: "square"
          fill: "black"
        - form: "pentagon"
          fill: "black"
        - form: "circle"
          fill: "white"
      blank: false
    stem: |
      Considering fill alone, which displayed figure does not belong?
    choices:
      - text: "The rightmost circle"
        correct: true
      - text: "The leftmost triangle"
        rationale: |
          This uses outer form instead of fill. The triangle looks unlike the circles. Compare its black interior.
      - text: "The middle square"
        rationale: |
          This uses square shape as the distinguishing feature. It has four sides. Check the fill feature named in the stem.
      - text: "Second circle from the left"
        rationale: |
          This selects a circle even though its fill matches the group. The circle has a curved boundary. Compare black versus white fill.
    explanation: |
      The first four figures have black fill. The rightmost circle has white fill. It breaks the shared fill state.
    approved: true
  - id: "q-spatial-abstract-reasoning-figure-grouping-0012"
    type: "odd-figure"
    difficulty: "medium"
    figure: "figure-grouping-12"
    figureSpec:
      kind: "shape-row"
      shapes:
        - form: "circle"
          lines: 1
        - form: "circle"
          lines: 2
        - form: "circle"
          lines: 3
        - form: "circle"
          lines: 0
    stem: |
      Group the circles by whether they have an even number of enclosed regions. Which does not belong?
    choices:
      - text: "The rightmost circle"
        correct: true
      - text: "The leftmost circle"
        rationale: |
          This treats one dividing line as one region. Only one cut is visible. Count both areas on its sides.
      - text: "Second circle from the left"
        rationale: |
          This confuses two lines with an odd region count. Both cross in the center. Count the four separate areas.
      - text: "Third circle from the left"
        rationale: |
          This treats three lines as three regions. Three is odd. Count the areas between the six radiating segments.
    explanation: |
      One, two, and three distinct lines through the center create two, four, and six regions. The uncut rightmost circle has one region. One is odd, so it breaks the even-region rule.
    approved: true
  - id: "q-spatial-abstract-reasoning-figure-grouping-0013"
    type: "odd-figure"
    difficulty: "medium"
    figure: "figure-grouping-13"
    figureSpec:
      kind: "shape-row"
      shapes:
        - form: "square"
        - form: "rectangle"
        - form: "hexagon"
        - form: "pentagon"
    stem: |
      When the outlines are grouped by an even number of sides, which does not belong?
    choices:
      - text: "Pentagon"
        correct: true
      - text: "Square"
        rationale: |
          This singles out equal sides rather than parity. The square is regular. Count its four sides and test whether four is even.
      - text: "Rectangle"
        rationale: |
          This uses unequal neighboring sides instead of parity. Its long and short sides differ. Count all four sides.
      - text: "Hexagon"
        rationale: |
          This assumes the shared rule must be exactly four sides. The first two have four. Check that six also satisfies the stated even-count rule.
    explanation: |
      The square, rectangle, and hexagon have four, four, and six sides. These are even counts. The pentagon has five sides, an odd count.
    approved: true
  - id: "q-spatial-abstract-reasoning-figure-grouping-0014"
    type: "odd-figure"
    difficulty: "medium"
    figure: "figure-grouping-14"
    figureSpec:
      kind: "figure-series"
      items:
        - form: "square"
          arrow: "up"
        - form: "circle"
          arrow: "up"
        - form: "pentagon"
          arrow: "up"
        - form: "triangle"
          arrow: "down"
      blank: false
    stem: |
      Considering the direction of the internal arrow, which figure does not belong?
    choices:
      - text: "Triangle"
        correct: true
      - text: "Pentagon"
        rationale: |
          This picks the highest side count. The pentagon has five sides. Compare the internal arrow directions.
      - text: "Circle"
        rationale: |
          This picks the curved outline. The circle has no straight sides. Check the internal mark, not its border.
      - text: "Square"
        rationale: |
          This picks an outline with four sides. Its form is familiar. Check that its arrow matches the majority.
    explanation: |
      The square, circle, and pentagon all have upward arrows. The triangle has a downward arrow. Its internal direction breaks the shared rule.
    approved: true
  - id: "q-spatial-abstract-reasoning-figure-grouping-0015"
    type: "odd-figure"
    difficulty: "easy"
    figure: "figure-grouping-15"
    figureSpec:
      kind: "shape-row"
      shapes:
        - form: "square"
          dots: 2
        - form: "rectangle"
          dots: 4
        - form: "circle"
          dots: 3
        - form: "hexagon"
          dots: 2
    stem: |
      Considering dot-count parity, which figure does not belong?
    choices:
      - text: "The circle"
        correct: true
      - text: "Square"
        rationale: |
          This selects the fewest dots rather than parity. The square has two. Check whether two is even.
      - text: "Rectangle"
        rationale: |
          This selects the most dots rather than parity. Four dots stand out. Check whether four is even.
      - text: "Hexagon"
        rationale: |
          This groups by sides instead of dot parity. The outline has six sides. Count its two internal dots.
    explanation: |
      The square, rectangle, and hexagon contain two, four, and two dots. Each count is even. The circle contains three dots, an odd count.
    approved: false
  - id: "q-spatial-abstract-reasoning-figure-grouping-0016"
    type: "odd-figure"
    difficulty: "medium"
    figure: "figure-grouping-16"
    figureSpec:
      kind: "figure-series"
      items:
        - form: "square"
          line: 0
        - form: "square"
          line: 90
        - form: "square"
          line: 45
        - form: "square"
          line: 180
      blank: false
    stem: |
      Three internal rays point parallel to a side of their square outlines. Which ray is the exception?
    choices:
      - text: "The third square"
        correct: true
      - text: "The first square"
        rationale: |
          This treats a single vertical ray as an unmatched feature. The up direction stands out. Check whether it is parallel to a vertical side.
      - text: "The second square"
        rationale: |
          This treats a horizontal ray as unlike the vertical rays. It points right. Check that the shared rule allows either horizontal or vertical sides.
      - text: "The fourth square"
        rationale: |
          This confuses a downward ray with a diagonal ray. It appears below the center. Compare its direction with the square's vertical sides.
    explanation: |
      The first, second, and fourth rays point up, right, and down. Each direction is parallel to a side of its square. The third ray points diagonally and breaks that rule.
    approved: false
  - id: "q-spatial-abstract-reasoning-figure-grouping-0017"
    type: "odd-figure"
    difficulty: "hard"
    figure: "figure-grouping-17"
    figureSpec:
      kind: "shape-row"
      shapes:
        - form: "square"
        - form: "triangle"
        - form: "rectangle"
        - form: "circle"
    stem: |
      The displayed grouping is based on straight versus curved boundaries. Which replacement for the circle would make all four outlines belong?
    choices:
      - text: "Hexagon"
        correct: true
      - text: "Another circle"
        rationale: |
          This keeps the differing boundary type. The replacement matches the removed outline. Check whether it has straight segments.
      - text: "An irregular curved blob"
        rationale: |
          This uses a different curved outline without changing boundary type. Its irregular shape seems unlike a circle. Check straight versus curved edges.
      - text: "A circle with two dots"
        rationale: |
          This changes internal marks instead of the outline. Dots add a visible difference. Check the feature that defines the group.
    explanation: |
      The other outlines are polygons made of straight segments. A hexagon also has only straight segments. Replacing the circle with a hexagon therefore makes the boundary rule hold for every outline.
    approved: false
  - id: "q-spatial-abstract-reasoning-figure-grouping-0018"
    type: "odd-figure"
    difficulty: "hard"
    figure: "figure-grouping-18"
    figureSpec:
      kind: "shape-row"
      shapes:
        - form: "square"
          dots: 2
        - form: "rectangle"
          dots: 2
        - form: "hexagon"
          dots: 3
        - form: "triangle"
          dots: 2
    stem: |
      In three figures, the side count is twice the internal dot count. Which breaks this relation?
    choices:
      - text: "Triangle"
        correct: true
      - text: "Square"
        rationale: |
          This selects a matching figure because all its sides are equal. Equal lengths stand out. Compare counts, not lengths.
      - text: "Rectangle"
        rationale: |
          This treats unequal side lengths as different side counts. The rectangle is elongated. Count four sides and two dots.
      - text: "Hexagon"
        rationale: |
          This picks the largest dot count. Three differs from the two-dot figures. Check that six sides is still twice three dots.
    explanation: |
      The square, rectangle, and hexagon have four sides with two dots, four with two, and six with three. Each side count is twice the dot count. The triangle has three sides and two dots, so it breaks the relation.
    approved: false
  - id: "q-spatial-abstract-reasoning-figure-grouping-0019"
    type: "odd-figure"
    difficulty: "exam"
    figure: "figure-grouping-19"
    figureSpec:
      kind: "figure-series"
      items:
        - form: "square"
          dots: 1
          edgeLines: 1
        - form: "square"
          dots: 2
          edgeLines: 2
        - form: "square"
          dots: 2
          edgeLines: 3
        - form: "square"
          dots: 3
          edgeLines: 3
      blank: false
    stem: |
      In three figures, dots and bottom-edge lines have equal counts. Which breaks that relation?
    choices:
      - text: "The third square"
        correct: true
      - text: "The first square"
        rationale: |
          This selects the fewest marks rather than comparing counts. It has one of each. Check equality within the same figure.
      - text: "The second square"
        rationale: |
          This selects an even count. It has two of each. Check whether both kinds match.
      - text: "The fourth square"
        rationale: |
          This selects the most dots. It has three of each. Compare the two counts within it.
    explanation: |
      The first, second, and fourth squares have matching dot and edge-line counts: one and one, two and two, three and three. The third has two dots and three edge lines. Its counts differ.
    approved: false
  - id: "q-spatial-abstract-reasoning-figure-grouping-0020"
    type: "odd-figure"
    difficulty: "exam"
    figure: "figure-grouping-20"
    figureSpec:
      kind: "figure-series"
      items:
        - form: "triangle"
          dots: 3
        - form: "square"
          dots: 4
        - form: "triangle"
          dots: 3
        - form: "square"
          dots: 2
      blank: false
    stem: |
      Each outline is a regular polygon. In three figures, the number of internal dots equals the number of reflection axes of the outline. Which breaks the relation?
    choices:
      - text: "Fourth figure"
        correct: true
      - text: "First figure"
        rationale: |
          This counts only the vertical reflection axis. That one is easiest to see. Check the two axes through the other vertices.
      - text: "Second figure"
        rationale: |
          This counts only horizontal and vertical axes. Those two are visible. Check the two diagonal axes too.
      - text: "Third figure"
        rationale: |
          This assumes only even-sided shapes have reflection symmetry. The triangle has three sides. Check its three vertex-to-opposite-side reflection axes.
    explanation: |
      Each regular triangle has three reflection axes, and each square has four. The first three figures have three, four, and three dots, matching their outlines' reflection axes. The fourth figure is a square with two dots but four reflection axes. It breaks the relation.
    approved: false
