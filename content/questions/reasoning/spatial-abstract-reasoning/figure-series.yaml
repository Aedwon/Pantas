meta:
  subject: "reasoning"
  topic: "spatial-abstract-reasoning"
  subtopic: "figure-series"
  exams:
    - "acet"
    - "ustet"
    - "dost-sei"
    - "cse-pro"
questions:
  - id: "q-spatial-abstract-reasoning-figure-series-0001"
    type: "figure-series"
    difficulty: "easy"
    figure: "figure-series-01"
    figureSpec:
      kind: "figure-series"
      items:
        - form: "square"
          line: 0
        - form: "square"
          line: 45
        - form: "square"
          line: 90
      blank: true
    stem: |
      Which figure best continues the simplest consistent pattern shown?
    choices:
      - text: "Line pointing lower-right"
        correct: true
      - text: "Line pointing down"
        rationale: |
          This doubles the last turn to 90 degrees. Down is the next main compass direction. Check the equal diagonal steps already shown.
      - text: "Line pointing up"
        rationale: |
          This restarts after three states instead of continuing the turn. Up is the starting position. Check whether a completed cycle has been shown.
      - text: "Line pointing upper-right"
        rationale: |
          This reverses the rotation direction. Upper-right was the previous state. Compare the direction of both shown transitions.
    explanation: |
      The line moves clockwise by 45 degrees each time: up, upper-right, right. One more equal step points lower-right.
    approved: true
  - id: "q-spatial-abstract-reasoning-figure-series-0002"
    type: "figure-series"
    difficulty: "easy"
    figure: "figure-series-02"
    figureSpec:
      kind: "figure-series"
      items:
        - form: "triangle"
        - form: "square"
        - form: "pentagon"
      blank: true
    stem: |
      Which figure best continues the simplest consistent pattern shown?
    choices:
      - text: "Hexagon with six sides"
        correct: true
      - text: "Pentagon with five sides"
        rationale: |
          This repeats the final side count. The last shape is familiar. Check the increase between each shown pair.
      - text: "Heptagon with seven sides"
        rationale: |
          This skips six and adds two sides. The count is increasing. Check the size of the earlier increases.
      - text: "Octagon with eight sides"
        rationale: |
          This adds the three initial sides to five. Both counts are visible. Check whether that larger jump occurred in the series.
    explanation: |
      The shapes have three, four, then five sides. Adding one side each time gives six sides next. A six-sided polygon is a hexagon.
    approved: true
  - id: "q-spatial-abstract-reasoning-figure-series-0003"
    type: "figure-series"
    difficulty: "easy"
    figure: "figure-series-03"
    figureSpec:
      kind: "figure-series"
      items:
        - form: "circle"
          fill: "black"
        - form: "circle"
          fill: "white"
        - form: "circle"
          fill: "black"
      blank: true
    stem: |
      Which figure best continues the simplest consistent pattern shown?
    choices:
      - text: "White circle"
        correct: true
      - text: "Black circle"
        rationale: |
          This repeats the last fill. Black appears twice. Check each adjacent transition instead of counting the most common fill.
      - text: "Half-filled circle"
        rationale: |
          This averages the two fill states. Black and white are both present. Check whether any partial fill appears in the pattern.
      - text: "Quarter-filled circle"
        rationale: |
          This invents a gradual fill change. Fill is the changing feature. Check that the shown states are fully black or fully white.
    explanation: |
      The circles alternate black, white, black. Continuing the alternating fill gives a white circle.
    approved: true
  - id: "q-spatial-abstract-reasoning-figure-series-0004"
    type: "figure-series"
    difficulty: "medium"
    figure: "figure-series-04"
    figureSpec:
      kind: "figure-series"
      items:
        - form: "triangle"
          size: "small"
          fill: "black"
        - form: "triangle"
          size: "medium"
          fill: "white"
        - form: "triangle"
          size: "large"
          fill: "black"
        - form: "triangle"
          size: "small"
          fill: "white"
        - form: "triangle"
          size: "medium"
          fill: "black"
      blank: true
    stem: |
      Which figure best continues the simplest consistent pattern shown?
    choices:
      - text: "Large white triangle"
        correct: true
      - text: "Large black triangle"
        rationale: |
          This follows size but repeats the previous fill. Size has a clear cycle. Check the separate alternating fill track.
      - text: "Small white triangle"
        rationale: |
          This follows fill but restarts size too early. Small starts the cycle. Check the last two size states.
      - text: "Medium white triangle"
        rationale: |
          This follows fill but holds the size unchanged. Medium is the last size. Continue the three-size cycle.
    explanation: |
      Sizes repeat small, medium, large, small, medium. The next size is large. Fill alternates black and white, so the next fill is white.
    approved: true
  - id: "q-spatial-abstract-reasoning-figure-series-0005"
    type: "figure-series"
    difficulty: "medium"
    figure: "figure-series-05"
    figureSpec:
      kind: "figure-series"
      items:
        - form: "square"
          dot: "top-left"
        - form: "square"
          dot: "top-right"
        - form: "square"
          dot: "bottom-right"
      blank: true
    stem: |
      Which figure best continues the simplest consistent pattern shown?
    choices:
      - text: "Dot at bottom-left"
        correct: true
      - text: "Dot at top-left"
        rationale: |
          This restarts before visiting all four corners. Top-left began the series. Check the remaining corner on the same route.
      - text: "Dot at top-right"
        rationale: |
          This jumps back to the second state. That corner has appeared before. Continue from the last corner by the same step.
      - text: "Dot at center"
        rationale: |
          This changes corner movement into inward movement. The center is another visible location. Check that every shown dot is at a corner.
    explanation: |
      The dot moves clockwise through the square's corners: top-left, top-right, bottom-right. The next corner on that route is bottom-left.
    approved: true
  - id: "q-spatial-abstract-reasoning-figure-series-0006"
    type: "figure-series"
    difficulty: "medium"
    figure: "figure-series-06"
    figureSpec:
      kind: "figure-series"
      items:
        - form: "circle"
          arrow: "up"
        - form: "circle"
          arrow: "right"
        - form: "circle"
          arrow: "down"
      blank: false
    stem: |
      Continue the shown rotation rule for two further steps. What arrow direction appears on the second of those steps?
    choices:
      - text: "Arrow pointing up"
        correct: true
      - text: "Arrow pointing left"
        rationale: |
          This takes only one further step. Left is the immediate continuation. Check that the stem asks for two steps.
      - text: "Arrow pointing right"
        rationale: |
          This turns backward once from down. Right appeared previously. Keep the established direction and count two transitions.
      - text: "Arrow pointing down"
        rationale: |
          This completes no further change. Down is the last shown state. Apply both requested turns.
    explanation: |
      The arrows turn clockwise by 90 degrees per step. After the shown down arrow, the next is left and the following one up. Two further steps therefore give up.
    approved: true
  - id: "q-spatial-abstract-reasoning-figure-series-0007"
    type: "figure-series"
    difficulty: "medium"
    figure: "figure-series-07"
    figureSpec:
      kind: "figure-series"
      items:
        - form: "circle"
          dots: 1
        - form: "circle"
          dots: 2
        - form: "circle"
          dots: 3
      blank: true
    stem: |
      Which figure best continues the simplest consistent pattern shown?
    choices:
      - text: "Circle with four dots"
        correct: true
      - text: "Circle with five dots"
        rationale: |
          This skips one count. The number of dots is increasing. Check that each earlier increase is only one.
      - text: "Circle with three dots"
        rationale: |
          This repeats the final count. The last figure is most recent. Compare the earlier counts to find the change.
      - text: "Circle with six dots"
        rationale: |
          This doubles the final count. Three dots are visible at the end. Check whether the earlier changes doubled counts.
    explanation: |
      The circles contain one, two, then three dots. The count increases by one per step. The next circle therefore has four dots.
    approved: true
  - id: "q-spatial-abstract-reasoning-figure-series-0008"
    type: "figure-series"
    difficulty: "medium"
    figure: "figure-series-08"
    figureSpec:
      kind: "figure-series"
      items:
        - form: "square"
          size: "large"
        - form: "square"
          size: "medium"
        - form: "square"
          size: "small"
        - form: "square"
          size: "medium"
        - form: "square"
          size: "large"
      blank: true
    stem: |
      Which figure best continues the simplest consistent pattern shown?
    choices:
      - text: "Medium square"
        correct: true
      - text: "Small square"
        rationale: |
          This jumps directly from large to small. Both are endpoints of the cycle. Check that the shown transitions pass through medium.
      - text: "Large square"
        rationale: |
          This holds at the largest state. The last square is large. Check the reversal visible at the earlier smallest state.
      - text: "A square smaller than the smallest shown"
        rationale: |
          This extends shrinking beyond the established sizes. Shrinking occurs at the start. Check the later return to larger sizes.
    explanation: |
      Sizes decrease large, medium, small, then increase medium, large. This back-and-forth cycle next returns to medium.
    approved: true
  - id: "q-spatial-abstract-reasoning-figure-series-0009"
    type: "figure-series"
    difficulty: "hard"
    figure: "figure-series-09"
    figureSpec:
      kind: "figure-series"
      items:
        - form: "star"
          dots: 1
          size: "small"
        - form: "star"
          dots: 2
          size: "large"
        - form: "star"
          dots: 3
          size: "small"
      blank: true
    stem: |
      Which figure best continues the simplest consistent pattern shown?
    choices:
      - text: "Large star with four dots"
        correct: true
      - text: "Small star with four dots"
        rationale: |
          This tracks count but repeats size. Four follows three. Check the separate small-large alternation.
      - text: "Large star with three dots"
        rationale: |
          This tracks size but freezes count. Large follows small. Check the increasing dot track.
      - text: "Large star with two dots"
        rationale: |
          This returns to the second count while changing size correctly. The second figure was also large. Check that matching size does not restart dot count.
    explanation: |
      Dot counts increase one at a time while size alternates small and large. After three dots and small size, both tracks continue to four dots and large size.
    approved: true
  - id: "q-spatial-abstract-reasoning-figure-series-0010"
    type: "figure-series"
    difficulty: "hard"
    figure: "figure-series-10"
    figureSpec:
      kind: "figure-series"
      items:
        - form: "square"
          arrow: "up"
        - form: "square"
          arrow: "right"
        - form: "square"
          arrow: "up"
        - form: "square"
          arrow: "right"
      blank: true
    stem: |
      Which figure best continues the simplest consistent pattern shown?
    choices:
      - text: "Arrow pointing up"
        correct: true
      - text: "Arrow pointing down"
        rationale: |
          This assumes continuous clockwise rotation. The first turn was clockwise. Check the return to up in the third figure.
      - text: "Arrow pointing right"
        rationale: |
          This repeats the last arrow. Right appears twice. Check the alternating transitions.
      - text: "Arrow pointing left"
        rationale: |
          This extends a four-direction cycle that is not shown. Left is a possible compass direction. Verify a proposed cycle against every displayed state.
    explanation: |
      The arrow alternates up and right. Both up-to-right transitions match, with right-to-up between them. The next arrow returns to up.
    approved: true
  - id: "q-spatial-abstract-reasoning-figure-series-0011"
    type: "figure-series"
    difficulty: "hard"
    figure: "figure-series-11"
    figureSpec:
      kind: "figure-series"
      items:
        - form: "square"
          fill: 0.25
        - form: "square"
          fill: 0.5
        - form: "square"
          fill: 0.75
        - form: "square"
          fill: 0.25
        - form: "square"
          fill: 0.5
      blank: false
    stem: |
      Continue the shown fill cycle for two further figures. What fill appears in the second further figure?
    choices:
      - text: "Quarter-filled square"
        correct: true
      - text: "Fully filled square"
        rationale: |
          This keeps increasing after three-quarters. The first three states increase. Check the restart already visible in the fourth state.
      - text: "Half-filled square"
        rationale: |
          This repeats the last displayed fill after two steps. Half is the most recent state. Count both transitions in the three-state cycle.
      - text: "Three-quarter-filled square"
        rationale: |
          This takes one step instead of two. Three-quarters follows half. Check the requested second further state.
    explanation: |
      The fill levels repeat quarter, half, three-quarters, quarter, half. After the shown half state, the next is three-quarters; the following one is quarter.
    approved: true
  - id: "q-spatial-abstract-reasoning-figure-series-0012"
    type: "figure-series"
    difficulty: "hard"
    figure: "figure-series-12"
    figureSpec:
      kind: "figure-series"
      items:
        - form: "circle"
        - form: "triangle"
        - form: "square"
        - form: "circle"
        - form: "triangle"
      blank: true
    stem: |
      Which figure best continues the simplest consistent pattern shown?
    choices:
      - text: "Square"
        correct: true
      - text: "Circle"
        rationale: |
          This restarts the group one step too soon. Circle begins each group. Check which position follows the triangle.
      - text: "Triangle"
        rationale: |
          This repeats the last outline. Triangle appears twice. Compare the three-shape group already completed.
      - text: "Pentagon"
        rationale: |
          This assumes increasing sides rather than a repeated group. A square can lead to a pentagon in another pattern. Check the return to circle in this series.
    explanation: |
      The outlines repeat circle, triangle, square, then circle and triangle again. The next outline completes the repeated group with a square.
    approved: true
  - id: "q-spatial-abstract-reasoning-figure-series-0013"
    type: "figure-series"
    difficulty: "hard"
    figure: "figure-series-13"
    figureSpec:
      kind: "figure-series"
      items:
        - form: "triangle"
          size: "small"
          edgeLines: 1
          line: 0
        - form: "square"
          size: "medium"
          edgeLines: 2
          line: 90
        - form: "triangle"
          size: "small"
          edgeLines: 1
          line: 180
      blank: true
    stem: |
      Which figure best continues the simplest consistent pattern shown?
    choices:
      - text: "Medium square; line left; four edge lines"
        correct: true
      - text: "Medium square; line left; three edge lines"
        rationale: |
          This follows outline, size, and direction but freezes edge-line count. Three features are correct. Check the count rising by one each time.
      - text: "Small square; line left; four edge lines"
        rationale: |
          This follows the other tracks but retains the triangle's small size. Small is the latest state. Check the alternating size track.
      - text: "Medium triangle; line down; four edge lines"
        rationale: |
          This changes size and edge count but freezes outline and line. Two changes are correct. Check all four feature tracks.
    explanation: |
      The outlines alternate triangle and square, and sizes alternate small and medium. The internal line turns clockwise by 90 degrees while edge-line counts increase by one. Together the next state is a medium square with a left-pointing line and four edge lines.
    approved: true
  - id: "q-spatial-abstract-reasoning-figure-series-0014"
    type: "figure-series"
    difficulty: "hard"
    figure: "figure-series-14"
    figureSpec:
      kind: "figure-series"
      items:
        - form: "square"
          dot: "top-left"
          edgeLines: 1
        - form: "square"
          dot: "top-right"
          edgeLines: 2
        - form: "square"
          dot: "bottom-right"
          edgeLines: 3
        - form: "square"
          dot: "bottom-left"
          edgeLines: 4
      blank: true
    stem: |
      Which figure best continues the simplest consistent pattern shown?
    choices:
      - text: "Top-left dot; five edge lines"
        correct: true
      - text: "Bottom-left dot; five edge lines"
        rationale: |
          This increments lines but freezes the dot. Bottom-left is its last location. Continue the separate four-corner cycle.
      - text: "Top-left dot; four edge lines"
        rationale: |
          This moves the dot correctly but freezes line count. Four is the last count. Check each count increase.
      - text: "Top-right dot; five edge lines"
        rationale: |
          This skips the return to top-left. Top-right is a known corner in the cycle. Take only one corner step from bottom-left.
    explanation: |
      The dot visits the four corners clockwise and returns to top-left. Bottom-edge line counts rise from one to four, so the next has five. Both changes continue together.
    approved: true
  - id: "q-spatial-abstract-reasoning-figure-series-0015"
    type: "figure-series"
    difficulty: "easy"
    figure: "figure-series-15"
    figureSpec:
      kind: "figure-series"
      items:
        - form: "pentagon"
          fill: "black"
        - form: "pentagon"
          fill: "black"
        - form: "pentagon"
          fill: "white"
        - form: "pentagon"
          fill: "black"
        - form: "pentagon"
          fill: "black"
      blank: true
    stem: |
      Which figure best continues the simplest consistent pattern shown?
    choices:
      - text: "White pentagon"
        correct: true
      - text: "Black pentagon"
        rationale: |
          This assumes fill remains black after consecutive black figures. The last two are black. Compare them with the first completed group.
      - text: "Half-filled pentagon"
        rationale: |
          This averages the two fill states. Black and white both occur. Check the repeated three-position grouping.
      - text: "White circle"
        rationale: |
          This follows fill but changes the constant outline. White occurs in the cycle. Check which feature never changes.
    explanation: |
      The fill repeats two black figures followed by one white figure. The next completes the second group as white. The outline stays a pentagon.
    approved: false
  - id: "q-spatial-abstract-reasoning-figure-series-0016"
    type: "figure-series"
    difficulty: "medium"
    figure: "figure-series-16"
    figureSpec:
      kind: "figure-series"
      items:
        - form: "square"
          dots: 0
          edgeLines: 3
        - form: "square"
          dots: 1
          edgeLines: 2
        - form: "square"
          dots: 2
          edgeLines: 1
      blank: true
    stem: |
      Which figure best continues the simplest consistent pattern shown?
    choices:
      - text: "Three dots; zero edge lines"
        correct: true
      - text: "Three dots; one edge line"
        rationale: |
          This adds a dot but holds the edge count. Dot count is rising. Check the matching decrease in edge lines.
      - text: "Two dots; zero edge lines"
        rationale: |
          This decreases edge count but holds dot count. The last dot count is two. Track both counts.
      - text: "Three dots; three edge lines"
        rationale: |
          This restarts the edge count while continuing dots. Three appeared at the start. Check the constant total of the two counts.
    explanation: |
      At each step one edge line is removed and one dot added. The shown counts are zero and three, then one and two, then two and one. The next state has three dots and no edge lines.
    approved: false
  - id: "q-spatial-abstract-reasoning-figure-series-0017"
    type: "figure-series"
    difficulty: "hard"
    figure: "figure-series-17"
    figureSpec:
      kind: "figure-series"
      items:
        - form: "circle"
          dots: 1
        - form: "square"
          dots: 4
        - form: "circle"
          dots: 2
        - form: "square"
          dots: 4
      blank: true
    stem: |
      Which figure best continues the simplest consistent pattern shown?
    choices:
      - text: "Circle with three dots"
        correct: true
      - text: "Square with four dots"
        rationale: |
          This continues the square subsequence immediately. The last figure is a square. Separate odd and even positions.
      - text: "Circle with five dots"
        rationale: |
          This counts all figures as one increasing sequence. Five is the next position number. Compare only the previous circles' dot counts.
      - text: "Circle with four dots"
        rationale: |
          This copies the square's dot count into the circle track. Four appears on both squares. Check the circle-only sequence.
    explanation: |
      The outlines alternate circle and square. Within circle positions, dots increase from one to two, so the next circle has three. Square positions keep four dots.
    approved: false
  - id: "q-spatial-abstract-reasoning-figure-series-0018"
    type: "figure-series"
    difficulty: "hard"
    figure: "figure-series-18"
    figureSpec:
      kind: "figure-series"
      items:
        - form: "square"
          fill: 0.75
          line: 0
          dots: 1
        - form: "square"
          fill: 0.5
          line: 90
          dots: 2
        - form: "square"
          fill: 0.75
          line: 0
          dots: 3
        - form: "square"
          fill: 0.5
          line: 90
          dots: 4
      blank: true
    stem: |
      All choices below would have five dots. Which fill and line direction complete the shown pattern?
    choices:
      - text: "Three-quarter-filled square; line up"
        correct: true
      - text: "Half-filled square; line up"
        rationale: |
          This continues the line but holds fill at the last state. Half is the latest fill. Check the alternating half and three-quarter track.
      - text: "Three-quarter-filled square; line right"
        rationale: |
          This follows fill but freezes line direction. Right is the last line. Check the alternating up-right track.
      - text: "Fully filled square; line up"
        rationale: |
          This assumes cumulative fill growth. Partial fill states occur. Compare the repeated fill levels rather than adding them.
    explanation: |
      The squares have a constant half fill and then a three-quarter fill in alternating positions. Their lines switch between up and right, while dot count increases. The next state has three-quarter fill, an up line, and five dots.
    approved: false
  - id: "q-spatial-abstract-reasoning-figure-series-0019"
    type: "figure-series"
    difficulty: "exam"
    figure: "figure-series-19"
    figureSpec:
      kind: "figure-series"
      items:
        - form: "triangle"
          size: "small"
          line: 0
        - form: "triangle"
          size: "medium"
          line: 45
        - form: "triangle"
          size: "large"
          line: 90
        - form: "triangle"
          size: "small"
          line: 135
        - form: "triangle"
          size: "medium"
          line: 180
      blank: true
    stem: |
      Which figure best continues the simplest consistent pattern shown?
    choices:
      - text: "Large triangle; line lower-left"
        correct: true
      - text: "Large triangle; line upper-left"
        rationale: |
          This turns 90 degrees instead of 45 from the last direction. Upper-left is a later diagonal on the route. Check the unchanged 45-degree step.
      - text: "Small triangle; line lower-left"
        rationale: |
          This gets rotation but resets size to small one step early. Small begins the size cycle. Check the medium size of the last figure.
      - text: "Large triangle; line down"
        rationale: |
          This gets size but freezes line. Down is the latest direction. Apply the next 45-degree turn.
    explanation: |
      Triangle size repeats small, medium, large, small, medium, so the next size is large. The line turns 45 degrees clockwise each time, reaching down in the fifth figure. Its next direction is lower-left.
    approved: false
  - id: "q-spatial-abstract-reasoning-figure-series-0020"
    type: "figure-series"
    difficulty: "exam"
    figure: "figure-series-20"
    figureSpec:
      kind: "figure-series"
      items:
        - form: "square"
          size: "medium"
          dot: "top-left"
          line: 90
        - form: "square"
          size: "large"
          dot: "top-right"
          line: 0
        - form: "square"
          size: "medium"
          dot: "bottom-right"
          line: 90
        - form: "square"
          size: "large"
          dot: "bottom-left"
          line: 0
      blank: true
    stem: |
      Which figure best continues the simplest consistent pattern shown?
    choices:
      - text: "Medium square; dot top-left; line right"
        correct: true
      - text: "Large square; dot top-left; line right"
        rationale: |
          This follows dot and line but freezes size. Two correct tracks can distract from the third. Check the alternating medium-large sizes.
      - text: "Medium square; dot bottom-left; line right"
        rationale: |
          This follows size and line but freezes the dot. Bottom-left is its latest position. Continue around one more corner.
      - text: "Medium square; dot top-left; line up"
        rationale: |
          This follows size and dot but freezes line direction. Up is the last direction. Check the right-up alternation.
    explanation: |
      Size alternates medium and large, so the next is medium. The dot moves clockwise through corners and returns to top-left. The line alternates right and up, so the next line points right. These tracks combine in one medium square.
    approved: false
