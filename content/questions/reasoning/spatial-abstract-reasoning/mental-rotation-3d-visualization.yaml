      Fold the labeled net into a cube. Which relationship holds between A and B?
    choices:
      - text: "They share an edge."
        correct: true
      - text: "They become opposite faces."
        rationale: |
          This keeps their flat separation. A and B do not share an edge on paper. Check where their free edges meet after folding.
      - text: "They overlap on the same face."
        rationale: |
          This treats meeting as overlap. Both faces rise beside C. Check whether their planes face in different directions.
      - text: "They meet only at one corner."
        rationale: |
          This keeps only their corner contact in the drawing. A corner is where they meet while flat. Check the full vertical edge formed by folding.
    explanation: |
      A and B fold up from neighboring edges of C. Their free edges meet to form a cube edge.
    approved: true
  - id: "q-spatial-abstract-reasoning-mental-rotation-3d-visualization-0009"
    type: "mental-rotation"
    difficulty: "hard"
    figure: "mental-rotation-3d-visualization-09"
