    stem: |
      After folding the labeled net, which list gives the three pairs of opposite faces?
    choices:
      - text: "A and E; B and D; C and F"
        correct: true
      - text: "A and B; C and D; E and F"
        rationale: |
          This pairs neighboring labels. The alphabetical order makes the grouping look neat. Check where the faces point after folding.
      - text: "A and F; B and C; D and E"
        rationale: |
          This pairs faces by positions near the ends of the drawing. Flat distance can look like cube distance. Check whether paired faces share an edge after folding.
      - text: "A and D; B and E; C and F"
        rationale: |
          This keeps C opposite F but mixes the side pairs. The crossed grouping may look balanced on paper. Check which neighbors attach to opposite edges of C.
    explanation: |
      C is the center, and F folds over to face it. A and E rise from opposite edges of C, so they face each other. B and D rise from the other opposite edges and also face each other.
    approved: true
  - id: "q-spatial-abstract-reasoning-mental-rotation-3d-visualization-0014"
