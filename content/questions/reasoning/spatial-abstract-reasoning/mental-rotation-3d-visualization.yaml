          This uses distance across the net. B looks far from F in the drawing. Check whether B shares an edge with F on the cube.
      - text: "E"
        rationale: |
          This mistakes an adjacent face for the opposite face. E directly connects to F. Check whether the faces share an edge.
    explanation: |
      Hold C still and fold E into a side face. F folds over to the face opposite C. Opposite faces stay opposite when the cube turns, so with F at the bottom, C is at the top.
    approved: true
  - id: "q-spatial-abstract-reasoning-mental-rotation-3d-visualization-0012"
    type: "mental-rotation"
    difficulty: "medium"
    stem: |
      A cone rests on its circular base. Parallel light is used in two trials, with each screen perpendicular to the rays. What are the shadows from vertically above and horizontally from the side?
    choices:
      - text: "A circle from above; a triangle from the side"
        correct: true
      - text: "A triangle from above; a circle from the side"
        rationale: |
          This exchanges the viewing directions. The cone has both a round base and a pointed profile. Match each outline to the ray direction.
      - text: "A circle from above; a rectangle from the side"
        rationale: |
          This uses the cylinder's side profile for a cone. Both solids have circular bases. Check whether the width narrows toward a tip.
      - text: "An ellipse from above; a triangle from the side"
        rationale: |
          This assumes an angled top view. Round bases can look oval at a slant. Check that the rays are vertical and the screen horizontal.
    explanation: |
      From above, the cone's circular base defines the outer outline. From the side, the outline runs from the base's ends to the tip and forms a triangle.
    approved: true
  - id: "q-spatial-abstract-reasoning-mental-rotation-3d-visualization-0013"
    type: "mental-rotation"
    difficulty: "hard"
    figure: "mental-rotation-3d-visualization-13"
