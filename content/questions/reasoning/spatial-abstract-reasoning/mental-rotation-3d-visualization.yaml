      - text: "D; a square"
        rationale: |
          This stops at the right-hand side face. D lies on the route from C to F. Check whether the next square folds over the top.
      - text: "A; a rectangle with unequal sides"
        rationale: |
          This chooses a direct neighbor and stretches the outline. A rises from C as a side face. Check both face directions and equal cube edges.
      - text: "E; a diamond with unequal diagonals"
        rationale: |
          This chooses a direct neighbor and uses a slanted view. E is close to C in the drawing. Check the vertical rays and the folded face opposite C.
    explanation: |
      C becomes the bottom. D folds up at its right edge, and F folds across to the top. The cube's top view has four equal sides and right angles, so its shadow is a square.
    approved: true
  - id: "q-spatial-abstract-reasoning-mental-rotation-3d-visualization-0015"
