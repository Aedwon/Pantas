      - text: "A and C overlap."
        rationale: |
          This confuses opposite with overlapping. A and C have one square between them in the strip. Track their directions after two folds.
      - text: "B and D overlap."
        rationale: |
          This treats separated row positions as the same face. B and D face across the cube. Track where each face lands after folding.
      - text: "The row cannot form four side faces."
        rationale: |
          This treats the strip itself as invalid. Four faces in a row can wrap around a cube. Check the end squares for the actual conflict.
    explanation: |
      A through D wrap around four side directions. E and F attach above the strip and both fold toward the same end of the cube. They overlap and leave the other end open.
    approved: false
