        - "F"
    stem: |
      A student proposes the rectangular six-square pattern as a cube net. Which test decides whether it works?
    choices:
      - text: "Track whether all folded faces are distinct."
        correct: true
      - text: "Check only whether six squares are present."
        rationale: |
          This uses the number of faces alone. A cube has six faces, so the matching count looks sufficient. Check the direction reached by each fold.
      - text: "Check only whether all squares are connected."
        rationale: |
          This uses connectedness alone. A net must stay in one piece, so that feels decisive. Check whether faces overlap after folding.
      - text: "Check only whether the pattern is symmetric."
        rationale: |
          This treats symmetry as proof. The rectangle looks orderly and balanced. Check the three-dimensional folds instead of the flat outline.
    explanation: |
      A cube needs one square in each of six face directions. Following the folds tests whether every square reaches a different direction without conflict.
    approved: true
  - id: "q-spatial-abstract-reasoning-mental-rotation-3d-visualization-0010"
    type: "mental-rotation"
    difficulty: "hard"
    stem: |
      Under parallel light perpendicular to a screen, a cylinder can cast a rectangular shadow. What does this show about shadows?
    choices:
      - text: "They show the outline along the rays."
        correct: true
      - text: "They copy one flat face visible from any direction."
        rationale: |
          This confuses a face with the full outline. The cylinder's flat circular ends are easy to recognize. Check the boundary seen along the rays.
      - text: "They show only the surface nearest the screen."
        rationale: |
          This uses distance from the screen to select a surface. Near surfaces seem most likely to cast the shadow. Check the whole outline that blocks the rays.
      - text: "They always retain the shape of the object's base."
        rationale: |
          This preserves the base shape after the viewing direction changes. The circular base names the solid's shape. Check the ray direction before choosing a projection.
    explanation: |
      Trace the boundary of the whole cylinder along the rays. From the side, its height and diameter form a rectangular outline. That outline sets the shadow.
    approved: true
