questions:
  - id: q-spatial-abstract-reasoning-mental-rotation-3d-visualization-0001
    type: mental-rotation
    difficulty: easy
    figure: mental-rotation-3d-visualization-01
    stem: |
      A cross-shaped (plus-sign) net has one central square, with four squares attached to its four sides (up, down, left, right), and one more square attached to the far end of the "up" arm. If the center square becomes the bottom of the cube once folded, which square becomes the top?
    choices:
      - text: The square at the far end of the vertical arm, beyond the immediate "up" neighbor
        correct: true
      - text: The square attached to the "down" side of the center
      - text: The square attached to the "left" side of the center
      - text: The immediate "up" neighbor square itself
    explanation: |
      The center square becomes the bottom, and its four immediate neighbors fold up to become the four side faces. The square at the far end of the vertical arm folds all the way over to become the face opposite the bottom — the top.
    approved: true

  - id: q-spatial-abstract-reasoning-mental-rotation-3d-visualization-0002
    type: mental-rotation
    difficulty: medium
    figure: mental-rotation-3d-visualization-02
    stem: |
      A flat pattern has 6 squares arranged with 4 in a straight horizontal row, and 2 more squares both attached to the top of the same square (the second square in the row), stacked directly on top of each other. Does this net fold into a valid cube?
    choices:
      - text: No — the two squares both attached to the top of the same square would both attempt to occupy the same face position when folded, causing an overlap
        correct: true
      - text: Yes — any arrangement of exactly 6 connected squares always folds into a valid cube
      - text: Yes — since there are exactly 6 squares, no overlap is possible
      - text: No — but only because this arrangement has more than 6 squares
    explanation: |
      A valid cube net needs each of its 6 squares to fold into a different face, with no overlaps. Here, two separate squares are both attached to the top of the same square in the row, so when folded, both would attempt to occupy the same face position, causing an overlap.
    approved: true

  - id: q-spatial-abstract-reasoning-mental-rotation-3d-visualization-0003
    type: mental-rotation
    difficulty: medium
    figure: mental-rotation-3d-visualization-03
    stem: |
      A solid cylinder (like a can) stands upright, with light shining straight down from directly above it. What shape is the shadow cast on the ground?
    choices:
      - text: A circle
        correct: true
      - text: A rectangle
      - text: A triangle
      - text: A square
    explanation: |
      Since the light comes from directly above, the shadow shows the cylinder's outline as seen from directly above — only its circular top face outline, since the sides are hidden directly beneath it. The shadow is a circle.
    approved: true

  - id: q-spatial-abstract-reasoning-mental-rotation-3d-visualization-0004
    type: mental-rotation
    difficulty: medium
    figure: mental-rotation-3d-visualization-04
    stem: |
      The same upright cylinder now has light shining from directly the side (horizontally), rather than from above. What shape is the shadow cast on a wall behind it?
    choices:
      - text: A rectangle
        correct: true
      - text: A circle
      - text: A triangle
      - text: An oval
    explanation: |
      Light from the side reveals the cylinder's outline as seen from that side. Viewed from the side, a cylinder's outline is a rectangle (the height and diameter define the rectangle's two dimensions), not a circle.
    approved: true

  - id: q-spatial-abstract-reasoning-mental-rotation-3d-visualization-0005
    type: mental-rotation
    difficulty: medium
    figure: mental-rotation-3d-visualization-05
    stem: |
      A solid cube sits on a table, with light shining straight down from directly above it. What shape is the shadow cast on the table?
    choices:
      - text: A square
        correct: true
      - text: A circle
      - text: A triangle
      - text: A rectangle wider than it is tall
    explanation: |
      Looking straight down at a cube, you see only its square top face outline, since the sides are hidden directly beneath that square cross-section. The shadow is a square.
    approved: true

  - id: q-spatial-abstract-reasoning-mental-rotation-3d-visualization-0006
    type: mental-rotation
    difficulty: medium
    figure: mental-rotation-3d-visualization-06
    stem: |
      A solid sphere (like a ball) has light shining on it from any direction. What shape is the shadow cast, regardless of the light's direction?
    choices:
      - text: A circle, since a sphere's outline looks the same from every viewing angle
        correct: true
      - text: A shape that changes depending on the light's direction, since a sphere has many different faces
      - text: A square, since spheres always cast square shadows
      - text: No shadow at all, since spheres do not block light
    explanation: |
      A sphere's outline is a circle from every possible viewing angle, unlike a cylinder or cube, so its shadow is always a circle regardless of the light's direction.
    approved: true

  - id: q-spatial-abstract-reasoning-mental-rotation-3d-visualization-0007
    type: mental-rotation
    difficulty: medium
    figure: mental-rotation-3d-visualization-07
    stem: |
      A flat pattern has 6 squares arranged in a single straight horizontal row (a 1-by-6 strip, with each square attached only to its immediate left and right neighbors). Does this net fold into a valid cube?
    choices:
      - text: No — folding this strip sequentially, the fifth square would land back on the same face position as the first square, causing an overlap
        correct: true
      - text: Yes — a straight row of 6 squares always folds into a valid cube
      - text: Yes — since all 6 squares are connected in a single line, no overlap is possible
      - text: No — but only because a straight row can never contain exactly 6 squares
    explanation: |
      Folding a straight 1-by-6 strip one square at a time (each fold turning 90°) wraps back around: the fifth square ends up occupying the same face position as the first square, causing an overlap. A straight strip of 6 squares is not a valid cube net.
    approved: true

  - id: q-spatial-abstract-reasoning-mental-rotation-3d-visualization-0008
    type: mental-rotation
    difficulty: hard
    figure: mental-rotation-3d-visualization-08
    stem: |
      In a cross-shaped net, the "up" neighbor and the "left" neighbor of the center square do not touch each other in the flat net (each only touches the center directly). A student assumes that since these two squares are not touching in the flat net, they must also not be touching (not adjacent) as faces once the cube is folded. Is this assumption correct?
    choices:
      - text: No — squares that are not touching in the flat net can still become adjacent (edge-sharing) faces once folded; the "up" and "left" side faces, though not touching in the net, end up sharing an edge on the folded cube.
        correct: true
      - text: Yes — two squares that do not touch in the flat net can never become adjacent faces after folding.
      - text: Yes — but only because side faces are never adjacent to each other on a real cube.
      - text: No — but only because the "up" and "left" squares are actually the same square.
    explanation: |
      Squares that are not touching in the flat net are not necessarily still separate once folded — carefully trace the actual fold, since "far apart" squares in the net can become adjacent faces on the cube, since every side face of a cube shares an edge with its neighboring side faces.
    approved: true

  - id: q-spatial-abstract-reasoning-mental-rotation-3d-visualization-0009
    type: mental-rotation
    difficulty: hard
    figure: mental-rotation-3d-visualization-09
    stem: |
      A student sees any arrangement of 6 connected squares and assumes it must automatically fold into a valid cube, since "a cube has 6 faces, and this net has 6 squares." Is this assumption correct?
    choices:
      - text: No — having exactly 6 squares is necessary but not sufficient for a valid net; the specific arrangement must also avoid any folding conflict, such as two squares competing for the same face position.
        correct: true
      - text: Yes — any 6 connected squares, arranged in any pattern, always fold into a valid cube.
      - text: Yes — but only if the 6 squares are arranged in a perfect circle.
      - text: No — but only because a cube actually has more than 6 faces.
    explanation: |
      Not every arrangement of 6 connected squares folds into a proper cube — some arrangements (like two squares both branching off the same face) cause faces to overlap instead of covering distinct sides. The square count alone does not guarantee validity.
    approved: true

  - id: q-spatial-abstract-reasoning-mental-rotation-3d-visualization-0010
    type: mental-rotation
    difficulty: hard
    figure: mental-rotation-3d-visualization-10
    stem: |
      A student assumes a cylinder's shadow, no matter the light's direction, must always match one of the cylinder's actual flat surfaces (its circular top or bottom). Given that a cylinder's side is curved, not flat, is this assumption correct?
    choices:
      - text: No — a shadow shows the silhouette from the light's specific viewing angle, which may look completely different from any single flat face; a cylinder's side-on shadow is a rectangle, even though the cylinder has no flat rectangular face at all.
        correct: true
      - text: Yes — a shadow always exactly matches one of the object's existing flat faces.
      - text: Yes — but only because cylinders do not have curved surfaces.
      - text: No — but only because cylinders cannot cast shadows at all.
    explanation: |
      A shadow shows the silhouette from the light's specific viewing angle, which may look completely different from any single flat face of the actual 3D object. A cylinder has no flat rectangular side face at all, yet its side-on shadow is a rectangle — always reason from the viewing angle, not from assuming the shadow copies an existing face shape.
    approved: true

  - id: q-spatial-abstract-reasoning-mental-rotation-3d-visualization-0011
    type: mental-rotation
    difficulty: medium
    figure: mental-rotation-3d-visualization-11
    stem: |
      A T-shaped net has 4 squares in a vertical column, with 2 more squares attached to the sides of the second square from the top (one on the left, one on the right). If the bottom square of the vertical column becomes the bottom of the cube once folded, which square becomes the top?
    choices:
      - text: The top square of the vertical column (the square farthest from the bottom, at the far end of the column)
        correct: true
      - text: The square attached to the left side of the second-from-top square
      - text: The square attached to the right side of the second-from-top square
      - text: The second square from the bottom of the column
    explanation: |
      When folding a column of 4 squares with 2 side squares attached partway up, the square at the far end of the column (opposite the bottom, with one square directly between them in a straight line) becomes the top, following the "one square between them in a straight line" rule for opposite faces.
    approved: true

  - id: q-spatial-abstract-reasoning-mental-rotation-3d-visualization-0012
    type: mental-rotation
    difficulty: medium
    figure: mental-rotation-3d-visualization-12
    stem: |
      A solid cone (like an ice cream cone shape, pointed at the top, circular at the base) sits with its circular base on a table. Light shines straight down from above, and separately, light shines from directly the side. What shape is the shadow in each case?
    choices:
      - text: From above, a circle (matching the circular base); from the side, a triangle (matching the cone's pointed profile)
        correct: true
      - text: From above, a triangle; from the side, a circle
      - text: A circle from both directions, since cones always cast circular shadows
      - text: A triangle from both directions, since cones always cast triangular shadows
    explanation: |
      From directly above, you see the cone's circular base outline, since the pointed top is directly above the center of that circle — a circular shadow. From the side, you see the cone's tapering profile — a triangular shadow.
    approved: true

  - id: q-spatial-abstract-reasoning-mental-rotation-3d-visualization-0013
    type: mental-rotation
    difficulty: hard
    figure: mental-rotation-3d-visualization-13
    stem: |
      In the same cross-shaped net as before (center square as bottom, four immediate neighbors as sides, and one far-end square on the vertical arm as the top), which two faces are opposite each other among the four side faces (up, down, left, right neighbors of the center)?
    choices:
      - text: The "up" neighbor and the "down" neighbor are opposite each other; the "left" neighbor and the "right" neighbor are opposite each other
        correct: true
      - text: The "up" neighbor and the "left" neighbor are opposite each other; the "down" neighbor and the "right" neighbor are opposite each other
      - text: All four side faces are opposite each other simultaneously
      - text: None of the four side faces are opposite any other face
    explanation: |
      Once folded into a cube, opposite faces come from squares with exactly one square directly between them in a straight line within the net. The "up" and "down" neighbors sit in a straight vertical line with the center between them, and the "left" and "right" neighbors sit in a straight horizontal line with the center between them — making each of those pairs opposite faces.
    approved: true

  - id: q-spatial-abstract-reasoning-mental-rotation-3d-visualization-0014
    type: mental-rotation
    difficulty: exam
    figure: mental-rotation-3d-visualization-14
    stem: |
      A flat pattern has 6 squares: a central square, with four squares attached to its four sides (forming the same cross shape as before), but this time, the fifth "extra" square is attached to the far end of the "right" arm instead of the "up" arm. If the center square becomes the bottom, and light later shines straight down onto the assembled cube's top face, what shape is the shadow, and which square in the net became the face casting it?
    choices:
      - text: The shadow is a square (matching the flat top face of the cube), and the square at the far end of the "right" arm became the top face, since it is now the square with exactly one square (the center) directly between it and the center in a straight line.
        correct: true
      - text: The shadow is a circle, and the square attached to the "up" side of the center became the top face.
      - text: The shadow is a square, and the square attached to the "down" side of the center became the top face.
      - text: The shadow is a triangle, and no square in the net becomes the top face.
    explanation: |
      Moving the "extra" far-end square to the "right" arm changes which face becomes the top: it is now the far-end square on that arm (following the same "one square between them in a straight line" rule), not the "up" neighbor. Since a cube's top face is flat and square, its top-down shadow is a square.
    approved: true
