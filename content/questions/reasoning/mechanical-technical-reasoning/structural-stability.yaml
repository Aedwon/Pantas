meta:
  subject: "reasoning"
  topic: "mechanical-technical-reasoning"
  subtopic: "structural-stability"
  exams:
    - "dost-sei"
questions:
  - id: "q-mechanical-technical-reasoning-structural-stability-0001"
    type: "structural-stability"
    difficulty: "easy"
    stem: |
      The dot in the shown uniform box represents the point through which its resultant gravitational force acts. What is this point called?
    choices:
      - text: "Center of gravity"
        correct: true
      - text: "Base of support"
        rationale: |
          This confuses a force location with a supporting area. Both affect tipping. Check whether the marked feature is a point or a ground region.
      - text: "Fulcrum"
        rationale: |
          This confuses the weight point with a rotation support. Both can be involved in balance. Check whether the point belongs to the object's weight or its external support.
      - text: "Tipping threshold"
        rationale: |
          This confuses a location with a limit of tilt. The dot helps predict tipping. Check whether the question asks for a point or a condition.
    explanation: |
      An object's weight can be treated as one force acting through its center of gravity. The dot marks that point.
    approved: true
    figure: "structural-stability-01"
    figureSpec:
      kind: "stability-shape"
      shapes:
        - form: "box"
          baseWidth: 2
          height: 3
  - id: "q-mechanical-technical-reasoning-structural-stability-0002"
    type: "structural-stability"
    difficulty: "easy"
    stem: |
      For the box shown resting flat on the ground, what is the region bounded by its supporting contact points called?
    choices:
      - text: "Base of support"
        correct: true
      - text: "Center of gravity"
        rationale: |
          This names the weight point instead of the contact region. Both determine stability. Check whether the stem asks about the object's weight or ground contacts.
      - text: "Pivot axis"
        rationale: |
          This names the rotation line used during tipping. A base edge can become that axis. Check whether the whole contact region or one edge is requested.
      - text: "Moment arm"
        rationale: |
          This names a distance from a pivot to a force line. That distance also affects tipping. Check that the requested feature is an area.
    explanation: |
      The supporting contacts bound a region. That region is the base of support used to test whether the weight line is supported.
    approved: true
    figure: "structural-stability-02"
    figureSpec:
      kind: "stability-shape"
      shapes:
        - form: "box"
          baseWidth: 2
          height: 3
  - id: "q-mechanical-technical-reasoning-structural-stability-0003"
    type: "structural-stability"
    difficulty: "medium"
    stem: |
      For the shown rigid box at rest on a level support, with gravity and contact forces only, which condition gives a restoring tendency against a small tip?
    choices:
      - text: "Weight line inside the support boundary"
        correct: true
      - text: "Weight line exactly at the support edge"
        rationale: |
          This treats the tipping threshold as a restoring margin. The line is still at a contact boundary. Check whether gravity has any turning arm at that edge.
      - text: "Weight line outside the support boundary"
        rationale: |
          This reverses the gravity torque direction. The object still touches one edge. Check which side of that edge contains the weight line.
      - text: "Weight line anywhere above the ground"
        rationale: |
          This treats height above the floor as sufficient support. Every raised center is above the floor. Check the horizontal position relative to the contact boundary.
    explanation: |
      With the vertical weight line inside the support boundary, gravity acts on the restoring side of a prospective pivot edge. It tends to bring a slightly tilted box back toward its flat base.
    approved: true
    figure: "structural-stability-03"
    figureSpec:
      kind: "stability-shape"
      shapes:
        - form: "box"
          baseWidth: 2
          height: 3
  - id: "q-mechanical-technical-reasoning-structural-stability-0004"
    type: "structural-stability"
    difficulty: "medium"
    stem: |
      The figure compares a short, wide object on the left with a tall, narrow one on the right. Their mass distributions are similar. Which requires a greater slow tilt to reach its tipping threshold on level ground?
    choices:
      - text: "The left object"
        correct: true
      - text: "The right object"
        rationale: |
          This treats greater height as greater tipping resistance. The right object looks larger vertically. Compare its center height and narrower support.
      - text: "They require equal tilt because their weights match"
        rationale: |
          This uses total weight alone to decide tipping angle. Equal weights seem like equal stability. Check the different base widths and center heights.
      - text: "Their tilt limits depend only on material density"
        rationale: |
          This treats density as the sole cause of stability. The objects have similar materials. Check their different geometry and weight-line positions.
    explanation: |
      The left object has a wider base and a lower center of gravity. Both allow a greater tilt before its weight line reaches the pivot edge. It therefore has the larger static tipping margin.
    approved: true
    figure: "structural-stability-04"
    figureSpec:
      kind: "stability-shape"
      shapes:
        - form: "pyramid"
          baseWidth: 3
          height: 1
        - form: "pyramid"
          baseWidth: 1
          height: 3
  - id: "q-mechanical-technical-reasoning-structural-stability-0005"
    type: "structural-stability"
    difficulty: "medium"
    stem: |
      The shown box is tilted slowly about its lower right edge without slipping. At the tipping threshold, where is the vertical line through its center of gravity?
    choices:
      - text: "Through the pivot edge"
        correct: true
      - text: "Through the top corner"
        rationale: |
          This uses a visible corner unrelated to ground support. The top moves most during tilting. Check which edge acts as the pivot.
      - text: "Halfway between center and pivot"
        rationale: |
          This treats half the shift as the threshold. Halfway sounds like a balance point. Check when the weight's turning arm about the pivot becomes zero.
      - text: "Through the original base center at every tilt"
        rationale: |
          This assumes the weight line moves with the base center. Both belong to the box. Check that gravity stays vertical as the box rotates.
    explanation: |
      At the threshold the weight line passes through the pivot edge. Gravity then has zero turning arm about that edge. Continuing the tilt carries the line onto the overturning side.
    approved: true
    figure: "structural-stability-05"
    figureSpec:
      kind: "stability-shape"
      shapes:
        - form: "box"
          baseWidth: 2
          height: 3
      tilt: 22
  - id: "q-mechanical-technical-reasoning-structural-stability-0006"
    type: "structural-stability"
    difficulty: "medium"
    stem: |
      The two truck profiles shown represent equal secured cargo masses with equal track widths. Other turning conditions match. Which arrangement generally resists rollover better?
    choices:
      - text: "The lower cargo on the right"
        correct: true
      - text: "The higher cargo on the left"
        rationale: |
          This treats taller stacking as added stability. The taller stack may look substantial. Check its effect on the height of the combined center of mass.
      - text: "Both, because their total cargo masses match"
        rationale: |
          This compares only total mass. The loads weigh the same. Check how their vertical distribution changes the turning effect.
      - text: "The left, because taller loads need a greater turn angle"
        rationale: |
          This imports a visual height assumption into cornering. The cargo rises farther above the road. Compare the overturning effect under the same lateral acceleration.
    explanation: |
      Lower cargo lowers the combined center of mass. Under the same sideways acceleration, this reduces the overturning effect and side-to-side load transfer. It generally improves rollover resistance.
    approved: true
    figure: "structural-stability-06"
    figureSpec:
      kind: "stability-shape"
      shapes:
        - form: "truck"
          baseWidth: 2
          height: 3
        - form: "truck"
          baseWidth: 2
          height: 1
  - id: "q-mechanical-technical-reasoning-structural-stability-0007"
    type: "structural-stability"
    difficulty: "medium"
    stem: |
      The two shown stances belong to the same person. The person changes only sideways foot spacing and remains still. Which stance gives more room for a slow sideways shift of the weight line before it crosses the support boundary?
    choices:
      - text: "The wider stance on the right"
        correct: true
      - text: "The narrower stance on the left"
        rationale: |
          This treats closer contacts as a stronger support region. The feet look more concentrated. Check the distance from the weight line to a side boundary.
      - text: "Both, because the person's mass is unchanged"
        rationale: |
          This ignores the changed contact region. The person weighs the same. Compare the width bounded by the feet.
      - text: "The left, because shorter foot spacing lowers gravity"
        rationale: |
          This confuses stance width with gravity strength. The body position changes. Check that changing foot spacing does not change the gravitational field.
    explanation: |
      The wider stance increases the sideways base of support. The weight line can shift farther sideways before reaching its boundary. This improves the stated slow sideways stability.
    approved: true
    figure: "structural-stability-07"
    figureSpec:
      kind: "stability-shape"
      shapes:
        - form: "person"
          baseWidth: 1
          height: 3
        - form: "person"
          baseWidth: 3
          height: 3
  - id: "q-mechanical-technical-reasoning-structural-stability-0008"
    type: "structural-stability"
    difficulty: "hard"
    stem: |
      Two boxes in the figure have opposing advantages: the left has a lower center of gravity but a narrower base, and the right a higher center but a wider base. Why does center height alone fail to decide their slow-tipping comparison?
    choices:
      - text: "Base width also affects the tipping margin"
        correct: true
      - text: "Base width determines the mass of every box"
        rationale: |
          This assumes width fixes total weight. Wider boxes can contain more material. Check that mass distribution can vary independently.
      - text: "Lower centers prevent every possible tip"
        rationale: |
          This treats one favorable factor as a guarantee. A lower center often helps. Check whether a finite support boundary can still be crossed.
      - text: "Greater height always cancels greater width"
        rationale: |
          This assumes all changes cancel without comparing size. Each box has one advantage. Check the relative center heights and support widths.
    explanation: |
      A lower center reduces the sideways shift caused by a tilt. A wider base gives that shift more room before the edge is reached. Both factors are needed when they change in opposite directions.
    approved: true
    figure: "structural-stability-08"
    figureSpec:
      kind: "stability-shape"
      shapes:
        - form: "box"
          baseWidth: 1
          height: 1
        - form: "box"
          baseWidth: 3
          height: 3
  - id: "q-mechanical-technical-reasoning-structural-stability-0009"
    type: "structural-stability"
    difficulty: "hard"
    stem: |
      The shown box is rebuilt with twice the mass but unchanged shape and relative mass distribution. Under slow tilting about the same edge, how does its critical tipping angle change?
    choices:
      - text: "It stays the same"
        correct: true
      - text: "It doubles"
        rationale: |
          This treats greater mass as doubling geometric stability. The weight doubles. Check whether the center or support boundary moved.
      - text: "It halves"
        rationale: |
          This treats greater gravity force as requiring half the tilt. The downward force grows. Check that the zero-torque edge condition depends on the weight line location.
      - text: "It becomes zero"
        rationale: |
          This assumes heavier objects must tip immediately. The load has increased. Check whether its weight line still starts inside the support region.
    explanation: |
      The center location and support geometry stay unchanged. The weight line reaches the same edge at the same angle. Doubling weight changes torque magnitude but not that geometric threshold.
    approved: true
    figure: "structural-stability-09"
    figureSpec:
      kind: "stability-shape"
      shapes:
        - form: "box"
          baseWidth: 2
          height: 3
  - id: "q-mechanical-technical-reasoning-structural-stability-0010"
    type: "structural-stability"
    difficulty: "hard"
    stem: |
      The uniform box shown is placed first on its broad face and then on a narrower face, making it taller. What explains the change in its static tipping resistance?
    choices:
      - text: "Its center height and support region change"
        correct: true
      - text: "Its material becomes denser"
        rationale: |
          This attributes the change to density. The box looks different after rotation. Check that its material and volume did not change.
      - text: "Its mass changes with orientation"
        rationale: |
          This treats a different resting face as a different weight. The taller position looks larger. Check whether any material was added or removed.
      - text: "The direction of gravity rotates with the box"
        rationale: |
          This lets the force direction follow the object. Its edges rotate. Check that gravity remains vertical in both positions.
    explanation: |
      Changing the resting face changes which contacts form the base and how high the center of gravity sits. These changes alter the tilt needed for the weight line to reach an edge.
    approved: true
    figure: "structural-stability-10"
    figureSpec:
      kind: "stability-shape"
      shapes:
        - form: "box"
          baseWidth: 3
          height: 1
        - form: "box"
          baseWidth: 1
          height: 3
  - id: "q-mechanical-technical-reasoning-structural-stability-0011"
    type: "structural-stability"
    difficulty: "medium"
    stem: |
      A bottom-heavy roly-poly toy (weighted heavily at its rounded base) is pushed over onto its side. Why does it always return to standing upright?
    choices:
      - text: "Its center of gravity is very low (concentrated near its heavy base), so the vertical line from its center of gravity quickly returns within its base of support as it rocks, pulling it back upright"
        correct: true
      - text: "Its base of support is extremely narrow, which always causes objects to return upright"
        rationale: |
          This makes narrow support the cause of self-righting. The toy touches a small area as it rocks. Check whether gravity creates a turning force back toward upright.
      - text: "The toy has no center of gravity, so it cannot tip over in the first place"
        rationale: |
          This removes the center of gravity from the toy. Its unusual rocking motion may suggest unusual gravity. Check that its mass still has a point through which its weight acts.
      - text: "The toy is simply too light to be affected by gravity at all"
        rationale: |
          This assumes small mass is unaffected by gravity. The toy is easy to push. Check that gravity acts on light objects too.
    explanation: |
      For a self-righting toy with its center of gravity below the center of its rounded base, a sideways tilt raises its center of gravity. Gravity then gives a turning force toward the lower-energy upright position. This is the physical reason a properly designed toy rocks back up.
    approved: true
  - id: "q-mechanical-technical-reasoning-structural-stability-0012"
    type: "structural-stability"
    difficulty: "hard"
    stem: |
      The shown truck profiles have the same track width but different center heights. In a sharp turn, which extra effect must be considered beyond the vertical gravity-line test for a motionless vehicle?
    choices:
      - text: "Sideways acceleration and load transfer"
        correct: true
      - text: "Gravity stops acting during the turn"
        rationale: |
          This replaces gravity with cornering effects. The sideways motion is noticeable. Check that weight still acts downward while the vehicle turns.
      - text: "Track width becomes irrelevant"
        rationale: |
          This discards support geometry in a moving case. Acceleration adds another effect. Check that wheel spacing still affects rollover resistance.
      - text: "The vertical weight line alone decides every turn"
        rationale: |
          This applies the motionless test without extra forces. The same truck can stand safely when parked. Check whether it is accelerating sideways.
    explanation: |
      A turning vehicle accelerates sideways. The tire forces and that acceleration transfer load across the vehicle and create an overturning tendency. A static vertical weight line alone does not describe those effects.
    approved: true
    figure: "structural-stability-12"
    figureSpec:
      kind: "stability-shape"
      shapes:
        - form: "truck"
          baseWidth: 2
          height: 3
        - form: "truck"
          baseWidth: 2
          height: 1
  - id: "q-mechanical-technical-reasoning-structural-stability-0013"
    type: "structural-stability"
    difficulty: "hard"
    stem: |
      In the shown wider stance, the feet stay fixed on level ground. As the person slowly leans sideways without stepping, which feature changes first in the static test?
    choices:
      - text: "The center-of-gravity projection"
        correct: true
      - text: "The gravitational field strength"
        rationale: |
          This makes body movement change gravity. Leaning changes the body's position. Check that the local field remains the same.
      - text: "The region bounded by the feet"
        rationale: |
          This assumes leaning automatically moves ground contacts. A person may later step. Check the condition that both feet stay fixed.
      - text: "The total body mass"
        rationale: |
          This treats a posture change as a mass change. More weight may seem to move toward one side. Check that no material is added or removed.
    explanation: |
      Leaning shifts the body's center of gravity sideways. Its vertical projection therefore moves relative to the fixed feet. The contact region stays fixed until a foot moves or lifts.
    approved: true
    figure: "structural-stability-13"
    figureSpec:
      kind: "stability-shape"
      shapes:
        - form: "person"
          baseWidth: 3
          height: 3
  - id: "q-mechanical-technical-reasoning-structural-stability-0014"
    type: "structural-stability"
    difficulty: "hard"
    stem: |
      The shown box is tilted slowly about its lower right edge. Its weight line is still to the left of that pivot. On release without an extra push, what does gravity initially tend to do?
    choices:
      - text: "Turn it back toward its flat base"
        correct: true
      - text: "Turn it farther over the right edge"
        rationale: |
          This places the weight line on the wrong side of the pivot. The box is already tilted. Check the stated side on which gravity acts.
      - text: "Keep it at every chosen tilt angle"
        rationale: |
          This assumes contact with one edge guarantees equilibrium. The box still touches the ground. Check whether gravity has a nonzero moment arm.
      - text: "Move the pivot outward without rotating"
        rationale: |
          This substitutes slipping for tipping. Both involve ground contact. Use the stated fixed-edge slow tilt.
    explanation: |
      The weight acts downward on the inner side of the pivot. It creates a restoring torque about that edge. The initial turning tendency is back toward the flat base.
    approved: true
    figure: "structural-stability-14"
    figureSpec:
      kind: "stability-shape"
      shapes:
        - form: "box"
          baseWidth: 2
          height: 3
      tilt: 15
  - id: "q-mechanical-technical-reasoning-structural-stability-0015"
    type: "structural-stability"
    difficulty: "hard"
    stem: |
      The uniform boxes shown have equal base widths. The left is taller than the right. Both are tilted slowly about corresponding lower edges at the same rate. Which reaches the tipping threshold first?
    choices:
      - text: "The taller box on the left"
        correct: true
      - text: "The shorter box on the right"
        rationale: |
          This reverses the center-height effect. The shorter box has less height to move. Check how much sideways movement a tilt produces at its center.
      - text: "Both at the same time because rates match"
        rationale: |
          This treats equal rates as equal threshold angles. They rotate at the same pace. Compare the different center heights.
      - text: "Neither because both bases are flat"
        rationale: |
          This treats the starting contact as permanent protection. Both begin on level ground. Check how contact changes while the box tilts.
    explanation: |
      For equal base widths, the taller uniform box has a higher center of gravity. Its weight line reaches the pivot edge after a smaller tilt. At equal slow tilt rates it reaches that threshold first.
    approved: true
    figure: "structural-stability-15"
    figureSpec:
      kind: "stability-shape"
      shapes:
        - form: "box"
          baseWidth: 2
          height: 3
        - form: "box"
          baseWidth: 2
          height: 1
  - id: "q-mechanical-technical-reasoning-structural-stability-0016"
    type: "structural-stability"
    difficulty: "easy"
    stem: |
      The dot shown in the uniform symmetric box is at its geometric center. Which condition justifies treating that point as its center of gravity?
    choices:
      - text: "Uniform mass distribution in uniform gravity"
        correct: true
      - text: "Every object has a geometric-center weight point"
        rationale: |
          This extends a symmetric-object result to all objects. The shown box is symmetric. Check whether an irregular or unevenly loaded object has the same symmetry.
      - text: "The dot is halfway up, whatever the contents"
        rationale: |
          This ignores internal mass distribution. Halfway is the geometric center. Check whether heavy contents are concentrated at one end.
      - text: "The object is resting on a perfectly flat floor"
        rationale: |
          This makes the support surface decide the weight point. The floor is flat. Check that the center depends on the object's mass distribution.
    explanation: |
      With mass spread uniformly in a symmetric shape, the opposing mass portions balance about the geometric center. In an approximately uniform gravitational field, the weight acts through that center.
    approved: false
    figure: "structural-stability-16"
    figureSpec:
      kind: "stability-shape"
      shapes:
        - form: "box"
          baseWidth: 2
          height: 3
  - id: "q-mechanical-technical-reasoning-structural-stability-0017"
    type: "structural-stability"
    difficulty: "medium"
    stem: |
      The uniform hollow box shown has its center of gravity in the empty interior. What does this demonstrate about a center of gravity?
    choices:
      - text: "It can lie outside the material"
        correct: true
      - text: "It must be on a solid surface"
        rationale: |
          This requires the weight point to touch material. Forces seem to need a physical contact. Check the single-force description of distributed weight.
      - text: "It disappears whenever an object is hollow"
        rationale: |
          This treats empty space as removing all weight. The box has an empty center. Check that its walls still have mass.
      - text: "It always moves to the bottom wall"
        rationale: |
          This makes gravity pull the defined center into the lowest material. Gravity acts downward. Check the symmetric mass distribution before locating the center.
    explanation: |
      Symmetric mass on opposite sides of an empty interior can balance about a point in that space. The resultant weight can act through that point even though there is no material there.
    approved: false
    figure: "structural-stability-17"
    figureSpec:
      kind: "stability-shape"
      shapes:
        - form: "box"
          baseWidth: 2
          height: 3
  - id: "q-mechanical-technical-reasoning-structural-stability-0018"
    type: "structural-stability"
    difficulty: "hard"
    stem: |
      The shown box is supported on its broad base. Its weight line is inside that base. Why can a sufficiently strong horizontal push still tip it?
    choices:
      - text: "The push adds an overturning torque"
        correct: true
      - text: "Inside projection cancels all external torques"
        rationale: |
          This treats a gravity test as immunity to other forces. The box starts stable. Check the added push and its moment arm.
      - text: "The push makes the box's mass vanish"
        rationale: |
          This confuses reduced contact on one side with lost mass. The box may lift an edge. Check that its material remains present.
      - text: "Any push must first move the weight point outside"
        rationale: |
          This assumes tipping can only start after the static threshold is crossed. Gravity acts through the inside point. Check the additional torque supplied by the push.
    explanation: |
      The projection test describes gravity and support in a static case. A horizontal push adds a force with its own turning effect. A large enough added torque can start tipping.
    approved: false
    figure: "structural-stability-18"
    figureSpec:
      kind: "stability-shape"
      shapes:
        - form: "box"
          baseWidth: 2
          height: 3
  - id: "q-mechanical-technical-reasoning-structural-stability-0019"
    type: "structural-stability"
    difficulty: "hard"
    stem: |
      The two shown boxes have equal center heights. The right has a wider base. For the same slow sideways tilt from level ground, why does the right have a greater margin before gravity overturns it?
    choices:
      - text: "Its support edge is farther from the center"
        correct: true
      - text: "Its center automatically moves lower"
        rationale: |
          This attributes the width benefit to a changed height. Broad shapes can also be short. Use the stated equal center heights.
      - text: "Its gravitational force is automatically smaller"
        rationale: |
          This treats spreading support as reducing total weight. Pressure may be distributed over more area. Check that total gravity force is not set by base width.
      - text: "Its pivot cannot become a side edge"
        rationale: |
          This assumes a wide base prevents pivoting. More of the base initially touches. Check that slow tilting can still lift one side.
    explanation: |
      A wider base places the side edge farther from the initial weight line. The center must shift farther sideways before that line passes the edge. Equal center heights make the width difference decisive here.
    approved: false
    figure: "structural-stability-19"
    figureSpec:
      kind: "stability-shape"
      shapes:
        - form: "box"
          baseWidth: 1
          height: 2
        - form: "box"
          baseWidth: 3
          height: 2
  - id: "q-mechanical-technical-reasoning-structural-stability-0020"
    type: "structural-stability"
    difficulty: "exam"
    stem: |
      The three uniform boxes shown have equal base widths and heights decreasing from left to right. For slow tilting about corresponding side edges, rank the critical tipping angles from largest to smallest.
    choices:
      - text: "Right, middle, left"
        correct: true
      - text: "Left, middle, right"
        rationale: |
          This makes greater height raise the tipping angle. The tallest box looks most prominent. Check how its high center shifts sideways under tilt.
      - text: "Middle, right, left"
        rationale: |
          This treats intermediate height as the best balance. The middle looks like a compromise. With equal bases, compare center height directly.
      - text: "All three angles are equal"
        rationale: |
          This uses equal base widths alone. All support regions match. Check the different center heights as the boxes rotate.
    explanation: |
      With equal base widths, a lower center of gravity requires a greater tilt to bring the weight line to the edge. The right box is shortest, the middle next, and the left tallest. Their critical angles therefore rank right, middle, left.
    approved: false
    figure: "structural-stability-20"
    figureSpec:
      kind: "stability-shape"
      shapes:
        - form: "box"
          baseWidth: 2
          height: 3
        - form: "box"
          baseWidth: 2
          height: 2
        - form: "box"
          baseWidth: 2
          height: 1
