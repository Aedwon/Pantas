meta:
  subject: reasoning
  topic: mechanical-technical-reasoning
  subtopic: structural-stability
  exams: [ dost-sei ]
questions:
  - id: q-mechanical-technical-reasoning-structural-stability-0001
    type: structural-stability
    difficulty: easy
    stem: |
      What is the term for the single point where an object's entire weight can be thought of as concentrated, balancing perfectly in every direction?
    choices:
      - text: Center of gravity
        correct: true
      - text: Base of support
        rationale: |
          You confused the concentration of weight with the area the object rests on. The base of support is the contact area on the ground, not a single point of balance.
      - text: Fulcrum
        rationale: |
          You confused the balancing point of the object itself with a pivot point. A fulcrum is the external support about which a lever pivots, not the object's internal balancing point.
      - text: Tipping point
        rationale: |
          You confused the balance point with the critical angle of tilt. A tipping point is the threshold where an object falls over, not the point where its weight is concentrated.
    explanation: |
      The center of gravity is the single point where an object's entire weight can be thought of as concentrated, balancing perfectly in every direction.
    approved: true

  - id: q-mechanical-technical-reasoning-structural-stability-0002
    type: structural-stability
    difficulty: easy
    stem: |
      What is the term for the area on the ground enclosed by an object's points (or edges) of contact with the ground?
    choices:
      - text: Base of support
        correct: true
      - text: Center of gravity
        rationale: |
          You confused the area on the ground with the single point where weight is concentrated. Center of gravity is an internal balance point, not the contact area.
      - text: Fulcrum
        rationale: |
          You confused the resting area with a pivot point. A fulcrum is the specific point a lever rests or turns on, not the entire area enclosed by the object's feet.
      - text: Load distance
        rationale: |
          You guessed a term related to levers. Load distance refers to how far a weight is from a fulcrum, not the area an object rests upon.
    explanation: |
      The base of support is the area on the ground enclosed by an object's points or edges of contact with the ground, like the rectangle connecting a table's four feet.
    approved: true

  - id: q-mechanical-technical-reasoning-structural-stability-0003
    type: structural-stability
    difficulty: medium
    figure: structural-stability-03
    figureSpec:
      kind: stability-shape
      shapes:
        - form: box
          baseWidth: 2
          height: 3
    stem: |
      Figure shows an object with an imaginary vertical line dropped straight down from its center of gravity. Under what condition does the object remain stable and not tip over?
    choices:
      - text: The vertical line falls within the object's base of support
        correct: true
      - text: The vertical line falls exactly at the center of the object's base
        rationale: |
          You assumed the line must be perfectly centered. As long as the line falls anywhere within the boundaries of the base of support, the object remains stable.
      - text: The object's weight is below a certain threshold
        rationale: |
          You assumed stability depends on how light the object is. Stability depends on the alignment of the center of gravity with the base, not the total weight.
      - text: The object's base of support is perfectly circular
        rationale: |
          You assumed a specific shape is required for stability. The base of support can be any shape, as long as the vertical line from the center of gravity falls within it.
    explanation: |
      An object remains stable as long as an imaginary vertical line dropped straight down from its center of gravity falls within its base of support. If that line falls outside the base of support, the object tips over.
    approved: true

  - id: q-mechanical-technical-reasoning-structural-stability-0004
    type: structural-stability
    difficulty: medium
    figure: structural-stability-04
    figureSpec:
      kind: stability-shape
      shapes:
        - form: pyramid
          baseWidth: 3
          height: 1
        - form: pyramid
          baseWidth: 1
          height: 3
    stem: |
      Figure shows a short, wide pyramid and a tall, narrow pyramid, both the same weight and made of the same uniform material. Which one is more stable, and why?
    choices:
      - text: The short, wide pyramid, since it has both a lower center of gravity and a wider base of support
        correct: true
      - text: The tall, narrow pyramid, since height always improves stability
        rationale: |
          You assumed being taller makes an object more stable. A taller object has a higher center of gravity, which actually makes it easier to tip over.
      - text: Both pyramids are equally stable, since they weigh the same
        rationale: |
          You assumed equal weight means equal stability. Stability also depends heavily on the height of the center of gravity and the width of the base.
      - text: The tall, narrow pyramid, since a narrower base is always more stable
        rationale: |
          You assumed a narrower base is better. A narrow base means the center of gravity has less distance to shift before the object tips over.
    explanation: |
      The short, wide pyramid has a lower center of gravity (since it is shorter) and a wider base of support (since it is wider). Both factors independently improve stability, making it more stable than the tall, narrow pyramid.
    approved: true

  - id: q-mechanical-technical-reasoning-structural-stability-0005
    type: structural-stability
    difficulty: medium
    figure: structural-stability-05
    figureSpec:
      kind: stability-shape
      tilt: 22
      shapes:
        - form: box
          baseWidth: 2
          height: 3
    stem: |
      Figure shows a rectangular box being slowly tilted to one side, pivoting on one bottom edge. At what point does the box tip over rather than settling back down?
    choices:
      - text: The moment the vertical line from its center of gravity moves beyond the edge of the base of support it is pivoting on
        correct: true
      - text: As soon as the box is tilted at all, even slightly
        rationale: |
          You assumed any tilt causes tipping. An object will rock back to its original position as long as its center of gravity remains over its base of support.
      - text: Only once the box is tilted a full 90 degrees
        rationale: |
          You assumed it must fall completely flat to tip. The tipping point happens much earlier, the moment its center of gravity passes the edge it is pivoting on.
      - text: The box never tips over regardless of tilt, since it is resting on the ground
        rationale: |
          You assumed resting on the ground makes it immune to tipping. Once the center of gravity is pushed past the pivot edge, gravity will pull the object over.
    explanation: |
      The box remains stable as long as the vertical line from its center of gravity stays within its base of support. It tips over at the exact moment this line moves beyond the edge of the base of support it is still pivoting on.
    approved: true

  - id: q-mechanical-technical-reasoning-structural-stability-0006
    type: structural-stability
    difficulty: medium
    stem: |
      A moving truck carries the same total weight of cargo, either stacked very high or spread out lower. Which loading method makes the truck more stable while turning corners?
    choices:
      - text: Spreading the cargo lower, since it keeps the center of gravity closer to the ground
        correct: true
      - text: Stacking the cargo high, since it distributes weight more evenly
        rationale: |
          You assumed stacking high distributes weight evenly. Stacking high raises the center of gravity, making the truck much more likely to tip over during a turn.
      - text: Both loading methods provide exactly the same stability
        rationale: |
          You assumed only the total weight matters. How the weight is distributed vertically changes the center of gravity, which directly affects stability.
      - text: Stacking the cargo high, since a higher center of gravity always improves turning stability
        rationale: |
          You assumed a higher center of gravity is better for turns. A higher center of gravity acts like a longer lever arm for tipping, making the truck less stable.
    explanation: |
      Spreading cargo lower keeps the center of gravity closer to the ground, requiring a larger tilt (like from a sharp turn) before the vertical line from the center of gravity could be pushed outside the truck's base of support: making it more stable while turning.
    approved: true

  - id: q-mechanical-technical-reasoning-structural-stability-0007
    type: structural-stability
    difficulty: medium
    stem: |
      A person standing with feet close together is compared to the same person standing with feet spread wider apart. Which stance is more stable against being pushed sideways?
    choices:
      - text: Feet spread wider apart, since it increases the base of support
        correct: true
      - text: Feet close together, since it lowers the center of gravity
        rationale: |
          You assumed bringing feet together lowers the center of gravity. It actually narrows the base of support, making it much easier to be pushed over.
      - text: Both stances are equally stable against sideways pushes
        rationale: |
          You assumed the width of the stance does not matter. Spreading your feet widens your base of support, meaning you can lean further before falling.
      - text: Feet close together, since a narrower base is always more stable
        rationale: |
          You assumed a narrower base is better. A narrow base means your center of gravity only has to shift a tiny bit sideways before you tip over.
    explanation: |
      Spreading the feet wider apart increases the base of support, meaning the vertical line from the center of gravity can shift farther sideways before falling outside that base: making the wider stance more stable against sideways pushes.
    approved: true

  - id: q-mechanical-technical-reasoning-structural-stability-0008
    type: structural-stability
    difficulty: hard
    stem: |
      An object has a very low center of gravity but an extremely narrow base of support. A student assumes this object must be very stable, "since only the center of gravity's height matters." Is this assumption correct?
    choices:
      - text: 'No: stability depends on both the center of gravity''s height and the base of support''s width; an object with a low center of gravity but an extremely narrow base can still tip over easily.'
        correct: true
      - text: 'Yes: a low center of gravity alone always guarantees maximum stability, regardless of base width.'
        rationale: |
          You assumed the center of gravity is the only factor that matters. If the base is extremely narrow, even a low center of gravity will quickly shift outside it and cause tipping.
      - text: 'Yes: base of support width has no effect on stability at all.'
        rationale: |
          You assumed the base of support is irrelevant. The base defines the safe zone; if it is too narrow, the object will tip over with very little tilt.
      - text: 'No: but only because this object cannot have a center of gravity at all.'
        rationale: |
          You assumed an object can exist without a center of gravity. Every object with mass has a center of gravity where its weight is effectively concentrated.
    explanation: |
      An object could have a low center of gravity but still be unstable if its base of support is extremely narrow; both factors must be considered together, not just one in isolation.
    approved: true

  - id: q-mechanical-technical-reasoning-structural-stability-0009
    type: structural-stability
    difficulty: hard
    stem: |
      A very heavy object has a high center of gravity and a narrow base of support. A student assumes this object must be stable, "since heavier objects are always more stable." Is this assumption correct?
    choices:
      - text: 'No: stability depends on the location of the center of gravity relative to the base of support, not simply on how much an object weighs; a heavy object with a high center of gravity and narrow base can still tip over easily.'
        correct: true
      - text: 'Yes: heavier objects are always more stable than lighter ones, regardless of their shape.'
        rationale: |
          You assumed weight alone creates stability. If that heavy weight is balanced high above a narrow base, it will still tip over very easily.
      - text: 'Yes: but only because this object''s weight makes its base of support automatically wider.'
        rationale: |
          You assumed weight changes the physical dimensions of the base. An object's weight does not automatically widen its contact area with the ground.
      - text: 'No: but only because heavy objects cannot have a center of gravity.'
        rationale: |
          You assumed heavy objects lack a center of gravity. Every object has a center of gravity, and a high one makes tipping easier regardless of weight.
    explanation: |
      Stability depends on the location of the center of gravity relative to the base of support, not simply on how much an object weighs overall. A very heavy object with a high center of gravity and a narrow base can still tip over easily, despite its large weight.
    approved: true

  - id: q-mechanical-technical-reasoning-structural-stability-0010
    type: structural-stability
    difficulty: hard
    stem: |
      A student says, "this box is stable," treating stability as a fixed, permanent property of the box regardless of how it is positioned. Is this the correct way to think about stability?
    choices:
      - text: 'No: an object can be perfectly stable while sitting still, but become unstable once tilted enough that its center of gravity''s vertical line moves outside the base of support; stability depends on the specific tilt angle, not a fixed, unchanging fact.'
        correct: true
      - text: 'Yes: once an object is described as "stable," it remains stable at every possible tilt angle.'
        rationale: |
          You assumed stability is absolute. As soon as you tilt the object far enough, its center of gravity moves past its base, and it will fall over.
      - text: 'Yes: stability is a permanent property that never changes, regardless of orientation.'
        rationale: |
          You assumed orientation does not matter. If you turn a stable box on its pointed corner, it immediately becomes unstable.
      - text: 'No: but only because boxes can never be considered stable under any circumstance.'
        rationale: |
          You assumed no box is ever stable. A box sitting flat on the ground with its center of gravity over its base is perfectly stable until disturbed.
    explanation: |
      Assuming an object "is stable" as an absolute, unchanging fact (rather than "is stable at this specific tilt angle") misses that further tilting can push any object past its tipping point, given enough tilt.
    approved: true

  - id: q-mechanical-technical-reasoning-structural-stability-0011
    type: structural-stability
    difficulty: medium
    stem: |
      A bottom-heavy roly-poly toy (weighted heavily at its rounded base) is pushed over onto its side. Why does it always return to standing upright?
    choices:
      - text: Its center of gravity is very low (concentrated near its heavy base), so the vertical line from its center of gravity quickly returns within its base of support as it rocks, pulling it back upright
        correct: true
      - text: Its base of support is extremely narrow, which always causes objects to return upright
        rationale: |
          You assumed a narrow base helps it stand up. A narrow base usually makes an object tip over easier; it is the extremely low center of gravity that pulls this toy back up.
      - text: The toy has no center of gravity, so it cannot tip over in the first place
        rationale: |
          You assumed the toy lacks a center of gravity. The reason it works is precisely because its center of gravity is heavily weighted at the very bottom.
      - text: The toy is simply too light to be affected by gravity at all
        rationale: |
          You assumed it ignores gravity. Gravity is exactly what pulls the heavy, rounded bottom back down against the ground.
    explanation: |
      The toy's very low center of gravity, concentrated near its heavy rounded base, means the vertical line from its center of gravity stays within (or quickly returns within) its base of support as it rocks, pulling it back upright rather than tipping over completely.
    approved: true

  - id: q-mechanical-technical-reasoning-structural-stability-0012
    type: structural-stability
    difficulty: medium
    stem: |
      A sports utility vehicle (SUV) has a higher center of gravity than a sports car with the same wheel base width. Which vehicle is more prone to rolling over while making a sharp turn?
    choices:
      - text: The SUV, since its higher center of gravity requires less tilt before the vertical line from its center of gravity could fall outside its base of support
        correct: true
      - text: The sports car, since lower vehicles are always more prone to rolling over
        rationale: |
          You assumed being lower increases rollover risk. A lower center of gravity keeps the vertical line inside the wheelbase much better during a turn.
      - text: Both vehicles are equally prone to rolling over, since they share the same wheel base width
        rationale: |
          You assumed only the wheelbase matters. Because the SUV is taller, its center of gravity swings out further and faster during a sharp turn than the sports car's does.
      - text: Neither vehicle can roll over, since both have four wheels providing support
        rationale: |
          You assumed four wheels guarantee stability. Any vehicle can roll over if cornering forces push its center of gravity outside the footprint of its wheels.
    explanation: |
      A higher center of gravity requires less tilt before the vertical line from the center of gravity could be pushed outside the base of support (the wheel base). Since the SUV has a higher center of gravity than the sports car (with the same base width), it is more prone to rolling over.
    approved: true

  - id: q-mechanical-technical-reasoning-structural-stability-0013
    type: structural-stability
    difficulty: medium
    stem: |
      A ladder with widely spread legs is compared to an identical-height ladder with legs placed close together. Which ladder is more stable against tipping sideways?
    choices:
      - text: The ladder with widely spread legs, since it has a wider base of support
        correct: true
      - text: The ladder with legs close together, since a narrower base concentrates support
        rationale: |
          You assumed concentrated support is better. A narrow base means even a small sideways lean will push your center of gravity outside the base, causing a fall.
      - text: Both ladders are equally stable, since they are the same height
        rationale: |
          You assumed height is the only factor. The width of the base of support is just as critical; a wider base allows you to lean further safely.
      - text: Neither ladder can be compared without knowing their exact weight
        rationale: |
          You assumed weight determines stability. While weight matters, the geometric relationship between the center of gravity and the base of support dictates when tipping occurs.
    explanation: |
      A wider base of support means the vertical line from the center of gravity can shift farther sideways before falling outside that base, making the widely-spread-leg ladder more stable against tipping sideways.
    approved: true

  - id: q-mechanical-technical-reasoning-structural-stability-0014
    type: structural-stability
    difficulty: hard
    stem: |
      A box's base of support extends 3 meters from the edge it is currently pivoting on. At a certain tilt angle, the vertical line dropped from its center of gravity falls 2 meters from that same edge, still within the base. Does the box tip over at this specific angle?
    choices:
      - text: 'No: since 2 meters is still within the 3-meter base of support, the box remains stable at this tilt angle; it would only tip if the vertical line moved beyond the 3-meter edge'
        correct: true
      - text: 'Yes: any tilt at all causes the box to tip over immediately'
        rationale: |
          You assumed an object cannot tilt without falling. As long as the center of gravity remains directly over any part of the base, the object will rock back to a stable position.
      - text: 'Yes: since 2 meters is more than half of 3 meters, the box has already tipped'
        rationale: |
          You assumed it tips once it passes the halfway mark. It only tips once the center of gravity passes the very outer edge of the 3-meter base.
      - text: It cannot be determined without knowing the box's exact weight
        rationale: |
          You assumed weight changes the tipping geometry. Tipping is based purely on whether the center of gravity is over the base, regardless of how heavy the box is.
    explanation: |
      The box remains stable as long as the vertical line from its center of gravity stays within its base of support. Since 2 meters is still within the 3-meter base, the box has not yet tipped: it would only tip once the line moves beyond the 3-meter edge.
    approved: true

  - id: q-mechanical-technical-reasoning-structural-stability-0015
    type: structural-stability
    difficulty: exam
    stem: |
      Box P has a low center of gravity and a wide base of support. Box Q has a high center of gravity and a narrow base of support. Both boxes are gradually tilted at the same steady rate, starting from level ground. Which box tips over first, and why?
    choices:
      - text: Box Q tips over first, since both its higher center of gravity and its narrower base of support independently require less tilt before the vertical line from its center of gravity falls outside its base, compared to Box P's more favorable combination of both factors.
        correct: true
      - text: Box P tips over first, since a lower center of gravity always causes objects to tip sooner.
        rationale: |
          You assumed a lower center of gravity makes tipping easier. It actually makes it much harder, because the object must tilt further before its weight shifts outside its base.
      - text: Both boxes tip over at exactly the same tilt angle, since tilt rate is the only factor that matters.
        rationale: |
          You assumed the speed of tilting is all that matters. The physical dimensions (how wide the base is and how high the weight is centered) determine the exact angle they tip at.
      - text: Neither box will ever tip over, regardless of how far they are tilted.
        rationale: |
          You assumed they are immune to tipping. Once any box is tilted far enough that its center of gravity passes its base, it will inevitably tip over.
    explanation: |
      Both stability factors favor Box P: a lower center of gravity and a wider base of support each independently require a larger tilt before the vertical line from the center of gravity is pushed outside the base. Box Q, with both a higher center of gravity and a narrower base, tips over first.
    approved: true
