meta:
  subject: "reasoning"
  topic: "mechanical-technical-reasoning"
  subtopic: "springs-and-weights"
  exams:
    - "dost-sei"
questions:
  - id: "q-mechanical-technical-reasoning-springs-and-weights-0001"
    type: "spring-weight"
    difficulty: "easy"
    figure: "springs-and-weights-01"
    figureSpec:
      kind: "spring-scale"
      springs:
        - stretch: 5
    stem: |
      The shown spring extends 5 cm under a 2 kg mass at rest. With gravity unchanged and all loads within its linear elastic range, what extension does an 8 kg mass produce?
    choices:
      - text: "20 cm"
        correct: true
      - text: "10 cm"
        rationale: |
          This doubles extension even though mass quadruples. Eight is larger than two. Check the actual ratio of the two masses.
      - text: "13 cm"
        rationale: |
          This adds the new mass number to the old extension. Both numbers are given. Check that centimeters and kilograms cannot be added.
      - text: "40 cm"
        rationale: |
          This multiplies 5 by the new mass rather than by the mass ratio. Eight is the new load. Divide it by the calibration mass first.
    explanation: |
      The mass and weight increase by $8/2=4$. For the same spring in its linear range, extension increases by that same factor. Thus $5 \times 4=20$ cm.
    approved: true
  - id: "q-mechanical-technical-reasoning-springs-and-weights-0002"
    type: "spring-weight"
    difficulty: "easy"
    figure: "springs-and-weights-02"
    figureSpec:
      kind: "spring-scale"
      springs:
        - stretch: 6
    stem: |
      The shown ideal hanging spring extends 6 cm under a 30 N load at rest. What is its spring constant in N/m?
    choices:
      - text: "500 N/m"
        correct: true
      - text: "5 N/m"
        rationale: |
          This divides by 6 without converting centimeters to meters. The numerical extension is six. Check the length unit in N/m.
      - text: "1.8 N/m"
        rationale: |
          This multiplies force by extension, $30(0.06)$. Both values belong to Hooke's law. Solve $F=kx$ for $k$.
      - text: "0.002 N/m"
        rationale: |
          This divides extension by force, $0.06/30$. That measures ease of stretching. Check that stiffness is force per extension.
    explanation: |
      Convert $6$ cm to $0.06$ m. Hooke's law gives $k=F/x=30/0.06=500$ N/m.
    approved: true
  - id: "q-mechanical-technical-reasoning-springs-and-weights-0003"
    type: "spring-weight"
    difficulty: "medium"
    figure: "springs-and-weights-03"
    figureSpec:
      kind: "spring-scale"
      springs:
        - stretch: 20
    stem: |
      The shown spring extends 4 cm under a 1 kg mass at rest. Its extension becomes 20 cm. With gravity fixed and linear behavior, what attached mass produces that extension?
    choices:
      - text: "5 kg"
        correct: true
      - text: "16 kg"
        rationale: |
          This subtracts the calibration extension from the target extension. The difference is 16 cm. Use the ratio to find a mass, not a length difference.
      - text: "24 kg"
        rationale: |
          This adds the two extensions and calls the sum a mass. Both are length measurements. Check units before using their numbers.
      - text: "4 kg"
        rationale: |
          This uses the calibration extension as a mass. Four appears in the starting measurement. Divide target extension by extension per kilogram.
    explanation: |
      The extension increases by $20/4=5$. The mass increases by the same factor in unchanged gravity. The attached mass is $1 \times 5=5$ kg.
    approved: true
  - id: "q-mechanical-technical-reasoning-springs-and-weights-0004"
    type: "spring-weight"
    difficulty: "medium"
    figure: "springs-and-weights-04"
    figureSpec:
      kind: "spring-scale"
      springs:
        - stretch: 6
    stem: |
      The shown ideal spring has an unstretched length of 12 cm. Under a 30 N force at rest, its total length is 18 cm. What is its extension?
    choices:
      - text: "6 cm"
        correct: true
      - text: "18 cm"
        rationale: |
          This uses total loaded length as extension. Eighteen is the measured length under load. Subtract the unstretched length first.
      - text: "12 cm"
        rationale: |
          This reports the spring's natural length. That is the baseline measurement. Check the change from that baseline.
      - text: "30 cm"
        rationale: |
          This adds loaded and natural lengths. Both lengths describe the same spring. Use their difference to find the change.
    explanation: |
      Extension measures the change from the unstretched length. Subtract $18-12=6$ cm. That is the displacement used in Hooke's law.
    approved: true
  - id: "q-mechanical-technical-reasoning-springs-and-weights-0005"
    type: "spring-weight"
    difficulty: "medium"
    figure: "springs-and-weights-05"
    figureSpec:
      kind: "spring-scale"
      springs:
        - stretch: 3
          label: "A"
        - stretch: 8
          label: "B"
    stem: |
      The shown springs A and B carry equal weights at rest and remain within their linear ranges. A extends 3 cm and B extends 8 cm. Which has the greater spring constant?
    choices:
      - text: "Spring A"
        correct: true
      - text: "Spring B"
        rationale: |
          This treats greater stretch as greater stiffness. B visibly changes more. Check which spring better resists the same force.
      - text: "They have equal spring constants"
        rationale: |
          This equates equal loads with equal stiffness. The weights do match. Compare the different extensions under those loads.
      - text: "Their constants cannot be compared"
        rationale: |
          This requires absolute force values for a relative comparison. No force number is supplied. Check that the same force cancels in the ratio.
    explanation: |
      For equal force, $k=F/x$. The smaller extension therefore gives the greater spring constant. Spring A extends only 3 cm, so it is stiffer.
    approved: true
  - id: "q-mechanical-technical-reasoning-springs-and-weights-0006"
    type: "spring-weight"
    difficulty: "medium"
    figure: "springs-and-weights-06"
    figureSpec:
      kind: "spring-scale"
      springs:
        - stretch: 6
    stem: |
      The shown spring has an unstretched length of 10 cm and a spring constant of 200 N/m. What is its total length under a 12 N weight at rest within its linear range?
    choices:
      - text: "16 cm"
        correct: true
      - text: "6 cm"
        rationale: |
          This gives the extension instead of the total length. Six is the Hooke-law result. Add the unstretched length when total length is requested.
      - text: "10.06 cm"
        rationale: |
          This adds a value in meters directly to centimeters. The computed extension is 0.06 m. Convert both lengths to the same unit before adding.
      - text: "22 cm"
        rationale: |
          This adds the force number to the natural length. Twelve is the applied force in newtons. Find extension from force divided by stiffness.
    explanation: |
      The extension is $x=12/200=0.06$ m, or 6 cm. Add it to the natural length: $10+6=16$ cm.
    approved: true
  - id: "q-mechanical-technical-reasoning-springs-and-weights-0007"
    type: "spring-weight"
    difficulty: "medium"
    figure: "springs-and-weights-07"
    figureSpec:
      kind: "spring-scale"
      springs:
        - stretch: 4
          label: "A"
        - stretch: 10
          label: "B"
    stem: |
      Under equal test forces, the shown linear springs A and B extend 4 cm and 10 cm. To give both a 4 cm extension, how must their applied forces compare?
    choices:
      - text: "A needs 2.5 times B's force"
        correct: true
      - text: "B needs 2.5 times A's force"
        rationale: |
          This reverses which spring is stiffer. B stretches farther under the test load. Check which spring needs more force for the same extension.
      - text: "Both need equal forces"
        rationale: |
          This treats equal target extensions as equal forces. The desired lengths match. Check that their spring constants differ.
      - text: "A needs 6 times B's force"
        rationale: |
          This uses $10-4$ instead of a ratio. The extension difference is six centimeters. Compare stiffness by dividing extensions under equal loads.
    explanation: |
      Equal test forces show that $k_A/k_B=10/4=2.5$. At the same extension, force is proportional to stiffness. A therefore needs 2.5 times B's force.
    approved: true
  - id: "q-mechanical-technical-reasoning-springs-and-weights-0008"
    type: "spring-weight"
    difficulty: "hard"
    figure: "springs-and-weights-08"
    figureSpec:
      kind: "spring-scale"
      springs:
        - stretch: 4
    stem: |
      The shown spring extends 4 cm under a 2 kg mass at rest. Assuming linear behavior and unchanged gravity, what extension does a 3 kg mass produce?
    choices:
      - text: "6 cm"
        correct: true
      - text: "8 cm"
        rationale: |
          This rounds 3 kg up to two complete 2 kg groups. Whole groups are easy to count. Keep the fractional ratio instead of rounding.
      - text: "4 cm"
        rationale: |
          This keeps the calibration extension after increasing the mass. Four is the observed starting value. Check that extension changes with force.
      - text: "12 cm"
        rationale: |
          This multiplies 4 by 3 without dividing by the 2 kg calibration. Three is the new mass. Use the new-to-old mass ratio.
    explanation: |
      The mass ratio is $3/2=1.5$. Multiply the original extension by that ratio: $4 \times 1.5=6$ cm.
    approved: true
  - id: "q-mechanical-technical-reasoning-springs-and-weights-0009"
    type: "spring-weight"
    difficulty: "hard"
    figure: "springs-and-weights-09"
    figureSpec:
      kind: "spring-scale"
      springs:
        - stretch: 3
    stem: |
      The shown spring is stretched downward by a hanging mass and stays within its elastic limit. In which direction does its restoring force act on the mass?
    choices:
      - text: "Upward"
        correct: true
      - text: "Downward, along the stretch"
        rationale: |
          This drops the opposing-direction meaning of the minus sign in $F_s=-kx$. The mass pulls down. Check which force the spring itself applies.
      - text: "Upward only while the mass is moving"
        rationale: |
          This assumes restoring force requires motion. A spring can visibly be at rest. Check that Hooke's law depends on displacement, not speed.
      - text: "Zero whenever the mass is at rest"
        rationale: |
          This confuses zero net force with zero spring force. The mass is stationary. Check what upward force balances its weight.
    explanation: |
      A stretched spring pulls back toward its unstretched length. Here the displacement is downward. Its restoring force on the mass is therefore upward.
    approved: true
  - id: "q-mechanical-technical-reasoning-springs-and-weights-0010"
    type: "spring-weight"
    difficulty: "hard"
    figure: "springs-and-weights-10"
    figureSpec:
      kind: "spring-scale"
      springs:
        - stretch: 4
          label: "A"
        - stretch: 4
          label: "B"
    stem: |
      The shown linear springs A and B each extend 4 cm. A carries an 8 kg mass and B a 16 kg mass in the same gravitational field. What is $k_B/k_A$?
    choices:
      - text: "2"
        correct: true
      - text: "1"
        rationale: |
          This treats equal extensions as equal stiffness. Both springs look equally stretched. Check the unequal forces causing those extensions.
      - text: "0.5"
        rationale: |
          This reverses the force ratio. Both mass values belong in the comparison. Check that B supports more weight for the same extension.
      - text: "4"
        rationale: |
          This squares the mass ratio without a Hooke-law reason. Doubling can be confused with squaring. Use the direct relation between force and stiffness at equal extension.
    explanation: |
      The extensions are equal, so $k_B/k_A=F_B/F_A$. In the same gravity the weight ratio equals the mass ratio, $16/8=2$. B is twice as stiff.
    approved: true
  - id: "q-mechanical-technical-reasoning-springs-and-weights-0011"
    type: "spring-weight"
    difficulty: "hard"
    figure: "springs-and-weights-11"
    figureSpec:
      kind: "spring-scale"
      springs:
        - stretch: 2
    stem: |
      The shown linear spring extends 2 cm per kilogram of attached mass in fixed gravity. Give its extension at 7 kg and the mass needed for a 21 cm extension.
    choices:
      - text: "14 cm; 10.5 kg"
        correct: true
      - text: "9 cm; 19 kg"
        rationale: |
          This adds or subtracts the rate number instead of using multiplication and division. Two looks like a fixed extra amount. Check the units of centimeters per kilogram.
      - text: "14 cm; 42 kg"
        rationale: |
          This gets extension but multiplies 21 by 2 to find mass. Multiplication worked in the first step. Reverse the operation when solving for mass.
      - text: "7 cm; 10.5 kg"
        rationale: |
          This copies the mass number as extension. Seven is the first load. Apply the stated two centimeters per kilogram.
    explanation: |
      At 7 kg the extension is $2 \times 7=14$ cm. A 21 cm extension requires $21/2=10.5$ kg.
    approved: true
  - id: "q-mechanical-technical-reasoning-springs-and-weights-0012"
    type: "spring-weight"
    difficulty: "hard"
    figure: "springs-and-weights-12"
    figureSpec:
      kind: "spring-scale"
      springs:
        - stretch: 5
          label: "A"
        - stretch: 5
          label: "B"
    stem: |
      The shown ideal spring A has $k_A=200$ N/m and supports 10 N. Spring B has $k_B=400$ N/m and supports 20 N. How do their extensions compare?
    choices:
      - text: "Both extend 5 cm"
        correct: true
      - text: "A extends twice as far"
        rationale: |
          This compares stiffness while ignoring the doubled force on B. B is twice as stiff. Calculate force divided by stiffness for both.
      - text: "B extends twice as far"
        rationale: |
          This compares force while ignoring B's doubled stiffness. B carries twice the force. Check both force and spring constant.
      - text: "Both extend 0.05 cm"
        rationale: |
          This keeps the numerical meter result but labels it centimeters. The division gives 0.05 m. Convert meters to centimeters.
    explanation: |
      For A, $x=10/200=0.05$ m. For B, $x=20/400=0.05$ m. Both therefore extend 5 cm.
    approved: true
  - id: "q-mechanical-technical-reasoning-springs-and-weights-0013"
    type: "spring-weight"
    difficulty: "hard"
    figure: "springs-and-weights-13"
    figureSpec:
      kind: "spring-scale"
      springs:
        - stretch: 4
    stem: |
      For the shown spring, measured extensions from its unstretched length are 4 cm at 2 kg and 10 cm at 4 kg in unchanged gravity. Are these exact measurements consistent with one constant Hooke-law stiffness?
    choices:
      - text: "No, the ratios differ"
        correct: true
      - text: "Yes, any increasing extension fits"
        rationale: |
          This equates increasing response with proportional response. More load does stretch the spring more. Check whether extension divided by mass stays constant.
      - text: "Yes, doubling mass adds 6 cm"
        rationale: |
          This accepts a single difference without the zero-extension baseline. The two readings differ by six. Check proportionality from the unstretched length.
      - text: "No, different masses must give equal extension"
        rationale: |
          This expects no response to changed load. Both readings come from one spring. Check that Hooke's law predicts extension proportional to force.
    explanation: |
      For one constant stiffness and fixed gravity, extension per kilogram stays constant. Here $4/2=2$ cm/kg and $10/4=2.5$ cm/kg. These exact measurements do not fit that model.
    approved: true
  - id: "q-mechanical-technical-reasoning-springs-and-weights-0014"
    type: "spring-weight"
    difficulty: "hard"
    figure: "springs-and-weights-14"
    figureSpec:
      kind: "spring-scale"
      springs:
        - stretch: 5
    stem: |
      The shown spring extends 5 cm under a 2 kg mass at rest. In its linear range and unchanged gravity, what total mass gives 20 cm extension, and what added mass takes it from 20 cm to 30 cm?
    choices:
      - text: "8 kg total; 4 kg added"
        correct: true
      - text: "8 kg total; 10 kg added"
        rationale: |
          This treats the extra centimeters as extra kilograms. The length increase is ten. Divide that increase by centimeters per kilogram.
      - text: "4 kg total; 2 kg added"
        rationale: |
          This uses 5 cm per kilogram instead of per 2 kg. Five appears as the calibration extension. Keep the calibration mass in the rate.
      - text: "8 kg total; 8 kg added"
        rationale: |
          This doubles the 20 cm load for a rise to 30 cm. Eight is the current mass. Check that the extra extension is half the current extension.
    explanation: |
      The calibration is $5/2=2.5$ cm/kg. For 20 cm, mass is $20/2.5=8$ kg. The further 10 cm requires $10/2.5=4$ kg more.
    approved: true
  - id: "q-mechanical-technical-reasoning-springs-and-weights-0015"
    type: "spring-weight"
    difficulty: "hard"
    figure: "springs-and-weights-15"
    figureSpec:
      kind: "spring-scale"
      springs:
        - stretch: 6
          label: "A"
        - stretch: 8
          label: "B"
        - stretch: 5
          label: "C"
    stem: |
      In fixed gravity, the shown linear springs A, B, and C extend 6, 8, and 5 cm under masses of 3, 4, and 5 kg respectively. Rank their stiffness.
    choices:
      - text: "C highest; A and B tied"
        correct: true
      - text: "A and B highest; C lowest"
        rationale: |
          This ranks larger extension per kilogram as greater stiffness. A and B have the larger stretch rates. Check that stiffness measures resistance to extension, not ease of stretching.
      - text: "C highest; A next; B lowest"
        rationale: |
          This sorts raw extensions alone. C has the shortest extension. Normalize for the different applied masses before comparing A and B.
      - text: "A, B, and C all tied"
        rationale: |
          This assumes different loads prevent comparison. The tests are not at equal force. Use force per extension for each spring.
    explanation: |
      Extension per kilogram is $6/3=2$ for A, $8/4=2$ for B, and $5/5=1$ for C. At the same force, less extension means greater stiffness. C is stiffest, while A and B have equal stiffness.
    approved: true
  - id: "q-mechanical-technical-reasoning-springs-and-weights-0016"
    type: "spring-weight"
    difficulty: "easy"
    figure: "springs-and-weights-16"
    figureSpec:
      kind: "spring-scale"
      springs:
        - stretch: 2
    stem: |
      The shown spring supports a 2 kg mass at rest. Ignore spring mass and use $g=10$ N/kg. What upward force does it exert on the mass?
    choices:
      - text: "20 N"
        correct: true
      - text: "2 N"
        rationale: |
          This copies the mass number as force. The load is labeled in kilograms. Multiply mass by the stated gravity.
      - text: "10 N"
        rationale: |
          This uses the gravitational field number alone. Ten is prominent in the stem. Check that N/kg must be multiplied by kilograms.
      - text: "0 N"
        rationale: |
          This confuses zero net force with zero spring force. The mass is at rest. Identify the force balancing its downward weight.
    explanation: |
      The mass weighs $2 \times 10=20$ N. At rest the upward spring force balances that weight. The spring force is 20 N.
    approved: false
  - id: "q-mechanical-technical-reasoning-springs-and-weights-0017"
    type: "spring-weight"
    difficulty: "medium"
    figure: "springs-and-weights-17"
    figureSpec:
      kind: "spring-scale"
      springs:
        - stretch: 3
    stem: |
      The shown hanging spring follows Hooke's law. Its applied load is tripled and its spring constant is also tripled by replacing it with another spring. How does extension change?
    choices:
      - text: "It stays the same"
        correct: true
      - text: "It triples"
        rationale: |
          This applies the load change but ignores stiffness. More force normally stretches a spring more. Check the replacement spring's larger constant.
      - text: "It falls to one-third"
        rationale: |
          This applies the stiffness change but ignores the load. A stiffer spring normally stretches less. Check that force also triples.
      - text: "It becomes nine times as large"
        rationale: |
          This multiplies force and stiffness factors together. Both change by three. Use force divided by stiffness.
    explanation: |
      Extension is $F/k$. Tripling both numerator and denominator leaves the ratio unchanged. The new extension equals the old extension.
    approved: false
  - id: "q-mechanical-technical-reasoning-springs-and-weights-0018"
    type: "spring-weight"
    difficulty: "hard"
    figure: "springs-and-weights-18"
    figureSpec:
      kind: "spring-scale"
      springs:
        - stretch: 5
    stem: |
      The shown spring has an unstretched length of 20 cm and reaches 25 cm under a load. Its verified linear range ends at 6 cm extension. What can be concluded from Hooke's law about its length under twice that load?
    choices:
      - text: "Beyond the verified range"
        correct: true
      - text: "It must be exactly 30 cm"
        rationale: |
          This extends the linear rule beyond the stated range. Doubling a load usually doubles elastic extension. Check the predicted extension against the verified limit.
      - text: "It must be exactly 50 cm"
        rationale: |
          This doubles total length instead of extension. Twenty-five is the loaded length. Remove the natural length before applying the ratio.
      - text: "It must remain exactly 25 cm"
        rationale: |
          This treats the elastic limit as a fixed-length stop. A limit is given. Check that it limits use of the model, not necessarily physical movement.
    explanation: |
      The first extension is $25-20=5$ cm. Linear doubling would give 10 cm extension and 30 cm total length. Ten centimeters exceeds the verified 6 cm range, so that prediction is not justified by the supplied calibration.
    approved: false
  - id: "q-mechanical-technical-reasoning-springs-and-weights-0019"
    type: "spring-weight"
    difficulty: "hard"
    figure: "springs-and-weights-19"
    figureSpec:
      kind: "spring-scale"
      springs:
        - stretch: 3
    stem: |
      A hanging mass stretches the shown spring downward and remains at rest. In $F_s=-kx$, take downward displacement as positive. What sign does the spring's force on the mass have?
    choices:
      - text: "Negative"
        correct: true
      - text: "Positive"
        rationale: |
          This assigns the spring force the displacement's direction. The mass stretches down. Keep the minus sign that makes restoring force oppose displacement.
      - text: "Zero"
        rationale: |
          This uses rest to erase the spring force. Acceleration is zero. Check that the spring still balances gravity.
      - text: "It changes with the chosen mass unit"
        rationale: |
          This treats kilograms versus grams as changing direction. Different units change numerical values. Check that a force sign refers to an axis direction.
    explanation: |
      The displacement $x$ is positive downward and $k$ is positive. The minus sign makes $F_s$ negative. This represents the upward restoring force.
    approved: false
  - id: "q-mechanical-technical-reasoning-springs-and-weights-0020"
    type: "spring-weight"
    difficulty: "exam"
    figure: "springs-and-weights-20"
    figureSpec:
      kind: "spring-scale"
      springs:
        - stretch: 2
    stem: |
      The same ideal spring supports the same mass in two gravitational fields. In the second field, $g$ is twice its first value and the spring remains linear. What happens to its extension from the unstretched length?
    choices:
      - text: "It doubles"
        correct: true
      - text: "It stays the same"
        rationale: |
          This treats unchanged mass as unchanged weight. The same object is attached. Check that weight depends on gravity as well as mass.
      - text: "It halves"
        rationale: |
          This puts gravity in the denominator. Stronger gravity may seem to compress the spring. Use weight as the downward stretching force.
      - text: "It becomes four times as large"
        rationale: |
          This squares the gravity change. Both force and extension change. Check that Hooke's law relates them directly, without squaring.
    explanation: |
      At rest $x=mg/k$. Mass and spring constant stay fixed, while $g$ doubles. The extension therefore doubles.
    approved: false
