meta:
  subject: reasoning
  topic: mechanical-technical-reasoning
  subtopic: gear-rotations
  exams: [ dost-sei ]
questions:
  - id: q-mechanical-technical-reasoning-gear-rotations-0001
    type: gear-direction
    difficulty: easy
    figure: gear-rotations-01
    figureSpec:
      kind: gear-train
      gears: 3
      firstTurns: clockwise
    stem: |
      The figure shows ordinary external gears in a row. Number them from left to right. With the first gear turning as marked, what direction does the third gear turn?
    choices:
      - text: "Clockwise"
        correct: true
      - text: "Counter-clockwise"
        rationale: |
          This counts one reversal instead of two. The first neighbor does turn counter-clockwise. Check every mesh along the path to the third gear.
      - text: "No net rotation per input turn"
        rationale: |
          This treats alternating directions as cancellation of rotation. Neighboring gears do move oppositely. Check that each is still rotating on its own axis.
      - text: "Direction requires an arrow on every gear"
        rationale: |
          This requires separate direction data for every gear. Only the first arrow is drawn. Check whether the external meshes transmit the known direction.
    explanation: |
      Each external mesh reverses direction. The first gear turns clockwise, the second counter-clockwise, and the third clockwise. The third matches the first after two reversals.
    approved: true

  - id: q-mechanical-technical-reasoning-gear-rotations-0002
    type: gear-direction
    difficulty: easy
    figure: gear-rotations-02
    figureSpec:
      kind: gear-train
      gears: 5
      firstTurns: counter-clockwise
    stem: |
      Number the shown ordinary external gears from left to right. Which gears share the marked first gear's rotation direction?
    choices:
      - text: "1, 3, and 5"
        correct: true
      - text: "2 and 4"
        rationale: |
          This chooses the gears opposite to the first. Even positions each follow an odd number of reversals. Check whether the task asks for matching or opposite directions.
      - text: "1, 2, and 3"
        rationale: |
          This groups consecutive gears instead of alternating positions. They are next to each other in the row. Check the reversal at each direct contact.
      - text: "3, 4, and 5"
        rationale: |
          This chooses the far end of the chain as one group. Distance can make the last three look like a separate set. Check direction at each intervening mesh.
    explanation: |
      Each external mesh reverses rotation. The five directions are counter-clockwise, clockwise, counter-clockwise, clockwise, counter-clockwise. Gears 1, 3, and 5 therefore match the first gear.
    approved: true

  - id: q-mechanical-technical-reasoning-gear-rotations-0003
    type: gear-direction
    difficulty: medium
    figure: gear-rotations-03
    figureSpec:
      kind: gear-train
      gears: 4
      firstTurns: clockwise
    stem: |
      For the shown external gear row, number gears from left to right. CW means clockwise and CCW counter-clockwise. What are the directions of gears 3 and 4, in that order?
    choices:
      - text: "Gear 3 CW; gear 4 CCW"
        correct: true
      - text: "Gear 3 CCW; gear 4 CW"
        rationale: |
          This reverses both later directions. Counting positions instead of contacts can shift the alternation by one. Check the two meshes before gear 3.
      - text: "Gear 3 CW; gear 4 CW"
        rationale: |
          This keeps the correct third direction but skips the last reversal. The third and fourth gears are neighbors. Check their direct external mesh.
      - text: "Gear 3 CCW; gear 4 CCW"
        rationale: |
          This treats all later gears as opposite the first without alternating. The second gear does oppose the first. Check whether that rule can be copied to every later gear.
    explanation: |
      Starting clockwise, the directions alternate at the three external meshes: clockwise, counter-clockwise, clockwise, counter-clockwise. Thus gear 3 is CW and gear 4 CCW.
    approved: true

  - id: q-mechanical-technical-reasoning-gear-rotations-0004
    type: gear-direction
    difficulty: medium
    figure: gear-rotations-04
    figureSpec:
      kind: gear-train
      gears: 6
      showFirstTurn: false
    stem: |
      The six shown gears have ordinary external meshes. Number them from left to right. Gear 6 is reported to turn CW. Using CW for clockwise and CCW for counter-clockwise, what are the directions of gears 1 and 2?
    choices:
      - text: "Gear 1 CCW; gear 2 CW"
        correct: true
      - text: "Gear 1 CW; gear 2 CCW"
        rationale: |
          This counts gears instead of the five meshes between the endpoints. That makes the first endpoint seem to match the last. Count direct contacts along the row.
      - text: "Gear 1 CW; gear 2 CW"
        rationale: |
          This skips the reversal between gears 1 and 2. Both are near the start of the row. Check their direct external contact.
      - text: "Gear 1 CCW; gear 2 CCW"
        rationale: |
          This finds the first direction but copies it to its neighbor. The unknown starting direction may dominate the work. Check one more reversal to gear 2.
    explanation: |
      Trace backward from gear 6: CW, CCW, CW, CCW, CW, CCW as the gear numbers decrease. Gear 1 is CCW and gear 2 CW.
    approved: true

  - id: q-mechanical-technical-reasoning-gear-rotations-0005
    type: gear-direction
    difficulty: medium
    figure: gear-rotations-05
    figureSpec:
      kind: gear-train
      gears: 2
      firstTurns: clockwise
      teeth: [10, 30]
    stem: |
      The two shown compatible external gears have 10 teeth on the left and 30 on the right. If the left gear makes 6 complete rotations, how many does the right gear make?
    choices:
      - text: "2 rotations"
        correct: true
      - text: "6 rotations"
        rationale: |
          This copies the input rotation count to the larger gear. Both pass the same teeth through the contact. Check whether they have the same number of teeth per turn.
      - text: "18 rotations"
        rationale: |
          This multiplies 6 by the tooth ratio of 3 instead of dividing. A larger gear may seem to need more turns. Check how many teeth each complete turn passes.
      - text: "3 rotations"
        rationale: |
          This reports the size ratio, 30/10, as the number of turns. Three is a useful intermediate value. Check that the input completes six turns.
    explanation: |
      The 10-tooth gear passes $10$ times $6=60$ teeth through the contact. The 30-tooth gear must pass the same 60 teeth. Its rotation count is $60/30=2$.
    approved: true

  - id: q-mechanical-technical-reasoning-gear-rotations-0006
    type: gear-direction
    difficulty: medium
    figure: gear-rotations-06
    figureSpec:
      kind: gear-train
      gears: 2
      firstTurns: clockwise
      teeth: [8, 16]
    stem: |
      The left gear shown has 8 teeth and turns at 24 rotations per minute. The compatible right gear must turn at 12 rotations per minute. How many teeth should it have?
    choices:
      - text: "16 teeth"
        correct: true
      - text: "4 teeth"
        rationale: |
          This multiplies 8 by the reversed speed ratio, 12/24. The two rates can be put in the wrong order. Check that a slower gear needs more teeth.
      - text: "12 teeth"
        rationale: |
          This copies the requested output rate as a tooth count. Twelve appears beside the right gear. Check the units before choosing a count.
      - text: "24 teeth"
        rationale: |
          This copies the input rotation rate as the tooth count. Twenty-four is prominent in the stem. Check which value is teeth and which is turns per minute.
    explanation: |
      Equal tooth passage requires input teeth times input rate to equal output teeth times output rate. The left passes $8$ times $24=192$ teeth per minute. Divide by the right's $12$ turns per minute to get $192/12=16$ teeth.
    approved: true

  - id: q-mechanical-technical-reasoning-gear-rotations-0007
    type: gear-direction
    difficulty: medium
    figure: gear-rotations-07
    figureSpec:
      kind: gear-train
      gears: 4
      firstTurns: clockwise
      layout: spokes
    stem: |
      The figure shows one central external gear meshing separately with three outer external gears. The outer gears do not touch each other. With the central arrow as marked, how do the outer gears rotate?
    choices:
      - text: "All turn counter-clockwise"
        correct: true
      - text: "All turn clockwise"
        rationale: |
          This copies the center's direction to its neighbors. The center drives them all. Check the reversal at each external contact.
      - text: "Neighboring outer gears alternate direction"
        rationale: |
          This treats neighboring positions around the center as a chain. The gears are arranged around a ring. Check whether those neighboring outer gears actually touch.
      - text: "Only one outer gear turns at a time"
        rationale: |
          This treats multiple contacts as taking turns transmitting motion. One center serves several gears. Check that all contacts remain engaged during rotation.
    explanation: |
      Each outer gear has one external mesh with the clockwise center. Each therefore turns counter-clockwise. The outer gears have the same direction because they all mesh with the same center.
    approved: true

  - id: q-mechanical-technical-reasoning-gear-rotations-0008
    type: gear-direction
    difficulty: hard
    figure: gear-rotations-08
    figureSpec:
      kind: gear-train
      gears: 3
      firstTurns: clockwise
    stem: |
      The three shown gears have ordinary external meshes. A report gives gear 1 CW, gear 2 CCW, and gear 3 CCW. CW means clockwise, and CCW counter-clockwise. Which depicted mesh has an inconsistent reported direction pair?
    choices:
      - text: "Gear 2 with gear 3"
        correct: true
      - text: "Gear 1 with gear 2"
        rationale: |
          This flags the contact that correctly reverses direction. Gear 1 and gear 2 are the first visible pair. Check their reported CW and CCW values.
      - text: "Both shown adjacent meshes"
        rationale: |
          This treats one bad contact as making every contact report wrong. The chain cannot operate as reported. Check each adjacent pair separately.
      - text: "Neither shown adjacent mesh"
        rationale: |
          This accepts equal directions at the second external contact. Both later gears are reported CCW. Check whether external teeth can stay engaged with that matching rotation.
    explanation: |
      The report gives opposite directions for gears 1 and 2, as an external mesh requires. It gives matching directions for gears 2 and 3. That second contact is inconsistent with the external-mesh rule.
    approved: true

  - id: q-mechanical-technical-reasoning-gear-rotations-0009
    type: gear-direction
    difficulty: hard
    figure: gear-rotations-09
    figureSpec:
      kind: gear-train
      gears: 2
      firstTurns: clockwise
      teeth: [40, 10]
    stem: |
      The figure shows a 40-tooth driver and a 10-tooth driven external gear. Replace the driven gear with a compatible 20-tooth gear, adjusting spacing to retain the mesh. The driver's rate and direction stay fixed. How does the driven gear compare with its old motion?
    choices:
      - text: "Half the old speed; same direction"
        correct: true
      - text: "Double the old speed; same direction"
        rationale: |
          This makes a doubled tooth count double angular speed. A larger gear can seem to produce more motion. Check the inverse tooth-count relation.
      - text: "Half the old speed; reversed direction"
        rationale: |
          This correctly reduces the speed but lets size reverse the direction. The larger replacement looks different. Check that the external connection still has one mesh.
      - text: "Same old speed; reversed direction"
        rationale: |
          This treats size as irrelevant to speed but decisive for direction. Both properties concern rotation. Check which one tooth count controls.
    explanation: |
      The replaced driven gear doubles from 10 to 20 teeth. At an unchanged input rate, the same tooth passage requires half as many turns. Both arrangements have one external mesh, so the driven direction remains opposite the driver.
    approved: true

  - id: q-mechanical-technical-reasoning-gear-rotations-0010
    type: gear-direction
    difficulty: hard
    figure: gear-rotations-10
    figureSpec:
      kind: gear-train
      gears: 3
      firstTurns: clockwise
      teeth: [12, 24, 36]
    stem: |
      The row shown has 12, 24, and 36 teeth from left to right. The left gear maintains 9 rotations per minute. Replace the 24-tooth middle gear with a compatible 48-tooth gear and adjust spacing so the same two external meshes remain. What changes at the right output gear?
    choices:
      - text: "Unchanged output speed and direction"
        correct: true
      - text: "Output speed doubles; direction unchanged"
        rationale: |
          This uses the larger middle gear as an extra multiplier. It has twice the old tooth count. Check how its slower rotation cancels its larger tooth count at the next mesh.
      - text: "Output speed halves; direction unchanged"
        rationale: |
          This keeps only the reduction at the first mesh. The larger middle gear does turn more slowly. Check the transmission from that middle gear to the unchanged output.
      - text: "Output direction reverses; speed unchanged"
        rationale: |
          This treats changing middle-gear size as changing the number of reversals. The gear looks different after replacement. Check whether the path still contains two external meshes.
    explanation: |
      The input passes $12$ times $9=108$ teeth per minute. Each external contact passes that same number onward. The output remains $108/36=3$ turns per minute, and two meshes preserve the input direction in either arrangement.
    approved: true

  - id: q-mechanical-technical-reasoning-gear-rotations-0011
    type: gear-direction
    difficulty: hard
    figure: gear-rotations-11
    figureSpec:
      kind: gear-train
      gears: 5
      firstTurns: counter-clockwise
      layout: spokes
    stem: |
      The shown external spoke gears each mesh only with the center. Compare the top outer gear with the other gears. Which statement about shared direction is correct?
    choices:
      - text: "All other outer gears share its direction"
        correct: true
      - text: "Only adjacent outer gears share its direction"
        rationale: |
          This lets closeness around the ring determine rotation. The adjacent outer positions can look connected. Check which gears actually mesh with the center.
      - text: "The center shares its direction; other outers oppose it"
        rationale: |
          This copies the top gear's direction to the center. They touch directly. Check the one reversal at that contact before tracing other outer gears.
      - text: "No other outer gear shares its direction"
        rationale: |
          This assumes every separate gear must oppose every other one. Each outer opposes the center. Check the two-contact path from one outer gear to another.
    explanation: |
      The marked center turns counter-clockwise, so every outer gear turns clockwise. Any two outer gears connect through two external meshes and therefore share direction. All other outer gears match the top outer gear.
    approved: true

  - id: q-mechanical-technical-reasoning-gear-rotations-0012
    type: gear-direction
    difficulty: medium
    figure: gear-rotations-12
    figureSpec:
      kind: gear-train
      gears: 2
      firstTurns: clockwise
      teeth: [15, 45]
    stem: |
      The shown compatible external gears have 15 teeth on the left and 45 on the right. If the right gear makes 4 complete rotations, how many does the left make?
    choices:
      - text: "12 rotations"
        correct: true
      - text: "4 rotations"
        rationale: |
          This copies the larger gear's turn count. Both are engaged at one contact. Check the differing teeth per full rotation.
      - text: "36 rotations"
        rationale: |
          This applies the ratio of 3 twice, giving 4 times 9. Both gears are counted as separate conversion steps. Check that there is just one mesh ratio here.
      - text: "8 rotations"
        rationale: |
          This uses a guessed factor of 2 instead of the tooth ratio of 3. Doubling is a familiar gear shortcut. Calculate the ratio from the stated counts.
    explanation: |
      The 45-tooth right gear passes $45$ times $4=180$ teeth. The 15-tooth left gear passes the same total, so its rotation count is $180/15=12$.
    approved: true

  - id: q-mechanical-technical-reasoning-gear-rotations-0013
    type: gear-direction
    difficulty: medium
    figure: gear-rotations-13
    figureSpec:
      kind: gear-train
      gears: 7
      firstTurns: clockwise
    stem: |
      Number the seven shown external gears from left to right. How do the directions of gears 2 and 6 compare with the marked direction of gear 1?
    choices:
      - text: "Both turn opposite to gear 1"
        correct: true
      - text: "Both turn in the same direction as gear 1"
        rationale: |
          This treats matching parity between gears 2 and 6 as matching gear 1. They do match each other. Check their even positions relative to the first gear.
      - text: "Gear 2 matches 1; gear 6 opposes 1"
        rationale: |
          This skips the direct reversal to gear 2. The far gear is checked but the nearest one is overlooked. Check the very first mesh.
      - text: "Gear 2 opposes 1; gear 6 matches 1"
        rationale: |
          This counts six gears rather than five meshes before gear 6. An even number of visible gears can suggest equal direction. Count direct contacts from the first gear.
    explanation: |
      Gear 2 is one external mesh from gear 1 and turns opposite it. Gear 6 is five external meshes from gear 1 and also turns opposite it. Both are counter-clockwise.
    approved: true

  - id: q-mechanical-technical-reasoning-gear-rotations-0014
    type: gear-direction
    difficulty: hard
    figure: gear-rotations-14
    figureSpec:
      kind: gear-train
      gears: 4
      firstTurns: clockwise
      teeth: [20, 10, 20, 10]
    stem: |
      The four shown external gears have 20, 10, 20, and 10 teeth from left to right. Gear 1 turns at 10 rpm as marked. Using CW for clockwise and CCW for counter-clockwise, give gear 2's direction and rate.
    choices:
      - text: "CCW at 20 rpm"
        correct: true
      - text: "CW at 20 rpm"
        rationale: |
          This calculates the speed but copies the driver's direction. The driver supplies the motion. Check the direction change at the direct external mesh.
      - text: "CCW at 5 rpm"
        rationale: |
          This reverses the tooth ratio and halves the rate. The second gear has half as many teeth. Check that fewer teeth per turn require more turns for the same passage.
      - text: "CW at 10 rpm"
        rationale: |
          This copies both direction and rate. The gears are part of one connected train. Check the external mesh and the different tooth counts separately.
    explanation: |
      Gear 2 has one external mesh with the clockwise driver, so it turns CCW. The driver passes $20$ times $10=200$ teeth per minute. Dividing by gear 2's 10 teeth gives $200/10=20$ rpm.
    approved: true

  - id: q-mechanical-technical-reasoning-gear-rotations-0015
    type: gear-direction
    difficulty: exam
    figure: gear-rotations-15
    figureSpec:
      kind: gear-train
      gears: 4
      firstTurns: clockwise
      teeth: [40, 20, 10, 40]
    stem: |
      The shown row has 40, 20, 10, and 40 teeth from left to right. Gear 1 turns clockwise at 3 rpm. CW means clockwise and CCW counter-clockwise. Give directions and rates in rpm for gears 2, 3, and 4, in that order.
    choices:
      - text: "6 CCW; 12 CW; 3 CCW"
        correct: true
      - text: "3 CW; 3 CW; 3 CW"
        rationale: |
          This copies the driver's rate and direction to every gear. They all belong to one train. Check each mesh reversal and each tooth count.
      - text: "6 CW; 12 CCW; 3 CW"
        rationale: |
          This gets the rates but reverses the direction track. The correct sizes can make the entire result look right. Start from the marked first direction and trace each contact.
      - text: "6 CCW; 12 CW; 12 CCW"
        rationale: |
          This copies gear 3's rate to gear 4. Their contact passes the same teeth per minute. Check that gear 4 has four times as many teeth per full turn.
    explanation: |
      The input passes $40$ times $3=120$ teeth per minute. Divide that passage by 20, 10, and 40 teeth to get 6, 12, and 3 rpm. The three external meshes alternate directions, giving CCW, CW, and CCW.
    approved: true

  - id: q-mechanical-technical-reasoning-gear-rotations-0016
    type: gear-direction
    difficulty: easy
    figure: gear-rotations-16
    figureSpec:
      kind: gear-train
      gears: 4
      firstTurns: clockwise
      teeth: [20, 20, 20, 20]
    stem: |
      The shown four compatible external gears each have 20 teeth. Remove one middle gear and adjust positions so the two unchanged endpoints remain connected through the remaining middle gear. Input motion stays fixed. What changes in the output motion?
    choices:
      - text: "Direction reverses; speed ratio stays"
        correct: true
      - text: "Direction stays; speed ratio doubles"
        rationale: |
          This leaves direction unchanged but makes gear count control the speed ratio. Fewer gears can look like a faster path. Check mesh parity for direction and endpoint teeth for speed.
      - text: "Direction reverses; speed ratio halves"
        rationale: |
          This gets the direction change but halves speed because a gear was removed. The path is shorter. Check whether intermediate tooth counts affect the endpoint ratio.
      - text: "Direction stays; speed ratio stays"
        rationale: |
          This keeps both properties unchanged. The same endpoints remain. Check that the number of direction reversals has changed.
    explanation: |
      Removing one middle gear changes three external meshes to two. That reverses the output's relation to the input direction. The endpoint tooth counts are unchanged, so their overall speed ratio remains unchanged.
    approved: false

  - id: q-mechanical-technical-reasoning-gear-rotations-0017
    type: gear-direction
    difficulty: medium
    figure: gear-rotations-17
    figureSpec:
      kind: gear-train
      gears: 2
      firstTurns: clockwise
      teeth: [12, 36]
    stem: |
      The two shown compatible external gears have 12 teeth on the left and 36 on the right. The left gear completes 6 rotations. How many successive tooth engagements of the right gear pass their contact during that motion?
    choices:
      - text: "72 teeth"
        correct: true
      - text: "2 teeth"
        rationale: |
          This gives the right gear's complete rotations instead of its tooth engagements. Two is the rotation result after dividing by 36. Check the requested counting unit.
      - text: "216 teeth"
        rationale: |
          This multiplies the right gear's 36 teeth by the left gear's six turns. The gears move together, which may suggest equal turns. Check which gear completes the stated six rotations.
      - text: "36 teeth"
        rationale: |
          This counts just one full turn of the right gear. Thirty-six is its tooth count. Check the total engagements generated by all six input turns.
    explanation: |
      The left gear passes $12$ times $6=72$ tooth engagements through the contact. The right gear must pass the same number at that contact. The requested count is 72 teeth.
    approved: false

  - id: q-mechanical-technical-reasoning-gear-rotations-0018
    type: gear-direction
    difficulty: hard
    figure: gear-rotations-18
    figureSpec:
      kind: gear-train
      gears: 2
      firstTurns: clockwise
      teeth: [20, 20]
    stem: |
      The two shown compatible external gears each have 20 teeth. The left makes one-quarter turn as marked. Using CW for clockwise and CCW for counter-clockwise, how far and in what direction does the right turn?
    choices:
      - text: "One-quarter turn CCW"
        correct: true
      - text: "One-quarter turn CW"
        rationale: |
          This gets the turn amount but copies the driver's direction. Equal gears do share speed magnitude. Check that an external mesh still reverses direction.
      - text: "One-half turn CCW"
        rationale: |
          This doubles the turn amount because two gears are involved. Both take part in the motion. Check that equal tooth counts give equal angular travel, not added travel.
      - text: "Three-quarter turn CCW"
        rationale: |
          This subtracts the input quarter from a full turn. A full circle can make three quarters seem like the opposite motion. Check the distinction between a position around a circle and actual travel.
    explanation: |
      The compatible gears have equal tooth counts, so they make equal fractions of a turn. One external mesh reverses direction. The right gear therefore makes one-quarter turn CCW.
    approved: false

  - id: q-mechanical-technical-reasoning-gear-rotations-0019
    type: gear-direction
    difficulty: hard
    figure: gear-rotations-19
    figureSpec:
      kind: gear-train
      gears: 2
      firstTurns: clockwise
      teeth: [20, 40]
    stem: |
      The two shown external gears have 20 and 40 teeth. Their teeth mesh without slipping. Which quantity matches between the two engaged tooth surfaces?
    choices:
      - text: "Equal tangential speeds at contact"
        correct: true
      - text: "Equal angular speeds despite unequal tooth counts"
        rationale: |
          This treats matching tooth motion as matching full-turn speed. Both gears meet at one contact. Check the distinction between movement along the rim and rotation about an axis.
      - text: "Equal rotations completed per minute"
        rationale: |
          This equates a shared contact rate with equal revolutions per minute. The gears transmit the same motion through their teeth. Check their different teeth per full turn.
      - text: "Equal numbers of teeth on each gear"
        rationale: |
          This assumes compatible teeth require equal tooth counts. Their teeth must mesh correctly. Check whether matching tooth shape also requires matching gear circumference.
    explanation: |
      The engaged teeth must move through the contact at matching linear speeds so they do not slip past one another. That is equal tangential speed at contact, even though the full-turn rates differ with tooth counts.
    approved: false

  - id: q-mechanical-technical-reasoning-gear-rotations-0020
    type: gear-direction
    difficulty: exam
    figure: gear-rotations-20
    figureSpec:
      kind: gear-train
      gears: 3
      showFirstTurn: false
      teeth: [18, 30, 45]
    stem: |
      The three shown external gears have 18, 30, and 45 teeth from left to right. The right gear turns counter-clockwise at 4 rpm. What are the direction and rate of the left gear?
    choices:
      - text: "10 rpm, counter-clockwise"
        correct: true
      - text: "10 rpm, clockwise"
        rationale: |
          This gets the rate but counts only one direction reversal. The endpoints are separated by a middle gear. Check both external contacts.
      - text: "4 rpm, counter-clockwise"
        rationale: |
          This copies the output rate to the smaller input-side gear. The same tooth passage connects them. Check the teeth per complete rotation at each endpoint.
      - text: "1.6 rpm, counter-clockwise"
        rationale: |
          This multiplies 4 by the reversed ratio 18/45. The two counts can be placed backward. Check that the fewer-tooth endpoint turns faster.
    explanation: |
      The right gear passes $45$ times $4=180$ teeth per minute. The left gear has 18 teeth, so its rate is $180/18=10$ rpm. Two external meshes separate the endpoints, so they share the reported counter-clockwise direction.
    approved: false

