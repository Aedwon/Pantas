meta:
  subject: "reasoning"
  topic: "mechanical-technical-reasoning"
  subtopic: "pulleys-and-levers"
  exams:
    - "dost-sei"
questions:
  - id: "q-mechanical-technical-reasoning-pulleys-and-levers-0001"
    type: "pulley-lever"
    difficulty: "easy"
    figure: "pulleys-and-levers-01"
    figureSpec:
      kind: "pulley-system"
      fixed: 1
      movable: 0
    stem: |
      The fixed pulley shown lifts a 50 kg mass at constant speed. Neglect friction and pulley mass, and use $g=9.8$ N/kg. What effort force is needed?
    choices:
      - text: "490 N"
        correct: true
      - text: "245 N"
        rationale: |
          This halves the weight because a pulley is present. A movable pulley can give that reduction. Check whether the shown pulley moves with the load.
      - text: "980 N"
        rationale: |
          This doubles the weight for the two visible sides of the rope. Both sides pass over the pulley. Count only segments supporting the moving load.
      - text: "50 N"
        rationale: |
          This uses the mass number as a force. The stem gives 50 kg. Convert mass to weight with the stated gravitational field.
    explanation: |
      The weight is $50 \times 9.8=490$ N. One rope segment supports the load. For steady lifting, its tension and the effort each equal 490 N.
    approved: true
  - id: "q-mechanical-technical-reasoning-pulleys-and-levers-0002"
    type: "pulley-lever"
    difficulty: "easy"
    figure: "pulleys-and-levers-02"
    figureSpec:
      kind: "pulley-system"
      fixed: 1
      movable: 1
    stem: |
      The shown ideal movable-load system has two supporting rope segments. A 60 kg mass rises 2 m at constant speed. Use $g=10$ N/kg. What effort and free-end travel are required?
    choices:
      - text: "300 N; 4 m"
        correct: true
      - text: "600 N; 2 m"
        rationale: |
          This treats the movable system as a fixed pulley. The load still rises 2 m. Count the two tensioned segments that share its weight.
      - text: "300 N; 2 m"
        rationale: |
          This reduces force but keeps the direct-lift distance. The stated rise is 2 m. Check that both supporting segments must shorten.
      - text: "150 N; 8 m"
        rationale: |
          This uses four supporting segments instead of two. The two pulley wheels may suggest two separate halvings. Count supports of the moving load, not wheels.
    explanation: |
      The load weighs $60 \times 10=600$ N. Two equal tensions support it, so effort is $600/2=300$ N. Each supporting segment shortens by 2 m, requiring $2 \times 2=4$ m of free-end travel.
    approved: true
  - id: "q-mechanical-technical-reasoning-pulleys-and-levers-0003"
    type: "pulley-lever"
    difficulty: "medium"
    figure: "pulleys-and-levers-03"
    figureSpec:
      kind: "pulley-system"
      fixed: 1
      movable: 1
      comparison: true
    stem: |
      The comparison figure shows an ideal fixed pulley on the left and an ideal two-support movable system on the right. Each raises an 800 N load through 3 m at constant speed. How does the effort work compare?
    choices:
      - text: "Both require 2,400 J"
        correct: true
      - text: "Left 2,400 J; right 1,200 J"
        rationale: |
          This halves work when effort force is halved. The movable system does reduce force. Check how its longer rope travel affects force times distance.
      - text: "Left 1,200 J; right 2,400 J"
        rationale: |
          This grants a work saving to the fixed pulley. Redirecting the pull can feel easier. Check the load force times the same rise in each setup.
      - text: "Left 2,400 J; right 4,800 J"
        rationale: |
          This doubles work for the longer rope travel without reducing effort. The right rope moves farther. Check both factors in force times distance.
    explanation: |
      Ideal effort work equals the gain in gravitational energy. For each load that gain is $800 \times 3=2400$ J. The movable system trades lower force for greater rope travel.
    approved: true
  - id: "q-mechanical-technical-reasoning-pulleys-and-levers-0004"
    type: "pulley-lever"
    difficulty: "medium"
    figure: "pulleys-and-levers-04"
    figureSpec:
      kind: "lever-balance"
      loadDistance: 2
      effortDistance: 5
    stem: |
      The shown horizontal, weightless lever carries a 980 N load 2 m left of the pivot. A downward effort acts 5 m right of the pivot. What effort holds static balance?
    choices:
      - text: "392 N"
        correct: true
      - text: "196 N"
        rationale: |
          This divides by the effort arm twice as if it were 10 m. A longer arm does reduce effort. Use the actual 5 m distance.
      - text: "490 N"
        rationale: |
          This divides by the 2 m load arm instead of using both arms. Two appears beside the load. Pair each force with its own distance.
      - text: "2,450 N"
        rationale: |
          This reverses the arm ratio, calculating $980(5/2)$. The longer arm may suggest greater force. Check that the longer effort arm lowers required force.
    explanation: |
      The load torque is $980 \times 2=1960$ N m. The opposite effort torque must match it. Thus $5F=1960$, giving $F=392$ N.
    approved: true
  - id: "q-mechanical-technical-reasoning-pulleys-and-levers-0005"
    type: "pulley-lever"
    difficulty: "medium"
    figure: "pulleys-and-levers-05"
    figureSpec:
      kind: "lever-balance"
      loadDistance: 3
      effortDistance: 9
    stem: |
      The weightless horizontal lever shown has arms of 3 m and 9 m. A downward 900 N load acts on the left and a downward 200 N effort on the right. What is its initial tendency when released?
    choices:
      - text: "Left end falls"
        correct: true
      - text: "Right end falls"
        rationale: |
          This compares only arm lengths. The right arm is longer. Compare force times distance on both sides.
      - text: "It remains balanced"
        rationale: |
          This assumes a three-to-one arm ratio always balances the lever. The arms do have that ratio. Check whether the forces have the matching inverse ratio.
      - text: "Both ends fall together"
        rationale: |
          This treats both downward forces as straight-line motion. They both press down. Check that the fixed pivot constrains the beam to rotate.
    explanation: |
      The left torque is $900 \times 3=2700$ N m. The right torque is $200 \times 9=1800$ N m. The greater left torque turns the load end down.
    approved: true
  - id: "q-mechanical-technical-reasoning-pulleys-and-levers-0006"
    type: "pulley-lever"
    difficulty: "medium"
    figure: "pulleys-and-levers-06"
    figureSpec:
      kind: "lever-balance"
      loadDistance: 1
      effortDistance: 5
    stem: |
      A weightless lever holds a 1,000 N load at 2 m with effort at 5 m. The load is repositioned 1 m from the same pivot while the effort point stays 5 m away, as shown. What is the new balancing effort?
    choices:
      - text: "200 N"
        correct: true
      - text: "800 N"
        rationale: |
          This doubles effort when the load arm is halved. Moving toward the pivot changes leverage. Check whether the load torque grows or shrinks.
      - text: "400 N"
        rationale: |
          This retains the original torque despite moving the load. The load weight stays fixed. Check its new distance from the pivot.
      - text: "100 N"
        rationale: |
          This halves the load torque twice. The arm is halved once. Apply that change only once.
    explanation: |
      The new load torque is $1000 \times 1=1000$ N m. Static balance requires $5F=1000$. Therefore $F=200$ N.
    approved: true
  - id: "q-mechanical-technical-reasoning-pulleys-and-levers-0007"
    type: "pulley-lever"
    difficulty: "medium"
    figure: "pulleys-and-levers-07"
    figureSpec:
      kind: "lever-balance"
      loadDistance: 4
      effortDistance: 8
    stem: |
      The shown weightless lever has a 1,000 N load 4 m left of the pivot. The greatest available downward effort is 500 N, applied on the right. What minimum effort-arm length allows balance?
    choices:
      - text: "8 m"
        correct: true
      - text: "2 m"
        rationale: |
          This reverses the force ratio, calculating $4(500/1000)$. The smaller effort number suggests a smaller distance. Check that less force needs a longer arm.
      - text: "4 m"
        rationale: |
          This copies the load arm even though the forces differ. Equal arms look symmetric. Check whether 500 N can match 1,000 N at equal arms.
      - text: "16 m"
        rationale: |
          This doubles the correctly required arm a second time. The load is twice the available effort. Apply that two-to-one ratio once.
    explanation: |
      The load torque is $1000 \times 4=4000$ N m. With 500 N of effort, $500d=4000$. The required distance is $d=8$ m.
    approved: true
  - id: "q-mechanical-technical-reasoning-pulleys-and-levers-0008"
    type: "pulley-lever"
    difficulty: "hard"
    figure: "pulleys-and-levers-08"
    figureSpec:
      kind: "pulley-system"
      fixed: 1
      movable: 0
    stem: |
      An ideal single fixed pulley raises a load at constant speed, as shown. Which feature explains its usefulness even though its ideal mechanical advantage is one?
    choices:
      - text: "It redirects the effort"
        correct: true
      - text: "It halves the lifting force"
        rationale: |
          This assigns movable-pulley behavior to a fixed wheel. Pulleys are often associated with force savings. Count the segments supporting the moving load.
      - text: "It halves the lifting work"
        rationale: |
          This confuses a convenient pull direction with an energy saving. Pulling can feel easier. Check the unchanged load weight and rise.
      - text: "It doubles the supporting tension"
        rationale: |
          This counts both rope sides as supports of the load. Both touch the pulley. Check which side attaches to the moving load.
    explanation: |
      The fixed pulley changes the rope direction. This allows effort to be applied in a convenient direction while tension still equals the load weight.
    approved: true
  - id: "q-mechanical-technical-reasoning-pulleys-and-levers-0009"
    type: "pulley-lever"
    difficulty: "hard"
    figure: "pulleys-and-levers-09"
    figureSpec:
      kind: "pulley-system"
      fixed: 1
      movable: 1
    stem: |
      In the ideal two-support movable system shown, a 500 N load rises 0.8 m at constant speed. How far must the free rope end travel?
    choices:
      - text: "1.6 m"
        correct: true
      - text: "0.4 m"
        rationale: |
          This halves distance because force is halved. Both can seem like savings. Check conservation of ideal work.
      - text: "0.8 m"
        rationale: |
          This copies the load rise to the rope end. That is true for a fixed pulley. Count the shortening in both load-supporting segments.
      - text: "3.2 m"
        rationale: |
          This multiplies the rise by four by counting pulley wheels as repeated halvings. Two wheels are visible. Use the two stated supporting segments.
    explanation: |
      Both supporting segments shorten by 0.8 m. The free end must supply their total shortening: $2 \times 0.8=1.6$ m.
    approved: true
  - id: "q-mechanical-technical-reasoning-pulleys-and-levers-0010"
    type: "pulley-lever"
    difficulty: "hard"
    figure: "pulleys-and-levers-10"
    figureSpec:
      kind: "lever-balance"
      loadDistance: 2
      effortDistance: 5
    stem: |
      For the weightless lever shown, $W$ is the downward load 2 m left of the pivot and $F$ is downward effort 5 m right of it. Which equation expresses static balance?
    choices:
      - text: "$5F=2W$"
        correct: true
      - text: "$2F=5W$"
        rationale: |
          This pairs each force with the other side's arm. The numbers appear on opposite sides of the pivot. Match every force to its own point of application.
      - text: "$F=W$"
        rationale: |
          This compares forces without their arms. Both forces act downward. Check their different turning effects about the pivot.
      - text: "$5F+2W=0$"
        rationale: |
          This adds positive torque magnitudes without opposite signs. Both forces point down. Check which rotation each force causes about the pivot.
    explanation: |
      Each torque is its force times its own perpendicular distance. The effort torque is $5F$ and the load torque is $2W$. Opposite torques match in static balance.
    approved: true
  - id: "q-mechanical-technical-reasoning-pulleys-and-levers-0011"
    type: "pulley-lever"
    difficulty: "hard"
    figure: "pulleys-and-levers-11"
    figureSpec:
      kind: "lever-balance"
      loadDistance: 2
      effortDistance: 8
    stem: |
      The weightless lever shown balances a 1,000 N load with 250 N of downward effort 8 m from the pivot. How far from the pivot is the load?
    choices:
      - text: "2 m"
        correct: true
      - text: "4 m"
        rationale: |
          This halves the effort arm despite a four-to-one force ratio. Halving is a familiar shortcut. Compare the stated force ratio.
      - text: "8 m"
        rationale: |
          This copies the effort arm to the load side. The lever is balanced. Check whether equal arms can balance unequal forces.
      - text: "32 m"
        rationale: |
          This uses the reversed force ratio $8(1000/250)$. The larger load number suggests a longer arm. Check that a heavier load needs a shorter arm.
    explanation: |
      The effort torque is $250 \times 8=2000$ N m. Balance gives $1000d=2000$. Thus $d=2$ m.
    approved: true
  - id: "q-mechanical-technical-reasoning-pulleys-and-levers-0012"
    type: "pulley-lever"
    difficulty: "hard"
    figure: "pulleys-and-levers-12"
    figureSpec:
      kind: "lever-balance"
      loadDistance: 3
      effortDistance: 18
    stem: |
      A weightless lever balances a 900 N load at 3 m with a downward effort of 150 N on the other side. What effort-arm length is required?
    choices:
      - text: "18 m"
        correct: true
      - text: "6 m"
        rationale: |
          This gives the force ratio $900/150$ as a distance. Six is a useful intermediate number. Multiply that ratio by the load arm.
      - text: "270 m"
        rationale: |
          This divides by the numerical load arm instead of effort force. The torque is 2,700 N m. Check that dividing torque by force yields meters.
      - text: "0.5 m"
        rationale: |
          This reverses the force ratio and uses $3(150/900)$. Both force values belong in the calculation. Check that the much smaller effort needs a longer arm.
    explanation: |
      The load torque is $900 \times 3=2700$ N m. Balance requires $150d=2700$. The effort arm is $d=18$ m.
    approved: true
  - id: "q-mechanical-technical-reasoning-pulleys-and-levers-0013"
    type: "pulley-lever"
    difficulty: "hard"
    figure: "pulleys-and-levers-13"
    figureSpec:
      kind: "pulley-system"
      fixed: 1
      movable: 1
    stem: |
      The shown movable block has two rope segments sharing its 640 N total weight. In an ideal single-rope system, what additional fact is needed to use $640/2$ as the effort?
    choices:
      - text: "Equal tension in both supports"
        correct: true
      - text: "An equal number of fixed and moving wheels"
        rationale: |
          This uses wheel counts to justify the force ratio. One of each is shown. Check the forces directly supporting the block.
      - text: "Twice as much mass in the moving wheel"
        rationale: |
          This treats added machine weight as extra advantage. The wheel moves with the load. Check that all moving weight adds to the force needing support.
      - text: "A free end that moves half as far as the load"
        rationale: |
          This reverses the distance trade-off. The force is being reduced. Check how both supporting rope lengths change as the block rises.
    explanation: |
      With equal tension $T$ in two supports, the total upward force is $2T$. At constant speed, $2T=640$, so $T=320$ N. The free-end effort equals that rope tension.
    approved: true
  - id: "q-mechanical-technical-reasoning-pulleys-and-levers-0014"
    type: "pulley-lever"
    difficulty: "hard"
    figure: "pulleys-and-levers-14"
    figureSpec:
      kind: "lever-balance"
      loadDistance: 2
      effortDistance: 6
    stem: |
      The weightless horizontal lever shown balances a 1,200 N load at 2 m with downward effort at 6 m. How much work does that effort do while the lever remains motionless?
    choices:
      - text: "0 J"
        correct: true
      - text: "400 J"
        rationale: |
          This reports the balancing force $1200(2/6)$ as work. The force calculation gives 400 N. Check that joules require force times displacement.
      - text: "2,400 J"
        rationale: |
          This reports the load torque $1200(2)$ as work. Torque and work can use similar unit products. Check whether the lever rotates or the force point moves.
      - text: "7,200 J"
        rationale: |
          This multiplies the load force by the effort arm. Both numbers occur in the drawing. Check that an arm length is not a displacement in a static setup.
    explanation: |
      Mechanical work requires displacement in the force direction. The lever is motionless, so the effort point moves zero distance. Its mechanical work is zero.
    approved: true
  - id: "q-mechanical-technical-reasoning-pulleys-and-levers-0015"
    type: "pulley-lever"
    difficulty: "exam"
    figure: "pulleys-and-levers-15"
    figureSpec:
      kind: "lever-balance"
      loadDistance: 2
      effortDistance: 8
    stem: |
      The weightless lever shown has a 1,000 N load at 2 m and downward effort at 8 m. A second ideal two-support movable system lifts the same load. Compare the effort forces required for steady motion or balance.
    choices:
      - text: "Lever 250 N; pulley 500 N"
        correct: true
      - text: "Lever 250 N; pulley 250 N"
        rationale: |
          This assumes the pulley also has advantage four. Both machines reduce effort. Count the two stated supports instead of copying the lever ratio.
      - text: "Lever 500 N; pulley 250 N"
        rationale: |
          This swaps the machines' force ratios. Each is a force-saving setup. Calculate the arm ratio and supporting-segment count separately.
      - text: "Lever 1,000 N; pulley 500 N"
        rationale: |
          This ignores the lever arms while applying the pulley rule. The load is 1,000 N in both. Check that the lever's effort arm is four times its load arm.
    explanation: |
      The lever balance gives $8F=1000(2)$, so $F=250$ N. For the stated two-support pulley, $2T=1000$, so its effort is 500 N.
    approved: true
  - id: "q-mechanical-technical-reasoning-pulleys-and-levers-0016"
    type: "pulley-lever"
    difficulty: "easy"
    figure: "pulleys-and-levers-16"
    figureSpec:
      kind: "pulley-system"
      fixed: 1
      movable: 1
      comparison: true
    stem: |
      The comparison figure shows a fixed system and a two-support movable system. Which part moves together with the load in the right-hand setup?
    choices:
      - text: "The lower pulley"
        correct: true
      - text: "The upper support beam"
        rationale: |
          This treats the whole apparatus as moving. The rope runs toward the beam. Check which part is fixed to the building.
      - text: "The free rope end at the same speed"
        rationale: |
          This gives the free end the load's speed. Both move during lifting. Check the two supporting segments that must each shorten.
      - text: "Every point of the rope with the same vertical motion"
        rationale: |
          This treats a flexible rope as a rigid moving block. Its tension is shared. Check that the rope bends and changes direction around a wheel.
    explanation: |
      The lower pulley belongs to the moving block. Its axle is attached to the load, so it rises with that load. This is what makes it a movable pulley.
    approved: false
  - id: "q-mechanical-technical-reasoning-pulleys-and-levers-0017"
    type: "pulley-lever"
    difficulty: "medium"
    figure: "pulleys-and-levers-17"
    figureSpec:
      kind: "lever-balance"
      loadDistance: 2
      effortDistance: 5
    stem: |
      The shown weightless lever balances a load with perpendicular effort. Both arm lengths are then doubled while the load weight stays fixed. How does the balancing effort change?
    choices:
      - text: "It stays the same"
        correct: true
      - text: "It doubles"
        rationale: |
          This keeps the doubled load arm but ignores the doubled effort arm. The load torque does double. Check that the effort torque also doubles at the old force.
      - text: "It halves"
        rationale: |
          This keeps the longer effort arm but ignores the longer load arm. A longer effort arm alone helps. Check both stated changes.
      - text: "It becomes four times as large"
        rationale: |
          This multiplies the two arm changes together. Both distances double. Check that the balance equation uses a ratio of arms.
    explanation: |
      The required effort is the load multiplied by load arm divided by effort arm. Doubling both arms leaves that ratio unchanged. The balancing effort therefore stays the same.
    approved: false
  - id: "q-mechanical-technical-reasoning-pulleys-and-levers-0018"
    type: "pulley-lever"
    difficulty: "hard"
    figure: "pulleys-and-levers-18"
    figureSpec:
      kind: "pulley-system"
      fixed: 1
      movable: 1
    stem: |
      In the shown ideal two-support system, the total moving weight is 600 N. A steady pull of 300 N raises it. If friction is present in an otherwise identical setup, what happens to the required steady pull?
    choices:
      - text: "It exceeds 300 N"
        correct: true
      - text: "It stays exactly 300 N"
        rationale: |
          This applies the ideal force result despite losses. The support count is unchanged. Check whether friction adds resistance.
      - text: "It falls below 300 N"
        rationale: |
          This treats friction as extra support. Friction can resist movement. Check that during lifting it opposes the required motion.
      - text: "It must equal exactly 600 N"
        rationale: |
          This assumes any friction removes all mechanical advantage. A direct lift needs 600 N. Check that the amount of friction has not been specified.
    explanation: |
      Friction opposes motion and uses some input energy. The input must cover both lifting the weight and overcoming that resistance. The required pull is therefore greater than the ideal 300 N.
    approved: false
  - id: "q-mechanical-technical-reasoning-pulleys-and-levers-0019"
    type: "pulley-lever"
    difficulty: "exam"
    figure: "pulleys-and-levers-19"
    figureSpec:
      kind: "lever-balance"
      loadDistance: 1
      effortDistance: 5
    stem: |
      The shown weightless lever has perpendicular load and effort forces. A proposed redesign doubles the load force and halves its arm while retaining the effort arm. How does the balancing effort compare?
    choices:
      - text: "It stays the same"
        correct: true
      - text: "It doubles"
        rationale: |
          This counts only the doubled load. The force increase stands out. Check the simultaneous change to its arm.
      - text: "It halves"
        rationale: |
          This counts only the shorter load arm. Moving a load closer helps. Check the simultaneous increase in load force.
      - text: "It becomes four times as large"
        rationale: |
          This treats a shorter load arm as increasing torque. Both values change. Check that torque multiplies force by its arm, not by the reciprocal arm.
    explanation: |
      The new load torque is twice the force times half the arm. Those factors cancel, leaving the original torque. With the effort arm unchanged, the same effort balances it.
    approved: false
  - id: "q-mechanical-technical-reasoning-pulleys-and-levers-0020"
    type: "pulley-lever"
    difficulty: "exam"
    figure: "pulleys-and-levers-20"
    figureSpec:
      kind: "lever-balance"
      loadDistance: 2
      effortDistance: 6
    stem: |
      The shown weightless lever has a 600 N load at 2 m and downward effort at 6 m. A 250 N effort is applied. What additional downward force at the load point keeps the beam horizontal?
    choices:
      - text: "150 N"
        correct: true
      - text: "50 N"
        rationale: |
          This subtracts the balance effort, 200 N, from 250 N without converting torque at the other arm. The force difference is 50 N. Compare the attachment's arm with the effort arm.
      - text: "300 N"
        rationale: |
          This uses the torque difference 300 as a force. The subtraction produces 300 N m. Divide by the attachment's moment arm.
      - text: "750 N"
        rationale: |
          This reports the total force equivalent to the effort torque on the load side. That force is $1500/2$. Subtract the existing load contribution.
    explanation: |
      The effort torque is $250 \times 6=1500$ N m. The existing load torque is $600 \times 2=1200$ N m. An additional opposing torque of 300 N m is needed. At the load arm of 2 m, the added force is $300/2=150$ N downward.
    approved: false
