questions:
  - id: q-mechanical-technical-reasoning-pulleys-and-levers-0001
    type: pulley-lever
    difficulty: easy
    figure: pulleys-and-levers-01
    figureSpec:
      kind: pulley-system
      fixed: 1
      movable: 0
    stem: |
      Figure shows a fixed pulley used to lift a 50 kg load. How much pulling force is required, and does the direction of pulling matter?
    choices:
      - text: 50 kg worth of force is required; only the direction of pulling changes (you can pull down to lift the load up)
        correct: true
      - text: 25 kg worth of force is required, since a pulley always halves the needed force
        rationale: |
          You assumed all pulleys reduce force. Fixed pulleys only redirect force without offering mechanical advantage.
      - text: 100 kg worth of force is required, since a fixed pulley doubles the needed force
        rationale: |
          You assumed fixed pulleys double effort. Fixed pulleys redirect pulling force without changing effort magnitude.
      - text: No force is required, since pulleys eliminate the need for effort entirely
        rationale: |
          You assumed pulleys eliminate work. Mechanical advantage cannot reduce required work to zero.
    explanation: |
      A fixed pulley only changes the direction of the force; it does not reduce the amount of force needed. The pulling force required still equals the load's weight, 50 kg worth of force.
    approved: true

  - id: q-mechanical-technical-reasoning-pulleys-and-levers-0002
    type: pulley-lever
    difficulty: medium
    figure: pulleys-and-levers-02
    figureSpec:
      kind: pulley-system
      fixed: 1
      movable: 1
    stem: |
      Figure shows a movable pulley used to lift a 60 kg load. How much pulling force is required, and how far must the rope be pulled to lift the load by 2 meters?
    choices:
      - text: 30 kg of force is required, and 4 meters of rope must be pulled
        correct: true
      - text: 60 kg of force is required, and 2 meters of rope must be pulled
        rationale: |
          You treated the movable pulley as fixed. Movable pulleys halve force ( \div 2 = 30$ kg) while doubling rope distance ( \times 2 = 4$ m).
      - text: 30 kg of force is required, and 2 meters of rope must be pulled
        rationale: |
          You correctly halved the force but forgot distance trade-off. Halving effort requires doubling rope distance to 4 meters.
      - text: 15 kg of force is required, and 8 meters of rope must be pulled
        rationale: |
          You applied a 4:1 mechanical advantage. A single movable pulley provides a 2:1 mechanical advantage ($ kg, $ m).
    explanation: |
      A single movable pulley halves the force needed: $60 \div 2 = 30$ kg worth of force. Since force is halved, the rope must be pulled twice as far as the load moves: $2 \times 2 = 4$ meters.
    approved: true

  - id: q-mechanical-technical-reasoning-pulleys-and-levers-0003
    type: pulley-lever
    difficulty: medium
    figure: pulleys-and-levers-03
    figureSpec:
      kind: pulley-system
      fixed: 1
      movable: 2
    stem: |
      Figure shows 2 movable pulleys working together to lift an 80 kg load. How much pulling force is required, and how far must the rope be pulled to lift the load by 3 meters?
    choices:
      - text: 20 kg of force is required, and 12 meters of rope must be pulled
        correct: true
      - text: 40 kg of force is required, and 6 meters of rope must be pulled
        rationale: |
          You applied a single movable pulley ratio (2:1) instead of 2 movable pulleys (4:1). Force is  \div 4 = 20$ kg and distance is  \times 4 = 12$ m.
      - text: 20 kg of force is required, and 6 meters of rope must be pulled
        rationale: |
          You correctly calculated force ( \div 4 = 20$ kg) but used a 2:1 distance multiplier instead of 4:1 ( \times 4 = 12$ m).
      - text: 10 kg of force is required, and 24 meters of rope must be pulled
        rationale: |
          You applied an 8:1 mechanical advantage instead of 4:1 for 2 movable pulleys.
    explanation: |
      With 2 movable pulleys, only one-quarter the load's weight in force is needed: $80 \div 4 = 20$ kg. The rope must be pulled four times the lifting distance: $3 \times 4 = 12$ meters.
    approved: true

  - id: q-mechanical-technical-reasoning-pulleys-and-levers-0004
    type: pulley-lever
    difficulty: medium
    figure: pulleys-and-levers-04
    figureSpec:
      kind: lever-balance
      loadDistance: 2
      effortDistance: 5
    stem: |
      A lever has a load of 100 kg placed 2 meters from the fulcrum. How much effort force is needed if applied 5 meters from the fulcrum on the other side?
    choices:
      - text: "40 kg"
        correct: true
      - text: "20 kg"
        rationale: |
          You divided load by 5 instead of calculating $\text{effort} \times 5 = 100 \times 2$. Effort is  \div 5 = 40$ kg.
      - text: "50 kg"
        rationale: |
          You divided 100 kg by 2 instead of computing torque equilibrium ($\text{effort} \times 5 = 100 \times 2$).
      - text: "250 kg"
        rationale: |
          You cross-multiplied incorrectly as $\text{effort} \times 2 = 100 \times 5$. Effort pairs with effort distance.
    explanation: |
      Using effort $\times$ effort distance = load $\times$ load distance: $\text{effort} \times 5 = 100 \times 2 = 200$, so $\text{effort} = 200 \div 5 = 40$ kg.
    approved: true

  - id: q-mechanical-technical-reasoning-pulleys-and-levers-0005
    type: pulley-lever
    difficulty: medium
    figure: pulleys-and-levers-05
    figureSpec:
      kind: lever-balance
      loadDistance: 3
      effortDistance: 9
    stem: |
      A lever has a load of 90 kg placed 3 meters from the fulcrum. How much effort force is needed if applied 9 meters from the fulcrum on the other side?
    choices:
      - text: "30 kg"
        correct: true
      - text: "27 kg"
        rationale: |
          You subtracted load distance from effort distance. Torque equilibrium requires $\text{effort} \times 9 = 90 \times 3 = 270$, giving $ kg.
      - text: "10 kg"
        rationale: |
          You divided load by effort distance directly ( \div 9$). You must multiply load by load distance first ( \times 3 = 270$).
      - text: "270 kg"
        rationale: |
          You forgot to divide total torque by effort distance ( \div 9 = 30$ kg).
    explanation: |
      Using effort $\times$ effort distance = load $\times$ load distance: $\text{effort} \times 9 = 90 \times 3 = 270$, so $\text{effort} = 270 \div 9 = 30$ kg.
    approved: true

  - id: q-mechanical-technical-reasoning-pulleys-and-levers-0006
    type: pulley-lever
    difficulty: medium
    figure: pulleys-and-levers-06
    figureSpec:
      kind: lever-balance
      loadDistance: 1
      effortDistance: 5
    stem: |
      Using the same 100 kg load and 5-meter effort distance as before, if the fulcrum is moved so the load is now only 1 meter from the fulcrum (instead of 2 meters), how does the required effort change?
    choices:
      - text: The required effort drops from 40 kg to 20 kg, since moving the fulcrum closer to the load reduces the effort needed
        correct: true
      - text: The required effort increases from 40 kg to 80 kg
        rationale: |
          You assumed moving fulcrum closer to load increases effort. Shorter load distance reduces required effort ($\text{effort} \times 5 = 100 \times 1 = 100 \implies 20$ kg).
      - text: The required effort stays the same at 40 kg, since only the effort distance affects the balance
        rationale: |
          You ignored load distance. Torque balance depends on both load distance and effort distance.
      - text: The required effort drops to 10 kg, since halving the load distance quarters the effort
        rationale: |
          You quartered effort instead of halving it ( \times 1 \div 5 = 20$ kg).
    explanation: |
      Recomputing: $\text{effort} \times 5 = 100 \times 1 = 100$, so $\text{effort} = 100 \div 5 = 20$ kg. Moving the fulcrum closer to the load (from 2 m to 1 m) reduced the required effort from 40 kg to 20 kg.
    approved: true

  - id: q-mechanical-technical-reasoning-pulleys-and-levers-0007
    type: pulley-lever
    difficulty: medium
    figure: pulleys-and-levers-07
    figureSpec:
      kind: lever-balance
      loadDistance: 4
      effortDistance: 5
    stem: |
      Using the same 100 kg load and 5-meter effort distance, if the fulcrum is instead moved so the load is now 4 meters from the fulcrum (instead of 2 meters), how does the required effort change?
    choices:
      - text: The required effort increases from 40 kg to 80 kg, since moving the fulcrum farther from the load requires more effort
        correct: true
      - text: The required effort decreases from 40 kg to 20 kg
        rationale: |
          You inverted the effect. Moving fulcrum farther from load increases load torque, requiring more effort ($\text{effort} \times 5 = 100 \times 4 = 400 \implies 80$ kg).
      - text: The required effort stays the same at 40 kg
        rationale: |
          You assumed load distance does not alter required effort.
      - text: The required effort increases to 400 kg
        rationale: |
          You forgot to divide total torque by effort distance ( \div 5 = 80$ kg).
    explanation: |
      Recomputing: $\text{effort} \times 5 = 100 \times 4 = 400$, so $\text{effort} = 400 \div 5 = 80$ kg. Moving the fulcrum farther from the load (from 2 m to 4 m) increased the required effort from 40 kg to 80 kg.
    approved: true

  - id: q-mechanical-technical-reasoning-pulleys-and-levers-0008
    type: pulley-lever
    difficulty: hard
    figure: pulleys-and-levers-08
    figureSpec:
      kind: pulley-system
      fixed: 1
      movable: 0
    stem: |
      A student sets up a single fixed pulley to lift a 70 kg load and claims, "using this pulley makes the load easier to lift, since pulleys always reduce the force needed." Is this claim correct?
    choices:
      - text: 'No: only movable pulleys (attached to the load) reduce the required force; a fixed pulley only changes the direction of the force, so the full 70 kg worth of force is still needed.'
        correct: true
      - text: 'Yes: any pulley, fixed or movable, always reduces the required force by half.'
        rationale: |
          You assumed fixed pulleys provide mechanical advantage. Only movable pulleys reduce required force.
      - text: 'Yes: but only because this specific load happens to weigh exactly 70 kg.'
        rationale: |
          You assumed load weight gives fixed pulleys mechanical advantage.
      - text: 'No: but only because fixed pulleys actually require more force than lifting without any pulley.'
        rationale: |
          You claimed fixed pulleys increase force. Fixed pulleys require equal force to the load weight.
    explanation: |
      Assuming a single fixed pulley "makes lifting easier" in terms of force is incorrect: it only makes lifting more convenient by letting you pull in a different direction, while still requiring the full weight's worth of force.
    approved: true

  - id: q-mechanical-technical-reasoning-pulleys-and-levers-0009
    type: pulley-lever
    difficulty: hard
    figure: pulleys-and-levers-09
    figureSpec:
      kind: pulley-system
      fixed: 1
      movable: 1
    stem: |
      A movable pulley halves the force needed to lift a 50 kg load, requiring only 25 kg of pulling force. A student assumes that since the force is halved, the rope-pulling distance must also be halved compared to how far the load rises. Is this assumption correct?
    choices:
      - text: 'No: reducing the required force always comes with a distance trade-off; a movable pulley that halves the force requires pulling the rope twice as far as the load actually rises, not half as far.'
        correct: true
      - text: 'Yes: halving the force always means halving the pulling distance as well.'
        rationale: |
          You ignored work conservation. Halving effort force requires doubling displacement distance.
      - text: 'Yes: but only because this specific load weighs 50 kg.'
        rationale: |
          You tied the work trade-off strictly to the specific load value.
      - text: 'No: but only because movable pulleys never affect rope-pulling distance at all.'
        rationale: |
          You claimed movable pulleys do not change distance. Movable pulleys double required rope travel.
    explanation: |
      Simple machines like pulleys reduce the force needed but always require moving a correspondingly greater distance: you cannot reduce force without some distance trade-off. A movable pulley halving the force also doubles the rope distance you must pull, not halves it.
    approved: true

  - id: q-mechanical-technical-reasoning-pulleys-and-levers-0010
    type: pulley-lever
    difficulty: hard
    figure: pulleys-and-levers-10
    figureSpec:
      kind: lever-balance
      loadDistance: 2
      effortDistance: 5
    stem: |
      A student sets up the lever balance equation as "effort × load distance = load × effort distance" for a lever with a 100 kg load 2 meters from the fulcrum and effort applied 5 meters from the fulcrum. Using this (incorrect) setup, they compute effort × 2 = 100 × 5, getting effort = 250 kg. What is wrong with this approach, and what is the correct effort?
    choices:
      - text: The student cross-paired the values incorrectly; the correct equation is effort × effort distance = load × load distance, giving effort × 5 = 100 × 2, so the correct effort is 40 kg, not 250 kg.
        correct: true
      - text: Nothing is wrong; 250 kg is the correct effort force needed.
        rationale: |
          You accepted cross-paired torque equations. Effort pairs with effort arm length.
      - text: The student's equation is correct, but their arithmetic is wrong; the correct effort using their equation is 200 kg.
        rationale: |
          You validated an incorrect mechanical formula.
      - text: The lever balance equation does not apply to this scenario at all.
        rationale: |
          You claimed lever balance formulas do not apply to levers.
    explanation: |
      Keep effort paired with its own distance, and load paired with its own distance: do not cross-pair effort's force with the load's distance (or vice versa). The correct equation, effort × effort distance = load × load distance, gives effort × 5 = 100 × 2 = 200, so effort = 40 kg.
    approved: true

  - id: q-mechanical-technical-reasoning-pulleys-and-levers-0011
    type: pulley-lever
    difficulty: medium
    figure: pulleys-and-levers-11
    figureSpec:
      kind: lever-balance
      loadDistance: 2
      effortDistance: 8
    stem: |
      A lever balances a load using 25 kg of effort applied 8 meters from the fulcrum, against a 100 kg load. How far from the fulcrum is the load placed?
    choices:
      - text: "2 meters"
        correct: true
      - text: "4 meters"
        rationale: |
          You divided $ by $ instead of $. Load distance is  \times 8 \div 100 = 2$ meters.
      - text: "8 meters"
        rationale: |
          You assumed load distance equals effort distance despite unequal forces.
      - text: "32 meters"
        rationale: |
          You multiplied effort distance by ratio  \div 25$ instead of dividing ( \div 4 = 2$ meters).
    explanation: |
      Using effort $\times$ effort distance = load $\times$ load distance: $25 \times 8 = 200 = 100 \times \text{load distance}$, so load distance $= 200 \div 100 = 2$ meters.
    approved: true

  - id: q-mechanical-technical-reasoning-pulleys-and-levers-0012
    type: pulley-lever
    difficulty: medium
    figure: pulleys-and-levers-12
    figureSpec:
      kind: lever-balance
      loadDistance: 3
      effortDistance: 18
    stem: |
      A lever balances a 90 kg load placed 3 meters from the fulcrum, using 15 kg of effort force. How far from the fulcrum must the effort be applied?
    choices:
      - text: "18 meters"
        correct: true
      - text: "6 meters"
        rationale: |
          You divided load weight by effort force ( \div 15$) without multiplying by load distance ( \div 15 = 18$ m).
      - text: "270 meters"
        rationale: |
          You forgot to divide total torque by effort force ( \div 15 = 18$ meters).
      - text: "5 meters"
        rationale: |
          You estimated the calculation ( \times 3 \div 15 = 18$ meters).
    explanation: |
      Using effort $\times$ effort distance = load $\times$ load distance: $15 \times \text{effort distance} = 90 \times 3 = 270$, so effort distance $= 270 \div 15 = 18$ meters.
    approved: true

  - id: q-mechanical-technical-reasoning-pulleys-and-levers-0013
    type: pulley-lever
    difficulty: medium
    figure: pulleys-and-levers-13
    figureSpec:
      kind: pulley-system
      fixed: 1
      movable: 3
    stem: |
      How many movable pulleys, working together, are needed to reduce the required lifting force to one-eighth of the load's weight?
    choices:
      - text: "3 movable pulleys"
        correct: true
      - text: "2 movable pulleys"
        rationale: |
          You calculated ^2 = 4$, which gives $\dfrac{1}{4}$ force. 3 pulleys give $\dfrac{1}{2^3} = \dfrac{1}{8}$ force.
      - text: "4 movable pulleys"
        rationale: |
          You calculated ^4 = 16$, which gives $\dfrac{1}{16}$ force. 3 pulleys give $\dfrac{1}{8}$ force.
      - text: "8 movable pulleys"
        rationale: |
          You used pulley count equal to denominator. Pulley count $ reduces force by $\dfrac{1}{2^n}$.
    explanation: |
      Each movable pulley halves the required force again: 1 pulley gives one-half, 2 pulleys give one-quarter, and 3 pulleys give one-eighth ($\dfrac{1}{2^3} = \dfrac{1}{8}$).
    approved: true

  - id: q-mechanical-technical-reasoning-pulleys-and-levers-0014
    type: pulley-lever
    difficulty: hard
    figure: pulleys-and-levers-14
    figureSpec:
      kind: lever-balance
      loadDistance: 2
      effortDistance: 6
    stem: |
      A 120 kg load sits on a lever, 2 meters from the fulcrum. Effort is applied 6 meters from the fulcrum, but the effort itself is supplied through a rope running over a single movable pulley system, which halves the pulling force needed at the rope. What is the final pulling force required at the rope?
    choices:
      - text: "20 kg"
        correct: true
      - text: "40 kg"
        rationale: |
          You calculated lever effort ( \times 2 \div 6 = 40$ kg) but omitted the movable pulley's 2:1 reduction ( \div 2 = 20$ kg).
      - text: "10 kg"
        rationale: |
          You quartered the lever effort instead of halving it ( \div 2 = 20$ kg).
      - text: "80 kg"
        rationale: |
          You multiplied lever effort by 2 instead of dividing ( \div 2 = 20$ kg).
    explanation: |
      First, the lever balance: $\text{effort} \times 6 = 120 \times 2 = 240$, so the lever requires $240 \div 6 = 40$ kg of effort force. Since a movable pulley halves the pulling force needed, the final rope-pulling force is $40 \div 2 = 20$ kg.
    approved: true

  - id: q-mechanical-technical-reasoning-pulleys-and-levers-0015
    type: pulley-lever
    difficulty: exam
    figure: pulleys-and-levers-15
    figureSpec:
      kind: lever-balance
      loadDistance: 2
      effortDistance: 6
    stem: |
      Two different setups are used to lift the same 100 kg load. Setup A uses a lever: the load is placed 2 meters from the fulcrum, and effort is applied 8 meters from the fulcrum. Setup B uses 2 movable pulleys working together directly on the load, with no lever involved. Compare the required force in each setup, and identify which setup requires the rope or effort to travel farther for the same 2-meter lift.
    choices:
      - text: Both setups require the same 25 kg of force (Setup A gives $100 \times 2 \div 8 = 25$ kg; Setup B gives $100 \div 4 = 25$ kg), but Setup B requires pulling the rope farther (8 meters, since 2 movable pulleys require 4 times the lifting distance) compared to Setup A's effort-side movement.
        correct: true
      - text: Setup A requires less force than Setup B, and both require the same travel distance.
        rationale: |
          You incorrectly claimed Setup A needs less force ($ kg vs $ kg) and ignored Setup B's 8m rope travel.
      - text: Setup B requires less force than Setup A, and Setup A requires a farther travel distance.
        rationale: |
          You inverted force and distance comparisons between lever and pulley setups.
      - text: Both setups require exactly the same force and the same travel distance, with no difference at all.
        rationale: |
          You ignored distance trade-offs. Setup B requires pulling 8m of rope to lift 2m.
    explanation: |
      Setup A (lever): $\text{effort} \times 8 = 100 \times 2 = 200$, so effort $= 200 \div 8 = 25$ kg. Setup B (2 movable pulleys): force $= 100 \div 4 = 25$ kg, matching Setup A's force, but Setup B requires pulling the rope $2 \times 4 = 8$ meters to lift the load 2 meters, illustrating that different mechanisms can reach the same force reduction with different distance trade-offs.
    approved: true
