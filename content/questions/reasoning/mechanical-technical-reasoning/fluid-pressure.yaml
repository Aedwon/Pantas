meta:
  subject: reasoning
  topic: mechanical-technical-reasoning
  subtopic: fluid-pressure
  exams: [ dost-sei ]
questions:
  - id: q-mechanical-technical-reasoning-fluid-pressure-0001
    type: fluid-pressure
    difficulty: easy
    figure: fluid-pressure-01
    figureSpec:
      kind: fluid-vessel
      vessel: column
      points: ["A", "B"]
    stem: |
      The shown container holds uniform-density water at rest under ordinary gravity. Which marked point has greater pressure?
    choices:
      - text: "Point B"
        correct: true
      - text: "Point A"
        rationale: |
          This treats closeness to open air as giving greater water pressure. Air pressure is applied at the surface. Check the additional depth of water above each point.
      - text: "Equal at the two points"
        rationale: |
          This assumes a single liquid has the same pressure everywhere. Its density is the same. Check whether the two points are at the same depth.
      - text: "Zero at the two points"
        rationale: |
          This assumes pressure requires moving water. Still water can look inactive. Check the weight of the water above each point.
    explanation: |
      The water is at rest, so pressure increases with depth below its surface. The diagram places B deeper than A. B therefore has greater pressure.
    approved: true

  - id: q-mechanical-technical-reasoning-fluid-pressure-0002
    type: fluid-pressure
    difficulty: easy
    figure: fluid-pressure-02
    figureSpec:
      kind: fluid-vessel
      vessel: connected
      columns: 2
    stem: |
      The connected vessels shown contain the same water at rest. Both surfaces have the same air pressure, and capillary effects are negligible. What explains the displayed equal surface elevations?
    choices:
      - text: "Hydrostatic balance"
        correct: true
      - text: "Equal total water volumes"
        rationale: |
          This treats equal height as equal volume. Both vessels have water to the same elevation. Check their different widths.
      - text: "Equal vessel cross-sections"
        rationale: |
          This treats pressure balance as requiring equal widths. Matching dimensions can seem necessary for balance. Check whether pressure at depth depends on the container width.
      - text: "The order of pouring water"
        rationale: |
          This treats filling history as fixing the final level. Water may begin in one arm. Check that it can move through the connection until pressure balances.
    explanation: |
      The water must have equal pressure at the connection when it rests. With one liquid and equal air pressure above it, that balance requires free surfaces at the same height.
    approved: true

  - id: q-mechanical-technical-reasoning-fluid-pressure-0003
    type: fluid-pressure
    difficulty: medium
    figure: fluid-pressure-03
    figureSpec:
      kind: fluid-vessel
      vessel: pipe
      widths: [3, 1]
    stem: |
      Water flows steadily through the shown unbranched pipe, without leaks. Treat it as incompressible. Compared with the wide section, what is the mean speed in the narrow section?
    choices:
      - text: "Higher speed"
        correct: true
      - text: "Lower speed"
        rationale: |
          This treats a small opening as automatically slower. A tight passage can look restrictive. Check the equal volume per second passing through both areas.
      - text: "Unchanged speed"
        rationale: |
          This confuses equal volume flow with equal speed. The same water passes both sections. Check whether the cross-sectional areas match.
      - text: "Zero volume flow"
        rationale: |
          This treats a narrowed opening as a complete blockage. The passage looks small. Check that it remains open and the flow is stated to be steady.
    explanation: |
      The same volume passes each section per second. A smaller area needs a higher speed to carry that volume. The narrow section therefore has higher speed.
    approved: true

  - id: q-mechanical-technical-reasoning-fluid-pressure-0004
    type: fluid-pressure
    difficulty: medium
    figure: fluid-pressure-04
    figureSpec:
      kind: fluid-vessel
      vessel: pipe
      widths: [3, 1]
    stem: |
      The shown horizontal pipe carries steady incompressible ideal flow along one path. There are no pumps or energy losses between sections. How does static pressure in the narrow section compare with the wide section?
    choices:
      - text: "Lower in the narrow section"
        correct: true
      - text: "Higher in the narrow section"
        rationale: |
          This equates faster motion with higher static pressure. A fast jet can feel forceful. Check the pressure term separately from the motion-energy term.
      - text: "Equal in both sections"
        rationale: |
          This applies an at-rest equal-height rule to flowing water. Both sections are horizontal. Check whether their flow speeds differ.
      - text: "Determined only by wall thickness"
        rationale: |
          This treats pipe strength as the source of the fluid-pressure comparison. Thicker walls can withstand pressure. Check the fluid's energy relation under the stated ideal conditions.
    explanation: |
      Continuity makes the water faster in the narrow section. In an ideal horizontal flow with no added energy or losses, Bernoulli's equation balances that higher motion energy with lower static pressure.
    approved: true

  - id: q-mechanical-technical-reasoning-fluid-pressure-0005
    type: fluid-pressure
    difficulty: medium
    figure: fluid-pressure-05
    figureSpec:
      kind: fluid-vessel
      vessel: connected
      columns: 3
    stem: |
      The three shown vessels hold the same water in static equilibrium, with equal air pressure and negligible capillary effects. Compare pressure at equal elevations just above the bottom connection. How do the pressures relate?
    choices:
      - text: "Equal at the compared locations"
        correct: true
      - text: "Greatest in the widest vessel"
        rationale: |
          This uses the total water amount to compare pressure. The widest vessel holds more water. Check depth at the compared locations instead of total volume.
      - text: "Greatest in the narrowest vessel"
        rationale: |
          This assumes narrow walls compress the liquid more. The vessel looks confined. Check the hydrostatic variables: surface pressure, density, gravity, and depth.
      - text: "Greatest in the middle-width vessel"
        rationale: |
          This assumes a medium shape gives a preferred pressure. The middle-width vessel looks balanced. Check whether width appears in the pressure-at-depth rule.
    explanation: |
      The connected water is at rest with equal surface pressure. At the same elevation, the depths below the common surface are equal. The hydrostatic pressures are therefore equal.
    approved: true

  - id: q-mechanical-technical-reasoning-fluid-pressure-0006
    type: fluid-pressure
    difficulty: medium
    figure: fluid-pressure-06
    figureSpec:
      kind: fluid-vessel
      vessel: column
      points: ["X", "Y", "Z"]
    stem: |
      The shown container holds uniform-density water at rest. Rank its marked points from lowest to highest pressure.
    choices:
      - text: "X, then Y, then Z"
        correct: true
      - text: "Z, then Y, then X"
        rationale: |
          This reverses the depth-pressure order. A point near open air may seem to have greater pressure. Check which point has more water above it.
      - text: "X, Y, and Z are equal"
        rationale: |
          This treats one connected body of water as uniform in pressure. The density is uniform. Check whether the marked depths are also equal.
      - text: "Y, then X, then Z"
        rationale: |
          This puts the middle depth below the shallowest depth in pressure. Y can look like the central reference point. Check the vertical order from the free surface.
    explanation: |
      The diagram orders the points from shallowest X to middle Y to deepest Z. Pressure in the uniform water at rest increases with depth. The lowest-to-highest order is X, Y, Z.
    approved: true

  - id: q-mechanical-technical-reasoning-fluid-pressure-0007
    type: fluid-pressure
    difficulty: medium
    figure: fluid-pressure-07
    figureSpec:
      kind: fluid-vessel
      vessel: pipe
      widths: [1, 3]
    stem: |
      Water flows steadily from left to right through the shown unbranched pipe without leaks. Treat it as incompressible. How does the mean speed in the wide section compare with the narrow section?
    choices:
      - text: "Lower speed"
        correct: true
      - text: "Higher speed"
        rationale: |
          This treats more room as making the water faster. A wider passage can seem easier to move through. Check how equal volume flow is shared across a larger area.
      - text: "Unchanged speed"
        rationale: |
          This treats equal volume flow as equal speed. The same stream passes both sections. Check the area change.
      - text: "Zero volume flow"
        rationale: |
          This treats expansion as an end to all flow. Slower motion may look like stopping. Check the stated steady passage through an open pipe.
    explanation: |
      Steady incompressible flow carries the same volume per second through both sections. The wider area needs less speed for that volume. The water therefore slows in the wider section.
    approved: true

  - id: q-mechanical-technical-reasoning-fluid-pressure-0008
    type: fluid-pressure
    difficulty: medium
    figure: fluid-pressure-08
    figureSpec:
      kind: fluid-vessel
      vessel: pipe
      widths: [1, 3]
    stem: |
      The shown horizontal expansion carries steady incompressible ideal flow along one path, with no pumps or losses. How does static pressure in the wide section compare with the narrow section?
    choices:
      - text: "Higher in the wide section"
        correct: true
      - text: "Lower in the wide section"
        rationale: |
          This equates lower speed with lower static pressure. A less forceful-looking stream can suggest lower pressure. Check the ideal pressure-plus-motion-energy balance.
      - text: "Equal in both sections"
        rationale: |
          This applies hydrostatic equality to flowing water. The sections share an elevation. Check whether the motion-energy terms are equal.
      - text: "Fixed by total water volume alone"
        rationale: |
          This compares the amount of water instead of the flow energy. The wider section can hold more water. Check the terms in the horizontal Bernoulli equation.
    explanation: |
      The wider section carries the same flow at a lower speed. At equal elevation under ideal lossless conditions, that lower motion-energy term is balanced by a higher static-pressure term.
    approved: true

  - id: q-mechanical-technical-reasoning-fluid-pressure-0009
    type: fluid-pressure
    difficulty: hard
    figure: fluid-pressure-09
    figureSpec:
      kind: fluid-vessel
      vessel: connected
      columns: 2
    stem: |
      The connected-vessel figure represents the standard equal-level equilibrium for one liquid, neglecting capillary effects. Which surface condition is required by that model?
    choices:
      - text: "Equal pressure above both surfaces"
        correct: true
      - text: "Equal water volume in both arms"
        rationale: |
          This treats a volume match as the condition for matching levels. Volume and height are linked within one fixed shape. Check the different widths of these arms.
      - text: "Equal widths of the connected arms"
        rationale: |
          This requires identical geometry for pressure balance. Symmetric vessels would look easier to balance. Check whether hydrostatic pressure at depth depends on width.
      - text: "The same filling time for both arms"
        rationale: |
          This gives filling history control over equilibrium. Simultaneous filling can look fair or balanced. Check whether water can still move between the arms afterward.
    explanation: |
      For the same static liquid, equal pressure above the surfaces lets equal surface height balance pressure at the connection. That surface-pressure equality is part of the equal-level model.
    approved: true

  - id: q-mechanical-technical-reasoning-fluid-pressure-0010
    type: fluid-pressure
    difficulty: hard
    figure: fluid-pressure-10
    figureSpec:
      kind: fluid-vessel
      vessel: pipe
      widths: [2, 1]
    stem: |
      The two circular pipe sections shown have areas of 12 and 3 square centimeters. Water flows steadily without leaks, and its mean speed in the wide section is 5 centimeters per second. What is its mean speed in the narrow section?
    choices:
      - text: "20 cm/s"
        correct: true
      - text: "10 cm/s"
        rationale: |
          This uses the diameter ratio of two instead of the area ratio of four. The drawn pipe width can make that ratio seem right. Check that continuity uses cross-sectional area.
      - text: "1.25 cm/s"
        rationale: |
          This multiplies 5 by the reversed area ratio, 3/12. The two areas may be put into the equation backward. Check that a smaller area needs a larger speed at the same flow.
      - text: "60 cm/s"
        rationale: |
          This reports area times speed as a speed. Sixty is the correct volume-flow result. Check its units before choosing the requested velocity.
    explanation: |
      Equal volume flow gives area times speed equal in both sections. The wide section carries $12$ times $5=60$ cubic centimeters per second. Divide by the narrow area $3$ square centimeters: $60/3=20$ centimeters per second.
    approved: true

  - id: q-mechanical-technical-reasoning-fluid-pressure-0011
    type: fluid-pressure
    difficulty: hard
    figure: fluid-pressure-11
    figureSpec:
      kind: fluid-vessel
      vessel: pipe
      widths: [3, 1]
    stem: |
      In the shown horizontal pipe, water has steady incompressible ideal flow. Which term in Bernoulli's equation increases in the narrow section?
    choices:
      - text: "Kinetic term"
        correct: true
      - text: "Static pressure"
        rationale: |
          This confuses fast motion with higher static pressure. A fast spray can feel stronger. Check which energy term directly contains speed squared.
      - text: "Elevation term"
        rationale: |
          This treats faster motion as a change in height. Height can change fluid energy in other setups. Check that this pipe is horizontal.
      - text: "Fluid density"
        rationale: |
          This treats a narrowed passage as squeezing an incompressible liquid into a higher density. Narrowing can look like compression. Check the stated incompressible model.
    explanation: |
      The narrow section has higher speed under continuity. The kinetic term is one-half density times speed squared, so it increases as speed increases.
    approved: true

  - id: q-mechanical-technical-reasoning-fluid-pressure-0012
    type: fluid-pressure
    difficulty: medium
    figure: fluid-pressure-12
    figureSpec:
      kind: fluid-vessel
      vessel: connected
      columns: 4
    stem: |
      The figure shows the initial equilibrium of four connected open vessels containing the same water. A small amount is added to one vessel, with no overflow or leaks. Once the water settles again under the same air pressure, what happens to the surfaces?
    choices:
      - text: "All four surfaces rise to a common higher elevation."
        correct: true
      - text: "Only the receiving vessel has a higher final surface."
        rationale: |
          This keeps the initial local rise after equilibrium. Water is added to only one vessel first. Check that the vessels remain connected.
      - text: "The widest vessel has the highest final surface."
        rationale: |
          This uses storage capacity to choose the highest surface. The widest vessel holds more water. Check whether width changes the equilibrium surface height.
      - text: "The narrowest vessel has the lowest final surface."
        rationale: |
          This uses narrowness to choose the lowest surface. A small vessel can hold less total water. Check the difference between amount and surface elevation.
    explanation: |
      The added water increases the total amount. It redistributes through the connections until pressure balances again. With the same liquid and equal surface pressure, the four surfaces share one higher elevation.
    approved: true

  - id: q-mechanical-technical-reasoning-fluid-pressure-0013
    type: fluid-pressure
    difficulty: hard
    figure: fluid-pressure-13
    figureSpec:
      kind: fluid-vessel
      vessel: pipe
      widths: [3, 1, 3]
    stem: |
      The shown wide-narrow-wide pipe carries steady incompressible ideal flow at one elevation, with no pumps or energy losses. Relative to the two equal wide ends, how does the middle section compare?
    choices:
      - text: "Fastest flow, lowest static pressure"
        correct: true
      - text: "Slowest flow, highest static pressure"
        rationale: |
          This reverses both continuity and the ideal pressure comparison. The tight passage may seem to resist motion. Check the equal volume flow and energy balance separately.
      - text: "Same flow speed and static pressure"
        rationale: |
          This treats equal volume flow as equal speed and pressure. The same water passes all three sections. Check their different cross-sectional areas.
      - text: "Fastest flow, highest static pressure"
        rationale: |
          This gets the speed increase but equates it with higher static pressure. A fast jet can feel forceful. Check the static-pressure term separately from motion energy.
    explanation: |
      Equal volume flow makes the smaller middle area faster than either wide end. At the same elevation with no energy added or lost, the greater kinetic term is balanced by lower static pressure. The middle is fastest and has the lowest static pressure.
    approved: true

  - id: q-mechanical-technical-reasoning-fluid-pressure-0014
    type: fluid-pressure
    difficulty: exam
    figure: fluid-pressure-14
    figureSpec:
      kind: fluid-vessel
      vessel: pipe
      widths: [3, 1, 2]
    stem: |
      The shown horizontal pipe carries steady ideal incompressible flow along one path, with no pumps or losses. Let P be static pressure, rho the constant density, and v the flow speed. Which expression stays constant between its sections?
    choices:
      - text: "$P+\\dfrac{1}{2}\\rho v^2$"
        correct: true
      - text: "$P-\\dfrac{1}{2}\\rho v^2$"
        rationale: |
          This subtracts the motion-energy term instead of adding it. Pressure falls as speed rises, so subtraction may look tempting. Check how the two energy contributions are combined.
      - text: "$\\dfrac{1}{2}\\rho v^2$"
        rationale: |
          This keeps only the motion-energy term. Speed is easy to notice in a narrowing pipe. Check whether static pressure can change to balance that term.
      - text: "$P+\\rho v^2$"
        rationale: |
          This omits the one-half factor in the kinetic term. Density times speed squared looks like the right ingredients. Check the coefficient in Bernoulli's equation.
    explanation: |
      Bernoulli's equation adds static pressure to motion energy per unit volume and the height term. Height is constant here. Thus $P$ plus one-half $\rho v^2$ stays constant along the flow path.
    approved: true

  - id: q-mechanical-technical-reasoning-fluid-pressure-0015
    type: fluid-pressure
    difficulty: easy
    figure: fluid-pressure-15
    figureSpec:
      kind: fluid-vessel
      vessel: column
      points: ["A", "B", "C"]
    stem: |
      The shown uniform liquid is at rest. A, B, and C are equally spaced vertically below its surface. Compare the increase in pressure from A to B with the increase from B to C.
    choices:
      - text: "Equal pressure increases"
        correct: true
      - text: "A larger increase from A to B"
        rationale: |
          This gives the shallow interval a larger pressure change. Proximity to surface air may seem to matter more there. Check that both intervals have the same depth difference.
      - text: "A larger increase from B to C"
        rationale: |
          This makes the lower interval's pressure increase larger just because it is deeper. Its total pressure is greater. Check the difference between a total pressure and an increment.
      - text: "Zero pressure increases"
        rationale: |
          This assumes equilibrium removes depth differences in pressure. The liquid is still. Check that hydrostatic pressure continues to increase with depth.
    explanation: |
      The points are equally spaced in depth. In the same uniform liquid at rest, each pressure increase equals density times gravity times the depth increase. Equal depth increases therefore give equal pressure increases.
    approved: false

  - id: q-mechanical-technical-reasoning-fluid-pressure-0016
    type: fluid-pressure
    difficulty: medium
    figure: fluid-pressure-16
    figureSpec:
      kind: fluid-vessel
      vessel: pipe
      widths: [3, 1]
    stem: |
      The figure shows a pipe while water flows. The flow is then stopped, and the connected water reaches rest under uniform gravity. Compare static pressures at the same center-line elevation in the wide and narrow sections.
    choices:
      - text: "Equal static pressures"
        correct: true
      - text: "Higher pressure in the narrow section"
        rationale: |
          This treats a narrow space as creating higher pressure at rest. Confinement can look like compression. Check the same-elevation hydrostatic condition.
      - text: "Lower pressure in the narrow section"
        rationale: |
          This keeps a flowing-fluid speed-pressure comparison after flow has stopped. The figure shows the earlier flow. Check the new state stated in the question.
      - text: "Zero pressure in both sections"
        rationale: |
          This treats zero speed as zero pressure. Motion has ceased. Check that water at rest still has hydrostatic pressure.
    explanation: |
      After the water reaches rest, hydrostatic pressure depends on depth and surface pressure. The compared center-line points share an elevation in one connected liquid. Their static pressures are equal.
    approved: false

  - id: q-mechanical-technical-reasoning-fluid-pressure-0017
    type: fluid-pressure
    difficulty: medium
    figure: fluid-pressure-17
    figureSpec:
      kind: fluid-vessel
      vessel: column
      points: ["A", "B"]
    stem: |
      The shown water is at rest. A is 0.10 meter and B 0.70 meter below the surface. Use density 1000 kilograms per cubic meter and gravity 10 newtons per kilogram. Surface pressure is 100 kilopascals. By how much does pressure at B exceed pressure at A?
    choices:
      - text: "6 kPa"
        correct: true
      - text: "7 kPa"
        rationale: |
          This gives B's gauge pressure instead of the increase from A. The deeper point is the target of comparison. Check whether A's depth must be subtracted.
      - text: "106 kPa"
        rationale: |
          This adds the 100-kilopascal surface pressure to the difference. Absolute pressure includes that surface term. Check that the same surface pressure cancels in a difference.
      - text: "0.6 kPa"
        rationale: |
          This divides 6000 pascals by 10000 instead of 1000. Unit conversion can shift a decimal place. Check the number of pascals in one kilopascal.
    explanation: |
      The depth difference is $0.70-0.10=0.60$ meter. Use the hydrostatic pressure difference: $1000$ times $10$ times $0.60=6000$ pascals. Since $1000$ pascals is $1$ kilopascal, the increase is $6$ kilopascals.
    approved: false

  - id: q-mechanical-technical-reasoning-fluid-pressure-0018
    type: fluid-pressure
    difficulty: hard
    figure: fluid-pressure-18
    figureSpec:
      kind: fluid-vessel
      vessel: column
      points: ["A", "B"]
    stem: |
      The figure shows the initial liquid at rest. It is replaced by a liquid of twice its density, at the same surface height and positive surface pressure. At marked point B, which quantity doubles?
    choices:
      - text: "Gauge pressure"
        correct: true
      - text: "Absolute pressure"
        rationale: |
          This doubles the unchanged surface-pressure term along with the liquid contribution. Absolute pressure includes both parts. Check which part depends on density.
      - text: "Surface pressure"
        rationale: |
          This makes the air pressure change when the liquid density changes. Both contribute to the total pressure. Check the stated unchanged pressure above the liquid.
      - text: "Immersion depth"
        rationale: |
          This treats a density change as a depth change. Both can increase pressure. Check which quantity the question actually changes.
    explanation: |
      Gauge pressure is the fluid-pressure increase above the surface pressure. At fixed depth it equals density times gravity times depth. Doubling density doubles that part of the pressure.
    approved: false

  - id: q-mechanical-technical-reasoning-fluid-pressure-0019
    type: fluid-pressure
    difficulty: hard
    figure: fluid-pressure-19
    figureSpec:
      kind: fluid-vessel
      vessel: pipe
      widths: [3, 1]
    stem: |
      The shown pipe has steady incompressible flow at one elevation. Which additional assumption permits the ideal Bernoulli pressure-speed comparison to be used directly between sections?
    choices:
      - text: "No pumps or energy losses"
        correct: true
      - text: "The direction of the flow arrow"
        rationale: |
          This uses flow direction as the condition for energy conservation. The arrow helps read the path. Check whether direction itself rules out energy input or losses.
      - text: "The total volume of water in the pipe"
        rationale: |
          This uses total amount of water instead of changes in flow energy. A wide section can contain more water. Check the assumptions behind the local pressure-speed equation.
      - text: "The thickness of the pipe walls"
        rationale: |
          This uses structural thickness as a substitute for fluid-energy conditions. Thick walls can hold pressure safely. Check whether the walls' thickness establishes lossless flow.
    explanation: |
      The direct ideal Bernoulli comparison needs no energy added or lost between the sections. With equal height, the pressure and motion-energy terms then balance each other.
    approved: false

  - id: q-mechanical-technical-reasoning-fluid-pressure-0020
    type: fluid-pressure
    difficulty: exam
    figure: fluid-pressure-20
    figureSpec:
      kind: fluid-vessel
      vessel: column
      points: ["A", "B"]
    stem: |
      The shown uniform water is at rest. B is seven times as deep below the surface as A, and A has positive depth. Surface pressure is positive. Which statement describes the ratio of total absolute pressure at B to that at A?
    choices:
      - text: "Greater than 1 but less than 7"
        correct: true
      - text: "Exactly 7 for all surface pressures"
        rationale: |
          This uses the gauge-pressure ratio as the absolute-pressure ratio. The depths differ by a factor of seven. Check the positive surface-pressure term added to both.
      - text: "Greater than 7 for positive surface pressure"
        rationale: |
          This adds surface pressure as if it increased the larger pressure alone. The deeper pressure is already greater. Check that the same surface term is added to both points.
      - text: "Exactly 1 despite the depth difference"
        rationale: |
          This applies same-liquid pressure equality at different depths. The liquid is one connected body. Check the unequal depths of A and B.
    explanation: |
      Write the pressures as $P_A=P_0+k$ and $P_B=P_0+7k$, where k is the positive water contribution at A. B has greater pressure, so the ratio exceeds 1. Adding the same positive surface pressure to both contributions makes the ratio smaller than 7.
    approved: false

