meta:
  subject: reasoning
  topic: verbal-logic
  subtopic: assumptions-and-conclusions
  exams:
    - cse-pro
    - upcat
    - acet
    - dlsucet
    - ustet
questions:
  - id: q-verbal-logic-assumptions-and-conclusions-0001
    approved: true
    lesson: lesson-verbal-logic-must-be-true-conclusions
    keyPoint: 1
    type: single_choice
    difficulty: easy
    stem: |
      A director promises a bonus to every employee who completes a training program. Does the promise by itself establish that the program can be completed?
    choices:
      - text: "No; the condition may never be met."
        correct: true
      - text: "Yes; the promise proves completion is possible."
        rationale: |
          This treats a conditional promise as proof that its condition can happen. An offered reward can make the goal seem reachable. Check whether the statement asserts that anyone can complete the program.
      - text: "Yes; all employees must complete the program."
        rationale: |
          This turns a reward for completers into a requirement for everyone. The policy mentions all employees who complete it. Check which group the word "all" actually covers.
      - text: "No; employees who complete it are ineligible."
        rationale: |
          This denies the reward for people who meet the condition. The fact that completion is uncertain may suggest there is no eligibility. Check what the promise says if completion does happen.
    explanation: |
      The promise applies if an employee completes the program. It can still hold when no one completes it. The promise alone does not prove that completion is achievable.

  - id: q-verbal-logic-assumptions-and-conclusions-0002
    approved: true
    lesson: lesson-verbal-logic-needed-assumptions
    keyPoint: 2
    type: single_choice
    difficulty: medium
    stem: |
      The council argues that expanding peak-hour transit routes will ease traffic by shifting car trips to buses. Which assumption is necessary to that stated reason?
    choices:
      - text: "New routes can replace some peak-hour car trips."
        correct: true
      - text: "Every car user will stop driving at peak hours."
        rationale: |
          This requires all car users to switch. A large switch would help the proposal. Check whether some replacement trips can support the reason without a universal switch.
      - text: "Every new route must be full throughout the day."
        rationale: |
          This requires full use at all hours. Busy buses may make a project look worthwhile. Check that the stated reason concerns peak-hour car trips, not every hour.
      - text: "Transit fares must be lower than in every other city."
        rationale: |
          This makes a comparison with other cities necessary. Cheap fares can attract riders. Check whether the argument requires that particular comparison or only some replaced trips.
    explanation: |
      The argument depends on some car trips shifting to the expanded transit service. If the new routes could replace no such trips, its stated reason for easing congestion would fail.

  - id: q-verbal-logic-assumptions-and-conclusions-0003
    approved: true
    lesson: lesson-verbal-logic-must-be-true-conclusions
    keyPoint: 1
    type: single_choice
    difficulty: medium
    stem: |
      In this hiring system, passing an ethics exam is one required condition for civil service. Maria passed that exam. Which conclusion must follow?
    choices:
      - text: "Maria has met the ethics-exam requirement."
        correct: true
      - text: "Maria has met every hiring requirement."
        rationale: |
          This expands one completed requirement into every requirement. Passing a mandatory exam is an important step. Check whether any other hiring conditions are stated.
      - text: "Maria has failed no examination in her life."
        rationale: |
          This expands success on one exam into success on all exams. A pass is positive evidence. Check the scope of the stated exam result.
      - text: "Maria has already been appointed to civil service."
        rationale: |
          This treats a required step as sufficient for appointment. Passing may lead toward a job. Check whether the premises say appointment has happened.
    explanation: |
      Passing the ethics exam is one of the stated requirements. Maria passed it. She has therefore met that particular requirement.

  - id: q-verbal-logic-assumptions-and-conclusions-0004
    approved: true
    lesson: lesson-verbal-logic-must-be-true-conclusions
    keyPoint: 1
    type: single_choice
    difficulty: easy
    stem: |
      If it rains heavily, the outdoor assembly will move indoors. The assembly was held indoors. What can be concluded about whether heavy rain occurred?
    choices:
      - text: "Whether it rained heavily is undetermined."
        correct: true
      - text: "Heavy rain must have occurred during the assembly."
        rationale: |
          This reverses the one-way conditional. Rain would cause the move indoors. Check whether the rule says rain is the only possible cause.
      - text: "Heavy rain definitely did not occur that day."
        rationale: |
          This treats missing proof of rain as proof of no rain. The premises do not state weather directly. Check whether absence of certainty rules an event out.
      - text: "The assembly remained at its outdoor venue."
        rationale: |
          This rejects the stated indoor location. The assembly began as an outdoor plan. Check its reported final location.
    explanation: |
      Heavy rain would require an indoor assembly. The given indoor location does not identify its cause. Both rain and another reason remain possible under the premises.

  - id: q-verbal-logic-assumptions-and-conclusions-0005
    approved: true
    lesson: lesson-verbal-logic-needed-assumptions
    keyPoint: 2
    type: single_choice
    difficulty: hard
    stem: |
      Company X argues that replacing paper invoices with digital billing will reduce total processing costs. Which assumption is necessary to this cost-saving reason?
    choices:
      - text: "Digital processing can cost less overall."
        correct: true
      - text: "Every customer prefers a digital invoice."
        rationale: |
          This requires a universal customer preference. Preference might help adoption. Check whether the reason is popularity or processing cost.
      - text: "The new system must use no staff time at all."
        rationale: |
          This requires zero staff time rather than a lower total cost. Removing work can save money. Check whether any reduction can support the reason without eliminating all work.
      - text: "A nationwide ban on paper invoices must be imminent."
        rationale: |
          This substitutes a possible external reason for the stated cost reason. A ban could motivate a change. Check which reason the argument actually relies on.
    explanation: |
      The stated reason is lower processing costs. The company must expect the digital process to cost less overall. Otherwise this cost-saving reason would not support replacing paper invoices.

  - id: q-verbal-logic-assumptions-and-conclusions-0006
    approved: true
    lesson: lesson-verbal-logic-none-and-may
    keyPoint: 1
    type: single_choice
    difficulty: easy
    stem: |
      No unregistered vehicles are allowed inside a compound. Every vehicle inside was admitted in full compliance with that rule. Vehicle A is inside. Which conclusion must follow?
    choices:
      - text: "Vehicle A is registered."
        correct: true
      - text: "Vehicle A belongs to a department head."
        rationale: |
          This adds ownership to a registration rule. Official vehicles may be linked to senior staff. Check whether the premises identify an owner.
      - text: "Every registered vehicle is inside the compound."
        rationale: |
          This reverses permission into actual presence for the whole group. Registered vehicles are eligible to enter. Check whether eligibility means every one has entered.
      - text: "Vehicle A is the only registered vehicle."
        rationale: |
          This treats one known registered vehicle as the only one. Vehicle A is the named example. Check whether the premises count or exclude other registered vehicles.
    explanation: |
      The rule excludes unregistered vehicles, and every vehicle inside complies with it. Vehicle A is inside, so it is registered.

  - id: q-verbal-logic-assumptions-and-conclusions-0007
    approved: true
    lesson: lesson-verbal-logic-must-be-true-conclusions
    keyPoint: 2
    type: single_choice
    difficulty: hard
    stem: |
      Statement: "All department supervisors must hold a master's degree. Elena is not a department supervisor."
      Which conclusion is valid?
    choices:
      - text: "Elena's degree status is undetermined."
        correct: true
      - text: "Elena definitely lacks a master's degree."
        rationale: |
          This denies the trait after denying group membership. The requirement for supervisors may seem exclusive to them. Check whether the rule covers nonsupervisors.
      - text: "Elena definitely holds a master's degree."
        rationale: |
          This assigns the required trait to someone outside the stated group. The degree is prominent in the premise. Check whether any fact gives Elena that trait.
      - text: "Every master's-degree holder is a supervisor."
        rationale: |
          This reverses the group-to-requirement relation. All supervisors need the degree. Check whether the premise also says the degree is sufficient to be a supervisor.
    explanation: |
      The rule requires a master's degree for supervisors. Elena is outside that group. It places no requirement on her degree status, so either status remains possible.

  - id: q-verbal-logic-assumptions-and-conclusions-0008
    approved: true
    lesson: lesson-verbal-logic-needed-assumptions
    keyPoint: 2
    type: single_choice
    difficulty: hard
    stem: |
      After Municipality Y began a waste-sorting program, landfill volume fell. The report concludes that the program caused at least some of the fall. Which unstated assumption is necessary to that reasoning?
    choices:
      - text: "Other changes are not the whole cause."
        correct: true
      - text: "The program was the only thing that changed."
        rationale: |
          This demands that nothing else changed. That would make the causal case stronger. Check whether the conclusion requires the program to be the only cause or just one cause.
      - text: "Landfill volume fell after the program began."
        rationale: |
          This repeats evidence already stated instead of adding an unstated link. The timing is central to the argument. Check the difference between a premise and an assumption.
      - text: "Every household took part in the program."
        rationale: |
          This requires participation by every household. More participation could increase the effect. Check whether some participation could still cause part of the reduction.
    explanation: |
      The conclusion gives the program at least some causal role. That reasoning requires the drop not to be fully explained by unrelated changes. Negating that assumption removes the stated basis for the causal claim.

  - id: q-verbal-logic-assumptions-and-conclusions-0009
    approved: true
    lesson: lesson-verbal-logic-must-be-true-conclusions
    keyPoint: 2
    type: single_choice
    difficulty: easy
    stem: |
      Statement: "All candidates who score above 80% pass the examination. Juan scored 85%."
      Which conclusion is certain?
    choices:
      - text: "Juan passed the examination."
        correct: true
      - text: "Everyone scoring exactly 80% passed."
        rationale: |
          This extends an above-80 rule to exactly 80. The cutoff wording may seem to include its boundary. Check the word "above."
      - text: "Juan outscored every other candidate."
        rationale: |
          This turns a sufficient passing score into a top ranking. A high score can seem impressive. Check whether any other scores are given.
      - text: "No candidate scoring 79% passed."
        rationale: |
          This treats a sufficient condition as the only way to pass. The threshold is the only rule mentioned. Check whether the statement rules out other passing cases.
    explanation: |
      Juan's 85% is above 80%. The stated rule guarantees a pass for that group. Juan therefore passed.

  - id: q-verbal-logic-assumptions-and-conclusions-0010
    approved: true
    lesson: lesson-verbal-logic-needed-assumptions
    keyPoint: 2
    type: single_choice
    difficulty: medium
    stem: |
      The department argues that letting applicants enter forms online will reduce paper use by replacing printed submissions. Which assumption is necessary to this reason?
    choices:
      - text: "Some online submissions can replace printed forms."
        correct: true
      - text: "Every applicant must prefer using a screen."
        rationale: |
          This makes a universal preference necessary. Preference might encourage use. Check whether some replaced forms can reduce paper without everyone preferring screens.
      - text: "All old paper files must be destroyed immediately."
        rationale: |
          This requires deleting old files to reduce new paper use. Existing files may look like part of the paper problem. Check whether the argument concerns new submissions or old storage.
      - text: "Every electronic record must remain free of errors."
        rationale: |
          This requires perfect accuracy for paper savings. Errors can create extra work. Check whether some substitution can still reduce paper without a flawless system.
    explanation: |
      The reason depends on online entries taking the place of some printed forms. If they replaced no paper forms, that substitution would not support reduced paper use.

  - id: q-verbal-logic-assumptions-and-conclusions-0011
    approved: true
    lesson: lesson-verbal-logic-must-be-true-conclusions
    keyPoint: 1
    type: single_choice
    difficulty: medium
    stem: |
      An agency permits only licensed engineers to approve building plans. Mark approved Project A in full compliance with that authorization rule. Which conclusion must follow?
    choices:
      - text: "Mark is a licensed engineer."
        correct: true
      - text: "Every licensed engineer approved Project A."
        rationale: |
          This turns one authorized approval into an action by every eligible person. All licensed engineers may be eligible under the rule. Check whether permission means actual participation.
      - text: "Mark owns the building described in Project A."
        rationale: |
          This adds ownership to professional authorization. An owner may be involved in a project. Check which status the rule actually requires.
      - text: "All of Mark's plans have already been approved."
        rationale: |
          This expands one approval to all of Mark's work. A licensed role can suggest continuing authority. Check the single project named in the premise.
    explanation: |
      The agency requires a licensed engineer for an authorized approval. Mark's approval fully complied with that requirement. Mark is therefore a licensed engineer.

  - id: q-verbal-logic-assumptions-and-conclusions-0012
    approved: true
    lesson: lesson-verbal-logic-needed-assumptions
    keyPoint: 2
    type: single_choice
    difficulty: hard
    stem: |
      School Z argues that rooftop solar will lower its electricity bills by supplying power it would otherwise buy from the grid. Which assumption is necessary to this stated replacement reason?
    choices:
      - text: "Some solar output can replace paid grid power."
        correct: true
      - text: "All school activity must take place in daylight."
        rationale: |
          This requires all activity to occur during generation hours. Daylight is associated with solar power. Check whether some daytime use or stored output could support the reason.
      - text: "Grid rates must decline nationwide this month."
        rationale: |
          This substitutes an unrelated price change for the given replacement reason. Lower rates can reduce bills. Check which mechanism the argument relies on.
      - text: "Solar panels must meet every school power need."
        rationale: |
          This requires complete replacement rather than some replacement. Full independence could save much money. Check whether partial replacement is enough for the stated reason.
    explanation: |
      The school's stated reason is replacing electricity it would otherwise buy. It therefore needs at least some usable solar output to replace paid grid power. That link is necessary to this particular reason for lower bills.

  - id: q-verbal-logic-assumptions-and-conclusions-0013
    lesson: lesson-verbal-logic-must-be-true-conclusions
    keyPoint: 2
    type: single_choice
    difficulty: easy
    stem: |
      In formal logic, "some" means at least one. Some inspectors are certified auditors. Which conclusion must follow?
    choices:
      - text: "Some auditors are inspectors."
        correct: true
      - text: "Some inspectors are not auditors."
        rationale: |
          This reads "some" as "some but not all." Everyday speech can suggest that limit. Check the formal meaning of at least one.
      - text: "All auditors are inspectors."
        rationale: |
          This expands the known overlap to the whole auditor group. Shared membership can blur group size. Check the quantifier in the premise.
      - text: "No inspectors are auditors."
        rationale: |
          This denies the overlap that the premise establishes. The role names differ. Check the statement that at least one person has both roles.
    explanation: |
      The statement says at least one person is both an inspector and an auditor. That same person shows that some auditors are inspectors.
    approved: true

  - id: q-verbal-logic-assumptions-and-conclusions-0014
    lesson: lesson-verbal-logic-best-supported-conclusions
    keyPoint: 1
    type: single_choice
    difficulty: medium
    stem: |
      Before a trial of later library closing hours, several workers arrived after closing. During the trial, those workers used the library after their shifts. Which conclusion is best supported?
    choices:
      - text: "Later hours help some workers use the library."
        correct: true
      - text: "Every library visitor needs the building after dark."
        rationale: |
          This expands evidence about a subgroup to everyone. The after-work visitors are noticeable. Check which visitors the observation actually covers.
      - text: "Longer hours prove that all visitors read more books."
        rationale: |
          This treats access as proof of more reading. Extra time can help reading. Check whether book use was measured.
      - text: "Saturday service can now be abolished without harm."
        rationale: |
          This treats an added service as proof another service is unnecessary. Both concern scheduling. Check whether the evidence evaluates Saturday visitors.
    explanation: |
      The earlier arrivals after closing showed a schedule conflict. Those visitors can now use the library during the added hours. The evidence supports later hours meeting some visitors' needs.
    approved: true

  - id: q-verbal-logic-assumptions-and-conclusions-0015
    lesson: lesson-verbal-logic-needed-assumptions
    keyPoint: 2
    type: single_choice
    difficulty: medium
    stem: |
      A report links many processing mistakes to unfamiliarity with current procedures. It recommends a refresher course as a way to reduce those mistakes. Which assumption is necessary to that stated reason?
    choices:
      - text: "The course addresses the unfamiliar procedures."
        correct: true
      - text: "Every employee will attend every session offered."
        rationale: |
          This requires perfect attendance rather than a relevant course. Attendance can help the program work. Check the content link needed by the stated reason.
      - text: "The course is longer than every previous course."
        rationale: |
          This makes relative course length necessary. A longer course may seem more thorough. Check whether duration alone addresses the unfamiliar procedures.
      - text: "All errors come only from unfamiliar procedures."
        rationale: |
          This expands "many" errors into all errors. The cause is important in the report. Check whether the recommendation requires it to be the only cause.
    explanation: |
      The stated cause of many errors is unfamiliarity with current procedures. To address that cause, the course must cover the relevant procedures. If it did not, the stated reason for recommending it would fail.
    approved: true

  - id: q-verbal-logic-assumptions-and-conclusions-0016
    lesson: lesson-verbal-logic-best-supported-conclusions
    keyPoint: 1
    type: single_choice
    difficulty: hard
    stem: |
      A voluntary staff survey received only responses favoring a proposal. The report provides no information about employees who did not respond. Which conclusion is warranted?
    choices:
      - text: "The responding volunteers favored the proposal."
        correct: true
      - text: "Every employee favored the proposal."
        rationale: |
          This generalizes a volunteer sample to the whole staff. The report may look like a staff opinion summary. Check who actually answered.
      - text: "Employees who did not respond opposed the proposal."
        rationale: |
          This treats silence as opposition. People who disagree may sometimes avoid responding. Check whether any reason for nonresponse is given.
      - text: "The proposal is guaranteed to succeed if adopted."
        rationale: |
          This turns support into proof of success. Popular ideas can seem promising. Check whether the evidence measures opinion or future results.
    explanation: |
      The report records support among the volunteers who answered. That supports a conclusion about those respondents. It gives no result for the other employees.
    approved: true

  - id: q-verbal-logic-assumptions-and-conclusions-0017
    lesson: lesson-verbal-logic-needed-assumptions
    keyPoint: 2
    type: single_choice
    difficulty: hard
    stem: |
      The library should replace its failed reading-room lamps so visitors can read there again. Which assumption's negation would most directly destroy this stated reason?
    choices:
      - text: "Replacement lamps will provide usable light."
        correct: true
      - text: "Replacement lamps will be more energy-efficient."
        rationale: |
          This adds an energy-saving benefit to a lighting argument. Efficiency can make a purchase attractive. Check whether the stated reason requires lower energy use.
      - text: "Every visitor will approve the lamps' appearance."
        rationale: |
          This makes universal approval of appearance necessary. Attractive fittings may please visitors. Check whether usable light depends on everyone liking the design.
      - text: "The new lamps will last longer than the old ones."
        rationale: |
          This makes extra durability necessary for restoring light. Longer-lasting lamps would be helpful. Check whether the stated reason requires usable light or a longer lifespan.
    explanation: |
      The reason is restoring readable lighting. It requires the replacement lamps to give usable light. Negating that condition leaves the reading problem unsolved by this proposal.
    approved: true

  - id: q-verbal-logic-assumptions-and-conclusions-0018
    lesson: lesson-verbal-logic-unsupported-causes-and-motives
    keyPoint: 1
    type: single_choice
    difficulty: hard
    stem: |
      Across several observed service periods, busier periods had longer waits than quieter periods. No causes were tested. Which conclusion is best supported?
    choices:
      - text: "Busy periods are associated with longer waits."
        correct: true
      - text: "Every delay is caused only by a busy period."
        rationale: |
          This turns a repeated association into the sole cause of every delay. Busy periods can seem to explain the pattern. Check whether other causes were ruled out.
      - text: "Adding one worker always eliminates all delays."
        rationale: |
          This adds a guaranteed staffing solution. More staff may appear helpful. Check whether any staffing intervention was tested.
      - text: "Quiet periods cannot have any waiting at all."
        rationale: |
          This turns shorter waits into zero waits. Quiet periods are the comparison group. Check whether the report says waits disappeared entirely.
    explanation: |
      The report observes longer waits during busier periods. It supports an association between busyness and wait length. That is the measured pattern described.
    approved: true

  - id: q-verbal-logic-assumptions-and-conclusions-0019
    lesson: lesson-verbal-logic-needed-assumptions
    keyPoint: 1
    type: single_choice
    difficulty: exam
    stem: |
      "The library should keep its Sunday hours. Some workers cannot visit on weekdays, and Saturday reading rooms are often full. Closing on Sunday would remove an available study option." What is the main conclusion?
    choices:
      - text: "The library should keep its Sunday hours."
        correct: true
      - text: "Some workers cannot visit on weekdays."
        rationale: |
          This chooses a reason instead of the claim being defended. Workers' schedules help support the recommendation. Check what the writer wants the library to do.
      - text: "Saturday reading rooms are often full."
        rationale: |
          This chooses another premise instead of the recommendation. Full Saturday rooms are important evidence. Check the action the argument tries to justify.
      - text: "Sunday attendance will exceed all other days."
        rationale: |
          This adds a prediction not claimed in the argument. Unmet demand may suggest many Sunday visitors. Check the actual recommendation rather than a possible consequence.
    explanation: |
      The argument is trying to justify keeping Sunday hours. The worker schedules and full Saturday rooms serve as its reasons. The main conclusion is that the library should keep Sunday hours.
    approved: true

  - id: q-verbal-logic-assumptions-and-conclusions-0020
    lesson: lesson-verbal-logic-needed-assumptions
    keyPoint: 2
    type: single_choice
    difficulty: exam
    stem: |
      A station argues that advance online ticket payment will shorten its on-site payment queue by letting passengers finish that step before arrival. Which assumption is necessary to the stated queue-reduction reason?
    choices:
      - text: "Advance payment can replace on-site payment."
        correct: true
      - text: "Every passenger must always choose advance payment."
        rationale: |
          This requires universal use rather than a usable replacement. Widespread use could strengthen the benefit. Check whether some passengers can leave the payment queue without everyone doing so.
      - text: "Online payment must cost less than every other method."
        rationale: |
          This adds a price advantage to a queue-time argument. A cheaper method can encourage use. Check whether the stated reason depends on cost or where payment occurs.
      - text: "Every part of every journey must become shorter."
        rationale: |
          This expands a queue benefit to every stage of travel. A shorter station wait can improve a journey. Check the exact delay the proposal addresses.
    explanation: |
      The stated reason moves payment work out of the on-site queue. It requires advance payment to replace the on-site step. If the same payment step still had to be repeated on site, that reason would not support shorter queues.
    approved: true


  - id: q-verbal-logic-assumptions-and-conclusions-0021
    approved: true
    lesson: lesson-verbal-logic-negating-assumptions
    keyPoint: 1
    type: single_choice
    difficulty: exam
    stem: |
      A proposal relies on the claim, "Some branch offices can verify applications without contacting headquarters." For a negation test, which statement makes that claim false?
    choices:
      - text: "No branch office can do so."
        correct: true
      - text: "Not all branch offices can do so."
        rationale: |
          This negates all instead of some. It still allows a branch to verify applications on its own. Check whether even one such branch remains possible.
      - text: "All branch offices can do so."
        rationale: |
          This strengthens the original claim. If all can do so, at least one can. Check whether the choice makes the original false.
      - text: "Some branch offices cannot do so."
        rationale: |
          This changes can to cannot for only some offices. Both statements could be true for different branches. Check whether any branch can still verify on its own.
    explanation: |
      Some means at least one. To make the claim false, there must be no branch office that can verify applications without contacting headquarters. The correct negation says that no branch office can do so.

  - id: q-verbal-logic-assumptions-and-conclusions-0022
    approved: true
    lesson: lesson-verbal-logic-negating-assumptions
    keyPoint: 1
    type: single_choice
    difficulty: exam
    stem: |
      An argument assumes, "No temporary employee has access to the archive." Which statement is the logical negation of this assumption?
    choices:
      - text: "At least one temporary employee has access."
        correct: true
      - text: "Every temporary employee has access to the archive."
        rationale: |
          This requires every employee in the group to have access. That would break the assumption, but it goes too far. One exception is enough.
      - text: "Not every temporary employee has access to the archive."
        rationale: |
          This allows some employees to lack access. It can be true when none have access. Check whether the original assumption must become false.
      - text: "No permanent employee has access to the archive."
        rationale: |
          This changes the group from temporary to permanent employees. The new statement may sound related to access. Keep the same group when negating.
    explanation: |
      No excludes every member of the named group. One temporary employee with access is enough to make the assumption false. Its negation is that at least one temporary employee has access.

  - id: q-verbal-logic-assumptions-and-conclusions-0023
    approved: true
    lesson: lesson-verbal-logic-compound-assumptions
    keyPoint: 1
    type: single_choice
    difficulty: exam
    stem: |
      A dispatch plan assumes, "The loading gate is open and the delivery vehicle is available." Which statement correctly negates the whole assumption? Here, "or" permits either condition or both.
    choices:
      - text: "The gate is closed or the vehicle is unavailable."
        correct: true
      - text: "The gate is closed and the vehicle is unavailable."
        rationale: |
          This requires both conditions to fail. That may look like reversing both parts. Check that one failed part already makes an and statement false.
      - text: "The gate is open or the delivery vehicle is unavailable."
        rationale: |
          This leaves the first part unchanged. It could be true while both original conditions hold. Negation must make the whole original false.
      - text: "The gate is closed and the delivery vehicle is available."
        rationale: |
          This describes just one way the assumption can fail. It misses failure of the vehicle alone. Allow either part to fail.
    explanation: |
      The assumption needs both an open gate and an available vehicle. It is false when the gate is closed, the vehicle is unavailable, or both. The correct statement includes all those cases.

  - id: q-verbal-logic-assumptions-and-conclusions-0024
    approved: true
    lesson: lesson-verbal-logic-compound-assumptions
    keyPoint: 1
    type: single_choice
    difficulty: exam
    stem: |
      A notice states, "The request was submitted online or delivered in person." The word "or" includes the possibility of both. Which statement is the exact negation?
    choices:
      - text: "It was neither submitted online nor delivered in person."
        correct: true
      - text: "It was not submitted online, but it was delivered in person."
        rationale: |
          This still satisfies the original statement through delivery in person. One failed option is not enough. Check whether the other option remains true.
      - text: "It was submitted online, but it was not delivered in person."
        rationale: |
          This still satisfies the original statement through online submission. The word or needs only one true part. Check both parts before negating.
      - text: "It was not submitted online, or it was not delivered in person."
        rationale: |
          This allows one original option to remain true. It negates an and statement. To make the stated or false, both options must fail.
    explanation: |
      The original is true if either method was used, including when both were used. It is false only if neither method was used. Both online submission and delivery in person must be false.

  - id: q-verbal-logic-assumptions-and-conclusions-0025
    approved: true
    lesson: lesson-verbal-logic-none-and-may
    keyPoint: 2
    type: single_choice
    difficulty: exam
    stem: |
      A memorandum states, "The interview may be postponed if the panel lacks a quorum." No further information is provided. Which interpretation is justified?
    choices:
      - text: "A lack of quorum allows possible postponement."
        correct: true
      - text: "A lack of quorum guarantees that the interview is postponed."
        rationale: |
          This turns may into a guarantee. The condition makes postponement possible. Check whether the memo says will or may.
      - text: "A lack of quorum prevents the interview from being postponed."
        rationale: |
          This rules out the event that the memo allows. A condition can sound like a restriction. Check what event may happen under that condition.
      - text: "A complete quorum guarantees the interview proceeds as scheduled."
        rationale: |
          This adds a promise about the opposite condition. The memo says what may happen without a quorum. Check whether it promises anything when a quorum is present.
    explanation: |
      May describes a possibility. If the panel lacks a quorum, postponement is possible. The memo does not make that outcome certain.

  - id: q-verbal-logic-assumptions-and-conclusions-0026
    approved: true
    lesson: lesson-verbal-logic-recognizing-bias
    keyPoint: 1
    type: single_choice
    difficulty: exam
    stem: |
      A commentary states, "Only lazy employees oppose the new attendance policy. Responsible workers naturally support it." It provides no evidence about the policy or the employees. Which feature most clearly indicates bias?
    choices:
      - text: "It labels opponents as lazy without evidence."
        correct: true
      - text: "It expresses a position on a workplace policy under discussion."
        rationale: |
          This treats having an opinion as proof of bias. Opinions can have fair support. Check the words used to describe people who disagree.
      - text: "It discusses how employees respond to an attendance policy."
        rationale: |
          This treats the subject of the passage as proof of bias. Any side could discuss employee responses. Check whether the description is supported and fair.
      - text: "It presents its view in a brief statement about the policy."
        rationale: |
          This treats short length as proof of bias. A brief passage can still be fair. Check the unfair blame rather than its length.
    explanation: |
      The commentary calls opponents lazy without giving evidence. It also praises supporters as responsible without support. Those labels favor one side by judging people in place of examining the policy.

  - id: q-verbal-logic-assumptions-and-conclusions-0027
    approved: true
    lesson: lesson-verbal-logic-recognizing-bias
    keyPoint: 1
    type: single_choice
    difficulty: exam
    stem: |
      A report says, "Our favored supplier is clearly the only sensible choice." It lists that supplier's timely deliveries but omits its documented delivery failures. It lists a rival's failures but omits the rival's timely deliveries. What most strongly shows bias?
    choices:
      - text: "It selects evidence to favor one supplier."
        correct: true
      - text: "It compares the delivery records of competing suppliers."
        rationale: |
          This treats comparison itself as unfair. Comparing records can support a fair choice. Check whether the same kinds of facts are shown for both suppliers.
      - text: "It recommends a supplier instead of leaving the choice open."
        rationale: |
          This treats any recommendation as bias. A recommendation can follow balanced evidence. Check how the report chose which facts to include.
      - text: "It discusses delivery performance instead of supplier prices."
        rationale: |
          This assumes every short report must cover every topic. Delivery performance can be a fair focus. Check whether evidence within that focus is presented fairly.
    explanation: |
      The report includes good results for the favored supplier and bad results for the rival. It leaves out the opposite results for each. This uneven choice of evidence supports one side unfairly.

  - id: q-verbal-logic-assumptions-and-conclusions-0028
    approved: true
    lesson: lesson-verbal-logic-unsupported-causes-and-motives
    keyPoint: 1
    type: single_choice
    difficulty: exam
    stem: |
      After reviewing a request for flexible hours, a supervisor approved it. The record contains neither the supervisor's explanation nor evidence about her reasons. Which conclusion is supported?
    choices:
      - text: "She approved the request after reviewing it."
        correct: true
      - text: "She approved it because she feared losing experienced staff."
        rationale: |
          This adds fear as a motive. Staff loss may sound like a possible concern. Check whether the record gives that reason.
      - text: "She approved it because she wanted praise from her director."
        rationale: |
          This guesses a wish to impress someone. Approval could have many reasons. Check for evidence of the stated motive.
      - text: "She approved it because reviewing the request forced agreement."
        rationale: |
          This turns the order of events into a cause. Reviewing came first. Check whether the record says it caused or required approval.
    explanation: |
      The record gives an action and its order: the supervisor reviewed the request, then approved it. That supports the stated sequence. No reason for the approval is recorded.

  - id: q-verbal-logic-assumptions-and-conclusions-0029
    approved: false
    lesson: lesson-verbal-logic-needed-assumptions
    keyPoint: 1
    type: single_choice
    difficulty: easy
    stem: |
      A school paper argues that the canteen should post ingredient lists beside its food trays. Some students avoid dishes when they cannot tell what is in them. The staff already keep written recipes. Which statement gives the paper's main conclusion?
    choices:
      - text: "The canteen should display ingredient lists."
        correct: true
      - text: "Some students skip dishes with unknown ingredients."
        rationale: |
          That fact shows why the lists could help. Ask what action the paper wants the canteen to take.
      - text: "The canteen staff already keep written recipes."
        rationale: |
          That fact makes the plan sound doable. Look for the change the paper is asking for.
      - text: "Students should ask the canteen staff about ingredients."
        rationale: |
          Asking staff sounds like another way to get the facts. Check which action the paper actually calls for.
    explanation: |
      The paper uses the students' needs and the written recipes to back one point. It wants the canteen to show what is in each dish.

  - id: q-verbal-logic-assumptions-and-conclusions-0030
    approved: false
    lesson: lesson-verbal-logic-negating-assumptions
    keyPoint: 1
    type: single_choice
    difficulty: easy
    stem: |
      A museum guide claims that every jar in the exhibit has a readable label. Which observation is enough to disprove the claim?
    choices:
      - text: "A jar has an unreadable label."
        correct: true
      - text: "A few jars have labels that visitors can still read."
        rationale: |
          Reading a few labels may seem like a test of the claim. Look for a jar whose label fails the test.
      - text: "Several labels list the towns where the jars were made."
        rationale: |
          The labels give details, which may seem to matter. Check if the claim is about what the labels say or whether people can read them.
      - text: "A visitor has not yet read the labels on every jar."
        rationale: |
          It is easy to mix up an unread label with one that cannot be read. Ask if a visitor could read the label by trying.
    explanation: |
      The guide says every jar passes the same test. One jar with a label you cannot read breaks that claim.

  - id: q-verbal-logic-assumptions-and-conclusions-0031
    approved: false
    lesson: lesson-verbal-logic-negating-assumptions
    keyPoint: 1
    type: single_choice
    difficulty: easy
    stem: |
      A barangay treasurer assumes that at least one receipt in a folder lacks a signature. Which audit result would establish that the assumption is false?
    choices:
      - text: "Every receipt in the folder is signed."
        correct: true
      - text: "One of the receipts in the folder is signed."
        rationale: |
          A signed receipt may seem to clear the folder. Check whether an unsigned receipt could still be in it.
      - text: "More receipts are signed than are unsigned."
        rationale: |
          Most of the forms could be fine. Check if even one unsigned receipt could remain.
      - text: "No receipt in the folder bears a signature."
        rationale: |
          This flips the wrong group. If none is signed, then the unsigned receipts are the very ones the treasurer says exist.
    explanation: |
      The treasurer's claim needs even one unsigned receipt. If every receipt is signed, there is no such receipt.

  - id: q-verbal-logic-assumptions-and-conclusions-0032
    approved: false
    lesson: lesson-verbal-logic-compound-assumptions
    keyPoint: 1
    type: single_choice
    difficulty: easy
    stem: |
      A quality inspector accepts a sack of rice only if its seal is intact and its batch code is legible. Which finding is sufficient to show that the sack fails the stated inspection?
    choices:
      - text: "The seal on the sack is torn."
        correct: true
      - text: "The batch code remains easy to read."
        rationale: |
          A clear code may catch your eye because it is part of the test. Check if that finding shows a failed step.
      - text: "The inspector read the batch code before examining the seal."
        rationale: |
          The order might sound like part of the rule. Look for a finding about the seal or code itself.
      - text: "The sack came from a batch inspected earlier in the week."
        rationale: |
          An earlier check may seem to settle the issue. Check what the inspector found on this sack.
    explanation: |
      The sack needs a good seal and a clear code. A torn seal fails one of those tests. One failure is enough.

  - id: q-verbal-logic-assumptions-and-conclusions-0033
    approved: false
    lesson: lesson-verbal-logic-none-and-may
    keyPoint: 1
    type: single_choice
    difficulty: easy
    stem: |
      At a school plant fair, the list of plants for sale has no overlap with the list of plants on loan. Which label would reveal an error in the lists?
    choices:
      - text: "For sale and on loan"
        correct: true
      - text: "For sale and grown by students"
        rationale: |
          Two labels may look like a clash. Match them with the two lists the rule keeps apart.
      - text: "On loan and grown outside the school"
        rationale: |
          A plant can come from outside the school and be on loan. Check if the label also puts it up for sale.
      - text: "On display and absent from both lists"
        rationale: |
          A plant on display may seem to need a spot on a list. Check if the rule says every plant must be on one.
    explanation: |
      The two lists share no plants. If a plant is for sale and on loan, it would be on both lists.

  - id: q-verbal-logic-assumptions-and-conclusions-0034
    approved: false
    lesson: lesson-verbal-logic-none-and-may
    keyPoint: 2
    type: single_choice
    difficulty: easy
    stem: |
      A school circular says, “Classes may shift online next week.” Which headline preserves the meaning of the notice?
    choices:
      - text: "Online Classes Possible Next Week"
        correct: true
      - text: "School Confirms Shift to Online Classes Next Week"
        rationale: |
          A headline may sound clearer with a firm claim. Look for words in the notice that make the shift certain.
      - text: "School Rules Out Online Classes for Next Week"
        rationale: |
          The lack of a firm plan may sound like a decision to stay in class. Check if the notice still leaves a shift open.
      - text: "Online Classes Expected to Continue Into Next Week"
        rationale: |
          The word “continue” makes it sound like classes are online now. Check if the notice says that has already happened.
    explanation: |
      The notice leaves a shift online open. The word “possible” keeps that meaning.

  - id: q-verbal-logic-assumptions-and-conclusions-0035
    approved: false
    lesson: lesson-verbal-logic-best-supported-conclusions
    keyPoint: 1
    type: single_choice
    difficulty: easy
    stem: |
      In a Quezon City repair shop's booking log, customers asked for services in both English and Filipino. The log does not identify their first languages or say why they used either language. Which conclusion is best supported?
    choices:
      - text: "The shop received requests in both languages."
        correct: true
      - text: "Most customers chose the language they first learned at home."
        rationale: |
          The language used at home may seem like a good guess. Look for facts on what customers learned first.
      - text: "Customers used Filipino mainly for more complicated repairs."
        rationale: |
          A different language might help some people explain a problem. Check if the log links language to how tough a repair was.
      - text: "Individual customers generally switched between the two languages."
        rationale: |
          The whole log uses both languages, which may make switching sound likely. Check if the same customers used both.
    explanation: |
      The booking log contains requests in English and requests in Filipino. That is enough to show that the shop received both kinds.

  - id: q-verbal-logic-assumptions-and-conclusions-0036
    approved: false
    lesson: lesson-verbal-logic-unsupported-causes-and-motives
    keyPoint: 1
    type: single_choice
    difficulty: easy
    stem: |
      Street vendors moved their stalls to a covered court on the same morning that the city closed part of the market road. The report gives no reason for the move. Which edit would remove the unsupported claim from the line “The vendors moved to the court because of the road closure”?
    choices:
      - text: "The vendors moved to the court on the morning of the closure."
        correct: true
      - text: "The vendors moved to avoid being blocked by city workers."
        rationale: |
          A road closure might block the stalls. Check if the report says the vendors wanted to avoid the workers.
      - text: "The vendors moved in order to keep serving their regular customers."
        rationale: |
          The move may have helped keep customers. Check if the report gives that as a reason for moving.
      - text: "The vendors' move prompted the city to close part of the road."
        rationale: |
          The two events may seem linked since they happened on the same day. Check for proof that the move led to the closure.
    explanation: |
      The report puts the move and the closure on the same morning. The edit keeps that fact and leaves the reason open.

  - id: q-verbal-logic-assumptions-and-conclusions-0037
    approved: false
    lesson: lesson-verbal-logic-recognizing-bias
    keyPoint: 1
    type: single_choice
    difficulty: easy
    stem: |
      Two school paper headlines describe the same student council vote. One reads “Council Delays Decision on Fair Schedule.” The other reads “Council Stalls Again While Clubs Do the Real Work.” What in the second headline most clearly favors one side?
    choices:
      - text: "It credits the clubs and belittles the council."
        correct: true
      - text: "It identifies the council as the group making the decision."
        rationale: |
          Naming the group might draw attention to it. Look for words that judge how the group acts.
      - text: "It leaves out the date on which the vote took place."
        rationale: |
          A date could help readers place the vote. Ask whether leaving it out makes either group look better.
      - text: "It gives readers less detail than the full news story would."
        rationale: |
          A headline has little room for detail. Check if the words it does use treat both sides fairly.
    explanation: |
      “Real work” gives the clubs the credit. “Stalls again” makes the council sound like it is wasting time. Those words take sides.

  - id: q-verbal-logic-assumptions-and-conclusions-0038
    approved: false
    lesson: lesson-verbal-logic-recognizing-bias
    keyPoint: 1
    type: single_choice
    difficulty: easy
    stem: |
      A barangay bulletin calls a drainage plan “a gift for sensible residents.” Which revision would best remove the bias from that phrase while keeping the subject?
    choices:
      - text: "A proposed drainage plan for residents"
        correct: true
      - text: "A long-awaited drainage plan for the neighborhood"
        rationale: |
          “Long-awaited” sounds positive. Check if the bulletin shows that people have been waiting for it.
      - text: "A drainage plan for residents who understand the problem"
        rationale: |
          That wording sounds calmer than “sensible.” It still praises one group as wiser. Check who the new words leave out.
      - text: "A drainage plan that even its critics should welcome"
        rationale: |
          Mentioning critics may sound fair. Check if the new words still tell people what they ought to think.
    explanation: |
      The revision says what the plan is and whom it serves. It leaves people free to judge the plan for themselves.

  - id: q-verbal-logic-assumptions-and-conclusions-0039
    approved: false
    lesson: lesson-verbal-logic-must-be-true-conclusions
    keyPoint: 2
    type: single_choice
    difficulty: medium
    stem: |
      Every specimen in a Cebu science exhibit's tray is cataloged. Some specimens in the tray are shells. What must also be true?
    choices:
      - text: "Some cataloged specimens are shells."
        correct: true
      - text: "Every cataloged shell is in the exhibit tray."
        rationale: |
          The tray contains cataloged shells, so it may seem to hold them all. Check if the rule covers specimens outside the tray.
      - text: "At least one specimen in the tray is something other than a shell."
        rationale: |
          In daily speech, “some” can sound like “only some.” Try a tray filled with shells and see if the facts still fit.
      - text: "Every specimen in the tray is a shell."
        rationale: |
          The shells get special mention, which might make them seem like the whole tray. Check if “some” tells you about every specimen.
    explanation: |
      Start with any shell in the tray. Every item there is cataloged, so that shell is cataloged too. This gives at least one cataloged shell.

  - id: q-verbal-logic-assumptions-and-conclusions-0040
    approved: false
    lesson: lesson-verbal-logic-negating-assumptions
    keyPoint: 1
    type: single_choice
    difficulty: medium
    stem: |
      A clinic's report assumes, “No sample rejected at intake was listed as accepted in the final log.” Which audit finding is precisely the negation of that assumption?
    choices:
      - text: "A rejected sample was listed as accepted."
        correct: true
      - text: "A sample accepted at intake was listed as rejected in the final log."
        rationale: |
          This also sounds like a mix-up. Check which group the report starts with.
      - text: "Every sample rejected at intake was listed as accepted in the final log."
        rationale: |
          This would break the claim, but it asks for too much. See if a single bad entry would be enough.
      - text: "A sample rejected at intake was absent from the final log altogether."
        rationale: |
          A missing entry may be a problem. Check if the claim bans missing entries or entries marked as accepted.
    explanation: |
      The report rules out even one rejected sample listed as accepted. Finding a single case makes the claim false.

  - id: q-verbal-logic-assumptions-and-conclusions-0041
    approved: false
    lesson: lesson-verbal-logic-compound-assumptions
    keyPoint: 1
    type: single_choice
    difficulty: medium
    stem: |
      A note on a school lab worksheet reads, “The water sample came from the rain barrel or the cistern, possibly from both.” If the note is false, which description must be accurate?
    choices:
      - text: "The sample came from neither source."
        correct: true
      - text: "The sample came from the cistern but not the rain barrel."
        rationale: |
          It may seem enough to rule out the barrel. Check whether the cistern alone still fits the note.
      - text: "The sample came from the rain barrel but not the cistern."
        rationale: |
          It may seem enough to cross off the cistern. Check whether the rain barrel alone makes the note true.
      - text: "The sample did not contain water from both sources."
        rationale: |
          Ruling out a mix sounds like a denial. Try a sample from just one source and ask if the note would still fit.
    explanation: |
      The note allows the barrel alone, the cistern alone, or both. It fails only when the sample comes from neither.

  - id: q-verbal-logic-assumptions-and-conclusions-0042
    approved: false
    lesson: lesson-verbal-logic-compound-assumptions
    keyPoint: 1
    type: single_choice
    difficulty: medium
    stem: |
      A committee's recommendation rests on the claim that a proposed footbridge crosses the creek and connects directly to the school path. An engineer finds that the bridge crosses the creek but ends at a fenced lot with no direct access to the path. What does the finding establish about the claim?
    choices:
      - text: "It fails because one required link is missing."
        correct: true
      - text: "The finding confirms the claim since the bridge provides the creek crossing."
        rationale: |
          Crossing the creek is a big part of the plan. Check if the claim also needs the bridge to reach the path.
      - text: "The claim remains undecided until both proposed features have been disproved."
        rationale: |
          Testing both features may sound careful. Ask how many need to fail when the claim requires both.
      - text: "The finding shows that neither of the proposed features will be present."
        rationale: |
          The claim as a whole fails, which may sound like both parts fail. Read what the engineer found about the crossing.
    explanation: |
      The claim needs two things. The bridge crosses the creek, but it misses the school path. That is enough to make the full claim false.

  - id: q-verbal-logic-assumptions-and-conclusions-0043
    approved: false
    lesson: lesson-verbal-logic-none-and-may
    keyPoint: 2
    type: single_choice
    difficulty: medium
    stem: |
      A health center says, “Walk-in consultations may resume on Friday.” A radio host reports, “Walk-in consultations will resume on Friday.” Which change in meaning did the host introduce?
    choices:
      - text: "The host made the restart sound certain."
        correct: true
      - text: "The host moved the expected restart to an earlier day."
        rationale: |
          A change in wording may sound like a change in the schedule. Compare the days named in both statements.
      - text: "The host changed which type of consultation the notice covered."
        rationale: |
          A shorter report might leave out a group. Check whether both statements still name walk-in consultations.
      - text: "The host said consultations would run on Fridays from then on."
        rationale: |
          A Friday restart may sound like a new weekly schedule. Look for words that refer to more than one Friday.
    explanation: |
      The health center said a Friday restart was possible. The host used “will,” which says the restart is set.

  - id: q-verbal-logic-assumptions-and-conclusions-0044
    approved: false
    lesson: lesson-verbal-logic-best-supported-conclusions
    keyPoint: 1
    type: single_choice
    difficulty: medium
    stem: |
      A Davao school offered both print and audio copies of a short story. The borrowing record shows that the print copies were checked out more often. The school had made more print copies than audio copies available. Which claim has the strongest support?
    choices:
      - text: "Print copies had more recorded loans."
        correct: true
      - text: "The difference in the number of copies explains the difference in loans."
        rationale: |
          Having more copies may help raise loans. Check if the record shows that this is what made the difference.
      - text: "Given equal access, students would still choose print more often."
        rationale: |
          The larger loan count can look like a clear choice. Check if the students had equal access during the trial.
      - text: "The print edition reached more individual students than the audio edition."
        rationale: |
          More loans can sound like more readers. Check if the same student could have borrowed a copy more than once.
    explanation: |
      The record counts more checkouts for print. That is enough to compare the loan totals.

  - id: q-verbal-logic-assumptions-and-conclusions-0045
    approved: false
    lesson: lesson-verbal-logic-best-supported-conclusions
    keyPoint: 1
    type: single_choice
    difficulty: medium
    stem: |
      A barangay asked residents to mark places where they had trouble crossing a road. The maps submitted named several locations, and the junction by the bakery appeared on more maps than any other location. The forms recorded locations but did not ask how often residents crossed there. Which conclusion is best supported?
    choices:
      - text: "The bakery junction was marked most often."
        correct: true
      - text: "Residents cross at the bakery junction more often than elsewhere."
        rationale: |
          Many marks can make a crossing look busy. Check if the maps counted trips or places people found hard to cross.
      - text: "The bakery junction had the most serious crossing problems."
        rationale: |
          A high number of reports may sound like a sign of danger. Check whether the maps rate how serious each problem was.
      - text: "Most residents who submitted maps marked the bakery junction."
        rationale: |
          First place can sound like a majority. Check if a place could get the most marks while still appearing on fewer than half the maps.
    explanation: |
      The bakery junction appeared on more of the returned maps than any other place. That makes it the most often marked location.

  - id: q-verbal-logic-assumptions-and-conclusions-0046
    approved: false
    lesson: lesson-verbal-logic-unsupported-causes-and-motives
    keyPoint: 1
    type: single_choice
    difficulty: medium
    stem: |
      A school garden's pechay grew faster after students changed its watering schedule. During the same week, the students also moved the trays from a shaded hallway to a sunny courtyard. Why is it premature to credit the watering schedule alone?
    choices:
      - text: "The move also changed the plants' light."
        correct: true
      - text: "The faster growth began after students changed the watering schedule."
        rationale: |
          That timing makes the schedule seem important. Check if timing points to just one change or fits both.
      - text: "The students kept the same kind of vegetable throughout the trial."
        rationale: |
          Using the same vegetable may seem like a reason to doubt the result. Look for what did change along with the watering.
      - text: "The move proves that sunlight was the only cause of the increase."
        rationale: |
          More sun may help the plants grow. Check if the trial tested the move by itself before giving it all the credit.
    explanation: |
      The plants got a new watering schedule and more light at the same time. Either change could have helped them grow faster.

  - id: q-verbal-logic-assumptions-and-conclusions-0047
    approved: false
    lesson: lesson-verbal-logic-unsupported-causes-and-motives
    keyPoint: 1
    type: single_choice
    difficulty: medium
    stem: |
      After a town hall meeting, Mariel took down the poster she had put up to promote a proposal. Her coworker claims that she took it down because she had changed her mind. Which detail would most directly support that explanation?
    choices:
      - text: "Mariel says she removed it because she withdrew her support."
        correct: true
      - text: "Other workers took down their own posters after the meeting."
        rationale: |
          Their actions may make the change seem common. Check if anyone explains why Mariel took hers down.
      - text: "The proposal faced strong opposition during the town hall meeting."
        rationale: |
          Opposition could make someone rethink a plan. Look for a sign that it changed Mariel's own view.
      - text: "Mariel had put the poster in a hallway used by meeting attendees."
        rationale: |
          The spot shows that she wanted people to see the poster. Check if it tells you what she thought after the meeting.
    explanation: |
      Mariel gives her own reason for taking the poster down. Her change of mind is now backed by what she says.

  - id: q-verbal-logic-assumptions-and-conclusions-0048
    approved: false
    lesson: lesson-verbal-logic-recognizing-bias
    keyPoint: 1
    type: single_choice
    difficulty: medium
    stem: |
      An Iloilo cooperative newsletter reports on two proposed market sites. It describes traders with stalls near the first site as “experienced vendors” and traders with equally long records near the second as “people protecting their turf.” What gives the clearest evidence of bias?
    choices:
      - text: "Similar groups are described in unequal terms."
        correct: true
      - text: "Both groups have a financial interest in the site decision."
        rationale: |
          Their interests may shape their own views. Check how the newsletter treats the two groups.
      - text: "The newsletter reports on the two sites under consideration."
        rationale: |
          A report with only two sites may look narrow. Check whether the choice of words favors one of those sites.
      - text: "The newsletter identifies where the traders currently operate."
        rationale: |
          Their locations matter to the plan, so this may stand out. Look for the words that give each group a good or bad name.
    explanation: |
      The two groups have worked for about as long. The paper praises one group's skill and makes the other group sound selfish.

  - id: q-verbal-logic-assumptions-and-conclusions-0049
    approved: false
    lesson: lesson-verbal-logic-recognizing-bias
    keyPoint: 1
    type: single_choice
    difficulty: medium
    stem: |
      A campus magazine says its article presents student views on a proposal to charge for parking. The editor invites only members of a club formed to oppose the fee. The article quotes those members accurately. Which criticism identifies the main source of bias?
    choices:
      - text: "The invitations favored one viewpoint."
        correct: true
      - text: "The editor needed to print each student's full statement."
        rationale: |
          A short quote can sometimes hide context. Check if the passage says any quote was changed or used unfairly.
      - text: "The quoted members should have avoided expressing an opinion about the fee."
        rationale: |
          Strong opinions may sound unfair. Look at who was asked to speak and who was left out.
      - text: "The article should have addressed campus transport issues besides parking."
        rationale: |
          A broader article could cover more ground. Check how the editor chose views on the issue the article did cover.
    explanation: |
      Only students in the group against the fee were asked. Even correct quotes can give a one-sided picture when all the voices come from one side.

  - id: q-verbal-logic-assumptions-and-conclusions-0050
    approved: false
    lesson: lesson-verbal-logic-negating-assumptions
    keyPoint: 1
    type: single_choice
    difficulty: hard
    stem: |
      A school records officer assumes that every form returned by a class adviser contained at least one parent signature. Which finding states the exact condition under which that assumption fails?
    choices:
      - text: "An adviser returned a form with no parent signature."
        correct: true
      - text: "A parent left some adviser-returned forms unsigned even though another parent signed each one."
        rationale: |
          Seeing a missing signature may make a form seem to fail. Check whether the claim needs every parent to sign or just one.
      - text: "No form returned by any class adviser contained a parent signature."
        rationale: |
          This would make the claim false, but it goes too far. Ask if a single form could break the rule.
      - text: "At least one form without a parent signature was never returned by a class adviser."
        rationale: |
          The form has no signature, but check which forms the claim covers. It counts forms advisers did return.
    explanation: |
      The claim is about each form the advisers returned. Take away every parent signature from just one of those forms and the claim fails.

  - id: q-verbal-logic-assumptions-and-conclusions-0051
    approved: false
    lesson: lesson-verbal-logic-compound-assumptions
    keyPoint: 1
    type: single_choice
    difficulty: hard
    stem: |
      A coastal monitoring team assumes that the station has a working battery and at least one of its two memory cards has room. Which statement is the exact negation of that assumption?
    choices:
      - text: "The battery fails or neither card has room."
        correct: true
      - text: "The battery fails and both memory cards are full."
        rationale: |
          All of these failures would stop the plan. Check if the battery failing by itself would already be enough.
      - text: "The battery fails or at least one memory card is full."
        rationale: |
          A full card sounds like a problem. Try a good battery and one card with room to see if the original claim still holds.
      - text: "The battery works but neither of the two memory cards has room."
        rationale: |
          Full cards do break the claim. Check whether this answer also covers a failed battery.
    explanation: |
      A good battery is needed. Room on even one card is enough for the other part. The claim fails if the battery fails or if both cards lack room.

  - id: q-verbal-logic-assumptions-and-conclusions-0052
    approved: false
    lesson: lesson-verbal-logic-none-and-may
    keyPoint: 1
    type: single_choice
    difficulty: hard
    stem: |
      The roster for a provincial debate meet has separate lists for judges, speakers, and observers. No judge is also listed as a speaker. Some observers are on the judges' list, and no other restrictions are given. Which conclusion is required?
    choices:
      - text: "Some observers are not speakers."
        correct: true
      - text: "The observers who are speakers must also be on the judges' list."
        rationale: |
          The lists for observers and judges overlap, which may make them seem linked for every observer. Check what happens when a speaker is put on the judges' list.
      - text: "The observers who are outside the judges' list must be speakers."
        rationale: |
          Being left off one list may make it seem that the other is the only choice. Check if an observer can be on neither list.
      - text: "No observer can appear on the speakers' list at this meet."
        rationale: |
          Some observers are kept off the speakers' list. Check if the rule covers every observer or just those who are judges.
    explanation: |
      At least one observer is a judge. Judges cannot be speakers, so that observer is outside the speakers' list.

  - id: q-verbal-logic-assumptions-and-conclusions-0053
    approved: false
    lesson: lesson-verbal-logic-best-supported-conclusions
    keyPoint: 1
    type: single_choice
    difficulty: hard
    stem: |
      A Laguna packing plant trialed two types of fruit crate. On long routes, fruit in slotted crates arrived with less damage on average. On short routes, fruit in solid crates arrived with less damage on average. The report gives no overall result across both route groups. Which statement best reflects the results?
    choices:
      - text: "The better crate differed by route length."
        correct: true
      - text: "Either crate is equally effective across all of the routes combined."
        rationale: |
          Each style led in one group, which may look like a tie. Check if each group had the same weight in the total.
      - text: "Slotted crates should replace solid crates on routes of either length."
        rationale: |
          The long-route result may seem to settle the choice. Check which crate did better on the short routes.
      - text: "Solid crates protected the fruit better across the trial as a whole."
        rationale: |
          The short-route result may make solid crates sound better overall. Check if the report gives a result for both sets of routes together.
    explanation: |
      Slotted crates led on long routes. Solid crates led on short routes. The lead changed with the route length.

  - id: q-verbal-logic-assumptions-and-conclusions-0054
    approved: false
    lesson: lesson-verbal-logic-unsupported-causes-and-motives
    keyPoint: 1
    type: single_choice
    difficulty: hard
    stem: |
      Lowland rice plots assigned new seed trays had fewer failed seedlings than upland plots assigned the old trays. The field team credited the new trays. Which follow-up would most directly test that claim?
    choices:
      - text: "Compare both tray types on similar plots at one elevation."
        correct: true
      - text: "Repeat the trial with more lowland plots using new trays and more upland plots using old trays."
        rationale: |
          A bigger test may sound stronger. Check if it still changes two things at once.
      - text: "Compare the two elevations using only new trays at both locations."
        rationale: |
          This could show a difference between locations. Check if the test also gives you evidence about the old trays.
      - text: "Use the new trays on one crop and the old trays on a different crop at the same site."
        rationale: |
          Using one site helps keep the land alike. Check what else changes when the tray type changes.
    explanation: |
      The first test changes the trays and the height of the land at the same time. Testing both trays at the same height helps show what difference the trays make.
