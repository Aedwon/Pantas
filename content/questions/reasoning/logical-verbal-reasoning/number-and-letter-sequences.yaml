meta:
  subject: reasoning
  topic: logical-verbal-reasoning
  subtopic: number-and-letter-sequences
  exams: [ acet, ustet, dost-sei , cse-pro, cse-sub]
questions:
  - id: q-logical-verbal-reasoning-number-and-letter-sequences-0001
    type: number-letter-series
    difficulty: easy
    stem: |
      Find the next term: 4, 9, 14, 19, ...
    choices:
      - text: "24"
        correct: true
      - text: "23"
      - text: "25"
      - text: "22"
    explanation: |
      Each term increases by 5 ($9-4=5$, $14-9=5$, $19-14=5$). The next term is $19+5=24$.
    approved: true

  - id: q-logical-verbal-reasoning-number-and-letter-sequences-0002
    type: number-letter-series
    difficulty: easy
    stem: |
      Find the next term: 5, 10, 15, 20, ...
    choices:
      - text: "25"
        correct: true
      - text: "24"
      - text: "30"
      - text: "22"
    explanation: |
      Each term increases by 5. The next term is $20+5=25$.
    approved: true

  - id: q-logical-verbal-reasoning-number-and-letter-sequences-0003
    type: number-letter-series
    difficulty: medium
    stem: |
      Find the next term: 2, 6, 18, 54, ...
    choices:
      - text: "162"
        correct: true
      - text: "108"
      - text: "216"
      - text: "150"
    explanation: |
      Each term is multiplied by 3 ($6\div2=3$, $18\div6=3$, $54\div18=3$). The next term is $54\times3=162$.
    approved: true

  - id: q-logical-verbal-reasoning-number-and-letter-sequences-0004
    type: number-letter-series
    difficulty: medium
    stem: |
      Find the next term: 5, 15, 45, 135, ...
    choices:
      - text: "405"
        correct: true
      - text: "270"
      - text: "540"
      - text: "360"
    explanation: |
      Each term is multiplied by 3 ($15\div5=3$, $45\div15=3$, $135\div45=3$). The next term is $135\times3=405$.
    approved: true

  - id: q-logical-verbal-reasoning-number-and-letter-sequences-0005
    type: number-letter-series
    difficulty: medium
    stem: |
      Find the next term: 2, 3, 5, 8, 12, ...
    choices:
      - text: "17"
        correct: true
      - text: "15"
      - text: "16"
      - text: "18"
    explanation: |
      The differences increase by 1 each time ($1, 2, 3, 4$), so the next difference is $5$. The next term is $12+5=17$.
    approved: true

  - id: q-logical-verbal-reasoning-number-and-letter-sequences-0006
    type: number-letter-series
    difficulty: medium
    stem: |
      Find the next term: 1, 2, 4, 7, 11, ...
    choices:
      - text: "16"
        correct: true
      - text: "14"
      - text: "15"
      - text: "18"
    explanation: |
      The differences increase by 1 each time ($1, 2, 3, 4$), so the next difference is $5$. The next term is $11+5=16$.
    approved: true

  - id: q-logical-verbal-reasoning-number-and-letter-sequences-0007
    type: number-letter-series
    difficulty: medium
    stem: |
      Find the 7th term: 1, 10, 3, 8, 5, 6, ...
    choices:
      - text: "7"
        correct: true
      - text: "4"
      - text: "8"
      - text: "9"
    explanation: |
      This sequence interleaves two patterns: odd positions increase by 2 ($1, 3, 5, \ldots$) and even positions decrease by 2 ($10, 8, 6, \ldots$). The 7th term (an odd position) continues $1, 3, 5, 7$, so the answer is $7$.
    approved: true

  - id: q-logical-verbal-reasoning-number-and-letter-sequences-0008
    type: number-letter-series
    difficulty: medium
    stem: |
      Find the next term: 1, 1, 2, 3, 5, 8, ...
    choices:
      - text: "13"
        correct: true
      - text: "11"
      - text: "12"
      - text: "10"
    explanation: |
      Each term is the sum of the two terms before it (Fibonacci-style): $5+8=13$.
    approved: true

  - id: q-logical-verbal-reasoning-number-and-letter-sequences-0009
    type: number-letter-series
    difficulty: medium
    stem: |
      Find the next letter: B, D, G, K, ...
    choices:
      - text: P
        correct: true
      - text: "O"
      - text: "N"
      - text: "Q"
    explanation: |
      Converting to alphabet positions: $B=2, D=4, G=7, K=11$. The differences increase by 1 each time ($2, 3, 4$), so the next difference is $5$: $11+5=16$, which is the letter $P$.
    approved: true

  - id: q-logical-verbal-reasoning-number-and-letter-sequences-0010
    type: number-letter-series
    difficulty: easy
    stem: |
      Find the next letter: A, C, E, G, ...
    choices:
      - text: I
        correct: true
      - text: "H"
      - text: "J"
      - text: "K"
    explanation: |
      Converting to alphabet positions: $A=1, C=3, E=5, G=7$, each increasing by 2. The next position is $7+2=9$, which is the letter $I$.
    approved: true

  - id: q-logical-verbal-reasoning-number-and-letter-sequences-0011
    type: number-letter-series
    difficulty: hard
    stem: |
      A student sees the sequence 3, 5, 8, 12, 17, ... and guesses the pattern is "add 2 each time," based on the first gap ($5-3=2$). Is this guess correct, and what is the actual next term?
    choices:
      - text: The guess is incorrect — the differences actually increase by 1 each time ($2, 3, 4, 5$), so the correct next term is $17+6=23$, not $17+2=19$.
        correct: true
      - text: The guess is correct — the next term is $17+2=19$.
      - text: The guess is correct, but only because every sequence must add a constant amount.
      - text: Neither guess nor calculation can be verified from the given terms.
    explanation: |
      Checking all the differences ($2, 3, 4, 5$) reveals they are increasing, not constant — a changing-difference pattern, not simple arithmetic. The correct next difference is $6$, giving $17+6=23$.
    approved: true

  - id: q-logical-verbal-reasoning-number-and-letter-sequences-0012
    type: number-letter-series
    difficulty: hard
    stem: |
      A student sees the first two terms of a sequence, 3 and 6, and immediately guesses the pattern is "multiply by 2 each time." The full sequence is actually 3, 6, 9, 12, 15, .... Is the student's guess correct, and what is the actual next term after 15?
    choices:
      - text: The guess is incorrect — checking all the terms shows the pattern is actually "add 3 each time" (arithmetic), not "multiply by 2"; the correct next term is $15+3=18$.
        correct: true
      - text: The guess is correct — the next term is $15\times2=30$.
      - text: The guess is correct, since the first two terms alone are always enough to confirm any pattern.
      - text: Neither an arithmetic nor a geometric pattern can describe this sequence.
    explanation: |
      Two terms alone can match multiple possible patterns ($3, 6$ fits both "add 3" and "multiply by 2"). Checking the full sequence ($3, 6, 9, 12, 15$) confirms a constant difference of $3$ (arithmetic), not a constant ratio, so the next term is $15+3=18$.
    approved: true

  - id: q-logical-verbal-reasoning-number-and-letter-sequences-0013
    type: number-letter-series
    difficulty: hard
    stem: |
      A student is solving a letter sequence and correctly computes the next alphabet position number as 21, then selects "21" as their final answer, since the question is about a sequence. What mistake did the student make, and what should the final answer be?
    choices:
      - text: The student forgot to convert the numeric answer back into its corresponding letter; since position 21 corresponds to U, the final answer should be U, not the number 21.
        correct: true
      - text: The student made no mistake; "21" is an acceptable final answer for a letter sequence question.
      - text: The student's numeric calculation itself was wrong, regardless of the conversion step.
      - text: Letter sequences should always be answered using alphabet positions, never letters.
    explanation: |
      After solving a letter sequence using alphabet position numbers, you must always convert your final numeric answer back into its corresponding letter. Solving that the next number is $21$ is not the final answer if the question asks for a letter — the correct answer is $U$ (the 21st letter).
    approved: true

  - id: q-logical-verbal-reasoning-number-and-letter-sequences-0014
    type: number-letter-series
    difficulty: medium
    stem: |
      Find the next letter: D, G, J, M, ...
    choices:
      - text: P
        correct: true
      - text: "O"
      - text: "Q"
      - text: "N"
    explanation: |
      Converting to alphabet positions: $D=4, G=7, J=10, M=13$, each increasing by 3. The next position is $13+3=16$, which is the letter $P$.
    approved: true

  - id: q-logical-verbal-reasoning-number-and-letter-sequences-0015
    type: number-letter-series
    difficulty: hard
    stem: |
      Find the 8th term: 2, 20, 4, 18, 6, 16, ...
    choices:
      - text: "14"
        correct: true
      - text: "8"
      - text: "12"
      - text: "10"
    explanation: |
      This sequence interleaves two patterns: odd positions increase by 2 ($2, 4, 6, \ldots$) and even positions decrease by 2 ($20, 18, 16, \ldots$). The 8th term (an even position) continues $20, 18, 16, 14$, so the answer is $14$.
    approved: true

  - id: q-logical-verbal-reasoning-number-and-letter-sequences-0016
    type: number-letter-series
    difficulty: exam
    stem: |
      Find the next letter: B, C, E, H, L, ...
    choices:
      - text: Q
        correct: true
      - text: "P"
      - text: "R"
      - text: "N"
    explanation: |
      Converting to alphabet positions: $B=2, C=3, E=5, H=8, L=12$. The differences increase by 1 each time ($1, 2, 3, 4$), so the next difference is $5$: $12+5=17$, which is the letter $Q$.
    approved: true
