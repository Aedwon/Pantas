  - id: q-logical-verbal-reasoning-number-and-letter-sequences-0011
    type: number-letter-series
    difficulty: hard
    stem: |
      A student sees the sequence 3, 5, 8, 12, 17, ... and guesses the pattern is "add 2 each time," based on the first gap ($5-3=2$). Is this guess correct, and what is the actual next term?
    choices:
      - text: 'The guess is incorrect: the differences actually increase by 1 each time ($2, 3, 4, 5$), so the correct next term is $17+6=23$, not $17+2=19$.'
        correct: true
      - text: 'The guess is correct: the next term is $17+2=19$.'
        rationale: |
          You assumed the first gap of +2 applies to all terms. The differences actually increase (, 3, 4, 5$), so the next term is  + 6 = 23$.
      - text: The guess is correct, but only because every sequence must add a constant amount.
        rationale: |
          You assumed sequences always add a constant amount. Sequences can have growing differences.
      - text: Neither guess nor calculation can be verified from the given terms.
        rationale: |
          You assumed the pattern cannot be determined. Five terms provide enough evidence to verify increasing differences.
    explanation: |
      Checking all the differences ($2, 3, 4, 5$) reveals they are increasing, not constant: a changing-difference pattern, not simple arithmetic. The correct next difference is $6$, giving $17+6=23$.
    approved: true

  - id: q-logical-verbal-reasoning-number-and-letter-sequences-0012
    type: number-letter-series
    difficulty: hard
    stem: |
      A student sees the first two terms of a sequence, 3 and 6, and immediately guesses the pattern is "multiply by 2 each time." The full sequence is actually 3, 6, 9, 12, 15, .... Is the student's guess correct, and what is the actual next term after 15?
    choices:
      - text: 'The guess is incorrect: checking all the terms shows the pattern is actually "add 3 each time" (arithmetic), not "multiply by 2"; the correct next term is $15+3=18$.'
        correct: true
      - text: 'The guess is correct: the next term is $15\times2=30$.'
        rationale: |
          You relied on the first two terms alone. Checking all terms shows a constant addition of 3, not multiplication by 2.
      - text: The guess is correct, since the first two terms alone are always enough to confirm any pattern.
        rationale: |
          You assumed two terms are sufficient to confirm a pattern. Two terms can fit multiple rules.
      - text: Neither an arithmetic nor a geometric pattern can describe this sequence.
        rationale: |
          You claimed no pattern describes the sequence. A constant difference of 3 describes it cleanly.
    explanation: |
      Two terms alone can match multiple possible patterns ($3, 6$ fits both "add 3" and "multiply by 2"). Checking the full sequence ($3, 6, 9, 12, 15$) confirms a constant difference of $3$ (arithmetic), not a constant ratio, so the next term is $15+3=18$.
    approved: true

  - id: q-logical-verbal-reasoning-number-and-letter-sequences-0013
    type: number-letter-series
    difficulty: hard
    stem: |
      A student is solving a letter sequence and correctly computes the next alphabet position number as 21, then selects "21" as their final answer, since the question is about a sequence. What mistake did the student make, and what should the final answer be?
    choices:
      - text: The student forgot to convert the numeric answer back into its corresponding letter; since position 21 corresponds to U, the final answer should be U, not the number 21.
        correct: true
      - text: The student made no mistake; "21" is an acceptable final answer for a letter sequence question.
        rationale: |
          You accepted a numerical output for a letter sequence. The numerical value must be converted back to a letter.
      - text: The student's numeric calculation itself was wrong, regardless of the conversion step.
        rationale: |
          You focused on the math rather than the representation. The math 21 was correct, but required conversion to U.
      - text: Letter sequences should always be answered using alphabet positions, never letters.
        rationale: |
          You inverted the output rule. Letter sequences require letter answers.
    explanation: |
      After solving a letter sequence using alphabet position numbers, you must always convert your final numeric answer back into its corresponding letter. Solving that the next number is $21$ is not the final answer if the question asks for a letter: the correct answer is $U$ (the 21st letter).
    approved: true

