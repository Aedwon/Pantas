  - id: q-logical-verbal-reasoning-number-and-letter-sequences-0007
    type: number-letter-series
    difficulty: medium
    stem: |
      Find the 7th term: 1, 10, 3, 8, 5, 6, ...
    choices:
      - text: "7"
        correct: true
      - text: "4"
        rationale: |
          You evaluated the even position pattern (, 8, 6, 4$) instead of the odd position pattern. The 7th term is an odd position (, 3, 5, 7$).
      - text: "8"
        rationale: |
          You selected a value from the decreasing even sequence. The 7th term follows the odd sequence , 3, 5, 7$.
      - text: "9"
        rationale: |
          You added 4 to the 5th term instead of 2. The odd positions increase by 2 each time.
    explanation: |
      This sequence interleaves two patterns: odd positions increase by 2 ($1, 3, 5, \ldots$) and even positions decrease by 2 ($10, 8, 6, \ldots$). The 7th term (an odd position) continues $1, 3, 5, 7$, so the answer is $7$.
    approved: true

  - id: q-logical-verbal-reasoning-number-and-letter-sequences-0008
    type: number-letter-series
    difficulty: medium
    stem: |
      Find the next term: 1, 1, 2, 3, 5, 8, ...
    choices:
      - text: "13"
        correct: true
      - text: "11"
        rationale: |
          You added 3 to 8. Fibonacci terms are formed by adding the two preceding terms ( + 8 = 13$).
      - text: "12"
        rationale: |
          You added 4 to 8. In a Fibonacci sequence, each term is the sum of the previous two terms ( + 8 = 13$).
      - text: "10"
        rationale: |
          You added 2 to 8. You must add the preceding term 5 to 8 to get 13.
    explanation: |
      Each term is the sum of the two terms before it (Fibonacci-style): $5+8=13$.
    approved: true

