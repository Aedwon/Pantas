questions:
  - id: q-logical-verbal-reasoning-number-and-letter-sequences-0001
    type: number-letter-series
    difficulty: easy
    stem: |
      Find the next term: 4, 9, 14, 19, ...
    choices:
      - text: "24"
        correct: true
      - text: "23"
        rationale: |
          You added 4 to the last term instead of 5. The pattern adds 5 to each term ( + 5 = 24$).
      - text: "25"
        rationale: |
          You added 6 to the last term instead of 5. Each step increases by exactly 5 ( + 5 = 24$).
      - text: "22"
        rationale: |
          You added 3 to the last term instead of 5. Check the difference between consecutive terms ( - 4 = 5$).
    explanation: |
      Each term increases by 5 ($9-4=5$, $14-9=5$, $19-14=5$). The next term is $19+5=24$.
    approved: true

