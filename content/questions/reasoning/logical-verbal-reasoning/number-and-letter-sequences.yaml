meta:
  subject: reasoning
  topic: logical-verbal-reasoning
  subtopic: number-and-letter-sequences
  exams: [ acet, ustet, dost-sei , cse-pro, cse-sub]
questions:
  - id: q-logical-verbal-reasoning-number-and-letter-sequences-0001
    type: number-letter-series
    difficulty: easy
    stem: |
      Following the constant-difference pattern, find the next term: $4, 9, 14, 19, ...$.
    choices:
      - text: "24"
        correct: true
      - text: "23"
        rationale: |
          This adds 4 instead of 5 to 19. The last digit of 14 may distract from the actual gap. Check every difference between adjacent terms.
      - text: "25"
        rationale: |
          This adds 6 instead of 5 to 19. Moving one step too far can happen while counting forward. Check the repeated size of each step.
      - text: "22"
        rationale: |
          This adds 3 instead of 5 to 19. A small increase may seem to fit an increasing list. Check the exact difference across all shown pairs.
    explanation: |
      The differences are $9-4=5$, $14-9=5$, and $19-14=5$. Keep adding 5. The next term is $19+5=24$.
    approved: true

  - id: q-logical-verbal-reasoning-number-and-letter-sequences-0002
    type: number-letter-series
    difficulty: easy
    stem: |
      Find the missing term in this constant-difference sequence: $31, 24, ..., 10, 3$.
    choices:
      - text: "17"
        correct: true
      - text: "18"
        rationale: |
          This subtracts 6 from 24. A one-place counting error can make the result look close. Check the gap from 31 to 24.
      - text: "16"
        rationale: |
          This subtracts 8 from 24. The descending direction is right, which can hide the extra step. Check both neighbors of the missing term.
      - text: "7"
        rationale: |
          This gives the size of the decrease instead of the missing value. Seven is the key step in the pattern. Check what the question asks to put in the gap.
    explanation: |
      The sequence decreases by 7: $31-7=24$. The missing term is $24-7=17$, followed by $17-7=10$ and $10-7=3$.
    approved: true

  - id: q-logical-verbal-reasoning-number-and-letter-sequences-0003
    type: number-letter-series
    difficulty: medium
    stem: |
      Following the constant-ratio pattern, find the next term: $2, 6, 18, 54, ...$.
    choices:
      - text: "162"
        correct: true
      - text: "108"
        rationale: |
          This doubles 54 instead of multiplying it by 3. Doubling is a familiar growth rule. Check the ratio in every shown pair.
      - text: "216"
        rationale: |
          This multiplies 54 by 4 instead of 3. The rapidly increasing numbers may suggest a larger multiplier. Check the actual common ratio.
      - text: "90"
        rationale: |
          This adds the last difference, 36, to 54. Repeating a gap works in arithmetic sequences. Check whether the gaps stay equal or the ratios stay equal.
    explanation: |
      The ratios are $6/2=3$, $18/6=3$, and $54/18=3$. Each term is multiplied by 3. The next term is $54$ times $3$, which is $162$.
    approved: true

  - id: q-logical-verbal-reasoning-number-and-letter-sequences-0004
    type: number-letter-series
    difficulty: medium
    stem: |
      Find the missing term in this constant-ratio sequence: $64, 32, ..., 8, 4$.
    choices:
      - text: "16"
        correct: true
      - text: "64"
        rationale: |
          This doubles 32 instead of halving it. Multiplication and division are related ratio operations. Check whether the given sequence grows or shrinks.
      - text: "8"
        rationale: |
          This halves 32 twice and skips a term. Eight is visibly in the sequence. Check that each position takes only one step.
      - text: "0"
        rationale: |
          This subtracts the first gap of 32 again. A fixed difference fits the first pair. Check the later 8-to-4 transition before using that rule.
    explanation: |
      Each term is half the previous term. Half of 64 is 32, and half of 32 is 16. Continuing gives 8 and then 4, so the gap is 16.
    approved: true

  - id: q-logical-verbal-reasoning-number-and-letter-sequences-0005
    type: number-letter-series
    difficulty: medium
    stem: |
      The successive differences follow a simple increasing pattern. Find the next term: $2, 3, 5, 8, 12, ...$.
    choices:
      - text: "17"
        correct: true
      - text: "15"
        rationale: |
          This adds 3 to 12, reusing an earlier gap. Three was a valid increase earlier in the sequence. Check the order of the changing gaps.
      - text: "16"
        rationale: |
          This repeats the last gap of 4. That can look right if only the latest pair is checked. Check whether the gaps themselves are increasing.
      - text: "18"
        rationale: |
          This adds 6 and skips the next gap of 5. The increases are growing, so a larger gap seems plausible. Check that the gap increases by only one each time.
    explanation: |
      The successive increases are 1, 2, 3, and 4. Increase the next gap by one to 5. Then $12+5=17$.
    approved: true

  - id: q-logical-verbal-reasoning-number-and-letter-sequences-0006
    type: number-letter-series
    difficulty: medium
    stem: |
      Continue the pattern in the successive differences: $1, 4, 9, 16, ...$. What is the next term?
    choices:
      - text: "25"
        correct: true
      - text: "23"
        rationale: |
          This repeats the last increase of 7. Reusing the latest gap is a common shortcut. Check how the gaps change from 3 to 5 to 7.
      - text: "24"
        rationale: |
          This adds 8 instead of the next odd gap, 9. Eight looks like the next larger number after 7. Check that the gaps increase by two.
      - text: "32"
        rationale: |
          This doubles 16. Some early terms can suggest multiplication. Check whether doubling fits every shown transition.
    explanation: |
      The increases are 3, 5, and 7. They grow by 2 each time, so the next increase is 9. Then $16+9=25$.
    approved: true

  - id: q-logical-verbal-reasoning-number-and-letter-sequences-0007
    type: number-letter-series
    difficulty: medium
    stem: |
      This sequence has separate odd- and even-position patterns. Find the seventh term: $1, 10, 3, 8, 5, 6, ...$.
    choices:
      - text: "7"
        correct: true
      - text: "4"
        rationale: |
          This continues the even-position track. That track is visibly decreasing to 4. Check whether the requested position is odd or even.
      - text: "8"
        rationale: |
          This uses a prior value from the even-position track. Eight is already in the list. Check which positions belong to the requested track.
      - text: "9"
        rationale: |
          This adds 4 to the odd-position value 5. Two places are skipped in the written list, which may suggest doubling the increment. Check the gaps within the odd track itself.
    explanation: |
      The odd positions are 1, 3, and 5, increasing by 2. The even positions are 10, 8, and 6, decreasing by 2. Position 7 is odd, so it continues $5+2=7$.
    approved: true

  - id: q-logical-verbal-reasoning-number-and-letter-sequences-0008
    type: number-letter-series
    difficulty: medium
    stem: |
      Each term after the first two is the sum of the two immediately before it. Find the next term: $1, 1, 2, 3, 5, 8, ...$.
    choices:
      - text: "13"
        correct: true
      - text: "11"
        rationale: |
          This adds 3 to 8 and skips the immediately preceding 5. Three is an earlier value in the list. Check the two terms directly before the gap.
      - text: "16"
        rationale: |
          This doubles the final 8. A doubling rule can fit the first few values partly. Check the stated two-term addition rule.
      - text: "21"
        rationale: |
          This adds the next two-term result once more, skipping a position. The recurrence can be carried on mentally too far. Check which term the first blank represents.
    explanation: |
      Each later term adds the two terms directly before it: $1+1=2$, $1+2=3$, $2+3=5$, and $3+5=8$. The next term is $5+8=13$.
    approved: true

  - id: q-logical-verbal-reasoning-number-and-letter-sequences-0009
    type: number-letter-series
    difficulty: medium
    stem: |
      Use English alphabet positions A=1 through Z=26 and the increasing jump pattern. Find the next letter: B, D, G, K, ...
    choices:
      - text: "P"
        correct: true
      - text: "O"
        rationale: |
          This repeats the last jump of 4, reaching position 15. The last pair is easy to reuse. Check whether the jump sizes are increasing.
      - text: "N"
        rationale: |
          This reuses the earlier jump of 3, reaching position 14. That was a valid jump earlier. Check which jump comes next in the pattern.
      - text: "Q"
        rationale: |
          This jumps by 6, reaching position 17. The steps are growing, so it may look close. Check that the next jump is only one larger.
    explanation: |
      Using A=1 through Z=26 gives positions 2, 4, 7, and 11. The jumps are 2, 3, and 4, so the next jump is 5. Position $11+5=16$ is P.
    approved: true

  - id: q-logical-verbal-reasoning-number-and-letter-sequences-0010
    type: number-letter-series
    difficulty: easy
    stem: |
      Use the constant alphabet-position jump. Find the next letter: A, C, E, G, ...
    choices:
      - text: "I"
        correct: true
      - text: "H"
        rationale: |
          This advances one position from G. It gives the very next letter. Check the repeated jump of two positions.
      - text: "J"
        rationale: |
          This advances three positions from G. Counting both the starting letter and moves can add a step. Check the gaps between the given letters.
      - text: "K"
        rationale: |
          This advances four positions from G. Skipping two places in the written list may lead to too large a move. Check the constant position difference.
    explanation: |
      The positions are 1, 3, 5, and 7. Each increases by 2. The next position is $7+2=9$, which is I.
    approved: true

  - id: q-logical-verbal-reasoning-number-and-letter-sequences-0011
    type: number-letter-series
    difficulty: hard
    stem: |
      A sequence alternates "multiply by 2" and "subtract 1," beginning with multiplication. Which number must replace the final incorrect term in $3, 6, 5, 10, 9, 18, 16$?
    choices:
      - text: "17"
        correct: true
      - text: "16"
        rationale: |
          This subtracts 2 instead of 1 from 18. Two appears in the doubling operation. Check which operation and amount apply at this step.
      - text: "18"
        rationale: |
          This repeats 18 without applying the subtraction. The previous doubling result is easy to reuse. Check that each next position requires an operation.
      - text: "19"
        rationale: |
          This adds 1 to 18 instead of subtracting 1. The size of the change looks right. Check the sign of the alternating operation.
    explanation: |
      Apply the alternating rule: double 3 to get 6, subtract 1 to get 5, double to 10, subtract to 9, then double to 18. The next subtraction gives $18-1=17$.
    approved: true

  - id: q-logical-verbal-reasoning-number-and-letter-sequences-0012
    type: number-letter-series
    difficulty: hard
    stem: |
      Find the next term using the simplest repeated two-operation rule that fits every transition: $2, 5, 11, 23, 47, ...$.
    choices:
      - text: "95"
        correct: true
      - text: "94"
        rationale: |
          This doubles 47 but leaves out the added 1. Doubling explains much of the growth. Check the final adjustment at every shown step.
      - text: "96"
        rationale: |
          This doubles the sum of 47 and 1, giving 96. The same operations are remembered but used in reverse order. Check the order that fits the first transition.
      - text: "50"
        rationale: |
          This adds the first gap, 3, to 47. That rule fits only the first two terms. Check the next transition before accepting it.
    explanation: |
      Each transition doubles the term and adds 1: 2 becomes 5, 5 becomes 11, 11 becomes 23, and 23 becomes 47. Continue with $47+47+1=95$.
    approved: true

  - id: q-logical-verbal-reasoning-number-and-letter-sequences-0013
    type: number-letter-series
    difficulty: hard
    stem: |
      A letter-sequence calculation gives position 21 under English A=1 through Z=26. Which letter should fill the gap?
    choices:
      - text: "U"
        correct: true
      - text: "T"
        rationale: |
          This maps position 20 instead of 21. Counting a starting value twice can end one letter early. Check the stated A=1 starting value.
      - text: "V"
        rationale: |
          This uses A=0 instead of A=1 and maps 21 to V. A zero-based list may be familiar from another system. Check the starting value stated here.
      - text: "21"
        rationale: |
          This leaves the working number as the final response. The calculation correctly reached 21. Check whether the question asks for a number or a letter.
    explanation: |
      Under A=1 through Z=26, U is the twenty-first letter. The requested letter is U.
    approved: true

  - id: q-logical-verbal-reasoning-number-and-letter-sequences-0014
    type: number-letter-series
    difficulty: medium
    stem: |
      The odd and even positions form separate letter patterns. What is the eighth term of A, Z, C, X, E, V, ...?
    choices:
      - text: "T"
        correct: true
      - text: "G"
        rationale: |
          This continues the odd-position track instead of the even one. G is the next value in that track. Check the requested position number.
      - text: "U"
        rationale: |
          This moves back only one position from V. It uses the right direction but the wrong jump. Check the even-track gap from Z to X.
      - text: "V"
        rationale: |
          This repeats the last even-position value. The odd track may draw attention away from its partner. Check that the even track also moves.
    explanation: |
      The odd positions are A, C, E, increasing by two alphabet positions. The even positions are Z, X, V, decreasing by two. Position eight is even, so V moves back two to T.
    approved: true

  - id: q-logical-verbal-reasoning-number-and-letter-sequences-0015
    type: number-letter-series
    difficulty: hard
    stem: |
      Continue the alternating-operation pattern: $2, 4, 5, 10, 11, 22, 23, ...$. Find the next term.
    choices:
      - text: "46"
        correct: true
      - text: "24"
        rationale: |
          This adds 1 again instead of doubling. The latest step was an addition. Check which operation comes next in the cycle.
      - text: "44"
        rationale: |
          This doubles the earlier 22 instead of the latest 23. The last doubled result may stay in memory. Check the value immediately before the gap.
      - text: "45"
        rationale: |
          This doubles the previous large gap, 11, and adds 22 to 23. Growth in the large gaps can make that shortcut seem right. Check whether the next step doubles the current term or the earlier gap.
    explanation: |
      The operations alternate doubling and adding 1: 2 becomes 4, then 5, then 10, then 11, then 22, then 23. The next operation doubles 23 to 46.
    approved: true

  - id: q-logical-verbal-reasoning-number-and-letter-sequences-0016
    type: number-letter-series
    difficulty: exam
    stem: |
      The English alphabet is cyclic here: after Z comes A. Following the constant forward jump, find the next letter: W, Z, C, F, ...
    choices:
      - text: "I"
        correct: true
      - text: "H"
        rationale: |
          This moves two positions from F. Counting the starting letter as a step can lose one move. Check the three-position jumps already shown.
      - text: "J"
        rationale: |
          This moves four positions from F. A wraparound may encourage adding an extra step. Check the ordinary C-to-F jump.
      - text: "C"
        rationale: |
          This reverses direction and moves back three from F. C was the preceding letter in the sequence. Check the direction of all given jumps.
    explanation: |
      Each letter moves forward three alphabet positions. W goes to Z, then the alphabet wraps from Z to A before reaching C. C moves to F, and F moves three positions to I.
    approved: true

  - id: q-logical-verbal-reasoning-number-and-letter-sequences-0017
    type: number-letter-series
    difficulty: hard
    stem: |
      Find the next term in the alternating-operation sequence: $4, 7, 6, 9, 8, 11, ...$.
    choices:
      - text: "10"
        correct: true
      - text: "14"
        rationale: |
          This adds 3 to 11 when the next step is subtraction. The latest rise can draw attention to the larger operation. Check where the cycle is after 8 becomes 11.
      - text: "12"
        rationale: |
          This adds 1 instead of subtracting 1. The small change is remembered with the wrong sign. Check the direction of the alternating smaller step.
      - text: "8"
        rationale: |
          This subtracts 3 instead of 1. The two operation amounts are remembered but exchanged. Check the drops from 7 to 6 and from 9 to 8.
    explanation: |
      The rule alternates adding 3 and subtracting 1: 4 becomes 7, then 6, then 9, then 8, then 11. The next step is $11-1=10$.
    approved: false

  - id: q-logical-verbal-reasoning-number-and-letter-sequences-0018
    type: number-letter-series
    difficulty: hard
    stem: |
      Each term after the first three is the sum of the three immediately before it. Find the next term: $1, 1, 2, 4, 7, ...$.
    choices:
      - text: "13"
        correct: true
      - text: "11"
        rationale: |
          This adds only the last two terms, 4 and 7. That is a familiar recurrence rule. Check how many preceding terms this question requires.
      - text: "14"
        rationale: |
          This doubles the latest 7. Doubling can fit parts of a growing list. Check the stated three-term rule.
      - text: "12"
        rationale: |
          This uses the earlier 1 instead of the most recent third preceding term, 2. Several starting ones can blur the positions. Check the three terms directly before the gap.
    explanation: |
      After the first three terms, add the previous three: $1+1+2=4$, then $1+2+4=7$. The next term is $2+4+7=13$.
    approved: false

  - id: q-logical-verbal-reasoning-number-and-letter-sequences-0019
    type: number-letter-series
    difficulty: hard
    stem: |
      These are the initial letters of consecutive English month names, beginning with January: J, F, M, A, M, J, J, ... What comes next?
    choices:
      - text: "A"
        correct: true
      - text: "S"
        rationale: |
          This uses September as month eight. Treating January as position zero can shift the count. Check that January is the first month.
      - text: "O"
        rationale: |
          This skips August and September to use October. Familiar autumn initials may seem to follow summer months. Check the months in calendar order.
      - text: "J"
        rationale: |
          This repeats J after the June and July terms. Consecutive matching initials can look like a repeated-letter rule. Check the next calendar month.
    explanation: |
      The letters stand for January through July. The eighth month is August, whose first letter is A.
    approved: false

  - id: q-logical-verbal-reasoning-number-and-letter-sequences-0020
    type: number-letter-series
    difficulty: exam
    stem: |
      Use English alphabet positions and increasing jumps within each of the two letter tracks. Complete the paired sequence: AZ, BY, DW, GT, ...
    choices:
      - text: "KP"
        correct: true
      - text: "JP"
        rationale: |
          This repeats the forward jump of 3 for the first track. The second track reaches P correctly. Check that the forward gaps also increase.
      - text: "KQ"
        rationale: |
          This repeats the backward jump of 3 for the second track. The first track reaches K correctly. Check that the backward gaps increase as well.
      - text: "LO"
        rationale: |
          This jumps by 5 in both tracks, skipping the next size of 4. Both gap patterns are growing. Check the sequence of gap sizes before advancing.
    explanation: |
      Read the two letter tracks separately. The first letters A, B, D, G move by 1, 2, and 3, so the next move of 4 gives K. The second letters Z, Y, W, T move back by 1, 2, and 3, so the next backward move of 4 gives P. The pair is KP.
    approved: false

