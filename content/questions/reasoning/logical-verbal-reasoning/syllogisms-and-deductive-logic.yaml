meta:
  subject: reasoning
  topic: logical-verbal-reasoning
  subtopic: syllogisms-and-deductive-logic
  exams: [ acet, ustet, dost-sei , cse-pro]
questions:
  - id: q-logical-verbal-reasoning-syllogisms-and-deductive-logic-0001
    type: syllogism
    difficulty: easy
    stem: |
      All mammals are warm-blooded. A whale is a mammal.
      What must be true?
    choices:
      - text: "A whale is warm-blooded."
        correct: true
      - text: "All warm-blooded animals are mammals."
        rationale: |
          This reverses the group relationship. Knowing a group has a trait may make the trait seem exclusive to that group. Check whether the premise says "all mammals" or "all warm-blooded animals."
      - text: "A whale is not a mammal."
        rationale: |
          This rejects a stated group membership. It may seem like a way to avoid applying the rule. Check the premise that names the whale as a mammal.
      - text: "Some mammals are not warm-blooded."
        rationale: |
          This adds an exception to an all statement. Real-world rules can have exceptions. Check that this deduction treats the stated premises as true.
    explanation: |
      Every mammal has the stated trait. The whale belongs to that group. It therefore has the trait: warm-blooded.
    approved: true

  - id: q-logical-verbal-reasoning-syllogisms-and-deductive-logic-0002
    type: syllogism
    difficulty: easy
    stem: |
      All squares are rectangles. All rectangles have four sides.
      What must be true?
    choices:
      - text: "All squares have four sides."
        correct: true
      - text: "All rectangles are squares."
        rationale: |
          This reverses the first inclusion. Squares and rectangles share many features. Check the direction of the all statement.
      - text: "Some four-sided shapes are not rectangles."
        rationale: |
          This imports a fact outside the given chain. Other four-sided shapes may be familiar. Check whether the premises describe any shapes outside the rectangle group.
      - text: "No squares have four sides."
        rationale: |
          This turns the linked trait into an exclusion. The two category names may seem different. Check how the first group is included in the second.
    explanation: |
      Every square is in the rectangle group. Every rectangle has four sides. Passing through both links gives every square four sides.
    approved: true

  - id: q-logical-verbal-reasoning-syllogisms-and-deductive-logic-0003
    type: syllogism
    difficulty: medium
    stem: |
      If a student studies hard, they will pass the exam. Maria passed the exam. Therefore, Maria studied hard.
      Is this conclusion valid?
    choices:
      - text: "Invalid: result confirmed"
        correct: true
      - text: "Valid: condition confirmed"
        rationale: |
          This treats passing as the condition rather than the result. Both appear in the same rule. Check which clause follows "if."
      - text: "Valid: result denied"
        rationale: |
          This reads a confirmed result as a denied one. Denying a result can support a valid backward inference. Check whether Maria passed or failed.
      - text: "Invalid: premise contradicted"
        rationale: |
          This rejects a premise instead of evaluating the inference. The result is given as true. Check validity while accepting the stated premises.
    explanation: |
      The premise guarantees passing when someone studies hard. It leaves open passing without that cause. Maria's passing therefore does not force the conclusion that she studied hard.
    approved: true

  - id: q-logical-verbal-reasoning-syllogisms-and-deductive-logic-0004
    type: syllogism
    difficulty: medium
    stem: |
      If it rains, the ground gets wet. It did not rain. Therefore, the ground is not wet.
      Is this conclusion valid?
    choices:
      - text: "Invalid: condition denied"
        correct: true
      - text: "Valid: result denied"
        rationale: |
          This treats no rain as no wetness. The two parts of the rule may seem interchangeable. Check which part the second premise denies.
      - text: "Valid: condition confirmed"
        rationale: |
          This treats the absence of rain as rain occurring. The rule itself mentions rain positively. Check the actual second premise.
      - text: "Invalid: premise contradicted"
        rationale: |
          This rejects the statement that it did not rain. Outside weather knowledge can distract from structure. Check the inference with the given premises accepted.
    explanation: |
      The rule says rain makes the ground wet. Without rain, another cause could still make it wet. The conclusion of dry ground is not forced.
    approved: true

  - id: q-logical-verbal-reasoning-syllogisms-and-deductive-logic-0005
    type: syllogism
    difficulty: medium
    stem: |
      Treat the premises as given. If the alarm is working under these conditions, it will ring during a fire. It did not ring during the fire. Therefore, it was not working under these conditions. Which evaluation fits?
    choices:
      - text: "Valid: result denied"
        correct: true
      - text: "Invalid: another cause is possible"
        rationale: |
          This allows a working alarm not to ring despite the stated guarantee. Real devices can fail in many ways. Check the argument using its given conditional rule.
      - text: "Valid: condition confirmed"
        rationale: |
          This calls the evidence confirmation of a working alarm. The conclusion concerns the alarm's condition. Check whether the second premise confirms the condition or denies its result.
      - text: "Invalid: condition denied"
        rationale: |
          This calls the evidence denial of a working alarm. That denial is the conclusion, not the starting evidence. Check what the second premise actually states.
    explanation: |
      A working alarm must ring under the stated condition. It did not ring during the fire. It therefore was not working under that condition. This is modus tollens.
    approved: true

  - id: q-logical-verbal-reasoning-syllogisms-and-deductive-logic-0006
    type: syllogism
    difficulty: medium
    stem: |
      If a metal is heated, it expands. This metal bar was heated.
      What must be true?
    choices:
      - text: "This metal bar expanded."
        correct: true
      - text: "This metal bar did not expand."
        rationale: |
          This denies the result after the condition is confirmed. The two claims may be read as separate facts. Check the link stated by "if."
      - text: "This metal bar was not heated."
        rationale: |
          This denies the second premise. Questioning a real-world situation may seem cautious. Check the inference while accepting the supplied facts.
      - text: "All metals expand, whether heated or not."
        rationale: |
          This removes the condition from a conditional rule. The trait can seem to apply to the whole material group. Check the phrase about heating.
    explanation: |
      The rule guarantees expansion if the bar is heated. The second premise confirms that it was heated. The guaranteed result follows: the bar expanded.
    approved: true

  - id: q-logical-verbal-reasoning-syllogisms-and-deductive-logic-0007
    type: syllogism
    difficulty: hard
    stem: |
      All birds can fly. A penguin is a bird. Therefore, a penguin can fly.
      Is this syllogism valid? Is it sound?
    choices:
      - text: "Valid, unsound"
        correct: true
      - text: "Valid, sound"
        rationale: |
          This checks the pattern but overlooks the truth of the premises. A neat group-to-member chain looks convincing. Check factual truth when judging soundness.
      - text: "Invalid, unsound"
        rationale: |
          This lets a false premise make the structure invalid. The conclusion about flight is false. Check structure separately from factual truth.
      - text: "Invalid, sound"
        rationale: |
          This treats soundness as something independent of validity. The two labels may seem like separate checks. Check that a sound argument must first be valid.
    explanation: |
      If the two premises were true, the conclusion would follow: group membership carries the stated trait. That makes the form valid. The premise that all birds can fly is actually false, so the argument is unsound.
    approved: true

  - id: q-logical-verbal-reasoning-syllogisms-and-deductive-logic-0008
    type: syllogism
    difficulty: hard
    stem: |
      Evaluate only this two-premise argument: "All dogs are animals. All mammals are animals. Therefore, all dogs are mammals." The conclusion is true in the real world. Which description fits the argument?
    choices:
      - text: "Invalid, true conclusion"
        correct: true
      - text: "Valid, true conclusion"
        rationale: |
          This uses a true conclusion as proof of a valid inference. The familiar animal fact may seem sufficient. Check whether the quoted premises force the conclusion.
      - text: "Invalid, false conclusion"
        rationale: |
          This assumes an invalid argument must end in a false statement. Invalidity can sound like factual error. Check the supplied fact that the conclusion is true.
      - text: "Sound, true conclusion"
        rationale: |
          This calls a factually true conclusion enough for soundness. The biology may be familiar. Check that soundness also requires a valid inference.
    explanation: |
      The premises put dogs and mammals inside the larger animal group. They do not force the dog group to be inside the mammal group. The conclusion happens to be true, but the two-premise argument is invalid.
    approved: true

  - id: q-logical-verbal-reasoning-syllogisms-and-deductive-logic-0009
    type: syllogism
    difficulty: hard
    stem: |
      Given "If a card is valid, entry is allowed," which situation can obey that rule while showing that allowed entry does not guarantee a valid card?
    choices:
      - text: "Invalid card, entry allowed"
        correct: true
      - text: "Valid card, entry allowed"
        rationale: |
          This gives a case that fits both the rule and its reverse. A valid card does lead to allowed entry. Check whether the example actually disproves the reverse inference.
      - text: "Invalid card, entry forbidden"
        rationale: |
          This gives a case that does not show allowed entry without a valid card. It may seem relevant because the card is invalid. Check whether the result needed to test the reverse is present.
      - text: "Valid card, entry forbidden"
        rationale: |
          This breaks the original rule instead of showing why its reverse fails. The two conditions differ, which can look like a counterexample. Check that the example must keep the original rule true.
    explanation: |
      The rule allows entry whenever a card is valid. It can still allow an invalid card holder to enter by another route. That situation obeys the original rule while showing that allowed entry does not prove card validity.
    approved: true

  - id: q-logical-verbal-reasoning-syllogisms-and-deductive-logic-0010
    type: syllogism
    difficulty: hard
    stem: |
      An argument has been shown to be valid. What additional requirement must be checked before calling it sound?
    choices:
      - text: "Truth of all premises"
        correct: true
      - text: "Truth of the conclusion alone"
        rationale: |
          This checks only the outcome rather than the support. A true conclusion can seem convincing. Check every premise as well as the inference.
      - text: "Number of premises alone"
        rationale: |
          This treats having a familiar number of statements as proof of soundness. Many examples use two premises. Check their truth, not just their count.
      - text: "Popularity of the conclusion"
        rationale: |
          This substitutes agreement for truth. A popular statement can feel reliable. Check whether the premises are actually true.
    explanation: |
      A sound argument is valid and has true premises. Once validity is established, the truth of all its premises must also be checked.
    approved: true

  - id: q-logical-verbal-reasoning-syllogisms-and-deductive-logic-0011
    type: syllogism
    difficulty: medium
    stem: |
      All insects have six legs. A spider has eight legs.
      What must be true?
    choices:
      - text: "A spider is not an insect."
        correct: true
      - text: "A spider is an insect."
        rationale: |
          This assigns membership despite a missing required trait. Both spiders and insects may look like small crawling animals. Check the exact leg requirement given.
      - text: "All six-legged animals are spiders."
        rationale: |
          This changes a one-way category rule into a different universal claim. The shared topic of legs may hide the new group. Check which animals the premises actually connect.
      - text: "Spiders have six legs."
        rationale: |
          This replaces the spider's stated leg count with the insect trait. Group features can be copied to similar-looking animals. Check the second premise.
    explanation: |
      Under these premises, being an insect requires six legs. The spider has eight legs, so it cannot meet that requirement. It is not an insect.
    approved: true

  - id: q-logical-verbal-reasoning-syllogisms-and-deductive-logic-0012
    type: syllogism
    difficulty: medium
    stem: |
      The battery is either live or dead. If it is dead, the flashlight will not turn on. The flashlight did not turn on. Which added premise would make a deduction that the battery is dead valid?
    choices:
      - text: "A live battery always makes this flashlight turn on."
        correct: true
      - text: "A dead battery always keeps this flashlight from turning on."
        rationale: |
          This repeats the original one-way rule. A dead battery does explain failure. Check whether the added statement excludes failure with a live battery.
      - text: "The battery was charged at some point last week."
        rationale: |
          This treats an earlier charge as a complete rule about the present state. Charging may suggest that the battery once worked. Check whether the statement guarantees present operation.
      - text: "The flashlight has been used more than once this week."
        rationale: |
          This uses past use as proof of the current failure's cause. The flashlight has worked before. Check whether that fact rules out another fault now.
    explanation: |
      The added rule guarantees that a live battery makes the flashlight turn on. Since it did not turn on, the battery cannot be live. With the two stated battery states, it must be dead.
    approved: true

  - id: q-logical-verbal-reasoning-syllogisms-and-deductive-logic-0013
    type: syllogism
    difficulty: medium
    stem: |
      If a shape is a triangle, it has three sides. This shape does not have three sides.
      What must be true?
    choices:
      - text: "This shape is not a triangle."
        correct: true
      - text: "This shape is a triangle."
        rationale: |
          This gives membership despite a missing required trait. A shape can still look triangle-like. Check the side requirement rather than its appearance.
      - text: "This shape has exactly three sides."
        rationale: |
          This contradicts the second premise. The triangle rule may make three sides seem expected. Check the stated side count condition for this shape.
      - text: "Nothing can be concluded about this shape."
        rationale: |
          This overlooks a valid negative inference. The premises do not name the shape's actual type. Check whether they still rule one type out.
    explanation: |
      Every triangle must have three sides under the premise. This shape lacks that required trait. It is therefore not a triangle.
    approved: true

  - id: q-logical-verbal-reasoning-syllogisms-and-deductive-logic-0014
    type: syllogism
    difficulty: hard
    stem: |
      All licensed drivers have passed a driving test. Some permit holders have not passed that test. What must follow?
    choices:
      - text: "Some permit holders are not licensed drivers."
        correct: true
      - text: "All permit holders are licensed drivers."
        rationale: |
          This treats a permit as a license for everyone. The two documents can sound related. Check the stated permit holders who lack the required test.
      - text: "No permit holders are licensed drivers."
        rationale: |
          This expands a statement about some permit holders to all of them. A known unlicensed subgroup may seem to represent the whole group. Check the quantity word "some."
      - text: "Some licensed drivers have not passed the test."
        rationale: |
          This reverses the universal test requirement. Some permit holders lack the test, which may blur the groups. Check which group the all statement covers.
    explanation: |
      Every licensed driver must have passed the test. The stated permit holders who have not passed cannot be licensed drivers. At least some permit holders are therefore not licensed.
    approved: true

  - id: q-logical-verbal-reasoning-syllogisms-and-deductive-logic-0015
    type: syllogism
    difficulty: hard
    stem: |
      All fish live in water. No mammals are fish. This dolphin is a mammal. What must be true?
    choices:
      - text: "The dolphin is not a fish."
        correct: true
      - text: "The dolphin is a fish."
        rationale: |
          This overlooks the exclusion between mammals and fish. Living in water may make the two groups seem similar. Check the given no statement.
      - text: "Every mammal is a dolphin."
        rationale: |
          This reverses membership from one dolphin to all mammals. The named example may seem to represent its whole class. Check the direction and quantity of the premise.
      - text: "No fish live in water."
        rationale: |
          This negates the water trait of fish. The exclusion between mammals and fish may sound like a water exclusion. Check which two groups are actually separated.
    explanation: |
      The dolphin belongs to the mammal group. The premises keep mammals separate from fish. The dolphin is therefore not a fish.
    approved: true

  - id: q-logical-verbal-reasoning-syllogisms-and-deductive-logic-0016
    type: syllogism
    difficulty: exam
    stem: |
      Consider this argument: "All reptiles are cold-blooded. A snake is cold-blooded. Therefore, a snake is a reptile." Separately, consider: "All reptiles are cold-blooded. A snake is a reptile. Therefore, a snake is cold-blooded." Evaluate the validity of each argument.
    choices:
      - text: "First invalid, second valid"
        correct: true
      - text: "First valid, second valid"
        rationale: |
          This treats the shared vocabulary as enough for equal validity. Both arguments mention the same animal and trait. Check the direction of each inference.
      - text: "First invalid, second invalid"
        rationale: |
          This lets factual uncertainty prevent evaluation of both structures. The arguments concern real animals. Check validity assuming their premises are true.
      - text: "First valid, second invalid"
        rationale: |
          This reverses the two evaluations. Both group membership and traits appear in each argument. Check which one is a premise and which one is a conclusion.
    explanation: |
      The first argument moves from a trait back to a group that has the trait. That shared trait does not force membership, so the first inference is invalid. The second starts with group membership and applies its guaranteed trait, so it is valid.
    approved: true

  - id: q-logical-verbal-reasoning-syllogisms-and-deductive-logic-0017
    type: syllogism
    difficulty: hard
    stem: |
      If a parcel is scanned, its arrival is logged. If its arrival is logged, receipt is acknowledged. Which statement must follow?
    choices:
      - text: "A scanned parcel is acknowledged."
        correct: true
      - text: "Every acknowledged parcel was scanned."
        rationale: |
          This reverses the complete chain. Acknowledgment is the final result in the given rules. Check whether the rules also say it has only one source.
      - text: "A logged parcel must have been scanned."
        rationale: |
          This reverses the first link. Logging is a result of scanning. Check whether the rule says every logged parcel came from a scan.
      - text: "No scanned parcel is acknowledged."
        rationale: |
          This denies the end of the linked chain. The three steps may seem separate. Check how the first guarantee connects to the second.
    explanation: |
      Scanning guarantees logging. Logging guarantees acknowledgment. Following those two links makes acknowledgment a guaranteed result of scanning.
    approved: false

  - id: q-logical-verbal-reasoning-syllogisms-and-deductive-logic-0018
    type: syllogism
    difficulty: hard
    stem: |
      The original document is in the cabinet or the vault. It is not in the cabinet. What must be true?
    choices:
      - text: "The original is in the vault."
        correct: true
      - text: "The original is in both places."
        rationale: |
          This keeps an excluded location. The word "or" can allow both in other cases. Check the second premise that removes the cabinet.
      - text: "The original is in neither place."
        rationale: |
          This treats excluding one place as excluding both. One option is ruled out. Check the premise that guarantees at least one of the two places.
      - text: "The original was moved today."
        rationale: |
          This adds a movement event to a location argument. A missing cabinet document may suggest it was moved. Check whether any premise states when or how it arrived.
    explanation: |
      The premises give two possible places and exclude the cabinet. The remaining stated place is the vault, so the original is there.
    approved: false

  - id: q-logical-verbal-reasoning-syllogisms-and-deductive-logic-0019
    type: syllogism
    difficulty: exam
    stem: |
      All approved reports are signed. Some submitted reports are approved. What must follow?
    choices:
      - text: "Some submissions are signed."
        correct: true
      - text: "All submitted reports are signed."
        rationale: |
          This expands the stated subgroup to every submitted report. The all statement about approved reports may seem to cover the whole submitted group. Check which group "all" describes.
      - text: "All signed reports are submitted."
        rationale: |
          This reverses the signed-report relationship. Signed reports appear in the conclusion. Check whether the premises describe all signed reports or only approved ones.
      - text: "No submitted reports are signed."
        rationale: |
          This denies the overlap established by the approved subgroup. The category names differ. Check the reports that are both submitted and approved.
    explanation: |
      Every approved report is signed. Some submitted reports belong to the approved group. Those reports are signed, so at least some submitted reports are signed.
    approved: false

  - id: q-logical-verbal-reasoning-syllogisms-and-deductive-logic-0020
    type: syllogism
    difficulty: exam
    stem: |
      If the audit is approved, the notice is released. If the notice is released, its copy is registered. The copy is not registered. Which evaluation must hold?
    choices:
      - text: "Not approved, not released"
        correct: true
      - text: "Approved, not released"
        rationale: |
          This keeps approval after denying its guaranteed result. It may seem that only the last rule can be used backward. Check what approval requires under the first rule.
      - text: "Not approved, released"
        rationale: |
          This keeps release after its guaranteed registered copy is absent. The negative conclusion about approval may seem sufficient. Check the second conditional link too.
      - text: "Approval unknown, not released"
        rationale: |
          This stops after using the second rule. Release is ruled out, so that can feel like the end of the deduction. Check whether the first rule allows a further negative conclusion.
    explanation: |
      Approval guarantees release, and release guarantees a registered copy. No registered copy means there was no release. Since approval would have required release, approval is also absent.
    approved: false

