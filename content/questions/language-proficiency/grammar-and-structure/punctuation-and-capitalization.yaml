questions:
  - id: "q-grammar-and-structure-punctuation-and-capitalization-0001"
    type: "punctuation"
    difficulty: "easy"
    stem: |
      Identify and fix the error: "The concert was amazing, everyone stayed until the end."
    choices:
      - text: "Replace the comma with a semicolon."
        correct: true
      - text: "Keep the comma because the clauses concern the same concert."
        rationale: |
          This treats a shared topic as permission for a comma splice. The two statements are closely related. Check: test whether both sides are complete sentences.
      - text: "Move the comma to follow \"everyone\" and keep the rest."
        rationale: |
          This separates the second subject from its verb. Moving punctuation can seem like a repair. Check: keep each subject with its verb.
      - text: "Replace the comma with a colon after \"everyone\" instead."
        rationale: |
          This moves punctuation inside the second clause. A colon can join related material in some structures. Check: check that the first complete clause ends before the joining mark.
    explanation: |
      "The concert was amazing" and "everyone stayed until the end" are complete clauses. A semicolon can join these closely related statements.
    approved: true
  - id: "q-grammar-and-structure-punctuation-and-capitalization-0002"
    type: "punctuation"
    difficulty: "easy"
    stem: |
      Treat the company as one organization. Choose the possessive form: "The company announced ___ new product line yesterday."
    choices:
      - text: "Its"
        correct: true
      - text: "It's"
        rationale: |
          This uses a contraction where possession is needed. Apostrophes often mark possession in nouns. Check: expand the form as "it is" or "it has".
      - text: "Its'"
        rationale: |
          This adds a noun-style possessive apostrophe to "its". A plural noun can show possession with an ending apostrophe. Check: remember that this possessive form already needs no apostrophe.
      - text: "Their"
        rationale: |
          This uses a reference to individual members. A company consists of people. Check: follow the stem's one-organization reading.
    explanation: |
      The sentence needs a word showing possession (the product line belonging to the company), not a contraction: "its" (no apostrophe) is correct.
    approved: true
  - id: "q-grammar-and-structure-punctuation-and-capitalization-0003"
    type: "punctuation"
    difficulty: "medium"
    stem: |
      Choose the correctly punctuated sentence.
    choices:
      - text: "She loves reading; she visits the library every weekend."
        correct: true
      - text: "She loves reading; because she visits the library every weekend."
        rationale: |
          This joins a main clause to a dependent reason clause with a semicolon. Both groups contain subjects and verbs. Check: test each half as a complete sentence.
      - text: "She loves; reading and visiting the library every weekend."
        rationale: |
          This places the semicolon between a verb and its activities. The activities seem like a separate group. Check: check that each half can stand alone.
      - text: "She loves reading and; she visits the library every weekend."
        rationale: |
          This puts a semicolon after the coordinating connector. "And" and a semicolon both signal joining. Check: keep the connector with the clause it introduces.
    explanation: |
      Both halves can stand as complete sentences. The semicolon joins the closely related statements about her reading.
    approved: true
  - id: "q-grammar-and-structure-punctuation-and-capitalization-0004"
    type: "punctuation"
    difficulty: "medium"
    stem: |
      Follow the common convention that capitalizes a formal title directly before a name. Which sentence is correctly capitalized?
    choices:
      - text: "We met President Reyes yesterday."
        correct: true
      - text: "We met president Reyes yesterday at the company office."
        rationale: |
          This leaves a formal title before a name lowercase. Job descriptions are often lowercase. Check: apply the specified before-name convention.
      - text: "We met President reyes yesterday at the company office."
        rationale: |
          This leaves a surname lowercase. The title already starts with a capital. Check: check the proper name itself.
      - text: "We Met President Reyes yesterday at the company office."
        rationale: |
          This capitalizes an ordinary verb inside the sentence. The meeting may feel important. Check: capitalize by the stated rules, not emphasis.
    explanation: |
      Under the stated convention, "President" is capitalized as a formal title directly before "Reyes." The surname is a proper name.
    approved: true
  - id: "q-grammar-and-structure-punctuation-and-capitalization-0005"
    type: "punctuation"
    difficulty: "medium"
    stem: |
      Choose the correctly punctuated sentence.
    choices:
      - text: "I bought apples, bananas, and oranges."
        correct: true
      - text: "I bought apples bananas and oranges."
        rationale: |
          This omits separators between the first list items. The final "and" still shows a list. Check: identify each item and its boundary.
      - text: "I bought, apples, bananas, and oranges."
        rationale: |
          This separates the verb from its object. Several list commas make an extra comma seem harmless. Check: keep "bought" with the item being bought.
      - text: "I bought apples, bananas and, oranges."
        rationale: |
          This places the serial comma after "and". The comma is close to the final item. Check: put the separator before the joining word.
    explanation: |
      Commas separate "apples," "bananas," and "oranges." This version also uses a serial comma before "and," which is accepted in edited English.
    approved: true
  - id: "q-grammar-and-structure-punctuation-and-capitalization-0006"
    type: "punctuation"
    difficulty: "medium"
    stem: |
      Choose the correctly punctuated sentence.
    choices:
      - text: "She studied hard, and she passed the exam."
        correct: true
      - text: "She studied hard and, she passed the exam."
        rationale: |
          This places the clause-boundary comma after the connector. "And" marks the joining point. Check: put the comma before the coordinating conjunction.
      - text: "She studied hard and she, passed the exam."
        rationale: |
          This separates the second subject from its verb. The comma is near the second clause. Check: keep "she passed" together.
      - text: "She studied, hard and she passed the exam."
        rationale: |
          This separates a verb from its manner word. "Hard" sounds like a short pause point. Check: identify the boundary between complete clauses.
    explanation: |
      A comma correctly comes before the coordinating conjunction "and" when it joins two independent clauses.
    approved: true
  - id: "q-grammar-and-structure-punctuation-and-capitalization-0007"
    type: "punctuation"
    difficulty: "medium"
    stem: |
      Choose the correctly punctuated sentence.
    choices:
      - text: "After the meeting, we went home."
        correct: true
      - text: "After the meeting we, went home."
        rationale: |
          This separates the subject from its verb. The comma appears near the end of the introduction. Check: keep "we went" together.
      - text: "After, the meeting we went home."
        rationale: |
          This separates the preposition from its noun phrase. "After" signals the opening introduction. Check: include the whole introductory phrase before the comma.
      - text: "After the meeting we went, home."
        rationale: |
          This separates the movement verb from its destination. A pause may seem natural before "home". Check: find where the introductory phrase actually ends.
    explanation: |
      "After the meeting" is the introductory phrase. The comma follows that whole group before the main clause "we went home."
    approved: true
  - id: "q-grammar-and-structure-punctuation-and-capitalization-0008"
    type: "punctuation"
    difficulty: "medium"
    stem: |
      A writer has only one brother. Choose the correctly punctuated sentence.
    choices:
      - text: "My brother, who lives in Cebu, is visiting this week."
        correct: true
      - text: "My brother who lives in Cebu is visiting this week."
        rationale: |
          This treats extra information as identifying information. Relative clauses can identify which person is meant. Check: use the stated fact that there is only one brother.
      - text: "My brother, who lives in Cebu is, visiting this week."
        rationale: |
          This closes the extra-information group after the main verb. Both commas are present. Check: bracket exactly "who lives in Cebu".
      - text: "My brother who, lives in Cebu, is visiting this week."
        rationale: |
          This separates the relative word from its verb. The two commas look balanced. Check: include "who" inside the whole extra-information clause.
    explanation: |
      Because the context establishes that the writer has only one brother, "who lives in Cebu" is nonrestrictive information. A nonrestrictive relative clause is set off with commas.
    approved: true
  - id: "q-grammar-and-structure-punctuation-and-capitalization-0009"
    type: "punctuation"
    difficulty: "medium"
    stem: |
      Which sentence uses semicolons to separate complete city-country pairs, keeping commas inside each pair?
    choices:
      - text: "We visited Manila, Philippines; Tokyo, Japan; and Seoul, Korea."
        correct: true
      - text: "We visited Manila, Philippines, Tokyo, Japan, and Seoul, Korea."
        rationale: |
          This uses one mark for both internal and outer boundaries. Commas are common list separators. Check: group each city with its country first.
      - text: "We visited Manila; Philippines, Tokyo; Japan, and Seoul; Korea."
        rationale: |
          This splits city-country pairs with semicolons. The mark is useful somewhere in this complex list. Check: place it between complete location pairs.
      - text: "We visited Manila Philippines; Tokyo Japan; and Seoul Korea."
        rationale: |
          This removes the internal city-country separators. Semicolons still separate the three larger items. Check: keep the commas inside each location pair.
    explanation: |
      Semicolons correctly separate the list items here, since each item ("Manila, Philippines," "Tokyo, Japan," "Seoul, Korea") already contains a comma.
    approved: true
  - id: "q-grammar-and-structure-punctuation-and-capitalization-0010"
    type: "punctuation"
    difficulty: "medium"
    stem: |
      Choose the sentence that correctly shows possession.
    choices:
      - text: "Maria's book was left on the table."
        correct: true
      - text: "Marias book was left on the table."
        rationale: |
          This leaves the owner name without a possessive apostrophe. The name still appears next to the book. Check: check how a singular name shows ownership.
      - text: "Marias' book was left on the table."
        rationale: |
          This places the apostrophe after an added s as if the name were plural. Plural possessives can use that pattern. Check: start with the singular name "Maria".
      - text: "Maria's' book was left on the table."
        rationale: |
          This adds an extra apostrophe to an already complete possessive form. Both sides of the s seem related to possession. Check: use one apostrophe before the added s.
    explanation: |
      An apostrophe followed by "s" ("Maria's") correctly shows that the book belongs to Maria.
    approved: true
  - id: "q-grammar-and-structure-punctuation-and-capitalization-0011"
    type: "punctuation"
    difficulty: "medium"
    stem: |
      Choose the sentence with the correctly punctuated contraction.
    choices:
      - text: "I don't want to go outside today."
        correct: true
      - text: "I dont want to go outside today."
        rationale: |
          This omits the contraction apostrophe. The shortened form sounds the same when spoken. Check: locate the missing letter from "do not".
      - text: "I do'nt want to go outside today."
        rationale: |
          This puts the apostrophe before the wrong letter. The mark is still inside the contraction. Check: compare the spelling with "do not".
      - text: "I don't' want to go outside today."
        rationale: |
          This adds a second apostrophe after the contraction. The ending might look like a possessive form. Check: use only the mark for the missing letter.
    explanation: |
      The apostrophe in "don't" correctly marks the omitted letter from "do not."
    approved: true
  - id: "q-grammar-and-structure-punctuation-and-capitalization-0012"
    type: "punctuation"
    difficulty: "medium"
    stem: |
      Choose the correctly capitalized sentence.
    choices:
      - text: "We visited Manila last summer."
        correct: true
      - text: "We visited manila last summer."
        rationale: |
          This leaves a specific city name lowercase. The opening word is capitalized correctly. Check: identify every proper name.
      - text: "we visited Manila last summer."
        rationale: |
          This leaves the sentence opening lowercase. The city name is capitalized correctly. Check: check the first word as well as names.
      - text: "We Visited manila last summer."
        rationale: |
          This capitalizes an ordinary verb and leaves the city name lowercase. Capital letters may seem to emphasize important words. Check: capitalize names and sentence openings by rule.
    explanation: |
      "Manila" is a proper noun (a specific place name) and must be capitalized; the sentence's first word must also be capitalized.
    approved: true
  - id: "q-grammar-and-structure-punctuation-and-capitalization-0013"
    type: "punctuation"
    difficulty: "medium"
    stem: |
      Choose the correctly capitalized sentence.
    choices:
      - text: "She said, \"Please close the door.\""
        correct: true
      - text: "She said, \"please close the door.\""
        rationale: |
          This leaves the opening of a quoted full sentence lowercase. Embedded quoted fragments can start lowercase. Check: ask whether the quote is a complete sentence.
      - text: "she said, \"Please close the door.\""
        rationale: |
          This leaves the outer sentence opening lowercase. The quoted sentence begins correctly. Check: check both sentence openings.
      - text: "She said, \"Please Close The Door.\""
        rationale: |
          This uses title-style capitals throughout a spoken sentence. Quotation marks make the words look like a special title. Check: capitalize ordinary speech as a sentence.
    explanation: |
      "She" begins the outer sentence. The quoted words form a complete sentence, so "Please" begins with a capital letter too.
    approved: true
  - id: "q-grammar-and-structure-punctuation-and-capitalization-0014"
    type: "punctuation"
    difficulty: "hard"
    stem: |
      Only students who missed the test must report. Which sentence preserves that meaning with standard punctuation?
    choices:
      - text: "The students who missed the test must report today."
        correct: true
      - text: "The students, who missed the test, must report today."
        rationale: |
          This makes the identifying clause extra information. Paired commas often surround relative clauses. Check: ask whether the clause identifies only part of the group.
      - text: "The students who, missed the test, must report today."
        rationale: |
          This separates "who" from its verb. Two commas make the extra group look balanced. Check: keep the entire identifying clause together.
      - text: "The students who missed the test, must report today."
        rationale: |
          This separates the full subject from the main verb. A pause after a long subject can sound natural. Check: check whether the comma marks extra information or splits the clause.
    explanation: |
      "Who missed the test" identifies the students who must report. This restrictive clause stays with the noun without paired commas.
    approved: true
  - id: "q-grammar-and-structure-punctuation-and-capitalization-0015"
    type: "punctuation"
    difficulty: "hard"
    stem: |
      In "It's been raining since dawn," what does "it's" mean?
    choices:
      - text: "It has"
        correct: true
      - text: "It is"
        rationale: |
          This chooses the other common expansion of "it's". The contraction can mean "it is" in other sentences. Check: try the expansion before "been".
      - text: "Its own"
        rationale: |
          This treats the contraction as a possessive expression. The spellings "its" and "it's" are similar. Check: expand the omitted letters.
      - text: "It was"
        rationale: |
          This treats the past meaning as a past-tense contraction. The sentence describes a period that began earlier. Check: check which letters the apostrophe replaces.
    explanation: |
      In "It's been raining," the contraction expands to "It has been raining." "Has" supplies the helping verb before "been."
    approved: true
  - id: "q-grammar-and-structure-punctuation-and-capitalization-0016"
    type: "punctuation"
    difficulty: "hard"
    stem: |
      Why is the semicolon faulty in "The machine runs smoothly; after regular servicing"?
    choices:
      - text: "The words after it do not form an independent clause."
        correct: true
      - text: "A semicolon cannot join closely related ideas in one sentence."
        rationale: |
          This rejects the normal joining use of a semicolon. The example contains a punctuation error. Check: test the structure of each half.
      - text: "A semicolon is required only when the sentence lists locations."
        rationale: |
          This limits semicolons to complex lists. Semicolons can separate list items. Check: remember their separate clause-joining use.
      - text: "The phrase after it contains too many words for a semicolon."
        rationale: |
          This treats word count as the rule. A long group can resemble a clause. Check: look for a subject and a finite verb instead.
    explanation: |
      "After regular servicing" is a phrase. A semicolon in this joining use needs an independent clause on each side.
    approved: true
  - id: "q-grammar-and-structure-punctuation-and-capitalization-0017"
    type: "punctuation"
    difficulty: "hard"
    stem: |
      Use a style that lowercases generic job descriptions and capitalizes sentence beginnings. Which sentence follows it?
    choices:
      - text: "We met the president yesterday."
        correct: true
      - text: "We met the President yesterday during the afternoon visit."
        rationale: |
          This capitalizes a generic job description. Some institutional styles allow that capitalization. Check: follow the convention expressly stated in this question.
      - text: "We Met the president yesterday during the afternoon visit."
        rationale: |
          This capitalizes an ordinary verb. The meeting may seem important. Check: capitalize sentence openings and names, not important actions.
      - text: "we met the president yesterday during the afternoon visit."
        rationale: |
          This leaves the sentence opening lowercase. The generic title is correctly lowercase. Check: check the first word as well.
    explanation: |
      The stated style uses lowercase for a generic job description. "We" starts the sentence, so it begins with a capital letter.
    approved: true
  - id: "q-grammar-and-structure-punctuation-and-capitalization-0018"
    type: "punctuation"
    difficulty: "medium"
    stem: |
      The quoted word is an ordinary lowercase word, not a title. Which sentence is correctly capitalized?
    choices:
      - text: "The word \"meeting\" appears twice."
        correct: true
      - text: "The word \"Meeting\" appears twice in the short announcement."
        rationale: |
          This treats an embedded quoted word as a new sentence. The quotation marks suggest a fresh beginning. Check: ask whether the quoted material is a sentence or a word.
      - text: "The Word \"meeting\" appears twice in the short announcement."
        rationale: |
          This capitalizes a common noun inside the sentence. The word is being discussed as a label. Check: reserve capitals for sentence openings and proper names.
      - text: "the word \"meeting\" appears twice in the short announcement."
        rationale: |
          This leaves the sentence opening lowercase. The quoted fragment is lowercase correctly. Check: check the outer sentence opening.
    explanation: |
      The quoted word "meeting" is an embedded fragment, so it stays lowercase. "The" begins the surrounding sentence and is capitalized.
    approved: true
  - id: "q-grammar-and-structure-punctuation-and-capitalization-0019"
    type: "punctuation"
    difficulty: "medium"
    stem: |
      Which sentence uses a semicolon correctly?
    choices:
      - text: "The train was late; the passengers remained calm."
        correct: true
      - text: "The train was late, the passengers remained calm."
        rationale: |
          This joins two independent clauses with only a comma. The statements are closely related. Check: a comma alone does not correctly join two complete clauses in formal writing.
      - text: "The train was late; because the passengers remained calm."
        rationale: |
          This puts a dependent clause after the semicolon. The words after "because" contain a subject and a verb. Check: test whether the whole second half can stand alone.
      - text: "The train was; late and the passengers remained calm."
        rationale: |
          This splits the first clause before "late". A semicolon can join complete clauses. Check: test whether each half can stand alone.
    explanation: |
      Both statements are independent clauses. A semicolon can join these closely related statements without a joining word.
    approved: true
  - id: "q-grammar-and-structure-punctuation-and-capitalization-0020"
    type: "punctuation"
    difficulty: "exam"
    stem: |
      Use the common convention that capitalizes a formal title directly before a name. Which revision fixes every error in "the report was ready, it's final section needed president Cruz's approval"?
    choices:
      - text: "The report was ready; its final section needed President Cruz's approval."
        correct: true
      - text: "The report was ready, its final section needed President Cruz's approval."
        rationale: |
          This leaves a comma splice between two complete clauses. The statements are closely related. Check: use a semicolon, a period, or a comma with a suitable joining word.
      - text: "The report was ready; it's final section needed President Cruz's approval."
        rationale: |
          This uses a contraction in the possessive position. Apostrophes often signal ownership in nouns. Check: expand "it's" as "it is" or "it has".
      - text: "The report was ready; its final section needed president Cruz's approval."
        rationale: |
          This leaves the formal title before a name lowercase. Generic job labels usually stay lowercase. Check: apply the specified before-name title convention.
    explanation: |
      Start the sentence with "The." Join the two complete clauses with a semicolon. "Its" shows that the section belongs to the report. Capitalize the formal title before "Cruz," and use "Cruz's" to show whose approval is needed.
    approved: true
