meta:
  subject: language-proficiency
  topic: grammar-and-structure
  subtopic: subject-verb-agreement
  exams: [ upcat, acet, dlsucet, ustet, dost-sei , cse-pro, cse-sub]
questions:
  - id: q-grammar-and-structure-subject-verb-agreement-0001
    type: subject-verb-agreement
    difficulty: easy
    stem: |
      Choose the correct verb: The dog ______ every morning at the mail carrier.
    choices:
      - text: Barks
        correct: true
      - text: Bark
        rationale: |
          The singular third-person subject "dog" takes "barks" in the simple present.
      - text: Barking
        rationale: |
          "Barking" cannot serve as the finite main verb here without an auxiliary.
      - text: Barked
        rationale: |
          The sentence describes a present routine with "every morning."
    explanation: |
      The singular subject "dog" takes the singular simple-present form "barks."
    approved: true

  - id: q-grammar-and-structure-subject-verb-agreement-0002
    type: subject-verb-agreement
    difficulty: easy
    stem: |
      Choose the correct verb: The dogs ______ every morning at the mail carrier.
    choices:
      - text: Bark
        correct: true
      - text: Barks
        rationale: |
          The plural subject "dogs" takes the base-form simple-present verb "bark."
      - text: Is barking
        rationale: |
          "Is" does not agree with plural "dogs."
      - text: Has barked
        rationale: |
          "Has" does not agree with plural "dogs."
    explanation: |
      The plural subject "dogs" takes "bark."
    approved: true

  - id: q-grammar-and-structure-subject-verb-agreement-0003
    type: subject-verb-agreement
    difficulty: medium
    stem: |
      Choose the correct verb: The list of items on the shelf ______ long.
    choices:
      - text: Is
        correct: true
      - text: Are
        rationale: |
          "Items" is inside a prepositional phrase; the head subject is singular "list."
      - text: Were
        rationale: |
          This is plural and past tense, while the subject and context call for singular present agreement.
      - text: Have been
        rationale: |
          "Have" does not agree with the singular head subject "list."
    explanation: |
      The head of the subject phrase is "list," not "items," so the verb is singular: "is."
    approved: true

  - id: q-grammar-and-structure-subject-verb-agreement-0004
    type: subject-verb-agreement
    difficulty: medium
    stem: |
      Choose the correct verb: The box of chocolates ______ still sitting on the table.
    choices:
      - text: Is
        correct: true
      - text: Are
        rationale: |
          The head subject is singular "box"; "chocolates" is the object of "of."
      - text: Were
        rationale: |
          The plural past form does not agree with singular "box" in this context.
      - text: Have been
        rationale: |
          "Have" does not agree with the singular head subject.
    explanation: |
      The subject is "box," so the correct form is "is."
    approved: true

  - id: q-grammar-and-structure-subject-verb-agreement-0005
    type: subject-verb-agreement
    difficulty: medium
    stem: |
      In standard American English, treating the committee as one unit, choose the correct verb: The committee ______ reached a decision.
    choices:
      - text: Has
        correct: true
      - text: Have
        rationale: |
          In standard American English, a collective noun construed as one unit normally takes singular agreement.
      - text: Were
        rationale: |
          This is plural agreement and does not fit the unit reading specified in the stem.
      - text: Are
        rationale: |
          This is plural agreement and also does not fit the perfect construction "___ reached."
    explanation: |
      Under the unit reading specified here, standard American English uses singular "has." Other English varieties and contexts can use plural agreement when the members are emphasized individually.
    approved: true

  - id: q-grammar-and-structure-subject-verb-agreement-0006
    type: subject-verb-agreement
    difficulty: medium
    stem: |
      In standard American English, treating the family as one unit making a shared plan, choose the correct verb: The family ______ planning a trip to the province this summer.
    choices:
      - text: Is
        correct: true
      - text: Are
        rationale: |
          The stem explicitly asks for the standard American unit reading, which takes singular agreement.
      - text: Were
        rationale: |
          This is plural past agreement and does not fit the stated reading or timeframe.
      - text: Have
        rationale: |
          "Have planning" is not the required progressive construction, and plural agreement does not fit the specified unit reading.
    explanation: |
      With "family" treated as one unit, standard American English uses "is planning." Plural agreement can occur in other varieties or when individual members are foregrounded.
    approved: true

  - id: q-grammar-and-structure-subject-verb-agreement-0007
    type: subject-verb-agreement
    difficulty: medium
    stem: |
      Choose the correct verb: Everybody in the auditorium ______ welcome to ask questions afterward.
    choices:
      - text: Is
        correct: true
      - text: Are
        rationale: |
          "Everybody" is grammatically singular for verb agreement in standard English.
      - text: Were
        rationale: |
          This is plural past agreement.
      - text: Have been
        rationale: |
          "Have" is plural; the subject requires singular agreement.
    explanation: |
      "Everybody" takes singular verb agreement, so "is" is correct.
    approved: true

  - id: q-grammar-and-structure-subject-verb-agreement-0008
    type: subject-verb-agreement
    difficulty: medium
    stem: |
      Choose the correct verb: Nothing about the missing files ______ to make sense.
    choices:
      - text: Seems
        correct: true
      - text: Seem
        rationale: |
          "Nothing" is grammatically singular for verb agreement.
      - text: Were seeming
        rationale: |
          This is plural and also an unnatural tense choice here.
      - text: Have seemed
        rationale: |
          "Have" does not agree with singular "nothing."
    explanation: |
      The subject "nothing" is singular, so the correct form is "seems."
    approved: true

  - id: q-grammar-and-structure-subject-verb-agreement-0009
    type: subject-verb-agreement
    difficulty: medium
    stem: |
      Choose the correct verb: Most of the water in the tank ______ evaporated.
    choices:
      - text: Has
        correct: true
      - text: Have
        rationale: |
          With "most of," agreement follows the noun in the of-phrase; "water" is a mass noun taking singular agreement here.
      - text: Were
        rationale: |
          This does not fit the singular mass-noun subject or the perfect construction.
      - text: Are
        rationale: |
          This is plural present agreement and does not fit the construction.
    explanation: |
      "Most of the water" takes singular agreement here, giving "has evaporated."
    approved: true

  - id: q-grammar-and-structure-subject-verb-agreement-0010
    type: subject-verb-agreement
    difficulty: medium
    stem: |
      Choose the correct verb: Some of the cookies on the tray ______ already gone.
    choices:
      - text: Are
        correct: true
      - text: Is
        rationale: |
          "Some of" takes its number from the noun that follows; "cookies" is plural.
      - text: Was
        rationale: |
          This is singular past agreement.
      - text: Has been
        rationale: |
          "Has" does not agree with plural "cookies."
    explanation: |
      Because "cookies" is plural, "some of the cookies" takes plural "are."
    approved: true

  - id: q-grammar-and-structure-subject-verb-agreement-0011
    type: subject-verb-agreement
    difficulty: medium
    stem: |
      Choose the correct verb: Ana and Ben ______ already here, waiting by the entrance.
    choices:
      - text: Are
        correct: true
      - text: Is
        rationale: |
          Two distinct subjects joined by "and" form a plural subject here.
      - text: Was
        rationale: |
          This is singular past agreement.
      - text: Has been
        rationale: |
          "Has" is singular and does not agree with "Ana and Ben."
    explanation: |
      "Ana and Ben" is plural, so "are" is correct.
    approved: true

  - id: q-grammar-and-structure-subject-verb-agreement-0012
    type: subject-verb-agreement
    difficulty: medium
    stem: |
      Under the standard formal proximity convention for "neither...nor," choose the correct verb: Neither the manager nor the employees ______ aware of the change.
    choices:
      - text: Were
        correct: true
      - text: Was
        rationale: |
          Under the stated convention, agreement follows the nearer subject "employees," which is plural.
      - text: Is
        rationale: |
          The nearer subject is plural and the sentence is framed in the past.
      - text: Has been
        rationale: |
          Singular "has" does not agree with the nearer plural subject.
    explanation: |
      In the formal proximity convention tested here, the verb agrees with the nearer subject: plural "employees" gives "were."
    approved: true

  - id: q-grammar-and-structure-subject-verb-agreement-0013
    type: subject-verb-agreement
    difficulty: medium
    stem: |
      Under the standard formal proximity convention for "neither...nor," choose the correct verb: Neither the students nor the teacher ______ late for the assembly.
    choices:
      - text: Was
        correct: true
      - text: Were
        rationale: |
          The nearer subject is singular "teacher."
      - text: Are
        rationale: |
          This is plural present agreement and does not match the nearer subject or timeframe.
      - text: Have been
        rationale: |
          "Have" is plural and does not agree with the nearer subject.
    explanation: |
      Under the convention stated in the stem, singular "teacher" controls agreement, giving "was."
    approved: true

  - id: q-grammar-and-structure-subject-verb-agreement-0014
    type: subject-verb-agreement
    difficulty: hard
    stem: |
      A student sees "The box of chocolates ___ on the table" and chooses "are" because "chocolates" is the noun nearest the blank. Is that reasoning correct?
    choices:
      - text: 'No: the head subject is "box" (singular), so the standard form is "is."'
        correct: true
      - text: 'Yes: the nearest noun always controls agreement.'
        rationale: |
          Agreement generally follows the grammatical subject, not simply the nearest noun.
      - text: 'Yes: "chocolates" is the head subject.'
        rationale: |
          "Chocolates" is inside the prepositional phrase "of chocolates."
      - text: 'No: because both "box" and "chocolates" are plural.'
        rationale: |
          "Box" is singular.
    explanation: |
      The prepositional phrase does not change the singular head subject "box," so "is" is correct.
    approved: true

  - id: q-grammar-and-structure-subject-verb-agreement-0015
    type: subject-verb-agreement
    difficulty: hard
    stem: |
      In standard American English, the sentence treats "team" as one unit celebrating together: "The team ___ celebrating its victory." Which verb best fits that stated reading?
    choices:
      - text: Is
        correct: true
      - text: Are
        rationale: |
          Plural agreement can occur in other varieties or with an individual-members reading, but the stem explicitly specifies the American-English unit reading.
      - text: Were
        rationale: |
          This is plural past agreement and does not fit the stated reading.
      - text: Have
        rationale: |
          This does not form the required progressive verb phrase.
    explanation: |
      With the collective noun construed as a single unit, standard American English uses "the team is celebrating." This is a register/context rule, not a universal ban on plural collective-noun agreement.
    approved: true

  - id: q-grammar-and-structure-subject-verb-agreement-0016
    type: subject-verb-agreement
    difficulty: hard
    stem: |
      A student writes "Everybody have their own opinion." Which part needs correction in standard English?
    choices:
      - text: '"Have" should be "has" because "everybody" takes singular verb agreement; singular "their" can remain.'
        correct: true
      - text: '"Their" must always be changed to "his or her."'
        rationale: |
          Generic singular "their" is accepted in modern standard English; the verb agreement is the actual error.
      - text: 'No correction is needed because "everybody" takes a plural verb.'
        rationale: |
          "Everybody" takes singular verb agreement.
      - text: '"Everybody" is not a pronoun and cannot be a subject.'
        rationale: |
          "Everybody" is an indefinite pronoun and can serve as a subject.
    explanation: |
      The correct sentence is "Everybody has their own opinion." The singular verb agrees with "everybody," while singular "their" is acceptable.
    approved: true

  - id: q-grammar-and-structure-subject-verb-agreement-0017
    type: subject-verb-agreement
    difficulty: hard
    stem: |
      Under the standard formal proximity convention, is "Neither the students nor the teacher were late" the preferred agreement for this test item?
    choices:
      - text: 'No: the nearer subject "teacher" is singular, so the item expects "was."'
        correct: true
      - text: 'Yes: the first subject always controls agreement.'
        rationale: |
          The convention being tested uses the nearer subject.
      - text: 'Yes: the two subjects are added together as if joined by "and."'
        rationale: |
          "Neither...nor" does not create the same agreement pattern as a simple "and" compound subject.
      - text: 'No: "neither...nor" constructions never require agreement.'
        rationale: |
          They still require a finite verb with an agreement choice.
    explanation: |
      Under the stated test convention, the nearer singular subject gives "Neither the students nor the teacher was late."
    approved: true

  - id: q-grammar-and-structure-subject-verb-agreement-0018
    type: subject-verb-agreement
    difficulty: medium
    stem: |
      Piliin ang tamang pananda: Kumain ______ bata ng tinapay.
    choices:
      - text: Ang
        correct: true
      - text: Ng
        rationale: |
          Sa pangungusap na ito, ang tagaganap na "bata" ang minamarkahan ng "ang."
      - text: Sa
        rationale: |
          Hindi lokasyon o direksiyon ang tungkulin ng puwang.
      - text: Na
        rationale: |
          Hindi pang-angkop ang kailangan bago ang "bata."
    explanation: |
      Sa aktor-pokus na "Kumain ang bata ng tinapay," ang tagaganap ay minamarkahan ng "ang."
    approved: true

  - id: q-grammar-and-structure-subject-verb-agreement-0019
    type: subject-verb-agreement
    difficulty: medium
    stem: |
      Piliin ang tamang pananda: Kinain ______ bata ang tinapay.
    choices:
      - text: Ng
        correct: true
      - text: Ang
        rationale: |
          Sa pokus-sa-bagay na pangungusap, "ang tinapay" ang minamarkahang paksa at "ng bata" ang tagaganap.
      - text: Sa
        rationale: |
          Hindi lokasyon o direksiyon ang tungkulin ng puwang.
      - text: Na
        rationale: |
          Hindi pang-angkop ang kailangan.
    explanation: |
      Sa "Kinain ng bata ang tinapay," ang bagay ang minamarkahan ng "ang," samantalang ang tagaganap ay minamarkahan ng "ng."
    approved: true

  - id: q-grammar-and-structure-subject-verb-agreement-0020
    type: subject-verb-agreement
    difficulty: exam
    stem: |
      Under standard American English and the formal proximity convention, choose the correct verbs: Neither the coach nor the players on the visiting team ______ satisfied with the referee's decision, even though most of the crowd ______ supportive of it as a single group.
    choices:
      - text: Were, was
        correct: true
      - text: Was, were
        rationale: |
          The first blank follows nearer plural "players"; the second treats singular collective "crowd" as one group under the stated American-English reading.
      - text: Were, were
        rationale: |
          The first is correct, but the second conflicts with the explicitly specified unit reading of "crowd."
      - text: Was, was
        rationale: |
          The second is correct under the stated reading, but the nearer subject "players" is plural in the first clause.
    explanation: |
      The proximity convention gives plural "were" from nearer "players." For the second clause, the stem explicitly specifies the standard American-English unit reading of "crowd," giving singular "was."
    approved: true
