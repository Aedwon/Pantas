meta:
  subject: language-proficiency
  topic: grammar-and-structure
  subtopic: modifiers
  exams: [ upcat, acet, dlsucet, ustet, dost-sei , cse-pro, cse-sub]
questions:
  - id: q-grammar-and-structure-modifiers-0001
    type: modifier-placement
    difficulty: easy
    stem: |
      Identify and fix the error: "The waiter served the pasta to the customer covered in cheese."
    choices:
      - text: Covered in cheese is misplaced, making it sound like the customer is covered in cheese; it should read "The waiter served the customer the pasta covered in cheese."
        correct: true
      - text: There is no error in this sentence.
        rationale: |
          You accepted the surface attachment, but "covered in cheese" sits next to "customer" even though the intended referent is the pasta.
      - text: Served should be changed to serves.
        rationale: |
          You focused on verb tense, but "served" is a valid past-tense verb. The problem is modifier attachment.
      - text: The sentence needs a comma after "pasta."
        rationale: |
          You focused on punctuation, but adding a comma does not place the descriptive phrase next to the intended noun.
    explanation: |
      As written, "covered in cheese" is positioned next to "customer," so the sentence invites that attachment. Moving the phrase next to "pasta" makes the intended meaning clear.
    approved: true

  - id: q-grammar-and-structure-modifiers-0002
    type: modifier-placement
    difficulty: medium
    stem: |
      Identify and fix the error: "After finishing the marathon, a warm bath felt amazing."
    choices:
      - text: 'This is a dangling modifier: "after finishing the marathon" has no logical subject, since a bath cannot finish a marathon; it should read "After finishing the marathon, she felt that a warm bath was amazing."'
        correct: true
      - text: There is no error in this sentence.
        rationale: |
          You accepted the sentence, but the subject following the introductory phrase is "a warm bath," which cannot finish a marathon.
      - text: Amazing should be changed to amazed.
        rationale: |
          You changed the adjective, but "amazing" can correctly describe the bath. The missing logical subject is the problem.
      - text: The sentence needs a semicolon instead of a comma.
        rationale: |
          You changed punctuation without supplying a person who could perform the introductory action.
    explanation: |
      The introductory phrase needs a logical subject who finished the marathon. Because the following subject is "a warm bath," the modifier dangles.
    approved: true

  - id: q-grammar-and-structure-modifiers-0003
    type: modifier-placement
    difficulty: medium
    stem: |
      Choose the sentence with no misplaced or dangling modifier.
    choices:
      - text: Driving through the mountains, the tourists were amazed by the scenery.
        correct: true
      - text: Driving through the mountains, the scenery amazed the tourists.
        rationale: |
          You chose a sentence whose introductory phrase grammatically points to "the scenery," even though scenery cannot drive.
      - text: Both sentences are correctly modified.
        rationale: |
          You accepted the version that makes scenery the target of "driving through the mountains."
      - text: Neither sentence is correctly modified.
        rationale: |
          You rejected the sentence where the following subject, "the tourists," can logically perform the driving.
    explanation: |
      The introductory phrase correctly modifies "the tourists" in the first sentence. In the second, it dangles because the following subject is "the scenery."
    approved: true

  - id: q-grammar-and-structure-modifiers-0004
    type: modifier-placement
    difficulty: medium
    stem: |
      Explain the difference in meaning between "Only she gave him the answer" and "She gave only him the answer."
    choices:
      - text: In the first, "only" limits the subject (she alone gave it); in the second, it limits the recipient (he alone received it).
        correct: true
      - text: Both sentences necessarily mean exactly the same thing.
        rationale: |
          You ignored the explicit focus created by placing "only" directly before the subject in one sentence and directly before the recipient in the other.
      - text: The first sentence is grammatically incorrect.
        rationale: |
          Front-position "only" can validly focus the subject, as in "Only Jason knows where the key is kept."
      - text: >-
          "Only" has no effect on meaning in either sentence.
        rationale: |
          "Only" is a focusing adverb; changing its focus can change what is being limited.
    explanation: |
      These placements create clear contrasting focus: "Only she" restricts the giver, while "only him" restricts the recipient.
    approved: true

  - id: q-grammar-and-structure-modifiers-0005
    type: modifier-placement
    difficulty: medium
    stem: |
      Identify and fix the error: "The librarian handed the book to the student with a torn cover."
    choices:
      - text: With a torn cover is misplaced, making it sound like the student has a torn cover; it should read "The librarian handed the student the book with a torn cover."
        correct: true
      - text: There is no error in this sentence.
        rationale: |
          You accepted the phrase next to "student," but the intended referent is the book.
      - text: Handed should be changed to hands.
        rationale: |
          You changed verb tense, but the placement of "with a torn cover" is the source of ambiguity.
      - text: The sentence needs a comma after "book."
        rationale: |
          You added punctuation without placing the modifier next to the intended noun.
    explanation: |
      The surface order puts "with a torn cover" next to "student." Moving it next to "book" makes the intended attachment clear.
    approved: true

  - id: q-grammar-and-structure-modifiers-0006
    type: modifier-placement
    difficulty: medium
    stem: |
      Identify and fix the error: "Rushing to catch the bus, my coffee spilled everywhere."
    choices:
      - text: 'This is a dangling modifier: "rushing to catch the bus" has no logical subject, since coffee cannot rush; it should read "Rushing to catch the bus, I spilled my coffee everywhere."'
        correct: true
      - text: There is no error in this sentence.
        rationale: |
          You overlooked that "my coffee" is the grammatical subject after the introductory phrase, creating an impossible attachment.
      - text: Spilled should be changed to spills.
        rationale: |
          You changed tense, but the issue is the missing person who was rushing.
      - text: The sentence needs a semicolon instead of a comma.
        rationale: |
          You changed punctuation without fixing the dangling modifier.
    explanation: |
      The introductory phrase needs a person who was rushing, but the sentence supplies "my coffee" as the following subject. Naming the person fixes the modifier.
    approved: true

  - id: q-grammar-and-structure-modifiers-0007
    type: modifier-placement
    difficulty: medium
    stem: |
      Choose the sentence with no misplaced or dangling modifier.
    choices:
      - text: Exhausted from the long hike, the campers set up their tents quickly.
        correct: true
      - text: Exhausted from the long hike, the tents were set up quickly.
        rationale: |
          You chose a sentence whose following subject is "the tents," which cannot be exhausted.
      - text: Both sentences are correctly modified.
        rationale: |
          You accepted the version in which the modifier points to tents rather than campers.
      - text: Neither sentence is correctly modified.
        rationale: |
          You rejected the sentence where "the campers" logically matches "exhausted from the long hike."
    explanation: |
      In the correct sentence, the introductory modifier points to the campers. In the other sentence, it dangles because tents cannot be exhausted.
    approved: true

  - id: q-grammar-and-structure-modifiers-0008
    type: modifier-placement
    difficulty: medium
    stem: |
      Which statement about the focusing adverb "only" is accurate in ordinary standard English?
    choices:
      - text: Its position helps signal focus, but it commonly appears in normal adverb mid-position before the main verb even when its practical scope is broader than the single word immediately after it.
        correct: true
      - text: It always modifies only the single word that immediately follows it, with no role for context or normal adverb position.
        rationale: |
          You applied a rigid adjacency rule. Cambridge notes that "only" commonly occupies normal adverb mid-position when the focus is another part of the clause.
      - text: It can modify only nouns and never verbs, phrases, amounts, or activities.
        rationale: |
          "Only" can function as a focusing adverb with several kinds of focus, including activities and amounts.
      - text: Its placement never affects focus or interpretation.
        rationale: |
          Position can matter, especially in contrasts such as "Only she..." versus "...only him," even though everyday mid-position use is flexible.
    explanation: |
      "Only" is a focusing adverb. Clear contrastive placement can change focus, but ordinary English also commonly places it in the normal adverb position before the main verb. Treating it as mechanically modifying only the next word is too rigid.
    approved: true

  - id: q-grammar-and-structure-modifiers-0009
    type: modifier-placement
    difficulty: medium
    stem: |
      In "The waiter served the pasta to the customer covered in cheese," why is "covered in cheese" considered misplaced if the intended meaning is that the pasta has cheese?
    choices:
      - text: As written, the phrase sits next to "customer" and invites that grammatical attachment; it must be moved next to "pasta" to express the intended meaning clearly.
        correct: true
      - text: The phrase does not attach to anything in the sentence, so its position cannot affect meaning.
        rationale: |
          The phrase is positioned as a post-noun modifier and its location creates the unwanted attachment to "customer."
      - text: The phrase correctly modifies "pasta" because logic always overrides surface word order.
        rationale: |
          You relied on intended meaning to erase the placement problem. The point of a misplaced modifier is that surface placement creates the wrong or ambiguous attachment.
      - text: >-
          "Covered in cheese" is not a modifier at all.
        rationale: |
          It is a participial phrase functioning adjectivally.
    explanation: |
      The original wording makes "covered in cheese" appear to modify the nearby noun "customer." Because the intended referent is pasta, moving the phrase next to "pasta" removes the ambiguity. This is consistent with the earlier examples in the bank.
    approved: true

  - id: q-grammar-and-structure-modifiers-0010
    type: modifier-placement
    difficulty: medium
    stem: |
      A student reads "After finishing the marathon, a warm bath felt amazing" and thinks it sounds fine because it flows smoothly. Is this sentence grammatically sound in standard formal writing?
    choices:
      - text: 'No: the introductory phrase needs a logical subject, but the following subject is "a warm bath," which cannot finish a marathon.'
        correct: true
      - text: 'Yes: if a sentence sounds smooth when read aloud, it cannot have a dangling modifier.'
        rationale: |
          Sound alone does not establish a logical subject-modifier relationship.
      - text: 'Yes: because baths are commonly associated with relaxation after exercise.'
        rationale: |
          Real-world association does not make the bath the performer of "finishing the marathon."
      - text: 'No: only because the sentence is missing a comma.'
        rationale: |
          The sentence already has a comma. The error is the dangling modifier.
    explanation: |
      A dangling modifier can sound natural at first glance. Check whether the grammatical subject following the introductory phrase can logically perform the action.
    approved: true

  - id: q-grammar-and-structure-modifiers-0011
    type: modifier-placement
    difficulty: medium
    stem: |
      Can a single-word focusing adverb such as "only" change a sentence's focus depending on placement and context?
    choices:
      - text: 'Yes: single-word modifiers can shift focus, although ordinary adverb placement is flexible and context also helps determine scope.'
        correct: true
      - text: 'No: misplaced-modifier concerns apply only to phrases of at least three words.'
        rationale: |
          Modifier length does not determine whether placement can affect interpretation.
      - text: 'No: single words never affect a sentence''s focus.'
        rationale: |
          Focusing adverbs such as "only" are specifically used to limit or emphasize part of a clause.
      - text: 'Yes: but only when the word is capitalized.'
        rationale: |
          Capitalization does not control the scope of a focusing adverb.
    explanation: |
      Single-word modifiers can affect focus. At the same time, English does not obey a simplistic rule that "only" always modifies the very next word; normal adverb position and context matter too.
    approved: true

  - id: q-grammar-and-structure-modifiers-0012
    type: modifier-placement
    difficulty: medium
    stem: |
      Identify the problem: "Having studied all night, the exam seemed easy."
    choices:
      - text: 'Dangling modifier: the exam did not study; it should read "Having studied all night, she found the exam easy."'
        correct: true
      - text: There is no error in this sentence.
        rationale: |
          You accepted the sentence even though the following subject is "the exam," which cannot study.
      - text: This is a misplaced modifier, not a dangling one.
        rationale: |
          The person who studied is missing from the main clause, making the introductory modifier dangling rather than merely placed beside the wrong available noun.
      - text: This is a subject-verb agreement error.
        rationale: |
          The verb forms agree; the problem is the missing logical subject for the introductory phrase.
    explanation: |
      "Having studied all night" needs a person who studied. The main clause instead begins with "the exam," so the modifier dangles.
    approved: true

  - id: q-grammar-and-structure-modifiers-0013
    type: modifier-placement
    difficulty: medium
    stem: |
      Identify the problem: "The teacher gave the award to the student wrapped in gold paper."
    choices:
      - text: 'Misplaced modifier: "wrapped in gold paper" appears to describe the student; it should be moved next to "award" if the award is what was wrapped.'
        correct: true
      - text: There is no error in this sentence if the intended meaning is that the award was wrapped.
        rationale: |
          For that intended meaning, the phrase's current position next to "student" creates the wrong attachment.
      - text: This is a dangling modifier, not a misplaced one.
        rationale: |
          The intended noun "award" is present in the sentence; the phrase is simply positioned beside another noun.
      - text: This is a verb tense error.
        rationale: |
          "Gave" is a valid past-tense verb. The issue is the modifier's position.
    explanation: |
      If the award is wrapped, the descriptive phrase should be placed next to "award." In the original order it appears to modify "student."
    approved: true

  - id: q-grammar-and-structure-modifiers-0014
    type: modifier-placement
    difficulty: medium
    stem: |
      Rewrite to fix the dangling modifier: "Excited about the trip, the suitcases were packed a week early."
    choices:
      - text: Excited about the trip, we packed the suitcases a week early.
        correct: true
      - text: The suitcases, excited about the trip, were packed a week early.
        rationale: |
          You kept the emotional modifier attached to inanimate suitcases.
      - text: A week early, excited suitcases were packed for the trip.
        rationale: |
          You still described the suitcases themselves as excited.
      - text: No fix is needed; the sentence is already correct.
        rationale: |
          The introductory phrase needs a person capable of being excited as its logical subject.
    explanation: |
      Adding a logical human subject immediately after the introductory modifier fixes the dangling construction.
    approved: true

  - id: q-grammar-and-structure-modifiers-0015
    type: modifier-placement
    difficulty: exam
    stem: |
      Identify all modifier errors and select the fully corrected version: "Walking into the room, the smell of fresh bread greeted us. We were served warm bread by the baker wrapped in a cloth napkin."
    choices:
      - text: "Walking into the room, we were greeted by the smell of fresh bread. The baker served us warm bread wrapped in a cloth napkin."
        correct: true
      - text: The passage has no modifier errors as written.
        rationale: |
          You missed both attachment problems: the smell cannot perform the walking, and the original second sentence places "wrapped in a cloth napkin" next to "the baker."
      - text: Only the first sentence has an error; the second sentence is correct as written.
        rationale: |
          You caught the dangling modifier in the first sentence but missed the ambiguous/misplaced phrase in the second.
      - text: Only the second sentence has an error; the first sentence is correct as written.
        rationale: |
          You caught the second placement problem but missed the dangling introductory modifier in the first sentence.
    explanation: |
      The first sentence dangles because "the smell" cannot walk into the room. The second places the cloth-napkin phrase next to "the baker" even though the intended referent is the bread. Both need revision.
    approved: true
