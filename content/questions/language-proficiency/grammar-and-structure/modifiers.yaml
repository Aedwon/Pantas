meta:
  subject: "language-proficiency"
  topic: "grammar-and-structure"
  subtopic: "modifiers"
  exams:
    - "upcat"
    - "acet"
    - "dlsucet"
    - "ustet"
    - "dost-sei"
    - "cse-pro"
    - "cse-sub"
questions:
  - id: "q-grammar-and-structure-modifiers-0001"
    type: "modifier-placement"
    difficulty: "easy"
    stem: |
      The pasta, not the customer, is covered in cheese. Which revision makes that meaning clear?
    choices:
      - text: "The waiter served the customer pasta covered in cheese."
        correct: true
      - text: "The waiter served pasta to the customer covered in cheese."
        rationale: |
          This places the cheese description beside the customer. The food is mentioned earlier, so the intended meaning may seem obvious. Check: place the description with the thing it describes.
      - text: "Covered in cheese, the waiter served pasta to the customer."
        rationale: |
          This attaches the cheese description to the waiter. Moving the phrase to the front seems to give it emphasis. Check: identify the subject immediately after the opening phrase.
      - text: "The waiter, covered in cheese, served pasta to the customer."
        rationale: |
          This describes the waiter as covered in cheese. Commas make the sentence look carefully edited. Check: ask who the phrase between the commas describes.
    explanation: |
      The revision places "covered in cheese" directly after "pasta." That makes the pasta the clear target of the description.
    approved: true
  - id: "q-grammar-and-structure-modifiers-0002"
    type: "modifier-placement"
    difficulty: "medium"
    stem: |
      Which revision supplies the person who finished the marathon in "After finishing the marathon, a warm bath felt amazing"?
    choices:
      - text: "After finishing the marathon, she enjoyed a warm bath."
        correct: true
      - text: "After finishing the marathon, a warm bath was enjoyed by her."
        rationale: |
          This keeps the bath as the main subject. The runner appears later in the sentence, so the repair seems complete. Check: match the opening action to the main subject.
      - text: "A warm bath, after finishing the marathon, felt amazing to her."
        rationale: |
          This still links finishing the race to the bath. Moving the phrase may look like a placement repair. Check: name the person doing the opening action.
      - text: "After finishing the marathon, the warmth of the bath amazed her."
        rationale: |
          This makes the warmth the main subject. The word "her" suggests a runner is present. Check: check whether the main subject could finish a race.
    explanation: |
      The opening phrase describes the person who finished the race. The main subject "she" supplies that person, so the description has a clear target.
    approved: true
  - id: "q-grammar-and-structure-modifiers-0003"
    type: "modifier-placement"
    difficulty: "medium"
    stem: |
      Which sentence correctly connects the opening action to its main subject?
    choices:
      - text: "Driving through the mountains, the tourists admired the scenery."
        correct: true
      - text: "Driving through the mountains, the scenery amazed the tourists."
        rationale: |
          This makes the scenery the subject of driving. The tourists appear in the sentence and could be drivers. Check: match the opening action to the main subject.
      - text: "Driving through the mountains, the beauty of the scenery amazed them."
        rationale: |
          This attaches driving to the beauty of the scenery. The pronoun "them" suggests people are involved. Check: find the main subject before judging the opening phrase.
      - text: "The scenery, driving through the mountains, amazed the tourists."
        rationale: |
          This puts the driving phrase beside scenery. The commas make the description look neatly placed. Check: ask whether the described thing can drive.
    explanation: |
      The tourists are the subject of the main clause. They can perform the opening action, "driving through the mountains."
    approved: true
  - id: "q-grammar-and-structure-modifiers-0004"
    type: "modifier-placement"
    difficulty: "medium"
    stem: |
      What does "only" limit in "Only she gave him the answer" and "She gave only him the answer," respectively?
    choices:
      - text: "The giver; the recipient"
        correct: true
      - text: "The recipient; the giver"
        rationale: |
          This reverses the two limits. Both sentences contain the same people and action. Check: look at the words following "only" in these clear contrasts.
      - text: "The answer; the recipient"
        rationale: |
          This treats the first limit as a limit on the object. The answer is the thing being given. Check: check whether "only" stands before "she" or "the answer".
      - text: "The giver; the answer"
        rationale: |
          This moves the second limit from the person to the object. The answer follows the recipient in the sentence. Check: read "only him" as one group.
    explanation: |
      "Only she" says that she alone gave the answer. "Only him" says that he alone received it.
    approved: true
  - id: "q-grammar-and-structure-modifiers-0005"
    type: "modifier-placement"
    difficulty: "medium"
    stem: |
      The book has a torn cover. Which revision states that meaning clearly?
    choices:
      - text: "The librarian handed the student a book with a torn cover."
        correct: true
      - text: "The librarian handed a book to the student with a torn cover."
        rationale: |
          This places the torn-cover phrase beside the student. The book is mentioned, so the intended meaning may seem clear. Check: place the cover description after the book.
      - text: "With a torn cover, the librarian handed a book to the student."
        rationale: |
          This attaches the cover description to the librarian. The opening phrase mentions the cover before the action. Check: find the main subject after the opening phrase.
      - text: "The librarian with a torn cover handed a book to the student."
        rationale: |
          This puts the cover description with the librarian. Every noun remains in the sentence. Check: check which noun the description follows.
    explanation: |
      "With a torn cover" follows "a book." It clearly describes the book being handed over.
    approved: true
  - id: "q-grammar-and-structure-modifiers-0006"
    type: "modifier-placement"
    difficulty: "medium"
    stem: |
      Which revision fixes the dangling modifier in "Rushing to catch the bus, my coffee spilled everywhere"?
    choices:
      - text: "Rushing to catch the bus, I spilled my coffee everywhere."
        correct: true
      - text: "Rushing to catch the bus, my coffee was spilled everywhere by me."
        rationale: |
          This leaves coffee as the main subject. The person appears at the end, so the repair may seem complete. Check: match rushing to the main subject.
      - text: "My coffee, rushing to catch the bus, spilled everywhere."
        rationale: |
          This still describes the coffee as rushing. Moving the phrase beside the subject looks like a repair. Check: ask whether that subject can catch a bus.
      - text: "Rushing to catch the bus, the spilled coffee made a mess around me."
        rationale: |
          This gives the opening action to spilled coffee. The word "me" suggests the person who was rushing. Check: locate the main subject, not any person in the sentence.
    explanation: |
      "I" is the main subject and the person rushing for the bus. The opening phrase now has a clear person to describe.
    approved: true
  - id: "q-grammar-and-structure-modifiers-0007"
    type: "modifier-placement"
    difficulty: "medium"
    stem: |
      Which sentence correctly identifies who was exhausted?
    choices:
      - text: "Exhausted from the hike, the campers quickly pitched their tents."
        correct: true
      - text: "Exhausted from the long hike, the tents were pitched by the campers."
        rationale: |
          This attaches exhaustion to the tents. The campers appear later and really are tired. Check: check the main subject after the opening description.
      - text: "The tents, exhausted from the long hike, were pitched quickly."
        rationale: |
          This describes tents as exhausted. The phrase is placed beside a noun as an editing rule suggests. Check: ask whether that noun can feel exhausted.
      - text: "Exhausted from the long hike, pitching the tents took the campers an hour."
        rationale: |
          This makes the activity of pitching the subject. The campers are named in the sentence. Check: give the feeling to the people doing the activity.
    explanation: |
      The main subject is "the campers." They are the people described as exhausted, so the opening description fits.
    approved: true
  - id: "q-grammar-and-structure-modifiers-0008"
    type: "modifier-placement"
    difficulty: "medium"
    stem: |
      Which statement about the focusing adverb "only" is accurate in standard English?
    choices:
      - text: "Position and context help show what it limits."
        correct: true
      - text: "It always limits just the next word, regardless of the surrounding context."
        rationale: |
          This applies a fixed next-word rule. Placing "only" beside its target often helps clarity. Check: read the whole sentence to identify the intended limit.
      - text: "It limits nouns alone, even when it appears directly before a verb."
        rationale: |
          This treats a focusing adverb as limited to nouns. Examples such as "only Ana" focus a noun. Check: ask whether an action or amount is being limited.
      - text: "Its position has no effect because context always supplies the same meaning."
        rationale: |
          This treats context as making placement irrelevant. Ordinary mid-position use is flexible. Check: compare the targets in "Only she" and "only him".
    explanation: |
      "Only" limits part of a sentence. Its position helps show that part, and the surrounding words can also make the limit clear.
    approved: true
  - id: "q-grammar-and-structure-modifiers-0009"
    type: "modifier-placement"
    difficulty: "medium"
    stem: |
      Which sentence avoids a dangling modifier by naming the observer inside the opening clause?
    choices:
      - text: "As Liza approached the gate, a dog began barking."
        correct: true
      - text: "Approaching the gate, a dog began barking loudly at Liza."
        rationale: |
          This makes the dog the one approaching. Liza appears nearby as a possible observer. Check: check whether the opening words name their own subject.
      - text: "While approaching the gate, the barking of a dog startled Liza."
        rationale: |
          This gives approaching to the barking. The word "while" makes the opening look like a complete clause. Check: look for an explicit subject inside that clause.
      - text: "After approaching the gate, the sound of a barking dog surprised Liza."
        rationale: |
          This attaches approaching to a sound. The later mention of Liza suggests an intended observer. Check: match the understood actor to the main subject.
    explanation: |
      "As Liza approached the gate" names Liza as its own subject. The main clause can therefore have a different subject, "a dog."
    approved: true
  - id: "q-grammar-and-structure-modifiers-0010"
    type: "modifier-placement"
    difficulty: "medium"
    stem: |
      Which sentence says that the cyclists rode on most days, though not every day?
    choices:
      - text: "The cyclists rode to school almost every day."
        correct: true
      - text: "The cyclists almost rode to school every day during the term."
        rationale: |
          This places "almost" with the act of riding. The same words mention a daily routine. Check: put "almost" beside the frequency being limited.
      - text: "Almost all the cyclists rode to school every day during the term."
        rationale: |
          This limits the number of cyclists. The phrase "almost all" sounds like a small exception. Check: check whether the exception concerns people or days.
      - text: "The cyclists rode almost all the way to school every day."
        rationale: |
          This limits the distance traveled. The daily trip is still mentioned. Check: identify whether "almost" describes distance or frequency.
    explanation: |
      "Almost every day" describes how often the cyclists rode. It means they rode on most days, with some days left out.
    approved: true
  - id: "q-grammar-and-structure-modifiers-0011"
    type: "modifier-placement"
    difficulty: "medium"
    stem: |
      A ticket admits a guest on Saturday and on no other day. Which sentence states that restriction most clearly?
    choices:
      - text: "The ticket admits a guest on Saturday only."
        correct: true
      - text: "Only the ticket admits a guest on Saturday, according to the notice."
        rationale: |
          This limits what grants admission. The sentence includes "only" and Saturday. Check: place the limit on the day.
      - text: "The ticket admits only a guest on Saturday, according to the notice."
        rationale: |
          This limits who may be admitted. A ticket normally controls entry, so that limit seems relevant. Check: check whether the intended restriction concerns people or days.
      - text: "The ticket admits a guest only inside the hall on Saturday."
        rationale: |
          This limits the place of admission. The hall sounds like a likely ticket restriction. Check: put the limiting word with the required day.
    explanation: |
      "On Saturday only" limits the day of admission. It allows Saturday and excludes other days.
    approved: true
  - id: "q-grammar-and-structure-modifiers-0012"
    type: "modifier-placement"
    difficulty: "medium"
    stem: |
      What is the modifier problem in "Having studied all night, the exam seemed easy"?
    choices:
      - text: "The opening phrase lacks a matching main subject."
        correct: true
      - text: "The word \"easy\" is misplaced because it comes after the verb \"seemed.\""
        rationale: |
          This treats a normal subject description as misplaced. The sentence contains a describing word. Check: check who performed the opening action.
      - text: "The opening phrase modifies a person already named later in the sentence."
        rationale: |
          This assumes that an unnamed student counts as a stated target. A person must have studied in real life. Check: look for that person in the actual main clause.
      - text: "The opening phrase is a complete clause with its own stated subject."
        rationale: |
          This mistakes a verb phrase for a clause with a named subject. "Having studied" expresses an action. Check: look for an explicit person or thing doing that action.
    explanation: |
      "Having studied all night" describes someone who studied. The main subject is "the exam," so the sentence does not name a matching subject for the opening action.
    approved: true
  - id: "q-grammar-and-structure-modifiers-0013"
    type: "modifier-placement"
    difficulty: "medium"
    stem: |
      Which revision makes clear that the teacher spoke to a student who wore a blue jacket?
    choices:
      - text: "The teacher spoke to the student wearing a blue jacket."
        correct: true
      - text: "Wearing a blue jacket, the teacher spoke to the student after class."
        rationale: |
          This gives the jacket to the teacher. The sentence mentions the same action and people. Check: match the opening description to the main subject.
      - text: "The teacher wearing a blue jacket spoke to the student after class."
        rationale: |
          This places the jacket description directly after the teacher. A nearby description usually looks clear. Check: check which person the intended description belongs to.
      - text: "The teacher, who wore a blue jacket, spoke to the student after class."
        rationale: |
          This states that the teacher wore the jacket. The relative clause is grammatically clear. Check: keep the intended wearer when revising.
    explanation: |
      "Wearing a blue jacket" follows "the student." The revision clearly identifies the student as the person wearing the jacket.
    approved: true
  - id: "q-grammar-and-structure-modifiers-0014"
    type: "modifier-placement"
    difficulty: "medium"
    stem: |
      Which revision gives "excited about the trip" a suitable subject in "Excited about the trip, the suitcases were packed a week early"?
    choices:
      - text: "Excited about the trip, we packed the suitcases a week early."
        correct: true
      - text: "The suitcases, excited about the trip, were packed a week early."
        rationale: |
          This still describes suitcases as excited. Moving a phrase beside its noun often improves placement. Check: choose a subject that can feel excitement.
      - text: "Excited about the trip, packing the suitcases was finished a week early."
        rationale: |
          This makes the packing activity the subject. The activity belongs to the travelers. Check: name the people who feel excited.
      - text: "Excited about the trip, the suitcases were packed a week early by us."
        rationale: |
          This leaves the suitcases as the main subject. The phrase "by us" adds the travelers. Check: check the subject immediately after the opening phrase.
    explanation: |
      The main subject "we" names people who can be excited. It also names the people packing the suitcases.
    approved: true
  - id: "q-grammar-and-structure-modifiers-0015"
    type: "modifier-placement"
    difficulty: "exam"
    stem: |
      The visitors walk into the room, and the bread is wrapped in a napkin. Which revision makes both meanings clear?
    choices:
      - text: "Entering the room, we smelled fresh bread. The baker served bread wrapped in a napkin."
        correct: true
      - text: "Entering the room, the smell greeted us. The baker served bread wrapped in a napkin."
        rationale: |
          This gives the entering action to a smell. The second sentence correctly places the napkin description. Check: check the main subject of each sentence.
      - text: "Entering the room, we smelled fresh bread. We received bread from the baker wrapped in a napkin."
        rationale: |
          This puts the napkin description beside the baker. The opening action now has a suitable subject. Check: check which noun the final description follows.
      - text: "Entering the room, the smell greeted us. We received bread from the baker wrapped in a napkin."
        rationale: |
          This keeps both misplaced targets. The visitors and bread remain in the passage. Check: match each action and description to its intended target.
    explanation: |
      "We" names the visitors entering the room. "Wrapped in a napkin" follows "bread," so it describes the bread.
    approved: true
  - id: "q-grammar-and-structure-modifiers-0016"
    type: "modifier-placement"
    difficulty: "easy"
    stem: |
      Which sentence clearly says that Mara nearly missed the train but caught it?
    choices:
      - text: "Mara almost missed the train."
        correct: true
      - text: "Mara missed almost every train that arrived that morning."
        rationale: |
          This changes one near miss into repeated actual misses. "Almost" still appears beside a train-related event. Check: check whether the action happened.
      - text: "Almost everyone missed the train, including Mara that morning."
        rationale: |
          This limits the group of people instead of the action. The sentence contains "almost" and "missed". Check: keep the focus on Mara and her near miss.
      - text: "Mara missed the train almost at the station that morning."
        rationale: |
          This says that she missed the train. The word "almost" can suggest a near event. Check: check which words "almost" actually limits.
    explanation: |
      "Almost missed" means the miss nearly happened. Mara therefore caught the train.
    approved: false
  - id: "q-grammar-and-structure-modifiers-0017"
    type: "modifier-placement"
    difficulty: "medium"
    stem: |
      Which sentence clearly identifies a broken window, not a broken ladder?
    choices:
      - text: "A worker on a ladder repaired the broken window."
        correct: true
      - text: "A worker repaired the window on a broken ladder outside the hall."
        rationale: |
          This makes the ladder broken. The sentence still includes a repair and a window. Check: attach "broken" to the intended object.
      - text: "On a broken ladder, a worker repaired the window outside the hall."
        rationale: |
          This describes the ladder as broken. The opening phrase seems to clarify where the worker stands. Check: preserve which object is damaged.
      - text: "The window was repaired by a worker who stood on a broken ladder."
        rationale: |
          This gives the damage to the ladder. The relative clause removes some placement uncertainty. Check: check that the revision preserves the intended damage.
    explanation: |
      "Broken" directly describes "window." The ladder only tells where the worker stood.
    approved: false
  - id: "q-grammar-and-structure-modifiers-0018"
    type: "modifier-placement"
    difficulty: "hard"
    stem: |
      Which sentence contains a dangling modifier in standard edited prose?
    choices:
      - text: "To reach the deadline, more time was needed."
        correct: true
      - text: "To reach the deadline, the editors needed more time for their final checks."
        rationale: |
          This treats every opening purpose phrase as dangling. The sentence begins with an infinitive phrase. Check: check whether the editors can perform the stated action.
      - text: "Before the editors reached the deadline, more time became available for checks."
        rationale: |
          This ignores the subject inside the opening clause. The main subject is not a person. Check: look for the clause's own actor.
      - text: "Working toward the deadline, the editors requested more time for their checks."
        rationale: |
          This treats an opening action phrase as automatically faulty. The opening words come before the main subject. Check: match working to the editors.
    explanation: |
      "To reach the deadline" needs people who aim to finish on time. The main subject is "more time," so the sentence leaves those people unnamed.
    approved: false
  - id: "q-grammar-and-structure-modifiers-0019"
    type: "modifier-placement"
    difficulty: "hard"
    stem: |
      The curator displayed nearly all the vases. Which sentence preserves that meaning?
    choices:
      - text: "The curator displayed almost all the vases."
        correct: true
      - text: "The curator almost displayed all the vases during the evening exhibition."
        rationale: |
          This makes displaying the collection a near action. The words "almost" and "all" remain in the sentence. Check: place the limit on how many vases.
      - text: "Almost every curator displayed all the vases during the evening exhibition."
        rationale: |
          This limits the number of curators. It keeps the idea of almost all of something. Check: identify the group that has the exception.
      - text: "The curator displayed all the vases for almost the entire evening exhibition."
        rationale: |
          This limits the duration of the display. The phrase "almost" still suggests an exception. Check: keep the exception attached to the vases.
    explanation: |
      "Almost all the vases" limits the number of vases displayed. It means nearly all were displayed, without giving an exact number left out.
    approved: false
  - id: "q-grammar-and-structure-modifiers-0020"
    type: "modifier-placement"
    difficulty: "exam"
    stem: |
      In standard edited prose, which sentence correctly uses an opening clause with its own subject?
    choices:
      - text: "After the guests arrived, dinner was served."
        correct: true
      - text: "After arriving at the house, dinner was served to the guests in the hall."
        rationale: |
          This leaves arriving without a matching main subject. The guests are named later as recipients. Check: check who performs the opening action.
      - text: "Having arrived at the house, dinner was served to the guests in the hall."
        rationale: |
          This gives arriving to dinner. A completed action sounds suitable before a past event. Check: match the opening phrase to the main subject.
      - text: "Arriving at the house, dinner was served to the guests in the hall."
        rationale: |
          This makes dinner the understood arrival. The later mention of guests supplies an intended meaning. Check: look for a stated subject in the opening group.
    explanation: |
      "After the guests arrived" has its own subject, "the guests." The main clause may therefore use "dinner" as a different subject.
    approved: false
