meta:
  subject: "language-proficiency"
  topic: "grammar-and-structure"
  subtopic: "phrases-and-clauses"
  exams:
    - "upcat"
    - "acet"
    - "dlsucet"
    - "ustet"
    - "dost-sei"
    - "cse-pro"
    - "cse-sub"
questions:
  - id: "q-grammar-and-structure-phrases-and-clauses-0001"
    type: "phrase-clause-identification"
    difficulty: "easy"
    stem: |
      Is "under the old bridge" a phrase or a clause?
    choices:
      - text: "Prepositional phrase"
        correct: true
      - text: "Independent clause"
        rationale: |
          This treats a location group as a complete statement. The group contains a noun and gives clear information. Check: look for a finite verb.
      - text: "Dependent clause"
        rationale: |
          This mistakes any group that needs a larger sentence for a clause. The group cannot stand as a formal sentence. Check: check for a clause's subject-and-verb structure.
      - text: "Main verb phrase"
        rationale: |
          This treats the hiding location as an action. A location can be related to an action. Check: find whether the group contains a verb.
    explanation: |
      "Under" introduces the noun phrase "the old bridge." Together they form a prepositional phrase giving a location.
    approved: true
  - id: "q-grammar-and-structure-phrases-and-clauses-0002"
    type: "phrase-clause-identification"
    difficulty: "easy"
    stem: |
      How is the whole group "the cat slept" classified?
    choices:
      - text: "Independent clause"
        correct: true
      - text: "Prepositional phrase"
        rationale: |
          This treats a short word group as a phrase. The group has only three words. Check: look for a subject and a finite verb.
      - text: "Dependent clause"
        rationale: |
          This assumes a short statement needs another clause. The statement gives little detail. Check: check whether any word makes it subordinate.
      - text: "Noun phrase"
        rationale: |
          This counts only the words "the cat". Those words name an animal. Check: include "slept" when classifying the whole group.
    explanation: |
      "The cat" is the subject, and "slept" is the finite verb. The group can stand as a complete sentence.
    approved: true
  - id: "q-grammar-and-structure-phrases-and-clauses-0003"
    type: "phrase-clause-identification"
    difficulty: "medium"
    stem: |
      Is "She finished her homework" an independent or a dependent clause?
    choices:
      - text: "Independent clause"
        correct: true
      - text: "Dependent clause"
        rationale: |
          This mistakes a short statement for an incomplete clause. The sentence gives no background information. Check: check whether it can stand as a complete statement.
      - text: "Noun phrase"
        rationale: |
          This treats a group naming a person as only a noun group. The opening word refers to a person. Check: include the action "finished".
      - text: "Prepositional phrase"
        rationale: |
          This treats a sentence part as a relation phrase. The sentence gives a relationship between a person and homework. Check: look for a preposition introducing the whole group.
    explanation: |
      "She" is the subject, and "finished her homework" says what she did. The group can stand as a complete statement.
    approved: true
  - id: "q-grammar-and-structure-phrases-and-clauses-0004"
    type: "phrase-clause-identification"
    difficulty: "medium"
    stem: |
      Is "Although she was tired" an independent or a dependent clause?
    choices:
      - text: "Dependent clause"
        correct: true
      - text: "Independent clause"
        rationale: |
          This ignores the effect of "although". "She was tired" has a subject and verb. Check: include the opening word in the stand-alone test.
      - text: "Noun phrase"
        rationale: |
          This treats a reference to a person as a noun group. "She" refers to someone. Check: check for the finite verb "was".
      - text: "Prepositional phrase"
        rationale: |
          This treats the opening connector as if it introduced only a noun phrase. Some opening words can have that use. Check: identify the subject and verb after "although".
    explanation: |
      "She" is the subject, and "was" is a finite verb. "Although" makes this clause depend on a main clause to finish the statement.
    approved: true
  - id: "q-grammar-and-structure-phrases-and-clauses-0005"
    type: "phrase-clause-identification"
    difficulty: "medium"
    stem: |
      Combine the dependent clause "Because the store was closed" with an appropriate independent clause to form a complete sentence.
    choices:
      - text: "Because the store was closed, we went home."
        correct: true
      - text: "Because the store was closed, while we walked back home."
        rationale: |
          This joins two dependent clauses without a main clause. Both groups contain subjects and verbs. Check: find a clause that can stand on its own.
      - text: "Because the store was closed, our journey back home."
        rationale: |
          This adds a noun phrase without a main verb. The phrase gives a sensible result. Check: check that the added group states an action.
      - text: "Because the store was closed, after our journey back home."
        rationale: |
          This adds a prepositional phrase rather than a main clause. The group gives extra time information. Check: look for a complete main statement.
    explanation: |
      "We went home" can stand as a complete sentence. Adding it to "Because the store was closed" supplies the main clause that the opening group needs.
    approved: true
  - id: "q-grammar-and-structure-phrases-and-clauses-0006"
    type: "phrase-clause-identification"
    difficulty: "medium"
    stem: |
      In ordinary formal prose requiring a complete sentence, what is wrong with "Although the teacher explained the lesson twice"?
    choices:
      - text: "It is a dependent-clause fragment."
        correct: true
      - text: "It is a complete independent sentence."
        rationale: |
          This counts the subject and verb but ignores "although". The teacher and an action are clearly named. Check: include the opening connector in the test.
      - text: "It is a run-on with two main clauses."
        rationale: |
          This confuses a dependent fragment with a run-on. The sentence looks unfinished or awkward. Check: count the actual clauses.
      - text: "It is a phrase with no finite verb."
        rationale: |
          This treats dependence as the absence of a verb. The group needs a larger sentence. Check: find "explained" and its subject.
    explanation: |
      "Although" makes "the teacher explained the lesson twice" dependent. Standing alone in ordinary formal prose, the group is a fragment.
    approved: true
  - id: "q-grammar-and-structure-phrases-and-clauses-0007"
    type: "phrase-clause-identification"
    difficulty: "medium"
    stem: |
      In a formal task requiring a complete sentence, how is "running quickly through the park" classified?
    choices:
      - text: "An incomplete group with a nonfinite verb"
        correct: true
      - text: "Independent finite clause"
        rationale: |
          This treats the -ing action as a finite verb. "Running" names an action. Check: look for a verb carrying tense and a matching subject.
      - text: "Dependent finite clause"
        rationale: |
          This assumes an incomplete action group must be a finite clause. The group needs a larger sentence. Check: check whether the group has a finite verb.
      - text: "Prepositional phrase"
        rationale: |
          This classifies the whole group from "through the park" alone. Those final words are a prepositional phrase. Check: include "running quickly" in the analysis.
    explanation: |
      "Running" does not show tense by itself. "Running quickly through the park" has no finite verb and cannot stand alone as a complete formal sentence.
    approved: true
  - id: "q-grammar-and-structure-phrases-and-clauses-0008"
    type: "phrase-clause-identification"
    difficulty: "medium"
    stem: |
      Is "When the bell rang" an independent or a dependent clause?
    choices:
      - text: "Dependent clause"
        correct: true
      - text: "Independent clause"
        rationale: |
          This ignores the opening "when". "The bell rang" is a complete statement by itself. Check: include every word in the group.
      - text: "Noun phrase"
        rationale: |
          This classifies the group from "the bell" alone. The opening noun phrase names a thing. Check: include the action word "rang".
      - text: "Prepositional phrase"
        rationale: |
          This treats a time relation as a phrase containing only a noun group. Time information often appears in phrases. Check: identify the subject "the bell" and verb "rang".
    explanation: |
      "When" makes the clause "the bell rang" subordinate. In this use, the group needs a main clause describing what happened then.
    approved: true
  - id: "q-grammar-and-structure-phrases-and-clauses-0009"
    type: "phrase-clause-identification"
    difficulty: "medium"
    stem: |
      Is the comma placement correct in this sentence? "Because it was raining, we stayed inside."
    choices:
      - text: "Yes: an introductory dependent clause is followed by a comma before the independent clause."
        correct: true
      - text: "No: commas are never used with dependent clauses."
        rationale: |
          This bans commas beside dependent clauses. A dependent clause cannot stand alone, so joining it closely to the main clause may seem necessary. Check whether it comes before the main clause.
      - text: "No: the comma should be removed entirely."
        rationale: |
          This applies the usual pattern for a following reason clause to an opening clause. The same word "because" makes the two patterns seem alike. Check the order of the clauses.
      - text: "Yes: but only because \"raining\" is a gerund."
        rationale: |
          This links punctuation to an -ing word. That ending looks like a gerund, but "was raining" is a verb phrase. Check the boundary between clauses instead of the word ending.
    explanation: |
      When a dependent clause comes first, standard punctuation places a comma before the following independent clause: "Because it was raining, we stayed inside."
    approved: true
  - id: "q-grammar-and-structure-phrases-and-clauses-0010"
    type: "phrase-clause-identification"
    difficulty: "medium"
    stem: |
      Does this sentence need a comma before "because"? "We stayed inside because it was raining."
    choices:
      - text: "No: when the independent clause comes first, no comma is typically needed before this essential reason clause."
        correct: true
      - text: "Yes: a comma is always required regardless of clause order."
        rationale: |
          This uses the opening-clause comma rule for every clause order. Both clauses are present, so the rule can seem to carry over. Check whether the reason clause comes first or follows the main clause.
      - text: "Yes: but only before \"was,\" not before \"because.\""
        rationale: |
          This separates the subject from its verb. A pause while reading may seem to justify that comma. Check that the clause's subject and verb stay together.
      - text: "No: but only because \"raining\" ends the sentence."
        rationale: |
          This ties punctuation to the final word. Sentence endings are easy to notice, so that may seem like the deciding clue. Check how the reason clause connects to the main clause.
    explanation: |
      In "We stayed inside because it was raining," the main clause comes first and the following reason clause is essential to the intended meaning, so no comma is normally used before "because."
    approved: true
  - id: "q-grammar-and-structure-phrases-and-clauses-0011"
    type: "phrase-clause-identification"
    difficulty: "medium"
    stem: |
      In "Close the door," what kind of group is the complete command?
    choices:
      - text: "An independent clause with an understood subject"
        correct: true
      - text: "A noun phrase because it names an action"
        rationale: |
          This treats the command as an activity name. "Close" is an action word. Check: ask whether the group gives an instruction.
      - text: "A dependent clause with a missing main clause"
        rationale: |
          This treats the absence of a written subject as dependence. Most basic examples state a subject. Check: check whether a command can stand on its own.
      - text: "A prepositional phrase with no verb"
        rationale: |
          This overlooks the command verb. The words "the door" form a noun phrase. Check: identify what "close" asks someone to do.
    explanation: |
      "Close" is the verb in a command. Its understood subject is "you," so "Close the door" can stand as an independent sentence.
    approved: true
  - id: "q-grammar-and-structure-phrases-and-clauses-0012"
    type: "phrase-clause-identification"
    difficulty: "medium"
    stem: |
      In a formal task requiring a complete sentence, how should "Because she was late" be classified?
    choices:
      - text: "A dependent-clause fragment"
        correct: true
      - text: "An independent sentence with a stated subject"
        rationale: |
          This ignores the opening reason connector. "She was late" has a subject and verb. Check: include "because" in the stand-alone test.
      - text: "A noun phrase naming a reason"
        rationale: |
          This confuses the group's meaning with its grammatical structure. The group gives a reason. Check: find the finite verb and subject.
      - text: "A prepositional phrase describing time"
        rationale: |
          This treats "late" as proof that the group is a time phrase. The sentence concerns lateness. Check: classify the whole group, including "because she was".
    explanation: |
      "Because" makes "she was late" dependent. In a formal task requiring a full sentence, this group needs a main clause.
    approved: true
  - id: "q-grammar-and-structure-phrases-and-clauses-0013"
    type: "phrase-clause-identification"
    difficulty: "medium"
    stem: |
      A student writes "Because it was raining we stayed inside" without a comma. Is this correctly punctuated in standard formal writing?
    choices:
      - text: "No: place a comma after the introductory dependent clause: \"Because it was raining, we stayed inside.\""
        correct: true
      - text: "Yes: commas are never needed between dependent and independent clauses."
        rationale: |
          This bans commas at all clause boundaries. The two clauses express one linked idea, so no break may seem needed. Check whether a dependent clause opens the sentence.
      - text: "Yes: but only because \"raining\" and \"inside\" share a similar sound."
        rationale: |
          This treats similar sounds as a punctuation rule. The words may catch the ear, but their sound does not set a clause boundary. Check where the introductory clause ends.
      - text: "No: but only because the sentence should have no dependent clause at all."
        rationale: |
          This rejects a normal dependent clause. Its need for a main clause may make it seem faulty even when joined to one. Check whether the whole sentence includes a complete main clause.
    explanation: |
      An introductory dependent clause is followed by a comma before the main clause: "Because it was raining, we stayed inside."
    approved: true
  - id: "q-grammar-and-structure-phrases-and-clauses-0014"
    type: "phrase-clause-identification"
    difficulty: "medium"
    stem: |
      Which word in "Since the concert ended late, everyone was tired" signals that the first clause is dependent?
    choices:
      - text: "Since"
        correct: true
      - text: "Concert"
        rationale: |
          This selects the subject rather than the connector. "Concert" names what the first clause is about. Check: find the word introducing the clause.
      - text: "Ended"
        rationale: |
          This selects the finite verb rather than the connector. A verb is needed to form a clause. Check: look before the subject for the subordinating word.
      - text: "Everyone"
        rationale: |
          This selects the subject of the main clause. It is near the boundary between clauses. Check: identify which clause each word belongs to.
    explanation: |
      "Since" introduces the reason clause "the concert ended late." The opening connector makes that clause dependent on "everyone was tired."
    approved: true
  - id: "q-grammar-and-structure-phrases-and-clauses-0015"
    type: "phrase-clause-identification"
    difficulty: "exam"
    stem: |
      Which revision forms a complete formal sentence from "Although the manager reviewed the proposal carefully. She still had questions"?
    choices:
      - text: "Although she reviewed it carefully, the manager still had questions."
        correct: true
      - text: "Although she reviewed it carefully. The manager still had questions."
        rationale: |
          This leaves the dependent opening as a separate fragment. The second sentence is complete. Check: check each group separated by a period.
      - text: "The manager still had questions. Although she reviewed it carefully."
        rationale: |
          This moves the dependent fragment without attaching it. The order now begins with a complete statement. Check: check the second sentence on its own.
      - text: "Although she reviewed it carefully, because the manager still had questions."
        rationale: |
          This joins two dependent clauses. Both groups have subjects and verbs. Check: find a main clause without a subordinating connector.
    explanation: |
      "Although she reviewed it carefully" is dependent. "The manager still had questions" is independent. Joining them forms one complete sentence.
    approved: true
  - id: "q-grammar-and-structure-phrases-and-clauses-0016"
    type: "phrase-clause-identification"
    difficulty: "easy"
    stem: |
      In "The volunteer who repaired the bench returned today," how is "who repaired the bench" classified?
    choices:
      - text: "Dependent clause"
        correct: true
      - text: "Independent clause"
        rationale: |
          This treats a subject-and-verb group as automatically independent. "Who" and "repaired" form a subject-and-verb relationship. Check: check the relative word linking it to "volunteer".
      - text: "Prepositional phrase"
        rationale: |
          This treats every description after a noun as a prepositional phrase. The group describes the volunteer. Check: look for the verb "repaired".
      - text: "Noun phrase"
        rationale: |
          This classifies the group from the person it refers to. The volunteer is a person. Check: distinguish the noun from the clause describing it.
    explanation: |
      "Who repaired the bench" describes "the volunteer." The relative word "who" links this dependent clause to that noun.
    approved: false
  - id: "q-grammar-and-structure-phrases-and-clauses-0017"
    type: "phrase-clause-identification"
    difficulty: "medium"
    stem: |
      Which group contains a finite clause rather than a prepositional phrase?
    choices:
      - text: "After the bus arrived"
        correct: true
      - text: "After the bus trip"
        rationale: |
          This treats a time-related noun as an action verb. A bus trip is an event. Check: look for a finite verb, not just an event name.
      - text: "Before the last bus"
        rationale: |
          This treats a time relation as a complete clause. The group includes a bus and time information. Check: check whether anything states what the bus did.
      - text: "During the bus journey"
        rationale: |
          This mistakes the noun "journey" for a verb in context. Journey can be an action word elsewhere. Check: check its role after "the bus".
    explanation: |
      "The bus" is the subject, and "arrived" is the finite verb. "After" makes their clause dependent.
    approved: false
  - id: "q-grammar-and-structure-phrases-and-clauses-0018"
    type: "phrase-clause-identification"
    difficulty: "hard"
    stem: |
      Which main clause completes "If the records are accurate, ___" as a full formal sentence?
    choices:
      - text: "the totals will match"
        correct: true
      - text: "because the totals will match"
        rationale: |
          This adds a dependent reason clause. The words give a sensible result. Check: look for a main statement without an opening subordinate connector.
      - text: "when the totals finally match"
        rationale: |
          This adds another dependent clause. The group has a subject and verb. Check: ask whether it can stand as a complete statement.
      - text: "the matching of the totals"
        rationale: |
          This adds a noun phrase. The phrase refers to the expected result. Check: look for a finite verb in the added group.
    explanation: |
      "The totals will match" is a main clause with a subject and a verb. It completes the condition introduced by "If."
    approved: false
  - id: "q-grammar-and-structure-phrases-and-clauses-0019"
    type: "phrase-clause-identification"
    difficulty: "hard"
    stem: |
      In "The driver who found the road closed delayed our delivery," which group is the independent clause?
    choices:
      - text: "The whole sentence"
        correct: true
      - text: "Who found the road closed"
        rationale: |
          This selects the relative clause. The group contains a subject and verb. Check: check which noun "who found the road closed" describes.
      - text: "The driver who found the road closed"
        rationale: |
          This stops before the main verb. The opening group is long and contains a smaller clause. Check: find the verb that states what the whole subject did.
      - text: "Delayed our delivery"
        rationale: |
          This takes the main predicate without its subject. The action seems to express the main point. Check: include the subject of "delayed".
    explanation: |
      The full subject is "The driver who found the road closed." Its main verb is "delayed." The whole sentence is the independent clause. The relative clause "who found the road closed" describes "driver" and is dependent.
    approved: false
  - id: "q-grammar-and-structure-phrases-and-clauses-0020"
    type: "phrase-clause-identification"
    difficulty: "exam"
    stem: |
      Which revision adds a main clause while preserving the contrast in "Even though the team had practiced for weeks"?
    choices:
      - text: "Even though the team had practiced for weeks, it lost."
        correct: true
      - text: "Even though the team had practiced for weeks, because it lost the match."
        rationale: |
          This follows a dependent clause with another dependent clause. Both groups contain subjects and verbs. Check: find a main clause that can stand alone.
      - text: "Even though the team had practiced for weeks, after losing the match."
        rationale: |
          This adds a time phrase without a main clause. The phrase gives a related event. Check: look for the main subject-and-verb statement.
      - text: "Even though the team had practiced for weeks, its loss in the final match."
        rationale: |
          This adds a noun phrase rather than a main clause. The phrase names the contrasting result. Check: check whether a finite verb states that result.
    explanation: |
      "It lost" is an independent clause. It completes the sentence and supplies a result that contrasts with the weeks of practice.
    approved: false
