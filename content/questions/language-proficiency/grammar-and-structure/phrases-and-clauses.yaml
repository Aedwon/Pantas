meta:
  subject: language-proficiency
  topic: grammar-and-structure
  subtopic: phrases-and-clauses
  exams: [ upcat, acet, dlsucet, ustet, dost-sei , cse-pro, cse-sub]
questions:
  - id: q-grammar-and-structure-phrases-and-clauses-0001
    type: phrase-clause-identification
    difficulty: easy
    stem: |
      Is "under the old bridge" a phrase or a clause?
    choices:
      - text: Phrase
        correct: true
      - text: Independent clause
        rationale: |
          You picked independent clause, but there is no verb or subject in "under the old bridge." It is a prepositional phrase.
      - text: Dependent clause
        rationale: |
          You picked dependent clause, but a clause requires both a subject and a verb. This group of words has neither.
      - text: Complete sentence
        rationale: |
          You picked complete sentence, but a complete sentence requires a main subject and verb expressing a full thought.
    explanation: |
      "Under the old bridge" has no subject or verb of its own, so it is a phrase, not a clause.
    approved: true

  - id: q-grammar-and-structure-phrases-and-clauses-0002
    type: phrase-clause-identification
    difficulty: easy
    stem: |
      Is "the cat slept" a phrase or a clause?
    choices:
      - text: Clause
        correct: true
      - text: Phrase
        rationale: |
          You treated this as a phrase. Because it contains the subject "cat" alongside the predicate verb "slept," it qualifies as a clause.
      - text: Sentence fragment only
        rationale: |
          You called it a fragment, but "the cat slept" expresses a complete thought with a subject and verb, making it a full clause.
      - text: Interjection
        rationale: |
          You picked interjection, but an interjection is an exclamation rather than a subject-verb unit.
    explanation: |
      "The cat slept" has a subject ("cat") and a verb ("slept"), making it a clause.
    approved: true

  - id: q-grammar-and-structure-phrases-and-clauses-0003
    type: phrase-clause-identification
    difficulty: medium
    stem: |
      Is "She finished her homework" an independent or a dependent clause?
    choices:
      - text: Independent
        correct: true
      - text: Dependent
        rationale: |
          You picked dependent, but this clause can stand alone as a complete sentence without a subordinating conjunction.
      - text: Phrase
        rationale: |
          You picked phrase, but "she finished her homework" contains a subject ("she") and verb ("finished"), so it is a clause.
      - text: Fragment
        rationale: |
          You called it a fragment, but "she finished her homework" forms a complete thought with subject and predicate.
    explanation: |
      "She finished her homework" has a subject, a verb, and expresses a complete thought on its own, making it an independent clause.
    approved: true

  - id: q-grammar-and-structure-phrases-and-clauses-0004
    type: phrase-clause-identification
    difficulty: medium
    stem: |
      Is "Although she was tired" an independent or a dependent clause?
    choices:
      - text: Dependent
        correct: true
      - text: Independent
        rationale: |
          You picked independent, but the subordinating conjunction "although" makes this clause depend on a main clause to complete the thought.
      - text: Phrase
        rationale: |
          You picked phrase, but "she was tired" contains both a subject ("she") and a verb ("was"), so it is a clause.
      - text: Complete sentence
        rationale: |
          You called it a complete sentence, but "although" leaves the reader waiting for the main clause.
    explanation: |
      "Although she was tired" has a subject and verb, but "although" makes it a dependent clause that needs a main clause.
    approved: true

  - id: q-grammar-and-structure-phrases-and-clauses-0005
    type: phrase-clause-identification
    difficulty: medium
    stem: |
      Combine the dependent clause "Because the store was closed" with an appropriate independent clause to form a complete sentence.
    choices:
      - text: Because the store was closed, we went home instead.
        correct: true
      - text: Because the store was closed, we.
        rationale: |
          You attached the dependent clause to "we," but "we" alone is not an independent clause because it has no predicate verb.
      - text: The store was closed because.
        rationale: |
          You left the subordinating conjunction "because" dangling without the reason clause it introduces.
      - text: Because the store, we went home.
        rationale: |
          You removed the verb from the opening group, so "Because the store" is not the supplied dependent clause.
    explanation: |
      The dependent clause "Because the store was closed" needs an independent clause with its own subject and predicate. "We went home instead" supplies that complete main clause, and the introductory dependent clause is followed by a comma.
    approved: true

  - id: q-grammar-and-structure-phrases-and-clauses-0006
    type: phrase-clause-identification
    difficulty: medium
    stem: |
      Identify the error in this sentence: "Although the teacher explained the lesson twice."
    choices:
      - text: 'This is a sentence fragment: a dependent clause with no independent clause attached'
        correct: true
      - text: There is no error; the sentence is complete
        rationale: |
          You assumed the sentence was complete, but "although" makes the group dependent on a main clause that is missing.
      - text: This is a run-on sentence with too many clauses
        rationale: |
          You misidentified the error as a run-on. This sentence lacks an independent clause instead of joining too many of them.
      - text: This sentence is missing a subject
        rationale: |
          You thought the subject was missing, but "the teacher" is the subject. The missing element is an independent main clause.
    explanation: |
      This is a dependent clause standing alone. It has a subject and verb, but "although" makes it a sentence fragment unless a main clause is attached.
    approved: true

  - id: q-grammar-and-structure-phrases-and-clauses-0007
    type: phrase-clause-identification
    difficulty: medium
    stem: |
      Is "running quickly through the park" a phrase or a clause?
    choices:
      - text: Phrase
        correct: true
      - text: Independent clause
        rationale: |
          You picked independent clause, but "running" is a non-finite verb form here and there is no stated subject forming a finite clause.
      - text: Dependent clause
        rationale: |
          You picked dependent clause, but the group lacks a stated subject paired with a finite verb.
      - text: Complete sentence
        rationale: |
          You called it a complete sentence, but this participial phrase cannot stand alone as a sentence in this form.
    explanation: |
      "Running quickly through the park" lacks a stated subject and finite subject-verb pair, so it functions as a phrase rather than a clause.
    approved: true

  - id: q-grammar-and-structure-phrases-and-clauses-0008
    type: phrase-clause-identification
    difficulty: medium
    stem: |
      Is "When the bell rang" an independent or a dependent clause?
    choices:
      - text: Dependent
        correct: true
      - text: Independent
        rationale: |
          You picked independent, but "when" makes this subject-verb unit dependent on a main clause in this use.
      - text: Phrase
        rationale: |
          You picked phrase, but "the bell rang" contains a subject and a finite verb, so it is a clause.
      - text: Complete sentence
        rationale: |
          You picked complete sentence, but this subordinate use of "when" leaves the thought dependent on what follows.
    explanation: |
      "When the bell rang" has a subject and verb, but the subordinating word "when" makes it a dependent clause in this context.
    approved: true

  - id: q-grammar-and-structure-phrases-and-clauses-0009
    type: phrase-clause-identification
    difficulty: medium
    stem: |
      Is the comma placement correct in this sentence? "Because it was raining, we stayed inside."
    choices:
      - text: 'Yes: an introductory dependent clause is followed by a comma before the independent clause.'
        correct: true
      - text: 'No: commas are never used with dependent clauses.'
        rationale: |
          You treated dependent clauses as incompatible with commas, but an introductory dependent clause normally takes a comma before the main clause.
      - text: 'No: the comma should be removed entirely.'
        rationale: |
          You removed the comma that separates the introductory dependent clause from the main clause.
      - text: 'Yes: but only because "raining" is a gerund.'
        rationale: |
          You linked comma use to the word "raining," but the comma follows from the clause structure, not that word's form.
    explanation: |
      When a dependent clause comes first, standard punctuation places a comma before the following independent clause: "Because it was raining, we stayed inside."
    approved: true

  - id: q-grammar-and-structure-phrases-and-clauses-0010
    type: phrase-clause-identification
    difficulty: medium
    stem: |
      Does this sentence need a comma before "because"? "We stayed inside because it was raining."
    choices:
      - text: 'No: when the independent clause comes first, no comma is typically needed before this essential reason clause.'
        correct: true
      - text: 'Yes: a comma is always required regardless of clause order.'
        rationale: |
          You treated clause order as irrelevant, but a following essential "because" clause normally does not need a comma here.
      - text: 'Yes: but only before "was," not before "because."'
        rationale: |
          You placed a comma between the subject and verb inside the dependent clause.
      - text: 'No: but only because "raining" ends the sentence.'
        rationale: |
          You attributed the rule to the last word instead of the relationship between the clauses.
    explanation: |
      In "We stayed inside because it was raining," the main clause comes first and the following reason clause is essential to the intended meaning, so no comma is normally used before "because."
    approved: true

  - id: q-grammar-and-structure-phrases-and-clauses-0011
    type: phrase-clause-identification
    difficulty: medium
    stem: |
      A student sees the long phrase "Walking slowly along the crowded street toward the old market" and assumes it must be a clause since it is so long. Is this correct?
    choices:
      - text: 'No: length does not make something a clause; this group still lacks a stated subject paired with a finite verb.'
        correct: true
      - text: 'Yes: any group of words longer than five words is automatically a clause.'
        rationale: |
          You used word count to define a clause, but clause status depends on grammatical structure, not length.
      - text: 'Yes: but only because "market" could function as a subject.'
        rationale: |
          You mistook the object of the preposition "toward" for the subject of a clause.
      - text: 'No: but only because phrases can never contain the word "toward."'
        rationale: |
          You invented a rule about one preposition. Phrases can contain "toward"; the issue is the missing finite subject-verb structure.
    explanation: |
      A phrase can be long. This group has no stated subject paired with a finite verb, so its length does not turn it into a clause.
    approved: true

  - id: q-grammar-and-structure-phrases-and-clauses-0012
    type: phrase-clause-identification
    difficulty: medium
    stem: |
      A student writes "Because she was late." as a standalone sentence. Is this a complete sentence in standard formal writing?
    choices:
      - text: 'No: it is a dependent clause used as a sentence fragment; it needs an independent clause to complete the thought.'
        correct: true
      - text: 'Yes: since it has a subject and a verb, it is automatically an independent clause.'
        rationale: |
          You assumed a subject and verb automatically make a clause independent, but "because" subordinates this clause.
      - text: 'Yes: but only because "late" is functioning as an adjective here.'
        rationale: |
          You focused on "late," but the subordinating conjunction "because" controls the clause relationship.
      - text: 'No: but only because "she" is not a valid subject.'
        rationale: |
          You incorrectly rejected "she" as a subject pronoun. The issue is subordination, not the subject.
    explanation: |
      "Because she was late" is a dependent clause. In the standard formal sentence-writing convention being tested, it cannot stand alone as a complete sentence.
    approved: true

  - id: q-grammar-and-structure-phrases-and-clauses-0013
    type: phrase-clause-identification
    difficulty: medium
    stem: |
      A student writes "Because it was raining we stayed inside" without a comma. Is this correctly punctuated in standard formal writing?
    choices:
      - text: 'No: place a comma after the introductory dependent clause: "Because it was raining, we stayed inside."'
        correct: true
      - text: 'Yes: commas are never needed between dependent and independent clauses.'
        rationale: |
          You treated the introductory boundary as unpunctuated, but standard writing marks it with a comma.
      - text: 'Yes: but only because "raining" and "inside" share a similar sound.'
        rationale: |
          You linked punctuation to sound rather than clause structure.
      - text: 'No: but only because the sentence should have no dependent clause at all.'
        rationale: |
          You rejected dependent clauses themselves, but they are normal components of complex sentences.
    explanation: |
      An introductory dependent clause is followed by a comma before the main clause: "Because it was raining, we stayed inside."
    approved: true

  - id: q-grammar-and-structure-phrases-and-clauses-0014
    type: phrase-clause-identification
    difficulty: medium
    stem: |
      Which word in "Since the concert ended late, everyone was tired" signals that the first clause is dependent?
    choices:
      - text: Since
        correct: true
      - text: Concert
        rationale: |
          You picked "concert," which is a noun acting as the subject of the clause, not the subordinating word.
      - text: Ended
        rationale: |
          You picked "ended," which is the verb of the clause, not the conjunction that makes it dependent.
      - text: Everyone
        rationale: |
          You picked "everyone," which is the subject of the following independent clause.
    explanation: |
      "Since" introduces the subordinate clause "since the concert ended late," making that clause dependent on the main clause.
    approved: true

  - id: q-grammar-and-structure-phrases-and-clauses-0015
    type: phrase-clause-identification
    difficulty: exam
    stem: |
      Identify the issue with this pair of sentences and select the corrected version: "Although the manager reviewed the proposal carefully. She still had questions."
    choices:
      - text: The first part is a sentence fragment; corrected, it should read "Although the manager reviewed the proposal carefully, she still had questions."
        correct: true
      - text: There is no error; both sentences are already complete and correctly punctuated.
        rationale: |
          You assumed both were complete, but the first group begins with "although" and is a dependent clause standing alone.
      - text: The second sentence, "She still had questions," is the fragment, not the first.
        rationale: |
          You misidentified the fragment. "She still had questions" is an independent clause and can stand alone.
      - text: The correction should remove the comma and keep them as two separate sentences.
        rationale: |
          You kept the dependent clause as its own sentence. It needs to be attached to an independent clause in this standard formal construction.
    explanation: |
      "Although the manager reviewed the proposal carefully" is a dependent clause standing alone. Joining it to "she still had questions" with the appropriate comma creates a complete complex sentence.
    approved: true
