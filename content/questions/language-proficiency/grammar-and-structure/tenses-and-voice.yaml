meta:
  subject: language-proficiency
  topic: grammar-and-structure
  subtopic: tenses-and-voice
  exams: [ upcat, acet, dlsucet, ustet, dost-sei , cse-pro, cse-sub]
questions:
  - id: q-grammar-and-structure-tenses-and-voice-0001
    type: tense
    difficulty: easy
    stem: |
      Identify the error in this sentence: "Yesterday, she walks to the store and bought some bread."
    choices:
      - text: Walks should be walked to match the past tense of bought
        correct: true
      - text: Bought should be buys to match walks
        rationale: |
          You changed "bought" to present tense, but "yesterday" clearly sets the sentence in the past.
      - text: There is no error; the sentence is correct
        rationale: |
          You assumed the sentence was fine, but switching from past to present ("walks... bought") breaks tense consistency.
      - text: Both verbs should be in future tense
        rationale: |
          You suggested future tense, but "yesterday" dictates that the actions took place in the past.
    explanation: |
      The sentence describes actions that happened yesterday, so both verbs should be in the past tense. "Bought" is correct, but "walks" should be "walked."
    approved: true

  - id: q-grammar-and-structure-tenses-and-voice-0002
    type: tense
    difficulty: easy
    stem: |
      Is this sentence active or passive voice? "The dog chased the ball."
    choices:
      - text: 'Active: the subject "dog" performs the action'
        correct: true
      - text: 'Passive: the subject receives the action'
        rationale: |
          You called it passive, but the subject "dog" actively performs the action of chasing.
      - text: Neither; this sentence has no voice
        rationale: |
          You claimed the sentence has no voice, but this transitive clause is in the active voice: the subject performs the action.
      - text: Both active and passive simultaneously
        rationale: |
          You claimed it is both active and passive, but this clause is structured in the active voice.
    explanation: |
      The subject "dog" performs the action of chasing, making this active voice.
    approved: true

  - id: q-grammar-and-structure-tenses-and-voice-0003
    type: tense
    difficulty: easy
    stem: |
      Is this sentence active or passive voice? "The ball was chased by the dog."
    choices:
      - text: 'Passive: the subject "ball" receives the action'
        correct: true
      - text: 'Active: the subject performs the action'
        rationale: |
          You called it active, but the subject "ball" receives the action rather than performing it.
      - text: Neither; this sentence has no voice
        rationale: |
          You claimed the sentence has no voice, but "was chased" clearly establishes a passive construction.
      - text: Both active and passive simultaneously
        rationale: |
          You claimed it is both active and passive, but this clause is structured in the passive voice.
    explanation: |
      The subject "ball" receives the action, and "was chased" uses a form of "to be" plus the past participle: this is passive voice.
    approved: true

  - id: q-grammar-and-structure-tenses-and-voice-0004
    type: tense
    difficulty: medium
    stem: |
      Rewrite this passive sentence in active voice: "The novel was written by a famous author."
    choices:
      - text: A famous author wrote the novel.
        correct: true
      - text: The novel wrote a famous author.
        rationale: |
          You reversed the logical roles, making the novel perform the action of writing an author.
      - text: A famous author was writing the novel.
        rationale: |
          You used past continuous ("was writing") instead of simple past ("wrote"), which alters the original simple past tense.
      - text: The novel is written by a famous author.
        rationale: |
          You kept the sentence in passive voice and shifted the verb tense from past to present.
    explanation: |
      To convert to active voice, make the doer ("a famous author") the subject and have it directly perform the verb: "A famous author wrote the novel."
    approved: true

  - id: q-grammar-and-structure-tenses-and-voice-0005
    type: tense
    difficulty: medium
    stem: |
      Choose the correct verb form: By the time the guests arrived, she ______ the entire meal.
    choices:
      - text: Had cooked
        correct: true
      - text: Cooked
        rationale: |
          You picked simple past "cooked," but the sentence presents the meal as already completed at the past reference point set by "by the time the guests arrived." Past perfect makes that prior completion explicit.
      - text: Cooks
        rationale: |
          You picked simple present "cooks," but the sentence describes a past timeline ("the guests arrived").
      - text: Will cook
        rationale: |
          You picked future tense "will cook," but the reference point is in the past.
    explanation: |
      "By the time the guests arrived" sets a past reference point and the meal is presented as completed before that point. "Had cooked" is the best form for that earlier completed action.
    approved: true

  - id: q-grammar-and-structure-tenses-and-voice-0006
    type: tense
    difficulty: medium
    stem: |
      Identify the error in this sentence: "Last week, the team practiced hard and wins the championship game."
    choices:
      - text: Wins should be won to match the past tense of practiced
        correct: true
      - text: Practiced should be practices to match wins
        rationale: |
          You shifted "practiced" to present tense, but "last week" requires the actions in this sentence to be narrated in the past.
      - text: There is no error; the sentence is correct
        rationale: |
          You assumed the sentence was correct, but mixing past ("practiced") with present ("wins") creates an unjustified tense shift.
      - text: Both verbs should be in present tense
        rationale: |
          You suggested present tense for both verbs, but "last week" indicates past actions.
    explanation: |
      The sentence describes actions that happened last week, so both verbs should be in the past tense. "Practiced" is correct, but "wins" should be "won."
    approved: true

  - id: q-grammar-and-structure-tenses-and-voice-0007
    type: tense
    difficulty: medium
    stem: |
      Rewrite this active sentence in passive voice: "The committee approved the new budget."
    choices:
      - text: The new budget was approved by the committee.
        correct: true
      - text: The committee was approved by the new budget.
        rationale: |
          You reversed the agent and object, claiming the budget approved the committee.
      - text: The new budget approves the committee.
        rationale: |
          You changed to active voice with reversed roles and shifted past tense to present tense.
      - text: The committee approves the new budget was.
        rationale: |
          You created an ungrammatical sentence structure with misplaced auxiliary verbs.
    explanation: |
      To convert to passive voice, make the receiver ("the new budget") the subject and use "was" plus the past participle "approved," with the doer introduced by "by."
    approved: true

  - id: q-grammar-and-structure-tenses-and-voice-0008
    type: tense
    difficulty: medium
    stem: |
      Alin sa mga sumusunod ang perpektibo (tapos na) na aspekto ng pandiwang ugat na "kain"?
    choices:
      - text: Kumain
        correct: true
      - text: Kumakain
        rationale: |
          Pinili mo ang "kumakain," ngunit ito ay imperpektibo (kasalukuyang ginagawa) at hindi perpektibo.
      - text: Kakain
        rationale: |
          Pinili mo ang "kakain," ngunit ito ay kontemplatibo (gagawin pa lamang) at hindi perpektibo.
      - text: Kainin
        rationale: |
          Pinili mo ang "kainin," ngunit hindi ito ang aspektong perpektibo na hinihingi ng tanong.
    explanation: |
      Ang "kumain" ay perpektibo, dahil tapos na ang kilos ng pagkain.
    approved: true

  - id: q-grammar-and-structure-tenses-and-voice-0009
    type: tense
    difficulty: medium
    stem: |
      Alin sa mga sumusunod ang imperpektibo (nagaganap) na aspekto ng pandiwang ugat na "kain"?
    choices:
      - text: Kumakain
        correct: true
      - text: Kumain
        rationale: |
          Pinili mo ang "kumain," ngunit ito ay perpektibo (nagawa na) at hindi imperpektibo.
      - text: Kakain
        rationale: |
          Pinili mo ang "kakain," ngunit ito ay kontemplatibo (gagawin pa) at hindi imperpektibo.
      - text: Kainin
        rationale: |
          Pinili mo ang "kainin," ngunit hindi ito ang aspektong imperpektibo na hinihingi ng tanong.
    explanation: |
      Ang "kumakain" ay imperpektibo, dahil nagaganap pa ang kilos ng pagkain.
    approved: true

  - id: q-grammar-and-structure-tenses-and-voice-0010
    type: tense
    difficulty: medium
    stem: |
      Alin sa mga sumusunod ang kontemplatibo (magaganap pa) na aspekto ng pandiwang ugat na "kain"?
    choices:
      - text: Kakain
        correct: true
      - text: Kumain
        rationale: |
          Pinili mo ang "kumain," ngunit ito ay perpektibo (natapos na) at hindi kontemplatibo.
      - text: Kumakain
        rationale: |
          Pinili mo ang "kumakain," ngunit ito ay imperpektibo (ginagawa pa) at hindi kontemplatibo.
      - text: Kainin
        rationale: |
          Pinili mo ang "kainin," ngunit hindi ito ang aspektong kontemplatibo na hinihingi ng tanong.
    explanation: |
      Ang "kakain" ay kontemplatibo, dahil hindi pa nagsisimula ang kilos ng pagkain.
    approved: true

  - id: q-grammar-and-structure-tenses-and-voice-0011
    type: tense
    difficulty: medium
    stem: |
      Sa pangungusap na "Kinain ng bata ang mangga," ano ang pokus (focus) ng pandiwa?
    choices:
      - text: Pokus sa bagay (ang mangga)
        correct: true
      - text: Pokus sa tagaganap (ang bata)
        rationale: |
          Pinili mo ang tagaganap, ngunit ang "ang" ay nakaturo sa "mangga" (bagay) at hindi sa bata.
      - text: Walang pokus
        rationale: |
          Inakala mong walang pokus, ngunit sa pangungusap na ito ay malinaw na minarkahan ng "ang" ang bagay na pokus ng pandiwa.
      - text: Pokus sa oras
        rationale: |
          Pinili mo ang oras, ngunit walang pariralang panahong siyang pokus sa istraktura ng pangungusap na ito.
    explanation: |
      Sa pangungusap na ito, "ang mangga" (ang bagay na kinain) ang minarkahan ng "ang," kaya ang pandiwa ay naka-pokus sa bagay, hindi sa tagaganap.
    approved: true

  - id: q-grammar-and-structure-tenses-and-voice-0012
    type: tense
    difficulty: hard
    stem: |
      A student writes "She walked to the store and buys bread," switching from past to present tense mid-sentence. Is this correct?
    choices:
      - text: 'No: the sentence presents both actions in the same past timeline, so it should read "walked... and bought."'
        correct: true
      - text: 'Yes: switching tense mid-sentence is always acceptable for variety.'
        rationale: |
          You assumed switching tense adds variety, but an unexplained shift changes the timeline.
      - text: 'Yes: but only because "store" and "bread" are different nouns.'
        rationale: |
          You linked verb tense consistency to noun differences, which is irrelevant.
      - text: 'No: but only because "walked" should actually be changed to present tense instead.'
        rationale: |
          You changed the first action instead of following the past timeline already established by "walked."
    explanation: |
      The sentence presents both actions as part of one past sequence. "Walked ... and bought" keeps that timeline consistent; a tense shift would need a real change in time or viewpoint.
    approved: true

  - id: q-grammar-and-structure-tenses-and-voice-0013
    type: tense
    difficulty: hard
    stem: |
      A student sees "She is happy" and assumes it must be passive voice, since it uses the word "is." Is this correct?
    choices:
      - text: 'No: "happy" is an adjective, not a past participle describing an action done to the subject; passive voice requires an appropriate passive verb construction, typically a form of "be" plus a past participle.'
        correct: true
      - text: 'Yes: any sentence with "is," "was," or "were" is automatically passive voice.'
        rationale: |
          You assumed a form of "be" alone creates passive voice, but "be" also functions as a linking verb.
      - text: 'Yes: but only because "happy" sounds like a participle.'
        rationale: |
          You mistook the descriptive adjective "happy" for a verb participle.
      - text: 'No: but only because "she" cannot be a subject in passive voice.'
        rationale: |
          You claimed "she" cannot be a passive subject, but pronouns can be subjects in passive constructions.
    explanation: |
      "She is happy" uses "is" as a linking verb followed by the adjective "happy." A form of "be" does not by itself make a clause passive.
    approved: true

  - id: q-grammar-and-structure-tenses-and-voice-0014
    type: tense
    difficulty: hard
    stem: |
      A student writes "She finished the report before her boss asked for it," using simple past for both actions. Is the sentence grammatically acceptable?
    choices:
      - text: 'Yes: "before" already makes the order of the two past events clear. "She had finished the report before her boss asked for it" is also possible when the writer wants to emphasize the earlier completion.'
        correct: true
      - text: 'No: whenever one past action happens before another, the earlier action must use past perfect.'
        rationale: |
          You turned a useful tense choice into an absolute rule. Past perfect can mark the earlier event, but an explicit time connector such as "before" can already make the sequence clear.
      - text: 'Yes: but only because "report" is a singular noun.'
        rationale: |
          You linked tense choice to noun number, which does not determine whether simple past or past perfect is appropriate.
      - text: 'No: the later action "asked" must use past perfect instead.'
        rationale: |
          You put past perfect on the later event. If past perfect is used here, it would mark the earlier completion: "had finished."
    explanation: |
      The simple-past sentence is grammatical because "before" explicitly orders the events. Past perfect remains available to emphasize that the report was already complete before the later request, but it is not mandatory merely because one past event happened first.
    approved: true

  - id: q-grammar-and-structure-tenses-and-voice-0015
    type: tense
    difficulty: medium
    stem: |
      Identify the tense: "She will write a letter tomorrow."
    choices:
      - text: Simple future
        correct: true
      - text: Simple past
        rationale: |
          You picked simple past, but "will write" refers to an action that has not happened yet.
      - text: Present perfect
        rationale: |
          You picked present perfect, but "will write" uses the modal "will" indicating future time.
      - text: Past perfect
        rationale: |
          You picked past perfect, but "will write" points to the future, not a completed past event.
    explanation: |
      "Will write" describes an action that has not happened yet: this is simple future tense.
    approved: true

  - id: q-grammar-and-structure-tenses-and-voice-0016
    type: tense
    difficulty: medium
    stem: |
      Identify the tense: "She has written three letters this week."
    choices:
      - text: Present perfect
        correct: true
      - text: Simple past
        rationale: |
          You picked simple past, but "has written" uses the present-perfect auxiliary "has" plus the past participle.
      - text: Simple future
        rationale: |
          You picked simple future, but "has written" describes completed writing within a time period connected to the present.
      - text: Past perfect
        rationale: |
          You picked past perfect, but "has written" uses the present auxiliary "has" rather than "had."
    explanation: |
      "Has written" is present perfect: "has" plus the past participle "written." The unfinished time expression "this week" also fits a present-perfect reading.
    approved: true

  - id: q-grammar-and-structure-tenses-and-voice-0017
    type: tense
    difficulty: medium
    stem: |
      Identify the tense: "She is writing a letter right now."
    choices:
      - text: Present progressive
        correct: true
      - text: Simple present
        rationale: |
          You picked simple present, but "is writing" describes an action currently in progress.
      - text: Simple future
        rationale: |
          You picked simple future, but "is writing" refers to what is happening right now.
      - text: Present perfect
        rationale: |
          You picked present perfect, but "is writing" shows ongoing action, not completed action.
    explanation: |
      "Is writing" describes an action happening right now: this is present progressive tense.
    approved: true

  - id: q-grammar-and-structure-tenses-and-voice-0018
    type: tense
    difficulty: exam
    stem: |
      In the sentence "By the time the manager reviewed it, the report had already been submitted by the intern," identify (1) the tense of "had already been submitted" and (2) whether this clause is active or passive voice.
    choices:
      - text: '(1) Past perfect, (2) Passive voice: "had" marks past perfect, while the report receives the action in "been submitted"'
        correct: true
      - text: (1) Simple past, (2) Active voice
        rationale: |
          You misidentified both tense and voice: "had been submitted" is a past-perfect passive construction.
      - text: (1) Past perfect, (2) Active voice
        rationale: |
          You identified the past perfect tense correctly but missed that the report receives the action.
      - text: (1) Present perfect, (2) Passive voice
        rationale: |
          You identified the passive voice but misread "had" as present perfect instead of past perfect.
    explanation: |
      "Had already been submitted" is past perfect because it uses "had" plus the participial verb phrase, and it is passive because the subject "report" receives the action of submission.
    approved: true
