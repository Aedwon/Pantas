    stem: |
      "Naglilinis pa ng bulwagan sina Liza at Omar nang dumating ang pinuno kahapon." Sinabi ng isang kawani na perpektibo ang pandiwa dahil may "kahapon" at pokus sa ganapan dahil may "bulwagan."
      Aling pagsusuri ang tama?
    choices:
      - text: "Imperpektibo; pokus sa tagaganap."
        correct: true
      - text: "Perpektibo at pokus sa ganapan ang naglilinis."
        rationale: |
          Oras sa nakaraan at lugar lang ang batayan nito. Nagpapatuloy pa ang paglilinis. Sina Liza at Omar ang paksa.
      - text: "Imperpektibo at pokus sa ganapan ang naglilinis."
        rationale: |
          Tama ang aspekto, ngunit mali ang pokus. Hindi paksa ang "ng bulwagan." "Sina Liza at Omar" ang paksa.
      - text: "Perpektibo at pokus sa tagaganap ang naglilinis."
        rationale: |
          Tama ang pokus, ngunit mali ang aspekto. Nagpapatuloy pa ang paglilinis nang dumating ang pinuno, ayon sa "naglilinis pa."
    explanation: |
      Nagpapatuloy pa ang paglilinis sa sandaling iyon sa nakaraan, kaya imperpektibo ang aspekto. "Sina Liza at Omar" ang paksa. Sila ang naglilinis, kaya pokus sa tagaganap ito.
    approved: true
