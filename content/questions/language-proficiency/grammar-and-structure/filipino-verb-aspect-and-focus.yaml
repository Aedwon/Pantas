questions:
  - id: "q-grammar-and-structure-tenses-and-voice-0008"
    type: "tense"
    difficulty: "medium"
    stem: |
      Alin sa mga sumusunod ang perpektibo (tapos na) na aspekto ng pandiwang ugat na "kain"?
    choices:
      - text: "Kumain"
        correct: true
      - text: "Kumakain"
        rationale: |
          This selects the ongoing aspect. It shares the root "kain". Check: check whether the form presents completed or ongoing eating.
      - text: "Kakain"
        rationale: |
          This selects the contemplated aspect. It still names an eating action. Check: match the requested completed aspect.
      - text: "Kainin"
        rationale: |
          This selects a different directive form. It contains the familiar eating root. Check: use the lesson's completed example, with event context.
    explanation: |
      In the lesson's example pattern, "kumain" presents the eating as completed. It is the perpektibo form requested.
    approved: true
  - id: "q-grammar-and-structure-tenses-and-voice-0009"
    type: "tense"
    difficulty: "medium"
    stem: |
      Alin sa mga sumusunod ang imperpektibo (nagaganap) na aspekto ng pandiwang ugat na "kain"?
    choices:
      - text: "Kumakain"
        correct: true
      - text: "Kumain"
        rationale: |
          This selects the completed aspect. The same root names the eating action. Check: match the ongoing meaning requested.
      - text: "Kakain"
        rationale: |
          This selects a contemplated action. The action might happen after the present. Check: keep the requested in-progress meaning.
      - text: "Kainin"
        rationale: |
          This selects a different directive form. It contains the familiar eating root. Check: identify the ongoing example in the lesson.
    explanation: |
      "Kumakain" presents eating as ongoing in the lesson's example pattern. It is the imperpektibo form.
    approved: true
  - id: "q-grammar-and-structure-tenses-and-voice-0010"
    type: "tense"
    difficulty: "medium"
    stem: |
      Alin sa mga sumusunod ang kontemplatibo (magaganap pa) na aspekto ng pandiwang ugat na "kain"?
    choices:
      - text: "Kakain"
        correct: true
      - text: "Kumain"
        rationale: |
          This selects the completed aspect. The form names the same action. Check: check whether the action is already done.
      - text: "Kumakain"
        rationale: |
          This selects the ongoing aspect. It refers to eating near the present. Check: choose the form for an action still contemplated.
      - text: "Kainin"
        rationale: |
          This selects a different directive form. It concerns an action that someone may perform. Check: use the lesson's contemplated example.
    explanation: |
      "Kakain" presents eating as still contemplated in the lesson's example pattern. It is the kontemplatibo form.
    approved: true
  - id: "q-grammar-and-structure-tenses-and-voice-0011"
    type: "tense"
    difficulty: "medium"
    stem: |
      Sa pangungusap na "Kinain ng bata ang mangga," ano ang pokus (focus) ng pandiwa?
    choices:
      - text: "Pokus sa bagay (ang mangga)"
        correct: true
      - text: "Pokus sa tagaganap (ang bata)"
        rationale: |
          This treats the doer as the focus. The child performs the action, so that role can seem like the focus. Check which noun phrase starts with "ang."
      - text: "Walang pokus"
        rationale: |
          This overlooks the verb's focus pattern. The sentence names both a doer and an object, which may hide their different roles. Check the verb form together with the "ang" phrase.
      - text: "Pokus sa oras"
        rationale: |
          This treats a completed action as a focus on time. The verb shows that eating happened, so time may seem relevant. Check whether an actual time phrase is marked as the focus.
    explanation: |
      "Kinain" puts the object that was eaten in focus. "Ang mangga" names that object, so the verb has object focus.
    approved: true
