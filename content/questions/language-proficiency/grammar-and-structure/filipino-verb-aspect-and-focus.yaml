questions:
  - id: "q-grammar-and-structure-tenses-and-voice-0008"
    lesson: lesson-grammar-and-structure-kalagayan-ng-kilos
    keyPoint: 1
    type: "tense"
    difficulty: "medium"
    stem: |
      Alin sa mga sumusunod ang perpektibo (tapos na) na aspekto ng pandiwang ugat na "kain"?
    choices:
      - text: "Kumain"
        correct: true
      - text: "Kumakain"
        rationale: |
          Nagaganap ang kilos sa "kumakain." Pareho ang ugat na "kain." Tingnan kung tapos na o nagpapatuloy ang pagkain.
      - text: "Kakain"
        rationale: |
          Magaganap pa ang kilos sa "kakain." Tungkol pa rin ito sa pagkain. Piliin ang anyong nagsasaad ng tapos nang kilos.
      - text: "Kainin"
        rationale: |
          Ibang anyo ang "kainin," na maaaring gamitin sa pag-uutos. May ugat din itong "kain." Balikan ang halimbawa ng tapos nang kilos sa aralin.
    explanation: |
      Sa halimbawang gamit ng aralin, tapos na ang pagkain sa "kumain." Ito ang hinihinging anyong perpektibo.
    approved: true
  - id: "q-grammar-and-structure-tenses-and-voice-0009"
    lesson: lesson-grammar-and-structure-kalagayan-ng-kilos
    keyPoint: 1
    type: "tense"
    difficulty: "medium"
    stem: |
      Alin sa mga sumusunod ang imperpektibo (nagaganap) na aspekto ng pandiwang ugat na "kain"?
    choices:
      - text: "Kumakain"
        correct: true
      - text: "Kumain"
        rationale: |
          Tapos na ang kilos sa "kumain." Pareho ang ugat na "kain." Ang hinihingi ay nagpapatuloy na kilos.
      - text: "Kakain"
        rationale: |
          Magaganap pa ang kilos sa "kakain." Maaari itong mangyari pagkatapos ng kasalukuyan. Piliin ang anyong nagpapakita ng kilos na nagpapatuloy.
      - text: "Kainin"
        rationale: |
          Ibang anyo ang "kainin," na maaaring gamitin sa pag-uutos. May ugat din itong "kain." Hanapin ang halimbawa ng nagaganap na kilos sa aralin.
    explanation: |
      Sa halimbawang gamit ng aralin, nagpapatuloy ang pagkain sa "kumakain." Ito ang anyong imperpektibo.
    approved: true
  - id: "q-grammar-and-structure-tenses-and-voice-0010"
    lesson: lesson-grammar-and-structure-kalagayan-ng-kilos
    keyPoint: 1
    type: "tense"
    difficulty: "medium"
    stem: |
      Alin sa mga sumusunod ang kontemplatibo (magaganap pa) na aspekto ng pandiwang ugat na "kain"?
    choices:
      - text: "Kakain"
        correct: true
      - text: "Kumain"
        rationale: |
          Tapos na ang kilos sa "kumain." Pareho ang kilos na tinutukoy. Tingnan kung nagawa na ang kilos.
      - text: "Kumakain"
        rationale: |
          Nagaganap ang kilos sa "kumakain." Maaaring iugnay ito sa kasalukuyan. Piliin ang anyo para sa kilos na magaganap pa.
      - text: "Kainin"
        rationale: |
          Ibang anyo ang "kainin," na maaaring gamitin sa pag-uutos. Tungkol ito sa kilos na maaaring gawin. Balikan ang halimbawa ng kontemplatibo sa aralin.
    explanation: |
      Sa halimbawang gamit ng aralin, magaganap pa ang pagkain sa "kakain." Ito ang anyong kontemplatibo.
    approved: true
  - id: "q-grammar-and-structure-tenses-and-voice-0011"
    lesson: lesson-grammar-and-structure-ugnayan-ng-pandiwa-at-paksa
    keyPoint: 1
    type: "tense"
    difficulty: "medium"
    stem: |
      Sa pangungusap na "Kinain ng bata ang mangga," ano ang pokus (focus) ng pandiwa?
    choices:
      - text: "Pokus sa bagay (ang mangga)"
        correct: true
      - text: "Pokus sa tagaganap (ang bata)"
        rationale: |
          Itinuturing nitong pokus ang gumagawa. Ang bata ang kumain, kaya maaaring mapili siya. Tingnan kung aling parirala ang nagsisimula sa "ang."
      - text: "Walang pokus"
        rationale: |
          Hindi nito napapansin ang pokus ng pandiwa. Parehong binanggit ang gumagawa at ang bagay na kinain. Suriin ang anyo ng pandiwa at ang pariralang may "ang."
      - text: "Pokus sa oras"
        rationale: |
          Itinuturing nitong pokus sa oras ang tapos nang kilos. Naganap na ang pagkain, kaya maaaring mapansin ang oras. Tingnan kung may pariralang nagsasaad ng oras na siyang paksa.
    explanation: |
      Itinatampok ng "kinain" ang bagay na kinain. Ang "ang mangga" ang tumutukoy sa bagay na ito, kaya pokus sa bagay ang pandiwa.
    approved: true
  - id: "q-grammar-and-structure-filipino-verb-aspect-and-focus-0001"
    lesson: lesson-grammar-and-structure-kalagayan-ng-kilos
    keyPoint: 1
    type: "tense"
    difficulty: "easy"
    stem: |
      Natapos na ang paglilinis ng tanggapan kahapon. Alin ang angkop na pandiwa sa pangungusap na "___ ng tanggapan si Mila kahapon"?
    choices:
      - text: "Maglilinis"
        rationale: |
          Ang "maglilinis" ay para sa kilos na hindi pa nagsisimula. Tapos na ang paglilinis sa tanong.
      - text: "Naglinis"
        correct: true
      - text: "Naglilinis"
        rationale: |
          Ang "naglilinis" ay nagpapakita ng nagpapatuloy o paulit-ulit na paglilinis. Tapos na ang gawain ayon sa tanong.
      - text: "Kalilinis lang"
        rationale: |
          Katatapos lamang ng kilos sa "kalilinis lang." Tapos na kahapon ang gawain sa tanong. Kailangan din ng anyong ito ang "ni Mila" sa halip na "si Mila."
    explanation: |
      Ipinapakita ng "naglinis" na tapos na ang paglilinis. Perpektibo ang aspektong ito.
    approved: true
  - id: "q-grammar-and-structure-filipino-verb-aspect-and-focus-0002"
    lesson: lesson-grammar-and-structure-kalagayan-ng-kilos
    keyPoint: 2
    type: "tense"
    difficulty: "easy"
    stem: |
      Sinabi ng kawani, "Kadarating lang ng mga dokumento."
      Anong aspekto ang ipinapakita ng "kadarating"?
    choices:
      - text: "Kontemplatibo"
        rationale: |
          Dumating na ang mga dokumento. Hindi sa hinaharap ang pagdating.
      - text: "Imperpektibo"
        rationale: |
          Katatapos lang ng pagdating. Hindi ito ipinapakitang nagpapatuloy pa.
      - text: "Perpektibong katatapos"
        correct: true
      - text: "Perpektibo na walang pahiwatig na katatapos lamang"
        rationale: |
          Tiyak na katatapos lang ng pagdating ayon sa "kadarating lang." Hindi napapansin ng sagot ang detalyeng ito.
    explanation: |
      Ang "kadarating lang" ay nagsasabing kararating lamang ng mga dokumento. Perpektibong katatapos ang aspekto.
    approved: true
  - id: "q-grammar-and-structure-filipino-verb-aspect-and-focus-0003"
    lesson: lesson-grammar-and-structure-ugnayan-ng-pandiwa-at-paksa
    keyPoint: 1
    type: "tense"
    difficulty: "easy"
    stem: |
      Sa "Nagluto ng pagkain para sa mga bisita si Rosa," alin ang wastong pagtukoy sa paksa at sa pokus ng pandiwa?
    choices:
      - text: "Si Rosa ang paksa; pokus sa tagaganap."
        correct: true
      - text: "Ang pagkain ang paksa; pokus sa layon."
        rationale: |
          Ang pagkain ang tumatanggap ng kilos, ngunit may panandang "ng" ito. "Si Rosa" ang paksa rito.
      - text: "Ang mga bisita ang paksa; pokus sa tagatanggap."
        rationale: |
          Nakikinabang ang mga bisita sa pagluluto. Ngunit hindi paksa ng pangungusap ang "para sa mga bisita."
      - text: "Si Rosa ang paksa; pokus sa tagatanggap."
        rationale: |
          Si Rosa ang nagluluto. Hindi siya ipinakikilala bilang tumatanggap ng pakinabang.
    explanation: |
      "Si Rosa" ang paksa. Siya ang nagluluto, kaya pokus sa tagaganap ang pandiwa.
    approved: true
  - id: "q-grammar-and-structure-filipino-verb-aspect-and-focus-0004"
    lesson: lesson-grammar-and-structure-mga-pahiwatig-ng-oras
    keyPoint: 2
    type: "tense"
    difficulty: "medium"
    stem: |
      "Naglilinis ng bulwagan ang mga kawani tuwing Sabado."
      Bakit imperpektibo ang "naglilinis" sa pangungusap?
    choices:
      - text: "Sapagkat natapos na ang lahat ng paglilinis."
        rationale: |
          Itinuturing nitong iisang tapos na kilos ang paulit-ulit na gawain. May pag-uulit ayon sa "tuwing Sabado."
      - text: "Sapagkat hindi pa nila nasisimulan ang gawain kahit minsan."
        rationale: |
          Ang regular na gawain ay hindi kilos na hindi pa nasisimulan. Kontemplatibo ang para sa hindi pa nasisimulang kilos.
      - text: "Sapagkat katatapos lamang nilang maglinis."
        rationale: |
          Lingguhang gawain ang sinasabi. Walang anyong katatapos lamang gaya ng "kalilinis lang."
      - text: "Sapagkat nagpapahayag ito ng paulit-ulit na gawain."
        correct: true
    explanation: |
      Maaaring magpakita ng paulit-ulit na kilos ang imperpektibo. Iskedyul ang ibinibigay ng "tuwing Sabado." Hindi kailangang naglilinis sila sa mismong oras ng pagsasalita.
    approved: true
  - id: "q-grammar-and-structure-filipino-verb-aspect-and-focus-0005"
    lesson: lesson-grammar-and-structure-mga-pahiwatig-ng-oras
    keyPoint: 1
    type: "correct-usage"
    difficulty: "medium"
    stem: |
      Ilipat sa hulihan ang pahiwatig ng oras sa "Bukas ay magsusumite si Elena ng ulat." Alin ang nagpapanatili sa oras at aspekto ng kilos?
    choices:
      - text: "Nagsumite si Elena ng ulat kahapon."
        rationale: |
          Ginagawa nitong tapos nang kilos kahapon ang nakaplanong pagsusumite.
      - text: "Magsusumite si Elena ng ulat bukas."
        correct: true
      - text: "Nagsusumite si Elena ng ulat ngayon."
        rationale: |
          Ginagawa nitong kasalukuyang kilos ang pagsusumite. Parehong nagbago ang pahiwatig ng oras at anyo ng pandiwa.
      - text: "Magsusumite si Elena ng ulat kahapon."
        rationale: |
          Pinalitan ng "kahapon" ang "bukas." Hindi nito pinananatili ang orihinal na oras.
    explanation: |
      Maaaring ilagay ang "bukas" sa hulihan. Nananatili ang nakaplanong kilos at oras kapag ginamit pa rin ang "magsusumite" at "bukas."
    approved: true
  - id: "q-grammar-and-structure-filipino-verb-aspect-and-focus-0006"
    lesson: lesson-grammar-and-structure-ugnayan-ng-pandiwa-at-paksa
    keyPoint: 3
    type: "tense"
    difficulty: "medium"
    stem: |
      Sa "Ipinagluto ng kusinero ng lugaw ang mga bata," ano ang pokus ng pandiwa batay sa papel ng paksa?
    choices:
      - text: "Tagaganap, dahil ang kusinero ang nagluto."
        rationale: |
          Ang kusinero ang gumagawa, ngunit hindi paksa ang "ng kusinero." Ang paksa ay "ang mga bata."
      - text: "Layon, dahil ang lugaw ang niluto."
        rationale: |
          Ang lugaw ang niluto, ngunit may panandang "ng" ito. Hindi ito ang paksa.
      - text: "Tagatanggap; nakinabang ang mga bata."
        correct: true
      - text: "Kagamitan, dahil ang mga bata ang ginamit sa pagluluto."
        rationale: |
          Ang mga bata ang tumatanggap ng pakinabang. Hindi sila kagamitan sa pagluluto.
    explanation: |
      "Ang mga bata" ang paksa. Ipinagluluto sila ng kusinero. Pokus sa tagatanggap ito.
    approved: true
  - id: "q-grammar-and-structure-filipino-verb-aspect-and-focus-0007"
    lesson: lesson-grammar-and-structure-ugnayan-ng-pandiwa-at-paksa
    keyPoint: 3
    type: "tense"
    difficulty: "medium"
    stem: |
      "Ipinangsulat ni Teresa ng pangalan ang lapis."
      Aling parirala ang paksa, at ano ang papel nito sa kilos?
    choices:
      - text: "Ni Teresa; siya ang tagaganap."
        rationale: |
          Si Teresa ang sumusulat, ngunit hindi paksa ang "ni Teresa." Hanapin ang pariralang may "ang."
      - text: "Ng pangalan; ito ang layon."
        rationale: |
          Ang pangalan ang isinulat, ngunit hindi paksa ang "ng pangalan."
      - text: "Ang lapis; ito ang sanhi ng damdamin."
        rationale: |
          Ang lapis ang paksa, ngunit gamit ito sa pagsulat. Walang binanggit na damdaming dulot nito.
      - text: "Ang lapis; kagamitan sa pagsulat."
        correct: true
    explanation: |
      "Ang lapis" ang paksa. Ginagamit ito ni Teresa sa pagsulat. Pokus sa kagamitan ito dahil ang paksa ang gamit sa kilos.
    approved: true
  - id: "q-grammar-and-structure-filipino-verb-aspect-and-focus-0008"
    lesson: lesson-grammar-and-structure-ugnayan-ng-pandiwa-at-paksa
    keyPoint: 3
    type: "tense"
    difficulty: "medium"
    stem: |
      "Ikinatuwa ng mga kawani ang balita tungkol sa tanggapan."
      Aling pagsusuri sa pokus ang tama?
    choices:
      - text: "Pokus sa sanhi, dahil ang balita ang dahilan ng tuwa."
        correct: true
      - text: "Pokus sa tagaganap, dahil ang mga kawani ang natuwa."
        rationale: |
          Pinipili nito ang mga taong natuwa bilang paksa. "Ang balita" ang paksa, hindi "ng mga kawani."
      - text: "Pokus sa layon, dahil ang balita ang bagay na ginawa ng mga kawani."
        rationale: |
          Hindi sinasabi na ginawa ng mga kawani ang balita. Ang balita ang sanhi ng kanilang tuwa.
      - text: "Pokus sa ganapan, dahil binanggit ang tanggapan."
        rationale: |
          Binanggit lamang ang tanggapan sa paglalarawan ng balita. Hindi ito ang paksa o ang sinabing lugar ng kilos.
    explanation: |
      "Ang balita" ang paksa. Ito ang dahilan ng tuwa ng mga kawani. Kaya pokus sa sanhi ang pandiwa.
    approved: true
  - id: "q-grammar-and-structure-filipino-verb-aspect-and-focus-0009"
    lesson: lesson-grammar-and-structure-pagbuo-ng-anyo-ng-pandiwa
    keyPoint: 1
    type: "correct-usage"
    difficulty: "medium"
    stem: |
      Isinulat ng kawani, "Bukas ay magkakain kami matapos maglinis."
      Kung ang pandiwa ay nasa pangkat na "kumain," anong pagbabago ang kailangan upang maipahayag ang kilos na hindi pa nasisimulan?
    choices:
      - text: "Palitan ang magkakain ng kumakain."
        rationale: |
          Nagpapatuloy o nauulit ang pagkain sa "kumakain." Hindi ito ang hinihinging anyong kontemplatibo.
      - text: "Palitan ang magkakain ng kumain."
        rationale: |
          Sa halimbawang gamit ng aralin, tapos na ang pagkain sa "kumain." Kilos na hindi pa nagsisimula ang hinihingi.
      - text: "Palitan ang magkakain ng kakain."
        correct: true
      - text: "Panatilihin ang magkakain dahil lahat ng kontemplatibo ay may mag-."
        rationale: |
          Ginagamit nito ang paraan ng pagbuo ng "maglinis" para sa "kumain." Ayon sa aralin, hindi lahat ng pangkat ng pandiwa ay gumagamit ng "mag-."
    explanation: |
      Sa pangkat ng "kumain," inuulit ang "ka" at inaalis ang "-um-" upang mabuo ang "kakain." Iba ang paraan sa pangkat ng "maglinis."
    approved: true
  - id: "q-grammar-and-structure-filipino-verb-aspect-and-focus-0010"
    lesson: lesson-grammar-and-structure-mga-pahiwatig-ng-oras
    keyPoint: 2
    type: "tense"
    difficulty: "hard"
    stem: |
      "Nagsusulat pa ng ulat si Luis nang dumating ang pinuno kahapon."
      Ano ang aspekto ng "nagsusulat," at bakit?
    choices:
      - text: "Perpektibo, dahil kahapon naganap ang pangyayari."
        rationale: |
          Inilalagay ng "kahapon" ang pangyayari sa nakaraan. Hindi nito sinasabing tapos na ang pagsulat nang dumating ang pinuno.
      - text: "Imperpektibo, dahil nagpapatuloy ang pagsulat nang dumating ang pinuno."
        correct: true
      - text: "Kontemplatibo, dahil hindi pa tapos ang ulat."
        rationale: |
          Ang hindi pa tapos ay hindi nangangahulugang hindi pa nagsisimula. Nagsusulat na si Luis nang dumating ang pinuno.
      - text: "Perpektibong katatapos, dahil magkasunod na binanggit ang pagsulat at pagdating."
        rationale: |
          Ang pagbanggit ng isa pang pangyayari ay hindi patunay na katatapos lang ng pagsulat. Nagpapatuloy pa ito ayon sa "nagsusulat pa."
    explanation: |
      Nagsusulat pa si Luis nang dumating ang pinuno. Imperpektibo ang "nagsusulat." Maaaring nagpapatuloy ang kilos sa isang sandali sa nakaraan.
    approved: true
  - id: "q-grammar-and-structure-filipino-verb-aspect-and-focus-0011"
    lesson: lesson-grammar-and-structure-kalagayan-ng-kilos
    keyPoint: 2
    type: "tense"
    difficulty: "hard"
    stem: |
      Paghambingin ang "Naglinis ng silid si Noel noong nakaraang linggo"
      at "Kalilinis lang ni Noel ng silid." Aling pahayag ang tama?
    choices:
      - text: "Parehong perpektibong katatapos dahil parehong natapos ang kilos."
        rationale: |
          Hindi lahat ng tapos na kilos ay katatapos lamang. Noong nakaraang linggo ang gawain sa una.
      - text: "Imperpektibo ang una dahil may pahiwatig ng oras."
        rationale: |
          Hindi nagiging nagpapatuloy ang kilos dahil lang may pahiwatig ng oras. Tapos na ang paglilinis sa "naglinis."
      - text: "Kontemplatibo ang ikalawa dahil may salitang lang."
        rationale: |
          Katatapos lang ng gawain ayon sa "kalilinis lang." Hindi ito plano sa hinaharap.
      - text: "Perpektibo ang una; perpektibong katatapos ang ikalawa."
        correct: true
    explanation: |
      Tapos na ang gawain sa "naglinis." Idinadagdag ng "kalilinis lang" na katatapos lang nito. Hindi sapat na tapos na ang kilos upang sabihing katatapos lang.
    approved: true
  - id: "q-grammar-and-structure-filipino-verb-aspect-and-focus-0012"
    lesson: lesson-grammar-and-structure-ugnayan-ng-pandiwa-at-paksa
    keyPoint: 2
    type: "tense"
    difficulty: "hard"
    stem: |
      Sa "Pinagtaniman ng mga kawani ng gulay ang bakuran" at "Pinuntahan ng mga kawani ang bakuran," magkapareho ang paksa.
      Alin ang wastong pagkakaiba ng pokus?
    choices:
      - text: "Ganapan ang una; direksiyon ang ikalawa."
        correct: true
      - text: "Parehong ganapan dahil parehong lugar ang bakuran."
        rationale: |
          Maaaring maging patutunguhan ang isang lugar. Sa ikalawang pangungusap, pinuntahan ang bakuran. Hindi sinabing doon nagtanim.
      - text: "Direksiyon ang una; ganapan ang ikalawa."
        rationale: |
          Baligtad ang mga papel dito. Lugar ng pagtatanim ang bakuran sa una. Patutunguhan naman ito sa ikalawa.
      - text: "Parehong tagaganap dahil ang mga kawani ang gumawa."
        rationale: |
          Ang mga kawani ang gumagawa. Ngunit "ang bakuran" ang paksa sa parehong pangungusap.
    explanation: |
      Sa una, sa bakuran naganap ang pagtatanim. Sa ikalawa, bakuran ang pinuntahan. Hindi sapat ang pangalan ng lugar upang malaman ang pokus.
    approved: true
  - id: "q-grammar-and-structure-filipino-verb-aspect-and-focus-0013"
    lesson: lesson-grammar-and-structure-ugnayan-ng-pandiwa-at-paksa
    keyPoint: 1
    type: "correct-usage"
    difficulty: "hard"
    stem: |
      Baguhin ang "Nagluto ng sopas si Dina" upang maging paksa ang sopas at manatiling tapos na ang pagluluto. Alin ang tama?
    choices:
      - text: "Nagluto si Dina ng sopas."
        rationale: |
          Hindi nagiging paksa ang sopas sa paglipat lang ng mga parirala. "Si Dina" pa rin ang paksa.
      - text: "Niluto ng sopas si Dina."
        rationale: |
          Baligtad ang mga papel dito. Si Dina ang nagiging paksa na niluto. Ang sopas naman ang nagiging gumagawa.
      - text: "Niluto ni Dina ang sopas."
        correct: true
      - text: "Ipinagluto ni Dina ng sopas ang bata."
        rationale: |
          Ang bata ang nagiging paksa at tumatanggap ng pakinabang. May panandang "ng" pa rin ang sopas.
    explanation: |
      Sa "Niluto ni Dina ang sopas," ang sopas ang paksa at ang bagay na niluto. Tapos na rin ang pagluluto. Pokus sa layon ito.
    approved: true
  - id: "q-grammar-and-structure-tenses-and-voice-0025"
    lesson: lesson-grammar-and-structure-pagbuo-ng-anyo-ng-pandiwa
    keyPoint: 1
    type: "tense"
    difficulty: "exam"
    stem: |
      Sa tala ay nakasulat, "Kakakain lang ng mga kawani nang tumawag ang pinuno kahapon. Maglilinis sila ng tanggapan bukas."
      Alin ang wastong pagsusuri sa mga pandiwang "kakakain" at "maglilinis"?
    choices:
      - text: "Perpektibo lamang ang una dahil may kahapon; imperpektibo ang ikalawa dahil inuulit ang li."
        rationale: |
          Hindi nito pinapansin ang katatapos na kilos sa "kakakain lang." Ang pag-uulit ng "li" kasama ng "mag-" ay bumubuo ng kontemplatibong "maglilinis." Iba ito sa nagpapatuloy na "naglilinis."
      - text: "Perpektibong katatapos ang una; kontemplatibo ang ikalawa."
        correct: true
      - text: "Imperpektibo ang una; kontemplatibo ang ikalawa."
        rationale: |
          Hindi sapat ang pag-uulit upang sabihing nagpapatuloy ang kilos. Katatapos lang ng pagkain ayon sa "kakakain lang."
      - text: "Kontemplatibo ang una; perpektibong katatapos ang ikalawa."
        rationale: |
          Baligtad ang mga kahulugan. Katatapos lang ng pagkain. Nakaplano pa lamang sa susunod na araw ang paglilinis.
    explanation: |
      Katatapos lang ng pagkain nang dumating ang tawag, ayon sa "kakakain lang." Hindi pa nagsisimula ang paglilinis sa "maglilinis." Basahin ang buong anyo ng pandiwa.
    approved: true
  - id: "q-grammar-and-structure-tenses-and-voice-0026"
    lesson: lesson-grammar-and-structure-ugnayan-ng-pandiwa-at-paksa
    keyPoint: 3
    type: "tense"
    difficulty: "exam"
    stem: |
      Suriin ang "Ipinagluto ni Mara ng lugaw ang mga bisita" at "Ipinangsulat ni Mara ng mga pangalan ang lapis."
      Aling pahayag ang wastong naghahambing sa pokus ng dalawang pandiwa?
    choices:
      - text: "Parehong tagaganap dahil si Mara ang gumagawa ng mga kilos."
        rationale: |
          Si Mara ang gumagawa sa dalawa, ngunit hindi paksa ang "ni Mara." Ang mga paksa ay ang mga bisita at ang lapis.
      - text: "Layon ang una dahil lugaw ang niluto; layon ang ikalawa dahil pangalan ang isinulat."
        rationale: |
          Pinipili nito bilang paksa ang mga bagay na may "ng." Ang mga pariralang may "ang" ang tunay na paksa.
      - text: "Kagamitan ang una dahil ginamit ang mga bisita; tagatanggap ang ikalawa dahil nakinabang ang lapis."
        rationale: |
          Baligtad ang mga papel dito. Nakikinabang sa pagluluto ang mga bisita. Kagamitan naman ang lapis.
      - text: "Tagatanggap ang una; kagamitan ang ikalawa."
        correct: true
    explanation: |
      Ang mga bisita ang paksa sa una at tumatanggap ng pakinabang. Ang lapis ang paksa sa ikalawa at ginagamit sa kilos. Si Mara ang gumagawa sa dalawa, ngunit hindi siya ang paksa.
