meta:
  subject: language-proficiency
  topic: grammar-and-structure
  subtopic: parallelism
  exams: [ upcat, acet, dlsucet, ustet, dost-sei , cse-pro, cse-sub]
questions:
  - id: q-grammar-and-structure-parallelism-0001
    type: parallelism-correction
    difficulty: easy
    stem: |
      Identify and fix the parallelism error: "The coach told the team to run faster, jumping higher, and to try harder."
    choices:
      - text: Jumping breaks the "to + verb" pattern; corrected, it should read "to run faster, to jump higher, and to try harder."
        correct: true
      - text: There is no error in this sentence.
        rationale: |
          "Jumping" breaks the infinitive pattern established by "to run" and "to try."
      - text: Faster should be changed to "fastest."
        rationale: |
          "Faster" is not the structural mismatch; the listed verb forms are.
      - text: The sentence needs a comma after "team."
        rationale: |
          Punctuation does not repair the mismatch among the three listed actions.
    explanation: |
      Parallel items should use matching grammatical forms. Changing "jumping" to "to jump" makes all three actions parallel.
    approved: true

  - id: q-grammar-and-structure-parallelism-0002
    type: parallelism-correction
    difficulty: medium
    stem: |
      Identify and fix the parallelism error: "The festival was not only fun but also it was educational."
    choices:
      - text: It was educational should match the adjective after "not only"; corrected, it should read "not only fun but also educational."
        correct: true
      - text: There is no error in this sentence.
        rationale: |
          The two sides of "not only...but also" are not structurally parallel.
      - text: Fun should be changed to "funny."
        rationale: |
          That changes the meaning without fixing the structural mismatch.
      - text: The sentence needs a semicolon instead of "but."
        rationale: |
          A semicolon would destroy the intended correlative construction.
    explanation: |
      "Fun" and "educational" are parallel predicate complements: "The festival was not only fun but also educational."
    approved: true

  - id: q-grammar-and-structure-parallelism-0003
    type: parallelism-correction
    difficulty: medium
    stem: |
      Choose the sentence with correct parallel structure.
    choices:
      - text: The manual explains how to install the software, update it, and troubleshoot common errors.
        correct: true
      - text: The manual explains how to install the software, updating it, and troubleshoot common errors.
        rationale: |
          "Updating" breaks the coordinated base-verb pattern.
      - text: Both sentences use correct parallel structure.
        rationale: |
          Only the first keeps the coordinated verbs in matching form.
      - text: Neither sentence uses correct parallel structure.
        rationale: |
          The first sentence correctly coordinates "install," "update," and "troubleshoot."
    explanation: |
      The first sentence uses three coordinated base verbs governed by "how to": install, update, and troubleshoot.
    approved: true

  - id: q-grammar-and-structure-parallelism-0004
    type: parallelism-correction
    difficulty: medium
    stem: |
      Identify and fix the parallelism error: "Reading a book is more relaxing than to watch television."
    choices:
      - text: To watch should match "reading"; corrected, it should read "more relaxing than watching television."
        correct: true
      - text: There is no error in this sentence.
        rationale: |
          The comparison mismatches a gerund with an infinitive.
      - text: Relaxing should be changed to "relaxed."
        rationale: |
          The predicate adjective is not the source of the mismatch.
      - text: The comparison needs "than to" instead of "than."
        rationale: |
          Adding "to" does not make the compared activities parallel.
    explanation: |
      The compared activities should use matching forms: "Reading a book...than watching television."
    approved: true

  - id: q-grammar-and-structure-parallelism-0005
    type: parallelism-correction
    difficulty: medium
    stem: |
      Identify and fix the parallelism error: "Her hobbies include painting, to dance, and singing."
    choices:
      - text: To dance breaks the "-ing" pattern; corrected, it should read "painting, dancing, and singing."
        correct: true
      - text: There is no error in this sentence.
        rationale: |
          "To dance" does not match the gerund forms around it.
      - text: Include should be changed to "includes."
        rationale: |
          "Hobbies" is plural, so "include" already agrees with the subject.
      - text: The sentence needs a semicolon.
        rationale: |
          Punctuation cannot repair mismatched list forms.
    explanation: |
      All three hobby names should be parallel gerunds: painting, dancing, and singing.
    approved: true

  - id: q-grammar-and-structure-parallelism-0006
    type: parallelism-correction
    difficulty: medium
    stem: |
      Identify and fix the parallelism error: "He is both intelligent and he works hard."
    choices:
      - text: He works hard should match the adjective after "both"; corrected, it should read "both intelligent and hardworking."
        correct: true
      - text: There is no error in this sentence.
        rationale: |
          The correlative pair links an adjective to a full clause instead of matching structures.
      - text: Intelligent should be changed to "intelligently."
        rationale: |
          "Is" takes a predicate adjective here; changing it to an adverb would not help.
      - text: The sentence needs a comma after "intelligent."
        rationale: |
          A comma does not make the two coordinated elements parallel.
    explanation: |
      "Both...and" should connect comparable structures. "Both intelligent and hardworking" pairs two adjectives.
    approved: true

  - id: q-grammar-and-structure-parallelism-0007
    type: parallelism-correction
    difficulty: medium
    stem: |
      Choose the sentence with correct parallel structure.
    choices:
      - text: The recipe requires chopping the onions, mincing the garlic, and boiling the water.
        correct: true
      - text: The recipe requires chopping the onions, mincing the garlic, and to boil the water.
        rationale: |
          "To boil" breaks the gerund pattern.
      - text: Both sentences use correct parallel structure.
        rationale: |
          Only the first keeps all three list items in matching form.
      - text: Neither sentence uses correct parallel structure.
        rationale: |
          The first sentence has three parallel gerund phrases.
    explanation: |
      "Chopping," "mincing," and "boiling" form a parallel series.
    approved: true

  - id: q-grammar-and-structure-parallelism-0008
    type: parallelism-correction
    difficulty: medium
    stem: |
      Identify and fix the parallelism error: "Swimming in the ocean is more exciting than to swim in a pool."
    choices:
      - text: To swim should match "swimming"; corrected, it should read "more exciting than swimming in a pool."
        correct: true
      - text: There is no error in this sentence.
        rationale: |
          The comparison mismatches a gerund with an infinitive.
      - text: Exciting should be changed to "excited."
        rationale: |
          "Exciting" correctly describes the activity; it is not the structural mismatch.
      - text: The comparison needs "than to" instead of "than."
        rationale: |
          The compared activities, not the connector, need matching form.
    explanation: |
      The comparison is parallel when both activities are gerund phrases: swimming in the ocean and swimming in a pool.
    approved: true

  - id: q-grammar-and-structure-parallelism-0009
    type: parallelism-correction
    difficulty: hard
    stem: |
      Identify the hidden parallelism error in this longer sentence: "The report covers the company's history, analyzing its financial growth, and its plans for the future."
    choices:
      - text: Analyzing its financial growth breaks the noun-phrase pattern; corrected, it should read "the company's history, its financial growth, and its plans for the future."
        correct: true
      - text: There is no error; the sentence is fine as written.
        rationale: |
          "Analyzing its financial growth" is a verb phrase between two noun phrases.
      - text: Its plans for the future is the mismatched item.
        rationale: |
          "Its plans for the future" matches the noun-phrase structure of "the company's history."
      - text: History is the mismatched item.
        rationale: |
          "History" establishes the noun-phrase pattern that the middle item breaks.
    explanation: |
      A coordinated list should keep comparable structures. The corrected version uses three noun phrases.
    approved: true

  - id: q-grammar-and-structure-parallelism-0010
    type: parallelism-correction
    difficulty: hard
    stem: |
      A student writes "She enjoys hiking and to swim," reasoning that both phrases are grammatical on their own. Is the sentence parallel?
    choices:
      - text: 'No: after "enjoys," the coordinated activities should use matching forms; "She enjoys hiking and swimming" is parallel.'
        correct: true
      - text: 'Yes: if each item can be grammatical by itself, the coordination is automatically parallel.'
        rationale: |
          Coordination still requires compatible structures in this sentence.
      - text: 'Yes: because hiking and swimming are both physical activities.'
        rationale: |
          Similar meaning does not repair a grammatical-form mismatch.
      - text: 'No: because "enjoys" should be "enjoy."'
        rationale: |
          "She enjoys" already has correct subject-verb agreement.
    explanation: |
      "Enjoy" normally takes gerund complements here, so "hiking and swimming" gives a grammatical, parallel pair.
    approved: true

  - id: q-grammar-and-structure-parallelism-0011
    type: parallelism-correction
    difficulty: hard
    stem: |
      A student writes "He wanted either to win the race or finishing in the top three." Which correction makes the alternatives parallel without changing their meaning?
    choices:
      - text: 'He wanted either to win the race or to finish in the top three.'
        correct: true
      - text: 'He wanted either winning the race or to finish in the top three.'
        rationale: |
          This still mismatches a gerund phrase with an infinitive phrase.
      - text: 'He wanted either to win the race or finishing in the top three.'
        rationale: |
          This repeats the original mismatch.
      - text: 'He wanted to either win the race or finishing in the top three.'
        rationale: |
          Moving "either" does not repair the mismatch between "win" and "finishing."
    explanation: |
      The correlative alternatives should be structurally comparable. "To win the race" and "to finish in the top three" are parallel infinitive phrases.
    approved: true

  - id: q-grammar-and-structure-parallelism-0012
    type: parallelism-correction
    difficulty: medium
    stem: |
      Choose the sentence with correct parallel structure.
    choices:
      - text: The workshop covers budgeting, marketing, and sales strategy.
        correct: true
      - text: The workshop covers budgeting, marketing, and how to strategize sales.
        rationale: |
          The final clause does not match the noun-like items before it.
      - text: Both sentences use correct parallel structure.
        rationale: |
          Only the first presents a balanced list of topics.
      - text: Neither sentence uses correct parallel structure.
        rationale: |
          The first sentence is a parallel list of workshop topics.
    explanation: |
      "Budgeting," "marketing," and "sales strategy" all function as noun phrases naming topics.
    approved: true

  - id: q-grammar-and-structure-parallelism-0013
    type: parallelism-correction
    difficulty: medium
    stem: |
      Identify and fix the parallelism error: "The app helps users track expenses, setting budgets, and saving money."
    choices:
      - text: Setting and saving should match "track"; corrected, it should read "The app helps users track expenses, set budgets, and save money."
        correct: true
      - text: There is no error in this sentence.
        rationale: |
          The list switches from the base verb "track" to two "-ing" forms.
      - text: Track should change to "tracking," giving "helps users tracking expenses, setting budgets, and saving money."
        rationale: |
          That repair makes the complement after "helps users" ungrammatical in standard usage; the coordinated base verbs should be retained.
      - text: Only saving should change to "save."
        rationale: |
          "Setting" would still fail to match the base verbs "track" and "save."
    explanation: |
      In "helps users track...," the verb "help" licenses a bare infinitive after its object. The coordinated actions should therefore be "track," "set," and "save."
    approved: true

  - id: q-grammar-and-structure-parallelism-0014
    type: parallelism-correction
    difficulty: hard
    stem: |
      Identify and fix the parallelism error: "The company will neither raise prices nor cutting jobs."
    choices:
      - text: Cutting should match "raise"; corrected, it should read "The company will neither raise prices nor cut jobs."
        correct: true
      - text: There is no error in this sentence.
        rationale: |
          "Raise" is a base verb after "will," while "cutting" is not parallel with it.
      - text: Raise should be changed to "raising."
        rationale: |
          The modal "will" calls for a base verb, so "will raising" would be ungrammatical.
      - text: The sentence needs a comma before "nor."
        rationale: |
          Punctuation does not repair the mismatched verb forms.
    explanation: |
      After the shared modal "will," "neither...nor" coordinates two base verb phrases: "raise prices" and "cut jobs."
    approved: true

  - id: q-grammar-and-structure-parallelism-0015
    type: parallelism-correction
    difficulty: exam
    stem: |
      Identify and fix all parallelism errors: "The seminar will teach participants not only how to negotiate effectively but also improving their communication skills, while covering topics like budgeting, marketing, and how to manage a team."
    choices:
      - text: Corrected, it should read "...not only how to negotiate effectively but also how to improve their communication skills, while covering topics like budgeting, marketing, and team management."
        correct: true
      - text: There are no parallelism errors in this sentence.
        rationale: |
          The correlative pair and the final list both contain structural mismatches.
      - text: Only the correlative conjunction has an error; the final list is fine.
        rationale: |
          The final list also switches from noun-like topics to a full "how to" clause.
      - text: Only the final list has an error; the correlative conjunction is fine.
        rationale: |
          The "not only...but also" pair also mismatches "how to negotiate" with "improving."
    explanation: |
      The repair makes both structures parallel: "how to negotiate / how to improve" and "budgeting / marketing / team management."
    approved: true
