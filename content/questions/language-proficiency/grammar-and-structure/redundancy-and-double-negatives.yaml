meta:
  subject: language-proficiency
  topic: grammar-and-structure
  subtopic: redundancy-and-double-negatives
  exams: [ upcat, acet, dlsucet, ustet, dost-sei , cse-pro, cse-sub]
questions:
  - id: q-grammar-and-structure-redundancy-and-double-negatives-0001
    type: redundancy-identification
    difficulty: easy
    stem: |
      For concise formal writing, which revision removes the unnecessary repetition in "Please give us your honest and truthful opinion"?
    choices:
      - text: Please give us your honest opinion.
        correct: true
      - text: Please give us your honestly truthful opinion.
        rationale: |
          You changed the form of "honest" but kept both near-synonyms, so the phrase remains needlessly repetitive.
      - text: Please gives us your honest and truthful opinion.
        rationale: |
          You kept the repetition and also changed the imperative verb "give" to an incorrect form.
      - text: Please give us, your honest and truthful opinion.
        rationale: |
          You added an unnecessary comma without removing the repeated idea.
    explanation: |
      In a concision question, "honest" and "truthful" overlap enough that one can be removed without losing the intended meaning. "Please give us your honest opinion" is the clearest concise revision.
    approved: true

  - id: q-grammar-and-structure-redundancy-and-double-negatives-0002
    type: redundancy-identification
    difficulty: easy
    stem: |
      In standard formal English, revise "She doesn't want no help with the project."
    choices:
      - text: She doesn't want any help with the project.
        correct: true
      - text: She doesn't want no help with the project.
        rationale: |
          You kept negative concord. Some English varieties use this pattern systematically, but standard formal English normally uses "not ... any" or a single negative form.
      - text: She doesn't wants any help with the project.
        rationale: |
          You fixed the negation pattern but added an agreement error: after "doesn't," the main verb stays in the base form "want."
      - text: She didn't want no help with the project.
        rationale: |
          You changed the tense but kept the nonstandard-for-formal-writing negative-concord pattern.
    explanation: |
      Standard formal English normally uses one negative pattern here: "doesn't ... any." Other English varieties may use negative concord, where multiple negative forms express one semantic negation; the exam convention being tested is the standard written form.
    approved: true

  - id: q-grammar-and-structure-redundancy-and-double-negatives-0003
    type: redundancy-identification
    difficulty: easy
    stem: |
      For the most concise formal version, revise "The two of them collaborated together on the mural."
    choices:
      - text: The two of them collaborated on the mural.
        correct: true
      - text: The two of them collaborated together jointly on the mural.
        rationale: |
          You added another word with the same basic idea instead of making the sentence more concise.
      - text: The two of them collaboration together on the mural.
        rationale: |
          You changed the verb to a noun without supplying a grammatical verb for the sentence.
      - text: The two of them collaborated, together on the mural.
        rationale: |
          You inserted an unnecessary comma and kept the redundant wording.
    explanation: |
      "Collaborate" already means to work jointly with others. In a concision question, "together" adds no needed information, so the tighter version is "collaborated on the mural."
    approved: true

  - id: q-grammar-and-structure-redundancy-and-double-negatives-0004
    type: redundancy-identification
    difficulty: medium
    stem: |
      In standard formal English, which revision best expresses the intended meaning of "I can't hardly hear you from over here"?
    choices:
      - text: I can hardly hear you from over here.
        correct: true
      - text: I can't hardly hear you from over here.
        rationale: |
          You kept "not" together with the negative-meaning adverb "hardly." Standard formal English normally uses "can hardly" for the intended meaning "can almost not hear."
      - text: I hardly can't hear you from over here.
        rationale: |
          You kept both negative elements and also placed them in an unnatural standard-English order.
      - text: I can't hard hear you from over here.
        rationale: |
          "Hard" does not mean "almost not" here. The intended adverb is "hardly," used without "can't" in standard formal English.
    explanation: |
      Cambridge classifies "hardly" as an adverb with negative meaning, roughly "almost not." Standard formal English therefore expresses the intended meaning as "I can hardly hear you," not "I can't hardly hear you." This is a standard-usage convention, not a claim that other dialect patterns are meaningless.
    approved: true

  - id: q-grammar-and-structure-redundancy-and-double-negatives-0005
    type: redundancy-identification
    difficulty: easy
    stem: |
      Which revision removes the literal repetition in "Please enter your PIN number at the terminal"?
    choices:
      - text: Please enter your PIN at the terminal.
        correct: true
      - text: Please enter your PIN number code at the terminal.
        rationale: |
          You added another label instead of removing the repeated word. The N in PIN already stands for "number."
      - text: Please enter your personal PIN number at the terminal.
        rationale: |
          You kept "PIN number," so "number" is still repeated by the abbreviation.
      - text: Please enter your number PIN at the terminal.
        rationale: |
          You rearranged the words but did not produce the standard term.
    explanation: |
      PIN stands for "personal identification number." Saying "PIN number" therefore repeats "number." The concise form is simply "PIN."
    approved: true

  - id: q-grammar-and-structure-redundancy-and-double-negatives-0006
    type: redundancy-identification
    difficulty: easy
    stem: |
      In standard formal English, revise "They didn't see nothing unusual that night."
    choices:
      - text: They didn't see anything unusual that night.
        correct: true
      - text: They didn't see nothing unusual that night.
        rationale: |
          You kept negative concord. It occurs in multiple English varieties, but standard formal English normally uses "didn't ... anything" or "saw nothing."
      - text: They didn't saw anything unusual that night.
        rationale: |
          You fixed the negation pattern but used "saw" after "didn't." The auxiliary "did" requires the base form "see."
      - text: They don't see nothing unusual that night.
        rationale: |
          You changed the tense and kept the nonstandard-for-formal-writing negative-concord pattern.
    explanation: |
      For standard formal English, use either "They didn't see anything unusual" or "They saw nothing unusual." Negative-concord varieties may license multiple negative forms with one negative meaning, but that is not the written convention this item tests.
    approved: true

  - id: q-grammar-and-structure-redundancy-and-double-negatives-0007
    type: redundancy-identification
    difficulty: easy
    stem: |
      Which revision removes the literal repetition in "The ATM machine outside the bank is offline"?
    choices:
      - text: The ATM outside the bank is offline.
        correct: true
      - text: The ATM machine device outside the bank is offline.
        rationale: |
          You added another generic noun while keeping the original repetition. The M in ATM already stands for "machine."
      - text: The automatic ATM machine outside the bank is offline.
        rationale: |
          You kept "ATM machine," so "machine" remains repeated by the abbreviation.
      - text: The machine ATM outside the bank is offline.
        rationale: |
          You rearranged the words but did not produce the standard term.
    explanation: |
      ATM stands for "automated teller machine." Adding "machine" after ATM repeats the final word of the abbreviation.
    approved: true

  - id: q-grammar-and-structure-redundancy-and-double-negatives-0008
    type: redundancy-identification
    difficulty: medium
    stem: |
      In standard formal English, which revision best expresses the intended meaning of "She hasn't barely started her homework yet"?
    choices:
      - text: She has barely started her homework.
        correct: true
      - text: She hasn't barely started her homework yet.
        rationale: |
          You kept "not" together with "barely," a negative-like minimizer meaning roughly "only just." Standard formal English normally uses "has barely started" for this meaning.
      - text: She hasn't started barely her homework yet.
        rationale: |
          You kept the conflicting negative pattern and also misplaced "barely."
      - text: She has bare started her homework.
        rationale: |
          "Bare" is an adjective and does not replace the adverb "barely."
    explanation: |
      For the intended standard-English meaning, "barely" already conveys that very little progress has been made. "She has barely started her homework" is the clear formal version.
    approved: true

  - id: q-grammar-and-structure-redundancy-and-double-negatives-0009
    type: redundancy-identification
    difficulty: easy
    stem: |
      Which revision removes the literal repetition in "Write the ISBN number on the form"?
    choices:
      - text: Write the ISBN on the form.
        correct: true
      - text: Write the ISBN number code on the form.
        rationale: |
          You added another noun while keeping the repeated "number." The N in ISBN already stands for "number."
      - text: Write the book ISBN number on the form.
        rationale: |
          You added context but kept "ISBN number," so the literal repetition remains.
      - text: Write the number ISBN on the form.
        rationale: |
          You rearranged the words instead of using the standard term.
    explanation: |
      ISBN stands for "International Standard Book Number." "ISBN number" repeats the word "number," so "ISBN" alone is the concise form.
    approved: true

  - id: q-grammar-and-structure-redundancy-and-double-negatives-0010
    type: redundancy-identification
    difficulty: hard
    stem: |
      In standard formal English, which revision best expresses the intended meaning of "He couldn't scarcely finish the race"?
    choices:
      - text: He could scarcely finish the race.
        correct: true
      - text: He couldn't scarcely finish the race.
        rationale: |
          You kept "not" together with "scarcely," which has a negative meaning of "almost not." Standard formal English normally uses "could scarcely" for the intended meaning.
      - text: He scarcely couldn't finish the race.
        rationale: |
          You kept both negative elements and placed them in a nonstandard order.
      - text: He couldn't scarce finish the race.
        rationale: |
          "Scarce" is an adjective; the adverb needed for "almost not" is "scarcely."
    explanation: |
      Cambridge treats "scarcely" as an adverb with negative meaning. For the intended standard formal meaning, use "He could scarcely finish the race." Other dialects may organize negation differently; this item tests the standard written form.
    approved: true

  - id: q-grammar-and-structure-redundancy-and-double-negatives-0011
    type: redundancy-identification
    difficulty: hard
    stem: |
      A speaker says "I don't have no time." Which statement best describes the sentence for an exam testing standard formal English?
    choices:
      - text: Standard formal English would normally use "I don't have any time" or "I have no time," although negative concord is grammatical in several English varieties.
        correct: true
      - text: The sentence literally has to mean "I have time" because two negatives always cancel each other mathematically.
        rationale: |
          You treated language as sign arithmetic. In negative-concord varieties, multiple negative forms can express a single semantic negation.
      - text: The sentence is ungrammatical in every variety of English.
        rationale: |
          You made a language-wide claim. Negative concord is a documented grammatical pattern in several English varieties, even though it is not the standard formal convention tested here.
      - text: The sentence is standard formal English because all spoken variants are interchangeable in formal writing.
        rationale: |
          You ignored register. A construction can be grammatical in a dialect while still not matching the standard written convention expected in a formal exam.
    explanation: |
      Cambridge notes that standard English normally avoids a negative verb with forms such as "nobody" or "nothing," while Yale documents negative concord as a systematic feature of multiple English varieties. The assessment target is therefore register-aware: know the standard formal form without mislabeling other dialects as illogical.
    approved: true

  - id: q-grammar-and-structure-redundancy-and-double-negatives-0012
    type: redundancy-identification
    difficulty: medium
    stem: |
      For concise formal writing, revise "Please return back the library books by Friday."
    choices:
      - text: Please return the library books by Friday.
        correct: true
      - text: Please return back again the library books by Friday.
        rationale: |
          You added another repeated direction instead of making the sentence concise.
      - text: Please returns the library books by Friday.
        rationale: |
          You removed "back" but changed the imperative verb to the incorrect form "returns."
      - text: Please return, back the library books by Friday.
        rationale: |
          You inserted an unnecessary comma and kept "back."
    explanation: |
      In this context, "return" already means to bring or give something back. "Please return the library books" expresses the same instruction more concisely.
    approved: true

  - id: q-grammar-and-structure-redundancy-and-double-negatives-0013
    type: redundancy-identification
    difficulty: medium
    stem: |
      For concise formal writing, revise "Could you please repeat again what you just said?"
    choices:
      - text: Could you please repeat what you just said?
        correct: true
      - text: Could you please repeat again once more what you just said?
        rationale: |
          You added more repetition instead of making the request concise.
      - text: Could you please repeats what you just said?
        rationale: |
          After the modal "could," the verb must be the base form "repeat," not "repeats."
      - text: Could you please repeat, again what you just said?
        rationale: |
          You inserted an unnecessary comma and retained the repeated idea.
    explanation: |
      "Repeat" already means to say or do something again. In a concision question, "again" is unnecessary.
    approved: true

  - id: q-grammar-and-structure-redundancy-and-double-negatives-0014
    type: redundancy-identification
    difficulty: medium
    stem: |
      In standard formal English, revise "There isn't nobody at the office right now."
    choices:
      - text: There isn't anybody at the office right now.
        correct: true
      - text: There isn't nobody at the office right now.
        rationale: |
          You kept negative concord. It occurs in multiple English varieties, but standard formal English normally uses "isn't anybody" or "there is nobody."
      - text: There aren't anybody at the office right now.
        rationale: |
          You changed the verb to plural even though "anybody" takes singular agreement in this construction.
      - text: There isn't somebody at the office right now.
        rationale: |
          You changed the negative-polarity item to "somebody," which changes the ordinary intended meaning.
    explanation: |
      Standard formal English normally uses "There isn't anybody" or "There is nobody." Negative-concord varieties may use multiple negative forms with a single negative meaning, but that is not the written convention this item tests.
    approved: true

  - id: q-grammar-and-structure-redundancy-and-double-negatives-0015
    type: redundancy-identification
    difficulty: exam
    stem: |
      Edit this sentence for standard formal English and concision: "The ATM machine wasn't never available, so I had to enter my PIN number at another terminal."
    choices:
      - text: The ATM was never available, so I had to enter my PIN at another terminal.
        correct: true
      - text: The ATM machine was never available, so I had to enter my PIN number at another terminal.
        rationale: |
          You fixed the standard-English negation pattern but kept both literal abbreviation repetitions: ATM already ends in "machine," and PIN already ends in "number."
      - text: The ATM wasn't never available, so I had to enter my PIN at another terminal.
        rationale: |
          You removed one redundancy but kept the negative-concord pattern that this standard-formal editing task asks you to revise.
      - text: The ATM machine wasn't never available, so I had to enter my PIN number at another terminal.
        rationale: |
          You left all three target problems unchanged.
    explanation: |
      Three edits are required for the stated target register: ATM already means "automated teller machine," PIN already means "personal identification number," and standard formal English normally uses a single negative pattern such as "was never available." Negative concord remains a legitimate dialect pattern outside that target register.
    approved: true
