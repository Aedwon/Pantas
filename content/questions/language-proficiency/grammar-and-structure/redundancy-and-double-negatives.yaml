questions:
  - id: "q-grammar-and-structure-redundancy-and-double-negatives-0001"
    type: "redundancy-identification"
    difficulty: "easy"
    stem: |
      For concise formal writing, which revision removes the unnecessary repetition in "Please give us your honest and truthful opinion"?
    choices:
      - text: "Please give us your honest opinion."
        correct: true
      - text: "Please give us your honest and entirely truthful opinion."
        rationale: |
          This keeps two words expressing the same requested quality. The extra words sound emphatic. Check: remove wording that adds no needed meaning in this concise request.
      - text: "Please give us your opinion, whether honest or not."
        rationale: |
          This removes the required honesty. The sentence is shorter than the original. Check: preserve the requested quality while cutting repetition.
      - text: "Please give us the facts instead of your personal opinion."
        rationale: |
          This changes the request from an opinion to facts. Facts may sound clearer or more reliable. Check: keep the original kind of response requested.
    explanation: |
      The request asks for an honest opinion. In this context, "truthful" repeats that quality without adding needed meaning, so "honest opinion" preserves the request.
    approved: true
  - id: "q-grammar-and-structure-redundancy-and-double-negatives-0002"
    type: "redundancy-identification"
    difficulty: "easy"
    stem: |
      In standard formal English, revise "She doesn't want no help with the project."
    choices:
      - text: "She doesn't want any help with the project."
        correct: true
      - text: "She doesn't want no help with the project."
        rationale: |
          This retains negative concord in a standard-formal task. That construction expresses one negative in some dialects. Check: use the form required by the stated register.
      - text: "She wants some help with the project after all."
        rationale: |
          This changes rejection of help into acceptance. Removing negative words makes the sentence simpler. Check: preserve the intended refusal.
      - text: "She didn't want any help with the project last week."
        rationale: |
          This changes the present refusal to a past one. The negation pattern is standard. Check: keep the original time as well as the meaning.
    explanation: |
      "Doesn't want any help" uses one standard negative pattern. It expresses the intended present refusal of help.
    approved: true
  - id: "q-grammar-and-structure-redundancy-and-double-negatives-0003"
    type: "redundancy-identification"
    difficulty: "easy"
    stem: |
      For the most concise formal version, revise "The two of them collaborated together on the mural."
    choices:
      - text: "The two of them collaborated on the mural."
        correct: true
      - text: "The two of them collaborated together jointly on the mural."
        rationale: |
          This adds another word meaning working together. The extra wording sounds emphatic. Check: keep only wording needed for the stated concise version.
      - text: "The two of them worked separately on unrelated murals."
        rationale: |
          This removes the shared work. The sentence uses simpler wording. Check: preserve the fact that they worked together.
      - text: "One of them painted the mural without the other person."
        rationale: |
          This drops one collaborator. The revised sentence is direct. Check: retain both people and their shared work.
    explanation: |
      "Collaborated" means worked together. The revision keeps both participants and their shared mural without repeating the idea of joint work.
    approved: true
  - id: "q-grammar-and-structure-redundancy-and-double-negatives-0004"
    type: "redundancy-identification"
    difficulty: "medium"
    stem: |
      In standard formal English, which revision best expresses the intended meaning of "I can't hardly hear you from over here"?
    choices:
      - text: "I can hardly hear you from over here."
        correct: true
      - text: "I can't hardly hear you from over here."
        rationale: |
          This retains "not" with a near-negative adverb. The pattern is familiar in some dialects. Check: follow the requested standard-formal convention.
      - text: "I can hear you clearly from over here without any difficulty."
        rationale: |
          This changes almost no hearing into clear hearing. Removing both negative elements sounds smooth. Check: keep the small amount of hearing intended.
      - text: "I can't hear you at all from over here, no matter how loudly you speak."
        rationale: |
          This changes very little hearing into none. "Hardly" is close to a negative meaning. Check: distinguish almost not from not at all.
    explanation: |
      "Hardly" means almost not. "Can hardly hear" states that the speaker hears very little in standard formal English.
    approved: true
  - id: "q-grammar-and-structure-redundancy-and-double-negatives-0005"
    type: "redundancy-identification"
    difficulty: "easy"
    stem: |
      Which revision removes the literal repetition in "Please enter your PIN number at the terminal"?
    choices:
      - text: "Please enter your PIN at the terminal."
        correct: true
      - text: "Please enter your PIN number code at the terminal."
        rationale: |
          This adds "code" while keeping a repeated "number." A code is entered at a terminal, so the extra label may seem clearer. Check the words represented by each letter of PIN.
      - text: "Please enter your personal PIN number at the terminal."
        rationale: |
          This adds "personal" while keeping a repeated "number." Personal information sounds relevant to a PIN, so the wording may seem more exact. Expand PIN before adding a label.
      - text: "Please enter your number PIN at the terminal."
        rationale: |
          This moves "number" before PIN without removing it. A new word order may seem to fix the phrase. Expand the abbreviation and check for repeated meaning.
    explanation: |
      PIN stands for "personal identification number." Saying "PIN number" therefore repeats "number." The concise form is simply "PIN."
    approved: true
  - id: "q-grammar-and-structure-redundancy-and-double-negatives-0006"
    type: "redundancy-identification"
    difficulty: "easy"
    stem: |
      In a dialect that uses negative concord, what does "They didn't see nothing unusual that night" mean?
    choices:
      - text: "The speaker saw no unusual thing."
        correct: true
      - text: "The speaker must have seen something unusual after all."
        rationale: |
          This applies mathematical cancellation to dialect grammar. There are two negative forms in the sentence. Check: use the dialect's stated negative-concord rule.
      - text: "The speaker saw an unusual thing but did not mention it."
        rationale: |
          This invents an observation and silence. An unusual event may be easy to imagine. Check: use only what the statement says.
      - text: "The speaker made a statement with no interpretable meaning."
        rationale: |
          This treats a different grammar pattern as meaningless. The pattern differs from standard edited English. Check: recognize the specified dialect convention.
    explanation: |
      In a negative-concord dialect, "didn't" and "nothing" work together to express one negative. The statement means that no unusual thing was seen.
    approved: true
  - id: "q-grammar-and-structure-redundancy-and-double-negatives-0007"
    type: "redundancy-identification"
    difficulty: "easy"
    stem: |
      Which revision removes the literal repetition in "The ATM machine outside the bank is offline"?
    choices:
      - text: "The ATM outside the bank is offline."
        correct: true
      - text: "The ATM machine device outside the bank is offline."
        rationale: |
          This adds "device" while keeping a repeated "machine." Both describe an ATM, so the wording may sound precise. Expand ATM and remove a repeated label.
      - text: "The automatic ATM machine outside the bank is offline."
        rationale: |
          This adds "automatic" while keeping a repeated "machine." The machine works automatically, so that extra word may look useful. Check what each letter of ATM already represents.
      - text: "The machine ATM outside the bank is offline."
        rationale: |
          This moves "machine" before ATM without removing it. A changed order may seem like an edit. Expand the abbreviation and check whether the same meaning remains twice.
    explanation: |
      ATM stands for "automated teller machine." Adding "machine" after ATM repeats the final word of the abbreviation.
    approved: true
  - id: "q-grammar-and-structure-redundancy-and-double-negatives-0008"
    type: "redundancy-identification"
    difficulty: "medium"
    stem: |
      What does "She has barely started her homework" mean?
    choices:
      - text: "She has only just begun the homework."
        correct: true
      - text: "She has not begun the homework at all yet."
        rationale: |
          This treats "barely" as complete absence. "Barely" has a near-negative meaning. Check: distinguish a very small beginning from no beginning.
      - text: "She has already completed all of the homework."
        rationale: |
          This turns a small amount of progress into completion. The helping verb "has" marks an action related to the present. Check: include what "barely" says about the amount.
      - text: "She began the homework easily and made rapid progress."
        rationale: |
          This confuses "barely" with ease or manner. It resembles the adjective "bare" in spelling. Check: read it as a limit on how much progress was made.
    explanation: |
      "Barely started" means only just begun. The sentence says that very little work has been done.
    approved: true
  - id: "q-grammar-and-structure-redundancy-and-double-negatives-0009"
    type: "redundancy-identification"
    difficulty: "easy"
    stem: |
      Which revision removes the literal repetition in "Write the ISBN number on the form"?
    choices:
      - text: "Write the ISBN on the form."
        correct: true
      - text: "Write the ISBN number code on the form."
        rationale: |
          This adds "code" while keeping a repeated "number." ISBN identifies a book, so "code" may sound like helpful detail. Expand ISBN before adding a label.
      - text: "Write the book ISBN number on the form."
        rationale: |
          This adds "book" while keeping a repeated "number." Naming the item identified may look clearer. Check what the letters B and N already represent.
      - text: "Write the number ISBN on the form."
        rationale: |
          This moves "number" before ISBN without removing it. The altered order may look like a repair. Expand the abbreviation and check for repeated meaning.
    explanation: |
      ISBN stands for "International Standard Book Number." "ISBN number" repeats the word "number," so "ISBN" alone is the concise form.
    approved: true
  - id: "q-grammar-and-structure-redundancy-and-double-negatives-0010"
    type: "redundancy-identification"
    difficulty: "hard"
    stem: |
      In the stated situation, the runner reached the finish line. What does "He could scarcely finish the race" convey?
    choices:
      - text: "He finished, but only with great difficulty."
        correct: true
      - text: "He could not finish the race under any circumstances."
        rationale: |
          This reads "scarcely" as a complete inability. The word has a near-negative meaning. Check: distinguish barely managing from not managing at all.
      - text: "He finished the race easily and without much effort."
        rationale: |
          This removes the difficulty expressed by "scarcely". The sentence still includes "could finish". Check: include the limiting adverb.
      - text: "He never attempted to take part in the race."
        rationale: |
          This turns difficulty finishing into no participation. A hard race might discourage a runner. Check: keep the action the sentence describes.
    explanation: |
      "Could scarcely finish" means he only just managed to finish. It expresses great difficulty.
    approved: true
  - id: "q-grammar-and-structure-redundancy-and-double-negatives-0011"
    type: "redundancy-identification"
    difficulty: "hard"
    stem: |
      A speaker says "I don't have no time." Which statement best describes the sentence for an exam testing standard formal English?
    choices:
      - text: "It uses dialectal negative concord."
        correct: true
      - text: "Its two negatives must mean that the speaker has time."
        rationale: |
          This treats English negation as sign arithmetic. Two negative signs cancel in multiplication. Check: use the grammar of the stated language variety.
      - text: "It is an impossible construction in every English variety."
        rationale: |
          This generalizes the standard-formal rule to all dialects. The construction is avoided in standard edited English. Check: distinguish a dialect pattern from the required register.
      - text: "It meets every formal style merely because people say it."
        rationale: |
          This treats all spoken varieties as one formal convention. The sentence has an understandable dialect meaning. Check: follow the register the task requires.
    explanation: |
      "Don't" and "no" express one negative together in negative-concord dialects. A standard-formal exam would use "I don't have any time" or "I have no time."
    approved: true
  - id: "q-grammar-and-structure-redundancy-and-double-negatives-0012"
    type: "redundancy-identification"
    difficulty: "medium"
    stem: |
      For concise formal writing, revise "Please return back the library books by Friday."
    choices:
      - text: "Please return the library books by Friday."
        correct: true
      - text: "Please return back again the library books by Friday."
        rationale: |
          This adds another expression of coming back. The wording strongly emphasizes the request. Check: remove repeated meaning for this concise instruction.
      - text: "Please bring the library books somewhere else by Friday."
        rationale: |
          This changes returning into moving to an unspecified place. Both instructions concern moving the books. Check: preserve the destination implied by returning.
      - text: "Please keep the library books until Friday and take them home."
        rationale: |
          This changes the action from returning to keeping. The time limit remains familiar. Check: keep the original required action.
    explanation: |
      "Return" already means to bring or give something back. The concise revision keeps that action and the Friday deadline.
    approved: true
  - id: "q-grammar-and-structure-redundancy-and-double-negatives-0013"
    type: "redundancy-identification"
    difficulty: "medium"
    stem: |
      No earlier repetition has occurred. For concise formal writing, revise "Could you please repeat again what you just said?"
    choices:
      - text: "Could you please repeat what you just said?"
        correct: true
      - text: "Could you please repeat again once more what you just said?"
        rationale: |
          This adds more wording for doing the same thing again. The request sounds emphatic. Check: use the smallest wording that keeps the requested action.
      - text: "Could you please change what you just said into a new idea?"
        rationale: |
          This asks for a new message rather than a repetition. Both requests concern the previous words. Check: preserve the request to say those words again.
      - text: "Could you please explain why you chose those words just now?"
        rationale: |
          This asks for a reason instead of a repeat. An explanation may also help a listener. Check: keep the action requested in the original.
    explanation: |
      "Repeat" means say it again. With no separate earlier repeat to contrast, that verb alone expresses the request.
    approved: true
  - id: "q-grammar-and-structure-redundancy-and-double-negatives-0014"
    type: "redundancy-identification"
    difficulty: "medium"
    stem: |
      In standard formal English, revise "There isn't nobody at the office right now."
    choices:
      - text: "There isn't anybody at the office right now."
        correct: true
      - text: "There isn't nobody at the office right now."
        rationale: |
          This retains negative concord in the required formal register. The pattern has a single-negative meaning in some dialects. Check: use the stated standard-formal convention.
      - text: "There is somebody at the office right now, waiting inside."
        rationale: |
          This turns an empty office into an occupied one. It removes the negative-concord pattern. Check: preserve the intended absence of people.
      - text: "There isn't somebody specific at the office right now."
        rationale: |
          This denies one person's presence rather than everybody's. The phrase resembles "isn't anybody". Check: check whether the denial covers any person at all.
    explanation: |
      "Isn't anybody" expresses that no person is there. It uses the standard negative verb with "anybody."
    approved: true
  - id: "q-grammar-and-structure-redundancy-and-double-negatives-0015"
    type: "redundancy-identification"
    difficulty: "exam"
    stem: |
      Edit this sentence for standard formal English and concision: "The ATM machine wasn't never available, so I had to enter my PIN number at another terminal."
    choices:
      - text: "The ATM was never available, so I had to enter my PIN at another terminal."
        correct: true
      - text: "The ATM machine was never available, so I had to enter my PIN number at another terminal."
        rationale: |
          This fixes the negative wording but keeps the repeated abbreviation labels. The smoother verb phrase may make the whole revision seem complete. Check both abbreviations after checking the verb.
      - text: "The ATM wasn't never available, so I had to enter my PIN at another terminal."
        rationale: |
          This keeps two negatives for one negative meaning in formal English. That pattern is familiar in some dialects, so it may sound natural. Check the register requested in the stem.
      - text: "The ATM machine wasn't never available, so I had to enter my PIN number at another terminal."
        rationale: |
          This keeps the original negative pattern and repeated labels. Familiar wording may make the sentence seem acceptable. Check each part against the requested formal, concise style.
    explanation: |
      ATM means "automated teller machine," and PIN means "personal identification number." The abbreviations already include the labels, so use ATM and PIN alone. For the requested formal style, "was never available" gives one clear negative meaning.
    approved: true
  - id: "q-grammar-and-structure-redundancy-and-double-negatives-0016"
    type: "redundancy-identification"
    difficulty: "easy"
    stem: |
      The agency warned residents several days before a road closure, rather than only moments before it. Why can "advance warning" be useful here?
    choices:
      - text: "It distinguishes early notice from last-minute notice."
        correct: true
      - text: "It must be deleted because every warning contains the same timing detail."
        rationale: |
          This treats overlapping meanings as proof of an error. Warnings usually come before a danger or event. Check: check whether the added word distinguishes how early.
      - text: "It changes the warning into notice given only after the closure."
        rationale: |
          This reverses the time relation. Warnings and notices can concern events that already happened. Check: use the timing stated in this sentence.
      - text: "It proves every repeated phrase should be kept in formal writing."
        rationale: |
          This turns one useful distinction into a blanket rule. The phrase is useful in this context. Check: evaluate each phrase by the meaning it adds.
    explanation: |
      "Advance" points to the several days of preparation time. It distinguishes that early notice from a last-minute warning.
    approved: false
  - id: "q-grammar-and-structure-redundancy-and-double-negatives-0017"
    type: "redundancy-identification"
    difficulty: "medium"
    stem: |
      In standard edited English, what does "The result was not unexpected" most nearly mean?
    choices:
      - text: "The result was somewhat expected."
        correct: true
      - text: "The result was completely surprising to everyone."
        rationale: |
          This keeps only the meaning of "unexpected". That adjective is part of the phrase. Check: include the effect of "not".
      - text: "The result did not occur or could not be observed."
        rationale: |
          This treats the negation as denying the event itself. The sentence includes a negative word. Check: identify the description being negated.
      - text: "The result was guaranteed in every possible circumstance."
        rationale: |
          This makes a qualified description absolute. An expected result may seem certain. Check: preserve the less absolute wording.
    explanation: |
      "Unexpected" means not expected. Saying it was "not unexpected" gives a qualified positive meaning: it was somewhat expected.
    approved: false
  - id: "q-grammar-and-structure-redundancy-and-double-negatives-0018"
    type: "redundancy-identification"
    difficulty: "hard"
    stem: |
      Which sentence uses "scarcely" to express that almost no supplies remained in standard edited English?
    choices:
      - text: "Scarcely any supplies remained."
        correct: true
      - text: "Scarcely no supplies remained after the last group left."
        rationale: |
          This adds "no" to a near-negative adverb. The intended small amount feels negative. Check: use "any" with the near-negative wording.
      - text: "There didn't scarcely remain any supplies after the last group left."
        rationale: |
          This adds a negative verb to "scarcely". The construction is familiar in some dialects. Check: follow the stated edited-English convention.
      - text: "No supplies remained, and the entire storage room was empty."
        rationale: |
          This changes almost none into none at all. Both describe a shortage. Check: preserve the distinction between very little and zero.
    explanation: |
      "Scarcely" means almost not. "Scarcely any" therefore says that almost no supplies remained.
    approved: false
  - id: "q-grammar-and-structure-redundancy-and-double-negatives-0019"
    type: "redundancy-identification"
    difficulty: "hard"
    stem: |
      An editor shortens "The houses stand in close proximity" to "The houses stand in proximity." What should the editor check before accepting the change?
    choices:
      - text: "Whether \"close\" adds a useful degree of nearness."
        correct: true
      - text: "Whether every pair of words with related meanings must lose one word."
        rationale: |
          This applies a fixed deletion rule. Related meanings can be redundant. Check: check what meaning the removed word adds in context.
      - text: "Whether a longer sentence is always more suitable for formal writing."
        rationale: |
          This treats length as proof of quality. Formal writing can contain detailed wording. Check: judge the information rather than word count.
      - text: "Whether removing \"close\" changes the plural noun into a singular noun."
        rationale: |
          This mistakes a modifier's effect for number agreement. The adjective appears beside a location expression. Check: check meaning and emphasis rather than unrelated noun number.
    explanation: |
      "Close" may emphasize the degree of nearness. The editor should decide whether that extra meaning is needed in this context.
    approved: false
  - id: "q-grammar-and-structure-redundancy-and-double-negatives-0020"
    type: "redundancy-identification"
    difficulty: "exam"
    stem: |
      A writer intends to describe a proposal as fairly reasonable without giving strong praise. Which sentence preserves that qualified meaning?
    choices:
      - text: "The proposal is not unreasonable."
        correct: true
      - text: "The proposal is unreasonable and should be rejected outright."
        rationale: |
          This retains only the negative adjective's meaning. The word "unreasonable" is visible in the target phrase. Check: include the first "not".
      - text: "The proposal is perfectly reasonable in every respect."
        rationale: |
          This turns a qualified positive into an absolute endorsement. The intended meaning is broadly positive. Check: keep the limited strength of the original claim.
      - text: "The proposal cannot be described or evaluated in any way."
        rationale: |
          This treats two negative elements as making meaning impossible. Some multiple-negative patterns require care. Check: check whether the words create a standard qualified positive.
    explanation: |
      "Not unreasonable" gives a qualified positive judgment. It calls the proposal fairly reasonable without the stronger claim that it is perfect.
    approved: false
