meta:
  subject: "language-proficiency"
  topic: "grammar-and-structure"
  subtopic: "sentence-structure"
  exams:
    - "upcat"
    - "acet"
    - "dlsucet"
    - "ustet"
    - "dost-sei"
    - "cse-pro"
    - "cse-sub"
questions:
  - id: "q-grammar-and-structure-sentence-structure-0001"
    type: "sentence-structure-classification"
    difficulty: "easy"
    stem: |
      Classify this sentence: "The teacher and her students prepared and rehearsed the play."
    choices:
      - text: "Simple"
        correct: true
      - text: "Compound"
        rationale: |
          This counts the joined subjects or actions as separate clauses. The sentence contains several uses of "and". Check: find a separate subject-and-verb clause for each main statement.
      - text: "Complex"
        rationale: |
          This treats a detail about the play as a dependent clause. The sentence includes several grammatical groups. Check: look for a subordinate subject-and-verb group.
      - text: "Compound-complex"
        rationale: |
          This invents both extra main clauses and a subordinate clause. The sentence has two subjects and two action words. Check: count clauses rather than individual nouns or verbs.
    explanation: |
      The teacher and students share the actions "prepared and rehearsed." There is one independent clause and no dependent clause, so the sentence is simple.
    approved: true
  - id: "q-grammar-and-structure-sentence-structure-0002"
    type: "sentence-structure-classification"
    difficulty: "medium"
    stem: |
      Classify this sentence: "She wanted to travel abroad, but she could not afford the airfare."
    choices:
      - text: "Compound"
        correct: true
      - text: "Simple"
        rationale: |
          This counts only one statement about the same person. Both main clauses refer to "she". Check: test each side of "but" as its own sentence.
      - text: "Complex"
        rationale: |
          This treats "but" as a subordinating word. The two statements contrast. Check: check whether both clauses can stand alone.
      - text: "Compound-complex"
        rationale: |
          This treats "to travel abroad" as an added dependent clause. The phrase names another action. Check: look for a clause with its own subject and verb.
    explanation: |
      "She wanted to travel abroad" and "she could not afford the airfare" are independent clauses joined by "but." There is no dependent clause, so the sentence is compound.
    approved: true
  - id: "q-grammar-and-structure-sentence-structure-0003"
    type: "sentence-structure-classification"
    difficulty: "medium"
    stem: |
      Classify this sentence: "Although the storm was severe, the town suffered minimal damage."
    choices:
      - text: "Complex"
        correct: true
      - text: "Simple"
        rationale: |
          This leaves out "Although the storm was severe". The main statement about the town is complete. Check: count the opening subordinate clause too.
      - text: "Compound"
        rationale: |
          This treats the although-clause as independent. It has a subject and a verb. Check: include the effect of the opening "although".
      - text: "Compound-complex"
        rationale: |
          This counts the storm clause as another main clause. Two subject-and-verb groups are visible. Check: separate main clauses from subordinate clauses.
    explanation: |
      "Although the storm was severe" is dependent. "The town suffered minimal damage" is independent. One of each makes a complex sentence.
    approved: true
  - id: "q-grammar-and-structure-sentence-structure-0004"
    type: "sentence-structure-classification"
    difficulty: "medium"
    stem: |
      Classify this sentence: "When the bell rang, the students grabbed their bags, and they rushed out the door."
    choices:
      - text: "Compound-complex"
        correct: true
      - text: "Simple"
        rationale: |
          This counts only the bag-grabbing action. All actions concern one event at school. Check: find each subject-and-verb group.
      - text: "Compound"
        rationale: |
          This leaves out the dependent "when" clause. The last two clauses are joined with "and". Check: check for subordination before the main statements.
      - text: "Complex"
        rationale: |
          This merges "they rushed out the door" into the first main clause. Both main clauses describe the students. Check: check for the separate subject "they".
    explanation: |
      "When the bell rang" is dependent. "The students grabbed their bags" and "they rushed out the door" are independent. That combination makes a compound-complex sentence.
    approved: true
  - id: "q-grammar-and-structure-sentence-structure-0005"
    type: "sentence-structure-classification"
    difficulty: "medium"
    stem: |
      Classify this sentence: "Near the harbor, the old warehouse behind the fish market remained empty for several months."
    choices:
      - text: "Simple"
        correct: true
      - text: "Compound"
        rationale: |
          This treats extra descriptive groups as additional main clauses. The sentence is long. Check: find a separate subject and finite verb for each main clause.
      - text: "Complex"
        rationale: |
          This treats the place phrases as dependent clauses. They add details to the action. Check: look for a subject-and-verb group inside each phrase.
      - text: "Compound-complex"
        rationale: |
          This treats length as proof of several clause types. The sentence contains several place details. Check: count main and subordinate clauses separately.
    explanation: |
      The main subject is "the old warehouse," and its verb is "remained." The other groups add place and time details, so there is one independent clause and the sentence is simple.
    approved: true
  - id: "q-grammar-and-structure-sentence-structure-0006"
    type: "sentence-structure-classification"
    difficulty: "medium"
    stem: |
      Classify this sentence: "The rain stopped, so we went outside to play."
    choices:
      - text: "Compound"
        correct: true
      - text: "Simple"
        rationale: |
          This merges the two statements about the weather and the group. They describe one sequence of events. Check: test each side of "so" as a complete sentence.
      - text: "Complex"
        rationale: |
          This treats "so" as a subordinating connector. It links the second event to a reason. Check: check whether each main statement can stand alone.
      - text: "Compound-complex"
        rationale: |
          This counts "to play" as a separate dependent clause. It names an extra activity. Check: look for a clause with its own subject and verb.
    explanation: |
      "The rain stopped" and "we went outside to play" are independent clauses joined by "so." There is no dependent clause, so the sentence is compound.
    approved: true
  - id: "q-grammar-and-structure-sentence-structure-0007"
    type: "sentence-structure-classification"
    difficulty: "medium"
    stem: |
      Classify this sentence: "Since the exam was postponed, the students relaxed for the weekend."
    choices:
      - text: "Complex"
        correct: true
      - text: "Simple"
        rationale: |
          This ignores the subordinate exam clause. The students' relaxation is the main point. Check: count the opening "Since" clause too.
      - text: "Compound"
        rationale: |
          This treats the exam clause as an independent statement. "The exam was postponed" can stand without "since". Check: include the opening connector.
      - text: "Compound-complex"
        rationale: |
          This counts the two clauses as two independent clauses. Each has a subject and a verb. Check: test independence rather than just verb presence.
    explanation: |
      "Since the exam was postponed" is dependent. "The students relaxed for the weekend" is independent. One of each makes a complex sentence.
    approved: true
  - id: "q-grammar-and-structure-sentence-structure-0008"
    type: "sentence-structure-classification"
    difficulty: "medium"
    stem: |
      Classify this sentence: "The students lit candles, and they continued studying because the power went out."
    choices:
      - text: "Compound-complex"
        correct: true
      - text: "Simple"
        rationale: |
          This treats the whole studying event as one clause. All statements concern the same students. Check: find the separate subjects and verbs.
      - text: "Compound"
        rationale: |
          This ignores the reason clause introduced by "because". The first two main statements are joined by "and". Check: look for a subordinate clause at the end.
      - text: "Complex"
        rationale: |
          This merges the two main statements into one. They refer to the same students. Check: check whether each has its own stated subject.
    explanation: |
      "The students lit candles" and "they continued studying" are independent clauses. "Because the power went out" is dependent. Two independent clauses plus a dependent clause make the sentence compound-complex.
    approved: true
  - id: "q-grammar-and-structure-sentence-structure-0009"
    type: "sentence-structure-classification"
    difficulty: "medium"
    stem: |
      Tukuyin ang uri ng pangungusap: "Umuwi ang bata."
    choices:
      - text: "Payak"
        correct: true
      - text: "Tambalan"
        rationale: |
          This assumes a short action statement contains joined main clauses. A complete event can involve several ideas. Check: count the actual subject-and-verb statements.
      - text: "Hugnayan"
        rationale: |
          This imagines a dependent reason or time clause. A reason for going home could be supplied. Check: use only clauses actually written.
      - text: "Langkapan"
        rationale: |
          This assumes any complete thought combines several clause types. The statement is a full sentence. Check: look for both multiple main clauses and a dependent clause.
    explanation: |
      "Umuwi ang bata" gives one complete independent statement. It is payak, or simple.
    approved: true
  - id: "q-grammar-and-structure-sentence-structure-0010"
    type: "sentence-structure-classification"
    difficulty: "medium"
    stem: |
      Tukuyin ang uri ng pangungusap: "Umuwi ang bata ngunit naiwan ang bag niya."
    choices:
      - text: "Tambalan"
        correct: true
      - text: "Payak"
        rationale: |
          This merges the going-home and left-bag statements. Both concern the child's trip. Check: test each side of "ngunit" on its own.
      - text: "Hugnayan"
        rationale: |
          This treats "ngunit" as a subordinating connector. It marks a contrast. Check: check that both clauses are independent.
      - text: "Langkapan"
        rationale: |
          This adds a dependent clause that is not stated. The lost bag may suggest a reason or problem. Check: count only the written clauses.
    explanation: |
      "Umuwi ang bata" and "naiwan ang bag niya" are independent statements joined by "ngunit." The sentence is tambalan, or compound.
    approved: true
  - id: "q-grammar-and-structure-sentence-structure-0011"
    type: "sentence-structure-classification"
    difficulty: "medium"
    stem: |
      Tukuyin ang uri ng pangungusap: "Umuwi ang bata dahil umuulan na."
    choices:
      - text: "Hugnayan"
        correct: true
      - text: "Payak"
        rationale: |
          This leaves out the reason clause. The going-home statement is complete. Check: include "dahil umuulan na" in the count.
      - text: "Tambalan"
        rationale: |
          This treats the reason clause as independent. It contains the action "umuulan". Check: include the effect of "dahil".
      - text: "Langkapan"
        rationale: |
          This counts the reason clause as another main clause. Two clause groups are visible. Check: count independent and dependent groups separately.
    explanation: |
      "Umuwi ang bata" is independent, and "dahil umuulan na" is dependent. One of each makes the sentence hugnayan, or complex.
    approved: true
  - id: "q-grammar-and-structure-sentence-structure-0012"
    type: "sentence-structure-classification"
    difficulty: "medium"
    stem: |
      Tukuyin ang uri ng pangungusap: "Umuwi ang bata at nagsara ang tindahan dahil malakas na ang ulan."
    choices:
      - text: "Langkapan"
        correct: true
      - text: "Payak"
        rationale: |
          This counts only one overall event. All the clauses concern the same rainy situation. Check: identify each clause's own subject and action.
      - text: "Tambalan"
        rationale: |
          This ignores "dahil malakas na ang ulan". The first two main statements are joined by "at". Check: check for the final reason clause.
      - text: "Hugnayan"
        rationale: |
          This merges "Umuwi ang bata" and "nagsara ang tindahan". They are joined within one sentence. Check: test each of those statements independently.
    explanation: |
      "Umuwi ang bata" and "nagsara ang tindahan" are independent. "Dahil malakas na ang ulan" is dependent. The combination is langkapan, or compound-complex.
    approved: true
  - id: "q-grammar-and-structure-sentence-structure-0013"
    type: "sentence-structure-classification"
    difficulty: "hard"
    stem: |
      Which revision of "The dog and cat played" creates a compound sentence with two independent clauses?
    choices:
      - text: "The dog played, and the cat slept."
        correct: true
      - text: "The dog and cat played together in the yard."
        rationale: |
          This keeps a compound subject inside one clause. Two animals are joined with "and". Check: find a separate complete statement for each main clause.
      - text: "The dog played while the cat slept in the yard."
        rationale: |
          This subordinates the cat clause with "while". Both animals have an action. Check: check whether both clauses are independent.
      - text: "When the dog played, the cat slept in the yard."
        rationale: |
          This subordinates the dog clause with "when". The sentence has two subjects and actions. Check: include each connector in the independence test.
    explanation: |
      "The dog played" and "the cat slept" are independent clauses. Joining them with "and" makes a compound sentence.
    approved: true
  - id: "q-grammar-and-structure-sentence-structure-0014"
    type: "sentence-structure-classification"
    difficulty: "hard"
    stem: |
      Which clause inventory explains why "Because the meeting ran late, the team missed lunch" is complex?
    choices:
      - text: "One independent clause and one dependent clause"
        correct: true
      - text: "Two independent clauses with no dependent clause at all"
        rationale: |
          This treats the because-clause as independent. It contains its own subject and verb. Check: include "because" in the stand-alone test.
      - text: "One independent clause with no dependent clause at all"
        rationale: |
          This counts only the main statement about missing lunch. That statement can stand alone. Check: count the opening reason clause too.
      - text: "Two independent clauses and one dependent clause combined"
        rationale: |
          This imagines another main statement. The sentence has several nouns and verbs. Check: identify an actual second independent clause.
    explanation: |
      "Because the meeting ran late" is dependent. "The team missed lunch" is independent. This inventory makes the sentence complex.
    approved: true
  - id: "q-grammar-and-structure-sentence-structure-0015"
    type: "sentence-structure-classification"
    difficulty: "hard"
    stem: |
      Classify "If the rain stops when the guests arrive, we will open the hall."
    choices:
      - text: "Complex"
        correct: true
      - text: "Simple"
        rationale: |
          This ignores the two dependent clauses. There is only one main action. Check: count the clauses introduced by "if" and "when".
      - text: "Compound"
        rationale: |
          This treats every clause as independent. Several clauses appear in the sentence. Check: check the subordinate connectors.
      - text: "Compound-complex"
        rationale: |
          This counts multiple dependent clauses as multiple main clauses. The sentence contains more than two clauses. Check: count independent clauses separately.
    explanation: |
      "We will open the hall" is the only independent clause. "If the rain stops" and "when the guests arrive" are dependent, so the sentence is complex.
    approved: true
  - id: "q-grammar-and-structure-sentence-structure-0016"
    type: "sentence-structure-classification"
    difficulty: "exam"
    stem: |
      Classify this sentence: "Since the flight was delayed, the passengers waited in the lounge, and some of them ordered food, but others simply read books."
    choices:
      - text: "Compound-complex"
        correct: true
      - text: "Complex: one dependent clause plus one independent clause"
        rationale: |
          This merges three separate main statements into one. All concern the waiting passengers. Check: identify each separate subject-and-verb main clause.
      - text: "Compound: three independent clauses with no dependent clause"
        rationale: |
          This ignores the opening "Since" clause. The main statements are joined by coordinating connectors. Check: count the subordinate opening too.
      - text: "Simple: one clause overall"
        rationale: |
          This treats a long series of statements as one clause. All events occur during the same delay. Check: look for the subjects "passengers," "some," and "others".
    explanation: |
      "Since the flight was delayed" is dependent. "The passengers waited," "some of them ordered food," and "others simply read books" are three independent statements. That combination makes the sentence compound-complex.
    approved: true
  - id: "q-grammar-and-structure-sentence-structure-0017"
    type: "sentence-structure-classification"
    difficulty: "easy"
    stem: |
      Classify "The clinic reopened; appointments resumed."
    choices:
      - text: "Compound"
        correct: true
      - text: "Simple"
        rationale: |
          This counts the single punctuation line as one clause. There is no coordinating word such as "and". Check: test both sides of the semicolon as sentences.
      - text: "Complex"
        rationale: |
          This treats the semicolon as a subordinating connector. It links the two statements. Check: check whether either clause depends on the other.
      - text: "Compound-complex"
        rationale: |
          This adds a dependent clause that is not present. Two clauses are already visible. Check: look for an actual subordinate clause.
    explanation: |
      Both "The clinic reopened" and "appointments resumed" are independent clauses. A semicolon joins them, so the sentence is compound.
    approved: false
  - id: "q-grammar-and-structure-sentence-structure-0018"
    type: "sentence-structure-classification"
    difficulty: "medium"
    stem: |
      Which sentence is simple despite beginning with "After"?
    choices:
      - text: "After rehearsal, the musicians left."
        correct: true
      - text: "After rehearsal ended, the musicians left the hall."
        rationale: |
          This treats the whole opening as only a time phrase. The word "after" begins both kinds of groups. Check: check for the opening subject and verb "rehearsal ended".
      - text: "The musicians left after the rehearsal ended at the hall."
        rationale: |
          This misses a dependent clause after the main statement. The main clause comes first. Check: inspect the words following "after".
      - text: "After the musicians left, the caretaker closed the hall."
        rationale: |
          This ignores the subject and verb in the opening clause. A time introduction can look like a phrase. Check: check whether the opening group has its own clause.
    explanation: |
      "After rehearsal" is a prepositional phrase giving time. "The musicians left" is the only clause, so the sentence is simple.
    approved: false
  - id: "q-grammar-and-structure-sentence-structure-0019"
    type: "sentence-structure-classification"
    difficulty: "hard"
    stem: |
      Classify "The nurse, while she checked the records, called the patient."
    choices:
      - text: "Complex"
        correct: true
      - text: "Simple"
        rationale: |
          This overlooks the dependent clause within the sentence. There is one main action of calling. Check: include "while she checked the records" in the count.
      - text: "Compound"
        rationale: |
          This treats the dependent clause as an independent statement. Checking and calling are both actions. Check: include "while" in the stand-alone test.
      - text: "Compound-complex"
        rationale: |
          This counts the embedded clause as another main clause. The sentence contains two action words. Check: count independent clauses separately from dependent ones.
    explanation: |
      "While she checked the records" is a dependent clause giving time. The main clause is "The nurse called the patient." One of each makes the sentence complex.
    approved: false
  - id: "q-grammar-and-structure-sentence-structure-0020"
    type: "sentence-structure-classification"
    difficulty: "exam"
    stem: |
      Delete only "Although the road was flooded" from "Although the road was flooded, the truck arrived, and the driver unloaded the supplies." What structure remains?
    choices:
      - text: "Compound"
        correct: true
      - text: "Simple"
        rationale: |
          This merges two surviving main clauses. Both actions concern the delivery. Check: look for the separate subject "the driver".
      - text: "Complex"
        rationale: |
          This assumes a dependent clause remains after deletion. The original sentence had a subordinate opening. Check: count only the words left after the instructed change.
      - text: "Compound-complex"
        rationale: |
          This retains the original classification after the dependent clause is removed. The two main statements are unchanged. Check: check whether any dependent clause survives.
    explanation: |
      The remaining clauses are "The truck arrived" and "the driver unloaded the supplies." Both are independent and joined by "and," so the remaining sentence is compound.
    approved: false
