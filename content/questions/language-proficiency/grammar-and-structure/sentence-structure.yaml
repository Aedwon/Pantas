meta:
  subject: language-proficiency
  topic: grammar-and-structure
  subtopic: sentence-structure
  exams: [ upcat, acet, dlsucet, ustet, dost-sei , cse-pro, cse-sub]
questions:
  - id: q-grammar-and-structure-sentence-structure-0001
    type: sentence-structure-classification
    difficulty: easy
    stem: |
      Classify this sentence: "The teacher and her students prepared and rehearsed the play."
    choices:
      - text: Simple
        correct: true
      - text: Compound
        rationale: |
          A compound subject and compound predicate can still belong to one independent clause.
      - text: Complex
        rationale: |
          There is no dependent clause.
      - text: Compound-complex
        rationale: |
          The sentence has neither multiple independent clauses nor a dependent clause.
    explanation: |
      The sentence has one independent clause, despite its compound subject and predicate, so it is simple.
    approved: true

  - id: q-grammar-and-structure-sentence-structure-0002
    type: sentence-structure-classification
    difficulty: medium
    stem: |
      Classify this sentence: "She wanted to travel abroad, but she could not afford the airfare."
    choices:
      - text: Compound
        correct: true
      - text: Simple
        rationale: |
          Two independent clauses are joined by "but."
      - text: Complex
        rationale: |
          Neither clause is dependent.
      - text: Compound-complex
        rationale: |
          There is no dependent clause.
    explanation: |
      "She wanted to travel abroad" and "she could not afford the airfare" can each stand alone; joined together, they form a compound sentence.
    approved: true

  - id: q-grammar-and-structure-sentence-structure-0003
    type: sentence-structure-classification
    difficulty: medium
    stem: |
      Classify this sentence: "Although the storm was severe, the town suffered minimal damage."
    choices:
      - text: Complex
        correct: true
      - text: Simple
        rationale: |
          "Although the storm was severe" is a dependent clause.
      - text: Compound
        rationale: |
          The clause beginning with "although" cannot stand independently in this construction.
      - text: Compound-complex
        rationale: |
          There is only one independent clause.
    explanation: |
      One dependent clause plus one independent clause makes this a complex sentence.
    approved: true

  - id: q-grammar-and-structure-sentence-structure-0004
    type: sentence-structure-classification
    difficulty: medium
    stem: |
      Classify this sentence: "When the bell rang, the students grabbed their bags, and they rushed out the door."
    choices:
      - text: Compound-complex
        correct: true
      - text: Simple
        rationale: |
          The sentence contains one dependent and two independent clauses.
      - text: Compound
        rationale: |
          This misses the dependent introductory clause.
      - text: Complex
        rationale: |
          This misses the second independent clause joined by "and."
    explanation: |
      "When the bell rang" is dependent; the two following clauses are independent. That combination is compound-complex.
    approved: true

  - id: q-grammar-and-structure-sentence-structure-0005
    type: sentence-structure-classification
    difficulty: medium
    stem: |
      Classify this sentence: "The children laughed and played in the yard."
    choices:
      - text: Simple
        correct: true
      - text: Compound
        rationale: |
          "Laughed and played" is a compound predicate within one clause.
      - text: Complex
        rationale: |
          There is no dependent clause.
      - text: Compound-complex
        rationale: |
          There is only one independent clause and no dependent clause.
    explanation: |
      A compound predicate does not create a second clause; this is a simple sentence.
    approved: true

  - id: q-grammar-and-structure-sentence-structure-0006
    type: sentence-structure-classification
    difficulty: medium
    stem: |
      Classify this sentence: "The rain stopped, so we went outside to play."
    choices:
      - text: Compound
        correct: true
      - text: Simple
        rationale: |
          The sentence contains two independent clauses.
      - text: Complex
        rationale: |
          Neither clause is dependent.
      - text: Compound-complex
        rationale: |
          There is no dependent clause.
    explanation: |
      Two independent clauses joined by the coordinating conjunction "so" make this compound.
    approved: true

  - id: q-grammar-and-structure-sentence-structure-0007
    type: sentence-structure-classification
    difficulty: medium
    stem: |
      Classify this sentence: "Since the exam was postponed, the students relaxed for the weekend."
    choices:
      - text: Complex
        correct: true
      - text: Simple
        rationale: |
          The sentence contains the dependent clause "Since the exam was postponed."
      - text: Compound
        rationale: |
          Only one clause is independent.
      - text: Compound-complex
        rationale: |
          A compound-complex sentence needs at least two independent clauses.
    explanation: |
      One dependent clause plus one independent clause makes a complex sentence.
    approved: true

  - id: q-grammar-and-structure-sentence-structure-0008
    type: sentence-structure-classification
    difficulty: medium
    stem: |
      Classify this sentence: "Because the power went out, the students lit candles, and they continued studying by candlelight."
    choices:
      - text: Compound-complex
        correct: true
      - text: Simple
        rationale: |
          The sentence contains three clauses.
      - text: Compound
        rationale: |
          This misses the dependent "because" clause.
      - text: Complex
        rationale: |
          This misses the second independent clause.
    explanation: |
      There is one dependent clause and two independent clauses, so the sentence is compound-complex.
    approved: true

  - id: q-grammar-and-structure-sentence-structure-0009
    type: sentence-structure-classification
    difficulty: medium
    stem: |
      Tukuyin ang uri ng pangungusap: "Umuwi ang bata."
    choices:
      - text: Payak
        correct: true
      - text: Tambalan
        rationale: |
          Iisa lamang ang malayang sugnay.
      - text: Hugnayan
        rationale: |
          Walang di-malayang sugnay.
      - text: Langkapan
        rationale: |
          Walang kombinasyon ng dalawa o higit pang malayang sugnay at di-malayang sugnay.
    explanation: |
      Iisang malayang sugnay lamang ang pangungusap, kaya ito ay payak.
    approved: true

  - id: q-grammar-and-structure-sentence-structure-0010
    type: sentence-structure-classification
    difficulty: medium
    stem: |
      Tukuyin ang uri ng pangungusap: "Umuwi ang bata ngunit naiwan ang bag niya."
    choices:
      - text: Tambalan
        correct: true
      - text: Payak
        rationale: |
          May dalawang malayang sugnay na pinag-ugnay ng "ngunit."
      - text: Hugnayan
        rationale: |
          Parehong malaya ang dalawang pangunahing sugnay.
      - text: Langkapan
        rationale: |
          Walang di-malayang sugnay sa pangungusap.
    explanation: |
      "Umuwi ang bata" at "naiwan ang bag niya" ay dalawang malayang sugnay, kaya tambalan ang pangungusap.
    approved: true

  - id: q-grammar-and-structure-sentence-structure-0011
    type: sentence-structure-classification
    difficulty: medium
    stem: |
      Tukuyin ang uri ng pangungusap: "Umuwi ang bata dahil umuulan na."
    choices:
      - text: Hugnayan
        correct: true
      - text: Payak
        rationale: |
          May di-malayang sugnay na "dahil umuulan na."
      - text: Tambalan
        rationale: |
          Hindi malaya ang sugnay na nagsisimula sa "dahil."
      - text: Langkapan
        rationale: |
          Iisa lamang ang malayang sugnay.
    explanation: |
      May isang malayang sugnay at isang di-malayang sugnay, kaya hugnayan ang pangungusap.
    approved: true

  - id: q-grammar-and-structure-sentence-structure-0012
    type: sentence-structure-classification
    difficulty: medium
    stem: |
      Tukuyin ang uri ng pangungusap: "Umuwi ang bata at nagsara ang tindahan dahil malakas na ang ulan."
    choices:
      - text: Langkapan
        correct: true
      - text: Payak
        rationale: |
          Higit sa isang sugnay ang pangungusap.
      - text: Tambalan
        rationale: |
          Bukod sa dalawang malayang sugnay, mayroon ding di-malayang sugnay na "dahil malakas na ang ulan."
      - text: Hugnayan
        rationale: |
          May dalawang malinaw na malayang sugnay: "Umuwi ang bata" at "nagsara ang tindahan."
    explanation: |
      Pinag-ugnay ang dalawang malayang sugnay na "Umuwi ang bata" at "nagsara ang tindahan," at idinagdag ang di-malayang sugnay na "dahil malakas na ang ulan." Sa karaniwang klasipikasyong pampaaralan, ito ay langkapan.
    approved: true

  - id: q-grammar-and-structure-sentence-structure-0013
    type: sentence-structure-classification
    difficulty: hard
    stem: |
      A student sees "The dog and cat played" and classifies it as compound because it has two nouns joined by "and." Is this correct?
    choices:
      - text: 'No: "dog and cat" is a compound subject within one independent clause, so the sentence remains simple.'
        correct: true
      - text: 'Yes: any two nouns joined by "and" create a compound sentence.'
        rationale: |
          Compound sentence classification depends on clauses, not simply the number of nouns.
      - text: 'Yes: because the nouns name different animals.'
        rationale: |
          The semantic categories of the nouns do not determine sentence structure.
      - text: 'No: because "played" is in the wrong tense.'
        rationale: |
          The verb tense is grammatically possible and not the reason for the classification.
    explanation: |
      A compound subject does not create two clauses; the sentence has one independent clause and is simple.
    approved: true

  - id: q-grammar-and-structure-sentence-structure-0014
    type: sentence-structure-classification
    difficulty: hard
    stem: |
      A student classifies "Because the meeting ran late, the team missed lunch" as compound because it has two clauses. Is this correct?
    choices:
      - text: 'No: the first clause is dependent and the second is independent, so the sentence is complex.'
        correct: true
      - text: 'Yes: any sentence with two clauses is compound.'
        rationale: |
          A compound sentence requires independent clauses.
      - text: 'Yes: because both clauses contain verbs.'
        rationale: |
          Having a verb does not make a clause independent.
      - text: 'No: because the sentence has only one clause.'
        rationale: |
          It has two clauses, one dependent and one independent.
    explanation: |
      One dependent clause plus one independent clause makes this complex, not compound.
    approved: true

  - id: q-grammar-and-structure-sentence-structure-0015
    type: sentence-structure-classification
    difficulty: hard
    stem: |
      A student classifies "Although she was nervous, she gave an excellent speech" as compound-complex. Is this correct?
    choices:
      - text: 'No: it has one dependent clause and one independent clause, so it is complex.'
        correct: true
      - text: 'Yes: its length makes it compound-complex.'
        rationale: |
          Sentence length does not determine clause classification.
      - text: 'Yes: any dependent clause makes a sentence compound-complex.'
        rationale: |
          Compound-complex structure also requires at least two independent clauses.
      - text: 'No: it contains no dependent clause.'
        rationale: |
          "Although she was nervous" is a dependent clause.
    explanation: |
      A compound-complex sentence needs at least two independent clauses plus a dependent clause. This sentence has only one independent clause.
    approved: true

  - id: q-grammar-and-structure-sentence-structure-0016
    type: sentence-structure-classification
    difficulty: exam
    stem: |
      Classify this sentence: "Since the flight was delayed, the passengers waited in the lounge, and some of them ordered food, but others simply read books."
    choices:
      - text: 'Compound-complex: one dependent clause plus three independent clauses'
        correct: true
      - text: 'Complex: one dependent clause plus one independent clause'
        rationale: |
          There are three independent clauses after the introductory dependent clause.
      - text: 'Compound: three independent clauses with no dependent clause'
        rationale: |
          "Since the flight was delayed" is dependent.
      - text: 'Simple: one clause overall'
        rationale: |
          The sentence contains four clauses in total.
    explanation: |
      The introductory "since" clause is dependent, followed by three independent clauses, so the sentence is compound-complex.
    approved: true
