meta:
  subject: language-proficiency
  topic: grammar-and-structure
  subtopic: pronoun-antecedent-agreement
  exams: [ upcat, acet, dlsucet, ustet, dost-sei , cse-pro, cse-sub]
questions:
  - id: q-grammar-and-structure-pronoun-antecedent-agreement-0001
    type: pronoun-reference
    difficulty: easy
    stem: |
      Choose the correct pronoun: The girl lost ______ book on the way home.
    choices:
      - text: Her
        correct: true
      - text: Their
        rationale: |
          The sentence identifies the antecedent as "the girl," so "her" is the most direct possessive pronoun for the person described.
      - text: His
        rationale: |
          You picked the masculine pronoun "his," but the antecedent "girl" is female.
      - text: Its
        rationale: |
          You picked the neuter pronoun "its," which is used for non-person antecedents here rather than the girl.
    explanation: |
      "Girl" is a singular antecedent identified as female, so the most direct possessive pronoun is "her."
    approved: true

  - id: q-grammar-and-structure-pronoun-antecedent-agreement-0002
    type: pronoun-reference
    difficulty: easy
    stem: |
      Choose the correct pronoun: The girls lost ______ books on the way home.
    choices:
      - text: Their
        correct: true
      - text: Her
        rationale: |
          You picked the singular pronoun "her," but "girls" is plural and requires a plural pronoun.
      - text: His
        rationale: |
          You picked the singular masculine pronoun "his," but the antecedent "girls" is plural.
      - text: Its
        rationale: |
          You picked the singular neuter pronoun "its," but "girls" is a plural group of people.
    explanation: |
      "Girls" is a plural antecedent, so it needs the plural pronoun "their."
    approved: true

  - id: q-grammar-and-structure-pronoun-antecedent-agreement-0003
    type: pronoun-reference
    difficulty: medium
    stem: |
      Choose the gender-neutral pronoun: Each of the students must submit ______ essay by Friday.
    choices:
      - text: Their
        correct: true
      - text: His
        rationale: |
          "His" assumes a male student even though the sentence gives no gender. Modern formal English permits singular "their" with an indefinite antecedent such as "each."
      - text: Her
        rationale: |
          "Her" assumes a female student even though the sentence gives no gender. Modern formal English permits singular "their" with an indefinite antecedent such as "each."
      - text: Its
        rationale: |
          "Its" is not the appropriate personal possessive pronoun for a student.
    explanation: |
      Although "each" is grammatically singular, singular "they/their" is accepted in modern formal English when a person's gender is unknown or irrelevant. "Each of the students must submit their essay" is therefore the gender-neutral choice.
    approved: true

  - id: q-grammar-and-structure-pronoun-antecedent-agreement-0004
    type: pronoun-reference
    difficulty: medium
    stem: |
      Choose the gender-neutral pronoun: Somebody left ______ umbrella in the classroom.
    choices:
      - text: Their
        correct: true
      - text: His
        rationale: |
          "His" assumes the unknown person's gender. Singular "their" is accepted in modern formal English for an indefinite person such as "somebody."
      - text: Her
        rationale: |
          "Her" assumes the unknown person's gender. Singular "their" is accepted in modern formal English for an indefinite person such as "somebody."
      - text: Its
        rationale: |
          "Its" is not the appropriate personal possessive pronoun for the person denoted by "somebody."
    explanation: |
      "Somebody" is grammatically singular, but modern formal English accepts singular "their" for a person whose gender is unknown or irrelevant.
    approved: true

  - id: q-grammar-and-structure-pronoun-antecedent-agreement-0005
    type: pronoun-reference
    difficulty: medium
    stem: |
      Choose the correct pronoun: The company announced ______ new policy yesterday.
    choices:
      - text: Its
        correct: true
      - text: Their
        rationale: |
          You picked "their," treating "company" as plural. In the convention used here, the company acts as one organization and takes "its."
      - text: His
        rationale: |
          You picked "his," but a corporation or company is not a male person.
      - text: Her
        rationale: |
          You picked "her," but a business organization is not a female person.
    explanation: |
      "Company" refers to one organization acting as a single unit here, so the sentence uses the singular possessive pronoun "its."
    approved: true

  - id: q-grammar-and-structure-pronoun-antecedent-agreement-0006
    type: pronoun-reference
    difficulty: medium
    stem: |
      Choose the correct pronoun: The class finished ______ project ahead of schedule.
    choices:
      - text: Its
        correct: true
      - text: Their
        rationale: |
          In the convention used here, "class" is treated as one collective unit completing a shared project, so "its" is the expected choice.
      - text: His
        rationale: |
          You assigned a gendered pronoun to the collective noun "class."
      - text: Her
        rationale: |
          You assigned a gendered pronoun to the collective noun "class."
    explanation: |
      The sentence treats "class" as one collective unit completing a shared project, so it uses the singular pronoun "its."
    approved: true

  - id: q-grammar-and-structure-pronoun-antecedent-agreement-0007
    type: pronoun-reference
    difficulty: medium
    stem: |
      Choose the correct pronoun: Liza and Carlo finished ______ project early.
    choices:
      - text: Their
        correct: true
      - text: Her
        rationale: |
          You picked "her," focusing only on Liza, but compound antecedents joined by "and" are plural.
      - text: His
        rationale: |
          You picked "his," focusing only on Carlo, but compound antecedents joined by "and" are plural.
      - text: Its
        rationale: |
          You picked "its," which does not agree with the plural human antecedent "Liza and Carlo."
    explanation: |
      "Liza and Carlo" is a compound antecedent joined by "and," making it plural, so it takes the pronoun "their."
    approved: true

  - id: q-grammar-and-structure-pronoun-antecedent-agreement-0008
    type: pronoun-reference
    difficulty: medium
    stem: |
      Choose the correct pronoun: Neither the coach nor the players brought ______ equipment.
    choices:
      - text: Their
        correct: true
      - text: His
        rationale: |
          You picked "his" based on the first noun ("coach"), but the nearer antecedent "players" is plural.
      - text: Its
        rationale: |
          You picked "its," but "players" is a plural human antecedent.
      - text: Her
        rationale: |
          You picked "her," but the nearer antecedent "players" is plural and requires "their."
    explanation: |
      With "neither...nor," traditional proximity agreement matches the pronoun to the nearer antecedent. Here "players" is plural, so "their" fits.
    approved: true

  - id: q-grammar-and-structure-pronoun-antecedent-agreement-0009
    type: pronoun-reference
    difficulty: medium
    stem: |
      Identify the problem with this sentence: "When Mrs. Santos spoke to Anna, she seemed upset."
    choices:
      - text: 'The pronoun "she" is ambiguous: it could refer to either Mrs. Santos or Anna.'
        correct: true
      - text: The sentence has a subject-verb agreement error.
        rationale: |
          You misidentified the error. The verbs agree with their subjects, but "she" could point to two different people.
      - text: The sentence incorrectly uses "she" since both people are named individuals.
        rationale: |
          You assumed named individuals cannot be referenced by "she." Pronouns are fine as long as the antecedent is clear.
      - text: There is no problem; the sentence is fully correct and clear.
        rationale: |
          You assumed the sentence was clear, but a reader cannot determine whether Mrs. Santos or Anna was upset.
    explanation: |
      The pronoun "she" could refer to either Mrs. Santos or Anna: it is unclear which one seemed upset. This is an ambiguous antecedent error.
    approved: true

  - id: q-grammar-and-structure-pronoun-antecedent-agreement-0010
    type: pronoun-reference
    difficulty: medium
    stem: |
      Identify the problem with this sentence: "After Mark greeted John, he smiled warmly."
    choices:
      - text: 'The pronoun "he" is ambiguous: it could refer to either Mark or John.'
        correct: true
      - text: The sentence has a subject-verb agreement error.
        rationale: |
          You looked for verb agreement issues, but the verbs are fine. The real issue is the ambiguous pronoun "he."
      - text: The sentence incorrectly uses "he" since both people are named individuals.
        rationale: |
          You claimed pronouns cannot follow proper names, but the issue is that two possible antecedents fit the pronoun.
      - text: There is no problem; the sentence is fully correct and clear.
        rationale: |
          You assumed the sentence was clear, but "he" could refer to either Mark or John.
    explanation: |
      The pronoun "he" could refer to either Mark or John, so the antecedent is unclear. Naming the intended person directly removes the ambiguity.
    approved: true

  - id: q-grammar-and-structure-pronoun-antecedent-agreement-0011
    type: pronoun-reference
    difficulty: medium
    stem: |
      Ang salitang "siya" sa Filipino ay ______.
    choices:
      - text: Walang tinutukoy na kasarian, maaaring lalaki o babae
        correct: true
      - text: Tumutukoy lamang sa babae
        rationale: |
          Pinili mo ang babae, ngunit ang "siya" sa Filipino ay gender-neutral at ginagamit din sa lalaki.
      - text: Tumutukoy lamang sa lalaki
        rationale: |
          Pinili mo ang lalaki, ngunit ang "siya" ay pwedeng gamitin para sa babae o lalaki.
      - text: Ginagamit lamang para sa mga bagay
        rationale: |
          Pinili mo ang mga bagay, ngunit ang "siya" ay ginagamit para sa tao.
    explanation: |
      Ang "siya" ay gender-neutral sa Filipino: nangangahulugan itong "he" o "she" nang walang hiwalay na salita para sa bawat isa.
    approved: true

  - id: q-grammar-and-structure-pronoun-antecedent-agreement-0012
    type: pronoun-reference
    difficulty: medium
    stem: |
      Piliin ang tamang panghalip: Isang estudyante lamang ang nagdala ng proyekto; ipinakita ______ ito sa buong klase.
    choices:
      - text: Niya
        correct: true
      - text: Nila
        rationale: |
          Pinili mo ang "nila" (maramihan), ngunit ang tinutukoy ay "isang estudyante lamang" (isahan).
      - text: Namin
        rationale: |
          Pinili mo ang "namin," ngunit kasama roon ang nagsasalita at hindi ang solong estudyante.
      - text: Ninyo
        rationale: |
          Pinili mo ang "ninyo," na ginagamit para sa taong kausap sa halip na sa ikatlong tao.
    explanation: |
      Dahil "isang estudyante lamang" (isang tao lamang) ang tinutukoy, ang tamang panghalip ay "niya" (isahan), hindi "nila" (maramihan).
    approved: true

  - id: q-grammar-and-structure-pronoun-antecedent-agreement-0013
    type: pronoun-reference
    difficulty: medium
    stem: |
      Alin sa mga sumusunod na panghalip ang kabilang sa "ang" set (bilang tagaganap o paksa)?
    choices:
      - text: Siya
        correct: true
      - text: Niya
        rationale: |
          Pinili mo ang "niya," ngunit ito ay kabilang sa "ng" set at hindi sa "ang" set.
      - text: Kaniya
        rationale: |
          Pinili mo ang "kaniya," ngunit ito ay kabilang sa "sa" set at hindi sa "ang" set.
      - text: Nila
        rationale: |
          Pinili mo ang "nila," ngunit ito ay maramihan at kabilang sa "ng" set.
    explanation: |
      Ang "siya" ay kabilang sa "ang" set, na ginagamit para sa tagaganap o paksa ng pangungusap. Ang "niya" ay "ng" set, at ang "kaniya" ay "sa" set.
    approved: true

  - id: q-grammar-and-structure-pronoun-antecedent-agreement-0014
    type: pronoun-reference
    difficulty: hard
    stem: |
      A student writes "Everybody should bring their own lunch." Is singular "their" acceptable in modern formal English for the indefinite antecedent "everybody"?
    choices:
      - text: 'Yes: singular "they/their" is accepted for a person whose gender is unknown or irrelevant, while "everybody" still takes a singular verb.'
        correct: true
      - text: 'No: singular "they/their" is only informal slang and is never acceptable in formal writing.'
        rationale: |
          Modern reference works and style guidance accept singular "they/their" for an unspecified person; the pronoun does not make the verb after "everybody" plural.
      - text: 'Yes: but only because "everybody" is grammatically plural.'
        rationale: |
          "Everybody" is grammatically singular for verb agreement even though it refers to multiple people.
      - text: 'No: "their" can refer only to two or more specifically named people.'
        rationale: |
          "Their" also has an established singular use for a person whose gender is unknown or irrelevant.
    explanation: |
      Modern formal English accepts singular "they/their" with an indefinite person such as "everybody." The antecedent remains grammatically singular for verb agreement: "Everybody has their own lunch."
    approved: true

  - id: q-grammar-and-structure-pronoun-antecedent-agreement-0015
    type: pronoun-reference
    difficulty: hard
    stem: |
      In a style that treats the collective noun "team" as one unit, which pronoun best completes "The team celebrated ______ victory"?
    choices:
      - text: Its
        correct: true
      - text: Their
        rationale: |
          Some varieties of English allow plural agreement with collective nouns, but this stem explicitly asks for the convention that treats "team" as one unit.
      - text: His
        rationale: |
          "His" assigns a human gender to the collective noun "team."
      - text: Her
        rationale: |
          "Her" assigns a human gender to the collective noun "team."
    explanation: |
      Under the convention specified in the stem, "team" is treated as one collective unit, so the matching pronoun is "its." Other English varieties may allow plural agreement when the individual members are emphasized.
    approved: true

  - id: q-grammar-and-structure-pronoun-antecedent-agreement-0016
    type: pronoun-reference
    difficulty: hard
    stem: |
      Identify the ambiguous antecedent problem: "Sarah told Michelle that her painting won first place." Whose painting won?
    choices:
      - text: 'It is unclear: "her" could refer to either Sarah or Michelle, since both are possible antecedents.'
        correct: true
      - text: It clearly refers to Sarah, since she is mentioned first in the sentence.
        rationale: |
          You assumed word order resolves ambiguity, but the sentence does not identify Sarah as the owner of the painting.
      - text: It clearly refers to Michelle, since she is mentioned second in the sentence.
        rationale: |
          You assumed proximity resolves ambiguity, but the sentence does not identify Michelle as the owner of the painting.
      - text: There is no ambiguity, since only one person's painting can win.
        rationale: |
          You relied on information not supplied by the sentence. Either person's painting could be the one that won.
    explanation: |
      If a pronoun could reasonably refer to more than one antecedent, the reference is unclear. Here, "her" could point to either Sarah or Michelle.
    approved: true

  - id: q-grammar-and-structure-pronoun-antecedent-agreement-0017
    type: pronoun-reference
    difficulty: medium
    stem: |
      Choose the gender-neutral pronoun: Neither the players nor the coach brought ______ own equipment.
    choices:
      - text: Their
        correct: true
      - text: His
        rationale: |
          "His" assumes the coach is male. With an unspecified person, singular "their" provides a gender-neutral reference to the nearer antecedent "coach."
      - text: Her
        rationale: |
          "Her" assumes the coach is female. With an unspecified person, singular "their" provides a gender-neutral reference to the nearer antecedent "coach."
      - text: Its
        rationale: |
          "Its" is not the appropriate personal possessive pronoun for the coach.
    explanation: |
      The nearer antecedent is the singular person "coach." Modern formal English permits singular "their" when that person's gender is unspecified.
    approved: true

  - id: q-grammar-and-structure-pronoun-antecedent-agreement-0018
    type: pronoun-reference
    difficulty: exam
    stem: |
      Choose the pronouns using gender-neutral modern English and treating "team" as one unit: Each of the volunteers brought ______ own supplies; afterward, the coordinator said the team was proud of ______ accomplishment.
    choices:
      - text: Their, its
        correct: true
      - text: His, its
        rationale: |
          "His" assumes every volunteer is male. Singular "their" is the gender-neutral choice for "each," while the stem tells you to treat "team" as one unit and use "its."
      - text: Her, its
        rationale: |
          "Her" assumes every volunteer is female. Singular "their" is the gender-neutral choice for "each," while the stem tells you to treat "team" as one unit and use "its."
      - text: Their, his
        rationale: |
          The first blank is correct, but "his" assigns a human gender to the collective noun "team." Under the convention specified in the stem, use "its."
    explanation: |
      Singular "their" is accepted for the indefinite antecedent "each" when gender is unspecified. The stem explicitly treats "team" as one collective unit, so the second pronoun is "its."
    approved: true
