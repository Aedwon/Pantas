meta:
  subject: "language-proficiency"
  topic: "grammar-and-structure"
  subtopic: "pronoun-antecedent-agreement"
  exams:
    - "upcat"
    - "acet"
    - "dlsucet"
    - "ustet"
    - "dost-sei"
    - "cse-pro"
    - "cse-sub"
questions:
  - id: "q-grammar-and-structure-pronoun-antecedent-agreement-0001"
    type: "pronoun-reference"
    difficulty: "easy"
    stem: |
      The girl uses she/her pronouns. Choose the possessive form referring to her own book: "The girl lost ___ book on the way home."
    choices:
      - text: "Her"
        correct: true
      - text: "Hers"
        rationale: |
          This uses the form that stands alone before a noun. Both "her" and "hers" show possession. Check: check whether a noun follows the blank.
      - text: "Him"
        rationale: |
          This uses an object form rather than a possessive form. It is a familiar personal pronoun. Check: choose the form that can come before "book".
      - text: "She"
        rationale: |
          This uses a subject form before a possessed noun. The stem states that she is the person referred to. Check: check whether the blank names the subject or shows possession.
    explanation: |
      The girl uses she/her pronouns, and the book is her own. "Her" is the possessive form used before the noun "book."
    approved: true
  - id: "q-grammar-and-structure-pronoun-antecedent-agreement-0002"
    type: "pronoun-reference"
    difficulty: "easy"
    stem: |
      Choose the correct pronoun: The girls lost ______ books on the way home.
    choices:
      - text: "Their"
        correct: true
      - text: "Her"
        rationale: |
          This uses one person's possessive form for several girls. "Her" matches a single girl. Check: check the plural ending on "girls".
      - text: "His"
        rationale: |
          This uses one person's possessive form for a group. The sentence concerns books belonging to people. Check: match the pronoun to all the girls.
      - text: "Its"
        rationale: |
          This treats several people as a single non-person unit. One group can seem like one thing. Check: check the actual plural antecedent.
    explanation: |
      "Girls" is a plural antecedent, so it needs the plural pronoun "their."
    approved: true
  - id: "q-grammar-and-structure-pronoun-antecedent-agreement-0003"
    type: "pronoun-reference"
    difficulty: "medium"
    stem: |
      Choose the gender-neutral pronoun: Each of the students must submit ______ essay by Friday.
    choices:
      - text: "Their"
        correct: true
      - text: "His"
        rationale: |
          This assumes the student is male. Some older materials use "his" for an unspecified person. Check: follow the stem's gender-neutral requirement.
      - text: "Her"
        rationale: |
          This assumes the student is female. The antecedent refers to one student at a time. Check: keep gender unspecified as the stem requires.
      - text: "Its"
        rationale: |
          This treats a person like a non-person object. "Each" is grammatically singular. Check: check whether the antecedent is a person.
    explanation: |
      Although "each" is grammatically singular, singular "they/their" is accepted in modern formal English when a person's gender is unknown or irrelevant. "Each of the students must submit their essay" is therefore the gender-neutral choice.
    approved: true
  - id: "q-grammar-and-structure-pronoun-antecedent-agreement-0004"
    type: "pronoun-reference"
    difficulty: "medium"
    stem: |
      Choose the gender-neutral pronoun: Somebody left ______ umbrella in the classroom.
    choices:
      - text: "Their"
        correct: true
      - text: "His"
        rationale: |
          This assumes the unknown owner is male. The owner is one person. Check: follow the requested gender-neutral wording.
      - text: "Her"
        rationale: |
          This assumes the unknown owner is female. The owner is one person. Check: use no gender that the sentence does not supply.
      - text: "Its"
        rationale: |
          This treats the owner like a non-person object. "Somebody" is singular. Check: check whether it refers to a person.
    explanation: |
      "Somebody" is grammatically singular, but modern formal English accepts singular "their" for a person whose gender is unknown or irrelevant.
    approved: true
  - id: "q-grammar-and-structure-pronoun-antecedent-agreement-0005"
    type: "pronoun-reference"
    difficulty: "medium"
    stem: |
      Treat the company as one organization, not its individual members. Choose the pronoun referring to its policy: "The company announced ___ new policy yesterday."
    choices:
      - text: "Its"
        correct: true
      - text: "Their"
        rationale: |
          This uses the members-as-people reading of the company. A company consists of people. Check: follow the stated one-unit convention.
      - text: "His"
        rationale: |
          This assigns male gender to the organization. The company may have a male leader. Check: refer to the organization itself.
      - text: "Her"
        rationale: |
          This assigns female gender to the organization. The company may have a female leader. Check: refer to the organization itself.
    explanation: |
      "Company" refers to one organization acting as a single unit here, so the sentence uses the singular possessive pronoun "its."
    approved: true
  - id: "q-grammar-and-structure-pronoun-antecedent-agreement-0006"
    type: "pronoun-reference"
    difficulty: "medium"
    stem: |
      Treat the class as one unit completing a shared project. Choose the pronoun referring to that unit: "The class finished ___ project ahead of schedule."
    choices:
      - text: "Its"
        correct: true
      - text: "Their"
        rationale: |
          This refers to the class members as people. A class consists of students. Check: follow the specified one-unit reading.
      - text: "His"
        rationale: |
          This assigns a male person's form to the class. An individual in the class could be male. Check: match the whole class unit.
      - text: "Her"
        rationale: |
          This assigns a female person's form to the class. An individual in the class could be female. Check: match the whole class unit.
    explanation: |
      The sentence treats "class" as one collective unit completing a shared project, so it uses the singular pronoun "its."
    approved: true
  - id: "q-grammar-and-structure-pronoun-antecedent-agreement-0007"
    type: "pronoun-reference"
    difficulty: "medium"
    stem: |
      Choose the correct pronoun: Liza and Carlo finished ______ project early.
    choices:
      - text: "Their"
        correct: true
      - text: "Her"
        rationale: |
          This refers to Liza alone. Liza is the first name in the pair. Check: include both names joined by "and".
      - text: "His"
        rationale: |
          This refers to Carlo alone. Carlo is closest to the blank. Check: include the full compound antecedent.
      - text: "Its"
        rationale: |
          This treats the two people as a non-person singular unit. They are working on one shared project. Check: match the pronoun to the people, not the project.
    explanation: |
      "Liza and Carlo" is a compound antecedent joined by "and," making it plural, so it takes the pronoun "their."
    approved: true
  - id: "q-grammar-and-structure-pronoun-antecedent-agreement-0008"
    type: "pronoun-reference"
    difficulty: "medium"
    stem: |
      Which revision avoids a mixed singular/plural pronoun reference without assigning gender?
    choices:
      - text: "Neither the coach nor the players brought the required equipment."
        correct: true
      - text: "Neither the coach nor the players brought his own required equipment."
        rationale: |
          This forces one male reference onto mixed antecedents. The singular coach could be male. Check: avoid an unsupported gender and mixed reference.
      - text: "Neither the coach nor the players brought her own required equipment."
        rationale: |
          This forces one female reference onto mixed antecedents. The singular coach could be female. Check: use the requested clear gender-neutral revision.
      - text: "Neither the coach nor the players brought its own required equipment."
        rationale: |
          This treats the people as a non-person singular unit. The equipment belongs to one team. Check: match the people named, not an imagined unit.
    explanation: |
      "The required equipment" keeps the intended object and avoids a pronoun with mixed singular and plural antecedents. The revision also assigns no gender.
    approved: true
  - id: "q-grammar-and-structure-pronoun-antecedent-agreement-0009"
    type: "pronoun-reference"
    difficulty: "medium"
    stem: |
      What makes the pronoun reference unclear in "When Mrs. Santos spoke to Anna, she seemed upset"?
    choices:
      - text: "\"She\" has two possible antecedents."
        correct: true
      - text: "\"She\" must always refer to the first woman named."
        rationale: |
          This uses first position as a fixed reference rule. Subjects often remain the focus of a sentence. Check: ask whether both women could be upset.
      - text: "\"She\" must always refer to the woman named closest to it."
        rationale: |
          This uses proximity as a fixed reference rule. Anna is the nearest name. Check: check whether the meaning also permits Mrs. Santos.
      - text: "\"She\" cannot refer to a person already named in the sentence."
        rationale: |
          This rejects normal pronoun reference after a name. Repeating a name can remove uncertainty. Check: distinguish unclear reference from pronoun use itself.
    explanation: |
      Both Mrs. Santos and Anna can be the person who seemed upset. The sentence does not identify which one "she" refers to.
    approved: true
  - id: "q-grammar-and-structure-pronoun-antecedent-agreement-0010"
    type: "pronoun-reference"
    difficulty: "medium"
    stem: |
      In "Sofia and her sister compared their schedules," to whom does "their" refer under the ordinary plural reading?
    choices:
      - text: "Sofia and her sister"
        correct: true
      - text: "Sofia alone, because her name comes first"
        rationale: |
          This limits the plural reference to the first person. Sofia is the first named person. Check: include both people joined by "and".
      - text: "Her sister alone, because she is named closest"
        rationale: |
          This uses proximity to drop part of the antecedent. The sister is the nearest person mentioned. Check: match the ordinary plural reference to both people.
      - text: "Someone outside the pair, because their schedules are mentioned"
        rationale: |
          This invents a new owner of the schedules. Possessions can belong to other people in some contexts. Check: use the antecedent supplied by the sentence.
    explanation: |
      The compound subject names Sofia and her sister. Under the stated ordinary plural reading, "their" refers to both of them.
    approved: true
  - id: "q-grammar-and-structure-pronoun-antecedent-agreement-0011"
    type: "pronoun-reference"
    difficulty: "medium"
    stem: |
      Ang salitang "siya" sa Filipino ay ______.
    choices:
      - text: "Hindi nagsasaad ng kasarian"
        correct: true
      - text: "Tumutukoy lamang sa babae"
        rationale: |
          This adds a female-only limit to "siya". English uses a separate form "she". Check: keep Filipino and English pronoun systems separate.
      - text: "Tumutukoy lamang sa lalaki"
        rationale: |
          This adds a male-only limit to "siya". English uses a separate form "he". Check: check whether the Filipino word itself encodes gender.
      - text: "Ginagamit lamang para sa mga bagay"
        rationale: |
          This restricts "siya" to objects. English has a separate object-related form "it". Check: check the personal-pronoun use in Filipino.
    explanation: |
      "Siya" can refer to a person without stating that person's gender. Filipino uses the same pronoun for these personal references.
    approved: true
  - id: "q-grammar-and-structure-pronoun-antecedent-agreement-0012"
    type: "pronoun-reference"
    difficulty: "medium"
    stem: |
      Piliin ang tamang panghalip: Isang estudyante lamang ang nagdala ng proyekto; ipinakita ______ ito sa buong klase.
    choices:
      - text: "Niya"
        correct: true
      - text: "Nila"
        rationale: |
          This uses a plural actor form for one student. The whole class is mentioned nearby. Check: match the actor who showed the project.
      - text: "Namin"
        rationale: |
          This includes the speaker in the acting group. It is a familiar form used for a group's actions. Check: check who the sentence names as the actor.
      - text: "Ninyo"
        rationale: |
          This refers to the listener instead of the student. The sentence describes an action shown to others. Check: keep the reference in the third person.
    explanation: |
      One student is named as the person who showed the project. "Niya" is the matching singular third-person form in "ipinakita niya ito."
    approved: true
  - id: "q-grammar-and-structure-pronoun-antecedent-agreement-0013"
    type: "pronoun-reference"
    difficulty: "medium"
    stem: |
      Alin sa mga sumusunod na panghalip ang kabilang sa "ang" set (bilang tagaganap o paksa)?
    choices:
      - text: "Siya"
        correct: true
      - text: "Niya"
        rationale: |
          This selects an ng-set form instead of an ang-set form. Both can refer to the same person. Check: check the grammatical set, not only the referent.
      - text: "Kaniya"
        rationale: |
          This selects a sa-set form instead of an ang-set form. The forms share a personal reference. Check: identify the role requested by the stem.
      - text: "Nila"
        rationale: |
          This selects a plural ng-set form. It is a familiar personal pronoun. Check: check both its set and its number.
    explanation: |
      "Siya" belongs to the ang set of Filipino personal pronouns. It can fill the topic role in a sentence such as "Siya ay dumating."
    approved: true
  - id: "q-grammar-and-structure-pronoun-antecedent-agreement-0014"
    type: "pronoun-reference"
    difficulty: "hard"
    stem: |
      Is singular "their" acceptable in "Everybody should bring their own lunch" in modern formal English?
    choices:
      - text: "Yes, it provides a gender-neutral singular reference."
        correct: true
      - text: "No, because every use of \"their\" requires a plural antecedent."
        rationale: |
          This rejects the singular use of "their". The same form also refers to groups. Check: check whether the sentence refers to an unspecified person.
      - text: "Yes, because \"everybody\" always takes a plural main verb."
        rationale: |
          This confuses pronoun reference with verb agreement. "Everybody" can include many people. Check: check the main verb separately from the pronoun.
      - text: "No, because formal writing never allows an unspecified person."
        rationale: |
          This invents a ban on indefinite personal reference. Formal writing often asks for precise wording. Check: check the accepted modern use of singular "they".
    explanation: |
      Modern formal English accepts singular "their" for an unspecified person. "Everybody" can use this personal reference while keeping singular main-verb agreement.
    approved: true
  - id: "q-grammar-and-structure-pronoun-antecedent-agreement-0015"
    type: "pronoun-reference"
    difficulty: "hard"
    stem: |
      In a style that treats the collective noun "team" as one unit, which pronoun best completes "The team celebrated ______ victory"?
    choices:
      - text: "Its"
        correct: true
      - text: "Their"
        rationale: |
          This chooses a members-as-people reading. Plural group reference can be valid in some contexts. Check: follow the stem's one-unit style.
      - text: "His"
        rationale: |
          This assigns male gender to the team. An individual team member could use "his". Check: refer to the team as the stated unit.
      - text: "Her"
        rationale: |
          This assigns female gender to the team. An individual team member could use "her". Check: refer to the whole team unit.
    explanation: |
      The stem treats the team as one unit. "Its" is the possessive form matching that unit.
    approved: true
  - id: "q-grammar-and-structure-pronoun-antecedent-agreement-0016"
    type: "pronoun-reference"
    difficulty: "hard"
    stem: |
      Identify the ambiguous antecedent problem: "Sarah told Michelle that her painting won first place." Whose painting won?
    choices:
      - text: "Either Sarah's or Michelle's; the wording is unclear."
        correct: true
      - text: "Sarah's, because the first name always controls later pronouns."
        rationale: |
          This treats first position as a rule that fixes ownership. Sarah is the main subject. Check: ask whether Michelle could also own the painting.
      - text: "Michelle's, because the nearest name always controls possessives."
        rationale: |
          This treats proximity as proof of ownership. Michelle is mentioned just before "her". Check: look for wording that identifies the actual owner.
      - text: "Both women's, because two possible names make the pronoun plural."
        rationale: |
          This turns uncertain reference into joint ownership. Two women are mentioned. Check: check whether the sentence states a shared painting.
    explanation: |
      "Her" could refer to Sarah or Michelle. The sentence gives no detail identifying the painting's owner.
    approved: true
  - id: "q-grammar-and-structure-pronoun-antecedent-agreement-0017"
    type: "pronoun-reference"
    difficulty: "medium"
    stem: |
      Which sentence correctly combines main-verb agreement with gender-neutral singular "they"?
    choices:
      - text: "Everybody has said they are ready."
        correct: true
      - text: "Everybody have said they are ready for the afternoon activity."
        rationale: |
          This makes "everybody" take a plural main verb. The pronoun "they" may look plural. Check: check the verb attached to "everybody" separately.
      - text: "Everybody has said they is ready for the afternoon activity."
        rationale: |
          This gives singular "they" an is-form. The reference is to one unspecified person at a time. Check: use the normal verb form with "they".
      - text: "Everybody have said they is ready for the afternoon activity."
        rationale: |
          This switches both agreement patterns. The sentence combines an indefinite word and "they". Check: check each subject with its own verb.
    explanation: |
      "Everybody" takes the singular verb "has." Singular "they" still takes its usual verb form, "are."
    approved: true
  - id: "q-grammar-and-structure-pronoun-antecedent-agreement-0018"
    type: "pronoun-reference"
    difficulty: "exam"
    stem: |
      Choose the pronouns using gender-neutral modern English and treating "team" as one unit: Each of the volunteers brought ______ own supplies; afterward, the coordinator said the team was proud of ______ accomplishment.
    choices:
      - text: "Their, its"
        correct: true
      - text: "His, its"
        rationale: |
          This assumes each volunteer is male. "Each" refers to one person at a time. Check: keep the gender-neutral requirement.
      - text: "Her, its"
        rationale: |
          This assumes each volunteer is female. "Each" refers to one person at a time. Check: keep the gender-neutral requirement.
      - text: "Their, his"
        rationale: |
          This assigns male gender to the team unit. A coordinator or team member may be male. Check: match the second form to the team itself.
    explanation: |
      "Each" refers to an unspecified person, so singular "their" provides the requested gender-neutral form. The team is treated as one unit, so "its" fits the second blank.
    approved: true
  - id: "q-grammar-and-structure-pronoun-antecedent-agreement-0019"
    type: "pronoun-reference"
    difficulty: "easy"
    stem: |
      Sam alone passed the test. Which revision of "Alex told Sam that they had passed" makes the intended reference clear?
    choices:
      - text: "Alex told Sam that Sam had passed."
        correct: true
      - text: "Alex told Sam that they had passed the final test."
        rationale: |
          This retains an uncertain use of "they." Singular "they" could refer to either person, and plural "they" could refer to both. Check: name the intended person.
      - text: "Alex told Sam that Alex had passed the final test."
        rationale: |
          This gives the result to Alex. Naming someone removes uncertainty, so the revision looks clear. Check: preserve who actually passed.
      - text: "Alex told Sam that both had passed the final test."
        rationale: |
          This changes one person's result into a result for both. The plural use of "they" may suggest a pair. Check: keep the stated single-person result.
    explanation: |
      Repeating "Sam" identifies the person who passed. The revision keeps the stated result and gives the pronoun's intended reference directly.
    approved: false
  - id: "q-grammar-and-structure-pronoun-antecedent-agreement-0020"
    type: "pronoun-reference"
    difficulty: "exam"
    stem: |
      In a variety of English that allows plural reference to collective nouns, which sentence emphasizes committee members acting individually?
    choices:
      - text: "The committee returned to their homes."
        correct: true
      - text: "The committee published its final report for the year."
        rationale: |
          This treats the committee as one unit. A report can describe work done by many members. Check: look for separate actions or possessions belonging to the people.
      - text: "The committee revised its official policy before the meeting."
        rationale: |
          This gives the committee one organizational policy. Several people may help revise it. Check: distinguish work by a group from reference to individual members.
      - text: "The committee announced its decision after the final vote."
        rationale: |
          This reports a single group decision. Voting involves individual people. Check: ask whether the pronoun refers to the group unit or its separate members.
    explanation: |
      "Their homes" refers to separate homes belonging to the members. Under the stated variety of English, plural "their" emphasizes those people within the committee.
    approved: false
