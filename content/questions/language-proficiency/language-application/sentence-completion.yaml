meta:
  subject: language-proficiency
  topic: language-application
  subtopic: sentence-completion
  exams: [upcat, acet, dlsucet, ustet, dost-sei, cse-pro, cse-sub]
questions:
  - id: q-language-application-sentence-completion-0001
    type: fill-in-the-blank
    difficulty: easy
    stem: |
      Despite facing numerous unexpected obstacles during testing, the software team remained ________ and successfully delivered the patch on schedule.
    choices:
      - text: resilient
        correct: true
      - text: hesitant
        rationale: |
          Hesitant suggests uncertainty or delay, which conflicts with successfully overcoming the obstacles.
      - text: indifferent
        rationale: |
          Indifferent means unconcerned, which does not fit the team's sustained effort.
      - text: indolent
        rationale: |
          Indolent means lazy, the opposite of persistent work through setbacks.
    explanation: |
      "Resilient" means able to withstand or recover from difficulty. It best fits a team that overcame obstacles and still delivered on time.
    approved: true

  - id: q-language-application-sentence-completion-0002
    type: fill-in-the-blank
    difficulty: easy
    stem: |
      Because the initial evidence was ________, the lead investigator refused to draw firm conclusions until the laboratory results arrived.
    choices:
      - text: compelling
        rationale: |
          Compelling evidence is strongly persuasive and does not explain the stated uncertainty.
      - text: equivocal
        correct: true
      - text: irrefutable
        rationale: |
          Irrefutable means impossible to deny, which conflicts with withholding a conclusion because the evidence was uncertain.
      - text: exhaustive
        rationale: |
          Exhaustive means thorough or comprehensive and does not explain why the evidence remained inconclusive.
    explanation: |
      "Equivocal" means ambiguous or open to more than one interpretation. That uncertainty explains why the investigator waited for additional results.
    approved: true

  - id: q-language-application-sentence-completion-0003
    type: fill-in-the-blank
    difficulty: medium
    stem: |
      The CEO's ________ proposal to replace the entire long-standing sales structure was met with widespread ________ from senior managers who explicitly opposed departures from traditional methods.
    choices:
      - text: "radical ... resistance"
        correct: true
      - text: "modest ... enthusiasm"
        rationale: |
          Replacing the entire long-standing structure is not modest, and the managers are stated to oppose departures from tradition.
      - text: "orthodox ... hostility"
        rationale: |
          An orthodox proposal would follow established practice rather than replace it.
      - text: "innovative ... acquiescence"
        rationale: |
          Innovative could describe the proposal, but acquiescence conflicts with the managers' explicit opposition.
    explanation: |
      Replacing an entrenched structure is radical, and managers who explicitly oppose departures from tradition would show resistance.
    approved: true

  - id: q-language-application-sentence-completion-0004
    type: fill-in-the-blank
    difficulty: medium
    stem: |
      Because the committee members held such ________ viewpoints on urban development, reaching a consensus required weeks of intense negotiation.
    choices:
      - text: disparate
        correct: true
      - text: harmonious
        rationale: |
          Harmonious viewpoints are in agreement and would not explain prolonged negotiation.
      - text: congruent
        rationale: |
          Congruent means consistent or agreeing, the opposite of the conflict described.
      - text: superficial
        rationale: |
          Superficial means shallow and does not establish disagreement among the viewpoints.
    explanation: |
      "Disparate" means markedly different. Differing viewpoints explain why consensus required extensive negotiation.
    approved: true

  - id: q-language-application-sentence-completion-0005
    type: fill-in-the-blank
    difficulty: easy
    stem: |
      The manager offered a ________ explanation of the new safety guidelines, ensuring that even novice employees understood their responsibilities.
    choices:
      - text: lucid
        correct: true
      - text: ambiguous
        rationale: |
          Ambiguous means open to multiple interpretations, contrary to the stated understanding.
      - text: convoluted
        rationale: |
          Convoluted means excessively complicated, which conflicts with the explanation being easy for novices to understand.
      - text: obscure
        rationale: |
          Obscure means difficult to understand.
    explanation: |
      "Lucid" means clear and easy to understand, matching the result described in the sentence.
    approved: true

  - id: q-language-application-sentence-completion-0006
    type: fill-in-the-blank
    difficulty: medium
    stem: |
      The environmental report was far from ________; in fact, it contained several ________ statements that directly contradicted one another and confused the public.
    choices:
      - text: "coherent ... contradictory"
        correct: true
      - text: "vague ... explicit"
        rationale: |
          Explicit statements can still disagree, but "far from vague" does not follow from the sentence's stated problem of internal contradiction.
      - text: "detailed ... comprehensive"
        rationale: |
          These qualities do not explain statements that directly contradict one another.
      - text: "accurate ... verifiable"
        rationale: |
          Verifiable statements do not match the explicit description of mutually contradictory claims.
    explanation: |
      A report whose statements directly contradict one another is not coherent; "contradictory" names the problem stated in the sentence.
    approved: true

  - id: q-language-application-sentence-completion-0007
    type: fill-in-the-blank
    difficulty: hard
    stem: |
      Because prolonged drought conditions had severely ________ the agricultural reservoir, local authorities were forced to institute mandatory water rationing.
    choices:
      - text: depleted
        correct: true
      - text: augmented
        rationale: |
          Augmented means increased, which conflicts with drought-driven rationing.
      - text: replenished
        rationale: |
          Replenished means refilled, the opposite of what prolonged drought would do.
      - text: stabilized
        rationale: |
          Stabilized does not explain why mandatory rationing became necessary.
    explanation: |
      "Depleted" means greatly reduced or exhausted, fitting a reservoir diminished by prolonged drought.
    approved: true

  - id: q-language-application-sentence-completion-0008
    type: fill-in-the-blank
    difficulty: hard
    stem: |
      While the keynote speaker praised the overall expansion plan, she nevertheless cautioned that rapid growth without adequate funding would prove ________ to long-term stability.
    choices:
      - text: detrimental
        correct: true
      - text: beneficial
        rationale: |
          Beneficial means helpful, contradicting the warning.
      - text: conducive
        rationale: |
          Conducive means tending to promote an outcome and does not fit a warning about damage to stability.
      - text: paramount
        rationale: |
          Paramount means of greatest importance, not harmful.
    explanation: |
      "Detrimental" means harmful, matching the speaker's caution about underfunded rapid growth.
    approved: true

  - id: q-language-application-sentence-completion-0009
    type: fill-in-the-blank
    difficulty: medium
    stem: |
      The new efficiency policy was designed to ________ workplace productivity while simultaneously ________ administrative costs.
    choices:
      - text: "boost ... reducing"
        correct: true
      - text: "curtail ... inflating"
        rationale: |
          Both actions move in the opposite direction from an efficiency policy's stated objective.
      - text: "hinder ... maintaining"
        rationale: |
          Hindering productivity conflicts with the stated efficiency objective.
      - text: "minimize ... expanding"
        rationale: |
          Reducing productivity while expanding costs contradicts the purpose stated in the stem.
    explanation: |
      Improving efficiency means increasing productive output while lowering administrative cost: "boost ... reducing" fits both clues and the sentence structure.
    approved: true

  - id: q-language-application-sentence-completion-0010
    type: fill-in-the-blank
    difficulty: medium
    stem: |
      The lead engineer spoke ________ during the press briefing, detailing the technical failure with impressive clarity and precision.
    choices:
      - text: eloquently
        correct: true
      - text: eloquence
        rationale: |
          "Eloquence" is a noun, but the blank modifies the verb "spoke."
      - text: eloquent
        rationale: |
          "Eloquent" is an adjective; an adverb is needed to modify "spoke."
      - text: eloquenced
        rationale: |
          "Eloquenced" is not the required English word form.
    explanation: |
      "Eloquently" is the adverb form and correctly describes how the engineer spoke.
    approved: true

  - id: q-language-application-sentence-completion-0011
    type: fill-in-the-blank
    difficulty: hard
    stem: |
      When faced with a sudden drop in market demand, the board decided to ________ strict measures to prevent further financial losses.
    choices:
      - text: implement
        correct: true
      - text: inflict
        rationale: |
          "Inflict" normally takes harm, pain, or punishment as its object, not neutral organizational measures.
      - text: implicate
        rationale: |
          "Implicate" means connect someone or something with wrongdoing or involvement.
      - text: impair
        rationale: |
          "Impair" means weaken or damage, not put measures into effect.
    explanation: |
      "Implement" means put a plan, policy, or measure into effect and is the appropriate collocation here.
    approved: true

  - id: q-language-application-sentence-completion-0012
    type: fill-in-the-blank
    difficulty: exam
    stem: |
      The new regulations covered every major operational area, and inspectors applied them strictly and consistently across all regional branches. The regulations were therefore ________ in scope and ________ in enforcement.
    choices:
      - text: "comprehensive ... rigorous"
        correct: true
      - text: "lenient ... strict"
        rationale: |
          "Lenient in scope" does not describe rules that cover every major operational area.
      - text: "superficial ... thorough"
        rationale: |
          "Superficial" conflicts with the explicitly comprehensive coverage described in the first sentence.
      - text: "restricted ... stringent"
        rationale: |
          "Restricted" conflicts with coverage of every major operational area.
    explanation: |
      Coverage of every major area is comprehensive; strict, consistent application is rigorous enforcement.
    approved: true

  - id: q-language-application-sentence-completion-0013
    type: fill-in-the-blank
    difficulty: easy
    stem: |
      Heavy snowfall during the peak morning rush hour caused traffic on the main highway to crawl at a ________ pace.
    choices:
      - text: sluggish
        correct: true
      - text: rapid
        rationale: |
          Rapid means fast and contradicts "crawl."
      - text: brisk
        rationale: |
          Brisk means quick or energetic and conflicts with crawling traffic.
      - text: hasty
        rationale: |
          Hasty means rushed and does not fit very slow movement.
    explanation: |
      "Sluggish" means slow-moving, matching traffic described as crawling.
    approved: true

  - id: q-language-application-sentence-completion-0014
    type: fill-in-the-blank
    difficulty: medium
    stem: |
      Far from being ________, the young associate was remarkably composed and articulate during her first presentation to the board of directors.
    choices:
      - text: flustered
        correct: true
      - text: serene
        rationale: |
          Serene is similar to composed, but "far from being" calls for a contrasting quality.
      - text: confident
        rationale: |
          Confident is compatible with being composed and articulate.
      - text: poised
        rationale: |
          Poised is nearly synonymous with composed in this context.
    explanation: |
      "Flustered" means agitated or confused, providing the contrast required by "far from being."
    approved: true

  - id: q-language-application-sentence-completion-0015
    type: fill-in-the-blank
    difficulty: exam
    stem: |
      The initial trial could not distinguish the treatment group from the control group, but subsequent replicated studies produced a stable effect with narrow confidence intervals. The first results were ________, whereas the later evidence was remarkably ________.
    choices:
      - text: "inconclusive ... definitive"
        correct: true
      - text: "promising ... ambiguous"
        rationale: |
          The first trial is explicitly described as unable to distinguish the groups, while the later evidence is stable and precise rather than ambiguous.
      - text: "decisive ... doubtful"
        rationale: |
          This reverses the evidence progression stated in the stem.
      - text: "consistent ... erratic"
        rationale: |
          The first result was not conclusive, and the later replicated effect is explicitly stable rather than erratic.
    explanation: |
      Failure to distinguish groups makes the first result inconclusive; replicated, stable, precise evidence supports "definitive" as the contrasting description.
    approved: true
