meta:
  subject: language-proficiency
  topic: language-application
  subtopic: error-identification
  exams: [upcat, acet, dlsucet, ustet, dost-sei, cse-pro, cse-sub]
questions:
  - id: q-language-application-error-identification-0001
    type: error-identification
    difficulty: easy
    stem: |
      Identify the part of the sentence that contains an error.

      "Every one of the new laptops imported for the engineering team have arrived with pre-installed diagnostic software."
    choices:
      - text: "Every one of the new laptops"
        rationale: |
          You flagged this section, but "Every one of the new laptops" is grammatically sound as the singular subject phrase.
      - text: "imported for the engineering team"
        rationale: |
          You flagged this section, but "imported for the engineering team" is a correct past-participial modifier.
      - text: "have arrived"
        correct: true
      - text: "with pre-installed diagnostic software."
        rationale: |
          You flagged this section, but "with pre-installed diagnostic software" is a valid prepositional modifier.
      - text: "No error"
        rationale: |
          You assumed there was no error, but "Every one" is singular and requires "has arrived."
    explanation: |
      The head of the subject is "Every one," which is singular, so the verb must be "has arrived," not "have arrived."

  - id: q-language-application-error-identification-0002
    type: error-identification
    difficulty: easy
    stem: |
      Identify the part of the sentence that contains an error.

      "The executive committee requested that all department heads submit their quarterly budget reports, update their inventory logs, and to review their staffing needs."
    choices:
      - text: "The executive committee"
        rationale: |
          You flagged this section, but "The executive committee" correctly functions as the subject of the main clause.
      - text: "requested that all department heads"
        rationale: |
          You flagged this section, but it correctly introduces the clause containing the requested actions.
      - text: "submit their quarterly budget reports,"
        rationale: |
          You flagged this section, but "submit" correctly establishes the base-verb pattern in the list.
      - text: "update their inventory logs, and to review their staffing needs."
        correct: true
      - text: "No error"
        rationale: |
          You assumed there was no error, but "to review" breaks the parallel base-verb list established by "submit" and "update."
    explanation: |
      The three requested actions should use parallel forms: "submit," "update," and "review." The infinitive "to review" breaks that pattern.

  - id: q-language-application-error-identification-0003
    type: error-identification
    difficulty: medium
    stem: |
      Identify the part of the sentence that contains an error.

      "Walking through the newly renovated research facilities, several state-of-the-art spectrometers were noticed by the visiting delegates."
    choices:
      - text: "Walking through the newly renovated research facilities,"
        correct: true
      - text: "several state-of-the-art spectrometers"
        rationale: |
          You flagged the noun phrase itself, but the problem is the introductory modifier's attachment: the sentence makes the spectrometers its grammatical target.
      - text: "were noticed by"
        rationale: |
          You flagged the passive verb phrase, but passive voice is not itself the error. The introductory modifier lacks a logical subject immediately after it.
      - text: "the visiting delegates."
        rationale: |
          You flagged the agent phrase, but "the visiting delegates" is grammatical where it appears.
      - text: "No error"
        rationale: |
          You assumed there was no error, but the opening phrase dangles because the subject that follows it is "spectrometers," which cannot walk.
    explanation: |
      The introductory phrase is a dangling modifier. A correction would make the delegates the subject immediately after it, for example: "Walking through the newly renovated research facilities, the visiting delegates noticed several state-of-the-art spectrometers."

  - id: q-language-application-error-identification-0004
    type: error-identification
    difficulty: medium
    stem: |
      Identify the part of the sentence that contains an error.

      "The efficiency rating of the upgraded solar panel is significantly higher than the older models installed last winter."
    choices:
      - text: "The efficiency rating of the upgraded solar panel"
        rationale: |
          You flagged the subject phrase, but it is grammatically sound. The comparison becomes faulty only when that rating is compared with a different kind of thing.
      - text: "is significantly higher than"
        rationale: |
          You flagged the comparative phrase, but it can correctly introduce a like-with-like comparison.
      - text: "the older models"
        correct: true
      - text: "installed last winter."
        rationale: |
          You flagged the modifier, but "installed last winter" can correctly describe the older models.
      - text: "No error"
        rationale: |
          You assumed there was no error, but the sentence compares an efficiency rating with physical models instead of with the models' efficiency ratings.
    explanation: |
      This is a faulty comparison. A rating should be compared with another rating: for example, "The efficiency rating of the upgraded solar panel is significantly higher than that of the older models installed last winter."

  - id: q-language-application-error-identification-0005
    type: error-identification
    difficulty: easy
    stem: |
      Identify the part of the sentence that contains an error.

      "The sudden drop in atmospheric pressure will adversely effect the performance of the high-altitude sensors."
    choices:
      - text: "The sudden drop in atmospheric pressure"
        rationale: |
          You flagged the subject noun phrase, but it is grammatically sound.
      - text: "will adversely"
        rationale: |
          You flagged the adverb phrase, but "adversely" can correctly modify the verb that follows.
      - text: "effect"
        correct: true
      - text: "the performance of the high-altitude sensors."
        rationale: |
          You flagged the object phrase, but it is grammatically sound.
      - text: "No error"
        rationale: |
          You assumed there was no error. Although "effect" can function as a verb meaning "bring about," the intended meaning here is "influence," which requires "affect."
    explanation: |
      The sentence means that the pressure drop will negatively influence sensor performance, so the verb should be "affect." The verb "effect" has a different meaning: to bring about or cause something to happen.

  - id: q-language-application-error-identification-0006
    type: error-identification
    difficulty: medium
    stem: |
      Identify the part of the sentence that contains an error.

      "The lead scientist, whom had conducted extensive fieldwork in South America, presented her findings at the international symposium."
    choices:
      - text: "The lead scientist,"
        rationale: |
          You flagged the subject noun phrase, but it is grammatically correct.
      - text: "whom"
        correct: true
      - text: "had conducted extensive fieldwork"
        rationale: |
          You flagged the verb phrase, but its structure is grammatical. The pronoun before it is the problem.
      - text: "in South America, presented her findings at the international symposium."
        rationale: |
          You flagged the remainder of the sentence, but its structure is grammatical.
      - text: "No error"
        rationale: |
          You assumed there was no error, but the relative pronoun is the subject of "had conducted," so the subject form "who" is required.
    explanation: |
      The relative clause needs "who" because the pronoun performs the action in "who had conducted extensive fieldwork." "Whom" is an object form.

  - id: q-language-application-error-identification-0007
    type: error-identification
    difficulty: hard
    stem: |
      Identify the part of the sentence that contains an error.

      "When the supervisor spoke to the project manager after the presentation, he expressed dissatisfaction with the proposed timeline."
    choices:
      - text: "When the supervisor spoke to the project manager"
        rationale: |
          You flagged the introductory clause, but its structure is grammatical.
      - text: "after the presentation,"
        rationale: |
          You flagged the time phrase, but it is correctly placed and punctuated.
      - text: "he expressed"
        correct: true
      - text: "dissatisfaction with the proposed timeline."
        rationale: |
          You flagged the complement, but it is grammatically sound.
      - text: "No error"
        rationale: |
          You assumed there was no error, but "he" has two plausible antecedents: the supervisor and the project manager.
    explanation: |
      The pronoun "he" is ambiguous because either man could be its antecedent. The sentence should name the person who expressed dissatisfaction.

  - id: q-language-application-error-identification-0008
    type: error-identification
    difficulty: hard
    stem: |
      In the formal exam convention used here, identify the part of the sentence that needs correction.

      "By the time the audit committee finished inspecting the fiscal records, the accounting department already resolved all major discrepancies."
    choices:
      - text: "By the time the audit committee"
        rationale: |
          You flagged the time marker, but "by the time" correctly establishes a past reference point.
      - text: "finished inspecting the fiscal records,"
        rationale: |
          You flagged the later past event, but simple past is appropriate for that reference event.
      - text: "the accounting department"
        rationale: |
          You flagged the subject of the main clause, but it is grammatically sound.
      - text: "already resolved"
        correct: true
      - text: "No error"
        rationale: |
          You chose no error, but in this formal sequence the resolution is presented as completed before the past reference point set by "by the time"; the bank's target form is past perfect, "had already resolved."
    explanation: |
      "By the time ... finished" establishes a past reference point, while the discrepancies were already resolved before that point. In the formal exam convention tested here, past perfect makes that earlier completion explicit: "had already resolved." This is a narrower rule than saying every earlier past action must use past perfect.

  - id: q-language-application-error-identification-0009
    type: error-identification
    difficulty: medium
    stem: |
      Identify the part of the sentence that contains the punctuation error.

      "The company expanded its operations into three new regions, however, initial profits remained below projected expectations."
    choices:
      - text: "The company expanded its operations"
        rationale: |
          You flagged the first independent clause, but its wording is grammatical.
      - text: "into three new regions,"
        correct: true
      - text: "however,"
        rationale: |
          You flagged "however," but the comma after a sentence-initial conjunctive adverb is appropriate. The problem is the comma immediately before "however," which is contained in the preceding segment.
      - text: "initial profits remained"
        rationale: |
          You flagged the second clause's subject and verb, but both are grammatical.
      - text: "No error"
        rationale: |
          You assumed there was no error, but a comma alone cannot join the first independent clause to a second independent clause introduced by "however."
    explanation: |
      The comma after "regions" incorrectly joins two independent clauses through the conjunctive adverb "however." A standard correction is: "The company expanded its operations into three new regions; however, initial profits remained below projected expectations."

  - id: q-language-application-error-identification-0010
    type: error-identification
    difficulty: medium
    stem: |
      Using standard American English, identify the error, if any.

      "The research panel is presenting its joint evaluation at the conference today."
    choices:
      - text: "The research panel"
        rationale: |
          You flagged the singular collective noun, but a panel considered as one unit is correctly treated as singular in standard American English.
      - text: "is presenting"
        rationale: |
          You flagged the singular verb, but it agrees with the singular collective noun "panel" when the group acts as a unit.
      - text: "its joint evaluation"
        rationale: |
          You flagged the singular pronoun, but "its" consistently refers to the panel as one unit and "joint evaluation" reinforces that meaning.
      - text: "at the conference today."
        rationale: |
          You flagged the time/place phrase, but it is grammatically sound.
      - text: "No error"
        correct: true
    explanation: |
      There is no error in standard American English. The sentence treats the panel as one unit, so singular agreement is internally consistent: "panel is ... its joint evaluation." This avoids making a dialect-dependent British-versus-American collective-noun pattern the basis of the answer.

  - id: q-language-application-error-identification-0011
    type: error-identification
    difficulty: hard
    stem: |
      The intended meaning is that the generator, not the wrench, stopped working during the storm. Identify the part of the sentence that is misplaced.

      "The technician repaired the electrical generator using a heavy-duty wrench that had stopped working during the storm."
    choices:
      - text: "The technician repaired"
        rationale: |
          You flagged the main subject and verb, but they are grammatical and do not cause the attachment error.
      - text: "the electrical generator"
        rationale: |
          You flagged the noun the relative clause is intended to describe, but the noun itself is not the misplaced part.
      - text: "using a heavy-duty wrench"
        rationale: |
          You flagged the repair-method phrase, but it can remain where it is once the relative clause is moved next to "generator."
      - text: "that had stopped working during the storm."
        correct: true
      - text: "No error"
        rationale: |
          You chose no error, but the stated intended meaning makes the current attachment wrong: as written, "that had stopped working" sits next to and modifies "wrench."
    explanation: |
      Given the stated intended meaning, the relative clause "that had stopped working during the storm" must sit next to "generator," the noun it describes. For example: "The technician repaired the electrical generator that had stopped working during the storm using a heavy-duty wrench."

  - id: q-language-application-error-identification-0012
    type: error-identification
    difficulty: medium
    stem: |
      Identify the part of the sentence that contains unnecessary redundancy.

      "The chief executive officer emphasized that the two merging firms must revert back to their core operational principles."
    choices:
      - text: "The chief executive officer emphasized"
        rationale: |
          You flagged the main subject and verb, but they contain no redundancy relevant to the sentence.
      - text: "that the two merging firms"
        rationale: |
          You flagged the subordinate-clause introduction, but it contains no repeated meaning.
      - text: "must revert"
        rationale: |
          You flagged the modal and verb, but "revert" itself is the concise verb the sentence needs.
      - text: "back to their core operational principles."
        correct: true
      - text: "No error"
        rationale: |
          You chose no error, but in this context "revert" already means to return to a former state or practice, so adding "back" repeats that direction.
    explanation: |
      In this context, "revert" already means to return to a former state or practice. Removing "back" gives the concise form: "must revert to their core operational principles."

  - id: q-language-application-error-identification-0013
    type: error-identification
    difficulty: easy
    stem: |
      Identify the part of the sentence that contains an error.

      "Between you and I, the proposed structural reforms will require approval from the regional board."
    choices:
      - text: "Between you and"
        rationale: |
          You flagged the prepositional frame, but "between you and" is grammatical. The error is the case of the pronoun that follows it.
      - text: "I,"
        correct: true
      - text: "the proposed structural reforms"
        rationale: |
          You flagged the main clause subject, but it is grammatically sound.
      - text: "will require approval"
        rationale: |
          You flagged the verb phrase, but it is grammatically correct.
      - text: "No error"
        rationale: |
          You assumed there was no error, but the preposition "between" requires the objective form "me" here.
    explanation: |
      The pronoun after "between" is an object of the preposition, so the objective form is required: "Between you and me," not "Between you and I."

  - id: q-language-application-error-identification-0014
    type: error-identification
    difficulty: medium
    stem: |
      Identify the part of the sentence that contains an error.

      "If the analysts would have reviewed the statistical data earlier, they would have caught the error before publication."
    choices:
      - text: "If the analysts"
        rationale: |
          You flagged the conditional subject, but it is grammatically sound.
      - text: "would have reviewed"
        correct: true
      - text: "the statistical data earlier,"
        rationale: |
          You flagged the object and time phrase, but they are grammatical.
      - text: "they would have caught"
        rationale: |
          You flagged the result clause, but "would have caught" is appropriate in the result clause of this unreal past conditional.
      - text: "No error"
        rationale: |
          You assumed there was no error, but this unreal past condition takes past perfect in the if-clause: "If the analysts had reviewed..."
    explanation: |
      In this third-conditional pattern, the if-clause uses past perfect and the result clause uses "would have" plus a past participle: "If the analysts had reviewed ..., they would have caught ..."

  - id: q-language-application-error-identification-0015
    type: error-identification
    difficulty: medium
    stem: |
      Identify the part of the sentence that contains the punctuation error.

      "The architectural firm designed a sustainable office building, consequently, it won several regional design accolades."
    choices:
      - text: "The architectural firm designed"
        rationale: |
          You flagged the first clause's subject and verb, but they are grammatical.
      - text: "a sustainable office building,"
        correct: true
      - text: "consequently,"
        rationale: |
          You flagged the conjunctive adverb, but the comma after "consequently" is appropriate. The problem is the comma immediately before it, contained in the preceding segment.
      - text: "it won"
        rationale: |
          You flagged the second clause's subject and verb, but they are grammatical.
      - text: "No error"
        rationale: |
          You assumed there was no error, but a comma alone cannot join the first independent clause to the second independent clause introduced by "consequently."
    explanation: |
      The comma after "building" creates the faulty join. A standard correction is: "The architectural firm designed a sustainable office building; consequently, it won several regional design accolades."
