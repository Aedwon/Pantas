meta:
  subject: "language-proficiency"
  topic: "language-application"
  subtopic: "error-identification"
  exams:
    - "upcat"
    - "acet"
    - "dlsucet"
    - "ustet"
    - "dost-sei"
    - "cse-pro"
    - "cse-sub"
questions:
  - id: "q-language-application-error-identification-0001"
    type: "error-identification"
    difficulty: "easy"
    stem: |
      Identify the part of the sentence that contains an error.

      "Every one of the new laptops imported for the engineering team have arrived with pre-installed diagnostic software."
    choices:
      - text: "Every one of the new laptops"
        rationale: |
          This mistakes the plural noun inside an of-phrase for the head subject. "Laptops" is plural. Check: identify the head "Every one".
      - text: "imported for the engineering team"
        rationale: |
          This treats a past-participial description as the agreement verb. "Imported" names an action. Check: find the finite verb of the main clause.
      - text: "have arrived"
        correct: true
      - text: "with pre-installed diagnostic software."
        rationale: |
          This treats a software description as a clause-boundary error. The phrase is fairly long. Check: separate added details from the main subject and verb.
      - text: "No error"
        rationale: |
          This misses the singular agreement required by "Every one". The nearby plural "laptops" makes "have" sound familiar. Check: match the main verb to the head subject.
    explanation: |
      The head subject "Every one" is singular. The completed-action verb group should therefore be "has arrived."
  - id: "q-language-application-error-identification-0002"
    type: "error-identification"
    difficulty: "easy"
    stem: |
      Identify the part that breaks the parallel list of requested actions.
      "The executive committee requested that department heads submit their reports, update their inventory logs, and to review their staffing needs."
    choices:
      - text: "to review their staffing needs"
        correct: true
      - text: "The executive committee requested that department heads"
        rationale: |
          This treats the request clause as a list-form error. The construction sounds formal. Check: compare the forms of the requested actions.
      - text: "submit their reports"
        rationale: |
          This rejects the base verb that starts the list. The clause follows "requested" in the past. Check: check the verbs governed by the request.
      - text: "update their inventory logs"
        rationale: |
          This rejects a matching base-verb action. The action appears beside the faulty final item. Check: compare each listed action individually.
      - text: "No error"
        rationale: |
          This accepts a to-plus-verb phrase among base verbs. All three actions are sensible requests. Check: compare their grammatical forms.
    explanation: |
      The requested actions are "submit," "update," and "review." Using three base verbs makes the list parallel.
  - id: "q-language-application-error-identification-0003"
    type: "error-identification"
    difficulty: "medium"
    stem: |
      Which revision supplies the visitors as the subject of the opening action?
      "Walking through the newly renovated research facilities, several spectrometers were noticed by the visiting delegates."
    choices:
      - text: "Walking through the facilities, the delegates noticed several spectrometers."
        correct: true
      - text: "Walking through the facilities, several spectrometers were noticed by the delegates."
        rationale: |
          This leaves the instruments as the subject of walking. The delegates are still named as observers. Check: match the opening action to the main subject.
      - text: "Several spectrometers, walking through the facilities, were noticed by the delegates."
        rationale: |
          This moves the walking phrase beside the instruments. Putting a modifier next to a noun can seem like a repair. Check: ask whether that noun can walk.
      - text: "Walking through the facilities, the sight of several spectrometers impressed the delegates."
        rationale: |
          This attaches walking to a sight rather than to the visitors. The visitors remain in the sentence. Check: identify the main subject after the opening phrase.
    explanation: |
      The delegates are the people walking through the facilities. Making them the main subject gives the opening action its intended actor.
  - id: "q-language-application-error-identification-0004"
    type: "error-identification"
    difficulty: "medium"
    stem: |
      The intended comparison is between efficiency ratings. Which segment must be revised to supply the older models' ratings?
      "The efficiency rating of the upgraded solar panel is significantly higher than the older models installed last winter."
    choices:
      - text: "The efficiency rating of the upgraded solar panel"
        rationale: |
          This rejects the rating subject rather than the comparison target. The subject is long. Check: identify the two things compared.
      - text: "is significantly higher than"
        rationale: |
          This rejects a normal comparative connector. The faulty comparison follows it. Check: check what comes after "than".
      - text: "the older models"
        correct: true
      - text: "installed last winter."
        rationale: |
          This treats a date description as the comparison problem. The phrase follows the older models. Check: compare the rating with a rating, not a time detail.
      - text: "No error"
        rationale: |
          This accepts a rating-to-object comparison. The models have ratings, so the implied meaning seems clear. Check: state the same kind of quantity on both sides.
    explanation: |
      The upgraded panel's efficiency rating needs another rating as its comparison target. "Those of the older models" supplies the older models' efficiency ratings.
  - id: "q-language-application-error-identification-0005"
    type: "error-identification"
    difficulty: "easy"
    stem: |
      The intended meaning is that a pressure drop negatively influences existing sensor performance. Identify the incorrect word.
      "The sudden drop in atmospheric pressure will adversely effect the performance of the high-altitude sensors."
    choices:
      - text: "The sudden drop in atmospheric pressure"
        rationale: |
          This treats the pressure-drop subject as a word-form error. The technical wording is complex. Check: identify the verb carrying the intended meaning.
      - text: "will adversely"
        rationale: |
          This rejects a normal future helper and adverb. "Adversely" is a formal word. Check: check which word must mean influence.
      - text: "effect"
        correct: true
      - text: "the performance of the high-altitude sensors."
        rationale: |
          This rejects a grammatical object phrase. The noun group is long and technical. Check: focus on the action meant by the sentence.
      - text: "No error"
        rationale: |
          This confuses bringing about with influencing. "Effect" can be a verb in other contexts. Check: check the meaning explicitly requested in the stem.
    explanation: |
      "Affect" means influence. It states the intended change in the sensors' existing performance.
  - id: "q-language-application-error-identification-0006"
    type: "error-identification"
    difficulty: "medium"
    stem: |
      Identify the part of the sentence that contains an error.

      "The lead scientist, whom had conducted extensive fieldwork in South America, presented her findings at the international symposium."
    choices:
      - text: "The lead scientist,"
        rationale: |
          This treats the main subject as a pronoun-case problem. The relative clause sits beside that subject. Check: locate the pronoun performing the relative-clause action.
      - text: "whom"
        correct: true
      - text: "had conducted extensive fieldwork"
        rationale: |
          This rejects the past-perfect verb group. Its helping verb is separated from the main subject. Check: find the subject of "had conducted" within the relative clause.
      - text: "in South America, presented her findings at the international symposium."
        rationale: |
          This treats a place-and-main-clause segment as the error. The segment crosses a clause boundary. Check: check the relative pronoun's role before changing other words.
      - text: "No error"
        rationale: |
          This accepts an object form as a clause subject. "Whom" sounds formal. Check: ask who performs the fieldwork action.
    explanation: |
      The relative pronoun is the subject performing "had conducted." The subject form "who" fits that role.
  - id: "q-language-application-error-identification-0007"
    type: "error-identification"
    difficulty: "hard"
    stem: |
      The supervisor and project manager are both men. Which segment contains a pronoun whose intended person is unclear?
      "When the supervisor spoke to the project manager after the presentation, he expressed dissatisfaction with the proposed timeline."
    choices:
      - text: "When the supervisor spoke to the project manager"
        rationale: |
          This treats two possible people as an error in the opening clause itself. Two men are named there. Check: identify the later word whose reference becomes uncertain.
      - text: "after the presentation,"
        rationale: |
          This treats the time phrase as the source of the uncertainty. The phrase separates the names from the pronoun. Check: ask which word stands in for a person.
      - text: "he expressed"
        correct: true
      - text: "dissatisfaction with the proposed timeline."
        rationale: |
          This treats a grammatical description of dissatisfaction as the error. The complement follows the uncertain pronoun. Check: check the personal reference rather than its stated feeling.
      - text: "No error"
        rationale: |
          This assumes the context identifies one man. The supervisor appears first and may seem prominent. Check: ask whether the manager could also express dissatisfaction.
    explanation: |
      Both men are possible references for "he." Naming the supervisor or the manager would identify the intended person.
  - id: "q-language-application-error-identification-0008"
    type: "error-identification"
    difficulty: "hard"
    stem: |
      The revision must use past perfect to explicitly mark resolution completed before the later inspection. Which verb segment must change?
      "By the time the audit committee finished inspecting the fiscal records, the accounting department already resolved all major discrepancies."
    choices:
      - text: "By the time the audit committee"
        rationale: |
          This rejects the marker establishing the later reference point. The requested revision concerns past time. Check: keep the time marker and inspect the earlier-event verb.
      - text: "finished inspecting the fiscal records,"
        rationale: |
          This changes the later event instead of the earlier one. Past perfect relates two past events. Check: identify which action was already complete.
      - text: "the accounting department"
        rationale: |
          This treats the actor as a verb-form problem. The department is named beside the target verb. Check: locate the verb group requiring the requested form.
      - text: "already resolved"
        correct: true
      - text: "No error"
        rationale: |
          This ignores the explicit past-perfect revision requirement. Simple past can be grammatical in some clearly ordered sequences. Check: follow the particular form requested in this stem.
    explanation: |
      The resolution was complete before the inspection finished. "Had already resolved" uses the requested past perfect to state that earlier completion.
  - id: "q-language-application-error-identification-0009"
    type: "error-identification"
    difficulty: "medium"
    stem: |
      Identify the part of the sentence that contains the punctuation error.

      "The company expanded its operations into three new regions, however, initial profits remained below projected expectations."
    choices:
      - text: "The company expanded its operations"
        rationale: |
          This treats the first main clause's wording as faulty. The clause is long. Check: find the punctuation joining the two complete statements.
      - text: "into three new regions,"
        correct: true
      - text: "however,"
        rationale: |
          This rejects the comma after the transition. Two commas surround "however". Check: check the boundary before "however" separately.
      - text: "initial profits remained"
        rationale: |
          This treats the second subject-and-verb group as the error. It follows a faulty clause boundary. Check: keep the grammatical statement and inspect its connector.
      - text: "No error"
        rationale: |
          This treats "however" like a coordinating conjunction. The word links the ideas in meaning. Check: test whether a comma alone can join the complete clauses.
    explanation: |
      Both sides are complete independent clauses. A semicolon after "regions" joins them, and a comma follows the transition "however."
  - id: "q-language-application-error-identification-0010"
    type: "error-identification"
    difficulty: "medium"
    stem: |
      Using standard American English, identify the error, if any.

      "The research panel is presenting its joint evaluation at the conference today."
    choices:
      - text: "The research panel"
        rationale: |
          This rejects a collective noun acting as one unit. A panel contains several members. Check: use the stated American-English unit reading.
      - text: "is presenting"
        rationale: |
          This treats the unit's singular verb as a plural-agreement error. Several people take part in the panel. Check: match the intended collective unit.
      - text: "its joint evaluation"
        rationale: |
          This treats the unit possessive as if it must refer to members. Several people helped prepare the evaluation. Check: keep the stated one-unit reference consistent.
      - text: "at the conference today."
        rationale: |
          This treats a place-and-time phrase as a sentence error. The phrase adds two kinds of information. Check: identify a specific grammar rule before changing it.
      - text: "No error"
        correct: true
    explanation: |
      The panel is one unit under the stated American-English reading. "Is presenting" and "its joint evaluation" consistently refer to that unit.
  - id: "q-language-application-error-identification-0011"
    type: "error-identification"
    difficulty: "hard"
    stem: |
      The intended meaning is that the generator, not the wrench, stopped working during the storm. Identify the part of the sentence that is misplaced.

      "The technician repaired the electrical generator using a heavy-duty wrench that had stopped working during the storm."
    choices:
      - text: "The technician repaired"
        rationale: |
          This treats the main action as the attachment problem. The repair is the sentence's main event. Check: find the clause describing what stopped working.
      - text: "the electrical generator"
        rationale: |
          This rejects the intended target noun itself. The generator is the thing that failed. Check: locate the misplaced description rather than its correct target.
      - text: "using a heavy-duty wrench"
        rationale: |
          This rejects the method phrase instead of the failure description. It lies between the generator and the final clause. Check: ask which group must describe the generator.
      - text: "that had stopped working"
        correct: true
      - text: "No error"
        rationale: |
          This assumes the nearest noun is the intended failed object. The clause naturally attaches to "wrench" as written. Check: use the intended meaning explicitly given in the stem.
    explanation: |
      Place "that had stopped working during the storm" directly after "generator." It then clearly describes the failed generator, followed by the phrase explaining the tool used.
  - id: "q-language-application-error-identification-0012"
    type: "error-identification"
    difficulty: "medium"
    stem: |
      For a concise revision preserving the meaning, which word can be deleted?
      "The chief executive officer emphasized that the two merging firms must revert back to their core operational principles."
    choices:
      - text: "back"
        correct: true
      - text: "revert"
        rationale: |
          This deletes the main action word instead of its repeated direction. "Back" still suggests returning. Check: retain a verb stating what the firms must do.
      - text: "core"
        rationale: |
          This removes a useful limit on which principles are meant. It makes the sentence shorter. Check: delete repeated meaning rather than needed description.
      - text: "operational"
        rationale: |
          This removes the kind of principles being discussed. The sentence still mentions principles. Check: preserve the specific subject matter.
      - text: "No error"
        rationale: |
          This keeps an unnecessary direction beside "revert". The phrase is common in speech. Check: check what "revert" already means in this concise context.
    explanation: |
      "Revert" already means return to a former state or practice. Deleting "back" keeps "must revert to their core operational principles."
  - id: "q-language-application-error-identification-0013"
    type: "error-identification"
    difficulty: "easy"
    stem: |
      Identify the part of the sentence that contains an error.

      "Between you and I, the proposed structural reforms will require approval from the regional board."
    choices:
      - text: "Between you and"
        rationale: |
          This treats the prepositional frame as the pronoun error. The two pronouns follow "between" together. Check: check the form of the pronoun after the preposition.
      - text: "I,"
        correct: true
      - text: "the proposed structural reforms"
        rationale: |
          This rejects a grammatical main subject. The subject is long and formal. Check: focus on the pronoun in the opening prepositional phrase.
      - text: "will require approval"
        rationale: |
          This treats a grammatical future verb group as the error. The sentence concerns later approval. Check: identify the pronoun form that "between" requires.
      - text: "No error"
        rationale: |
          This accepts a subject form as a preposition's object. The expression is common in speech. Check: test "between" with the object form "me".
    explanation: |
      The pronoun is an object of "between." "Between you and me" uses the required object form.
  - id: "q-language-application-error-identification-0014"
    type: "error-identification"
    difficulty: "medium"
    stem: |
      Identify the part of the sentence that contains an error.

      "If the analysts would have reviewed the statistical data earlier, they would have caught the error before publication."
    choices:
      - text: "If the analysts"
        rationale: |
          You flagged the conditional subject, but it is grammatically sound.
      - text: "would have reviewed"
        correct: true
      - text: "the statistical data earlier,"
        rationale: |
          You flagged the object and time phrase, but they are grammatical.
      - text: "they would have caught"
        rationale: |
          You flagged the result clause, but "would have caught" is appropriate in the result clause of this unreal past conditional.
      - text: "No error"
        rationale: |
          You assumed there was no error, but this unreal past condition takes past perfect in the if-clause: "If the analysts had reviewed..."
    explanation: |
      In this third-conditional pattern, the if-clause uses past perfect and the result clause uses "would have" plus a past participle: "If the analysts had reviewed ..., they would have caught ..."
  - id: "q-language-application-error-identification-0015"
    type: "error-identification"
    difficulty: "medium"
    stem: |
      Which sentence is standard modern English without an unnecessary correction?
    choices:
      - text: "Each applicant has submitted their form."
        correct: true
      - text: "Each applicant have submitted their form to the office."
        rationale: |
          This gives singular "each" a plural verb. The applicants are considered as a larger group. Check: match the verb to "each".
      - text: "Each applicant has submit their completed form to the office."
        rationale: |
          This uses a base verb after perfect "has". The main subject correctly takes "has". Check: check the participle in the complete verb group.
      - text: "Each applicant has submitted them completed form to the office."
        rationale: |
          This uses an object pronoun before a possessed noun. "Them" belongs to the same gender-neutral pronoun set. Check: choose the form showing possession before "form".
    explanation: |
      "Each" takes singular "has." "Submitted" forms the completed-action verb group, and singular "their" gives a gender-neutral reference to each applicant.
  - id: "q-language-application-error-identification-0016"
    type: "error-identification"
    difficulty: "easy"
    stem: |
      Choose the sentence with correct agreement despite an intervening phrase.
    choices:
      - text: "Most of the water in the containers has evaporated."
        correct: true
      - text: "Most of the water in the containers have evaporated during the heat."
        rationale: |
          This matches the nearby plural containers. That noun is close to the verb. Check: check what "most" refers to.
      - text: "Most of the water in the containers are evaporated during the heat."
        rationale: |
          This gives plural agreement to the amount of water. The water is held in several containers. Check: match the mass amount rather than its containers.
      - text: "Most of the water in the containers were evaporated during the heat."
        rationale: |
          This uses a plural past helping verb with a mass amount. The containers are plural and the heat happened earlier. Check: check the number of the actual subject.
    explanation: |
      "Most" refers to an amount of water. That mass amount takes singular "has," forming "has evaporated."
    approved: false
  - id: "q-language-application-error-identification-0017"
    type: "error-identification"
    difficulty: "medium"
    stem: |
      Only the recipient, Paolo, received Lina's draft. Which sentence places "only" to state that restriction clearly?
    choices:
      - text: "Lina sent the draft to Paolo only."
        correct: true
      - text: "Only Lina sent the draft to Paolo during the revision period."
        rationale: |
          This limits the sender rather than the recipient. The same names and limiting word remain. Check: identify which person the stem restricts.
      - text: "Lina sent only the draft to Paolo during the revision period."
        rationale: |
          This limits the item sent. The draft is a main focus of the sentence. Check: put the limit on the stated recipient.
      - text: "Lina sent the draft to Paolo only after the revision period."
        rationale: |
          This limits the timing of sending. "Only" is placed near Paolo. Check: check the whole phrase following the limiting word.
    explanation: |
      "To Paolo only" restricts who received the draft. It identifies Paolo as the sole recipient.
    approved: false
  - id: "q-language-application-error-identification-0018"
    type: "error-identification"
    difficulty: "hard"
    stem: |
      Which sentence correctly connects an opening action to its actor?
    choices:
      - text: "After inspecting the roof, the engineer approved repairs."
        correct: true
      - text: "After inspecting the roof, repairs were approved by the engineer."
        rationale: |
          This gives inspecting to repairs as the main subject. The engineer is named later. Check: match the opening action to the main subject.
      - text: "After inspecting the roof, the approval of repairs was given by the engineer."
        rationale: |
          This makes an approval the subject of inspecting. The actor is still mentioned. Check: name the inspector as the main subject.
      - text: "The roof, after inspecting the engineer, required several urgent repairs."
        rationale: |
          This gives the inspecting action to the roof. The same actor and object remain in the sentence. Check: check who performs the opening action.
    explanation: |
      The engineer is the person inspecting the roof. As the main subject, the engineer gives the opening phrase a clear actor.
    approved: false
  - id: "q-language-application-error-identification-0019"
    type: "error-identification"
    difficulty: "hard"
    stem: |
      Preserve the completed past event in "The courier delivered the documents." Which passive verb completes "The documents ___ by the courier"?
    choices:
      - text: "were delivered"
        correct: true
      - text: "are being delivered"
        rationale: |
          This changes the completed past event into ongoing present delivery. It is a grammatical passive form. Check: preserve both time and completion.
      - text: "have delivered"
        rationale: |
          This makes the documents the actors. The form sounds like a completed action. Check: check whether the subject performs or receives delivery.
      - text: "will be delivered"
        rationale: |
          This changes the event to future time. It is a grammatical passive form. Check: keep the original past event.
    explanation: |
      The documents receive the delivery action. "Were delivered" forms the plural past passive and preserves the completed event.
    approved: false
  - id: "q-language-application-error-identification-0020"
    type: "error-identification"
    difficulty: "exam"
    stem: |
      The narrator has exactly one sister. Choose the standard punctuation for extra information about her.
    choices:
      - text: "My sister, who works in Iloilo, arrived yesterday."
        correct: true
      - text: "My sister, who works in Iloilo arrived, yesterday."
        rationale: |
          This closes the extra-information group after the main verb. Two commas seem to surround the extra words. Check: bracket exactly "who works in Iloilo".
      - text: "My sister who, works in Iloilo, arrived yesterday."
        rationale: |
          This leaves the relative word outside the marked group. Both commas appear near the description. Check: include "who" within the extra-information clause.
      - text: "My sister, who works, in Iloilo arrived yesterday."
        rationale: |
          This splits the relative clause before its location phrase. A pause after "works" can sound natural. Check: include the whole added description between the commas.
    explanation: |
      The narrator has one sister, so "who works in Iloilo" adds extra information. Paired commas set off that whole clause.
    approved: false
