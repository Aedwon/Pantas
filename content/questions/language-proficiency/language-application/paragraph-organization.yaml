meta:
  subject: language-proficiency
  topic: language-application
  subtopic: paragraph-organization
  exams: [upcat, acet, dlsucet, ustet, dost-sei, cse-pro, cse-sub]
questions:
  - id: q-language-application-paragraph-organization-0001
    type: sentence-ordering
    difficulty: easy
    stem: |
      Which of the following shows the most logical order for these sentences?

      1. Consequently, the city council voted to install modern solar panels across all public municipal buildings.
      2. High energy costs had been straining the municipal budget for several consecutive fiscal quarters.
      3. Within a year of installation, municipal energy expenses decreased by nearly thirty percent.
      4. To address this financial drain, city officials conducted a comprehensive audit of energy consumption.
    choices:
      - text: "2, 4, 1, 3"
        correct: true
      - text: "1, 2, 4, 3"
        rationale: |
          "Consequently" cannot logically open before the problem and investigation are established.
      - text: "4, 2, 3, 1"
        rationale: |
          The audit is presented before the financial problem that prompted it.
      - text: "2, 1, 3, 4"
        rationale: |
          The council decision appears before the audit that motivates it.
    explanation: |
      The paragraph moves from problem (2), to investigation (4), to decision (1), to outcome (3).
    approved: true

  - id: q-language-application-paragraph-organization-0002
    type: sentence-ordering
    difficulty: easy
    stem: |
      Which of the following shows the most logical order for these sentences?

      1. Next, the collected materials are sorted by material type and thoroughly cleaned of contaminants.
      2. First, municipal trucks collect recyclable waste from residential neighborhoods across the district.
      3. Finally, the refined raw materials are shipped to manufacturers to make new consumer products.
      4. After cleaning, machines melt or shred the items into raw industrial feedstocks.
    choices:
      - text: "2, 1, 4, 3"
        correct: true
      - text: "1, 2, 4, 3"
        rationale: |
          "Next" appears before the step explicitly marked "First."
      - text: "2, 4, 1, 3"
        rationale: |
          Processing occurs before the sorting and cleaning that sentence 4 refers back to.
      - text: "3, 2, 1, 4"
        rationale: |
          "Finally" cannot logically begin the process.
    explanation: |
      The transition cues give the chronological sequence: First (2), Next (1), After cleaning (4), Finally (3).
    approved: true

  - id: q-language-application-paragraph-organization-0003
    type: sentence-ordering
    difficulty: medium
    stem: |
      Which of the following shows the most logical order for these sentences?

      1. For example, automated translation software can now render complex documents into dozens of languages within seconds.
      2. Artificial intelligence has rapidly expanded its presence across numerous professional industries.
      3. Nevertheless, human linguists remain essential for capturing subtle cultural nuances and artistic context.
      4. As a result, the most effective localization agencies combine artificial intelligence efficiency with human editorial oversight.
    choices:
      - text: "2, 1, 3, 4"
        correct: true
      - text: "1, 2, 3, 4"
        rationale: |
          The example appears before the general topic it illustrates.
      - text: "2, 3, 1, 4"
        rationale: |
          "Nevertheless" introduces a counterpoint before the AI capability it contrasts with.
      - text: "3, 1, 2, 4"
        rationale: |
          The paragraph opens with a contrast marker that has nothing preceding it to contrast against.
    explanation: |
      General claim (2), example (1), counterpoint (3), synthesis (4) gives the coherent progression.
    approved: true

  - id: q-language-application-paragraph-organization-0004
    type: sentence-ordering
    difficulty: medium
    stem: |
      Which of the following shows the most logical order for these sentences?

      1. Among these structural innovations, carbon fiber composites have emerged as a promising material.
      2. Modern aerospace engineering constantly seeks lightweight materials that do not compromise structural strength.
      3. By reducing overall aircraft weight, these composite structures can lower fuel consumption.
      4. Furthermore, their resistance to corrosion can reduce long-term maintenance needs.
    choices:
      - text: "2, 1, 3, 4"
        correct: true
      - text: "1, 2, 3, 4"
        rationale: |
          "Among these structural innovations" refers to a context that has not yet been introduced.
      - text: "2, 3, 1, 4"
        rationale: |
          "These composite structures" appears before carbon fiber composites are introduced.
      - text: "3, 1, 4, 2"
        rationale: |
          The paragraph begins with a benefit before identifying the material or engineering problem.
    explanation: |
      Context (2), material (1), first benefit (3), additional benefit (4) is the coherent order.
    approved: true

  - id: q-language-application-paragraph-organization-0005
    type: sentence-ordering
    difficulty: hard
    stem: |
      Which of the following shows the most logical order for these sentences?

      1. They found that participants who engaged in regular aerobic activity exhibited greater neural connectivity.
      2. Neuroscientists conducted a five-year longitudinal study to examine the impact of exercise on cognitive decline.
      3. These findings suggest that sustained physical fitness may help maintain brain integrity in old age.
      4. Specifically, memory retention scores among active individuals were significantly higher than those of sedentary peers.
      5. The research team tracked over two thousand adults aged sixty and older throughout the testing period.
    choices:
      - text: "2, 5, 1, 4, 3"
        correct: true
      - text: "5, 2, 1, 3, 4"
        rationale: |
          The participant pool appears before the study that enrolled and tracked it.
      - text: "2, 1, 5, 4, 3"
        rationale: |
          A finding is reported before the participant group is introduced.
      - text: "1, 4, 2, 5, 3"
        rationale: |
          The paragraph begins with findings before introducing the study.
    explanation: |
      Study (2), participants (5), main result (1), specific result (4), interpretation (3) forms the logical research sequence.
    approved: true

  - id: q-language-application-paragraph-organization-0006
    type: sentence-ordering
    difficulty: hard
    stem: |
      Which of the following shows the most logical order for these sentences?

      1. This thermal expansion, combined with melting land ice, contributes to global sea level rise.
      2. As human activities release greenhouse gases, Earth's climate system retains additional heat energy.
      3. Coastal communities must therefore account for rising sea levels and storm-surge risk in long-term infrastructure planning.
      4. A major portion of the excess heat is absorbed by oceans, causing seawater to warm and expand.
      5. Consequently, low-lying coastal regions face increasing flooding risk during severe weather events.
    choices:
      - text: "2, 4, 1, 5, 3"
        correct: true
      - text: "4, 2, 1, 3, 5"
        rationale: |
          Ocean heat uptake is presented before the excess heat is introduced.
      - text: "2, 1, 4, 5, 3"
        rationale: |
          "This thermal expansion" appears before ocean warming and expansion are explained.
      - text: "1, 4, 2, 3, 5"
        rationale: |
          The opening reference has no prior explanation of thermal expansion.
    explanation: |
      Cause (2), ocean response (4), sea-level effect (1), risk (5), planning implication (3) gives a complete causal chain.
    approved: true

  - id: q-language-application-paragraph-organization-0007
    type: sentence-ordering
    difficulty: exam
    stem: |
      Which of the following shows the most logical order for these sentences?

      1. However, modern advancements in machine learning have transformed these traditional methods by automating pattern recognition.
      2. Early meteorologists relied primarily on basic barometric readings and visual cloud observations to predict weather.
      3. As a result, forecasting systems can process more information than those earlier manual approaches.
      4. These automated systems process large datasets from satellite and ground-observation networks.
    choices:
      - text: "2, 1, 4, 3"
        correct: true
      - text: "1, 2, 4, 3"
        rationale: |
          "However" appears before the historical baseline it contrasts with.
      - text: "2, 4, 1, 3"
        rationale: |
          "These automated systems" appears before automation is introduced.
      - text: "4, 2, 1, 3"
        rationale: |
          The opening demonstrative has no antecedent.
    explanation: |
      Historical baseline (2), contrast/new method (1), explanation (4), result (3) is the coherent order.
    approved: true

  - id: q-language-application-paragraph-organization-0008
    type: sentence-ordering
    difficulty: exam
    stem: |
      Which of the following shows the most logical order for these sentences?

      1. Some managers initially argued that remote work would reduce employee collaboration and output.
      2. Today, many corporations use hybrid arrangements that combine remote flexibility with scheduled office days.
      3. Later productivity reports from several organizations challenged that assumption by showing that flexible arrangements could maintain or improve output in some roles.
      4. Those reports often cited reduced commuting time and greater schedule flexibility as possible contributing factors.
      5. As a result of such findings, some corporate leaders reconsidered fully office-based requirements.
    choices:
      - text: "1, 3, 4, 5, 2"
        correct: true
      - text: "3, 1, 4, 2, 5"
        rationale: |
          The later evidence appears before the earlier assumption it challenges.
      - text: "1, 4, 3, 5, 2"
        rationale: |
          "Those reports" appears before the reports are introduced.
      - text: "2, 1, 3, 4, 5"
        rationale: |
          The current state is presented before the historical skepticism and evidence explaining the change.
    explanation: |
      Initial view (1), contrary evidence (3), explanation (4), response (5), current state (2) gives the clearest progression.
    approved: true

  - id: q-language-application-paragraph-organization-0009
    type: sentence-ordering
    difficulty: medium
    stem: |
      Which of the following shows the most logical order for these sentences?

      1. After drafting the initial manuscript, the author submitted it to a senior editor for evaluation.
      2. Months later, the polished book finally arrived on store shelves across the country.
      3. The editor suggested several key revisions to improve character development and narrative pacing.
      4. The author spent three weeks revising the text before approving the final layout.
    choices:
      - text: "1, 3, 4, 2"
        correct: true
      - text: "3, 1, 4, 2"
        rationale: |
          Editorial suggestions appear before the manuscript is submitted to the editor.
      - text: "1, 4, 3, 2"
        rationale: |
          Revision work appears before the feedback that prompted it.
      - text: "4, 3, 1, 2"
        rationale: |
          The process begins with revision before drafting/submission and feedback.
    explanation: |
      Submission (1), feedback (3), revision (4), publication (2) follows the process chronologically.
    approved: true

  - id: q-language-application-paragraph-organization-0010
    type: sentence-ordering
    difficulty: easy
    stem: |
      Which of the following shows the most logical order for these sentences?

      1. The chief executive officer emphasized that the two merging firms must revert to their core operational principles.
      2. Integration challenges emerged immediately after the merger announcement.
      3. To resolve these conflicts, senior management appointed a task force to identify core values.
      4. The firms successfully realigned their operations within six months.
    choices:
      - text: "2, 3, 1, 4"
        correct: true
      - text: "1, 2, 3, 4"
        rationale: |
          The executive directive appears before the integration problem and response effort that motivate it.
      - text: "3, 2, 1, 4"
        rationale: |
          The task force appears before the conflicts it was appointed to resolve.
      - text: "2, 1, 4, 3"
        rationale: |
          The outcome appears before the task-force step.
    explanation: |
      Problem (2), response effort (3), directive (1), outcome (4) is the intended causal sequence.
    approved: true

  - id: q-language-application-paragraph-organization-0011
    type: sentence-ordering
    difficulty: medium
    stem: |
      Which of the following shows the most logical order for these sentences?

      1. Lithium-ion batteries have become important for powering mobile electronics and electric vehicles.
      2. Under extreme heat or mechanical damage, some battery cells can undergo rapid electrolyte decomposition and other exothermic reactions.
      3. The resulting reactions can generate intense heat and gases, potentially accelerating thermal runaway.
      4. To reduce this risk, battery engineers are developing solid-state electrolyte designs with different safety characteristics.
    choices:
      - text: "1, 2, 3, 4"
        correct: true
      - text: "4, 1, 2, 3"
        rationale: |
          The proposed mitigation appears before the risk it addresses.
      - text: "1, 3, 2, 4"
        rationale: |
          "The resulting reactions" appears before those reactions are introduced.
      - text: "2, 1, 3, 4"
        rationale: |
          The failure condition appears before the battery topic is introduced.
    explanation: |
      Topic (1), failure condition (2), consequence (3), engineering response (4) gives a clear progression.
    approved: true

  - id: q-language-application-paragraph-organization-0012
    type: sentence-ordering
    difficulty: medium
    stem: |
      Which of the following shows the most logical order for these sentences?

      1. This research demonstrated the value of independent analysis in environmental policy.
      2. Scientists questioned whether a set of government regulations adequately protected forest ecosystems.
      3. A three-year study tracked forest-health metrics across multiple geographic regions.
      4. The study found that several monitored biodiversity indicators remained under pressure in areas covered by the regulations.
    choices:
      - text: "2, 3, 4, 1"
        correct: true
      - text: "3, 2, 4, 1"
        rationale: |
          The investigation appears before the question that motivated it.
      - text: "2, 4, 3, 1"
        rationale: |
          Findings appear before the study that produced them.
      - text: "4, 2, 3, 1"
        rationale: |
          The paragraph opens with findings before the research question and method.
    explanation: |
      Question (2), investigation (3), findings (4), broader significance (1) is the logical research sequence.
    approved: true

  - id: q-language-application-paragraph-organization-0013
    type: sentence-ordering
    difficulty: hard
    stem: |
      Which of the following shows the most logical order for these sentences?

      1. Geothermal energy draws on heat stored within Earth, including primordial heat from the planet's formation and heat generated by radioactive decay.
      2. Some of this internal heat is transferred toward the crust, where it can warm underground rock and fluids.
      3. In geologically suitable areas, hot fluids or rock can provide an accessible geothermal resource.
      4. Power plants can harness suitable geothermal resources to generate electricity without directly burning fossil fuels for the heat source.
      5. As a result, geothermal power can provide a comparatively low-emission source of electricity where appropriate resources are available.
    choices:
      - text: "1, 2, 3, 4, 5"
        correct: true
      - text: "2, 1, 3, 4, 5"
        rationale: |
          "This internal heat" is explained only after its transfer is described.
      - text: "1, 3, 2, 4, 5"
        rationale: |
          The accessible resource is introduced before the heat transfer that creates the stated conditions.
      - text: "3, 1, 2, 4, 5"
        rationale: |
          The paragraph begins with a resource before explaining its underlying heat source.
    explanation: |
      Source (1), transfer (2), accessible resource (3), use (4), implication (5) forms the coherent progression.
    approved: true

  - id: q-language-application-paragraph-organization-0014
    type: sentence-ordering
    difficulty: easy
    stem: |
      Which of the following shows the most logical order for these sentences?

      1. Decades of industrial activity contaminated the soil with heavy metals.
      2. Environmental engineers used phytoremediation techniques as part of the cleanup of the contaminated site.
      3. A former factory site was targeted for urban renewal.
      4. After remediation and redevelopment, the land reopened as a public park and community garden.
    choices:
      - text: "3, 1, 2, 4"
        correct: true
      - text: "1, 3, 2, 4"
        rationale: |
          The contamination history appears before the specific site is introduced.
      - text: "3, 2, 1, 4"
        rationale: |
          Cleanup appears before the contamination that required it.
      - text: "1, 2, 3, 4"
        rationale: |
          The site itself is introduced only after its problem and cleanup.
    explanation: |
      Site (3), problem (1), cleanup (2), outcome (4) gives the clearest sequence.
    approved: true

  - id: q-language-application-paragraph-organization-0015
    type: sentence-ordering
    difficulty: exam
    stem: |
      Which of the following shows the most logical order for these sentences?

      1. Digital payment systems have introduced security risks that require constant technological vigilance.
      2. Financial institutions worldwide have transitioned from paper-based to electronic transaction systems.
      3. Consumer privacy concerns have intensified as attackers develop increasingly sophisticated methods.
      4. Banking regulators have therefore introduced requirements such as stronger authentication and security controls.
      5. These regulatory measures illustrate the effort to balance financial innovation with customer protection.
    choices:
      - text: "2, 1, 3, 4, 5"
        correct: true
      - text: "1, 2, 3, 4, 5"
        rationale: |
          The risks appear before the transition to the systems that created the context for them.
      - text: "2, 3, 1, 4, 5"
        rationale: |
          The specific privacy concern appears before the broader security-risk statement it develops.
      - text: "3, 2, 1, 5, 4"
        rationale: |
          The paragraph opens with a consequence before introducing digital transactions, and the conclusion appears before the regulatory response.
    explanation: |
      Transition (2), risks (1), specific concern (3), response (4), conclusion (5) is the logical progression.
    approved: true
