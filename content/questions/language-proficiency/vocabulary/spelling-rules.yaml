meta:
  subject: language-proficiency
  topic: vocabulary
  subtopic: spelling-rules
  exams: [ upcat, acet, dlsucet, ustet, dost-sei , cse-pro, cse-sub]
questions:
  - id: q-vocabulary-spelling-rules-0001
    type: spelling-correction
    difficulty: easy
    stem: |
      Identify the misspelled word: "The **thief** questioned a **beleif** that had brought **grief** throughout the **field**."
    choices:
      - text: Beleif
        correct: true
      - text: Thief
        rationale: |
          "Thief" is correctly spelled.
      - text: Grief
        rationale: |
          "Grief" is correctly spelled.
      - text: Field
        rationale: |
          "Field" is correctly spelled.
    explanation: |
      The correct spelling is "belief," not "beleif." Mnemonics about i/e order have many exceptions, so the item tests the actual spelling rather than treating the mnemonic as a universal rule.
    approved: true

  - id: q-vocabulary-spelling-rules-0002
    type: spelling-correction
    difficulty: easy
    stem: |
      Which word is misspelled?
    choices:
      - text: Hopeing
        correct: true
      - text: Argument
        rationale: |
          "Argument" is correctly spelled.
      - text: Believable
        rationale: |
          "Believable" is correctly spelled.
      - text: Truly
        rationale: |
          "Truly" is correctly spelled.
    explanation: |
      "Hopeing" should be "hoping." The other three choices are standard spellings, including forms whose spelling does not follow a single simple suffix rule.
    approved: true

  - id: q-vocabulary-spelling-rules-0003
    type: spelling-correction
    difficulty: medium
    stem: |
      Which is the correctly spelled word?
    choices:
      - text: Beginning
        correct: true
      - text: Begining
        rationale: |
          The standard spelling has two n's in "beginning."
      - text: Beggining
        rationale: |
          The standard spelling does not double the g in this position.
      - text: Beginnning
        rationale: |
          The standard spelling has two n's here, not three.
    explanation: |
      The correct spelling is "beginning": begin + -ing, with the final n doubled.
    approved: true

  - id: q-vocabulary-spelling-rules-0004
    type: spelling-correction
    difficulty: medium
    stem: |
      Alin ang wastong pormal na baybay ng panghalip?
    choices:
      - text: Siya
        correct: true
      - text: Sya
        rationale: |
          Karaniwang pinaikling anyo ito sa impormal na pagte-text, hindi ang buong pormal na baybay na sinusubok dito.
      - text: Sia
        rationale: |
          Kulang ang titik y sa wastong baybay na "siya."
      - text: Siia
        rationale: |
          Hindi ito wastong baybay ng panghalip.
    explanation: |
      Ang buong pormal na baybay ay "siya."
    approved: true

  - id: q-vocabulary-spelling-rules-0005
    type: spelling-correction
    difficulty: medium
    stem: |
      Which is the correctly spelled word?
    choices:
      - text: Accommodate
        correct: true
      - text: Acommodate
        rationale: |
          The standard spelling has double c.
      - text: Accomodate
        rationale: |
          The standard spelling also has double m.
      - text: Acomodate
        rationale: |
          This omits both doubled consonants.
    explanation: |
      "Accommodate" is spelled with double c and double m.
    approved: true

  - id: q-vocabulary-spelling-rules-0006
    type: spelling-correction
    difficulty: medium
    stem: |
      Which is the correctly spelled word?
    choices:
      - text: Embarrass
        correct: true
      - text: Embarass
        rationale: |
          The standard spelling has double r.
      - text: Embarras
        rationale: |
          The standard spelling ends with double s.
      - text: Emabarrass
        rationale: |
          This inserts an extra a.
    explanation: |
      "Embarrass" has double r and double s.
    approved: true

  - id: q-vocabulary-spelling-rules-0007
    type: spelling-correction
    difficulty: medium
    stem: |
      Which is the correctly spelled word?
    choices:
      - text: Committee
        correct: true
      - text: Comittee
        rationale: |
          The standard spelling has double m.
      - text: Committe
        rationale: |
          The standard spelling ends in double e.
      - text: Comitee
        rationale: |
          This omits required doubled consonants.
    explanation: |
      The correct spelling is "committee": double m, double t, and double e.
    approved: true

  - id: q-vocabulary-spelling-rules-0008
    type: spelling-correction
    difficulty: hard
    stem: |
      A student writes "seperate." Is this the standard spelling?
    choices:
      - text: 'No: the standard spelling is "separate."'
        correct: true
      - text: 'Yes: "seperate" is the standard spelling.'
        rationale: |
          Dictionaries spell the word "separate."
      - text: 'No: it should be "separrate."'
        rationale: |
          The standard form contains a single r in that position.
      - text: 'No: it should be "seperrate."'
        rationale: |
          This has both the wrong middle vowel and an extra r.
    explanation: |
      The standard spelling is "separate." Because unstressed vowels can be hard to hear, memorizing the actual spelling is safer than inventing a phonetic rule.
    approved: true

  - id: q-vocabulary-spelling-rules-0009
    type: spelling-correction
    difficulty: hard
    stem: |
      A student writes "definate." Is this the standard spelling?
    choices:
      - text: 'No: the standard spelling is "definite."'
        correct: true
      - text: 'Yes: "definate" is the standard spelling.'
        rationale: |
          The standard form uses i in the final unstressed syllable: definite.
      - text: 'No: it should be "definnate."'
        rationale: |
          The standard spelling has one n in that position.
      - text: 'No: it should be "definete."'
        rationale: |
          This does not match the standard spelling "definite."
    explanation: |
      The correct spelling is "definite."
    approved: true

  - id: q-vocabulary-spelling-rules-0010
    type: spelling-correction
    difficulty: hard
    stem: |
      A student writes "mispell." Is this the standard spelling?
    choices:
      - text: 'No: the standard spelling is "misspell."'
        correct: true
      - text: 'Yes: "mispell" is the standard spelling.'
        rationale: |
          The standard form retains both s letters at the morpheme boundary.
      - text: 'No: it should be "misspel."'
        rationale: |
          The root "spell" retains both final l's.
      - text: 'No: it should be "mispsell."'
        rationale: |
          That adds a consonant not present in the word.
    explanation: |
      "Misspell" combines mis- and spell, retaining both adjacent s letters.
    approved: true

  - id: q-vocabulary-spelling-rules-0011
    type: spelling-correction
    difficulty: hard
    stem: |
      A student writes "unecessary." Is this the standard spelling?
    choices:
      - text: 'No: the standard spelling is "unnecessary."'
        correct: true
      - text: 'Yes: "unecessary" is the standard spelling.'
        rationale: |
          The standard form has double n at the prefix/root boundary.
      - text: 'No: it should be "unnecesary."'
        rationale: |
          "Necessary" also contains double s.
      - text: 'No: it should be "unneccessary."'
        rationale: |
          This incorrectly doubles c.
    explanation: |
      "Unnecessary" preserves un- + necessary, giving double n, one c, and double s.
    approved: true

  - id: q-vocabulary-spelling-rules-0012
    type: spelling-correction
    difficulty: hard
    stem: |
      Which form should be used in a formal Filipino response instead of the texting abbreviation "sya"?
    choices:
      - text: Siya
        correct: true
      - text: Sia
        rationale: |
          This omits the y in the standard form.
      - text: Siyya
        rationale: |
          This adds an extra consonant.
      - text: Sya
        rationale: |
          The question specifically asks for the full formal spelling rather than the texting abbreviation.
    explanation: |
      Use the full spelling "siya" in a formal response.
    approved: true

  - id: q-vocabulary-spelling-rules-0013
    type: spelling-correction
    difficulty: medium
    stem: |
      Which word is misspelled?
    choices:
      - text: Recieve
        correct: true
      - text: Yield
        rationale: |
          "Yield" is correctly spelled.
      - text: Ceiling
        rationale: |
          "Ceiling" is correctly spelled.
      - text: Perceive
        rationale: |
          "Perceive" is correctly spelled.
    explanation: |
      The correct spelling is "receive," not "recieve." The familiar i/e mnemonic can help with some words but has many exceptions and should not be treated as a universal spelling law.
    approved: true

  - id: q-vocabulary-spelling-rules-0014
    type: spelling-correction
    difficulty: medium
    stem: |
      Which word is misspelled?
    choices:
      - text: Writeing
        correct: true
      - text: Changeable
        rationale: |
          "Changeable" is correctly spelled.
      - text: Loving
        rationale: |
          "Loving" is correctly spelled.
      - text: Argument
        rationale: |
          "Argument" is correctly spelled.
    explanation: |
      The correct spelling is "writing," not "writeing." The other forms are standard spellings; suffix spelling includes exceptions, so one oversimplified rule should not be generalized to every word.
    approved: true

  - id: q-vocabulary-spelling-rules-0015
    type: spelling-correction
    difficulty: medium
    stem: |
      Which is the correctly spelled word?
    choices:
      - text: Referred
        correct: true
      - text: Refered
        rationale: |
          The standard spelling doubles the final r before -ed.
      - text: Reffered
        rationale: |
          The first f is not doubled.
      - text: Referrred
        rationale: |
          The standard spelling has two r's at the boundary, not three.
    explanation: |
      The correct spelling is "referred."
    approved: true

  - id: q-vocabulary-spelling-rules-0016
    type: spelling-correction
    difficulty: medium
    stem: |
      Alin ang wastong baybay?
    choices:
      - text: Paaralan
        correct: true
      - text: Paralan
        rationale: |
          Kulang ang isang a sa salitang "paaralan."
      - text: Paarallan
        rationale: |
          Hindi dinodoble ang l sa wastong baybay.
      - text: Paaaralan
        rationale: |
          Sobra ang isang a sa unahan.
    explanation: |
      Ang wastong baybay ay "paaralan."
    approved: true

  - id: q-vocabulary-spelling-rules-0017
    type: spelling-correction
    difficulty: hard
    stem: |
      Which is the correctly spelled word?
    choices:
      - text: Seize
        correct: true
      - text: Sieze
        rationale: |
          The standard spelling is "seize."
      - text: Seise
        rationale: |
          The standard form ends in z-e, not s-e.
      - text: Seizee
        rationale: |
          The standard form has one final e.
    explanation: |
      "Seize" is the correct spelling. It is also a useful reminder that i/e-order mnemonics have exceptions.
    approved: true

  - id: q-vocabulary-spelling-rules-0018
    type: spelling-correction
    difficulty: exam
    stem: |
      Identify the ONE correctly spelled word.
    choices:
      - text: Truly
        correct: true
      - text: Acommodate
        rationale: |
          The standard spelling is "accommodate."
      - text: Mispell
        rationale: |
          The standard spelling is "misspell."
      - text: Sieze
        rationale: |
          The standard spelling is "seize."
    explanation: |
      "Truly" is correct. The other choices should be "accommodate," "misspell," and "seize."
    approved: true
