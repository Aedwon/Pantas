meta:
  subject: language-proficiency
  topic: vocabulary
  subtopic: spelling-rules
  exams: [ upcat, acet, dlsucet, ustet, dost-sei , cse-pro, cse-sub]
questions:
  - id: q-vocabulary-spelling-rules-0001
    type: spelling-correction
    difficulty: easy
    stem: |
      Which revision corrects the misspelled word in "The thief questioned a beleif that had brought grief throughout the field"?
    choices:
      - text: "Belief"
        correct: true
      - text: "Beleif"
        rationale: |
          This reverses the i and e. The vowel sound does not clearly show their order. Check the spelling family "believe" and "belief."
      - text: "Belieff"
        rationale: |
          This doubles the final f. Some English words end in -ff, so that pattern may look familiar. Check the ending of "belief."
      - text: "Beliief"
        rationale: |
          This adds a second i. The vowel sound may seem to need more letters. Check the vowel pair in "believe" and "belief."
    explanation: |
      The standard spelling is "belief," with i before e and one final f.
    approved: true

  - id: q-vocabulary-spelling-rules-0002
    type: spelling-correction
    difficulty: easy
    stem: |
      Which word is misspelled?
    choices:
      - text: "Hopeing"
        correct: true
      - text: "Argument"
        rationale: |
          This applies a keep-the-e rule to a lexical exception. "Argue" visibly ends in e. Check the established spelling "argument."
      - text: "Believable"
        rationale: |
          This treats dropping the final e of "believe" as an error. The suffix -able starts with a vowel. Check the standard spelling "believable."
      - text: "Truly"
        rationale: |
          This assumes the e of "true" stays before -ly. That often happens before consonant-starting suffixes. Check the exception "truly."
    explanation: |
      When -ing is added to "hope," its silent e is dropped. The standard spelling is "hoping," so "hopeing" needs correction.
    approved: true

  - id: q-vocabulary-spelling-rules-0003
    type: spelling-correction
    difficulty: medium
    stem: |
      Which is the correctly spelled word?
    choices:
      - text: "Beginning"
        correct: true
      - text: "Begining"
        rationale: |
          This leaves the final n single. Many words take -ing without doubling. Check the stress on the last syllable of "begin."
      - text: "Beggining"
        rationale: |
          This doubles g instead of the final n. The strong sound in the middle may draw attention. Check which consonant ends the base.
      - text: "Beginnning"
        rationale: |
          This adds a third n. The doubling rule may be applied after the word has already been doubled. Check that doubling means two copies, not three.
    explanation: |
      The last syllable of "begin" is stressed. The final n doubles before -ing, giving "beginning."
    approved: true

  - id: q-vocabulary-spelling-rules-0004
    type: spelling-correction
    difficulty: medium
    stem: |
      Alin ang wastong pormal na baybay ng panghalip?
    choices:
      - text: "Siya"
        correct: true
      - text: "Sya"
        rationale: |
          This omits i as in a texting abbreviation. The shortened form is common in messages. Check the full form required for formal writing.
      - text: "Sia"
        rationale: |
          This omits y. Fast pronunciation can make the sound sequence hard to separate. Check the letters in the full pronoun.
      - text: "Siia"
        rationale: |
          This substitutes another i for y. The nearby vowel may make the spelling look possible. Check the sequence i-y-a.
    explanation: |
      The full standard Filipino pronoun is "siya." It includes the vowel i followed by y.
    approved: true

  - id: q-vocabulary-spelling-rules-0005
    type: spelling-correction
    difficulty: medium
    stem: |
      Which is the correctly spelled word?
    choices:
      - text: "Accommodate"
        correct: true
      - text: "Acommodate"
        rationale: |
          This leaves c single. The spoken sound does not reveal the doubled letter. Check both doubled pairs, c and m.
      - text: "Accomodate"
        rationale: |
          This leaves m single. Remembering double c may make the spelling seem complete. Check the middle pair too.
      - text: "Accommmodate"
        rationale: |
          This adds a third m. Knowing the word has doubled consonants can lead to adding one twice. Check that each doubled pair contains two letters.
    explanation: |
      "Accommodate" has two c letters and two m letters. Keeping both pairs gives the standard spelling.
    approved: true

  - id: q-vocabulary-spelling-rules-0006
    type: spelling-correction
    difficulty: medium
    stem: |
      Which is the correctly spelled word?
    choices:
      - text: "Embarrass"
        correct: true
      - text: "Embarass"
        rationale: |
          This leaves r single. The word's pronunciation does not count written consonants. Check the pair in the middle.
      - text: "Embarras"
        rationale: |
          This leaves the final s single. The ending sounds the same with one or two s letters. Check the standard -rr- and -ss pairs.
      - text: "Emabarrass"
        rationale: |
          This inserts a before b. Unstressed vowels can make the letter order hard to hear. Check that the word starts with em-b, then a.
    explanation: |
      "Embarrass" has two r letters and ends with two s letters.
    approved: true

  - id: q-vocabulary-spelling-rules-0007
    type: spelling-correction
    difficulty: medium
    stem: |
      Which is the correctly spelled word?
    choices:
      - text: "Committee"
        correct: true
      - text: "Comittee"
        rationale: |
          This leaves m single. The double t and e can make the spelling look complete. Check all three pairs.
      - text: "Committe"
        rationale: |
          This leaves the final e single. The double consonants are easy to notice first. Check the final vowel pair as well.
      - text: "Committtee"
        rationale: |
          This adds a third t. Remembering several double letters can lead to counting one pair twice. Check that the t pair has exactly two letters.
    explanation: |
      "Committee" has double m, double t, and double e.
    approved: true

  - id: q-vocabulary-spelling-rules-0008
    type: spelling-correction
    difficulty: hard
    stem: |
      Choose the standard spelling to replace "seperate" in a formal report.
    choices:
      - text: "Separate"
        correct: true
      - text: "Seperate"
        rationale: |
          This replaces the middle a with e. The unstressed vowel can sound unclear. Check the middle sequence p-a-r.
      - text: "Separrate"
        rationale: |
          This doubles r. Many English words have doubled consonants. Check that "separate" has only one r.
      - text: "Seperrate"
        rationale: |
          This changes the middle vowel and doubles r. Both edits can look plausible when spelling by sound. Check the middle vowel and consonant separately.
    explanation: |
      The standard spelling is "separate." It uses a in the middle and one r.
    approved: true

  - id: q-vocabulary-spelling-rules-0009
    type: spelling-correction
    difficulty: hard
    stem: |
      Choose the standard spelling to replace "definate" in a formal report.
    choices:
      - text: "Definite"
        correct: true
      - text: "Definate"
        rationale: |
          This replaces the i after n with a. That unstressed vowel can sound unclear. Check the spelling of "finite" within the word.
      - text: "Definnate"
        rationale: |
          This doubles n and uses a after it. A longer consonant sound may seem to need doubling. Check both the single n and the vowel that follows.
      - text: "Definete"
        rationale: |
          This uses e where the word needs i after n. Similar unstressed sounds can suggest either vowel. Check the base "finite."
    explanation: |
      The standard spelling is "definite." The base "finite" helps remember the i vowels in its later part.
    approved: true

  - id: q-vocabulary-spelling-rules-0010
    type: spelling-correction
    difficulty: hard
    stem: |
      Which spelling correctly combines "mis-" with "spell"?
    choices:
      - text: "Misspell"
        correct: true
      - text: "Mispell"
        rationale: |
          This merges the final s of mis- with the first s of "spell." One spoken sound can seem to need one letter. Check the two parts before joining them.
      - text: "Misspel"
        rationale: |
          This drops one final l from the base. The prefix may draw attention away from the ending. Check that "spell" remains whole.
      - text: "Mispsell"
        rationale: |
          This swaps the second s and p. The same letters are present, so a quick glance may miss the order. Check the boundary between mis- and "spell."
    explanation: |
      "Misspell" joins mis- and "spell." The joining keeps both adjacent s letters and both final l letters.
    approved: true

  - id: q-vocabulary-spelling-rules-0011
    type: spelling-correction
    difficulty: hard
    stem: |
      Which spelling correctly combines "un-" with "necessary"?
    choices:
      - text: "Unnecessary"
        correct: true
      - text: "Unecessary"
        rationale: |
          This merges the n at the end of un- with the n of "necessary." One spoken sound can suggest one letter. Check each part before joining them.
      - text: "Unnecesary"
        rationale: |
          This drops one s from "necessary." The doubled n may make the spelling look complete. Check the base's s pair.
      - text: "Unneccessary"
        rationale: |
          This doubles c in "necessary." Other long words have several doubled consonants. Check the base's pattern of one c and two s letters.
    explanation: |
      "Unnecessary" joins un- and "necessary." The boundary gives double n, while "necessary" keeps one c and double s.
    approved: true

  - id: q-vocabulary-spelling-rules-0012
    type: spelling-correction
    difficulty: hard
    stem: |
      Aling pares ang nakalista sa Ortograpiyang Pambansa ng KWF bilang mga adaptasyong Filipino ng salitang Espanyol na "cuento"?
    choices:
      - text: "Kwento / kuwento"
        correct: true
      - text: "Kuwento / cuento"
        rationale: |
          This treats the original Spanish spelling as a listed Filipino adaptation. It appears beside the adaptations in the reference. Check which forms are identified as the adapted words.
      - text: "Kwento / kuento"
        rationale: |
          This removes w from one adapted form. The short spelling "kwento" may suggest removing letters freely. Check the exact pair listed by KWF.
      - text: "Kwento / kuwuento"
        rationale: |
          This adds u after w to one adapted form. The longer variant includes u, so an extra vowel may seem helpful. Check the listed sequence k-u-w-e.
    explanation: |
      KWF's orthography lists both "kwento" and "kuwento" as Filipino adaptations of Spanish "cuento." Either listed form is accepted.
    approved: true

  - id: q-vocabulary-spelling-rules-0013
    type: spelling-correction
    difficulty: medium
    stem: |
      Which word is misspelled?
    choices:
      - text: "Recieve"
        correct: true
      - text: "Yield"
        rationale: |
          This wrongly changes the established i-e order in "yield." A broad vowel-pair rule can seem tempting. Check the spelling of the whole word.
      - text: "Ceiling"
        rationale: |
          This applies i-before-e despite the c. The rhyme's opening may be easier to recall than its limited pattern. Check the c-e-i sequence in "ceiling."
      - text: "Perceive"
        rationale: |
          This flags a standard e-i pair after c. The pronunciation can make the letter order hard to judge. Check the c-e-i sequence in "perceive."
    explanation: |
      The standard form is "receive," with e before i after c. "Recieve" reverses that pair.
    approved: true

  - id: q-vocabulary-spelling-rules-0014
    type: spelling-correction
    difficulty: medium
    stem: |
      Which word is misspelled?
    choices:
      - text: "Noticable"
        correct: true
      - text: "Managing"
        rationale: |
          This keeps the silent e of "manage" before -ing. Some suffixes preserve an e, so that may seem necessary here. Check the ordinary -ing form "managing."
      - text: "Courageous"
        rationale: |
          This assumes every vowel-starting suffix requires dropping e. That shortcut works for many -ing forms. Check the established spelling "courageous."
      - text: "Argument"
        rationale: |
          This assumes the e of "argue" stays before -ment. The suffix starts with a consonant, which may suggest keeping it. Check the exception "argument."
    explanation: |
      The standard spelling is "noticeable," with the e of "notice" retained before -able. The e helps keep the soft c sound.
    approved: true

  - id: q-vocabulary-spelling-rules-0015
    type: spelling-correction
    difficulty: medium
    stem: |
      Which is the correctly spelled word?
    choices:
      - text: "Referred"
        correct: true
      - text: "Refered"
        rationale: |
          This leaves the final r single. Many verbs take -ed without doubling. Check the stress on the last syllable of "refer."
      - text: "Reffered"
        rationale: |
          This doubles f instead of the final r. The middle consonant may be the most noticeable part. Check which letter ends the base.
      - text: "Referrred"
        rationale: |
          This adds a third r. The doubling rule may be applied to an already doubled form. Check that the final r pair contains two letters.
    explanation: |
      The final syllable of "refer" is stressed. Its final r doubles before -ed, giving "referred."
    approved: true

  - id: q-vocabulary-spelling-rules-0016
    type: spelling-correction
    difficulty: medium
    stem: |
      Alin ang wastong baybay?
    choices:
      - text: "Paaralan"
        correct: true
      - text: "Paralan"
        rationale: |
          This drops one of the opening a letters. Fast speech may make the two vowels seem like one. Check the written sequence p-a-a.
      - text: "Paarallan"
        rationale: |
          This doubles l. English-style doubling patterns may look familiar. Check the established Filipino spelling.
      - text: "Paaaralan"
        rationale: |
          This adds a third opening a. Knowing that the word has two a letters may lead to adding one twice. Check that the opening pair has exactly two.
    explanation: |
      The standard spelling is "paaralan." It starts with p-a-a and has one l.
    approved: true

  - id: q-vocabulary-spelling-rules-0017
    type: spelling-correction
    difficulty: hard
    stem: |
      Which is the correctly spelled word?
    choices:
      - text: "Seize"
        correct: true
      - text: "Sieze"
        rationale: |
          This applies i-before-e to an exception. The familiar rhyme may seem general. Check the established spelling "seize."
      - text: "Seise"
        rationale: |
          This replaces z with s. Both can suggest a similar sound in English spelling. Check the final consonant of the word.
      - text: "Seizee"
        rationale: |
          This adds a second final e. A long vowel may seem to need an extra written vowel. Check the standard five-letter form.
    explanation: |
      The standard spelling is "seize," with e before i and one final e. Its vowel pair is a learned exception to the limited i-before-e mnemonic.
    approved: true

  - id: q-vocabulary-spelling-rules-0018
    type: spelling-correction
    difficulty: exam
    stem: |
      Identify the correctly spelled word.
    choices:
      - text: "Occurrence"
        correct: true
      - text: "Priviledge"
        rationale: |
          This inserts d into "privilege." The soft g sound resembles the -dge sequence in other words. Check the established -lege ending.
      - text: "Managable"
        rationale: |
          This drops the e that preserves the soft g in "manageable." Dropping silent e before a vowel suffix is a useful but limited pattern. Check the pronunciation that the spelling must preserve.
      - text: "Arguement"
        rationale: |
          This keeps e when adding -ment to "argue." A consonant-starting suffix often leaves e in place. Check the exception "argument."
    explanation: |
      The standard spelling is "occurrence," with two c letters, two r letters, and the ending -ence.
    approved: true

  - id: q-vocabulary-spelling-rules-0019
    type: spelling-correction
    difficulty: hard
    stem: |
      Complete the sentence with the standard form made from "true" and "-ly": "The witness spoke ______ about the incident."
    choices:
      - text: "Truly"
        correct: true
      - text: "Truely"
        rationale: |
          This keeps e before -ly. That is common in other word families. Check the exception "true" to "truly."
      - text: "Trully"
        rationale: |
          This doubles l while adding -ly. Some suffix rules involve doubled consonants. Check whether the base "true" has an l to double.
      - text: "Truley"
        rationale: |
          This rearranges the suffix and keeps the e. The same nearby letters may look familiar. Check that the suffix is -ly and the base drops e.
    explanation: |
      "True" drops its e when -ly is added. The standard result is "truly," a learned exception to the usual keep-e pattern before consonant-starting suffixes.
    approved: false

  - id: q-vocabulary-spelling-rules-0020
    type: spelling-correction
    difficulty: exam
    stem: |
      "Visit" is stressed on its first syllable, and "begin" on its last. Which pair correctly gives their -ing forms?
    choices:
      - text: "Visiting, beginning"
        correct: true
      - text: "Visitting, beginning"
        rationale: |
          This doubles the final t of "visit." Its ending has a vowel followed by a consonant, which may suggest doubling. Check where the stress falls.
      - text: "Visiting, begining"
        rationale: |
          This leaves the final n of "begin" single. "Visiting" correctly has no doubling, so that pattern may be copied. Check each word's stress separately.
      - text: "Visitting, begining"
        rationale: |
          This reverses the stress-based doubling pattern for both words. Their endings look similar. Check whether the final syllable is stressed before adding -ing.
    explanation: |
      "Visit" has stress on its first syllable, so its final t stays single in "visiting." "Begin" has stress on its last syllable, so its final n doubles in "beginning."
    approved: false

