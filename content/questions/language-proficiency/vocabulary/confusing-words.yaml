meta:
  subject: language-proficiency
  topic: vocabulary
  subtopic: confusing-words
  exams: [ upcat, acet, dlsucet, ustet, dost-sei , cse-pro, cse-sub]
questions:
  - id: q-vocabulary-confusing-words-0001
    type: confusing-words
    difficulty: easy
    stem: |
      The prolonged drought will severely ______ the crop yield for this quarter.
    choices:
      - text: Affect
        correct: true
      - text: Effect
        rationale: |
          Although "effect" can be a verb in other constructions, here the intended meaning is "influence," for which the ordinary verb is "affect."
      - text: Affects
        rationale: |
          The modal auxiliary "will" requires the base form of the following verb.
      - text: Effects
        rationale: |
          "Effects" does not supply the required base-form verb with the intended meaning.
    explanation: |
      In this sentence, "affect" is the base-form verb meaning "influence": "will severely affect the crop yield." "Effect" is most commonly a noun meaning a result, though it can also be a verb with a different meaning, such as "effect change."
    approved: true

  - id: q-vocabulary-confusing-words-0002
    type: confusing-words
    difficulty: easy
    stem: |
      The device revised ______ settings after the software update.
    choices:
      - text: Its
        correct: true
      - text: It's
        rationale: |
          "It's" contracts "it is" or "it has"; neither reading fits before "settings."
      - text: Its'
        rationale: |
          Standard English has no possessive form "its'."
      - text: Their
        rationale: |
          The antecedent is the singular nonhuman noun "device," so "its" is the unambiguous possessive form here.
    explanation: |
      The settings belong to the device, so the possessive determiner is "its" without an apostrophe.
    approved: true

  - id: q-vocabulary-confusing-words-0003
    type: confusing-words
    difficulty: medium
    stem: |
      Kumanta ______ maganda ang mag-ina sa entablado.
    choices:
      - text: Nang
        correct: true
      - text: Ng
        rationale: |
          Dito, inilalarawan ng "maganda" ang paraan ng pagkanta, kaya "nang" ang ginagamit.
      - text: Na
        rationale: |
          Hindi pang-angkop na "na" ang kailangan sa puwang na nag-uugnay sa pandiwa at sa paglalarawan ng paraan.
      - text: May
        rationale: |
          Hindi ipinakikilala ng puwang ang pagkakaroon o pag-iral, kaya hindi angkop ang "may."
    explanation: |
      Sumasagot ang "maganda" sa tanong na "paano kumanta?" Kaya "nang" ang wastong gamit: "Kumanta nang maganda."
    approved: true

  - id: q-vocabulary-confusing-words-0004
    type: confusing-words
    difficulty: medium
    stem: |
      ______ Pedro, Ana, at Miguel ang mga kasapi ng grupong ito.
    choices:
      - text: Sina
        correct: true
      - text: Sila
        rationale: |
          Ang "sila" ay panghalip; dahil tahasang sumusunod ang mga pangalan, ang panandang maramihan para sa mga pangalang pantangi ay "sina."
      - text: Kina
        rationale: |
          Ang "kina" ay hindi ang panandang paksa para sa maramihang pangalang pantangi sa pangungusap na ito.
      - text: Ang
        rationale: |
          Maaaring gamitin ang "ang" sa mga karaniwang pangngalan, ngunit para sa maramihang pangalang pantangi na Pedro, Ana, at Miguel, "sina" ang kailangan.
    explanation: |
      Kapag maramihang pangalang pantangi ng tao ang minamarkahan bilang paksa, ginagamit ang "sina": "Sina Pedro, Ana, at Miguel..."
    approved: true

  - id: q-vocabulary-confusing-words-0005
    type: confusing-words
    difficulty: medium
    stem: |
      The typhoon had a devastating ______ on the coastal town; ______ obvious that recovery will take years.
    choices:
      - text: Effect, it's
        correct: true
      - text: Affect, its
        rationale: |
          The first blank follows "a devastating" and needs a noun meaning result; the second expands naturally to "it is obvious."
      - text: Effect, its
        rationale: |
          The first word is correct, but the second clause needs the contraction "it's" = "it is," not the possessive "its."
      - text: Affect, it's
        rationale: |
          The second word is correct, but the first blank needs the noun "effect" in this construction.
    explanation: |
      "A devastating effect" uses the noun meaning result. "It's obvious" contracts "it is obvious."
    approved: true

  - id: q-vocabulary-confusing-words-0006
    type: confusing-words
    difficulty: medium
    stem: |
      Loud noises can negatively ______ a person's concentration.
    choices:
      - text: Affect
        correct: true
      - text: Effect
        rationale: |
          In this context the meaning is "influence," so "affect" is the appropriate base-form verb.
      - text: Affecting
        rationale: |
          The modal "can" requires the base form "affect," not the participle "affecting."
      - text: Effected
        rationale: |
          "Effected" is not the base form required after "can" and carries a different verb sense.
    explanation: |
      "Can negatively affect" means "can negatively influence." The modal "can" also requires the base form of the verb.
    approved: true

  - id: q-vocabulary-confusing-words-0007
    type: confusing-words
    difficulty: medium
    stem: |
      The cat cleaned ______ paws after playing outside.
    choices:
      - text: Its
        correct: true
      - text: It's
        rationale: |
          "It's" means "it is" or "it has," neither of which fits before "paws."
      - text: Its'
        rationale: |
          Standard English has no possessive form "its'."
      - text: Their
        rationale: |
          The singular nonhuman antecedent "cat" is unambiguously referred to here with "its."
    explanation: |
      The possessive form for "it" is "its" without an apostrophe: "The cat cleaned its paws."
    approved: true

  - id: q-vocabulary-confusing-words-0008
    type: confusing-words
    difficulty: medium
    stem: |
      Umiyak ______ umiyak ang sanggol hanggang sa makatulog.
    choices:
      - text: Nang
        correct: true
      - text: Ng
        rationale: |
          Sa pag-uulit ng pandiwa upang ipakita ang tuloy-tuloy o paulit-ulit na kilos, "nang" ang ginagamit.
      - text: Na
        rationale: |
          Hindi pang-angkop na "na" ang ginagamit sa ganitong pag-uulit ng pandiwa.
      - text: May
        rationale: |
          Hindi ipinakikilala ng puwang ang pagkakaroon o pag-iral.
    explanation: |
      Isa sa gamit ng "nang" ang pag-uugnay sa inuulit na pandiwa: "umiyak nang umiyak."
    approved: true

  - id: q-vocabulary-confusing-words-0009
    type: confusing-words
    difficulty: medium
    stem: |
      ______ Elena at Ricardo ay nagtungo sa palengke upang bumili ng gulay.
    choices:
      - text: Sina
        correct: true
      - text: Sila
        rationale: |
          Dahil tahasang sumusunod ang mga pangalan, "sina" ang panandang kailangan sa halip na panghalip na "sila."
      - text: Kina
        rationale: |
          Hindi "kina" ang panandang paksa para sa maramihang pangalang pantangi sa pangungusap na ito.
      - text: Ang
        rationale: |
          Para sa maramihang pangalang pantangi ng tao na Elena at Ricardo, "sina" ang wastong pananda.
    explanation: |
      Ginagamit ang "sina" bago ang dalawa o higit pang pangalang pantangi ng tao na nagsisilbing paksa.
    approved: true

  - id: q-vocabulary-confusing-words-0010
    type: confusing-words
    difficulty: medium
    stem: |
      Which statement about the forms "its," "it's," and "its'" is correct in standard English?
    choices:
      - text: '"Its" is possessive, "it''s" means "it is" or "it has," and "its''" is not a standard form.'
        correct: true
      - text: '"Its''" is the plural possessive form of "it."'
        rationale: |
          The pronoun "it" has no plural possessive form "its'."
      - text: '"It''s" is the possessive form of "it."'
        rationale: |
          "It's" is a contraction, not the possessive determiner.
      - text: 'All three forms are interchangeable.'
        rationale: |
          They are not interchangeable; only "its" and "it's" are standard forms, with different functions.
    explanation: |
      Standard English uses "its" for possession and "it's" for "it is" or "it has." The form "its'" is not standard.
    approved: true

  - id: q-vocabulary-confusing-words-0011
    type: confusing-words
    difficulty: hard
    stem: |
      Sa pormal na Filipino, alin ang wastong anyo kapag sina Maria at Ana ang tahasang binabanggit na paksa?
    choices:
      - text: Sina Maria at Ana ang pupunta sa palengke.
        correct: true
      - text: Sila Maria at Ana ang pupunta sa palengke.
        rationale: |
          Ang "sila" ay panghalip; kapag tahasang sumusunod ang maramihang pangalan, "sina" ang panandang ginagamit sa pormal na anyo.
      - text: Kina Maria at Ana ang pupunta sa palengke.
        rationale: |
          Hindi "kina" ang panandang paksa sa konstruksiyong ito.
      - text: Ang Maria at Ana ang pupunta sa palengke.
        rationale: |
          Para sa maramihang pangalang pantangi ng tao, "sina" ang wastong personal-name marker.
    explanation: |
      Sa pormal na Filipino, "sina" ang ginagamit bago ang dalawa o higit pang pangalang pantangi ng tao na nagsisilbing paksa: "Sina Maria at Ana..."
    approved: true

  - id: q-vocabulary-confusing-words-0012
    type: confusing-words
    difficulty: hard
    stem: |
      Umalis siya ______ alas-singko ng hapon. Alin ang wastong pananda bago ang tiyak na oras?
    choices:
      - text: Ng
        correct: true
      - text: Nang
        rationale: |
          Hindi kabilang sa mga gamit ng "nang" ang simpleng pagmamarka ng tiyak na oras sa orasan sa konstruksiyong ito.
      - text: Na
        rationale: |
          Hindi pang-angkop na "na" ang kailangan bago ang tiyak na oras.
      - text: May
        rationale: |
          Hindi ipinakikilala ng puwang ang pagkakaroon o pag-iral.
    explanation: |
      Sa konstruksiyong ito, ginagamit ang "ng" bago ang tiyak na oras: "Umalis siya ng alas-singko ng hapon."
    approved: true

  - id: q-vocabulary-confusing-words-0013
    type: confusing-words
    difficulty: medium
    stem: |
      The therapy had a lasting ______ on her overall well-being.
    choices:
      - text: Effect
        correct: true
      - text: Affect
        rationale: |
          In this construction, "a lasting" requires a singular noun, and "effect" supplies the intended meaning of result or consequence.
      - text: Effects
        rationale: |
          The article "a" requires a singular noun here.
      - text: Affecting
        rationale: |
          "Affecting" does not function as the required singular noun in this phrase.
    explanation: |
      The fixed phrase here is "a lasting effect," where "effect" is the noun meaning a result or consequence.
    approved: true

  - id: q-vocabulary-confusing-words-0014
    type: confusing-words
    difficulty: medium
    stem: |
      Ang bahay ______ aking lola ay malapit sa simbahan.
    choices:
      - text: Ng
        correct: true
      - text: Nang
        rationale: |
          Pagmamay-ari o ugnayan ng mga pangngalan ang ipinapakita rito, hindi paraan o pag-uulit ng kilos.
      - text: Na
        rationale: |
          Hindi pang-angkop ang kailangan upang ipakita ang ugnayang "bahay ng aking lola."
      - text: May
        rationale: |
          Hindi ipinakikilala ng puwang ang pagkakaroon; kailangan ang panandang "ng."
    explanation: |
      Ipinapakita ng "ng" ang ugnayan o pagmamay-ari: "ang bahay ng aking lola."
    approved: true

  - id: q-vocabulary-confusing-words-0015
    type: confusing-words
    difficulty: exam
    stem: |
      The company's ______ on public trust was severe; its executives admitted that ______ handling of the crisis had been poor from the start.
    choices:
      - text: Effect, its
        correct: true
      - text: Affect, it's
        rationale: |
          The first blank needs the noun "effect" in this construction, while the second needs the possessive "its."
      - text: Effect, it's
        rationale: |
          The first word is correct, but "it's handling" expands to "it is handling," which does not fit.
      - text: Affect, its
        rationale: |
          The second word is correct, but the first blank needs a noun meaning consequence.
    explanation: |
      "The company's effect" uses the noun meaning consequence or influence in this construction. "Its handling" uses the possessive determiner referring back to the company.
    approved: true
