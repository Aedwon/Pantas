meta:
  subject: language-proficiency
  topic: vocabulary
  subtopic: confusing-words
  exams: [ upcat, acet, dlsucet, ustet, dost-sei , cse-pro, cse-sub]
questions:
  - id: q-vocabulary-confusing-words-0001
    type: confusing-words
    difficulty: easy
    stem: |
      The prolonged drought will severely ______ the crop yield for this quarter.
    choices:
      - text: "Affect"
        correct: true
      - text: "Effect"
        rationale: |
          This confuses influencing something with bringing it about. "Effect" looks familiar because it is linked to results. Check whether the sentence means influence or create.
      - text: "Affects"
        rationale: |
          This adds an -s ending after "will." The singular drought may make that ending look right. Check that a verb after "will" stays in its base form.
      - text: "Effects"
        rationale: |
          This combines the result word with an -s ending. Both the singular subject and the idea of a result may make it seem right. Check the verb's meaning and its form after "will."
    explanation: |
      The drought will influence the crop yield. "Affect" means influence, and "will" needs the base form of the verb.
    approved: true

  - id: q-vocabulary-confusing-words-0002
    type: confusing-words
    difficulty: easy
    stem: |
      The device revised ______ settings after the software update.
    choices:
      - text: "Its"
        correct: true
      - text: "It's"
        rationale: |
          This uses a contraction to show ownership. Apostrophes often mark possession, so it may look right. Expand the contraction before putting it before a noun.
      - text: "Its'"
        rationale: |
          This adds an apostrophe after the possessive pronoun. The final -s looks like a plural noun ending. Check whether the word is a pronoun or a plural noun.
      - text: "Their"
        rationale: |
          This uses a plural owner for one device. The plural word "settings" may suggest a plural pronoun. Check the number of the owner, not the things owned.
    explanation: |
      The settings belong to one device. "Its" is the possessive form for "it," so "its settings" fits.
    approved: true

  - id: q-vocabulary-confusing-words-0003
    type: confusing-words
    difficulty: medium
    stem: |
      Sa "Kumanta nang maganda ang mag-ina sa entablado," ano ang ipinapakita ng "nang maganda"?
    choices:
      - text: "Manner of singing"
        correct: true
      - text: "Ownership of a song"
        rationale: |
          This treats an action description as ownership. "Nang" sounds like the ownership marker "ng." Check whether the phrase names an owner or describes an action.
      - text: "Time of the performance"
        rationale: |
          This treats "nang" as a time connector in every use. It can mean "when" in other sentences, so this meaning may seem possible. Check whether the following words describe a time or a manner.
      - text: "Names of the performers"
        rationale: |
          This treats a description of the action as a marker for the performers. The pair is mentioned nearby, so their identity may seem central. Check which words actually name the people.
    explanation: |
      "Nang maganda" describes how the pair sang. It gives the manner of the action.
    approved: true

  - id: q-vocabulary-confusing-words-0004
    type: confusing-words
    difficulty: medium
    stem: |
      ______ Pedro, Ana, at Miguel ang mga kasapi ng grupong ito.
    choices:
      - text: "Sina"
        correct: true
      - text: "Sila"
        rationale: |
          This puts a plural pronoun directly before the names. Both forms refer to several people, so they can seem alike. Check whether the sentence names the people or replaces their names.
      - text: "Kina"
        rationale: |
          This uses a destination or recipient marker for the topic. "Kina" can also appear before several names. Check the role of those people in the sentence.
      - text: "Ang"
        rationale: |
          This uses a general noun marker before a group of personal names. "Ang" also marks topics, so it may seem suitable. Check whether the words are personal names.
    explanation: |
      The sentence directly names several people as its topic. Standard Filipino uses "sina" before that group of personal names.
    approved: true

  - id: q-vocabulary-confusing-words-0005
    type: confusing-words
    difficulty: medium
    stem: |
      The typhoon had a devastating ______ on the coastal town; ______ obvious that recovery will take years.
    choices:
      - text: "Effect, it's"
        correct: true
      - text: "Affect, its"
        rationale: |
          This uses the influence verb as a result noun and uses possession for "it is." Both pairs look similar in writing. Check the first word's role, then expand the contraction.
      - text: "Effect, its"
        rationale: |
          This uses a possessive form before "obvious." Possessive forms are common after a reference to a town, so it may seem natural. Check whether "it is" fits the second gap.
      - text: "Affect, it's"
        rationale: |
          This uses the usual influence verb where a result noun is needed. The typhoon influences the town, so the meaning can look close. Check what follows the article and adjective.
    explanation: |
      "A devastating effect" names a result of the typhoon. "It's obvious" expands to "it is obvious," which makes the second clause complete.
    approved: true

  - id: q-vocabulary-confusing-words-0006
    type: confusing-words
    difficulty: medium
    stem: |
      In a psychology report, the observable expression of emotion is called ______.
    choices:
      - text: "Affect"
        correct: true
      - text: "Effect"
        rationale: |
          This treats the emotional expression as a result. "Effect" is usually a noun, so it may seem to fit. Check the technical meaning named in the stem.
      - text: "Affective"
        rationale: |
          This uses an adjective instead of the name of the expression. "Affective" relates to emotion, so its meaning looks close. Check whether the gap needs a noun or a description.
      - text: "Effective"
        rationale: |
          This uses a word for being successful or producing a result. Its spelling resembles the emotion word. Check the meaning before choosing by spelling.
    explanation: |
      In psychology, "affect" is a noun for the outward expression of emotion. That is the meaning requested in the report.
    approved: true

  - id: q-vocabulary-confusing-words-0007
    type: confusing-words
    difficulty: medium
    stem: |
      The museum's archive has not reopened. Complete the report: '______ still closed, and ______ doors need repair.'
    choices:
      - text: "It's, its"
        correct: true
      - text: "Its, it's"
        rationale: |
          This reverses contraction and possession. Each form looks almost the same, so swapping them may be easy. Expand the form in each gap separately.
      - text: "It's, it's"
        rationale: |
          This uses a contraction before an owned noun. The first gap correctly needs a contraction, which may encourage repeating it. Check whether "it is doors" makes sense.
      - text: "Its, its"
        rationale: |
          This uses possession where the first clause needs a verb. The second gap correctly uses possession, so repeating it may seem consistent. Check whether the first clause has a form of "be."
    explanation: |
      The first clause means "it is still closed," so it uses "it's." The doors belong to the archive, so the second gap uses "its."
    approved: true

  - id: q-vocabulary-confusing-words-0008
    type: confusing-words
    difficulty: medium
    stem: |
      Sa "Umiyak nang umiyak ang sanggol hanggang sa makatulog," ano ang ipinapakita ng pag-uulit na may "nang"?
    choices:
      - text: "Continuous crying"
        correct: true
      - text: "Ownership of the crying"
        rationale: |
          This treats the connector as the ownership marker "ng." The two words sound alike, so the roles may seem interchangeable. Check whether the phrase repeats a verb.
      - text: "Time when crying began"
        rationale: |
          This reads "nang" only as a word for "when." That is one of its uses elsewhere. Check whether the construction gives a starting event or repeats an action.
      - text: "Names of those crying"
        rationale: |
          This treats "nang" as a personal-name marker. The sentence names a person doing the action, so the role may seem related. Check whether the word sits before names or between verbs.
    explanation: |
      Repeating "umiyak" with "nang" shows an action that kept happening. The baby cried repeatedly until falling asleep.
    approved: true

  - id: q-vocabulary-confusing-words-0009
    type: confusing-words
    difficulty: medium
    stem: |
      Nagtapos sina Elena at Ricardo kahapon. ______ ay naghahanap na ng trabaho.
    choices:
      - text: "Sila"
        correct: true
      - text: "Sina"
        rationale: |
          This uses a personal-name marker without names after it. Both words refer to several people, so the form may seem right. Check whether names follow the gap.
      - text: "Kina"
        rationale: |
          This uses a recipient or destination marker as the subject pronoun. It is familiar before groups of names. Check whether the gap stands alone for the people.
      - text: "Nina"
        rationale: |
          This uses a marker for a relationship or nonfocus role as the subject pronoun. It also refers to several named people. Check the role of the gap in the new sentence.
    explanation: |
      The second sentence refers back to Elena and Ricardo without repeating their names. "Sila" is the plural pronoun that does this.
    approved: true

  - id: q-vocabulary-confusing-words-0010
    type: confusing-words
    difficulty: medium
    stem: |
      In which sentence does "it's" mean "it has"?
    choices:
      - text: "It's been checked."
        correct: true
      - text: "It's ready for use."
        rationale: |
          This reads "it is" as "it has." The contraction has the same spelling for both meanings. Check the full verb phrase after the contraction.
      - text: "It's missing a seal."
        rationale: |
          This reads an ongoing state as a perfect verb phrase. The -ing form looks like part of a longer verb. Check whether the expansion needs "is" or "has."
      - text: "It's difficult to read."
        rationale: |
          This uses "has" before an adjective. The same contraction can mean "has" elsewhere, so it may look possible. Expand the sentence and check its grammar.
    explanation: |
      "It's been checked" expands to "it has been checked." The word "been" belongs to the verb phrase "has been."
    approved: true

  - id: q-vocabulary-confusing-words-0011
    type: confusing-words
    difficulty: hard
    stem: |
      Sa pormal na Filipino, aling pangungusap ang wastong tumutukoy muna sa mga pangalan at pagkatapos ay gumagamit ng panghalip?
    choices:
      - text: "Dumating sina Liza at Ben. Sila ang mga tagapagsalita."
        correct: true
      - text: "Dumating sila Liza at Ben. Sina ang mga tagapagsalita."
        rationale: |
          This swaps the name marker and the pronoun. Both refer to the same people, so they may seem interchangeable. Check whether personal names follow each form.
      - text: "Dumating kina Liza at Ben. Sila ang mga tagapagsalita."
        rationale: |
          This makes the named people a destination instead of the ones arriving. "Kina" is a familiar marker before names. Check whether the named people perform the action.
      - text: "Dumating sina Liza at Ben. Kina ang mga tagapagsalita."
        rationale: |
          This uses a destination marker where a pronoun must stand alone. "Kina" refers to several people when names follow it. Check whether the second sentence supplies those names.
    explanation: |
      "Sina" marks the names Liza and Ben. "Sila" replaces those names in the next sentence. Each form fits its own role.
    approved: true

  - id: q-vocabulary-confusing-words-0012
    type: confusing-words
    difficulty: hard
    stem: |
      Umalis siya ______ alas-singko ng hapon. Alin ang wastong pananda bago ang tiyak na oras?
    choices:
      - text: "Ng"
        correct: true
      - text: "Nang"
        rationale: |
          This treats a clock-time phrase like a clause introduced by "when." Both describe time, so the choice may look right. Check whether a full event clause or just a clock time follows.
      - text: "Na"
        rationale: |
          This uses a linker before a time expression. "Na" is common between related words. Check whether the gap links a description or marks the time of the action.
      - text: "May"
        rationale: |
          This expresses having something before a clock time. The time may seem like information added to the sentence. Check whether the gap means possession or tells when the person left.
    explanation: |
      "Ng" marks this clock-time expression. The completed phrase is "umalis siya ng alas-singko ng hapon."
    approved: true

  - id: q-vocabulary-confusing-words-0013
    type: confusing-words
    difficulty: medium
    stem: |
      To say that the mediator brought a new agreement into existence, complete the sentence: "The mediator ______ an agreement yesterday."
    choices:
      - text: "Effected"
        correct: true
      - text: "Affected"
        rationale: |
          This means influenced an agreement instead of bringing it about. "Affect" is the more common action word in the pair. Check the exact meaning requested.
      - text: "Effecting"
        rationale: |
          This uses an -ing form without a helping verb. The word expresses the right kind of action, so it may seem close. Check whether the sentence has a complete past-tense verb.
      - text: "Affecting"
        rationale: |
          This uses the influence word and an unfinished verb form. Both the spelling and the ongoing-action ending may seem familiar. Check the requested meaning and the time clue.
    explanation: |
      As a verb, "effect" means bring about. The event happened yesterday, so its past form "effected" fits.
    approved: true

  - id: q-vocabulary-confusing-words-0014
    type: confusing-words
    difficulty: medium
    stem: |
      Ang bahay ______ aking lola ay malapit sa simbahan.
    choices:
      - text: "Ng"
        correct: true
      - text: "Nang"
        rationale: |
          This uses an action-description connector to show ownership. It sounds like "ng," so the spelling can seem interchangeable. Check whether the phrase names an owner.
      - text: "Na"
        rationale: |
          This uses a word linker for an ownership relationship. A noun is followed by more words, so linking may seem needed. Check whether the next phrase describes the house or names its owner.
      - text: "May"
        rationale: |
          This turns ownership into having someone. "May" expresses having, so it can sound related to possession. Check which noun belongs to which person.
    explanation: |
      The house belongs to the grandmother. "Ng" marks that relationship in "bahay ng aking lola."
    approved: true

  - id: q-vocabulary-confusing-words-0015
    type: confusing-words
    difficulty: exam
    stem: |
      Complete the report with the standard forms: "______ been confirmed that the company lost ______ license."
    choices:
      - text: "It's, its"
        correct: true
      - text: "Its, it's"
        rationale: |
          This reverses contraction and possession. The similar spellings may make the pair look interchangeable. Expand the first gap and identify the owner in the second.
      - text: "Its, its"
        rationale: |
          This treats both gaps as possession. A company and its license suggest ownership, so that form may seem suitable throughout. Check whether "been" needs a helping verb.
      - text: "It's, it's"
        rationale: |
          This treats both gaps as contractions. The first gap correctly has "it has," so repeating the form may seem natural. Check whether the second gap comes before an owned noun.
    explanation: |
      "It's been confirmed" means "it has been confirmed." The license belongs to the company, so "its license" expresses possession.
    approved: true

  - id: q-vocabulary-confusing-words-0016
    type: confusing-words
    difficulty: easy
    stem: |
      Bumili siya ______ tatlong mangga sa palengke.
    choices:
      - text: "Ng"
        correct: true
      - text: "Nang"
        rationale: |
          This treats the quantity as a manner description. Buying is an action, so an action connector may seem likely. Check whether the next words name the objects bought.
      - text: "Na"
        rationale: |
          This uses a linker where the object needs a marker. The next phrase contains a number and noun, which may look like linked words. Check the role of the whole phrase after the verb.
      - text: "Ang"
        rationale: |
          This marks the fruit as the focus of an actor-focus verb. The fruit is central to the purchase, so it may seem to deserve that marker. Check the verb form and the role of the noun phrase.
    explanation: |
      "Ng" marks the noun phrase "tatlong mangga," the quantity of fruit bought.
    approved: false

  - id: q-vocabulary-confusing-words-0017
    type: confusing-words
    difficulty: medium
    stem: |
      Sa pangungusap na "Nang dumating ang guro, tumahimik ang klase," alin ang pinakamalapit na kahulugan ng "nang"?
    choices:
      - text: "When"
        correct: true
      - text: "Because"
        rationale: |
          This changes the time link into a cause. A teacher arriving may cause a class to quiet down, so the idea sounds likely. Check what the connector states, not a possible reason outside it.
      - text: "Although"
        rationale: |
          This changes a time link into a contrast. Both clauses describe separate events, which may suggest a contrast. Check whether the wording sets the events against each other.
      - text: "So that"
        rationale: |
          This changes a time link into a purpose. Quieting a class can be a teacher's aim, so that may seem reasonable. Check whether the first clause gives a goal or a time.
    explanation: |
      "Nang" introduces the time when the class became quiet. It means "when" in this sentence.
    approved: false

  - id: q-vocabulary-confusing-words-0018
    type: confusing-words
    difficulty: hard
    stem: |
      Alin ang wastong gamit ng "ng" at "nang" sa pormal na Filipino?
    choices:
      - text: "Sumulat nang maingat ng liham ang bata."
        correct: true
      - text: "Sumulat ng maingat ng liham ang bata."
        rationale: |
          This uses a noun marker before the manner description. The two markers sound alike, so one spelling may seem enough. Check what "maingat" describes.
      - text: "Sumulat nang maingat nang liham ang bata."
        rationale: |
          This uses a manner connector before the letter. Writing is an action, which may suggest using "nang" throughout. Check whether "liham" names an object or a way of acting.
      - text: "Sumulat ng maingat nang liham ang bata."
        rationale: |
          This reverses the markers for manner and object. Both appear beside words linked to writing, so they may seem interchangeable. Check the role of each following word.
    explanation: |
      "Maingat" describes how the child wrote, so it follows "nang." "Liham" names what was written, so it follows "ng."
    approved: false

  - id: q-vocabulary-confusing-words-0019
    type: confusing-words
    difficulty: exam
    stem: |
      Choose the revision that means the reform brought about changes and those changes influenced enrollment.
    choices:
      - text: "The reform effected changes that affected enrollment."
        correct: true
      - text: "The reform affected changes that effected enrollment."
        rationale: |
          This reverses creating and influencing. Both verbs can relate to change, so the swap may sound reasonable. Replace each verb with the meaning requested in the stem.
      - text: "The reform effected changes that effected enrollment."
        rationale: |
          This says the changes brought enrollment into existence. The first verb correctly means brought about, which may encourage repeating it. Check whether enrollment was created or influenced.
      - text: "The reform affected changes that affected enrollment."
        rationale: |
          This says the reform influenced changes instead of creating them. The second verb correctly means influenced, which may encourage using it twice. Check the first action separately.
    explanation: |
      "Effected changes" means brought changes about. "Affected enrollment" means influenced enrollment. Each verb matches the requested meaning.
    approved: false

  - id: q-vocabulary-confusing-words-0020
    type: confusing-words
    difficulty: exam
    stem: |
      Which sentence uses both possessive "its" and a contraction of "it is" correctly?
    choices:
      - text: "The school revised its rules; it's now open."
        correct: true
      - text: "The school revised it's rules; its now open."
        rationale: |
          This swaps possession and contraction. An apostrophe often suggests ownership, so the swap may seem right. Expand the contraction and identify the owned noun.
      - text: "The school revised its' rules; it's now open."
        rationale: |
          This adds an apostrophe after the possessive pronoun. The word ends in -s, so it may be treated like a plural noun. Check whether a pronoun needs that apostrophe.
      - text: "The school revised its rules; its' now open."
        rationale: |
          This uses a possessive-looking form where a clause needs "it is." The final -s may seem to mark a shortened form. Expand the clause before choosing its spelling.
    explanation: |
      "Its rules" shows that the rules belong to the school. "It's now open" expands to "it is now open," so the second clause has a verb.
    approved: false

