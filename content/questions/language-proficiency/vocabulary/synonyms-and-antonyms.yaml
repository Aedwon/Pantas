meta:
  subject: language-proficiency
  topic: vocabulary
  subtopic: synonyms-and-antonyms
  exams: [ upcat, acet, dlsucet, ustet, dost-sei , cse-pro, cse-sub]
questions:
  - id: q-vocabulary-synonyms-and-antonyms-0001
    type: synonym
    difficulty: easy
    stem: |
      Choose the word most similar in meaning to "ephemeral."
    choices:
      - text: Fleeting
        correct: true
      - text: Eternal
        rationale: |
          "Eternal" is nearly the opposite: lasting forever.
      - text: Glowing
        rationale: |
          "Glowing" concerns brightness, not duration.
      - text: Rigid
        rationale: |
          "Rigid" means stiff or inflexible, not short-lived.
    explanation: |
      "Ephemeral" means lasting for a very short time; "fleeting" is the closest synonym.
    approved: true

  - id: q-vocabulary-synonyms-and-antonyms-0002
    type: antonym
    difficulty: easy
    stem: |
      Select the word most nearly opposite in meaning to "mitigate."
    choices:
      - text: Aggravate
        correct: true
      - text: Alleviate
        rationale: |
          "Alleviate" is a close synonym of "mitigate": both can mean lessen severity.
      - text: Placate
        rationale: |
          "Placate" means calm or appease someone and is not the opposite of lessen severity.
      - text: Isolate
        rationale: |
          "Isolate" means separate, not make a problem worse.
    explanation: |
      To mitigate is to make something less severe; to aggravate is to make it worse.
    approved: true

  - id: q-vocabulary-synonyms-and-antonyms-0003
    type: synonym
    difficulty: medium
    stem: |
      Piliin ang pinakawastong kasingkahulugan ng salitang may salungguhit: "*Gumuho* ang kanyang mga pangarap dahil sa sakuna."
    choices:
      - text: Nawasak
        correct: true
      - text: Natupad
        rationale: |
          Ang "natupad" ay kabaligtaran ng pagkawasak ng pangarap.
      - text: Lumakas
        rationale: |
          Hindi paglakas ang ipinahihiwatig ng "gumuho" sa konteksto.
      - text: Lumaki
        rationale: |
          Hindi paglaki ang kahulugan ng matalinghagang "gumuho" rito.
    explanation: |
      Sa matalinghagang gamit na "gumuho ang mga pangarap," ang pinakamalapit na kahulugan ay "nawasak."
    approved: true

  - id: q-vocabulary-synonyms-and-antonyms-0004
    type: antonym
    difficulty: medium
    stem: |
      Alin sa mga sumusunod ang kasalungat ng salitang "maralita"?
    choices:
      - text: Mayaman
        correct: true
      - text: Mahirap
        rationale: |
          Ang "mahirap" ay kasingkahulugan ng "maralita," hindi kasalungat.
      - text: Masipag
        rationale: |
          Ang kasipagan ay ibang katangian at hindi kabaligtaran ng katayuang tinutukoy.
      - text: Tamad
        rationale: |
          Ang "tamad" ay kasalungat ng "masipag," hindi ng "maralita."
    explanation: |
      "Maralita" means poor or impoverished; "mayaman" is the clearest opposite among the choices.
    approved: true

  - id: q-vocabulary-synonyms-and-antonyms-0005
    type: synonym
    difficulty: medium
    stem: |
      The manager's *sycophantic* assistant praised every proposal excessively in hopes of gaining a promotion. Which word best describes "sycophantic" here?
    choices:
      - text: Fawning
        correct: true
      - text: Rebellious
        rationale: |
          Rebellious behavior resists authority; the assistant is doing the opposite.
      - text: Impartial
        rationale: |
          The assistant is trying to gain favor, not showing neutrality.
      - text: Indifferent
        rationale: |
          The assistant is actively flattering the manager, not showing indifference.
    explanation: |
      "Sycophantic" means excessively flattering or servile toward someone powerful in order to gain advantage; "fawning" is the closest choice.
    approved: true

  - id: q-vocabulary-synonyms-and-antonyms-0006
    type: synonym
    difficulty: medium
    stem: |
      Choose the word most similar in meaning to "meticulous."
    choices:
      - text: Precise
        correct: true
      - text: Careless
        rationale: |
          "Careless" is nearly the opposite of meticulous.
      - text: Fast
        rationale: |
          Meticulous describes careful attention, not speed.
      - text: Loud
        rationale: |
          Loudness is unrelated to careful attention to detail.
    explanation: |
      "Meticulous" means extremely careful and attentive to detail; "precise" is the closest choice.
    approved: true

  - id: q-vocabulary-synonyms-and-antonyms-0007
    type: antonym
    difficulty: medium
    stem: |
      Select the word most nearly opposite in meaning to "benevolent."
    choices:
      - text: Malevolent
        correct: true
      - text: Kind
        rationale: |
          "Kind" is a synonym of benevolent.
      - text: Wealthy
        rationale: |
          Wealth concerns financial status, not goodwill toward others.
      - text: Shy
        rationale: |
          Shyness is unrelated to benevolence.
    explanation: |
      Benevolent means well-meaning and kind; malevolent means wishing or causing harm.
    approved: true

  - id: q-vocabulary-synonyms-and-antonyms-0008
    type: synonym
    difficulty: medium
    stem: |
      Alin sa mga sumusunod ang pinakamalapit na kasingkahulugan ng "magiliw"?
    choices:
      - text: Palakaibigan
        correct: true
      - text: Galit
        rationale: |
          Ang "galit" ay hindi kasingkahulugan ng magiliw na pakikitungo.
      - text: Tamad
        rationale: |
          Ang katamaran ay walang tuwirang kaugnayan sa pagiging magiliw.
      - text: Mayabang
        rationale: |
          Ang pagmamayabang ay hindi kahulugan ng "magiliw."
    explanation: |
      "Magiliw" describes warm, affectionate, or friendly behavior; "palakaibigan" is the closest choice in this context.
    approved: true

  - id: q-vocabulary-synonyms-and-antonyms-0009
    type: antonym
    difficulty: medium
    stem: |
      Alin sa mga sumusunod ang kasalungat ng salitang "matapang"?
    choices:
      - text: Duwag
        correct: true
      - text: Malakas
        rationale: |
          Lakas ng katawan is not the opposite of courage.
      - text: Matalino
        rationale: |
          Intelligence is unrelated to the courage contrast.
      - text: Mabait
        rationale: |
          Kindness is not the opposite of bravery.
    explanation: |
      "Matapang" means brave or courageous; "duwag" is the direct opposite among the choices.
    approved: true

  - id: q-vocabulary-synonyms-and-antonyms-0010
    type: antonym
    difficulty: hard
    stem: |
      Select the word most nearly opposite in meaning to "candid."
    choices:
      - text: Deceptive
        correct: true
      - text: Honest
        rationale: |
          "Honest" is close to the meaning of "candid," not its opposite.
      - text: Quiet
        rationale: |
          Quietness concerns amount or volume of speech, not honesty.
      - text: Angry
        rationale: |
          Anger is unrelated to frankness or deception.
    explanation: |
      "Candid" means frank and honest; "deceptive" supplies the clearest opposite.
    approved: true

  - id: q-vocabulary-synonyms-and-antonyms-0011
    type: antonym
    difficulty: medium
    stem: |
      Alin sa mga sumusunod ang kasalungat ng salitang "masaya"?
    choices:
      - text: Malungkot
        correct: true
      - text: Natutuwa
        rationale: |
          "Natutuwa" is close in meaning to "masaya," not its opposite.
      - text: Mabait
        rationale: |
          Kindness is not the opposite emotional state.
      - text: Matalino
        rationale: |
          Intelligence is unrelated to happiness versus sadness.
    explanation: |
      "Malungkot" is the direct opposite of "masaya" among the choices.
    approved: true

  - id: q-vocabulary-synonyms-and-antonyms-0012
    type: synonym
    difficulty: hard
    stem: |
      After the religious ceremony, the monks decided to *fast* for three days, taking no food during the stated fasting periods. What does "fast" mean here?
    choices:
      - text: To abstain from food
        correct: true
      - text: Quick
        rationale: |
          The surrounding sentence concerns food restriction, not speed.
      - text: To run
        rationale: |
          The verb refers to abstaining from food in this context, not moving quickly.
      - text: To sleep
        rationale: |
          Sleep is unrelated to the stated food restriction.
    explanation: |
      "Fast" has several meanings. Here it is a verb meaning to abstain from food for a period, as part of a religious practice.
    approved: true

  - id: q-vocabulary-synonyms-and-antonyms-0013
    type: synonym
    difficulty: medium
    stem: |
      Choose the word most similar in meaning to "audacious."
    choices:
      - text: Daring
        correct: true
      - text: Fearful
        rationale: |
          Fearful is nearly the opposite of audacious.
      - text: Quiet
        rationale: |
          Quietness does not express bold willingness to take risks.
      - text: Generous
        rationale: |
          Generosity concerns giving, not boldness.
    explanation: |
      "Audacious" means boldly daring or willing to take risks.
    approved: true

  - id: q-vocabulary-synonyms-and-antonyms-0014
    type: antonym
    difficulty: medium
    stem: |
      Select the word most nearly opposite in meaning to "abundant."
    choices:
      - text: Scarce
        correct: true
      - text: Plentiful
        rationale: |
          "Plentiful" is a synonym of abundant.
      - text: Heavy
        rationale: |
          Weight is not the relevant contrast in quantity.
      - text: Fast
        rationale: |
          Speed is unrelated to abundance.
    explanation: |
      Abundant means plentiful; scarce means in short supply.
    approved: true

  - id: q-vocabulary-synonyms-and-antonyms-0015
    type: synonym
    difficulty: medium
    stem: |
      Alin sa mga sumusunod ang pinakamalapit na kasingkahulugan ng "matiyaga" sa pangungusap na "Matiyaga siyang nagpraktis araw-araw hanggang matutuhan niya ang piyesa"?
    choices:
      - text: Masikap
        correct: true
      - text: Tamad
        rationale: |
          Ang "tamad" ay kabaligtaran ng patuloy na pagsisikap na inilalarawan.
      - text: Mayabang
        rationale: |
          Ang pagmamayabang ay walang kaugnayan sa matiyagang pagsasanay.
      - text: Padalos-dalos
        rationale: |
          Ang pagiging padalos-dalos ay hindi tumutukoy sa tuloy-tuloy at masikap na paggawa.
    explanation: |
      Sa kontekstong paulit-ulit na pagsasanay hanggang matutuhan ang piyesa, "masikap" ang pinakamalapit na kahulugan ng "matiyaga" sa mga pagpipilian.
    approved: true

  - id: q-vocabulary-synonyms-and-antonyms-0016
    type: antonym
    difficulty: medium
    stem: |
      Alin sa mga sumusunod ang pinakamalapit na kasalungat ng "matapat" sa kahulugang tapat at hindi mapanlinlang?
    choices:
      - text: Mapanlinlang
        correct: true
      - text: Tapat
        rationale: |
          "Tapat" is a synonym, not an antonym.
      - text: Masipag
        rationale: |
          Diligence is unrelated to honesty versus deceit.
      - text: Matalino
        rationale: |
          Intelligence is unrelated to honesty versus deceit.
    explanation: |
      In the sense of honest or faithful to the truth, "mapanlinlang" is the clearest opposite of "matapat."
    approved: true

  - id: q-vocabulary-synonyms-and-antonyms-0017
    type: antonym
    difficulty: hard
    stem: |
      Select the word most nearly opposite in meaning to "humble."
    choices:
      - text: Arrogant
        correct: true
      - text: Modest
        rationale: |
          "Modest" is close in meaning to humble.
      - text: Unassuming
        rationale: |
          "Unassuming" is close in meaning to humble.
      - text: Meek
        rationale: |
          "Meek" can overlap with humble and is not the opposite being sought.
    explanation: |
      "Arrogant" is the clearest antonym because it describes an inflated sense of one's importance.
    approved: true

  - id: q-vocabulary-synonyms-and-antonyms-0018
    type: synonym
    difficulty: exam
    stem: |
      First identify the antonym of "diligent." Then choose the word among the options that is most similar in meaning to that antonym.
    choices:
      - text: Indolent
        correct: true
      - text: Hardworking
        rationale: |
          "Hardworking" is a synonym of diligent.
      - text: Careful
        rationale: |
          Carefulness is associated with diligent work but is not its opposite.
      - text: Happy
        rationale: |
          Happiness is unrelated to willingness to work.
    explanation: |
      The antonym of diligent is lazy; "indolent" means habitually lazy or avoiding work.
    approved: true
