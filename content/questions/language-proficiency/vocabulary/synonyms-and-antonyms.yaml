meta:
  subject: language-proficiency
  topic: vocabulary
  subtopic: synonyms-and-antonyms
  exams: [ upcat, acet, dlsucet, ustet, dost-sei , cse-pro, cse-sub]
questions:
  - id: q-vocabulary-synonyms-and-antonyms-0001
    lesson: lesson-vocabulary-similar-and-opposite-meanings
    keyPoint: 1
    type: synonym
    difficulty: easy
    stem: |
      Choose the word most similar in meaning to "ephemeral."
    choices:
      - text: "Fleeting"
        correct: true
      - text: "Enduring"
        rationale: |
          This chooses lasting for a long time instead of a short time. Both describe duration. Check whether the question asks for a synonym or an opposite.
      - text: "Recurring"
        rationale: |
          This confuses a short duration with repeated appearances. A brief event can happen again. Check whether the word describes how long something lasts or how often it returns.
      - text: "Intermittent"
        rationale: |
          This confuses brief existence with stopping and starting. Both can suggest something not continuous. Check whether the meaning concerns total duration or gaps.
    explanation: |
      "Ephemeral" means lasting a very short time. "Fleeting" has the same short-lived meaning.
    approved: true

  - id: q-vocabulary-synonyms-and-antonyms-0002
    lesson: lesson-vocabulary-similar-and-opposite-meanings
    keyPoint: 2
    type: antonym
    difficulty: easy
    stem: |
      Select the word most nearly opposite in meaning to "mitigate."
    choices:
      - text: "Aggravate"
        correct: true
      - text: "Alleviate"
        rationale: |
          This selects a synonym instead of an opposite. Both words describe reducing a problem. Check whether the question asks for lessening or worsening.
      - text: "Placate"
        rationale: |
          This confuses calming a person with worsening a problem. A person can be upset by a problem. Check the action described by the target word.
      - text: "Eliminate"
        rationale: |
          This treats complete removal as the opposite of partial reduction. The degree differs, which can seem like a contrast. Check whether both actions still move toward less of the problem.
    explanation: |
      "Mitigate" means make less severe. Its opposite, "aggravate," means make more severe.
    approved: true

  - id: q-vocabulary-synonyms-and-antonyms-0003
    lesson: lesson-vocabulary-kasingkahulugan-at-kasalungat
    keyPoint: 1
    type: synonym
    difficulty: medium
    stem: |
      Piliin ang pinakamalapit na kahulugan ng "gumuho" sa pangungusap: "Gumuho ang kanyang mga pangarap dahil sa sakuna."
    choices:
      - text: "Nawasak"
        correct: true
      - text: "Natupad"
        rationale: |
          Binabaligtad nito ang pagkawasak tungo sa pagkatupad. Parehong tungkol sa kinahinatnan ng pangarap. Tingnan ang epekto ng sakuna.
      - text: "Naantala"
        rationale: |
          Pinahihina nito ang pagkawasak tungo sa pagkaantala lamang. Maaaring maantala ang plano dahil sa sakuna. Tingnan kung paghihintay o pagkawala ng pangarap ang ibig sabihin.
      - text: "Nabago"
        rationale: |
          Pinahihina nito ang pagkawasak tungo sa anumang pagbabago. Maaaring magbago ang plano dahil sa sakuna. Tingnan kung gaano katindi ang "gumuho."
    explanation: |
      Gumuho ang mga pangarap dahil sa sakuna. Ang "nawasak" ang katugma ng matalinghagang kahulugang ito.
    approved: true

  - id: q-vocabulary-synonyms-and-antonyms-0004
    lesson: lesson-vocabulary-kasingkahulugan-at-kasalungat
    keyPoint: 2
    type: antonym
    difficulty: medium
    stem: |
      Alin sa mga sumusunod ang kasalungat ng salitang "maralita"?
    choices:
      - text: "Mayaman"
        correct: true
      - text: "Mahirap"
        rationale: |
          Parehong kalagayan sa pera ang pinili nito. Parehong tumutukoy sa kahirapan ang dalawang salita. Tingnan kung kasalungat ang hinihingi.
      - text: "Matipid"
        rationale: |
          Napagpapalit nito ang yaman at ugali sa paggastos. Maaaring maingat gumastos ang taong kapos. Tingnan kung ari-arian o ugali ang inilalarawan.
      - text: "Mapagbigay"
        rationale: |
          Napagpapalit nito ang yaman at pagbibigay sa iba. Maaaring isipin na may pera ang nagbibigay. Tingnan kung kalagayan sa pera o pagkabukas-palad ang tinutukoy.
    explanation: |
      Kapos sa pera ang "maralita." Maraming yaman ang "mayaman," kaya magkasalungat ang kanilang kalagayan sa pera.
    approved: true

  - id: q-vocabulary-synonyms-and-antonyms-0005
    lesson: lesson-vocabulary-meaning-and-grammar-in-context
    keyPoint: 1
    type: synonym
    difficulty: medium
    stem: |
      The manager's *sycophantic* assistant praised every proposal excessively in hopes of gaining a promotion. Which word best describes "sycophantic" here?
    choices:
      - text: "Fawning"
        correct: true
      - text: "Rebellious"
        rationale: |
          This treats an attempt to gain favor as resistance. The assistant has a personal goal, which may suggest acting independently. Check whether the behavior challenges or pleases the manager.
      - text: "Impartial"
        rationale: |
          This treats agreement as fair judgment. Praising every proposal may sound approving. Check the motive of gaining a promotion.
      - text: "Indifferent"
        rationale: |
          This treats flattery as lack of concern. The praise may not be sincere. Check whether the assistant actively seeks an advantage.
    explanation: |
      The assistant uses excessive praise to gain favor. "Sycophantic" and "fawning" both describe that behavior.
    approved: true

  - id: q-vocabulary-synonyms-and-antonyms-0006
    lesson: lesson-vocabulary-meaning-and-grammar-in-context
    keyPoint: 1
    type: synonym
    difficulty: medium
    stem: |
      An editor was meticulous about checking every date and quotation. Which word is closest in meaning to "meticulous" here?
    choices:
      - text: "Thorough"
        correct: true
      - text: "Careless"
        rationale: |
          This reverses careful attention into neglect. Both concern how work is handled. Check whether details are checked or ignored.
      - text: "Hurried"
        rationale: |
          This confuses efficient checking with rushing. Skilled work can be quick. Check whether the word describes speed or attention.
      - text: "Distracted"
        rationale: |
          This confuses noticing many details with scattered attention. Many details can divide attention. Check whether the editor checks them carefully.
    explanation: |
      The editor checks every detail. "Meticulous" means very careful and thorough about details.
    approved: true

  - id: q-vocabulary-synonyms-and-antonyms-0007
    lesson: lesson-vocabulary-similar-and-opposite-meanings
    keyPoint: 2
    type: antonym
    difficulty: medium
    stem: |
      The report called the error's effect "benign," meaning it caused no harm. Which word is most nearly opposite to "benign" in this sense?
    choices:
      - text: "Harmful"
        correct: true
      - text: "Harmless"
        rationale: |
          This gives the same meaning instead of the opposite. Both words describe absence of harm. Check whether the question asks for a synonym or antonym.
      - text: "Trivial"
        rationale: |
          This confuses small importance with absence of harm. A minor error may also be harmless. Check which quality the sentence assigns to the effect.
      - text: "Unintended"
        rationale: |
          This confuses harmless results with lack of intention. An accidental action can have little effect. Check whether the word describes the result or the motive.
    explanation: |
      "Benign" describes an effect that is not harmful here. The opposite is "harmful," meaning capable of causing damage.
    approved: true

  - id: q-vocabulary-synonyms-and-antonyms-0008
    lesson: lesson-vocabulary-kasingkahulugan-at-kasalungat
    keyPoint: 1
    type: synonym
    difficulty: medium
    stem: |
      "Magiliw ang bagong kapitbahay: ngumiti siya at masayang binati ang mga taong nakasalubong niya." Alin ang pinakamalapit na kasingkahulugan ng "magiliw" dito?
    choices:
      - text: "Palakaibigan"
        correct: true
      - text: "Mapagpakitang-tao"
        rationale: |
          Itinuturing nitong pagpapanggap ang magiliw na kilos. Maaaring gamitin ang pagbati upang magpasikat. Tingnan kung may patunay ng pagpapanggap.
      - text: "Mapag-utos"
        rationale: |
          Itinuturing nitong pag-uutos ang pakikitungo sa tao. Pareho silang may pakikipag-usap. Tingnan kung bumabati o nag-uutos ang kapitbahay.
      - text: "Mapagmataas"
        rationale: |
          Itinuturing nitong pagmamataas ang masiglang pagbati. Maaaring mukhang may tiwala sa sarili ang taong palakaibigan. Tingnan kung kabaitan o kayabangan ang ipinapakita.
    explanation: |
      Ngumingiti at masayang bumabati ang kapitbahay. Maganda ang pakikitungo niya sa iba. Kaya "palakaibigan" ang katugma ng "magiliw" rito.
    approved: true

  - id: q-vocabulary-synonyms-and-antonyms-0009
    lesson: lesson-vocabulary-kasingkahulugan-at-kasalungat
    keyPoint: 2
    type: antonym
    difficulty: medium
    stem: |
      Alin ang pinakamalapit na kasalungat ng "matapang" sa kahulugang may lakas ng loob sa harap ng panganib?
    choices:
      - text: "Duwag"
        correct: true
      - text: "Malakas"
        rationale: |
          Napagpapalit nito ang tapang at lakas ng katawan. Maaaring mukhang kayang humarap sa panganib ang malakas. Tingnan kung lakas o pagharap sa takot ang tinutukoy.
      - text: "Maingat"
        rationale: |
          Napagpapalit nito ang pag-iingat at kawalan ng tapang. Maaaring maging maingat ang matapang. Tingnan kung takot o pagpaplano ang usapan.
      - text: "Padalos-dalos"
        rationale: |
          Itinuturing nitong kawalan ng ingat ang tapang. Parehong maaaring may pagsuong sa panganib. Tingnan kung kasalungat ng tapang ang hinihingi.
    explanation: |
      May lakas ng loob sa panganib ang "matapang." Kulang sa ganitong tapang ang "duwag," kaya ito ang kasalungat.
    approved: true

  - id: q-vocabulary-synonyms-and-antonyms-0010
    lesson: lesson-vocabulary-similar-and-opposite-meanings
    keyPoint: 2
    type: antonym
    difficulty: hard
    stem: |
      Select the word most nearly opposite to "candid" in the sense of honest and open.
    choices:
      - text: "Deceptive"
        correct: true
      - text: "Forthright"
        rationale: |
          This chooses a synonym for frank honesty. A less familiar word may seem to offer a contrast. Check the meaning of "forthright."
      - text: "Diplomatic"
        rationale: |
          This treats tact as dishonesty. A tactful person may speak gently. Check whether gentle wording necessarily changes the truth.
      - text: "Blunt"
        rationale: |
          This treats a harsh manner as the opposite of honesty. Blunt speech can be unpleasant. Check whether the contrast is about truth or tone.
    explanation: |
      "Candid" means honest and open in this sense. "Deceptive" means misleading others, so it opposes honesty.
    approved: true

  - id: q-vocabulary-synonyms-and-antonyms-0011
    lesson: lesson-vocabulary-kasingkahulugan-at-kasalungat
    keyPoint: 2
    type: antonym
    difficulty: medium
    stem: |
      Alin sa mga sumusunod ang kasalungat ng salitang "masaya"?
    choices:
      - text: "Malungkot"
        correct: true
      - text: "Nasisiyahan"
        rationale: |
          Katulad na magandang damdamin ang pinili nito. Parehong may tuwa o kasiyahan ang dalawang salita. Tingnan kung kasalungat ang hinihingi.
      - text: "Nasasabik"
        rationale: |
          Itinuturing nitong kasalungat na damdamin ang pananabik. Maaaring iba ito sa payapang saya. Tingnan kung lungkot talaga ang kahulugan.
      - text: "Nababahala"
        rationale: |
          Itinuturing nitong tiyak na kasalungat ng saya ang anumang hindi magandang damdamin. Hindi maganda ang pag-aalala. Tingnan kung lungkot o pag-aalala sa panganib ang ibig sabihin.
    explanation: |
      May tuwa ang "masaya." May lungkot ang "malungkot," kaya magkasalungat ang mga damdaming ito.
    approved: true

  - id: q-vocabulary-synonyms-and-antonyms-0012
    lesson: lesson-vocabulary-meaning-and-grammar-in-context
    keyPoint: 1
    type: synonym
    difficulty: hard
    stem: |
      After the religious ceremony, the monks decided to *fast* for three days, taking no food during the stated fasting periods. What does "fast" mean here?
    choices:
      - text: "To avoid eating"
        correct: true
      - text: "To eat less than usual"
        rationale: |
          This weakens abstaining into reducing the amount. A religious practice may involve dietary limits. Check the phrase "taking no food."
      - text: "To finish a task quickly"
        rationale: |
          This uses the speed meaning. "Fast" commonly describes quick action. Check the sentence's reference to food.
      - text: "To hold firmly in place"
        rationale: |
          This uses the firmly-fixed meaning. "Fast" can appear in the expression "hold fast." Check which meaning fits the monks' action.
    explanation: |
      Here "fast" is a verb meaning go without food for the stated periods. "To avoid eating" matches that sense.
    approved: true

  - id: q-vocabulary-synonyms-and-antonyms-0013
    lesson: lesson-vocabulary-similar-and-opposite-meanings
    keyPoint: 1
    type: synonym
    difficulty: medium
    stem: |
      Choose the word most similar in meaning to "audacious."
    choices:
      - text: "Daring"
        correct: true
      - text: "Cautious"
        rationale: |
          This chooses caution instead of bold risk-taking. Both can concern difficult decisions. Check whether the target emphasizes avoiding or facing risk.
      - text: "Conventional"
        rationale: |
          This chooses adherence to accepted ways instead of a bold departure. Both can describe an approach. Check whether the word emphasizes tradition or boldness.
      - text: "Ambitious"
        rationale: |
          This confuses a strong desire to succeed with willingness to take risks. Ambitious people may act boldly. Check whether the meaning is about a goal or an approach.
    explanation: |
      "Audacious" means boldly willing to take risks. "Daring" expresses that boldness.
    approved: true

  - id: q-vocabulary-synonyms-and-antonyms-0014
    lesson: lesson-vocabulary-similar-and-opposite-meanings
    keyPoint: 2
    type: antonym
    difficulty: medium
    stem: |
      Select the word most nearly opposite in meaning to "abundant."
    choices:
      - text: "Scarce"
        correct: true
      - text: "Plentiful"
        rationale: |
          This chooses the same quantity meaning instead of the opposite. Both words describe a large supply. Check whether the question asks for an antonym.
      - text: "Expensive"
        rationale: |
          This treats a possible consequence of scarcity as its meaning. Limited goods can cost more. Check whether the target concerns amount or price.
      - text: "Concentrated"
        rationale: |
          This confuses total amount with density. A concentrated substance can seem like a large amount. Check whether the contrast is about supply or distribution.
    explanation: |
      "Abundant" means present in large amounts. "Scarce" means in short supply, so it is the opposite.
    approved: true

  - id: q-vocabulary-synonyms-and-antonyms-0015
    lesson: lesson-vocabulary-kasingkahulugan-at-kasalungat
    keyPoint: 1
    type: synonym
    difficulty: medium
    stem: |
      Alin sa mga sumusunod ang pinakamalapit na kasingkahulugan ng "matiyaga" sa pangungusap na "Matiyaga siyang nagpraktis araw-araw hanggang matutuhan niya ang piyesa"?
    choices:
      - text: "Masikap"
        correct: true
      - text: "Tamad"
        rationale: |
          Binabaligtad nito ang patuloy na pagsisikap tungo sa pag-iwas sa gawain. Pareho silang ugali sa paggawa. Tingnan ang araw-araw na pagsasanay.
      - text: "Mahusay"
        rationale: |
          Napagpapalit nito ang pagsisikap at kasanayan. Maaaring humantong sa husay ang pagsasanay. Tingnan kung patuloy na pagsubok o pagiging mahusay na ang inilalarawan.
      - text: "Padalos-dalos"
        rationale: |
          Napagpapalit nito ang paulit-ulit na pagsisikap at pagmamadali. Maaaring maraming kilos sa madalas na pagsasanay. Tingnan kung tuloy-tuloy o walang ingat ang paggawa.
    explanation: |
      Araw-araw siyang nagsasanay hanggang matutuhan ang piyesa. Patuloy ang pagsisikap niya. Kaya "masikap" ang pinakamalapit sa "matiyaga" rito.
    approved: true

  - id: q-vocabulary-synonyms-and-antonyms-0016
    lesson: lesson-vocabulary-kasingkahulugan-at-kasalungat
    keyPoint: 2
    type: antonym
    difficulty: medium
    stem: |
      Alin sa mga sumusunod ang pinakamalapit na kasalungat ng "matapat" sa kahulugang tapat at hindi mapanlinlang?
    choices:
      - text: "Mapanlinlang"
        correct: true
      - text: "Mapagkakatiwalaan"
        rationale: |
          Pagiging mapagkakatiwalaan ang pinili nito sa halip na panlilinlang. Mapagkakatiwalaan ang matapat na tao. Tingnan kung katulad o kasalungat ang hinihingi.
      - text: "Mapagkimkim"
        rationale: |
          Napagpapalit nito ang pagtatago ng damdamin at pagsisinungaling. Maaaring mukhang hindi bukas ang tahimik na tao. Tingnan kung damdamin ang kinikimkim o may panlilinlang.
      - text: "Mapagsalita"
        rationale: |
          Napagpapalit nito ang dami ng pagsasalita at katotohanan ng sinasabi. Maaaring maraming impormasyong sabihin ang madaldal. Tingnan kung dami o katapatan ang usapan.
    explanation: |
      Sa kahulugang ibinigay, hindi nandaraya ang "matapat." Nandaraya ang "mapanlinlang," kaya ito ang kasalungat.
    approved: true

  - id: q-vocabulary-synonyms-and-antonyms-0017
    lesson: lesson-vocabulary-similar-and-opposite-meanings
    keyPoint: 2
    type: antonym
    difficulty: hard
    stem: |
      Select the word most nearly opposite to "humble" in the sense of modest about one's importance.
    choices:
      - text: "Arrogant"
        correct: true
      - text: "Modest"
        rationale: |
          This chooses a similar lack of excessive pride. Modest and humble often overlap. Check whether the word increases or reduces self-importance.
      - text: "Unassuming"
        rationale: |
          This chooses a similar quiet view of one's importance. "Unassuming" may be less familiar. Check its meaning before treating it as an opposite.
      - text: "Meek"
        rationale: |
          This chooses a gentle or submissive manner instead of pride. Such a manner can overlap with humility. Check the axis of contrast stated in the stem.
    explanation: |
      "Humble" means not overstating one's importance here. "Arrogant" means having an inflated view of one's importance, so it is the opposite.
    approved: true

  - id: q-vocabulary-synonyms-and-antonyms-0018
    lesson: lesson-vocabulary-similar-and-opposite-meanings
    keyPoint: 2
    type: synonym
    difficulty: exam
    stem: |
      First identify the antonym of "diligent." Then choose the word among the options that is most similar in meaning to that antonym.
    choices:
      - text: "Indolent"
        correct: true
      - text: "Hardworking"
        rationale: |
          This selects the starting word's meaning instead of its opposite. "Diligent" directly suggests hard work. Check both steps requested in the stem.
      - text: "Careful"
        rationale: |
          This selects a trait associated with diligence. Careful work can show diligence. Check whether it is actually the opposite of steady effort.
      - text: "Impatient"
        rationale: |
          This confuses unwillingness to wait with unwillingness to work. Both can describe an unhelpful attitude. Check which behavior the target word concerns.
    explanation: |
      "Diligent" means steadily hardworking. Its opposite is lazy. "Indolent" means habitually lazy, so it matches that opposite.
    approved: true

  - id: q-vocabulary-synonyms-and-antonyms-0019
    lesson: lesson-vocabulary-feeling-strength-and-formality
    keyPoint: 1
    type: synonym
    difficulty: hard
    stem: |
      Choose the word that preserves the approving tone: "Her careful spending left enough money for essentials and for helping neighbors." She was ______.
    choices:
      - text: "Frugal"
        correct: true
      - text: "Stingy"
        rationale: |
          This adds a negative idea of refusing to spend or share. Both words concern keeping money. Check the sentence's approving tone and help for neighbors.
      - text: "Miserly"
        rationale: |
          This adds excessive unwillingness to part with money. It can sound like careful saving. Check whether the person gives needed help willingly.
      - text: "Extravagant"
        rationale: |
          This reverses careful spending into excessive spending. The person gives help to others, which may suggest spending freely. Check whether generosity removes the stated care with money.
    explanation: |
      "Frugal" describes sensible care with money. It keeps the approving tone of spending wisely while still meeting others' needs.
    approved: true

  - id: q-vocabulary-synonyms-and-antonyms-0020
    lesson: lesson-vocabulary-opposite-roles
    keyPoint: 1
    type: word-analogy
    difficulty: exam
    stem: |
      Complete the relationship, keeping the opposite participant's role in the same transaction: Buy is to sell as borrow is to ______.
    choices:
      - text: "Lend"
        correct: true
      - text: "Return"
        rationale: |
          This changes the participant role into a later action. A borrowed item is usually returned. Check whether the relation concerns the same exchange or what happens afterward.
      - text: "Repay"
        rationale: |
          This changes the participant role into settling an obligation. Borrowed money may be repaid. Check who supplies the item during the original transaction.
      - text: "Rent"
        rationale: |
          This selects another way of receiving temporary use. Renting resembles borrowing. Check whether the second word names the other participant's role.
    explanation: |
      Buying and selling describe the two sides of one exchange. In the same way, one person borrows what another person lends. "Lend" names the other side of borrowing.
    approved: true


  - id: q-vocabulary-synonyms-and-antonyms-0021
    approved: true
    lesson: lesson-vocabulary-feeling-strength-and-formality
    keyPoint: 2
    type: synonym
    difficulty: exam
    stem: |
      The clerk was **annoyed** by a minor interruption but resumed work calmly. Which replacement for the word in bold preserves its intensity?
    choices:
      - text: "bothered"
        correct: true
      - text: "enraged"
        rationale: |
          This makes mild anger much stronger. The calm return to work may be missed. Check how strong the feeling is.
      - text: "furious"
        rationale: |
          This also means very angry. A delay can cause anger, but check whether the sentence shows a strong outburst.
      - text: "delighted"
        rationale: |
          This changes displeasure into pleasure. Returning calmly does not mean enjoying the interruption. Check the feeling first.
    explanation: |
      Annoyed means bothered or a little angry. Bothered keeps that mild strength and fits the calm return to work.

  - id: q-vocabulary-synonyms-and-antonyms-0022
    approved: true
    lesson: lesson-vocabulary-feeling-strength-and-formality
    keyPoint: 3
    type: synonym
    difficulty: exam
    stem: |
      An office must replace the casual phrase in this public notice: "Processing will **kick off** after the briefing." Which replacement for the words in bold best suits the formal notice?
    choices:
      - text: "commence"
        correct: true
      - text: "get going"
        rationale: |
          This keeps a casual tone. It means begin, but check whether the wording suits an official notice.
      - text: "fire up"
        rationale: |
          This uses another casual expression. A public notice needs formal wording for beginning the work.
      - text: "kick things off"
        rationale: |
          This changes the wording but keeps the casual phrase. Check the setting as well as the meaning.
    explanation: |
      Commence means begin and is formal. "Processing will commence after the briefing" keeps the meaning and suits the notice.

  - id: q-vocabulary-synonyms-and-antonyms-0023
    approved: true
    lesson: lesson-vocabulary-meaning-and-grammar-in-context
    keyPoint: 2
    type: synonym
    difficulty: exam
    stem: |
      Choose the replacement for the word in bold that preserves both meaning and grammar: "The panel must **decide** before releasing its report."
    choices:
      - text: "choose"
        correct: true
      - text: "decision"
        rationale: |
          This names the result of deciding. It shares a root with decide, but the sentence needs an action after must.
      - text: "decisive"
        rationale: |
          This describes someone or something. The shared root can look right. Check that must is followed by a verb.
      - text: "choice"
        rationale: |
          This names a choice instead of expressing the action. Check the job needed after must.
    explanation: |
      The sentence needs a verb after must. Choose names the action of making a choice, so it preserves the meaning of decide.

  - id: q-vocabulary-synonyms-and-antonyms-0024
    approved: true
    lesson: lesson-vocabulary-opposite-roles
    keyPoint: 1
    type: word-analogy
    difficulty: exam
    stem: |
      The office bought a used printer from a supplier. Which statement describes the same transaction from the supplier's role?
    choices:
      - text: "The supplier sold the printer."
        correct: true
      - text: "The supplier bought the printer."
        rationale: |
          This gives the supplier the buyer's role. Both parties take part in the exchange. Check who received the printer.
      - text: "The supplier lent the printer."
        rationale: |
          This changes a sale into a loan. Both can transfer an item, but check whether the office bought it.
      - text: "The supplier returned the printer."
        rationale: |
          This changes a sale into a return. An item changes hands in both cases. Check the stated transaction.
    explanation: |
      Buying and selling describe opposite roles in the same exchange. The office bought the printer, so the supplier sold it.

  - id: q-vocabulary-synonyms-and-antonyms-0025
    approved: true
    lesson: lesson-vocabulary-opposites-with-levels-and-two-states
    keyPoint: 1
    type: antonym
    difficulty: exam
    stem: |
      A service log permits only the labels "available" and "unavailable." A terminal is recorded as not available. Which label must it receive under this system?
    choices:
      - text: "unavailable"
        correct: true
      - text: "temporarily available"
        rationale: |
          This adds a time limit that the log does not offer. Check the labels the system permits.
      - text: "partially available"
        rationale: |
          This invents a middle state. Some systems allow levels, but this log allows only the stated labels.
      - text: "usually available"
        rationale: |
          This substitutes a usual condition for the recorded state. Check the current record and its allowed labels.
    explanation: |
      The log allows only available or unavailable. Ruling out available leaves unavailable.

  - id: q-vocabulary-synonyms-and-antonyms-0026
    approved: true
    lesson: lesson-vocabulary-opposites-with-levels-and-two-states
    keyPoint: 1
    type: antonym
    difficulty: exam
    stem: |
      A reviewer says only, "The water is not hot." Which conclusion is justified by the meaning of this statement?
    choices:
      - text: "It may be warm."
        correct: true
      - text: "It must be cold."
        rationale: |
          This treats hot and cold as the only possible states. Check whether a middle level is possible.
      - text: "It cannot be warm."
        rationale: |
          This rules out a middle level without evidence. Warm water can be not hot. Check the range of meanings.
      - text: "It must be freezing."
        rationale: |
          This turns the denial of heat into extreme cold. Check whether the statement gives that level of detail.
    explanation: |
      Hot and cold have middle levels, including warm. The statement leaves warm as a possible condition.

  - id: q-vocabulary-synonyms-and-antonyms-0027
    approved: true
    lesson: lesson-vocabulary-prefix-clues-in-context
    keyPoint: 1
    type: synonym
    difficulty: exam
    stem: |
      The selection was **unfair** because a favored applicant received extra help. Using the prefix and context, which phrase best gives the meaning of the word in bold?
    choices:
      - text: "not fair"
        correct: true
      - text: "not finished"
        rationale: |
          This applies a negative meaning to the wrong base. Extra help shows unequal treatment, not unfinished work. Check fair in context.
      - text: "not clear"
        rationale: |
          This confuses unequal treatment with unclear instructions. Check what the extra help reveals about fairness.
      - text: "not needed"
        rationale: |
          This confuses a biased process with an unnecessary one. Check the base fair and the favored applicant.
    explanation: |
      The prefix un- means not here. Fair is the base. Extra help for a favored applicant confirms the meaning not fair.

  - id: q-vocabulary-synonyms-and-antonyms-0028
    approved: true
    lesson: lesson-vocabulary-prefix-clues-in-context
    keyPoint: 1
    type: synonym
    difficulty: exam
    stem: |
      A reader claims that **uncle** must mean "not cle" because **unfair** means "not fair." Which statement correctly evaluates this claim?
    choices:
      - text: "Uncle has no base cle."
        correct: true
      - text: "Every initial un means not."
        rationale: |
          This extends the prefix rule to every matching beginning. Unfair can be split meaningfully. Check whether the other word has a real base.
      - text: "Matching letters prove a prefix."
        rationale: |
          This treats the look of the letters as proof. A familiar beginning can be part of a whole word. Check the base and meaning.
      - text: "Context never matters for prefixes."
        rationale: |
          This ignores the check that makes a prefix clue useful. The clue must fit the whole word in its sentence.
    explanation: |
      Uncle cannot be explained as un- plus a base cle. A prefix clue works only when it is a real word part with a meaning that fits.

  - id: q-vocabulary-synonyms-and-antonyms-0029
    approved: true
    lesson: lesson-vocabulary-similar-and-opposite-meanings
    keyPoint: 3
    type: synonym
    difficulty: exam
    stem: |
      An editor must replace the unnatural word pairing in "The road closed during **strong rain**." Which replacement for the words in bold uses the standard pairing without changing the intended weather condition?
    choices:
      - text: "heavy rain"
        correct: true
      - text: "powerful rain"
        rationale: |
          This treats a word with a similar idea of strength as freely interchangeable. Check which adjective commonly pairs with rain.
      - text: "muscular rain"
        rationale: |
          This uses physical strength to describe rain. Check the established word pairing instead of the general idea of force.
      - text: "strong rainfall"
        rationale: |
          This keeps strong while changing the noun. Check the natural pairing taught for rain.
    explanation: |
      Heavy rain is the common English word pairing for rain falling with great force or in a large amount. It fits the road closure.
