meta:
  subject: language-proficiency
  topic: vocabulary
  subtopic: synonyms-and-antonyms
  exams: [ upcat, acet, dlsucet, ustet, dost-sei , cse-pro, cse-sub]
questions:
  - id: q-vocabulary-synonyms-and-antonyms-0001
    type: synonym
    difficulty: easy
    stem: |
      Choose the word most similar in meaning to "ephemeral."
    choices:
      - text: "Fleeting"
        correct: true
      - text: "Enduring"
        rationale: |
          This chooses lasting for a long time instead of a short time. Both describe duration. Check whether the question asks for a synonym or an opposite.
      - text: "Recurring"
        rationale: |
          This confuses a short duration with repeated appearances. A brief event can happen again. Check whether the word describes how long something lasts or how often it returns.
      - text: "Intermittent"
        rationale: |
          This confuses brief existence with stopping and starting. Both can suggest something not continuous. Check whether the meaning concerns total duration or gaps.
    explanation: |
      "Ephemeral" means lasting a very short time. "Fleeting" has the same short-lived meaning.
    approved: true

  - id: q-vocabulary-synonyms-and-antonyms-0002
    type: antonym
    difficulty: easy
    stem: |
      Select the word most nearly opposite in meaning to "mitigate."
    choices:
      - text: "Aggravate"
        correct: true
      - text: "Alleviate"
        rationale: |
          This selects a synonym instead of an opposite. Both words describe reducing a problem. Check whether the question asks for lessening or worsening.
      - text: "Placate"
        rationale: |
          This confuses calming a person with worsening a problem. A person can be upset by a problem. Check the action described by the target word.
      - text: "Eliminate"
        rationale: |
          This treats complete removal as the opposite of partial reduction. The degree differs, which can seem like a contrast. Check whether both actions still move toward less of the problem.
    explanation: |
      "Mitigate" means make less severe. Its opposite, "aggravate," means make more severe.
    approved: true

  - id: q-vocabulary-synonyms-and-antonyms-0003
    type: synonym
    difficulty: medium
    stem: |
      Piliin ang pinakamalapit na kahulugan ng "gumuho" sa pangungusap: "Gumuho ang kanyang mga pangarap dahil sa sakuna."
    choices:
      - text: "Nawasak"
        correct: true
      - text: "Natupad"
        rationale: |
          This reverses ruin into fulfillment. Both concern the fate of a dream. Check the effect of the disaster in the sentence.
      - text: "Naantala"
        rationale: |
          This weakens collapse into a delay. A disaster can postpone a plan. Check whether the target means waiting longer or losing the dream.
      - text: "Nabago"
        rationale: |
          This weakens ruin into any change. A disaster can change plans. Check the strength of the word "gumuho."
    explanation: |
      Here the dreams "collapsed" because of the disaster. "Nawasak" means ruined and fits that figurative sense.
    approved: true

  - id: q-vocabulary-synonyms-and-antonyms-0004
    type: antonym
    difficulty: medium
    stem: |
      Alin sa mga sumusunod ang kasalungat ng salitang "maralita"?
    choices:
      - text: "Mayaman"
        correct: true
      - text: "Mahirap"
        rationale: |
          This chooses the same financial condition instead of its opposite. Both words describe poverty. Check the direction of the requested contrast.
      - text: "Matipid"
        rationale: |
          This confuses wealth with spending habits. A person with little money may spend carefully. Check whether the target describes resources or behavior.
      - text: "Mapagbigay"
        rationale: |
          This confuses wealth with giving to others. Giving may suggest having money. Check whether the word states financial condition or generosity.
    explanation: |
      "Maralita" means poor in financial resources. "Mayaman" means wealthy, so it gives the opposite financial condition.
    approved: true

  - id: q-vocabulary-synonyms-and-antonyms-0005
    type: synonym
    difficulty: medium
    stem: |
      The manager's *sycophantic* assistant praised every proposal excessively in hopes of gaining a promotion. Which word best describes "sycophantic" here?
    choices:
      - text: "Fawning"
        correct: true
      - text: "Rebellious"
        rationale: |
          This treats an attempt to gain favor as resistance. The assistant has a personal goal, which may suggest acting independently. Check whether the behavior challenges or pleases the manager.
      - text: "Impartial"
        rationale: |
          This treats agreement as fair judgment. Praising every proposal may sound approving. Check the motive of gaining a promotion.
      - text: "Indifferent"
        rationale: |
          This treats flattery as lack of concern. The praise may not be sincere. Check whether the assistant actively seeks an advantage.
    explanation: |
      The assistant uses excessive praise to gain favor. "Sycophantic" and "fawning" both describe that behavior.
    approved: true

  - id: q-vocabulary-synonyms-and-antonyms-0006
    type: synonym
    difficulty: medium
    stem: |
      An editor was meticulous about checking every date and quotation. Which word is closest in meaning to "meticulous" here?
    choices:
      - text: "Thorough"
        correct: true
      - text: "Careless"
        rationale: |
          This reverses careful attention into neglect. Both concern how work is handled. Check whether details are checked or ignored.
      - text: "Hurried"
        rationale: |
          This confuses efficient checking with rushing. Skilled work can be quick. Check whether the word describes speed or attention.
      - text: "Distracted"
        rationale: |
          This confuses noticing many details with scattered attention. Many details can divide attention. Check whether the editor checks them carefully.
    explanation: |
      The editor checks every detail. "Meticulous" means very careful and thorough about details.
    approved: true

  - id: q-vocabulary-synonyms-and-antonyms-0007
    type: antonym
    difficulty: medium
    stem: |
      The report called the error's effect "benign," meaning it caused no harm. Which word is most nearly opposite to "benign" in this sense?
    choices:
      - text: "Harmful"
        correct: true
      - text: "Harmless"
        rationale: |
          This gives the same meaning instead of the opposite. Both words describe absence of harm. Check whether the question asks for a synonym or antonym.
      - text: "Trivial"
        rationale: |
          This confuses small importance with absence of harm. A minor error may also be harmless. Check which quality the sentence assigns to the effect.
      - text: "Unintended"
        rationale: |
          This confuses harmless results with lack of intention. An accidental action can have little effect. Check whether the word describes the result or the motive.
    explanation: |
      "Benign" describes an effect that is not harmful here. The opposite is "harmful," meaning capable of causing damage.
    approved: true

  - id: q-vocabulary-synonyms-and-antonyms-0008
    type: synonym
    difficulty: medium
    stem: |
      "Magiliw ang bagong kapitbahay: ngumiti siya at masayang binati ang mga taong nakasalubong niya." Alin ang pinakamalapit na kasingkahulugan ng "magiliw" dito?
    choices:
      - text: "Palakaibigan"
        correct: true
      - text: "Mapagpakitang-tao"
        rationale: |
          This treats warmth as insincere display. Friendly greetings can be used to impress others. Check whether the sentence gives evidence of pretending.
      - text: "Mapag-utos"
        rationale: |
          This treats approaching people as directing them. Both involve social interaction. Check whether the neighbor greets or commands.
      - text: "Mapagmataas"
        rationale: |
          This treats confident greeting as superiority. An outgoing person may seem self-assured. Check whether the actions show warmth or arrogance.
    explanation: |
      The neighbor smiles and greets people warmly. "Magiliw" means warm and friendly, so "palakaibigan" fits this context.
    approved: true

  - id: q-vocabulary-synonyms-and-antonyms-0009
    type: antonym
    difficulty: medium
    stem: |
      Alin ang pinakamalapit na kasalungat ng "matapang" sa kahulugang may lakas ng loob sa harap ng panganib?
    choices:
      - text: "Duwag"
        correct: true
      - text: "Malakas"
        rationale: |
          This confuses courage with physical strength. Strong people may seem able to face danger. Check whether the word describes strength or willingness to face fear.
      - text: "Maingat"
        rationale: |
          This confuses caution with lack of courage. A brave person may act carefully. Check whether the contrast concerns fear or planning.
      - text: "Padalos-dalos"
        rationale: |
          This treats bravery as recklessness. Both can involve taking risks. Check whether the question asks for the opposite of courage.
    explanation: |
      "Matapang" describes courage in facing danger. "Duwag" describes lack of that courage and is the opposite.
    approved: true

  - id: q-vocabulary-synonyms-and-antonyms-0010
    type: antonym
    difficulty: hard
    stem: |
      Select the word most nearly opposite to "candid" in the sense of honest and open.
    choices:
      - text: "Deceptive"
        correct: true
      - text: "Forthright"
        rationale: |
          This chooses a synonym for frank honesty. A less familiar word may seem to offer a contrast. Check the meaning of "forthright."
      - text: "Diplomatic"
        rationale: |
          This treats tact as dishonesty. A tactful person may speak gently. Check whether gentle wording necessarily changes the truth.
      - text: "Blunt"
        rationale: |
          This treats a harsh manner as the opposite of honesty. Blunt speech can be unpleasant. Check whether the contrast is about truth or tone.
    explanation: |
      "Candid" means honest and open in this sense. "Deceptive" means misleading others, so it opposes honesty.
    approved: true

  - id: q-vocabulary-synonyms-and-antonyms-0011
    type: antonym
    difficulty: medium
    stem: |
      Alin sa mga sumusunod ang kasalungat ng salitang "masaya"?
    choices:
      - text: "Malungkot"
        correct: true
      - text: "Nasisiyahan"
        rationale: |
          This chooses a similar pleasant feeling instead of its opposite. Both describe satisfaction or joy. Check the requested direction of meaning.
      - text: "Nasasabik"
        rationale: |
          This confuses excitement with an opposite emotion. Excitement can be different from calm happiness. Check whether it actually means sadness.
      - text: "Nababahala"
        rationale: |
          This treats any unpleasant feeling as the precise opposite of happiness. Worry is unpleasant. Check whether the alternative means sad or concerned about danger.
    explanation: |
      "Masaya" means happy. "Malungkot" means sad, which is the opposite emotional state.
    approved: true

  - id: q-vocabulary-synonyms-and-antonyms-0012
    type: synonym
    difficulty: hard
    stem: |
      After the religious ceremony, the monks decided to *fast* for three days, taking no food during the stated fasting periods. What does "fast" mean here?
    choices:
      - text: "To avoid eating"
        correct: true
      - text: "To eat less than usual"
        rationale: |
          This weakens abstaining into reducing the amount. A religious practice may involve dietary limits. Check the phrase "taking no food."
      - text: "To finish a task quickly"
        rationale: |
          This uses the speed meaning. "Fast" commonly describes quick action. Check the sentence's reference to food.
      - text: "To hold firmly in place"
        rationale: |
          This uses the firmly-fixed meaning. "Fast" can appear in the expression "hold fast." Check which meaning fits the monks' action.
    explanation: |
      Here "fast" is a verb meaning go without food for the stated periods. "To avoid eating" matches that sense.
    approved: true

  - id: q-vocabulary-synonyms-and-antonyms-0013
    type: synonym
    difficulty: medium
    stem: |
      Choose the word most similar in meaning to "audacious."
    choices:
      - text: "Daring"
        correct: true
      - text: "Cautious"
        rationale: |
          This chooses caution instead of bold risk-taking. Both can concern difficult decisions. Check whether the target emphasizes avoiding or facing risk.
      - text: "Conventional"
        rationale: |
          This chooses adherence to accepted ways instead of a bold departure. Both can describe an approach. Check whether the word emphasizes tradition or boldness.
      - text: "Ambitious"
        rationale: |
          This confuses a strong desire to succeed with willingness to take risks. Ambitious people may act boldly. Check whether the meaning is about a goal or an approach.
    explanation: |
      "Audacious" means boldly willing to take risks. "Daring" expresses that boldness.
    approved: true

  - id: q-vocabulary-synonyms-and-antonyms-0014
    type: antonym
    difficulty: medium
    stem: |
      Select the word most nearly opposite in meaning to "abundant."
    choices:
      - text: "Scarce"
        correct: true
      - text: "Plentiful"
        rationale: |
          This chooses the same quantity meaning instead of the opposite. Both words describe a large supply. Check whether the question asks for an antonym.
      - text: "Expensive"
        rationale: |
          This treats a possible consequence of scarcity as its meaning. Limited goods can cost more. Check whether the target concerns amount or price.
      - text: "Concentrated"
        rationale: |
          This confuses total amount with density. A concentrated substance can seem like a large amount. Check whether the contrast is about supply or distribution.
    explanation: |
      "Abundant" means present in large amounts. "Scarce" means in short supply, so it is the opposite.
    approved: true

  - id: q-vocabulary-synonyms-and-antonyms-0015
    type: synonym
    difficulty: medium
    stem: |
      Alin sa mga sumusunod ang pinakamalapit na kasingkahulugan ng "matiyaga" sa pangungusap na "Matiyaga siyang nagpraktis araw-araw hanggang matutuhan niya ang piyesa"?
    choices:
      - text: "Masikap"
        correct: true
      - text: "Tamad"
        rationale: |
          This reverses sustained effort into avoiding work. Both describe work habits. Check the daily practice in the sentence.
      - text: "Mahusay"
        rationale: |
          This confuses effort with existing skill. Practice can lead to skill. Check whether the word describes trying persistently or already performing well.
      - text: "Padalos-dalos"
        rationale: |
          This confuses repeated effort with rushing. Frequent practice can involve much activity. Check whether the person works steadily or acts without care.
    explanation: |
      The person practices every day until learning the piece. "Matiyaga" here means persistent in effort, so "masikap" is the closest fit.
    approved: true

  - id: q-vocabulary-synonyms-and-antonyms-0016
    type: antonym
    difficulty: medium
    stem: |
      Alin sa mga sumusunod ang pinakamalapit na kasalungat ng "matapat" sa kahulugang tapat at hindi mapanlinlang?
    choices:
      - text: "Mapanlinlang"
        correct: true
      - text: "Mapagkakatiwalaan"
        rationale: |
          This chooses trustworthiness instead of dishonesty. An honest person can be trusted. Check whether the question asks for a similar word or an opposite.
      - text: "Mapagkimkim"
        rationale: |
          This confuses keeping feelings inside with lying. Someone who says little may seem less open. Check whether the word means withholding feelings or deceiving.
      - text: "Mapagsalita"
        rationale: |
          This confuses how much someone speaks with whether the speech is true. More speech can reveal more information. Check whether the contrast concerns quantity or honesty.
    explanation: |
      In the stated sense, "matapat" means honest. "Mapanlinlang" means deceitful, which reverses that meaning.
    approved: true

  - id: q-vocabulary-synonyms-and-antonyms-0017
    type: antonym
    difficulty: hard
    stem: |
      Select the word most nearly opposite to "humble" in the sense of modest about one's importance.
    choices:
      - text: "Arrogant"
        correct: true
      - text: "Modest"
        rationale: |
          This chooses a similar lack of excessive pride. Modest and humble often overlap. Check whether the word increases or reduces self-importance.
      - text: "Unassuming"
        rationale: |
          This chooses a similar quiet view of one's importance. "Unassuming" may be less familiar. Check its meaning before treating it as an opposite.
      - text: "Meek"
        rationale: |
          This chooses a gentle or submissive manner instead of pride. Such a manner can overlap with humility. Check the axis of contrast stated in the stem.
    explanation: |
      "Humble" means not overstating one's importance here. "Arrogant" means having an inflated view of one's importance, so it is the opposite.
    approved: true

  - id: q-vocabulary-synonyms-and-antonyms-0018
    type: synonym
    difficulty: exam
    stem: |
      First identify the antonym of "diligent." Then choose the word among the options that is most similar in meaning to that antonym.
    choices:
      - text: "Indolent"
        correct: true
      - text: "Hardworking"
        rationale: |
          This selects the starting word's meaning instead of its opposite. "Diligent" directly suggests hard work. Check both steps requested in the stem.
      - text: "Careful"
        rationale: |
          This selects a trait associated with diligence. Careful work can show diligence. Check whether it is actually the opposite of steady effort.
      - text: "Impatient"
        rationale: |
          This confuses unwillingness to wait with unwillingness to work. Both can describe an unhelpful attitude. Check which behavior the target word concerns.
    explanation: |
      "Diligent" means steadily hardworking. Its opposite is lazy. "Indolent" means habitually lazy, so it matches that opposite.
    approved: true

  - id: q-vocabulary-synonyms-and-antonyms-0019
    type: synonym
    difficulty: hard
    stem: |
      Choose the word that preserves the approving tone: "Her careful spending left enough money for essentials and for helping neighbors." She was ______.
    choices:
      - text: "Frugal"
        correct: true
      - text: "Stingy"
        rationale: |
          This adds a negative idea of refusing to spend or share. Both words concern keeping money. Check the sentence's approving tone and help for neighbors.
      - text: "Miserly"
        rationale: |
          This adds excessive unwillingness to part with money. It can sound like careful saving. Check whether the person gives needed help willingly.
      - text: "Extravagant"
        rationale: |
          This reverses careful spending into excessive spending. The person gives help to others, which may suggest spending freely. Check whether generosity removes the stated care with money.
    explanation: |
      "Frugal" describes sensible care with money. It keeps the approving tone of spending wisely while still meeting others' needs.
    approved: false

  - id: q-vocabulary-synonyms-and-antonyms-0020
    type: word-analogy
    difficulty: exam
    stem: |
      Complete the relationship, keeping the opposite participant's role in the same transaction: Buy is to sell as borrow is to ______.
    choices:
      - text: "Lend"
        correct: true
      - text: "Return"
        rationale: |
          This changes the participant role into a later action. A borrowed item is usually returned. Check whether the relation concerns the same exchange or what happens afterward.
      - text: "Repay"
        rationale: |
          This changes the participant role into settling an obligation. Borrowed money may be repaid. Check who supplies the item during the original transaction.
      - text: "Rent"
        rationale: |
          This selects another way of receiving temporary use. Renting resembles borrowing. Check whether the second word names the other participant's role.
    explanation: |
      Buying and selling describe the two sides of one exchange. In the same way, one person borrows what another person lends. "Lend" names the other side of borrowing.
    approved: false

