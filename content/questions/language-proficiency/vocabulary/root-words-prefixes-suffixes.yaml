meta:
  subject: language-proficiency
  topic: vocabulary
  subtopic: root-words-prefixes-suffixes
  exams: [ upcat, acet, dlsucet, ustet, dost-sei , cse-pro, cse-sub]
questions:
  - id: q-vocabulary-root-words-prefixes-suffixes-0001
    type: root-word-affix-analysis
    difficulty: easy
    stem: |
      The donor was described as *benevolent* because she consistently used her resources to help people in need. The element "bene-" is associated with "good" or "well." What does *benevolent* most likely mean?
    choices:
      - text: Kind and well-meaning
        correct: true
      - text: Cruel and harmful
        rationale: |
          That is the opposite of the positive "bene-" clue and the helping behavior in the sentence.
      - text: Uncertain
        rationale: |
          Neither the word element nor the context suggests uncertainty.
      - text: Silent
        rationale: |
          The clue concerns goodwill, not amount of speech.
    explanation: |
      The "bene-" clue and the donor's helpful behavior both point to "benevolent": kind, generous, or well-meaning toward others.
    approved: true

  - id: q-vocabulary-root-words-prefixes-suffixes-0002
    type: root-word-affix-analysis
    difficulty: easy
    stem: |
      The villain's *malicious* smile revealed his plan to harm everyone in the room. The element "mal-" commonly carries a bad or harmful sense. What does *malicious* most likely mean?
    choices:
      - text: Harmful and cruel
        correct: true
      - text: Kind and helpful
        rationale: |
          That conflicts with both the "mal-" clue and the stated plan to cause harm.
      - text: Confused
        rationale: |
          Confusion is not the harmful intent described in the sentence.
      - text: Tired
        rationale: |
          Physical exhaustion is unrelated to the word's meaning here.
    explanation: |
      The word and context both point to an intention to cause harm: "malicious" means spiteful or harmful in intent.
    approved: true

  - id: q-vocabulary-root-words-prefixes-suffixes-0003
    type: root-word-affix-analysis
    difficulty: medium
    stem: |
      Tukuyin ang salitang-ugat ng salitang *pinaghirapan*.
    choices:
      - text: Hirap
        correct: true
      - text: Pinag
        rationale: |
          Panlapi ito, hindi ang salitang-ugat.
      - text: Naghirap
        rationale: |
          May panlapi pa ang "naghirap."
      - text: Hirapan
        rationale: |
          May hulapi pa ang "hirapan."
    explanation: |
      Kapag inalis ang mga panlapi sa "pinaghirapan," ang batayang salitang natitira ay "hirap."
    approved: true

  - id: q-vocabulary-root-words-prefixes-suffixes-0004
    type: root-word-affix-analysis
    difficulty: medium
    stem: |
      Alin sa mga sumusunod ang halimbawa ng panlaping laguhan, na gumagamit ng unlapi, gitlapi, at hulapi?
    choices:
      - text: Pinagsumikapan
        correct: true
      - text: Kasaganaan
        rationale: |
          Ang "kasaganaan" ay karaniwang sinusuri bilang kabilaan, hindi laguhan.
      - text: Pag-ibig
        rationale: |
          Unlapi lamang ang "pag-" sa pagsusuring ito.
      - text: Ginawa
        rationale: |
          Gitlapi ang "-in-" sa salitang ito.
    explanation: |
      Sa karaniwang pagsusuring pampaaralan, ang "pinagsumikapan" ay halimbawa ng laguhan sapagkat may mga panlapi sa unahan, loob, at hulihan ng salitang-ugat.
    approved: true

  - id: q-vocabulary-root-words-prefixes-suffixes-0005
    type: root-word-affix-analysis
    difficulty: medium
    stem: |
      The professor is a *polyglot* who can converse fluently in over ten languages. Given "poly-" = many and "-glot" = language/tongue, what does *polyglot* mean?
    choices:
      - text: Someone who speaks many languages
        correct: true
      - text: Someone who is silent
        rationale: |
          That conflicts with the language clue and the stated ability to converse in many languages.
      - text: A type of bird
        rationale: |
          The word parts point to languages, not an animal category.
      - text: A disease
        rationale: |
          Nothing in the morphology or context concerns illness.
    explanation: |
      Combining "poly-" (many) with the language-related element gives the meaning "a person who knows or uses many languages."
    approved: true

  - id: q-vocabulary-root-words-prefixes-suffixes-0006
    type: root-word-affix-analysis
    difficulty: medium
    stem: |
      Which word is the clearest antonym of *malevolent*?
    choices:
      - text: Benevolent
        correct: true
      - text: Malicious
        rationale: |
          "Malicious" is close in meaning to malevolent.
      - text: Violent
        rationale: |
          Violence is behavior; it is not the direct goodwill/ill-will opposite.
      - text: Gloomy
        rationale: |
          Gloominess concerns mood or appearance, not goodwill.
    explanation: |
      "Malevolent" expresses ill will; "benevolent" expresses goodwill and kindness, making it the clearest opposite.
    approved: true

  - id: q-vocabulary-root-words-prefixes-suffixes-0007
    type: root-word-affix-analysis
    difficulty: medium
    stem: |
      The novel's narrator is *omniscient*, knowing everything that happens to every character. Given "omni-" = all and a root related to knowing, what does *omniscient* mean?
    choices:
      - text: All-knowing
        correct: true
      - text: All-powerful
        rationale: |
          Power is not the knowledge-related meaning of this word.
      - text: Blind
        rationale: |
          That conflicts with the explicit knowledge clue.
      - text: Forgetful
        rationale: |
          Forgetfulness is the opposite of the stated all-knowing perspective.
    explanation: |
      The word parts and context point directly to "all-knowing."
    approved: true

  - id: q-vocabulary-root-words-prefixes-suffixes-0008
    type: root-word-affix-analysis
    difficulty: medium
    stem: |
      The historian arranged the events in *chronological* order, from earliest to latest. Given "chron-" = time, what does *chronological* most likely mean?
    choices:
      - text: Ordered by time
        correct: true
      - text: Ordered by importance
        rationale: |
          The root clue concerns time, not rank or importance.
      - text: Ordered alphabetically
        rationale: |
          Alphabetical order is based on letters, not time.
      - text: Ordered randomly
        rationale: |
          Random order conflicts with the stated earliest-to-latest sequence.
    explanation: |
      "Chronological" means arranged according to time or temporal sequence.
    approved: true

  - id: q-vocabulary-root-words-prefixes-suffixes-0009
    type: root-word-affix-analysis
    difficulty: medium
    stem: |
      The author used a *pseudonym* instead of her legal name. Given "pseudo-" = false/assumed and "-nym" = name, what is a pseudonym?
    choices:
      - text: An assumed name
        correct: true
      - text: A legal birth name
        rationale: |
          That contradicts both the word parts and the phrase "instead of her legal name."
      - text: A title of respect
        rationale: |
          The morphology points to a name, not an honorific.
      - text: A family relation
        rationale: |
          Nothing in the word parts concerns kinship.
    explanation: |
      A pseudonym is an assumed or fictitious name used instead of one's real or legal name.
    approved: true

  - id: q-vocabulary-root-words-prefixes-suffixes-0010
    type: root-word-affix-analysis
    difficulty: medium
    stem: |
      Tukuyin ang salitang-ugat ng salitang *ginawa*.
    choices:
      - text: Gawa
        correct: true
      - text: Gin
        rationale: |
          Bahagi lamang ito ng nabuong salita, hindi ang salitang-ugat.
      - text: Ginawa
        rationale: |
          Ito ang buong salitang may panlapi.
      - text: Gawain
        rationale: |
          May dagdag na panlapi ang "gawain."
    explanation: |
      Sa karaniwang pagsusuri, ang "ginawa" ay mula sa salitang-ugat na "gawa" na nilapian ng "-in-."
    approved: true

  - id: q-vocabulary-root-words-prefixes-suffixes-0011
    type: root-word-affix-analysis
    difficulty: medium
    stem: |
      Alin sa mga sumusunod ang gumagamit ng panlaping kabilaan (unlapi + hulapi)?
    choices:
      - text: Kabataan
        correct: true
      - text: Tumakbo
        rationale: |
          Gitlapi ang "-um-" sa karaniwang pagsusuri sa salitang ito.
      - text: Sinulat
        rationale: |
          Gitlapi ang "-in-" sa karaniwang pagsusuri rito.
      - text: Maganda
        rationale: |
          Hindi ito halimbawa ng unlapi at hulapi na sabay na nakakabit sa salitang-ugat sa pagsusuring ito.
    explanation: |
      "Kabataan" isinusuri bilang ka- + bata + -an, kaya halimbawa ito ng kabilaan.
    approved: true

  - id: q-vocabulary-root-words-prefixes-suffixes-0012
    type: root-word-affix-analysis
    difficulty: medium
    stem: |
      Alin sa mga sumusunod ang gumagamit lamang ng unlapi sa karaniwang pagsusuring pampaaralan?
    choices:
      - text: Pag-ibig
        correct: true
      - text: Kasaganaan
        rationale: |
          May panlapi sa unahan at hulihan sa pagsusuring ito.
      - text: Ginawa
        rationale: |
          Gitlapi ang "-in-."
      - text: Pinagsumikapan
        rationale: |
          Higit sa isang uri ng panlapi ang ginagamit rito.
    explanation: |
      Sa pagsusuring ito, ang "pag-ibig" ay pag- + ibig, kaya unlapi lamang ang idinagdag.
    approved: true

  - id: q-vocabulary-root-words-prefixes-suffixes-0013
    type: root-word-affix-analysis
    difficulty: medium
    stem: |
      Alin sa mga sumusunod ang gumagamit lamang ng gitlapi sa karaniwang pagsusuring pampaaralan?
    choices:
      - text: Ginawa
        correct: true
      - text: Kasaganaan
        rationale: |
          Kabilaan ang pagsusuri rito.
      - text: Pag-ibig
        rationale: |
          Unlapi ang "pag-."
      - text: Pinagsumikapan
        rationale: |
          Higit sa isang uri ng panlapi ang ginagamit rito.
    explanation: |
      "Ginawa" isinusuri bilang g- + -in- + awa/gawa sa tradisyonal na paglalarawan ng gitlapi; ang batayang salita ay "gawa."
    approved: true

  - id: q-vocabulary-root-words-prefixes-suffixes-0014
    type: root-word-affix-analysis
    difficulty: hard
    stem: |
      A warning label reads "INFLAMMABLE MATERIAL." A student assumes this means the material cannot catch fire because "in-" often means "not." Is that correct?
    choices:
      - text: 'No: "inflammable" means flammable—capable of catching fire easily.'
        correct: true
      - text: 'Yes: "inflammable" means nonflammable.'
        rationale: |
          The two words are not opposites; "inflammable" and "flammable" have the same fire-related meaning.
      - text: 'Yes: it means fireproof.'
        rationale: |
          "Inflammable" describes something that can ignite, not something protected from fire.
      - text: 'No: it means only "warm" and says nothing about ignition.'
        rationale: |
          The established meaning directly concerns ability to ignite and burn.
    explanation: |
      "Inflammable" comes through Latin *inflammare* (to inflame/set on fire). Its "in-" is not the negative prefix found in words such as "inactive." Consequently, "inflammable" and "flammable" are synonyms; "nonflammable" is the clear opposite.
    approved: true

  - id: q-vocabulary-root-words-prefixes-suffixes-0015
    type: root-word-affix-analysis
    difficulty: hard
    stem: |
      After hours of waiting, the *restive* crowd became impatient and difficult to control. Does "restive" mean relaxed because it resembles "rest"?
    choices:
      - text: 'No: in this context, "restive" means restless, uneasy, or resistant to control.'
        correct: true
      - text: 'Yes: it means calm and relaxed.'
        rationale: |
          That conflicts with the sentence's explicit description of impatience and difficulty.
      - text: 'Yes: it means sleepy.'
        rationale: |
          The context describes agitation, not sleepiness.
      - text: 'No: "restive" is not a real English word.'
        rationale: |
          "Restive" is a standard English adjective.
    explanation: |
      Visual resemblance to a familiar word is not enough to determine meaning. Here the context correctly points to "restive" meaning restless or difficult to control.
    approved: true

  - id: q-vocabulary-root-words-prefixes-suffixes-0016
    type: root-word-affix-analysis
    difficulty: hard
    stem: |
      Sa tradisyonal na pagsusuring pampaaralan, bakit gitlapi ang "-um-" sa "sumayaw" ngunit nasa unahan ito sa "umalis"?
    choices:
      - text: Dahil nagsisimula sa katinig ang "sayaw," kaya naisingit ang -um- pagkatapos ng unang katinig; nagsisimula naman sa patinig ang "alis," kaya lumilitaw ang um- sa unahan.
        correct: true
      - text: Dahil magkaibang salita ang mga ito at walang tuntunin sa posisyon ng panlapi.
        rationale: |
          May sistematikong pagkakaiba ang posisyon batay sa anyo ng salitang-ugat sa pagsusuring ito.
      - text: Dahil palaging unlapi ang um-.
        rationale: |
          Sa "sumayaw," malinaw na nasa loob ng salitang-ugat ang -um-.
      - text: Dahil palaging gitlapi ang -um-.
        rationale: |
          Sa salitang nagsisimula sa patinig gaya ng "alis," nasa unahan ang anyo.
    explanation: |
      Kapag nagsisimula sa katinig ang ugat, karaniwang naisingit ang -um- pagkatapos ng unang katinig; sa ugat na nagsisimula sa patinig, lumilitaw ito sa unahan.
    approved: true

  - id: q-vocabulary-root-words-prefixes-suffixes-0017
    type: root-word-affix-analysis
    difficulty: medium
    stem: |
      The two scientists decided to *collaborate* on the project instead of working separately. Given "co-" = together and a root related to work, what does *collaborate* mean?
    choices:
      - text: To work together
        correct: true
      - text: To work alone
        rationale: |
          That directly contradicts the "co-" clue and the sentence.
      - text: To argue constantly
        rationale: |
          Argument is not the meaning of the word parts or context.
      - text: To celebrate
        rationale: |
          Celebration is unrelated to the work-related root.
    explanation: |
      "Collaborate" means work jointly with another person or group.
    approved: true

  - id: q-vocabulary-root-words-prefixes-suffixes-0018
    type: root-word-affix-analysis
    difficulty: exam
    stem: |
      The ship's captain planned to *circumnavigate* the continent before returning home. Given "circum-" = around and a root related to navigation, what does *circumnavigate* mean?
    choices:
      - text: To travel completely around something
        correct: true
      - text: To sink a ship deliberately
        rationale: |
          That does not follow from the "around" and navigation clues.
      - text: To travel underground
        rationale: |
          The morphology points to navigation around something, not subterranean travel.
      - text: To navigate only by the stars
        rationale: |
          The word does not specify a navigation instrument or technique.
    explanation: |
      "Circumnavigate" means travel all the way around a place or object; in the ship context, that would be by sea.
    approved: true
