meta:
  subject: language-proficiency
  topic: vocabulary
  subtopic: root-words-prefixes-suffixes
  exams: [ upcat, acet, dlsucet, ustet, dost-sei , cse-pro, cse-sub]
questions:
  - id: q-vocabulary-root-words-prefixes-suffixes-0001
    type: root-word-affix-analysis
    difficulty: easy
    stem: |
      The donor was described as *benevolent* because she consistently used her resources to help people in need. The element "bene-" is associated with "good" or "well." What does *benevolent* most likely mean?
    choices:
      - text: "Kind"
        correct: true
      - text: "Self-interested"
        rationale: |
          This treats giving as mainly serving the giver. Resources and public praise may suggest personal benefit. Check the stated purpose of helping people in need.
      - text: "Overconfident"
        rationale: |
          This treats having resources as excessive confidence. A powerful donor may seem confident. Check what the word element and behavior say about goodwill.
      - text: "Indifferent"
        rationale: |
          This treats kindness as merely not causing harm. A quiet person may seem harmless. Check whether the donor actively helps others.
    explanation: |
      "Bene-" suggests good or well. The donor's repeated help confirms that "benevolent" means kind and well-meaning.
    approved: true

  - id: q-vocabulary-root-words-prefixes-suffixes-0002
    type: root-word-affix-analysis
    difficulty: easy
    stem: |
      The villain's *malicious* smile revealed his plan to harm everyone in the room. The element "mal-" commonly carries a bad or harmful sense. What does *malicious* most likely mean?
    choices:
      - text: "Spiteful"
        correct: true
      - text: "Benevolent"
        rationale: |
          This reverses the harmful intention into goodwill. Both words can describe a person's motives. Check the element "mal-" and the plan to harm.
      - text: "Malfunctioning"
        rationale: |
          This treats harmful intention as faulty operation. "Mal-" can also mean faulty, so that part seems to fit. Check the whole word and the person's deliberate plan.
      - text: "Careless"
        rationale: |
          This treats intentional harm as an accident. Careless actions can cause damage. Check whether the sentence says harm was planned.
    explanation: |
      The plan is to harm people. The harmful sense of "mal-" supports "malicious," meaning spiteful or intending harm.
    approved: true

  - id: q-vocabulary-root-words-prefixes-suffixes-0003
    type: root-word-affix-analysis
    difficulty: medium
    stem: |
      Tukuyin ang salitang-ugat ng salitang *pinaghirapan*.
    choices:
      - text: "Hirap"
        correct: true
      - text: "Pinag"
        rationale: |
          This takes the beginning affix material as the base. It is a visible chunk at the start of the word. Check which part carries the main meaning.
      - text: "Naghirap"
        rationale: |
          This leaves added material on the base. "Naghirap" is a familiar related word. Check whether the answer still contains an affix.
      - text: "Hirapan"
        rationale: |
          This leaves an ending on the base. It resembles the final part of the full word. Check whether the final -an is part of the root or an addition.
    explanation: |
      The meaningful base is "hirap," which relates to difficulty or effort. The other parts of "pinaghirapan" are added around this base.
    approved: true

  - id: q-vocabulary-root-words-prefixes-suffixes-0004
    type: root-word-affix-analysis
    difficulty: medium
    stem: |
      Sa karaniwang pagsusuring pampaaralan, ang "pinagsumikapan" ay may unlapi, gitlapi, at hulapi sa paligid at loob ng "sikap." Ano ang tawag sa kombinasyong ito?
    choices:
      - text: "Laguhan"
        correct: true
      - text: "Kabilaan"
        rationale: |
          This counts only the material on the two sides of the base. The beginning and ending are easy to notice. Check whether an affix also appears inside "sikap."
      - text: "Unlapi"
        rationale: |
          This counts only the beginning of the word. "Pinag-" is prominent at the start. Check for added material inside and after the base.
      - text: "Gitlapi"
        rationale: |
          This counts only the inserted -um-. That infix is a familiar Filipino pattern. Check whether other affixes also occur.
    explanation: |
      In the stated school analysis, "pinagsumikapan" has affix material before, inside, and after "sikap." A combination of prefix, infix, and suffix is called "laguhan."
    approved: true

  - id: q-vocabulary-root-words-prefixes-suffixes-0005
    type: root-word-affix-analysis
    difficulty: medium
    stem: |
      The professor is a *polyglot* who can converse fluently in over ten languages. Given "poly-" = many and "-glot" = language/tongue, what does *polyglot* mean?
    choices:
      - text: "Multilingual"
        correct: true
      - text: "Well-traveled"
        rationale: |
          This confuses speaking many languages with visiting many places. Travel can help language learning. Check what "-glot" refers to.
      - text: "Highly talkative"
        rationale: |
          This reads "many" as many spoken words. A person who talks often may seem verbally skilled. Check whether the base concerns amount of speech or languages.
      - text: "Skilled at translation"
        rationale: |
          This treats knowing languages as being trained to translate. Those abilities are related. Check whether the word parts or context state that professional skill.
    explanation: |
      "Poly-" means many, and "-glot" relates to language. Together, the parts describe someone who knows or uses many languages: multilingual.
    approved: true

  - id: q-vocabulary-root-words-prefixes-suffixes-0006
    type: root-word-affix-analysis
    difficulty: medium
    stem: |
      Which word is the clearest antonym of *malevolent*?
    choices:
      - text: "Benevolent"
        correct: true
      - text: "Malicious"
        rationale: |
          This selects a similar harmful intention instead of its opposite. The same negative word element looks familiar. Check whether the question asks for an antonym.
      - text: "Belligerent"
        rationale: |
          This selects aggressive behavior instead of goodwill. Aggression can express ill will. Check whether the choice reverses the intention or merely describes another harmful trait.
      - text: "Indifferent"
        rationale: |
          This treats lack of concern as goodwill. Not wishing harm can seem enough to be the opposite. Check whether the opposite should mean actively wishing others well.
    explanation: |
      "Malevolent" means wishing harm. "Benevolent" means wishing others well, so it is the opposite.
    approved: true

  - id: q-vocabulary-root-words-prefixes-suffixes-0007
    type: root-word-affix-analysis
    difficulty: medium
    stem: |
      The novel's narrator is *omniscient*, knowing everything that happens to every character. Given "omni-" = all and a root related to knowing, what does *omniscient* mean?
    choices:
      - text: "All-knowing"
        correct: true
      - text: "All-powerful"
        rationale: |
          This keeps "all" but substitutes power for knowledge. Both can describe an exceptional being. Check the meaning of the second word element.
      - text: "All-present"
        rationale: |
          This treats complete knowledge as being everywhere. Knowing every event may suggest presence at each place. Check whether the stem names knowing or location.
      - text: "All-consuming"
        rationale: |
          This reads "all" as consuming everything. Another word beginning with "omni-" can concern eating. Check the rest of the word instead of relying on the prefix alone.
    explanation: |
      "Omni-" means all, and the other element relates to knowing. The narrator knows everything about every character, so "omniscient" means all-knowing.
    approved: true

  - id: q-vocabulary-root-words-prefixes-suffixes-0008
    type: root-word-affix-analysis
    difficulty: medium
    stem: |
      The historian arranged the events in *chronological* order, from earliest to latest. Given "chron-" = time, what does *chronological* most likely mean?
    choices:
      - text: "Ordered by time"
        correct: true
      - text: "Ordered by importance"
        rationale: |
          This substitutes rank for time. Important events can receive attention in history. Check what "chron-" means.
      - text: "Ordered alphabetically"
        rationale: |
          This substitutes letter order for time order. Both are common ways to arrange a list. Check the earliest-to-latest clue.
      - text: "Ordered by location"
        rationale: |
          This substitutes place for time. Historical events occur in different places. Check whether the listed rule concerns when or where.
    explanation: |
      "Chron-" relates to time. The earliest-to-latest arrangement confirms that "chronological" means ordered by time.
    approved: true

  - id: q-vocabulary-root-words-prefixes-suffixes-0009
    type: root-word-affix-analysis
    difficulty: medium
    stem: |
      The author used a *pseudonym* instead of her legal name. Given "pseudo-" = false/assumed and "-nym" = name, what is a pseudonym?
    choices:
      - text: "An assumed name"
        correct: true
      - text: "A legal birth name"
        rationale: |
          This overlooks the assumed-name element. A published author has a name on the work. Check the phrase "instead of her legal name."
      - text: "A title of respect"
        rationale: |
          This treats a new name as an honorific. Authors can use titles alongside names. Check whether the word parts name respect or an assumed identity.
      - text: "A shortened legal name"
        rationale: |
          This treats an assumed name as merely an abbreviation. Both differ from a full legal name. Check whether the parts mean shortened or assumed.
    explanation: |
      "Pseudo-" points to an assumed form, and "-nym" means name. A pseudonym is an assumed name used in place of the legal name.
    approved: true

  - id: q-vocabulary-root-words-prefixes-suffixes-0010
    type: root-word-affix-analysis
    difficulty: medium
    stem: |
      Tukuyin ang salitang-ugat ng salitang *ginawa*.
    choices:
      - text: "Gawa"
        correct: true
      - text: "Gin"
        rationale: |
          This takes the first letters as a root. They form an easy chunk to see. Check whether that chunk carries the base meaning of the word.
      - text: "Ginawa"
        rationale: |
          This gives the whole affixed word as the root. It is already a meaningful word. Check whether any added material remains.
      - text: "Gawain"
        rationale: |
          This chooses a related word that still has an ending. The shared "gawa" makes it look close. Check whether the answer is the smallest meaningful base.
    explanation: |
      "Ginawa" comes from "gawa." The infix -in- is inserted after the initial g, giving g + in + awa.
    approved: true

  - id: q-vocabulary-root-words-prefixes-suffixes-0011
    type: root-word-affix-analysis
    difficulty: medium
    stem: |
      Sa "kabataan," aling dalawang panlapi ang nasa unahan at hulihan ng salitang-ugat na "bata"?
    choices:
      - text: "Ka- and -an"
        correct: true
      - text: "Pag- and -an"
        rationale: |
          This replaces the beginning ka- with a different familiar prefix. Both prefixes occur in Filipino words. Check the actual first letters before "bata."
      - text: "Ka- and -in"
        rationale: |
          This replaces the final -an with another familiar affix. The endings can both occur in Filipino word formation. Check the letters after "bata."
      - text: "Ma- and -an"
        rationale: |
          This replaces ka- with ma-. Both are common initial forms. Check which one actually appears in the word.
    explanation: |
      "Kabataan" is formed with ka- before "bata" and -an after it. Affixes on both sides make the school pattern "kabilaan."
    approved: true

  - id: q-vocabulary-root-words-prefixes-suffixes-0012
    type: root-word-affix-analysis
    difficulty: medium
    stem: |
      Alin sa mga sumusunod ang gumagamit lamang ng unlapi sa karaniwang pagsusuring pampaaralan?
    choices:
      - text: "Pag-ibig"
        correct: true
      - text: "Kasaganaan"
        rationale: |
          This overlooks the ending -an. The beginning ka- is easy to notice. Check both ends of the base.
      - text: "Ginawa"
        rationale: |
          This treats an inserted affix as a beginning affix. The added letters occur near the front. Check whether the base's first consonant comes before them.
      - text: "Pinagsumikapan"
        rationale: |
          This notices the prefix but ignores the other additions. The word begins with a clear added chunk. Check whether all its added material is at the start.
    explanation: |
      "Pag-ibig" has pag- before the base "ibig." That is a prefix, or "unlapi," in the stated school analysis.
    approved: true

  - id: q-vocabulary-root-words-prefixes-suffixes-0013
    type: root-word-affix-analysis
    difficulty: medium
    stem: |
      Alin sa mga sumusunod ang gumagamit lamang ng gitlapi sa karaniwang pagsusuring pampaaralan?
    choices:
      - text: "Ginawa"
        correct: true
      - text: "Kasaganaan"
        rationale: |
          This treats additions around the base as one inside it. The full word contains several parts. Check where each affix sits relative to "sagana."
      - text: "Pag-ibig"
        rationale: |
          This treats a prefix as an infix because it is joined to a base. Both are affixes. Check whether the addition comes before or inside "ibig."
      - text: "Pinagsumikapan"
        rationale: |
          This overlooks additions outside the base. The -um- inside "sikap" is easy to recognize. Check whether the word has only that affix.
    explanation: |
      The base "gawa" becomes "ginawa" by adding -in- after its first consonant. An affix inside the base is "gitlapi," or an infix.
    approved: true

  - id: q-vocabulary-root-words-prefixes-suffixes-0014
    type: root-word-affix-analysis
    difficulty: hard
    stem: |
      A warning label reads "INFLAMMABLE MATERIAL." What does the adjective say about the material?
    choices:
      - text: "Easily ignited"
        correct: true
      - text: "Protected from fire"
        rationale: |
          This reads the initial letters as the negative prefix in every word. That prefix does mean "not" in some words. Check the established meaning of the whole word.
      - text: "Already burning"
        rationale: |
          This confuses ability to burn with burning at this moment. The warning concerns fire, so a present fire may seem implied. Check whether the adjective gives a property or a current event.
      - text: "Resistant to heat"
        rationale: |
          This confuses catching fire with handling high temperature. Both are heat-related properties. Check whether the word names ignition or temperature resistance.
    explanation: |
      "Inflammable" means able to catch fire easily. Its historical first element is part of a word meaning set on fire, so the whole word indicates a fire risk.
    approved: true

  - id: q-vocabulary-root-words-prefixes-suffixes-0015
    type: root-word-affix-analysis
    difficulty: hard
    stem: |
      After hours of waiting, the *restive* crowd became impatient and difficult to control. What does "restive" mean in this context?
    choices:
      - text: "Restless"
        correct: true
      - text: "Relaxed"
        rationale: |
          This infers meaning from resemblance to "rest." The familiar smaller word may look like a useful base. Check the stated behavior of the crowd.
      - text: "Exhausted"
        rationale: |
          This treats waiting for hours as proof of tiredness. Long waits can tire people. Check whether the sentence emphasizes fatigue or agitation.
      - text: "Unconcerned"
        rationale: |
          This treats waiting as acceptance of the delay. People sometimes wait quietly. Check the clues "impatient" and "difficult to control."
    explanation: |
      The crowd became impatient and hard to control. These clues show that "restive" means restless in this sentence.
    approved: true

  - id: q-vocabulary-root-words-prefixes-suffixes-0016
    type: root-word-affix-analysis
    difficulty: hard
    stem: |
      Sa tradisyonal na pagsusuring pampaaralan, bakit gitlapi ang "-um-" sa "sumayaw" ngunit nasa unahan ito sa "umalis"?
    choices:
      - text: "Dahil nagsisimula sa katinig ang \"sayaw,\" kaya naisingit ang -um- pagkatapos ng unang katinig; nagsisimula naman sa patinig ang \"alis,\" kaya lumilitaw ang um- sa unahan."
        correct: true
      - text: "Dahil magkaibang salita ang mga ito at walang tuntunin sa posisyon ng panlapi."
        rationale: |
          This treats the two positions as random. The roots look different, which can make a single pattern harder to see. Check the first sound of each root.
      - text: "Dahil palaging unlapi ang um-."
        rationale: |
          This treats every um- form as a prefix. The form stands at the start of "umalis." Check where it sits inside "sumayaw."
      - text: "Dahil palaging gitlapi ang -um-."
        rationale: |
          This assumes the label guarantees an inside position in every written form. The -um- pattern is often called an infix. Check how the word begins when the root starts with a vowel.
    explanation: |
      In this school pattern, -um- goes after the first consonant of "sayaw," giving "sumayaw." Because "alis" starts with a vowel, um- appears at the beginning in "umalis."
    approved: true

  - id: q-vocabulary-root-words-prefixes-suffixes-0017
    type: root-word-affix-analysis
    difficulty: medium
    stem: |
      The two scientists decided to *collaborate* on the project instead of working separately. Given "co-" = together and a root related to work, what does *collaborate* mean?
    choices:
      - text: "To work jointly"
        correct: true
      - text: "To work independently"
        rationale: |
          This reverses the together element. Each scientist can do separate work, so independence may seem possible. Check the contrast with working separately.
      - text: "To divide the work permanently"
        rationale: |
          This confuses collaboration with making permanently separate projects. Teams often split tasks. Check whether the shared project remains joint.
      - text: "To compete for the same work"
        rationale: |
          This confuses working on the same topic with competing. Scientists may compete in other settings. Check whether the sentence joins their effort or sets them against each other.
    explanation: |
      The together element and the work-related root support "work jointly." The scientists collaborate by working with each other on one project.
    approved: true

  - id: q-vocabulary-root-words-prefixes-suffixes-0018
    type: root-word-affix-analysis
    difficulty: exam
    stem: |
      The ship's captain planned to *circumnavigate* the continent before returning home. Given "circum-" = around and a root related to navigation, what does *circumnavigate* mean?
    choices:
      - text: "To sail around it"
        correct: true
      - text: "To sail along one side of it"
        rationale: |
          This treats traveling around as following only part of the edge. Both involve a coastline. Check whether the route goes all the way around.
      - text: "To sail straight across it"
        rationale: |
          This replaces around with across. Both describe routes relative to a place. Check the meaning of "circum-."
      - text: "To sail away from it"
        rationale: |
          This treats a journey as leaving the place behind. The captain plans to return home, which can suggest departure. Check what route the word parts describe.
    explanation: |
      "Circum-" means around, and the other element concerns navigation. In this ship context, "circumnavigate" means sail around the continent.
    approved: true

  - id: q-vocabulary-root-words-prefixes-suffixes-0019
    type: root-word-affix-analysis
    difficulty: hard
    stem: |
      A technician describes a device as having a "malfunction." From the element "mal-" and the base "function," which broad meaning is supported?
    choices:
      - text: "Faulty operation"
        correct: true
      - text: "Operation in reverse"
        rationale: |
          This assigns a direction meaning to the prefix. A device can run backward when something goes wrong. Check what mal- itself contributes.
      - text: "Absence of operation"
        rationale: |
          This treats faulty functioning as necessarily no functioning at all. A broken device may stop, so that seems possible. Check whether the element means absent or faulty.
      - text: "Operation ahead of time"
        rationale: |
          This assigns a time meaning to the prefix. Mistimed operation can be a fault. Check whether the element specifically says early or only faulty.
    explanation: |
      "Mal-" can mean bad or faulty. In "malfunction," it points to operation that does not work properly.
    approved: false

  - id: q-vocabulary-root-words-prefixes-suffixes-0020
    type: root-word-affix-analysis
    difficulty: exam
    stem: |
      Sa pagbuo ng "sulatan" mula sa "sulat," aling bahagi ang idinagdag bilang hulapi?
    choices:
      - text: "-an"
        correct: true
      - text: "-in-"
        rationale: |
          This selects a familiar infix instead of the visible ending. -in- also occurs with "sulat" in other forms. Check which letters were added in this word.
      - text: "Sulat"
        rationale: |
          This gives the base instead of the affix. The base carries the main meaning. Check which part was added to it.
      - text: "Su-"
        rationale: |
          This takes the first syllable of the base as an affix. It is an easy chunk to see. Check whether the same letters already belong to "sulat."
    explanation: |
      The base "sulat" remains whole, and -an is added at its end to form "sulatan." The added ending is a suffix.
    approved: false

