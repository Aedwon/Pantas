meta:
  subject: language-proficiency
  topic: vocabulary
  subtopic: idioms-and-figures-of-speech
  exams: [ upcat, acet, dlsucet, ustet, dost-sei , cse-pro, cse-sub]
questions:
  - id: q-vocabulary-idioms-and-figures-of-speech-0001
    type: idiom-meaning
    difficulty: easy
    stem: |
      After failing the exam three times, Maria decided to go back to square one and restart her review from the very first chapter. What does the idiom "back to square one" mean?
    choices:
      - text: To return to the beginning
        correct: true
      - text: To play a board game
        rationale: |
          The context says Maria restarts her review, so a literal board-game reading does not fit.
      - text: To get angry at a mistake
        rationale: |
          The idiom refers to restarting, not an emotional reaction.
      - text: To give up completely
        rationale: |
          Maria starts over instead of quitting.
    explanation: |
      "Back to square one" means returning to the beginning after earlier progress did not work out.
    approved: true

  - id: q-vocabulary-idioms-and-figures-of-speech-0002
    type: idiom-meaning
    difficulty: easy
    stem: |
      The reporter promised not to spill the beans about the celebrity's secret wedding until the official announcement. What does the idiom "spill the beans" mean?
    choices:
      - text: To reveal a secret
        correct: true
      - text: To cook food
        rationale: |
          The context concerns confidential information, not literal beans.
      - text: To clean the floor
        rationale: |
          Nothing in the sentence concerns a physical spill.
      - text: To argue loudly
        rationale: |
          The idiom specifically concerns disclosing hidden information.
    explanation: |
      In this context, "spill the beans" means reveal information that was supposed to remain secret.
    approved: true

  - id: q-vocabulary-idioms-and-figures-of-speech-0003
    type: idiom-meaning
    difficulty: medium
    stem: |
      "The old floorboards groaned under every footstep, as if complaining about the weight." Which figure of speech is most clearly emphasized?
    choices:
      - text: Personification
        correct: true
      - text: Simile
        rationale: |
          Although the phrase "as if" introduces an imagined comparison, the central effect is that the floorboards are described as if they could complain like a person.
      - text: Metaphor
        rationale: |
          The sentence does not directly identify the floorboards as another thing; it gives them person-like behavior.
      - text: Hyperbole
        rationale: |
          Exaggeration is not the main device being tested here.
    explanation: |
      The floorboards are presented as if they could groan and complain about a burden. Giving an inanimate object this person-like behavior is personification.
    approved: true

  - id: q-vocabulary-idioms-and-figures-of-speech-0004
    type: idiom-meaning
    difficulty: medium
    stem: |
      "Her smile was as bright as the morning sun." Which figure of speech is used in this sentence?
    choices:
      - text: Simile
        correct: true
      - text: Metaphor
        rationale: |
          The explicit comparison uses "as...as," which marks a simile.
      - text: Personification
        rationale: |
          No nonhuman thing is being given person-like qualities.
      - text: Oxymoron
        rationale: |
          The sentence does not combine contradictory terms.
    explanation: |
      The smile is explicitly compared with the sun using "as...as," making the comparison a simile.
    approved: true

  - id: q-vocabulary-idioms-and-figures-of-speech-0005
    type: idiom-meaning
    difficulty: medium
    stem: |
      "The classroom was a zoo during the fire drill." Which figure of speech is used in this sentence?
    choices:
      - text: Metaphor
        correct: true
      - text: Simile
        rationale: |
          The sentence makes a direct comparison without "like" or "as."
      - text: Personification
        rationale: |
          It does not give human behavior to a nonhuman thing.
      - text: Hyperbole
        rationale: |
          The most direct structural device is the equation of the classroom with a zoo.
    explanation: |
      "The classroom was a zoo" directly equates unlike things to convey disorder, making it a metaphor.
    approved: true

  - id: q-vocabulary-idioms-and-figures-of-speech-0006
    type: idiom-meaning
    difficulty: medium
    stem: |
      "I've told you a million times to clean your room!" Which figure of speech is used in this sentence?
    choices:
      - text: Hyperbole
        correct: true
      - text: Simile
        rationale: |
          There is no comparison between unlike things.
      - text: Alliteration
        rationale: |
          Repeated initial sounds are not the main feature.
      - text: Onomatopoeia
        rationale: |
          No word imitates a sound.
    explanation: |
      "A million times" is deliberate extreme exaggeration for emphasis, which is hyperbole.
    approved: true

  - id: q-vocabulary-idioms-and-figures-of-speech-0007
    type: idiom-meaning
    difficulty: medium
    stem: |
      "Peter Piper picked a peck of pickled peppers." Which figure of speech is used in this sentence?
    choices:
      - text: Alliteration
        correct: true
      - text: Onomatopoeia
        rationale: |
          The repeated /p/ sound is not an imitation of a real-world noise.
      - text: Metaphor
        rationale: |
          There is no direct comparison.
      - text: Oxymoron
        rationale: |
          No contradictory terms are paired.
    explanation: |
      The repeated initial /p/ sound across nearby words is alliteration.
    approved: true

  - id: q-vocabulary-idioms-and-figures-of-speech-0008
    type: idiom-meaning
    difficulty: medium
    stem: |
      "The bacon sizzled loudly in the pan." Which figure of speech is most directly illustrated by the word "sizzled"?
    choices:
      - text: Onomatopoeia
        correct: true
      - text: Alliteration
        rationale: |
          The focus is a sound-imitating word, not a sequence of repeated initial consonants.
      - text: Simile
        rationale: |
          The sentence contains no explicit comparison.
      - text: Hyperbole
        rationale: |
          The sentence does not depend on extreme exaggeration.
    explanation: |
      "Sizzle" imitates the sound associated with frying, making it an example of onomatopoeia.
    approved: true

  - id: q-vocabulary-idioms-and-figures-of-speech-0009
    type: idiom-meaning
    difficulty: medium
    stem: |
      During the exam, a deafening silence filled the room. Which figure of speech is used in the phrase "deafening silence"?
    choices:
      - text: Oxymoron
        correct: true
      - text: Hyperbole
        rationale: |
          The defining feature is the close pairing of apparently contradictory ideas.
      - text: Simile
        rationale: |
          There is no explicit comparison using "like" or "as."
      - text: Metaphor
        rationale: |
          The phrase is conventionally analyzed as an oxymoron because "deafening" and "silence" create a compact contradiction.
    explanation: |
      "Deafening silence" combines apparently contradictory terms for effect, which is an oxymoron.
    approved: true

  - id: q-vocabulary-idioms-and-figures-of-speech-0010
    type: idiom-meaning
    difficulty: medium
    stem: |
      Piliin ang kahulugan ng sawikain: Sumuko na siya at "itinapon na ang tuwalya" matapos ang tatlong bigong pagsubok.
    choices:
      - text: Sumuko
        correct: true
      - text: Nanalo sa laban
        rationale: |
          Kabaligtaran ito ng kahulugang ipinapakita ng konteksto.
      - text: Nagsimula ulit
        rationale: |
          Ang sawikain ay tumutukoy sa paghinto, hindi sa panibagong pagsisimula.
      - text: Naglinis ng kagamitan
        rationale: |
          Literal na pagbasa ito na hindi akma sa konteksto ng pagsuko.
    explanation: |
      Ang "itapon ang tuwalya" ay sawikain na nangangahulugang sumuko o tumigil sa pakikipaglaban/pagsisikap.
    approved: true

  - id: q-vocabulary-idioms-and-figures-of-speech-0011
    type: idiom-meaning
    difficulty: medium
    stem: |
      Anong uri ng tayutay ang ginamit? "Libu-libong beses ko nang sinabi sa iyo na linisin ang iyong silid."
    choices:
      - text: Pagmamalabis
        correct: true
      - text: Pagtutulad
        rationale: |
          Walang tuwirang paghahambing gamit ang panandang tulad ng "parang" o "gaya ng."
      - text: Pagwawangis
        rationale: |
          Hindi direktang ipinapantay ang dalawang magkaibang bagay.
      - text: Pagbibigay-katauhan
        rationale: |
          Walang bagay o konseptong binibigyan ng katangiang pantao.
    explanation: |
      Ang "libu-libong beses" ay sadyang pinalabis upang bigyang-diin ang dalas, kaya ito ay pagmamalabis.
    approved: true

  - id: q-vocabulary-idioms-and-figures-of-speech-0012
    type: idiom-meaning
    difficulty: medium
    stem: |
      Anong uri ng tayutay ang ginamit? "Ang kanyang mga mata ay kasing-ganda ng mga bituin sa gabi."
    choices:
      - text: Pagtutulad
        correct: true
      - text: Pagwawangis
        rationale: |
          Ang "kasing-" ay tahasang pananda ng paghahambing.
      - text: Pagmamalabis
        rationale: |
          Ang pangunahing estruktura ay paghahambing, hindi eksaherasyon.
      - text: Pagbibigay-katauhan
        rationale: |
          Walang katangiang pantao na ibinibigay sa di-tao.
    explanation: |
      Ang paggamit ng "kasing-" upang tahasang ihambing ang mga mata at mga bituin ay pagtutulad.
    approved: true

  - id: q-vocabulary-idioms-and-figures-of-speech-0013
    type: idiom-meaning
    difficulty: medium
    stem: |
      Anong uri ng tayutay ang ginamit? "Ang guro ay ilaw ng silid-aralan."
    choices:
      - text: Pagwawangis
        correct: true
      - text: Pagtutulad
        rationale: |
          Walang panandang paghahambing gaya ng "parang" o "tulad ng."
      - text: Pagmamalabis
        rationale: |
          Direktang paghahambing ang pangunahing estruktura.
      - text: Pagbibigay-katauhan
        rationale: |
          Hindi katangiang pantao ang ibinibigay sa isang bagay; ang guro ay direktang inihahambing sa ilaw.
    explanation: |
      Direktang inihahambing ang guro sa ilaw nang walang panandang "parang" o "tulad ng," kaya ito ay pagwawangis.
    approved: true

  - id: q-vocabulary-idioms-and-figures-of-speech-0014
    type: idiom-meaning
    difficulty: medium
    stem: |
      Anong uri ng tayutay ang ginamit? "Ngumiti ang araw habang sumasayaw ang mga dahon sa hangin."
    choices:
      - text: Pagbibigay-katauhan
        correct: true
      - text: Pagtutulad
        rationale: |
          Walang tahasang paghahambing gamit ang panandang tulad ng "parang" o "gaya ng."
      - text: Pagwawangis
        rationale: |
          Hindi direktang ipinapantay ang araw o mga dahon sa ibang bagay.
      - text: Pagmamalabis
        rationale: |
          Ang pangunahing epekto ay pagbibigay ng kilos na pantao, hindi eksaherasyon.
    explanation: |
      Ang pagngiti at pagsasayaw ay iniuugnay sa araw at mga dahon na para bang kumikilos silang tao. Ito ay pagbibigay-katauhan.
    approved: true

  - id: q-vocabulary-idioms-and-figures-of-speech-0015
    type: idiom-meaning
    difficulty: hard
    stem: |
      The old family dog finally "kicked the bucket" after fifteen happy years. What does the phrase mean in this context?
    choices:
      - text: The dog died.
        correct: true
      - text: The dog physically kicked a bucket.
        rationale: |
          That literal reading does not fit the lifespan and death context supplied by the sentence.
      - text: The dog became angry.
        rationale: |
          The idiom does not describe anger here.
      - text: The dog ran away.
        rationale: |
          Nothing in the context suggests departure or escape.
    explanation: |
      In this context, "kick the bucket" is the idiom meaning "die." The same words could be literal in a different sentence, so context—not a rule that idioms can never be literal—determines the reading.
    approved: true

  - id: q-vocabulary-idioms-and-figures-of-speech-0016
    type: idiom-meaning
    difficulty: hard
    stem: |
      "On the racetrack, the engine was a hungry beast devouring the distance." Which figure of speech is most clearly used in "the engine was a hungry beast"?
    choices:
      - text: Metaphor
        correct: true
      - text: Simile
        rationale: |
          The comparison is direct and does not use "like" or "as."
      - text: Personification
        rationale: |
          Although the image gives the engine animate qualities, the quoted phrase directly identifies the engine with another thing—a beast—so metaphor is the clearest classification being tested.
      - text: Oxymoron
        rationale: |
          The phrase does not pair contradictory terms.
    explanation: |
      "The engine was a hungry beast" directly equates the engine with a beast to describe its power and appetite for speed. That direct comparison is a metaphor.
    approved: true

  - id: q-vocabulary-idioms-and-figures-of-speech-0017
    type: idiom-meaning
    difficulty: hard
    stem: |
      Ang pangungusap na "Ang ina ay ilaw ng tahanan" ay walang panandang tulad ng "parang" o "tulad ng." Anong tayutay ito?
    choices:
      - text: Pagwawangis
        correct: true
      - text: Pagtutulad
        rationale: |
          Ang pagtutulad ay karaniwang may tahasang panandang paghahambing; wala nito sa pangungusap.
      - text: Pagmamalabis
        rationale: |
          Ang pangunahing estruktura ay direktang paghahambing.
      - text: Pagbibigay-katauhan
        rationale: |
          Hindi di-tao ang binibigyan ng katangiang pantao; ang ina ay inihahambing sa ilaw.
    explanation: |
      Direktang ipinapantay ang ina sa ilaw nang walang panandang paghahambing, kaya ito ay pagwawangis.
    approved: true

  - id: q-vocabulary-idioms-and-figures-of-speech-0018
    type: idiom-meaning
    difficulty: exam
    stem: |
      Identify the figure of speech used in each sentence, in order: (1) "The stars winked at us from above." (2) "Her voice was music to my ears." (3) "The thunder roared like a lion."
    choices:
      - text: (1) Personification, (2) Metaphor, (3) Simile
        correct: true
      - text: (1) Simile, (2) Personification, (3) Metaphor
        rationale: |
          "Winked" gives stars person-like behavior; "voice was music" is direct comparison; "like a lion" is an explicit comparison.
      - text: (1) Metaphor, (2) Simile, (3) Personification
        rationale: |
          These labels do not match the structures of the three sentences.
      - text: (1) Personification, (2) Simile, (3) Metaphor
        rationale: |
          Items (2) and (3) are reversed: direct "was" comparison is metaphor, while "like" marks a simile.
    explanation: |
      Stars "winking" is personification; a voice directly equated with music is metaphor; thunder compared with a lion using "like" is simile.
    approved: true
