meta:
  subject: language-proficiency
  topic: vocabulary
  subtopic: idioms-and-figures-of-speech
  exams: [ upcat, acet, dlsucet, ustet, dost-sei , cse-pro, cse-sub]
questions:
  - id: q-vocabulary-idioms-and-figures-of-speech-0001
    type: idiom-meaning
    difficulty: easy
    stem: |
      After failing the exam three times, Maria decided to go back to square one and restart her review from the very first chapter. What does the idiom "back to square one" mean?
    choices:
      - text: "To start over"
        correct: true
      - text: "To change the goal"
        rationale: |
          This treats restarting as choosing a different goal. Failure may lead someone to change goals, so it sounds possible. Check whether Maria changes her aim or begins the same work again.
      - text: "To abandon the attempt"
        rationale: |
          This treats lost progress as permanent surrender. Repeated failure can suggest giving up. Check the action Maria takes next.
      - text: "To repeat only the last step"
        rationale: |
          This treats restarting as correcting only the most recent step. A final mistake may seem to be the only problem. Check where Maria begins again.
    explanation: |
      "Back to square one" means start over. Maria returns to the first chapter to begin her review again.
    approved: true

  - id: q-vocabulary-idioms-and-figures-of-speech-0002
    type: idiom-meaning
    difficulty: easy
    stem: |
      The reporter promised not to spill the beans about the celebrity's secret wedding until the official announcement. What does the idiom "spill the beans" mean?
    choices:
      - text: "To reveal a secret"
        correct: true
      - text: "To invent a false story"
        rationale: |
          This confuses disclosing hidden facts with making up facts. Both can create a surprising story. Check whether the wedding information is secret or false.
      - text: "To make a public accusation"
        rationale: |
          This treats disclosure as an accusation. Revealing private news can seem confrontational. Check whether the sentence says anyone did something wrong.
      - text: "To announce an unrelated event"
        rationale: |
          This treats the idiom as announcing any news. A reporter announces events, so it sounds plausible. Check the link to the secret wedding.
    explanation: |
      "Spill the beans" means reveal a secret. The reporter promises to keep the wedding information private until its announcement.
    approved: true

  - id: q-vocabulary-idioms-and-figures-of-speech-0003
    type: idiom-meaning
    difficulty: medium
    stem: |
      "The old floorboards groaned under every footstep, as if complaining about the weight." Which device is most directly shown by giving the boards the ability to complain?
    choices:
      - text: "Personification"
        correct: true
      - text: "An explicit comparison"
        rationale: |
          This focuses on "as if" and misses the human behavior. That phrase can introduce an imagined comparison. Check what the boards are made to do.
      - text: "A direct comparison"
        rationale: |
          This treats human behavior as identifying the boards with another thing. Both are nonliteral uses of language. Check whether the sentence equates two things or gives an object an action.
      - text: "An extreme exaggeration"
        rationale: |
          This treats the complaint as an overstatement. The image can sound dramatic. Check whether the effect comes from an inflated amount or a human action.
    explanation: |
      The boards seem to complain about a burden. Complaining is human behavior given to an object, which is personification.
    approved: true

  - id: q-vocabulary-idioms-and-figures-of-speech-0004
    type: idiom-meaning
    difficulty: medium
    stem: |
      "Her smile was as bright as the morning sun." Which figure of speech is used in this sentence?
    choices:
      - text: "Simile"
        correct: true
      - text: "Metaphor"
        rationale: |
          This treats an explicit comparison as a direct identification. Both link unlike things. Check the words "as bright as."
      - text: "Personification"
        rationale: |
          This treats the sun comparison as giving the sun human behavior. A smile is human, so that connection may seem likely. Check which thing is described and whether the sun acts like a person.
      - text: "Oxymoron"
        rationale: |
          This treats two unlike things as two contradictory terms. The smile and sun are different. Check whether their meanings conflict or are being compared.
    explanation: |
      "As bright as" explicitly compares the smile with the morning sun. An explicit figurative comparison is a simile.
    approved: true

  - id: q-vocabulary-idioms-and-figures-of-speech-0005
    type: idiom-meaning
    difficulty: medium
    stem: |
      "The classroom was a zoo during the fire drill." Which device directly identifies the classroom with a zoo?
    choices:
      - text: "Metaphor"
        correct: true
      - text: "Simile"
        rationale: |
          This treats a direct identification as an explicit comparison. Both compare the classroom with a zoo. Check whether the wording says "was" or "was like."
      - text: "Personification"
        rationale: |
          This treats the zoo image as human behavior given to a nonhuman thing. A classroom is not human, so that may seem relevant. Check whether the sentence gives it a human action.
      - text: "Hyperbole"
        rationale: |
          This focuses on the dramatic effect instead of the comparison structure. Calling a room a zoo can sound exaggerated. Check how the two things are linked in the quoted phrase.
    explanation: |
      The sentence calls the classroom a zoo to show disorder. Presenting one thing as another is a metaphor.
    approved: true

  - id: q-vocabulary-idioms-and-figures-of-speech-0006
    type: idiom-meaning
    difficulty: medium
    stem: |
      "I've told you a million times to clean your room!" Which figure of speech is used in this sentence?
    choices:
      - text: "Hyperbole"
        correct: true
      - text: "Simile"
        rationale: |
          This treats a strong description as a comparison. Both can make language vivid. Check whether two unlike things are compared.
      - text: "Alliteration"
        rationale: |
          This treats repetition of a complaint as repetition of initial sounds. The speaker has repeated the instruction often. Check the beginnings of nearby words.
      - text: "Onomatopoeia"
        rationale: |
          This treats spoken words as sound imitation. The sentence is something someone says aloud. Check whether any word copies the sound it names.
    explanation: |
      "A million times" greatly overstates the number of reminders. Deliberate overstatement for effect is hyperbole.
    approved: true

  - id: q-vocabulary-idioms-and-figures-of-speech-0007
    type: idiom-meaning
    difficulty: medium
    stem: |
      "Peter Piper picked a peck of pickled peppers." Which figure of speech is used in this sentence?
    choices:
      - text: "Alliteration"
        correct: true
      - text: "Onomatopoeia"
        rationale: |
          This confuses repeated sounds with a word that imitates a noise. The line is strongly sound-based. Check whether the sound names a real noise or repeats across words.
      - text: "Hyperbole"
        rationale: |
          This treats a tongue twister as an extreme overstatement. Its wording sounds unusual. Check whether any amount is exaggerated.
      - text: "Oxymoron"
        rationale: |
          This treats unusual word combinations as a contradiction. The phrase is hard to say. Check whether two meanings actually oppose each other.
    explanation: |
      The nearby words repeat the starting /p/ sound. Repeated initial consonant sounds create alliteration.
    approved: true

  - id: q-vocabulary-idioms-and-figures-of-speech-0008
    type: idiom-meaning
    difficulty: medium
    stem: |
      "The bacon sizzled loudly in the pan." Which figure of speech is most directly illustrated by the word "sizzled"?
    choices:
      - text: "Onomatopoeia"
        correct: true
      - text: "Alliteration"
        rationale: |
          This confuses a sound-imitating word with repeated beginning sounds. Both devices work through sound. Check whether one word imitates a noise or several words repeat a sound.
      - text: "Personification"
        rationale: |
          This treats any action assigned to food as human behavior. The bacon is the subject of a verb. Check whether that action is specifically human.
      - text: "Hyperbole"
        rationale: |
          This treats loudness as an extreme overstatement. The word "loudly" adds force. Check whether the sound is exaggerated beyond a normal description.
    explanation: |
      "Sizzle" sounds like the noise of frying. A word that imitates the sound it names is onomatopoeia.
    approved: true

  - id: q-vocabulary-idioms-and-figures-of-speech-0009
    type: idiom-meaning
    difficulty: medium
    stem: |
      During the exam, a deafening silence filled the room. Which device is created specifically by placing the apparently contradictory terms "deafening" and "silence" together?
    choices:
      - text: "Oxymoron"
        correct: true
      - text: "Hyperbole"
        rationale: |
          This focuses on intensity instead of the paired contradiction. "Deafening" sounds extreme. Check the relationship between the two words.
      - text: "Simile"
        rationale: |
          This treats the two words as an explicit comparison. Both name effects connected to sound. Check whether a comparison marker links unlike things.
      - text: "Metaphor"
        rationale: |
          This focuses on a figurative description instead of the compact contradiction. "Deafening" is nonliteral here. Check how its meaning conflicts with "silence."
    explanation: |
      "Deafening" suggests an overwhelming sound, while "silence" means no sound. Putting apparently contradictory words together creates an oxymoron.
    approved: true

  - id: q-vocabulary-idioms-and-figures-of-speech-0010
    type: idiom-meaning
    difficulty: medium
    stem: |
      Piliin ang kahulugan ng sawikain: Sumuko na siya at "itinapon na ang tuwalya" matapos ang tatlong bigong pagsubok.
    choices:
      - text: "Sumuko"
        correct: true
      - text: "Nagpahinga muna"
        rationale: |
          This treats surrender as a temporary break. Someone may rest after several failures. Check whether the wording says the person will continue.
      - text: "Nagsimula ulit"
        rationale: |
          This treats failure as a restart. Failed attempts can lead to trying again. Check the statement "sumuko na siya."
      - text: "Nagpalit ng paraan"
        rationale: |
          This treats giving up as changing a method. A new method can follow failure. Check whether the person keeps trying or stops.
    explanation: |
      "Itinapon ang tuwalya" means gave up. The repeated failed attempts ended with the person stopping the effort.
    approved: true

  - id: q-vocabulary-idioms-and-figures-of-speech-0011
    type: idiom-meaning
    difficulty: medium
    stem: |
      "Parang isang bundok ang bigat ng bag ko!" Ang bag ay karaniwan lamang ang bigat. Aling tayutay ang nagpapakita ng sadyang labis na pahayag tungkol sa bigat nito?
    choices:
      - text: "Pagmamalabis"
        correct: true
      - text: "Pagtutulad"
        rationale: |
          This focuses on a comparison while missing the stated target of extreme weight. Mountain-sized weight can look like a comparison. Check which effect the question asks about.
      - text: "Pagwawangis"
        rationale: |
          This treats the phrase as identifying the bag with a mountain. Both can be heavy. Check whether the bag is called a mountain or its weight is overstated.
      - text: "Pagbibigay-katauhan"
        rationale: |
          This treats a nonhuman object in a vivid sentence as having human traits. The bag is being described strongly. Check whether it speaks, thinks, or acts like a person.
    explanation: |
      Saying the bag weighs as much as a mountain greatly overstates its weight. That deliberate overstatement is "pagmamalabis," or hyperbole.
    approved: true

  - id: q-vocabulary-idioms-and-figures-of-speech-0012
    type: idiom-meaning
    difficulty: medium
    stem: |
      "Ang kanyang mga mata ay kasing-ganda ng mga bituin sa gabi." Aling tayutay ang ipinapakita ng tahasang paghahambing gamit ang "kasing-ganda"?
    choices:
      - text: "Pagtutulad"
        correct: true
      - text: "Pagwawangis"
        rationale: |
          This treats an explicit comparison as a direct identification. Both connect eyes and stars. Check the comparison marker "kasing-."
      - text: "Pagmamalabis"
        rationale: |
          This focuses on praise as if praise were always exaggeration. The description is strong. Check whether the question targets an inflated amount or a comparison.
      - text: "Pagbibigay-katauhan"
        rationale: |
          This treats the mention of eyes as human traits given to stars. Eyes belong to a person. Check whether the stars are acting like people or serving as a comparison.
    explanation: |
      The wording "kasing-ganda" explicitly compares the eyes with stars. That explicit comparison is "pagtutulad," or simile.
    approved: true

  - id: q-vocabulary-idioms-and-figures-of-speech-0013
    type: idiom-meaning
    difficulty: medium
    stem: |
      Sa "Ang guro ay ilaw ng silid-aralan," aling tayutay ang direktang ipinapantay ang guro sa ilaw upang ipakita ang paggabay niya?
    choices:
      - text: "Pagwawangis"
        correct: true
      - text: "Pagtutulad"
        rationale: |
          This treats direct identification as an explicit comparison. Both compare unlike things. Check whether a word such as "parang" introduces the comparison.
      - text: "Pagmamalabis"
        rationale: |
          This focuses on praise instead of the way two things are linked. Calling a teacher a light can sound like strong praise. Check whether the stem targets an inflated quantity or direct identification.
      - text: "Pagbibigay-katauhan"
        rationale: |
          This treats a human compared with light as light given human actions. Both involve something human and something nonhuman. Check which one is being described.
    explanation: |
      The teacher is presented as a light that guides the classroom. This direct figurative comparison is "pagwawangis," or metaphor.
    approved: true

  - id: q-vocabulary-idioms-and-figures-of-speech-0014
    type: idiom-meaning
    difficulty: medium
    stem: |
      "Ngumiti ang araw habang sumasayaw ang mga dahon sa hangin." Ano ang ibinibigay sa araw at mga dahon upang makalikha ng pagbibigay-katauhan?
    choices:
      - text: "Kilos ng tao"
        correct: true
      - text: "Tahasan na paghahambing"
        rationale: |
          This treats human actions as an explicit comparison. The image makes unlike things seem similar. Check whether the words compare them with a stated marker.
      - text: "Tuwirang paghahambing"
        rationale: |
          This treats actions given to objects as identifying them with another object. Both are figurative. Check whether the sentence says one thing is another or makes it act like a person.
      - text: "Sadyang pagmamalabis"
        rationale: |
          This treats impossible human actions as only an extreme overstatement. The scene cannot happen literally. Check which human behaviors are assigned to nonhuman things.
    explanation: |
      The sun smiles and the leaves dance. These human actions are given to nonhuman things, creating personification.
    approved: true

  - id: q-vocabulary-idioms-and-figures-of-speech-0015
    type: idiom-meaning
    difficulty: hard
    stem: |
      The old family dog finally "kicked the bucket" after fifteen happy years. What does the phrase mean in this context?
    choices:
      - text: "The dog died."
        correct: true
      - text: "The dog injured its leg."
        rationale: |
          This treats the phrase as an injury from a literal kick. The verb "kicked" may suggest a leg injury. Check the established meaning of the whole phrase.
      - text: "The dog became aggressive."
        rationale: |
          This treats kicking as a sign of anger. Kicking can be aggressive when literal. Check how the phrase fits the reference to the dog's life.
      - text: "The dog escaped its home."
        rationale: |
          This treats the ending as a departure from home. The word "finally" may suggest a final departure. Check the idiom's meaning in the lifespan context.
    explanation: |
      "Kicked the bucket" means died in this sentence. The reference to the dog's fifteen years supports a statement about the end of its life.
    approved: true

  - id: q-vocabulary-idioms-and-figures-of-speech-0016
    type: idiom-meaning
    difficulty: hard
    stem: |
      "On the racetrack, the engine was a hungry beast devouring the distance." Which figure of speech is most clearly used in "the engine was a hungry beast"?
    choices:
      - text: "Metaphor"
        correct: true
      - text: "Simile"
        rationale: |
          This treats direct identification as an explicit comparison. Both connect the engine with an animal. Check whether the phrase says "was" or "was like."
      - text: "Personification"
        rationale: |
          This treats any living trait as specifically human. Hunger belongs to animals as well as people. Check whether the quoted phrase identifies the engine with another thing.
      - text: "Oxymoron"
        rationale: |
          This treats engine and beast as contradictory terms. They are unlike things. Check whether their meanings conflict or are being compared.
    explanation: |
      The engine is directly presented as a hungry beast. This comparison stresses its power and drive for speed, so it is a metaphor.
    approved: true

  - id: q-vocabulary-idioms-and-figures-of-speech-0017
    type: idiom-meaning
    difficulty: hard
    stem: |
      "Nagtatrabaho si Elena bilang guro sa paaralan." Kahit walang "parang" o "tulad ng," paano ginagamit ang wika sa pangungusap?
    choices:
      - text: "Literal"
        correct: true
      - text: "Pagwawangis"
        rationale: |
          This assumes a sentence without a comparison marker must be a metaphor. The words "ay" or "bilang" can also occur in factual statements. Check whether two unlike things are compared.
      - text: "Pagtutulad"
        rationale: |
          This treats "bilang" as proof of a figurative comparison. A role word can look like a comparison marker. Check whether the sentence names an actual job.
      - text: "Pagmamalabis"
        rationale: |
          This treats describing a job as exaggerating it. A title can sound important. Check whether the sentence overstates any fact.
    explanation: |
      The sentence gives a teacher's actual occupation. It reports a fact without a figurative comparison, so it is literal.
    approved: true

  - id: q-vocabulary-idioms-and-figures-of-speech-0018
    type: idiom-meaning
    difficulty: exam
    stem: |
      Identify the figure of speech used in each sentence, in order: (1) "The stars winked at us from above." (2) "Her voice was music to my ears." (3) "The thunder roared like a lion."
    choices:
      - text: "Personification, metaphor, simile"
        correct: true
      - text: "Simile, personification, metaphor"
        rationale: |
          This assigns comparison labels to the human-action image and the direct-identification image in the wrong order. All three sentences are vivid, so the categories may blur. Check the wording of each comparison separately.
      - text: "Metaphor, simile, personification"
        rationale: |
          This shifts the three devices to different sentences. The repeated nonliteral descriptions can make one label seem suitable everywhere. Check which sentence gives a human action and which ones compare things.
      - text: "Personification, simile, metaphor"
        rationale: |
          This reverses the two kinds of comparison. Both describe one thing through another. Check whether each comparison uses "like".
    explanation: |
      First, stars are given the human action of winking: personification. Second, the voice is directly called music: metaphor. Third, "like a lion" makes an explicit comparison: simile.
    approved: true

  - id: q-vocabulary-idioms-and-figures-of-speech-0019
    type: idiom-meaning
    difficulty: hard
    stem: |
      Bumaba ang kita ng pamilya, kaya **naghigpit sila ng sinturon** at ipinagpaliban ang pagbili ng bagong kagamitan. Ano ang kahulugan ng sawikain?
    choices:
      - text: "Nagtipid"
        correct: true
      - text: "Naghanda sa paglalakbay"
        rationale: |
          This reads the belt image as travel preparation. Tightening clothing may seem useful before a journey. Check the financial problem in the sentence.
      - text: "Naghiganti sa may utang"
        rationale: |
          This treats a financial difficulty as a conflict requiring revenge. Money problems may involve debts. Check whether the family reduces spending or attacks someone.
      - text: "Nagpautang ng salapi"
        rationale: |
          This treats reducing expenses as giving money to others. Both concern household money. Check the effect of the lower income on the family's spending.
    explanation: |
      "Naghigpit ng sinturon" means cut spending. The family reduces expenses because its income has fallen.
    approved: false

  - id: q-vocabulary-idioms-and-figures-of-speech-0020
    type: idiom-meaning
    difficulty: exam
    stem: |
      Which feature makes "The new chance felt like a door opening" a simile, while "She worked as a teacher" is literal?
    choices:
      - text: "An explicit comparison"
        correct: true
      - text: "A fact about a job"
        rationale: |
          This treats "like" as naming an actual role. Some expressions with "as" or "like" are literal. Check whether a chance and a door are unlike things used in a comparison.
      - text: "A repeated initial sound"
        rationale: |
          This focuses on word sounds instead of the comparison. The wording is easy to remember. Check whether several nearby words repeat a starting consonant.
      - text: "An extreme exaggeration"
        rationale: |
          This treats a hopeful image as an inflated claim. A new chance can sound very promising. Check whether the sentence overstates an amount or compares unlike things.
    explanation: |
      "Like a door" compares the new chance with an opening that lets someone move forward. The comparison uses "like," so it is explicit.
    approved: false

