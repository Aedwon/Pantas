meta:
  subject: general-information
  topic: code-of-conduct-ra-6713
  subtopic: duties-and-prohibited-acts
  exams:
  - cse-pro
  - cse-sub
questions:
- id: q-code-of-conduct-ra-6713-duties-and-prohibited-acts-0001
  type: single_choice
  difficulty: easy
  stem: 'Under Section 5(a) of RA 6713, what is the deadline for responding to public letters and requests?

    '
  choices:
  - text: 15 working days
    correct: true
  - text: 15 calendar days
    rationale: 'This counts calendar days instead of working days. The number matches the rule. Check the unit stated in the law.

      '
  - text: 30 working days
    rationale: 'This doubles the response period. Thirty days appears in other filing duties. Check which duty the question names.

      '
  - text: 45 working days
    rationale: 'This uses the annual-report period for correspondence. Both are Section 5 duties. Check the deadline for the specific task.

      '
  explanation: 'Section 5(a) requires a response within fifteen working days from receipt. The deadline applies to communications sent by the public.

    '
- id: q-code-of-conduct-ra-6713-duties-and-prohibited-acts-0002
  type: single_choice
  difficulty: medium
  stem: 'As far as practicable, how many signatories should official papers contain under Section 5(c) of RA 6713?

    '
  choices:
  - text: At most three
    correct: true
  - text: At most four official signatories
    rationale: 'This adds an extra approval stage. More review may seem safer. Check the law''s practical limit.

      '
  - text: At most five official signatories
    rationale: 'This assumes more approval steps are required. Several offices may handle a paper. Check the stated limit on signatories.

      '
  - text: At most six official signatories
    rationale: 'This doubles the practical limit. Separate preparers and reviewers may seem to require separate signatures. Check the number in Section 5(c).

      '
  explanation: 'Section 5(c) says official papers should contain no more than three signatories, as far as practicable.

    '
- id: q-code-of-conduct-ra-6713-duties-and-prohibited-acts-0003
  type: single_choice
  difficulty: easy
  stem: 'Within how many working days after year-end must heads or other responsible officers render the office''s annual performance report?

    '
  choices:
  - text: 45 working days
    correct: true
  - text: 15 working days
    rationale: 'This uses the letter-response period for reports. Both duties require prompt action. Check which document is due.

      '
  - text: 30 working days
    rationale: 'This uses a familiar filing number for the annual report. Thirty days applies to some other duties. Check both the duty and its unit.

      '
  - text: 60 working days
    rationale: 'This extends the report period beyond the statute. A longer reporting cycle may sound practical. Check the stated year-end deadline.

      '
  explanation: 'Section 5(b) gives heads or other responsible officers forty-five working days from year-end to render the annual performance report.

    '
- id: q-code-of-conduct-ra-6713-duties-and-prohibited-acts-0006
  type: single_choice
  difficulty: medium
  stem: 'Under RA 6713''s implementing rules, failing to respond promptly within the public-letter deadline can be grounds for what?

    '
  choices:
  - text: Administrative discipline
    correct: true
  - text: Automatic dismissal without notice or a chance to answer the charge
    rationale: 'This confuses grounds for a case with an automatic penalty. Delay is a violation. Check whether disciplinary procedures still apply.

      '
  - text: Exemption from responsibility if the request was merely acknowledged
    rationale: 'This treats receipt acknowledgment as sufficient action. A reply was sent. Check whether it states what action was taken.

      '
  - text: A penalty imposed only when the writer proves a financial loss
    rationale: 'This adds a loss requirement. Damages can matter in other cases. Check whether the duty itself depends on financial harm.

      '
  explanation: 'The implementing rules treat failure to act promptly on public communications as a ground for administrative disciplinary action. This means a disciplinary case may be brought.

    '
- id: q-code-of-conduct-ra-6713-duties-and-prohibited-acts-0009
  type: single_choice
  difficulty: easy
  stem: 'Subject to lawful disclosure restrictions, when must public documents be available for inspection under Section 5(e)?

    '
  choices:
  - text: During reasonable working hours
    correct: true
  - text: Only after the general thirty-day delay for all document inspection requests
    rationale: 'This invents a blanket waiting period. Some filings have deadlines. Check the public-inspection duty itself.

      '
  - text: Only during an agency head's personal availability for each inspection request
    rationale: 'This adds personal approval to routine access. The agency head has authority. Check what the law makes readily available.

      '
  - text: Only for people who already work in the government office holding them
    rationale: 'This restricts public access to staff. Staff already use the records. Check who the inspection duty serves.

      '
  explanation: 'Section 5(e) requires public documents to be accessible and readily available for inspection during reasonable working hours. Other lawful disclosure limits still apply.

    '
- id: q-code-of-conduct-ra-6713-duties-and-prohibited-acts-0012
  type: single_choice
  difficulty: easy
  stem: 'What must the reply to a public letter or request state under Section 5(a)?

    '
  choices:
  - text: The action taken on the request
    correct: true
  - text: Only that the office received and logged the communication
    rationale: 'This treats acknowledgment as the required response. Logging is a useful first step. Check whether the writer learns what was done.

      '
  - text: Only the name of the official expected to handle it later
    rationale: 'This treats internal routing as sufficient. Naming an officer shows movement. Check whether the reply states an action.

      '
  - text: Only the general policies of the office without addressing the request
    rationale: 'This substitutes broad information for a response. Policies may be relevant. Check whether the particular request is addressed.

      '
  explanation: 'Section 5(a) says the reply must contain the action taken on the request.

    '
- id: q-code-of-conduct-ra-6713-duties-and-prohibited-acts-0017
  type: single_choice
  difficulty: medium
  approved: false
  stem: 'When an authorized signatory is absent, whom does Section 5(c) direct to sign on that official''s behalf?

    '
  choices:
  - text: The next-in-rank official or officer in charge
    correct: true
  - text: Any private applicant who needs the document urgently
    rationale: 'This treats urgency as signing authority. Prompt service matters. Check who can act within the office.

      '
  - text: Only the absent official, after returning regardless of delay
    rationale: 'This ignores the substitute-signing provision. The absent official normally signs. Check the rule for absence.

      '
  - text: The first available employee without regard to rank or designation
    rationale: 'This treats availability as authority. It could speed processing. Check the specified rank or assigned role.

      '
  explanation: 'Section 5(c) directs the official next in rank or the officer in charge to sign for the absent authorized signatory.

    '
- id: q-code-of-conduct-ra-6713-duties-and-prohibited-acts-0018
  type: single_choice
  difficulty: easy
  stem: |
    A properly designated government volunteer serves without pay and is exempt
    from SALN filing under the implementing rules. Which statement is correct?
  choices:
  - text: The volunteer is also exempt from the Code's gift restrictions.
    rationale: The exemption covers financial disclosures. It does not remove gift restrictions.
  - text: The volunteer remains subject to the Code's duties and prohibited acts.
    correct: true
  - text: The volunteer becomes covered by conduct rules only upon receiving pay.
    rationale: Pay does not determine coverage. Free-service volunteers remain subject to conduct rules.
  - text: The volunteer may choose which conduct rules to follow.
    rationale: The filing exemption gives no right to choose which duties and bans apply.
  explanation: |
    Free-service volunteers need not file a SALN under Rule XII. They must still
    follow the Code's duties and bans. The filing exemption is limited.
  approved: false
- id: q-code-of-conduct-ra-6713-duties-and-prohibited-acts-0019
  type: single_choice
  difficulty: easy
  stem: |
    An employee gives a friend a confidential agency file so the friend can gain
    an unfair advantage in a private deal. The employee receives no payment.
    Which assessment follows RA 6713?
  choices:
  - text: The disclosure is allowed because the employee received no payment.
    rationale: Personal payment is not required. Giving someone an unfair advantage through protected information is prohibited.
  - text: The disclosure is allowed because the recipient is a private citizen.
    rationale: A private recipient does not remove the protection given to confidential work information.
  - text: The disclosure is prohibited only if the file was obtained outside work.
    rationale: The ban covers confidential information learned through official work. It does not require an outside source.
  - text: The disclosure is prohibited because it gives an unfair private advantage.
    correct: true
  explanation: |
    Protected work information must not be shared to give an unfair advantage.
    The employee need not receive money for the disclosure to be prohibited.
  approved: false
- id: q-code-of-conduct-ra-6713-duties-and-prohibited-acts-0020
  type: single_choice
  difficulty: easy
  stem: |
    A business offers a public employee a low-value gift in exchange for favorable
    action on its pending application. The employee argues that the gift is too
    inexpensive to be prohibited. Which response is correct?
  choices:
  - text: The employee must refuse because the gift is offered for an official favor.
    correct: true
  - text: The employee may accept because low value alone establishes a gift exception.
    rationale: Gift exceptions have conditions. Low value alone does not permit a gift offered for favorable treatment.
  - text: The employee may accept if the gift arrives after the favorable action.
    rationale: Later delivery does not remove the gift's link to the official favor.
  - text: The employee may accept if the business gives the gift outside office hours.
    rationale: The link to official duties matters. Giving the gift outside office hours does not remove that link.
  explanation: |
    The business offers the gift for favorable official action. The employee
    must refuse it. A low price does not make that exchange acceptable.
  approved: false
- id: q-code-of-conduct-ra-6713-duties-and-prohibited-acts-0021
  type: single_choice
  difficulty: medium
  stem: |
    An office receives a written request but cannot proceed because required
    papers are missing. Which response best meets its service duties?
  choices:
  - text: Keep the request unanswered until the applicant supplies every paper.
    rationale: Missing papers may delay completion. They do not automatically excuse silence about the request.
  - text: Send only a receipt and leave the applicant to identify what is missing.
    rationale: A receipt alone does not state the action taken or identify the missing requirements.
  - text: Explain the action taken, name the missing papers, give a reasonable submission period, and identify the worker in charge.
    correct: true
  - text: Return the request without explanation because incomplete requests require no reply.
    rationale: Incomplete papers do not remove the duty to answer and explain what the applicant must provide.
  explanation: |
    The office should explain its action and list the missing papers. It should
    give a reasonable period to submit them and name the worker in charge.
    Missing papers can delay completion, but the office still needs to reply.
  approved: false
- id: q-code-of-conduct-ra-6713-duties-and-prohibited-acts-0022
  type: single_choice
  difficulty: medium
  stem: |
    A regional office receives a written request that another government office
    should handle. It knows which office has authority. What should it do?
  choices:
  - text: File the request without action because it was addressed to the wrong office.
    rationale: Lack of authority to decide the request does not justify ignoring it.
  - text: Refer the request to the proper office and inform the sender.
    correct: true
  - text: Forward the request without telling the sender where it went.
    rationale: Referral should include notice to the sender. Forwarding alone omits that duty.
  - text: Decide the request itself to avoid the need for a referral.
    rationale: Prompt service does not give an office authority over a matter assigned to another office.
  explanation: |
    The receiving office should send the request to the office that can act.
    It should also tell the sender about the referral. A wrong address is not
    a reason to ignore the request.
  approved: false
- id: q-code-of-conduct-ra-6713-duties-and-prohibited-acts-0023
  type: single_choice
  difficulty: medium
  stem: |
    A visitor brings complete papers for a routine service during office hours.
    The counter employee can attend immediately but tells the visitor to return
    later, citing the written-reply period. Which assessment is correct?
  choices:
  - text: The delay is allowed because the written-reply period applies to every service.
    rationale: The written-reply deadline does not authorize needless delays for visitors seeking service in person.
  - text: The employee need not act until the visitor files a written complaint.
    rationale: The duty to attend promptly exists before any complaint is filed.
  - text: Complete papers allow the employee to postpone service without a reason.
    rationale: Complete papers support prompt handling. They do not justify postponement.
  - text: The employee must attend promptly because the stated deadline does not justify this delay.
    correct: true
  explanation: |
    Workers must promptly attend to people seeking service in person. A routine
    request that can be settled at once should not face an unjustified delay.
  approved: false
- id: q-code-of-conduct-ra-6713-duties-and-prohibited-acts-0024
  type: single_choice
  difficulty: hard
  stem: |
    No law or valid rule sets a completion deadline for a certain document.
    Employees disagree about how long processing should take. Under the
    implementing rules, what is the proper approach?
  choices:
  - text: The agency head must set a reasonable period through rules that consider the work and relevant conditions.
    correct: true
  - text: Each employee may select a deadline based only on personal workload.
    rationale: Workers do not have a free choice of deadline. The agency head must set rules when no deadline exists.
  - text: The office must use the public-letter reply deadline as the final completion deadline in every case.
    rationale: A timely reply and final completion are different duties. Complexity and other relevant conditions affect reasonable completion time.
  - text: The office may leave completion open indefinitely because no law sets a deadline.
    rationale: The absence of a legal deadline requires agency rules setting a reasonable period. It does not permit endless delay.
  explanation: |
    The agency head must set a reasonable period when no deadline already
    applies. The rules must consider the work, its complexity, and relevant
    conditions. Each worker cannot simply choose a deadline.
  approved: false
- id: q-code-of-conduct-ra-6713-duties-and-prohibited-acts-0025
  type: single_choice
  difficulty: hard
  stem: |
    A citizen requests an investigation record that would identify a confidential
    source. Disclosure would expose that source. Which is the strongest lawful
    basis for withholding the protected information?
  choices:
  - text: Every record about an unfinished matter is automatically secret.
    rationale: Unfinished status alone does not make every record secret. A lawful disclosure restriction must apply.
  - text: The agency wants to avoid unfavorable public attention.
    rationale: Avoiding public attention is not a lawful reason to deny access.
  - text: The implementing rules protect information that would expose a confidential source.
    correct: true
  - text: Public inspection is limited to employees of the investigating agency.
    rationale: Public access is not generally limited to agency employees. Specific lawful restrictions determine what may be withheld.
  explanation: |
    Public access has lawful limits. The rules protect confidential sources in
    investigations. The office must rely on that protection, not merely on the
    fact that the matter is unfinished.
  approved: false
- id: q-code-of-conduct-ra-6713-duties-and-prohibited-acts-0026
  type: single_choice
  difficulty: hard
  stem: |
    An employee holds a financial stake through a nominee in a transaction that
    needs approval from the employee's office. The employee does not personally
    sign the approval. Which statement correctly applies the Code?
  choices:
  - text: The stake is allowed because it is held through another person.
    rationale: The ban covers indirect interests held through another person as well as direct interests.
  - text: The stake is prohibited because the transaction requires approval from the employee's office.
    correct: true
  - text: The stake is allowed unless the employee personally signs the approval.
    rationale: The rule concerns transactions requiring the office's approval. It is not limited to the employee who signs.
  - text: The stake is prohibited only if the transaction has already earned a profit.
    rationale: A financial interest does not have to produce a profit before the prohibition applies.
  explanation: |
    The Code bars a direct or indirect financial stake in a transaction requiring
    the worker's office to approve it. Using a nominee does not remove the stake.
    The worker need not be the person who signs the approval.
  approved: false
- id: q-code-of-conduct-ra-6713-duties-and-prohibited-acts-0027
  type: single_choice
  difficulty: hard
  stem: |
    An agency employee is offered a trustee role in a private business supervised
    by that agency. The supervisor approves the arrangement, but no law expressly
    permits it. Which assessment is correct?
  choices:
  - text: The arrangement is allowed because the supervisor approved it.
    rationale: A supervisor's approval cannot replace express permission in law for this covered role.
  - text: The arrangement is allowed because only owners and managers are covered.
    rationale: The ban includes trustees and other listed roles. It is not limited to owners and managers.
  - text: The arrangement is allowed because supervision differs from licensing.
    rationale: The ban covers businesses regulated, supervised, or licensed by the office. Licensing is not the only basis.
  - text: The arrangement is prohibited because trustee is a covered role and no law expressly permits it.
    correct: true
  explanation: |
    The ban includes serving as a trustee for a business the office supervises.
    Express permission in law is needed for the exception. A supervisor's
    approval alone is not enough.
  approved: false
- id: q-code-of-conduct-ra-6713-duties-and-prohibited-acts-0028
  type: single_choice
  difficulty: exam
  stem: |
    A government professional has valid legal authority to serve private clients.
    A proposed engagement would tend to conflict with public duties, although no
    actual conflict has occurred yet. May the professional accept it on these facts?
  choices:
  - text: No, because private work must neither conflict nor tend to conflict with public duties.
    correct: true
  - text: Yes, because valid legal authority removes the separate conflict restriction.
    rationale: Authority to practice does not permit work that conflicts or tends to conflict with public duties.
  - text: Yes, because only an actual conflict can make private practice prohibited.
    rationale: The restriction also covers work that tends to conflict. An actual conflict need not occur first.
  - text: No, because all private professional practice by government workers is prohibited.
    rationale: Authorized private practice can be allowed when it does not conflict or tend to conflict with public duties.
  explanation: |
    Legal authority is only one requirement. The private work must also avoid
    conflict with public duties. Work that tends to conflict fails this test
    even before an actual conflict occurs.
  approved: false
- id: q-code-of-conduct-ra-6713-duties-and-prohibited-acts-0029
  type: single_choice
  difficulty: exam
  stem: |
    During the first year after leaving an agency, a lawyer proposes representing
    a private client in a matter before that agency. The lawyer claims resignation
    ended the restriction. Which statement correctly describes the applicable limit?
  choices:
  - text: Resignation immediately removes the restriction on matters before the former agency.
    rationale: The restriction continues for one year after departure. Resignation does not end it immediately.
  - text: The restriction bars all professional work for any private client during that year.
    rationale: This limit concerns matters before the former office. It does not prohibit every professional engagement everywhere.
  - text: The lawyer cannot practice on this matter before the former agency during that year.
    correct: true
  - text: The restriction applies only to former workers who were dismissed.
    rationale: The post-employment limit is not confined to dismissal. Leaving through resignation does not avoid it.
  explanation: |
    For one year after leaving, the lawyer cannot practice on a matter before
    the former office. This specific limit does not ban every private legal job.
  approved: false
- id: q-code-of-conduct-ra-6713-duties-and-prohibited-acts-0030
  type: single_choice
  difficulty: exam
  stem: |
    An employment officer's assigned public duties require referring qualified
    job seekers to employers. The officer makes such a referral to a business
    with a pending agency transaction. Which statement best applies the rules?
  choices:
  - text: The referral is necessarily prohibited because every pending transaction defeats every exception.
    rationale: The rules recognize an exception for referrals required by assigned public duties. A pending transaction alone does not defeat it.
  - text: The referral falls within the exception for referrals required by assigned public duties.
    correct: true
  - text: The referral is allowed because the recommendation ban applies only after leaving office.
    rationale: The ban applies during service and continues afterward. The assigned-duty exception is what matters here.
  - text: The referral is allowed because pending dealings are excluded from the recommendation ban.
    rationale: The general ban covers both regular and pending official dealings. Pending status is not an exemption.
  explanation: |
    The general rule bars certain job recommendations to businesses dealing with
    the office. The rules allow referrals required by assigned public duties.
    The stated referral meets that exception.
  approved: false
