- id: q-code-of-conduct-ra-6713-norms-of-conduct-0016
  type: single_choice
  difficulty: easy
  approved: false
  stem: 'Which office practice most directly demonstrates responsiveness to the public?

    '
  choices:
  - text: Publishing clear steps for obtaining a service
    correct: true
  - text: Displaying luxury possessions at each staff celebration
    rationale: 'This treats visible status as good service. Celebrations can seem to promote morale. Check whether the action helps users obtain a service.

      '
  - text: Giving supporters of the elected mayor a separate priority queue
    rationale: 'This mistakes selective speed for responsiveness. A priority queue serves some people quickly. Check whether access is fair across party preference.

      '
  - text: Using office supplies for an employee's home business projects
    rationale: 'This treats saving personal costs as efficient public service. Supplies are already available. Check whose purpose they serve.

      '
  explanation: 'Responsiveness includes explaining policies and procedures clearly. Publishing clear steps helps people understand how to obtain a service.

    '
