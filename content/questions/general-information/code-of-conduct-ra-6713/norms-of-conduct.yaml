- id: q-code-of-conduct-ra-6713-norms-of-conduct-0001
  type: single_choice
  difficulty: easy
  stem: 'Under Section 4 of RA 6713, how many norms of conduct are listed?

    '
  choices:
  - text: '8'
    correct: true
  - text: '10'
    rationale: 'This counts duties inside norms as extra norms. Section 4 contains several subduties. Check the eight named headings.

      '
  - text: '12'
    rationale: 'This treats a longer ethics checklist as the statutory list. Other codes can contain more items. Count only Section 4''s named norms.

      '
  - text: '15'
    rationale: 'This confuses a familiar response-deadline number with a norm count. Fifteen appears elsewhere in RA 6713. Check the unit being asked.

      '
  explanation: 'Section 4 lists eight norms. Count the named norms, not the individual duties within each norm.

    '
- id: q-code-of-conduct-ra-6713-norms-of-conduct-0002
  type: single_choice
  difficulty: easy
  stem: 'Which norm most directly requires efficient use of public funds and priority for public needs?

    '
  choices:
  - text: Public interest
    correct: true
  - text: Nationalism and patriotism
    rationale: 'This substitutes loyalty to the Republic and Filipino people for the specific rule asked about. Both concern responsible public service, so the label can seem suitable. Check the clue about efficient use of funds.

      '
  - text: Commitment to democracy
    rationale: 'This substitutes constitutional accountability and civilian authority for the specific rule asked about. Both concern responsible public service, so the label can seem suitable. Check the clue about efficient use of funds.

      '
  - text: Public responsiveness
    rationale: 'This substitutes prompt service and clear procedures for the specific rule asked about. Both concern responsible public service, so the label can seem suitable. Check the clue about efficient use of funds.

      '
  explanation: 'Commitment to public interest places public needs above personal interests. It also requires efficient, honest, and economical use of government resources.

    '
