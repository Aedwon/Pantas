- id: q-code-of-conduct-ra-6713-norms-of-conduct-0020
  type: single_choice
  difficulty: exam
  approved: false
  stem: 'Which principle is expressly part of commitment to democracy under Section 4(g)?

    '
  choices:
  - text: Civilian authority is supreme over the military.
    correct: true
  - text: Military authority may override civilian institutions whenever it chooses.
    rationale: 'This reverses the civilian-authority rule. Military power can seem decisive. Check who has constitutional supremacy.

      '
  - text: Loyalty to a powerful individual takes priority over the Constitution.
    rationale: 'This substitutes personal loyalty for constitutional loyalty. A leader may hold authority. Check the priority expressly stated in Section 4(g).

      '
  - text: A public employee's party controls which citizens may receive service.
    rationale: 'This treats a party''s influence as control over public services. Parties form governments. Check the duties owed to the public as a whole.

      '
  explanation: 'Section 4(g) requires officials to show the supremacy of civilian authority over the military. This is an express democratic principle.

    '
