- id: q-code-of-conduct-ra-6713-norms-of-conduct-0011
  type: single_choice
  difficulty: easy
  stem: 'Which proposed norm is NOT a named Section 4 norm?

    '
  choices:
  - text: Efficiency
    correct: true
  - text: Simple living
    rationale: 'This misses the negative wording. Simple living is an ethical duty, so it may seem like an answer. Check whether the question asks for a named norm or an omission.

      '
  - text: Political neutrality
    rationale: 'This misses the word NOT. Party fairness is a familiar duty. Check whether political neutrality appears in the list.

      '
  - text: Public interest
    rationale: 'This mistakes a broad norm for an unlisted principle. Its wording sounds general. Compare it with the Section 4 headings.

      '
  explanation: 'Administrative efficiency is not a named norm in the eight-item list. Efficient use of resources is a duty within commitment to public interest.

    '
- id: q-code-of-conduct-ra-6713-norms-of-conduct-0012
  type: single_choice
  difficulty: medium
  stem: 'Which reading of the simple-living norm is accurate?

    '
  choices:
  - text: It covers officials' families as well as officials.
    correct: true
  - text: It applies only to elected officials and never to their family members.
    rationale: 'This limits the rule to elected officials. Election draws public attention. Check the law''s inclusion of employees and families.

      '
  - text: It permits any display of wealth once an official has a high salary.
    rationale: 'This treats salary as permission for ostentatious display. Lifestyle is linked to income. Check the separate ban on extravagant display.

      '
  - text: It requires every household to have exactly the same income and lifestyle.
    rationale: 'This confuses modest living with identical living. Equality sounds fair. Check the phrase appropriate to position and income.

      '
  explanation: 'Section 4(h) applies modest-living duties to officials, employees, and their families. Their lifestyle must be appropriate to position and income.

    '
