meta:
  subject: general-information
  topic: code-of-conduct-ra-6713
  subtopic: statements-of-assets-and-divestment
  exams:
    - cse-pro
    - cse-sub
questions:
  - id: q-code-of-conduct-ra-6713-statements-of-assets-and-divestment-0001
    type: single_choice
    difficulty: easy
    stem: |
      Within how many days from assumption of office must a public official file a sworn SALN?
    choices:
      - text: 30 days
        correct: true
      - text: 45 days
        rationale: |
          You picked 45 days, which is the deadline for annual performance reports. SALN filings upon assumption of office must be submitted within 30 days.
      - text: 60 days
        rationale: |
          You selected 60 days, which is the timeframe for business shareholding divestment. Filing a SALN upon entering office must happen within 30 days.
      - text: 90 days
        rationale: |
          You chose 90 days, which is three times the statutory limit. Section 8 requires new public officers to file a SALN within 30 days of entry.
    explanation: |
      Section 8(A)(a) requires a public official to file a SALN within 30 days after assumption of office.

  - id: q-code-of-conduct-ra-6713-statements-of-assets-and-divestment-0002
    type: single_choice
    difficulty: easy
    stem: |
      What is the annual deadline for filing the Statement of Assets, Liabilities and Net Worth under RA 6713?
    choices:
      - text: On or before April 30
        correct: true
      - text: On or before December 31
        rationale: |
          You selected December 31, which is the end of the covered tax and calendar year. The annual SALN filing deadline is on or before April 30.
      - text: On or before September 30
        rationale: |
          You picked September 30, which falls in the third quarter. Section 8 mandates annual SALN submission on or before April 30 of each year.
      - text: On or before November 30
        rationale: |
          You chose November 30, which misses the statutory spring deadline. Annual SALN filings must be submitted on or before April 30.
    explanation: |
      Section 8(A)(b) mandates annual filing on or before April 30 of every year, reckoned as of the end of the preceding year.

  - id: q-code-of-conduct-ra-6713-statements-of-assets-and-divestment-0003
    type: single_choice
    difficulty: easy
    stem: |
      Within how many days from separation from service must a public officer file the final SALN?
    choices:
      - text: 30 days
        correct: true
      - text: 15 days
        rationale: |
          You selected 15 days, which is shorter than the statutory allowance. Officials separating from government service have 30 days to file their SALN.
      - text: 60 days
        rationale: |
          You picked 60 days, which doubles the allowed timeframe. Section 8 mandates filing a final SALN within 30 days after separation from service.
      - text: 90 days
        rationale: |
          You chose 90 days, which is three times the legal allowance. Final SALN filings after leaving government service are due within 30 days.
    explanation: |
      Section 8(A)(c) requires filing a SALN within 30 days after separation from service.

  - id: q-code-of-conduct-ra-6713-statements-of-assets-and-divestment-0004
    type: single_choice
    difficulty: medium
    stem: |
      Up to what civil degree of consanguinity or affinity must public officials disclose relatives in government service?
    choices:
      - text: Fourth civil degree
        correct: true
      - text: Second civil degree
        rationale: |
          You selected second civil degree, which is too narrow. Disclosure extends to the fourth civil degree.
      - text: Third civil degree
        rationale: |
          You picked third civil degree, which stops short of the statutory fourth civil degree.
      - text: Fifth civil degree
        rationale: |
          You chose fifth civil degree, which exceeds the statutory coverage.
    explanation: |
      RA 6713 defines relatives through the fourth civil degree of consanguinity or affinity, and Section 8(B) requires disclosure of relatives in government in the manner prescribed by the Civil Service Commission.

  - id: q-code-of-conduct-ra-6713-statements-of-assets-and-divestment-0005
    type: single_choice
    difficulty: medium
    stem: |
      Under RA 6713, to resolve a conflict of interest, within how many days from assumption of office must shareholdings be divested?
    choices:
      - text: 60 days
        correct: true
      - text: 30 days
        rationale: |
          You picked 30 days, which is the deadline for resignation from a private position. Divesting shareholdings is allowed up to 60 days from assumption of office.
      - text: 45 days
        rationale: |
          You selected 45 days, which is not a statutory divestment milestone.
      - text: 90 days
        rationale: |
          You chose 90 days, which exceeds the statutory divestment period.
    explanation: |
      Section 9 requires a public official or employee with a conflict of interest to resign from a position in a private business enterprise within 30 days from assumption of office and/or divest shareholdings or interest within 60 days from assumption of office.

  - id: q-code-of-conduct-ra-6713-statements-of-assets-and-divestment-0006
    type: single_choice
    difficulty: medium
    stem: |
      To resolve a conflict of interest, within how many days must a public officer resign from a private position?
    choices:
      - text: 30 days
        correct: true
      - text: 15 days
        rationale: |
          You selected 15 days, which is half the legal timeframe. Section 9 gives public officers 30 days from assumption to resign from private positions.
      - text: 60 days
        rationale: |
          You picked 60 days, which is the deadline for divesting shareholdings. Resigning from a private position must happen sooner, within 30 days.
      - text: 90 days
        rationale: |
          You chose 90 days, which is three times the statutory limit. Public officers must resign from conflicting private positions within 30 days.
    explanation: |
      Section 9 specifies that resignation from any position in a private business enterprise must occur within 30 days from assumption of office.

  - id: q-code-of-conduct-ra-6713-statements-of-assets-and-divestment-0007
    type: single_choice
    difficulty: medium
    stem: |
      After how many working days from filing must a SALN be made available for copying or reproduction under Section 8(C)?
    choices:
      - text: 10 working days
        correct: true
      - text: 5 working days
        rationale: |
          You selected 5 working days, but Section 8(C) requires a filed SALN to be available for copying or reproduction after 10 working days.
      - text: 15 working days
        rationale: |
          You picked 15 working days, which is not the SALN copying deadline in Section 8(C). The statute specifies 10 working days.
      - text: 30 working days
        rationale: |
          You chose 30 working days, but Section 8(C) makes the statement available for copying or reproduction after 10 working days.
    explanation: |
      Section 8(C) makes a filed SALN available for public inspection at reasonable hours and makes it available for copying or reproduction after 10 working days from filing. The 10-day period does not delay inspection itself.

  - id: q-code-of-conduct-ra-6713-statements-of-assets-and-divestment-0008
    type: single_choice
    difficulty: medium
    stem: |
      For how many years must filed SALN documents be preserved before destruction?
    choices:
      - text: 10 years
        correct: true
      - text: 5 years
        rationale: |
          You picked 5 years, which cuts the public-availability period in half.
      - text: 15 years
        rationale: |
          You selected 15 years, which exceeds the standard statutory period.
      - text: 20 years
        rationale: |
          You chose 20 years, which doubles the statutory period.
    explanation: |
      Section 8(C) provides that a filed statement remains available to the public for 10 years after receipt, after which it may be destroyed unless needed in an ongoing investigation.

  - id: q-code-of-conduct-ra-6713-statements-of-assets-and-divestment-0009
    type: single_choice
    difficulty: hard
    stem: |
      Where do Cabinet members, undersecretaries, and heads of GOCCs file their SALN under RA 6713?
    choices:
      - text: Office of the President
        correct: true
      - text: Civil Service Commission headquarters
        rationale: |
          The Civil Service Commission is the repository for public officials and employees not assigned to another listed repository. National executive officials file with the Office of the President.
      - text: Office of the Ombudsman central unit
        rationale: |
          Constitutional and national elective officials file with the national Office of the Ombudsman, while national executive officials file with the Office of the President.
      - text: Supreme Court Clerk of Court office
        rationale: |
          Justices file with the Clerk of Court of the Supreme Court, not executive officials.
    explanation: |
      Section 8(A) assigns national executive officials to the Office of the President as their filing repository.

  - id: q-code-of-conduct-ra-6713-statements-of-assets-and-divestment-0010
    type: single_choice
    difficulty: hard
    stem: |
      Where do Members of Congress file their Statement of Assets, Liabilities and Net Worth under RA 6713?
    choices:
      - text: Secretary of Senate or House
        correct: true
      - text: Civil Service Commission central unit
        rationale: |
          Members of Congress have specifically designated repositories in their respective chambers.
      - text: Supreme Court Clerk of Court office
        rationale: |
          The Clerk of Court receives SALNs of Supreme Court Justices.
      - text: Office of the President director
        rationale: |
          National executive officials file with the Office of the President, not Members of Congress.
    explanation: |
      Senators file with the Secretary of the Senate, while Members of the House file with the Secretary of the House of Representatives.

  - id: q-code-of-conduct-ra-6713-statements-of-assets-and-divestment-0011
    type: single_choice
    difficulty: hard
    stem: |
      Where do non-executive public employees not specifically assigned to constitutional offices file their SALN?
    choices:
      - text: Civil Service Commission
        correct: true
      - text: Office of the Ombudsman director
        rationale: |
          The Ombudsman receives specifically listed categories, while the residual statutory category files with the Civil Service Commission.
      - text: Office of the President main desk
        rationale: |
          The Office of the President receives national executive officials.
      - text: Department of Justice secretariat
        rationale: |
          The Department of Justice is not the residual SALN repository named in Section 8(A).
    explanation: |
      Section 8(A) sends all other public officials and employees covered by the referenced law to the Civil Service Commission when no specifically listed repository applies.

  - id: q-code-of-conduct-ra-6713-statements-of-assets-and-divestment-0012
    type: single_choice
    difficulty: medium
    stem: |
      Besides the official, whose assets and business interests must be included in the official's SALN filing?
    choices:
      - text: Spouse and unmarried children under 18 in household
        correct: true
      - text: Spouse, parents, adult children, and business partners
        rationale: |
          This expands the statutory household coverage beyond the spouse and qualifying minor unmarried children.
      - text: Unmarried children under 21 and all immediate siblings
        rationale: |
          The statute specifies unmarried children under 18 living in the household, not children under 21 and siblings.
      - text: Spouse and all financially dependent extended relatives
        rationale: |
          Extended dependent relatives are not included in the statutory SALN household category.
    explanation: |
      Section 8 includes the official's spouse and unmarried children under 18 years of age living in the household.

  - id: q-code-of-conduct-ra-6713-statements-of-assets-and-divestment-0013
    type: single_choice
    difficulty: hard
    stem: |
      Where do Regional and local officials, as well as state university employees, file their SALN under RA 6713?
    choices:
      - text: Deputy Ombudsman of their region
        correct: true
      - text: Office of the President legal desk
        rationale: |
          The Office of the President is the repository for specified national executive officials.
      - text: Civil Service Commission main desk
        rationale: |
          The CSC is the residual repository for officials and employees not assigned elsewhere.
      - text: Supreme Court Administrator office
        rationale: |
          The Court Administrator is the repository for judges.
    explanation: |
      Regional and local officials and employees file with the Deputy Ombudsman in their respective regions. Current SALN repository guidance likewise places state college and university personnel under the appropriate regional Deputy Ombudsman repository.

  - id: q-code-of-conduct-ra-6713-statements-of-assets-and-divestment-0014
    type: single_choice
    difficulty: hard
    stem: |
      Where do Justices of the Supreme Court file their Statement of Assets, Liabilities and Net Worth?
    choices:
      - text: Clerk of the Supreme Court
        correct: true
      - text: Office of the Ombudsman main desk
        rationale: |
          Supreme Court Justices have a specifically designated judicial repository.
      - text: Civil Service Commission director
        rationale: |
          The CSC is not the specified repository for Supreme Court Justices.
      - text: Secretary of the House of Reps
        rationale: |
          The House Secretary receives filings of Members of the House, not Supreme Court Justices.
    explanation: |
      Section 8(A) designates the Clerk of Court of the Supreme Court as the repository for Justices.

  - id: q-code-of-conduct-ra-6713-statements-of-assets-and-divestment-0015
    type: single_choice
    difficulty: hard
    stem: |
      Where do Trial Court Judges file their SALN under RA 6713?
    choices:
      - text: Court Administrator
        correct: true
      - text: Office of the President
        rationale: |
          The Office of the President receives specified national executive officials.
      - text: Secretary of the Senate
        rationale: |
          The Senate Secretary receives filings of Senators.
      - text: Ombudsman Central Office
        rationale: |
          Judges have a specifically designated judicial repository.
    explanation: |
      Section 8(A) specifies that Judges file with the Court Administrator.
