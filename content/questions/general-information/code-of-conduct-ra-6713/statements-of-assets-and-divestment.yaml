    '
- id: q-code-of-conduct-ra-6713-statements-of-assets-and-divestment-0016
  type: single_choice
  difficulty: easy
  approved: false
  stem: 'A conflict arises after an employee is already in government service. Under the implementing rules, when do the resignation and divestment periods begin?

    '
  choices:
  - text: When the conflict arises
    correct: true
  - text: Only when the employee next receives a promotion
    rationale: 'This adds a promotion trigger. A new role can create conflicts. Check whether this conflict already exists.

      '
  - text: Only at the next annual SALN filing deadline
    rationale: 'This ties resolving conflicts to routine disclosure. Both concern private interests. Check the rule''s separate conflict trigger.

      '
  - text: From the original appointment date even if no conflict existed then
    rationale: 'This applies assumption-based timing to a later conflict. The statute mentions assumption of office. Check the implementing rule for employees already serving.

      '
  explanation: 'For an employee already in service, the implementing rules reckon the periods from the date the conflict arose.

    '
- id: q-code-of-conduct-ra-6713-statements-of-assets-and-divestment-0017
  type: single_choice
  difficulty: medium
  approved: false
  stem: 'A SALN has been held for eleven years and is needed in an ongoing investigation. What does Section 8(C) allow?

    '
  choices:
  - text: Retain it for the investigation
    correct: true
  - text: Destroy it automatically because ten years have passed
    rationale: 'This treats the ordinary period as an absolute destruction command. The ten-year limit is explicit. Check the investigation exception.

      '
  - text: Erase financial details but keep the official's name only
    rationale: 'This invents partial destruction. Keeping some record may sound sufficient. Check what the ongoing investigation needs.

      '
  - text: Keep it only if the official who filed it personally agrees
    rationale: 'This adds the subject''s permission. The record concerns the official. Check the statutory retention exception.

      '
  explanation: 'Section 8(C) permits destruction after the normal period only when the statement is not needed in an ongoing investigation. This statement is still needed.

    '
- id: q-code-of-conduct-ra-6713-statements-of-assets-and-divestment-0018
  type: single_choice
  difficulty: hard
  approved: false
  stem: 'Which relative must be included in the family financial disclosures described in the lesson?

    '
  choices:
  - text: An unmarried sixteen-year-old child in the household
    correct: true
  - text: A married sixteen-year-old child living in the same household
    rationale: 'This ignores the unmarried condition. Age and residence both fit. Check all three conditions together.

      '
  - text: An unmarried twenty-year-old child living in the same household
    rationale: 'This ignores the under-eighteen condition. Residence and unmarried status fit. Check the age cutoff.

      '
  - text: An unmarried sixteen-year-old child living in a separate household
    rationale: 'This ignores the household condition. Age and unmarried status fit. Check where the child lives.

      '
  explanation: 'The child is unmarried, under eighteen, and living in the household. Those are the conditions stated in Section 8.

    '
- id: q-code-of-conduct-ra-6713-statements-of-assets-and-divestment-0019
  type: single_choice
  difficulty: hard
  approved: false
  stem: 'Which pair correctly matches the conflict-of-interest deadlines for a newly appointed official?

    '
  choices:
  - text: Resign within 30 days; divest within 60 days
    correct: true
  - text: Resign within 60 days; divest within 30 days
    rationale: 'This reverses the two periods. Both numbers are familiar. Match each period to the action.

      '
  - text: Resign within 15 days; divest within 45 days
    rationale: 'Both periods are too short. Section 9 gives thirty days for resignation and sixty days for divestment.

      '
  - text: Resign within 30 working days; divest within 60 working days
    rationale: 'This changes ordinary days into working days. Other official duties use working days. Check whether that qualifier appears here.

      '
  explanation: 'Section 9 gives thirty days for resignation from the conflicting private position and sixty days for divestment. These periods run from assumption when the conflict exists then.

    '
- id: q-code-of-conduct-ra-6713-statements-of-assets-and-divestment-0020
  type: single_choice
  difficulty: exam
  approved: false
  stem: 'Under the statutory repository list, what fact sends an armed-forces officer''s SALN to the Office of the President?

    '
  choices:
  - text: Holding the rank of colonel or naval captain or higher
    correct: true
  - text: Being any commissioned officer regardless of rank or equivalent grade
    rationale: 'This removes the rank threshold. All officers serve nationally. Check the specified minimum ranks.

      '
  - text: Being below colonel or naval captain and serving outside the capital region
    rationale: 'This selects the lower-rank category. The officer still belongs to the armed forces. Check the distinct regional repository rule.

      '
  - text: Having a private business interest even while below the specified military rank
    rationale: 'This substitutes asset type for rank. Private interests must be disclosed. Check what determines the filing office.

      '
  explanation: 'RA 6713 assigns armed-forces officers from colonel or naval captain upward to the Office of the President. Officers below those ranks go to the appropriate regional Deputy Ombudsman.

    '
