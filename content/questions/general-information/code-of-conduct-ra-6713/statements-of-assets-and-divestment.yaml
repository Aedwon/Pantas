questions:
- id: q-code-of-conduct-ra-6713-statements-of-assets-and-divestment-0001
  type: single_choice
  difficulty: easy
  stem: 'Within how many days after assuming office must a covered official file the initial sworn SALN?

    '
  choices:
  - text: 30 days
    correct: true
  - text: 45 days
    rationale: 'This gives too much time. Initial filing is due within thirty days after assumption of office.

      '
  - text: 60 days
    rationale: 'This uses the divestment period. Both can follow assumption of office. Check the duty and whether the period uses working days.

      '
  - text: 90 days
    rationale: 'This treats a quarter as the filing period. Quarterly reports are common. Check the duty and whether the period uses working days.

      '
  explanation: 'Section 8(A) requires initial filing within thirty days after assumption of office.

    '
- id: q-code-of-conduct-ra-6713-statements-of-assets-and-divestment-0002
  type: single_choice
  difficulty: easy
  stem: 'What is RA 6713''s annual SALN deadline after the initial filing?

    '
  choices:
  - text: April 30
    correct: true
  - text: December 31
    rationale: 'This uses year-end as the filing deadline. The annual SALN is due on or before April 30.

      '
  - text: June 30
    rationale: 'This puts the deadline two months too late. The annual SALN is due on or before April 30.

      '
  - text: March 31
    rationale: 'This substitutes a quarterly cutoff. The first quarter ends then. Check the duty and whether the period uses working days.

      '
  explanation: 'The annual statement must be filed on or before April 30 of every year thereafter.

    '
- id: q-code-of-conduct-ra-6713-statements-of-assets-and-divestment-0003
  type: single_choice
  difficulty: easy
  stem: 'Within how many days after separation must a covered official file the final SALN?

    '
  choices:
  - text: 30 days
    correct: true
  - text: 15 days
    rationale: 'This gives too little time. Filing is due within thirty days after separation from service.

      '
  - text: 60 days
    rationale: 'This uses the share-divestment number. Both can involve ending a role. Check the duty and whether the period uses working days.

      '
  - text: 90 days
    rationale: 'This substitutes a quarterly period. Final accounts can sound like a quarterly task. Check the duty and whether the period uses working days.

      '
  explanation: 'Section 8(A) requires filing within thirty days after separation from service.

    '
- id: q-code-of-conduct-ra-6713-statements-of-assets-and-divestment-0004
  type: single_choice
  difficulty: medium
  stem: 'Through what civil degree does RA 6713 define relatives for disclosure of relatives in government?

    '
  choices:
  - text: Fourth degree
    correct: true
  - text: Second civil degree
    rationale: 'This narrows coverage to closer relations. Close family is easiest to recall. Check the law''s defined reach.

      '
  - text: Third civil degree
    rationale: 'This stops the list one degree too early. Several familiar relatives fall within it. Check the outer degree stated.

      '
  - text: Fifth civil degree
    rationale: 'This extends coverage beyond the definition. More disclosure can sound safer. Use the statutory definition.

      '
  explanation: 'RA 6713 defines relatives within the fourth civil degree of consanguinity or affinity. Section 8(B) requires disclosure to the best of the official''s knowledge and information.

    '
- id: q-code-of-conduct-ra-6713-statements-of-assets-and-divestment-0005
  type: single_choice
  difficulty: medium
  stem: 'For a conflict existing on assumption of office, within how many days must the relevant shareholdings be divested under Section 9?

    '
  choices:
  - text: 60 days
    correct: true
  - text: 30 days
    rationale: 'This uses the private-position resignation deadline. Both address the same conflict. Check the duty and whether the period uses working days.

      '
  - text: 45 days
    rationale: 'This gives too little time. The divestment period is sixty days after assumption of office.

      '
  - text: 90 days
    rationale: 'This adds another month to the period. Disposing of shares can take time. Check the duty and whether the period uses working days.

      '
  explanation: 'Section 9 sets sixty days from assumption of office for divesting the relevant shareholdings or interest when the conflict exists.

    '
- id: q-code-of-conduct-ra-6713-statements-of-assets-and-divestment-0006
  type: single_choice
  difficulty: medium
  stem: 'For a conflict existing on assumption of office, what is the deadline to resign from the conflicting private business position?

    '
  choices:
  - text: 30 days
    correct: true
  - text: 15 days
    rationale: 'This gives too little time. Resignation is due within thirty days after assumption of office.

      '
  - text: 60 days
    rationale: 'This uses the share-divestment deadline. Resignation and divestment address the same conflict. Check the duty and whether the period uses working days.

      '
  - text: 90 days
    rationale: 'This substitutes a longer transition period. Leaving a business can involve a handover. Check the duty and whether the period uses working days.

      '
  explanation: 'Section 9 sets thirty days from assumption of office for resigning from the conflicting private business position.

    '
- id: q-code-of-conduct-ra-6713-statements-of-assets-and-divestment-0007
  type: single_choice
  difficulty: medium
  stem: 'After how many working days from filing does Section 8(C) make a SALN available for copying?

    '
  choices:
  - text: 10 working days
    correct: true
  - text: 5 working days
    rationale: 'This halves the waiting period. A short copying process may seem sufficient. Check the duty and whether the period uses working days.

      '
  - text: 15 working days
    rationale: 'This makes the waiting period too long. Copies become available after ten working days from filing.

      '
  - text: 30 working days
    rationale: 'This uses the filing number and changes its unit. Thirty days is a SALN-related deadline. Check the duty and whether the period uses working days.

      '
  explanation: 'Section 8(C) makes filed statements available for copying or reproduction after ten working days from filing.

    '
- id: q-code-of-conduct-ra-6713-statements-of-assets-and-divestment-0008
  type: single_choice
  difficulty: medium
  stem: 'For how long after receipt does Section 8(C) require public availability of a filed SALN before possible destruction, unless an investigation still needs it?

    '
  choices:
  - text: 10 years
    correct: true
  - text: 5 years
    rationale: 'This halves the availability period. Five years is a familiar legal period. Check the SALN retention provision.

      '
  - text: 15 years
    rationale: 'This extends the required public-access period by five years. The stated period is ten years after receipt.

      '
  - text: 20 years
    rationale: 'This doubles the availability period. Long retention can seem more transparent. Check the stated ten-year rule.

      '
  explanation: 'The statement must remain available for ten years after receipt. After that it may be destroyed unless needed in an ongoing investigation.

    '
- id: q-code-of-conduct-ra-6713-statements-of-assets-and-divestment-0009
  type: single_choice
  difficulty: hard
  stem: 'Under Section 8(A)''s statutory list, where do national executive officials file?

    '
  choices:
  - text: Office of the President
    correct: true
  - text: Civil Service Commission
    rationale: 'This uses the repository for the residual filing category. Several public bodies receive SALNs. Match the official''s precise category to the filing office.

      '
  - text: Court Administrator
    rationale: 'This uses the repository for judges. Several public bodies receive SALNs. Match the official''s precise category to the filing office.

      '
  - text: Clerk of Court of the Supreme Court
    rationale: 'This uses the repository for justices. Several public bodies receive SALNs. Match the official''s precise category to the filing office.

      '
  explanation: 'The statutory list assigns national executive officials to the Office of the President.

    '
- id: q-code-of-conduct-ra-6713-statements-of-assets-and-divestment-0010
  type: single_choice
  difficulty: hard
  stem: 'Under RA 6713, where do senators file their SALN?

    '
  choices:
  - text: Secretary of the Senate
    correct: true
  - text: Secretary of the House
    rationale: 'This uses the repository for House members. Several public bodies receive SALNs. Match the official''s precise category to the filing office.

      '
  - text: Civil Service Commission
    rationale: 'This uses the repository for the residual filing category. Several public bodies receive SALNs. Match the official''s precise category to the filing office.

      '
  - text: Court Administrator
    rationale: 'This uses the repository for judges. Several public bodies receive SALNs. Match the official''s precise category to the filing office.

      '
  explanation: 'Senators file with the Secretary of the Senate. The statute assigns this repository specifically to their chamber.

    '
- id: q-code-of-conduct-ra-6713-statements-of-assets-and-divestment-0011
  type: single_choice
  difficulty: hard
  stem: 'Under Section 8(A), which repository receives covered officials in the residual all-other category when no specifically listed category applies?

    '
  choices:
  - text: CSC
    correct: true
  - text: Office of the President
    rationale: 'This uses the repository for national executive officials. Several public bodies receive SALNs. Match the official''s precise category to the filing office.

      '
  - text: Court Administrator
    rationale: 'This uses the repository for judges. Several public bodies receive SALNs. Match the official''s precise category to the filing office.

      '
  - text: Secretary of the Senate
    rationale: 'This uses the repository for senators. Several public bodies receive SALNs. Match the official''s precise category to the filing office.

      '
  explanation: 'Section 8(A)''s final category assigns all other covered public officials and employees to the Civil Service Commission.

    '
- id: q-code-of-conduct-ra-6713-statements-of-assets-and-divestment-0012
  type: single_choice
  difficulty: medium
  stem: 'Besides the official, whose financial information is included under Section 8? Assume the spouses are not under complete separation of property. For children, assume they live in the household and are under eighteen.

    '
  choices:
  - text: Spouse and unmarried children
    correct: true
  - text: Spouse, parents, adult children, and business partners
    rationale: 'This extends family coverage to other relatives and partners. All may affect family finances. Check the persons expressly included.

      '
  - text: Only children under twenty-one and all immediate siblings
    rationale: 'This changes the age limit and adds siblings. Other laws use different age limits. Check age, marital status, and household conditions.

      '
  - text: Spouse and all financially dependent extended family members
    rationale: 'This replaces the listed relationship tests with dependency. Dependents may share household expenses. Use the specific family definition.

      '
  explanation: 'Section 8 includes the spouse and unmarried children under eighteen who live in the household. The stated child conditions therefore leave unmarried status as the remaining test. The spouse''s separate assets, debts, and net worth need not be included when complete separation of property applies by law or by an agreement made before marriage. That exception does not apply here.

    '
- id: q-code-of-conduct-ra-6713-statements-of-assets-and-divestment-0013
  type: single_choice
  difficulty: hard
  stem: 'Where do regional and local officials and employees file their SALN under RA 6713?

    '
  choices:
  - text: Deputy Ombudsman of their region
    correct: true
  - text: Office of the President legal desk
    rationale: 'This selects the repository for national executive officials. Both categories serve government. Check whether the official is regional or national executive.

      '
  - text: Civil Service Commission main desk
    rationale: 'This uses the residual CSC category despite a specific regional category. CSC handles personnel and receives some statements. Check whether a specific repository rule applies first.

      '
  - text: Supreme Court Administrator office
    rationale: 'This substitutes the judicial repository for regional administrative personnel. Both are public employees. Check the official category rather than government service alone.

      '
  explanation: 'RA 6713 assigns regional and local officials and employees to the Deputy Ombudsman in their region.

    '
- id: q-code-of-conduct-ra-6713-statements-of-assets-and-divestment-0014
