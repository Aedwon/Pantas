meta:
  subject: general-information
  topic: code-of-conduct-ra-6713
  subtopic: penalties-and-enforcement
  exams:
    - cse-pro
    - cse-sub
questions:
  - id: q-code-of-conduct-ra-6713-penalties-and-enforcement-0001
    type: single_choice
    difficulty: easy
    stem: |
      Under Section 11 of RA 6713, what is the maximum fine for general administrative violations of the code?
    choices:
      - text: Fine up to 6 months salary
        correct: true
      - text: Fine up to 12 months salary
      - text: Fine up to 24 months salary
      - text: Fine up to 36 months salary
    explanation: |
      Section 11(a) provides that general violations are punishable by a fine not exceeding six months' salary.

  - id: q-code-of-conduct-ra-6713-penalties-and-enforcement-0002
    type: single_choice
    difficulty: easy
    stem: |
      What is the maximum period of suspension for general administrative violations under Section 11 of RA 6713?
    choices:
      - text: Up to 1 year
        correct: true
      - text: Up to 2 years
      - text: Up to 3 years
      - text: Up to 5 years
    explanation: |
      Section 11(a) specifies suspension not exceeding one year as an administrative penalty.

  - id: q-code-of-conduct-ra-6713-penalties-and-enforcement-0003
    type: single_choice
    difficulty: medium
    stem: |
      Violations of Sections 7, 8, or 9 of RA 6713 carry a maximum imprisonment penalty of up to how many years?
    choices:
      - text: 5 years
        correct: true
      - text: 7 years
      - text: 10 years
      - text: 12 years
    explanation: |
      Section 11(a) provides that violations of Sections 7, 8, or 9 carry imprisonment of up to five years.

  - id: q-code-of-conduct-ra-6713-penalties-and-enforcement-0004
    type: single_choice
    difficulty: medium
    stem: |
      What is the maximum criminal fine specified under Section 11 for violations of Sections 7, 8, or 9 of RA 6713?
    choices:
      - text: Fine up to P5,000
        correct: true
      - text: Fine up to P10,000
      - text: Fine up to P20,000
      - text: Fine up to P50,000
    explanation: |
      Section 11(a) states that violations of Sections 7, 8, or 9 carry a fine of up to P5,000, or imprisonment up to 5 years, or both.

  - id: q-code-of-conduct-ra-6713-penalties-and-enforcement-0005
    type: single_choice
    difficulty: medium
    stem: |
      Under Section 11, what fine may be imposed for the improper commercial use or unauthorized disclosure of a filed SALN?
    choices:
      - text: Fine up to P25,000
        correct: true
      - text: Fine up to P50,000
      - text: Fine up to P75,000
      - text: Fine up to P100,000
    explanation: |
      Section 11 specifies penalties of a fine up to P25,000 for improper commercial use of a filed SALN statement.

  - id: q-code-of-conduct-ra-6713-penalties-and-enforcement-0006
    type: single_choice
    difficulty: hard
    stem: |
      How are private individuals treated when participating as co-principals or accomplices in RA 6713 violations?
    choices:
      - text: Same penalties and tried jointly
        correct: true
      - text: Half penalties and tried separately
      - text: Total immunity from state prosecution
      - text: Civil liabilities only without trial
    explanation: |
      Section 11 provides that private individuals participating as co-principals, accomplices, or accessories face the same penalties and are tried jointly.

  - id: q-code-of-conduct-ra-6713-penalties-and-enforcement-0007
    type: single_choice
    difficulty: hard
    stem: |
      If another existing law provides a heavier penalty for the same offense committed by a public official, which applies?
    choices:
      - text: Heavier penalty applies
        correct: true
      - text: Lighter penalty applies
      - text: RA 6713 penalty applies
      - text: Average penalty applies
    explanation: |
      Section 11 explicitly states that where another law imposes a heavier penalty, the heavier penalty shall apply.

  - id: q-code-of-conduct-ra-6713-penalties-and-enforcement-0008
    type: single_choice
    difficulty: medium
    stem: |
      Under RA 6713, is an administrative violation sufficient cause for removal from office even without criminal prosecution?
    choices:
      - text: Yes, sufficient cause alone
        correct: true
      - text: No, requires prior criminal conviction
      - text: No, requires Supreme Court consent
      - text: No, requires Senate approval vote
    explanation: |
      Section 11 provides that an administrative violation is sufficient cause for removal from office on its own, regardless of criminal prosecution.

  - id: q-code-of-conduct-ra-6713-penalties-and-enforcement-0009
    type: single_choice
    difficulty: easy
    stem: |
      Which penalty band may be imposed for severe general administrative violations under Section 11 of RA 6713?
    choices:
      - text: Removal from office
        correct: true
      - text: Permanent exile abroad
      - text: Mandatory military service
      - text: Revocation of birth record
    explanation: |
      Section 11(a) includes removal from office as a statutory administrative penalty for general violations.

  - id: q-code-of-conduct-ra-6713-penalties-and-enforcement-0010
    type: single_choice
    difficulty: hard
    stem: |
      Aside from imprisonment and fines, what additional penalty may be imposed for violations of Sections 7, 8, or 9?
    choices:
      - text: Disqualification from public office
        correct: true
      - text: Forfeiture of all personal real estate
      - text: Mandatory military service assignment
      - text: Immediate exile from the country
    explanation: |
      Section 11(a) includes disqualification to hold public office as an additional statutory sanction for violations of Sections 7, 8, or 9.

  - id: q-code-of-conduct-ra-6713-penalties-and-enforcement-0011
    type: single_choice
    difficulty: hard
    stem: |
      Under Section 11, which body of rules governs administrative proceedings brought against public employees?
    choices:
      - text: Civil Service Commission rules
        correct: true
      - text: Private corporate arbitration codes
      - text: Municipal zoning board ordinances
      - text: International trade commission laws
    explanation: |
      Administrative sanctions under Section 11 are enforced in accordance with Civil Service laws and administrative rules.

  - id: q-code-of-conduct-ra-6713-penalties-and-enforcement-0012
    type: single_choice
    difficulty: medium
    stem: |
      Violating which section of RA 6713 regarding prohibited acts and transactions carries up to 5 years imprisonment?
    choices:
      - text: Section 7
        correct: true
      - text: Section 1
      - text: Section 3
      - text: Section 12
    explanation: |
      Violations of Section 7 (Prohibited Acts and Transactions) carry penalties of up to 5 years imprisonment under Section 11.

  - id: q-code-of-conduct-ra-6713-penalties-and-enforcement-0013
    type: single_choice
    difficulty: medium
    stem: |
      Violating which section of RA 6713 regarding Statement of Assets, Liabilities and Net Worth carries up to 5 years imprisonment?
    choices:
      - text: Section 8
        correct: true
      - text: Section 2
      - text: Section 4
      - text: Section 10
    explanation: |
      Violations of Section 8 (Statements of Assets, Liabilities and Net Worth) carry penalties of up to 5 years imprisonment under Section 11.

  - id: q-code-of-conduct-ra-6713-penalties-and-enforcement-0014
    type: single_choice
    difficulty: medium
    stem: |
      Violating which section of RA 6713 regarding divestment rules carries up to 5 years imprisonment?
    choices:
      - text: Section 9
        correct: true
      - text: Section 2
      - text: Section 5
      - text: Section 11
    explanation: |
      Violations of Section 9 (Divestment) carry penalties of up to 5 years imprisonment under Section 11.

  - id: q-code-of-conduct-ra-6713-penalties-and-enforcement-0015
    type: single_choice
    difficulty: hard
    stem: |
      What is the maximum imprisonment period for a private individual convicted as a co-principal under Section 11 of RA 6713?
    choices:
      - text: 5 years
        correct: true
      - text: 10 years
      - text: 15 years
      - text: 20 years
    explanation: |
      Private co-principals face the same penalties as public officers under Section 11, which specifies up to 5 years imprisonment.
