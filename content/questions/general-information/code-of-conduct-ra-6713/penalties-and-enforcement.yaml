meta:
  subject: general-information
  topic: code-of-conduct-ra-6713
  subtopic: penalties-and-enforcement
  exams:
    - cse-pro
    - cse-sub
questions:
  - id: q-code-of-conduct-ra-6713-penalties-and-enforcement-0001
    type: single_choice
    difficulty: easy
    stem: |
      Under Section 11 of RA 6713, what is the maximum fine for general administrative violations of the code?
    choices:
      - text: Fine up to 6 months salary
        correct: true
      - text: Fine up to 12 months salary
        rationale: |
          You picked 12 months salary, which doubles the maximum fine limit. Section 11 caps general administrative fines at 6 months salary.
      - text: Fine up to 24 months salary
        rationale: |
          You selected 24 months salary, which quadruples the legal cap. General administrative fines under Section 11 cannot exceed 6 months salary.
      - text: Fine up to 36 months salary
        rationale: |
          You chose 36 months salary, which is a 3 year salary fine. RA 6713 limits general administrative fines to a maximum of 6 months salary.
    explanation: |
      Section 11(a) provides that general violations are punishable by a fine not exceeding six months' salary.

  - id: q-code-of-conduct-ra-6713-penalties-and-enforcement-0002
    type: single_choice
    difficulty: easy
    stem: |
      What is the maximum period of suspension for general administrative violations under Section 11 of RA 6713?
    choices:
      - text: Up to 1 year
        correct: true
      - text: Up to 2 years
        rationale: |
          You selected 2 years, which doubles the administrative suspension limit. Section 11 caps general administrative suspensions at up to 1 year.
      - text: Up to 3 years
        rationale: |
          You picked 3 years, which exceeds the statutory suspension period. The maximum administrative suspension under Section 11 is up to 1 year.
      - text: Up to 5 years
        rationale: |
          You chose 5 years, which confuses administrative suspension with the 5 year criminal prison cap. Administrative suspension is capped at 1 year.
    explanation: |
      Section 11(a) specifies suspension not exceeding one year as an administrative penalty.

  - id: q-code-of-conduct-ra-6713-penalties-and-enforcement-0003
    type: single_choice
    difficulty: medium
    stem: |
      Violations of Sections 7, 8, or 9 of RA 6713 carry a maximum imprisonment penalty of up to how many years?
    choices:
      - text: 5 years
        correct: true
      - text: 7 years
        rationale: |
          You selected 7 years, which exceeds the statutory prison limit. Section 11 caps imprisonment for violations of Sections 7, 8, or 9 at 5 years.
      - text: 10 years
        rationale: |
          You picked 10 years, which doubles the maximum prison sentence under RA 6713. Violations of Sections 7, 8, or 9 carry up to 5 years imprisonment.
      - text: 12 years
        rationale: |
          You chose 12 years, which is reserved for grave RPC crimes. Section 11 specifies a maximum criminal imprisonment of up to 5 years.
    explanation: |
      Section 11(a) provides that violations of Sections 7, 8, or 9 carry imprisonment of up to five years.

  - id: q-code-of-conduct-ra-6713-penalties-and-enforcement-0004
    type: single_choice
    difficulty: medium
    stem: |
      What is the maximum criminal fine specified under Section 11 for violations of Sections 7, 8, or 9 of RA 6713?
    choices:
      - text: Fine up to P5,000
        correct: true
      - text: Fine up to P10,000
        rationale: |
          You picked P10,000, which doubles the statutory criminal fine. Section 11 caps criminal fines for Sections 7, 8, or 9 violations at P5,000.
      - text: Fine up to P20,000
        rationale: |
          You selected P20,000, which quadruples the allowed criminal fine. Section 11 specifies a maximum fine of P5,000 for these violations.
      - text: Fine up to P50,000
        rationale: |
          You chose P50,000, which is ten times the statutory criminal fine. The maximum criminal fine under Section 11 for Sections 7 to 9 is P5,000.
    explanation: |
      Section 11(a) states that violations of Sections 7, 8, or 9 carry a fine of up to P5,000, or imprisonment up to 5 years, or both.

  - id: q-code-of-conduct-ra-6713-penalties-and-enforcement-0005
    type: single_choice
    difficulty: medium
    stem: |
      Under Section 11, what fine may be imposed for the improper commercial use or unauthorized disclosure of a filed SALN?
    choices:
      - text: Fine up to P25,000
        correct: true
      - text: Fine up to P50,000
        rationale: |
          You selected P50,000, which doubles the statutory fine for SALN misuse. Section 11 sets the fine for improper commercial SALN use at up to P25,000.
      - text: Fine up to P75,000
        rationale: |
          You picked P75,000, which triples the statutory fine for SALN misuse. The maximum fine for improper commercial disclosure of a SALN is P25,000.
      - text: Fine up to P100,000
        rationale: |
          You chose P100,000, which quadruples the legal fine. Section 11 imposes a fine of up to P25,000 for unauthorized commercial SALN disclosure.
    explanation: |
      Section 11 specifies penalties of a fine up to P25,000 for improper commercial use of a filed SALN statement.

  - id: q-code-of-conduct-ra-6713-penalties-and-enforcement-0006
    type: single_choice
    difficulty: hard
    stem: |
      How are private individuals treated when participating as co-principals or accomplices in RA 6713 violations?
    choices:
      - text: Same penalties and tried jointly
        correct: true
      - text: Half penalties and tried separately
        rationale: |
          You chose half penalties and separate trials, which misreads liability rules. Private co-principals face the same penalties and are tried jointly.
      - text: Total immunity from state prosecution
        rationale: |
          You picked total immunity, which wrongly shields private accomplices. Section 11 subject private co-principals to full joint prosecution.
      - text: Civil liabilities only without trial
        rationale: |
          You selected civil liabilities only, which eliminates criminal accountability. Private accomplices face identical criminal penalties in joint trials.
    explanation: |
      Section 11 provides that private individuals participating as co-principals, accomplices, or accessories face the same penalties and are tried jointly.

  - id: q-code-of-conduct-ra-6713-penalties-and-enforcement-0007
    type: single_choice
    difficulty: hard
    stem: |
      If another existing law provides a heavier penalty for the same offense committed by a public official, which applies?
    choices:
      - text: Heavier penalty applies
        correct: true
      - text: Lighter penalty applies
        rationale: |
          You selected lighter penalty, which weakens anti-graft enforcement. Section 11 explicitly rules that if another law imposes a heavier penalty, it applies.
      - text: RA 6713 penalty applies
        rationale: |
          You picked RA 6713 penalty, assuming it overrides all other statutes. Section 11 specifies that any heavier penalty in another law will govern.
      - text: Average penalty applies
        rationale: |
          You chose average penalty, which has no basis in penal law. When penalties conflict across laws for the same offense, the heavier penalty applies.
    explanation: |
      Section 11 explicitly states that where another law imposes a heavier penalty, the heavier penalty shall apply.

  - id: q-code-of-conduct-ra-6713-penalties-and-enforcement-0008
    type: single_choice
    difficulty: medium
    stem: |
      Under RA 6713, is an administrative violation sufficient cause for removal from office even without criminal prosecution?
    choices:
      - text: Yes, sufficient cause alone
        correct: true
      - text: No, requires prior criminal conviction
        rationale: |
          You picked prior criminal conviction, which confuses administrative and criminal cases. Administrative violations are sufficient cause for removal alone.
      - text: No, requires Supreme Court consent
        rationale: |
          You selected Supreme Court consent, which applies to judicial officers. Section 11 allows administrative removal of executive employees directly.
      - text: No, requires Senate approval vote
        rationale: |
          You chose Senate approval, which applies to impeachment trials of constitutional officers. Regular administrative removal requires no Senate vote.
    explanation: |
      Section 11 provides that an administrative violation is sufficient cause for removal from office on its own, regardless of criminal prosecution.

  - id: q-code-of-conduct-ra-6713-penalties-and-enforcement-0009
    type: single_choice
    difficulty: easy
    stem: |
      Which penalty band may be imposed for severe general administrative violations under Section 11 of RA 6713?
    choices:
      - text: Removal from office
        correct: true
      - text: Permanent exile abroad
        rationale: |
          You selected permanent exile, which is a constitutional violation. Severe administrative offenses under Section 11 lead to removal from office.
      - text: Mandatory military service
        rationale: |
          You picked mandatory military service, which is a national defense duty, not a punishment. General administrative penalties include removal from office.
      - text: Revocation of birth record
        rationale: |
          You chose revocation of birth record, which is not a legal administrative sanction. Section 11 lists removal from office as a severe penalty.
    explanation: |
      Section 11(a) includes removal from office as a statutory administrative penalty for general violations.

  - id: q-code-of-conduct-ra-6713-penalties-and-enforcement-0010
    type: single_choice
    difficulty: hard
    stem: |
      Aside from imprisonment and fines, what additional penalty may be imposed for violations of Sections 7, 8, or 9?
    choices:
      - text: Disqualification from public office
        correct: true
      - text: Forfeiture of all personal real estate
        rationale: |
          You selected forfeiture of real estate, which requires civil forfeiture suits. Additional penal sanctions under Section 11 include office disqualification.
      - text: Mandatory military service assignment
        rationale: |
          You picked military assignment, which is not a judicial sentence under RA 6713. Violating Sections 7 to 9 carries disqualification from public office.
      - text: Immediate exile from the country
        rationale: |
          You chose exile, which is prohibited under the Constitution. In addition to fines and prison, Section 11 imposes public office disqualification.
    explanation: |
      Section 11(a) includes disqualification to hold public office as an additional statutory sanction for violations of Sections 7, 8, or 9.

  - id: q-code-of-conduct-ra-6713-penalties-and-enforcement-0011
    type: single_choice
    difficulty: hard
    stem: |
      Under Section 11, which body of rules governs administrative proceedings brought against public employees?
    choices:
      - text: Civil Service Commission rules
        correct: true
      - text: Private corporate arbitration codes
        rationale: |
          You selected private corporate codes, which apply to commercial disputes. Administrative proceedings under RA 6713 follow Civil Service Commission rules.
      - text: Municipal zoning board ordinances
        rationale: |
          You picked municipal zoning ordinances, which govern land use. Government employee administrative discipline is governed by Civil Service Commission rules.
      - text: International trade commission laws
        rationale: |
          You chose international trade laws, which govern foreign commerce. Public sector administrative discipline follows Civil Service Commission rules.
    explanation: |
      Administrative sanctions under Section 11 are enforced in accordance with Civil Service laws and administrative rules.

  - id: q-code-of-conduct-ra-6713-penalties-and-enforcement-0012
    type: single_choice
    difficulty: medium
    stem: |
      Violating which section of RA 6713 regarding prohibited acts and transactions carries up to 5 years imprisonment?
    choices:
      - text: Section 7
        correct: true
      - text: Section 1
        rationale: |
          You picked Section 1, which states the title of the Act. Section 7 covers prohibited acts and transactions that carry up to 5 years imprisonment.
      - text: Section 3
        rationale: |
          You selected Section 3, which defines statutory terms. Prohibited acts and transactions subject to 5 years imprisonment are set out in Section 7.
      - text: Section 12
        rationale: |
          You chose Section 12, which covers rule promulgation. Section 7 defines the prohibited acts and transactions carrying up to 5 years imprisonment.
    explanation: |
      Violations of Section 7 (Prohibited Acts and Transactions) carry penalties of up to 5 years imprisonment under Section 11.

  - id: q-code-of-conduct-ra-6713-penalties-and-enforcement-0013
    type: single_choice
    difficulty: medium
    stem: |
      Violating which section of RA 6713 regarding Statement of Assets, Liabilities and Net Worth carries up to 5 years imprisonment?
    choices:
      - text: Section 8
        correct: true
      - text: Section 2
        rationale: |
          You picked Section 2, which states public policy declarations. SALN requirements and violations subject to 5 years imprisonment are in Section 8.
      - text: Section 4
        rationale: |
          You selected Section 4, which lists norms of conduct. Section 8 details SALN requirements that carry up to 5 years imprisonment upon violation.
      - text: Section 10
        rationale: |
          You chose Section 10, which handles review of statements. Section 8 defines SALN filing requirements carrying up to 5 years imprisonment.
    explanation: |
      Violations of Section 8 (Statements of Assets, Liabilities and Net Worth) carry penalties of up to 5 years imprisonment under Section 11.

  - id: q-code-of-conduct-ra-6713-penalties-and-enforcement-0014
    type: single_choice
    difficulty: medium
    stem: |
      Violating which section of RA 6713 regarding divestment rules carries up to 5 years imprisonment?
    choices:
      - text: Section 9
        correct: true
      - text: Section 2
        rationale: |
          You selected Section 2, which states statutory principles. Divestment rules and violations carrying up to 5 years imprisonment are in Section 9.
      - text: Section 5
        rationale: |
          You picked Section 5, which lists duties of public officials. Section 9 sets divestment requirements carrying up to 5 years imprisonment.
      - text: Section 11
        rationale: |
          You chose Section 11, which defines the penalties themselves. Section 9 contains the actual divestment obligation that triggers imprisonment.
    explanation: |
      Violations of Section 9 (Divestment) carry penalties of up to 5 years imprisonment under Section 11.

  - id: q-code-of-conduct-ra-6713-penalties-and-enforcement-0015
    type: single_choice
    difficulty: hard
    stem: |
      What is the maximum imprisonment period for a private individual convicted as a co-principal under Section 11 of RA 6713?
    choices:
      - text: 5 years
        correct: true
      - text: 10 years
        rationale: |
          You picked 10 years, which doubles the penal limit. Section 11 subjects private co-principals to the same 5 year maximum prison cap as public officers.
      - text: 15 years
        rationale: |
          You selected 15 years, which exceeds the statutory cap. Private accomplices face equal penalties with public officers, capped at 5 years imprisonment.
      - text: 20 years
        rationale: |
          You chose 20 years, which quadruples the legal maximum. Section 11 limits imprisonment for private co-principals to a maximum of 5 years.
    explanation: |
      Private co-principals face the same penalties as public officers under Section 11, which specifies up to 5 years imprisonment.
