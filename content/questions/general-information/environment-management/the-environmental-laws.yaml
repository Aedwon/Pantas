- id: q-environment-management-the-environmental-laws-0020
  lesson: lesson-environment-management-solid-waste-law
  keyPoint: 1
  type: single_choice
  difficulty: exam
  approved: false
  stem: 'Why is the claim ''one environmental law automatically resolves every environmental issue'' unreliable?

    '
  choices:
  - text: Different laws address different environmental subjects.
    correct: true
  - text: Every environmental statute has exactly the same legal scope despite its different title.
    rationale: 'This treats a common goal as identical coverage. All support protection. Check each statute''s particular subject.

      '
  - text: Only the date of a law matters; the subject of the activity is irrelevant to which applies.
    rationale: 'This treats chronology as the whole legal test. Later laws can amend earlier ones. Check purpose and amendments together.

      '
  - text: An issue with several impacts must be excluded from regulation under every statute.
    rationale: 'This treats overlap as absence of coverage. Several frameworks may be relevant. Check each applicable subject instead.

      '
  explanation: 'The laws in the lesson cover waste, air, water, climate, disasters, wildlife, protected areas, and project review. A problem must be matched to the relevant subjects.

    '
- id: q-environment-management-environmental-concepts-0003
  lesson: lesson-environment-management-project-review-and-clearance
  keyPoint: 1
  type: single_choice
  difficulty: medium
  stem: 'What environmental decision document must a project covered by the Philippine EIS System secure before implementation?

    '
  choices:
  - text: An ECC
    correct: true
  - text: A business permit alone, without environmental review
    rationale: 'This treats commercial permission as environmental clearance. The permit authorizes business activity. Check whether the required EIS review occurred.

      '
  - text: A building permit alone, even for a covered critical project
    rationale: 'This treats construction approval as environmental clearance. A building permit is needed for many projects. Check the distinct environmental requirement.

      '
  - text: A statement written by the proponent declaring all impacts acceptable
    rationale: 'This treats self-assessment as the decision document. The proponent supplies information. Check who reviews and issues the clearance.

      '
  explanation: 'The Environmental Compliance Certificate, or ECC, is the decision document issued after environmental review for covered projects. It must be secured before implementation.

    '
- id: q-environment-management-environmental-concepts-0014
  lesson: lesson-environment-management-project-review-and-clearance
  keyPoint: 1
  type: single_choice
  difficulty: medium
  approved: false
  stem: 'Which sequence best fits a project known to be covered by the EIS System?

    '
