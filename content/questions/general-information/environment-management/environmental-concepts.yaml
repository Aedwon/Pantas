meta:
  subject: general-information
  topic: environment-management
  subtopic: environmental-concepts
  exams:
  - cse-pro
  - cse-sub
questions:
- id: q-environment-management-environmental-concepts-0001
  type: single_choice
  difficulty: easy
  stem: 'What distinguishes segregation at source under RA 9003?

    '
  choices:
  - text: Separating waste where it is produced
    correct: true
  - text: Sorting mixed waste only after arrival at a municipal landfill
    rationale: 'This moves separation away from the source. Sorting still occurs. Check where the waste originates.

      '
  - text: Collecting all materials together and separating them during transport
    rationale: 'This delays separation until collection. The materials are eventually sorted. Check whether sorting happens at generation.

      '
  - text: Separating waste only when a disposal facility asks for a special delivery
    rationale: 'This treats segregation as an occasional facility request. Disposal workers handle waste. Check who should separate it first.

      '
  explanation: 'Segregation at source means separating materials at their point of origin. This supports reuse and recycling before collection and disposal.

    '
- id: q-environment-management-environmental-concepts-0002
  type: single_choice
  difficulty: easy
  stem: 'What concept includes reduction, reuse, recycling, and composting that keep solid waste out of disposal facilities?

    '
  choices:
  - text: Waste diversion
    correct: true
  - text: Faster collection of the same mixed waste
    rationale: 'This treats moving waste faster as diversion. Less waste stays at home. Check whether the amount sent for disposal falls.

      '
  - text: Transfer to a different disposal facility
    rationale: 'This treats a new destination as diversion. One landfill receives less. Check the total waste going to disposal.

      '
  - text: Temporary storage before the same landfill disposal
    rationale: 'This treats delay as diversion. Waste does not reach the landfill immediately. Check its final destination.

      '
  explanation: 'Waste diversion reduces or eliminates the amount sent to disposal facilities. The listed activities keep materials in use or turn organic waste into useful compost.

    '
- id: q-environment-management-environmental-concepts-0008
  type: single_choice
  difficulty: medium
  stem: 'A school sorts food scraps for composting separately from clean recyclable paper before collection. Which statement best describes the practice?

    '
  choices:
  - text: It separates materials at their source.
    correct: true
  - text: It counts as source segregation only if the sorting occurs at the landfill.
    rationale: 'This puts the source at disposal. Landfill workers handle waste. Check where the school produces it.

      '
  - text: It cannot support diversion unless all materials are mixed again for transport.
    rationale: 'This makes mixing necessary for recovery. One collection stream can seem convenient. Check whether mixing protects useful separated materials.

      '
  - text: It is source segregation only when the paper has already become a new product.
    rationale: 'This confuses separation with completed recycling. New products are a recycling goal. Distinguish sorting from later processing.

      '
  explanation: 'The school separates the materials where they are generated. That is source segregation and prepares them for composting or recycling.

    '
- id: q-environment-management-environmental-concepts-0009
  type: single_choice
  difficulty: easy
  approved: false
  stem: 'Which action reduces waste before it needs collection?

    '
  choices:
  - text: Choosing less disposable packaging
    correct: true
  - text: Sending the same amount of packaging to a more distant landfill
    rationale: 'This changes location instead of generation. The local site receives less. Check total waste produced.

      '
  - text: Collecting packaging twice as often without changing purchases
    rationale: 'This changes schedule instead of generation. Bins look emptier. Check the amount bought and discarded.

      '
  - text: Adding a larger bin for the same volume of disposable packaging
    rationale: 'This changes storage capacity. Overflow may fall. Check whether waste itself is reduced.

      '
  explanation: 'Using less disposable packaging reduces the amount of solid waste created. Source reduction can keep that material out of disposal.

    '
- id: q-environment-management-environmental-concepts-0010
  type: single_choice
  difficulty: easy
  approved: false
  stem: 'An intact container is cleaned and used again for storage. Which diversion activity is shown?

    '
  choices:
  - text: Reuse
    correct: true
  - text: Recycling into a different material
    rationale: 'This assumes any second use requires processing. Both keep items useful. Check whether the original container is changed.

      '
  - text: Composting the container as organic waste
    rationale: 'This treats reuse as decomposition. Both can reduce disposal. Check the actual action described.

      '
  - text: Disposal at a managed landfill site
    rationale: 'This treats removal from immediate use as disposal. The container has finished one use. Check whether it remains in use.

      '
  explanation: 'The same container is used again without being turned into a different material. This is reuse.

    '
- id: q-environment-management-environmental-concepts-0011
  type: single_choice
  difficulty: easy
  approved: false
  stem: 'Waste paper is processed into new paper products instead of being landfilled. Which activity is this?

    '
  choices:
  - text: Recycling
    correct: true
  - text: Reusing each old sheet without processing
    rationale: 'This confuses new-material processing with direct reuse. The paper serves another purpose. Check whether it is transformed into a new product.

      '
  - text: Only storing the paper until landfill transport
    rationale: 'This omits the new-product step. Stored recyclables may await processing. Check the final use described.

      '
  - text: Mixing paper with residual waste before collection
    rationale: 'This treats mixing as resource recovery. All material enters collection. Check whether useful paper remains recoverable.

      '
  explanation: 'The waste paper is processed into useful new products. Recycling keeps that material from disposal.

    '
- id: q-environment-management-environmental-concepts-0012
  type: single_choice
  difficulty: medium
  approved: false
  stem: 'Why does composting suitable organic waste count as diversion?

    '
  choices:
  - text: It keeps that waste from disposal.
    correct: true
  - text: It moves the same organic waste to a landfill under a different name.
    rationale: 'This treats renaming as recovery. Compost is a familiar waste term. Check whether the material becomes useful instead.

      '
  - text: It requires every type of solid waste to break down in the same pile.
    rationale: 'This assumes all materials are compostable. Composting uses decomposition. Check material suitability.

      '
  - text: It means collection is no longer needed for any other waste stream.
    rationale: 'This turns one diversion activity into a total collection replacement. Composting reduces one stream. Check what still needs management.

      '
  explanation: 'Composting turns suitable organic waste into a useful product. The waste is therefore kept from a disposal facility.

    '
- id: q-environment-management-environmental-concepts-0013
  type: single_choice
  difficulty: medium
  approved: false
  stem: 'Which material category fits suitable food scraps intended to decompose into compost?

    '
  choices:
  - text: Compostable
    correct: true
  - text: Recyclable metal and glass
    rationale: 'This chooses a recovery category for other materials. Both categories keep waste useful. Check whether the material decomposes into compost.

      '
  - text: Non-recyclable residual waste
    rationale: 'This overlooks a useful recovery route. Food scraps can look like ordinary rubbish. Check whether composting is suitable.

      '
  - text: Special waste requiring separate hazardous handling
    rationale: 'This assumes all separated waste is special waste. Each category is handled separately. Check the material''s actual characteristics.

      '
  explanation: 'Suitable food scraps are compostable because they can be broken down into useful compost.

    '
- id: q-environment-management-environmental-concepts-0019
  type: single_choice
  difficulty: hard
  approved: false
  stem: 'What is the best test of whether a new waste program achieves diversion?

    '
  choices:
  - text: Less waste is sent for final disposal.
    correct: true
  - text: The same waste reaches a landfill sooner each day.
    rationale: 'This measures collection speed. Faster service looks efficient. Check the amount ultimately disposed.

      '
  - text: The program uses more bins while disposal quantities stay unchanged.
    rationale: 'This measures equipment instead of outcome. Extra bins show activity. Check whether any waste avoids disposal.

      '
  - text: The waste is carried to a different town's disposal site.
    rationale: 'This measures local relocation. The original town disposes less locally. Check the total sent to all disposal facilities.

      '
  explanation: 'Diversion reduces or eliminates waste sent to disposal facilities. The relevant result is material kept out of final disposal.

    '
- id: q-environment-management-environmental-concepts-0020
  type: single_choice
  difficulty: exam
  approved: false
  stem: 'Which statement best combines source segregation and waste diversion?

    '
  choices:
  - text: Segregation can prepare materials for diversion.
    correct: true
  - text: Separating waste guarantees diversion even if every stream is later landfilled.
    rationale: 'This treats preparation as a guaranteed result. Sorted bins look successful. Check the materials'' final destination.

      '
  - text: Diversion is impossible unless mixed waste is first taken to a landfill.
    rationale: 'This makes disposal a prerequisite. Facilities may sort some waste. Check reduction and reuse that happen earlier.

      '
  - text: Segregation and diversion mean exactly the same action in every case.
    rationale: 'This merges sorting with reducing disposal. The practices often work together. Distinguish the process from the outcome.

      '
  explanation: 'Source segregation separates materials where they are generated. This can help recycling, reuse, or composting keep them out of disposal. Their later destination determines whether diversion occurs.

    '
- id: q-environment-management-environmental-concepts-0021
  type: single_choice
  difficulty: exam
  approved: false
  stem: 'A town keeps separate compostable, recyclable, residual, and special-waste streams. Which instruction best preserves segregation after collection?

    '
  choices:
  - text: Keep the separated materials apart.
    correct: true
  - text: Empty every stream into one mixed pile because households already sorted it.
    rationale: 'This treats sorting as finished once bins are filled. Household separation was completed. Check whether later mixing undoes it.

      '
  - text: Mix special waste with compostable scraps because both need separate handling.
    rationale: 'This treats separate categories as interchangeable. Both are collected apart from residual waste. Check whether their handling methods are compatible.

      '
  - text: Use the labels only at home and discard them during transport to recovery sites.
    rationale: 'This treats labels as household decoration. Collection starts a new stage. Check whether workers can still identify the material streams.

      '
  explanation: 'Keeping streams apart preserves source separation. This helps suitable materials remain available for their proper recovery or handling route.

    '
- id: q-environment-management-environmental-concepts-0022
  type: single_choice
  difficulty: easy
  approved: false
  stem: 'Which group consists entirely of special waste as described in the lesson?

    '
  choices:
  - text: Food scraps, garden leaves, and grass cuttings
    rationale: 'These are organic materials suited to composting. They belong in the compostable category.

      '
  - text: Paint, thinner, and used household batteries
    correct: true
  - text: Clean paper, glass bottles, and metal cans accepted for recycling
    rationale: 'These materials can be recovered through recycling. Being recyclable does not make them special waste.

      '
  - text: Non-recyclable wrappers, food scraps, and clean paper
    rationale: 'This group mixes non-recyclable, compostable, and recyclable waste. It is not a group of special waste.

      '
  explanation: 'Paint, thinner, and household batteries are special waste. They need to be kept apart from ordinary waste. Food scraps and garden waste belong with compostable materials.

    '
- id: q-environment-management-environmental-concepts-0023
  type: single_choice
  difficulty: easy
  approved: false
  stem: 'A discarded wrapper cannot be recovered through the available recycling or composting process. It is not special waste. Which category fits it?

    '
  choices:
  - text: Recyclable waste
    rationale: 'Recyclable waste has a recovery route through recycling. The wrapper has no such route in this situation.

      '
  - text: Compostable waste
    rationale: 'Compostable material can break down through composting. The stem rules out that route for this wrapper.

      '
  - text: Special waste
    rationale: 'Failure to recycle an item does not make it special waste. The stem states that this wrapper is not special waste.

      '
  - text: Non-recyclable waste
    correct: true
  explanation: 'Non-recyclable waste cannot be recovered through the available recycling or composting process and is not special waste. The wrapper meets those conditions.

    '
- id: q-environment-management-environmental-concepts-0024
  type: single_choice
  difficulty: medium
  approved: false
  stem: 'A barangay describes its composting process in a public notice. Which description is accurate?

    '
  choices:
  - text: Microorganisms break down organic matter under controlled conditions into a soil-like product.
    correct: true
  - text: Workers separate organic matter from other waste, completing composting as soon as sorting ends.
    rationale: 'Sorting prepares materials for composting. Composting also requires the controlled breakdown of organic matter.

      '
  - text: Residents use intact containers again without changing their basic form.
    rationale: 'Using intact items again describes reuse. It does not describe the breakdown of organic matter.

      '
  - text: A facility processes clean glass and metal into new products.
    rationale: 'Processing glass and metal into new products describes recycling. Composting uses organic matter.

      '
  explanation: 'Composting uses microorganisms to break down organic matter in a controlled process. The result is a soil-like product. Sorting scraps is only a preparation step.

    '
- id: q-environment-management-environmental-concepts-0025
  type: single_choice
  difficulty: medium
  approved: false
  stem: 'An office puts clean recyclable paper in a container with food scraps. Why can this make recovery harder?

    '
  choices:
  - text: Contact with food scraps automatically turns paper into special waste.
    rationale: 'Contamination can make recovery harder. It does not automatically place paper in the special-waste category.

      '
  - text: Paper must be mixed with food scraps before it can be recycled.
    rationale: 'The lesson explains that keeping recyclable materials separate helps recovery. Mixing is not a required recycling step.

      '
  - text: Mixing can contaminate materials that could otherwise be recovered.
    correct: true
  - text: Once waste enters a container, it can no longer be used for diversion.
    rationale: 'Containers can hold separated materials for recycling or composting. Storage in a container does not prevent diversion.

      '
  explanation: 'Food scraps can contaminate clean paper when they are mixed. Contaminated materials can be harder to recover. Keeping the streams separate helps protect useful materials.

    '
- id: q-environment-management-environmental-concepts-0026
  type: single_choice
  difficulty: medium
  approved: false
  stem: 'A clerk writes draft notes on the unused sides of old office sheets. Another office sends old sheets to be processed into new paper. How should the actions be classified, respectively?

    '
  choices:
  - text: Recycling and reuse
    rationale: 'This reverses the methods. Writing on an existing sheet is reuse. Processing old paper into new paper is recycling.

      '
  - text: Reuse and recycling
    correct: true
  - text: Reuse and composting
    rationale: 'The first action is reuse. The second makes new paper through processing, not compost through controlled decomposition.

      '
  - text: Segregation at source and reuse
    rationale: 'Writing on a sheet is not waste sorting. Processing sheets into new paper changes the material instead of using each sheet again as it is.

      '
  explanation: 'The clerk uses the same sheets again without changing their basic form. That is reuse. The other office has old paper processed into new paper. That is recycling.

    '
- id: q-environment-management-environmental-concepts-0027
  type: single_choice
  difficulty: hard
  approved: false
  stem: 'A buyer says that choosing goods with less unnecessary packaging and recycling packaging after use are both source reduction. Which correction is most accurate?

    '
  choices:
  - text: Both actions are recycling because both involve packaging.
    rationale: 'The material involved does not determine the method. Avoiding unnecessary packaging prevents waste from being created.

      '
  - text: Neither action supports diversion because packaging is involved.
    rationale: 'Reduction and recycling can both keep packaging waste out of final disposal. Packaging is not excluded from diversion.

      '
  - text: Recycling is source reduction, while choosing less packaging is reuse.
    rationale: 'Recycling processes waste that already exists. Choosing less packaging reduces waste generation and does not use an item again.

      '
  - text: Choosing less packaging is source reduction, while recycling recovers material after use.
    correct: true
  explanation: 'Source reduction creates less waste in the first place. Recycling processes material after use. Both can support diversion, but they act at different stages.

    '
- id: q-environment-management-environmental-concepts-0028
  type: single_choice
  difficulty: hard
  approved: false
  stem: 'A school hires a contractor to sort its waste. Which arrangement meets the meaning of segregation at source?

    '
  choices:
  - text: The contractor sorts the waste at the school before collection.
    correct: true
  - text: The contractor sorts the mixed waste after delivery to a disposal facility.
    rationale: 'Sorting at the disposal facility happens away from the school where the waste was produced.

      '
  - text: The contractor sorts the mixed waste at an off-site warehouse after collection.
    rationale: 'An off-site warehouse is not the source of the school waste. The sorting occurs after collection.

      '
  - text: The contractor separates the mixed waste while the collection vehicle travels away from the school.
    rationale: 'Sorting during transport happens after collection. Source segregation takes place where the waste is produced.

      '
  explanation: 'The place and timing of sorting matter. The contractor can separate waste at the school before collection. Hiring a contractor does not move the source of the waste.

    '
- id: q-environment-management-environmental-concepts-0029
  type: single_choice
  difficulty: exam
  approved: false
  stem: 'An employee argues that a discarded consumer electronic device should go in the ordinary recyclable bin because it contains useful metal. Which response best follows the lesson?

    '
  choices:
  - text: Any item containing metal belongs with ordinary recyclables, regardless of its waste category.
    rationale: 'This uses only one material to classify the whole item. The lesson specifically places discarded consumer electronics in special waste.

      '
  - text: It belongs with non-recyclable waste because special waste cannot contain recoverable material.
    rationale: 'The lesson does not define special waste by the absence of useful material. It specifically includes discarded consumer electronics.

      '
  - text: It belongs in special waste even though it may contain recoverable material.
    correct: true
  - text: It becomes ordinary recyclable waste as soon as it is separated from food scraps.
    rationale: 'Separating an electronic device from food scraps does not change its classification as special waste.

      '
  explanation: 'The lesson places discarded consumer electronics in special waste. Useful metal inside a device does not remove that classification. Keep the device apart from ordinary waste for proper handling.

    '
- id: q-environment-management-environmental-concepts-0030
  type: single_choice
  difficulty: exam
  approved: false
  stem: 'An office starts buying supplies with less packaging, uses empty jars for storage, and sends garden waste for controlled breakdown into compost. Which sequence correctly names these actions?

    '
  choices:
  - text: Reuse, recycling, and composting
    rationale: 'Using less packaging is reduction, not reuse. Using an intact jar again is reuse, not recycling.

      '
  - text: Reduction, reuse, and composting
    correct: true
  - text: Reduction, recycling, and segregation at source
    rationale: 'Using intact jars again does not process them into new material. Controlled breakdown into compost is composting, not merely sorting.

      '
  - text: Segregation at source, reuse, and recycling
    rationale: 'Buying less packaging prevents waste instead of sorting it. Turning garden waste into compost is composting.

      '
  explanation: 'Less packaging means less waste is created. That is reduction. The same jars get another use, so that is reuse. Controlled breakdown of garden waste into compost is composting.

    '
