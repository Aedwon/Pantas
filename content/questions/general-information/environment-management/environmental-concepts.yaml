questions:
  - id: q-environment-management-environmental-concepts-0001
    type: single_choice
    difficulty: easy
    stem: |
      Under RA 9003, what does the principle of segregation at source require?
    choices:
      - text: Separating waste at the point of origin
        correct: true
      - text: Sorting collected waste at a municipal landfill
        rationale: |
          You picked sorting at landfill, which happens after waste collection. Segregation at source requires separating waste at the point of origin.
      - text: Incinerating all mixed waste at high temperature
        rationale: |
          You selected high temperature incineration, which is a disposal method. Segregation at source means sorting waste where it is generated.
      - text: Transporting all unsorted waste to sea dumping
        rationale: |
          You chose sea dumping transport, which is an illegal disposal practice. Segregation at source requires sorting waste where it is generated.
    explanation: |
      RA 9003 defines segregation at source as separating different materials in solid waste at the point of origin to promote recycling and reuse and reduce the volume collected for disposal.

  - id: q-environment-management-environmental-concepts-0002
    type: single_choice
    difficulty: easy
    stem: |
      What activity keeps solid waste out of disposal facilities through reduction, reuse, recycling, and composting?
    choices:
      - text: Waste diversion
        correct: true
      - text: Open waste dumping
        rationale: |
          You picked open waste dumping, which sends waste to a disposal site instead of reducing the amount that reaches one.
      - text: Municipal incineration
        rationale: |
          You selected municipal incineration, which burns waste instead of diverting it through reuse, recycling, or composting.
      - text: Sanitary landfilling
        rationale: |
          You chose sanitary landfilling, which is a final disposal method. Keeping materials out of disposal facilities through reuse and recycling is waste diversion.
    explanation: |
      RA 9003 defines waste diversion as activities that reduce or eliminate the amount of solid waste going to waste disposal facilities.

  - id: q-environment-management-environmental-concepts-0003
    type: single_choice
    difficulty: medium
    stem: |
      Which certificate is required before undertaking or operating a declared environmentally critical project or project in a declared environmentally critical area under the Philippine Environmental Impact Statement System?
    choices:
      - text: Environmental Compliance Certificate
        correct: true
      - text: Certificate of Municipal Non-Taxable Status
        rationale: |
          You selected municipal non-taxable status, which concerns local tax exemptions. Environmental impact compliance for covered projects requires an ECC.
      - text: Business Operating Permit Authorization Clearance
        rationale: |
          You picked a business operating permit, which is a general commercial license. A covered project under the EIS System must secure an ECC.
      - text: Building Structural Safety Inspection Permit
        rationale: |
          You chose structural safety inspection, which covers engineering safety. The environmental clearance required for covered projects is an ECC.
    explanation: |
      Section 4 of PD 1586 requires an Environmental Compliance Certificate before a declared environmentally critical project or a project in a declared environmentally critical area may be undertaken or operated.

  - id: q-environment-management-environmental-concepts-0004
    type: single_choice
    difficulty: medium
    stem: |
      RA 10121 introduced what major paradigm shift in government disaster response?
    choices:
      - text: Shift to proactive risk reduction
        correct: true
      - text: Shift from local government to total foreign aid dependency
        rationale: |
          You selected foreign aid dependency, which undermines local resilience. RA 10121 emphasizes disaster risk reduction and preparedness.
      - text: Shift from civil emergency protection to military rule control
        rationale: |
          You chose military control, which does not describe RA 10121. The law establishes a disaster risk reduction and management framework.
      - text: Shift from early prevention to post-disaster structural rebuilding
        rationale: |
          You picked post-disaster rebuilding, which reverses the intended shift. RA 10121 places greater emphasis on prevention, mitigation, and preparedness.
    explanation: |
      RA 10121 institutionalized a disaster risk reduction and management framework that emphasizes prevention, mitigation, preparedness, and resilience instead of relying mainly on post-disaster response.

  - id: q-environment-management-environmental-concepts-0007
    type: single_choice
    difficulty: medium
    stem: |
      Under RA 10121, what national council serves as the lead coordinating body for disaster risk reduction and management?
    choices:
      - text: NDRRMC
        correct: true
      - text: DENR
        rationale: |
          You selected DENR, which manages natural resources and environmental regulation. National disaster risk reduction and management coordination belongs to the NDRRMC.
      - text: NEDA
        rationale: |
          You picked NEDA, which is the national economic and development planning agency. Disaster risk reduction and management coordination belongs to the NDRRMC.
      - text: DSWD
        rationale: |
          You chose DSWD, which has important disaster-response and social-welfare roles. The national coordinating council established by RA 10121 is the NDRRMC.
    explanation: |
      RA 10121 establishes the National Disaster Risk Reduction and Management Council (NDRRMC) as the national body that coordinates disaster risk reduction and management policy and action.

  - id: q-environment-management-environmental-concepts-0008
    type: single_choice
    difficulty: medium
    stem: |
      Requiring households and business establishments to separate different categories of solid waste before collection is an example of what?
    choices:
      - text: Segregation at source
        correct: true
      - text: Municipal open waste burning
        rationale: |
          You selected open waste burning, which is a disposal practice. Sorting waste at the premises where it is generated is segregation at source.
      - text: Sanitary landfill capping
        rationale: |
          You picked landfill capping, which is part of final disposal-site management. Sorting waste at a home or business before collection is segregation at source.
      - text: Offshore waste dumping
        rationale: |
          You chose offshore dumping, which is a disposal practice. Separating waste at the premises where it is generated is segregation at source.
    explanation: |
      RA 9003 requires segregation to be conducted primarily at the source, including household, institutional, industrial, commercial, and agricultural sources.
