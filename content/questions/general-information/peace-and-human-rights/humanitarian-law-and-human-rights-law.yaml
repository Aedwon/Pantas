meta:
  subject: general-information
  topic: peace-and-human-rights
  subtopic: humanitarian-law-and-human-rights-law
  exams:
    - cse-pro
    - cse-sub
questions:
  - id: q-peace-and-human-rights-humanitarian-law-and-human-rights-law-0001
    type: single_choice
    difficulty: easy
    stem: |
      Under what specific circumstances does International Humanitarian Law (IHL) apply?
    choices:
      - text: During armed conflict
        correct: true
      - text: During peace negotiations
        rationale: |
          Peace negotiations by themselves do not trigger IHL. If an armed conflict continues while negotiations are taking place, IHL continues to apply because of the armed conflict.
      - text: During economic recessions
        rationale: |
          An economic recession does not itself trigger the law of armed conflict.
      - text: During election campaigns
        rationale: |
          An election campaign does not itself trigger IHL.
    explanation: |
      International Humanitarian Law applies when the legal conditions for an armed conflict are met. Negotiations or ceasefire discussions do not by themselves end its application if the armed conflict legally continues.

  - id: q-peace-and-human-rights-humanitarian-law-and-human-rights-law-0002
    type: single_choice
    difficulty: medium
    stem: |
      Which entities are bound by International Humanitarian Law during hostilities?
    choices:
      - text: All parties to an armed conflict
        correct: true
      - text: Sovereign state regular army forces exclusively
        rationale: |
          IHL is not limited to state armed forces; applicable rules also bind non-state parties to non-international armed conflicts.
      - text: Civilian medical non-combatant personnel only
        rationale: |
          Medical personnel are protected and also have relevant obligations, but IHL binds the parties to the armed conflict as a whole.
      - text: Neutral accredited diplomatic observers only
        rationale: |
          Neutral observers are not the only entities bound by the law governing hostilities.
    explanation: |
      IHL binds all parties to an armed conflict. Depending on the type of conflict, those parties may include state armed forces and organized non-state armed groups.

  - id: q-peace-and-human-rights-humanitarian-law-and-human-rights-law-0003
    type: single_choice
    difficulty: hard
    stem: |
      What is the main distinction between Human Rights Law (HRL) and International Humanitarian Law (IHL) regarding when they apply?
    choices:
      - text: HRL applies at all times, IHL in armed conflict
        correct: true
      - text: HRL applies in armed conflict, IHL during peace time
        rationale: |
          This reverses their temporal scope. Human rights law continues in peace and conflict, while IHL is triggered by armed conflict.
      - text: HRL applies to military forces, IHL to civilian bodies
        rationale: |
          This confuses whom the legal frameworks regulate with when they apply.
      - text: HRL applies to foreign visitors, IHL to local citizens
        rationale: |
          Nationality is not the distinction being tested; the key difference is temporal scope.
    explanation: |
      International human rights law applies in peacetime and during armed conflict. IHL is the specialized body of law triggered by armed conflict. Some IHL protections and obligations can continue after active hostilities cease until the relevant protected situation has legally ended, such as the release and repatriation of protected persons.

  - id: q-peace-and-human-rights-humanitarian-law-and-human-rights-law-0004
    type: single_choice
    difficulty: easy
    stem: |
      Which body of law specifically seeks to limit the methods of warfare and protect non-combatants during hostilities?
    choices:
      - text: International Humanitarian Law
        correct: true
      - text: Commercial Maritime Trade Regulations Code
        rationale: |
          Commercial trade rules do not regulate the means and methods of warfare.
      - text: Administrative Civil Service Conduct Rules
        rationale: |
          Civil-service conduct rules do not govern the conduct of hostilities.
      - text: Municipal Property Zoning Land Regulations
        rationale: |
          Municipal zoning rules do not regulate warfare or protect persons affected by hostilities.
    explanation: |
      IHL limits the means and methods of warfare and protects persons who are not, or are no longer, taking part in hostilities.

  - id: q-peace-and-human-rights-humanitarian-law-and-human-rights-law-0005
    type: single_choice
    difficulty: medium
    stem: |
      Unlike Human Rights Law which primarily binds states, International Humanitarian Law binds which of the following?
    choices:
      - text: Both state and non-state combatants
        correct: true
      - text: Private non-combatant citizens only
        rationale: |
          Civilians are principally protected by IHL; the legal duties governing hostilities bind the parties to the conflict.
      - text: State diplomatic officers exclusively
        rationale: |
          Diplomatic officers are not the exclusive duty-bearers under IHL.
      - text: International human rights auditors
        rationale: |
          Human-rights monitors are not the parties whose conduct of hostilities IHL principally regulates.
    explanation: |
      IHL binds parties to an armed conflict, including state forces and, in non-international armed conflicts, organized non-state armed groups. The choice uses "combatants" in the broad exam sense; formal combatant status is itself a technical IHL concept that differs by conflict classification.

  - id: q-peace-and-human-rights-humanitarian-law-and-human-rights-law-0006
    type: single_choice
    difficulty: easy
    stem: |
      What is another common name given to International Humanitarian Law?
    choices:
      - text: Law of armed conflict
        correct: true
      - text: Law of peaceful assembly
        rationale: |
          Peaceful-assembly law concerns civil liberties, not the law governing armed conflict.
      - text: Law of corporate trade
        rationale: |
          Corporate trade law regulates commercial transactions, not hostilities.
      - text: Law of public taxation
        rationale: |
          Tax law is unrelated to the conduct of armed conflict.
    explanation: |
      International Humanitarian Law is also commonly called the law of armed conflict or the law of war.

  - id: q-peace-and-human-rights-humanitarian-law-and-human-rights-law-0008
    type: single_choice
    difficulty: medium
    stem: |
      Protecting prisoners of war and wounded combatants falls under the scope of which body of law?
    choices:
      - text: International Humanitarian Law
        correct: true
      - text: International Corporate Trade Law
        rationale: |
          Commercial law does not establish the Geneva-law protections for prisoners of war or wounded combatants.
      - text: Domestic Municipal Zoning Code
        rationale: |
          Zoning rules concern land use, not treatment of protected persons in armed conflict.
      - text: National Revenue Tax Regulations
        rationale: |
          Tax regulations do not govern the protection of prisoners of war or the wounded.
    explanation: |
      Protection of prisoners of war and of wounded and sick members of armed forces is a core subject of International Humanitarian Law.
