meta:
  subject: general-information
  topic: peace-and-human-rights
  subtopic: humanitarian-law-and-human-rights-law
  exams:
  - cse-pro
  - cse-sub
questions:
- id: q-peace-and-human-rights-humanitarian-law-and-human-rights-law-0001
  lesson: lesson-peace-and-human-rights-hrl-and-ihl-scope
  keyPoint: 1
  type: single_choice
  difficulty: easy
  stem: 'What situation does IHL specifically govern?

    '
  choices:
  - text: Armed conflict
    correct: true
  - text: Any political dispute, even without armed conflict
    rationale: 'This treats disagreement as the legal trigger. Political disputes can cause fighting. Check whether armed conflict exists.

      '
  - text: Any economic recession, even without armed conflict
    rationale: 'This treats hardship as the trigger. Recessions can harm people. Check the law''s conflict-specific scope.

      '
  - text: Every election campaign, even without armed conflict
    rationale: 'This treats a political event as the trigger. Elections can involve tension. Check the armed-conflict requirement.

      '
  explanation: 'IHL governs situations of armed conflict. Some duties, such as preparation and training, must also be implemented during peace.

    '
- id: q-peace-and-human-rights-humanitarian-law-and-human-rights-law-0002
  lesson: lesson-peace-and-human-rights-hrl-and-ihl-scope
  keyPoint: 2
  type: single_choice
  difficulty: medium
  stem: 'Whom does IHL bind when they are parties to an armed conflict?

    '
  choices:
  - text: All parties to the conflict
    correct: true
  - text: Only state forces, excluding every non-state armed group
    rationale: 'This makes state status a condition. States make treaties. Check the rule covering all conflict parties.

      '
  - text: Only one side chosen because its cause is considered more just
    rationale: 'This makes obligations depend on moral preference. Sides dispute who is right. Check whether the law binds every party.

      '
  - text: Only outside observers rather than those actually conducting hostilities
    rationale: 'This substitutes observers for participants. Observers can monitor compliance. Check who conducts the conflict.

      '
  explanation: 'IHL binds all parties to an armed conflict, including state forces and non-state armed groups.

    '
- id: q-peace-and-human-rights-humanitarian-law-and-human-rights-law-0003
  lesson: lesson-peace-and-human-rights-hrl-and-ihl-scope
  keyPoint: 1
  type: single_choice
  difficulty: hard
  stem: |
    Which statement correctly compares when human rights law (HRL) and international humanitarian law (IHL) apply?
  choices:
  - text: HRL continues in peace and conflict; IHL governs armed conflict.
    correct: true
  - text: HRL ends when war begins; IHL ends when fighting begins.
    rationale: 'This reverses or removes both scopes. Each field has a different focus. Check what event IHL governs.

      '
  - text: HRL governs conflict only; IHL governs ordinary peaceful administration only.
    rationale: 'This swaps their main time scopes. Both regulate human conduct. Check the peacetime role of HRL.

      '
  - text: HRL governs only foreign nationals; IHL governs only a state's own citizens.
    rationale: 'This substitutes nationality for time scope. International sounds foreign. Check whether the question asks when the rules apply.

      '
  explanation: 'Human rights law continues during peace and armed conflict. IHL specifically governs armed conflict.

    '
- id: q-peace-and-human-rights-humanitarian-law-and-human-rights-law-0004
  lesson: lesson-peace-and-human-rights-hrl-and-ihl-scope
  keyPoint: 2
  type: single_choice
  difficulty: easy
  stem: 'Which body of law specifically restricts means and methods of warfare while protecting people outside active hostilities?

    '
  choices:
  - text: IHL
    correct: true
  - text: Human rights law alone, with no conflict-specific rules
    rationale: 'This overlooks the warfare-specific framework. Human rights law also protects people. Check the specific restrictions on warfare.

      '
  - text: Ordinary military supply contracts alone, without rules protecting persons
    rationale: 'This confuses war-related administration with humanitarian limits. Supplies support armed forces. Check the protective purpose.

      '
  - text: Domestic personnel conduct rules alone, excluding conflict obligations
    rationale: 'This substitutes workplace discipline. Military staff also have conduct rules. Check the law governing armed hostilities.

      '
  explanation: 'IHL limits how warfare is conducted and protects people who do not, or no longer, take part in hostilities.

    '
- id: q-peace-and-human-rights-humanitarian-law-and-human-rights-law-0005
  lesson: lesson-peace-and-human-rights-hrl-and-ihl-scope
  keyPoint: 2
  type: single_choice
  difficulty: medium
  stem: |
    A non-state armed group says IHL cannot bind it because it is not a government. Which assessment is correct?
  choices:
  - text: It is wrong if the group is a conflict party.
    correct: true
  - text: It is right whenever the group lacks an official government title.
    rationale: 'This makes formal state status decisive. Governments have recognized authority. Check IHL''s coverage of non-state parties.

      '
  - text: It is right whenever the group refuses to acknowledge the rules.
    rationale: 'This treats refusal as exemption. The group can reject a claim verbally. Check whether denial removes an obligation.

      '
  - text: It is wrong only if every member also works in a state office.
    rationale: 'This adds public employment as a condition. States are bound too. Check whether the group itself is a conflict party.

      '
  explanation: 'IHL binds all conflict parties. A non-state armed group that is a party is included.

    '
- id: q-peace-and-human-rights-humanitarian-law-and-human-rights-law-0006
  lesson: lesson-peace-and-human-rights-hrl-and-ihl-scope
  keyPoint: 1
  type: single_choice
  difficulty: easy
  stem: 'Which description matches International Humanitarian Law''s scope?

    '
  choices:
  - text: Law of armed conflict
    correct: true
  - text: Law of peaceful assembly
    rationale: 'This selects a human-rights-related subject. Both concern protections for people. Check the field''s armed-conflict focus.

      '
  - text: Law of corporate trade
    rationale: 'This selects commercial rules. International commerce also has rules. Check what conduct IHL governs.

      '
  - text: Law of public taxation
    rationale: 'This selects revenue law. States enforce both fields. Check the humanitarian subject.

      '
  explanation: 'IHL governs armed conflict and limits its effects. Some duties, such as teaching its rules, also require action in peace.

    '
- id: q-peace-and-human-rights-humanitarian-law-and-human-rights-law-0008
  lesson: lesson-peace-and-human-rights-people-protected-from-attack
  keyPoint: 2
  type: single_choice
  difficulty: medium
  stem: 'Which framework specifically protects wounded fighters and prisoners in armed conflict?

    '
  choices:
  - text: IHL
    correct: true
  - text: Corporate trade rules governing contracts between companies
    rationale: 'This chooses commerce rather than protected persons. War can disrupt business. Check the person''s role and condition.

      '
  - text: Municipal zoning rules governing permitted land uses
    rationale: 'This chooses local land regulation. Conflict can damage property. Check the humanitarian protection described.

      '
  - text: Tax rules governing the collection of national revenue
    rationale: 'This chooses revenue administration. Governments have financial duties in war. Check the law protecting persons outside hostilities.

      '
  explanation: 'Wounded fighters and prisoners can be persons no longer taking part in hostilities. Protecting such persons is a central purpose of IHL.

    '
- id: q-peace-and-human-rights-humanitarian-law-and-human-rights-law-0009
  lesson: lesson-peace-and-human-rights-iccpr-protected-rights
  keyPoint: 1
  type: single_choice
  difficulty: easy
  approved: false
  stem: |
    In a qualifying public emergency, which statement correctly describes HRL obligations?
  choices:
  - text: Some may permit lawful derogation; some cannot.
    correct: true
  - text: Every obligation disappears automatically until the emergency ends.
    rationale: 'This turns limited derogation into total suspension. Emergencies can alter some duties. Check the non-derogable protections.

      '
  - text: Any official may suspend any right solely by declaring it inconvenient.
    rationale: 'This replaces legal conditions with personal preference. Urgent work can be difficult. Check the applicable legal rules.

      '
  - text: No treaty can ever allow any derogation from any obligation in any situation.
    rationale: 'This treats continuous application as absence of legal exceptions. The framework continues. Check the lesson''s qualified emergency rule.

      '
  explanation: 'Some human-rights obligations may allow derogation under applicable emergency rules. Certain fundamental rights remain non-derogable.

    '
- id: q-peace-and-human-rights-humanitarian-law-and-human-rights-law-0010
  lesson: lesson-peace-and-human-rights-people-protected-from-attack
  keyPoint: 2
  type: single_choice
  difficulty: easy
  approved: false
  stem: 'Which person best fits IHL''s category of no longer participating in hostilities?

    '
  choices:
  - text: A fighter captured and held as a prisoner
    correct: true
  - text: A fighter presently attacking an opposing position with a weapon
    rationale: 'This selects continuing participation. The person is a conflict participant. Check whether the action has stopped.

      '
  - text: A fighter currently directing an ongoing attack while remaining uninjured
    rationale: 'This selects active involvement. Not personally firing can seem inactive. Check whether the person still participates.

      '
  - text: A fighter presently operating a weapon in an ongoing assault
    rationale: 'This selects active hostilities. The person may also face danger. Check participation rather than danger alone.

      '
  explanation: 'A captured prisoner is no longer taking part in hostilities. IHL''s protective purpose includes such persons.

    '
- id: q-peace-and-human-rights-humanitarian-law-and-human-rights-law-0011
  lesson: lesson-peace-and-human-rights-hrl-and-ihl-scope
  keyPoint: 2
  type: single_choice
  difficulty: easy
  approved: false
  stem: 'Which proposal conflicts with IHL''s stated purpose?

    '
  choices:
  - text: Allowing every warfare method whenever it might help win
    correct: true
  - text: Protecting people who are no longer participating in hostilities
    rationale: 'This mistakes protection for obstruction. Protection can limit tactical choices. Check the humanitarian aim.

      '
  - text: Restricting weapons and tactics through applicable conflict rules
    rationale: 'This treats restrictions as unrelated to IHL. Military tactics have technical purposes. Check the rules on means and methods.

      '
  - text: Preparing personnel to follow humanitarian obligations before fighting begins
    rationale: 'This treats preparation as unnecessary. The conflict-specific rules may not yet govern events. Check peacetime implementation duties.

      '
  explanation: 'IHL restricts means and methods of warfare. A possible advantage does not remove those humanitarian limits.

    '
- id: q-peace-and-human-rights-humanitarian-law-and-human-rights-law-0012
  lesson: lesson-peace-and-human-rights-ihl-preparation-and-peace
  keyPoint: 1
  type: single_choice
  difficulty: medium
  approved: false
  stem: 'Why can a state train personnel in IHL during peace?

    '
  choices:
  - text: Some implementation duties require advance preparation.
    correct: true
  - text: Because every routine peacetime interaction automatically becomes armed conflict
    rationale: 'This confuses preparation with the conflict trigger. IHL is taught during peace. Check when the substantive conflict framework applies.

      '
  - text: Because human-rights law stops applying whenever training begins
    rationale: 'This makes education replace a separate legal framework. Both fields concern protection. Check whether HRL continues.

      '
  - text: Because no IHL obligations can require any action before hostilities start
    rationale: 'This denies the lesson''s implementation exception. IHL governs armed conflict. Check the separate preparation duties.

      '
  explanation: 'The lesson identifies legislation and training as examples of IHL duties that require peacetime implementation. Preparing for compliance can happen before conflict.

    '
- id: q-peace-and-human-rights-humanitarian-law-and-human-rights-law-0013
  lesson: lesson-peace-and-human-rights-hrl-and-ihl-scope
  keyPoint: 2
  type: single_choice
  difficulty: medium
  approved: false
  stem: 'Which statement properly distinguishes people protected by IHL from parties bound by it?

    '
  choices:
  - text: Protected persons and bound parties are different categories.
    correct: true
  - text: Only protected civilians are bound, while conflict parties have no duties.
    rationale: 'This reverses protection and obligation. Civilians are central beneficiaries. Check who must follow conflict rules.

      '
  - text: All conflict parties are protected from every legal limit on their conduct.
    rationale: 'This turns being bound into being exempt. Parties have roles recognized by law. Check the duties placed on them.

      '
  - text: Every person protected by IHL must be a government official or a state soldier.
    rationale: 'This makes official status a condition of protection. State forces are one conflict party. Check the wider group outside hostilities.

      '
  explanation: 'IHL binds parties to the conflict. It protects persons who are not or are no longer participating in hostilities. Those are different legal roles.

    '
- id: q-peace-and-human-rights-humanitarian-law-and-human-rights-law-0014
  lesson: lesson-peace-and-human-rights-hrl-and-ihl-together
  keyPoint: 1
  type: single_choice
  difficulty: medium
  approved: false
  stem: 'During armed conflict, what happens to the human-rights framework in relation to IHL?

    '
  choices:
  - text: Both can apply.
    correct: true
  - text: IHL automatically replaces all human-rights law for every state action.
    rationale: 'This makes the frameworks mutually exclusive. IHL is conflict-specific. Check HRL''s continuing application.

      '
  - text: HRL applies only after every conflict rule has ceased to operate.
    rationale: 'This postpones rights protection until peace. HRL is important in peacetime. Check its wartime scope.

      '
  - text: Neither framework applies until all parties agree that their cause is identical.
    rationale: 'This makes agreement the trigger. Conflict parties often disagree. Check the stated legal scopes.

      '
  explanation: 'The two fields are distinct but complementary. HRL continues while IHL governs the armed conflict.

    '
- id: q-peace-and-human-rights-humanitarian-law-and-human-rights-law-0015
  lesson: lesson-peace-and-human-rights-hrl-and-ihl-scope
  keyPoint: 2
  type: single_choice
  difficulty: hard
  approved: false
  stem: 'Which statement describes IHL''s purpose without adding a claim about whether a war should begin?

    '
  choices:
  - text: It limits the effects of armed conflict.
    correct: true
  - text: It declares every war morally justified whenever one party invokes humanitarian goals.
    rationale: 'This confuses conduct limits with moral approval. Humanitarian language sounds positive. Check the law''s stated purpose.

      '
  - text: It grants a conflict party unlimited permission to fight once it promises to protect one group.
    rationale: 'This treats one protective promise as total authorization. Protection is an IHL goal. Check the continuing conduct restrictions.

      '
  - text: It concerns only deciding which national leader has the best political program.
    rationale: 'This substitutes political preference for humanitarian rules. Conflict can have political causes. Check the protections and warfare limits.

      '
  explanation: 'The lesson describes protection of persons and limits on means and methods. These limit conflict''s effects without deciding which political cause should prevail.

    '
- id: q-peace-and-human-rights-humanitarian-law-and-human-rights-law-0016
  lesson: lesson-peace-and-human-rights-iccpr-protected-rights
  keyPoint: 1
  type: single_choice
  difficulty: hard
  approved: false
  stem: |
    Under ICCPR Article 4, what does it mean for an obligation to be non-derogable?
  choices:
  - text: The obligation cannot be set aside by derogation.
    correct: true
  - text: The obligation may be suspended merely because an emergency is declared.
    rationale: 'This treats all obligations as derogable. Some may have emergency rules. Check the word non-derogable.

      '
  - text: The obligation applies only during the first stage of a public emergency.
    rationale: 'This invents a time limit. Emergencies have phases. Check whether any such phase limit is stated.

      '
  - text: The obligation depends solely on which political party holds the national executive office.
    rationale: 'This substitutes party choice for legal protection. Governments make policy decisions. Check whether the fundamental rule can be derogated from.

      '
  explanation: 'A non-derogable obligation remains protected against derogation even in a qualifying emergency.

    '
- id: q-peace-and-human-rights-humanitarian-law-and-human-rights-law-0017
  lesson: lesson-peace-and-human-rights-hrl-and-ihl-scope
  keyPoint: 3
  type: single_choice
  difficulty: hard
  approved: false
  stem: |
    Which relationship is central to international human rights law?
  choices:
  - text: A state and persons within its jurisdiction
    correct: true
  - text: Only rival companies negotiating prices across national borders
    rationale: 'This confuses international rights with international commerce. Both cross legal systems. Check the state-person relationship.

      '
  - text: Only regular armies fighting each other, with all ordinary individuals excluded
    rationale: 'This narrows HRL to the conflict framework. War raises rights concerns. Check persons within state jurisdiction.

      '
  - text: Only foreign diplomats bargaining over whether civilians have human dignity
    rationale: 'This confines rights to diplomacy. States discuss rights internationally. Check the continuing obligations toward people.

      '
  explanation: 'HRL primarily places duties on states toward persons within their jurisdiction.

    '
- id: q-peace-and-human-rights-humanitarian-law-and-human-rights-law-0018
  lesson: lesson-peace-and-human-rights-hrl-and-ihl-scope
  keyPoint: 2
  type: single_choice
  difficulty: hard
  approved: false
  stem: 'Which pair best represents IHL''s complementary protective and regulatory aims?

    '
  choices:
  - text: Protect persons outside hostilities and limit warfare methods.
    correct: true
  - text: Protect only governments' reputations and allow every tactic that serves them.
    rationale: 'This makes state interests the entire purpose. States participate in conflict. Check the persons protected and the conduct limits.

      '
  - text: Protect only weapon suppliers and settle the prices of all military equipment.
    rationale: 'This substitutes commerce for humanitarian protection. Weapons are relevant to warfare. Check means-and-method rules rather than prices.

      '
  - text: Protect only current attackers from restrictions and remove duties toward prisoners.
    rationale: 'This reverses the protective focus. Attackers are visible conflict participants. Check those no longer participating.

      '
  explanation: 'IHL protects persons not or no longer participating and restricts how hostilities are conducted. These are the two aims described.

    '
- id: q-peace-and-human-rights-humanitarian-law-and-human-rights-law-0019
  lesson: lesson-peace-and-human-rights-armed-conflict-types
  keyPoint: 2
  type: single_choice
  difficulty: exam
  approved: false
  stem: |
    An election campaign is tense, but the facts describe no armed conflict. Which conclusion follows?
  choices:
  - text: The campaign alone does not establish IHL's conflict trigger.
    correct: true
  - text: Every political campaign automatically falls under armed-conflict rules.
    rationale: 'This treats political tension as armed conflict. Elections can be contentious. Check whether the required situation is present.

      '
  - text: Human-rights law has no application because only armed conflict creates human rights.
    rationale: 'This makes rights conflict-dependent. IHL has that special scope. Check the continuing HRL framework.

      '
  - text: A tense campaign automatically permits suspension of every fundamental right.
    rationale: 'This turns tension into unlimited derogation. Emergencies may have special rules. Check qualifying conditions and non-derogable rights.

      '
  explanation: 'IHL governs armed conflict, which the facts do not establish. HRL remains the continuing framework for state treatment of people.

    '
- id: q-peace-and-human-rights-humanitarian-law-and-human-rights-law-0020
  lesson: lesson-peace-and-human-rights-hrl-and-ihl-scope
  keyPoint: 2
  type: single_choice
  difficulty: exam
  approved: false
  stem: 'Which statement avoids confusing a party''s non-state status with a civilian''s protected role?

    '
  choices:
  - text: A non-state conflict party is bound; a civilian can be protected.
    correct: true
  - text: Non-state status makes every armed group a civilian exempt from conflict obligations.
    rationale: 'This merges institutional status with participation. Neither category is the state army. Check whether the group is a conflict party.

      '
  - text: Civilian protection requires the person to join a recognized government's armed forces.
    rationale: 'This makes military membership a condition of civilian protection. States are conflict parties. Check the person''s lack of participation.

      '
  - text: Every conflict participant outside the government is automatically beyond all international law.
    rationale: 'This makes state status the only source of duties. States sign treaties. Check IHL''s all-party rule.

      '
  explanation: 'A non-state armed group can be a party bound by IHL. A civilian not participating in hostilities can be protected. These facts describe different roles.

    '
- id: q-peace-and-human-rights-humanitarian-law-and-human-rights-law-0021
  lesson: lesson-peace-and-human-rights-ihl-preparation-and-peace
  keyPoint: 1
  type: single_choice
  difficulty: exam
  approved: false
  stem: |
    An official says HRL has no wartime role and IHL has no peacetime implementation duties. Which statement corrects these claims?
  choices:
  - text: HRL continues in conflict; some IHL duties require preparation in peace.
    correct: true
  - text: The claim is wholly correct because distinct legal fields can never have overlapping or preparatory obligations.
    rationale: 'This treats distinct fields as mutually exclusive. Their main focuses differ. Check continuous HRL application and the IHL implementation examples.

      '
  - text: 'Reverse the claim completely: HRL applies only in war and IHL governs only ordinary peaceful administration.'
    rationale: 'This swaps the two scopes instead of correcting their limits. Both fields protect people. Check each stated time scope.

      '
  - text: Accept the claim whenever state authorities have chosen not to provide any training before an armed conflict begins.
    rationale: 'This treats lack of preparation as removal of a duty. Training may have been omitted in practice. Check the legal obligation rather than actual compliance.

      '
  explanation: 'HRL applies in peace and armed conflict. IHL governs armed conflict, but some duties such as training require implementation during peace. Distinct focuses do not remove those continuing or preparatory duties.

    '
- id: q-peace-and-human-rights-humanitarian-law-and-human-rights-law-0022
  lesson: lesson-peace-and-human-rights-armed-conflict-types
  keyPoint: 1
  type: single_choice
  difficulty: exam
  stem: |
    Foreign armed forces occupy another state's territory. No armed resistance occurs, and neither state declares war. Which assessment is correct under the Geneva Conventions?
  choices:
  - text: Occupation can trigger the rules for an IAC.
    correct: true
  - text: A declaration of war is required before occupation can trigger IHL.
    rationale: |
      This makes a formal declaration decisive. Check whether occupation can bring the rules into force without one.
  - text: Armed resistance is required before occupation can fall under IHL.
    rationale: |
      This treats the absence of fighting as an exemption. Check the rule for occupation without resistance.
  - text: Occupation becomes a NIAC whenever the local population does not resist.
    rationale: |
      This confuses international occupation with internal fighting. Check the states involved, not resistance alone.
  explanation: |
    The Geneva Conventions cover occupation of a state's territory even without armed resistance. A formal declaration of war is not required. Source: Geneva Conventions, common Article 2.
- id: q-peace-and-human-rights-humanitarian-law-and-human-rights-law-0023
  lesson: lesson-peace-and-human-rights-hrl-and-ihl-together
  keyPoint: 2
  type: single_choice
  difficulty: exam
  stem: |
    During an IAC, a legal adviser reviews an attack on an active opposing combatant. How should the adviser assess a claim that the attack necessarily violates the right to life?
  choices:
  - text: Consider target status and IHL attack rules.
    correct: true
  - text: Treat every battlefield death as a violation regardless of target status.
    rationale: |
      This treats the right to life as a ban on every battlefield attack. Check the target and the rules for fighting.
  - text: Disregard the right to life because armed conflict suspends all HRL duties.
    rationale: |
      This treats war as an end to human rights. Check that HRL continues during armed conflict.
  - text: Accept national authorization as sufficient without checking the attack rules.
    rationale: |
      This treats national permission as the full test. Check whether the killing could still be arbitrary.
  explanation: |
    The right to life bars arbitrary killing. During battlefield fighting, the target's status and IHL attack rules help assess that protection. An active opposing combatant is not automatically protected from every attack. Source: ICCPR, Article 6; Additional Protocol I, Articles 48, 51, and 57.
- id: q-peace-and-human-rights-humanitarian-law-and-human-rights-law-0024
  lesson: lesson-peace-and-human-rights-iccpr-emergency-conditions
  keyPoint: 1
  type: single_choice
  difficulty: exam
  stem: |
    An emergency threatens the life of the nation, but the government has not officially proclaimed it. An official argues that the seriousness of the danger alone permits derogation under ICCPR Article 4. Which assessment is correct?
  choices:
  - text: Official proclamation is also required.
    correct: true
  - text: The danger alone removes the need for any official proclamation.
    rationale: |
      This checks the danger but drops the announcement. Check both conditions for using Article 4.
  - text: An official proclamation would allow derogation during any ordinary protest.
    rationale: |
      This treats an announcement as enough. Check whether the emergency threatens the life of the nation.
  - text: The official may replace proclamation with a personal finding of urgency.
    rationale: |
      This substitutes one person's view for an official act. Check how the emergency must be announced.
  explanation: |
    Article 4 requires an emergency threatening the life of the nation and an official proclamation of its existence. The stated facts meet only the first condition. Source: ICCPR, Article 4(1).
- id: q-peace-and-human-rights-humanitarian-law-and-human-rights-law-0025
  lesson: lesson-peace-and-human-rights-iccpr-emergency-conditions
  keyPoint: 2
  type: single_choice
  difficulty: exam
  stem: |
    During a qualifying, officially proclaimed emergency, a state uses derogation for a treaty duty that permits it. The measure is strictly needed, respects other international duties, and meets the notice requirements. It selects affected people solely by religion. Which remaining defect violates Article 4?
  choices:
  - text: Selection solely by religion
    correct: true
  - text: Keeping the measure within what the emergency strictly requires
    rationale: |
      This mistakes a safeguard for a defect. Check that the measure must be strictly needed.
  - text: Respecting international duties beyond those affected by derogation
    rationale: |
      This treats other duties as optional during an emergency. Check Article 4's requirement to respect them.
  - text: Giving other treaty states notice through the UN Secretary-General
    rationale: |
      This mistakes required notice for a violation. Check who must receive the state's notice.
  explanation: |
    A derogation measure must not discriminate solely because of religion. Meeting other conditions does not remove this rule. Source: ICCPR, Article 4(1).
- id: q-peace-and-human-rights-humanitarian-law-and-human-rights-law-0026
  lesson: lesson-peace-and-human-rights-iccpr-protected-rights
  keyPoint: 2
  type: single_choice
  difficulty: exam
  stem: |
    A reviewer argues that because freedom of religion is non-derogable, every outward religious practice is beyond all treaty limits. Which distinction correctly addresses the argument?
  choices:
  - text: Non-derogation differs from permitted limits.
    correct: true
  - text: Non-derogation means outward practice can never face a treaty limit.
    rationale: |
      This treats protection from suspension as freedom from all limits. Check the treaty's rules for outward practice.
  - text: An emergency lets the state suspend freedom of belief if notice is given.
    rationale: |
      This treats notice as permission to suspend belief. Check which protections Article 4 keeps in force.
  - text: A permitted limit on outward practice allows forced changes of belief.
    rationale: |
      This merges practice with belief. Check that a limit on outward practice does not permit forced belief.
  explanation: |
    Article 4 does not permit suspension of Article 18. Article 18 still allows necessary limits on outward religious practice under its own rules. Freedom of belief cannot be suspended through derogation. Source: ICCPR, Articles 4(2) and 18.
- id: q-peace-and-human-rights-humanitarian-law-and-human-rights-law-0027
  lesson: lesson-peace-and-human-rights-people-protected-from-attack
  keyPoint: 1
  type: single_choice
  difficulty: exam
  stem: |
    In an armed conflict, a civilian directly participates in hostilities. Which statement correctly describes the effect on protection from direct attack?
  choices:
  - text: It is lost for the time of direct participation.
    correct: true
  - text: It continues throughout participation solely because the person is a civilian.
    rationale: |
      This treats civilian status as protection during every act. Check the effect of direct participation.
  - text: It is permanently lost for all later periods after participation has ended.
    rationale: |
      This turns a time-based rule into a permanent loss. Check how long the stated loss lasts.
  - text: It removes every limit on the weapons used against the person during participation.
    rationale: |
      This confuses target protection with weapons rules. Check the separate limits that still apply.
  explanation: |
    A civilian loses protection from direct attack for the time of direct participation in hostilities. The applicable weapons and attack rules still apply. Source: Additional Protocol I, Article 51(3).
- id: q-peace-and-human-rights-humanitarian-law-and-human-rights-law-0028
  lesson: lesson-peace-and-human-rights-people-protected-from-attack
  keyPoint: 3
  type: single_choice
  difficulty: exam
  stem: |
    During an armed conflict, custodians withhold needed care from a wounded prisoner solely because he belongs to the opposing side. Which obligation directly addresses this conduct?
  choices:
  - text: Humane treatment and needed medical care
    correct: true
  - text: Permission to withhold care from anyone captured from the opposing side
    rationale: |
      This makes enemy status a reason to deny care. Check the duties toward wounded people in custody.
  - text: Permission to torture a prisoner until the prisoner provides information
    rationale: |
      This treats useful information as an excuse for abuse. Check the requirement of humane treatment.
  - text: Permission to execute a prisoner without trial because fighting continues
    rationale: |
      This confuses ongoing war with permission to punish without trial. Check custody protections separately.
  explanation: |
    People in custody must receive humane treatment. Wounded and sick people must receive needed care without unfair discrimination. Belonging to the opposing side does not remove those duties. Source: Geneva Conventions, common Article 3.
- id: q-peace-and-human-rights-humanitarian-law-and-human-rights-law-0029
  lesson: lesson-peace-and-human-rights-weapons-limits
  keyPoint: 1
  type: single_choice
  difficulty: exam
  stem: |
    A weapon cannot be directed at a specific military target, and its effects cannot be confined within IHL limits. A commander proposes using it only against enemy forces. Which assessment is correct?
  choices:
  - text: The weapon is indiscriminate by nature.
    correct: true
  - text: The commander's intended target removes the weapon's indiscriminate character.
    rationale: |
      This treats intention as control over the weapon. Check whether it can actually separate military targets from protected people.
  - text: The weapon is lawful if the commander expects a military advantage from using it.
    rationale: |
      This lets expected gain override a weapons ban. Check the weapon's effects before weighing an attack's gain.
  - text: The weapon is prohibited only when protected civilians are its intended target.
    rationale: |
      This makes intention the only test. Check whether the weapon can keep its effects within IHL limits.
  explanation: |
    A weapon is indiscriminate by nature if it cannot be directed at a specific military target or its effects cannot be kept within IHL limits. Its use is prohibited. Source: Additional Protocol I, Article 51(4)(b)-(c); ICRC Customary IHL, Rule 71.
- id: q-peace-and-human-rights-humanitarian-law-and-human-rights-law-0030
  lesson: lesson-peace-and-human-rights-weapons-limits
  keyPoint: 2
  type: single_choice
  difficulty: exam
  stem: |
    A weapon can be aimed precisely at opposing fighters but causes suffering beyond what a lawful military purpose can justify. Which rule remains relevant despite its accuracy?
  choices:
  - text: The ban on unnecessary suffering
    correct: true
  - text: A rule allowing any injury whenever a weapon can be aimed precisely
    rationale: |
      This makes accuracy the only weapons test. Check the separate limit on injury and suffering.
  - text: A rule protecting only civilians from excessive injury caused by weapons
    rationale: |
      This excludes fighters from a weapons safeguard. Check who is protected from unnecessary suffering.
  - text: A rule permitting every weapon used solely against opposing armed forces
    rationale: |
      This treats a military target as permission to use any weapon. Check weapons limits separately from target status.
  explanation: |
    Weapons must not cause superfluous injury or unnecessary suffering. This rule protects fighters too. Accurate aiming does not remove that limit. Source: Additional Protocol I, Article 35(2).
- id: q-peace-and-human-rights-humanitarian-law-and-human-rights-law-0031
  lesson: lesson-peace-and-human-rights-weapons-limits
  keyPoint: 3
  type: single_choice
  difficulty: exam
  stem: |
    A planner argues that poison gas may be used in war if it offers a definite military gain and is aimed at opposing forces. What is the controlling rule?
  choices:
  - text: The treaty ban still applies.
    correct: true
  - text: Definite military gain creates an exception to the poison-gas ban.
    rationale: |
      This uses military gain to override a specific ban. Check whether the prohibition has that exception.
  - text: A military target makes every proposed weapon lawful for the attack.
    rationale: |
      This treats target status as the full test. Check the separate prohibition on poison gas.
  - text: A commander's approval replaces the treaty rule on using poison gas.
    rationale: |
      This treats an order as permission to ignore a treaty. Check the weapon's legal limits before its approval.
  explanation: |
    The Geneva Gas Protocol prohibits using poison gas in war. A claimed military gain does not cancel the prohibition. Source: Geneva Gas Protocol of 1925.
- id: q-peace-and-human-rights-humanitarian-law-and-human-rights-law-0032
  lesson: lesson-peace-and-human-rights-military-targets
  keyPoint: 1
  type: single_choice
  difficulty: exam
  stem: |
    An attack plan lists protected civilians and civilian homes as intended targets solely to pressure the opposing side. Which principle directly prohibits that choice of targets?
  choices:
  - text: Distinction
    correct: true
  - text: Military gain, allowing direct civilian targeting if the gain is large
    rationale: |
      This lets claimed gain override civilian protection. Check the ban on directly attacking protected civilians.
  - text: Enemy pressure, allowing civilian targeting if it might weaken the opposing side
    rationale: |
      This treats pressure as a reason to attack civilians. Check whether the intended targets are protected.
  - text: Military objective status, established solely by the pressure an attack may create
    rationale: |
      This treats fear or pressure as enough to make civilian homes military targets. Check what distinction protects.
  explanation: |
    Distinction requires attacks to be directed at military targets. Protected civilians and civilian objects must not be directly attacked. Pressure on the opposing side does not change their protected status. Source: Additional Protocol I, Articles 48, 51(2), and 52(1).
- id: q-peace-and-human-rights-humanitarian-law-and-human-rights-law-0033
  lesson: lesson-peace-and-human-rights-military-targets
  keyPoint: 2
  type: single_choice
  difficulty: exam
  stem: |
    An adviser assesses whether an object is a military objective. The object effectively contributes to military action, but its destruction, capture, or neutralization would offer no definite military gain in the circumstances. Which conclusion follows?
  choices:
  - text: The object fails the stated test.
    correct: true
  - text: Effective contribution alone satisfies both conditions for a military objective.
    rationale: |
      This treats the first condition as enough. Check the separate requirement of a definite military gain.
  - text: The object qualifies because any connection to military action is sufficient.
    rationale: |
      This weakens the test to a connection alone. Check both required conditions in the circumstances.
  - text: The object qualifies whenever destroying it would frighten the opposing side.
    rationale: |
      This substitutes fear for the missing military gain. Check the conditions for a military objective.
  explanation: |
    Both conditions must be met. The object must effectively help military action, and its destruction, capture, or neutralization must offer a definite military gain in the circumstances. The second condition is absent. Source: Additional Protocol I, Article 52(2).
- id: q-peace-and-human-rights-humanitarian-law-and-human-rights-law-0034
  lesson: lesson-peace-and-human-rights-attack-rules
  keyPoint: 1
  type: single_choice
  difficulty: exam
  stem: |
    A verified military target is selected for attack. The expected incidental civilian harm would be excessive in relation to the concrete and direct military advantage anticipated. Civilians are not the intended targets. Which conclusion follows?
  choices:
  - text: Proportionality prohibits the planned attack.
    correct: true
  - text: A verified military target removes the need to compare harm with advantage.
    rationale: |
      This makes target status the only check. Check expected civilian harm separately.
  - text: Unintended civilian harm cannot make an attack unlawful under proportionality.
    rationale: |
      This treats lack of intent as enough. Check that proportionality covers incidental civilian harm.
  - text: Any military advantage permits the attack regardless of expected civilian harm.
    rationale: |
      This treats all gains as sufficient. Check whether the harm is excessive compared with the expected gain.
  explanation: |
    Proportionality bars an attack expected to cause incidental civilian harm excessive compared with its concrete and direct military gain. The facts state that this limit is exceeded. Source: Additional Protocol I, Articles 51(5)(b) and 57(2)(a)(iii).
- id: q-peace-and-human-rights-humanitarian-law-and-human-rights-law-0035
  lesson: lesson-peace-and-human-rights-attack-rules
  keyPoint: 2
  type: single_choice
  difficulty: exam
  stem: |
    A military target remains lawful, but new information makes clear that an attack would cause excessive civilian harm compared with its expected military gain. A warning has already been issued. What must the planner do?
  choices:
  - text: Cancel or stop the attack.
    correct: true
  - text: Proceed because the warning satisfies every precaution requirement.
    rationale: |
      This treats a warning as permission to continue. Check what the new information shows about civilian harm.
  - text: Proceed because the target's military status has not changed.
    rationale: |
      This checks the target but ignores excessive harm. Check both requirements before continuing.
  - text: Continue using the earlier estimate and disregard the new information.
    rationale: |
      This freezes the review at the earlier plan. Check whether new facts require cancellation or stopping.
  explanation: |
    An attack must be canceled or stopped when expected civilian harm becomes excessive compared with the expected military gain. A warning does not make the attack lawful. Source: Additional Protocol I, Article 57(2)(b).
- id: q-peace-and-human-rights-humanitarian-law-and-human-rights-law-0036
  lesson: lesson-peace-and-human-rights-ihl-preparation-and-peace
  keyPoint: 2
  type: single_choice
  difficulty: exam
  stem: |
    A community mediation procedure requires groups to identify their needs, discuss lawful options, and adopt terms that specify actions and allow compliance to be checked. Two groups have completed the first two steps for a shared facility. Which action meets the remaining requirement?
  choices:
  - text: Set clear steps and a way to check compliance.
    correct: true
  - text: Announce that the stronger group alone will decide every future use.
    rationale: |
      This replaces agreement with one side's control. Check whether the steps address both groups' needs.
  - text: Leave the terms unclear so each group can follow its own understanding.
    rationale: |
      This treats unclear terms as flexibility. Check whether each group can tell what was agreed.
  - text: Treat the discussion itself as proof that an armed conflict legally exists.
    rationale: |
      This confuses seeking agreement with classifying violence. Check that armed conflict requires separate legal tests.
  explanation: |
    After hearing needs and discussing lawful options, the groups should agree on clear steps and a way to check whether people follow them. These are the lesson's practical peace steps, not a treaty procedure. Any agreement must respect basic rights. Source for that rights limit: ICCPR, Article 5(1).
