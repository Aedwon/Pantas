questions:
  - id: q-peace-and-human-rights-human-rights-fundamentals-0001
    type: single_choice
    difficulty: easy
    stem: |
      Which article of the 1987 Constitution creates the Commission on Human Rights?
    choices:
      - text: Article XIII
        correct: true
      - text: Article III
        rationale: |
          Article III is the Bill of Rights. The Commission on Human Rights itself is created under Article XIII.
      - text: Article IX
        rationale: |
          Article IX governs the Constitutional Commissions such as the CSC, COMELEC, and COA. The CHR is created under Article XIII.
      - text: Article XI
        rationale: |
          Article XI covers Accountability of Public Officers. The CHR is created under Article XIII.
    explanation: |
      Article XIII (Social Justice and Human Rights), Section 17 creates the independent Commission on Human Rights.

  - id: q-peace-and-human-rights-human-rights-fundamentals-0002
    type: single_choice
    difficulty: easy
    stem: |
      What title is given to Article XIII of the 1987 Constitution?
    choices:
      - text: Social Justice and Human Rights
        correct: true
      - text: Bill of Rights and Constitutional Freedoms
        rationale: |
          The Bill of Rights is Article III. Article XIII is titled Social Justice and Human Rights.
      - text: General Provisions and Public Office Rules
        rationale: |
          General Provisions is Article XVI. Article XIII is titled Social Justice and Human Rights.
      - text: Declaration of Principles and State Policy
        rationale: |
          The Declaration of Principles and State Policies is Article II. Article XIII is Social Justice and Human Rights.
    explanation: |
      Article XIII of the 1987 Constitution is titled Social Justice and Human Rights.

  - id: q-peace-and-human-rights-human-rights-fundamentals-0003
    type: single_choice
    difficulty: easy
    stem: |
      Which constitutional article serves as the primary domestic guarantee of individual human rights in the Philippines?
    choices:
      - text: Article III
        correct: true
      - text: Article I
        rationale: |
          Article I defines the National Territory. Civil and political liberties are principally protected in Article III.
      - text: Article IV
        rationale: |
          Article IV defines Philippine Citizenship. The Bill of Rights is Article III.
      - text: Article V
        rationale: |
          Article V governs Suffrage. The Bill of Rights is Article III.
    explanation: |
      Article III, the Bill of Rights, is the primary domestic constitutional guarantee of fundamental civil and political rights.

  - id: q-peace-and-human-rights-human-rights-fundamentals-0004
    type: single_choice
    difficulty: medium
    stem: |
      Whom does international human rights law primarily bind in its obligations?
    choices:
      - text: State authorities
        correct: true
      - text: Private corporate executives
        rationale: |
          Private actors may have duties under domestic law and other frameworks, but international human rights treaty obligations primarily bind states and their authorities.
      - text: International tourist travelers
        rationale: |
          Individual travelers are not the primary duty-bearers under international human rights treaties.
      - text: Foreign commercial shipping firms
        rationale: |
          International human rights law primarily imposes treaty duties on states, not private commercial firms as such.
    explanation: |
      International human rights law primarily places legal duties on states and state authorities to respect, protect, and fulfill human rights.

  - id: q-peace-and-human-rights-human-rights-fundamentals-0005
    type: single_choice
    difficulty: medium
    stem: |
      Human rights are characterized as inherent to all human beings, meaning they exist in what manner?
    choices:
      - text: Possessed by virtue of humanity
        correct: true
      - text: Granted exclusively by government presidential decree
        rationale: |
          Human rights are understood as inherent to persons, not merely benefits created at presidential discretion.
      - text: Conditioned upon paying annual state property income taxes
        rationale: |
          Human rights are not conditioned on payment of property taxes.
      - text: Restricted to wealthy landholding property title holders
        rationale: |
          Human rights are universal and are not restricted to people with property or wealth.
    explanation: |
      Human rights are inherent to every person by virtue of being human, rather than privileges granted only by government favor.

  - id: q-peace-and-human-rights-human-rights-fundamentals-0006
    type: single_choice
    difficulty: medium
    stem: |
      Which body is established by the 1987 Constitution as the independent national office promoting human rights protection?
    choices:
      - text: Commission on Human Rights
        correct: true
      - text: National Security Council office
        rationale: |
          The National Security Council deals with national-security policy. The Constitution creates the CHR as the independent human-rights office.
      - text: Department of Justice secretariat
        rationale: |
          The Department of Justice is an executive department. The Constitution creates the independent Commission on Human Rights.
      - text: Armed Forces Grievance tribunal
        rationale: |
          An internal military body is not the constitutional human-rights commission.
    explanation: |
      Article XIII, Section 17 creates the independent Commission on Human Rights.

  - id: q-peace-and-human-rights-human-rights-fundamentals-0007
    type: single_choice
    difficulty: hard
    stem: |
      When does international human rights law apply to protect individuals?
    choices:
      - text: At all times in peace and conflict
        correct: true
      - text: Only during formally declared active international wartime
        rationale: |
          Human rights law is not limited to wartime; it continues to apply in peacetime and during armed conflict, subject to the rules governing any lawful limitations or derogations.
      - text: Only during official national presidential election periods
        rationale: |
          Human rights obligations are continuous and are not limited to election periods.
      - text: Only during municipal emergency disaster curfew hours
        rationale: |
          Human rights obligations are not triggered only by local emergencies or curfews.
    explanation: |
      International human rights law applies in peacetime and during armed conflict. Particular rights can have lawful limitations, and some treaty obligations may permit tightly regulated derogations during qualifying emergencies, but the legal framework itself continues to apply.

  - id: q-peace-and-human-rights-human-rights-fundamentals-0008
    type: single_choice
    difficulty: hard
    stem: |
      What fundamental feature distinguishes human rights from statutory privileges granted by state legislation?
    choices:
      - text: Inherent to human dignity
        correct: true
      - text: Revocable at any local mayor personal discretion
        rationale: |
          Human rights are not ordinary local privileges that a mayor may withdraw at personal discretion.
      - text: Expiring automatically after five calendar years
        rationale: |
          Human rights are not time-limited licenses that automatically expire after a fixed number of years.
      - text: Subject to mandatory monthly state fee payment
        rationale: |
          Enjoyment of human rights is not conditioned on paying a monthly government fee.
    explanation: |
      Human rights are grounded in the inherent dignity of human beings. That does not mean every right is absolute: legal systems may recognize carefully defined limitations, and some treaties permit limited derogations in qualifying emergencies. The key distinction here is that human rights are not merely temporary privileges granted at government discretion.
