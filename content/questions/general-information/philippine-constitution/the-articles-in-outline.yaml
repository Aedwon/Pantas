  - id: q-philippine-constitution-the-articles-in-outline-0014
    type: single_choice
    difficulty: easy
    stem: |
      What is the topic of Article I of the 1987 Constitution?
    choices:
      - text: National Territory
        correct: true
      - text: Declaration of Principles and State Policies
        rationale: |
          You selected Declaration of Principles, which is Article II. Article I defines the National Territory of the Philippines.
      - text: Accountability of Public Officers in office
        rationale: |
          You picked Accountability of Public Officers, which is Article XI. Article I defines the National Territory.
      - text: Constitutional Commissions administrative rules
        rationale: |
          You chose Constitutional Commissions, which is Article IX. Article I defines the National Territory.
    explanation: |
      Article I defines the National Territory of the Philippines.

  - id: q-philippine-constitution-the-articles-in-outline-0015
    type: single_choice
    difficulty: medium
    stem: |
      Which article of the 1987 Constitution governs the Legislative Department?
    choices:
      - text: Article VI
        correct: true
      - text: Article V
        rationale: |
          You selected Article V, which covers Suffrage. The Legislative Department (Congress) is defined in Article VI.
      - text: Article VII
        rationale: |
          You picked Article VII, which covers the Executive Department. The Legislative Department is set out in Article VI.
      - text: Article VIII
        rationale: |
          You chose Article VIII, which covers the Judicial Department. The Legislative Department is set out in Article VI.
    explanation: |
      Article VI details the Legislative Department (Congress of the Philippines).
