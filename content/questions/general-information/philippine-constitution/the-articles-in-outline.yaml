questions:
- id: q-philippine-constitution-the-articles-in-outline-0001
  lesson: lesson-philippine-constitution-constitution-preamble-and-article-count
  keyPoint: 1
  type: single_choice
  difficulty: easy
  stem: 'Excluding the Preamble, how many articles are in the 1987 Constitution?

    '
  choices:
  - text: '18'
    correct: true
  - text: '17'
    rationale: 'This stops at the amendments article. XVII is near the end. Check whether Transitory Provisions follows.

      '
  - text: '19'
    rationale: 'This counts the Preamble as a numbered article. It appears before Article I. Check which parts are numbered.

      '
  - text: '22'
    rationale: 'This uses the Bill of Rights section count. It is a familiar constitutional number. Check articles versus sections.

      '
  explanation: 'The Preamble is followed by Article I through Article XVIII. XVIII is eighteen.

    '
- id: q-philippine-constitution-the-articles-in-outline-0002
  lesson: lesson-philippine-constitution-constitution-articles-i-to-v
  keyPoint: 2
  type: single_choice
  difficulty: easy
  stem: 'A study index assigns the Bill of Rights to Article IV. Which correction follows from the outline?

    '
  choices:
  - text: Move it to Article III.
    correct: true
  - text: Keep it in Article IV because citizenship and the Bill of Rights have identical titles.
    rationale: 'This merges neighboring topics. Citizenship relates to some rights. Check the distinct article headings.

      '
  - text: Move it to Article IX because every rights guarantee is a constitutional commission.
    rationale: 'This treats guarantees as offices. Institutions can protect rights. Check the difference between a rule and a body.

      '
  - text: Move it to Article XIII because that replaces Article III in the current outline.
    rationale: 'This treats related subjects as replacement. Both concern rights. Check whether both appear separately.

      '
  explanation: 'Article III is the Bill of Rights. Article IV is Citizenship, so the index must move that heading to III.

    '
- id: q-philippine-constitution-the-articles-in-outline-0003
  lesson: lesson-philippine-constitution-constitution-articles-i-to-v
  keyPoint: 2
  type: single_choice
  difficulty: easy
  stem: 'Where does the outline place Citizenship?

    '
  choices:
  - text: Article IV
    correct: true
  - text: Article II
    rationale: 'This selects Declaration of Principles and State Policies. These articles also concern the state or its institutions. Check the specific subject Citizenship.

      '
  - text: Article VI
    rationale: 'This selects The Legislative Department. These articles also concern the state or its institutions. Check the specific subject Citizenship.

      '
  - text: Article VIII
    rationale: 'This selects The Judicial Department. These articles also concern the state or its institutions. Check the specific subject Citizenship.

      '
  explanation: 'Article IV covers Citizenship.

    '
- id: q-philippine-constitution-the-articles-in-outline-0004
  lesson: lesson-philippine-constitution-constitution-articles-i-to-v
  keyPoint: 2
  type: single_choice
  difficulty: easy
  stem: 'What is Article V''s subject?

    '
  choices:
  - text: Suffrage
    correct: true
  - text: Citizenship
    rationale: 'This selects the neighboring status topic. Citizenship matters for voting. Check the article devoted to voting rights.

      '
  - text: Bill of Rights
    rationale: 'This selects a broader liberties article. Voting is a political right. Check the specific Article V heading.

      '
  - text: Local Government
    rationale: 'This selects a subject involving elected offices. Local elections involve voters. Check suffrage versus government structure.

      '
  explanation: 'Article V is Suffrage.

    '
- id: q-philippine-constitution-the-articles-in-outline-0005
  lesson: lesson-philippine-constitution-constitution-department-articles
  keyPoint: 1
  type: single_choice
  difficulty: medium
  stem: 'Which article concerns the Executive Department?

    '
  choices:
  - text: Article VII
    correct: true
  - text: Article VI
    rationale: 'This selects The Legislative Department. The neighboring branch and commission articles can be confused. Check the specific subject the Executive Department.

      '
  - text: Article VIII
    rationale: 'This selects The Judicial Department. The neighboring branch and commission articles can be confused. Check the specific subject the Executive Department.

      '
  - text: Article IX
    rationale: 'This selects Constitutional Commissions. The neighboring branch and commission articles can be confused. Check the specific subject the Executive Department.

      '
  explanation: 'Article VII covers the Executive Department.

    '
- id: q-philippine-constitution-the-articles-in-outline-0006
  lesson: lesson-philippine-constitution-constitution-commission-articles
  keyPoint: 1
  type: single_choice
  difficulty: medium
  stem: 'What is the overall subject of Article IX?

    '
  choices:
  - text: Constitutional Commissions
    correct: true
  - text: Accountability of Public Officers
    rationale: 'This selects a related accountability article. Commission members hold public office. Check the commission structure article.

      '
  - text: Social Justice and Human Rights
    rationale: 'This selects the article creating a different commission. CHR also has commission in its name. Check the three Article IX bodies.

      '
  - text: National Economy and Patrimony
    rationale: 'This selects the neighboring economy article. Auditing can involve public finances. Check Article IX''s specific heading.

      '
  explanation: 'Article IX is Constitutional Commissions. Its parts include common provisions and the three named commissions.

    '
- id: q-philippine-constitution-the-articles-in-outline-0007
  lesson: lesson-philippine-constitution-constitution-local-government-and-welfare
  keyPoint: 1
  type: single_choice
  difficulty: medium
  stem: 'Which article concerns Local Government?

    '
  choices:
  - text: Article X
    correct: true
  - text: Article VIII
    rationale: 'This selects The Judicial Department. Each article regulates an important public subject, but its heading is distinct. Check the specific subject Local Government.

      '
  - text: Article XII
    rationale: 'This selects National Economy and Patrimony. Each article regulates an important public subject, but its heading is distinct. Check the specific subject Local Government.

      '
  - text: Article XIV
    rationale: 'This selects Education, Science and Technology, Arts, Culture and Sports. Each article regulates an important public subject, but its heading is distinct. Check the specific subject Local Government.

      '
  explanation: 'Article X covers Local Government.

    '
- id: q-philippine-constitution-the-articles-in-outline-0008
  lesson: lesson-philippine-constitution-constitution-local-government-and-welfare
  keyPoint: 2
  type: single_choice
  difficulty: medium
  stem: |
    An index assigns public-officer accountability to Article XVI, General Provisions. Which revision places the topic under the correct article?
  choices:
  - text: Use Article XI for accountability.
    correct: true
  - text: Keep Article XVI because general means it replaces every specific article.
    rationale: 'This treats a broad heading as universal scope. General sounds inclusive. Check the specific accountability entry.

      '
  - text: Use Article XVIII because all public service is a temporary transition.
    rationale: 'This confuses continuing duties with transitions. Officials'' terms may end. Check the stated subject of XVIII.

      '
  - text: Use Article XVII because misconduct automatically amends the Constitution.
    rationale: 'This confuses accountability with changing the document. Both involve constitutional rules. Check the purpose of amendments.

      '
  explanation: 'The outline assigns Accountability of Public Officers to Article XI. A broad title in another article does not replace that specific entry.

    '
- id: q-philippine-constitution-the-articles-in-outline-0009
  lesson: lesson-philippine-constitution-constitution-other-fields-and-change
  keyPoint: 1
  type: single_choice
  difficulty: medium
  stem: 'Which article groups education, science, technology, arts, culture, and sports?

    '
  choices:
  - text: Article XIV
    correct: true
  - text: Article XII
    rationale: 'This selects National Economy and Patrimony. The adjacent social and cultural headings are easy to mix. Check the specific subject Education, Science and Technology, Arts, Culture and Sports.

      '
  - text: Article XIII
    rationale: 'This selects Social Justice and Human Rights. The adjacent social and cultural headings are easy to mix. Check the specific subject Education, Science and Technology, Arts, Culture and Sports.

      '
  - text: Article XVIII
    rationale: 'This selects Transitory Provisions. The adjacent social and cultural headings are easy to mix. Check the specific subject Education, Science and Technology, Arts, Culture and Sports.

      '
  explanation: 'Article XIV covers Education, Science and Technology, Arts, Culture and Sports.

    '
