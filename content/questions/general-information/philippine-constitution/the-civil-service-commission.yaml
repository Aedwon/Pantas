meta:
  subject: general-information
  topic: philippine-constitution
  subtopic: the-civil-service-commission
  exams:
    - cse-pro
    - cse-sub
questions:
  - id: q-philippine-constitution-the-civil-service-commission-0001
    type: single_choice
    difficulty: easy
    stem: |
      Under Article IX-B of the 1987 Constitution, how is the Civil Service Commission composed?
    choices:
      - text: Chairman and two Commissioners
        correct: true
      - text: Chairman and four Commissioners
        rationale: |
          You selected four commissioners, which overcounts commission membership. Article IX-B specifies a Chairman and two Commissioners.
      - text: Chairman and six Commissioners
        rationale: |
          You picked six commissioners, which is the membership count of COMELEC. The Civil Service Commission has a Chairman and two Commissioners.
      - text: Chairman and one Commissioner
        rationale: |
          You chose one commissioner, which understates the constitutional membership. Under Section 1(1), the CSC consists of a Chairman and two Commissioners.
    explanation: |
      Section 1(1) of Article IX-B specifies that the Civil Service Commission shall be composed of a Chairman and two Commissioners.

  - id: q-philippine-constitution-the-civil-service-commission-0002
    type: single_choice
    difficulty: easy
    stem: |
      What citizenship qualification is required for members of the Civil Service Commission under Article IX-B?
    choices:
      - text: Natural-born citizens
        correct: true
      - text: Naturalized citizens of the state
        rationale: |
          You selected naturalized citizens, which falls short of constitutional criteria. Article IX-B requires members to be natural-born citizens.
      - text: Permanent resident aliens
        rationale: |
          You picked permanent resident aliens, who lack citizenship. Constitutional Commissioners must be natural-born citizens of the Philippines.
      - text: Registered voter residents
        rationale: |
          You chose registered voters, which is a general voter qualification. CSC Commissioners must specifically be natural-born citizens.
    explanation: |
      Section 1(1) of Article IX-B mandates that the Chairman and Commissioners must be natural-born citizens of the Philippines.

  - id: q-philippine-constitution-the-civil-service-commission-0003
    type: single_choice
    difficulty: easy
    stem: |
      What is the minimum age requirement for appointment to the Civil Service Commission?
    choices:
      - text: 35 years old
        correct: true
      - text: 25 years old
        rationale: |
          You selected 25 years old, which is the minimum age for Members of the House of Representatives. Appointees to the CSC must be at least 35 years old.
      - text: 30 years old
        rationale: |
          You picked 30 years old, but the Constitution requires CSC appointees to be at least 35 years old. Senators likewise have a constitutional minimum age of 35, not 30.
      - text: 40 years old
        rationale: |
          You chose 40 years old, which is the minimum age for appointment to the Supreme Court. The minimum age for CSC appointees is 35 years old.
    explanation: |
      Section 1(1) of Article IX-B specifies that members must be at least 35 years of age at the time of their appointment.

  - id: q-philippine-constitution-the-civil-service-commission-0004
    type: single_choice
    difficulty: medium
    stem: |
      Who appoints the Chairman and Commissioners of the Civil Service Commission?
    choices:
      - text: President with CA consent
        correct: true
      - text: House of Representatives committee
        rationale: |
          You selected House committee, which lacks executive appointment authority. CSC Commissioners are appointed by the President with CA consent.
      - text: Supreme Court en banc council
        rationale: |
          You picked Supreme Court en banc, which is a judicial body. Executive appointment of CSC Commissioners is made by the President with CA consent.
      - text: Judicial and Bar Council committee
        rationale: |
          You chose Judicial and Bar Council, which nominates judges. Civil Service Commissioners are appointed by the President with CA consent.
    explanation: |
      Section 1(2) of Article IX-B states that Commissioners are appointed by the President with the consent of the Commission on Appointments.

  - id: q-philippine-constitution-the-civil-service-commission-0005
    type: single_choice
    difficulty: medium
    stem: |
      What is the term of office for members of the Civil Service Commission under Article IX-B?
    choices:
      - text: Seven years without reappointment
        correct: true
      - text: Five years with one reappointment
        rationale: |
          You selected five years with reappointment, which misstates the term limit. Members are appointed for a 7 year term without reappointment.
      - text: Six years with unlimited reappointment
        rationale: |
          You picked six years with unlimited reappointment, which violates independence. Article IX-B sets a single 7 year term without reappointment.
      - text: Ten years during good behavior
        rationale: |
          You chose ten years during good behavior, which does not describe the CSC term. CSC members serve a fixed 7 year term without reappointment.
    explanation: |
      Section 1(2) of Article IX-B provides that members are appointed for a term of seven years without reappointment.

  - id: q-philippine-constitution-the-civil-service-commission-0006
    type: single_choice
    difficulty: hard
    stem: |
      Which qualification restriction applies to candidates for appointment to the Civil Service Commission?
    choices:
      - text: Not an elective candidate in the preceding election
        correct: true
      - text: Must have served as a military officer for twenty active years
        rationale: |
          You selected military service, which is not a constitutional requirement for CSC. Appointees must not have run in the preceding election.
      - text: Must hold a doctorate degree in business administrative science
        rationale: |
          You picked a doctorate degree, which is not a specified prerequisite. The Constitution requires that appointees not have been candidates for elective office in the immediately preceding election.
      - text: Must have practiced trial litigation law for fifteen full years
        rationale: |
          You chose trial litigation practice, which is not a qualification for the CSC. Section 1 bars appointees who were candidates in the immediately preceding election.
    explanation: |
      Section 1(1) of Article IX-B requires that appointees must not have been candidates for any elective position in the election immediately preceding their appointment.

  - id: q-philippine-constitution-the-civil-service-commission-0007
    type: single_choice
    difficulty: easy
    stem: |
      Which article of the 1987 Constitution governs the Civil Service Commission?
    choices:
      - text: Article IX-B
        correct: true
      - text: Article III section 5
        rationale: |
          You selected Article III, which is the Bill of Rights. The Civil Service Commission is governed specifically under Article IX-B.
      - text: Article VI section 2
        rationale: |
          You picked Article VI, which covers the Legislative Department. Provisions for the Civil Service Commission sit under Article IX-B.
      - text: Article XI section 1
        rationale: |
          You chose Article XI, which covers Accountability of Public Officers. The Civil Service Commission itself is set out in Article IX-B.
    explanation: |
      Sub-article B of Article IX is specifically devoted to the Civil Service Commission.

  - id: q-philippine-constitution-the-civil-service-commission-0008
    type: single_choice
    difficulty: medium
    stem: |
      Is a member of the Civil Service Commission eligible for reappointment after serving a full 7-year term?
    choices:
      - text: No, reappointment is prohibited
        correct: true
      - text: Yes, for one additional consecutive term
        rationale: |
          You selected one additional term, assuming reappointment is permitted. Section 1(2) prohibits reappointment to the CSC.
      - text: Yes, upon unanimous consent of the Senate
        rationale: |
          You picked Senate consent, assuming legislative approval overrides the ban. Article IX-B explicitly prohibits reappointment of members.
      - text: Yes, if re-nominated by the sitting President
        rationale: |
          You chose presidential re-nomination, which ignores the constitutional bar. Reappointment of CSC members after a full term is prohibited.
    explanation: |
      Section 1(2) of Article IX-B explicitly prohibits reappointment of Commissioners after serving their term.

  - id: q-philippine-constitution-the-civil-service-commission-0009
    type: single_choice
    difficulty: hard
    stem: |
      What special expertise is constitutionally required of Civil Service Commissioners under Article IX-B?
    choices:
      - text: Capacity for public administration
        correct: true
      - text: High competence in corporate financial auditing
        rationale: |
          You selected corporate financial auditing, which is associated more closely with audit work. CSC Commissioners must have proven capacity for public administration.
      - text: Extensive experience in international diplomacy
        rationale: |
          You picked international diplomacy, which is not a constitutional qualification for the CSC. Article IX-B requires proven capacity for public administration.
      - text: Former service in judicial appellate trial courts
        rationale: |
          You chose judicial court service, which is not a qualification for the CSC. Appointees must demonstrate capacity for public administration.
    explanation: |
      Section 1(1) of Article IX-B requires proven capacity for public administration.

  - id: q-philippine-constitution-the-civil-service-commission-0010
    type: single_choice
    difficulty: easy
    stem: |
      The Civil Service Commission functions as what central body within the Philippine Government?
    choices:
      - text: Central personnel agency
        correct: true
      - text: Central judicial tribunal
        rationale: |
          You selected central judicial tribunal, which does not describe the CSC. The CSC is established as the central personnel agency of government.
      - text: Central monetary authority
        rationale: |
          You picked central monetary authority, which describes monetary-policy functions. Section 3 defines the CSC as the central personnel agency.
      - text: Central legislative council
        rationale: |
          You chose central legislative council, which does not describe the CSC. Article IX-B Section 3 defines the CSC as the central personnel agency.
    explanation: |
      Section 3 of Article IX-B establishes the Civil Service Commission as the central personnel agency of the Government.

  - id: q-philippine-constitution-the-civil-service-commission-0011
    type: single_choice
    difficulty: medium
    stem: |
      For the first appointments under Article IX-B, the Chairman and two Commissioners were assigned terms of seven, five, and three years. What arrangement did this create for the Commission?
    choices:
      - text: Staggered terms
        correct: true
      - text: Synchronized terms
        rationale: |
          You selected synchronized terms, but the initial seven-, five-, and three-year terms made the members' terms expire at different times.
      - text: Indefinite terms
        rationale: |
          You picked indefinite terms, but the Constitution assigned fixed terms and used different initial lengths to stagger expirations.
      - text: Annual rotation
        rationale: |
          You chose annual rotation, but the Constitution did not require yearly replacement. The initial seven-, five-, and three-year terms created staggered expirations.
    explanation: |
      Article IX-B, Section 1(2) assigned the first CSC Chairman and Commissioners terms of seven, five, and three years, respectively, creating staggered term expirations while later regular appointments carry seven-year terms without reappointment.

  - id: q-philippine-constitution-the-civil-service-commission-0012
    type: single_choice
    difficulty: hard
    stem: |
      Are members of the Civil Service Commission subject to impeachment under Article XI?
    choices:
      - text: Yes, as Constitutional Commissioners
        correct: true
      - text: No, subject only to private civil arbitration lawsuits
        rationale: |
          You selected private civil lawsuits, which ignores public accountability. As Constitutional Commissioners, CSC members are subject to impeachment.
      - text: No, exempt from all public administrative proceedings
        rationale: |
          You picked exempt from proceedings, assuming complete immunity. Members of the Constitutional Commissions are included among impeachable officers.
      - text: No, removable only by a local provincial governor
        rationale: |
          You chose removal by provincial governor, which misstates constitutional authority. CSC Commissioners are subject to removal through impeachment.
    explanation: |
      Article XI, Section 2 includes Members of the Constitutional Commissions in the closed list of impeachable officers.

  - id: q-philippine-constitution-the-civil-service-commission-0013
    type: single_choice
    difficulty: medium
    stem: |
      What body must confirm the President's appointment of Civil Service Commissioners?
    choices:
      - text: Commission on Appointments
        correct: true
      - text: House of Representatives committee
        rationale: |
          You selected House committee, but confirmation requires the Commission on Appointments.
      - text: Supreme Court en banc council
        rationale: |
          You picked Supreme Court en banc, which is a judicial court. Confirming presidential appointments of CSC members belongs to the Commission on Appointments.
      - text: Judicial and Bar Council committee
        rationale: |
          You chose the Judicial and Bar Council, which handles judicial nominations. Presidential appointments to the CSC require Commission on Appointments consent.
    explanation: |
      Section 1(2) of Article IX-B specifies that appointment requires the consent of the Commission on Appointments.

  - id: q-philippine-constitution-the-civil-service-commission-0014
    type: single_choice
    difficulty: medium
    stem: |
      At what exact time must a Civil Service Commissioner meet the minimum age requirement of 35 years?
    choices:
      - text: At time of appointment
        correct: true
      - text: At time of academic university graduation
        rationale: |
          You selected university graduation, which measures educational history. Appointees must meet the 35 year age threshold at the time of appointment.
      - text: At time of civil service examination registration
        rationale: |
          You picked examination registration, which applies to examinees. Commissioners must meet the minimum age of 35 at the time of appointment.
      - text: At completion of first official service year
        rationale: |
          You chose completion of first service year, which would allow an underage appointment. Appointees must be at least 35 years old at time of appointment.
    explanation: |
      Section 1(1) of Article IX-B states that Commissioners must be at least 35 years old at the time of their appointment.

  - id: q-philippine-constitution-the-civil-service-commission-0015
    type: single_choice
    difficulty: easy
    stem: |
      Which of the following bodies is classified as a Constitutional Commission under Article IX?
    choices:
      - text: Civil Service Commission
        correct: true
      - text: National Economic and Development Authority
        rationale: |
          You selected NEDA, which is an executive planning agency. Article IX designates CSC, COMELEC, and COA as Constitutional Commissions.
      - text: Securities and Exchange Commission
        rationale: |
          You picked SEC, which is a statutory regulatory agency. The independent Constitutional Commissions under Article IX are CSC, COMELEC, and COA.
      - text: Department of Budget and Management
        rationale: |
          You chose DBM, which is an executive department. The three independent Constitutional Commissions in Article IX are CSC, COMELEC, and COA.
    explanation: |
      Article IX creates three independent Constitutional Commissions: the Civil Service Commission, Commission on Elections, and Commission on Audit.
