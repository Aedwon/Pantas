questions:
- id: q-philippine-constitution-the-civil-service-commission-0001
  lesson: lesson-philippine-constitution-csc-membership-and-citizenship
  keyPoint: 1
  type: single_choice
  difficulty: easy
  stem: 'What is the CSC''s constitutional composition?

    '
  choices:
  - text: A chair and two commissioners
    correct: true
  - text: A chairman and four other commissioners
    rationale: 'This adds two members. Other commissions have different sizes. Check the CSC-specific composition.

      '
  - text: A chairman and six other commissioners
    rationale: 'This uses COMELEC''s size. Both are constitutional commissions. Check which commission the question names.

      '
  - text: A chairman and only one other commissioner
    rationale: 'This leaves out one seat. A small commission can seem plausible. Check the two additional commissioners.

      '
  explanation: 'Article IX-B specifies a Chairman and two Commissioners.

    '
- id: q-philippine-constitution-the-civil-service-commission-0002
  lesson: lesson-philippine-constitution-csc-membership-and-citizenship
  keyPoint: 2
  type: single_choice
  difficulty: easy
  stem: 'What citizenship status does Article IX-B require for CSC members?

    '
  choices:
  - text: Natural-born citizenship
    correct: true
  - text: Naturalized citizenship without any additional condition
    rationale: 'This treats citizenship in general as sufficient. Naturalized citizens are citizens. Check the natural-born requirement.

      '
  - text: Permanent residency even without Philippine citizenship
    rationale: 'This treats residence as citizenship. Residents have a long-term connection. Check the constitutional citizenship category.

      '
  - text: Voter registration alone regardless of natural-born status
    rationale: 'This treats an electoral record as the full qualification. Voting requires citizenship. Check the specific appointment rule.

      '
  explanation: 'CSC members must be natural-born citizens of the Philippines.

    '
- id: q-philippine-constitution-the-civil-service-commission-0003
  lesson: lesson-philippine-constitution-csc-age-capacity-and-candidacy
  keyPoint: 1
  type: single_choice
  difficulty: easy
  stem: 'What minimum age must a CSC member have at appointment?

    '
  choices:
  - text: 35 years
    correct: true
  - text: 25 years
    rationale: 'This uses an age familiar for some other offices. Constitutional offices have different minimums. Check the CSC rule.

      '
  - text: 30 years
    rationale: 'This rounds to a lower age. Experience at thirty may seem sufficient. Check the stated minimum.

      '
  - text: 40 years
    rationale: 'This uses a higher threshold found for other senior offices. Several constitutional posts have that minimum. Check the specific institution.

      '
  explanation: 'The minimum is thirty-five years at the time of appointment.

    '
- id: q-philippine-constitution-the-civil-service-commission-0004
  lesson: lesson-philippine-constitution-csc-appointments-and-terms
  keyPoint: 1
  type: single_choice
  difficulty: medium
  stem: 'Who appoints CSC members under Article IX-B?

    '
  choices:
  - text: The President, with CA consent
    correct: true
  - text: The Commission on Appointments acting alone without the President
    rationale: 'This makes consent the appointment itself. CA participates in the process. Check the distinct appointing authority.

      '
  - text: The Judicial and Bar Council directly appointing all commission members
    rationale: 'This substitutes the judicial nomination body. It is involved in other constitutional appointments. Check the CSC provision.

      '
  - text: The House of Representatives through an ordinary committee vote alone
    rationale: 'This substitutes one legislative body. Congress members participate in some approval processes. Check the specified combination.

      '
  explanation: 'The President appoints the members with the consent of the Commission on Appointments.

    '
- id: q-philippine-constitution-the-civil-service-commission-0005
  lesson: lesson-philippine-constitution-csc-appointments-and-terms
  keyPoint: 2
  type: single_choice
  difficulty: medium
  stem: 'What regular term and reappointment rule does Article IX-B state for CSC members?

    '
  choices:
  - text: Seven years, no reappointment
    correct: true
  - text: Five years with one additional appointment automatically allowed
    rationale: 'This uses a shorter initial-transition period as the regular rule. Five years appears in historical first appointments. Check the regular term.

      '
  - text: Six years with unlimited additional appointments permitted
    rationale: 'This uses an executive-style term and adds repetition. Six years is familiar for other posts. Check the CSC duration and restriction.

      '
  - text: Ten years with renewal whenever the appointing President approves
    rationale: 'This substitutes a longer renewable term. Continuity can sound useful. Check the constitutional limit.

      '
  explanation: 'Regular appointments are for seven years without reappointment.

    '
- id: q-philippine-constitution-the-civil-service-commission-0006
  lesson: lesson-philippine-constitution-csc-age-capacity-and-candidacy
  keyPoint: 3
  type: single_choice
  difficulty: hard
  stem: 'Which candidacy restriction applies to appointment as a CSC member?

    '
  choices:
  - text: No candidacy in the immediately prior election
    correct: true
  - text: Only losing candidates in the immediately prior election are disqualified.
    rationale: 'This limits the rule to losing candidates. Other appointment rules mention losing candidates. Check the CSC rule''s word candidates.

      '
  - text: Only candidates for national office are disqualified, while local candidates are always eligible.
    rationale: 'This removes local elective positions. National offices are more visible. Check the phrase any elective position.

      '
  - text: Any candidacy at any point in the person's lifetime permanently bars appointment.
    rationale: 'This extends the restriction beyond its stated election. A history of politics may raise concern. Check the immediately preceding election.

      '
  explanation: 'The appointee must not have been a candidate for any elective position in the election immediately preceding appointment.

    '
- id: q-philippine-constitution-the-civil-service-commission-0007
  lesson: lesson-philippine-constitution-csc-personnel-and-career-service
  keyPoint: 1
  type: single_choice
  difficulty: easy
  stem: 'Which constitutional subdivision specifically covers the CSC?

    '
  choices:
  - text: Article IX-B
    correct: true
  - text: Article IX-A, the common provisions for the commissions
    rationale: 'This selects the common part. Its rules also affect CSC. Check the part specifically assigned to CSC.

      '
  - text: Article IX-C, the Commission on Elections provisions
    rationale: 'This selects the elections commission. Both are in Article IX. Check the subdivision letter.

      '
  - text: Article IX-D, the Commission on Audit provisions
    rationale: 'This selects the audit commission. Both oversee government work. Check the personnel commission''s part.

      '
  explanation: 'Article IX-B specifically covers the Civil Service Commission.

    '
- id: q-philippine-constitution-the-civil-service-commission-0008
  lesson: lesson-philippine-constitution-csc-appointments-and-terms
  keyPoint: 2
  type: single_choice
  difficulty: medium
  stem: 'A member completes a full seven-year CSC term. May the President grant another CSC term?

    '
  choices:
  - text: No, the Constitution bars reappointment.
    correct: true
  - text: Yes, if the President remains satisfied with the member's performance.
    rationale: 'This makes performance override the ban. Good service can justify renewal elsewhere. Check the constitutional restriction.

      '
  - text: Yes, if the Commission on Appointments unanimously approves the new term.
    rationale: 'This makes consent override eligibility. CA approval is normally required. Check whether the term itself is permitted.

      '
  - text: Yes, if the new nomination uses a different description of the same CSC position.
    rationale: 'This treats relabeling as avoiding reappointment. Titles can vary in ordinary administration. Check the actual office and prior term.

      '
  explanation: 'A completed full term cannot be followed by reappointment to the CSC. The rule is seven years without reappointment.

    '
- id: q-philippine-constitution-the-civil-service-commission-0009
  lesson: lesson-philippine-constitution-csc-age-capacity-and-candidacy
  keyPoint: 2
  type: single_choice
  difficulty: hard
  stem: 'What proven capacity does Article IX-B require of CSC appointees?

    '
  choices:
  - text: Public administration
    correct: true
  - text: Corporate financial auditing alone, without public-administration capacity
    rationale: 'This substitutes an audit-focused skill. Both concern government management. Check the CSC-specific qualification.

      '
  - text: International diplomacy alone, without public-administration capacity
    rationale: 'This substitutes foreign-relations experience. Diplomats serve government. Check the named expertise.

      '
  - text: Appellate litigation alone, without public-administration capacity
    rationale: 'This substitutes judicial experience. Legal work can involve public institutions. Check the expressly required capacity.

      '
  explanation: 'Appointees must have proven capacity for public administration.

    '
- id: q-philippine-constitution-the-civil-service-commission-0010
  lesson: lesson-philippine-constitution-csc-personnel-and-career-service
  keyPoint: 1
  type: single_choice
  difficulty: easy
  stem: 'What central government role does the Constitution assign to CSC?

    '
  choices:
  - text: Personnel agency
    correct: true
  - text: The central judicial tribunal for all criminal cases
    rationale: 'This substitutes court work. CSC can deal with administrative matters. Check the personnel role.

      '
  - text: The central monetary authority for currency issuance
    rationale: 'This substitutes monetary policy. Both are national public functions. Check human resources versus money.

      '
  - text: The central legislative council making all national statutes
    rationale: 'This substitutes lawmaking. CSC can make administrative rules. Check agency work versus legislation.

      '
  explanation: 'CSC is the central personnel agency of the Government.

    '
- id: q-philippine-constitution-the-civil-service-commission-0011
  lesson: lesson-philippine-constitution-csc-appointments-and-terms
  keyPoint: 2
  type: single_choice
  difficulty: medium
  stem: 'For the first appointments under Article IX-B, the Chairman and two Commissioners were assigned terms of seven, five, and three years. What arrangement did this create for the Commission?

    '
  choices:
  - text: Staggered terms
    correct: true
  - text: Synchronized terms
    rationale: 'This assumes common start dates mean common end dates. The first appointments began together. Check their different durations.

      '
  - text: Indefinite terms
    rationale: 'This treats varying terms as unlimited terms. There is no single shared duration. Check the stated end periods.

      '
  - text: Annual rotation
    rationale: 'This treats staggered endings as yearly turnover. Membership changes over time. Check the actual years assigned.

      '
  explanation: 'Different initial durations produced different expiration dates. That is staggered tenure.

    '
- id: q-philippine-constitution-the-civil-service-commission-0012
  lesson: lesson-philippine-constitution-csc-independence-and-conflicts
  keyPoint: 1
  type: single_choice
  difficulty: hard
  stem: 'An official threatens to delay the CSC''s approved annual funding to make it change a decision. Does fiscal autonomy protect the CSC against this pressure?

    '
  choices:
  - text: Yes, approved annual funding must be released automatically and regularly.
    correct: true
  - text: No, funding may be delayed until the CSC changes its decision.
    rationale: 'This allows funding delays to control a decision. Check the requirement for automatic and regular release.

      '
  - text: No, fiscal autonomy protects only the salaries of Commission members.
    rationale: 'This confuses fiscal autonomy with salary protection. Fiscal autonomy covers the Commission''s approved funds.

      '
  - text: No, automatic release applies only when the official agrees with the CSC.
    rationale: 'This adds a condition based on agreement with a decision. Approved annual funding must be released automatically and regularly.

      '
  explanation: 'Fiscal autonomy protects the CSC''s control over its approved funds. Its approved annual funding must be released automatically and regularly. Delaying it to pressure the CSC conflicts with this safeguard.

    '
- id: q-philippine-constitution-the-civil-service-commission-0013
  lesson: lesson-philippine-constitution-csc-appointments-and-terms
  keyPoint: 1
  type: single_choice
  difficulty: medium
  stem: 'A proposal lets the President appoint a CSC member without any required consenting body. What correction follows from Article IX-B?

    '
  choices:
  - text: Obtain Commission on Appointments consent.
    correct: true
  - text: Obtain only the Judicial and Bar Council's nomination and treat that as final consent.
    rationale: 'This substitutes a judicial appointment process. The JBC is a constitutional body. Check the CSC-specific approval rule.

      '
  - text: Obtain only a local government's endorsement and omit national consent.
    rationale: 'This substitutes local support for constitutional approval. Local officials may know the candidate. Check the named consenting body.

      '
  - text: Obtain only the nominee's written acceptance and treat consent as complete.
    rationale: 'This substitutes the candidate''s agreement for institutional consent. Acceptance matters to taking office. Check whose consent the Constitution requires.

      '
  explanation: 'The President''s appointment requires consent of the Commission on Appointments. The proposal omits that constitutional step.

    '
- id: q-philippine-constitution-the-civil-service-commission-0014
  lesson: lesson-philippine-constitution-csc-age-capacity-and-candidacy
  keyPoint: 1
  type: single_choice
  difficulty: medium
  stem: 'When must a CSC appointee satisfy the minimum age of thirty-five?

    '
  choices:
  - text: At appointment
    correct: true
  - text: Only at the end of the first service year
    rationale: 'This permits appointment before eligibility. Age increases during service. Check the constitutional reference time.

      '
  - text: Only when registering for a civil-service examination
    rationale: 'This confuses examination eligibility with commission appointment. CSC is associated with exams. Check which position is being filled.

      '
  - text: Only when the person graduates from a university
    rationale: 'This substitutes an education milestone. Qualifications may involve education. Check the specified appointment date.

      '
  explanation: 'Article IX-B measures the age requirement at the time of appointment.

    '
- id: q-philippine-constitution-the-civil-service-commission-0015
  lesson: lesson-philippine-constitution-csc-independence-and-conflicts
  keyPoint: 1
  type: single_choice
  difficulty: easy
  stem: 'Which listed body is an Article IX Constitutional Commission?

    '
  choices:
  - text: CSC
    correct: true
  - text: National Economic and Development Authority
    rationale: 'This selects a planning body. It has national government responsibilities. Check the named Article IX commissions.

      '
  - text: Securities and Exchange Commission
    rationale: 'This assumes commission in the name means Article IX status. Its title includes commission. Check the constitutional list.

      '
  - text: Department of Budget and Management
    rationale: 'This selects an executive department. It manages public resources. Check commission versus department.

      '
  explanation: 'The Civil Service Commission is one of the three independent commissions identified in Article IX.

    '
- id: q-philippine-constitution-the-civil-service-commission-0016
  lesson: lesson-philippine-constitution-csc-membership-and-citizenship
  keyPoint: 1
  type: single_choice
  difficulty: easy
  approved: false
  stem: 'How many CSC members are there in total when the chair is included?

    '
  choices:
  - text: '3'
    correct: true
  - text: '2'
    rationale: 'This counts only the commissioners. The composition names two commissioners. Check whether the chair is additional.

      '
  - text: '4'
    rationale: 'This counts an extra chair after already including the chair. Leadership titles can be confusing. Check each actual seat once.

      '
  - text: '7'
    rationale: 'This uses the size of another constitutional commission. COMELEC has more members. Check which commission is being counted.

      '
  explanation: 'One chair plus two commissioners equals $1 + 2 = 3$ members.

    '
- id: q-philippine-constitution-the-civil-service-commission-0017
  lesson: lesson-philippine-constitution-csc-age-capacity-and-candidacy
  keyPoint: 3
  type: single_choice
  difficulty: medium
  approved: false
  stem: 'A natural-born, forty-year-old public administrator was a candidate in the immediately preceding local election. Does meeting the age and expertise requirements remove the candidacy restriction?

    '
  choices:
  - text: No, the candidacy restriction still applies.
    correct: true
  - text: Yes, because forty years of age waives every other qualification.
    rationale: 'This makes age sufficient by itself. The person exceeds the minimum. Check the independent candidacy condition.

      '
  - text: Yes, because only candidacy for a national office matters.
    rationale: 'This excludes local candidacy. National races are more prominent. Check any elective position.

      '
  - text: Yes, because proven administration capacity replaces the election restriction.
    rationale: 'This treats expertise as a substitute for eligibility. Expertise is expressly required. Check all conditions together.

      '
  explanation: 'The requirements operate together. A candidate in the immediately preceding election is disqualified even when age, citizenship, and capacity are satisfied.

    '
- id: q-philippine-constitution-the-civil-service-commission-0018
  lesson: lesson-philippine-constitution-csc-age-capacity-and-candidacy
  keyPoint: 1
  type: single_choice
  difficulty: hard
  approved: false
  stem: 'A nominee is thirty-four at appointment but turns thirty-five a month later. What follows from the lesson?

    '
  choices:
  - text: The age qualification is not met at appointment.
    correct: true
  - text: The later birthday retroactively makes the earlier appointment satisfy the minimum.
    rationale: 'This treats later eligibility as earlier eligibility. The birthday is close. Check the date the rule measures.

      '
  - text: The nominee meets the age rule because the term will last seven years.
    rationale: 'This substitutes tenure length for present age. The person will age during service. Check eligibility when appointed.

      '
  - text: The minimum does not apply if the President and CA both prefer the nominee.
    rationale: 'This treats approval as waiver of a qualification. Both institutions have roles. Check the separate constitutional minimum.

      '
  explanation: 'The nominee must already be at least thirty-five at appointment. A later birthday does not change the age on that date.

    '
- id: q-philippine-constitution-the-civil-service-commission-0019
  lesson: lesson-philippine-constitution-csc-age-capacity-and-candidacy
  keyPoint: 2
  type: single_choice
  difficulty: hard
  approved: false
  stem: 'Which fact alone satisfies the specialized capacity requirement without proving all appointment qualifications?

    '
  choices:
  - text: Proven capacity for public administration
    correct: true
  - text: A record of winning local elections with no demonstrated administration capacity
    rationale: 'This substitutes electoral success for the named skill. Public leadership can involve administration. Check whether capacity is actually proven.

      '
  - text: A promise to learn public administration only after taking the commission position
    rationale: 'This substitutes intention for proven capacity. Training can improve skills. Check the word proven.

      '
  - text: A private business title with no evidence of administration-related ability
    rationale: 'This treats a title as proof. Business management can sound relevant. Check the demonstrated capacity.

      '
  explanation: 'Proven public-administration capacity meets that particular requirement. Citizenship, age, candidacy, and the appointment process must still be checked separately.

    '
- id: q-philippine-constitution-the-civil-service-commission-0020
  lesson: lesson-philippine-constitution-csc-personnel-and-career-service
  keyPoint: 2
  type: single_choice
  difficulty: exam
  approved: false
  stem: 'A reviewer claims CSC''s personnel role makes it the national legislature, central bank, and criminal court at once. Which assessment fits the lesson?

    '
  choices:
  - text: The claim extends the stated role beyond what is taught.
    correct: true
  - text: The claim is correct because central means all other government functions are included.
    rationale: 'This treats central as unlimited power. The word suggests national scope. Check the specific personnel subject.

      '
  - text: The claim is correct whenever a matter affects a government employee in any way.
    rationale: 'This turns a personnel connection into every branch''s authority. Employees work across government. Check the role rather than a loose connection.

      '
  - text: The claim is correct because any seven-year commission can replace all elected departments.
    rationale: 'This treats tenure as a grant of every power. A long term supports continuity. Check composition and term versus function.

      '
  explanation: 'The lesson identifies CSC as the central personnel agency. It does not assign it the separate functions of lawmaking, monetary policy, or criminal adjudication.

    '

- id: q-philippine-constitution-the-civil-service-commission-0021
  lesson: lesson-philippine-constitution-csc-civil-service-coverage
  keyPoint: 1
  type: single_choice
  difficulty: exam
  stem: |
    A government corporation claims that public ownership alone establishes civil service coverage under Article IX-B’s corporation clause. What fact must be checked?
  choices:
  - text: "Whether it has an original charter"
    correct: true
  - text: "Whether it performs work that government agencies also perform"
    rationale: |
      This treats public work as proof of an original charter. Check how the corporation was created.
  - text: "Whether it has registered under the general corporation law"
    rationale: |
      This confuses general registration with a special creating law. Check for an original charter.
  - text: "Whether the government owns the corporation’s entire business"
    rationale: |
      This treats the extent of ownership as the charter test. Ownership alone does not establish an original charter.
  explanation: |
    Article IX-B, Section 2(1) includes government-owned or controlled corporations with original charters. An original charter is a special law creating the corporation itself. Its creating law must be checked.

- id: q-philippine-constitution-the-civil-service-commission-0022
  lesson: lesson-philippine-constitution-csc-civil-service-coverage
  keyPoint: 1
  type: single_choice
  difficulty: exam
  stem: |
    Which description correctly states the reach of the civil service under Article IX-B?
  choices:
  - text: "It covers all government branches and their agencies."
    correct: true
  - text: "It covers executive agencies but excludes offices of the other branches."
    rationale: |
      This limits coverage to the executive branch. Check the rule’s reference to all branches.
  - text: "It covers national agencies but excludes cities and provinces entirely."
    rationale: |
      This leaves out government subdivisions. Cities and provinces are included in that category.
  - text: "It covers corporations formed under general law whenever government owns shares."
    rationale: |
      This replaces the original-charter condition with ownership alone. For government corporations, check the creating law.
  explanation: |
    Article IX-B, Section 2(1) covers all government branches, subdivisions, instrumentalities, and agencies. It includes government-owned or controlled corporations with original charters. The rule reaches beyond executive agencies.

- id: q-philippine-constitution-the-civil-service-commission-0023
  lesson: lesson-philippine-constitution-csc-independence-and-conflicts
  keyPoint: 2
  type: single_choice
  difficulty: exam
  stem: |
    A sitting CSC member plans to accept private legal clients while keeping Commission duties separate from the legal work. Which assessment follows Article IX-A?
  choices:
  - text: "Private law practice is barred during tenure."
    correct: true
  - text: "The work is allowed whenever the clients have no contract with the CSC."
    rationale: |
      This treats the government-contract ban as the only restriction. Practicing a profession is separately barred.
  - text: "The work is allowed if the member does not actively manage a business."
    rationale: |
      This confuses the profession ban with the business-management ban. Check each restriction separately.
  - text: "The work is allowed whenever all legal fees come from private clients."
    rationale: |
      This treats private payment as an exception. The ban on practicing a profession applies during tenure.
  explanation: |
    Article IX-A, Section 2 bars Constitutional Commission members from practicing any profession during tenure. Taking private legal clients is practicing a profession. The proposed arrangement is barred.

- id: q-philippine-constitution-the-civil-service-commission-0024
  lesson: lesson-philippine-constitution-csc-merit-and-examination-exceptions
  keyPoint: 1
  type: single_choice
  difficulty: exam
  stem: |
    An applicant passes a competitive examination. The appointing authority then refuses to consider whether the applicant’s abilities match the position’s duties. Which principle is overlooked?
  choices:
  - text: "Merit and fitness"
    correct: true
  - text: "Appointment based solely on a passing examination result"
    rationale: |
      This treats a passing result as the entire hiring rule. Check whether the applicant is suited to the work.
  - text: "Appointment based solely on friendship with the appointing official"
    rationale: |
      This replaces ability with personal ties. Check the applicant’s qualifications and match to the duties.
  - text: "Exemption from all qualifications after passing an examination"
    rationale: |
      This treats exam success as removal of other requirements. Passing alone does not guarantee appointment.
  explanation: |
    Article IX-B, Section 2(2) requires appointments according to merit and fitness. Relevant ability and suitability for the duties still matter. Passing an examination alone does not guarantee appointment.

- id: q-philippine-constitution-the-civil-service-commission-0025
  lesson: lesson-philippine-constitution-csc-merit-and-examination-exceptions
  keyPoint: 2
  type: single_choice
  difficulty: exam
  stem: |
    A personnel review describes a post whose main work is setting government policies. Which competitive-examination exception matches that description?
  choices:
  - text: "Policy-determining"
    correct: true
  - text: "Primarily confidential because all policy work involves personal trust"
    rationale: |
      This confuses setting policy with work mainly based on close personal trust. Identify the post’s main duties.
  - text: "Highly technical because every policy decision requires special expertise"
    rationale: |
      This assumes policy work always needs a high level of special technical skill. Match the actual duties to the category.
  - text: "No exception because all positions must use competitive examinations"
    rationale: |
      This overlooks the named exceptions. Check whether the main work is setting government policy.
  explanation: |
    Article IX-B, Section 2(2) excepts policy-determining positions from the competitive-examination rule. A post mainly concerned with setting government policies fits that description. Merit and fitness still apply.

- id: q-philippine-constitution-the-civil-service-commission-0026
  lesson: lesson-philippine-constitution-csc-worker-protection-and-politics
  keyPoint: 1
  type: single_choice
  difficulty: exam
  stem: |
    A permanent civil service employee argues that security of tenure prevents suspension even for a cause provided by law. Which statement correctly applies the protection?
  choices:
  - text: "Suspension may rest on a cause provided by law."
    correct: true
  - text: "Permanent status prevents suspension regardless of the legal cause."
    rationale: |
      This treats security of tenure as protection from lawful discipline. Check whether a cause provided by law exists.
  - text: "A supervisor’s personal dislike is enough cause to suspend an employee."
    rationale: |
      This treats dislike as a legal cause. The reason must be one provided by law.
  - text: "Security of tenure protects only against removal, never suspension."
    rationale: |
      This leaves suspension outside the protection. The rule covers both removal and suspension.
  explanation: |
    Article IX-B, Section 2(3) allows removal or suspension only for a cause provided by law. Security of tenure protects against action without that cause. It does not prevent lawful discipline.

- id: q-philippine-constitution-the-civil-service-commission-0027
  lesson: lesson-philippine-constitution-csc-worker-protection-and-politics
  keyPoint: 2
  type: single_choice
  difficulty: exam
  stem: |
    A civil service employee says that the ban on partisan campaigning also prevents the employee from voting. Which distinction is correct?
  choices:
  - text: "Voting differs from campaigning for a candidate."
    correct: true
  - text: "Voting and working to help a political party win are the same activity."
    rationale: |
      This confuses casting a vote with helping a campaign. Identify the activity the employee plans to do.
  - text: "Civil service employees may campaign if they do so only indirectly."
    rationale: |
      This overlooks the ban on indirect participation. Check both direct and indirect campaign work.
  - text: "The campaigning restriction applies only to employees who refuse to vote."
    rationale: |
      This invents a voting condition for the campaign ban. Voting does not give permission to campaign.
  explanation: |
    Article IX-B, Section 2(4) bars civil service officers and employees from electioneering or partisan political campaigns. Casting a vote is different from working to help a candidate or party win. The campaigning ban does not itself bar voting.
