meta:
  subject: general-information
  topic: philippine-constitution
  subtopic: accountability-and-impeachment
  exams:
    - cse-pro
    - cse-sub
questions:
  - id: q-philippine-constitution-accountability-and-impeachment-0001
    type: single_choice
    difficulty: easy
    stem: |
      Which article of the 1987 Constitution governs Accountability of Public Officers?
    choices:
      - text: Article XI
        correct: true
      - text: Article IX
      - text: Article VII
      - text: Article III
    explanation: |
      Article XI of the 1987 Constitution is entitled Accountability of Public Officers.

  - id: q-philippine-constitution-accountability-and-impeachment-0002
    type: single_choice
    difficulty: easy
    stem: |
      What principle regarding public office is declared in Section 1 of Article XI?
    choices:
      - text: Public office is a public trust
        correct: true
      - text: Public office is a private business
      - text: Public office is a family right
      - text: Public office is a corporate franchise
    explanation: |
      Section 1 of Article XI begins with the fundamental declaration that Public office is a public trust.

  - id: q-philippine-constitution-accountability-and-impeachment-0003
    type: single_choice
    difficulty: medium
    stem: |
      Which of the following public officials is included in the closed list of impeachable officers under Article XI, Section 2?
    choices:
      - text: Ombudsman
        correct: true
      - text: Cabinet Secretary
      - text: Provincial Governor
      - text: City Mayor
    explanation: |
      Section 2 of Article XI lists five categories of impeachable officers: President, Vice-President, Members of Supreme Court, Members of Constitutional Commissions, and the Ombudsman.

  - id: q-philippine-constitution-accountability-and-impeachment-0004
    type: single_choice
    difficulty: medium
    stem: |
      Which of the following public officers is NOT an impeachable officer under Article XI of the 1987 Constitution?
    choices:
      - text: Senator of the Republic
        correct: true
      - text: President of the Philippines
      - text: Vice-President of the Philippines
      - text: Member of the Supreme Court
    explanation: |
      Senators and Representatives are members of Congress and are disciplined by their respective Houses under Article VI, not by impeachment under Article XI.

  - id: q-philippine-constitution-accountability-and-impeachment-0005
    type: single_choice
    difficulty: medium
    stem: |
      Which of the following is included in the closed list of constitutional grounds for impeachment under Article XI, Section 2?
    choices:
      - text: Betrayal of public trust
        correct: true
      - text: Negligence in public duties
      - text: Insubordination to superiors
      - text: Minor traffic law violation
    explanation: |
      Section 2 of Article XI lists Betrayal of public trust as one of the six exclusive grounds for impeachment.

  - id: q-philippine-constitution-accountability-and-impeachment-0006
    type: single_choice
    difficulty: hard
    stem: |
      Which of the following is NOT one of the six constitutional grounds for impeachment under Article XI, Section 2?
    choices:
      - text: Inefficiency in office
        correct: true
      - text: Treason
      - text: Bribery
      - text: Culpable violation of the Constitution
    explanation: |
      Inefficiency is not a ground for impeachment. The six grounds are culpable violation of the Constitution, treason, bribery, graft and corruption, other high crimes, and betrayal of public trust.

  - id: q-philippine-constitution-accountability-and-impeachment-0007
    type: single_choice
    difficulty: hard
    stem: |
      Are Members of Constitutional Commissions (CSC, COMELEC, COA) subject to removal by impeachment?
    choices:
      - text: Yes, listed under Article XI
        correct: true
      - text: No, removable by President only
      - text: No, removable by Senate vote only
      - text: No, exempt from all proceedings
    explanation: |
      Section 2 of Article XI explicitly includes Members of the Constitutional Commissions in the closed list of impeachable officers.

  - id: q-philippine-constitution-accountability-and-impeachment-0008
    type: single_choice
    difficulty: hard
    stem: |
      Are Regional Trial Court judges included in the closed list of impeachable officers under Article XI?
    choices:
      - text: No, not impeachable officers
        correct: true
      - text: Yes, listed as impeachable judicial officers
      - text: Yes, as full members of the supreme court bench
      - text: Yes, subject to mandatory Senate impeachment trial
    explanation: |
      Only Members of the Supreme Court are impeachable among judicial officers. Lower court judges are disciplined by the Supreme Court.

  - id: q-philippine-constitution-accountability-and-impeachment-0009
    type: single_choice
    difficulty: easy
    stem: |
      Under Article XI, what supreme declaration is made regarding the nature of public service duties?
    choices:
      - text: Servants of the people
        correct: true
      - text: Rulers of the citizenry
      - text: Private business owners
      - text: Corporate board members
    explanation: |
      Section 1 of Article XI mandates that public officers must at all times be accountable to the people and serve them with integrity and efficiency.

  - id: q-philippine-constitution-accountability-and-impeachment-0010
    type: single_choice
    difficulty: easy
    stem: |
      Which ground for impeachment involves accepting money or valuable favors to influence official actions?
    choices:
      - text: Bribery
        correct: true
      - text: Treason
      - text: Betrayal of public trust
      - text: Culpable violation of law
    explanation: |
      Bribery involves giving or receiving something of value to influence official action and is a specified ground for impeachment in Section 2.

  - id: q-philippine-constitution-accountability-and-impeachment-0011
    type: single_choice
    difficulty: medium
    stem: |
      Levying war against the Republic or adhering to its enemies, giving them aid and comfort, constitutes which impeachment ground?
    choices:
      - text: Treason
        correct: true
      - text: Bribery
      - text: Graft and corruption
      - text: Betrayal of public trust
    explanation: |
      Treason is an explicit constitutional ground for impeachment under Article XI, Section 2.

  - id: q-philippine-constitution-accountability-and-impeachment-0012
    type: single_choice
    difficulty: medium
    stem: |
      How many impeachable categories of officials are specified in the closed list under Article XI, Section 2?
    choices:
      - text: 5 categories
        correct: true
      - text: 3 categories
      - text: 8 categories
      - text: 10 categories
    explanation: |
      The five impeachable categories are: President, Vice-President, Members of the Supreme Court, Members of the Constitutional Commissions, and the Ombudsman.

  - id: q-philippine-constitution-accountability-and-impeachment-0013
    type: single_choice
    difficulty: medium
    stem: |
      How many constitutional grounds for impeachment are listed in Section 2 of Article XI?
    choices:
      - text: 6 grounds
        correct: true
      - text: 4 grounds
      - text: 8 grounds
      - text: 10 grounds
    explanation: |
      Section 2 of Article XI lists exactly six grounds for impeachment.

  - id: q-philippine-constitution-accountability-and-impeachment-0014
    type: single_choice
    difficulty: easy
    stem: |
      Are Members of the Supreme Court impeachable under Article XI of the 1987 Constitution?
    choices:
      - text: Yes, listed in Article XI
        correct: true
      - text: No, subject to Judicial Council
      - text: No, removable by President
      - text: No, totally immune from suit
    explanation: |
      Members of the Supreme Court are explicitly listed as impeachable officers in Article XI, Section 2.

  - id: q-philippine-constitution-accountability-and-impeachment-0015
    type: single_choice
    difficulty: hard
    stem: |
      Culpable violation of the Constitution as an impeachment ground requires what kind of act?
    choices:
      - text: Intentional violation of constitutional mandate
        correct: true
      - text: Minor clerical error in typing an official administrative memo
      - text: Arriving late to a scheduled congressional committee hearing
      - text: Misplacing an unclassified non-essential public file folder
    explanation: |
      Culpable violation of the Constitution involves a deliberate and willful breach of constitutional provisions, not minor administrative errors.
