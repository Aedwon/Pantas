questions:
- id: q-philippine-constitution-accountability-and-impeachment-0001
  lesson: lesson-philippine-constitution-public-trust-and-impeachable-officers
  keyPoint: 1
  type: single_choice
  difficulty: easy
  stem: 'Which article is titled Accountability of Public Officers?

    '
  choices:
  - text: Article XI
    correct: true
  - text: Article IX
    rationale: 'This selects the constitutional commissions article. Several impeachable officials are commissioners. Check the article''s title.

      '
  - text: Article VII
    rationale: 'This selects the executive article. The President is impeachable. Check the broader accountability article.

      '
  - text: Article III
    rationale: 'This selects the Bill of Rights. Accountability protects the public. Check the named constitutional subject.

      '
  explanation: 'Article XI is titled Accountability of Public Officers.

    '
- id: q-philippine-constitution-accountability-and-impeachment-0002
  lesson: lesson-philippine-constitution-public-trust-and-impeachable-officers
  keyPoint: 1
  type: single_choice
  difficulty: easy
  stem: 'What does Article XI, Section 1 declare about public office?

    '
  choices:
  - text: It is a public trust.
    correct: true
  - text: It is a private entitlement once the official wins an election.
    rationale: 'This treats selection as ownership. Election grants authority. Check who the officer remains accountable to.

      '
  - text: It is a personal privilege free of accountability during a fixed term.
    rationale: 'This treats tenure as immunity. Officials may serve fixed terms. Check the continuing duty to the people.

      '
  - text: It is a resource for the official's family before any public obligation.
    rationale: 'This substitutes family benefit for public service. Families share an official''s life. Check the purpose of public office.

      '
  explanation: 'Section 1 says public office is a public trust. Officers must be accountable to the people and serve responsibly.

    '
- id: q-philippine-constitution-accountability-and-impeachment-0003
  lesson: lesson-philippine-constitution-public-trust-and-impeachable-officers
  keyPoint: 2
  type: single_choice
  difficulty: medium
  stem: 'Which official is included in Article XI, Section 2''s list?

    '
  choices:
  - text: Ombudsman
    correct: true
  - text: Cabinet Secretary
    rationale: 'This equates a senior executive title with inclusion. Cabinet officers hold major responsibilities. Check the closed office list.

      '
  - text: Provincial Governor
    rationale: 'This treats election to high local office as enough. Governors have public authority. Check whether local executives are listed.

      '
  - text: City Mayor
    rationale: 'This treats public accountability as impeachment eligibility. Mayors are accountable too. Check the distinct removal process.

      '
  explanation: 'The Ombudsman is one of the offices expressly included in the Section 2 impeachment list.

    '
- id: q-philippine-constitution-accountability-and-impeachment-0004
  lesson: lesson-philippine-constitution-public-trust-and-impeachable-officers
  keyPoint: 2
  type: single_choice
  difficulty: medium
  stem: 'Which official is NOT included in the closed impeachment list?

    '
  choices:
  - text: Senator
    correct: true
  - text: President of the Philippines
    rationale: 'This misses the negative question. The President is a powerful public officer. Check whether the title is expressly listed.

      '
  - text: Vice-President of the Philippines
    rationale: 'This assumes the office follows ordinary removal rules. It is a separate executive position. Check its explicit inclusion.

      '
  - text: Member of the Supreme Court
    rationale: 'This overlooks the specified judicial category. Other judges are outside the list. Check the exact court named.

      '
  explanation: 'Senators are not in Section 2''s closed list. Their accountability must use processes provided by law rather than impeachment.

    '
- id: q-philippine-constitution-accountability-and-impeachment-0005
  lesson: lesson-philippine-constitution-impeachment-betrayal-and-proof
  keyPoint: 1
  type: single_choice
  difficulty: medium
  stem: 'Which phrase is expressly named as an Article XI impeachment ground?

    '
  choices:
  - text: Betrayal of public trust
    correct: true
  - text: Negligence in public duties
    rationale: 'This substitutes a general misconduct label. Negligence can be serious. Check the exact listed ground.

      '
  - text: Insubordination to government superiors
    rationale: 'This substitutes an employment-discipline label. It concerns official conduct. Check the constitutional list.

      '
  - text: Any dissatisfaction with an official's policy
    rationale: 'This turns disagreement into a named ground. Policies affect the public. Check the six express grounds.

      '
  explanation: 'Betrayal of public trust is expressly listed in Section 2.

    '
- id: q-philippine-constitution-accountability-and-impeachment-0006
  lesson: lesson-philippine-constitution-impeachment-constitutional-breach-treason-and-bribery
  keyPoint: 1
  type: single_choice
  difficulty: hard
  stem: 'Which phrase is NOT expressly named among Section 2''s six grounds?

    '
  choices:
  - text: Inefficiency in office
    correct: true
  - text: Treason
    rationale: 'This overlooks an expressly listed ground. Treason has a criminal meaning too. Check the constitutional list.

      '
  - text: Bribery
    rationale: 'This overlooks an expressly listed ground. Bribery can also lead to prosecution. Check the impeachment ground names.

      '
  - text: Culpable violation of the Constitution
    rationale: 'This overlooks the first listed ground. The phrase is longer and technical. Check whether it appears in Section 2.

      '
  explanation: 'The six named grounds are culpable violation of the Constitution, treason, bribery, graft and corruption, other high crimes, and betrayal of public trust.

    '
- id: q-philippine-constitution-accountability-and-impeachment-0007
  lesson: lesson-philippine-constitution-public-trust-and-impeachable-officers
  keyPoint: 2
  type: single_choice
  difficulty: hard
  stem: 'Are members of CSC, COMELEC, and COA included among impeachable officers?

    '
  choices:
  - text: Yes, commission members are listed.
    correct: true
  - text: No, because only elected officers can be impeached under the Constitution.
    rationale: 'This makes election the test. The President is elected. Check the appointed officials also listed.

      '
  - text: No, because every commission member can be removed only by a presidential order.
    rationale: 'This replaces the constitutional process with executive control. Appointments may involve the President. Check the express impeachment list.

      '
  - text: No, because independence exempts their members from all accountability.
    rationale: 'This treats independence as immunity. Commissions are independent. Check their listed accountability mechanism.

      '
  explanation: 'Section 2 includes members of the Constitutional Commissions. The lesson identifies those commissions as CSC, COMELEC, and COA.

    '
- id: q-philippine-constitution-accountability-and-impeachment-0008
  lesson: lesson-philippine-constitution-public-trust-and-impeachable-officers
  keyPoint: 2
  type: single_choice
  difficulty: hard
  stem: 'Does the impeachment list include a Regional Trial Court judge?

    '
  choices:
  - text: No, it names Supreme Court members.
    correct: true
  - text: Yes, because all judicial officers are included whenever any court is named.
    rationale: 'This extends a specific court category to every judge. Both are judicial officers. Check the precise title in Section 2.

      '
  - text: Yes, because a trial judge becomes a Supreme Court member when handling a major case.
    rationale: 'This confuses case importance with office. Some trials are nationally important. Check the judge''s actual court.

      '
  - text: Yes, because all officials with legal training require impeachment for removal.
    rationale: 'This substitutes qualifications for office categories. Many listed officers are lawyers. Check whether legal training is the constitutional test.

      '
  explanation: 'The judicial category in Section 2 is members of the Supreme Court. Trial-court judges are outside that list.

    '
- id: q-philippine-constitution-accountability-and-impeachment-0009
  lesson: lesson-philippine-constitution-public-trust-and-impeachable-officers
  keyPoint: 1
  type: single_choice
  difficulty: easy
  stem: 'Which attitude best reflects Article XI, Section 1''s requirement of accountability to the people?

    '
  choices:
  - text: Service for the public's benefit
    correct: true
  - text: Treating every office decision as a personal asset of the current holder
    rationale: 'This treats public authority as ownership. Officials make decisions. Check whom the authority serves.

      '
  - text: Giving family interests priority over the people whenever interests compete
    rationale: 'This substitutes private benefit for public duty. Family obligations are familiar. Check the public-trust principle.

      '
  - text: Treating the public as customers who must purchase an official's personal favor
    rationale: 'This turns service into private patronage. Officials provide valuable services. Check the duty of responsible public service.

      '
  explanation: 'Section 1 requires officers to be accountable to the people and to serve with responsibility, integrity, loyalty, and efficiency.

    '
- id: q-philippine-constitution-accountability-and-impeachment-0010
  lesson: lesson-philippine-constitution-impeachment-constitutional-breach-treason-and-bribery
  keyPoint: 2
  type: single_choice
  difficulty: easy
  stem: 'Which ground for impeachment most directly describes accepting money or valuable favors to influence official actions?

    '
  choices:
  - text: Bribery
    correct: true
  - text: Treason
    rationale: 'This substitutes disloyal aid to an enemy for a paid official favor. Both are serious grounds. Check the conduct described.

      '
  - text: Betrayal of public trust
    rationale: 'This chooses a broader category instead of the named payment offense. A paid favor can also betray trust. Check whether the item seeks the specific payment-based label.

      '
  - text: Culpable violation of law
    rationale: 'This substitutes a broad legal-violation label. Bribery violates law. Check the specific act and the constitutional wording.

      '
  explanation: 'Bribery is the specific label for accepting value to influence official action. Article XI includes bribery among its grounds.

    '
- id: q-philippine-constitution-accountability-and-impeachment-0011
  lesson: lesson-philippine-constitution-impeachment-constitutional-breach-treason-and-bribery
  keyPoint: 2
  type: single_choice
  difficulty: medium
  stem: 'In wartime, levying war against the Philippines or siding with its enemies and giving them aid or comfort most directly matches which impeachment ground?

    '
  choices:
  - text: Treason
    correct: true
  - text: Bribery
    rationale: 'This substitutes an exchange for official favor. Both can be grave wrongdoing. Check whether payment or enemy aid is described.

      '
  - text: Graft and corruption
    rationale: 'This substitutes corrupt use of office. The act harms the state. Check the enemy-aid or war element.

      '
  - text: Betrayal of public trust
    rationale: 'This chooses a broader accountability label. Treason also betrays trust. Check the specific named offense.

      '
  explanation: 'The described wartime acts may support a treason accusation. Treason is expressly included in Article XI''s list. Proof and a decision through the proper process are still required.

    '
- id: q-philippine-constitution-accountability-and-impeachment-0012
  lesson: lesson-philippine-constitution-public-trust-and-impeachable-officers
  keyPoint: 2
  type: single_choice
  difficulty: medium
  stem: 'How many office categories appear in Section 2''s impeachment list, counting commission members as one category?

    '
  choices:
  - text: '5'
    correct: true
  - text: '3'
    rationale: 'This counts only some of the branches. Executive and judicial offices stand out. Check all expressly listed categories.

      '
  - text: '7'
    rationale: 'This counts the three commissions separately instead of as one category. CSC, COMELEC, and COA are three bodies. Check the grouping specified in the stem.

      '
  - text: '6'
    rationale: 'This uses the number of grounds as the number of office categories. Both lists appear in Section 2. Check which list is being counted.

      '
  explanation: 'The five categories are President, Vice-President, Supreme Court members, Constitutional Commission members, and Ombudsman.

    '
- id: q-philippine-constitution-accountability-and-impeachment-0013
  lesson: lesson-philippine-constitution-impeachment-constitutional-breach-treason-and-bribery
  keyPoint: 1
  type: single_choice
  difficulty: medium
  stem: 'How many grounds are expressly listed in Section 2, treating graft and corruption as one listed ground?

    '
  choices:
  - text: '6'
    correct: true
  - text: '5'
    rationale: 'This uses the office-category count. Both lists are in Section 2. Check which list the question names.

      '
  - text: '7'
    rationale: 'This splits graft and corruption into two listed items. The phrase contains two nouns. Check the grouping in the constitutional list.

      '
  - text: '8'
    rationale: 'This adds general misconduct labels to the express list. Many acts can be wrongful. Check the six named grounds.

      '
  explanation: 'Section 2 lists six grounds. Graft and corruption is one combined item in that list.

    '
- id: q-philippine-constitution-accountability-and-impeachment-0014
  lesson: lesson-philippine-constitution-public-trust-and-impeachable-officers
  keyPoint: 2
  type: single_choice
  difficulty: easy
  stem: 'Are Supreme Court members included in Section 2''s impeachment list?

    '
  choices:
  - text: Yes, they are expressly included.
    correct: true
  - text: No, because the judicial branch is entirely outside constitutional accountability.
    rationale: 'This treats judicial independence as exemption. Courts are independent. Check the express office list.

      '
  - text: No, because the President can remove every Supreme Court member personally.
    rationale: 'This substitutes executive removal for the constitutional mechanism. The President appoints justices. Check appointment versus removal.

      '
  - text: No, because only the Chief Justice can be included among judicial officers.
    rationale: 'This narrows members to the court''s head. The Chief Justice is prominent. Check the plural category members.

      '
  explanation: 'Section 2 expressly includes members of the Supreme Court.

    '
- id: q-philippine-constitution-accountability-and-impeachment-0015
  lesson: lesson-philippine-constitution-impeachment-constitutional-breach-treason-and-bribery
  keyPoint: 2
  type: single_choice
  difficulty: hard
  stem: |
    Which act constitutes a culpable violation of the Constitution as a ground for impeachment?
  choices:
  - text: Intentional violation of constitutional mandate
    correct: true
  - text: Minor clerical error in typing an official administrative memo
    rationale: 'This treats a typing lapse as intentional constitutional defiance. The error occurs in official work. Check intent and constitutional duty.

      '
  - text: Arriving late to a scheduled congressional committee hearing
    rationale: 'This treats lateness alone as constitutional violation. Public meetings can be important. Check the specific mandate and deliberate breach.

      '
  - text: Misplacing an unclassified non-essential public file folder
    rationale: 'This treats an ordinary handling error as culpable constitutional conduct. Officials handle public records. Check whether the facts show a willful constitutional breach.

      '
  explanation: 'The lesson explains culpable violation as a willful and intentional breach of a constitutional duty. This reading separates deliberate disobedience from an honest mistake. The Constitution does not give a complete definition.

    '
- id: q-philippine-constitution-accountability-and-impeachment-0016
  lesson: lesson-philippine-constitution-public-trust-and-impeachable-officers
  keyPoint: 2
  type: single_choice
  difficulty: easy
  approved: false
  stem: 'What does being outside the impeachment list imply for a public officer?

    '
  choices:
  - text: Other lawful removal procedures can still apply.
    correct: true
  - text: The officer is permanently immune from removal regardless of misconduct.
    rationale: 'This treats one unavailable process as immunity. Impeachment is a major removal mechanism. Check the rule for all other officers.

      '
  - text: The officer may choose a personal removal procedure that ignores existing law.
    rationale: 'This replaces lawful procedures with preference. Different offices use different rules. Check the requirement that removal be provided by law.

      '
  - text: The officer automatically joins the impeachment list if the accusation sounds serious.
    rationale: 'This lets severity change the office category. Impeachment grounds are grave. Check the closed list of positions.

      '
  explanation: 'Section 2 says other officers may be removed as provided by law. They are not removed through impeachment merely because an accusation is serious.

    '
- id: q-philippine-constitution-accountability-and-impeachment-0017
  lesson: lesson-philippine-constitution-impeachment-graft-and-high-crimes
  keyPoint: 2
  type: single_choice
  difficulty: medium
  approved: false
  stem: 'Which claim misunderstands the closed list of grounds?

    '
  choices:
  - text: Any unpopular decision is automatically a named ground.
    correct: true
  - text: Betrayal of public trust is expressly named in the list.
    rationale: 'This rejects an included ground. The wording is broad. Check the actual list.

      '
  - text: Culpable violation of the Constitution is expressly named in the list.
    rationale: 'This rejects an included ground. It sounds like a legal description. Check the first listed item.

      '
  - text: Treason, bribery, and other high crimes are expressly named in the list.
    rationale: 'This rejects several included grounds. They also have other legal consequences. Check their express inclusion.

      '
  explanation: 'The Constitution names six grounds. Ordinary unpopularity is not itself one of those named grounds.

    '
- id: q-philippine-constitution-accountability-and-impeachment-0018
  lesson: lesson-philippine-constitution-public-trust-and-impeachable-officers
  keyPoint: 2
  type: single_choice
  difficulty: hard
  approved: false
  stem: |
    An impeachment complaint alleges a constitutional ground for removal against a Court of Appeals justice. Which threshold requirement must be checked?
  choices:
  - text: Whether the office is listed in Article XI, Section 2
    correct: true
  - text: Whether alleging an impeachment ground makes any judicial officer impeachable
    rationale: 'This lets an alleged ground expand the offices covered. A serious charge does not add an office. Check the constitutional office categories.

      '
  - text: Whether Court of Appeals membership is equivalent to Supreme Court membership
    rationale: 'This lets a label replace the actual office. Both courts hear appeals. Check the official''s actual position.

      '
  - text: Whether judicial officers can agree to share the impeachment process
    rationale: 'This treats consent as power to expand the list. Courts are in one branch. Check the constitutionally specified category.

      '
  explanation: 'The judicial category is Supreme Court members. A Court of Appeals justice is not included merely because a named ground is alleged.

    '
- id: q-philippine-constitution-accountability-and-impeachment-0019
  lesson: lesson-philippine-constitution-public-trust-and-impeachable-officers
  keyPoint: 1
  type: single_choice
  difficulty: hard
  approved: false
  stem: 'Which conduct reflects Section 1''s standard for officers and employees?

    '
  choices:
  - text: Serving responsibly and leading modest lives
    correct: true
  - text: Treating public accountability as optional until the officer's term has ended
    rationale: 'This postpones a continuing duty. A term has an end date. Check the continuing duty to answer to the people.

      '
  - text: Using official efficiency to justify dishonest dealings that favor private interests
    rationale: 'This treats speed as enough. Efficiency is listed. Check integrity and public trust as well.

      '
  - text: Placing loyalty to a private patron above duties owed to the people of the Republic
    rationale: 'This replaces public service with patronage. Loyalty is a stated value. Check the public purpose of that loyalty.

      '
  explanation: 'Section 1 requires responsibility, integrity, loyalty, efficiency, patriotism, justice, and modest living while remaining accountable to the people.

    '
- id: q-philippine-constitution-accountability-and-impeachment-0020
  lesson: lesson-philippine-constitution-public-trust-and-impeachable-officers
  keyPoint: 2
  type: single_choice
  difficulty: exam
  approved: false
  stem: 'Why must both office and ground be checked when applying Section 2?

    '
  choices:
  - text: The provision specifies separate limits for each.
    correct: true
  - text: Every public officer becomes impeachable whenever any ground is alleged against them.
    rationale: 'This lets the ground expand the office list. All officers owe accountability. Check the separate coverage limit.

      '
  - text: A listed office permits impeachment for any dislike, even without a listed ground.
    rationale: 'This lets the office erase the ground limit. Listed officials can be impeached. Check both conditions.

      '
  - text: The lists are interchangeable, so an office title can itself be the misconduct charged.
    rationale: 'This confuses who is covered with what is alleged. Both lists occur together. Check their different roles.

      '
  explanation: 'One list identifies the offices covered. The other lists the grounds. An application must respect both limits.

    '

- id: q-philippine-constitution-accountability-and-impeachment-0021
  lesson: lesson-philippine-constitution-impeachment-betrayal-and-proof
  keyPoint: 2
  type: single_choice
  difficulty: exam
  stem: |
    A complaint against an impeachable officer invokes betrayal of public trust. A commentator says that naming this ground alone establishes guilt. Which response is correct?
  choices:
  - text: "The charge still requires proof and a decision."
    correct: true
  - text: "The officer is convicted once the complaint names a listed ground."
    rationale: |
      This treats an accusation as proof. Check whether the facts have been proved through the proper process.
  - text: "The officer is removed as soon as the House receives the complaint."
    rationale: |
      This confuses receiving a complaint with conviction. The House and Senate have separate roles.
  - text: "The officer is convicted once the complainant describes the conduct as serious."
    rationale: |
      This treats the complainant’s description as a verdict. Serious claims still need evidence and a decision.
  explanation: |
    Article XI, Section 2 permits removal on impeachment for, and conviction of, a listed ground. Section 3 gives the House the charging role and the Senate the trial role. Naming a ground does not replace proof and a decision through that process.

- id: q-philippine-constitution-accountability-and-impeachment-0022
  lesson: lesson-philippine-constitution-impeachment-graft-and-high-crimes
  keyPoint: 1
  type: single_choice
  difficulty: exam
  stem: |
    An impeachable officer is accused of using public power to give a favored company an unlawful contract advantage. Which named ground most directly concerns the improper benefit?
  choices:
  - text: "Graft and corruption"
    correct: true
  - text: "Treason through aid to a wartime enemy"
    rationale: |
      This confuses an improper contract benefit with wartime enemy aid. Check the conduct alleged.
  - text: "Other high crimes solely because every unlawful act qualifies"
    rationale: |
      This assumes every illegal act automatically fits other high crimes. Use the ground that directly concerns the improper benefit.
  - text: "Culpable constitutional violation solely because every contract error is deliberate"
    rationale: |
      This treats all contract errors as intentional constitutional breaches. The facts focus on an unlawful advantage for a favored company.
  explanation: |
    Article XI, Section 2 names graft and corruption as a ground for impeachment. Misusing public office to give an improper contract benefit may raise that ground. The accusation concerns public power used for an unlawful private advantage.

- id: q-philippine-constitution-accountability-and-impeachment-0023
  lesson: lesson-philippine-constitution-impeachment-house-filing-routes
  keyPoint: 1
  type: single_choice
  difficulty: exam
  stem: |
    A verified impeachment resolution is filed by at least one-third of all House Members. What follows under the Constitution’s direct filing route?
  choices:
  - text: "It itself becomes the Articles of Impeachment."
    correct: true
  - text: "It must first obtain the same committee review required for a citizen’s endorsed complaint."
    rationale: |
      This applies the regular complaint route to a filing that meets the direct-route threshold. Check who filed it.
  - text: "It remains only a complaint until the Senate votes to approve the charges."
    rationale: |
      This gives the Senate the House’s charging role. The Senate tries the case after the articles are formed.
  - text: "It immediately becomes a conviction without any Senate impeachment trial."
    rationale: |
      This confuses formal charges with a finding of guilt. Direct filing produces the articles, not a conviction.
  explanation: |
    Article XI, Section 3(4) states that a verified complaint or resolution filed by at least one-third of all House Members constitutes the Articles of Impeachment. Senate trial must proceed forthwith, meaning without delay.

- id: q-philippine-constitution-accountability-and-impeachment-0024
  lesson: lesson-philippine-constitution-impeachment-house-filing-routes
  keyPoint: 1
  type: single_choice
  difficulty: exam
  stem: |
    A citizen files a verified impeachment complaint endorsed by a House Member. It is not filed by at least one-third of all House Members. Which route applies?
  choices:
  - text: "Committee review and House action"
    correct: true
  - text: "Direct Senate trial based solely on the citizen’s verified complaint"
    rationale: |
      This treats an endorsed citizen complaint as the direct route. Check whether one-third of all House Members filed it.
  - text: "Immediate conversion into the articles because any endorsement meets the filing threshold"
    rationale: |
      This confuses one Member’s endorsement with filing by the required share of all Members. The thresholds differ.
  - text: "Automatic dismissal because citizens cannot file any impeachment complaint"
    rationale: |
      This overlooks the endorsed citizen route. A citizen may file a verified complaint with a House Member’s endorsement.
  explanation: |
    Article XI, Section 3(2) permits a citizen’s verified complaint with a House Member’s endorsement. This uses the regular route. Committee review and the House action required by Section 3(3) must follow.

- id: q-philippine-constitution-accountability-and-impeachment-0025
  lesson: lesson-philippine-constitution-impeachment-senate-trial-and-limits
  keyPoint: 1
  type: single_choice
  difficulty: exam
  stem: |
    During an impeachment trial of the President, the Chief Justice presides. Which statement correctly describes the Chief Justice’s role?
  choices:
  - text: "The Chief Justice presides but does not vote."
    correct: true
  - text: "The Chief Justice casts a vote that counts toward the Senate’s conviction threshold."
    rationale: |
      This treats presiding as voting. The Constitution expressly keeps the Chief Justice from voting in this trial.
  - text: "The Chief Justice alone decides whether the President is convicted."
    rationale: |
      This gives the presiding officer the Senate’s decision. The Senate alone tries and decides impeachment cases.
  - text: "The Chief Justice must first approve the House’s Articles of Impeachment."
    rationale: |
      This adds an approval step to the House’s charging role. Presiding over trial does not give control over the articles.
  explanation: |
    Article XI, Section 3(6) requires the Chief Justice to preside when the President is tried. The Chief Justice does not vote. Conviction requires agreement by at least two-thirds of all Senators.

- id: q-philippine-constitution-accountability-and-impeachment-0026
  lesson: lesson-philippine-constitution-impeachment-senate-trial-and-limits
  keyPoint: 2
  type: single_choice
  difficulty: exam
  stem: |
    After an impeachment conviction, an officer claims that no separate criminal prosecution may follow. Which statement follows the Constitution?
  choices:
  - text: "Criminal prosecution may still follow."
    correct: true
  - text: "Impeachment conviction automatically imposes any required prison sentence."
    rationale: |
      This treats impeachment judgment as criminal punishment. Check the limits of impeachment judgment.
  - text: "Removal and disqualification replace all further liability under criminal law."
    rationale: |
      This treats impeachment as the end of criminal liability. The Constitution preserves prosecution and punishment under law.
  - text: "The Senate must conduct the criminal trial as part of its impeachment judgment."
    rationale: |
      This combines separate processes. Impeachment judgment concerns removal and disqualification, not a criminal sentence.
  explanation: |
    Article XI, Section 3(7) limits impeachment judgment to removal and disqualification from public office. It also preserves liability to prosecution, trial, and punishment according to law. A separate criminal case may therefore follow.

- id: q-philippine-constitution-accountability-and-impeachment-0027
  lesson: lesson-philippine-constitution-ombudsman-investigations-and-remedies
  keyPoint: 1
  type: single_choice
  difficulty: exam
  stem: |
    No citizen has filed a complaint about an apparently improper act by a public employee. May the Ombudsman start an investigation?
  choices:
  - text: "Yes, it may act on its own initiative."
    correct: true
  - text: "No, a citizen’s complaint is always required before an investigation begins."
    rationale: |
      This overlooks investigation on the Ombudsman’s own initiative. Check both ways an investigation may start.
  - text: "No, only an act already proved criminal can be investigated."
    rationale: |
      This confuses grounds for investigation with proof of a crime. Apparently unjust, improper, or inefficient conduct also falls within the rule.
  - text: "Yes, and starting the investigation automatically removes the employee."
    rationale: |
      This treats an investigation as a finding and removal. Starting a case does not prove wrongdoing.
  explanation: |
    Article XI, Section 13(1) lets the Ombudsman investigate on its own or on complaint. It covers acts or failures to act that appear illegal, unjust, improper, or inefficient. A citizen’s complaint is not required for the office to act on its own.

- id: q-philippine-constitution-accountability-and-impeachment-0028
  lesson: lesson-philippine-constitution-ombudsman-investigations-and-remedies
  keyPoint: 1
  type: single_choice
  difficulty: exam
  stem: |
    An investigation concerns an employee’s unexplained failure to perform a duty required by law. Which constitutional power lets the Ombudsman address the unfinished duty itself?
  choices:
  - text: "Directing performance and expediting the duty"
    correct: true
  - text: "Automatically removing the employee upon receipt of the complaint"
    rationale: |
      This treats a complaint as automatic removal. Check the power that addresses the delayed duty itself.
  - text: "Waiting for the employee to consent before requesting government records"
    rationale: |
      This makes records access depend on the subject’s permission. The Constitution gives the Ombudsman power to request records and assistance.
  - text: "Treating the delay as beyond review because no completed act exists"
    rationale: |
      This overlooks failures to act. Check whether the duty is required by law and needs to be performed.
  explanation: |
    Article XI, Section 13(2) allows the Ombudsman to direct an official to perform and expedite a duty required by law. This power addresses the delayed work itself. Expediting means helping the required duty move forward without delay.
