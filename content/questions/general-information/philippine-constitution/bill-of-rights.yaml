questions:
- id: q-philippine-constitution-bill-of-rights-0001
  lesson: lesson-philippine-constitution-bill-of-rights-due-process-and-equal-protection
  keyPoint: 1
  type: single_choice
  difficulty: easy
  stem: 'How many sections comprise Article III?

    '
  choices:
  - text: 22 sections
    correct: true
  - text: 15 sections
    rationale: 'This stops before the final provisions. Section 15 concerns a familiar liberty protection. Check the final numbered section.

      '
  - text: 20 sections
    rationale: 'This stops at the debt provision. That section is a memorable protection. Check whether double jeopardy and prohibited laws follow.

      '
  - text: 25 sections
    rationale: 'This extends the count past Article III. Nearby constitutional provisions have section numbers. Check the article''s actual end.

      '
  explanation: 'Article III contains Sections 1 through 22.

    '
- id: q-philippine-constitution-bill-of-rights-0002
  lesson: lesson-philippine-constitution-bill-of-rights-due-process-and-equal-protection
  keyPoint: 2
  type: single_choice
  difficulty: easy
  stem: 'Which guarantee concerns lawful process before deprivation of life, liberty, or property?

    '
  choices:
  - text: Due process
    correct: true
  - text: Equal protection of the laws
    rationale: 'This selects equality rather than the process guarantee. Both are in Section 1. Check whether procedure or classification is asked.

      '
  - text: Freedom from compelled self-incrimination
    rationale: 'This selects a specific compelled-testimony protection. Criminal procedure may affect liberty. Check the broader process wording.

      '
  - text: Just compensation for public taking of property
    rationale: 'This selects a specific property-taking limit. Property appears in the stem. Check the general process requirement.

      '
  explanation: 'Due process is the guarantee that a person will not be deprived of life, liberty, or property without the process required by law.

    '
- id: q-philippine-constitution-bill-of-rights-0003
  lesson: lesson-philippine-constitution-bill-of-rights-expression-and-public-action
  keyPoint: 1
  type: single_choice
  difficulty: easy
  stem: 'Which article protects speech, expression, and the press?

    '
  choices:
  - text: Article III
    correct: true
  - text: Article XIII
    rationale: 'This substitutes Social Justice and Human Rights for the Bill of Rights. Both address protection of people. Check where the speech guarantees are stated.

      '
  - text: Article II
    rationale: 'This chooses general principles and policies. Policies include dignity and rights. Check the specific liberty guarantees.

      '
  - text: Article IV
    rationale: 'This chooses citizenship. Citizens exercise many liberties. Check where speech protection is stated.

      '
  explanation: 'Article III, Section 4 protects speech, expression, and the press.

    '
- id: q-philippine-constitution-bill-of-rights-0014
  lesson: lesson-philippine-constitution-bill-of-rights-search-and-arrest-warrants
  keyPoint: 1
  type: single_choice
  difficulty: hard
  stem: 'Under Article III, Section 2, what constitutional condition must be met before a search warrant may issue?

    '
  choices:
  - text: Probable cause personally determined by a judge
    correct: true
  - text: Executive approval based only on private suspicion
    rationale: 'This substitutes executive suspicion for judicial determination. Suspicion can prompt investigation. Check who determines probable cause.

      '
  - text: Verbal approval from a local chief officer
    rationale: 'This substitutes a local superior''s permission. The chief may direct officers. Check the judicial warrant condition.

      '
  - text: Administrative order from a city mayor
    rationale: 'This substitutes administrative authority. Mayors have public duties. Check the judge''s constitutional role.

      '
  explanation: 'Section 2 requires probable cause personally determined by a judge. It also requires the stated examination and a particular description of the place and persons or things covered.

    '
- id: q-philippine-constitution-bill-of-rights-0018
  lesson: lesson-philippine-constitution-bill-of-rights-information-and-association
  keyPoint: 2
  type: single_choice
  difficulty: hard
  approved: false
  stem: |
    Which association is protected under Article III, Section 8?
  choices:
  - text: An association formed for purposes not contrary to law
    correct: true
  - text: An association whose unlawful purpose becomes protected simply by calling itself a union
    rationale: 'This treats a name as overriding the lawful-purpose limit. Unions are expressly protected. Check the purpose rather than the label.

      '
  - text: Only an association formed by public employees, with private workers always excluded
    rationale: 'This narrows coverage to one sector. Government workers are included. Check the broader association protection.

      '
  - text: Only an association whose members surrender every other constitutional liberty
    rationale: 'This adds a rights-waiver condition. Groups may have membership rules. Check whether the lesson requires that surrender.

      '
  explanation: 'Article III protects forming unions, associations, and societies for purposes not contrary to law.

    '
- id: q-philippine-constitution-bill-of-rights-0019
  lesson: lesson-philippine-constitution-bill-of-rights-expression-and-public-action
  keyPoint: 2
  type: single_choice
  difficulty: easy
  stem: |
    Residents submit a written request asking the city government to stop dumping waste near their homes. Which right most directly protects their act of asking the government to address the complaint?
  choices:
  - text: The right to information on matters of public concern
    rationale: |
      This right covers access to public records. The residents are asking for action, not requesting records.
  - text: "The right to petition for redress of grievances"
    correct: true
  - text: The right to just compensation
    rationale: |
      Just compensation concerns private property taken for public use.
      The question concerns submitting a complaint to officials.
  - text: The right against self-incrimination
    rationale: |
      This right protects against forced testimony against oneself.
      The residents are freely asking officials to act.
  explanation: |
    A petition asks the government to fix a wrong. Section 4 protects this request. It does not guarantee that officials will grant it.
  approved: false
- id: q-philippine-constitution-bill-of-rights-0020
  lesson: lesson-philippine-constitution-bill-of-rights-religion-abode-and-travel
  keyPoint: 1
  type: single_choice
  difficulty: easy
  stem: |
    A proposed rule would allow a qualified citizen to vote only after joining a government-approved religion. Which prohibition most directly applies?
  choices:
  - text: The prohibition against excessive bail
    rationale: |
      Bail concerns temporary release while a criminal case proceeds.
      The rule concerns a condition for voting.
  - text: The prohibition against involuntary servitude
    rationale: |
      Involuntary servitude means forced work. The proposed rule requires religious membership, not labor.
  - text: "No religious tests for political rights"
    correct: true
  - text: The prohibition against imprisonment for debt
    rationale: |
      This protects people from imprisonment solely for unpaid debt.
      The voting condition does not concern a debt.
  explanation: |
    Voting is a political right. Section 5 forbids requiring a particular religion to exercise that right.
  approved: false
- id: q-philippine-constitution-bill-of-rights-0021
  lesson: lesson-philippine-constitution-bill-of-rights-property-courts-and-investigation
  keyPoint: 1
  type: single_choice
  difficulty: easy
  stem: |
    The government takes privately owned land for a public road.
    Which requirement does Article III impose for this taking?
  choices:
  - text: Payment of just compensation to the owner
    correct: true
  - text: Payment only if the owner is unable to afford other land
    rationale: |
      Just compensation does not depend on the owner's poverty.
      It is required for private property taken for public use.
  - text: Payment only if the land will later return to private use
    rationale: |
      Section 9 requires payment for a public taking. A later change to private use is not the condition stated in that section.
  - text: No payment because the road serves the public
    rationale: |
      Public use does not remove the duty to pay. It is part of the rule that requires just compensation.
  explanation: |
    Section 9 requires fair payment when private property is taken for public use. A public road does not excuse the government from paying.
  approved: false
- id: q-philippine-constitution-bill-of-rights-0022
  lesson: lesson-philippine-constitution-bill-of-rights-information-and-association
  keyPoint: 1
  type: single_choice
  difficulty: medium
  stem: |
    A citizen requests government research data used to set a public policy. The office says that a law makes part of the data confidential.
    What is the proper approach under the right to information?
  choices:
  - text: Release the entire file because policy data can never be confidential
    rationale: |
      Section 7 covers policy research data, but access remains subject to limits provided by law.
  - text: Deny the entire request because any claim of confidentiality is final
    rationale: |
      An office's claim does not prove that a legal limit applies.
      The claimed law and the covered material must be checked.
  - text: Deny access because research data is outside the right to information
    rationale: |
      Section 7 includes government research data used to develop policy.
      The file is not excluded simply because it contains research.
  - text: "Check whether the law limits access to the requested material"
    correct: true
  explanation: |
    Section 7 covers government policy research data. Access can have legal limits. The office must have an applicable legal basis for its claim.
  approved: false
- id: q-philippine-constitution-bill-of-rights-0023
  lesson: lesson-philippine-constitution-bill-of-rights-due-process-and-equal-protection
  keyPoint: 3
  type: single_choice
  difficulty: medium
  stem: |
    A law grants a public benefit to one group of applicants and denies it to another group in the same situation. The only difference between the groups has no connection to the law's purpose. Which finding most directly raises an equal-protection concern?
  choices:
  - text: The law does not require a court hearing for every application
    rationale: |
      Hearing requirements concern due process. They do not explain whether the grouping fits the purpose of the benefit.
  - text: "The distinction is unrelated to the law's purpose"
    correct: true
  - text: The law treats all members of each group alike
    rationale: |
      Equal treatment within each group is one requirement for a valid grouping. It does not cure an unrelated distinction between groups.
  - text: The law continues to apply to future applicants
    rationale: |
      Applying beyond present conditions is one requirement for a valid grouping. It does not justify a difference unrelated to the purpose.
  explanation: |
    Different treatment needs a valid reason tied to the law's purpose.
    Treating each group consistently does not make an unrelated grouping fair.
  approved: false
- id: q-philippine-constitution-bill-of-rights-0024
  lesson: lesson-philippine-constitution-bill-of-rights-consent-and-private-messages
  keyPoint: 2
  type: single_choice
  difficulty: medium
  stem: |
    Officials obtain private letters in a manner already found to violate Article III, Section 3. They offer the letters as evidence in an administrative case. How does the exclusionary rule apply?
  choices:
  - text: The letters may be used because the case is not criminal
    rationale: |
      The rule covers any proceeding. It is not limited to criminal cases.
  - text: The letters may be used if they appear reliable
    rationale: |
      Reliable content does not remove the exclusion required after a violation of Section 3.
  - text: The letters may not be used for any purpose in the proceeding
    correct: true
  - text: The letters may be used if officials obtained them for a public purpose
    rationale: |
      A claimed public purpose does not cure the violation already found.
      Evidence obtained through that violation is excluded.
  explanation: |
    Evidence obtained in violation of Section 2 or Section 3 is excluded for any purpose in any proceeding. Administrative cases are included.
  approved: false
- id: q-philippine-constitution-bill-of-rights-0025
  lesson: lesson-philippine-constitution-bill-of-rights-consent-and-private-messages
  keyPoint: 1
  type: single_choice
  difficulty: medium
  stem: |
    Armed officers surround a commuter and order the commuter to open a bag. The commuter remains silent and follows the order. The officers claim that this alone proves consent. Which assessment is correct?
  choices:
  - text: "Silence and obedience here do not alone establish free consent"
    correct: true
  - text: Following an officer's order always establishes informed consent
    rationale: |
      Following an order can result from pressure. Consent must be freely and clearly given.
  - text: Consent is established whenever the person does not physically resist
    rationale: |
      Lack of resistance does not prove permission. A person may submit because armed officers create pressure.
  - text: The presence of armed officers removes the need to establish a search exception
    rationale: |
      Being armed does not give officers an unlimited right to search.
      A warrant exception must still meet its conditions.
  explanation: |
    Consent must be clear, informed, specific, and free from pressure.
    Silence and submission to armed officers do not by themselves prove it.
  approved: false
- id: q-philippine-constitution-bill-of-rights-0026
  lesson: lesson-philippine-constitution-bill-of-rights-religion-abode-and-travel
  keyPoint: 2
  type: single_choice
  difficulty: medium
  stem: |
    An official orders a person to leave a permanent home and live in another town. The official cites national security but has no lawful court order. Which statement correctly distinguishes the rights involved?
  choices:
  - text: National security automatically allows officials to choose a person's residence
    rationale: |
      National security is a listed ground for restricting travel as provided by law. It does not replace the rule for liberty of abode.
  - text: Residence and travel may be restricted under identical conditions
    rationale: |
      Section 6 gives these rights different rules. Forced relocation concerns liberty of abode.
  - text: Liberty of abode permits no restrictions even with a lawful court order
    rationale: |
      Section 6 allows restrictions on abode within limits set by law upon a lawful court order.
  - text: "Restricting abode requires a lawful court order within legal limits"
    correct: true
  explanation: |
    Choosing where to live concerns liberty of abode. Section 6 requires a lawful court order within legal limits. Travel has a separate rule.
  approved: false
- id: q-philippine-constitution-bill-of-rights-0027
  lesson: lesson-philippine-constitution-bill-of-rights-search-and-arrest-warrants
  keyPoint: 1
  type: single_choice
  difficulty: hard
  stem: |
    A judge independently reviews a prosecutor's report and sufficient supporting evidence before finding probable cause for an arrest warrant. An objection claims that the judge also had to question the complainant and witnesses personally. Which response is correct?
  choices:
  - text: The objection is correct because every arrest warrant requires that personal questioning
    rationale: |
      This transfers the search-warrant examination requirement to every arrest warrant. Sufficient records may support the arrest decision.
  - text: "Personal review of sufficient evidence can satisfy the judge's duty"
    correct: true
  - text: The objection is incorrect because the prosecutor alone determines probable cause for the warrant
    rationale: |
      The judge must decide independently. The prosecutor's conclusion does not replace the judge's review.
  - text: The objection is correct because arrest warrants cannot rely on written evidence
    rationale: |
      A judge may personally evaluate the prosecutor's report and supporting evidence. Written records are not barred.
  explanation: |
    For an arrest warrant, the judge may personally review sufficient records. The judge must make an independent decision. Personal questioning is not always required.
  approved: false
- id: q-philippine-constitution-bill-of-rights-0028
  lesson: lesson-philippine-constitution-bill-of-rights-hot-pursuit-arrests
  keyPoint: 1
  type: single_choice
  difficulty: hard
  stem: |
    An officer arrests a person without a warrant based only on an unverified message alleging a theft committed several weeks earlier. The officer invokes hot pursuit. Which assessment is most accurate?
  choices:
  - text: The exception applies because any report of theft supplies personal knowledge
    rationale: |
      An unverified report alone does not give the officer personal knowledge of facts supporting probable cause.
  - text: The exception fails only because the officer did not witness the theft
    rationale: |
      Hot pursuit does not require witnessing the offense itself.
      It requires a just-committed offense and personal knowledge of supporting facts.
  - text: "The offense did not just occur, and the officer lacks personal knowledge"
    correct: true
  - text: The exception applies because officers may pursue any unsolved offense without a warrant
    rationale: |
      An unsolved offense does not remove the requirements of immediacy and personal knowledge for a hot-pursuit arrest.
  explanation: |
    Hot pursuit requires an offense that has just occurred. The officer must personally know facts supporting the arrest and act with the required immediacy. These facts meet neither requirement.
  approved: false
- id: q-philippine-constitution-bill-of-rights-0029
  lesson: lesson-philippine-constitution-bill-of-rights-property-courts-and-investigation
  keyPoint: 3
  type: single_choice
  difficulty: hard
  stem: |
    Police hold a person in custody and question them as a suspect in an offense. The person cannot afford a lawyer. Investigators obtain a written waiver of the rights to silence and counsel while no lawyer is present. Which statement is correct?
  choices:
  - text: "The waiver is invalid because counsel was absent"
    correct: true
  - text: The waiver is sufficient because a written signature replaces the need for counsel
    rationale: |
      Writing is only one requirement. The waiver must also be made in the presence of counsel.
  - text: The person loses the right to counsel by being unable to pay
    rationale: |
      Section 12 requires a lawyer to be provided when the person cannot afford one.
  - text: Investigators may accept an oral waiver later to cure the missing lawyer
    rationale: |
      An oral waiver does not meet the written-waiver requirement.
      It also does not supply counsel's required presence.
  explanation: |
    Section 12 requires a written waiver made in the presence of counsel. A signature alone is not enough. A person who cannot afford a lawyer must be provided one.
  approved: false
- id: q-philippine-constitution-bill-of-rights-0030
  lesson: lesson-philippine-constitution-bill-of-rights-bail-trial-and-testimony
  keyPoint: 1
  type: single_choice
  difficulty: hard
  stem: |
    Before conviction, an accused is charged with an offense punishable by reclusion perpetua. The evidence of guilt is not strong. The State relies only on the charged penalty to invoke Section 13's stated exception to bail. Which conclusion follows?
  choices:
  - text: The exception applies whenever the charge carries reclusion perpetua
    rationale: |
      The charged penalty is only one condition. Section 13 also requires strong evidence of guilt for this exception.
  - text: The accused must prove innocence before the exception can be rejected
    rationale: |
      The stated rule asks whether the evidence of guilt is strong.
      It does not require the accused to prove innocence.
  - text: The exception applies because bail is available only after conviction
    rationale: |
      Section 13 protects bail before conviction, subject to its stated exception. This reverses the timing of that protection.
  - text: "The exception also requires strong evidence of guilt"
    correct: true
  explanation: |
    Both conditions matter. The charge must carry reclusion perpetua, and the evidence of guilt must be strong. The charged penalty alone does not meet this exception.
  approved: false
- id: q-philippine-constitution-bill-of-rights-0031
  lesson: lesson-philippine-constitution-bill-of-rights-bail-trial-and-testimony
  keyPoint: 2
  type: single_choice
  difficulty: exam
  stem: |
    Rebellion exists, and public safety requires suspension of the privilege of the writ of habeas corpus. An official argues that this also suspends the right to bail. Which statement correctly applies the constitutional rules?
  choices:
  - text: Rebellion alone permits suspension, and bail is suspended with it
    rationale: |
      Suspension also requires a public-safety need. The right to bail remains protected even during suspension.
  - text: "Suspension is justified, but bail remains protected"
    correct: true
  - text: Suspension is forbidden during rebellion even when public safety requires it
    rationale: |
      Section 15 expressly allows suspension during invasion or rebellion when public safety requires it.
  - text: Suspension gives every detained person an unconditional right to release on bail
    rationale: |
      Bail remains subject to its own constitutional rules. Suspension neither removes those rules nor guarantees release to everyone.
  explanation: |
    Rebellion and the stated public-safety need meet Section 15's conditions. Section 13 separately protects bail during suspension. Its own rules still determine whether bail is available.
  approved: false
- id: q-philippine-constitution-bill-of-rights-0032
  lesson: lesson-philippine-constitution-bill-of-rights-double-jeopardy
  keyPoint: 2
  type: single_choice
  difficulty: exam
  stem: |
    An act is punishable under both a national law and a local ordinance. In a court with authority, an accused faces a valid charge under the ordinance, enters a valid plea after arraignment, and is acquitted. The State then prosecutes the same act under the national law.
    Which rule most directly governs?
  choices:
  - text: The second prosecution is allowed because the two laws have different sources
    rationale: |
      Section 21 expressly covers an act punished by both a national law and an ordinance. Different sources do not avoid that protection.
  - text: Only a prior conviction can bar the second prosecution
    rationale: |
      Section 21 includes both conviction and acquittal under either law as a bar to another prosecution for the same act under the other.
  - text: "The ordinance acquittal bars prosecution for the same act under national law"
    correct: true
  - text: Double jeopardy begins with any complaint even before arraignment and plea
    rationale: |
      A complaint alone is not enough. A valid charge, proper court, arraignment, valid plea, and protected end must be checked.
  explanation: |
    Section 21 covers the same act punished by a national law and an ordinance. Conviction or acquittal under either bars another prosecution under the other. The stated first case meets the required steps.
  approved: false
- id: q-philippine-constitution-bill-of-rights-0033
  lesson: lesson-philippine-constitution-bill-of-rights-prohibited-laws
  keyPoint: 1
  type: single_choice
  difficulty: exam
  stem: |
    A new criminal law increases the punishment for an offense and applies the increase to acts committed before it took effect. A separate law directly punishes named people without a court trial. Which pair correctly identifies the prohibited laws, in that order?
  choices:
  - text: Ex post facto law and bill of attainder
    correct: true
  - text: Bill of attainder and ex post facto law
    rationale: |
      This reverses the terms. The first law increases past punishment.
      The second imposes punishment on named people without a trial.
  - text: Ex post facto law and law impairing the obligation of contracts
    rationale: |
      The first term fits. The second law punishes named people without trial. It does not concern changing duties under a contract.
  - text: Law impairing the obligation of contracts and bill of attainder
    rationale: |
      The second term fits. The first law changes punishment for past crimes. It does not concern contractual duties.
  explanation: |
    An ex post facto law applies a harmful criminal-law change backward. A bill of attainder punishes named or identifiable people without a court trial. Section 22 bans both.
  approved: false
- id: q-philippine-constitution-bill-of-rights-0034
  lesson: lesson-philippine-constitution-bill-of-rights-arrest-in-an-officers-presence
  keyPoint: 1
  type: single_choice
  difficulty: exam
  stem: |
    An officer personally witnesses an offense, immediately arrests the offender, and searches the offender for weapons. The offender challenges both acts solely because the officer had no warrants. Which assessment is most accurate?
  choices:
  - text: Both acts require warrants even when the officer personally witnesses the offense.
    rationale: |
      This overlooks the exception for an offense in the officer's presence. Check the ground for arrest before requiring a warrant.
  - text: The arrest is allowed, but a search of the person always needs a separate warrant.
    rationale: |
      This misses the search allowed after a lawful arrest. Check whether the search concerns the arrested person and weapons or evidence.
  - text: Both acts fall within recognized warrant exceptions on these facts.
    correct: true
  - text: The search is allowed only if it occurs before the officer makes a lawful arrest.
    rationale: |
      This reverses the sequence. The search exception follows a lawful arrest. Check which act legally supports the search.
  explanation: |
    Article III, Section 2 protects against unreasonable searches and seizures.
    Rule 113, Section 5 allows arrest for an offense committed in the officer's presence.
    Rule 126, Section 13 allows a search of the person for weapons or evidence after that lawful arrest.
- id: q-philippine-constitution-bill-of-rights-0036
  lesson: lesson-philippine-constitution-bill-of-rights-arrest-in-an-officers-presence
  keyPoint: 1
  type: single_choice
  difficulty: exam
  stem: |
    Following a lawful arrest for an offense committed in an officer's presence, the officer claims authority to search any place desired without a warrant. Which statement best identifies the limit of a search incident to lawful arrest?
  choices:
  - text: It permits a search of the arrested person for weapons or evidence.
    correct: true
  - text: It permits a search of any place whenever the officer first makes a lawful arrest.
    rationale: |
      This turns a limited exception into unlimited power. Check that the stated search concerns the arrested person.
  - text: It permits searches only if the arrested person first admits guilt to the officer.
    rationale: |
      This adds an admission requirement. The stated search rests on a lawful arrest. Check that basis instead.
  - text: It permits no search of the arrested person without an additional search warrant.
    rationale: |
      This removes the exception entirely. Check the rule allowing a search of the person after a lawful arrest.
  explanation: |
    Article III, Section 2 protects against unreasonable searches and seizures.
    Under Rule 126, Section 13, a lawful arrest supports a search of the person for weapons or evidence.
    This is the limited search described in the lesson.
- id: q-philippine-constitution-bill-of-rights-0037
  lesson: lesson-philippine-constitution-bill-of-rights-hot-pursuit-arrests
  keyPoint: 1
  type: single_choice
  difficulty: exam
  stem: |
    An officer claims that acting immediately after a reported crime is enough for a hot-pursuit arrest, even without personal knowledge of facts linking the person arrested to the offense. Which requirement does this claim overlook?
  choices:
  - text: The officer must obtain a confession before making any hot-pursuit arrest.
    rationale: |
      This substitutes a confession for the required facts. Check personal knowledge supporting probable cause, not an admission of guilt.
  - text: The officer must personally witness the entire offense before making the arrest.
    rationale: |
      This confuses hot pursuit with an offense in the officer's presence. Check facts personally known after the crime instead.
  - text: The officer must wait until the offense is no longer recent before acting.
    rationale: |
      This reverses the immediacy requirement. Check that the offense has just occurred as well as the officer's personal knowledge.
  - text: Probable cause must rest on personally known facts or circumstances.
    correct: true
  explanation: |
    Article III, Section 2 protects against unreasonable seizures.
    Rule 113, Section 5 requires probable cause based on the officer's personal knowledge of facts or circumstances for a hot-pursuit arrest.
    The offense must also have just occurred. Prompt action alone meets only part of the rule.
- id: q-philippine-constitution-bill-of-rights-0038
  lesson: lesson-philippine-constitution-bill-of-rights-property-courts-and-investigation
  keyPoint: 2
  type: single_choice
  difficulty: exam
  stem: |
    An agency that hears evidence and decides disputes outside the court system allows a poor applicant to file a case. It then denies adequate legal assistance solely because the applicant cannot pay. Which assessment follows Article III?
  choices:
  - text: Permission to file does not settle the separate protection for legal help.
    correct: true
  - text: Permission to file satisfies the Constitution even if poverty is the sole reason for denying legal help.
    rationale: |
      This treats access and legal help as the same protection. Check both rights separately when filing is allowed.
  - text: The agency is outside the courts, so poverty may always justify denying legal assistance there.
    rationale: |
      This overlooks quasi-judicial bodies. Check the agency's role in hearing facts and deciding disputes, not just its name.
  - text: The applicant must first win the dispute before poverty can be considered in providing legal assistance.
    rationale: |
      This adds a winning requirement. Check the protection against denying adequate legal help because of poverty.
  explanation: |
    Article III, Section 11 protects access to courts and quasi-judicial bodies and adequate legal assistance despite poverty.
    The agency performs a quasi-judicial role. Allowing filing does not by itself provide the protected legal help.
- id: q-philippine-constitution-bill-of-rights-0039
  lesson: lesson-philippine-constitution-bill-of-rights-bail-trial-and-testimony
  keyPoint: 3
  type: single_choice
  difficulty: exam
  stem: |
    A government office handling an administrative case claims that the constitutional right to speedy disposition applies only to criminal trials. Which response correctly states the coverage of that right?
  choices:
  - text: It covers administrative bodies too.
    correct: true
  - text: It covers only courts hearing criminal prosecutions.
    rationale: |
      This confuses speedy disposition with criminal-trial protections. Check the bodies named in Section 16.
  - text: It covers only cases in which the person is detained.
    rationale: |
      This adds a detention requirement. Check the rule for all persons with cases before the covered bodies.
  - text: It covers only a court's review after the office decides.
    rationale: |
      This postpones the protection until court review. Check that administrative bodies themselves are covered.
  explanation: |
    Article III, Section 16 protects speedy disposition before judicial, quasi-judicial, and administrative bodies.
    It requires cases to move forward and be resolved without unreasonable delay. The office's administrative role is covered.
- id: q-philippine-constitution-bill-of-rights-0040
  lesson: lesson-philippine-constitution-bill-of-rights-bail-trial-and-testimony
  keyPoint: 4
  type: single_choice
  difficulty: exam
  stem: |
    An official demands that a person give testimony admitting the person's own guilt. The official argues that the constitutional protection concerns temporary release from custody only. Which protection most directly answers the demand for testimony?
  choices:
  - text: The protection against excessive bail
    rationale: |
      This concerns security for release, not forced testimony. Check what the official demands the person say.
  - text: The right to an impartial public trial
    rationale: |
      This concerns trial fairness and public access. Check the separate protection against being forced to speak against oneself.
  - text: The protection against compelled self-incrimination
    correct: true
  - text: The right to obtain court orders for defense witnesses
    rationale: |
      This helps bring defense proof to court. Check the difference between obtaining evidence and forcing self-incriminating testimony.
  explanation: |
    Article III, Section 17 protects a person from being compelled to testify against oneself.
    A forced statement admitting one's own guilt falls within that protection.
- id: q-philippine-constitution-bill-of-rights-0041
  lesson: lesson-philippine-constitution-bill-of-rights-detention-and-punishment
  keyPoint: 1
  type: single_choice
  difficulty: exam
  stem: |
    A person who cannot pay a poll tax is threatened with imprisonment solely for nonpayment. The official argues that the constitutional protection applies only to private loans. Which statement is correct?
  choices:
  - text: Nonpayment of a poll tax is also protected against imprisonment.
    correct: true
  - text: The protection applies only if the unpaid obligation comes from a private loan.
    rationale: |
      This leaves out poll taxes. Check both reasons for imprisonment named in Section 20.
  - text: Any unpaid tax permits imprisonment because the protection concerns debt alone.
    rationale: |
      This overlooks the express poll-tax protection. Check the kind of tax in the facts.
  - text: Nonpayment of a poll tax automatically proves a separate crime involving money.
    rationale: |
      This treats nonpayment itself as proof of another crime. Check whether the facts identify any separate criminal act.
  explanation: |
    Article III, Section 20 bars imprisonment for debt or nonpayment of a poll tax.
    The threatened imprisonment rests only on the unpaid poll tax, so this protection applies.
- id: q-philippine-constitution-bill-of-rights-0042
  lesson: lesson-philippine-constitution-bill-of-rights-detention-and-punishment
  keyPoint: 1
  type: single_choice
  difficulty: exam
  stem: |
    An official orders forced labor as punishment for a person who has been accused of a crime but has not been convicted. Which fact prevents reliance on the crime-punishment exception to the ban on involuntary servitude?
  choices:
  - text: Forced labor is described as punishment rather than voluntary work.
    rationale: |
      Punishment is the setting of the stated exception. Check whether its required conviction has occurred.
  - text: The official has made an accusation but there is no due conviction.
    correct: true
  - text: The labor follows an accusation instead of the person's political beliefs.
    rationale: |
      This confuses the political-belief rule with the forced-work rule. Check the conviction requirement for the work exception.
  - text: The exception can never apply even after a lawful criminal conviction.
    rationale: |
      This removes the stated exception. Check that Section 18 allows punishment after due conviction for a crime.
  explanation: |
    Article III, Section 18 permits involuntary servitude as punishment only after due conviction for a crime.
    An accusation is not a conviction. The stated facts do not meet the exception.
- id: q-philippine-constitution-bill-of-rights-0043
  lesson: lesson-philippine-constitution-bill-of-rights-double-jeopardy
  keyPoint: 1
  type: single_choice
  difficulty: exam
  stem: |
    A prosecutor relies on a filed complaint as proof that any later prosecution for the same offense would be barred. The accused was never arraigned and entered no plea. Which assessment correctly applies the general double-jeopardy rule?
  choices:
  - text: The complaint alone is insufficient.
    correct: true
  - text: Filing alone is equivalent to an acquittal.
    rationale: |
      This treats an accusation as a judgment of not guilty. Check how the case ended as well as how it began.
  - text: A valid plea matters only after a conviction.
    rationale: |
      This puts the plea in the wrong place. Check arraignment and a valid plea among the earlier required steps.
  - text: The rule requires a complaint but no further steps.
    rationale: |
      This drops the court, arraignment, plea, and protected-ending requirements. Check all the conditions, not just filing.
  explanation: |
    Article III, Section 21 protects against double jeopardy.
    Under Rule 117, Section 7, the general rule requires a valid charge, a court with authority, a valid plea after arraignment, and a protected end to the case.
    The facts lack arraignment and a plea.
- id: q-philippine-constitution-bill-of-rights-0044
  lesson: lesson-philippine-constitution-bill-of-rights-prohibited-laws
  keyPoint: 1
  type: single_choice
  difficulty: exam
  stem: |
    A law names a group and directly imposes punishment without judicial trial for acts that were lawful when committed. Which assessment best applies the constitutional prohibitions?
  choices:
  - text: Both prohibitions apply.
    correct: true
  - text: Only the bill-of-attainder prohibition applies.
    rationale: |
      This catches punishment without trial but misses punishment for earlier lawful acts. Check whether the law also operates backward.
  - text: Only the ex-post-facto prohibition applies.
    rationale: |
      This catches the backward penal change but misses direct punishment without trial. Check both features of the law.
  - text: Neither prohibition applies to a named group.
    rationale: |
      Naming a group does not remove either protection. Check the lack of trial and the punishment for earlier lawful acts.
  explanation: |
    Article III, Section 22 bans ex post facto laws and bills of attainder.
    Punishing an identified group without a court trial makes this a bill of attainder.
    Punishing acts that were lawful when done also makes it an ex post facto law.
