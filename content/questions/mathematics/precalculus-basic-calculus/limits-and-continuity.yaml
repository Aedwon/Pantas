meta:
  subject: mathematics
  topic: precalculus-basic-calculus
  subtopic: limits-and-continuity
  exams: [upcat, acet, dlsucet, ustet, pupcet]
questions:
  - id: q-precalculus-basic-calculus-limits-and-continuity-0001
    type: direct-computation
    difficulty: easy
    stem: |
      Evaluate $\lim_{x \to 2} (3x^2 - 4x + 5)$.
    choices:
      - text: $9$
        correct: true
      - text: $17$
        rationale: |
          You dropped the middle term. $3(2)^2 + 5 = 17$, but the expression
          also has $-4x$. Include it: $12 - 8 + 5 = 9$.
      - text: $5$
        rationale: |
          You read off the constant term only. Direct substitution means
          replacing every $x$ with 2, not just picking the number with no $x$.
      - text: $13$
        rationale: |
          You forgot to multiply $-4$ by $x$. You subtracted 4 instead of
          $4 \times 2 = 8$. The correct calculation is $12 - 8 + 5 = 9$.
    explanation: |
      Since polynomial functions are continuous everywhere, evaluate by direct substitution:
      $3(2)^2 - 4(2) + 5 = 3(4) - 8 + 5 = 12 - 8 + 5 = 9$.

  - id: q-precalculus-basic-calculus-limits-and-continuity-0002
    type: direct-computation
    difficulty: easy
    stem: |
      Evaluate $\lim_{x \to 3} \frac{x + 5}{x + 1}$.
    choices:
      - text: $2$
        correct: true
      - text: $3$
        rationale: |
          You returned the value $x$ is approaching instead of evaluating
          the expression. Substitute $x = 3$: $(3 + 5) \div (3 + 1) = 2$.
      - text: $5$
        rationale: |
          You evaluated the numerator at $x = 0$, not $x = 3$. Replace $x$
          with 3 in the whole fraction: $8 \div 4 = 2$.
      - text: $8$
        rationale: |
          You computed the numerator $3 + 5 = 8$ but forgot to divide by
          the denominator $3 + 1 = 4$. The answer is $8 \div 4 = 2$.
    explanation: |
      Direct substitution works because the denominator is non-zero at $x = 3$:
      $\frac{3 + 5}{3 + 1} = \frac{8}{4} = 2$.

  - id: q-precalculus-basic-calculus-limits-and-continuity-0003
    type: which-is-true
    difficulty: easy
    stem: |
      What does it mean for a limit $\lim_{x \to a} f(x) = L$ to exist?
    choices:
      - text: Both the left-hand limit $\lim_{x \to a^-} f(x)$ and the right-hand limit $\lim_{x \to a^+} f(x)$ exist and are equal to $L$.
        correct: true
      - text: The function value $f(a)$ must equal zero.
        rationale: |
          You mixed up the limit with the function value, and also required it
          to be zero. A limit can equal any number $L$, and $f(a)$ does not
          even need to be defined for the limit to exist.
      - text: The left-hand limit and right-hand limit must equal zero.
        rationale: |
          You confused "the two one-sided limits must be equal to each other"
          with "they must both equal zero." They must agree, but they can
          agree on any value $L$.
      - text: The function $f(x)$ must be a polynomial.
        rationale: |
          You applied a property that belongs to polynomials to limits in
          general. Polynomials are easy to evaluate, but limits exist for
          many non-polynomial functions. The requirement is that both
          one-sided limits exist and equal $L$.
    explanation: |
      A two-sided limit exists and equals $L$ if and only if both one-sided limits exist and are equal to $L$: $\lim_{x \to a^-} f(x) = \lim_{x \to a^+} f(x) = L$.

  - id: q-precalculus-basic-calculus-limits-and-continuity-0004
    type: direct-computation
    difficulty: easy
    stem: |
      Evaluate $\lim_{x \to \infty} \frac{5}{x^2 + 1}$.
    choices:
      - text: $0$
        correct: true
      - text: $5$
        rationale: |
          You treated the top 5 as if it could control the fraction by
          itself. A fraction approaches 1 only when the top and bottom have
          the same leading growth. Here the numerator stays 5 while the
          denominator grows, so the limit is 0.
      - text: $\infty$
        rationale: |
          You confused the limit of $x^2$ with the limit of the whole
          fraction. $x^2$ grows, but it is in the denominator, which makes
          the fraction smaller, not larger.
      - text: $1$
        rationale: |
          You treated $x \to \infty$ as $x = 1$. "As $x$ grows without
          bound" is not the same as substituting $x = 1$. The denominator
          goes to infinity, so the fraction goes to 0.
    explanation: |
      As $x \to \infty$, the denominator $x^2 + 1$ grows infinitely large while the numerator remains 5. Dividing a constant by an infinitely large quantity yields a limit of $0$.

  - id: q-precalculus-basic-calculus-limits-and-continuity-0005
    type: which-is-true
    difficulty: easy
    stem: |
      Which of the following expression results represents an indeterminate form when evaluating limits directly?
    choices:
      - text: $\frac{0}{0}$
        correct: true
      - text: $\frac{0}{5}$
        rationale: |
          You picked something with a zero numerator, but that is not the
          same as indeterminate. $\dfrac{0}{5} = 0$ exactly. Indeterminate
          forms are ones where the value cannot be determined without
          further algebra.
      - text: $\frac{5}{0}$
        rationale: |
          You confused "undefined" with "indeterminate." $\dfrac{5}{0}$ has
          no value at all: the denominator is zero and the numerator is not.
          Indeterminate means more work is needed, not that no value exists.
      - text: $\frac{1}{\infty}$
        rationale: |
          You picked a limit-form shorthand that is not indeterminate. When
          a fixed numerator is divided by quantities growing without bound,
          the corresponding quotient approaches 0.
    explanation: |
      $\frac{0}{0}$ is an indeterminate form because it does not determine a specific limit value without further algebraic simplification (such as factoring or rationalizing). In contrast, $\frac{0}{5} = 0$, while literal division by zero such as $\frac{5}{0}$ is undefined. In limit notation, a nonzero-over-zero substitution still requires one-sided behavior to determine whether the function tends to $+\infty$, $-\infty$, or has no two-sided limit.

  - id: q-precalculus-basic-calculus-limits-and-continuity-0006
    type: direct-computation
    difficulty: medium
    stem: |
      Evaluate $\lim_{x \to 4} \frac{x^2 - 16}{x - 4}$.
    choices:
      - text: $8$
        correct: true
      - text: $0$
        rationale: |
          You got $\dfrac{0}{0}$ by direct substitution and concluded the
          answer is 0. That result signals an indeterminate form, not a
          zero limit. Factor the numerator to cancel the shared term first.
      - text: Does not exist
        rationale: |
          You saw $\dfrac{0}{0}$ and stopped. That form does not mean the
          limit is absent. Factor $x^2 - 16 = (x-4)(x+4)$, cancel $(x-4)$,
          and the limit is $\lim_{x \to 4}(x + 4) = 8$.
      - text: $4$
        rationale: |
          You returned the value $x$ approaches instead of evaluating the
          simplified expression. After canceling $(x-4)$, you have $x + 4$,
          which equals $4 + 4 = 8$ at $x = 4$.
    explanation: |
      Direct substitution gives the indeterminate form $\frac{0}{0}$. Factor the numerator as a difference of squares:
      $\lim_{x \to 4} \frac{(x-4)(x+4)}{x-4} = \lim_{x \to 4} (x + 4) = 4 + 4 = 8$.

  - id: q-precalculus-basic-calculus-limits-and-continuity-0007
    type: direct-computation
    difficulty: medium
    stem: |
      Evaluate $\lim_{x \to 2} \frac{x^2 - 5x + 6}{x - 2}$.
    choices:
      - text: $-1$
        correct: true
      - text: $1$
        rationale: |
          You cancelled $(x - 2)$ correctly but then evaluated $x - 3$ at
          $x = 2$ and dropped the negative sign: $2 - 3 = -1$, not $+1$.
      - text: $0$
        rationale: |
          You saw $\dfrac{0}{0}$ from direct substitution and said the answer
          is 0. That form tells you to factor, not to stop. After factoring
          and canceling, the limit is $\lim_{x \to 2}(x - 3) = -1$.
      - text: $-5$
        rationale: |
          You read off the coefficient of $x$ in the numerator. The $-5$ is
          part of the quadratic, not the limit. After factoring and canceling
          the result is $x - 3$, which gives $-1$ at $x = 2$.
    explanation: |
      Direct substitution gives $\frac{0}{0}$. Factor the quadratic numerator:
      $\lim_{x \to 2} \frac{(x-2)(x-3)}{x-2} = \lim_{x \to 2} (x - 3) = 2 - 3 = -1$.

  - id: q-precalculus-basic-calculus-limits-and-continuity-0008
    type: direct-computation
    difficulty: medium
    stem: |
      Evaluate $\lim_{x \to \infty} \frac{6x^2 + 2x - 1}{3x^2 - 5}$.
    choices:
      - text: $2$
        correct: true
      - text: $\infty$
        rationale: |
          You saw $x^2$ in the numerator and assumed the fraction grows
          without bound. Both the numerator and denominator have the same
          degree, so they grow at the same rate and the limit is a finite
          number.
      - text: $0$
        rationale: |
          You applied the rule for when the numerator's degree is lower than
          the denominator's. Here both have degree 2, so the limit is the
          ratio of their leading coefficients: $6 \div 3 = 2$.
      - text: $-\frac{1}{5}$
        rationale: |
          You divided the constant magnitudes and kept the numerator's
          negative sign, but constants do not control end behavior. The
          degrees match, so the limit comes from the leading coefficients:
          $\dfrac{6}{3} = 2$.
    explanation: |
      For rational functions at infinity where the numerator and denominator have the same degree (2), the limit equals the ratio of their leading coefficients: $\frac{6}{3} = 2$.

  - id: q-precalculus-basic-calculus-limits-and-continuity-0009
    type: direct-computation
    difficulty: medium
    stem: |
      Consider the piecewise function:
      $f(x) = \begin{cases} 2x + 1 & \text{if } x < 3 \\ x^2 - 2 & \text{if } x \ge 3 \end{cases}$
      Find the right-hand limit $\lim_{x \to 3^+} f(x)$.
    choices:
      - text: $7$
        correct: true
      - text: $6$
        rationale: |
          You used the left-hand rule $2x + 1$ but dropped the $+1$, giving
          $2(3) = 6$. The right-hand limit uses $x^2 - 2$: $3^2 - 2 = 7$.
      - text: $9$
        rationale: |
          You computed $3^2 = 9$ but forgot to subtract 2. The right-hand
          rule is $x^2 - 2$, so the limit is $9 - 2 = 7$.
      - text: $5$
        rationale: |
          You evaluated the left-hand rule $2x + 1$ at $x = 2$ instead of
          $x = 3$: $2(2) + 1 = 5$. The right-hand limit uses $x \to 3^+$
          with the rule $x^2 - 2$, giving $7$.
    explanation: |
      For the right-hand limit $\lim_{x \to 3^+}$, $x$ approaches 3 from values greater than 3, so use the rule $f(x) = x^2 - 2$:
      $\lim_{x \to 3^+} (x^2 - 2) = 3^2 - 2 = 9 - 2 = 7$.

  - id: q-precalculus-basic-calculus-limits-and-continuity-0010
    type: which-is-true
    difficulty: medium
    stem: |
      What are the three conditions required for a function $f(x)$ to be continuous at $x = c$?
    choices:
      - text: $f(c)$ is defined, $\lim_{x \to c} f(x)$ exists, and $\lim_{x \to c} f(x) = f(c)$.
        correct: true
      - text: $f'(c)$ exists, $f(c) = 0$, and $\lim_{x \to c} f(x) = 0$.
        rationale: |
          You confused continuity with differentiability. Continuity requires
          the limit and function value to agree. Differentiability is a
          stricter condition. Neither requires $f(c) = 0$.
      - text: $f(c)$ is positive, $\lim_{x \to c} f(x)$ is positive, and $f(c) > 0$.
        rationale: |
          You added a sign requirement that has nothing to do with continuity.
          A function can be continuous at $x = c$ even if $f(c)$ is negative
          or zero. The condition is that the limit equals $f(c)$.
      - text: $f(c)$ is defined, $f(x)$ is a polynomial, and $c \ne 0$.
        rationale: |
          You used the special property of polynomials as if it were the
          general definition. Polynomials are always continuous, but
          continuity is defined the same way for all functions, not just
          polynomials.
    explanation: |
      A function $f(x)$ is continuous at $x = c$ if and only if three conditions hold: 1) $f(c)$ is defined, 2) the limit $\lim_{x \to c} f(x)$ exists, and 3) the limit equals the function value $\lim_{x \to c} f(x) = f(c)$.

  - id: q-precalculus-basic-calculus-limits-and-continuity-0011
    type: direct-computation
    difficulty: hard
    stem: |
      Evaluate $\lim_{x \to 1} \frac{x^3 - 1}{x - 1}$.
    choices:
      - text: $3$
        correct: true
      - text: $1$
        rationale: |
          You returned the value $x$ approaches rather than evaluating the
          expression. After factoring $x^3 - 1 = (x-1)(x^2+x+1)$ and
          canceling, the limit is $1^2 + 1 + 1 = 3$.
      - text: $0$
        rationale: |
          You got $\dfrac{0}{0}$ and stopped. That form tells you to factor.
          Use the difference of cubes: $(x-1)(x^2+x+1)$, cancel $(x-1)$,
          and evaluate: $1 + 1 + 1 = 3$.
      - text: $2$
        rationale: |
          You applied the difference-of-squares formula $x^2 - 1 = (x-1)(x+1)$
          instead of the difference of cubes. After canceling you got $x + 1$,
          giving 2. The numerator is $x^3 - 1$, not $x^2 - 1$.
    explanation: |
      Direct substitution gives $\frac{0}{0}$. Factor the difference of cubes $x^3 - 1 = (x - 1)(x^2 + x + 1)$:
      $\lim_{x \to 1} \frac{(x-1)(x^2+x+1)}{x-1} = \lim_{x \to 1} (x^2 + x + 1) = 1^2 + 1 + 1 = 3$.

  - id: q-precalculus-basic-calculus-limits-and-continuity-0012
    type: direct-computation
    difficulty: hard
    stem: |
      Evaluate $\lim_{x \to \infty} \frac{4x^3 + 7x}{2x^4 - 3x^2 + 1}$.
    choices:
      - text: $0$
        correct: true
      - text: $2$
        rationale: |
          You took the ratio of the leading coefficients $4 \div 2 = 2$ as
          if the degrees were equal. The numerator has degree 3 and the
          denominator has degree 4. When the denominator's degree is higher,
          the limit is 0.
      - text: $\infty$
        rationale: |
          You saw $x^3$ growing in the numerator and assumed the fraction
          grows too. The denominator has $x^4$, which grows faster. When
          the denominator's degree exceeds the numerator's, the limit is 0.
      - text: $1$
        rationale: |
          You may have compared the highest-degree terms and applied the
          rule incorrectly. The degrees are 3 and 4. The denominator grows
          faster, so the fraction shrinks to 0.
    explanation: |
      The degree of the numerator (3) is strictly less than the degree of the denominator (4). As $x \to \infty$, the higher power in the denominator grows much faster, making the limit $0$.

  - id: q-precalculus-basic-calculus-limits-and-continuity-0013
    type: which-is-true
    difficulty: hard
    stem: |
      Consider the function $g(x) = \frac{|x - 2|}{x - 2}$. What type of discontinuity occurs at $x = 2$?
    choices:
      - text: Jump discontinuity, because the left-hand limit ($-1$) and right-hand limit ($1$) are not equal.
        correct: true
      - text: Removable discontinuity (hole), because the limit exists and equals 1.
        rationale: |
          You took the right-hand limit alone and called it the two-sided
          limit. For $x < 2$, $g(x) = -1$, so the left-hand limit is $-1$.
          The two-sided limit does not exist because the one-sided limits
          differ, so the discontinuity is not removable.
      - text: Infinite discontinuity, because the function approaches infinity as $x \to 2$.
        rationale: |
          You confused $g(x) = \dfrac{|x-2|}{x-2}$ with $\dfrac{1}{x-2}$.
          The numerator $|x - 2|$ and denominator $x - 2$ have the same
          magnitude, so $g(x)$ equals either $1$ or $-1$. It never goes
          to infinity.
      - text: No discontinuity, because absolute value functions are continuous everywhere.
        rationale: |
          You applied the continuity of $|x - 2|$ to the whole fraction.
          Dividing by $x - 2$ creates a problem at $x = 2$ where the
          denominator is zero. The function is not defined at $x = 2$.
    explanation: |
      For $x > 2$, $g(x) = \frac{x-2}{x-2} = 1$, so $\lim_{x \to 2^+} g(x) = 1$. For $x < 2$, $g(x) = \frac{-(x-2)}{x-2} = -1$, so $\lim_{x \to 2^-} g(x) = -1$. Since the left and right limits exist but differ, there is a jump discontinuity at $x = 2$.

  - id: q-precalculus-basic-calculus-limits-and-continuity-0014
    type: direct-computation
    difficulty: hard
    stem: |
      Find the value of the constant $k$ such that the function $f(x)$ is continuous at $x = 2$:
      $f(x) = \begin{cases} kx^2 & \text{if } x \le 2 \\ 3x + 2 & \text{if } x > 2 \end{cases}$
    choices:
      - text: $k = 2$
        correct: true
      - text: $k = 8$
        rationale: |
          You set $4k = 8$ correctly but skipped the division step, writing
          $k = 8$ instead of $k = 8 \div 4 = 2$.
      - text: $k = 4$
        rationale: |
          You forgot to square $x = 2$ in the left-hand rule. You solved
          $k(2) = 8$ instead of $k(2)^2 = 8$. The left-hand limit is
          $k(4) = 8$, giving $k = 2$.
      - text: $k = 1$
        rationale: |
          You set the two pieces equal at the wrong value. The right-hand
          limit at $x = 2$ is $3(2) + 2 = 8$, not 4. Setting $4k = 4$
          gives $k = 1$, which is not the correct equation.
    explanation: |
      For $f(x)$ to be continuous at $x = 2$, the left-hand limit and right-hand limit at $x = 2$ must be equal:
      $\lim_{x \to 2^-} f(x) = k(2)^2 = 4k$, and $\lim_{x \to 2^+} f(x) = 3(2) + 2 = 8$.
      Setting $4k = 8$ gives $k = 2$.
