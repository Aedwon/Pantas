meta:
  subject: mathematics
  topic: precalculus-basic-calculus
  subtopic: basic-derivatives
  exams: [upcat, acet, dlsucet, ustet, pupcet]
questions:
  - id: q-precalculus-basic-calculus-basic-derivatives-0001
    type: direct-computation
    difficulty: easy
    stem: |
      Find the derivative of $f(x) = x^4$ using the power rule.
    choices:
      - text: $4x^3$
        correct: true
      - text: $4x^4$
      - text: $3x^4$
      - text: $x^3$
    explanation: |
      Applying the power rule $\frac{d}{dx}[x^n] = n x^{n-1}$ with $n = 4$ yields $4x^{4-1} = 4x^3$.

  - id: q-precalculus-basic-calculus-basic-derivatives-0002
    type: direct-computation
    difficulty: easy
    stem: |
      Find the derivative of $f(x) = 5x^3 - 2x + 7$.
    choices:
      - text: $15x^2 - 2$
        correct: true
      - text: $15x^2 - 2x$
      - text: $15x^2 - 2 + 7$
      - text: $5x^2 - 2$
    explanation: |
      Differentiate term by term: $\frac{d}{dx}[5x^3] = 15x^2$, $\frac{d}{dx}[-2x] = -2$, and $\frac{d}{dx}[7] = 0$. Thus, $f'(x) = 15x^2 - 2$.

  - id: q-precalculus-basic-calculus-basic-derivatives-0003
    type: direct-computation
    difficulty: easy
    stem: |
      What is the derivative of the constant function $f(x) = 12$?
    choices:
      - text: $0$
        correct: true
      - text: $12$
      - text: $1$
      - text: $12x$
    explanation: |
      The rate of change of any constant function is zero, so $\frac{d}{dx}[c] = 0$ for any constant $c$.

  - id: q-precalculus-basic-calculus-basic-derivatives-0004
    type: direct-computation
    difficulty: easy
    stem: |
      Find the slope of the line tangent to the curve $y = 3x^2 + 4x$ at $x = 2$.
    choices:
      - text: $16$
        correct: true
      - text: $20$
      - text: $12$
      - text: $10$
    explanation: |
      First find the derivative $y' = \frac{d}{dx}[3x^2 + 4x] = 6x + 4$.
      Evaluate at $x = 2$: $y'(2) = 6(2) + 4 = 12 + 4 = 16$.

  - id: q-precalculus-basic-calculus-basic-derivatives-0005
    type: direct-computation
    difficulty: easy
    stem: |
      Find the derivative of $f(x) = 7x$.
    choices:
      - text: $7$
        correct: true
      - text: $7x$
      - text: $0$
      - text: $1$
    explanation: |
      Using the power rule on $7x^1$: $\frac{d}{dx}[7x^1] = 7 \cdot 1 \cdot x^{1-1} = 7 x^0 = 7$.

  - id: q-precalculus-basic-calculus-basic-derivatives-0006
    type: direct-computation
    difficulty: medium
    stem: |
      Rewrite $f(x) = \sqrt{x}$ as a power of $x$ and find its derivative $f'(x)$.
    choices:
      - text: $\frac{1}{2\sqrt{x}}$
        correct: true
      - text: $\frac{1}{\sqrt{x}}$
      - text: $\frac{1}{2}x^{1/2}$
      - text: $2\sqrt{x}$
    explanation: |
      Rewrite $\sqrt{x}$ as $x^{1/2}$. Apply power rule with $n = 1/2$:
      $f'(x) = \frac{1}{2} x^{(1/2) - 1} = \frac{1}{2} x^{-1/2} = \frac{1}{2\sqrt{x}}$.

  - id: q-precalculus-basic-calculus-basic-derivatives-0007
    type: direct-computation
    difficulty: medium
    stem: |
      Rewrite $f(x) = \frac{4}{x^2}$ using negative exponents and find its derivative.
    choices:
      - text: $-\frac{8}{x^3}$
        correct: true
      - text: $-\frac{8}{x}$
      - text: $\frac{8}{x^3}$
      - text: $-\frac{4}{x^3}$
    explanation: |
      Rewrite $\frac{4}{x^2}$ as $4x^{-2}$. Apply power rule:
      $f'(x) = 4(-2)x^{-2 - 1} = -8x^{-3} = -\frac{8}{x^3}$.

  - id: q-precalculus-basic-calculus-basic-derivatives-0008
    type: direct-computation
    difficulty: medium
    stem: |
      Find the $x$-coordinate of the point where the graph of $f(x) = x^2 - 6x + 5$ has a horizontal tangent line.
    choices:
      - text: $x = 3$
        correct: true
      - text: $x = 6$
      - text: $x = -3$
      - text: $x = 5$
    explanation: |
      A horizontal tangent line has slope equal to 0, so set $f'(x) = 0$.
      $f'(x) = 2x - 6 = 0 \implies 2x = 6 \implies x = 3$.

  - id: q-precalculus-basic-calculus-basic-derivatives-0009
    type: direct-computation
    difficulty: medium
    stem: |
      Find the derivative of $f(x) = \sqrt[3]{x}$.
    choices:
      - text: $\frac{1}{3\sqrt[3]{x^2}}$
        correct: true
      - text: $\frac{1}{3}x^{2/3}$
      - text: $3x^{2/3}$
      - text: $\frac{1}{\sqrt[3]{x^2}}$
    explanation: |
      Rewrite $\sqrt[3]{x}$ as $x^{1/3}$. Apply power rule:
      $f'(x) = \frac{1}{3} x^{(1/3) - 1} = \frac{1}{3} x^{-2/3} = \frac{1}{3\sqrt[3]{x^2}}$.

  - id: q-precalculus-basic-calculus-basic-derivatives-0010
    type: direct-computation
    difficulty: medium
    stem: |
      Find the derivative of $f(x) = 2x^4 - \frac{3}{x} + 5$.
    choices:
      - text: $8x^3 + \frac{3}{x^2}$
        correct: true
      - text: $8x^3 - \frac{3}{x^2}$
      - text: $8x^3 + \frac{3}{x}$
      - text: $6x^3 + \frac{3}{x^2}$
    explanation: |
      Rewrite $f(x) = 2x^4 - 3x^{-1} + 5$.
      Differentiate term by term: $\frac{d}{dx}[2x^4] = 8x^3$, $\frac{d}{dx}[-3x^{-1}] = -3(-1)x^{-2} = +3x^{-2} = \frac{3}{x^2}$, and $\frac{d}{dx}[5] = 0$.
      Result: $8x^3 + \frac{3}{x^2}$.

  - id: q-precalculus-basic-calculus-basic-derivatives-0011
    type: direct-computation
    difficulty: hard
    stem: |
      Find the slope of the tangent line to the curve $y = x^{3/2}$ at $x = 9$.
    choices:
      - text: $\frac{9}{2}$
        correct: true
      - text: $27$
      - text: $\frac{27}{2}$
      - text: $3$
    explanation: |
      Apply power rule: $y' = \frac{3}{2} x^{(3/2) - 1} = \frac{3}{2} x^{1/2} = \frac{3}{2}\sqrt{x}$.
      Substitute $x = 9$: $y'(9) = \frac{3}{2}\sqrt{9} = \frac{3}{2}(3) = \frac{9}{2} = 4.5$.

  - id: q-precalculus-basic-calculus-basic-derivatives-0012
    type: direct-computation
    difficulty: hard
    stem: |
      Find all $x$-coordinates where the function $f(x) = \frac{1}{3}x^3 - 4x + 2$ has horizontal tangent lines.
    choices:
      - text: $x = 2$ and $x = -2$
        correct: true
      - text: $x = 2$ only
      - text: $x = 4$ and $x = -4$
      - text: $x = 0$
    explanation: |
      Set $f'(x) = 0$: $f'(x) = \frac{d}{dx}\left[\frac{1}{3}x^3 - 4x + 2\right] = x^2 - 4$.
      Setting $x^2 - 4 = 0 \implies x^2 = 4 \implies x = 2$ or $x = -2$.

  - id: q-precalculus-basic-calculus-basic-derivatives-0013
    type: direct-computation
    difficulty: hard
    stem: |
      Find the derivative of $f(x) = (x^2 + 3)(x - 1)$ by first multiplying out the expression.
    choices:
      - text: $3x^2 - 2x + 3$
        correct: true
      - text: $2x$
      - text: $3x^2 - 2x$
      - text: $3x^2 + 2x - 3$
    explanation: |
      Expand the product first: $f(x) = x^3 - x^2 + 3x - 3$.
      Now apply power rule term by term: $f'(x) = 3x^2 - 2x + 3$. (Multiplying derivatives of factors directly $2x(1) = 2x$ is a common error).

  - id: q-precalculus-basic-calculus-basic-derivatives-0014
    type: direct-computation
    difficulty: hard
    stem: |
      Find the equation of the line tangent to $y = x^2 - 3x + 1$ at $x = 4$.
    choices:
      - text: $y = 5x - 15$
        correct: true
      - text: $y = 5x - 20$
      - text: $y = 8x - 15$
      - text: $y = 5x + 5$
    explanation: |
      At $x = 4$, $y = 4^2 - 3(4) + 1 = 16 - 12 + 1 = 5$, giving point $(4, 5)$.
      Slope: $y' = 2x - 3 \implies y'(4) = 2(4) - 3 = 5$.
      Using point-slope form $y - 5 = 5(x - 4) \implies y - 5 = 5x - 20 \implies y = 5x - 15$.
