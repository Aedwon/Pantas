meta:
  subject: 'mathematics'
  topic: 'precalculus-basic-calculus'
  subtopic: 'basic-derivatives'
  exams: ['upcat', 'acet', 'dlsucet', 'ustet', 'pupcet']
questions:
- id: 'q-precalculus-basic-calculus-basic-derivatives-0001'
  type: 'direct-computation'
  difficulty: 'easy'
  stem: |
    Find the derivative of $f(x) = x^4$ using the power rule.
  choices:
  - text: '$4x^3$'
    correct: true
  - text: '$4x^4$'
    rationale: |
      This keeps the exponent at four. The original power is still visible. Check that the exponent decreases by one.
  - text: '$3x^4$'
    rationale: |
      This uses the reduced exponent as the coefficient but keeps the original power. Both four and three occur in the rule. Check the coefficient and power separately.
  - text: '$x^3$'
    rationale: |
      This lowers the power without multiplying by the original exponent. The new exponent is correct. Check both parts of the power rule.
  explanation: |
    The power rule multiplies by the exponent and lowers it by one. Thus $f(x)=4x^{4-1}=4x^3$.
- id: 'q-precalculus-basic-calculus-basic-derivatives-0002'
  type: 'direct-computation'
  difficulty: 'easy'
  stem: |
    Find the derivative of $f(x) = 5x^3 - 2x + 7$.
  choices:
  - text: '$15x^2 - 2$'
    correct: true
  - text: '$15x^2 - 2x$'
    rationale: |
      This leaves the linear term unchanged. The cubic part is differentiated correctly. Differentiate every term.
  - text: '$15x^2 - 2 + 7$'
    rationale: |
      This keeps the constant seven in the derivative. Seven appears in the original function. Check that constants have zero rate of change.
  - text: '$5x^2 - 2$'
    rationale: |
      This omits the multiplier three from the cubic term. The new exponent is correct. Multiply by the original exponent.
  explanation: |
    Differentiate each term: $5x^3$ gives $15x^2$, $-2x$ gives $-2$, and the constant gives zero. Therefore $f'(x)=15x^2-2$.
- id: 'q-precalculus-basic-calculus-basic-derivatives-0003'
  type: 'direct-computation'
  difficulty: 'easy'
  stem: |
    What is the derivative of the constant function $f(x) = 12$?
  choices:
  - text: '$0$'
    correct: true
  - text: '$12$'
    rationale: |
      This reports the constant value as its rate of change. Twelve is the function value. Ask whether the output changes as x changes.
  - text: '$1$'
    rationale: |
      This applies the derivative of x to a constant. The derivative of x is a familiar one. Check whether x is in the function.
  - text: '$12x$'
    rationale: |
      This increases the power as in integration. Integration also changes powers. Check which operation the question requests.
  explanation: |
    The output stays at $12$ as x changes. Its rate of change is zero. Therefore $f'(x)=0$.
- id: 'q-precalculus-basic-calculus-basic-derivatives-0004'
  type: 'direct-computation'
  difficulty: 'easy'
  stem: |
    Find the slope of the line tangent to the curve $y = 3x^2 + 4x$ at $x = 2$.
  choices:
  - text: '$16$'
    correct: true
  - text: '$20$'
    rationale: |
      This evaluates the function value instead of its slope. The question names a point on the curve. Find the derivative before substituting.
  - text: '$12$'
    rationale: |
      This drops the derivative of the linear term. The squared term gives part of the slope. Differentiate both terms.
  - text: '$10$'
    rationale: |
      This forgets the factor two when differentiating the square. The constant part of the slope is kept. Include the original exponent as a multiplier.
  explanation: |
    The derivative is $y'=6x+4$. It gives the tangent slope. At $x=2$, the slope is $6(2)+4=16$.
- id: 'q-precalculus-basic-calculus-basic-derivatives-0005'
  type: 'direct-computation'
  difficulty: 'easy'
  stem: |
    Find the derivative of $f(x) = 7x$.
  choices:
  - text: '$7$'
    correct: true
  - text: '$7x$'
    rationale: |
      This reports the original expression. Seven x is printed in the stem. Apply the rule to the variable power.
  - text: '$0$'
    rationale: |
      This treats the variable expression as a constant. The coefficient itself is constant. Check whether x can change the output.
  - text: '$1$'
    rationale: |
      This drops the multiplier seven. The derivative of x is one. Keep constant factors when differentiating.
  explanation: |
    Write $7x=7x^1$. The power rule gives $7(1)x^0=7$.
- id: 'q-precalculus-basic-calculus-basic-derivatives-0006'
  type: 'direct-computation'
  difficulty: 'medium'
  stem: |
    For $x > 0$, rewrite $f(x) = \sqrt{x}$ as a power of $x$ and find its derivative $f'(x)$.
  choices:
  - text: '$\dfrac{1}{2\sqrt{x}}$'
    correct: true
  - text: '$\dfrac{1}{\sqrt{x}}$'
    rationale: |
      This omits the one-half multiplier. The new power is correct. Keep the original exponent as a multiplier.
  - text: '$\dfrac{1}{2}x^{1/2}$'
    rationale: |
      This keeps the exponent at one-half. The multiplier is correct. Subtract one from the exponent.
  - text: '$2\sqrt{x}$'
    rationale: |
      This uses the reciprocal exponent as the multiplier. The root has exponent one-half. Use the exponent itself, not its reciprocal.
  explanation: |
    Write $\sqrt{x}=x^{1/2}$. The power rule gives $\dfrac12x^{-1/2}=\dfrac1{2\sqrt{x}}$, for $x>0$.
- id: 'q-precalculus-basic-calculus-basic-derivatives-0007'
  type: 'direct-computation'
  difficulty: 'medium'
  stem: |
    Rewrite $f(x) = \dfrac{4}{x^2}$ using negative exponents and find its derivative.
  choices:
  - text: '$-\dfrac{8}{x^3}$'
    correct: true
  - text: '$-\dfrac{8}{x}$'
    rationale: |
      This raises the exponent from negative two to negative one. Negative exponents can seem to move toward zero. Subtract one even when the exponent is negative.
  - text: '$\dfrac{8}{x^3}$'
    rationale: |
      This drops the negative sign from the exponent multiplier. The magnitude is correct. Keep the sign of the original exponent.
  - text: '$-\dfrac{4}{x^3}$'
    rationale: |
      This uses negative one as the multiplier instead of negative two. The new exponent is correct. Use the original exponent as the multiplier.
  explanation: |
    For $x\ne0$, write $f(x)=4x^{-2}$. Its derivative is $4(-2)x^{-3}=-\dfrac8{x^3}$.
- id: 'q-precalculus-basic-calculus-basic-derivatives-0008'
  type: 'direct-computation'
  difficulty: 'medium'
  stem: |
    Find the $x$-coordinate of the point where the graph of $f(x) = x^2 - 6x + 5$ has a horizontal tangent line.
  choices:
  - text: '$x = 3$'
    correct: true
  - text: '$x = 6$'
    rationale: |
      This stops at two x equal to six. Six is a correct intermediate value. Finish dividing by the coefficient.
  - text: '$x = -3$'
    rationale: |
      This changes the sign incorrectly when moving the constant. The equation involves a negative constant. Check the solution in the derivative equation.
  - text: '$x = 5$'
    rationale: |
      This copies the constant term as the coordinate. Five appears in the original expression. Use the derivative, not a copied constant.
  explanation: |
    The derivative is $2x-6$. A horizontal tangent has slope zero, so $2x-6=0$. Add $6$ and divide by $2$ to get $x=3$.
- id: 'q-precalculus-basic-calculus-basic-derivatives-0009'
  type: 'direct-computation'
  difficulty: 'medium'
  stem: |
    For $x \ne 0$, find the derivative of $f(x) = \sqrt[3]{x}$.
  choices:
  - text: '$\dfrac{1}{3\sqrt[3]{x^2}}$'
    correct: true
  - text: '$\dfrac{1}{3}x^{2/3}$'
    rationale: |
      This makes the new exponent positive two-thirds. Two-thirds appears when subtracting fractions. Compute one-third minus one with a common denominator.
  - text: '$3x^{2/3}$'
    rationale: |
      This reverses the fraction and uses a positive new exponent. The cube root involves the number three. Check the multiplier and reduced exponent separately.
  - text: '$\dfrac{1}{\sqrt[3]{x^2}}$'
    rationale: |
      This leaves out the one-third multiplier. The new power is correct. Keep the original exponent multiplier.
  explanation: |
    Write $\sqrt[3]{x}=x^{1/3}$. The power rule gives $\dfrac13x^{-2/3}=\dfrac1{3\sqrt[3]{x^2}}$, for $x\ne0$.
- id: 'q-precalculus-basic-calculus-basic-derivatives-0010'
  type: 'direct-computation'
  difficulty: 'medium'
  stem: |
    Find the derivative of $f(x) = 2x^4 - \dfrac{3}{x} + 5$.
  choices:
  - text: '$8x^3 + \dfrac{3}{x^2}$'
    correct: true
  - text: '$8x^3 - \dfrac{3}{x^2}$'
    rationale: |
      This loses the second negative when differentiating the reciprocal. The original term is negative. Track both negative factors.
  - text: '$8x^3 + \dfrac{3}{x}$'
    rationale: |
      This keeps the reciprocal exponent unchanged. The coefficient is differentiated correctly. Reduce the exponent by one.
  - text: '$6x^3 + \dfrac{3}{x^2}$'
    rationale: |
      This multiplies the coefficient by the reduced exponent three. Three is the new exponent. Use the original exponent four.
  explanation: |
    For $x\ne0$, write $f(x)=2x^4-3x^{-1}+5$. Differentiate term by term: $8x^3+3x^{-2}$. Thus $f'(x)=8x^3+\dfrac3{x^2}$.
- id: 'q-precalculus-basic-calculus-basic-derivatives-0011'
  type: 'direct-computation'
  difficulty: 'hard'
  stem: |
    Find the slope of the tangent line to the curve $y = x^{3/2}$ at $x = 9$.
  choices:
  - text: '$\dfrac{9}{2}$'
    correct: true
  - text: '$27$'
    rationale: |
      This gives the curve height instead of its slope. The height is a valid value at the given point. Check whether a height or slope is requested.
  - text: '$\dfrac{27}{2}$'
    rationale: |
      This uses x instead of its square root after differentiation. Nine is the stated x value. Evaluate the reduced power.
  - text: '$3$'
    rationale: |
      This leaves out the three-halves multiplier. The square root is evaluated correctly. Keep every derivative factor.
  explanation: |
    The derivative is $\dfrac32x^{1/2}$. At $x=9$, $\sqrt9=3$. The slope is $\dfrac32(3)=\dfrac92$.
- id: 'q-precalculus-basic-calculus-basic-derivatives-0012'
  type: 'direct-computation'
  difficulty: 'hard'
  stem: |
    Find all $x$-coordinates where the function $f(x) = \dfrac{1}{3}x^3 - 4x + 2$ has horizontal tangent lines.
  choices:
  - text: '$x = 2$ and $x = -2$'
    correct: true
  - text: '$x = 2$ only'
    rationale: |
      This keeps only the positive root. Positive square roots are often used for lengths. Check both roots in the first derivative.
  - text: '$x = 4$ and $x = -4$'
    rationale: |
      This reports the squared values instead of the roots. Four appears in the equation. Take square roots of the equation.
  - text: '$x = 0$'
    rationale: |
      This sets the second derivative to zero. Both derivatives concern graph behavior. Set the first derivative to zero for horizontal tangents.
  explanation: |
    The derivative is $x^2-4$. Set it equal to zero: $x^2=4$. Both $x=2$ and $x=-2$ give horizontal tangents.
- id: 'q-precalculus-basic-calculus-basic-derivatives-0013'
  type: 'direct-computation'
  difficulty: 'hard'
  stem: |
    Find the derivative of $f(x) = (x^2 + 3)(x - 1)$ by first multiplying out the expression.
  choices:
  - text: '$3x^2 - 2x + 3$'
    correct: true
  - text: '$2x$'
    rationale: |
      This multiplies the derivatives of the two factors. Both factors must be differentiated. Expand first or use the two-term product rule.
  - text: '$3x^2 - 2x$'
    rationale: |
      This drops the derivative of the linear term. The higher-power terms are correct. Differentiate every expanded term.
  - text: '$3x^2 + 2x - 3$'
    rationale: |
      This reverses the signs of the square and linear terms. Both signs come from the original factors. Track signs through expansion and differentiation.
  explanation: |
    Multiplying gives $f(x)=x^3-x^2+3x-3$. Differentiate each term to get $f'(x)=3x^2-2x+3$.
- id: 'q-precalculus-basic-calculus-basic-derivatives-0014'
  type: 'direct-computation'
  difficulty: 'hard'
  stem: |
    Find the equation of the line tangent to $y = x^2 - 3x + 1$ at $x = 4$.
  choices:
  - text: '$y = 5x - 15$'
    correct: true
  - text: '$y = 5x - 20$'
    rationale: |
      This omits the point height in the line equation. Five times the x offset is part of the line equation. Substitute the given point in the proposed line.
  - text: '$y = 8x - 15$'
    rationale: |
      This omits the minus three from the slope and keeps an intercept from a different line. Eight comes from the squared term. Recompute the slope and check the line through the point.
  - text: '$y = 5x + 5$'
    rationale: |
      This treats the point height as the intercept. The point has y coordinate five. Account for both coordinates in the line equation.
  explanation: |
    At $x=4$, $y=16-12+1=5$. The derivative is $2x-3$, giving slope $5$. A line with this slope through $(4,5)$ has $y-5=5(x-4)$. Expanding gives $y=5x-15$.
- id: 'q-precalculus-basic-calculus-basic-derivatives-0015'
  type: 'error-spotting'
  difficulty: 'medium'
  stem: |
    A student differentiates $6x^5$ as $30x^5$. Which correction is needed?
  choices:
  - text: 'Lower the power to four.'
    correct: true
  - text: 'Keep the coefficient at six.'
    rationale: |
      This drops the exponent multiplier. Six is the original coefficient. Check that differentiation multiplies it by the original exponent.
  - text: 'Raise the power to six.'
    rationale: |
      This increases the exponent as in integration. Both operations change powers. Check which operation is requested.
  - text: 'Replace the power by zero.'
    rationale: |
      This treats every power as a constant. Constants do have zero derivative. Check whether the expression changes with x.
  explanation: |
    The power rule gives $6(5)x^{5-1}=30x^4$. The coefficient is already correct, and the exponent must be four.
  approved: false
- id: 'q-precalculus-basic-calculus-basic-derivatives-0016'
  type: 'which-is-true'
  difficulty: 'medium'
  stem: |
    For $f(x)=x^2$, which statement about its tangent at $x=-1$ is true?
  choices:
  - text: 'Its slope is negative.'
    correct: true
  - text: 'Its slope is positive.'
    rationale: |
      This uses the positive curve height to judge slope. The square is positive at negative one. Check the derivative value.
  - text: 'Its slope is zero.'
    rationale: |
      This assumes a square function always has a horizontal tangent. Its graph has a turning point. Check whether the named point is that turning point.
  - text: 'Its slope is undefined.'
    rationale: |
      This assumes negative x values are excluded. Some root functions restrict x. Check the domain of this polynomial.
  explanation: |
    The derivative is $f'(x)=2x$. At $x=-1$, it is $-2$. Thus the tangent slope is negative.
  approved: false
- id: 'q-precalculus-basic-calculus-basic-derivatives-0017'
  type: 'word-problem'
  difficulty: 'hard'
  stem: |
    A model gives the water volume in a tank as $V(t)=t^2+3t+10$ liters, where t is minutes after filling starts. What is the instantaneous filling rate at $t=2$ minutes?
  choices:
  - text: '7 liters per minute'
    correct: true
  - text: '20 liters per minute'
    rationale: |
      This reports the volume as a rate. Substituting into the volume model gives twenty. Check that rate comes from the derivative.
  - text: '4 liters per minute'
    rationale: |
      This omits the derivative of the linear term. Four comes from the squared term. Check every changing term.
  - text: '10 liters per minute'
    rationale: |
      This uses the initial volume as the filling rate. Ten is stated in the model. Check the difference between volume and rate.
  explanation: |
    The derivative gives the instantaneous rate: $V'(t)=2t+3$. At $t=2$, the rate is $2(2)+3=7$ liters per minute.
  approved: false
- id: 'q-precalculus-basic-calculus-basic-derivatives-0018'
  type: 'direct-computation'
  difficulty: 'hard'
  stem: |
    For $f(x)=x^3$, at which x-coordinates does the tangent have slope $12$?
  choices:
  - text: '$x=-2$ and $x=2$'
    correct: true
  - text: '$x=4$ only'
    rationale: |
      This stops at x squared equal to four. Four is a correct intermediate result. Check whether square roots remain.
  - text: '$x=2$ only'
    rationale: |
      This keeps only the positive root. Positive roots are common in length problems. Check the full real domain here.
  - text: '$x=-4$ and $x=4$'
    rationale: |
      This uses four as the root of four. Both signs are included. Square each candidate to check it.
  explanation: |
    The derivative is $3x^2$. Set $3x^2=12$, so $x^2=4$. Both $x=-2$ and $x=2$ give the requested slope.
  approved: false
- id: 'q-precalculus-basic-calculus-basic-derivatives-0019'
  type: 'which-is-true'
  difficulty: 'easy'
  stem: |
    The function $f(x)=3x-8$ has a tangent at every real x. Which statement describes its slope?
  choices:
  - text: 'It is always three.'
    correct: true
  - text: 'It is always negative eight.'
    rationale: |
      This uses the intercept as the slope. Both numbers describe the line. Check which number multiplies x.
  - text: 'It changes with x.'
    rationale: |
      This treats the changing output as a changing slope. The function values do vary. Check the constant derivative of a line.
  - text: 'It is always zero.'
    rationale: |
      This treats the entire function as constant. Its coefficients are fixed. Check that the variable term changes the output.
  explanation: |
    The derivative of $3x$ is $3$, and the derivative of $-8$ is zero. The slope is therefore $3$ for every x.
  approved: false
- id: 'q-precalculus-basic-calculus-basic-derivatives-0020'
  type: 'error-spotting'
  difficulty: 'exam'
  stem: |
    For $f(x)=x^4-2x^2$, a student finds $f'(x)=4x^3-4x$ and solves $x^2=1$ for horizontal tangents after dividing by x. Which value was lost?
  choices:
  - text: '$x=0$'
    correct: true
  - text: '$x=1$'
    rationale: |
      This reports a value already found from x squared equal to one. That value is a horizontal-tangent coordinate. Check which factor was divided away.
  - text: '$x=-1$'
    rationale: |
      This reports the other value already found. Both signs solve the reduced equation. Check the excluded divisor.
  - text: '$x=2$'
    rationale: |
      This copies a coefficient from the function. It appears in the original formula. Substitute it into the derivative to check.
  explanation: |
    Horizontal tangents satisfy $4x^3-4x=4x(x^2-1)=0$. The factor x gives $x=0$. Dividing by x without checking zero loses that solution.
  approved: false
