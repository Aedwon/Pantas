meta:
  subject: 'mathematics'
  topic: 'statistics-and-probability'
  subtopic: 'data-analysis-graphs'
  exams: ['upcat', 'acet', 'dlsucet', 'ustet', 'pupcet']
questions:
- id: 'q-statistics-and-probability-data-analysis-graphs-0001'
  type: 'word-problem'
  difficulty: 'easy'
  stem: |
    A jeepney driver in Pasig City recorded the total number of passengers served each day over five consecutive weekdays:
    
    | Day | Passengers |
    | :--- | :--- |
    | Monday | 140 |
    | Tuesday | 165 |
    | Wednesday | 150 |
    | Thursday | 180 |
    | Friday | 215 |
    
    What is the total number of passengers served from Monday through Wednesday?
  choices:
  - text: '$455$'
    correct: true
  - text: '$495$'
    rationale: |
      This substitutes Thursday for Wednesday. Both are weekday rows. Check the named date range.
  - text: '$850$'
    rationale: |
      This adds all five days. The full table is visible. Stop at Wednesday.
  - text: '$315$'
    rationale: |
      This adds Tuesday and Wednesday only. Those are within the range. Include Monday too.
  explanation: |
    Add the first three days: $140+165+150=455$ passengers.
- id: 'q-statistics-and-probability-data-analysis-graphs-0002'
  type: 'word-problem'
  difficulty: 'easy'
  stem: |
    A Senior High School in Quezon City recorded student enrollment across four academic strands:
    
    | Strand | Male Students | Female Students |
    | :--- | :--- | :--- |
    | STEM | 120 | 130 |
    | ABM | 90 | 110 |
    | HUMSS | 80 | 100 |
    | TVL | 110 | 60 |
    
    Which strand has the highest total student enrollment?
  choices:
  - text: 'STEM'
    correct: true
  - text: 'ABM'
    rationale: |
      This chooses the second-largest total. Its enrollment is substantial. Compare every combined total.
  - text: 'HUMSS'
    rationale: |
      This chooses the strand with one hundred females. That count is prominent. Add both columns before comparing.
  - text: 'TVL'
    rationale: |
      This follows a large male count alone. TVL has more males than two other strands. Compare total enrollment.
  explanation: |
    Add male and female counts for each strand. The totals are STEM $250$, ABM $200$, HUMSS $180$, and TVL $170$. STEM has the largest total.
- id: 'q-statistics-and-probability-data-analysis-graphs-0003'
  type: 'word-problem'
  difficulty: 'easy'
  stem: |
    A sari-sari store owner tracked the number of beverage units sold in one day:
    
    | Beverage | Units Sold |
    | :--- | :--- |
    | Bottled Water | 45 |
    | Soft Drinks | 30 |
    | Iced Tea | 25 |
    | Fruit Juice | 20 |
    
    What percentage of the total beverages sold were bottled water?
  choices:
  - text: '$37.5\%$'
    correct: true
  - text: '$45.0\%$'
    rationale: |
      This assumes a total of one hundred. Forty-five is the water count. Add the actual category counts.
  - text: '$33.3\%$'
    rationale: |
      This assigns an equal one-third share. Several categories are listed. Use their measured sales counts.
  - text: '$25.0\%$'
    rationale: |
      This uses the soft-drink count. Thirty is a valid row value. Match the requested beverage.
  explanation: |
    Total sales are $45+30+25+20=120$. Water accounts for $\dfrac{45}{120}(100\%)=37.5\%$.
- id: 'q-statistics-and-probability-data-analysis-graphs-0004'
  type: 'word-problem'
  difficulty: 'easy'
  stem: |
    A farmer in Nueva Ecija recorded palay harvest data (in metric tons) over four months:
    
    | Month | Harvest (Metric Tons) |
    | :--- | :--- |
    | January | 450 |
    | February | 520 |
    | March | 480 |
    | April | 600 |
    
    By how many metric tons did the palay harvest increase from March to April?
  choices:
  - text: '$120\text{ metric tons}$'
    correct: true
  - text: '$80\text{ metric tons}$'
    rationale: |
      This subtracts February from April. Eighty is that difference. Use March as the starting month.
  - text: '$150\text{ metric tons}$'
    rationale: |
      This subtracts January from April. Both are visible rows. Match the requested starting month.
  - text: '$480\text{ metric tons}$'
    rationale: |
      This reports the starting harvest. Four hundred eighty is March production. Subtract it from the ending value.
  explanation: |
    Subtract March from April: $600-480=120$ metric tons.
- id: 'q-statistics-and-probability-data-analysis-graphs-0005'
  type: 'word-problem'
  difficulty: 'easy'
  stem: |
    A local census recorded the age distribution of residents in Barangay San Jose:
    
    | Age Group (Years) | Population |
    | :--- | :--- |
    | $0-14$ | 850 |
    | $15-29$ | 1,200 |
    | $30-44$ | 950 |
    | $45-59$ | 600 |
    | $60+$ | 400 |
    
    How many residents in Barangay San Jose are at least $30$ years old?
  choices:
  - text: '$1,950$'
    correct: true
  - text: '$950$'
    rationale: |
      This counts only the thirty-to-forty-four group. It starts at the cutoff. Include all older groups.
  - text: '$2,050$'
    rationale: |
      This totals the under-thirty groups. The two youngest rows total 2050. Check the words at least thirty.
  - text: '$4,000$'
    rationale: |
      This reports the whole population. All rows total four thousand. Apply the age cutoff.
  explanation: |
    At least thirty includes the last three groups. Add $950+600+400=1950$ residents.
- id: 'q-statistics-and-probability-data-analysis-graphs-0006'
  type: 'word-problem'
  difficulty: 'medium'
  stem: |
    A household in Manila tracked its monthly electricity consumption (in kWh) for the second half of the year:
    
    | Month | Consumption (kWh) |
    | :--- | :--- |
    | July | 210 |
    | August | 240 |
    | September | 225 |
    | October | 195 |
    | November | 180 |
    | December | 270 |
    
    What was the average monthly electricity consumption (in kWh) from July to December?
  choices:
  - text: '$220\text{ kWh}$'
    correct: true
  - text: '$217.5\text{ kWh}$'
    rationale: |
      This uses the median. The sorted middle values are 210 and 225. Check that average here asks for the arithmetic mean.
  - text: '$225\text{ kWh}$'
    rationale: |
      This copies September consumption. It lies near the center of the data. Average all six months.
  - text: '$264\text{ kWh}$'
    rationale: |
      This divides the full total by five. Five weekdays are common in other tables. Count these six months.
  explanation: |
    The six-month total is $210+240+225+195+180+270=1320$ kWh. Divide by six: $1320\div6=220$ kWh.
- id: 'q-statistics-and-probability-data-analysis-graphs-0007'
  type: 'word-problem'
  difficulty: 'medium'
  stem: |
    A review center recorded the practice exam scores of $40$ students:
    
    | Score Range | Frequency ($f$) |
    | :--- | :--- |
    | $51-60$ | 4 |
    | $61-70$ | 10 |
    | $71-80$ | 16 |
    | $81-90$ | 7 |
    | $91-100$ | 3 |
    
    What percentage of the students scored greater than $70$?
  choices:
  - text: '$65\%$'
    correct: true
  - text: '$40\%$'
    rationale: |
      This counts only the seventy-one-to-eighty band. Sixteen of forty gives forty percent. Include higher bands.
  - text: '$57.5\%$'
    rationale: |
      This omits the highest band. The next two bands contribute twenty-three. Include all scores above seventy.
  - text: '$90\%$'
    rationale: |
      This includes scores above sixty. Thirty-six students meet that cutoff. Match the stated cutoff.
  explanation: |
    Above seventy includes $16+7+3=26$ students. Divide by forty and convert to percent: $\dfrac{26}{40}(100\%)=65\%$.
- id: 'q-statistics-and-probability-data-analysis-graphs-0008'
  type: 'word-problem'
  difficulty: 'medium'
  stem: |
    A survey gathered preferred commuting modes among workers in Makati City:
    
    | Transport Mode | Male Workers | Female Workers |
    | :--- | :--- | :--- |
    | MRT / LRT | 180 | 220 |
    | Bus / Jeepney | 150 | 150 |
    | Private Vehicle | 120 | 80 |
    | Walking / Bicycle | 50 | 50 |
    
    Among the female workers surveyed, what fraction prefers taking the MRT / LRT? Express in simplest fraction form.
  choices:
  - text: '$\dfrac{11}{25}$'
    correct: true
  - text: '$\dfrac{9}{25}$'
    rationale: |
      This uses the male MRT count with the female total. Both counts appear in that row. Keep the requested sex consistent.
  - text: '$\dfrac{11}{50}$'
    rationale: |
      This uses the total of both sexes. One thousand is the full sample. Restrict to female workers.
  - text: '$\dfrac{22}{40}$'
    rationale: |
      This conditions on MRT riders. Four hundred people prefer rail. Use all female workers as the denominator.
  explanation: |
    The female total is $220+150+80+50=500$. Of these, $220$ prefer MRT or LRT. The fraction is $\dfrac{220}{500}=\dfrac{11}{25}$.
- id: 'q-statistics-and-probability-data-analysis-graphs-0009'
  type: 'word-problem'
  difficulty: 'medium'
  stem: |
    Two agricultural exporters in Davao recorded coconut oil shipments (in thousand barrels) per quarter:
    
    | Quarter | Company A | Company B |
    | :--- | :--- | :--- |
    | Q1 | 40 | 60 |
    | Q2 | 55 | 50 |
    | Q3 | 65 | 45 |
    | Q4 | 80 | 65 |
    
    What is the ratio of Company A's total annual export to Company B's total annual export? Express as a simplified ratio $a : b$.
  choices:
  - text: '$12 : 11$'
    correct: true
  - text: '$11 : 12$'
    rationale: |
      This reverses the company order. Both annual totals are correct. Keep A before B.
  - text: '$13:9$'
    rationale: |
      This compares Q3 only. That quarter has a ratio thirteen to nine. Add all quarters.
  - text: '$10:11$'
    rationale: |
      This leaves out A first-quarter exports. Two hundred is A remaining total. Include every quarter for both companies.
  explanation: |
    The annual totals are $240$ for A and $220$ for B. Their ratio is $240:220$. Divide both terms by twenty to get $12:11$.
- id: 'q-statistics-and-probability-data-analysis-graphs-0010'
  type: 'word-problem'
  difficulty: 'medium'
  stem: |
    A fast-food chain in Cebu tracked daily sales of rice meal options:
    
    | Day | Chicken Rice | Pork Rice | Beef Rice |
    | :--- | :--- | :--- | :--- |
    | Monday | 80 | 50 | 30 |
    | Tuesday | 90 | 54 | 36 |
    | Wednesday | 85 | 55 | 40 |
    | Thursday | 100 | 70 | 50 |
    | Friday | 120 | 80 | 60 |
    
    On which day did Pork Rice sales account for exactly $30\%$ of the total rice meals sold that day?
  choices:
  - text: 'Tuesday'
    correct: true
  - text: 'Monday'
    rationale: |
      This rounds 31.25 percent to thirty. Monday is close to the target. Check the word exactly.
  - text: 'Wednesday'
    rationale: |
      This rounds about 30.56 percent to thirty. Wednesday is close. Use the exact daily fraction.
  - text: 'Friday'
    rationale: |
      This rounds about 30.77 percent to thirty. Friday is close. Check exact equality.
  explanation: |
    Tuesday has $90+54+36=180$ meals, of which $54$ are pork. Thus $\dfrac{54}{180}(100\%)=30\%$, exactly the requested share.
- id: 'q-statistics-and-probability-data-analysis-graphs-0011'
  type: 'word-problem'
  difficulty: 'medium'
  stem: |
    Three evacuation centers in Albay recorded evacuee counts during a typhoon:
    
    | Evacuation Center | Day 1 | Day 2 | Day 3 | Day 4 |
    | :--- | :--- | :--- | :--- | :--- |
    | Center A | 150 | 200 | 250 | 180 |
    | Center B | 100 | 130 | 150 | 120 |
    | Center C | 100 | 110 | 125 | 90 |
    
    By what percentage did the total number of evacuees across all three centers increase from Day 1 to Day 3?
  choices:
  - text: '$50\%$'
    correct: true
  - text: '$33.3\%$'
    rationale: |
      This divides the increase by the final total. Both totals are relevant. Use the starting total.
  - text: '$66.7\%$'
    rationale: |
      This compares Center A alone. Its increase is two-thirds. Combine all centers.
  - text: '$75\%$'
    rationale: |
      This compares Centers A and B but omits C. The larger centers are prominent. Include every center.
  explanation: |
    Day one total is $150+100+100=350$. Day three total is $250+150+125=525$. The increase is $175$, so $\dfrac{175}{350}(100\%)=50\%$.
- id: 'q-statistics-and-probability-data-analysis-graphs-0012'
  type: 'word-problem'
  difficulty: 'hard'
  stem: |
    A survey categorized the monthly household expenditures (in pesos) of $60$ families in a barangay:
    
    | Expenditure Range ($\text{₱}$) | Midpoint ($x$) | Number of Families ($f$) |
    | :--- | :--- | :--- |
    | $10,000 - 14,999$ | $\text{₱}12,500$ | 8 |
    | $15,000 - 19,999$ | $\text{₱}17,500$ | 15 |
    | $20,000 - 24,999$ | $\text{₱}22,500$ | 20 |
    | $25,000 - 29,999$ | $\text{₱}27,500$ | 12 |
    | $30,000 - 34,999$ | $\text{₱}32,500$ | 5 |
    
    Calculate the estimated mean monthly expenditure ($\bar{x}$) of the $60$ families using the class midpoints.
  choices:
  - text: '$\text{₱}21,750$'
    correct: true
  - text: '$\text{₱}22,500$'
    rationale: |
      This averages the midpoints without their frequencies. The midpoint list is symmetric. Weight each class by its family count.
  - text: '$\text{₱}20,500$'
    rationale: |
      This uses $2$ instead of $8$ in the first class product but still divides by $60$. Copying a frequency table can mix up an entry. Check each frequency against its own row.
  - text: '$\text{₱}26,100$'
    rationale: |
      This divides the weighted total by fifty instead of sixty. Fifty is a common sample size. Count all families.
  explanation: |
    Multiply each midpoint by its frequency: $100000+262500+450000+330000+162500=1305000$. Divide by the sixty families to get an estimated mean of $\text{₱}21,750$.
- id: 'q-statistics-and-probability-data-analysis-graphs-0013'
  type: 'word-problem'
  difficulty: 'hard'
  stem: |
    A mathematics instructor recorded student quiz results in a frequency table:
    
    | Quiz Score ($x$) | Frequency ($f$) |
    | :--- | :--- |
    | 10 | 3 |
    | 15 | $k$ |
    | 20 | 8 |
    | 25 | 4 |
    
    If the weighted mean score of the class is $18.25$, what is the value of the unknown frequency $k$?
  choices:
  - text: '$5$'
    correct: true
  - text: '$4$'
    rationale: |
      This copies the frequency $4$ from the score-$25$ row as the unknown count. That number is already printed in the table. Check which score the missing frequency belongs to.
  - text: '$6$'
    rationale: |
      This rounds $3.25$ down to $3$ in the final equation, then rounds $16.25/3$ up to $6$. A count must be a whole number, which makes rounding look useful. Check the exact equation before rounding any quantity.
  - text: '$7$'
    rationale: |
      This rounds the mean to $18$, then rounds the resulting count $20/3$ to $7$. Whole-number scores can make a rounded mean look suitable. Check that the calculation uses the stated mean $18.25$.
  explanation: |
    The score total is $10(3)+15k+20(8)+25(4)=290+15k$. The student count is $15+k$. Thus $290+15k=18.25(15+k)$. Rearranging gives $16.25=3.25k$, so $k=5$.
- id: 'q-statistics-and-probability-data-analysis-graphs-0014'
  type: 'word-problem'
  difficulty: 'hard'
  stem: |
    Palay production figures (in metric tons) for three regions in Luzon over three consecutive years are shown below:
    
    | Region | Year 1 | Year 2 | Year 3 |
    | :--- | :--- | :--- | :--- |
    | Region I (Ilocos) | 300,000 | 330,000 | 363,000 |
    | Region II (Cagayan Valley) | 500,000 | 550,000 | 577,500 |
    | Region III (Central Luzon) | 800,000 | 840,000 | 882,000 |
    
    Which region had the highest total percentage growth in palay production from Year 1 to Year 3?
  choices:
  - text: 'Region I'
    correct: true
  - text: 'Region III'
    rationale: |
      This uses the largest absolute increase. Region III rises by eighty-two thousand. Divide each change by its own starting value.
  - text: 'Region II'
    rationale: |
      This uses the larger starting production to judge growth. Region II starts above Region I. Compare percentages.
  - text: 'All three regions had equal percentage growth'
    rationale: |
      This assumes similar yearly patterns give equal growth. All regions rise each year. Compute each full-period rate.
  explanation: |
    The three growth rates are $\dfrac{63000}{300000}=21\%$, $\dfrac{77500}{500000}=15.5\%$, and $\dfrac{82000}{800000}=10.25\%$. Region I has the largest percentage growth.
- id: 'q-statistics-and-probability-data-analysis-graphs-0015'
  type: 'word-problem'
  difficulty: 'hard'
  stem: |
    Two CET review centers recorded the score distribution of $100$ mock exam takers each:
    
    | Score Range | Center X ($N=100$) | Center Y ($N=100$) |
    | :--- | :--- | :--- |
    | $50-59$ | 10 | 5 |
    | $60-69$ | 25 | 20 |
    | $70-79$ | 35 | 45 |
    | $80-89$ | 20 | 22 |
    | $90-99$ | 10 | 8 |
    
    If a score of $70$ or higher is considered passing, by how many students does Center Y exceed Center X in total passing students?
  choices:
  - text: '$10\text{ students}$'
    correct: true
  - text: '$5\text{ students}$'
    rationale: |
      This counts the nonpassing difference in only the lowest band. That band differs by five. Add all passing bands.
  - text: '$12\text{ students}$'
    rationale: |
      This leaves out the highest-score band. The two lower passing bands differ by twelve. Include every passing band.
  - text: '$2\text{ students}$'
    rationale: |
      This uses only the highest-score band difference and drops its sign. Eight and ten differ by two. Sum all passing bands before comparing.
  explanation: |
    Center X has $35+20+10=65$ passing students. Center Y has $45+22+8=75$. The difference is $75-65=10$ students.
- id: 'q-statistics-and-probability-data-analysis-graphs-0016'
  type: 'word-problem'
  difficulty: 'hard'
  stem: |
    A transportation survey categorized $500$ commuters in Metro Manila by age group and preferred public transit option:
    
    | Age Group | Traditional Jeepney | Modern Jeepney | Bus | Total |
    | :--- | :--- | :--- | :--- | :--- |
    | $18-30$ | 40 | 90 | 70 | 200 |
    | $31-50$ | 60 | 80 | 60 | 200 |
    | $51+$ | 70 | 20 | 10 | 100 |
    | Total | 170 | 190 | 140 | 500 |
    
    What percentage of commuters who prefer Modern Jeepneys belong to the $18-30$ age group?
    Round to the nearest tenth of a percent.
  choices:
  - text: '$47.4\%$'
    correct: true
  - text: '$45.0\%$'
    rationale: |
      This divides by all two hundred younger commuters. They include other vehicles. Restrict to modern-jeepney users.
  - text: '$18.0\%$'
    rationale: |
      This divides by all five hundred commuters. That is the table total. Use the condition in the question.
  - text: '$52.6\%$'
    rationale: |
      This counts modern-jeepney users from the other age groups. Those groups total one hundred. Match the requested age group.
  explanation: |
    Among the $190$ modern-jeepney users, $90$ are in the stated age group. Compute $\dfrac{90}{190}(100\%)\approx47.368\%$. Rounded to one decimal place, this is $47.4\%$.
- id: 'q-statistics-and-probability-data-analysis-graphs-0017'
  type: 'word-problem'
  difficulty: 'medium'
  stem: |
    A school budget pie chart assigns $72^\circ$ to transport. The total budget is P25000. What amount is allocated to transport?
  choices:
  - text: 'P5000'
    correct: true
  - text: 'P18000'
    rationale: |
      This treats seventy-two degrees as seventy-two percent. Both describe a sector. Divide its angle by 360 first.
  - text: 'P20000'
    rationale: |
      This reports the amount outside transport. The complement is eighty percent. Match the requested sector.
  - text: 'P250'
    rationale: |
      This treats the whole budget as a one-percent amount. Percent calculations involve one hundred. Use the sector fraction of the whole.
  explanation: |
    The sector fraction is $\dfrac{72}{360}=\dfrac15$. Multiply by P25000 to get P5000.
  approved: false
- id: 'q-statistics-and-probability-data-analysis-graphs-0018'
  type: 'which-is-true'
  difficulty: 'hard'
  stem: |
    A scatter plot of time and temperature forms a clear U-shaped curve. Which conclusion is justified?
  choices:
  - text: 'A nonlinear association is visible.'
    correct: true
  - text: 'The variables have no relationship.'
    rationale: |
      This equates lack of a straight trend with no relationship. The plot is not a straight line. Inspect the curved pattern.
  - text: 'Time has been proved to cause temperature changes.'
    rationale: |
      This turns association into causation. The pattern is clear. Check whether the study design establishes a cause.
  - text: 'The association is a straight upward trend.'
    rationale: |
      This focuses only on the right side of the U. That part rises. Inspect the entire pattern.
  explanation: |
    A U-shaped pattern changes direction. It shows a structured relationship that is curved rather than a single straight trend. Thus a nonlinear association is visible.
  approved: false
- id: 'q-statistics-and-probability-data-analysis-graphs-0019'
  type: 'error-spotting'
  difficulty: 'hard'
  stem: |
    A bar graph has baseline $90$ and bars ending at $100$ and $110$. A student says the second value is twice the first because the visible bar heights are $20$ and $10$. What is the actual ratio?
  choices:
  - text: '$1.1$'
    correct: true
  - text: '$2$'
    rationale: |
      This divides only the visible heights above ninety. Twenty is twice ten. Read the actual axis values.
  - text: '$10$'
    rationale: |
      This reports the value difference as the ratio. The endpoints differ by ten. Divide instead of subtracting.
  - text: '$0.5$'
    rationale: |
      This reverses the visible-height ratio. The drawn lengths suggest a factor two. Use actual endpoints in the requested order.
  explanation: |
    The actual values are $110$ and $100$. Their ratio is $\dfrac{110}{100}=1.1$. The nonzero baseline changes the visible lengths.
  approved: false
- id: 'q-statistics-and-probability-data-analysis-graphs-0020'
  type: 'which-is-true'
  difficulty: 'exam'
  stem: |
    A budget sector rises from $20\%$ to $30\%$ of the whole. Which statement describes the change?
  choices:
  - text: 'Up 10 percentage points and 50 percent.'
    correct: true
  - text: 'Up 10 percentage points and 10 percent.'
    rationale: |
      This treats percentage-point change as relative percent change. The shares differ by ten. Divide the difference by the original share.
  - text: 'Up 50 percentage points and 10 percent.'
    rationale: |
      This swaps the two kinds of comparison. Fifty is the relative increase. Keep their definitions separate.
  - text: 'Up 30 percentage points and 150 percent.'
    rationale: |
      This reports the final share and final-to-initial ratio as increases. Both are useful values. Subtract the starting amount first.
  explanation: |
    The difference is $30-20=10$ percentage points. Relative to the original share, the increase is $\dfrac{10}{20}(100\%)=50\%$.
  approved: false
