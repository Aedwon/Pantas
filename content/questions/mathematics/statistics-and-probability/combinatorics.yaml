meta:
  subject: 'mathematics'
  topic: 'statistics-and-probability'
  subtopic: 'combinatorics'
  exams: ['upcat', 'acet', 'dlsucet', 'ustet', 'pupcet']
questions:
- id: 'q-statistics-and-probability-combinatorics-0001'
  type: 'word-problem'
  difficulty: 'easy'
  stem: |
    A student canteen offers $4$ main dishes, $3$ types of drinks, and $2$ desserts. A meal combo consists of one main dish, one drink, and one dessert. The order of selecting items does not matter. How many different meal combos can a student order?
  choices:
  - text: '$24$'
    correct: true
  - text: '$9$'
    rationale: |
      This adds stage counts. Nine is their sum. Multiply choices that occur together.
  - text: '$12$'
    rationale: |
      This omits desserts. Twelve counts dishes and drinks. Include every stage.
  - text: '$36$'
    rationale: |
      This uses three dessert options. Three is the drink count. Keep category counts separate.
  explanation: |
    Multiply the three stages: $4(3)(2)=24$. Each main dish can pair with every drink and dessert.
- id: 'q-statistics-and-probability-combinatorics-0002'
  type: 'word-problem'
  difficulty: 'easy'
  stem: |
    Five distinct textbooks are to be arranged side by side on a bookshelf. The order of books on the shelf matters. In how many different ways can the five books be arranged?
  choices:
  - text: '$120$'
    correct: true
  - text: '$3125$'
    rationale: |
      This allows repeated books. Five choices appear available in each slot. Remove used books.
  - text: '$60$'
    rationale: |
      This halves all orders. Swaps may seem equivalent. Check that shelf order matters.
  - text: '$5$'
    rationale: |
      This counts one position. Five books are initially available. Count all positions.
  explanation: |
    Use each distinct book once. The five positions have $5,4,3,2,1$ choices. Multiply: $5!=120$.
- id: 'q-statistics-and-probability-combinatorics-0003'
  type: 'word-problem'
  difficulty: 'easy'
  stem: |
    A teacher wants to choose a delegation of $3$ students from a class of $8$ candidates to attend a science fair. The order of selection does not matter. How many different delegations can be formed?
  choices:
  - text: '$56$'
    correct: true
  - text: '$336$'
    rationale: |
      This orders the delegation. Sequential choices give 336. Remove orders of the same group.
  - text: '$24$'
    rationale: |
      This adds eight for each place. Three people are chosen. Count groups, not added slots.
  - text: '$512$'
    rationale: |
      This allows repeated students. Eight cubed counts independent picks. Require distinct people.
  explanation: |
    Order does not matter, so use $\binom83=\dfrac{8(7)(6)}{3(2)(1)}=56$. Dividing removes the six orders of each delegation.
- id: 'q-statistics-and-probability-combinatorics-0004'
  type: 'word-problem'
  difficulty: 'easy'
  stem: |
    In a running race with $7$ participants, prizes are awarded for 1st, 2nd, and 3rd place. The order of finish matters. In how many different ways can the three prizes be awarded?
  choices:
  - text: '$210$'
    correct: true
  - text: '$35$'
    rationale: |
      This ignores prize places. The same three runners are chosen. Keep ranks distinct.
  - text: '$5,040$'
    rationale: |
      This orders all runners. A race ranks seven people. Count only awarded places.
  - text: '$42$'
    rationale: |
      This counts only two places. Seven times six starts the calculation. Include third place.
  explanation: |
    The first, second, and third places have $7,6,5$ choices. Multiply: $7(6)(5)=210$.
- id: 'q-statistics-and-probability-combinatorics-0005'
  type: 'word-problem'
  difficulty: 'easy'
  stem: |
    A security lock requires a $4$-digit passcode using the digits $0$ through $9$. Digits may be repeated, and the order of digits in the passcode matters. How many distinct $4$-digit passcodes can be created?
  choices:
  - text: '$10,000$'
    correct: true
  - text: '$5,040$'
    rationale: |
      This forbids repetition. Many codes use distinct digits. Read the repetition rule.
  - text: '$6,561$'
    rationale: |
      This excludes zero in every slot. Nine digits then remain. Codes allow zero here.
  - text: '$40$'
    rationale: |
      This adds ten four times. Four slots are present. Multiply their choices.
  explanation: |
    Each of four positions has ten possible digits, including zero. Repetition is allowed, so the count is $10^4=10000$.
- id: 'q-statistics-and-probability-combinatorics-0006'
  type: 'word-problem'
  difficulty: 'medium'
  stem: |
    How many distinct arrangements of all the letters in the word BARANGAY can be formed? The order of letters in the arrangement matters.
  choices:
  - text: '$6,720$'
    correct: true
  - text: '$40,320$'
    rationale: |
      This treats A copies as distinct. Eight letters are present. Divide out identical-letter swaps.
  - text: '$20,160$'
    rationale: |
      This divides only by two. A pair needs one halving. Count all three A copies.
  - text: '$1,344$'
    rationale: |
      This also divides by five. Five other letters are present. Only identical-letter swaps are redundant.
  explanation: |
    There are eight letters, including three identical A copies. Divide $8!$ by $3!$ to remove swaps of those copies: $\dfrac{40320}{6}=6720$.
- id: 'q-statistics-and-probability-combinatorics-0007'
  type: 'word-problem'
  difficulty: 'medium'
  stem: |
    Six members of a student organization sit around a circular table to discuss a project. The order of seating relative to one another matters, but table rotations are considered identical. How many distinct seating arrangements are possible?
  choices:
  - text: '$120$'
    correct: true
  - text: '$720$'
    rationale: |
      This counts rotations separately. Six factorial counts a row. Fix one reference member.
  - text: '$360$'
    rationale: |
      This halves a row count. Reversal may seem equivalent. Remove all rotations instead.
  - text: '$30$'
    rationale: |
      This also removes reflections twice. Reversed circles look related. Only rotations are declared identical.
  explanation: |
    Fix one member as a reference to remove table rotations. The other five have $5!=120$ orders around that member.
- id: 'q-statistics-and-probability-combinatorics-0008'
  type: 'word-problem'
  difficulty: 'medium'
  stem: |
    A youth organization has ten members. Ana is already President. How many assignments of Vice-President and Secretary to two different remaining members are possible? The offices have distinct duties.
  choices:
  - text: '$72$'
    correct: true
  - text: '$36$'
    rationale: |
      This ignores offices. The same two members are chosen. Keep their roles distinct.
  - text: '$81$'
    rationale: |
      This lets one person hold both offices. Nine members seem available twice. Remove the first appointee.
  - text: '$18$'
    rationale: |
      This adds the counts. Two offices are present. Multiply sequential choices.
  explanation: |
    Nine members remain after Ana is appointed. Choose the Vice-President in nine ways and Secretary in eight ways. Multiply: $9(8)=72$.
- id: 'q-statistics-and-probability-combinatorics-0009'
  type: 'word-problem'
  difficulty: 'medium'
  stem: |
    A committee of $5$ members is to be formed from $6$ teachers and $5$ students. The committee must consist of exactly $3$ teachers and $2$ students. The order of selection within the committee does not matter. How many different committees can be formed?
  choices:
  - text: '$200$'
    correct: true
  - text: '$30$'
    rationale: |
      This adds the selection counts. Both groups are needed. Multiply paired selections.
  - text: '$462$'
    rationale: |
      This chooses any five people. Eleven candidates are present. Enforce the required split.
  - text: '$100$'
    rationale: |
      This halves the student combination again. Unordered pairs require halving once. Do not repeat that division.
  explanation: |
    Choose teachers in $\binom63=20$ ways and students in $\binom52=10$ ways. Pair the choices: $20(10)=200$.
- id: 'q-statistics-and-probability-combinatorics-0010'
  type: 'word-problem'
  difficulty: 'medium'
  stem: |
    At a barangay assembly, $12$ community leaders meet and each person shakes hands exactly once with every other person. The order of two people in a handshake does not matter. How many total handshakes occur?
  choices:
  - text: '$66$'
    correct: true
  - text: '$132$'
    rationale: |
      This counts each pair twice. Each leader has eleven partners. Divide by the two endpoints.
  - text: '$144$'
    rationale: |
      This includes self-pairs and orders pairs. Twelve squared counts independent picks. Exclude selves and reverse duplicates.
  - text: '$24$'
    rationale: |
      This adds two groups of twelve. A handshake has two people. Count distinct pairs.
  explanation: |
    Every handshake is one unordered pair. The count is $\binom{12}{2}=\dfrac{12(11)}2=66$.
- id: 'q-statistics-and-probability-combinatorics-0011'
  type: 'word-problem'
  difficulty: 'medium'
  stem: |
    Four boys and three girls are to be seated in a row of seven chairs. The order of seating matters. If all three girls must sit next to each other, in how many different ways can they be seated?
  choices:
  - text: '$720$'
    correct: true
  - text: '$120$'
    rationale: |
      This fixes the girls internal order. Five units have 120 orders. Allow their internal permutations.
  - text: '$5,040$'
    rationale: |
      This ignores adjacency. Seven factorial counts all rows. Keep the girls in one block.
  - text: '$144$'
    rationale: |
      This divides the valid count by five. There are five units. Their positions remain distinct.
  explanation: |
    Treat the girls as one block. Five units have $5!=120$ orders, and the girls have $3!=6$ orders inside their block. Multiply: $120(6)=720$.
- id: 'q-statistics-and-probability-combinatorics-0012'
  type: 'word-problem'
  difficulty: 'hard'
  stem: |
    A sports coach needs to select a team of $4$ players from a squad of $5$ seniors and $4$ juniors. The team must contain at least $3$ seniors. The order of selection does not matter. How many different teams can the coach select?
  choices:
  - text: '$45$'
    correct: true
  - text: '$40$'
    rationale: |
      This counts exactly three seniors. That meets the minimum. Include four seniors too.
  - text: '$126$'
    rationale: |
      This ignores the senior requirement. Nine choose four counts any team. Enforce the minimum.
  - text: '$1080$'
    rationale: |
      This orders the team. Four factorial counts member orders. No roles are assigned.
  explanation: |
    Three seniors and one junior give $\binom53\binom41=40$ teams. Four seniors give $\binom54=5$. Add the disjoint cases: $40+5=45$.
- id: 'q-statistics-and-probability-combinatorics-0013'
  type: 'word-problem'
  difficulty: 'hard'
  stem: |
    Eight committee members, including a mayor and a vice-mayor, sit around a circular table. The order of seating around the table matters, but table rotations are considered identical. If the mayor and vice-mayor must sit directly next to each other, how many distinct seating arrangements are possible?
  choices:
  - text: '$1,440$'
    correct: true
  - text: '$720$'
    rationale: |
      This fixes the officials internal order. Six factorial counts the units. Allow both internal orders.
  - text: '$5,040$'
    rationale: |
      This ignores adjacency. Seven factorial counts unrestricted circles. Keep the officials together.
  - text: '$10,080$'
    rationale: |
      This counts block units in a row. Seven factorial includes all starts. Remove rotations.
  explanation: |
    The officials form one block, leaving seven units around the table. Their circular orders number $6!=720$. Two internal official orders give $2(720)=1440$.
- id: 'q-statistics-and-probability-combinatorics-0014'
  type: 'word-problem'
  difficulty: 'hard'
  stem: |
    No person belongs to both groups. From a pool of $8$ singers and $6$ dancers, a talent show requires selecting $3$ singers and $2$ dancers. Once selected, these $5$ performers must be assigned to a specific sequence of $5$ solo slots on stage. The initial selection of performers has no order, but the assignment of performance slots matters. How many different performance sequences can be produced?
  choices:
  - text: '$100,800$'
    correct: true
  - text: '$840$'
    rationale: |
      This counts selections only. The selection product is 840. Include slot orders.
  - text: '$10,080$'
    rationale: |
      This uses twelve slot orders. The selection product is correct. Evaluate five factorial fully.
  - text: '$50,400$'
    rationale: |
      This removes reversed sequences. Reversal may seem symmetric. The slot order distinguishes them.
  explanation: |
    Choose singers in $\binom83=56$ ways and dancers in $\binom62=15$ ways. Order each selection in $5!=120$ ways. Multiply: $56(15)(120)=100800$.
- id: 'q-statistics-and-probability-combinatorics-0015'
  type: 'word-problem'
  difficulty: 'hard'
  stem: |
    Six different books (including a Math book and a Science book) are arranged in a row on a shelf. The order of books on the shelf matters. If the Math book and Science book must NOT be placed next to each other, how many valid arrangements are possible?
  choices:
  - text: '$480$'
    correct: true
  - text: '$240$'
    rationale: |
      This reports forbidden arrangements. The adjacency count is correct. Subtract it from all orders.
  - text: '$360$'
    rationale: |
      This halves all orders. Adjacency may seem equally likely. Count excluded block arrangements.
  - text: '$600$'
    rationale: |
      This counts only one adjacent-pair order. Five factorial counts the units. Allow both internal orders.
  explanation: |
    All six books have $6!=720$ orders. Adjacent Math and Science books give $5!$ block orders and two internal orders, totaling $240$. Subtract: $720-240=480$.
- id: 'q-statistics-and-probability-combinatorics-0016'
  type: 'word-problem'
  difficulty: 'hard'
  stem: |
    How many distinct $4$-digit even numbers can be formed using the digits $1, 2, 3, 5, 6, 8$ without repetition? The order of digits matters because it forms a numeric value.
  choices:
  - text: '$180$'
    correct: true
  - text: '$360$'
    rationale: |
      This permits odd last digits. All ordered four-digit selections number 360. Restrict the last slot.
  - text: '$120$'
    rationale: |
      This permits only two even last digits. Two and six are easy to notice. Include eight too.
  - text: '$216$'
    rationale: |
      This reuses the last digit in the first slot. Six digits were originally available. Remove the chosen last digit.
  explanation: |
    Choose the final even digit from $2,6,8$, giving three choices. The other positions have five, four, and three remaining choices. Multiply: $3(5)(4)(3)=180$.
- id: 'q-statistics-and-probability-combinatorics-0017'
  type: 'which-is-true'
  difficulty: 'easy'
  stem: |
    An unordered team includes all six of the six club members. How many different teams are possible?
  choices:
  - text: '$1$'
    correct: true
  - text: '$0$'
    rationale: |
      This sets zero factorial to zero. The formula includes zero factorial. Remember its defined value is one.
  - text: '$6$'
    rationale: |
      This counts members as teams. Six members are present. Count whole selections.
  - text: '$720$'
    rationale: |
      This orders the selected members. Six factorial counts arrangements. Check that the team has no roles.
  explanation: |
    There is only one set containing all members. The formula gives $\binom66=\dfrac{6!}{6!0!}=1$.
  approved: false
- id: 'q-statistics-and-probability-combinatorics-0018'
  type: 'word-problem'
  difficulty: 'medium'
  stem: |
    A customer buys exactly one item, either one of five sandwiches or one of three rice meals. How many purchases are possible?
  choices:
  - text: '$8$'
    correct: true
  - text: '$15$'
    rationale: |
      This buys one item from each category. Multiplication counts pairs. Check that exactly one item is bought.
  - text: '$5$'
    rationale: |
      This counts sandwiches only. Five options are available there. Include rice meals.
  - text: '$3$'
    rationale: |
      This counts rice meals only. Three options are available there. Include sandwiches.
  explanation: |
    The categories are alternatives. Add their counts: $5+3=8$.
  approved: false
- id: 'q-statistics-and-probability-combinatorics-0019'
  type: 'word-problem'
  difficulty: 'hard'
  stem: |
    A four-person unordered team is chosen from seven club members. Lia must be included. How many teams are possible?
  choices:
  - text: '$20$'
    correct: true
  - text: '$35$'
    rationale: |
      This ignores the required member. Seven choose four counts any team. Fix Lia first.
  - text: '$120$'
    rationale: |
      This orders the other three members. Six times five times four selects them sequentially. Remove order duplicates.
  - text: '$15$'
    rationale: |
      This chooses only two other members. Six choose two gives fifteen. Check the three remaining places.
  explanation: |
    With Lia fixed, choose three of the other six. The count is $\binom63=\dfrac{6(5)(4)}{3(2)(1)}=20$.
  approved: false
- id: 'q-statistics-and-probability-combinatorics-0020'
  type: 'error-spotting'
  difficulty: 'exam'
  stem: |
    A club chooses an unordered five-person team from eight members. A student counts excluded members as $8\cdot7\cdot6$. What is the correct team count?
  choices:
  - text: '$56$'
    correct: true
  - text: '$336$'
    rationale: |
      This orders the excluded members. Three exclusions determine a team. Their order does not change it.
  - text: '$6720$'
    rationale: |
      This orders the selected five. Five members are needed. Check that no roles are assigned.
  - text: '$24$'
    rationale: |
      This multiplies eight by three. Eight members and three exclusions are present. Count unordered groups.
  explanation: |
    Choose the three excluded members without order. Thus $\binom85=\binom83=\dfrac{8(7)(6)}{3(2)(1)}=56$.
  approved: false
