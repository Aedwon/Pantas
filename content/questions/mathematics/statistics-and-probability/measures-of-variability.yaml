meta:
  subject: 'mathematics'
  topic: 'statistics-and-probability'
  subtopic: 'measures-of-variability'
  exams: ['upcat', 'acet', 'dlsucet', 'ustet', 'pupcet']
questions:
- id: 'q-statistics-and-probability-measures-of-variability-0001'
  type: 'direct-computation'
  difficulty: 'easy'
  stem: |
    Find the range of the following set of examination scores: $68$, $75$, $82$, $90$, $94$, and $55$.
  choices:
  - text: '$39$'
    correct: true
  - text: '$40$'
    rationale: |
      This rounds the endpoint difference to forty. The scores are whole numbers near that difference. Subtract exactly.
  - text: '$77.3$'
    rationale: |
      This gives the mean rounded to one decimal place. It uses all scores. Check that range uses only extremes.
  - text: '$94$'
    rationale: |
      This reports the maximum. Ninety-four is the highest score. Subtract the minimum.
  explanation: |
    The largest score is $94$ and the smallest is $55$. The range is $94-55=39$.
- id: 'q-statistics-and-probability-measures-of-variability-0002'
  type: 'direct-computation'
  difficulty: 'easy'
  stem: |
    A hypothetical temperature record in degrees Celsius is $15,17,14,19,22,16,18$. The reading $22$ is corrected to $20$. What is the corrected range?
  choices:
  - text: '$6^\circ\text{C}$'
    correct: true
  - text: '$8^\circ\text{C}$'
    rationale: |
      This keeps the old maximum twenty-two. It was in the original record. Apply the correction first.
  - text: '$17^\circ\text{C}$'
    rationale: |
      This reports a central reading. Seventeen is in the data. Use the corrected extremes.
  - text: '$7^\circ\text{C}$'
    rationale: |
      This counts integer steps including both endpoints. Fourteen through twenty includes seven integers. Range is their difference, not their count.
  explanation: |
    After correction, the maximum is $20$ and the minimum is $14$. The corrected range is $20-14=6^\circ\text{C}$.
- id: 'q-statistics-and-probability-measures-of-variability-0003'
  type: 'direct-computation'
  difficulty: 'easy'
  stem: |
    Calculate the population variance ($\sigma^2$) of the dataset: $2$, $4$, $6$, $8$, and $10$.
  choices:
  - text: '$8$'
    correct: true
  - text: '$10$'
    rationale: |
      This uses the sample denominator four. The squared total is forty. Divide by five for this population.
  - text: '$2.83$'
    rationale: |
      This reports standard deviation rounded. Taking a root is a familiar final step. Stop at variance.
  - text: '$40$'
    rationale: |
      This reports the squared-deviation total. Forty is calculated correctly. Divide by the population count.
  explanation: |
    The mean is $6$. Squared deviations are $16,4,0,4,16$, totaling $40$. Population variance divides by five: $40\div5=8$.
- id: 'q-statistics-and-probability-measures-of-variability-0004'
  type: 'which-is-true'
  difficulty: 'easy'
  stem: |
    Which of the following statements regarding the range of a dataset is true?
  choices:
  - text: 'Maximum minus minimum.'
    correct: true
  - text: 'The range incorporates all data points and their respective frequencies.'
    rationale: |
      This describes a measure using every observation. Such measures exist. Range uses only two endpoints.
  - text: 'The range is completely unaffected by extreme outlier values.'
    rationale: |
      This assumes outliers do not change endpoints. Interior changes leave range fixed. Check whether the maximum or minimum changes.
  - text: 'The range can be negative if all numbers in the dataset are negative.'
    rationale: |
      This confuses negative values with a negative difference. Both extremes may be negative. Subtract minimum from maximum.
  explanation: |
    Range subtracts the minimum from the maximum. Only those two extreme values determine it.
- id: 'q-statistics-and-probability-measures-of-variability-0005'
  type: 'which-is-true'
  difficulty: 'easy'
  stem: |
    Which of the following best defines the population standard deviation of a dataset?
  choices:
  - text: 'The square root of population variance.'
    correct: true
  - text: 'It is the numerical difference between the highest score and the lowest score.'
    rationale: |
      This defines range. Extremes do describe spread. Check the mean-based squared-deviation definition.
  - text: 'It is the specific value that appears most frequently in a distribution.'
    rationale: |
      This defines mode. Frequent values can look typical. Check whether frequency or spread is requested.
  - text: 'It is the middle score when data values are arranged in numerical order.'
    rationale: |
      This defines median. Sorting finds a central value. Check whether center or spread is requested.
  explanation: |
    Population variance averages squared distances from the population mean. Its nonnegative square root is the population standard deviation. Taking that root returns the spread to the original measurement units.
- id: 'q-statistics-and-probability-measures-of-variability-0006'
  type: 'which-is-true'
  difficulty: 'easy'
  stem: |
    What is the exact mathematical relationship between sample variance ($s^2$) and sample standard deviation ($s$)?
  choices:
  - text: '$s=\sqrt{s^2}$, using the nonnegative root.'
    correct: true
  - text: 'Sample variance is the positive square root of sample standard deviation ($s^2 = \sqrt{s}$).'
    rationale: |
      This reverses the root relation. Both quantities involve squaring. Square SD or take the root of variance.
  - text: 'Sample standard deviation is always double the value of sample variance ($s = 2s^2$).'
    rationale: |
      This replaces a square root with doubling. Both change magnitudes. Use the defining square relation.
  - text: 'Sample variance and sample standard deviation are always numerically equal for all datasets.'
    rationale: |
      This assumes variance always equals SD. They coincide at zero and one. Check other variance values.
  explanation: |
    Sample variance is the square of sample standard deviation. Taking the nonnegative square root returns the standard deviation. The result can be zero when all values match.
- id: 'q-statistics-and-probability-measures-of-variability-0007'
  type: 'direct-computation'
  difficulty: 'medium'
  stem: |
    A sample of $5$ quiz scores is collected: $3$, $5$, $7$, $8$, and $12$. What is the sample variance ($s^2$)?
  choices:
  - text: '$11.5$'
    correct: true
  - text: '$9.2$'
    rationale: |
      This uses population denominator five. The numerator is correct. Use n minus one for a sample.
  - text: '$3.39$'
    rationale: |
      This reports the square root of the sample variance. That gives SD. Check the requested quantity.
  - text: '$46$'
    rationale: |
      This reports the squared-deviation total. It is a valid intermediate value. Divide by four.
  explanation: |
    The mean is $7$. Squared deviations are $16,4,0,1,25$, totaling $46$. Sample variance uses denominator $5-1=4$, so $s^2=46\div4=11.5$.
- id: 'q-statistics-and-probability-measures-of-variability-0008'
  type: 'direct-computation'
  difficulty: 'medium'
  stem: |
    A sample dataset of student test scores has a sample variance of $s^2 = 25$. If every score in the dataset is multiplied by $3$, what is the new sample standard deviation ($s_{\text{new}}$)?
  choices:
  - text: '$15$'
    correct: true
  - text: '$75$'
    rationale: |
      This scales variance by three and reports it as SD. Twenty-five is the given variance. Take its square root first.
  - text: '$225$'
    rationale: |
      This reports the new variance. Squared spread grows by nine. Take the root for SD.
  - text: '$5$'
    rationale: |
      This keeps the original SD. Five is its square root. Apply the factor three.
  explanation: |
    The original standard deviation is $\sqrt{25}=5$. Multiplying every score by three multiplies its standard deviation by three. Thus the new value is $15$.
- id: 'q-statistics-and-probability-measures-of-variability-0009'
  type: 'direct-computation'
  difficulty: 'medium'
  stem: |
    A student recorded $5$ quiz scores: $4$, $4$, $10$, $16$, and $16$. What is the sample standard deviation ($s$) of these quiz scores?
  choices:
  - text: '$6$'
    correct: true
  - text: '$36$'
    rationale: |
      This reports the variance. Thirty-six is a correct intermediate value. Take its square root.
  - text: '$5.37$'
    rationale: |
      This uses population denominator five. The squared total is correct. Use the sample denominator.
  - text: '$0$'
    rationale: |
      This averages raw deviations. They cancel to zero. Square before averaging.
  explanation: |
    The mean is $10$. Squared deviations total $36+36+0+36+36=144$. Divide by $5-1=4$ to get sample variance $36$. Its square root is $6$.
- id: 'q-statistics-and-probability-measures-of-variability-0010'
  type: 'which-is-true'
  difficulty: 'medium'
  stem: |
    Which of the following statements regarding measures of variability is true?
  choices:
  - text: 'Variance and standard deviation are nonnegative.'
    correct: true
  - text: 'Standard deviation is expressed in squared units of the original dataset measurements.'
    rationale: |
      This gives SD squared units. Variance does have squared units. Take the root to recover original units.
  - text: 'Range is more resistant to extreme outliers than standard deviation.'
    rationale: |
      This assumes extremes make range resistant. Only two values determine it. Check that an extreme change can alter range directly.
  - text: 'If all observations in a dataset are identical, the standard deviation is equal to the mean.'
    rationale: |
      This treats identical values as their own spread. The mean equals that common value. Check that deviations are all zero.
  explanation: |
    Variance uses squared deviations, all nonnegative, divided by a positive count. Standard deviation is its nonnegative square root. Neither quantity can be negative.
- id: 'q-statistics-and-probability-measures-of-variability-0011'
  type: 'which-is-true'
  difficulty: 'medium'
  stem: |
    A constant value $k = 5$ is added to every data point in a sample that has an initial standard deviation of $s = 4$. What is the standard deviation of the modified sample?
  choices:
  - text: '$4$'
    correct: true
  - text: '$9$'
    rationale: |
      This adds five to SD. The mean does shift by five. Check deviations from the shifted mean.
  - text: '$20$'
    rationale: |
      This multiplies SD by the added constant. Scaling would change SD. Distinguish adding from multiplying.
  - text: '$0$'
    rationale: |
      This assumes all deviations disappear after shifting. Every value moves equally. Check that their differences remain.
  explanation: |
    Adding five shifts every value and the mean by the same amount. The deviations stay unchanged. Thus the standard deviation stays four.
- id: 'q-statistics-and-probability-measures-of-variability-0012'
  type: 'which-is-true'
  difficulty: 'medium'
  stem: |
    Two jeepney routes in Manila have the same mean travel time of $30$ minutes. Route A has a travel time standard deviation of $3$ minutes, while Route B has a travel time standard deviation of $12$ minutes. Which statement accurately compares these two routes?
  choices:
  - text: 'Route A has more consistent times.'
    correct: true
  - text: 'Route B is more predictable and consistent than Route A because its travel times have greater spread.'
    rationale: |
      This treats greater spread as greater consistency. Twelve exceeds three. Lower SD means tighter clustering.
  - text: 'Passengers on Route A experience greater variability in travel times than passengers on Route B.'
    rationale: |
      This reverses the comparison. Both routes have the same mean. Compare their SD values.
  - text: 'The travel times on Route A vary four times more than the travel times on Route B.'
    rationale: |
      This reverses the factor-four ratio. Twelve is four times three. Check which route has larger spread.
  explanation: |
    Both routes have the same mean. Route A has the smaller standard deviation, three minutes instead of twelve. Its travel times are more tightly clustered around that mean.
- id: 'q-statistics-and-probability-measures-of-variability-0013'
  type: 'direct-computation'
  difficulty: 'hard'
  stem: |
    Two sections of Grade 11 students took the same quiz. The scores for each section are:
    
    - Section Red: $6$, $7$, $8$, $9$, $10$
    - Section Blue: $4$, $6$, $8$, $10$, $12$
    
    What is the ratio of the sample variance of Section Blue to the sample variance of Section Red ($\dfrac{s_{\text{Blue}}^2}{s_{\text{Red}}^2}$)?
  choices:
  - text: '$4$'
    correct: true
  - text: '$2$'
    rationale: |
      This uses the SD ratio. Blue deviations are twice Red deviations. Square that factor for variance.
  - text: '$1$'
    rationale: |
      This uses equal means to infer equal spread. Both means are eight. Compare squared deviations.
  - text: '$0.25$'
    rationale: |
      This reverses Blue and Red. One-quarter is the opposite ratio. Keep the requested order.
  explanation: |
    Both means are $8$. Red has squared-deviation total $10$, while Blue has total $40$. Both sample variances divide by four, so their ratio is $\dfrac{40}{10}=4$.
- id: 'q-statistics-and-probability-measures-of-variability-0014'
  type: 'direct-computation'
  difficulty: 'hard'
  stem: |
    A dataset consists of $5$ numbers listed in ascending order: $2$, $5$, $8$, $11$, and $x$. If the range of the dataset is $12$, what is the sample variance ($s^2$) of the dataset?
  choices:
  - text: '$22.5$'
    correct: true
  - text: '$18$'
    rationale: |
      This divides by five. Ninety is the correct squared total. Use the sample denominator four.
  - text: '$14$'
    rationale: |
      This reports x. Fourteen comes from the range. Finish the variance calculation.
  - text: '$4.74$'
    rationale: |
      This reports sample SD rounded. It is the root of 22.5. Check whether variance is requested.
  explanation: |
    The range gives $x-2=12$, so $x=14$. The mean is $8$. Squared deviations total $36+9+0+9+36=90$. Sample variance is $90\div4=22.5$.
- id: 'q-statistics-and-probability-measures-of-variability-0015'
  type: 'which-is-true'
  difficulty: 'hard'
  stem: |
    For a random sample of $n$ independent observations from a population with finite variance, why is $n - 1$ used instead of $n$ in the usual sample variance formula $s^2$?
  choices:
  - text: 'Dividing by $n - 1$ corrects the downward bias from estimating the population mean with the sample mean and makes $s^2$ an unbiased estimator of the population variance $\sigma^2$ (Bessel''s correction).'
    correct: true
  - text: 'Dividing by $n - 1$ guarantees that sample variance is strictly smaller than population variance.'
    rationale: |
      This assumes the denominator guarantees a smaller estimate. Variance comparisons depend on data. Check the average-bias purpose.
  - text: 'Dividing by $n - 1$ is required only when the sample mean is equal to zero.'
    rationale: |
      This restricts the correction to zero means. Deviations center around any sample mean. Check that the correction is about estimation.
  - text: 'Dividing by $n - 1$ eliminates measurement errors present in raw sample data.'
    rationale: |
      This confuses estimation bias with measurement error. Both affect accuracy. The denominator cannot repair recorded measurements.
  explanation: |
    The sample mean is fitted to the sample itself, which makes deviations smaller on average than deviations from the unknown population mean. Dividing their squared sum by $n$ would underestimate population variance on average. Dividing by $n-1$ corrects this bias under the stated random-sample assumptions.
- id: 'q-statistics-and-probability-measures-of-variability-0016'
  type: 'which-is-true'
  difficulty: 'hard'
  stem: |
    A dataset has a sample mean of $\bar{x} = 50$ and a sample standard deviation of $s = 10$. If every value in the dataset is multiplied by $2$ and then increased by $5$, what are the new sample mean ($\bar{x}_{\text{new}}$) and new sample standard deviation ($s_{\text{new}}$)?
  choices:
  - text: '$\bar{x}_{\text{new}} = 105$ and $s_{\text{new}} = 20$'
    correct: true
  - text: '$\bar{x}_{\text{new}} = 105$ and $s_{\text{new}} = 25$'
    rationale: |
      This adds five to SD after scaling. The mean receives that addition. SD depends on deviations, which shifts preserve.
  - text: '$\bar{x}_{\text{new}} = 100$ and $s_{\text{new}} = 20$'
    rationale: |
      This omits the added five from the mean. Scaling gives one hundred. Apply both steps.
  - text: '$\bar{x}_{\text{new}} = 105$ and $s_{\text{new}} = 10$'
    rationale: |
      This leaves SD unchanged under multiplication. Addition leaves it unchanged. Multiplication doubles it here.
  explanation: |
    The mean becomes $2(50)+5=105$. The standard deviation is multiplied by two and is unchanged by adding five. It becomes $2(10)=20$.
- id: 'q-statistics-and-probability-measures-of-variability-0017'
  type: 'direct-computation'
  difficulty: 'medium'
  stem: |
    A data set has standard deviation $3$. Every value is changed to $10-2x$. What is the new standard deviation?
  choices:
  - text: '$6$'
    correct: true
  - text: '$-6$'
    rationale: |
      This keeps the negative scaling sign in spread. Every deviation changes sign. Use the magnitude of the scale factor.
  - text: '$4$'
    rationale: |
      This adds the shift ten to negative six. The mean uses both terms. Check that shifts do not affect SD.
  - text: '$13$'
    rationale: |
      This adds ten to the old SD. Ten is the shift. Apply only the scale magnitude to SD.
  explanation: |
    The multiplier is $-2$, whose magnitude is $2$. The added ten shifts values without changing spread. The new SD is $2(3)=6$.
  approved: false
- id: 'q-statistics-and-probability-measures-of-variability-0018'
  type: 'which-is-true'
  difficulty: 'hard'
  stem: |
    The data sets $0,0,10,10$ and $0,5,5,10$ have the same range and mean. Which has the larger population variance?
  choices:
  - text: 'The first set.'
    correct: true
  - text: 'The second set.'
    rationale: |
      This treats central values as increasing spread. Two observations are at the mean. Compare their deviations.
  - text: 'They have equal variance.'
    rationale: |
      This infers all spread from range. Both ranges are ten. Check interior values too.
  - text: 'Neither has variance.'
    rationale: |
      This treats repeated values as preventing variance. Repetition is allowed. Compute squared deviations normally.
  explanation: |
    Both means are $5$. The squared-deviation totals are $100$ for the first set and $50$ for the second. Both divide by four, so the first has larger variance.
  approved: false
- id: 'q-statistics-and-probability-measures-of-variability-0019'
  type: 'which-is-true'
  difficulty: 'exam'
  stem: |
    Two groups have the same mean and standard deviation. What can be determined about which group has more observations exactly at its mean?
  choices:
  - text: 'Neither count can be determined.'
    correct: true
  - text: 'Both counts must match.'
    rationale: |
      This assumes two summary measures fix all frequencies. The groups share center and spread. Check that different distributions can share those summaries.
  - text: 'Both groups have no such observations.'
    rationale: |
      This assumes spread excludes the mean. Values may equal the mean even with positive SD. Check the actual frequencies.
  - text: 'Every observation equals the mean.'
    rationale: |
      This assumes matching SD means zero SD. Both groups have the same SD. Check its value and the data.
  explanation: |
    Mean and standard deviation do not specify the full distribution. Different frequencies can produce the same two measures. The count at the mean needs more information.
  approved: false
- id: 'q-statistics-and-probability-measures-of-variability-0020'
  type: 'error-spotting'
  difficulty: 'easy'
  stem: |
    A student finds zero when averaging the raw deviations of $2,4,6$ from their mean and concludes the data have no spread. Which correction is needed?
  choices:
  - text: 'Square deviations before averaging.'
    correct: true
  - text: 'Use the largest value as the mean.'
    rationale: |
      This changes the reference incorrectly. Six is an extreme value. Compute the actual mean first.
  - text: 'Delete negative deviations.'
    rationale: |
      This removes half the spread information. Negative deviations can cancel positive ones. Keep all values and square them.
  - text: 'Make all observations equal to four.'
    rationale: |
      This changes the data to fit the conclusion. Four is the mean. Measure the original observations.
  explanation: |
    The mean is $4$, so deviations are $-2,0,2$. Their squares are $4,0,4$, with a positive average. Squaring prevents sign cancellation and shows nonzero spread.
  approved: false
