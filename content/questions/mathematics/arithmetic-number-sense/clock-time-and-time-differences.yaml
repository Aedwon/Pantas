meta:
  subject: mathematics
  topic: arithmetic-number-sense
  subtopic: clock-time-and-time-differences
  exams: [pshs-nce]
questions:
  - id: q-arithmetic-number-sense-clock-time-and-time-differences-0001
    lesson: lesson-arithmetic-number-sense-reading-clock-time
    keyPoint: 1
    type: direct-computation
    difficulty: easy
    stem: |
      Which 24-hour time is the same as 7:35 pm?
    choices:
      - text: '19:35'
        correct: true
      - text: '07:35'
        rationale: |
          This keeps the morning hour for an evening time. The clock face shows seven in both cases. Check that a pm hour other than twelve needs twelve added.
      - text: '18:35'
        rationale: |
          This adds eleven to the hour. Counting noon as the first added hour can cause this slip. Check that the hour increases by twelve.
      - text: '19:23'
        rationale: |
          This subtracts twelve from the minutes while changing the hour. Both parts of the time may seem to need changing. Check that the minutes stay the same.
      - text: '20:35'
        rationale: |
          This adds thirteen to the hour. Counting both the starting and ending hour can add an extra hour. Check the sum of seven and twelve.
    explanation: |
      For a pm time after the noon hour, add $12$ to the hour: $7+12=19$. Keep the $35$ minutes. The time is 19:35.

  - id: q-arithmetic-number-sense-clock-time-and-time-differences-0002
    lesson: lesson-arithmetic-number-sense-reading-clock-time
    keyPoint: 1
    type: direct-computation
    difficulty: easy
    stem: |
      A message arrives at 00:40. What is this time in 12-hour form?
    choices:
      - text: '12:40 am'
        correct: true
      - text: '12:40 pm'
        rationale: |
          This treats the zero hour as noon. Both noon and midnight use twelve on a twelve-hour clock. Check that zero begins the day at midnight.
      - text: '00:40 am'
        rationale: |
          This keeps hour zero and adds am. Adding a label can seem enough to change the format. Check that a twelve-hour clock uses twelve for the midnight hour.
      - text: '11:40 pm'
        rationale: |
          This uses the hour just before midnight. Late-night times are close together on the clock. Check that forty minutes have already passed since midnight.
      - text: '01:40 am'
        rationale: |
          This starts the day with hour one. A twelve-hour clock starts counting labels at one. Check that the first hour after midnight is labeled twelve.
    explanation: |
      In 24-hour time, hour $00$ is the midnight hour. Change it to $12$ and use am. The minutes stay $40$, so the time is 12:40 am.

  - id: q-arithmetic-number-sense-clock-time-and-time-differences-0003
    lesson: lesson-arithmetic-number-sense-reading-clock-time
    keyPoint: 1
    type: direct-computation
    difficulty: easy
    stem: |
      A school lunch begins at 12:15 pm. How is this written in 24-hour time?
    choices:
      - text: '00:15'
        rationale: |
          This changes the noon hour to zero. The midnight hour does change to zero. Check the pm label.
      - text: '12:15'
        correct: true
      - text: '24:15'
        rationale: |
          This adds twelve to the noon hour. Most pm hours do need twelve added. Check the special rule for hour twelve.
      - text: '13:15'
        rationale: |
          This counts noon as hour thirteen. The next hour after noon is thirteen. Check that only fifteen minutes have passed since noon.
      - text: '11:15'
        rationale: |
          This subtracts one hour when changing the format. Counting labels from zero can suggest a shift. Check that changing formats keeps the same moment.
    explanation: |
      Noon is 12:00 in 24-hour time. During the noon hour, keep the hour $12$. Thus 12:15 pm is 12:15.

  - id: q-arithmetic-number-sense-clock-time-and-time-differences-0004
    lesson: lesson-arithmetic-number-sense-reading-clock-time
    keyPoint: 1
    type: direct-computation
    difficulty: easy
    stem: |
      A bus ticket gives the departure time as 16:08. What is the departure time in 12-hour form?
    choices:
      - text: '04:08 pm'
        correct: true
      - text: '04:08 am'
        rationale: |
          This subtracts twelve but uses am. The smaller hour can look like a morning time. Check that sixteen is after noon.
      - text: '06:08 pm'
        rationale: |
          This removes ten from the hour. Removing the first digit can seem like a shortcut. Check that the conversion subtracts twelve.
      - text: '05:08 pm'
        rationale: |
          This subtracts eleven from the hour. Counting noon as one can cause this result. Check the difference between sixteen and twelve.
      - text: '04:20 pm'
        rationale: |
          This changes the minutes by twelve too. Both parts of the time may seem to need a change. Check that converting formats leaves the minutes unchanged.
    explanation: |
      Hour $16$ is after noon, so use pm. Subtract $12$ from the hour: $16-12=4$. The departure time is 4:08 pm.

  - id: q-arithmetic-number-sense-clock-time-and-time-differences-0005
    lesson: lesson-arithmetic-number-sense-finding-elapsed-time
    keyPoint: 1
    type: word-problem
    difficulty: easy
    stem: |
      A student reads from 9:12 am to 9:47 am on the same day. How long does the student read?
    choices:
      - text: '35 minutes'
        correct: true
      - text: '59 minutes'
        rationale: |
          This adds the two minute readings. Both readings are parts of the same hour. Check that elapsed time uses their difference.
      - text: '47 minutes'
        rationale: |
          This reports the ending minutes alone. Those minutes count from nine o'clock. Check that reading started twelve minutes after nine.
      - text: '12 minutes'
        rationale: |
          This reports the starting minutes alone. That number appears next to the starting hour. Check the gap from the start to the end.
      - text: '25 minutes'
        rationale: |
          This reduces the tens digit even though no borrowing is needed. Borrowing is part of some subtraction problems. Check that seven is already greater than two.
    explanation: |
      Both times are in the same hour. Subtract the minutes: $47-12=35$. The student reads for $35$ minutes.

  - id: q-arithmetic-number-sense-clock-time-and-time-differences-0006
    lesson: lesson-arithmetic-number-sense-finding-elapsed-time
    keyPoint: 1
    type: word-problem
    difficulty: medium
    stem: |
      A class activity starts at 10:48 am and ends at 12:16 pm that day. How long does it last?
    choices:
      - text: '1 h 28 min'
        correct: true
      - text: '2 h 28 min'
        rationale: |
          This borrows sixty minutes but keeps the original ending hour. The minute difference then looks right. Check that borrowing also reduces the hour by one.
      - text: '1 h 68 min'
        rationale: |
          This borrows one hundred minutes. Written subtraction often uses groups of ten. Check that an hour has sixty minutes.
      - text: '2 h 32 min'
        rationale: |
          This subtracts the hour labels and takes the positive gap between the minute labels. Both gaps look easy to find. Check by adding the proposed duration to the start.
      - text: '1 h 12 min'
        rationale: |
          This counts to eleven and then counts one whole hour. Those are the first two parts of counting forward. Check the final sixteen minutes after noon.
    explanation: |
      From 10:48 am to 11:00 am is $12$ minutes. From 11:00 am to noon is $1$ hour. Add the last $16$ minutes: $12+16=28$. The activity lasts $1$ hour $28$ minutes.

  - id: q-arithmetic-number-sense-clock-time-and-time-differences-0007
    lesson: lesson-arithmetic-number-sense-finding-elapsed-time
    keyPoint: 1
    type: direct-computation
    difficulty: medium
    stem: |
      How much time passes from 14:52 to 17:09 on the same day?
    choices:
      - text: '2 h 17 min'
        correct: true
      - text: '3 h 17 min'
        rationale: |
          This adds sixty to the ending minutes without reducing the ending hour. The minute subtraction works. Check that one hour was used for the borrowing.
      - text: '2 h 57 min'
        rationale: |
          This borrows one hundred minutes. That follows ordinary base-ten subtraction. Check that clock hours contain sixty minutes.
      - text: '3 h 43 min'
        rationale: |
          This subtracts the hours and reverses the minute subtraction. Using the larger minute reading first avoids a negative result. Check the whole duration by adding it to 14:52.
      - text: '2 h 09 min'
        rationale: |
          This counts from 15:00 and drops the first eight minutes. Starting at an exact hour is convenient. Check the interval from 14:52 to 15:00.
    explanation: |
      Borrow $1$ hour from $17$ hours. Then $17$ hours $9$ minutes becomes $16$ hours $69$ minutes. Subtract: $69-52=17$ minutes and $16-14=2$ hours. The elapsed time is $2$ hours $17$ minutes.

  - id: q-arithmetic-number-sense-clock-time-and-time-differences-0008
    lesson: lesson-arithmetic-number-sense-elapsed-time-across-midnight
    keyPoint: 1
    type: word-problem
    difficulty: medium
    stem: |
      A ferry leaves at 11:25 pm on Monday and arrives at 2:10 am on Tuesday. How long is the trip?
    choices:
      - text: '2 h 45 min'
        correct: true
      - text: '3 h 45 min'
        rationale: |
          This borrows sixty minutes without reducing the hour count. The minutes come out correctly. Check the hour used in borrowing.
      - text: '2 h 85 min'
        rationale: |
          This borrows one hundred minutes. It resembles subtraction of ordinary numbers. Check that the borrowed hour is sixty minutes.
      - text: '3 h 15 min'
        rationale: |
          This uses three hours between the hour labels and adds the absolute minute difference. The two separate differences look reasonable. Check by counting through midnight.
      - text: '2 h 10 min'
        rationale: |
          This starts counting at midnight. Midnight is an easy starting point. Check the part of the trip before midnight.
    explanation: |
      From 11:25 pm to midnight is $35$ minutes. From midnight to 2:00 am is $2$ hours. Add the last $10$ minutes: $35+10=45$. The trip lasts $2$ hours $45$ minutes.

  - id: q-arithmetic-number-sense-clock-time-and-time-differences-0009
    lesson: lesson-arithmetic-number-sense-adding-a-duration
    keyPoint: 1
    type: word-problem
    difficulty: medium
    stem: |
      A workshop begins at 10:35 am and lasts 2 hours 45 minutes. At what time does it end that day?
    choices:
      - text: '01:20 pm'
        correct: true
      - text: '12:20 pm'
        rationale: |
          This drops the extra hour from the minutes. Adding the hours alone reaches twelve. Check that eighty minutes contains a whole hour.
      - text: '01:20 am'
        rationale: |
          This gives the correct clock numbers but uses am. The hour wraps from twelve to one. Check that crossing noon changes am to pm.
      - text: '12:80 pm'
        rationale: |
          This leaves eighty minutes on the clock. It is the direct sum of the minute readings. Check that clock minutes stop at fifty-nine.
      - text: '01:10 pm'
        rationale: |
          This treats seventy minutes as an hour. Both hour and minute totals need regrouping. Check that one hour is sixty minutes.
    explanation: |
      Add the minutes: $35+45=80$, or $1$ hour $20$ minutes. Add the hours and the carried hour: $10+2+1=13$. The ending time is 13:20, or 1:20 pm.

  - id: q-arithmetic-number-sense-clock-time-and-time-differences-0010
    lesson: lesson-arithmetic-number-sense-adding-a-duration
    keyPoint: 1
    type: word-problem
    difficulty: medium
    stem: |
      A night bus leaves at 22:50 on Friday. Its trip lasts 3 hours 25 minutes. When does it arrive?
    choices:
      - text: '02:15 Saturday'
        correct: true
      - text: '01:15 Saturday'
        rationale: |
          This forgets the hour carried from the minutes. Adding twenty-two and three gives twenty-five. Check the seventy-five-minute total.
      - text: '02:15 Friday'
        rationale: |
          This resets the hour after twenty-four but keeps the day. The clock numbers are right. Check which day follows Friday at midnight.
      - text: '02:15 Sunday'
        rationale: |
          This advances two days. Both the carried hour and the midnight crossing may seem to need a new day. Check that only one midnight passes.
      - text: '01:75 Saturday'
        rationale: |
          This keeps the minute total without regrouping. The hours and minutes were added separately. Check that seventy-five minutes is one hour fifteen minutes.
    explanation: |
      The minutes total $50+25=75$, or $1$ hour $15$ minutes. The hours total $22+3+1=26$. Subtract $24$ and move to Saturday. The bus arrives at 02:15 Saturday.

  - id: q-arithmetic-number-sense-clock-time-and-time-differences-0011
    lesson: lesson-arithmetic-number-sense-using-time-zone-offsets
    keyPoint: 1
    type: word-problem
    difficulty: medium
    stem: |
      Town B is 3 hours ahead of Town A. It is 9:40 am in Town A. What time is it in Town B at that moment?
    choices:
      - text: '12:40 pm'
        correct: true
      - text: '06:40 am'
        rationale: |
          This subtracts the offset. The word difference can suggest subtraction. Check that Town B is ahead.
      - text: '12:40 am'
        rationale: |
          This adds three hours but keeps am at twelve. The hour label twelve appears twice each day. Check that the clock has reached noon.
      - text: '09:43 am'
        rationale: |
          This adds the offset to the minutes. Three is added to the last clock number. Check that the given offset is in hours.
      - text: '01:40 pm'
        rationale: |
          This adds an extra hour when passing noon. Noon may be counted as an added step. Check by counting three hour changes from 9:40 am.
    explanation: |
      Town B is ahead, so add $3$ hours. Starting at 9:40 am, three hours later is 12:40 pm. The minutes stay $40$.

  - id: q-arithmetic-number-sense-clock-time-and-time-differences-0012
    lesson: lesson-arithmetic-number-sense-using-time-zone-offsets
    keyPoint: 1
    type: word-problem
    difficulty: medium
    stem: |
      Town D is 4 hours 30 minutes behind Town C. It is 6:50 pm in Town C. What time is it in Town D at the same moment?
    choices:
      - text: '02:20 pm'
        correct: true
      - text: '11:20 pm'
        rationale: |
          This adds the offset. A time difference can require addition in other questions. Check that the requested town is behind.
      - text: '02:50 pm'
        rationale: |
          This subtracts only the four hours. The whole-hour part is easy to see. Check the extra thirty minutes in the offset.
      - text: '02:20 am'
        rationale: |
          This subtracts correctly but changes pm to am. Subtracting several hours can cross noon in some problems. Check that the result is still after noon.
      - text: '01:20 pm'
        rationale: |
          This reduces the hour for borrowing even though no borrowing is needed. Borrowing is common in time subtraction. Check that fifty minutes is enough to subtract thirty.
    explanation: |
      Change 6:50 pm to 18:50. Town D is behind, so subtract the offset. The minutes give $50-30=20$. The hours give $18-4=14$. Thus Town D shows 14:20, or 2:20 pm.

  - id: q-arithmetic-number-sense-clock-time-and-time-differences-0013
    lesson: lesson-arithmetic-number-sense-finding-elapsed-time
    keyPoint: 1
    type: error-spotting
    difficulty: hard
    stem: |
      A student finds the time from 08:46 to 11:18 on the same day as follows.
      
      Step 1: Write the end as 11 hours 18 minutes.
      Step 2: Borrow 1 hour to get 10 hours 118 minutes.
      Step 3: Subtract to get 2 hours 72 minutes.
      Step 4: Change this to 3 hours 12 minutes.
      
      Which step is the first wrong one?
    choices:
      - text: 'Step 2'
        correct: true
      - text: 'Step 1'
        rationale: |
          This rejects writing the ending time in hours and minutes. That looks different from clock notation. Check that both forms name the same time.
      - text: 'Step 3'
        rationale: |
          This notices the unusual minute result first. Seventy-two minutes does need regrouping. Check whether the borrowed amount was already wrong in the previous step.
      - text: 'Step 4'
        rationale: |
          This blames the final regrouping. It changes both the hours and minutes. Check that seventy-two minutes really is one hour twelve minutes.
      - text: 'No step is wrong.'
        rationale: |
          This accepts borrowing one hundred minutes. That is familiar from decimal subtraction. Check how many minutes one hour supplies.
    explanation: |
      An hour supplies $60$ minutes. Step 2 should give $10$ hours $78$ minutes. Then $78-46=32$ minutes and $10-8=2$ hours. The elapsed time is $2$ hours $32$ minutes.

  - id: q-arithmetic-number-sense-clock-time-and-time-differences-0014
    lesson: lesson-arithmetic-number-sense-adding-a-duration
    keyPoint: 1
    type: word-problem
    difficulty: hard
    stem: |
      A school program begins at 9:45 am. The first session lasts 1 hour 35 minutes. After a 20-minute break, the second session lasts 1 hour 50 minutes. At what time does the second session end?
    choices:
      - text: '01:30 pm'
        correct: true
      - text: '01:10 pm'
        rationale: |
          This omits the break. The two sessions are the main events named. Check that the break also uses time.
      - text: '12:30 pm'
        rationale: |
          This drops one hour while regrouping the total minutes. There are several minute parts to combine. Check how many groups of sixty they make.
      - text: '02:30 pm'
        rationale: |
          This carries one extra hour from the minutes. The minute parts together exceed one hundred. Check the number of complete sixty-minute groups.
      - text: '01:50 pm'
        rationale: |
          This counts the break twice. A break can be added between sessions and again to their total. Check that only one twenty-minute break is stated.
    explanation: |
      The durations total $1+1=2$ hours and $35+20+50=105$ minutes. Since $105$ minutes is $1$ hour $45$ minutes, the program lasts $3$ hours $45$ minutes. From 9:45 am, add $3$ hours to get 12:45 pm. Add $45$ minutes to reach 1:30 pm.

  - id: q-arithmetic-number-sense-clock-time-and-time-differences-0015
    lesson: lesson-arithmetic-number-sense-using-time-zone-offsets
    keyPoint: 1
    type: word-problem
    difficulty: hard
    stem: |
      Town F is 5 hours 40 minutes ahead of Town E. It is 9:35 pm on Wednesday in Town E. What time and day is it in Town F?
    choices:
      - text: '03:15 Thursday'
        correct: true
      - text: '15:55 Wednesday'
        rationale: |
          This subtracts the offset. Subtracting can seem natural for a time difference. Check that Town F is ahead.
      - text: '02:15 Thursday'
        rationale: |
          This drops the hour carried from the minutes. The minute sum is seventy-five. Check its complete group of sixty.
      - text: '03:15 Wednesday'
        rationale: |
          This gives the right clock time but keeps the starting day. Reducing the hour can hide the midnight crossing. Check the day after Wednesday.
      - text: '03:15 Tuesday'
        rationale: |
          This moves the day backward. Offsets can cross midnight in either direction. Check that adding time moves the day forward.
    explanation: |
      Use 21:35 for the start. Add $40$ minutes to get 22:15. Add $5$ hours to get $27$ hours $15$ minutes. Subtract $24$ and move forward one day. Town F shows 03:15 Thursday.

  - id: q-arithmetic-number-sense-clock-time-and-time-differences-0016
    lesson: lesson-arithmetic-number-sense-using-time-zone-offsets
    keyPoint: 1
    type: word-problem
    difficulty: hard
    stem: |
      Town H is 6 hours 35 minutes behind Town G. It is 4:10 am on Monday in Town G. What time and day is it in Town H?
    choices:
      - text: '21:35 Sunday'
        correct: true
      - text: '10:45 Monday'
        rationale: |
          This adds the offset. The numbers can be added without borrowing. Check that Town H is behind.
      - text: '21:35 Monday'
        rationale: |
          This finds the clock numbers but keeps Monday. Subtracting the offset crosses midnight. Check the previous day.
      - text: '22:35 Sunday'
        rationale: |
          This borrows sixty minutes but keeps the hour before borrowing. The minute result is correct. Check that borrowing reduces the hours by one.
      - text: '21:35 Tuesday'
        rationale: |
          This moves the day forward during subtraction. Midnight crossings do change the day. Check which direction the clock moves.
    explanation: |
      Subtract $4$ hours $10$ minutes to reach midnight at the start of Monday. The offset still has $2$ hours $25$ minutes left. Moving back that far from midnight gives 21:35 Sunday. Check: adding $6$ hours $35$ minutes returns to 4:10 am Monday.

  - id: q-arithmetic-number-sense-clock-time-and-time-differences-0017
    lesson: lesson-arithmetic-number-sense-finding-elapsed-time
    keyPoint: 1
    type: word-problem
    difficulty: exam
    stem: |
      A school team leaves for a regional contest at 7:54 am and reaches the venue at 3:21 pm that day. How long is the journey?
    choices:
      - text: '7 h 27 min'
        correct: true
      - text: '8 h 27 min'
        rationale: |
          This borrows sixty minutes without reducing the ending hour. The minute result looks correct. Check which hour paid for the borrowed minutes.
      - text: '7 h 67 min'
        rationale: |
          This borrows one hundred minutes. That matches ordinary written subtraction. Check that an hour has sixty minutes.
      - text: '8 h 33 min'
        rationale: |
          This subtracts hour labels and uses the positive gap between the minutes. Each subtraction is easy on its own. Check by adding the result to the departure time.
      - text: '4 h 33 min'
        rationale: |
          This subtracts the twelve-hour labels without using pm. The hour seven is larger than three. Check that the ending time is 15:21.
    explanation: |
      From 7:54 am to 8:00 am is $6$ minutes. From 8:00 am to 3:00 pm is $7$ hours. Add $21$ more minutes to reach 3:21 pm. The journey lasts $7$ hours $27$ minutes.

  - id: q-arithmetic-number-sense-clock-time-and-time-differences-0018
    lesson: lesson-arithmetic-number-sense-using-time-zone-offsets
    keyPoint: 1
    type: word-problem
    difficulty: exam
    stem: |
      At the same moment, Town J is 8 hours 45 minutes behind Town K. When it is 10:20 pm in Town K, what time is it in Town J?
    choices:
      - text: '01:35 pm'
        correct: true
      - text: '07:05 am'
        rationale: |
          This adds the offset and crosses into the next day. Some offset questions require addition. Check that the requested town is behind.
      - text: '02:35 pm'
        rationale: |
          This borrows sixty minutes without reducing the hour. The minute result is right. Check that the borrowed hour is removed before subtracting hours.
      - text: '01:75 pm'
        rationale: |
          This borrows one hundred minutes. That follows decimal subtraction. Check that one clock hour contains sixty minutes.
      - text: '02:25 pm'
        rationale: |
          This subtracts the hours and reverses the minute subtraction. The ending minute value is smaller than forty-five. Check by adding the full offset back to the answer.
    explanation: |
      Use 22:20 for 10:20 pm. Borrow $1$ hour to get $21$ hours $80$ minutes. Subtract $8$ hours $45$ minutes: $21-8=13$ and $80-45=35$. Town J shows 13:35, or 1:35 pm.

  - id: q-arithmetic-number-sense-clock-time-and-time-differences-0019
    lesson: lesson-arithmetic-number-sense-using-time-zone-offsets
    keyPoint: 1
    type: word-problem
    difficulty: exam
    stem: |
      Town M is 7 hours 30 minutes ahead of Town L. At the same moment, Town M shows 2:15 am on Saturday. What time and day does Town L show?
    choices:
      - text: '18:45 Friday'
        correct: true
      - text: '09:45 Saturday'
        rationale: |
          This adds the offset because the statement says ahead. Town M is the place ahead. Check that the question asks for Town L.
      - text: '18:45 Saturday'
        rationale: |
          This subtracts correctly but keeps the given day. The answer clock has an evening hour. Check that subtracting from early Saturday reaches Friday.
      - text: '19:45 Friday'
        rationale: |
          This borrows sixty minutes without reducing the hours. The minutes then give forty-five. Check the hour used for borrowing.
      - text: '18:45 Sunday'
        rationale: |
          This advances the day while subtracting. A midnight crossing requires a day change. Check that Town L is earlier, so its day moves back.
    explanation: |
      Town L is behind Town M, so subtract $7$ hours $30$ minutes. From 2:15 am Saturday, move back $2$ hours $15$ minutes to midnight. There are $5$ hours $15$ minutes left to subtract. This gives 18:45 Friday.

  - id: q-arithmetic-number-sense-clock-time-and-time-differences-0020
    lesson: lesson-arithmetic-number-sense-adding-a-duration
    keyPoint: 1
    type: word-problem
    difficulty: exam
    stem: |
      A laboratory timer starts at 11:48 pm on Thursday and runs for 2 hours 37 minutes. At what time and on what day does it stop?
    choices:
      - text: '02:25 Friday'
        correct: true
      - text: '01:25 Friday'
        rationale: |
          This drops the hour carried from the minutes. Adding eleven and two alone gives one after wrapping. Check the eighty-five-minute total.
      - text: '02:25 Thursday'
        rationale: |
          This finds the right clock time but keeps Thursday. The hour has passed midnight. Check the day that follows Thursday.
      - text: '02:25 Saturday'
        rationale: |
          This changes the day twice. Both the minute carry and the midnight crossing affect the hours. Check that the timer passes midnight only once.
      - text: '01:85 Friday'
        rationale: |
          This leaves the minute sum on the clock. Eighty-five is the direct sum of forty-eight and thirty-seven. Check that sixty of those minutes make another hour.
    explanation: |
      Change the start to 23:48 Thursday. Add the minutes: $48+37=85$, or $1$ hour $25$ minutes. Add the hours: $23+2+1=26$. Subtract $24$ and move to Friday. The timer stops at 02:25 Friday.

  - id: q-arithmetic-number-sense-clock-time-and-time-differences-0021
    lesson: lesson-arithmetic-number-sense-elapsed-time-across-midnight
    keyPoint: 1
    type: word-problem
    difficulty: exam
    stem: |
      A station log shows that a power outage began at 21:48 on Friday and ended at 03:16 on Saturday. How long did the outage last?
    choices:
      - text: '5 h 28 min'
        correct: true
      - text: '6 h 28 min'
        rationale: |
          The minute difference is right after borrowing. But borrowing uses up one hour. Cross out the old hour before you subtract.
      - text: '6 h 32 min'
        rationale: |
          The hour labels are six hours apart. Taking $16$ from $48$ gives a positive minute count, but the end time has fewer minutes. Borrow an hour before subtracting.
      - text: '18 h 32 min'
        rationale: |
