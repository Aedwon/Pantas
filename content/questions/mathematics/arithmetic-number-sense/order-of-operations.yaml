meta:
  subject: mathematics
  topic: arithmetic-number-sense
  subtopic: order-of-operations
  exams: [upcat, acet, dlsucet, ustet, pupcet, cse-pro, cse-sub]
questions:
  - id: q-arithmetic-number-sense-order-of-operations-0001
    type: direct-computation
    difficulty: easy
    stem: |
      What is the value of $18 \div 3 \times 2$?
    choices:
      - text: "$12$"
        correct: true
      - text: "$3$"
        rationale: |
          You multiplied 3 by 2 first (6) and then divided 18 by 6, violating left-to-right evaluation.
      - text: "$8$"
        rationale: |
          You added 6 and 2 or miscalculated the operation.
      - text: "$6$"
        rationale: |
          You stopped after calculating 18 divided by 3 and forgot to multiply by 2.
    explanation: |
      To evaluate $18 \div 3 \times 2$, follow the PEMDAS/GEMDAS rules:

      1. Multiplication and division have equal priority, so evaluate them from left to right.
      2. Perform the division first: $18 \div 3 = 6$.
      3. Perform the multiplication next: $6 \times 2 = 12$.

      Common Trap: Multiplying $3 \times 2 = 6$ first gives $18 \div 6 = 3$, which violates the left-to-right rule.

  - id: q-arithmetic-number-sense-order-of-operations-0002
    type: direct-computation
    difficulty: easy
    stem: |
      What is the value of $15 - 5 + 4$?
    choices:
      - text: "$14$"
        correct: true
      - text: "$6$"
        rationale: |
          You added 5 + 4 = 9 first and then subtracted 9 from 15, violating left-to-right evaluation.
      - text: "$24$"
        rationale: |
          You added 15 + 5 + 4 instead of subtracting 5.
      - text: "$10$"
        rationale: |
          You stopped after evaluating 15 minus 5 and forgot to add 4.
    explanation: |
      To evaluate $15 - 5 + 4$, follow the order of operations:

      1. Addition and subtraction have equal priority and must be evaluated from left to right.
      2. Perform subtraction first: $15 - 5 = 10$.
      3. Perform addition next: $10 + 4 = 14$.

      Common Trap: Adding $5 + 4 = 9$ first gives $15 - 9 = 6$, which violates the left-to-right rule.

  - id: q-arithmetic-number-sense-order-of-operations-0003
    type: direct-computation
    difficulty: easy
    stem: |
      What is the value of $-4^2 + (-3)^2$?
    choices:
      - text: "$-7$"
        correct: true
      - text: "$25$"
        rationale: |
          You squared -4 as (-4)^2 = 16, getting 16 + 9 = 25.
      - text: "$-25$"
        rationale: |
          You applied negative signs to both squared terms (-16 - 9 = -25).
      - text: "$7$"
        rationale: |
          You miscalculated -16 + 9 as positive 7 instead of -7.
    explanation: |
      Evaluate each exponent term separately:

      1. For $-4^2$, the exponent applies only to the base $4$, not the negative sign:
         $$-4^2 = -(4 \times 4) = -16$$
      2. For $(-3)^2$, the parentheses include the negative sign, so square $-3$:
         $$(-3)^2 = (-3) \times (-3) = 9$$
      3. Add the two results together:
         $$-16 + 9 = -7$$

      Common Trap: Confusing $-4^2$ with $(-4)^2 = 16$ leads to $16 + 9 = 25$, which is incorrect.

  - id: q-arithmetic-number-sense-order-of-operations-0004
    type: direct-computation
    difficulty: easy
    stem: |
      What is the value of $4 \times (8 - 3)^2$?
    choices:
      - text: "$100$"
        correct: true
      - text: "$400$"
        rationale: |
          You multiplied 4 by 5 (20) before applying the exponent, getting 20 squared = 400.
      - text: "$220$"
        rationale: |
          You evaluated 4 times 8 (32) and squared 3 (9) or miscalculated the steps.
      - text: "$40$"
        rationale: |
          You multiplied 4 by 5 (20) and then multiplied by 2 instead of squaring 5.
    explanation: |
      Follow PEMDAS/GEMDAS step by step:

      1. Evaluate inside the parentheses first:
         $$8 - 3 = 5$$
      2. Evaluate the exponent next:
         $$5^2 = 25$$
      3. Perform the multiplication:
         $$4 \times 25 = 100$$

      Common Trap: Multiplying $4 \times 5 = 20$ before applying the exponent gives $20^2 = 400$, which violates the rule that exponents precede multiplication.

  - id: q-arithmetic-number-sense-order-of-operations-0005
    type: direct-computation
    difficulty: medium
    stem: |
      What is the value of $24 \div 6 \times 2 \div 4$?
    choices:
      - text: "$2$"
        correct: true
      - text: "$\\frac{1}{2}$"
        rationale: |
          You multiplied 6 by 2 first (12) and divided 24 by 12 (2), then divided 2 by 4.
      - text: "$8$"
        rationale: |
          You stopped after computing 4 times 2 and forgot to divide by 4.
      - text: "$16$"
        rationale: |
          You multiplied 24 by 2 first or miscalculated the operations.
    explanation: |
      Evaluate all multiplication and division strictly from left to right:

      1. First division: $24 \div 6 = 4$.
      2. Next multiplication: $4 \times 2 = 8$.
      3. Final division: $8 \div 4 = 2$.

      Common Trap: Multiplying $6 \times 2 = 12$ first turns the expression into $24 \div 12 \div 4 = 2 \div 4 = \frac{1}{2}$, violating the left-to-right rule.

  - id: q-arithmetic-number-sense-order-of-operations-0006
    type: error-spotting
    difficulty: medium
    stem: |
      A student evaluated the expression $20 - 8 + 5 - 2$ in the following steps:

      Step 1: $20 - 13 - 2$ (by adding $8 + 5 = 13$ first)
      Step 2: $7 - 2$
      Step 3: $5$

      In which step did the student make the FIRST error?
    choices:
      - text: "Step 1"
        correct: true
      - text: "Step 2"
        rationale: |
          You identified step 2 as the first error, but the addition 8 + 5 was already incorrectly performed in step 1.
      - text: "Step 3"
        rationale: |
          You identified step 3 as the error, but the initial misordering occurred in step 1.
      - text: "There is no error in the solution."
        rationale: |
          You assumed adding before subtracting is valid, but addition and subtraction must be performed left to right.
    explanation: |
      Let's evaluate $20 - 8 + 5 - 2$ using the correct order of operations:

      1. Addition and subtraction must be evaluated strictly from left to right.
      2. Step 1 should perform $20 - 8 = 12$.
      3. Step 2 should add $5$: $12 + 5 = 17$.
      4. Step 3 should subtract $2$: $17 - 2 = 15$.

      The student made the first error in Step 1 by computing $8 + 5 = 13$ first. This incorrectly changes $20 - 8 + 5$ to $20 - (8 + 5) = 7$.

  - id: q-arithmetic-number-sense-order-of-operations-0007
    type: direct-computation
    difficulty: medium
    stem: |
      What is the value of $30 - 12 - 6 + 9$?
    choices:
      - text: "$21$"
        correct: true
      - text: "$3$"
        rationale: |
          You added 6 + 9 = 15 first and subtracted 12 and 15 from 30 (30 - 12 - 15 = 3).
      - text: "$15$"
        rationale: |
          You added 12 + 6 + 9 = 27 and subtracted from 30, or miscalculated.
      - text: "$33$"
        rationale: |
          You added 12 + 9 = 21 and 30 - 18 = 12 or miscalculated signs.
    explanation: |
      Evaluate addition and subtraction strictly from left to right:

      1. First subtraction: $30 - 12 = 18$.
      2. Second subtraction: $18 - 6 = 12$.
      3. Final addition: $12 + 9 = 21$.

      Common Trap: Adding $6 + 9 = 15$ first leads to $30 - 12 - 15 = 3$, which violates left-to-right evaluation.

  - id: q-arithmetic-number-sense-order-of-operations-0008
    type: direct-computation
    difficulty: medium
    stem: |
      If $x = -2$ and $y = 3$, what is the value of $2x^2 - 3xy + y^2$?
    choices:
      - text: "$35$"
        correct: true
      - text: "$19$"
        rationale: |
          You evaluated (-2)^2 as -4, getting 2(-4) = -8 and -8 + 18 + 9 = 19.
      - text: "$-1$"
        rationale: |
          You calculated -3xy as -18 instead of +18, getting 8 - 18 + 9 = -1.
      - text: "$-17$"
        rationale: |
          You evaluated (-2)^2 as -4 and -3xy as -18, getting -8 - 18 + 9 = -17.
    explanation: |
      Substitute $x = -2$ and $y = 3$ into $2x^2 - 3xy + y^2$:

      1. First term $2x^2$:
         $$(-2)^2 = 4 \implies 2(4) = 8$$
      2. Second term $-3xy$:
         $$-3(-2)(3) = -3(-6) = +18$$
      3. Third term $y^2$:
         $$3^2 = 9$$
      4. Add all terms together:
         $$8 + 18 + 9 = 35$$

      Common Trap: Treating $(-2)^2$ as $-4$ yields $2(-4) = -8$, resulting in $-8 + 18 + 9 = 19$.

  - id: q-arithmetic-number-sense-order-of-operations-0009
    type: direct-computation
    difficulty: medium
    stem: |
      What is the value of $\frac{4^2 + 6 \times 2}{10 - 3 \times 2}$?
    choices:
      - text: "$7$"
        correct: true
      - text: "$2$"
        rationale: |
          You subtracted before multiplying in the denominator (10 - 3 = 7, 7 * 2 = 14), getting 28 / 14 = 2.
      - text: "$11$"
        rationale: |
          You evaluated the numerator as 4 + 12 = 16 or miscalculated the exponent.
      - text: "$14$"
        rationale: |
          You evaluated the numerator as 28 and denominator as 2 without performing division.
    explanation: |
      A fraction bar acts as a grouping symbol. Evaluate the numerator and denominator separately before dividing:

      1. Numerator ($4^2 + 6 \times 2$):
         - Exponent first: $4^2 = 16$.
         - Multiplication next: $6 \times 2 = 12$.
         - Addition last: $16 + 12 = 28$.
      2. Denominator ($10 - 3 \times 2$):
         - Multiplication first: $3 \times 2 = 6$.
         - Subtraction next: $10 - 6 = 4$.
      3. Perform fraction division:
         $$\frac{28}{4} = 7$$

      Common Trap: Subtracting before multiplying in the denominator gives $10 - 3 = 7 \implies 7 \times 2 = 14$, leading to $\frac{28}{14} = 2$.

  - id: q-arithmetic-number-sense-order-of-operations-0010
    type: error-spotting
    difficulty: hard
    stem: |
      A student simplified the expression $36 \div 4(3) + 2^3$ as follows:

      Step 1: $36 \div 12 + 2^3$ (by multiplying $4 \times 3 = 12$ first)
      Step 2: $36 \div 12 + 8$
      Step 3: $3 + 8$
      Step 4: $11$

      In which step did the student make the FIRST error?
    choices:
      - text: "Step 1"
        correct: true
      - text: "Step 2"
        rationale: |
          You identified step 2 as the error, but the implicit multiplication was wrongly prioritized in step 1.
      - text: "Step 3"
        rationale: |
          You identified step 3 as the error, but the initial misordering occurred in step 1.
      - text: "Step 4"
        rationale: |
          You identified step 4 as the error, but the calculations in step 4 followed from step 1's mistake.
    explanation: |
      Let's solve $36 \div 4(3) + 2^3$ correctly:

      1. Evaluate exponents first: $2^3 = 8$. The expression becomes $36 \div 4(3) + 8$.
      2. Evaluate multiplication and division strictly from left to right.
      3. Perform division first: $36 \div 4 = 9$.
      4. Perform multiplication next: $9 \times 3 = 27$.
      5. Add: $27 + 8 = 35$.

      The student made the first error in Step 1 by performing implicit multiplication $4(3) = 12$ before division. Multiplication does not take precedence over division; they must be solved from left to right.

  - id: q-arithmetic-number-sense-order-of-operations-0011
    type: direct-computation
    difficulty: hard
    stem: |
      What is the value of $50 - 2 \times [3 + 2 \times (4 - 7)^2]$?
    choices:
      - text: "$8$"
        correct: true
      - text: "$80$"
        rationale: |
          You squared 3 + 2 * 9 as a whole or miscalculated inside the bracket.
      - text: "$-40$"
        rationale: |
          You subtracted 50 from 10 or miscalculated sign handling.
      - text: "$1008$"
        rationale: |
          You subtracted 50 - 2 = 48 before multiplying by the bracketed value 21 (48 * 21 = 1008).
    explanation: |
      Work from the innermost grouping symbols outward:

      1. Innermost parentheses:
         $$4 - 7 = -3$$
      2. Square the result:
         $$(-3)^2 = 9$$
      3. Multiply inside the bracket:
         $$2 \times 9 = 18$$
      4. Add inside the bracket:
         $$3 + 18 = 21$$
      5. Multiply by $2$ outside the bracket:
         $$2 \times 21 = 42$$
      6. Subtract from $50$:
         $$50 - 42 = 8$$

      Common Trap: Subtracting $50 - 2 = 48$ before evaluating the brackets yields $48 \times 21 = 1008$, violating the rule that operations inside grouping symbols come first.

  - id: q-arithmetic-number-sense-order-of-operations-0012
    type: direct-computation
    difficulty: hard
    stem: |
      Marco started the day with $\text{₱}500$ in his sari-sari store cash box. During the day, he sold $12$ bottles of juice for $\text{₱}15$ each and spent $\text{₱}80$ from the cash box to buy extra ice. At the end of the day, he divided all the remaining cash equally among himself and his $2$ siblings. How much money did each person receive?
    choices:
      - text: "$\\text{₱}200$"
        correct: true
      - text: "$\\text{₱}300$"
        rationale: |
          You divided the remaining P600 by 2 siblings, omitting Marco himself.
      - text: "$\\text{₱}600$"
        rationale: |
          You reported the total cash box balance (P600) without dividing among the 3 people.
      - text: "$\\text{₱}180$"
        rationale: |
          You calculated only the revenue from juice sales (12 * 15 = P180) and ignored other terms.
    explanation: |
      Translate the problem into a single numerical expression:
      $$\text{Amount per person} = (500 + 12 \times 15 - 80) \div 3$$

      Follow the order of operations:
      1. Inside the parentheses, perform multiplication first:
         $$12 \times 15 = 180$$
      2. Perform addition and subtraction from left to right:
         $$500 + 180 = 680$$
         $$680 - 80 = 600$$
      3. Divide by the total number of people (Marco + $2$ siblings = $3$ people):
         $$600 \div 3 = 200$$

      Each person receives $\text{₱}200$.

      Common Trap: Dividing by $2$ siblings instead of $3$ total people yields $600 \div 2 = \text{₱}300$.

  - id: q-arithmetic-number-sense-order-of-operations-0013
    type: direct-computation
    difficulty: hard
    stem: |
      If $a = -3$ and $b = 2$, what is the value of $\frac{-a^2 + 2ab}{(a + b)^3}$?
    choices:
      - text: "$21$"
        correct: true
      - text: "$-21$"
        rationale: |
          You evaluated the denominator as +1 instead of -1 (-21 / 1 = -21).
      - text: "$3$"
        rationale: |
          You evaluated -a^2 as +9, getting numerator 9 - 12 = -3 and ratio -3 / -1 = 3.
      - text: "$-3$"
        rationale: |
          You evaluated -a^2 as +9 and denominator as +1, getting -3 / 1 = -3.
    explanation: |
      Substitute $a = -3$ and $b = 2$ into the expression:

      1. Numerator ($-a^2 + 2ab$):
         - First term $-a^2$: $a^2 = (-3)^2 = 9 \implies -a^2 = -9$.
         - Second term $2ab$: $2(-3)(2) = -12$.
         - Combine numerator: $-9 + (-12) = -21$.
      2. Denominator ($(a + b)^3$):
         - Inside parentheses: $-3 + 2 = -1$.
         - Cube the result: $(-1)^3 = -1$.
      3. Perform fraction division:
         $$\frac{-21}{-1} = 21$$

      Common Trap: Mistaking $-a^2$ for $+9$ gives numerator $9 - 12 = -3$, leading to $\frac{-3}{-1} = 3$.

  - id: q-arithmetic-number-sense-order-of-operations-0014
    type: direct-computation
    difficulty: exam-level
    stem: |
      What is the value of $\frac{2^4 - 4 \times (5 - 8)^2}{18 \div 3 \times 2 - 2^3}$?
    choices:
      - text: "$-5$"
        correct: true
      - text: "$4$"
        rationale: |
          You evaluated 18 / 3 * 2 as 18 / 6 = 3 in the denominator, getting -20 / -5 = 4.
      - text: "$13$"
        rationale: |
          You miscalculated 16 - 36 as -20 and denominator as 2, or made an arithmetic error.
      - text: "$27$"
        rationale: |
          You added terms in the numerator instead of subtracting (16 + 36 = 52).
    explanation: |
      Evaluate the numerator and denominator separately:

      1. Numerator ($2^4 - 4 \times (5 - 8)^2$):
         - Parentheses: $5 - 8 = -3$.
         - Exponents: $2^4 = 16$ and $(-3)^2 = 9$.
         - Multiplication: $4 \times 9 = 36$.
         - Subtraction: $16 - 36 = -20$.
      2. Denominator ($18 \div 3 \times 2 - 2^3$):
         - Exponent: $2^3 = 8$.
         - Left-to-right division and multiplication: $18 \div 3 = 6 \implies 6 \times 2 = 12$.
         - Subtraction: $12 - 8 = 4$.
      3. Divide numerator by denominator:
         $$\frac{-20}{4} = -5$$

      Common Trap: Evaluating $18 \div 3 \times 2$ as $18 \div (3 \times 2) = 18 \div 6 = 3$ in the denominator results in denominator $3 - 8 = -5$, giving $\frac{-20}{-5} = 4$.

  - id: q-arithmetic-number-sense-order-of-operations-0015
    type: direct-computation
    difficulty: exam-level
    stem: |
      A jeepney driver starts his morning route with an initial change fund of $\text{₱}350$. During the trip, he collects regular fares from $24$ passengers at $\text{₱}13$ each and discounted fares from $10$ students at $\text{₱}10$ each. He then spends $\text{₱}400$ from his cash box for diesel fuel. Finally, he splits all remaining cash into $2$ equal parts: one part for his daily boundary fee and the other part for his personal net income. What is his personal net income from the morning trip?
    choices:
      - text: "$\\text{₱}181$"
        correct: true
      - text: "$\\text{₱}362$"
        rationale: |
          You reported the total remaining cash box balance (P362) without dividing by 2.
      - text: "$\\text{₱}6$"
        rationale: |
          You forgot to add the initial P350 change fund, calculating (312 + 100 - 400) / 2 = P6.
      - text: "$\\text{₱}381$"
        rationale: |
          You added P400 fuel expense instead of subtracting it from revenue.
    explanation: |
      Write a single expression for the driver's net income:
      $$\text{Net Income} = \frac{350 + 24 \times 13 + 10 \times 10 - 400}{2}$$

      Evaluate using the order of operations:
      1. Perform multiplications inside the numerator first:
         $$24 \times 13 = 312$$
         $$10 \times 10 = 100$$
      2. Add and subtract from left to right inside the numerator:
         $$350 + 312 = 662$$
         $$662 + 100 = 762$$
         $$762 - 400 = 362$$
      3. Divide the remaining total cash box balance by $2$:
         $$362 \div 2 = 181$$

      His personal net income is $\text{₱}181$.

      Common Trap: Forgetting to include the initial $\text{₱}350$ change fund before deducting expenses gives $\frac{312 + 100 - 400}{2} = \frac{12}{2} = \text{₱}6$.
