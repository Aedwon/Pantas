meta:
  subject: mathematics
  topic: arithmetic-number-sense
  subtopic: order-of-operations
  exams: [upcat, acet, dlsucet, ustet, pupcet, cse-pro, cse-sub]
questions:
  - id: q-arithmetic-number-sense-order-of-operations-0001
    type: direct-computation
    difficulty: easy
    stem: |
      What is the value of $18 \div 3 \times 2$?
    choices:
      - text: "$12$"
        correct: true
      - text: "$3$"
        rationale: |
          You multiplied 3 by 2 first, instead of evaluating multiplication and division from left to right.
      - text: "$8$"
        rationale: |
          Recheck the arithmetic after the first division.
      - text: "$6$"
        rationale: |
          You stopped after $18\div3$ and omitted the final multiplication.
    explanation: |
      Multiplication and division have equal priority, so evaluate left to right: $18\div3=6$, then $6\times2=12$.

  - id: q-arithmetic-number-sense-order-of-operations-0002
    type: direct-computation
    difficulty: easy
    stem: |
      What is the value of $15 - 5 + 4$?
    choices:
      - text: "$14$"
        correct: true
      - text: "$6$"
        rationale: |
          Addition and subtraction have equal priority and are evaluated left to right.
      - text: "$24$"
        rationale: |
          The 5 is subtracted, not added.
      - text: "$10$"
        rationale: |
          You stopped after the first subtraction.
    explanation: |
      $15-5=10$, then $10+4=14$.

  - id: q-arithmetic-number-sense-order-of-operations-0003
    type: direct-computation
    difficulty: easy
    stem: |
      What is the value of $-4^2 + (-3)^2$?
    choices:
      - text: "$-7$"
        correct: true
      - text: "$25$"
        rationale: |
          In $-4^2$, the exponent applies to 4 before the leading negative is applied.
      - text: "$-25$"
        rationale: |
          $(-3)^2=9$, not $-9$.
      - text: "$7$"
        rationale: |
          $-16+9=-7$.
    explanation: |
      $-4^2=-(4^2)=-16$, while $(-3)^2=9$. Therefore the result is $-7$.

  - id: q-arithmetic-number-sense-order-of-operations-0004
    type: direct-computation
    difficulty: easy
    stem: |
      What is the value of $4 \times (8 - 3)^2$?
    choices:
      - text: "$100$"
        correct: true
      - text: "$400$"
        rationale: |
          The exponent applies to the parenthesized 5 before multiplication by 4.
      - text: "$220$"
        rationale: |
          Re-evaluate the grouping and exponent.
      - text: "$40$"
        rationale: |
          Squaring 5 gives 25, not multiplying it by 2.
    explanation: |
      $(8-3)^2=25$, then $4\times25=100$.

  - id: q-arithmetic-number-sense-order-of-operations-0005
    type: direct-computation
    difficulty: medium
    stem: |
      What is the value of $24 \div 6 \times 2 \div 4$?
    choices:
      - text: "$2$"
        correct: true
      - text: "$\\frac{1}{2}$"
        rationale: |
          You grouped $6\times2$ before the preceding division.
      - text: "$8$"
        rationale: |
          You stopped before the final division by 4.
      - text: "$16$"
        rationale: |
          Recheck the left-to-right sequence.
    explanation: |
      Evaluate left to right: $24\div6=4$, $4\times2=8$, $8\div4=2$.

  - id: q-arithmetic-number-sense-order-of-operations-0006
    type: error-spotting
    difficulty: medium
    stem: |
      A student evaluated the expression $20 - 8 + 5 - 2$ in the following steps:

      Step 1: $20 - 13 - 2$ (by adding $8 + 5 = 13$ first)
      Step 2: $7 - 2$
      Step 3: $5$

      In which step did the student make the FIRST error?
    choices:
      - text: "Step 1"
        correct: true
      - text: "Step 2"
        rationale: |
          The expression was already changed incorrectly in Step 1.
      - text: "Step 3"
        rationale: |
          The first error occurred earlier.
      - text: "There is no error in the solution."
        rationale: |
          Addition and subtraction must be evaluated left to right here.
    explanation: |
      The first operation should be $20-8=12$. Replacing $-8+5$ with $-13$ changes the expression, so Step 1 is the first error.

  - id: q-arithmetic-number-sense-order-of-operations-0007
    type: direct-computation
    difficulty: medium
    stem: |
      What is the value of $30 - 12 - 6 + 9$?
    choices:
      - text: "$21$"
        correct: true
      - text: "$3$"
        rationale: |
          You grouped $6+9$ before the preceding subtraction.
      - text: "$15$"
        rationale: |
          Re-evaluate the signs from left to right.
      - text: "$33$"
        rationale: |
          Re-evaluate the signs from left to right.
    explanation: |
      $30-12=18$, $18-6=12$, and $12+9=21$.

  - id: q-arithmetic-number-sense-order-of-operations-0008
    type: direct-computation
    difficulty: medium
    stem: |
      If $x = -2$ and $y = 3$, what is the value of $2x^2 - 3xy + y^2$?
    choices:
      - text: "$35$"
        correct: true
      - text: "$19$"
        rationale: |
          $(-2)^2=4$, not $-4$.
      - text: "$-1$"
        rationale: |
          $-3(-2)(3)=+18$.
      - text: "$-17$"
        rationale: |
          Recheck both the square and the sign of the middle product.
    explanation: |
      $2(-2)^2-3(-2)(3)+3^2=8+18+9=35$.

  - id: q-arithmetic-number-sense-order-of-operations-0009
    type: direct-computation
    difficulty: medium
    stem: |
      What is the value of $\frac{4^2 + 6 \times 2}{10 - 3 \times 2}$?
    choices:
      - text: "$7$"
        correct: true
      - text: "$2$"
        rationale: |
          In the denominator, multiplication comes before subtraction.
      - text: "$11$"
        rationale: |
          $4^2=16$.
      - text: "$14$"
        rationale: |
          The final numerator must be divided by the denominator.
    explanation: |
      Numerator: $16+12=28$. Denominator: $10-6=4$. Thus $28/4=7$.

  - id: q-arithmetic-number-sense-order-of-operations-0010
    type: error-spotting
    difficulty: hard
    stem: |
      A student simplified the unambiguous expression $36 \div 4 \times 3 + 2^3$ as follows:

      Step 1: $36 \div 12 + 2^3$ (by multiplying $4 \times 3 = 12$ first)
      Step 2: $36 \div 12 + 8$
      Step 3: $3 + 8$
      Step 4: $11$

      In which step did the student make the FIRST error?
    choices:
      - text: "Step 1"
        correct: true
      - text: "Step 2"
        rationale: |
          The expression was already regrouped incorrectly in Step 1.
      - text: "Step 3"
        rationale: |
          The first error occurred before this arithmetic.
      - text: "Step 4"
        rationale: |
          The first error occurred in Step 1.
    explanation: |
      The exponent may be evaluated first, but multiplication and division otherwise have equal priority and are evaluated left to right. Thus $36\div4=9$, then $9\times3=27$, and $27+8=35$. Step 1 is the first error because it groups $4\times3$ ahead of the preceding division.

  - id: q-arithmetic-number-sense-order-of-operations-0011
    type: direct-computation
    difficulty: hard
    stem: |
      What is the value of $50 - 2 \times [3 + 2 \times (4 - 7)^2]$?
    choices:
      - text: "$8$"
        correct: true
      - text: "$80$"
        rationale: |
          Recheck the nested grouping and square.
      - text: "$-40$"
        rationale: |
          Recheck the final subtraction.
      - text: "$1008$"
        rationale: |
          The bracket must be evaluated before subtracting from 50.
    explanation: |
      $(4-7)^2=9$, so the bracket is $3+2(9)=21$. Then $50-2(21)=8$.

  - id: q-arithmetic-number-sense-order-of-operations-0012
    type: direct-computation
    difficulty: hard
    stem: |
      Marco started the day with $\text{₱}500$ in his sari-sari store cash box. During the day, he sold $12$ bottles of juice for $\text{₱}15$ each and spent $\text{₱}80$ from the cash box to buy extra ice. At the end of the day, he divided all the remaining cash equally among himself and his $2$ siblings. How much money did each person receive?
    choices:
      - text: "$\\text{₱}200$"
        correct: true
      - text: "$\\text{₱}300$"
        rationale: |
          There are 3 people total, not 2.
      - text: "$\\text{₱}600$"
        rationale: |
          This is the remaining balance before division.
      - text: "$\\text{₱}180$"
        rationale: |
          This is only the juice-sales revenue.
    explanation: |
      $(500+12\times15-80)\div3=(500+180-80)\div3=600\div3=200$.

  - id: q-arithmetic-number-sense-order-of-operations-0013
    type: direct-computation
    difficulty: hard
    stem: |
      If $a = -3$ and $b = 2$, what is the value of $\frac{-a^2 + 2ab}{(a + b)^3}$?
    choices:
      - text: "$21$"
        correct: true
      - text: "$-21$"
        rationale: |
          $(a+b)^3=(-1)^3=-1$.
      - text: "$3$"
        rationale: |
          $-a^2=-9$, not $+9$.
      - text: "$-3$"
        rationale: |
          Recheck both the leading negative and the denominator.
    explanation: |
      Numerator: $-(-3)^2+2(-3)(2)=-9-12=-21$. Denominator: $(-3+2)^3=-1$. The quotient is 21.

  - id: q-arithmetic-number-sense-order-of-operations-0014
    type: direct-computation
    difficulty: exam-level
    stem: |
      What is the value of $\frac{2^4 - 4 \times (5 - 8)^2}{18 \div 3 \times 2 - 2^3}$?
    choices:
      - text: "$-5$"
        correct: true
      - text: "$4$"
        rationale: |
          $18\div3\times2$ is evaluated left to right as 12.
      - text: "$13$"
        rationale: |
          Recheck the numerator and denominator separately.
      - text: "$27$"
        rationale: |
          The numerator contains subtraction, not addition.
    explanation: |
      Numerator: $16-4(9)=-20$. Denominator: $18\div3\times2-8=12-8=4$. Thus $-20/4=-5$.

  - id: q-arithmetic-number-sense-order-of-operations-0015
    type: direct-computation
    difficulty: exam-level
    stem: |
      A jeepney cash box starts with $\text{₱}350$. During the trip, $24$ regular fares of $\text{₱}13$ and $10$ discounted fares of $\text{₱}10$ are added, then $\text{₱}400$ is taken from the box for fuel. If the remaining cash is split equally into two envelopes, how much goes into each envelope?
    choices:
      - text: "$\\text{₱}181$"
        correct: true
      - text: "$\\text{₱}362$"
        rationale: |
          This is the balance before splitting it in two.
      - text: "$\\text{₱}6$"
        rationale: |
          This omits the opening cash-box balance.
      - text: "$\\text{₱}381$"
        rationale: |
          Fuel is subtracted from the cash box, not added.
    explanation: |
      The cash balance is $350+24(13)+10(10)-400=362$. Splitting that equally gives $362\div2=181$ pesos per envelope. The problem deliberately asks about cash allocation, not accounting profit, so the opening change fund is part of the amount being divided.
