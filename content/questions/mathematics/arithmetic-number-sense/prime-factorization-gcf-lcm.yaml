meta:
  subject: mathematics
  topic: arithmetic-number-sense
  subtopic: prime-factorization-gcf-lcm
  exams: [upcat, acet, dlsucet, ustet, pupcet, cse-pro, cse-sub]
questions:
  - id: q-arithmetic-number-sense-prime-factorization-gcf-lcm-0001
    type: direct-computation
    difficulty: easy
    stem: |
      What is the prime factorization of $180$?
    choices:
      - text: '$1 \times 2^2 \times 3^2 \times 5$'
        rationale: |
          This includes one as a prime factor. One is a divisor of every integer. Check that each prime has exactly two positive factors.
      - text: '$2^2 \times 9 \times 5$'
        rationale: |
          This leaves nine as a factor without breaking it into primes. Nine is a valid ordinary factor. Check that every factor is prime.
      - text: '$2^2 \times 3^2 \times 5$'
        correct: true
      - text: '$2^3 \times 3 \times 5$'
        rationale: |
          This trades a factor of three for a factor of two. Both products use small primes. Check that the product equals the original number.
    explanation: |
      Divide by primes: $180=2(90)=2^2(45)=2^2(3)(15)=2^2(3^2)(5)$. All remaining factors are prime, so the factorization is $2^2\times3^2\times5$.

  - id: q-arithmetic-number-sense-prime-factorization-gcf-lcm-0002
    type: direct-computation
    difficulty: easy
    stem: |
      What is the Greatest Common Factor (GCF) of $72$ and $108$?
    choices:
      - text: '$12$'
        rationale: |
          This uses only one factor of three instead of two. Twelve does divide both numbers. Check the smallest exponent of each shared prime.
      - text: '$36$'
        correct: true
      - text: '$72$'
        rationale: |
          This chooses the smaller original number without checking the other. A GCF cannot exceed the smaller number. Check that the result divides both numbers.
      - text: '$216$'
        rationale: |
          This reports the LCM rather than the GCF. Both results use the same prime factorizations. Check whether a factor or a multiple is requested.
    explanation: |
      Factor the numbers: $72=2^3\times3^2$ and $108=2^2\times3^3$. The GCF uses each shared prime with its smaller exponent. Thus the GCF is $2^2\times3^2=36$.

  - id: q-arithmetic-number-sense-prime-factorization-gcf-lcm-0003
    type: direct-computation
    difficulty: easy
    stem: |
      What is the Least Common Multiple (LCM) of $24$ and $36$?
    choices:
      - text: '$12$'
        rationale: |
          This reports the GCF instead of the LCM. Both concepts combine factors. Check whether a multiple or a factor is requested.
      - text: '$36$'
        rationale: |
          This chooses the larger original number without checking the other. Thirty-six is already a multiple of itself. Check that the answer is a multiple of both numbers.
      - text: '$72$'
        correct: true
      - text: '$864$'
        rationale: |
          This multiplies the numbers without removing their shared factor. The product is a common multiple. Check for a smaller common multiple.
    explanation: |
      Factor the numbers: $24=2^3\times3$ and $36=2^2\times3^2$. The LCM needs the larger exponent of each prime. Thus it is $2^3\times3^2=72$.

  - id: q-arithmetic-number-sense-prime-factorization-gcf-lcm-0004
    type: error-spotting
    difficulty: easy
    stem: |
      A student writes $210=2\times3\times35$. Which step completes the prime factorization?
    choices:
      - text: 'Factor $35$ into $5\times7$.'
        correct: true
      - text: 'Include $1$ along with $2,3,5,7$.'
        rationale: |
          This adds one to the list of primes. Multiplying by one preserves the product. Check that one is not prime.
      - text: 'Keep $35$ as the final remaining factor.'
        rationale: |
          This stops with the composite factor thirty-five. Thirty-five is an integer factor of the product. Check that every final factor is prime.
      - text: 'Replace $35$ with the prime power $5^2$.'
        rationale: |
          This replaces thirty-five with twenty-five. The prime five is part of the correct factorization. Check that the replacement has the same product.
    explanation: |
      The factor $35$ is composite because $35=5(7)$. Both $5$ and $7$ are prime. Replacing $35$ with their product completes $210=2\times3\times5\times7$.

  - id: q-arithmetic-number-sense-prime-factorization-gcf-lcm-0005
    type: word-problem
    difficulty: medium
    stem: |
      A volunteer relief team in Manila has 120 canned goods, 180 packs of instant noodles, and 240 bottles of water. They want to pack these items into identical relief packs with the exact same quantities in each pack and no leftover items. What is the maximum number of relief packs they can create?
    choices:
      - text: '$30$'
        rationale: |
          This drops one factor of two from the shared factorization. Thirty does divide all three stocks. Check every shared prime with its smallest exponent.
      - text: '$60$'
        correct: true
      - text: '$180$'
        rationale: |
          This chooses the middle inventory count instead of a shared divisor. That count appears directly in the inventory. Check that the pack count divides every stock.
      - text: '$720$'
        rationale: |
          This uses the least common multiple for a grouping problem. LCM is another way to combine all three quantities. Check whether the task forms groups or repeats schedules.
    explanation: |
      The number of packs must divide all three quantities. The factorizations are $120=2^3\times3\times5$, $180=2^2\times3^2\times5$, and $240=2^4\times3\times5$. Their greatest shared factor is $2^2\times3\times5=60$. Thus they can make $60$ identical packs.

  - id: q-arithmetic-number-sense-prime-factorization-gcf-lcm-0006
    type: word-problem
    difficulty: medium
    stem: |
      Two jeepneys leave a terminal at 6:00 AM. Jeepney A completes its round-trip every 15 minutes, and Jeepney B every 20 minutes. At what time will both jeepneys next arrive at the terminal simultaneously?
    choices:
      - text: '$6:05\text{ AM}$'
        rationale: |
          This uses the difference of the route times. The difference is a small common time comparison. Check that the time is a multiple of both route intervals.
      - text: '$6:35\text{ AM}$'
        rationale: |
          This adds the route times. Both intervals are used. Check that the time is a multiple of both route intervals.
      - text: '$7:00\text{ AM}$'
        correct: true
      - text: '$11:00\text{ AM}$'
        rationale: |
          This multiplies the route times without removing their common factor. The product is a common multiple. Check whether a smaller common multiple exists.
    explanation: |
      The first shared return time is the LCM of $15$ and $20$ minutes. Since $15=3(5)$ and $20=2^2(5)$, the LCM is $2^2(3)(5)=60$ minutes. One hour after $6{:}00$ AM is $7{:}00$ AM.

  - id: q-arithmetic-number-sense-prime-factorization-gcf-lcm-0007
    type: direct-computation
    difficulty: medium
    stem: |
      Two numbers are given in prime factored form: $A = 2^3 \times 3^4 \times 5^2$ and $B = 2^5 \times 3^2 \times 7^1$. What is the GCF of $A$ and $B$?
    choices:
      - text: '$72$'
        correct: true
      - text: '$648$'
        rationale: |
          This takes the larger power of three instead of the smaller. The larger power is present in one number. Check that GCF uses smaller exponents.
      - text: '$2,520$'
        rationale: |
          This adds one factor of five and seven even though neither is shared. These prime bases appear somewhere in the two numbers. Check that a GCF includes only shared bases.
      - text: '$453,600$'
        rationale: |
          This finds the LCM instead of the GCF. GCF and LCM use the same bases. Check whether a factor or a multiple is requested.
    explanation: |
      The shared prime bases are $2$ and $3$. Their smaller exponents are $3$ and $2$. The GCF is $2^3\times3^2=8(9)=72$.

  - id: q-arithmetic-number-sense-prime-factorization-gcf-lcm-0008
    type: word-problem
    difficulty: medium
    stem: |
      A volunteer group has 144 rice pouches and 96 hygiene kits. They pack these into identical boxes with equal distribution and no leftovers. If they create the maximum possible number of boxes, how many total items are in each box?
    choices:
      - text: '$5$'
        correct: true
      - text: '$3$'
        rationale: |
          This counts only rice pouches in a box. Rice is one part of the box. Check that every item type is counted.
      - text: '$48$'
        rationale: |
          This reports the number of boxes. The number of boxes is needed first. Check whether the question asks for boxes or items per box.
      - text: '$120$'
        rationale: |
          This averages the two total quantities. Both quantities are used. Check that total items are divided by the maximum box count.
    explanation: |
      The factorizations are $144=2^4\times3^2$ and $96=2^5\times3$. Their GCF is $2^4(3)=48$, so there are $48$ boxes. Each contains $144\div48=3$ rice pouches and $96\div48=2$ kits. The total is $3+2=5$ items per box.

  - id: q-arithmetic-number-sense-prime-factorization-gcf-lcm-0009
    type: word-problem
    difficulty: medium
    stem: |
      Jeepneys on three routes depart from a terminal every 12, 18, and 30 minutes respectively. If all three depart together at 8:00 AM, how many times will all three depart together between 8:01 AM and 5:00 PM (inclusive)?
    choices:
      - text: '$3$'
        correct: true
      - text: '$4$'
        rationale: |
          This includes the initial departure outside the window. The initial departure is simultaneous. Check the start of the stated window.
      - text: '$6$'
        rationale: |
          This uses only one factor of two in the shared interval. The other prime powers are correct. Check the largest exponent of every prime for LCM.
      - text: '$90$'
        rationale: |
          This reports an incorrectly computed ninety-minute interval instead of counting departures. An interval is needed before counting. Check that the final answer counts events, not minutes.
    explanation: |
      The intervals factor as $12=2^2(3)$, $18=2(3^2)$, and $30=2(3)(5)$. Their LCM is $2^2(3^2)(5)=180$ minutes, or $3$ hours. After $8{:}00$ AM, shared departures are at $11{:}00$ AM, $2{:}00$ PM, and $5{:}00$ PM. All three are in the stated window.

  - id: q-arithmetic-number-sense-prime-factorization-gcf-lcm-0010
    type: direct-computation
    difficulty: hard
    stem: |
      The GCF of two positive integers is 14, and their LCM is 420. If one integer is 70, what is the other?
    choices:
      - text: '$30$'
        rationale: |
          This divides LCM by GCF rather than using the product relation. Both values are given in the stem. Check the product formula for two positive integers.
      - text: '$84$'
        correct: true
      - text: '$6$'
        rationale: |
          This divides LCM by the known integer and omits the GCF. Dividing the LCM uses the known number. Check that GCF times LCM equals the two-number product.
      - text: '$406$'
        rationale: |
          This subtracts GCF from LCM. Both values are given in the stem. Check that the relationship uses multiplication.
    explanation: |
      For two positive integers, GCF times LCM equals their product. Let the missing integer be $b$. Then $14(420)=70b$. Divide by $70$: $b=\dfrac{5880}{70}=84$.

  - id: q-arithmetic-number-sense-prime-factorization-gcf-lcm-0011
    type: word-problem
    difficulty: hard
    stem: |
      A charity foundation creates relief packages from 315 blankets (costing $\text{₱}150$ each) and 420 lanterns (costing $\text{₱}250$ each). They create the maximum number of identical packages. What is the total cost of one relief package?
    choices:
      - text: '$\text{₱}400$'
        rationale: |
          This adds one unit price of each item without using the quantities. Both item types are included. Check the count of each item per package.
      - text: '$\text{₱}1,350$'
        rationale: |
          This reverses the blanket and lantern counts. Both counts come from the correct grouping. Check which count belongs to each item.
      - text: '$\text{₱}1,450$'
        correct: true
      - text: '$\text{₱}10,150$'
        rationale: |
          This uses fifteen packages by omitting the shared factor seven. Fifteen does divide both item totals. Check every shared prime when finding the greatest package count.
    explanation: |
      The factorizations are $315=3^2(5)(7)$ and $420=2^2(3)(5)(7)$. Their GCF is $3(5)(7)=105$ packages. Each contains $315\div105=3$ blankets and $420\div105=4$ lanterns. Its cost is $3(150)+4(250)=450+1000=1450$ pesos.

  - id: q-arithmetic-number-sense-prime-factorization-gcf-lcm-0012
    type: word-problem
    difficulty: hard
    stem: |
      Jeepneys pass an intersection at intervals of 16, 24, and 40 minutes. If they pass together at 9:00 AM, at what time will they next pass together after 12:00 PM on the same day?
    choices:
      - text: '$9:08\text{ AM}$'
        rationale: |
          This uses the GCF of the intervals. The GCF is a common factor. Check that schedule times use a common multiple.
      - text: '$11:00\text{ AM}$'
        rationale: |
          This uses the smaller power of two, making the interval two hours. The smaller exponent is used for GCF. Check the largest exponent for LCM.
      - text: '$1:00\text{ PM}$'
        correct: true
      - text: '$5:00\text{ PM}$'
        rationale: |
          This skips the first qualifying shared passage. The later time is also a shared passage. Check that the first time after noon is requested.
    explanation: |
      The intervals factor as $16=2^4$, $24=2^3(3)$, and $40=2^3(5)$. Their LCM is $2^4(3)(5)=240$ minutes, or $4$ hours. Four hours after $9{:}00$ AM is $1{:}00$ PM, which is the first shared passage after noon.

  - id: q-arithmetic-number-sense-prime-factorization-gcf-lcm-0013
    type: direct-computation
    difficulty: hard
    stem: |
      What is the smallest positive integer with exactly 12 positive factors, using only prime factors 2 and 3?
    choices:
      - text: '$60$'
        rationale: |
          This allows the prime factor five. Sixty does have twelve positive factors. Check that only two and three are permitted primes.
      - text: '$72$'
        correct: true
      - text: '$96$'
        rationale: |
          This finds a valid twelve-divisor number but not the smallest. Ninety-six uses only the permitted primes. Compare all possible exponent pairs before choosing the least number.
      - text: '$108$'
        rationale: |
          This assigns the larger exponent to three instead of two. One hundred eight has the required divisor count. Check whether swapping the exponents makes a smaller valid number.
    explanation: |
      Write the number as $2^a3^b$. Every positive divisor selects a power of $2$ from zero through $a$ and a power of $3$ from zero through $b$. Hence the divisor count is $(a+1)(b+1)=12$. The possible exponent pairs give $2048,486,108,72,96,$ and $177147$. The least is $72=2^3(3^2)$.

  - id: q-arithmetic-number-sense-prime-factorization-gcf-lcm-0014
    type: word-problem
    difficulty: exam
    stem: |
      A non-profit receives $\text{₱}36,000$ worth of rice ($\text{₱}200$ per bag) and $\text{₱}45,000$ worth of canned goods ($\text{₱}150$ per pack). They make the greatest possible number of identical relief packages with no leftovers. Jeepney A carries 25 packages per trip; Jeepney B carries 35 per trip. What is the minimum number of trips needed using only one jeepney type?
    choices:
      - text: '$2$'
        correct: true
      - text: '$3$'
        rationale: |
          This chooses the smaller-capacity jeepney. That jeepney can complete delivery in three trips. Compare the trip counts for both capacities.
      - text: '$5$'
        rationale: |
          This adds the trip counts for both types. Both results describe possible deliveries. Check that only one type is used.
      - text: '$60$'
        rationale: |
          This reports the number of packages. The package count is a needed intermediate value. Check that packages are divided by vehicle capacity.
    explanation: |
      The rice quantity is $36000\div200=180$ bags. The canned-goods quantity is $45000\div150=300$ packs. Their GCF is $60$, so the greatest number of relief packages is $60$. At capacity $35$, one trip is not enough, but two can carry $70$. At capacity $25$, two can carry only $50$. The minimum is two trips using the larger jeepney.

  - id: q-arithmetic-number-sense-prime-factorization-gcf-lcm-0015
    type: word-problem
    difficulty: exam
    stem: |
      Jeepneys X and Y leave at $5{:}00$ AM and repeat their routes without breaks. X completes a round trip every $45$ minutes and earns exactly $20(15)$ pesos per completed round trip. Y completes a round trip every $75$ minutes and earns exactly $16(25)$ pesos per completed round trip. Counting only round trips completed by their first simultaneous return, what are their combined fares?
    choices:
      - text: '$\text{₱}2,100$'
        rationale: |
          This gives X only three rounds, matching the slower route count. Y does complete three rounds. Check each route interval separately.
      - text: '$\text{₱}2,400$'
        rationale: |
          This omits the last completed X round. Four X rounds finish before the shared return. Check that the final completed round is included.
      - text: '$\text{₱}2,700$'
        correct: true
      - text: '$\text{₱}3,100$'
        rationale: |
          This counts one extra Y round. The first shared return is also a possible next departure. Check that only completed rounds by the shared return count.
    explanation: |
      The route intervals factor as $45=3^2(5)$ and $75=3(5^2)$. Their LCM is $225$ minutes. By then X has completed $225\div45=5$ rounds, and Y has completed $225\div75=3$. Each X round earns $20(15)=300$ pesos, and each Y round earns $16(25)=400$ pesos. Total fares are $5(300)+3(400)=2700$ pesos.

  - id: q-arithmetic-number-sense-prime-factorization-gcf-lcm-0016
    type: which-is-true
    difficulty: easy
    stem: |
      Which statement about prime numbers is true?
    choices:
      - text: '$2$ is the only even prime.'
        correct: true
      - text: '$1$ is the smallest prime.'
        rationale: |
          This counts one as prime. One is a building block in multiplication. Check that a prime must have exactly two positive factors.
      - text: 'Every odd integer greater than $1$ is prime.'
        rationale: |
          This treats oddness as sufficient for primality. Most small primes are odd. Check for a divisor between one and the number.
      - text: 'A prime number has only one positive factor.'
        rationale: |
          This forgets one as a factor of a prime. The number itself is a factor. Check both one and the number.
    explanation: |
      Two has exactly two positive factors, $1$ and $2$, so it is prime. Every even integer greater than $2$ also has $2$ as a factor besides $1$ and itself. Thus $2$ is the only even prime.
    approved: false

  - id: q-arithmetic-number-sense-prime-factorization-gcf-lcm-0017
    type: error-spotting
    difficulty: medium
    stem: |
      A student says the LCM of $6,10,15$ is $900$ because no prime divides all three and their product is $900$. What is the error?
    choices:
      - text: 'Shared factors need to be counted only once.'
        correct: true
      - text: 'The largest original number is always the LCM.'
        rationale: |
          This uses the largest given number without checking the others. Fifteen is already a multiple of itself. Check that the answer is a multiple of every number.
      - text: 'A common multiple must divide each original number.'
        rationale: |
          This reverses factor and multiple. Both ideas involve exact division. Check the direction of divisibility.
      - text: 'The three numbers must be added instead of multiplied.'
        rationale: |
          This replaces the repeated-factor problem with addition. Using each original number once looks simple. Check that the result must be a common multiple.
    explanation: |
      The factorizations are $6=2(3)$, $10=2(5)$, and $15=3(5)$. Each prime is needed once at its largest exponent. The LCM is $2(3)(5)=30$. Multiplying all original numbers repeats those shared primes.
    approved: false

  - id: q-arithmetic-number-sense-prime-factorization-gcf-lcm-0018
    type: word-problem
    difficulty: hard
    stem: |
      A school arranges an equal number of chairs in rows of $6$, $8$, or $10$, leaving $3$ chairs unused each time. What is the smallest possible chair count greater than $10$?
    choices:
      - text: '$123$'
        correct: true
      - text: '$120$'
        rationale: |
          This omits the unused chairs. The LCM is a needed intermediate value. Check that the stated remainder is added back.
      - text: '$3$'
        rationale: |
          This uses the remainder alone. Three does leave a remainder of three for each divisor. Check the required lower bound.
      - text: '$483$'
        rationale: |
          This uses the product of the row sizes instead of their least common multiple. The product is a common multiple. Check whether a smaller one fits.
    explanation: |
      Subtract the common remainder of $3$. The result must be a multiple of $6,8,$ and $10$. Their LCM is $2^3(3)(5)=120$. Add the remainder: $120+3=123$. This is the first such count above $10$.
    approved: false

  - id: q-arithmetic-number-sense-prime-factorization-gcf-lcm-0019
    type: which-is-true
    difficulty: hard
    stem: |
      For positive integers $a$ and $b$, which expression always equals their LCM?
    choices:
      - text: '$\dfrac{ab}{\gcd(a,b)}$'
        correct: true
      - text: '$ab\gcd(a,b)$'
        rationale: |
          This multiplies by the shared factor instead of dividing. The product relation includes the GCF. Check that isolating LCM requires division.
      - text: '$\dfrac{a+b}{\gcd(a,b)}$'
        rationale: |
          This adds the integers instead of multiplying them. Both formulas combine the inputs. Check the stated product relation.
      - text: '$\dfrac{ab}{a+b}$'
        rationale: |
          This uses a sum in place of the shared factor. This resembles a formula for combined work times. Check which relationship belongs to factors and multiples.
    explanation: |
      For two positive integers, $\gcd(a,b)\operatorname{lcm}(a,b)=ab$. Divide both sides by the positive GCF. This gives $\operatorname{lcm}(a,b)=\dfrac{ab}{\gcd(a,b)}$.
    approved: false

  - id: q-arithmetic-number-sense-prime-factorization-gcf-lcm-0020
    type: error-spotting
    difficulty: exam
    stem: |
      A student factors $48=2^4\times3$ and $180=2^2\times3^2\times5$, then says their GCF is $2^4\times3^2$. What correction is needed?
    choices:
      - text: 'Use $2^2\times3$.'
        correct: true
      - text: 'Include $5$ in the proposed product.'
        rationale: |
          This includes a factor found in only one number. Five appears in one factorization. Check that every GCF factor is shared.
      - text: 'Use $2^4\times3^2\times5$.'
        rationale: |
          This finds the LCM instead of the GCF. The largest powers combine both factorizations. Check which quantity is requested.
      - text: 'Multiply $48$ by $180$ instead.'
        rationale: |
          This uses the product as a common factor. The product contains both numbers' factors. Check that a common factor divides both numbers.
    explanation: |
      A shared factor cannot use a higher exponent than either number contains. For $2$, use the smaller exponent $2$. For $3$, use the smaller exponent $1$. The GCF is $2^2(3)=12$.
    approved: false
