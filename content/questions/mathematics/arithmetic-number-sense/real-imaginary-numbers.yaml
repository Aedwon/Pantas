meta:
  subject: mathematics
  topic: arithmetic-number-sense
  subtopic: real-imaginary-numbers
  exams: [upcat, acet, dlsucet, ustet, pupcet, cse-pro, cse-sub]
questions:
  - id: q-arithmetic-number-sense-real-imaginary-numbers-0001
    type: which-is-true
    difficulty: easy
    stem: |
      Using the convention $\mathbb{N}=\{1,2,3,\ldots\}$ for natural numbers, which number belongs to the set of whole numbers but not to the set of natural numbers?
    choices:
      - text: '$0$'
        correct: true
      - text: '$1$'
        rationale: |
          Under the stated convention, $1$ is both a whole number and a natural number.
      - text: '$-1$'
        rationale: |
          Negative integers are not whole numbers.
      - text: '$\frac{1}{2}$'
        rationale: |
          A non-integer fraction is not a whole number.
    explanation: |
      Under the convention stated in the stem, natural numbers are $1,2,3,\ldots$, while whole numbers are $0,1,2,3,\ldots$. Therefore, $0$ is whole but not natural. The convention is stated explicitly because some texts include $0$ among the natural numbers.

  - id: q-arithmetic-number-sense-real-imaginary-numbers-0002
    type: which-is-true
    difficulty: easy
    stem: |
      Which of the following numbers is an irrational number?
    choices:
      - text: '$\sqrt{7}$'
        correct: true
      - text: '$\sqrt{9}$'
        rationale: |
          $\sqrt{9}=3$, which is rational.
      - text: '$0.75$'
        rationale: |
          $0.75=\frac34$, so it is rational.
      - text: '$-\frac{5}{3}$'
        rationale: |
          This is already written as a ratio of two integers, so it is rational.
    explanation: |
      Since $7$ is not a perfect square, $\sqrt7$ is irrational. The other choices are rational numbers.

  - id: q-arithmetic-number-sense-real-imaginary-numbers-0003
    type: direct-computation
    difficulty: easy
    stem: |
      What is the simplified value of $i^2$?
    choices:
      - text: '$-1$'
        correct: true
      - text: '$1$'
        rationale: |
          $1$ is the value of $i^4$, not $i^2$.
      - text: '$i$'
        rationale: |
          $i$ is $i^1$.
      - text: '$-i$'
        rationale: |
          $-i$ is $i^3$.
    explanation: |
      By definition, $i^2=-1$.

  - id: q-arithmetic-number-sense-real-imaginary-numbers-0004
    type: direct-computation
    difficulty: easy
    stem: |
      Add the complex numbers $(4 + 5i)$ and $(3 - 2i)$.
    choices:
      - text: '$7 + 3i$'
        correct: true
      - text: '$7 + 7i$'
        rationale: |
          The imaginary parts are $5i+(-2i)=3i$.
      - text: '$1 + 3i$'
        rationale: |
          The real parts are added, not subtracted.
      - text: '$12 - 10i$'
        rationale: |
          That comes from multiplying rather than adding.
    explanation: |
      Add like parts: $(4+3)+(5i-2i)=7+3i$.

  - id: q-arithmetic-number-sense-real-imaginary-numbers-0005
    type: direct-computation
    difficulty: easy
    stem: |
      Subtract $(6 - 3i)$ from $(10 + 2i)$.
    choices:
      - text: '$4 + 5i$'
        correct: true
      - text: '$4 - i$'
        rationale: |
          Subtracting $-3i$ gives $+3i$.
      - text: '$16 - i$'
        rationale: |
          The real parts must be subtracted: $10-6=4$.
      - text: '$4 - 5i$'
        rationale: |
          The imaginary part is $2i-(-3i)=5i$.
    explanation: |
      $(10+2i)-(6-3i)=4+5i$.

  - id: q-arithmetic-number-sense-real-imaginary-numbers-0006
    type: direct-computation
    difficulty: medium
    stem: |
      What is the simplified value of $i^{57}$?
    choices:
      - text: '$i$'
        correct: true
      - text: '$-1$'
        rationale: |
          That corresponds to an exponent congruent to $2$ modulo $4$.
      - text: '$-i$'
        rationale: |
          That corresponds to an exponent congruent to $3$ modulo $4$.
      - text: '$1$'
        rationale: |
          That corresponds to an exponent divisible by $4$.
    explanation: |
      Powers of $i$ repeat every four exponents. Since $57\equiv1\pmod4$, $i^{57}=i$.

  - id: q-arithmetic-number-sense-real-imaginary-numbers-0007
    type: error-spotting
    difficulty: medium
    stem: |
      A student simplified $\sqrt{-16} \times \sqrt{-25}$ as follows:
      Step 1: $\sqrt{-16} \times \sqrt{-25} = \sqrt{(-16)(-25)}$
      Step 2: $\sqrt{400} = 20$
      What error did the student make?
    choices:
      - text: They multiplied the negative numbers inside the roots before removing $i$.
        correct: true
      - text: They squared $20$ incorrectly in Step 2.
      - text: They should have added the roots instead of multiplying them.
      - text: They incorrectly simplified $\sqrt{400}$ to $20$.
    explanation: |
      In the complex-number setting, $\sqrt{-16}=4i$ and $\sqrt{-25}=5i$, so the product is $20i^2=-20$. The familiar identity $\sqrt a\sqrt b=\sqrt{ab}$ cannot be applied indiscriminately when both radicands are negative.

  - id: q-arithmetic-number-sense-real-imaginary-numbers-0008
    type: direct-computation
    difficulty: medium
    stem: |
      Multiply the complex numbers $(3 + 2i)$ and $(4 - 5i)$.
    choices:
      - text: '$22 - 7i$'
        correct: true
      - text: '$2 - 7i$'
        rationale: |
          The term $-10i^2$ equals $+10$.
      - text: '$12 - 10i$'
        rationale: |
          You must distribute every term in the first factor across every term in the second.
      - text: '$22 + 7i$'
        rationale: |
          $-15i+8i=-7i$.
    explanation: |
      $(3+2i)(4-5i)=12-15i+8i-10i^2=22-7i$.

  - id: q-arithmetic-number-sense-real-imaginary-numbers-0009
    type: direct-computation
    difficulty: medium
    stem: |
      What is the product of $(5 - 3i)$ and its complex conjugate?
    choices:
      - text: '$34$'
        correct: true
      - text: '$16$'
        rationale: |
          A number times its conjugate gives $a^2+b^2$, not $a^2-b^2$.
      - text: '$34 - 30i$'
        rationale: |
          The imaginary terms cancel in a conjugate product.
      - text: '$25 - 9i$'
        rationale: |
          The last term involves $i^2=-1$.
    explanation: |
      $(5-3i)(5+3i)=5^2+3^2=34$.

  - id: q-arithmetic-number-sense-real-imaginary-numbers-0010
    type: which-is-true
    difficulty: medium
    stem: |
      Which statement about complex numbers is always true?
    choices:
      - text: Every real number is a complex number with an imaginary part of zero.
        correct: true
      - text: The product of two imaginary numbers is always an imaginary number.
        rationale: |
          For example, $(2i)(3i)=-6$, which is real.
      - text: The sum of two irrational numbers is always an irrational number.
        rationale: |
          For example, $\sqrt2+(-\sqrt2)=0$.
      - text: The square of any complex number is a positive real number.
        rationale: |
          For example, $i^2=-1$.
    explanation: |
      Every real number $a$ can be written as the complex number $a+0i$.

  - id: q-arithmetic-number-sense-real-imaginary-numbers-0011
    type: direct-computation
    difficulty: hard
    stem: |
      Simplify the quotient $\frac{4 + 2i}{3 - i}$ into standard $a + bi$ form.
    choices:
      - text: '$1 + i$'
        correct: true
      - text: '$1 - i$'
        rationale: |
          Multiplying by the conjugate gives a positive imaginary part here.
      - text: '$\frac{5}{4} + \frac{1}{2}i$'
        rationale: |
          $(3-i)(3+i)=10$, not $8$.
      - text: '$\frac{7}{5} + \frac{1}{5}i$'
        rationale: |
          Recheck the expanded numerator.
    explanation: |
      Multiply numerator and denominator by $3+i$:
      $$\frac{(4+2i)(3+i)}{(3-i)(3+i)}=\frac{10+10i}{10}=1+i.$$

  - id: q-arithmetic-number-sense-real-imaginary-numbers-0012
    type: direct-computation
    difficulty: hard
    stem: |
      Evaluate the sum of the powers of $i$:
      $$i + i^2 + i^3 + i^4 + i^5 + \dots + i^{99}$$
    choices:
      - text: '$-1$'
        correct: true
      - text: '$0$'
        rationale: |
          The first 96 terms cancel in blocks of four, but three terms remain.
      - text: '$i$'
        rationale: |
          Three powers remain, not one.
      - text: '$1$'
        rationale: |
          A complete block of four sums to zero.
    explanation: |
      Each block $i+i^2+i^3+i^4$ sums to zero. The first 96 terms form 24 such blocks, leaving $i^{97}+i^{98}+i^{99}=i-1-i=-1$.

  - id: q-arithmetic-number-sense-real-imaginary-numbers-0013
    type: direct-computation
    difficulty: hard
    stem: |
      If $x = 2 - i$, what is the value of $x^2 - 4x + 5$?
    choices:
      - text: '$0$'
        correct: true
      - text: '$2$'
        rationale: |
          Recheck $(2-i)^2=3-4i$.
      - text: '$10 - 8i$'
        rationale: |
          The imaginary parts cancel after subtracting $4x$.
      - text: '$-4$'
        rationale: |
          $-4(2-i)=-8+4i$.
    explanation: |
      $(2-i)^2-4(2-i)+5=(3-4i)+(-8+4i)+5=0$.

  - id: q-arithmetic-number-sense-real-imaginary-numbers-0014
    type: direct-computation
    difficulty: hard
    stem: |
      Simplify the expression:
      $$\dfrac{\sqrt{-36} \cdot \sqrt{-4}}{\sqrt{-16}}$$
    choices:
      - text: '$3i$'
        correct: true
      - text: '$-3i$'
        rationale: |
          Since $1/i=-i$, the final sign is positive.
      - text: '$-3$'
        rationale: |
          Each negative square root contributes a factor of $i$.
      - text: '$3$'
        rationale: |
          The expression remains imaginary after simplification.
    explanation: |
      $\sqrt{-36}=6i$, $\sqrt{-4}=2i$, and $\sqrt{-16}=4i$. Therefore
      $$\frac{(6i)(2i)}{4i}=\frac{-12}{4i}=3i.$$

  - id: q-arithmetic-number-sense-real-imaginary-numbers-0015
    type: direct-computation
    difficulty: hard
    stem: |
      Compute the product of the complex numbers $z_1=4+3i$ and $z_2=2-5i$.
    choices:
      - text: '$23 - 14i$'
        correct: true
      - text: '$8 - 15i$'
        rationale: |
          Multiplying two binomials requires all four cross-products.
      - text: '$23 + 14i$'
        rationale: |
          $-20i+6i=-14i$.
      - text: '$-7 - 14i$'
        rationale: |
          The term $-15i^2$ equals $+15$.
    explanation: |
      $(4+3i)(2-5i)=8-20i+6i-15i^2=23-14i$.
