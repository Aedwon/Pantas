meta:
  subject: mathematics
  topic: arithmetic-number-sense
  subtopic: real-imaginary-numbers
  exams: [upcat, acet, dlsucet, ustet, pupcet, cse-pro, cse-sub]
questions:
  - id: q-arithmetic-number-sense-real-imaginary-numbers-0001
    type: which-is-true
    difficulty: easy
    stem: |
      Using the convention $\mathbb{N}=\{1,2,3,\ldots\}$ for natural numbers, which number belongs to the set of whole numbers but not to the set of natural numbers?
    choices:
      - text: '$0$'
        correct: true
      - text: '$1$'
        rationale: |
          This excludes one from the natural numbers. One is the first number of the stated natural set. Check the stated start of the natural numbers.
      - text: '$-1$'
        rationale: |
          This includes negative integers among whole numbers. Negative numbers are integers. Check that whole numbers are nonnegative integers.
      - text: '$\dfrac{1}{2}$'
        rationale: |
          This treats a fraction between zero and one as whole. The fraction is positive. Check that whole numbers have no fractional part.
    explanation: |
      Under the stated convention, natural numbers start at $1$. Whole numbers start at $0$. Thus $0$ is whole but not natural.

  - id: q-arithmetic-number-sense-real-imaginary-numbers-0002
    type: which-is-true
    difficulty: easy
    stem: |
      Which of the following numbers is an irrational number?
    choices:
      - text: '$\sqrt{7}$'
        correct: true
      - text: '$\sqrt{9}$'
        rationale: |
          This assumes a square root is always irrational. The radical sign looks unfamiliar. Check whether the radicand is a perfect square.
      - text: '$0.75$'
        rationale: |
          This treats a terminating decimal as irrational. Its digits include a decimal point. Check that terminating decimals can be written as fractions.
      - text: '$-\dfrac{5}{3}$'
        rationale: |
          This treats a negative fraction as irrational. The numerator is negative. Check the integer-ratio definition of rational numbers.
    explanation: |
      Seven is an integer that is not a perfect square. Its square root cannot be written as a ratio of two integers, so $\sqrt{7}$ is irrational.

  - id: q-arithmetic-number-sense-real-imaginary-numbers-0003
    type: direct-computation
    difficulty: easy
    stem: |
      What is the simplified value of $i^2$?
    choices:
      - text: '$-1$'
        correct: true
      - text: '$1$'
        rationale: |
          This gives the fourth power of i instead of the second. Both powers are in the four-step cycle. Check the exact exponent.
      - text: '$i$'
        rationale: |
          This leaves i unchanged when squaring. The base still appears in the power. Check the defining relation for i squared.
      - text: '$-i$'
        rationale: |
          This uses the third power of i. The third power is another entry in the cycle. Check the position in the cycle.
    explanation: |
      The imaginary unit is defined by $i^2=-1$. Therefore the requested value is $-1$.

  - id: q-arithmetic-number-sense-real-imaginary-numbers-0004
    type: direct-computation
    difficulty: easy
    stem: |
      Add the complex numbers $(4 + 5i)$ and $(3 - 2i)$.
    choices:
      - text: '$7 + 3i$'
        correct: true
      - text: '$7 + 7i$'
        rationale: |
          This adds the magnitude of negative two instead of its signed value. Both imaginary terms are combined. Check the sign of each imaginary coefficient.
      - text: '$1 + 3i$'
        rationale: |
          This subtracts the real parts instead of adding. The operation still uses the correct real parts. Check the requested operation.
      - text: '$12 - 10i$'
        rationale: |
          This multiplies the real parts and imaginary coefficients separately. Multiplying matching parts resembles adding matching parts. Check that the problem asks for addition, not multiplication.
    explanation: |
      Add the real parts: $4+3=7$. Add the imaginary coefficients: $5-2=3$. The sum is $7+3i$.

  - id: q-arithmetic-number-sense-real-imaginary-numbers-0005
    type: direct-computation
    difficulty: easy
    stem: |
      Subtract $(6 - 3i)$ from $(10 + 2i)$.
    choices:
      - text: '$4 + 5i$'
        correct: true
      - text: '$4 - i$'
        rationale: |
          This leaves the imaginary sign unchanged after subtraction. The original bracket contains negative three i. Check that subtraction changes both signs in the second bracket.
      - text: '$16 - i$'
        rationale: |
          This adds the two complex numbers. The same components are combined. Check the operation before combining parts.
      - text: '$4 - 5i$'
        rationale: |
          This reverses the subtraction only for the imaginary coefficients. The negative imaginary coefficient is visible. Check the same subtraction direction for both parts.
    explanation: |
      Write the subtraction as $(10+2i)-(6-3i)$. Distribute the minus: $10+2i-6+3i$. Combine like parts to get $4+5i$.

  - id: q-arithmetic-number-sense-real-imaginary-numbers-0006
    type: direct-computation
    difficulty: medium
    stem: |
      What is the simplified value of $i^{57}$?
    choices:
      - text: '$i$'
        correct: true
      - text: '$-1$'
        rationale: |
          This treats the power as i squared regardless of its exponent. The definition of i uses its square. Check the remainder after dividing the exponent by four.
      - text: '$-i$'
        rationale: |
          This uses only the last digit seven as the exponent. The last digit is an easy shortcut. Check the whole exponent, not only its final digit.
      - text: '$1$'
        rationale: |
          This discards the remaining exponent after complete four-step cycles. Four-step blocks do reduce to one. Check whether any exponent remains after the full cycles.
    explanation: |
      The powers repeat every four steps. Since $57=4(14)+1$, its power matches $i^1=i$.

  - id: q-arithmetic-number-sense-real-imaginary-numbers-0007
    type: error-spotting
    difficulty: medium
    stem: |
      Using principal square roots, a student simplified $\sqrt{-16} \times \sqrt{-25}$ as follows:
      Step 1: $\sqrt{-16} \times \sqrt{-25} = \sqrt{(-16)(-25)}$
      Step 2: $\sqrt{400} = 20$
      What error did the student make?
    choices:
      - text: 'They used the real-root product rule.'
        correct: true
      - text: 'They squared $20$ incorrectly in Step 2.'
        rationale: |
          This blames the second line as a squaring step. The numerical twenty appears in the last line. Check what operation the second line actually performs.
      - text: 'They should have added the roots instead of multiplying them.'
        rationale: |
          This changes the operation from multiplication to addition. Both operations combine two numbers. Check the operation in the original expression.
      - text: 'They incorrectly simplified $\sqrt{400}$ to $20$.'
        rationale: |
          This rejects the correct positive square root of four hundred. A negative root appeared earlier. Check which line first changes the value.
    explanation: |
      The rule used in Step 1 does not hold for two negative radicands in the complex number system. Write the roots as $4i$ and $5i$. Their product is $20i^2=-20$. This shows why applying that real-root product rule here changes the value.

  - id: q-arithmetic-number-sense-real-imaginary-numbers-0008
    type: direct-computation
    difficulty: medium
    stem: |
      Multiply the complex numbers $(3 + 2i)$ and $(4 - 5i)$.
    choices:
      - text: '$22 - 7i$'
        correct: true
      - text: '$2 - 7i$'
        rationale: |
          This treats i squared as positive one. The square resembles an ordinary positive square. Check that i squared equals negative one.
      - text: '$12 - 10i$'
        rationale: |
          This omits the cross terms and replaces i squared with i. The matching components are easy to multiply. Check all four products and the square of i.
      - text: '$22 + 7i$'
        rationale: |
          This reverses the sign of the combined imaginary coefficient. The magnitude seven is correct. Check the signs when combining the imaginary terms.
    explanation: |
      Expand all four products: $(3+2i)(4-5i)=12-15i+8i-10i^2$. Use $i^2=-1$, so the real terms give $12+10=22$. The imaginary terms give $-15i+8i=-7i$. The result is $22-7i$.

  - id: q-arithmetic-number-sense-real-imaginary-numbers-0009
    type: direct-computation
    difficulty: medium
    stem: |
      What is the product of $(5 - 3i)$ and its complex conjugate?
    choices:
      - text: '$34$'
        correct: true
      - text: '$16$'
        rationale: |
          This treats i squared as positive one. The conjugate formula resembles a difference of squares. Check the defining square of i.
      - text: '$16-30i$'
        rationale: |
          This squares the original number instead of multiplying by its conjugate. The original number is stated directly. Check that the conjugate changes the imaginary sign.
      - text: '$25$'
        rationale: |
          This drops the imaginary parts from both factors. The real parts are meaningful components. Check every component in the product.
    explanation: |
      The conjugate is $5+3i$. Multiply: $(5-3i)(5+3i)=25-9i^2$. With $i^2=-1$, this is $25+9=34$.

  - id: q-arithmetic-number-sense-real-imaginary-numbers-0010
    type: which-is-true
    difficulty: medium
    stem: |
      Which statement about complex numbers is always true?
    choices:
      - text: 'Every real number has form $a+0i$.'
        correct: true
      - text: 'The product of two imaginary numbers is always an imaginary number.'
        rationale: |
          This assumes a product keeps both imaginary factors imaginary. Both starting factors contain i. Check the product of two simple multiples of i.
      - text: 'The sum of two irrational numbers is always an irrational number.'
        rationale: |
          This assumes irrationality is preserved by every addition. Both starting numbers are irrational. Check opposite irrational numbers as a counterexample.
      - text: 'The square of any complex number is a positive real number.'
        rationale: |
          This assumes squaring any complex number produces a positive real. Ordinary real squares are nonnegative. Check the example i squared.
    explanation: |
      A complex number has form $a+bi$ with real $a$ and $b$. For any real number $a$, take $b=0$. The form becomes $a+0i=a$, so every real number is complex.

  - id: q-arithmetic-number-sense-real-imaginary-numbers-0011
    type: direct-computation
    difficulty: hard
    stem: |
      Simplify the quotient $\dfrac{4 + 2i}{3 - i}$ into standard $a + bi$ form.
    choices:
      - text: '$1+i$'
        correct: true
      - text: '$1-i$'
        rationale: |
          This reverses the sign of the final imaginary coefficient. Conjugation does reverse an imaginary sign. Check the sign of the expanded imaginary numerator.
      - text: '$\dfrac{5}{4}+\dfrac{5}{4}i$'
        rationale: |
          This evaluates the denominator as nine minus one instead of nine plus one. The denominator contains a minus sign. Check that minus i squared is positive one.
      - text: '$\dfrac{7}{5}+\dfrac{1}{5}i$'
        rationale: |
          This uses three minus i in the numerator instead of the conjugate three plus i. The original denominator is easy to copy. Check that the multiplying factor is the denominator conjugate.
    explanation: |
      Multiply both parts of the quotient by $3+i$. The numerator is $(4+2i)(3+i)=12+10i+2i^2=10+10i$. The denominator is $(3-i)(3+i)=9-i^2=10$. Divide each term by $10$ to get $1+i$.

  - id: q-arithmetic-number-sense-real-imaginary-numbers-0012
    type: direct-computation
    difficulty: hard
    stem: |
      Evaluate the sum of the powers of $i$:
      $i + i^2 + i^3 + i^4 + i^5 + \dots + i^{99}$
    choices:
      - text: '$-1$'
        correct: true
      - text: '$0$'
        rationale: |
          This assumes all ninety-nine terms form complete four-term blocks. The cancellation pattern covers most terms. Check the remainder when ninety-nine is divided by four.
      - text: '$i$'
        rationale: |
          This keeps only the first of the three leftover terms. The remainder begins with i. Check all leftover terms.
      - text: '$-i$'
        rationale: |
          This keeps only the last leftover power. The final term is i to the ninety-ninth power. Check all three remaining terms.
    explanation: |
      Each block of four consecutive powers sums to $i-1-i+1=0$. The first $96$ terms form $24$ complete blocks. The last three terms are $i^{97}+i^{98}+i^{99}=i-1-i=-1$.

  - id: q-arithmetic-number-sense-real-imaginary-numbers-0013
    type: direct-computation
    difficulty: hard
    stem: |
      If $x = 2 - i$, what is the value of $x^2 - 4x + 5$?
    choices:
      - text: '$0$'
        correct: true
      - text: '$2$'
        rationale: |
          This treats i squared as positive one when expanding the square. An ordinary square is nonnegative. Check the defining square of i.
      - text: '$16-8i$'
        rationale: |
          This adds four x instead of subtracting it. The same factor four is still used. Check the minus sign before four x.
      - text: '$-5$'
        rationale: |
          This omits the final constant five. The variable terms cancel neatly. Check every term in the original expression.
    explanation: |
      First $(2-i)^2=4-4i+i^2=3-4i$. Next, $-4(2-i)=-8+4i$. Add the final $5$: $(3-4i)+(-8+4i)+5=0$.

  - id: q-arithmetic-number-sense-real-imaginary-numbers-0014
    type: direct-computation
    difficulty: hard
    stem: |
      Simplify the expression:
      $\dfrac{\sqrt{-36} \cdot \sqrt{-4}}{\sqrt{-16}}$
    choices:
      - text: '$3i$'
        correct: true
      - text: '$-3i$'
        rationale: |
          This uses one over i as i. The reciprocal of a unit can seem unchanged. Check that i times its reciprocal equals one.
      - text: '$-3$'
        rationale: |
          This drops the denominator i after evaluating the numerator. The numerator has already become real. Check every factor of i before dividing.
      - text: '$3$'
        rationale: |
          This treats every negative square root as the corresponding positive real root. Positive roots are familiar. Check that negative radicands require complex roots.
    explanation: |
      The principal roots are $\sqrt{-36}=6i$, $\sqrt{-4}=2i$, and $\sqrt{-16}=4i$. The numerator is $(6i)(2i)=12i^2=-12$. The quotient is $\dfrac{-12}{4i}=\dfrac{-3}{i}$. Since $\dfrac{1}{i}=-i$, the result is $3i$.

  - id: q-arithmetic-number-sense-real-imaginary-numbers-0015
    type: direct-computation
    difficulty: hard
    stem: |
      For complex $z$, solve $(4+3i)z=23-14i$.
    choices:
      - text: '$2-5i$'
        correct: true
      - text: '$2+5i$'
        rationale: |
          This reverses the imaginary sign after dividing. The conjugate used during division changes a sign. Check the result by multiplying back by the known factor.
      - text: '$-2-5i$'
        rationale: |
          This reverses the real sign after dividing. The numerator contains a negative imaginary term. Check the result by multiplying back by the known factor.
      - text: '$4+3i$'
        rationale: |
          This reports the known factor rather than the unknown one. The known factor is a complex number from the equation. Check which symbol is being solved for.
    explanation: |
      Divide by the nonzero factor $4+3i$. Multiply numerator and denominator by $4-3i$. The numerator becomes $(23-14i)(4-3i)=92-125i+42i^2=50-125i$. The denominator is $4^2+3^2=25$. Dividing gives $z=2-5i$.

  - id: q-arithmetic-number-sense-real-imaginary-numbers-0016
    type: which-is-true
    difficulty: easy
    stem: |
      For the complex number $3-4i$, what is its imaginary part as defined in $a+bi$?
    choices:
      - text: '$-4$'
        correct: true
      - text: '$-4i$'
        rationale: |
          This gives the entire imaginary term instead of its coefficient. The term does contain i. Check the definition of b in a plus bi.
      - text: '$3$'
        rationale: |
          This gives the real part. Both parts belong to the same number. Check which coefficient multiplies i.
      - text: '$4$'
        rationale: |
          This drops the minus sign from the coefficient. Its magnitude is four. Check the signed coefficient.
    explanation: |
      In $a+bi$, the imaginary part is the real coefficient $b$ of i. Here $3-4i=3+(-4)i$, so the imaginary part is $-4$.
    approved: false

  - id: q-arithmetic-number-sense-real-imaginary-numbers-0017
    type: which-is-true
    difficulty: medium
    stem: |
      For a positive integer $n$, when is $i^n$ purely imaginary?
    choices:
      - text: 'When $n$ is odd.'
        correct: true
      - text: 'When $n$ is even.'
        rationale: |
          This swaps the real and imaginary cycle positions. The cycle alternates the two types. Check the first two powers.
      - text: 'Only when $n$ is a multiple of $4$.'
        rationale: |
          This uses the cycle-reset positions. Multiples of four have a simple value. Check that the value one is real.
      - text: 'Only when $n=2$.'
        rationale: |
          This uses the defining square of i as imaginary. The expression still contains the symbol i before evaluation. Check its simplified value.
    explanation: |
      The cycle is $i,-1,-i,1$. The purely imaginary entries occur at exponents with remainders $1$ or $3$ on division by $4$. Those are exactly the odd exponents.
    approved: false

  - id: q-arithmetic-number-sense-real-imaginary-numbers-0018
    type: direct-computation
    difficulty: medium
    stem: |
      Let $z=3+4i$ and let its conjugate be $\overline z=3-4i$. What is $z+\overline z$?
    choices:
      - text: '$6$'
        correct: true
      - text: '$8i$'
        rationale: |
          This subtracts the conjugate instead of adding it. That operation cancels the real parts. Check the operation sign.
      - text: '$14$'
        rationale: |
          This adds both real coefficients and both imaginary magnitudes as ordinary numbers. All four values look numeric. Check that real and imaginary parts stay separate.
      - text: '$25$'
        rationale: |
          This multiplies by the conjugate instead of adding. That familiar product is a squared-magnitude sum. Check which operation is requested.
    explanation: |
      Add the real parts to get $3+3=6$. The imaginary parts cancel: $4i-4i=0$. The sum is $6$.
    approved: false

  - id: q-arithmetic-number-sense-real-imaginary-numbers-0019
    type: error-spotting
    difficulty: hard
    stem: |
      A student expands $(2+3i)^2$ as $4+9i^2$ and then gets $-5$. What term was omitted?
    choices:
      - text: '$12i$'
        correct: true
      - text: '$6i$'
        rationale: |
          This includes only one of the two cross products. One product does equal six i. Check both cross products.
      - text: '$9i$'
        rationale: |
          This reports the square coefficient of three i as a missing cross term. Nine appears in the square. Check which products use one real and one imaginary factor.
      - text: '$-12i$'
        rationale: |
          This makes both cross products negative. The presence of i can suggest a minus sign. Check that both factors in each cross product are positive.
    explanation: |
      The full expansion is $(2+3i)(2+3i)$. Its cross products are $2(3i)=6i$ and $(3i)(2)=6i$. Their sum is $12i$, which was omitted.
    approved: false

  - id: q-arithmetic-number-sense-real-imaginary-numbers-0020
    type: which-is-true
    difficulty: exam
    stem: |
      Which pair consists of two irrational numbers whose product is rational?
    choices:
      - text: '$\sqrt2$ and $\sqrt8$'
        correct: true
      - text: '$\sqrt2$ and $\sqrt3$'
        rationale: |
          This assumes any two irrational roots multiply to a rational number. Some pairs do. Check that the product radicand is a perfect square.
      - text: '$\sqrt3$ and $\sqrt5$'
        rationale: |
          This multiplies two irrational numbers without checking the result. Both factors meet the first condition. Check whether the product root simplifies to a rational number.
      - text: '$\sqrt5$ and $\sqrt7$'
        rationale: |
          This assumes multiplication removes both radical signs. Radical products can simplify. Check whether the product radicand is a perfect square.
    explanation: |
      Both roots have nonsquare integer radicands, so both numbers are irrational. Their product is $\sqrt{2(8)}=\sqrt{16}=4$, which is rational.
    approved: false
