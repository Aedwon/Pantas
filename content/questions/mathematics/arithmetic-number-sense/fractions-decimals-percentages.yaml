meta:
  subject: mathematics
  topic: arithmetic-number-sense
  subtopic: fractions-decimals-percentages
  exams: [upcat, acet, dlsucet, ustet, pupcet, cse-pro, cse-sub]
questions:
  - id: q-arithmetic-number-sense-fractions-decimals-percentages-0001
    type: direct-computation
    difficulty: easy
    stem: |
      What is $\frac{3}{8}$ expressed as a percentage?
    choices:
      - text: "$3.75\\%$"
        rationale: |
          You placed the decimal point incorrectly, dividing by 10 instead of multiplying by 100.
      - text: "$37.5\\%$"
        correct: true
      - text: "$375\\%$"
        rationale: |
          You multiplied by 1000 instead of 100, placing the decimal point two places too far right.
      - text: "$26.7\\%$"
        rationale: |
          You calculated 8 divided by 3 (2.67) and converted it incorrectly.
    explanation: |
      To convert $\frac{3}{8}$ to a percentage:
      1. Divide: $3 \div 8 = 0.375$
      2. Multiply by 100%: $0.375 \times 100\% = 37.5\%$

      Common trap: decimal placement error gives 3.75% or forgetting the decimal shift gives 375%.

  - id: q-arithmetic-number-sense-fractions-decimals-percentages-0002
    type: direct-computation
    difficulty: easy
    stem: |
      Simplify: $\frac{\frac{2}{5} + \frac{1}{3}}{\frac{11}{15}}$
    choices:
      - text: "$\\frac{11}{15}$"
        rationale: |
          You evaluated the numerator sum but forgot to divide by the denominator 11/15.
      - text: "$1$"
        correct: true
      - text: "$\\frac{121}{225}$"
        rationale: |
          You multiplied the numerator 11/15 by the denominator 11/15 instead of dividing.
      - text: "$\\frac{1}{15}$"
        rationale: |
          You subtracted the fractions in the numerator instead of adding them.
    explanation: |
      Numerator: $\frac{2}{5} + \frac{1}{3} = \frac{6 + 5}{15} = \frac{11}{15}$

      Divide: $\frac{\frac{11}{15}}{\frac{11}{15}} = \frac{11}{15} \times \frac{15}{11} = 1$

      Trap: Stopping after evaluating numerator only.

  - id: q-arithmetic-number-sense-fractions-decimals-percentages-0003
    type: word-problem
    difficulty: easy
    stem: |
      A sari-sari store owner buys a box of canned milk for $\text{₱}400$. If the wholesaler offers a 15% discount for cash payments, how much does the store owner pay?
    choices:
      - text: "$\\text{₱}60$"
        rationale: |
          You calculated the discount amount instead of subtracting it from the original price.
      - text: "$\\text{₱}340$"
        correct: true
      - text: "$\\text{₱}360$"
        rationale: |
          You subtracted 10 percent discount (P40) instead of 15 percent discount (P60).
      - text: "$\\text{₱}385$"
        rationale: |
          You subtracted 15 pesos directly from the P400 price instead of calculating 15 percent.
    explanation: |
      Discount amount: $15\% \times \text{₱}400 = 0.15 \times \text{₱}400 = \text{₱}60$

      Amount paid: $\text{₱}400 - \text{₱}60 = \text{₱}340$

      Trap: Giving discount amount instead of final price.

  - id: q-arithmetic-number-sense-fractions-decimals-percentages-0004
    type: direct-computation
    difficulty: easy
    stem: |
      Express $0.444...$ as a fraction in lowest terms, then add $\frac{2}{9}$. What is the simplified result?
    choices:
      - text: "$\\frac{6}{9}$"
        rationale: |
          You added the fractions correctly to get 6/9 but forgot to reduce it to lowest terms.
      - text: "$\\frac{4}{9}$"
        rationale: |
          You converted 0.444... to 4/9 but forgot to add the 2/9 fraction.
      - text: "$\\frac{2}{3}$"
        correct: true
      - text: "$\\frac{44}{99}$"
        rationale: |
          You wrote 0.444... as 44/99 without simplifying it or adding 2/9.
    explanation: |
      The repeating decimal $0.444... = \frac{4}{9}$

      Add: $\frac{4}{9} + \frac{2}{9} = \frac{6}{9}$

      Simplify: $\frac{6}{9} = \frac{2}{3}$

      Trap: Leaving answer unsimplified.

  - id: q-arithmetic-number-sense-fractions-decimals-percentages-0005
    type: word-problem
    difficulty: medium
    stem: |
      A restaurant bill is $\text{₱}850$. A 10% service charge is added, then the customer leaves a 5% tip on the new total. What is the final amount paid?
    choices:
      - text: "$\\text{₱}977.50$"
        rationale: |
          You calculated the 5 percent tip on the original P850 bill instead of the P935 total.
      - text: "$\\text{₱}981.75$"
        correct: true
      - text: "$\\text{₱}935.00$"
        rationale: |
          You added the 10 percent service charge but omitted the 5 percent tip.
      - text: "$\\text{₱}997.50$"
        rationale: |
          You added 15 percent (10% + 5%) directly to the original P850 bill plus an error.
    explanation: |
      Add service charge: $\text{₱}850 \times 1.10 = \text{₱}935$

      Add tip on new total: $\text{₱}935 \times 0.05 = \text{₱}46.75$

      Final total: $\text{₱}935 + \text{₱}46.75 = \text{₱}981.75$

      Trap: Calculating tip on original amount instead of new total.

  - id: q-arithmetic-number-sense-fractions-decimals-percentages-0006
    type: direct-computation
    difficulty: medium
    stem: |
      Evaluate: $0.6 \times \left(\frac{5}{6} - \frac{1}{4}\right) \div 0.35$
    choices:
      - text: "$0.1$"
        rationale: |
          You miscalculated the subtraction inside parentheses as 1/12 instead of 7/12.
      - text: "$0.35$"
        rationale: |
          You calculated 0.6 times 7/12 = 0.35 but stopped before dividing by 0.35.
      - text: "$1$"
        correct: true
      - text: "$\\frac{7}{12}$"
        rationale: |
          You evaluated the expression inside the parentheses but omitted the multiplication and division.
    explanation: |
      Parentheses: $\frac{5}{6} - \frac{1}{4} = \frac{10 - 3}{12} = \frac{7}{12}$

      Multiply: $0.6 \times \frac{7}{12} = \frac{3}{5} \times \frac{7}{12} = \frac{7}{20} = 0.35$

      Divide: $0.35 \div 0.35 = 1$

      Trap: Decimal placement errors or stopping before final division.

  - id: q-arithmetic-number-sense-fractions-decimals-percentages-0007
    type: word-problem
    difficulty: medium
    stem: |
      A sari-sari store owner buys instant noodle packs for $\text{₱}12.50$ and sells for $\text{₱}15.00$. What is the profit percentage based on cost price?
    choices:
      - text: "$16.67\\%$"
        rationale: |
          You divided the P2.50 profit by the selling price P15.00 instead of cost price P12.50.
      - text: "$20\\%$"
        correct: true
      - text: "$25\\%$"
        rationale: |
          You divided P2.50 by P10.00 or miscalculated the profit fraction.
      - text: "$2.50\\%$"
        rationale: |
          You reported the absolute profit amount (P2.50) as a percentage.
    explanation: |
      Profit per pack: $\text{₱}15.00 - \text{₱}12.50 = \text{₱}2.50$

      Profit percentage: $\frac{\text{₱}2.50}{\text{₱}12.50} \times 100\% = 0.20 \times 100\% = 20\%$

      Trap: Using selling price as denominator instead of cost price.

  - id: q-arithmetic-number-sense-fractions-decimals-percentages-0008
    type: word-problem
    difficulty: medium
    stem: |
      A store offers 20% discount plus an additional 10% discount at checkout. What single percentage is equivalent to these successive discounts?
    choices:
      - text: "$30\\%$"
        rationale: |
          You added the two discount percentages directly (20% + 10% = 30%) without compounding them.
      - text: "$28\\%$"
        correct: true
      - text: "$72\\%$"
        rationale: |
          You reported the final paying price percentage (72%) instead of the discount percentage.
      - text: "$18\\%$"
        rationale: |
          You multiplied 20% by 90% or miscalculated the combined discount.
    explanation: |
      After first discount: $100 \times 0.80 = 80$

      After second discount: $80 \times 0.90 = 72$

      Total discount: $100 - 72 = 28\%$

      Trap: Simply adding percentages ($20\% + 10\% = 30\%$) without compounding.

  - id: q-arithmetic-number-sense-fractions-decimals-percentages-0009
    type: direct-computation
    difficulty: medium
    stem: |
      Calculate: $\frac{3}{4} \div 0.125 + 2.5 \times \frac{2}{5}$
    choices:
      - text: "$4$"
        rationale: |
          You subtracted the two terms (6 - 2) or miscalculated the second product.
      - text: "$6.5$"
        rationale: |
          You added 6 and 0.5 instead of evaluating 2.5 times 2/5 as 1.
      - text: "$7$"
        correct: true
      - text: "$8.5$"
        rationale: |
          You multiplied 3/4 by 0.125 (0.09375) or miscalculated the division term.
    explanation: |
      Convert: $0.125 = \frac{1}{8}$ and $2.5 = \frac{5}{2}$

      Division: $\frac{3}{4} \div \frac{1}{8} = \frac{3}{4} \times 8 = 6$

      Multiplication: $\frac{5}{2} \times \frac{2}{5} = 1$

      Sum: $6 + 1 = 7$

      Trap: Multiplying instead of dividing in the first term.

  - id: q-arithmetic-number-sense-fractions-decimals-percentages-0010
    type: word-problem
    difficulty: hard
    stem: |
      An investor deposits $\text{₱}12,000$ in a savings account earning 5.5% simple annual interest. How much total interest is earned after 18 months?
    choices:
      - text: "$\\text{₱}660$"
        rationale: |
          You calculated interest for 1 year (P660) instead of 18 months (1.5 years).
      - text: "$\\text{₱}990$"
        correct: true
      - text: "$\\text{₱}1,188$"
        rationale: |
          You calculated interest for 18 months using 6.6 percent interest rate.
      - text: "$\\text{₱}11,880$"
        rationale: |
          You forgot to divide the percentage by 100, using 0.55 instead of 0.055.
    explanation: |
      Convert time: $18$ months $= \frac{18}{12} = 1.5$ years

      Simple interest formula: $I = P \times r \times t$

      Calculate: $I = \text{₱}12,000 \times 0.055 \times 1.5 = \text{₱}990$

      Trap: Using only 1 year instead of 1.5 years.

  - id: q-arithmetic-number-sense-fractions-decimals-percentages-0011
    type: word-problem
    difficulty: hard
    stem: |
      A sari-sari store owner buys 60 kg of rice for $\text{₱}3,000$ total. She sells $\frac{1}{3}$ at 20% profit, $\frac{1}{2}$ at 10% profit, and the rest at cost. What is her overall profit?
    choices:
      - text: "$\\text{₱}300$"
        rationale: |
          You miscalculated 1/2 of P3,000 as P1,000 or omitted portion of profit.
      - text: "$\\text{₱}350$"
        correct: true
      - text: "$\\text{₱}450$"
        rationale: |
          You calculated 20 percent profit on both 1/3 and 1/2 portions.
      - text: "$\\text{₱}900$"
        rationale: |
          You calculated 30 percent profit on the entire P3,000 cost.
    explanation: |
      Cost per portion:
      - $\frac{1}{3} \times \text{₱}3,000 = \text{₱}1,000$
      - $\frac{1}{2} \times \text{₱}3,000 = \text{₱}1,500$
      - $\frac{1}{6} \times \text{₱}3,000 = \text{₱}500$

      Profit from each:
      - $\text{₱}1,000 \times 0.20 = \text{₱}200$
      - $\text{₱}1,500 \times 0.10 = \text{₱}150$
      - $\text{₱}500 \times 0 = \text{₱}0$

      Total profit: $\text{₱}200 + \text{₱}150 = \text{₱}350$

  - id: q-arithmetic-number-sense-fractions-decimals-percentages-0012
    type: direct-computation
    difficulty: hard
    stem: |
      What percentage of $\frac{5}{6}$ is $\frac{3}{8} + \frac{1}{12}$?
    choices:
      - text: "$45\\%$"
        rationale: |
          You subtracted 55% from 100% or miscalculated the fraction division.
      - text: "$55\\%$"
        correct: true
      - text: "$62.5\\%$"
        rationale: |
          You evaluated 5/8 as a percentage instead of (11/24) / (5/6).
      - text: "$5.5\\%$"
        rationale: |
          You placed the decimal point incorrectly when converting 11/20 to a percentage.
    explanation: |
      Numerator: $\frac{3}{8} + \frac{1}{12} = \frac{9 + 2}{24} = \frac{11}{24}$

      As fraction of $\frac{5}{6}$: $\frac{\frac{11}{24}}{\frac{5}{6}} = \frac{11}{24} \times \frac{6}{5} = \frac{11}{20}$

      As percentage: $\frac{11}{20} \times 100\% = 55\%$

  - id: q-arithmetic-number-sense-fractions-decimals-percentages-0013
    type: word-problem
    difficulty: hard
    stem: |
      After a 20% discount on marked price, a customer paid $\text{₱}672$. This included 12% sales tax on the discounted price. What was the original marked price?
    choices:
      - text: "$\\text{₱}700$"
        rationale: |
          You subtracted 12 percent tax first then added 20 percent discount.
      - text: "$\\text{₱}720$"
        rationale: |
          You divided P672 by 0.933 or miscalculated the combined tax and discount factor.
      - text: "$\\text{₱}750$"
        correct: true
      - text: "$\\text{₱}800$"
        rationale: |
          You calculated P672 / 0.84, treating discount and tax as additive (-20% + 12% = -8%).
    explanation: |
      Let $P$ be original marked price.

      After 20% discount: $0.80P$

      Add 12% tax: $0.80P \times 1.12 = 0.896P$

      Solve: $0.896P = \text{₱}672$

      $P = \frac{\text{₱}672}{0.896} = \text{₱}750$

  - id: q-arithmetic-number-sense-fractions-decimals-percentages-0014
    type: word-problem
    difficulty: exam-level
    stem: |
      A retail store stocks 240 items. Week 1: 35% is sold. Week 2: $\frac{5}{8}$ of remaining is sold. What percentage of original inventory remains unsold?
    choices:
      - text: "$24.375\\%$"
        correct: true
      - text: "$26.25\\%$"
        rationale: |
          You calculated the percentage sold in week 2 (5/8 of 65% = 40.625%) and subtracted 35%.
      - text: "$40.625\\%$"
        rationale: |
          You calculated the percentage sold during week 2 instead of the unsold percentage.
      - text: "$65.00\\%$"
        rationale: |
          You reported the percentage remaining after week 1 without accounting for week 2 sales.
    explanation: |
      After week 1: $100\% - 35\% = 65\%$ remains

      After week 2: $1 - \frac{5}{8} = \frac{3}{8}$ of remaining stock

      Unsold total: $\frac{3}{8} \times 65\% = 0.375 \times 65\% = 24.375\%$

      Trap: Giving week 1 remaining (65%) instead of final unsold percentage.

  - id: q-arithmetic-number-sense-fractions-decimals-percentages-0015
    type: word-problem
    difficulty: exam-level
    stem: |
      A sari-sari store owner increases sugar price by 25%, then reduces by 20%. During repackaging, $\frac{1}{20}$ of weight is lost. Compared to original revenue from original stock at original price, what is the net revenue change?
    choices:
      - text: "$0\\%$"
        rationale: |
          You assumed the +25% and -20% price adjustments returned revenue to normal, ignoring weight loss.
      - text: "$-5\\%$"
        correct: true
      - text: "$+5\\%$"
        rationale: |
          You added 5 percent instead of subtracting the 5 percent loss from inventory reduction.
      - text: "$-9.75\\%$"
        rationale: |
          You miscalculated 1.25 * 0.80 * 0.95 as 0.9025 instead of 0.95.
    explanation: |
      Price after changes: $P \times 1.25 \times 0.80 = 1.00P$ (back to original)

      Weight after loss: $1 - \frac{1}{20} = \frac{19}{20} = 0.95W$

      New revenue: $1.00P \times 0.95W = 0.95(PW)$

      Change: $0.95 - 1.00 = -5\%$ (5% decrease)

      Trap: Assuming price changes cancel out without factoring inventory loss.
