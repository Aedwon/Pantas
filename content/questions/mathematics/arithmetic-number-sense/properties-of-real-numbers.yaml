meta:
  subject: mathematics
  topic: arithmetic-number-sense
  subtopic: properties-of-real-numbers
  exams: [upcat, acet, dlsucet, ustet, pupcet, cse-pro, cse-sub]
questions:
  - id: q-arithmetic-number-sense-properties-of-real-numbers-0001
    type: which-is-true
    difficulty: easy
    stem: |
      Which of the following equations demonstrates the commutative property of addition?
    choices:
      - text: '$7 + 12 = 12 + 7$'
        correct: true
      - text: '$(3 + 5) + 4 = 3 + (5 + 4)$'
        rationale: |
          This treats a grouping change as an order change. Both changes preserve sums. Check whether order or grouping changes.
      - text: '$9 + 0 = 9$'
        rationale: |
          This treats adding zero as swapping addends. Zero does preserve the sum. Check what moves in the equation.
      - text: '$6 + (-6) = 0$'
        rationale: |
          This confuses adding opposite numbers with swapping addends. Opposites do form a useful sum. Check whether the terms change position.
    explanation: |
      The addends $7$ and $12$ swap order. Addition keeps the same sum when its addends swap: $a+b=b+a$. This is the commutative property.

  - id: q-arithmetic-number-sense-properties-of-real-numbers-0002
    type: direct-computation
    difficulty: easy
    stem: |
      What real number $r$ completes the multiplicative inverse equation $-\dfrac{4}{7}r=1$?
    choices:
      - text: '$-\dfrac{7}{4}$'
        correct: true
      - text: '$\dfrac{4}{7}$'
        rationale: |
          This changes the sign instead of taking the reciprocal. The opposite number is an additive inverse. Check that a multiplicative inverse gives product one.
      - text: '$\dfrac{7}{4}$'
        rationale: |
          This drops the negative sign from the reciprocal. A reciprocal does exchange the fraction parts. Check that the product of opposite signs is negative.
      - text: '$-\dfrac{4}{7}$'
        rationale: |
          This keeps the original fraction as its own reciprocal. Some numbers are their own reciprocals. Check the product with the original number.
    explanation: |
      A number and its multiplicative inverse have product $1$. Flip the numerator and denominator of $-\dfrac{4}{7}$ while keeping its sign. The inverse is $-\dfrac{7}{4}$, and their product is $1$.

  - id: q-arithmetic-number-sense-properties-of-real-numbers-0003
    type: direct-computation
    difficulty: easy
    stem: |
      Simplify the expression $4(3x + 7)$ using the distributive property.
    choices:
      - text: '$12x + 28$'
        correct: true
      - text: '$12x + 7$'
        rationale: |
          This multiplies only the first term. The x term was multiplied correctly. Check every term inside the parentheses.
      - text: '$7x + 11$'
        rationale: |
          This adds four to each coefficient instead of multiplying. The outside four seems to affect both terms. Check that distribution uses multiplication.
      - text: '$12x + 11$'
        rationale: |
          This multiplies the first term but adds four to the constant. Both terms appear to have been changed. Check that the same operation reaches every term.
    explanation: |
      Multiply every term inside the parentheses by $4$. This gives $4(3x)+4(7)=12x+28$.

  - id: q-arithmetic-number-sense-properties-of-real-numbers-0004
    type: which-is-true
    difficulty: easy
    stem: |
      Which of the following statements is true regarding real number properties under subtraction?
    choices:
      - text: 'Subtraction is not commutative because $5 - 3 \neq 3 - 5$.'
        correct: true
      - text: 'Subtraction is commutative because the numerical value remains 2.'
        rationale: |
          This ignores the sign difference between two and negative two. Both results have the same magnitude. Check the signed values, not just their magnitudes.
      - text: 'Subtraction is associative because $(8 - 4) - 2 = 8 - (4 - 2)$.'
        rationale: |
          This assumes subtraction can be regrouped freely. Grouping rules work for addition. Check both groupings with actual numbers.
      - text: 'Subtraction has an identity element of 0 because $x - 0 = 0 - x$.'
        rationale: |
          This assumes zero works as an identity on both sides of subtraction. Subtracting zero on the right leaves x unchanged. Check x minus zero and zero minus x separately.
    explanation: |
      The two orders give $5-3=2$ and $3-5=-2$. Because the results differ, subtraction is not commutative.

  - id: q-arithmetic-number-sense-properties-of-real-numbers-0005
    type: which-is-true
    difficulty: medium
    stem: |
      Starting with $1 + (2 + 3)$, which sequence of properties transforms it into $(2 + 1) + 3$?
    choices:
      - text: 'Associative, then commutative.'
        correct: true
      - text: 'Commutative Property of Addition only'
        rationale: |
          This swaps order but does not change the grouping. The target does swap two numbers. Check grouping as well as order.
      - text: 'Associative Property of Addition only'
        rationale: |
          This changes grouping but does not swap the first two addends. The target does have a new grouping. Check order as well as grouping.
      - text: 'Distributive Property, then Additive Identity Property'
        rationale: |
          This uses properties for multiplication and zero addition where neither is present. The expression has parentheses that can suggest distribution. Check which operations actually appear.
    explanation: |
      First change the grouping: $1+(2+3)=(1+2)+3$. This uses associativity. Then swap the first two addends: $(1+2)+3=(2+1)+3$. This uses commutativity.

  - id: q-arithmetic-number-sense-properties-of-real-numbers-0006
    type: direct-computation
    difficulty: medium
    stem: |
      Expand and simplify the expression $-2(x - 5)$.
    choices:
      - text: '$-2x + 10$'
        correct: true
      - text: '$-2x - 10$'
        rationale: |
          This makes the product of two negatives negative. The outer factor is visibly negative. Check both signs in the second product.
      - text: '$-2x - 5$'
        rationale: |
          This multiplies only the first term. The first term is distributed correctly. Check every term inside the parentheses.
      - text: '$2x - 10$'
        rationale: |
          This ignores the negative factor outside the parentheses. A positive factor would give this result. Check the whole outside factor.
    explanation: |
      Multiply each term by $-2$: $(-2)x+(-2)(-5)=-2x+10$. The second product is positive because its two factors are negative.

  - id: q-arithmetic-number-sense-properties-of-real-numbers-0007
    type: direct-computation
    difficulty: medium
    stem: |
      Simplify the algebraic expression $-3(2a + 4b) - 5a$.
    choices:
      - text: '$-11a - 12b$'
        correct: true
      - text: '$-a - 12b$'
        rationale: |
          This subtracts coefficient magnitudes in the wrong order for the a terms. Six and five differ by one. Check that two negative coefficients add their magnitudes.
      - text: '$-11a + 12b$'
        rationale: |
          This drops the negative sign on the b product. The coefficient magnitude is correct. Check the sign of the outside multiplier.
      - text: '$-23ab$'
        rationale: |
          This combines unlike terms into a single product term. All coefficients can be added. Check that only like terms combine.
    explanation: |
      Distribute to get $-6a-12b-5a$. Combine the $a$ terms: $(-6-5)a=-11a$. The result is $-11a-12b$.

  - id: q-arithmetic-number-sense-properties-of-real-numbers-0008
    type: direct-computation
    difficulty: medium
    stem: |
      Evaluate $342 \times 28 + 342 \times 72$ using the distributive property.
    choices:
      - text: '$34,200$'
        correct: true
      - text: '$342,000$'
        rationale: |
          This uses a sum of one thousand instead of one hundred. Multiplying by a power of ten is the last step. Check the sum before multiplying.
      - text: '$3,420$'
        rationale: |
          This uses a sum of ten instead of one hundred. The sum is a round number. Check the sum before multiplying.
      - text: '$9,576$'
        rationale: |
          This evaluates only the first product. That is part of the full expression. Check both products.
    explanation: |
      Factor out $342$: $342(28)+342(72)=342(28+72)$. The sum is $100$, so the product is $342(100)=34200$.

  - id: q-arithmetic-number-sense-properties-of-real-numbers-0009
    type: which-is-true
    difficulty: medium
    stem: |
      Which of the following statements about real number properties is true?
    choices:
      - text: '$x+(-x)=0$ for every real $x$.'
        correct: true
      - text: 'The multiplicative inverse of a negative real number is positive.'
        rationale: |
          This makes the reciprocal of a negative number positive. An additive inverse does change sign. Check that the product must be positive one.
      - text: 'Every real number has a unique multiplicative inverse.'
        rationale: |
          This forgets that zero has no reciprocal. Every nonzero real number has one. Check whether zero is included in the claim.
      - text: 'The additive identity is 1 and the multiplicative identity is 0.'
        rationale: |
          This swaps the two identity values. Both identity properties preserve a number. Check which value preserves each operation.
    explanation: |
      The additive inverse of $x$ is $-x$. Their sum is $x+(-x)=0$. Zero is the additive identity because adding it keeps a number unchanged.

  - id: q-arithmetic-number-sense-properties-of-real-numbers-0010
    type: which-is-true
    difficulty: hard
    stem: |
      A student evaluates $(12 \div 4) \div 2 = 3 \div 2 = 1.5$. They regroup as $12 \div (4 \div 2) = 12 \div 2 = 6$. Which property explains why these results differ?
    choices:
      - text: 'Division is not associative, so changing the grouping alters the result.'
        correct: true
      - text: 'Division is not commutative, so changing the order of operands alters the result.'
        rationale: |
          This treats a grouping change as an order change. Both properties compare equivalent forms. Check whether the sequence of numbers changed.
      - text: 'The Distributive Property fails for division over subtraction.'
        rationale: |
          This uses a distribution rule where no sum or difference is grouped. Parentheses can suggest distribution. Check whether multiplication over a sum appears.
      - text: 'Division lacks a real identity element.'
        rationale: |
          This blames identity instead of grouping. Identity is another named property. Check what changed between the expressions.
    explanation: |
      Grouping the first division gives $(12\div4)\div2=3\div2=1.5$. Grouping the second gives $12\div(4\div2)=12\div2=6$. Regrouping changes the result, so division is not associative.

  - id: q-arithmetic-number-sense-properties-of-real-numbers-0011
    type: direct-computation
    difficulty: hard
    stem: |
      Fully simplify the algebraic expression $-4(3x - 2y) - 2(5y - 6x)$.
    choices:
      - text: '$-2y$'
        correct: true
      - text: '$-24x-2y$'
        rationale: |
          This makes the second x product negative instead of positive. The second bracket contains a negative x term. Check both negatives in that product.
      - text: '$-24x+18y$'
        rationale: |
          This distributes positive two instead of negative two in the second product. The written two is part of the second factor. Check the sign of the outer multiplier.
      - text: '$-18y$'
        rationale: |
          This makes the first y product negative instead of positive. The y term starts with a minus inside the first bracket. Check both negatives in that product.
    explanation: |
      Expand both products: $-4(3x-2y)=-12x+8y$ and $-2(5y-6x)=-10y+12x$. Add them: $-12x+12x+8y-10y=-2y$.

  - id: q-arithmetic-number-sense-properties-of-real-numbers-0012
    type: which-is-true
    difficulty: hard
    stem: |
      Which of the following standard sets of numbers is not closed under subtraction?
    choices:
      - text: 'Natural numbers $\mathbb{N} = \{1, 2, 3, \ldots\}$'
        correct: true
      - text: 'Integers $\mathbb{Z}$'
        rationale: |
          This treats negative subtraction results as outside the integers. Negative results do leave the positive natural numbers. Check that integers include negative numbers.
      - text: 'Rational numbers $\mathbb{Q}$'
        rationale: |
          This assumes a difference of fractions may stop being rational. Fractions can have different denominators. Check the common-denominator form of a difference.
      - text: 'Real numbers $\mathbb{R}$'
        rationale: |
          This assumes real subtraction can produce a nonreal result. Some operations on real inputs can leave the reals. Check that subtracting real numbers stays real.
    explanation: |
      A set is closed under subtraction when subtracting any two of its members stays within the set. The natural numbers here are positive integers. Subtracting $5$ from $3$ gives $-2$, outside that set. This shows it is not closed under subtraction.

  - id: q-arithmetic-number-sense-properties-of-real-numbers-0013
    type: direct-computation
    difficulty: hard
    stem: |
      Evaluate the expression $87 \times (-14) + 87 \times 114 - 87 \times 100$ using the distributive property.
    choices:
      - text: '$0$'
        correct: true
      - text: '$8700$'
        rationale: |
          This omits the last subtracted product. The first two products do combine neatly. Check every original term.
      - text: '$1218$'
        rationale: |
          This omits the first negative product. The remaining difference is easy to form. Check every original term.
      - text: '$2436$'
        rationale: |
          This changes the first factor negative fourteen to positive fourteen. The magnitude fourteen is still used. Check the sign on the original factor.
    explanation: |
      Factor out $87$: $87[(-14)+114-100]$. The bracket equals $100-100=0$. Thus the product is $87(0)=0$.

  - id: q-arithmetic-number-sense-properties-of-real-numbers-0014
    type: which-is-true
    difficulty: exam
    stem: |
      Consider the step-by-step simplification:

      Line 1: $5 + (2x + 6) = 17$
      Line 2: $(5 + 2x) + 6 = 17$
      Line 3: $(2x + 5) + 6 = 17$
      Line 4: $2x + (5 + 6) = 17$

      Which property justifies the step from Line 2 to Line 3?
    choices:
      - text: 'Commutative property'
        correct: true
      - text: 'Associative Property of Addition'
        rationale: |
          This treats swapped addends as a grouping change. Both order and grouping changes preserve addition. Check whether the parentheses actually moved.
      - text: 'Distributive Property'
        rationale: |
          This mistakes addition for multiplication over a group. The parentheses make the expression look grouped for distribution. Check whether an outside factor is multiplied in.
      - text: 'Additive Identity Property'
        rationale: |
          This looks for an identity value although none is added. Identity is one of the named properties. Check whether zero is being added.
    explanation: |
      Line 2 groups $5+2x$, and Line 3 groups $2x+5$. The addends swap order while the grouping stays the same. This is the commutative property of addition.

  - id: q-arithmetic-number-sense-properties-of-real-numbers-0015
    type: direct-computation
    difficulty: exam
    stem: |
      Simplify $-\dfrac{3}{4}(8x-12y)+\dfrac{1}{2}(6x-4y)-5(x-y)$.
    choices:
      - text: '$-8x+12y$'
        correct: true
      - text: '$-8x+2y$'
        rationale: |
          This makes the final y product negative. The last inner y term is negative. Check both negatives in the final product.
      - text: '$2x+2y$'
        rationale: |
          This changes the last outer factor from negative five to positive five. The last multiplier contains a minus sign. Check the complete final factor.
      - text: '$-8x+39y$'
        rationale: |
          This omits division by four in the first y product, giving thirty-six y. The numerator three is still multiplied by twelve. Check that the full fractional factor multiplies each term.
    explanation: |
      The first product is $-6x+9y$. The second is $3x-2y$. The third is $-5x+5y$. Combine the $x$ terms: $-6+3-5=-8$. Combine the $y$ terms: $9-2+5=12$. The result is $-8x+12y$.

  - id: q-arithmetic-number-sense-properties-of-real-numbers-0016
    type: word-problem
    difficulty: easy
    stem: |
      A class buys $99$ notebooks at $17$ pesos each, then adds one more at the same price. Which expression uses distribution to give the total cost?
    choices:
      - text: '$17(99+1)$'
        correct: true
      - text: '$99(17+1)$'
        rationale: |
          This adds the extra notebook to the price instead of the count. Both amounts increase the purchase. Check which number counts notebooks.
      - text: '$17+99+1$'
        rationale: |
          This adds counts and price without multiplication. All three numbers appear in the stem. Check that each notebook has a cost.
      - text: '$17(99)+1$'
        rationale: |
          This treats the extra notebook as costing one peso. One is the added count. Check that it also costs seventeen pesos.
    explanation: |
      Both purchases have the same price per notebook. Factor that price from $17(99)+17(1)$ to get $17(99+1)$.
    approved: false

  - id: q-arithmetic-number-sense-properties-of-real-numbers-0017
    type: error-spotting
    difficulty: medium
    stem: |
      A student expands $5(2x-3)$ as $10x-3$. What correction is needed?
    choices:
      - text: 'Multiply the constant by $5$ too.'
        correct: true
      - text: 'Divide the constant by $5$ instead.'
        rationale: |
          This uses division on one term while distributing multiplication. The outside five is still used. Check that the same multiplication applies to both terms.
      - text: 'Multiply only the $x$ by $5$.'
        rationale: |
          This repeats the partial distribution. The x term is already correct. Check that the constant is inside the same group.
      - text: 'Change both minus signs to plus.'
        rationale: |
          This changes the sign without a negative outside factor. Distribution can change signs when negatives multiply. Check the sign of the actual factor.
    explanation: |
      The outside factor multiplies every term inside. It gives $5(2x)=10x$ and $5(-3)=-15$. The corrected expression is $10x-15$.
    approved: false

  - id: q-arithmetic-number-sense-properties-of-real-numbers-0018
    type: which-is-true
    difficulty: medium
    stem: |
      Which equality demonstrates associativity of multiplication?
    choices:
      - text: '$(2\times3)\times5=2\times(3\times5)$'
        correct: true
      - text: '$(2\times3)\times5=(3\times2)\times5$'
        rationale: |
          This identifies a change in order as associativity. Both changes preserve multiplication. Check whether factors move or only parentheses move.
      - text: '$2\times(3+5)=(2\times3)+(2\times5)$'
        rationale: |
          This confuses distribution with association. Both use parentheses. Check whether multiplication spreads over addition.
      - text: '$(2\times3)\times1=(2\times3)$'
        rationale: |
          This confuses identity with association. Both preserve a value. Check whether the grouping of several factors changes.
    explanation: |
      Associativity changes how the same ordered factors are grouped. The equality moves the parentheses from the first two factors to the last two without changing their order.
    approved: false

  - id: q-arithmetic-number-sense-properties-of-real-numbers-0019
    type: direct-computation
    difficulty: hard
    stem: |
      What is the additive inverse of the multiplicative inverse of $-\dfrac{2}{3}$?
    choices:
      - text: '$\dfrac{3}{2}$'
        correct: true
      - text: '$-\dfrac{3}{2}$'
        rationale: |
          This stops after the reciprocal. That is the required first step. Check that an additive inverse is still requested.
      - text: '$\dfrac{2}{3}$'
        rationale: |
          This takes only the opposite of the original fraction. Opposites are additive inverses. Check that the reciprocal must be found first.
      - text: '$-\dfrac{2}{3}$'
        rationale: |
          This makes neither inverse change. The original fraction is already given. Check both requested operations.
    explanation: |
      First take the reciprocal: the multiplicative inverse is $-\dfrac{3}{2}$. Then take its opposite: the additive inverse is $\dfrac{3}{2}$.
    approved: false

  - id: q-arithmetic-number-sense-properties-of-real-numbers-0020
    type: which-is-true
    difficulty: exam
    stem: |
      A student asks for a real number $r$ such that $0r=1$. Which statement is correct?
    choices:
      - text: 'There is no such real number.'
        correct: true
      - text: '$r=0$ is the required number.'
        rationale: |
          This treats zero as its own reciprocal. Zero is its own additive inverse. Check that a reciprocal must give product one.
      - text: '$r=1$ is the required number.'
        rationale: |
          This treats the multiplicative identity as the inverse of zero. One preserves other factors. Check the product with zero.
      - text: '$r=-1$ is the required number.'
        rationale: |
          This treats negative one as changing a zero product into one. Negative one changes signs of nonzero numbers. Check that zero times it is still zero.
    explanation: |
      Multiplying zero by any real number gives zero. The equation $0r=1$ therefore has no real solution. This is why zero has no multiplicative inverse.
    approved: false
