meta:
  subject: mathematics
  topic: arithmetic-number-sense
  subtopic: properties-of-real-numbers
  exams: [upcat, acet, dlsucet, ustet, pupcet, cse-pro, cse-sub]
questions:
  - id: q-arithmetic-number-sense-properties-of-real-numbers-0001
    type: which-is-true
    difficulty: easy
    stem: |
      Which of the following equations demonstrates the commutative property of addition?
    choices:
      - text: "$7 + 12 = 12 + 7$"
        correct: true
      - text: "$(3 + 5) + 4 = 3 + (5 + 4)$"
      - text: "$9 + 0 = 9$"
      - text: "$6 + (-6) = 0$"
    explanation: |
      The Commutative Property of Addition states that changing the order of addends does not change their sum: $a + b = b + a$. Choice A shows $7$ and $12$ swapping positions, which is the definition of the commutative property.

      Choice B changes the grouping, which is the associative property. Choice C shows the additive identity (adding 0). Choice D shows the additive inverse (opposites summing to 0).

  - id: q-arithmetic-number-sense-properties-of-real-numbers-0002
    type: which-is-true
    difficulty: easy
    stem: |
      Which equation correctly illustrates the multiplicative inverse property?
    choices:
      - text: "$-\\frac{4}{7} \\cdot \\left(-\\frac{7}{4}\\right) = 1$"
        correct: true
      - text: "$-\\frac{4}{7} \\cdot 1 = -\\frac{4}{7}$"
      - text: "$-\\frac{4}{7} \\cdot 0 = 0$"
      - text: "$-\\frac{4}{7} + \\frac{4}{7} = 0$"
    explanation: |
      The Multiplicative Inverse Property states that a non-zero number multiplied by its reciprocal equals 1: $a \times \frac{1}{a} = 1$. The reciprocal of $-\frac{4}{7}$ is $-\frac{7}{4}$, and their product is 1.

      Choice B shows the multiplicative identity (multiplying by 1). Choice C shows the zero product property. Choice D shows the additive inverse (opposites summing to 0).

  - id: q-arithmetic-number-sense-properties-of-real-numbers-0003
    type: direct-computation
    difficulty: easy
    stem: |
      Simplify the expression $4(3x + 7)$ using the distributive property.
    choices:
      - text: "$12x + 28$"
        correct: true
      - text: "$12x + 7$"
      - text: "$7x + 11$"
      - text: "$12x + 11$"
    explanation: |
      Apply the distributive property by multiplying the outer factor 4 by each term inside the parentheses:
      $$4(3x) + 4(7) = 12x + 28$$

      Choice B forgets to multiply the constant 7 by 4. Choice C incorrectly adds 4 and 3 instead of multiplying. Choice D has the wrong product for $4 \times 7$.

  - id: q-arithmetic-number-sense-properties-of-real-numbers-0004
    type: which-is-true
    difficulty: easy
    stem: |
      Which of the following statements is true regarding real number properties under subtraction?
    choices:
      - text: "Subtraction is not commutative because $5 - 3 \\neq 3 - 5$."
        correct: true
      - text: "Subtraction is commutative because the numerical value remains 2."
      - text: "Subtraction is associative because $(8 - 4) - 2 = 8 - (4 - 2)$."
      - text: "Subtraction has an identity element of 0 because $x - 0 = 0 - x$."
    explanation: |
      Subtraction is not commutative. Changing the order changes the result: $5 - 3 = 2$ but $3 - 5 = -2$. These are not equal.

      Choice B is wrong because $2 \neq -2$. Choice C is wrong: $(8 - 4) - 2 = 2$ but $8 - (4 - 2) = 6$. Choice D is wrong: while $x - 0 = x$, we have $0 - x = -x$, so 0 is not a two-sided identity for subtraction.

  - id: q-arithmetic-number-sense-properties-of-real-numbers-0005
    type: which-is-true
    difficulty: medium
    stem: |
      Which property justifies the step $1 + (2 + 3) = (2 + 1) + 3$?
    choices:
      - text: "Commutative Property of Addition"
        correct: true
      - text: "Associative Property of Addition"
      - text: "Distributive Property"
      - text: "Additive Identity Property"
    explanation: |
      The order of numbers changed from $(1, 2, 3)$ to $(2, 1, 3)$. The numbers 1 and 2 swapped positions, which is the commutative property: $a + b = b + a$. This is a common trap: students see parentheses and automatically think "associative," but associative property only changes grouping, not order.

      The associative property would be: $(1 + 2) + 3 = 1 + (2 + 3)$ where the grouping changed but 1, 2, 3 stayed in the same left-to-right order.

  - id: q-arithmetic-number-sense-properties-of-real-numbers-0006
    type: direct-computation
    difficulty: medium
    stem: |
      Expand and simplify the expression $-2(x - 5)$.
    choices:
      - text: "$-2x + 10$"
        correct: true
      - text: "$-2x - 10$"
      - text: "$-2x - 5$"
      - text: "$2x - 10$"
    explanation: |
      Distribute $-2$ across both terms inside the parentheses:
      $$-2 \cdot x + (-2) \cdot (-5) = -2x + 10$$

      A negative times a negative is positive. This is a critical trap: many students forget to flip the sign of the second term when distributing a negative factor, giving the incorrect answer $-2x - 10$.

  - id: q-arithmetic-number-sense-properties-of-real-numbers-0007
    type: direct-computation
    difficulty: medium
    stem: |
      Simplify the algebraic expression $-3(2a + 4b) - 5a$.
    choices:
      - text: "$-11a - 12b$"
        correct: true
      - text: "$-a - 12b$"
      - text: "$-11a + 12b$"
      - text: "$-23ab$"
    explanation: |
      First distribute $-3$:
      $$-3(2a) + (-3)(4b) = -6a - 12b$$

      Then combine like terms with $-5a$:
      $$-6a - 5a - 12b = -11a - 12b$$

      Choice B makes an arithmetic error: $-6a - 5a = -11a$, not $-a$. Choice C has the wrong sign on $b$. Choice D incorrectly combines unlike terms $a$ and $b$ into a single term.

  - id: q-arithmetic-number-sense-properties-of-real-numbers-0008
    type: direct-computation
    difficulty: medium
    stem: |
      Evaluate $342 \times 28 + 342 \times 72$ using the distributive property.
    choices:
      - text: "$34,200$"
        correct: true
      - text: "$342,000$"
      - text: "$3,420$"
      - text: "$9,576$"
    explanation: |
      Both terms share the factor 342. Factor it out:
      $$342 \times 28 + 342 \times 72 = 342 \times (28 + 72)$$

      Add inside the parentheses:
      $$342 \times 100 = 34,200$$

      This is called reverse distribution or factoring. Notice that $28 + 72 = 100$, which makes the multiplication easy and avoids computing large products separately.

  - id: q-arithmetic-number-sense-properties-of-real-numbers-0009
    type: which-is-true
    difficulty: medium
    stem: |
      Which of the following statements about real number properties is true?
    choices:
      - text: "The additive inverse of any real number $x$ is $-x$, and their sum is the additive identity, 0."
        correct: true
      - text: "The multiplicative inverse of a negative real number is positive."
      - text: "Every real number has a unique multiplicative inverse."
      - text: "The additive identity is 1 and the multiplicative identity is 0."
    explanation: |
      By definition, $x + (-x) = 0$, where 0 is the additive identity. This is true for all real numbers.

      Choice B is wrong: for $-\frac{4}{7}$ to have product 1 with its multiplicative inverse, the inverse must be $-\frac{7}{4}$ (negative). Choice C is wrong: 0 is a real number but has no multiplicative inverse (division by zero is undefined). Choice D swaps the identities: 0 is additive identity and 1 is multiplicative identity.

  - id: q-arithmetic-number-sense-properties-of-real-numbers-0010
    type: which-is-true
    difficulty: hard
    stem: |
      A student evaluates $(12 \\div 4) \\div 2 = 3 \\div 2 = 1.5$. They regroup as $12 \\div (4 \\div 2) = 12 \\div 2 = 6$. Which property explains why these results differ?
    choices:
      - text: "Division is not associative, so changing the grouping alters the result."
        correct: true
      - text: "Division is not commutative, so changing the order of operands alters the result."
      - text: "The Distributive Property fails for division over subtraction."
      - text: "Division lacks a real identity element."
    explanation: |
      The Associative Property requires $(a \\div b) \\div c = a \\div (b \\div c)$ for all values. This does not hold for division: $(12 \\div 4) \\div 2 = 1.5$ but $12 \\div (4 \\div 2) = 6$. Therefore, division is not associative.

      Choice B is incorrect because the order of numbers did not change; only the grouping did. Choices C and D are irrelevant to this particular error.

  - id: q-arithmetic-number-sense-properties-of-real-numbers-0011
    type: direct-computation
    difficulty: hard
    stem: |
      Fully simplify the algebraic expression $-4(3x - 2y) - 2(5y - 6x)$.
    choices:
      - text: "$-2y$"
        correct: true
      - text: "$-24x - 2y$"
      - text: "$-24x + 18y$"
      - text: "$-8x - 2y$"
    explanation: |
      Expand both sets of parentheses carefully:
      $$-4(3x) + (-4)(-2y) = -12x + 8y$$
      $$-2(5y) + (-2)(-6x) = -10y + 12x$$

      Combine:
      $$-12x + 8y - 10y + 12x = (-12x + 12x) + (8y - 10y) = 0 - 2y = -2y$$

      Choice B forgets that $-4 \times (-2y) = +8y$ and $-2 \times (-6x) = +12x$, which cancel the $x$ terms. Choice C has sign errors. Choice D fails to cancel the $x$ terms completely.

  - id: q-arithmetic-number-sense-properties-of-real-numbers-0012
    type: which-is-true
    difficulty: hard
    stem: |
      Which of the following standard sets of numbers is not closed under subtraction?
    choices:
      - text: "Natural numbers $\\mathbb{N} = \\{1, 2, 3, \\ldots\\}$"
        correct: true
      - text: "Integers $\\mathbb{Z}$"
      - text: "Rational numbers $\\mathbb{Q}$"
      - text: "Real numbers $\\mathbb{R}$"
    explanation: |
      A set is closed under an operation if performing that operation on any two elements always yields an element in the set. For natural numbers, $3 - 5 = -2$, which is not a natural number. Therefore, the natural numbers are not closed under subtraction.

      Integers, rational numbers, and real numbers are all closed under subtraction: subtracting any two elements from each set always produces another element in that set.

  - id: q-arithmetic-number-sense-properties-of-real-numbers-0013
    type: direct-computation
    difficulty: hard
    stem: |
      Evaluate the expression $87 \times (-14) + 87 \times 114 - 87 \times 100$ using the distributive property.
    choices:
      - text: "$0$"
        correct: true
      - text: "$8,700$"
      - text: "$-8,700$"
      - text: "$174$"
    explanation: |
      Factor out the common factor 87:
      $$87 \times [(-14) + 114 - 100]$$

      Simplify inside the brackets:
      $$(-14) + 114 = 100$$
      $$100 - 100 = 0$$

      Therefore:
      $$87 \times 0 = 0$$

      Choices B and C result from arithmetic errors when combining inside the bracket.

  - id: q-arithmetic-number-sense-properties-of-real-numbers-0014
    type: which-is-true
    difficulty: exam-level
    stem: |
      Consider the step-by-step simplification:

      Line 1: $5 + (2x + 6) = 17$
      Line 2: $(5 + 2x) + 6 = 17$
      Line 3: $(2x + 5) + 6 = 17$
      Line 4: $2x + (5 + 6) = 17$

      Which property justifies the step from Line 2 to Line 3?
    choices:
      - text: "Commutative Property of Addition"
        correct: true
      - text: "Associative Property of Addition"
      - text: "Distributive Property"
      - text: "Additive Identity Property"
    explanation: |
      From Line 2 to Line 3, the expression inside the parentheses changed from $(5 + 2x)$ to $(2x + 5)$. The addends 5 and $2x$ swapped positions. Changing the order of addends is the Commutative Property of Addition: $a + b = b + a$.

      The Associative Property (choice B) was used from Line 1 to Line 2 and Line 3 to Line 4, but not here. The key trap is recognizing that the presence of parentheses does not automatically indicate associativity; you must check if the order changed (commutative) or only the grouping changed (associative).

  - id: q-arithmetic-number-sense-properties-of-real-numbers-0015
    type: direct-computation
    difficulty: exam-level
    stem: |
      Simplify the algebraic expression: $$-\\frac{3}{4}(8x - 12y) + \\frac{1}{2}(6x - 4y) - 5(x - y)$$
    choices:
      - text: "$-8x + 14y$"
        correct: true
      - text: "$-8x + 4y$"
      - text: "$2x + 12y$"
      - text: "$-8x - 2y$"
    explanation: |
      Expand each product carefully:

      First term: $-\\frac{3}{4}(8x) + (-\\frac{3}{4})(-12y) = -6x + 9y$

      Second term: $\\frac{1}{2}(6x) + \\frac{1}{2}(-4y) = 3x - 2y$

      Third term: $-5(x) + (-5)(-y) = -5x + 5y$

      Combine like terms:

      $x$ terms: $-6x + 3x - 5x = -8x$

      $y$ terms: $9y - 2y + 5y = 14y$

      Result: $-8x + 14y$

      Choice B forgets that $-5 \times (-y) = +5y$, not $-5y$. Choices C and D have multiple sign errors across the variable terms.
