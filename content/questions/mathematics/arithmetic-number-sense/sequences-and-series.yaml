meta:
  subject: mathematics
  topic: arithmetic-number-sense
  subtopic: sequences-and-series
  exams: [upcat, acet, dlsucet, ustet, pupcet, cse-pro, cse-sub]
questions:
  - id: q-arithmetic-number-sense-sequences-and-series-0001
    type: direct-computation
    difficulty: easy
    stem: |
      What is the fifteenth term of the arithmetic sequence $5,9,13,17,\ldots$?
    choices:
      - text: '$61$'
        correct: true
      - text: '$65$'
        rationale: |
          This uses fifteen difference steps instead of fourteen. The term position is fifteen. Check that the first term needs no step.
      - text: '$57$'
        rationale: |
          This uses thirteen steps instead of fourteen. The number of steps is easy to miscount. Check that the first term needs no step.
      - text: '$75$'
        rationale: |
          This multiplies the first term by the position. The same term number is used. Check whether change is additive or multiplicative.
    explanation: |
      The common difference is $4$. From the first to the fifteenth term there are $14$ steps. Thus $a_{15}=5+14(4)=61$.

  - id: q-arithmetic-number-sense-sequences-and-series-0002
    type: which-is-true
    difficulty: easy
    stem: |
      Which description fits the sequence $3,6,12,24,48,\ldots$?
    choices:
      - text: 'Geometric, ratio 2'
        correct: true
      - text: 'Arithmetic, difference 3'
        rationale: |
          This uses only the first difference to classify the sequence. The first increase is three. Check more than one consecutive difference.
      - text: 'Geometric, ratio 3'
        rationale: |
          This treats the first term as the common ratio. The number three starts the sequence. Check the quotient of consecutive terms.
      - text: 'Harmonic, ratio 2'
        rationale: |
          This labels a constant-ratio sequence as harmonic. Both types describe structured patterns. Check whether the reciprocals form an arithmetic sequence.
    explanation: |
      Divide each term by the preceding one: $6\div3=2$, $12\div6=2$, and $24\div12=2$. The constant ratio is $2$, so the sequence is geometric.

  - id: q-arithmetic-number-sense-sequences-and-series-0003
    type: direct-computation
    difficulty: easy
    stem: |
      What is the sum of the first ten terms of the arithmetic sequence $4,7,10,13,\ldots$?
    choices:
      - text: '$175$'
        correct: true
      - text: '$190$'
        rationale: |
          This finds the last term using ten difference steps. The term count is ten. Check that the first row needs no increment.
      - text: '$350$'
        rationale: |
          This omits division by two in the sum formula. The endpoint sum has already been found. Check the one-half factor in the arithmetic sum.
      - text: '$130$'
        rationale: |
          This uses a common difference of two instead of three. The pattern increases by a small integer. Check the actual consecutive difference.
    explanation: |
      The tenth term is $4+9(3)=31$. The arithmetic sum is $S_{10}=\dfrac{10}{2}(4+31)=5(35)=175$.

  - id: q-arithmetic-number-sense-sequences-and-series-0004
    type: direct-computation
    difficulty: easy
    stem: |
      A geometric sequence has $a_1=3$ and common ratio $r=2$. What is its sixth term?
    choices:
      - text: '$96$'
        correct: true
      - text: '$192$'
        rationale: |
          This uses exponent six instead of five. The position is six. Check that the first term uses exponent zero.
      - text: '$13$'
        rationale: |
          This uses an arithmetic term formula for a geometric sequence. Both formulas use the first term and a change value. Check whether difference or ratio is constant.
      - text: '$48$'
        rationale: |
          This uses exponent four instead of five. Four is close to the needed step count. Check the number of ratio multiplications.
    explanation: |
      From the first to the sixth term there are five ratio multiplications. Thus $a_6=3(2^5)=3(32)=96$.

  - id: q-arithmetic-number-sense-sequences-and-series-0005
    type: direct-computation
    difficulty: medium
    stem: |
      Find the sum of the infinite geometric series $12+4+\dfrac{4}{3}+\dfrac{4}{9}+\ldots$.
    choices:
      - text: '$18$'
        correct: true
      - text: '$9$'
        rationale: |
          This adds the ratio to one in the sum denominator. The same ratio appears in the denominator. Check the subtraction in the infinite-sum denominator.
      - text: '$36$'
        rationale: |
          This divides by the ratio instead of one minus the ratio. The ratio is needed for the formula. Check the full denominator in the infinite-sum formula.
      - text: '$8$'
        rationale: |
          This multiplies by one minus the ratio instead of dividing. The same two factors are used. Check whether the formula multiplies or divides.
    explanation: |
      The first term is $12$ and the ratio is $\dfrac{1}{3}$. Since the ratio magnitude is below $1$, the sum exists. It is $12\div\left(1-\dfrac{1}{3}\right)=12\left(\dfrac{3}{2}\right)=18$.

  - id: q-arithmetic-number-sense-sequences-and-series-0006
    type: direct-computation
    difficulty: medium
    stem: |
      An arithmetic sequence has $a_3=11$ and $a_8=31$. What is its first term?
    choices:
      - text: '$3$'
        correct: true
      - text: '$4$'
        rationale: |
          This reports the common difference. The difference is needed first. Check whether the first term or difference is requested.
      - text: '$7$'
        rationale: |
          This works back only one step from the third term. The prior term is a useful intermediate result. Check how many steps lead back to term one.
      - text: '$-1$'
        rationale: |
          This subtracts three differences from the third term. The known term position is three. Check that term three is only two steps after term one.
    explanation: |
      There are five steps from term three to term eight. Their increase is $31-11=20$, so $d=20\div5=4$. Term three is two steps after the first term. Thus $a_1=11-2(4)=3$.

  - id: q-arithmetic-number-sense-sequences-and-series-0007
    type: which-is-true
    difficulty: medium
    stem: |
      Which infinite geometric series converges to a finite sum?
    choices:
      - text: '$16 - 8 + 4 - 2 + \dots$'
        correct: true
      - text: '$2 + 6 + 18 + 54 + \dots$'
        rationale: |
          This ignores that the common ratio is greater than one. The series has a clear ratio. Check the absolute value of the ratio.
      - text: '$5 - 5 + 5 - 5 + \dots$'
        rationale: |
          This assumes alternating signs guarantee convergence. The signs alternate regularly. Check that the term magnitudes also shrink.
      - text: '$1 + 1.1 + 1.21 + \dots$'
        rationale: |
          This treats a ratio near one as if it were below one. The growth per term is small. Check whether the ratio is strictly less than one in magnitude.
    explanation: |
      The ratio in $16-8+4-2+\ldots$ is $-\dfrac{1}{2}$. Its absolute value is below $1$, so the infinite geometric series converges.

  - id: q-arithmetic-number-sense-sequences-and-series-0008
    type: direct-computation
    difficulty: medium
    stem: |
      A geometric sequence has $a_1=5$ and $r=3$. What is the sum of its first five terms?
    choices:
      - text: '$605$'
        correct: true
      - text: '$405$'
        rationale: |
          This reports the fifth term instead of the five-term sum. The fifth term is needed in some sum methods. Check whether a term or a sum is requested.
      - text: '$1210$'
        rationale: |
          This omits the denominator two from the sum formula. The numerator is a correct intermediate amount. Check every part of the finite-sum formula.
      - text: '$600$'
        rationale: |
          This leaves out the first term when adding. The later four terms are all included. Check that the first term belongs to the requested sum.
    explanation: |
      The finite geometric sum is $S_5=5\dfrac{3^5-1}{3-1}$. Since $3^5=243$, this is $\dfrac{5(242)}{2}=605$.

  - id: q-arithmetic-number-sense-sequences-and-series-0009
    type: direct-computation
    difficulty: medium
    stem: |
      Three arithmetic means are inserted between $4$ and $28$ so that all five terms form an arithmetic sequence. What is the second inserted mean?
    choices:
      - text: '$16$'
        correct: true
      - text: '$10$'
        rationale: |
          This reports the first inserted mean. That is one of the inserted values. Check which inserted position is requested.
      - text: '$20$'
        rationale: |
          This inserts two means instead of three. Three equal steps can look like three means. Check that three inserted values need four gaps.
      - text: '$22$'
        rationale: |
          This reports the third inserted mean. That is one of the inserted values. Check which inserted position is requested.
    explanation: |
      Three inserted means make five terms, with four equal steps between the endpoints. The common difference is $(28-4)\div4=6$. The terms are $4,10,16,22,28$. The second inserted mean is $16$.

  - id: q-arithmetic-number-sense-sequences-and-series-0010
    type: word-problem
    difficulty: hard
    stem: |
      A theater has $20$ rows. Its first row has $15$ seats, and each later row has $3$ more seats than the previous row. How many seats are there in all?
    choices:
      - text: '$870$'
        correct: true
      - text: '$900$'
        rationale: |
          This uses twenty steps instead of nineteen for the last row. There are twenty rows. Check the number of increases after row one.
      - text: '$72$'
        rationale: |
          This reports the final row rather than the total. That row is needed to compute the sum. Check whether one row or all rows is requested.
      - text: '$1,740$'
        rationale: |
          This omits the division by two in the arithmetic sum. The formula contains the endpoint sum. Check the one-half factor in the sum formula.
    explanation: |
      The final row has $15+19(3)=72$ seats. The total is $\dfrac{20}{2}(15+72)=10(87)=870$ seats.

  - id: q-arithmetic-number-sense-sequences-and-series-0011
    type: direct-computation
    difficulty: hard
    stem: |
      The consecutive terms $x-1,x+5,7x-1$ form a geometric sequence. Find $x>0$.
    choices:
      - text: '$4$'
        correct: true
      - text: '$2$'
        rationale: |
          This drops the linear term before solving x squared minus four equals zero. The remaining equation is easy to factor. Check that every term remains when collecting the quadratic.
      - text: '$-1$'
        rationale: |
          This reports the negative root. Both roots satisfy the geometric condition. Check the stated positivity condition.
      - text: '$3$'
        rationale: |
          This drops the constant term and solves x squared minus three x equals zero. The remaining equation has a simple nonzero root. Check that the constant term remains in the equation.
    explanation: |
      Equal consecutive ratios give $(x+5)^2=(x-1)(7x-1)$. Expand: $x^2+10x+25=7x^2-8x+1$. Rearrange and divide by $6$ to get $x^2-3x-4=0$. Factor: $(x-4)(x+1)=0$. The positive solution is $x=4$.

  - id: q-arithmetic-number-sense-sequences-and-series-0012
    type: direct-computation
    difficulty: hard
    stem: |
      What is the sum of all positive three-digit multiples of $7$?
    choices:
      - text: '$70336$'
        correct: true
      - text: '$69342$'
        rationale: |
          This leaves out the final multiple nine hundred ninety-four. The terms still form an arithmetic sequence. Check the last allowed endpoint.
      - text: '$70231$'
        rationale: |
          This leaves out the first multiple one hundred five. The remaining terms still form an arithmetic sequence. Check the first allowed endpoint.
      - text: '$140672$'
        rationale: |
          This omits division by two in the sum formula. The count and endpoint sum are correct. Check the one-half factor in the arithmetic sum.
    explanation: |
      The first three-digit multiple is $7(15)=105$. The last is $7(142)=994$. The count is $142-15+1=128$. The arithmetic sum is $\dfrac{128}{2}(105+994)=64(1099)=70336$.

  - id: q-arithmetic-number-sense-sequences-and-series-0013
    type: word-problem
    difficulty: hard
    stem: |
      A ball is dropped from $16$ meters. After each ground contact, it rebounds to $\dfrac{3}{4}$ of the previous maximum height. In an ideal model continuing through infinitely many rebounds, what total vertical distance does the ball travel?
    choices:
      - text: '$112$ m'
        correct: true
      - text: '$64$ m'
        rationale: |
          This counts only one direction of each rebound. The rebound heights form the right geometric series. Check that every rebound goes up and down.
      - text: '$48$ m'
        rationale: |
          This reports only upward rebound distance. The upward total is a useful intermediate result. Check the initial drop and downward rebounds too.
      - text: '$128$ m'
        rationale: |
          This doubles the initial drop as well as the rebound distances. Most heights are traveled in both directions. Check that the initial height is fallen only once.
    explanation: |
      The first rebound rises $16\left(\dfrac{3}{4}\right)=12$ meters. The total upward rebound distance is $12\div\left(1-\dfrac{3}{4}\right)=48$ meters. Each rebound also falls the same distance. Add both rebound directions to the first drop: $16+2(48)=112$ meters.

  - id: q-arithmetic-number-sense-sequences-and-series-0014
    type: direct-computation
    difficulty: exam
    stem: |
      In a nonconstant arithmetic sequence with $a_1 = 5$, terms 1, 3, and 9 form a geometric sequence. Find the common difference $d$.
    choices:
      - text: '$5$'
        correct: true
      - text: '$-5$'
        rationale: |
          This changes the sign of the linear term when collecting the equation. Moving terms often involves sign changes. Check the sign when moving the linear terms.
      - text: '$10$'
        rationale: |
          This doubles the linear coefficient when simplifying. Both sides of the expansion contain a linear term. Check the collected linear coefficient.
      - text: '$0$'
        rationale: |
          This uses the constant-sequence solution. Zero satisfies the algebraic equation. Check the nonconstant condition.
    explanation: |
      The selected terms are $5,5+2d,5+8d$. Equal geometric ratios give $(5+2d)^2=5(5+8d)$. Expand and collect: $4d^2-20d=0$, or $4d(d-5)=0$. A nonconstant arithmetic sequence has $d\ne0$, so $d=5$.

  - id: q-arithmetic-number-sense-sequences-and-series-0015
    type: direct-computation
    difficulty: exam
    stem: |
      The sum of the first $n$ terms of a sequence is $S_n=2n^2+3n$. What is its eighth term?
    choices:
      - text: '$33$'
        correct: true
      - text: '$152$'
        rationale: |
          This reports the eighth partial sum. The sum formula is given directly. Check whether the question asks for a term or a sum.
      - text: '$37$'
        rationale: |
          This finds the ninth term rather than the eighth. The adjacent partial sums produce nearby terms. Check the adjacent partial-sum indices.
      - text: '$62$'
        rationale: |
          This subtracts the sixth partial sum instead of the seventh. Both partial sums are earlier than or equal to the eighth. Check that exactly one term remains after subtraction.
    explanation: |
      The eighth term is the amount added between the seventh and eighth partial sums. Compute $S_8=2(8^2)+3(8)=152$ and $S_7=2(7^2)+3(7)=119$. Thus $a_8=S_8-S_7=152-119=33$.

  - id: q-arithmetic-number-sense-sequences-and-series-0016
    type: direct-computation
    difficulty: easy
    stem: |
      Find the fourth term of the harmonic sequence $\dfrac{1}{3},\dfrac{1}{7},\dfrac{1}{11},\ldots$.
    choices:
      - text: '$\dfrac{1}{15}$'
        correct: true
      - text: '$15$'
        rationale: |
          This stops in the reciprocal arithmetic sequence. Fifteen is a needed intermediate value. Check that the question asks for the original harmonic term.
      - text: '$\dfrac{1}{19}$'
        rationale: |
          This uses four increases instead of three. The requested position is four. Check that the first term needs no increase.
      - text: '$\dfrac{1}{4}$'
        rationale: |
          This takes the reciprocal of the common difference. The difference is needed in the reciprocal sequence. Check that the term is found before taking its reciprocal.
    explanation: |
      The reciprocals form $3,7,11,\ldots$, with common difference $4$. The fourth reciprocal is $3+3(4)=15$. Take the reciprocal again to get $\dfrac{1}{15}$.
    approved: false

  - id: q-arithmetic-number-sense-sequences-and-series-0017
    type: error-spotting
    difficulty: medium
    stem: |
      A student finds a term of a harmonic sequence by taking reciprocals, computing the corresponding arithmetic term as $17$, then reporting $17$ as the answer. What final step is needed?
    choices:
      - text: 'Take the reciprocal of $17$.'
        correct: true
      - text: 'Add the common difference to $17$.'
        rationale: |
          This advances one more position in the reciprocal sequence. The difference does generate later terms. Check that the target position was already reached.
      - text: 'Multiply $17$ by the term position.'
        rationale: |
          This treats a term as a sum or repeated total. Multiplying by a position is familiar. Check that the original sequence is recovered by a reciprocal.
      - text: 'Subtract the first denominator from $17$.'
        rationale: |
          This treats the arithmetic increase as the harmonic term. The first denominator helped form the reciprocal sequence. Check that the full reciprocal term must be inverted.
    explanation: |
      The arithmetic sequence contains reciprocals of the harmonic terms. To return to the original sequence, take the reciprocal of its computed term. The harmonic term is $\dfrac{1}{17}$.
    approved: false

  - id: q-arithmetic-number-sense-sequences-and-series-0018
    type: direct-computation
    difficulty: medium
    stem: |
      A Fibonacci-type sequence starts $2,5$. Each later term is the sum of the previous two. What is its fifth term?
    choices:
      - text: '$19$'
        correct: true
      - text: '$12$'
        rationale: |
          This stops at the fourth term. Twelve is a needed intermediate term. Check the requested position.
      - text: '$24$'
        rationale: |
          This doubles the fourth term instead of adding the prior two. Doubling is a familiar growth pattern. Check the stated recurrence.
      - text: '$7$'
        rationale: |
          This reports the first newly computed term. Seven follows the two starting terms. Check that two more positions remain.
    explanation: |
      The third term is $2+5=7$. The fourth is $5+7=12$. The fifth is $7+12=19$.
    approved: false

  - id: q-arithmetic-number-sense-sequences-and-series-0019
    type: which-is-true
    difficulty: hard
    stem: |
      An arithmetic sequence has seven terms and middle term $12$. Which statement must be true?
    choices:
      - text: 'The sum is $84$.'
        correct: true
      - text: 'The sum is $42$.'
        rationale: |
          This applies an extra one-half factor to average times count. Arithmetic sum formulas often contain one-half. Check that the middle term is already the average.
      - text: 'The last term is $24$.'
        rationale: |
          This doubles the middle term to find an endpoint. Endpoints are symmetric about the middle. Check that the difference is still unknown.
      - text: 'The common difference is $2$.'
        rationale: |
          This divides the middle term by six gaps. The sequence has six gaps. Check that a term value alone does not determine the difference.
    explanation: |
      For an odd-length arithmetic sequence, the middle term equals the average of all terms. Multiply that average by the seven terms: $12(7)=84$.
    approved: false

  - id: q-arithmetic-number-sense-sequences-and-series-0020
    type: word-problem
    difficulty: exam
    stem: |
      A fundraiser deposits $80$ pesos in week one and half the previous week's amount in each later week. What fraction of its total deposits over infinitely many weeks comes from the first two weeks?
    choices:
      - text: '$\dfrac{3}{4}$'
        correct: true
      - text: '$\dfrac{1}{2}$'
        rationale: |
          This counts only the first deposit. That deposit is half the infinite total. Check that two weeks are requested.
      - text: '$\dfrac{3}{2}$'
        rationale: |
          This divides the two-week total by the first deposit instead of all deposits. The first amount is given directly. Check the requested reference total.
      - text: '$\dfrac{1}{4}$'
        rationale: |
          This reports the fraction deposited after the first two weeks. That remaining fraction is also meaningful. Check which part is requested.
    explanation: |
      The first two deposits total $80+40=120$ pesos. The infinite geometric total is $80\div\left(1-\dfrac{1}{2}\right)=160$ pesos. Their fraction is $\dfrac{120}{160}=\dfrac{3}{4}$.
    approved: false
