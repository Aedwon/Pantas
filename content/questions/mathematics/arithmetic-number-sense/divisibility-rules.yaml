meta:
  subject: mathematics
  topic: arithmetic-number-sense
  subtopic: divisibility-rules
  exams: [upcat, acet, dlsucet, ustet, pupcet, cse-pro, cse-sub]
questions:
  - id: q-arithmetic-number-sense-divisibility-rules-0001
    type: which-is-true
    difficulty: easy
    stem: |
      Which of the following statements regarding the number $0$ is true?
    choices:
      - text: '$0$ cannot be divided by nonzero integers.'
        rationale: |
          This confuses dividing zero with dividing by zero. Both expressions contain a zero. Check which number is the divisor.
      - text: '$0$ is divisible by all nonzero integers.'
        correct: true
      - text: '$0$ is divisible only by $10$.'
        rationale: |
          This applies only the final-zero test for ten. The number zero ends in zero. Check the quotient with any nonzero divisor.
      - text: '$0$ is divisible by $0$.'
        rationale: |
          This allows a zero divisor. Zero divided by other numbers does give zero. Check that the divisor is nonzero.
    explanation: |
      For every nonzero integer $b$, $0=b(0)$. The quotient $0\div b=0$ is an integer with no remainder. Therefore every nonzero integer divides zero.

  - id: q-arithmetic-number-sense-divisibility-rules-0002
    type: direct-computation
    difficulty: easy
    stem: |
      To test if $4,516$ is divisible by $4$, a student erroneously adds all the digits ($4 + 5 + 1 + 6 = 16$). What is the correct rule to check divisibility by $4$, and is $4,516$ divisible by $4$?
    choices:
      - text: 'Use the digit sum; the number passes.'
        rationale: |
          This uses a digit sum to test for four. The sum happens to pass in this example. Check the rule, not just one matching result.
      - text: 'Use the last two digits; it passes.'
        correct: true
      - text: 'Use the final digit; the number fails.'
        rationale: |
          This tests only the final digit. The rule for two uses one digit. Check the two-digit ending for four.
      - text: 'Use evenness; the number passes.'
        rationale: |
          This treats being even as enough for divisibility by four. Every multiple of four is even. Check the full last-two-digit number.
    explanation: |
      Use the number formed by the last two digits. Here it is $16$, and $16=4(4)$. Therefore $4516$ is divisible by $4$.

  - id: q-arithmetic-number-sense-divisibility-rules-0003
    type: direct-computation
    difficulty: easy
    stem: |
      The five-digit number $57x81$ is divisible by $9$. What is the value of the digit $x$?
    choices:
      - text: '$3$'
        rationale: |
          This uses divisibility by three instead of nine: $21+3=24$. Every multiple of nine is also a multiple of three. Check the stronger test for nine.
      - text: '$6$'
        correct: true
      - text: '$7$'
        rationale: |
          This adds the known digits as twenty instead of twenty-one. The next multiple of nine is still twenty-seven. Check the digit sum before finding the missing digit.
      - text: '$9$'
        rationale: |
          This chooses nine because the divisor is nine. The same number appears in the test name. Check the sum of all digits.
    explanation: |
      The digit sum is $5+7+x+8+1=21+x$. Since $x$ is a digit, this sum ranges from $21$ to $30$. Its only multiple of $9$ is $27$. Thus $21+x=27$, so $x=6$.

  - id: q-arithmetic-number-sense-divisibility-rules-0004
    type: which-is-true
    difficulty: easy
    stem: |
      Which of the following numbers is divisible by $6$?
    choices:
      - text: '$24,534$'
        correct: true
      - text: '$24,536$'
        rationale: |
          This uses an ending of six as a test for six. Last-digit rules work for two and five. Check both the evenness and digit-sum tests.
      - text: '$24,538$'
        rationale: |
          This tests only evenness. Every multiple of six is even. Check divisibility by three as well.
      - text: '$24,539$'
        rationale: |
          This treats a final nine as evidence of divisibility by three. Nine itself is a multiple of three. Check all digits and also require an even number.
    explanation: |
      The number $24534$ is even, so it is divisible by $2$. Its digit sum is $2+4+5+3+4=18$, a multiple of $3$. Passing both tests means it is divisible by $6$.

  - id: q-arithmetic-number-sense-divisibility-rules-0005
    type: which-is-true
    difficulty: medium
    stem: |
      To test if a large number is divisible by $24$, a student checks if the number is divisible by both $4$ and $6$. Why is this test logically flawed, and what is the correct pair of factors to use?
    choices:
      - text: 'Use $3$ and $8$; they are coprime.'
        correct: true
      - text: 'Use $2$ and $12$; their product is enough.'
        rationale: |
          This assumes any factor pair with product twenty-four is enough. Two times twelve has the right product. Check whether the factors share a factor.
      - text: 'Use $4$ and $6$; shared factors do not matter.'
        rationale: |
          This ignores the common factor of four and six. Both numbers are factors of twenty-four. Check whether a smaller number passes both tests.
      - text: 'Use $4$ and $20$; the factors must sum to $24$.'
        rationale: |
          This uses addition instead of multiplication to split the divisor. Four plus twenty does equal twenty-four. Check that the factors multiply to the target.
    explanation: |
      The number $12$ is divisible by both $4$ and $6$, but it is not divisible by $24$. These factors share a factor of $2$, so their tests overlap. The factors $3$ and $8$ share no factor greater than $1$ and multiply to $24$. Their combined tests are sufficient.

  - id: q-arithmetic-number-sense-divisibility-rules-0006
    type: direct-computation
    difficulty: medium
    stem: |
      Find the missing digit $d$ such that the six-digit number $73d,514$ is divisible by $11$.
    choices:
      - text: '$d=2$'
        rationale: |
          This uses the total digit sum $20+d$ for eleven. Digit sums work for three and nine. Check the alternating sums for eleven.
      - text: '$d=4$'
        correct: true
      - text: '$d=5$'
        rationale: |
          This omits the digit one from the first alternating group. The remaining group still has the leading digits. Check every other digit without skipping one.
      - text: '$d=1$'
        rationale: |
          This omits the digit three from the second group. The remaining total is easy to add. Check every position in each alternating group.
    explanation: |
      The alternating sums are $7+d+1=8+d$ and $3+5+4=12$. Their difference is $d-4$. For digits $0$ through $9$, this ranges from $-4$ to $5$. Its only multiple of $11$ is $0$. Thus $d=4$.

  - id: q-arithmetic-number-sense-divisibility-rules-0007
    type: direct-computation
    difficulty: medium
    stem: |
      A store owner counts total earnings of $\text{₱}48,k72$, where $k$ is a missing digit. If the total amount in pesos is divisible by $8$, which of the following could be the value of $k$?
    choices:
      - text: '$k = 1$'
        rationale: |
          This checks only that the final digit two is even. Evenness is necessary for a multiple of eight. Check the number formed by all three ending digits.
      - text: '$k = 3$'
        rationale: |
          This checks only the last two digits, seventy-two. Seventy-two is itself a multiple of eight. Check the last three digits for eight.
      - text: '$k = 5$'
        rationale: |
          This accepts an ending of seventy-two for any hundreds digit. That ending passes when the hundreds contribution also divides by eight. Check the complete ending, not just its final two digits.
      - text: '$k = 6$'
        correct: true
    explanation: |
      For $k=6$, the last three digits form $672$. Since $672=8(84)$, the number passes the divisibility test for $8$.

  - id: q-arithmetic-number-sense-divisibility-rules-0008
    type: which-is-true
    difficulty: medium
    stem: |
      What is the primary purpose of the "casting out nines" technique, and what remainder is obtained when $84,931$ is divided by $9$?
    choices:
      - text: 'It finds a remainder for $9$; here it is $7$.'
        correct: true
      - text: 'It drops even digits for a $9$ test; here it gives $4$.'
        rationale: |
          This drops even digits instead of groups summing to nine. Both methods remove digits. Check the sum of every removed group.
      - text: 'It uses the $11$ test after subtracting $9$ from each digit.'
        rationale: |
          This applies an eleven test to a nine-remainder question. Both rules combine digits. Check which divisor the method handles.
      - text: 'It finds a remainder for $8$; here it is $1$.'
        rationale: |
          This uses the last-three-digit test for eight. Eight has a useful shortcut too. Check that casting out nines concerns division by nine.
    explanation: |
      Casting out nines finds the remainder on division by $9$ from the digit sum. Here $8+4+9+3+1=25$. Since $25=9(2)+7$, the remainder is $7$.

  - id: q-arithmetic-number-sense-divisibility-rules-0009
    type: which-is-true
    difficulty: medium
    stem: |
      Which of the following numbers is NOT a divisor of $3,960$?
    choices:
      - text: '$11$'
        rationale: |
          This overlooks zero as a valid alternating difference. Zero can seem to mean the test failed to produce a number. Check that zero is a multiple of eleven.
      - text: '$9$'
        rationale: |
          This overlooks eighteen as a multiple of nine. A digit sum is smaller than the original number. Check whether the sum divides evenly by nine.
      - text: '$8$'
        rationale: |
          This checks only the final digit zero for divisibility by eight. Some tests do use the final digit alone. Check the final three digits, which form nine hundred sixty.
      - text: '$7$'
        correct: true
    explanation: |
      Apply the rule for $7$: remove the final zero and get $396$. Next compute $39-2(6)=27$, then $2-2(7)=-12$. This is not a multiple of $7$. Therefore $7$ does not divide $3960$.

  - id: q-arithmetic-number-sense-divisibility-rules-0010
    type: direct-computation
    difficulty: hard
    stem: |
      A financial record shows a total amount of $\text{₱}3a4,5b2$. If this six-digit number is divisible by $99$, what are the values of the digits $a$ and $b$?
    choices:
      - text: '$a = 2, b = 2$'
        correct: true
      - text: '$a = 4, b = 9$'
        rationale: |
          This checks only the digit sum, which is twenty-seven. That passes the test for nine. Check divisibility by eleven as well.
      - text: '$a = 7, b = 6$'
        rationale: |
          This treats a negative alternating difference as valid without testing it. Subtraction can produce negative multiples of eleven. Check whether the actual difference is a multiple of eleven.
      - text: '$a = 5, b = 8$'
        rationale: |
          This accepts a difference of three after passing the nine test. Three divides nine, so it can look relevant. Check that the alternating difference must divide by eleven.
    explanation: |
      Since $99=9(11)$ and the factors share no factor greater than $1$, use both tests. The alternating difference is $(3+4+b)-(a+5+2)=b-a$. It ranges from $-9$ to $9$, so it must be zero: $a=b$. The digit sum is $14+2a$. Its only even multiple of $9$ from $14$ to $32$ is $18$. Thus $14+2a=18$, giving $a=b=2$.

  - id: q-arithmetic-number-sense-divisibility-rules-0011
    type: which-is-true
    difficulty: hard
    stem: |
      Which of the following statements regarding composite divisibility rules is false?
    choices:
      - text: 'A number is divisible by $45$ if and only if it is divisible by both $5$ and $9$.'
        rationale: |
          This assumes every combined divisibility rule fails. Shared factors do make some combinations insufficient. Check that five and nine share no factor.
      - text: 'A number is divisible by $18$ if and only if it is even and its digit sum is divisible by $9$.'
        rationale: |
          This rejects evenness as part of a composite test. Evenness alone is not enough for eighteen. Check that the statement also requires a multiple-of-nine digit sum.
      - text: 'A number is divisible by $12$ if and only if it is divisible by both $2$ and $6$.'
        correct: true
      - text: 'A number is divisible by $72$ if and only if it is divisible by both $8$ and $9$.'
        rationale: |
          This rejects combining the tests for eight and nine. Some factor pairs do overlap. Check that these factors share no factor greater than one.
    explanation: |
      The number $6$ passes both the test for $2$ and the test for $6$. It does not pass the test for $12$. This counterexample proves the stated equivalence is false.

  - id: q-arithmetic-number-sense-divisibility-rules-0012
    type: direct-computation
    difficulty: hard
    stem: |
      The five-digit number $72x4y$ is divisible by $45$. What is the maximum possible value of the product $x \times y$?
    choices:
      - text: '$0$'
        rationale: |
          This keeps only the case with a final zero. Zero is a valid ending for a multiple of five. Check the ending five before maximizing the product.
      - text: '$20$'
        rationale: |
          This tests only the ending five and chooses $x=4$. The final-digit test does pass. Check the digit-sum test for nine too.
      - text: '$36$'
        rationale: |
          This uses $x=4,y=9$, ignoring the final-digit rule. Nine is a factor of forty-five. Check that the number also divides by five.
      - text: '$45$'
        correct: true
    explanation: |
      Since $45=5(9)$, the final digit $y$ is $0$ or $5$ and the digit sum must be a multiple of $9$. If $y=0$, then $13+x$ gives $x=5$, so the product is zero. If $y=5$, then $18+x$ gives $x=0$ or $9$. The largest product is $9(5)=45$.

  - id: q-arithmetic-number-sense-divisibility-rules-0013
    type: direct-computation
    difficulty: hard
    stem: |
      A jackpot prize of $\text{₱}5x3,4y6$ is evenly distributed among $88$ winners without any leftover pesos. What is the minimum possible value of $x + y$?
    choices:
      - text: '$3$'
        rationale: |
          This uses the smaller digit alone instead of the sum. The digit three is part of a valid pair. Check that both digits are added.
      - text: '$8$'
        correct: true
      - text: '$16$'
        rationale: |
          This reports the larger valid sum. Both pairs pass the divisibility tests. Check whether the minimum or maximum is requested.
      - text: '$14$'
        rationale: |
          This doubles the larger pair's first digit instead of adding its two digits. Adding two identical digits can seem like a quick sum. Check the two values in the actual pair.
    explanation: |
      Since $88=8(11)$, use the last-three-digit and alternating-sum tests. The endings $416,456,496$ are multiples of $8$, so $y$ is $1,5,$ or $9$. The alternating difference is $y-x-2$, which must be zero or a multiple of $11$. The valid pairs are $(x,y)=(3,5)$ and $(7,9)$. Their sums are $8$ and $16$, so the minimum is $8$.

  - id: q-arithmetic-number-sense-divisibility-rules-0014
    type: direct-computation
    difficulty: exam
    stem: |
      A bank security code consists of the eight-digit number $20x5432y$. If the code is known to be divisible by $72$, what is the maximum possible value of $x + y$?
    choices:
      - text: '$2$'
        rationale: |
          This reports the valid smaller sum. The pair with a final zero does pass both tests. Check whether the largest sum is requested.
      - text: '$8$'
        rationale: |
          This reports the final digit eight alone. The final-digit test is needed first. Check that the requested result adds both unknown digits.
      - text: '$11$'
        correct: true
      - text: '$14$'
        rationale: |
          This uses $x=6,y=8$ without the nine test. The ending passes divisibility by eight. Check the full digit sum too.
    explanation: |
      Since $72=8(9)$, test divisibility by $8$ and $9$. The ending $32y$ allows $y=0$ or $8$. The full digit sum is $16+x+y$. If $y=0$, its multiple of $9$ gives $x=2$. If $y=8$, it gives $x=3$. The sums are $2$ and $11$, so the maximum is $11$.

  - id: q-arithmetic-number-sense-divisibility-rules-0015
    type: which-is-true
    difficulty: exam
    stem: |
      Consider the following four mathematical statements regarding divisibility rules:

      I. The number $0$ is divisible by all non-zero integers.
      II. A number is divisible by $4$ if the sum of its digits is divisible by $4$.
      III. A number is divisible by $18$ if and only if it is divisible by both $3$ and $6$.
      IV. A number is divisible by $11$ if the difference between the sum of digits in odd positions and even positions is $0$ or a multiple of $11$.

      Which of the statements above are true?
    choices:
      - text: 'I and IV only'
        correct: true
      - text: 'I, II, and IV only'
        rationale: |
          This accepts the digit-sum test for four. Digit sums are valid for three and nine. Check that four uses the last two digits.
      - text: 'I, III, and IV only'
        rationale: |
          This accepts three and six as sufficient factors for eighteen. Their product is eighteen. Check whether the factors share a factor.
      - text: 'II and III only'
        rationale: |
          This accepts both a wrong four test and an overlapping factor split. Both resemble valid rules for other divisors. Check each rule with a small counterexample.
    explanation: |
      Statement I holds because $0\div b=0$ for any nonzero integer $b$. Statement IV gives the alternating-sum rule for $11$: a difference of zero or a multiple of $11$ passes the test. These are the true statements.

  - id: q-arithmetic-number-sense-divisibility-rules-0016
    type: direct-computation
    difficulty: easy
    stem: |
      To test $343$ for divisibility by $7$, double the last digit and subtract it from the remaining digits. What number results after one step?
    choices:
      - text: '$28$'
        correct: true
      - text: '$31$'
        rationale: |
          This subtracts the last digit without doubling it. Removing and subtracting seems like the rule. Check the factor two.
      - text: '$40$'
        rationale: |
          This adds the doubled last digit. The same two numbers are used. Check the subtraction sign.
      - text: '$337$'
        rationale: |
          This subtracts from the full original number. Keeping every digit can seem safer. Check that the last digit is removed first.
    explanation: |
      The last digit is $3$, whose double is $6$. The remaining digits form $34$. Subtract: $34-6=28$.
    approved: false

  - id: q-arithmetic-number-sense-divisibility-rules-0017
    type: word-problem
    difficulty: medium
    stem: |
      A warehouse has $518$ notebooks and packs them in bundles of $7$. How many notebooks remain after making as many full bundles as possible?
    choices:
      - text: '$0$'
        correct: true
      - text: '$1$'
        rationale: |
          This uses the last digit remainder $8\div7$. Last-digit shortcuts work for some divisors. Check the entire number for seven.
      - text: '$4$'
        rationale: |
          This adds the digits and divides their sum sixteen by seven. Digit sums work for three and nine. Check the rule for seven.
      - text: '$6$'
        rationale: |
          This divides the leading part fifty-one by seven. Removing the last digit is part of the test. Check that its doubled value must also be subtracted.
    explanation: |
      The seven test gives $51-2(8)=35$, a multiple of $7$. Thus $518$ is divisible by $7$. It makes $74$ full bundles with zero notebooks left.
    approved: false

  - id: q-arithmetic-number-sense-divisibility-rules-0018
    type: error-spotting
    difficulty: medium
    stem: |
      A student tests $1234$ for divisibility by $11$ by forming $(1+2)-(3+4)$. What is the needed correction?
    choices:
      - text: 'Use $(1+3)-(2+4)$.'
        correct: true
      - text: 'Use $(1+2)+(3+4)$ instead.'
        rationale: |
          This uses the total digit sum. That is a valid rule for other divisors. Check that eleven uses alternating groups.
      - text: 'Use $34$ as the whole test number.'
        rationale: |
          This tests only the final two digits. That works for divisibility by four. Check the rule for eleven.
      - text: 'Use $123-2(4)$ instead.'
        rationale: |
          This uses the seven test. It is another digit-based shortcut. Check the target divisor.
    explanation: |
      The eleven test separates alternating positions. Positions one and three give $1+3$. Positions two and four give $2+4$. The needed difference is $(1+3)-(2+4)$.
    approved: false

  - id: q-arithmetic-number-sense-divisibility-rules-0019
    type: which-is-true
    difficulty: hard
    stem: |
      For an integer $n$, which condition guarantees that $n$ is divisible by $30$?
    choices:
      - text: 'Divisible by both $3$ and $10$.'
        correct: true
      - text: 'Divisible by both $2$ and $5$.'
        rationale: |
          This omits the factor three. Two and five are factors of thirty. Check that their product is only ten.
      - text: 'Divisible by both $3$ and $6$.'
        rationale: |
          This uses factors that overlap and omits five. Both numbers divide thirty. Check that their combined tests guarantee only a multiple of six.
      - text: 'Divisible by both $5$ and $10$.'
        rationale: |
          This omits three and repeats the factor five. Both tests apply to a multiple of thirty. Check that passing them can also occur for ten.
    explanation: |
      The factors $3$ and $10$ have no common factor greater than $1$. Their product is $30$. Therefore passing both tests guarantees divisibility by $30$.
    approved: false

  - id: q-arithmetic-number-sense-divisibility-rules-0020
    type: direct-computation
    difficulty: exam
    stem: |
      How many digits $d$ from $0$ through $9$ make $14d0$ divisible by $12$?
    choices:
      - text: '$1$'
        correct: true
      - text: '$3$'
        rationale: |
          This counts digits passing only the three test. That test is required for twelve. Check the four test too.
      - text: '$5$'
        rationale: |
          This counts all even digits passing only the four test. Even endings are required here. Check the digit sum as well.
      - text: '$10$'
        rationale: |
          This assumes a final zero makes every digit valid. A final zero guarantees divisibility by ten. Check the factors of twelve instead.
    explanation: |
      Use the tests for $3$ and $4$, whose product is $12$. The ending $d0$ divides by $4$ when $d$ is even. The digit sum $5+d$ divides by $3$ when $d=1,4,7$. Only $4$ is even among these, so exactly one digit works.
    approved: false
