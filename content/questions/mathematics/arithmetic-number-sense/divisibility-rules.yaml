meta:
  subject: mathematics
  topic: arithmetic-number-sense
  subtopic: divisibility-rules
  exams: [upcat, acet, dlsucet, ustet, pupcet, cse-pro, cse-sub]
questions:
  - id: q-arithmetic-number-sense-divisibility-rules-0001
    type: which-is-true
    difficulty: easy
    stem: |
      Which of the following statements regarding the number $0$ is true?
    choices:
      - text: "$0$ is not divisible by any non-zero integer."
        rationale: |
          You assumed 0 cannot be divided, confusing 0 as a dividend with 0 as a divisor.
      - text: "$0$ is divisible by every non-zero integer."
        correct: true
      - text: "$0$ is divisible only by $10$."
        rationale: |
          You assumed 0 is only divisible by 10 because 0 ends in zero.
      - text: "$0$ is divisible by $0$."
        rationale: |
          You assumed 0 can be divided by 0, but division by 0 is mathematically undefined.
    explanation: |
      A number $a$ is divisible by a non-zero integer $b$ if there exists an integer $k$ such that $a=bk$. For $a=0$, $0=b\cdot0$ for every $b\neq0$. Division by zero remains undefined.

  - id: q-arithmetic-number-sense-divisibility-rules-0002
    type: direct-computation
    difficulty: easy
    stem: |
      To test if $4,516$ is divisible by $4$, a student erroneously adds all the digits ($4 + 5 + 1 + 6 = 16$). What is the correct rule to check divisibility by $4$, and is $4,516$ divisible by $4$?
    choices:
      - text: "Check if the sum of all digits is divisible by $4$; yes, $4,516$ is divisible by $4$."
        rationale: |
          You incorrectly applied the digit sum rule used for 3 and 9.
      - text: "Check if the last two digits form a number divisible by $4$; yes, $4,516$ is divisible by $4$ because $16$ is divisible by $4$."
        correct: true
      - text: "Check if the last digit is divisible by $4$; no, $4,516$ is not divisible by $4$ because $6$ is not divisible by $4$."
        rationale: |
          Divisibility by 4 depends on the last two digits, not the last digit alone.
      - text: "Check if the number is odd; no, $4,516$ is not divisible by $4$."
        rationale: |
          $4,516$ is even, and parity alone is not sufficient for divisibility by 4.
    explanation: |
      A number is divisible by 4 iff the number formed by its last two digits is divisible by 4. Here the last two digits are 16, so $4,516$ is divisible by 4.

  - id: q-arithmetic-number-sense-divisibility-rules-0003
    type: direct-computation
    difficulty: easy
    stem: |
      The five-digit number $57x81$ is divisible by $9$. What is the value of the digit $x$?
    choices:
      - text: "$3$"
        rationale: |
          $21+3=24$, which is not divisible by 9.
      - text: "$6$"
        correct: true
      - text: "$7$"
        rationale: |
          $21+7=28$, which is not divisible by 9.
      - text: "$9$"
        rationale: |
          The divisibility test is based on the digit sum, not on choosing the digit 9.
    explanation: |
      The digit sum is $21+x$. For a digit $x\in\{0,\ldots,9\}$, the only way for this to be a multiple of 9 is $21+x=27$, so $x=6$.

  - id: q-arithmetic-number-sense-divisibility-rules-0004
    type: which-is-true
    difficulty: easy
    stem: |
      Which of the following numbers is divisible by $6$?
    choices:
      - text: "$24,534$"
        correct: true
      - text: "$24,536$"
        rationale: |
          It is even, but its digit sum is 20, which is not divisible by 3.
      - text: "$24,538$"
        rationale: |
          It is even, but its digit sum is 22, which is not divisible by 3.
      - text: "$24,539$"
        rationale: |
          It is odd, so it cannot be divisible by 6.
    explanation: |
      Divisibility by 6 requires divisibility by both 2 and 3. $24,534$ is even and has digit sum 18, so it is divisible by 6.

  - id: q-arithmetic-number-sense-divisibility-rules-0005
    type: which-is-true
    difficulty: medium
    stem: |
      To test if a large number is divisible by $24$, a student checks if the number is divisible by both $4$ and $6$. Why is this test logically flawed, and what is the correct pair of factors to use?
    choices:
      - text: "The test is flawed because $4$ and $6$ are not coprime. The correct coprime factors are $3$ and $8$."
        correct: true
      - text: "The test is flawed because $24$ is odd. The correct factors are $2$ and $12$."
        rationale: |
          $24$ is even.
      - text: "The test is valid; any number divisible by $4$ and $6$ is always divisible by $24$."
        rationale: |
          For example, 12 is divisible by 4 and 6 but not by 24.
      - text: "The test is flawed because $4 + 6 \\neq 24$. The correct factors are $4$ and $20$."
        rationale: |
          Composite divisibility uses factorization, not addition.
    explanation: |
      Since $\operatorname{lcm}(4,6)=12$, simultaneous divisibility by 4 and 6 only guarantees divisibility by 12. The coprime factors 3 and 8 have product 24, so divisibility by both is equivalent to divisibility by 24.

  - id: q-arithmetic-number-sense-divisibility-rules-0006
    type: direct-computation
    difficulty: medium
    stem: |
      Find the missing digit $d$ such that the six-digit number $73d,514$ is divisible by $11$.
    choices:
      - text: "$d = 2$"
        rationale: |
          The alternating-sum difference is not a multiple of 11.
      - text: "$d = 4$"
        correct: true
      - text: "$d = 6$"
        rationale: |
          The alternating-sum difference is 2, not a multiple of 11.
      - text: "$d = 9$"
        rationale: |
          The alternating-sum test does not work for this digit.
    explanation: |
      Odd-position sum: $7+d+1=8+d$. Even-position sum: $3+5+4=12$. Their difference is $d-4$, so $d=4$ makes the difference zero.

  - id: q-arithmetic-number-sense-divisibility-rules-0007
    type: direct-computation
    difficulty: medium
    stem: |
      A store owner counts total earnings of $\text{₱}48,k72$, where $k$ is a missing digit. If the total amount in pesos is divisible by $8$, which of the following could be the value of $k$?
    choices:
      - text: "$k = 1$"
        rationale: |
          $172$ is not divisible by 8.
      - text: "$k = 3$"
        rationale: |
          $372$ is not divisible by 8.
      - text: "$k = 5$"
        rationale: |
          $572$ is not divisible by 8.
      - text: "$k = 6$"
        correct: true
    explanation: |
      Divisibility by 8 depends on the last three digits. Among the options, only $672=8\cdot84$, so $k=6$.

  - id: q-arithmetic-number-sense-divisibility-rules-0008
    type: which-is-true
    difficulty: medium
    stem: |
      What is the primary purpose of the "casting out nines" technique, and what remainder is obtained when $84,931$ is divided by $9$?
    choices:
      - text: "It finds the remainder when a number is divided by $9$ by taking the repeated sum of its digits; the remainder for $84,931$ is $7$."
        correct: true
      - text: "It finds the remainder when a number is divided by $9$ by dropping all even digits; the remainder for $84,931$ is $4$."
        rationale: |
          Casting out nines uses digit sums, not deletion of even digits.
      - text: "It tests divisibility by $11$ by subtracting $9$ from each digit; the remainder for $84,931$ is $2$."
        rationale: |
          This confuses the method with the rule for 11.
      - text: "It finds the remainder when a number is divided by $8$; the remainder for $84,931$ is $1$."
        rationale: |
          Casting out nines is a modulo-9 technique.
    explanation: |
      $8+4+9+3+1=25$ and $2+5=7$, so $84,931\equiv7\pmod9$.

  - id: q-arithmetic-number-sense-divisibility-rules-0009
    type: which-is-true
    difficulty: medium
    stem: |
      Which of the following numbers is NOT a divisor of $3,960$?
    choices:
      - text: "$11$"
        rationale: |
          The alternating digit sums differ by zero, so 11 is a divisor.
      - text: "$9$"
        rationale: |
          The digit sum is 18, so 9 is a divisor.
      - text: "$8$"
        rationale: |
          $960$ is divisible by 8.
      - text: "$7$"
        correct: true
    explanation: |
      $3,960$ is divisible by 11, 9, and 8, but not by 7.

  - id: q-arithmetic-number-sense-divisibility-rules-0010
    type: direct-computation
    difficulty: hard
    stem: |
      A financial record shows a total amount of $\text{₱}3a4,5b2$. If this six-digit number is divisible by $99$, what are the values of the digits $a$ and $b$?
    choices:
      - text: "$a = 2, b = 2$"
        correct: true
      - text: "$a = 4, b = 9$"
        rationale: |
          The divisibility-by-11 condition fails.
      - text: "$a = 7, b = 6$"
        rationale: |
          Both the 9 and 11 tests fail.
      - text: "$a = 5, b = 8$"
        rationale: |
          The divisibility-by-11 condition fails.
    explanation: |
      Divisibility by 99 requires divisibility by 9 and 11. The digit sum is $14+a+b$, while the alternating-sum condition gives $b-a\equiv0\pmod{11}$. For digits, this forces $a=b$. Then $14+2a$ must be a multiple of 9; the only digit solution is $a=b=2$.

  - id: q-arithmetic-number-sense-divisibility-rules-0011
    type: which-is-true
    difficulty: hard
    stem: |
      Which of the following statements regarding composite divisibility rules is false?
    choices:
      - text: "A number is divisible by $45$ if and only if it is divisible by both $5$ and $9$."
        rationale: |
          This is true because 5 and 9 are coprime and their product is 45.
      - text: "A number is divisible by $18$ if and only if it is even and its digit sum is divisible by $9$."
        rationale: |
          This is true because it tests divisibility by 2 and 9.
      - text: "A number is divisible by $12$ if and only if it is divisible by both $2$ and $6$."
        correct: true
      - text: "A number is divisible by $72$ if and only if it is divisible by both $8$ and $9$."
        rationale: |
          This is true because 8 and 9 are coprime and their product is 72.
    explanation: |
      Divisibility by both 2 and 6 only guarantees divisibility by $\operatorname{lcm}(2,6)=6$, not 12. The other three conditions are equivalent to divisibility by their stated composite numbers.

  - id: q-arithmetic-number-sense-divisibility-rules-0012
    type: direct-computation
    difficulty: hard
    stem: |
      The five-digit number $72x4y$ is divisible by $45$. What is the maximum possible value of the product $x \times y$?
    choices:
      - text: "$0$"
        rationale: |
          This misses the larger valid case with $y=5$.
      - text: "$20$"
        rationale: |
          $x=4,y=5$ does not satisfy the digit-sum requirement.
      - text: "$36$"
        rationale: |
          $y=9$ cannot satisfy divisibility by 5.
      - text: "$45$"
        correct: true
    explanation: |
      $y$ must be 0 or 5. If $y=0$, the digit sum requires $x=5$, giving product 0. If $y=5$, the digit sum allows $x=0$ or 9, so the maximum product is $9\cdot5=45$.

  - id: q-arithmetic-number-sense-divisibility-rules-0013
    type: direct-computation
    difficulty: hard
    stem: |
      A jackpot prize of $\text{₱}5x3,4y6$ is evenly distributed among $88$ winners without any leftover pesos. What is the minimum possible value of $x + y$?
    choices:
      - text: "$5$"
        rationale: |
          No valid digit pair gives a sum of 5.
      - text: "$8$"
        correct: true
      - text: "$11$"
        rationale: |
          No valid digit pair gives a sum of 11.
      - text: "$14$"
        rationale: |
          The valid larger pair gives 16, not 14.
    explanation: |
      Divisibility by 88 requires divisibility by 8 and 11. The last three digits $4y6$ are divisible by 8 for $y=1,5,9$. The 11-test gives $x-y+2=0$ for valid digit solutions, yielding $(x,y)=(3,5)$ and $(7,9)$. Their sums are 8 and 16, so the minimum possible value is 8.

  - id: q-arithmetic-number-sense-divisibility-rules-0014
    type: direct-computation
    difficulty: exam-level
    stem: |
      A bank security code consists of the eight-digit number $20x5432y$. If the code is known to be divisible by $72$, what is the maximum possible value of $x + y$?
    choices:
      - text: "$5$"
        rationale: |
          This is not one of the valid sums.
      - text: "$8$"
        rationale: |
          This is not one of the valid sums.
      - text: "$11$"
        correct: true
      - text: "$14$"
        rationale: |
          This does not satisfy the divisibility-by-9 condition.
    explanation: |
      Divisibility by 72 requires divisibility by 8 and 9. The last three digits $32y$ are divisible by 8 for $y=0$ or 8. If $y=0$, the digit sum gives $x=2$, so $x+y=2$. If $y=8$, the digit sum gives $x=3$, so $x+y=11$. Therefore the maximum possible value is 11.

  - id: q-arithmetic-number-sense-divisibility-rules-0015
    type: which-is-true
    difficulty: exam-level
    stem: |
      Consider the following four mathematical statements regarding divisibility rules:

      I. The number $0$ is divisible by all non-zero integers.
      II. A number is divisible by $4$ if the sum of its digits is divisible by $4$.
      III. A number is divisible by $18$ if and only if it is divisible by both $3$ and $6$.
      IV. A number is divisible by $11$ if the difference between the sum of digits in odd positions and even positions is $0$ or a multiple of $11$.

      Which of the statements above are true?
    choices:
      - text: "I and IV only"
        correct: true
      - text: "I, II, and IV only"
        rationale: |
          Statement II is false; divisibility by 4 uses the last two digits.
      - text: "I, III, and IV only"
        rationale: |
          Statement III is false; divisibility by 3 and 6 only guarantees divisibility by 6.
      - text: "II and III only"
        rationale: |
          Both II and III are false.
    explanation: |
      I and IV are standard true statements. II is false because the test for 4 uses the last two digits. III is false because $\operatorname{lcm}(3,6)=6$, so divisibility by both does not imply divisibility by 18.
