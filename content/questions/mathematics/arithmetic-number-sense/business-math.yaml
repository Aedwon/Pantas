meta:
  subject: mathematics
  topic: arithmetic-number-sense
  subtopic: business-math
  exams: [upcat, acet, dlsucet, ustet, pupcet, cse-pro, cse-sub]
questions:
  - id: q-arithmetic-number-sense-business-math-0001
    type: word-problem
    difficulty: easy
    stem: |
      Aling Nena bought a wholesale box of canned goods for $\text{₱}800.00$ to sell in her sari-sari store. If she applies a 25% markup based on cost, what is the selling price?
    choices:
      - text: "$\\text{₱}1,000.00$"
        correct: true
      - text: "$\\text{₱}1,066.67$"
        rationale: |
          You calculated selling price assuming a 25 percent margin on selling price (800 / 0.75) instead of markup on cost.
      - text: "$\\text{₱}200.00$"
        rationale: |
          You reported the markup amount (P200) instead of adding it to the cost price to get the selling price.
      - text: "$\\text{₱}600.00$"
        rationale: |
          You subtracted the 25 percent markup from the cost price instead of adding it.
    explanation: |
      Markup: $\text{₱}800 \times 0.25 = \text{₱}200$

      Selling price: $\text{₱}800 + \text{₱}200 = \text{₱}1,000$

      Trap: Confusing markup on cost with margin on selling price.

  - id: q-arithmetic-number-sense-business-math-0002
    type: word-problem
    difficulty: easy
    stem: |
      A hypothetical jeepney fare is $\text{₱}13.00$ for the first 4 km and $\text{₱}1.80$ for each additional kilometer **or fraction thereof**. Mang Juan travels 11.5 km. How much is his fare?
    choices:
      - text: "$\\text{₱}26.50$"
        rationale: |
          You charged the 7.5 km excess proportionally instead of applying the stated rule that a fraction of an additional kilometer is charged as a full kilometer.
      - text: "$\\text{₱}27.40$"
        correct: true
      - text: "$\\text{₱}33.70$"
        rationale: |
          You applied the additional-kilometer charge to the full trip instead of only the distance beyond the first 4 km.
      - text: "$\\text{₱}20.70$"
        rationale: |
          You calculated a distance-based amount without correctly combining the base fare and the excess-distance charge.
    explanation: |
      Excess distance: $11.5 - 4 = 7.5$ km. Under the stated "or fraction thereof" rule, this is charged as 8 additional kilometers.

      Additional fare: $8 \times \text{₱}1.80 = \text{₱}14.40$.

      Total fare: $\text{₱}13 + \text{₱}14.40 = \text{₱}27.40$.

  - id: q-arithmetic-number-sense-business-math-0003
    type: word-problem
    difficulty: easy
    stem: |
      Mang Pedro borrowed $\text{₱}15,000$ at 8% simple annual interest. He repaid after 9 months. How much interest?
    choices:
      - text: "$\\text{₱}900.00$"
        correct: true
      - text: "$\\text{₱}1,200.00$"
        rationale: |
          You calculated simple interest for a full year (12 months) instead of 9 months.
      - text: "$\\text{₱}10,800.00$"
        rationale: |
          You multiplied P15,000 by 9 months directly without dividing by 12 months.
      - text: "$\\text{₱}15,900.00$"
        rationale: |
          You calculated total repayment (principal plus interest) instead of interest alone.
    explanation: |
      Time: $\frac{9}{12} = 0.75$ years

      Interest: $I = P \times r \times t = \text{₱}15,000 \times 0.08 \times 0.75 = \text{₱}900$

      Trap: Using full year instead of 9 months.

  - id: q-arithmetic-number-sense-business-math-0004
    type: word-problem
    difficulty: easy
    stem: |
      Wholesale offers 5% discount on purchases over $\text{₱}1,000$. Aling Rose buys stock tagged at $\text{₱}2,400$. How much after discount?
    choices:
      - text: "$\\text{₱}2,330.00$"
        rationale: |
          You subtracted a 70 pesos discount instead of calculating 5 percent of P2,400.
      - text: "$\\text{₱}2,280.00$"
        correct: true
      - text: "$\\text{₱}120.00$"
        rationale: |
          You reported the discount amount (P120) instead of the net price paid after discount.
      - text: "$\\text{₱}2,520.00$"
        rationale: |
          You added the 5 percent discount to the price instead of subtracting it.
    explanation: |
      Discount: $\text{₱}2,400 \times 0.05 = \text{₱}120$

      Net price: $\text{₱}2,400 - \text{₱}120 = \text{₱}2,280$

  - id: q-arithmetic-number-sense-business-math-0005
    type: word-problem
    difficulty: medium
    stem: |
      Store assistant earns $\text{₱}400$/day basic + 4% commission on weekly net profit. In 6-day week with $\text{₱}35,000$ revenue and $\text{₱}25,000$ cost, what are total earnings?
    choices:
      - text: "$\\text{₱}3,800.00$"
        rationale: |
          You calculated commission on total revenue P35,000 (P1,400) instead of net profit P10,000.
      - text: "$\\text{₱}2,800.00$"
        correct: true
      - text: "$\\text{₱}800.00$"
        rationale: |
          You calculated total earnings for 1 day instead of a 6-day work week.
      - text: "$\\text{₱}2,400.00$"
        rationale: |
          You reported basic weekly wage (6 days at P400) but omitted the commission earned.
    explanation: |
      Base wage: $6 \times \text{₱}400 = \text{₱}2,400$

      Net profit: $\text{₱}35,000 - \text{₱}25,000 = \text{₱}10,000$

      Commission: $\text{₱}10,000 \times 0.04 = \text{₱}400$

      Total: $\text{₱}2,400 + \text{₱}400 = \text{₱}2,800$

  - id: q-arithmetic-number-sense-business-math-0006
    type: word-problem
    difficulty: medium
    stem: |
      Aling Toyang sells instant noodles for $\text{₱}25/pack$, cost $\text{₱}20/pack$. What is profit margin % on selling price?
    choices:
      - text: "$25\\%$"
        rationale: |
          You calculated profit percentage based on cost price (markup) instead of selling price.
      - text: "$20\\%$"
        correct: true
      - text: "$80\\%$"
        rationale: |
          You calculated the cost price as a percentage of the selling price (20/25 = 80%).
      - text: "$5\\%$"
        rationale: |
          You reported the absolute profit amount (P5) as a percentage.
    explanation: |
      Profit: $\text{₱}25 - \text{₱}20 = \text{₱}5$

      Profit margin: $\frac{\text{₱}5}{\text{₱}25} \times 100\% = 20\%$

      Trap: Confusing with markup ($\frac{\text{₱}5}{\text{₱}20} = 25\%$).

  - id: q-arithmetic-number-sense-business-math-0007
    type: word-problem
    difficulty: medium
    stem: |
      In a hypothetical fare problem, a student receives a 20% discount from the regular fare. The regular route fare is $\text{₱}13$ for the first 4 km, then $\text{₱}1.75$/km. If the student travels exactly 9 km, how much is the discounted fare?
    choices:
      - text: "$\\text{₱}21.75$"
        rationale: |
          You calculated the regular fare without applying the stated 20 percent discount.
      - text: "$\\text{₱}19.15$"
        rationale: |
          You applied the discount to only part of the fare or miscalculated it.
      - text: "$\\text{₱}17.40$"
        correct: true
      - text: "$\\text{₱}20.00$"
        rationale: |
          You rounded or miscalculated the final discounted fare.
    explanation: |
      Regular fare: $\text{₱}13 + (9-4) \times \text{₱}1.75 = \text{₱}21.75$.

      Discount: $\text{₱}21.75 \times 0.20 = \text{₱}4.35$.

      Discounted fare: $\text{₱}21.75 - \text{₱}4.35 = \text{₱}17.40$.

      The 20% discount is an explicit assumption of this math problem, not a claim about a current regulated fare schedule.

  - id: q-arithmetic-number-sense-business-math-0008
    type: word-problem
    difficulty: medium
    stem: |
      Mang Ben borrowed $\text{₱}50,000$ at 6% simple annual interest for 15 months. Total repayment?
    choices:
      - text: "$\\text{₱}53,750.00$"
        correct: true
      - text: "$\\text{₱}54,500.00$"
        rationale: |
          You calculated interest for 1.5 years (18 months) instead of 1.25 years (15 months).
      - text: "$\\text{₱}3,750.00$"
        rationale: |
          You reported the interest earned instead of total repayment (principal plus interest).
      - text: "$\\text{₱}95,000.00$"
        rationale: |
          You multiplied principal by 1.9 or miscalculated interest formula parameters.
    explanation: |
      Time: $\frac{15}{12} = 1.25$ years

      Interest: $\text{₱}50,000 \times 0.06 \times 1.25 = \text{₱}3,750$

      Repayment: $\text{₱}50,000 + \text{₱}3,750 = \text{₱}53,750$

  - id: q-arithmetic-number-sense-business-math-0009
    type: word-problem
    difficulty: medium
    stem: |
      Sari-sari owner orders inventory ($\text{₱}5,000$ list price). Supplier offers successive 10% then 5% discounts. Net price?
    choices:
      - text: "$\\text{₱}4,250.00$"
        rationale: |
          You added the discount percentages together (10% + 5% = 15%) instead of compounding them sequentially.
      - text: "$\\text{₱}4,275.00$"
        correct: true
      - text: "$\\text{₱}4,500.00$"
        rationale: |
          You applied only the first 10 percent discount and omitted the additional 5 percent discount.
      - text: "$\\text{₱}725.00$"
        rationale: |
          You reported the total discount amount (P725) instead of the final net price paid.
    explanation: |
      After 10%: $\text{₱}5,000 \times 0.90 = \text{₱}4,500$

      After 5%: $\text{₱}4,500 \times 0.95 = \text{₱}4,275$

      Trap: Adding discounts ($10\% + 5\% = 15\%$) instead of multiplying sequentially.

  - id: q-arithmetic-number-sense-business-math-0010
    type: word-problem
    difficulty: hard
    stem: |
      Mang Juan bought 30 dozen eggs at $\text{₱}90/dozen$. During transport, 3 dozen broke. He wants 20% net profit on total investment. Selling price per dozen?
    choices:
      - text: "$\\text{₱}108.00$"
        rationale: |
          You calculated 20 percent profit on original price P90 without adjusting for 3 broken dozen eggs.
      - text: "$\\text{₱}100.00$"
        rationale: |
          You divided total cost P2,700 by 27 sellable dozen without adding the 20 percent target profit.
      - text: "$\\text{₱}120.00$"
        correct: true
      - text: "$\\text{₱}114.00$"
        rationale: |
          You divided target revenue P3,240 by all 30 original dozen eggs instead of 27 sellable dozen.
    explanation: |
      Total cost: $30 \times \text{₱}90 = \text{₱}2,700$

      Target revenue (20% profit): $\text{₱}2,700 \times 1.20 = \text{₱}3,240$

      Sellable: $30 - 3 = 27$ dozen

      Selling price: $\frac{\text{₱}3,240}{27} = \text{₱}120/dozen$

  - id: q-arithmetic-number-sense-business-math-0011
    type: word-problem
    difficulty: hard
    stem: |
      Aling Marites invested $\text{₱}20,000$ in a micro-finance fund. After 18 months, value is $\text{₱}23,600$. What annual simple interest rate?
    choices:
      - text: "$12\\%$"
        correct: true
      - text: "$18\\%$"
        rationale: |
          You calculated simple interest rate over 18 months without converting time to years (1.5 years).
      - text: "$10\\%$"
        rationale: |
          You divided P3,600 by P20,000 and ignored the 1.5-year duration.
      - text: "$1\\%$"
        rationale: |
          You miscalculated 0.12 as 1 percent instead of 12 percent.
    explanation: |
      Interest: $\text{₱}23,600 - \text{₱}20,000 = \text{₱}3,600$

      Time: $\frac{18}{12} = 1.5$ years

      Rate: $r = \frac{I}{P \times t} = \frac{\text{₱}3,600}{\text{₱}20,000 \times 1.5} = 0.12 = 12\%$

  - id: q-arithmetic-number-sense-business-math-0012
    type: word-problem
    difficulty: hard
    stem: |
      Soft drink agent earns: 3% on first $\text{₱}50,000$, 5% on next $\text{₱}50,000$, 8% on sales above $\text{₱}100,000$. Total sales $\text{₱}140,000$. Commission?
    choices:
      - text: "$\\text{₱}11,200.00$"
        rationale: |
          You applied 8 percent commission rate to the entire P140,000 sales figure.
      - text: "$\\text{₱}7,000.00$"
        rationale: |
          You applied 5 percent commission rate to the entire P140,000 sales figure.
      - text: "$\\text{₱}7,200.00$"
        correct: true
      - text: "$\\text{₱}8,700.00$"
        rationale: |
          You miscalculated tier 3 sales as P60,000 instead of P40,000.
    explanation: |
      Tier 1: $\text{₱}50,000 \times 0.03 = \text{₱}1,500$

      Tier 2: $\text{₱}50,000 \times 0.05 = \text{₱}2,500$

      Tier 3: $(\text{₱}140,000 - \text{₱}100,000) \times 0.08 = \text{₱}40,000 \times 0.08 = \text{₱}3,200$

      Total: $\text{₱}1,500 + \text{₱}2,500 + \text{₱}3,200 = \text{₱}7,200$

  - id: q-arithmetic-number-sense-business-math-0013
    type: word-problem
    difficulty: hard
    stem: |
      Aling Loring wants 20% net profit margin on selling price for canned goods costing $\text{₱}480$. What markup % on cost?
    choices:
      - text: "$20\\%$"
        rationale: |
          You assumed profit margin percentage on selling price is identical to markup percentage on cost.
      - text: "$25\\%$"
        correct: true
      - text: "$16.67\\%$"
        rationale: |
          You calculated 120 divided by 720 or miscalculated the markup percentage.
      - text: "$24\\%$"
        rationale: |
          You multiplied 20 percent by 1.2 or miscalculated the percentage conversion.
    explanation: |
      If margin = 20% of price: Cost = 0.80 × Price

      $\text{₱}480 = 0.80 \times Price \implies Price = \text{₱}600$

      Profit: $\text{₱}600 - \text{₱}480 = \text{₱}120$

      Markup: $\frac{\text{₱}120}{\text{₱}480} \times 100\% = 25\%$

  - id: q-arithmetic-number-sense-business-math-0014
    type: word-problem
    difficulty: exam-level
    stem: |
      Mang Cardo's jeepney makes 8 round trips daily. Assume each **one-way leg** carries 15 paying passengers at $\text{₱}13$ each. Daily expenses are $\text{₱}800$ boundary plus $\text{₱}950$ fuel. What is the net daily cash income after these expenses?
    choices:
      - text: "$\\text{₱}1,370.00$"
        correct: true
      - text: "$-\\text{₱}190.00$"
        rationale: |
          You counted only 8 one-way legs instead of 16 one-way legs in 8 round trips.
      - text: "$\\text{₱}2,320.00$"
        rationale: |
          You subtracted the boundary expense but omitted fuel.
      - text: "$\\text{₱}3,120.00$"
        rationale: |
          You reported gross fare revenue without subtracting either stated expense.
    explanation: |
      Eight round trips contain $8\times2=16$ one-way legs.

      Passenger rides: $16\times15=240$.

      Gross fare revenue: $240\times\text{₱}13=\text{₱}3,120$.

      Expenses: $\text{₱}800+\text{₱}950=\text{₱}1,750$.

      Net cash income: $\text{₱}3,120-\text{₱}1,750=\text{₱}1,370$.

  - id: q-arithmetic-number-sense-business-math-0015
    type: word-problem
    difficulty: exam-level
    stem: |
      Tatay Mario borrowed $\text{₱}40,000$ at 9% simple annual interest. After 8 months, he paid $\text{₱}15,000$ (interest paid first, remainder to principal). Remaining principal?
    choices:
      - text: "$\\text{₱}25,000.00$"
        rationale: |
          You subtracted the full P15,000 payment from principal without deducting accrued interest first.
      - text: "$\\text{₱}27,400.00$"
        correct: true
      - text: "$\\text{₱}28,600.00$"
        rationale: |
          You calculated interest for a full year (P3,600) instead of 8 months (P2,400).
      - text: "$\\text{₱}22,600.00$"
        rationale: |
          You subtracted interest P2,400 and payment P15,000 from principal (40,000 - 17,400).
    explanation: |
      Accrued interest: $\text{₱}40,000 \times 0.09 \times \frac{8}{12} = \text{₱}2,400$

      Principal reduction: $\text{₱}15,000 - \text{₱}2,400 = \text{₱}12,600$

      Remaining: $\text{₱}40,000 - \text{₱}12,600 = \text{₱}27,400$