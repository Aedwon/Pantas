meta:
  subject: mathematics
  topic: trigonometry
  subtopic: solving-right-triangles
  exams: [upcat, acet, dlsucet, ustet, pupcet]
questions:
  - id: q-trigonometry-solving-right-triangles-0001
    type: word-problem
    difficulty: easy
    stem: |
      A ground-level observation point is $20$ m horizontally from a vertical lamppost on level ground. The angle of elevation to its top is $45^\circ$. How tall is the lamppost?
    choices:
      - text: '$20$ meters'
        correct: true
      - text: '$20\sqrt{2}$ meters'
        rationale: |
          This finds the slanted line of sight, $20\div\cos45^\circ$. That is a real side of the triangle. Check that the requested height is vertical.
      - text: '$20\sqrt{3}$ meters'
        rationale: |
          This uses $\tan60^\circ=\sqrt{3}$ for a $45^\circ$ angle. Both are familiar special-angle values. Check the stated angle before substituting.
      - text: '$10$ meters'
        rationale: |
          This treats the ground distance as a hypotenuse and multiplies it by $\sin30^\circ=\dfrac{1}{2}$. A half is familiar from special triangles. Check both the angle and the side labels.
    explanation: |
      The height is opposite the $45^\circ$ angle and the ground distance is adjacent. Thus $\tan45^\circ=\dfrac{h}{20}$. Since $\tan45^\circ=1$, multiplying by $20$ gives $h=20$ m.
  - id: q-trigonometry-solving-right-triangles-0002
    type: direct-computation
    difficulty: easy
    stem: |
      A right triangle has one acute angle of $35$ degrees. What is the other acute angle?
    choices:
      - text: '$55^\circ$'
        correct: true
      - text: '$35^\circ$'
        rationale: |
          This repeats the known angle. A symmetric right triangle would have equal acute angles. Check whether the given angle is $45^\circ$ before assuming equality.
      - text: '$145^\circ$'
        rationale: |
          This subtracts $35^\circ$ from $180^\circ$, giving $145^\circ$. The full triangle total may look relevant. Check that the right angle has already used $90^\circ$.
      - text: '$65^\circ$'
        rationale: |
          This subtracts $35$ from $100$, giving $65$. A round total of $100$ may look natural. Check that a right angle is $90^\circ$.
    explanation: |
      The right angle uses $90^\circ$ of the triangle's $180^\circ$ total. The two acute angles therefore total $90^\circ$. The missing angle is $90^\circ-35^\circ=55^\circ$.
  - id: q-trigonometry-solving-right-triangles-0003
    type: word-problem
    difficulty: easy
    stem: |
      A $10$-m ladder leans against a vertical wall on horizontal ground. Its foot is $5$ m from the wall. In degrees, what angle does the ladder make with the ground?
    choices:
      - text: '$60^\circ$'
        correct: true
      - text: '$30^\circ$'
        rationale: |
          This finds the angle with the vertical wall. It uses the same triangle, so the result looks relevant. Check which end of the ladder holds the requested angle.
      - text: '$45^\circ$'
        rationale: |
          This assumes the two legs are equal. That would give a symmetric right triangle. Check that the adjacent-to-hypotenuse ratio is one-half, not $\dfrac{\sqrt{2}}{2}$.
      - text: '$120^\circ$'
        rationale: |
          This returns an obtuse cosine angle after reversing the sign. The magnitude of cosine is one-half. Check that an angle between the ladder and horizontal ground is acute.
    explanation: |
      The ladder is the hypotenuse and the ground distance is adjacent to the ground angle $\theta$. Thus $\cos\theta=\dfrac{5}{10}=\dfrac{1}{2}$. The acute angle with this cosine is $60^\circ$.
  - id: q-trigonometry-solving-right-triangles-0004
    type: word-problem
    difficulty: medium
    stem: |
      An observer's eyes are $1.5$ m above level ground, $30$ m horizontally from a vertical tree. The angle of elevation to the treetop is $60^\circ$. How tall is the tree?
    choices:
      - text: '$1.5+30\sqrt{3}$ m'
        correct: true
      - text: '$30\sqrt{3}$ m'
        rationale: |
          This reports only the height above the eyes. The tangent calculation really gives that difference. Check whether the question asks for height from the ground.
      - text: '$1.5+\dfrac{30}{\sqrt{3}}$ m'
        rationale: |
          This divides by $\sqrt{3}$ instead of multiplying by it. The height and distance are the same two sides of the ratio. Check that height is opposite the elevation angle.
      - text: '$30\sqrt{3}-1.5$ m'
        rationale: |
          This subtracts the eye height from the vertical difference. The eye height must be used, so subtraction may seem suitable. Check that the tree reaches from the ground to above the eyes.
    explanation: |
      Tangent gives the height above eye level: $h_{\text{above eyes}}=30\tan60^\circ=30\sqrt{3}$ m. The eyes are $1.5$ m above the ground. Add that height to get the tree's total height: $1.5+30\sqrt{3}$ m.
  - id: q-trigonometry-solving-right-triangles-0005
    type: word-problem
    difficulty: medium
    stem: |
      From a point $50$ m vertically above sea level on a cliff, the angle of depression to a boat at sea level is $30^\circ$. How far horizontally is the boat from the point directly below the observer?
    choices:
      - text: '$50\sqrt{3}$ meters'
        correct: true
      - text: '$50$ meters'
        rationale: |
          This assumes the horizontal and vertical distances are equal. That happens at $45^\circ$. Check the actual depression angle.
      - text: '$\dfrac{50}{\sqrt{3}}$ meters'
        rationale: |
          This multiplies $50$ by $\tan30^\circ$ instead of dividing. The same height and angle are used. Check the equation $\tan30^\circ=50/d$ before rearranging.
      - text: '$100$ meters'
        rationale: |
          This finds the slanted line of sight from $50\div\sin30^\circ$. That distance reaches the boat too. Check that the question asks for horizontal distance.
    explanation: |
      The horizontal through the clifftop is parallel to sea level. The boat's angle of elevation is therefore $30^\circ$. If the horizontal distance is $d$, then $\tan30^\circ=\dfrac{50}{d}$. Hence $d=50\div\dfrac{1}{\sqrt{3}}=50\sqrt{3}$ m.
  - id: q-trigonometry-solving-right-triangles-0006
    type: word-problem
    difficulty: medium
    stem: |
      A ramp rises $3$ m vertically over a horizontal distance of $9$ m. In degrees, what angle does it make with the horizontal?
    choices:
      - text: '$\arctan(\dfrac{1}{3})$'
        correct: true
      - text: '$30^\circ$'
        rationale: |
          This mixes up $\tan30^\circ=\dfrac{1}{\sqrt{3}}$ with $\dfrac{1}{3}$. Both fractions contain $3$. Check the complete special-angle value.
      - text: '$\arctan(\dfrac{3}{1})$'
        rationale: |
          This reverses rise and run, using $9/3=3$. Both measured sides appear. Check that tangent is vertical rise divided by horizontal run.
      - text: '$45^\circ$'
        rationale: |
          This assumes equal rise and run. A $45^\circ$ ramp would have equal legs. Check the given lengths before using that angle.
    explanation: |
      The rise is opposite and the horizontal run is adjacent to the ramp angle $\theta$. Thus $\tan\theta=\dfrac{3}{9}=\dfrac{1}{3}$. The angle in degrees is $\arctan(\dfrac{1}{3})$.
  - id: q-trigonometry-solving-right-triangles-0007
    type: word-problem
    difficulty: hard
    stem: |
      Two ground-level observation points lie on the same side of a vertical flagpole on level ground. At point $A$, the angle of elevation is $30^\circ$. At point $B$, $100$ m closer to the pole along the same line, it is $60^\circ$. How tall is the pole?
    choices:
      - text: '$50\sqrt{3}$ meters'
        correct: true
      - text: '$100\sqrt{3}$ meters'
        rationale: |
          This treats the $100$-m walk as the distance from the nearer point to the pole. It is the only distance directly given. Check that the walk separates two observation points.
      - text: '$100$ meters'
        rationale: |
          This reports the walking distance as the height. The same number appears in the two-triangle setup. Check that the required distance is vertical.
      - text: '$75\sqrt{3}$ meters'
        rationale: |
          This averages $50$ m and $100$ m, then multiplies by $\sqrt{3}$. Both lengths appear during the calculation. Check that the nearer distance comes from the two tangent equations, not an average.
    explanation: |
      Let $x$ be the distance from the nearer point to the pole and $h$ its height. From that point, $h=x\tan60^\circ=x\sqrt{3}$. From the farther point, $h=(x+100)\tan30^\circ=\dfrac{x+100}{\sqrt{3}}$. Equate the heights and multiply by $\sqrt{3}$: $3x=x+100$. Thus $x=50$ and $h=50\sqrt{3}$ m.
  - id: q-trigonometry-solving-right-triangles-0008
    type: direct-computation
    difficulty: hard
    stem: |
      A right triangle has hypotenuse $40$ and one acute angle of $35$ degrees. Which ratio would you use to find the side opposite the $35$ degree angle?
    choices:
      - text: '$\sin 35^\circ$'
        correct: true
      - text: '$\cos 35^\circ$'
        rationale: |
          This selects the ratio for adjacent over hypotenuse. The known hypotenuse makes cosine seem suitable. Check whether the unknown side is adjacent or opposite.
      - text: '$\tan 35^\circ$'
        rationale: |
          This selects opposite over adjacent. It includes the needed opposite side. Check that the other known side is the hypotenuse.
      - text: '$\sec 35^\circ$'
        rationale: |
          This selects hypotenuse over adjacent. It includes the known hypotenuse. Check that the unknown side lies opposite the given angle.
    explanation: |
      Sine compares the opposite side with the hypotenuse. If the opposite side is $a$, then $\sin35^\circ=\dfrac{a}{40}$. Multiplying by $40$ finds that side.
  - id: q-trigonometry-solving-right-triangles-0009
    type: error-spotting
    difficulty: hard
    stem: |
      A window is $25$ m above a horizontal street. The depression angle to a car at street level is $40^\circ$. A student writes Step 1: the line of sight makes $50^\circ$ with the vertical. Step 2: $\tan50^\circ=25/d$, where $d$ is the horizontal distance. Step 3: $d=25/\tan50^\circ$. Which is the first incorrect step?
    choices:
      - text: 'Step 2'
        correct: true
      - text: 'Step 1'
        rationale: |
          This rejects the valid angle-sum calculation. The line of sight does make $50^\circ$ with the vertical. Check which of the two angles is being described in each step.
      - text: 'Step 3'
        rationale: |
          This rejects only the rearrangement in Step 3. That line follows correctly from Step 2. Check the selected triangle angle before checking the algebra.
      - text: 'No step is incorrect.'
        rationale: |
          This treats the angle with the vertical as the angle at the car. Both angles belong to the same line of sight. Check which angle is measured from a horizontal line.
    explanation: |
      Step 2 first uses the wrong angle. A depression of $40^\circ$ from the upper horizontal equals an elevation of $40^\circ$ at the car. Therefore $\tan40^\circ=\dfrac{25}{d}$, giving $d=\dfrac{25}{\tan40^\circ}$ m.
  - id: q-trigonometry-solving-right-triangles-0010
    type: word-problem
    difficulty: hard
    stem: |
      A surveyor is $100$ m horizontally from a vertical building. A vertical flagpole stands directly above its base on the roof. The elevation angles to the roof and pole's top are $30^\circ$ and $32^\circ$. What is the pole's height?
    choices:
      - text: '$100(\tan32^\circ-\tan30^\circ)$ m'
        correct: true
      - text: '$100\tan(32^\circ-30^\circ)$ m'
        rationale: |
          This subtracts the angles before taking tangent. The pole spans the $2^\circ$ difference. Check that separate heights come from separate tangent values.
      - text: '$100(\sin32^\circ-\sin30^\circ)$ m'
        rationale: |
          This treats the horizontal distance as a hypotenuse and uses sine for both heights. Taking a height difference is the right idea. Check which side the given distance represents.
      - text: '$100(\tan32^\circ+\tan30^\circ)$ m'
        rationale: |
          This adds the two heights instead of subtracting them. Both tangent terms describe vertical distances. Check that the pole is the gap between the top and roof levels.
    explanation: |
      From eye level, the roof is $100\tan30^\circ$ m higher and the pole's top is $100\tan32^\circ$ m higher. Subtract these two heights. The pole height is $100(\tan32^\circ-\tan30^\circ)$ m.
  - id: q-trigonometry-solving-right-triangles-0011
    type: word-problem
    difficulty: hard
    stem: |
      A person observes a plane at an angle of elevation of $20$ degrees. Two minutes later, after the plane has moved horizontally toward the observer, the angle of elevation is $50$ degrees. If the plane flies at a constant altitude of $5000$ meters, how far horizontally did the plane travel?
    choices:
      - text: '$5000 \left(\cot 20^\circ - \cot 50^\circ\right)$ meters'
        correct: true
      - text: '$5000 \cot 20^\circ$ meters'
        rationale: |
          This reports only the initial horizontal distance. That is where the plane began. Check that travel needs the difference between the two positions.
      - text: '$5000(\cot 20^\circ + \cot 50^\circ)$ meters'
        rationale: |
          This adds the two horizontal distances. Addition would fit a path crossing the point directly overhead. Check that the intended path moves closer on the same side.
      - text: '$5000 \tan 20^\circ$ meters'
        rationale: |
          This multiplies height by tangent instead of dividing. That uses the given height and initial angle. Check the equation $\tan20^\circ=5000/d_1$.
    explanation: |
      Using the intended ground-level observation, let $d_1$ and $d_2$ be the horizontal distances before and after the plane moves. Tangent gives $d_1=5000\div\tan20^\circ$ and $d_2=5000\div\tan50^\circ$. Cotangent is reciprocal tangent, so these are $5000\cot20^\circ$ and $5000\cot50^\circ$. The plane stays on the same side and moves closer, so its travel is $d_1-d_2=5000(\cot20^\circ-\cot50^\circ)$ m.
  - id: q-trigonometry-solving-right-triangles-0012
    type: direct-computation
    difficulty: hard
    stem: |
      In a right triangle, the hypotenuse is $50$ and one leg is $30$. Angles are measured in degrees. Find the sine of the angle opposite the leg of length $30$.
    choices:
      - text: '$\dfrac{3}{5}$'
        correct: true
      - text: '$\dfrac{4}{5}$'
        rationale: |
          This uses the other leg, $40$, over the hypotenuse. That gives cosine of the same angle. Check which leg lies opposite the requested angle.
      - text: '$\dfrac{3}{4}$'
        rationale: |
          This uses opposite over adjacent, $30/40$. Both legs belong to the right triangle. Check that sine uses the hypotenuse in the denominator.
      - text: '$\dfrac{5}{3}$'
        rationale: |
          This reverses the sine ratio, $50/30$. Both lengths are correct. Check that sine of an acute angle cannot exceed $1$.
    explanation: |
      Sine is opposite over hypotenuse. The specified opposite leg is $30$ and the hypotenuse is $50$. Thus $\sin\theta=\dfrac{30}{50}=\dfrac{3}{5}$.
  - id: q-trigonometry-solving-right-triangles-0013
    type: word-problem
    difficulty: hard
    stem: |
      A rescue helicopter hovers $100$ meters directly above a stranded person on a hillside. A rescue worker elsewhere on the hillside is $150$ meters from the stranded person when measured along the slope and sees the helicopter at an angle of elevation of $40$ degrees. Can the stated distances and angle be checked for consistency without additional information about the hill?
    choices:
      - text: 'No additional information is needed because the $150$-meter slope distance is the horizontal distance used in tangent.'
        rationale: |
          This treats a slope distance as horizontal distance. That would work on level ground. Check which direction the stated distance follows.
      - text: 'Yes, the angle of elevation of $40$ degrees confirms the setup exactly.'
        rationale: |
          This treats a measured angle as proof that the distances agree. The angle describes the line of sight. Check that the triangle's horizontal and vertical sides are also known.
      - text: 'No. The hill''s slope, or equivalent horizontal/vertical separation information, is needed to check the geometry.'
        correct: true
      - text: 'Yes, any $150$-meter slope distance is automatically compatible with a $40$ degree elevation angle.'
        rationale: |
          This assumes every slope orientation gives the same elevation angle. The slope distance is fixed. Check that changing the slope changes both the horizontal gap and the worker's height.
    explanation: |
      The $150$ m is measured along the hill. It does not give the worker's horizontal separation or height relative to the stranded person. The helicopter is $100$ m above that person, but its height above the worker also depends on the hill. The hill's slope, or equivalent horizontal and vertical separations, is needed to check the actual geometry.
  - id: q-trigonometry-solving-right-triangles-0014
    type: which-is-true
    difficulty: hard
    stem: |
      From the top of a vertical $30$-m building, the depression angle to a car on a level street is $60^\circ$. In degrees, what is the car's angle of elevation to the top?
    choices:
      - text: '$60^\circ$'
        correct: true
      - text: '$30^\circ$'
        rationale: |
          This finds the line of sight's angle with the vertical. That is the complement of $60^\circ$. Check that elevation is measured from a horizontal line.
      - text: '$120^\circ$'
        rationale: |
          This treats elevation as the supplement of depression. Both use the same line of sight. Check the parallel horizontal lines that define the two angles.
      - text: '$45^\circ$'
        rationale: |
          This assumes an elevation-depression pair always uses $45^\circ$. At that special angle the triangle's legs are equal. Check the stated depression angle.
    explanation: |
      The observer's horizontal line is parallel to the level street. The line of sight crosses both horizontals. Their alternate interior angles are equal, so the elevation angle at the car is $60^\circ$.
  - id: q-trigonometry-solving-right-triangles-0015
    type: error-spotting
    difficulty: hard
    stem: |
      In right triangle $ABC$, $C=90^\circ$, $A=50^\circ$, and $AB=60$. A student writes Step 1: $AB$ is the hypotenuse. Step 2: $\sin50^\circ=a/60$ for the opposite side $a$. Step 3: $a=60/\sin50^\circ$. Which is the first incorrect step?
    choices:
      - text: 'Step 3'
        correct: true
      - text: 'Step 1'
        rationale: |
          This rejects the hypotenuse label in Step 1. The angle labels may make another side seem longest. Check which side lies opposite the right angle.
      - text: 'Step 2'
        rationale: |
          This rejects the sine ratio in Step 2. Cosine is another familiar hypotenuse ratio. Check that side $a$ is opposite the given acute angle.
      - text: 'No step is incorrect.'
        rationale: |
          This accepts division by sine when solving for the leg. A reciprocal may look like an inverse operation. Check what removes the denominator $60$ in Step 2.
    explanation: |
      Step 3 first makes an algebra error. Sine gives $\sin50^\circ=\dfrac{a}{60}$. Multiplying both sides by $60$ gives $a=60\sin50^\circ$.
  - id: q-trigonometry-solving-right-triangles-0016
    type: word-problem
    difficulty: hard
    stem: |
      An observer at point $A$ sees a hot-air balloon at an angle of elevation of $35$ degrees. The observer then walks $200$ meters directly away from the point on the ground beneath the balloon to point $B$, and the angle of elevation becomes $20$ degrees. How high is the balloon?
    choices:
      - text: '$\dfrac{200}{\cot 20^\circ - \cot 35^\circ}$ meters'
        correct: true
      - text: '$200 \tan 35^\circ$ meters'
        rationale: |
          This treats the $200$-m walk as the first horizontal distance. It is the only directly stated length. Check that the walk is between the two observation points.
      - text: '$200(\tan 35^\circ - \tan 20^\circ)$ meters'
        rationale: |
          This uses the tangent difference as a height multiplier. The angles change between observations. Check that each angle relates height to a different horizontal distance.
      - text: '$\dfrac{200}{\tan 20^\circ}$ meters'
        rationale: |
          This treats the walk as the full farther distance and divides it by tangent. The larger triangle uses the farther point. Check both the distance label and the height-to-distance ratio.
    explanation: |
      For the intended level-ground, ground-level observations of a stationary balloon, let the height be $h$. The first horizontal distance is $x=h\div\tan35^\circ=h\cot35^\circ$. After the walk it is $x+200=h\div\tan20^\circ=h\cot20^\circ$. Here cotangent means reciprocal tangent. Subtract: $200=h(\cot20^\circ-\cot35^\circ)$. Divide to get $h=\dfrac{200}{\cot20^\circ-\cot35^\circ}$ m.
  - id: q-trigonometry-solving-right-triangles-0017
    type: which-is-true
    difficulty: easy
    stem: |
      An angle of elevation of $20^\circ$ is measured between a line of sight and which reference?
    choices:
      - text: 'A horizontal line through the observer.'
        correct: true
      - text: 'A vertical line through the observer.'
        rationale: |
          This uses the complement of the elevation angle. Horizontal and vertical references are perpendicular. Check that elevation starts from the horizontal.
      - text: 'The vertical side of the object viewed.'
        rationale: |
          This places the angle at the object. The object forms one side of the triangle. Check that the angle describes the observer's view.
      - text: 'The sloping ground under the observer.'
        rationale: |
          This uses the terrain as the reference. Ground can look horizontal in a sketch. Check whether the ground is level before treating it as horizontal.
    explanation: |
      An elevation angle measures how far the line of sight points upward from a horizontal through the observer. Thus the reference is a horizontal line at the observer's height.
    approved: false
  - id: q-trigonometry-solving-right-triangles-0018
    type: word-problem
    difficulty: medium
    stem: |
      A $10$-m ladder leans against a vertical wall on level ground. Its angle with the ground changes from $60^\circ$ to $30^\circ$ as its foot moves away from the wall. How far does the foot move?
    choices:
      - text: '$5(\sqrt{3}-1)$ m'
        correct: true
      - text: '$5(\sqrt{3}+1)$ m'
        rationale: |
          This adds the old and new distances from the wall. Both are valid horizontal distances. Check that movement on the same side is their difference.
      - text: '$5\sqrt{3}$ m'
        rationale: |
          This reports only the new distance from the wall. That is the final position. Check that the foot already started $5$ m away.
      - text: '$10(\sqrt{3}-1)$ m'
        rationale: |
          This omits the denominator $2$ in both cosine values. The radicals in the special-angle values look familiar. Check the complete fractions before multiplying by the ladder length.
    explanation: |
      The first horizontal distance is $10\cos60^\circ=5$ m. The new distance is $10\cos30^\circ=5\sqrt{3}$ m. The foot moves by their difference, $5\sqrt{3}-5=5(\sqrt{3}-1)$ m.
    approved: false
  - id: q-trigonometry-solving-right-triangles-0019
    type: word-problem
    difficulty: hard
    stem: |
      Two ground-level survey points lie on opposite sides of a vertical tower along one straight line on level ground. They are $80$ m apart. The elevation angles to the top are $30^\circ$ and $60^\circ$. How tall is the tower?
    choices:
      - text: '$20\sqrt{3}$ m'
        correct: true
      - text: '$40\sqrt{3}$ m'
        rationale: |
          This uses the same-side two-point shortcut, giving $\dfrac{80\sqrt{3}}{2}$. The same elevation angles appear. Check whether the distances to the base should add or subtract.
      - text: '$\dfrac{80}{\sqrt{3}}$ m'
        rationale: |
          This treats the full $80$ m as the distance from the $30^\circ$ point to the base. That point is farther from the tower. Check that the tower base lies between the points.
      - text: '$80\sqrt{3}$ m'
        rationale: |
          This treats the full $80$ m as the distance from the $60^\circ$ point to the base. The steeper angle suggests tangent $\sqrt{3}$. Check that each observer has only part of the total separation.
    explanation: |
      Let the height be $h$. The distances from the base are $h/\tan30^\circ=h\sqrt{3}$ and $h/\tan60^\circ=h/\sqrt{3}$. Their sum is $80$ m: $h\sqrt{3}+h/\sqrt{3}=80$. Multiply by $\sqrt{3}$ to get $4h=80\sqrt{3}$. Thus $h=20\sqrt{3}$ m.
    approved: false
  - id: q-trigonometry-solving-right-triangles-0020
    type: word-problem
    difficulty: exam
    stem: |
      A camera $5$ m above level ground sees the top of a vertical tower at $45^\circ$ elevation. A ground-level camera is $20$ m farther from the tower on the same line and sees the top at $30^\circ$. How tall is the tower?
    choices:
      - text: '$\dfrac{15}{\sqrt{3}-1}$ m'
        correct: true
      - text: '$\dfrac{20}{\sqrt{3}-1}$ m'
        rationale: |
          This ignores the first camera's $5$-m height. The cameras then seem to have the same eye level. Check that the first vertical side is $h-5$.
      - text: '$\dfrac{15}{\sqrt{3}+1}$ m'
        rationale: |
          This adds $1$ while moving the $h$ term. Both sides of the equation contain height. Check that subtracting $h$ gives a difference, not a sum.
      - text: '$5+\dfrac{20}{\sqrt{3}}$ m'
        rationale: |
          This treats the $20$-m separation as the full ground-level distance. That is the only distance stated directly. Check that the farther camera is $x+20$ m from the tower.
    explanation: |
      Let $x$ be the first camera's horizontal distance and $h$ the tower height. The $45^\circ$ view gives $h-5=x$. The ground-level view gives $h=(x+20)/\sqrt{3}$. Substitute $x=h-5$: $h=(h+15)/\sqrt{3}$. Thus $h(\sqrt{3}-1)=15$, so $h=\dfrac{15}{\sqrt{3}-1}$ m.
    approved: false
