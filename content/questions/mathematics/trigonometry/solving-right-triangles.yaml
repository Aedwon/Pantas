meta:
  subject: mathematics
  topic: trigonometry
  subtopic: solving-right-triangles
  exams: [upcat, acet, dlsucet, ustet, pupcet]
questions:
  - id: q-trigonometry-solving-right-triangles-0001
    type: word-problem
    difficulty: easy
    stem: |
      From a point $20$ meters from a lamppost, the angle of elevation to the top of the lamppost is $45^\circ$. How tall is the lamppost?
    choices:
      - text: $20$ meters
        correct: true
      - text: $20\sqrt{2}$ meters
        rationale: |
          You calculated the line-of-sight distance instead of the vertical height.
      - text: $20\sqrt{3}$ meters
        rationale: |
          You used $\tan60°$ instead of $\tan45°$.
      - text: $10$ meters
        rationale: |
          You halved the horizontal distance instead of using $\tan45°=1$.
    explanation: |
      $$\tan45^\circ=\dfrac{h}{20}=1,$$
      so $h=20$ meters.
  - id: q-trigonometry-solving-right-triangles-0002
    type: direct-computation
    difficulty: easy
    stem: |
      A right triangle has one acute angle of $35$ degrees. What is the other acute angle?
    choices:
      - text: $55$ degrees
        correct: true
      - text: $35$ degrees
        rationale: |
          You repeated the given angle instead of finding its complement.
      - text: $125$ degrees
        rationale: |
          You found a supplementary angle instead of the complementary acute angle.
      - text: $65$ degrees
        rationale: |
          You subtracted from $100$ instead of $90$.
    explanation: |
      The acute angles of a right triangle sum to $90°$:
      $$90-35=55^\circ.$$
  - id: q-trigonometry-solving-right-triangles-0003
    type: word-problem
    difficulty: easy
    stem: |
      A ladder $10$ meters long leans against a wall. Its foot is $5$ meters from the wall. What angle does the ladder make with the ground?
    choices:
      - text: $60$ degrees
        correct: true
      - text: $30$ degrees
        rationale: |
          You found the complementary angle that the ladder makes with the wall.
      - text: $45$ degrees
        rationale: |
          You assumed the two legs were equal.
      - text: $\arcsin \left(\dfrac{1}{2}\right)$ degrees
        rationale: |
          This equals $30°$ and comes from using sine instead of cosine for the given adjacent side.
    explanation: |
      $$\cos\theta=\dfrac5{10}=\dfrac12,$$
      so $\theta=60^\circ$.
  - id: q-trigonometry-solving-right-triangles-0004
    type: word-problem
    difficulty: medium
    stem: |
      From a point on the ground, the angle of elevation to the top of a tree is $60^\circ$. The horizontal distance from the observer to the base of the tree is $30$ meters. How tall is the tree?
    choices:
      - text: $30\sqrt{3}$ meters
        correct: true
      - text: $30$ meters
        rationale: |
          You treated the elevation angle as $45°$.
      - text: $60$ meters
        rationale: |
          You doubled the distance instead of multiplying by $\tan60°$.
      - text: $\dfrac{30}{\sqrt{3}}$ meters
        rationale: |
          You divided by $\sqrt3$ instead of multiplying by $\tan60°$.
    explanation: |
      $$\tan60^\circ=\dfrac h{30}=\sqrt3,$$
      so $h=30\sqrt3$ meters.
  - id: q-trigonometry-solving-right-triangles-0005
    type: word-problem
    difficulty: medium
    stem: |
      From the top of a cliff $50$ meters tall, the angle of depression to a boat is $30^\circ$. How far is the boat from the base of the cliff?
    choices:
      - text: $50\sqrt{3}$ meters
        correct: true
      - text: $50$ meters
        rationale: |
          You treated the angle as $45°$.
      - text: $\dfrac{50}{\sqrt{3}}$ meters
        rationale: |
          You multiplied by $\tan30°$ instead of dividing by it.
      - text: $100$ meters
        rationale: |
          You found the hypotenuse using sine instead of the horizontal distance.
    explanation: |
      The angle of depression equals the corresponding angle of elevation.
      $$\tan30^\circ=\dfrac{50}{d},$$
      so
      $$d=\dfrac{50}{\tan30^\circ}=50\sqrt3\text{ m}.$$
  - id: q-trigonometry-solving-right-triangles-0006
    type: word-problem
    difficulty: medium
    stem: |
      A ramp rises $3$ meters vertically over a horizontal distance of $9$ meters. What angle does the ramp make with the horizontal?
    choices:
      - text: $\arctan \left(\dfrac{1}{3}\right)$ degrees
        correct: true
      - text: $30$ degrees
        rationale: |
          $\tan30°=1/\sqrt3$, not $1/3$.
      - text: $\arctan(3)$ degrees
        rationale: |
          You inverted opposite and adjacent.
      - text: $45$ degrees
        rationale: |
          That would require equal vertical and horizontal distances.
    explanation: |
      $$\tan\theta=\dfrac39=\dfrac13,$$
      so
      $$\theta=\arctan\left(\dfrac13\right)\approx18.43^\circ.$$
  - id: q-trigonometry-solving-right-triangles-0007
    type: word-problem
    difficulty: hard
    stem: |
      From point $A$ on level ground, the angle of elevation to the top of a flagpole is $30$ degrees. After walking $100$ meters straight toward the flagpole to point $B$, the angle of elevation becomes $60$ degrees. How tall is the flagpole?
    choices:
      - text: $50\sqrt{3}$ meters
        correct: true
      - text: $100\sqrt{3}$ meters
        rationale: |
          You used the full 100-meter separation as the nearer horizontal distance.
      - text: $100$ meters
        rationale: |
          You reported the walking distance instead of the height.
      - text: $75\sqrt{3}$ meters
        rationale: |
          You averaged distances instead of solving the two tangent equations.
    explanation: |
      Let $x$ be the distance from $B$ to the flagpole and $h$ the height.
      $$h=x\tan60^\circ=x\sqrt3$$
      and
      $$h=(x+100)\tan30^\circ=\dfrac{x+100}{\sqrt3}.$$
      Equating gives $3x=x+100$, so $x=50$ and
      $$h=50\sqrt3\text{ m}.$$
  - id: q-trigonometry-solving-right-triangles-0008
    type: direct-computation
    difficulty: hard
    stem: |
      A right triangle has hypotenuse $40$ and one acute angle of $35$ degrees. Which ratio would you use to find the side opposite the $35$ degree angle?
    choices:
      - text: $\sin 35^\circ$
        correct: true
      - text: $\cos 35^\circ$
        rationale: |
          Cosine connects adjacent side and hypotenuse.
      - text: $\tan 35^\circ$
        rationale: |
          Tangent connects opposite and adjacent, not the given hypotenuse.
      - text: $\sec 35^\circ$
        rationale: |
          Secant connects hypotenuse and adjacent side.
    explanation: |
      Sine uses opposite over hypotenuse:
      $$\sin35^\circ=\dfrac{\text{opposite}}{40}.$$
  - id: q-trigonometry-solving-right-triangles-0009
    type: word-problem
    difficulty: hard
    stem: |
      From a window $25$ meters above ground, the angle of depression to a car on the street is $40$ degrees. How far is the car from the base of the building horizontally?
    choices:
      - text: $\dfrac{25}{\tan 40^\circ}$ meters
        correct: true
      - text: $25 \tan 40^\circ$ meters
        rationale: |
          You multiplied by tangent instead of solving $\tan40°=25/d$ for $d$.
      - text: $25 \sin 40^\circ$ meters
        rationale: |
          Sine is not the ratio between the given height and horizontal distance.
      - text: $\dfrac{25}{\sin 40^\circ}$ meters
        rationale: |
          This uses sine to find a slanted distance, not the horizontal distance asked for.
    explanation: |
      $$\tan40^\circ=\dfrac{25}{d},$$
      hence
      $$d=\dfrac{25}{\tan40^\circ}.$$
  - id: q-trigonometry-solving-right-triangles-0010
    type: word-problem
    difficulty: hard
    stem: |
      A surveyor stands $100$ meters from the base of a building. The angle of elevation to the roof is $30$ degrees, and the angle of elevation to the top of a flag on the roof is $32$ degrees. How tall is the flag?
    choices:
      - text: $100 \tan 32^\circ - 100 \tan 30^\circ$ meters
        correct: true
      - text: $100 \tan 2^\circ$ meters
        rationale: |
          In general, $\tan(32°-30°)\ne\tan32°-\tan30°$.
      - text: $100(\tan 32^\circ - 30^\circ)$ meters
        rationale: |
          This subtracts an angle from a dimensionless tangent value.
      - text: $100 \tan 30^\circ$ meters
        rationale: |
          That is the building height to the roof, not the flag height.
    explanation: |
      The flag height is the difference between the total height and roof height:
      $$h=100\tan32^\circ-100\tan30^\circ.$$
  - id: q-trigonometry-solving-right-triangles-0011
    type: word-problem
    difficulty: hard
    stem: |
      A person observes a plane at an angle of elevation of $20$ degrees. Two minutes later, after the plane has moved horizontally toward the observer, the angle of elevation is $50$ degrees. If the plane flies at a constant altitude of $5000$ meters, how far horizontally did the plane travel?
    choices:
      - text: $5000 \left(\cot 20^\circ - \cot 50^\circ\right)$ meters
        correct: true
      - text: $5000 \cot 20^\circ$ meters
        rationale: |
          You found only the initial horizontal distance.
      - text: $5000(\cot 20^\circ + \cot 50^\circ)$ meters
        rationale: |
          The plane moves closer, so the traveled distance is the difference of the two horizontal distances.
      - text: $5000 \tan 20^\circ$ meters
        rationale: |
          Solving $\tan20°=5000/d$ gives a cotangent expression, not $5000\tan20°$.
    explanation: |
      Initially $d_1=5000\cot20^\circ$; later $d_2=5000\cot50^\circ$. Since the plane moved toward the observer,
      $$d_1-d_2=5000(\cot20^\circ-\cot50^\circ).$$
  - id: q-trigonometry-solving-right-triangles-0012
    type: direct-computation
    difficulty: hard
    stem: |
      In a right triangle, the hypotenuse is $50$ and one leg is $30$. Find the sine of the angle opposite the leg of length $30$.
    choices:
      - text: $\dfrac{3}{5}$
        correct: true
      - text: $\dfrac{4}{5}$
        rationale: |
          You calculated cosine using the other leg $40$ over hypotenuse $50$.
      - text: $\dfrac{3}{4}$
        rationale: |
          You calculated tangent, $30/40$.
      - text: $\dfrac{5}{3}$
        rationale: |
          You calculated cosecant, the reciprocal of sine.
    explanation: |
      The other leg is $40$ by the $3$-$4$-$5$ triple. Sine is opposite over hypotenuse:
      $$\sin\theta=\dfrac{30}{50}=\dfrac35.$$
  - id: q-trigonometry-solving-right-triangles-0013
    type: word-problem
    difficulty: hard
    stem: |
      A rescue helicopter hovers $100$ meters directly above a stranded person on a hillside. A rescue worker elsewhere on the hillside is $150$ meters from the stranded person when measured along the slope and sees the helicopter at an angle of elevation of $40$ degrees. Can the stated distances and angle be checked for consistency without additional information about the hill?
    choices:
      - text: No additional information is needed because the $150$-meter slope distance is the horizontal distance used in tangent.
        rationale: |
          Distance measured along a slope is generally not the same as horizontal distance.
      - text: Yes, the angle of elevation of $40$ degrees confirms the setup exactly.
        rationale: |
          The slope distance alone does not determine the worker's horizontal and vertical displacement from the stranded person.
      - text: No. The hill's slope, or equivalent horizontal/vertical separation information, is needed to check the geometry.
        correct: true
      - text: Yes, any $150$-meter slope distance is automatically compatible with a $40$ degree elevation angle.
        rationale: |
          Compatibility depends on how that slope distance decomposes into horizontal and vertical components.
    explanation: |
      Angle of elevation is measured from a horizontal line. The worker's $150$-meter distance is given along the hillside, so it does not by itself determine the worker's horizontal distance or elevation relative to the stranded person. The hill's slope, or equivalent horizontal/vertical separation data, is therefore needed before the $40°$ angle can be checked against the helicopter's position.
  - id: q-trigonometry-solving-right-triangles-0014
    type: word-problem
    difficulty: hard
    stem: |
      From the top of a $30$-meter building, the angle of depression to a car is $60$ degrees. The car is $d$ meters from the base of the building. Which equation is correct?
    choices:
      - text: $d = \dfrac{30}{\tan 60^\circ}$
        correct: true
      - text: $d = 30 \tan 60^\circ$
        rationale: |
          Solving $\tan60°=30/d$ requires division by tangent.
      - text: $d = \dfrac{30}{\sin 60^\circ}$
        rationale: |
          Sine would involve the line-of-sight hypotenuse.
      - text: $d = 30 \cos 60^\circ$
        rationale: |
          Cosine does not directly relate the given vertical height to the horizontal distance.
    explanation: |
      The corresponding angle of elevation from the car is $60°$:
      $$\tan60^\circ=\dfrac{30}{d},$$
      so
      $$d=\dfrac{30}{\tan60^\circ}.$$
  - id: q-trigonometry-solving-right-triangles-0015
    type: direct-computation
    difficulty: hard
    stem: |
      In right triangle $ABC$ with the right angle at $C$, angle $A = 50$ degrees, and hypotenuse $AB = 60$. Write an expression for side $a$ opposite angle $A$.
    choices:
      - text: $a = 60 \sin 50^\circ$
        correct: true
      - text: $a = 60 \cos 50^\circ$
        rationale: |
          That expression gives the side adjacent to angle $A$.
      - text: $a = 60 \tan 50^\circ$
        rationale: |
          Tangent does not use the hypotenuse.
      - text: $a = \dfrac{60}{\sin 50^\circ}$
        rationale: |
          From $\sin50°=a/60$, multiply by $60$ rather than divide $60$ by sine.
    explanation: |
      $$\sin50^\circ=\dfrac a{60},$$
      hence
      $$a=60\sin50^\circ.$$
  - id: q-trigonometry-solving-right-triangles-0016
    type: word-problem
    difficulty: hard
    stem: |
      An observer at point $A$ sees a hot-air balloon at an angle of elevation of $35$ degrees. The observer then walks $200$ meters directly away from the point on the ground beneath the balloon to point $B$, and the angle of elevation becomes $20$ degrees. How high is the balloon?
    choices:
      - text: $\dfrac{200}{\cot 20^\circ - \cot 35^\circ}$ meters
        correct: true
      - text: $200 \tan 35^\circ$ meters
        rationale: |
          This incorrectly treats the 200-meter walk as the original horizontal distance to the balloon.
      - text: $200(\tan 35^\circ - \tan 20^\circ)$ meters
        rationale: |
          The two tangent equations must be solved through their horizontal distances; simply subtracting tangent values is not valid here.
      - text: $\dfrac{200}{\tan 20^\circ}$ meters
        rationale: |
          This ignores the original observation at $35°$.
    explanation: |
      Let the balloon height be $h$. The horizontal distance from $A$ to the point directly below the balloon is
      $$x=h\cot35^\circ.$$
      After walking $200$ meters farther away, the horizontal distance is
      $$x+200=h\cot20^\circ.$$
      Subtract the first equation from the second:
      $$200=h(\cot20^\circ-\cot35^\circ).$$
      Therefore
      $$h=\dfrac{200}{\cot20^\circ-\cot35^\circ}.$$
