meta:
  subject: 'mathematics'
  topic: 'trigonometry'
  subtopic: 'angles-and-radian-measure'
  exams: ['upcat', 'acet', 'dlsucet', 'ustet', 'pupcet']
questions:
- id: 'q-trigonometry-angles-and-radian-measure-0001'
  type: 'direct-computation'
  difficulty: 'easy'
  stem: |
    Convert $90$ degrees to radians.
  choices:
  - text: '$\dfrac{\pi}{2}$'
    correct: true
  - text: '$\dfrac{\pi}{3}$'
    rationale: |
      This uses the sixty-degree conversion. Both are common angles. Match the given ninety degrees.
  - text: '$\dfrac{\pi}{4}$'
    rationale: |
      This uses the forty-five-degree conversion. It is another common angle. Check the half-turn relation.
  - text: '$\dfrac{2\pi}{3}$'
    rationale: |
      This uses the one-hundred-twenty-degree conversion. Two-thirds pi is a familiar fraction. Multiply the stated degrees by pi over 180.
  explanation: |
    Use $180^\circ=\pi$ radians. Multiply $90$ by $\dfrac\pi{180}$ to get $\dfrac\pi2$ radians.
- id: 'q-trigonometry-angles-and-radian-measure-0002'
  type: 'direct-computation'
  difficulty: 'easy'
  stem: |
    Convert $\dfrac{\pi}{3}$ radians to degrees.
  choices:
  - text: '$60$ degrees'
    correct: true
  - text: '$30$ degrees'
    rationale: |
      This uses pi over six. Both fractions are common. Keep the stated denominator three.
  - text: '$45$ degrees'
    rationale: |
      This uses pi over four. Forty-five is a familiar angle. Divide 180 by the stated denominator.
  - text: '$120$ degrees'
    rationale: |
      This doubles the angle. A full turn is 360 degrees. Use 180 degrees per pi radian.
  explanation: |
    Multiply by $\dfrac{180^\circ}{\pi}$. The pi factors cancel, leaving $180^\circ\div3=60^\circ$.
- id: 'q-trigonometry-angles-and-radian-measure-0003'
  type: 'direct-computation'
  difficulty: 'easy'
  stem: |
    A robot turns $45^\circ$ clockwise, then $90^\circ$ counterclockwise. Taking counterclockwise as positive, what is its net turn in radians?
  choices:
  - text: '$\dfrac\pi4$'
    correct: true
  - text: '$\dfrac\pi6$'
    rationale: |
      This uses thirty degrees instead of the net forty-five. Pi over six is familiar. Combine signed turns first.
  - text: '$-\dfrac\pi4$'
    rationale: |
      This reverses the net direction. One turn is clockwise. Compare the two turn sizes.
  - text: '$\dfrac{3\pi}{4}$'
    rationale: |
      This adds both magnitudes. Both rotations are stated. Give clockwise a negative sign.
  explanation: |
    The signed turns sum to $-45^\circ+90^\circ=45^\circ$. Convert: $45\dfrac\pi{180}=\dfrac\pi4$ radians.
- id: 'q-trigonometry-angles-and-radian-measure-0004'
  type: 'direct-computation'
  difficulty: 'easy'
  stem: |
    An angle measures $\dfrac\pi6$ radians. What is its supplementary angle in degrees?
  choices:
  - text: '$150^\circ$'
    correct: true
  - text: '$30^\circ$'
    rationale: |
      This reports the given angle. Conversion gives thirty degrees correctly. Subtract from 180 for its supplement.
  - text: '$60^\circ$'
    rationale: |
      This uses the complement. Ninety minus thirty is sixty. Check that supplementary means a 180-degree total.
  - text: '$330^\circ$'
    rationale: |
      This uses a full-turn remainder. Three hundred sixty minus thirty is 330. Use the straight-angle total.
  explanation: |
    The given angle is $180^\circ\div6=30^\circ$. Supplementary angles total $180^\circ$, so the partner is $180^\circ-30^\circ=150^\circ$.
- id: 'q-trigonometry-angles-and-radian-measure-0005'
  type: 'direct-computation'
  difficulty: 'medium'
  stem: |
    A student converts $150^\circ$ to radians by multiplying by $\dfrac\pi{360}$. What is the correct converted value?
  choices:
  - text: '$\dfrac{5\pi}{6}$'
    correct: true
  - text: '$\dfrac{5\pi}{12}$'
    rationale: |
      This uses pi per 360 degrees. A full circle has 360 degrees. Match it to two pi radians.
  - text: '$\dfrac{7\pi}{12}$'
    rationale: |
      This substitutes 105 degrees. Seven pi over twelve is that angle. Convert the exact given measure.
  - text: '$\dfrac{2\pi}{3}$'
    rationale: |
      This rounds 150 down to 120. Both are obtuse angles. Keep the full stated value.
  explanation: |
    Degrees convert using $\dfrac\pi{180}$. Thus $150\dfrac\pi{180}=\dfrac{5\pi}{6}$ radians.
- id: 'q-trigonometry-angles-and-radian-measure-0006'
  type: 'direct-computation'
  difficulty: 'medium'
  stem: |
    A student converts $\dfrac{3\pi}{4}$ radians by using $360^\circ$ per $\pi$ radians. What degree value should replace the result?
  choices:
  - text: '$135^\circ$'
    correct: true
  - text: '$270^\circ$'
    rationale: |
      This assigns 360 degrees to pi radians. A full turn has 360 degrees. Check that it corresponds to two pi.
  - text: '$225^\circ$'
    rationale: |
      This uses the full-turn remainder. Three hundred sixty minus 135 is 225. Convert the stated angle itself.
  - text: '$67.5^\circ$'
    rationale: |
      This halves the correct conversion. The denominator is four. Apply the multiplier once.
  explanation: |
    Pi radians correspond to $180^\circ$. Thus $\dfrac{3\pi}{4}\dfrac{180^\circ}{\pi}=135^\circ$.
- id: 'q-trigonometry-angles-and-radian-measure-0007'
  type: 'direct-computation'
  difficulty: 'medium'
  stem: |
    Find the angle between $0$ degrees and $360$ degrees that is coterminal with $370$ degrees.
  choices:
  - text: '$10$ degrees'
    correct: true
  - text: '$20$ degrees'
    rationale: |
      This uses a full turn of 350 degrees. That leaves twenty. Subtract the standard 360-degree turn.
  - text: '$100$ degrees'
    rationale: |
      This drops 270 degrees instead of 360. A three-quarter turn is 270. Remove a whole turn.
  - text: '$370$ degrees'
    rationale: |
      This keeps the original angle. It is coterminal with itself. Check the required range.
  explanation: |
    Subtract one complete turn: $370^\circ-360^\circ=10^\circ$. This lies in the stated range and has the same terminal direction.
- id: 'q-trigonometry-angles-and-radian-measure-0008'
  type: 'which-is-true'
  difficulty: 'medium'
  stem: |
    Which statement about radian measure is true?
  choices:
  - text: '$1$ radian is about $57.3^\circ$.'
    correct: true
  - text: 'Two radians equals $2$ degrees.'
    rationale: |
      This treats radians as degrees. The numeral two is shared. Check the unit conversion.
  - text: '$\dfrac{\pi}{2}$ radians equals $180$ degrees.'
    rationale: |
      This uses a half-turn for pi over two. Pi itself is a half-turn. Keep the one-half factor.
  - text: 'One radian is much smaller than one degree.'
    rationale: |
      This reverses the relative size. Radian values often have smaller numerals. Compare the angle represented by one unit.
  explanation: |
    Convert one radian using $\dfrac{180^\circ}{\pi}$. This is about $57.3^\circ$.
- id: 'q-trigonometry-angles-and-radian-measure-0009'
  type: 'direct-computation'
  difficulty: 'medium'
  stem: |
    A circle has radius $5$ centimeters. Find the arc length cut off by a central angle of $\dfrac{\pi}{3}$ radians.
  choices:
  - text: '$\dfrac{5\pi}{3}$ cm'
    correct: true
  - text: '$\dfrac{\pi}{3}$ cm'
    rationale: |
      This reports the angle as a length. Pi over three is given. Multiply by the radius.
  - text: '$\dfrac{10\pi}{3}$ cm'
    rationale: |
      This uses the diameter as radius. Ten is twice the radius. Use r, not two r.
  - text: '$5\pi$ cm'
    rationale: |
      This drops the angle denominator. Pi is a familiar angle. Keep the factor one-third.
  explanation: |
    For a radian angle, arc length is $s=r\theta$. Multiply: $5\dfrac\pi3=\dfrac{5\pi}{3}$ cm.
- id: 'q-trigonometry-angles-and-radian-measure-0010'
  type: 'direct-computation'
  difficulty: 'hard'
  stem: |
    A dial turns $30^\circ$ clockwise from its starting direction. With counterclockwise positive, express the signed turn in radians.
  choices:
  - text: '$-\dfrac\pi6$'
    correct: true
  - text: '$-\dfrac\pi3$'
    rationale: |
      This doubles the turn. Pi over three is sixty degrees. Convert thirty exactly.
  - text: '$\dfrac\pi6$'
    rationale: |
      This ignores clockwise direction. The magnitude is correct. Keep the negative sign.
  - text: '$\dfrac\pi3$'
    rationale: |
      This both doubles the angle and reverses direction. Sixty degrees is familiar. Check magnitude and sign separately.
  explanation: |
    Clockwise gives a negative turn. Convert $-30^\circ$: $-30\dfrac\pi{180}=-\dfrac\pi6$ radians.
- id: 'q-trigonometry-angles-and-radian-measure-0011'
  type: 'direct-computation'
  difficulty: 'hard'
  stem: |
    Find the angle between $0$ degrees and $360$ degrees that is coterminal with $-150$ degrees.
  choices:
  - text: '$210$ degrees'
    correct: true
  - text: '$150$ degrees'
    rationale: |
      This removes the negative sign without adding a turn. The magnitude is 150. Add 360 to preserve direction.
  - text: '$270$ degrees'
    rationale: |
      This uses a ninety-degree clockwise turn. Negative angles can evoke Quadrant IV. Use the stated 150-degree turn.
  - text: '$-150$ degrees'
    rationale: |
      This leaves the angle outside the range. It is the original turn. Add a full rotation.
  explanation: |
    Add a full turn: $-150^\circ+360^\circ=210^\circ$. This is in the required range and preserves the terminal direction.
- id: 'q-trigonometry-angles-and-radian-measure-0012'
  type: 'which-is-true'
  difficulty: 'hard'
  stem: |
    Which statement is true?
  choices:
  - text: '$430^\circ$ and $70^\circ$ are coterminal.'
    correct: true
  - text: 'Any angle is coterminal with itself plus $180$ degrees.'
    rationale: |
      This uses a half-turn for coterminality. One hundred eighty is a familiar rotation. Use whole turns of 360.
  - text: '$-290$ degrees is in Quadrant II.'
    rationale: |
      This places the negative angle in Quadrant II. Its magnitude exceeds 180. Add a full turn before locating it.
  - text: 'A radian and a degree are equal in size.'
    rationale: |
      This equates the units. Both measure angles. Check 180 degrees against pi radians.
  explanation: |
    The difference is $430^\circ-70^\circ=360^\circ$. Angles separated by one full turn are coterminal.
- id: 'q-trigonometry-angles-and-radian-measure-0013'
  type: 'direct-computation'
  difficulty: 'hard'
  stem: |
    An arc is $\dfrac{8\pi}{3}$ meters long on a circle of radius $8$ meters. What is its central angle in degrees?
  choices:
  - text: '$60^\circ$'
    correct: true
  - text: '$120^\circ$'
    rationale: |
      This doubles the computed angle. Using diameter instead of radius can change ratios. Divide arc length by the stated radius.
  - text: '$30^\circ$'
    rationale: |
      This halves the computed angle. Half-turn and full-turn conversions are familiar. Use 180 degrees per pi radian.
  - text: '$\dfrac{64\pi}{3}{}^\circ$'
    rationale: |
      This multiplies arc by radius. The formula s equals r theta contains multiplication. Rearrange it to solve for theta.
  explanation: |
    Use $\theta=\dfrac sr=\dfrac{8\pi/3}{8}=\dfrac\pi3$ radians. Convert to degrees: $\dfrac\pi3\dfrac{180^\circ}{\pi}=60^\circ$.
- id: 'q-trigonometry-angles-and-radian-measure-0014'
  type: 'direct-computation'
  difficulty: 'hard'
  stem: |
    A wheel turns counterclockwise through seven-eighths of a full rotation. What is that turn in radians?
  choices:
  - text: '$\dfrac{7\pi}{4}$'
    correct: true
  - text: '$\dfrac{7\pi}{8}$'
    rationale: |
      This uses pi as a full turn. Seven-eighths is the stated fraction. A full turn is two pi.
  - text: '$\dfrac{5\pi}{4}$'
    rationale: |
      This uses five-eighths instead. Both fractions have an eighth denominator. Keep the stated seven parts.
  - text: '$\dfrac{9\pi}{4}$'
    rationale: |
      This adds an extra quarter-turn. Nine pi over four exceeds one full turn. Check that seven-eighths is below a full turn.
  explanation: |
    A full rotation is $2\pi$ radians. Seven-eighths of it is $\dfrac78(2\pi)=\dfrac{7\pi}{4}$ radians.
- id: 'q-trigonometry-angles-and-radian-measure-0015'
  type: 'which-is-true'
  difficulty: 'hard'
  stem: |
    A rotating arm turns $2$ radians clockwise. With counterclockwise positive, about how many degrees is this signed turn?
  choices:
  - text: '$-2^\circ$'
    rationale: |
      This treats radians as degrees. The signed numeral is negative two. Convert the unit.
  - text: '$-114.6^\circ$'
    correct: true
  - text: '$114.6^\circ$'
    rationale: |
      This ignores clockwise direction. The converted magnitude is correct. Keep the negative sign.
  - text: '$-57.3^\circ$'
    rationale: |
      This converts only one radian. About 57.3 degrees is one-radian size. Include both radians.
  explanation: |
    The signed angle is $-2$ radians. Multiply by $\dfrac{180^\circ}{\pi}$ to get about $-114.6^\circ$.
- id: 'q-trigonometry-angles-and-radian-measure-0016'
  type: 'which-is-true'
  difficulty: 'hard'
  stem: |
    Which statement is true?
  choices:
  - text: 'Angles in radians are always smaller numbers than angles in degrees.'
    rationale: |
      This makes a universal comparison of signed numerals. Positive degree numerals are usually larger. Check zero and negative angles too.
  - text: '$1$ radian equals $1$ degree.'
    rationale: |
      This equates the units. Both describe angles. Use 180 degrees equals pi radians.
  - text: 'An angle of $2\pi$ radians is greater than $350$ degrees.'
    correct: true
  - text: 'The arc length formula $s = r\theta$ uses $\theta$ measured in degrees.'
    rationale: |
      This substitutes degrees into the radian arc rule. Degrees are familiar. Convert theta to radians first.
  explanation: |
    A full turn is $2\pi$ radians, equal to $360^\circ$. Since $360>350$, that radian angle is greater than $350^\circ$.
- id: 'q-trigonometry-angles-and-radian-measure-0017'
  type: 'estimate-first'
  difficulty: 'easy'
  stem: |
    About where does an angle of $0.5$ radians lie when measured counterclockwise from the positive x-axis?
  choices:
  - text: 'Quadrant I.'
    correct: true
  - text: 'Quadrant II.'
    rationale: |
      This treats half a radian as half a turn. Both contain a half. Compare it with pi over two.
  - text: 'Quadrant III.'
    rationale: |
      This assumes the decimal means multiple turns. Small radian numerals can seem unfamiliar. Compare it with pi.
  - text: 'Quadrant IV.'
    rationale: |
      This treats the turn as clockwise. Fourth-quadrant angles can be negative. Check the stated counterclockwise direction.
  explanation: |
    The angle is positive and smaller than $\dfrac\pi2\approx1.57$ radians. It therefore lies in Quadrant I.
  approved: false
- id: 'q-trigonometry-angles-and-radian-measure-0018'
  type: 'which-is-true'
  difficulty: 'medium'
  stem: |
    An arc of length $r$ is cut from a circle of radius $r$. What is its central angle in radians?
  choices:
  - text: '$1$'
    correct: true
  - text: '$r$'
    rationale: |
      This copies the radius as the angle. The same letter names the length. Divide arc length by radius.
  - text: '$180$'
    rationale: |
      This treats every arc as a semicircle. Straight angles have 180 degrees. Check the arc-to-radius ratio.
  - text: '$2\pi$'
    rationale: |
      This treats the arc as the entire circumference. A full turn has two pi radians. Compare r with two pi r.
  explanation: |
    Use $\theta=s/r$. Here $s=r$, so $\theta=r/r=1$ radian.
  approved: false
- id: 'q-trigonometry-angles-and-radian-measure-0019'
  type: 'word-problem'
  difficulty: 'hard'
  stem: |
    A wheel turns through $5\pi$ radians counterclockwise. How many complete revolutions occur before the remaining half-turn?
  choices:
  - text: '$2$'
    correct: true
  - text: '$5$'
    rationale: |
      This uses pi radians as a full turn. Five pi contains five half-turns. Divide by two pi per revolution.
  - text: '$2.5$'
    rationale: |
      This reports the total fractional revolutions. The division is correct. Count only completed revolutions.
  - text: '$3$'
    rationale: |
      This rounds the fractional revolution upward. The remainder is half a turn. Do not count an incomplete revolution as complete.
  explanation: |
    Divide by $2\pi$ radians per full turn: $\dfrac{5\pi}{2\pi}=2.5$. This is two complete revolutions plus a half-turn.
  approved: false
- id: 'q-trigonometry-angles-and-radian-measure-0020'
  type: 'error-spotting'
  difficulty: 'exam'
  stem: |
    A student says $-\dfrac{5\pi}{2}$ radians lies on the negative x-axis after adding $2\pi$. Which axis actually contains its terminal side?
  choices:
  - text: 'Negative y-axis.'
    correct: true
  - text: 'Negative x-axis.'
    rationale: |
      This treats negative pi over two as negative pi. Both are negative angles. Keep the one-half factor.
  - text: 'Positive x-axis.'
    rationale: |
      This treats any full-turn adjustment as zero. Adding two pi preserves direction. Simplify the remaining angle.
  - text: 'Positive y-axis.'
    rationale: |
      This drops the negative sign from pi over two. The magnitude is a quarter-turn. Check its clockwise direction.
  explanation: |
    Adding $2\pi$ leaves $-\dfrac\pi2$ radians. That is a clockwise quarter-turn from the positive x-axis, ending on the negative y-axis.
  approved: false
