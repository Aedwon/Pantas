questions:
  - id: q-trigonometry-laws-of-sines-and-cosines-0001
    type: direct-computation
    difficulty: easy
    stem: |
      In triangle $ABC$, angle $A = 30$ degrees in degrees, angle $B = 45$ degrees in degrees, and side $a = 10$. Find side $b$.
    choices:
      - text: $10\sqrt{2}$
        correct: true
      - text: $10$
      - text: $5\sqrt{2}$
      - text: $20$
    explanation: |
      Use the Law of Sines. You have side $a$ with its opposite angle $A$.
      $$\dfrac{a}{\sin A} = \dfrac{b}{\sin B}$$
      $$\dfrac{10}{\sin 30^\circ} = \dfrac{b}{\sin 45^\circ}$$
      Substitute $\sin 30^\circ = \dfrac{1}{2}$ and $\sin 45^\circ = \dfrac{\sqrt{2}}{2}$:
      $$\dfrac{10}{\frac{1}{2}} = \dfrac{b}{\frac{\sqrt{2}}{2}}$$
      $$20 = \dfrac{b}{\frac{\sqrt{2}}{2}}$$
      $$b = 20 \times \dfrac{\sqrt{2}}{2} = 10\sqrt{2}$$
  - id: q-trigonometry-laws-of-sines-and-cosines-0002
    type: direct-computation
    difficulty: easy
    stem: |
      In triangle $ABC$, angle $A = 30$ degrees in degrees, angle $B = 45$ degrees in degrees. What is angle $C$?
    choices:
      - text: $105$ degrees
        correct: true
      - text: $75$ degrees
      - text: $15$ degrees
      - text: $135$ degrees
    explanation: |
      The angles of any triangle sum to $180$ degrees.
      $$A + B + C = 180^\circ$$
      $$30 + 45 + C = 180$$
      $$C = 105^\circ$$
  - id: q-trigonometry-laws-of-sines-and-cosines-0003
    type: direct-computation
    difficulty: easy
    stem: |
      A triangle has two sides of length $5$ and $8$, with an included angle of $60$ degrees in degrees. Find the third side.
    choices:
      - text: $7$
        correct: true
      - text: $13$
      - text: $\sqrt{129}$
      - text: $49$
    explanation: |
      Use the Law of Cosines with two sides and the included angle (SAS).
      $$c^2 = a^2 + b^2 - 2ab\cos C$$
      $$c^2 = 5^2 + 8^2 - 2(5)(8)\cos 60^\circ$$
      Substitute $\cos 60^\circ = \dfrac{1}{2}$:
      $$c^2 = 25 + 64 - 80 \times \dfrac{1}{2}$$
      $$c^2 = 89 - 40 = 49$$
      $$c = 7$$
  - id: q-trigonometry-laws-of-sines-and-cosines-0004
    type: direct-computation
    difficulty: medium
    stem: |
      A triangle has sides $3$, $5$, and $7$. Find the cosine of the angle opposite the side of length $7$ (the largest angle).
    choices:
      - text: $-\dfrac{1}{2}$
        correct: true
      - text: $\dfrac{1}{2}$
      - text: $-\dfrac{1}{3}$
      - text: $\dfrac{1}{3}$
    explanation: |
      Use the Law of Cosines (SSS) to find an angle. Let $c = 7$ be opposite angle $C$.
      $$c^2 = a^2 + b^2 - 2ab\cos C$$
      $$7^2 = 3^2 + 5^2 - 2(3)(5)\cos C$$
      $$49 = 9 + 25 - 30\cos C$$
      $$49 = 34 - 30\cos C$$
      $$15 = -30\cos C$$
      $$\cos C = -\dfrac{1}{2}$$
      The negative cosine tells us the angle is obtuse ($C = 120$ degrees).
  - id: q-trigonometry-laws-of-sines-and-cosines-0005
    type: direct-computation
    difficulty: medium
    stem: |
      In triangle $ABC$, angle $A = 60$ degrees in degrees, angle $C = 80$ degrees in degrees, and side $a = 12$. Find side $c$.
    choices:
      - text: $\dfrac{12 \sin 80^\circ}{\sin 60^\circ}$
        correct: true
      - text: $12 \sin 80^\circ$
      - text: $12 \sin 60^\circ$
      - text: $\dfrac{12}{\sin 80^\circ}$
    explanation: |
      Use the Law of Sines. You have side $a$ and its opposite angle $A$, and you want side $c$ (opposite angle $C$).
      $$\dfrac{a}{\sin A} = \dfrac{c}{\sin C}$$
      $$\dfrac{12}{\sin 60^\circ} = \dfrac{c}{\sin 80^\circ}$$
      $$c = \dfrac{12 \sin 80^\circ}{\sin 60^\circ}$$
  - id: q-trigonometry-laws-of-sines-and-cosines-0006
    type: direct-computation
    difficulty: medium
    stem: |
      Two ships leave a port. Ship $X$ sails $3$ km and ship $Y$ sails $8$ km. The angle between their paths is $60$ degrees in degrees. How far apart are the ships?
    choices:
      - text: $7$ km
        correct: true
      - text: $11$ km
      - text: $\sqrt{73}$ km
      - text: $5$ km
    explanation: |
      The port and the two ships form a triangle with two sides ($3$ and $8$) and the included angle ($60$ degrees). Use the Law of Cosines.
      $$d^2 = 3^2 + 8^2 - 2(3)(8)\cos 60^\circ$$
      $$d^2 = 9 + 64 - 48 \times \dfrac{1}{2}$$
      $$d^2 = 73 - 24 = 49$$
      $$d = 7 \text{ km}$$
  - id: q-trigonometry-laws-of-sines-and-cosines-0007
    type: direct-computation
    difficulty: medium-hard
    stem: |
      In triangle $ABC$, angle $A = 50$ degrees in degrees, side $a = 15$, and side $b = 20$. Find $\sin B$ using the Law of Sines.
    choices:
      - text: $\dfrac{20 \sin 50^\circ}{15}$
        correct: true
      - text: $\dfrac{15 \sin 50^\circ}{20}$
      - text: $\sin 50^\circ$
      - text: $\dfrac{50}{15}$
    explanation: |
      Use the Law of Sines.
      $$\dfrac{a}{\sin A} = \dfrac{b}{\sin B}$$
      $$\dfrac{15}{\sin 50^\circ} = \dfrac{20}{\sin B}$$
      $$\sin B = \dfrac{20 \sin 50^\circ}{15}$$
  - id: q-trigonometry-laws-of-sines-and-cosines-0008
    type: direct-computation
    difficulty: medium-hard
    stem: |
      A triangle has sides $6$ and $10$, with an included angle of $120$ degrees in degrees. Find the third side.
    choices:
      - text: $14$
        correct: true
      - text: $4$
      - text: $8$
      - text: $2\sqrt{91}$
    explanation: |
      Use the Law of Cosines with $\cos 120^\circ = -\dfrac{1}{2}$.
      $$c^2 = 6^2 + 10^2 - 2(6)(10)\cos 120^\circ$$
      $$c^2 = 36 + 100 - 120 \times \left(-\dfrac{1}{2}\right)$$
      $$c^2 = 136 + 60 = 196$$
      $$c = 14$$
      Note: the negative cosine becomes a positive term, increasing $c^2$. Tracking the sign is essential.
  - id: q-trigonometry-laws-of-sines-and-cosines-0009
    type: direct-computation
    difficulty: hard
    stem: |
      In triangle $ABC$, side $a = 7$, side $b = 10$, and angle $A = 40$ degrees in degrees. Which law would you use first to find angle $B$?
    choices:
      - text: Law of Sines
        correct: true
      - text: Law of Cosines
      - text: Basic trigonometric ratios (SOH-CAH-TOA)
      - text: Either law works equally well
    explanation: |
      You have sides $a$ and $b$, and angle $A$ (opposite side $a$). This is the SSA case, and you have a complete pair (side $a$ and angle $A$), so the Law of Sines is the natural choice.
      $$\dfrac{a}{\sin A} = \dfrac{b}{\sin B} \quad \Rightarrow \quad \sin B = \dfrac{b \sin A}{a}$$
      (Note: the SSA case can be ambiguous, potentially giving two valid triangles.)
  - id: q-trigonometry-laws-of-sines-and-cosines-0010
    type: direct-computation
    difficulty: hard
    stem: |
      A triangle has sides $4$, $6$, and $7$. Which angle is the largest?
    choices:
      - text: The angle opposite the side of length $7$
        correct: true
      - text: The angle opposite the side of length $6$
      - text: The angle opposite the side of length $4$
      - text: All angles are equal
    explanation: |
      In any triangle, the largest angle is opposite the longest side, and the shortest angle is opposite the shortest side. Since $7$ is the longest side, the angle opposite it is the largest.
