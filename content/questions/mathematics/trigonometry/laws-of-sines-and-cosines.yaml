questions:
  - id: q-trigonometry-laws-of-sines-and-cosines-0001
    type: direct-computation
    difficulty: easy
    stem: |
      In triangle $ABC$, angle $A = 30$ degrees, angle $B = 45$ degrees, and side $a = 10$. Find side $b$.
    choices:
      - text: $10\sqrt{2}$
        correct: true
      - text: $10$
        rationale: |
          You treated sides opposite unequal angles as equal.
      - text: $5\sqrt{2}$
        rationale: |
          You divided by 2 instead of correctly simplifying the Law of Sines proportion.
      - text: $20$
        rationale: |
          You found $10/\sin30°$ but forgot to multiply by $\sin45°$.
    explanation: |
      Use the Law of Sines:
      $$\dfrac{10}{\sin30^\circ}=\dfrac{b}{\sin45^\circ}$$
      $$b=10\dfrac{\sin45^\circ}{\sin30^\circ}=10\sqrt2.$$
  - id: q-trigonometry-laws-of-sines-and-cosines-0002
    type: direct-computation
    difficulty: easy
    stem: |
      In triangle $ABC$, angle $A = 30$ degrees and angle $B = 45$ degrees. What is angle $C$?
    choices:
      - text: $105$ degrees
        correct: true
      - text: $75$ degrees
        rationale: |
          You added the two given angles instead of subtracting their sum from 180 degrees.
      - text: $15$ degrees
        rationale: |
          You treated the triangle as though the two acute angles had to total 90 degrees.
      - text: $135$ degrees
        rationale: |
          You miscalculated the triangle angle sum.
    explanation: |
      The angles of a triangle sum to $180°$:
      $$C=180-30-45=105^\circ.$$
  - id: q-trigonometry-laws-of-sines-and-cosines-0003
    type: direct-computation
    difficulty: easy
    stem: |
      A triangle has two sides of length $5$ and $8$, with an included angle of $60$ degrees. Find the third side.
    choices:
      - text: $7$
        correct: true
      - text: $13$
        rationale: |
          You added the side lengths instead of using the Law of Cosines.
      - text: $\sqrt{129}$
        rationale: |
          You added the cosine correction term instead of subtracting it.
      - text: $49$
        rationale: |
          You reported the square of the side instead of the side length.
    explanation: |
      $$c^2=5^2+8^2-2(5)(8)\cos60^\circ=25+64-40=49,$$
      so $c=7$.
  - id: q-trigonometry-laws-of-sines-and-cosines-0004
    type: direct-computation
    difficulty: medium
    stem: |
      A triangle has sides $3$, $5$, and $7$. Find the cosine of the angle opposite the side of length $7$.
    choices:
      - text: $-\dfrac{1}{2}$
        correct: true
      - text: $\dfrac{1}{2}$
        rationale: |
          You missed the negative sign while isolating cosine.
      - text: $-\dfrac{1}{3}$
        rationale: |
          You made an arithmetic error in the Law of Cosines calculation.
      - text: $\dfrac{1}{3}$
        rationale: |
          You made an arithmetic and sign error.
    explanation: |
      Let $c=7$ be opposite angle $C$.
      $$49=9+25-30\cos C$$
      $$15=-30\cos C$$
      $$\cos C=-\dfrac12.$$
  - id: q-trigonometry-laws-of-sines-and-cosines-0005
    type: direct-computation
    difficulty: medium
    stem: |
      In triangle $ABC$, angle $A = 60$ degrees, angle $C = 80$ degrees, and side $a = 12$. Find side $c$.
    choices:
      - text: $\dfrac{12 \sin 80^\circ}{\sin 60^\circ}$
        correct: true
      - text: $12 \sin 80^\circ$
        rationale: |
          You omitted the division by $\sin60°$.
      - text: $12 \sin 60^\circ$
        rationale: |
          You used the sine of the known angle as a multiplier without forming the matched proportion.
      - text: $\dfrac{12}{\sin 80^\circ}$
        rationale: |
          You inverted the Law of Sines relationship.
    explanation: |
      $$\dfrac{12}{\sin60^\circ}=\dfrac{c}{\sin80^\circ}$$
      so
      $$c=\dfrac{12\sin80^\circ}{\sin60^\circ}.$$
  - id: q-trigonometry-laws-of-sines-and-cosines-0006
    type: direct-computation
    difficulty: medium
    stem: |
      Two ships leave a port. Ship $X$ sails $3$ km and ship $Y$ sails $8$ km. The angle between their paths is $60$ degrees. How far apart are the ships?
    choices:
      - text: $7$ km
        correct: true
      - text: $11$ km
        rationale: |
          You added the two distances without accounting for the included angle.
      - text: $\sqrt{73}$ km
        rationale: |
          You omitted the cosine correction term.
      - text: $5$ km
        rationale: |
          You subtracted the path lengths instead of using the Law of Cosines.
    explanation: |
      $$d^2=3^2+8^2-2(3)(8)\cos60^\circ=9+64-24=49,$$
      so $d=7$ km.
  - id: q-trigonometry-laws-of-sines-and-cosines-0007
    type: direct-computation
    difficulty: hard
    stem: |
      In triangle $ABC$, angle $A = 50$ degrees, side $a = 20$, and side $b = 15$. Find $\sin B$ using the Law of Sines.
    choices:
      - text: $\dfrac{15 \sin 50^\circ}{20}$
        correct: true
      - text: $\dfrac{20 \sin 50^\circ}{15}$
        rationale: |
          You inverted the side ratio; this expression is greater than 1 and cannot be a sine value.
      - text: $\sin 50^\circ$
        rationale: |
          You ignored the ratio of the opposite sides.
      - text: $\dfrac{50}{20}$
        rationale: |
          You divided the angle measure by a side length instead of using the sine function.
    explanation: |
      The Law of Sines gives
      $$\dfrac{20}{\sin50^\circ}=\dfrac{15}{\sin B}.$$
      Therefore
      $$\sin B=\dfrac{15\sin50^\circ}{20},$$
      which is a valid sine value less than $1$.
  - id: q-trigonometry-laws-of-sines-and-cosines-0008
    type: direct-computation
    difficulty: hard
    stem: |
      A triangle has sides $6$ and $10$, with an included angle of $120$ degrees. Find the third side.
    choices:
      - text: $14$
        correct: true
      - text: $4$
        rationale: |
          You simply subtracted the two known sides.
      - text: $8$
        rationale: |
          You treated the triangle as though it were right or made an arithmetic error.
      - text: $2\sqrt{19}$
        rationale: |
          You treated $\cos120°$ as $+1/2$ instead of $-1/2$.
    explanation: |
      $$c^2=6^2+10^2-2(6)(10)\cos120^\circ$$
      $$=136-120\left(-\dfrac12\right)=196,$$
      so $c=14$.
  - id: q-trigonometry-laws-of-sines-and-cosines-0009
    type: direct-computation
    difficulty: hard
    stem: |
      In triangle $ABC$, side $a = 7$, side $b = 10$, and angle $A = 40$ degrees. Which law would you use first to find angle $B$?
    choices:
      - text: Law of Sines
        correct: true
      - text: Law of Cosines
        rationale: |
          This SSA setup has a known opposite side-angle pair, so Law of Sines applies directly.
      - text: Basic trigonometric ratios (SOH-CAH-TOA)
        rationale: |
          The triangle is not stated to be right.
      - text: Either law works equally well
        rationale: |
          Law of Cosines is not directly determined from the given SSA information.
    explanation: |
      With $a$ opposite $A$, there is a complete side-angle pair. Use the Law of Sines first:
      $$\frac{a}{\sin A}=\frac{b}{\sin B}.$$
      This is an SSA case, so a complete solution would also check whether zero, one, or two triangles are possible.
  - id: q-trigonometry-laws-of-sines-and-cosines-0010
    type: direct-computation
    difficulty: hard
    stem: |
      A triangle has sides $4$, $6$, and $7$. Which angle is the largest?
    choices:
      - text: The angle opposite the side of length $7$
        correct: true
      - text: The angle opposite the side of length $6$
        rationale: |
          A larger side is opposite a larger angle; side 7 is longest.
      - text: The angle opposite the side of length $4$
        rationale: |
          The shortest side is opposite the smallest angle.
      - text: All angles are equal
        rationale: |
          The three side lengths are not equal.
    explanation: |
      In any triangle, the largest angle is opposite the longest side. Since $7$ is the longest side, its opposite angle is largest.
  - id: q-trigonometry-laws-of-sines-and-cosines-0011
    type: direct-computation
    difficulty: hard
    stem: |
      In triangle $ABC$, sides $a = 5$, $b = 8$, $c = 10$. Use the Law of Cosines to find $\cos C$.
    choices:
      - text: $-\dfrac{11}{80}$
        correct: true
      - text: $\dfrac{11}{80}$
        rationale: |
          You lost the negative sign when isolating $\cos C$.
      - text: $-\dfrac{1}{2}$
        rationale: |
          You assumed angle $C$ was $120°$ instead of calculating from the side lengths.
      - text: $\dfrac{1}{2}$
        rationale: |
          You assumed angle $C$ was $60°$ instead of calculating from the side lengths.
    explanation: |
      Use $c=10$ opposite angle $C$:
      $$10^2=5^2+8^2-2(5)(8)\cos C.$$
      Thus
      $$100=89-80\cos C,$$
      $$11=-80\cos C,$$
      and
      $$\cos C=-\dfrac{11}{80}.$$
  - id: q-trigonometry-laws-of-sines-and-cosines-0012
    type: direct-computation
    difficulty: hard
    stem: |
      In triangle $ABC$, angle $B = 70$ degrees, side $a = 9$, and side $c = 11$. Find side $b$ using the Law of Cosines.
    choices:
      - text: $\sqrt{202 - 198\cos 70^\circ}$
        correct: true
      - text: $\sqrt{81 + 121 - 198\sin 70^\circ}$
        rationale: |
          You used sine of the included angle instead of cosine in the Law of Cosines.
      - text: $\sqrt{202 + 198\cos 70^\circ}$
        rationale: |
          You added the cosine correction term instead of subtracting it.
      - text: $\sqrt{202 - 99\cos 70^\circ}$
        rationale: |
          You omitted the factor of $2$ from $2ac\cos B$.
    explanation: |
      $$b^2=9^2+11^2-2(9)(11)\cos70^\circ=202-198\cos70^\circ,$$
      so
      $$b=\sqrt{202-198\cos70^\circ}.$$
  - id: q-trigonometry-laws-of-sines-and-cosines-0013
    type: direct-computation
    difficulty: hard
    stem: |
      A triangle has sides $8$, $15$, and $17$. Is this a right triangle?
    choices:
      - text: Yes, because $8^2 + 15^2 = 64 + 225 = 289 = 17^2$
        correct: true
      - text: No, because it does not satisfy the Pythagorean theorem
        rationale: |
          In fact, $8^2+15^2=17^2$.
      - text: Yes, because the sides are consecutive
        rationale: |
          The side lengths are not consecutive, and that is not a right-triangle criterion.
      - text: Cannot be determined without angle measures
        rationale: |
          Side lengths alone can establish a right triangle through the converse of the Pythagorean theorem.
    explanation: |
      $$8^2+15^2=64+225=289=17^2,$$
      so the triangle is right.
  - id: q-trigonometry-laws-of-sines-and-cosines-0014
    type: direct-computation
    difficulty: hard
    stem: |
      In triangle $ABC$, angle $A = 55$ degrees, angle $B = 50$ degrees, and side $a = 20$. Which side is longest?
    choices:
      - text: Side $c$ (opposite angle $C$)
        correct: true
      - text: Side $b$ (opposite angle $B$)
        rationale: |
          $B=50°$ is the smallest angle, so $b$ is the shortest side.
      - text: Side $a$ (opposite angle $A$)
        rationale: |
          $A=55°$ is smaller than $C=75°$.
      - text: Two sides are equal in length
        rationale: |
          The three angles are all different.
    explanation: |
      $$C=180-55-50=75^\circ.$$
      Since $C$ is the largest angle, side $c$ is the longest.
  - id: q-trigonometry-laws-of-sines-and-cosines-0015
    type: direct-computation
    difficulty: hard
    stem: |
      In triangle $ABC$, sides $a = 12$, $b = 16$, $c = 21$. Verify whether the largest angle is acute or obtuse.
    choices:
      - text: The largest angle (opposite the longest side) is obtuse because $21^2 > 12^2 + 16^2$
        correct: true
      - text: The largest angle is acute because $21^2 < 12^2 + 16^2$
        rationale: |
          $441$ is greater than $400$, not less.
      - text: The triangle is a right triangle
        rationale: |
          $12^2+16^2=400$, not $441$.
      - text: The largest angle is $45$ degrees
        rationale: |
          The side-square comparison shows the largest angle is obtuse.
    explanation: |
      The longest side is $21$. Since
      $$21^2=441>12^2+16^2=400,$$
      the angle opposite side $21$ is obtuse.
  - id: q-trigonometry-laws-of-sines-and-cosines-0016
    type: direct-computation
    difficulty: hard
    stem: |
      In triangle $ABC$, $\dfrac{a}{\sin A} = \dfrac{b}{\sin B}$ is a statement of which law?
    choices:
      - text: The Law of Sines
        correct: true
      - text: The Law of Cosines
        rationale: |
          The Law of Cosines uses squared side lengths and a cosine correction term.
      - text: The Pythagorean Theorem
        rationale: |
          The Pythagorean theorem applies to right triangles and does not use these side-sine ratios.
      - text: The Law of Tangents
        rationale: |
          The displayed matched side-to-sine ratios are the Law of Sines.
    explanation: |
      The Law of Sines states
      $$\dfrac{a}{\sin A}=\dfrac{b}{\sin B}=\dfrac{c}{\sin C}.$$
