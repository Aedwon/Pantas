  - id: q-trigonometry-laws-of-sines-and-cosines-0012
    type: direct-computation
    difficulty: hard
    stem: |
      In triangle $ABC$, angle $B = 70$ degrees in degrees, side $a = 9$, side $c = 11$. Find side $b$ using the Law of Cosines.
    choices:
      - text: $\sqrt{202 - 198\cos 70^\circ}$
        correct: true
      - text: $\sqrt{81 + 121 - 198\cos 70^\circ}$
      - text: $\sqrt{202 + 198\cos 70^\circ}$
      - text: $\sqrt{202 - 99\cos 70^\circ}$
    explanation: |
      Use the Law of Cosines with angle $B$ and the sides that form it ($a$ and $c$ are adjacent to angle $B$). Wait, I need to check the labeling. If $a$ and $c$ are opposite angles $A$ and $C$, then angle $B$ is opposite side $b$. The sides forming angle $B$ are $a$ and $c$.
      
      Actually, the standard form relates the side opposite an angle to that angle. Let me use: $b^2 = a^2 + c^2 - 2ac\cos B$.
      
      $$b^2 = 9^2 + 11^2 - 2(9)(11)\cos 70^\circ$$
      $$b^2 = 81 + 121 - 198\cos 70^\circ$$
      $$b^2 = 202 - 198\cos 70^\circ$$
      $$b = \sqrt{202 - 198\cos 70^\circ}$$
  - id: q-trigonometry-laws-of-sines-and-cosines-0013
    type: direct-computation
    difficulty: hard
    stem: |
      A triangle has sides $8$, $15$, and $17$. Is this a right triangle?
    choices:
      - text: Yes, because $8^2 + 15^2 = 64 + 225 = 289 = 17^2$
        correct: true
      - text: No, because it does not satisfy the Pythagorean theorem
      - text: Yes, because the sides are consecutive
      - text: Cannot be determined without angle measures
    explanation: |
      Check if the Pythagorean theorem holds: $a^2 + b^2 = c^2$.
      $$8^2 + 15^2 = 64 + 225 = 289$$
      $$17^2 = 289$$
      They are equal, so this is a right triangle. This is the $8$-$15$-$17$ Pythagorean triple.
  - id: q-trigonometry-laws-of-sines-and-cosines-0014
