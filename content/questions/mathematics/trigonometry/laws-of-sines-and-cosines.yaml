  - id: q-trigonometry-laws-of-sines-and-cosines-0012
    type: direct-computation
    difficulty: hard
    stem: |
      In triangle $ABC$, angle $B = 70$ degrees in degrees, side $a = 9$, side $c = 11$. Find side $b$ using the Law of Cosines.
    choices:
      - text: $\sqrt{202 - 198\cos 70^\circ}$
        correct: true
      - text: $\sqrt{81 + 121 - 198\cos 70^\circ}$
        rationale: |
          You left the sum of squares unsimplified (81 + 121) instead of combining to 202.
      - text: $\sqrt{202 + 198\cos 70^\circ}$
        rationale: |
          You added the 2ac cos B term instead of subtracting it in the Law of Cosines.
      - text: $\sqrt{202 - 99\cos 70^\circ}$
        rationale: |
          You forgot to multiply by 2 in the 2ac cos B term (9 * 11 = 99).
    explanation: |
      Use the Law of Cosines: $b^2 = a^2 + c^2 - 2ac\cos B$.
      $$b^2 = 9^2 + 11^2 - 2(9)(11)\cos 70^\circ = 202 - 198\cos 70^\circ$$
      $$b = \sqrt{202 - 198\cos 70^\circ}$$

  - id: q-trigonometry-laws-of-sines-and-cosines-0013
    type: direct-computation
    difficulty: hard
    stem: |
      A triangle has sides $8$, $15$, and $17$. Is this a right triangle?
    choices:
      - text: Yes, because $8^2 + 15^2 = 64 + 225 = 289 = 17^2$
        correct: true
      - text: No, because it does not satisfy the Pythagorean theorem
        rationale: |
          You incorrectly claimed 8^2 + 15^2 does not equal 17^2.
      - text: Yes, because the sides are consecutive
        rationale: |
          You claimed the sides 8, 15, 17 are consecutive integers, which is false.
      - text: Cannot be determined without angle measures
        rationale: |
          You assumed angle measures are required, but side lengths alone can test Pythagoras.
    explanation: |
      Check if the Pythagorean theorem holds: $a^2 + b^2 = c^2$.
      $$8^2 + 15^2 = 64 + 225 = 289 = 17^2$$
      They are equal, so this is a right triangle.

  - id: q-trigonometry-laws-of-sines-and-cosines-0014
    type: direct-computation
    difficulty: hard
    stem: |
      In triangle $ABC$, angle $A = 55$ degrees in degrees, angle $B = 50$ degrees in degrees, side $a = 20$. Which side is longest?
    choices:
      - text: Side $c$ (opposite angle $C$)
        correct: true
      - text: Side $b$ (opposite angle $B$)
        rationale: |
          You picked side b, but angle B (50 degrees) is the smallest angle, so b is shortest.
      - text: Side $a$ (opposite angle $A$)
        rationale: |
          You picked side a, but angle A (55 degrees) is smaller than angle C (75 degrees).
      - text: Two sides are equal in length
        rationale: |
          You assumed the triangle is isosceles, but all three angles are different.
    explanation: |
      Find angle $C$: $C = 180 - 55 - 50 = 75$ degrees. The largest angle is $C = 75$ degrees, so the longest side is $c$ (opposite angle $C$).

  - id: q-trigonometry-laws-of-sines-and-cosines-0015
    type: direct-computation
    difficulty: hard
    stem: |
      In triangle $ABC$, sides $a = 12$, $b = 16$, $c = 21$. Verify whether the largest angle is acute or obtuse.
    choices:
      - text: The largest angle (opposite the longest side) is obtuse because $21^2 > 12^2 + 16^2$
        correct: true
      - text: The largest angle is acute because $21^2 < 12^2 + 16^2$
        rationale: |
          You claimed 21^2 < 12^2 + 16^2, but 441 is greater than 400.
      - text: The triangle is a right triangle
        rationale: |
          You assumed 12-16-21 forms a Pythagorean triple, but 12^2 + 16^2 = 400 != 441.
      - text: The largest angle is $45$ degrees
        rationale: |
          You claimed the largest angle in an obtuse triangle is 45 degrees, which is impossible.
    explanation: |
      Check $c^2$ against $a^2 + b^2$: $21^2 = 441$ and $12^2 + 16^2 = 144 + 256 = 400$. Since $441 > 400$, the angle opposite $c$ is obtuse.

  - id: q-trigonometry-laws-of-sines-and-cosines-0016
    type: direct-computation
    difficulty: hard
    stem: |
      In triangle $ABC$, $\dfrac{a}{\sin A} = \dfrac{b}{\sin B}$ is a statement of which law?
    choices:
      - text: The Law of Sines
        correct: true
      - text: The Law of Cosines
        rationale: |
          You confused the Law of Sines ratio formula with the Law of Cosines formula.
      - text: The Pythagorean Theorem
        rationale: |
          You confused the Law of Sines with the right-triangle Pythagorean theorem.
      - text: The Law of Tangents
        rationale: |
          You misidentified the ratio of sides to sines as the Law of Tangents.
    explanation: |
      The Law of Sines states that in any triangle, the ratio of a side to the sine of its opposite angle is constant:
      $$\dfrac{a}{\sin A} = \dfrac{b}{\sin B} = \dfrac{c}{\sin C}$$
