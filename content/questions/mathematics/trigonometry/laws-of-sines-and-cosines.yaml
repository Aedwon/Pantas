    stem: |
      In triangle $ABC$, sides $a = 5$, $b = 8$, $c = 10$. Use the Law of Cosines to find $\cos C$.
    choices:
      - text: $-\dfrac{11}{80}$
        correct: true
      - text: $\dfrac{11}{80}$
        rationale: |
          You missed the negative sign when solving 11 = -80 cos C.
      - text: $-\dfrac{1}{2}$
