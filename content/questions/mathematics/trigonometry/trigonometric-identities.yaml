meta:
  subject: mathematics
  topic: trigonometry
  subtopic: trigonometric-identities
  exams: [upcat, acet, dlsucet, ustet, pupcet]
questions:
  - id: q-trigonometry-trigonometric-identities-0001
    type: which-is-true
    difficulty: easy
    stem: |
      Which statement is true about the reciprocal trigonometric functions?
    choices:
      - text: $\csc \theta = \dfrac{1}{\sin \theta}$
        correct: true
      - text: $\sec \theta = \dfrac{1}{\tan \theta}$
        rationale: |
          $1/\tan\theta$ is cotangent, not secant. Secant is $1/\cos\theta$.
      - text: $\csc \theta = \sin \theta$
        rationale: |
          Cosecant is the reciprocal of sine, not sine itself.
      - text: $\cot \theta = \dfrac{1}{\csc \theta}$
        rationale: |
          $1/\csc\theta=\sin\theta$. Cotangent is $1/\tan\theta$.
    explanation: |
      The reciprocal identities include
      $$\csc\theta=\dfrac1{\sin\theta},\qquad \sec\theta=\dfrac1{\cos\theta},\qquad \cot\theta=\dfrac1{\tan\theta}.$$
  - id: q-trigonometry-trigonometric-identities-0002
    type: which-is-true
    difficulty: easy
    stem: |
      Which statement is the Pythagorean identity?
    choices:
      - text: $\sin^2 \theta + \cos^2 \theta = 1$
        correct: true
      - text: $\sin \theta + \cos \theta = 1$
        rationale: |
          The identity requires the squares.
      - text: $\sin^2 \theta - \cos^2 \theta = 1$
        rationale: |
          The Pythagorean identity adds the squared functions.
      - text: $\sin \theta + \cos \theta = \tan \theta$
        rationale: |
          Tangent is $\sin\theta/\cos\theta$, not their sum.
    explanation: |
      $$\sin^2\theta+\cos^2\theta=1$$
      follows from the unit-circle equation $x^2+y^2=1$ with $(x,y)=(\cos\theta,\sin\theta)$.
  - id: q-trigonometry-trigonometric-identities-0003
    type: direct-computation
    difficulty: easy
    stem: |
      If $\sin \theta = \dfrac{3}{5}$ and $\theta$ is acute, find $\cos \theta$ using the Pythagorean identity.
    choices:
      - text: $\dfrac{4}{5}$
        correct: true
      - text: $\dfrac{2}{5}$
        rationale: |
          You subtracted the sine value from 1 instead of subtracting its square.
      - text: $-\dfrac{4}{5}$
        rationale: |
          The magnitude is correct, but cosine is positive for an acute angle.
      - text: $\dfrac{5}{3}$
        rationale: |
          That is cosecant, not cosine.
    explanation: |
      $$\cos^2\theta=1-\sin^2\theta=1-\dfrac9{25}=\dfrac{16}{25}.$$
      Since $\theta$ is acute, $\cos\theta=\dfrac45$.
  - id: q-trigonometry-trigonometric-identities-0004
    type: which-is-true
    difficulty: easy
    stem: |
      Which statement is a quotient identity?
    choices:
      - text: $\tan \theta = \dfrac{\sin \theta}{\cos \theta}$
        correct: true
      - text: $\sin \theta = \dfrac{\cos \theta}{\tan \theta}$
        rationale: |
          This does not follow from the quotient identity.
      - text: $\tan \theta + \sin \theta = 1$
        rationale: |
          No such identity holds for all allowed angles.
      - text: $\cot \theta = \sin \theta \cos \theta$
        rationale: |
          Cotangent is $\cos\theta/\sin\theta$.
    explanation: |
      $$\tan\theta=\dfrac{\sin\theta}{\cos\theta},\qquad \cot\theta=\dfrac{\cos\theta}{\sin\theta}.$$
  - id: q-trigonometry-trigonometric-identities-0005
    type: error-spotting
    difficulty: medium
    stem: |
      A student simplifies $\tan \theta \cdot \cos \theta$ like this.
      
      Step 1: $\tan \theta \cdot \cos \theta = \dfrac{\sin \theta}{\cos \theta} \cdot \cos \theta$
      
      Step 2: $= \sin \theta + \cos \theta$
      
      Step 3: Result is $\sin \theta + \cos \theta$.
      
      Which step is the first wrong one?
    choices:
      - text: Step 2
        correct: true
      - text: Step 1
        rationale: |
          Step 1 correctly rewrites tangent as sine over cosine.
      - text: Step 3
        rationale: |
          Step 3 only repeats the error already introduced in Step 2.
      - text: No step is wrong.
        rationale: |
          Step 2 should cancel the cosine factor and give $\sin\theta$.
    explanation: |
      $$\dfrac{\sin\theta}{\cos\theta}\cos\theta=\sin\theta$$
      wherever the original tangent expression is defined, so Step 2 is the first error.
  - id: q-trigonometry-trigonometric-identities-0006
    type: which-is-true
    difficulty: medium
    stem: |
      Which statement is true about the Pythagorean identity?
    choices:
      - text: $\sin^2 A + \cos^2 B = 1$ is true for any angles $A$ and $B$.
        rationale: |
          The identity requires the same angle in both terms.
      - text: $\sin^2 \theta + \cos^2 \theta = 1$ for all angles $\theta$.
        correct: true
      - text: $1 - \sin^2 \theta = -\cos^2 \theta$
        rationale: |
          The correct rearrangement is $1-\sin^2\theta=\cos^2\theta$.
      - text: $\sin^2 \theta = 1 - \sin^2 \theta$ implies $\sin^2 \theta = 1$
        rationale: |
          It implies $2\sin^2\theta=1$, so $\sin^2\theta=1/2$.
    explanation: |
      The fundamental identity is $\sin^2\theta+\cos^2\theta=1$ for the same angle $\theta$.
  - id: q-trigonometry-trigonometric-identities-0007
    type: direct-computation
    difficulty: medium
    stem: |
      Simplify: $\dfrac{1 - \cos^2 \theta}{\cos^2 \theta}$.
    choices:
      - text: $\tan^2 \theta$
        correct: true
      - text: $\sec^2 \theta$
        rationale: |
          Replace $1-\cos^2\theta$ by $\sin^2\theta$ before simplifying.
      - text: $\cot^2 \theta$
        rationale: |
          You inverted the sine-over-cosine ratio.
      - text: $\csc^2 \theta$
        rationale: |
          Cosecant squared is $1/\sin^2\theta$, not this expression.
    explanation: |
      $$\dfrac{1-\cos^2\theta}{\cos^2\theta}=\dfrac{\sin^2\theta}{\cos^2\theta}=\tan^2\theta.$$
  - id: q-trigonometry-trigonometric-identities-0008
    type: error-spotting
    difficulty: medium
    stem: |
      A student finds $\cos \theta$ from $\sin \theta = \dfrac{3}{5}$ like this.
      
      Step 1: $\sin^2 \theta + \cos^2 \theta = 1$
      
      Step 2: $\dfrac{9}{25} + \cos^2 \theta = 1$
      
      Step 3: $\cos^2 \theta = \dfrac{16}{25}$
      
      Step 4: $\cos \theta = \dfrac{4}{5}$
      
      Which step is the first wrong one?
    choices:
      - text: Step 4
        correct: true
      - text: Step 1
        rationale: |
          Step 1 is the correct Pythagorean identity.
      - text: Step 2
        rationale: |
          Step 2 correctly squares $3/5$.
      - text: No step is wrong.
        rationale: |
          Without a quadrant restriction, Step 4 incorrectly drops the negative square-root possibility.
    explanation: |
      Steps 1–3 are correct. From $\cos^2\theta=16/25$ we get
      $$\cos\theta=\pm\dfrac45.$$
      A quadrant condition is needed to select one sign.
  - id: q-trigonometry-trigonometric-identities-0009
    type: direct-computation
    difficulty: hard
    stem: |
      Simplify: $\sec \theta - \sec \theta \sin^2 \theta$.
    choices:
      - text: $\cos \theta$
        correct: true
      - text: $\sec \theta$
        rationale: |
          You stopped after factoring instead of using $1-\sin^2\theta=\cos^2\theta$.
      - text: $\tan \theta$
        rationale: |
          The factored expression simplifies to cosine, not tangent.
      - text: $1$
        rationale: |
          $\sec\theta\cos^2\theta=\cos\theta$, not 1.
    explanation: |
      $$\sec\theta(1-\sin^2\theta)=\sec\theta\cos^2\theta=\cos\theta$$
      on the domain of the original expression. Therefore, the simplified expression is $\cos \theta$.
  - id: q-trigonometry-trigonometric-identities-0010
    type: which-is-true
    difficulty: hard
    stem: |
      Which statement about the identity $1 + \tan^2 \theta = \sec^2 \theta$ is true?
    choices:
      - text: It is derived from the Pythagorean identity by dividing by $\cos^2 \theta$.
        correct: true
      - text: It is only true when $\tan \theta = 1$.
        rationale: |
          It holds wherever tangent and secant are defined.
      - text: It is the same as the identity $1 + \cot^2 \theta = \csc^2 \theta$.
        rationale: |
          These are related but distinct identities derived by dividing by different squared functions.
      - text: It shows that $\tan^2 \theta$ and $\sec^2 \theta$ are always equal.
        rationale: |
          The identity says $\sec^2\theta=1+\tan^2\theta$, so the two sides differ by exactly 1 and are never equal for a real angle where they are defined.
    explanation: |
      Divide $\sin^2\theta+\cos^2\theta=1$ by $\cos^2\theta$:
      $$\tan^2\theta+1=\sec^2\theta.$$
  - id: q-trigonometry-trigonometric-identities-0011
    type: error-spotting
    difficulty: hard
    stem: |
      A student simplifies $\dfrac{\sin \theta}{\csc \theta} + \dfrac{\cos \theta}{\sec \theta}$ like this.
      
      Step 1: $\csc \theta = \dfrac{1}{\sin \theta}$ and $\sec \theta = \dfrac{1}{\cos \theta}$
      
      Step 2: $\dfrac{\sin \theta}{\frac{1}{\sin \theta}} + \dfrac{\cos \theta}{\frac{1}{\cos \theta}}$
      
      Step 3: $\sin \theta \cdot \sin \theta + \cos \theta \cdot \cos \theta$
      
      Step 4: $\sin^2 \theta + \cos^2 \theta = 1$
      
      Which step is the first wrong one?
    choices:
      - text: No step is wrong.
        correct: true
      - text: Step 1
        rationale: |
          Step 1 states the correct reciprocal identities.
      - text: Step 2
        rationale: |
          Step 2 correctly substitutes those identities.
      - text: Step 3
        rationale: |
          Dividing by $1/\sin\theta$ or $1/\cos\theta$ multiplies by its reciprocal.
    explanation: |
      Every step is valid on the domain of the original expression, and the result is $1$.
  - id: q-trigonometry-trigonometric-identities-0012
    type: direct-computation
    difficulty: hard
    stem: |
      If $\tan \theta = 2$ and $\theta$ is acute, find $\sec \theta$.
    choices:
      - text: $\sqrt{5}$
        correct: true
      - text: $2$
        rationale: |
          Secant is not equal to tangent.
      - text: $\dfrac{1}{2}$
        rationale: |
          That is cotangent, the reciprocal of tangent.
      - text: $-\sqrt{5}$
        rationale: |
          Secant is positive for an acute angle.
    explanation: |
      $$\sec^2\theta=1+\tan^2\theta=5.$$
      Because $\theta$ is acute, $\sec\theta=\sqrt5$.
  - id: q-trigonometry-trigonometric-identities-0013
    type: which-is-true
    difficulty: hard
    stem: |
      Which statement correctly uses a Pythagorean identity?
    choices:
      - text: If $\cos \theta = \dfrac{2}{3}$, then $\sin^2 \theta = 1 - \dfrac{4}{9} = \dfrac{5}{9}$.
        correct: true
      - text: If $\sin \theta = \dfrac{1}{2}$, then $\cos^2 \theta = \dfrac{1}{4}$.
        rationale: |
          The correct value is $1-1/4=3/4$.
      - text: $\sin^2(30^\circ) + \cos^2(60^\circ) = 1$ (using different angles).
        rationale: |
          The Pythagorean identity requires the same angle; this sum is $1/2$.
      - text: $\tan^2 \theta = 1 - \cot^2 \theta$ for all angles.
        rationale: |
          This is not a Pythagorean identity.
    explanation: |
      The first statement correctly rearranges $\sin^2\theta+\cos^2\theta=1$. Also, where both tangent and cotangent are defined,
      $$\tan^2\theta+\cot^2\theta\ge2,$$
      with equality when $|\tan\theta|=1$; it is not a constant identity.
  - id: q-trigonometry-trigonometric-identities-0014
    type: error-spotting
    difficulty: hard
    stem: |
      A student simplifies $\dfrac{\sin^2 \theta + \cos^2 \theta}{\sin^2 \theta}$ like this.
      
      Step 1: $\sin^2 \theta + \cos^2 \theta = 1$ (Pythagorean identity)
      
      Step 2: $\dfrac{1}{\sin^2 \theta}$
      
      Step 3: $= \csc^2 \theta$
      
      Which step is the first wrong one?
    choices:
      - text: No step is wrong.
        correct: true
      - text: Step 1
        rationale: |
          Step 1 correctly applies the Pythagorean identity.
      - text: Step 2
        rationale: |
          Step 2 correctly replaces the numerator by 1.
      - text: Step 3
        rationale: |
          Step 3 correctly uses $1/\sin^2\theta=\csc^2\theta$.
    explanation: |
      All three steps are valid wherever the original expression is defined.
  - id: q-trigonometry-trigonometric-identities-0015
    type: which-is-true
    difficulty: hard
    stem: |
      Which statement is true about $\sin^2 \theta$?
    choices:
      - text: $\sin^2 \theta = (\sin \theta)^2$, computed by taking the sine first, then squaring.
        correct: true
      - text: $\sin^2 \theta = \sin(\theta^2)$, the sine of $\theta$ squared.
        rationale: |
          The exponent applies to the sine value, not the angle argument.
      - text: $\sin^2 \theta = \sin(2\theta)$, the sine of the double angle.
        rationale: |
          Squaring the sine value is not the same operation as doubling the angle.
      - text: $\sin^2 \theta$ is the same as $\sin(2\theta)$ when $\theta = 30$ degrees.
        rationale: |
          $\sin^2 30°=1/4$, while $\sin60°=\sqrt3/2$.
    explanation: |
      By notation, $\sin^2\theta$ means $(\sin\theta)^2$.
  - id: q-trigonometry-trigonometric-identities-0016
    type: direct-computation
    difficulty: hard
    stem: |
      Simplify: $\dfrac{\cot^2 \theta}{1 + \cot^2 \theta}$.
    choices:
      - text: $\cos^2 \theta$
        correct: true
      - text: $\sin^2 \theta$
        rationale: |
          Simplifying the cotangent-to-cosecant ratio gives cosine squared.
      - text: $\cot^2 \theta$
        rationale: |
          You did not simplify the denominator using the Pythagorean identity.
      - text: $1$
        rationale: |
          The numerator and denominator are not equal.
    explanation: |
      Since $1+\cot^2\theta=\csc^2\theta$,
      $$\dfrac{\cot^2\theta}{\csc^2\theta}=\dfrac{\cos^2\theta/\sin^2\theta}{1/\sin^2\theta}=\cos^2\theta.$$
      Therefore, the simplified expression is $\cos^2 \theta$.
