  - id: q-trigonometry-unit-circle-0034
    approved: true
    lesson: lesson-trigonometry-reading-trigonometric-graphs
    keyPoint: 2
    type: which-is-true
    difficulty: medium
    stem: |
      For $y=\tan x$ with $x$ measured in radians, which pair gives all the vertical asymptotes on $0\leq x\leq2\pi$?
    choices:
      - text: '$x=\dfrac{\pi}{2}$ and $x=\dfrac{3\pi}{2}$'
        correct: true
      - text: '$x=\dfrac{\pi}{4}$ and $x=\dfrac{5\pi}{4}$'
        rationale: |
          These points are a period apart, so they match the graph's repeat. Tangent equals $1$ there. Look for the lines the graph never touches.
      - text: '$x=0$ and $x=\pi$'
        rationale: |
          These angles are a period apart and mark crossings of the horizontal axis. At each one, the graph has value zero. Find the angles where tangent has no value.
      - text: '$x=\pi$ and $x=2\pi$'
        rationale: |
          These are also a period apart. They are the ends of full tangent cycles, but the graph crosses the axis there. Look halfway between successive zeros for each asymptote.
    explanation: |
      Tangent is sine divided by cosine. Cosine is zero at $\dfrac{\pi}{2}$ and $\dfrac{3\pi}{2}$ in this interval. Tangent has no value there, so those are the two asymptotes.
