    keyPoint: 2
    type: direct-computation
    difficulty: medium
    stem: |
      What is the exact value of $\sin\left(\dfrac{5\pi}{4}\right)$, with the angle in radians?
    choices:
      - text: '$-\dfrac{\sqrt{2}}{2}$'
        correct: true
      - text: '$\dfrac{\sqrt{2}}{2}$'
        rationale: |
          This reads sine at the reference angle alone. It gives the right size. Check the negative sign in Quadrant III.
      - text: '$-\dfrac{\sqrt{3}}{2}$'
        rationale: |
          This uses the value for a $60^\circ$ reference angle. The sign is right for this quadrant. Check that a denominator of $4$ gives steps of $45^\circ$.
      - text: '$-\dfrac{1}{2}$'
        rationale: |
          This uses the value for a $30^\circ$ reference angle. The sign fits Quadrant III. Subtract $\pi$ from the given angle to get the actual reference angle.
    explanation: |
      The angle is in Quadrant III, where sine is negative. Subtract $\pi$ to get the reference angle $\dfrac{\pi}{4}$. The sine has size $\dfrac{\sqrt{2}}{2}$, so the answer is $-\dfrac{\sqrt{2}}{2}$.
  - id: q-trigonometry-unit-circle-0026
