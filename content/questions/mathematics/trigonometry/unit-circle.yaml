meta:
  subject: mathematics
  topic: trigonometry
  subtopic: unit-circle
  exams: [upcat, acet, dlsucet, ustet, pupcet]
questions:
  - id: q-trigonometry-unit-circle-0001
    type: direct-computation
    difficulty: easy
    stem: |
      What is $\sin 45$ degrees?
    choices:
      - text: $\dfrac{\sqrt{2}}{2}$
        correct: true
      - text: $\dfrac{\sqrt{3}}{2}$
        rationale: |
          You used the value for $\sin 60°$. At 45 degrees the sine value is $\dfrac{\sqrt{2}}{2}$.
      - text: $\dfrac{1}{2}$
        rationale: |
          You used the value for $\sin 30°$ instead of $\sin45°$.
      - text: $\dfrac{\sqrt{2}}{3}$
        rationale: |
          You kept the correct numerator but changed the denominator. $\sin45°=\dfrac{\sqrt{2}}{2}$.
    explanation: |
      $45$ degrees is a standard angle in Quadrant I.
      $$\sin 45^\circ = \dfrac{\sqrt{2}}{2}$$
  - id: q-trigonometry-unit-circle-0002
    type: direct-computation
    difficulty: easy
    stem: |
      What is $\cos 30$ degrees?
    choices:
      - text: $\dfrac{\sqrt{3}}{2}$
        correct: true
      - text: $\dfrac{1}{2}$
        rationale: |
          You used the value for $\cos60°$ instead of $\cos30°$.
      - text: $\dfrac{\sqrt{2}}{2}$
        rationale: |
          You used the value for $\cos45°$ instead of $\cos30°$.
      - text: $\dfrac{\sqrt{3}}{3}$
        rationale: |
          You used a tangent-related value instead of $\cos30°$.
    explanation: |
      At $30$ degrees in Quadrant I:
      $$\cos 30^\circ = \dfrac{\sqrt{3}}{2}$$
  - id: q-trigonometry-unit-circle-0003
    type: direct-computation
    difficulty: easy
    stem: |
      What is $\sin 90$ degrees?
    choices:
      - text: $1$
        correct: true
      - text: $0$
        rationale: |
          You used the value for $\sin0°$ or $\cos90°$.
      - text: $\dfrac{1}{2}$
        rationale: |
          You used the value for $\sin30°$.
      - text: Undefined
        rationale: |
          You confused sine with $\tan90°$, which is undefined.
    explanation: |
      At $90$ degrees, the unit-circle point is $(0,1)$. Sine is the $y$-coordinate.
      $$\sin 90^\circ = 1$$
  - id: q-trigonometry-unit-circle-0004
    type: direct-computation
    difficulty: easy
    stem: |
      What is $\cos 180$ degrees?
    choices:
      - text: $-1$
        correct: true
      - text: $1$
        rationale: |
          You dropped the negative sign from the $x$-coordinate at $180°$.
      - text: $0$
        rationale: |
          You used $\cos90°$ or $\sin180°$ instead.
      - text: Undefined
        rationale: |
          Cosine is defined at $180°$; the unit-circle point is $(-1,0)$.
    explanation: |
      At $180$ degrees, the ray points to $(-1,0)$. Cosine is the $x$-coordinate.
      $$\cos 180^\circ=-1$$
  - id: q-trigonometry-unit-circle-0005
    type: direct-computation
    difficulty: medium
    stem: |
      What is $\cos 120$ degrees?
    choices:
      - text: $-\dfrac{1}{2}$
        correct: true
      - text: $\dfrac{1}{2}$
        rationale: |
          You found the correct reference-angle magnitude but missed the Quadrant II sign.
      - text: $-\dfrac{\sqrt{3}}{2}$
        rationale: |
          You used the sine of the $60°$ reference angle instead of cosine.
      - text: $\dfrac{\sqrt{3}}{2}$
        rationale: |
          You used sine and also missed the Quadrant II sign for cosine.
    explanation: |
      $120°$ is in Quadrant II with reference angle $60°$. Cosine is negative there.
      $$\cos120^\circ=-\dfrac12$$
  - id: q-trigonometry-unit-circle-0006
    type: direct-computation
    difficulty: medium
    stem: |
      What is $\sin 225$ degrees?
    choices:
      - text: $-\dfrac{\sqrt{2}}{2}$
        correct: true
      - text: $\dfrac{\sqrt{2}}{2}$
        rationale: |
          You found the correct magnitude but missed the Quadrant III negative sign for sine.
      - text: $-\dfrac{\sqrt{3}}{2}$
        rationale: |
          You used a $60°$ reference-angle value instead of the $45°$ value.
      - text: $-\dfrac{1}{2}$
        rationale: |
          You used a $30°$ reference-angle value instead of the $45°$ value.
    explanation: |
      The reference angle is $225-180=45°$, and sine is negative in Quadrant III.
      $$\sin225^\circ=-\dfrac{\sqrt2}{2}$$
  - id: q-trigonometry-unit-circle-0007
    type: direct-computation
    difficulty: medium
    stem: |
      What is $\sin(-30)$ degrees?
    choices:
      - text: $-\dfrac{1}{2}$
        correct: true
      - text: $\dfrac{1}{2}$
        rationale: |
          You ignored the negative angle and used $\sin30°$.
      - text: $-\dfrac{\sqrt{3}}{2}$
        rationale: |
          You used the $60°$ sine magnitude instead of the $30°$ magnitude.
      - text: $\dfrac{\sqrt{3}}{2}$
        rationale: |
          You used the wrong reference-angle value and sign.
    explanation: |
      Sine is odd: $\sin(-\theta)=-\sin\theta$.
      $$\sin(-30^\circ)=-\dfrac12$$
  - id: q-trigonometry-unit-circle-0008
    type: which-is-true
    difficulty: medium
    stem: |
      Which statement is true about the unit circle and quadrant signs?
    choices:
      - text: In Quadrant II, both sine and cosine are positive.
        rationale: |
          In Quadrant II only sine is positive; cosine is negative.
      - text: In Quadrant III, only tangent is positive.
        correct: true
      - text: In Quadrant IV, only sine is positive.
        rationale: |
          In Quadrant IV only cosine is positive among sine, cosine, and tangent.
      - text: In Quadrant I, sine is positive but cosine is negative.
        rationale: |
          In Quadrant I both sine and cosine are positive.
    explanation: |
      Quadrant I: all positive. Quadrant II: sine positive. Quadrant III: tangent positive. Quadrant IV: cosine positive.
  - id: q-trigonometry-unit-circle-0009
    type: direct-computation
    difficulty: hard
    stem: |
      What is $\tan 300$ degrees?
    choices:
      - text: $-\sqrt{3}$
        correct: true
      - text: $\sqrt{3}$
        rationale: |
          You missed the Quadrant IV negative sign.
      - text: $-\dfrac{\sqrt{3}}{3}$
        rationale: |
          You used $\tan30°$ instead of $\tan60°$ for the reference angle.
      - text: $\dfrac{\sqrt{3}}{3}$
        rationale: |
          You used the wrong reference-angle value and sign.
    explanation: |
      $300°$ is in Quadrant IV with reference angle $60°$. Tangent is negative there.
      $$\tan300^\circ=-\sqrt3$$
  - id: q-trigonometry-unit-circle-0010
    type: direct-computation
    difficulty: hard
    stem: |
      Evaluate $\sin 150$ degrees $+ \cos 300$ degrees.
    choices:
      - text: $1$
        correct: true
      - text: $0$
        rationale: |
          You applied a wrong sign to one of the two positive values.
      - text: $\dfrac{\sqrt{3}}{2}$
        rationale: |
          You used a $60°$ sine magnitude where the correct values are both $1/2$.
      - text: $\dfrac{1}{2}$
        rationale: |
          You evaluated only one term.
    explanation: |
      $$\sin150^\circ=\dfrac12,\qquad \cos300^\circ=\dfrac12$$
      Therefore the sum is $1$.
  - id: q-trigonometry-unit-circle-0011
    type: which-is-true
    difficulty: hard
    stem: |
      Which statement is true about a point $(\cos \theta, \sin \theta)$ on the unit circle?
    choices:
      - text: Cosine is always the first coordinate and sine is always the second coordinate.
        correct: true
      - text: Sine is always the first coordinate and cosine is always the second coordinate.
        rationale: |
          You swapped the coordinates. A unit-circle point is $(\cos\theta,\sin\theta)$.
      - text: For $\theta=30^\circ$, the unit-circle point is $(\sin30^\circ,\cos30^\circ)=\left(\dfrac12,\dfrac{\sqrt3}{2}\right)$.
        rationale: |
          The numerical pair shown is $(\sin30^\circ,\cos30^\circ)$, but the unit-circle point for $30^\circ$ must be $(\cos30^\circ,\sin30^\circ)=\left(\dfrac{\sqrt3}{2},\dfrac12\right)$.
      - text: For a $120$ degree angle, the point is $\left(\dfrac{\sqrt{3}}{2}, \dfrac{1}{2}\right)$.
        rationale: |
          At $120°$, cosine is $-1/2$ and sine is $\sqrt3/2$.
    explanation: |
      The unit-circle point for angle $\theta$ is $(\cos\theta,\sin\theta)$: cosine is the $x$-coordinate and sine is the $y$-coordinate. For $30°$ this is $\left(\dfrac{\sqrt3}{2},\dfrac12\right)$; for $120°$ it is $\left(-\dfrac12,\dfrac{\sqrt3}{2}\right)$.
  - id: q-trigonometry-unit-circle-0012
    type: direct-computation
    difficulty: hard
    stem: |
      What is $\tan 90$ degrees?
    choices:
      - text: Undefined
        correct: true
      - text: $0$
        rationale: |
          You used $\tan0°$. At $90°$, cosine is zero, so tangent is undefined.
      - text: $1$
        rationale: |
          You used $\tan45°$.
      - text: $\infty$
        rationale: |
          Infinity is not a real numerical value of tangent at $90°$; the expression is undefined.
    explanation: |
      $$\tan90^\circ=\frac{\sin90^\circ}{\cos90^\circ}=\frac10,$$
      which is undefined.
  - id: q-trigonometry-unit-circle-0013
    type: direct-computation
    difficulty: hard
    stem: |
      What is $\sin 210$ degrees?
    choices:
      - text: $-\dfrac{1}{2}$
        correct: true
      - text: $\dfrac{1}{2}$
        rationale: |
          You missed the Quadrant III negative sign.
      - text: $-\dfrac{\sqrt{3}}{2}$
        rationale: |
          You used a $60°$ reference-angle value instead of $30°$.
      - text: $\dfrac{\sqrt{3}}{2}$
        rationale: |
          You used the wrong magnitude and sign.
    explanation: |
      $210°$ is in Quadrant III with reference angle $30°$, so
      $$\sin210^\circ=-\dfrac12.$$
  - id: q-trigonometry-unit-circle-0014
    type: which-is-true
    difficulty: hard
    stem: |
      Which statement is true about reference angles and signs?
    choices:
      - text: The reference angle for $300$ degrees is $60$ degrees, calculated as $360 - 300$.
        correct: true
      - text: The reference angle for $200$ degrees is $160$ degrees, calculated as $360 - 200$.
        rationale: |
          $200°$ is in Quadrant III, so its reference angle is $200-180=20°$, not $160°$.
      - text: All reference angles are found using $180 - \theta$.
        rationale: |
          That formula applies to Quadrant II; other quadrants use different expressions.
      - text: Reference angles are always positive and always less than $45$ degrees.
        rationale: |
          Reference angles are positive acute angles and can be greater than $45°$, such as the $60°$ reference angle of $120°$.
    explanation: |
      In Quadrant IV, the reference angle is $360°-\theta$, so the reference angle of $300°$ is $60°$. In Quadrant III, it is $\theta-180°$, so the reference angle of $200°$ is $20°$.
  - id: q-trigonometry-unit-circle-0015
    type: direct-computation
    difficulty: hard
    stem: |
      What is $\cos(-45)$ degrees?
    choices:
      - text: $\dfrac{\sqrt{2}}{2}$
        correct: true
      - text: $-\dfrac{\sqrt{2}}{2}$
        rationale: |
          Cosine is even, so $\cos(-45°)=\cos45°$.
      - text: $\dfrac{1}{2}$
        rationale: |
          You used the $60°$ magnitude instead of the $45°$ magnitude.
      - text: $-\dfrac{1}{2}$
        rationale: |
          You used both the wrong magnitude and sign.
    explanation: |
      Cosine is even and is positive in Quadrant IV.
      $$\cos(-45^\circ)=\dfrac{\sqrt2}{2}$$
  - id: q-trigonometry-unit-circle-0016
    type: direct-computation
    difficulty: hard
    stem: |
      What is $\sin 240$ degrees?
    choices:
      - text: $-\dfrac{\sqrt{3}}{2}$
        correct: true
      - text: $\dfrac{\sqrt{3}}{2}$
        rationale: |
          You missed the Quadrant III negative sign.
      - text: $-\dfrac{1}{2}$
        rationale: |
          You used the $30°$ sine magnitude instead of the $60°$ magnitude.
      - text: $\dfrac{1}{2}$
        rationale: |
          You used the wrong magnitude and sign.
    explanation: |
      $240°$ is in Quadrant III with reference angle $60°$, so
      $$\sin240^\circ=-\dfrac{\sqrt3}{2}.$$
