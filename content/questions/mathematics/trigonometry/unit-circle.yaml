    difficulty: medium
    stem: |
      For $y=\cos x$, where $x$ is in radians, which ordered pair gives (period, amplitude)?
    choices:
      - text: '$(2\pi,1)$'
        correct: true
      - text: '$(\pi,1)$'
        rationale: |
          The graph takes $\pi$ radians to go from its highest point to its lowest. That is only half of the full pattern. Check when it reaches the next high point.
      - text: '$(2\pi,2)$'
        rationale: |
          The graph spans $2$ units from bottom to top. That is the full height. Divide it by two for the amplitude.
      - text: '$(\pi,2)$'
        rationale: |
          This uses the distance from the highest point to the lowest and the full height. Those are both parts of the graph. Measure a full repeat and half the height.
    explanation: |
      The graph starts at a peak and reaches the next peak after $2\pi$ radians. Its highest value is $1$ and its lowest is $-1$. Half of that height is $1$.
  - id: q-trigonometry-unit-circle-0033
