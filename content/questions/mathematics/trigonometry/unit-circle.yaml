    choices:
      - text: '$(3\sqrt{3},-3)$'
        correct: true
      - text: '$(-3\sqrt{3},3)$'
        rationale: |
          This reverses both signs and gives a point across the origin. Check that $330^\circ$ is in Quadrant IV, where $x$ is positive and $y$ is negative.
      - text: '$(3,-3\sqrt{3})$'
        rationale: |
          This puts the larger size on the vertical axis. The coordinates have the right signs, but $330^\circ$ is only $30^\circ$ from the horizontal axis. Multiply cosine by $6$ for $x$.
      - text: '$(\dfrac{\sqrt{3}}{2},-\dfrac{1}{2})$'
        rationale: |
          This gives the point on the unit circle. Its direction is right. Multiply both coordinates by the given radius.
    explanation: |
      The angle is in Quadrant IV with a $30^\circ$ reference angle. Multiply the cosine by $6$ to get $x=3\sqrt{3}$. Multiply the sine by $6$ to get $y=-3$.
  - id: q-trigonometry-unit-circle-0029
