    stem: |
      What are the polar coordinates $(r,\theta)$ of $(-3,-3)$ for $r>0$ and $0^\circ\leq\theta<360^\circ$?
    choices:
      - text: '$(3\sqrt{2},225^\circ)$'
        correct: true
      - text: '$(3\sqrt{2},45^\circ)$'
        rationale: |
          This uses the reference angle alone. Both coordinates at $45^\circ$ would be positive. Use both given signs to place the point in Quadrant III.
      - text: '$(3\sqrt{2},315^\circ)$'
        rationale: |
          This uses the correct reference angle and a negative vertical sign. In Quadrant IV, the horizontal coordinate would be positive. Check its sign too.
      - text: '$(6,225^\circ)$'
        rationale: |
          This adds the two distances along the axes. The angle is right, but the radius is the straight distance from the origin. Use the square root of the sum of the squares.
    explanation: |
      The radius is $\sqrt{(-3)^2+(-3)^2}=3\sqrt{2}$. The two coordinate sizes are equal, so the reference angle is $45^\circ$. Both signs are negative, which puts the point at $180^\circ+45^\circ=225^\circ$.
