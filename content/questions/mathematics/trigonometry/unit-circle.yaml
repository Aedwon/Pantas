      For the graph of $y=\tan x$ on $0<x<2\pi$, with $x$ in radians, which statement is true?
    choices:
      - text: 'The only zero is at $x=\pi$.'
        correct: true
      - text: 'The only zero is at $x=\dfrac{\pi}{2}$.'
        rationale: |
          This picks a point halfway between two crossings. That point is on an asymptote. Look where the graph crosses the horizontal axis.
      - text: 'The function is undefined at $x=\pi$.'
        rationale: |
          This spots a break in the repeating pattern but puts it at a crossing. Check that tangent is zero at each whole multiple of $\pi$.
      - text: 'The function is defined at $x=\dfrac{3\pi}{2}$.'
        rationale: |
          This angle lies inside the interval, so it may look like a point on the graph. Check whether cosine is zero there before dividing.
