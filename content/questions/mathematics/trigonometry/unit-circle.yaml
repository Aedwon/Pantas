      - text: $-\dfrac{1}{2}$
        rationale: |
          You used the 30-degree value instead of the 60-degree value. The reference angle for 240 degrees is $240 - 180 = 60$ degrees. $\sin 60° = \dfrac{\sqrt{3}}{2}$, not $\dfrac{1}{2}$. Apply the Quadrant III negative sign.
      - text: $\dfrac{1}{2}$
        rationale: |
          You used the 30-degree value and dropped the sign. The reference angle is $240 - 180 = 60$ degrees, giving $\sin 60° = \dfrac{\sqrt{3}}{2}$. Quadrant III also makes sine negative.
    explanation: |
