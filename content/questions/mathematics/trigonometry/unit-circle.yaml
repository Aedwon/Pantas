    choices:
      - text: '$-\dfrac{1}{2}$'
        correct: true
      - text: '$\dfrac{1}{2}$'
        rationale: |
          This takes the cosine of the reference angle. Its size is right. Check the sign in Quadrant II.
      - text: '$-\dfrac{\sqrt{3}}{2}$'
        rationale: |
          This reads the sine size for a $60^\circ$ reference angle. Use the horizontal coordinate for cosine.
      - text: '$-1$'
        rationale: |
          This treats the angle as ending at $\pi$ after a full turn. Subtract $\dfrac{6\pi}{3}$ to find the actual remainder.
    explanation: |
      Subtract a full turn to get $\dfrac{8\pi}{3}-2\pi=\dfrac{2\pi}{3}$. That is in Quadrant II, with reference angle $\dfrac{\pi}{3}$. Cosine is negative there and has size $\dfrac{1}{2}$.
  - id: q-trigonometry-unit-circle-0027
    approved: true
    lesson: lesson-trigonometry-finding-unit-circle-values-from-one-coordinate
    keyPoint: 1
    type: direct-computation
    difficulty: medium
    stem: |
      The terminal point of angle $\theta$ on the unit circle lies in Quadrant IV and has horizontal coordinate $\dfrac{5}{13}$. With $\theta$ measured in degrees, what is the vertical coordinate and what is $\tan\theta$, respectively?
    choices:
      - text: '$-\dfrac{12}{13}$ and $-\dfrac{12}{5}$'
        correct: true
      - text: '$\dfrac{12}{13}$ and $\dfrac{12}{5}$'
        rationale: |
          This uses the positive square root. It has the right size. Take the negative root because the point lies below the horizontal axis.
      - text: '$-\dfrac{12}{13}$ and $-\dfrac{5}{12}$'
        rationale: |
          This finds the right coordinate and then flips the tangent ratio. Check that the vertical coordinate goes on top.
      - text: '$-\dfrac{8}{13}$ and $-\dfrac{8}{5}$'
        rationale: |
          This subtracts $\dfrac{5}{13}$ from $1$. The coordinates fit a circle through their squares. Square first, then solve for the missing coordinate.
    explanation: |
      Use $x^2+y^2=1$ to get $y^2=1-\dfrac{25}{169}=\dfrac{144}{169}$. In Quadrant IV, $y=-\dfrac{12}{13}$. Divide $y$ by $x$ to get $\tan\theta=-\dfrac{12}{5}$.
  - id: q-trigonometry-unit-circle-0028
    approved: true
