meta:
  subject: 'mathematics'
  topic: 'trigonometry'
  subtopic: 'basic-trigonometric-ratios'
  exams: ['upcat', 'acet', 'dlsucet', 'ustet', 'pupcet']
questions:
- id: 'q-trigonometry-basic-trigonometric-ratios-0001'
  type: 'direct-computation'
  difficulty: 'easy'
  stem: |
    A right triangle has legs $3$ and $4$ and hypotenuse $5$. If $\theta$ is the acute angle opposite the side of length $3$, what is $\sin \theta$?
    Angles are measured in degrees.
  choices:
  - text: '$\dfrac{3}{5}$'
    correct: true
  - text: '$\dfrac{4}{5}$'
    rationale: |
      This uses cosine. Four is the adjacent leg. Sine uses the opposite leg.
  - text: '$\dfrac{3}{4}$'
    rationale: |
      This uses tangent. Three and four are the legs. Sine uses the hypotenuse as denominator.
  - text: '$\dfrac{5}{3}$'
    rationale: |
      This uses cosecant. It flips the sine ratio. Check which function is requested.
  explanation: |
    Sine is opposite over hypotenuse. The opposite side is $3$ and hypotenuse is $5$, so $\sin\theta=\dfrac35$.
- id: 'q-trigonometry-basic-trigonometric-ratios-0002'
  type: 'direct-computation'
  difficulty: 'easy'
  stem: |
    A right triangle has hypotenuse $10$ and one acute angle measures $30$ degrees. Find the length of the side opposite the $30$ degree angle.
  choices:
  - text: '$5$'
    correct: true
  - text: '$5\sqrt{3}$'
    rationale: |
      This gives the long leg. The special triangle has both leg lengths. Match the side opposite thirty degrees.
  - text: '$10$'
    rationale: |
      This reports the hypotenuse. Ten is given directly. Use the sine ratio.
  - text: '$\dfrac{5}{2}$'
    rationale: |
      This halves the short leg again. One halving is required. Apply it only once.
  explanation: |
    Use $\sin30^\circ=\dfrac12$. The opposite length is $10\sin30^\circ=10(\dfrac12)=5$.
- id: 'q-trigonometry-basic-trigonometric-ratios-0003'
  type: 'direct-computation'
  difficulty: 'easy'
  stem: |
    In a right triangle, $\sin \theta = \dfrac{3}{5}$. What is $\csc \theta$?
    Angles are measured in degrees.
  choices:
  - text: '$\dfrac{5}{3}$'
    correct: true
  - text: '$\dfrac{3}{5}$'
    rationale: |
      This leaves sine unchanged. The given ratio is correct for sine. Take its reciprocal.
  - text: '$\dfrac{5}{4}$'
    rationale: |
      This flips cosine. Five over four is secant in this triangle. Match cosecant with sine.
  - text: '$\dfrac{4}{3}$'
    rationale: |
      This flips tangent. Four over three is cotangent. Match the correct reciprocal pair.
  explanation: |
    Cosecant is the reciprocal of sine. Flip $\dfrac35$ to get $\csc\theta=\dfrac53$.
- id: 'q-trigonometry-basic-trigonometric-ratios-0004'
  type: 'direct-computation'
  difficulty: 'easy'
  stem: |
    A right triangle has one leg of length $5$ and hypotenuse $13$. Find the other leg.
    Angles are measured in degrees.
  choices:
  - text: '$12$'
    correct: true
  - text: '$8$'
    rationale: |
      This subtracts ordinary lengths. Thirteen minus five is eight. Subtract their squares first.
  - text: '$18$'
    rationale: |
      This adds ordinary lengths. Both lengths are stated. Use the right-triangle rule.
  - text: '$\sqrt{194}$'
    rationale: |
      This adds the squared lengths. Adding squares finds a hypotenuse. Here the hypotenuse is already known.
  explanation: |
    Let the missing leg be a. The right-triangle rule gives $a^2=13^2-5^2=169-25=144$. The positive root is $a=12$.
- id: 'q-trigonometry-basic-trigonometric-ratios-0005'
  type: 'direct-computation'
  difficulty: 'medium'
  stem: |
    In a right triangle, $\tan\theta=\dfrac34$ and the hypotenuse is $20$ units. Angles are in degrees. What is the leg opposite $\theta$?
  choices:
  - text: '$12$'
    correct: true
  - text: '$16$'
    rationale: |
      This reports the adjacent leg. Sixteen is a valid side length. Match the side opposite theta.
  - text: '$15$'
    rationale: |
      This treats three-fourths of the hypotenuse as the opposite. Tangent is three-fourths. Check that tangent divides by the adjacent leg.
  - text: '$20$'
    rationale: |
      This reports the hypotenuse. Twenty fixes the scale. Find the requested leg.
  explanation: |
    Tangent gives opposite-to-adjacent ratio $3:4$. This is a $3:4:5$ triangle. The hypotenuse $20$ makes the scale factor $20\div5=4$. The opposite leg is $3(4)=12$.
- id: 'q-trigonometry-basic-trigonometric-ratios-0006'
  type: 'direct-computation'
  difficulty: 'medium'
  stem: |
    An acute angle in degrees has $\cos\theta=\dfrac5{13}$. A student labels $\dfrac{12}{13}$ as secant. What is the correct secant?
  choices:
  - text: '$\dfrac{13}{5}$'
    correct: true
  - text: '$\dfrac5{13}$'
    rationale: |
      This repeats cosine. The given ratio is familiar. Flip it for secant.
  - text: '$\dfrac{12}{13}$'
    rationale: |
      This reports sine. The missing opposite leg is twelve. Secant is reciprocal cosine.
  - text: '$\dfrac5{12}$'
    rationale: |
      This reports cotangent. Five over twelve uses the legs. Secant uses hypotenuse over adjacent.
  explanation: |
    Secant is the reciprocal of cosine. Flipping $\dfrac5{13}$ gives $\sec\theta=\dfrac{13}{5}$.
- id: 'q-trigonometry-basic-trigonometric-ratios-0007'
  type: 'which-is-true'
  difficulty: 'medium'
  stem: |
    Which statement is true about complementary angles?
    Angles are measured in degrees.
  choices:
  - text: '$\sin 30^\circ = \cos 60^\circ$'
    correct: true
  - text: '$\sin 30^\circ = \cos 30^\circ$'
    rationale: |
      This uses the same angle instead of its complement. Both functions name thirty degrees. Check that the two angles total ninety.
  - text: '$\sin 45^\circ = \cos 60^\circ$'
    rationale: |
      This pairs angles that total 105 degrees. Both are common values. Use complementary angles.
  - text: 'The sine of an angle always equals the cosine of the same angle.'
    rationale: |
      This treats the forty-five-degree equality as universal. Sine and cosine match there. Check the angle condition.
  explanation: |
    The two angles total $90^\circ$. Complementary angles swap sine and cosine. Thus $\sin30^\circ=\cos60^\circ=\dfrac12$.
- id: 'q-trigonometry-basic-trigonometric-ratios-0008'
  type: 'direct-computation'
  difficulty: 'medium'
  stem: |
    For a $60^\circ$ angle, what is $\csc60^\circ$?
  choices:
  - text: '$\dfrac{2\sqrt3}{3}$'
    correct: true
  - text: '$\dfrac{\sqrt3}{2}$'
    rationale: |
      This gives sine instead of cosecant. The sine value is known. Take its reciprocal.
  - text: '$2$'
    rationale: |
      This uses cosecant of thirty degrees. Two is a familiar reciprocal. Match the stated angle.
  - text: '$\sqrt3$'
    rationale: |
      This uses tangent of sixty degrees. That value is square root three. Use reciprocal sine.
  explanation: |
    Sine of $60^\circ$ is $\dfrac{\sqrt3}{2}$. Cosecant is its reciprocal: $\dfrac2{\sqrt3}=\dfrac{2\sqrt3}{3}$.
- id: 'q-trigonometry-basic-trigonometric-ratios-0009'
  type: 'direct-computation'
  difficulty: 'hard'
  stem: |
    In a right triangle, $\sin \theta = \dfrac{5}{13}$ and $\theta$ is acute. What is $\cos \theta$?
    Angles are measured in degrees.
  choices:
  - text: '$\dfrac{12}{13}$'
    correct: true
  - text: '$\dfrac{5}{13}$'
    rationale: |
      This repeats sine. The opposite side is five. Use adjacent over hypotenuse for cosine.
  - text: '$\dfrac{13}{5}$'
    rationale: |
      This gives cosecant. It flips the stated sine. Check the requested function.
  - text: '$\dfrac{5}{12}$'
    rationale: |
      This gives tangent. Five over twelve uses both legs. Cosine includes the hypotenuse.
  explanation: |
    Use opposite $5$ and hypotenuse $13$ as a representative triangle. The adjacent leg is $\sqrt{13^2-5^2}=12$. Cosine is adjacent over hypotenuse, or $\dfrac{12}{13}$.
- id: 'q-trigonometry-basic-trigonometric-ratios-0010'
  type: 'direct-computation'
  difficulty: 'hard'
  stem: |
    What is $\cos 60^\circ$?
  choices:
  - text: '$\dfrac{1}{2}$'
    correct: true
  - text: '$\dfrac{\sqrt{3}}{2}$'
    rationale: |
      This uses sine of sixty degrees. Both are special-angle ratios. Match cosine with the adjacent leg.
  - text: '$\sqrt{3}$'
    rationale: |
      This uses tangent of sixty degrees. Square root three is familiar. Identify the requested function.
  - text: '$\dfrac{1}{\sqrt{3}}$'
    rationale: |
      This uses tangent of thirty degrees. It is another special value. Match both angle and function.
  explanation: |
    In a $30^\circ$-$60^\circ$-$90^\circ$ triangle, the short leg is half the hypotenuse. It is adjacent to $60^\circ$. Therefore $\cos60^\circ=\dfrac12$.
- id: 'q-trigonometry-basic-trigonometric-ratios-0011'
  type: 'direct-computation'
  difficulty: 'hard'
  stem: |
    A right triangle has an acute angle of $45$ degrees and the side opposite the $45$ degree angle is $7$ units. What is the hypotenuse?
  choices:
  - text: '$7\sqrt{2}$'
    correct: true
  - text: '$7$'
    rationale: |
      This reports the other leg. The legs are equal at forty-five degrees. The hypotenuse is longer.
  - text: '$\dfrac{7}{\sqrt{2}}$'
    rationale: |
      This divides by square root two. Division finds a leg from a hypotenuse. Reverse that operation here.
  - text: '$14$'
    rationale: |
      This adds the legs. Both are seven. Add their squares and take a root.
  explanation: |
    The two acute angles are $45^\circ$, so both legs are seven units. The hypotenuse is $\sqrt{7^2+7^2}=7\sqrt2$.
- id: 'q-trigonometry-basic-trigonometric-ratios-0012'
  type: 'direct-computation'
  difficulty: 'hard'
  stem: |
    An acute angle in degrees has $\cot\theta=\dfrac43$. A student uses that same value for tangent. What is the corrected tangent?
  choices:
  - text: '$\dfrac34$'
    correct: true
  - text: '$\dfrac43$'
    rationale: |
      This leaves cotangent unchanged. The given ratio is four-thirds. Flip it for tangent.
  - text: '$\dfrac37$'
    rationale: |
      This uses the sum of the legs as denominator. Three plus four is seven. Tangent divides by the adjacent leg.
  - text: '$\dfrac45$'
    rationale: |
      This uses cosine for a three-four-five triangle. Four-fifths is a valid ratio. Match tangent to the legs.
  explanation: |
    Tangent and cotangent are reciprocals. Flipping $\dfrac43$ gives $\tan\theta=\dfrac34$.
- id: 'q-trigonometry-basic-trigonometric-ratios-0013'
  type: 'direct-computation'
  difficulty: 'hard'
  stem: |
    A right triangle has hypotenuse $26$ and one leg of length $10$. Find the other leg, then find the sine of the angle opposite the leg of length $10$.
    Angles are measured in degrees.
  choices:
  - text: 'The other leg is $24$ and $\sin \theta = \dfrac{5}{13}$'
    correct: true
  - text: 'The other leg is $24$ and $\sin \theta = \dfrac{12}{13}$'
    rationale: |
      This uses the other acute angle. Twenty-four is the other leg. Match the angle opposite ten.
  - text: 'The other leg is $16$ and $\sin \theta = \dfrac{10}{26}$'
    rationale: |
      This subtracts 26 minus ten to get sixteen. Both lengths are given. Use squared lengths to find the missing leg.
  - text: 'The other leg is $24$ and $\sin \theta = \dfrac{10}{24}$'
    rationale: |
      This uses tangent for the selected angle. Ten and twenty-four are legs. Sine divides by the hypotenuse.
  explanation: |
    The missing leg is $\sqrt{26^2-10^2}=\sqrt{576}=24$. For the angle opposite ten, sine is $\dfrac{10}{26}=\dfrac5{13}$.
- id: 'q-trigonometry-basic-trigonometric-ratios-0014'
  type: 'which-is-true'
  difficulty: 'hard'
  stem: |
    Which statement is true about a $3$-$4$-$5$ right triangle?
    Angles are measured in degrees.
  choices:
  - text: '$\sin \theta = \dfrac{3}{5}$ and $\cos \theta = \dfrac{4}{5}$ regardless of which acute angle $\theta$ is.'
    rationale: |
      This keeps labels fixed when the angle changes. The triangle sides stay the same. Relabel opposite and adjacent for each acute angle.
  - text: 'The sine depends on the chosen acute angle.'
    correct: true
  - text: 'In any right triangle, sine is always $\dfrac{3}{5}$.'
    rationale: |
      This treats one triangle family as every right triangle. Three-four-five is familiar. Ratios vary with angle.
  - text: 'The ratios depend on the size of the triangle, not the angles.'
    rationale: |
      This makes scale determine the ratios. Larger triangles have larger sides. Similar scaling cancels in each ratio.
  explanation: |
    Choosing the acute angle opposite three gives sine $\dfrac35$. Choosing the other acute angle gives sine $\dfrac45$. The reference angle therefore matters.
- id: 'q-trigonometry-basic-trigonometric-ratios-0015'
  type: 'direct-computation'
  difficulty: 'hard'
  stem: |
    An acute angle in degrees has $\sec\theta=\dfrac53$. The triangle hypotenuse is $20$ units. What is the adjacent leg length?
  choices:
  - text: '$12$'
    correct: true
  - text: '$20$'
    rationale: |
      This reports the hypotenuse. Twenty is given. Solve for the adjacent leg.
  - text: '$16$'
    rationale: |
      This finds the opposite leg. Sixteen belongs to the scaled triangle. Secant relates hypotenuse and adjacent.
  - text: '$\dfrac{100}{3}$'
    rationale: |
      This multiplies by secant instead of dividing. Five-thirds exceeds one. An adjacent leg must be shorter than the hypotenuse.
  explanation: |
    Secant is hypotenuse over adjacent. Thus $\dfrac{20}{a}=\dfrac53$. Cross multiply to get $5a=60$, so $a=12$.
- id: 'q-trigonometry-basic-trigonometric-ratios-0016'
  type: 'direct-computation'
  difficulty: 'hard'
  stem: |
    In a $5$-$12$-$13$ right triangle, $\theta$ is the acute angle opposite the side of length $5$. What is $\tan \theta$?
    Angles are measured in degrees.
  choices:
  - text: '$\dfrac{5}{12}$'
    correct: true
  - text: '$\dfrac{12}{5}$'
    rationale: |
      This reverses the legs. Twelve over five is cotangent. Keep opposite over adjacent for tangent.
  - text: '$\dfrac{5}{13}$'
    rationale: |
      This uses sine. Five over thirteen includes the hypotenuse. Tangent uses only the legs.
  - text: '$\dfrac{12}{13}$'
    rationale: |
      This uses cosine. Twelve over thirteen is adjacent over hypotenuse. Tangent needs the opposite leg too.
  explanation: |
    The side opposite the chosen angle is $5$, and the adjacent leg is $12$. Tangent is their ratio, $\dfrac5{12}$.
- id: 'q-trigonometry-basic-trigonometric-ratios-0017'
  type: 'which-is-true'
  difficulty: 'easy'
  stem: |
    Two similar right triangles have every corresponding side in ratio $2:1$. Their matching acute angles are in degrees. How do their sine values compare?
  choices:
  - text: 'They are equal.'
    correct: true
  - text: 'The larger triangle has twice the sine.'
    rationale: |
      This scales a ratio like a length. The sides double. Both numerator and denominator double together.
  - text: 'The larger triangle has half the sine.'
    rationale: |
      This scales only the denominator. The hypotenuse doubles. The opposite leg doubles too.
  - text: 'The larger triangle has four times the sine.'
    rationale: |
      This applies area scaling to a side ratio. Areas grow by four. Trigonometric ratios divide two lengths.
  explanation: |
    Similar triangles have equal corresponding acute angles. Scaling both sides in opposite over hypotenuse by the same factor leaves the ratio unchanged.
  approved: false
- id: 'q-trigonometry-basic-trigonometric-ratios-0018'
  type: 'which-is-true'
  difficulty: 'medium'
  stem: |
    An acute angle $\theta$ is in degrees. Which proposed cosecant value is impossible?
  choices:
  - text: '$0.8$'
    correct: true
  - text: '$1.25$'
    rationale: |
      This rejects a reciprocal greater than one. Cosecant flips a sine below one. Compare opposite with hypotenuse.
  - text: '$2$'
    rationale: |
      This rejects a common reciprocal. It is cosecant of thirty degrees. Check its matching sine.
  - text: '$3$'
    rationale: |
      This assumes cosecant is at most two. Some familiar angles give small values. Check that sine may be less than one-half.
  explanation: |
    For an acute angle, the opposite leg is shorter than the hypotenuse. Cosecant is hypotenuse over opposite, so it must exceed one. It cannot be 0.8.
  approved: false
- id: 'q-trigonometry-basic-trigonometric-ratios-0019'
  type: 'error-spotting'
  difficulty: 'hard'
  stem: |
    In a right triangle, a student labels the hypotenuse adjacent to a $40^\circ$ angle because it touches the angle. Which side is actually the adjacent leg?
  choices:
  - text: 'The other side touching the angle.'
    correct: true
  - text: 'The side across the angle.'
    rationale: |
      This uses the opposite leg. It is measured relative to the angle. Check whether the side touches the angle.
  - text: 'The longest side of the triangle.'
    rationale: |
      This repeats the hypotenuse. It touches both acute angles. Reserve the longest side as hypotenuse.
  - text: 'Any side not across the right angle.'
    rationale: |
      This fails to distinguish the two legs. Both are not hypotenuses. Only one touches the chosen acute angle.
  explanation: |
    The hypotenuse is always across from the right angle. For an acute angle, the adjacent leg is the other side meeting that angle.
  approved: false
- id: 'q-trigonometry-basic-trigonometric-ratios-0020'
  type: 'word-problem'
  difficulty: 'exam'
  stem: |
    A right-triangle model has adjacent leg $9$ units and an acute angle $\theta$ in degrees with $\cos\theta=0.6$. What is its hypotenuse?
  choices:
  - text: '$15$'
    correct: true
  - text: '$5.4$'
    rationale: |
      This multiplies the adjacent leg by cosine. Multiplication works when finding a leg from the hypotenuse. Solve nine over hypotenuse equal to 0.6.
  - text: '$9.6$'
    rationale: |
      This adds the ratio to a length. Both numbers are stated. Ratios scale lengths rather than add to them.
  - text: '$6$'
    rationale: |
      This treats 0.6 as six units. The decimal can look like a side length. Keep ratios separate from measurements.
  explanation: |
    Cosine is adjacent over hypotenuse, so $\dfrac9h=0.6$. Multiply by h and divide by 0.6: $h=9\div0.6=15$.
  approved: false
