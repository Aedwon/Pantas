meta:
  subject: mathematics
  topic: geometry
  subtopic: coordinate-geometry
  exams: [upcat, acet, dlsucet, ustet, pupcet]
questions:
  - id: q-geometry-coordinate-geometry-0001
    type: direct-computation
    difficulty: easy
    stem: |
      What is the distance between point $A(-2, 3)$ and point $B(4, 11)$ in the Cartesian coordinate plane?
    choices:
      - text: '$10$'
        correct: true
      - text: '$14$'
        correct: false
        rationale: |
          This adds horizontal and vertical changes. Both changes are legs of a right triangle. Check that direct distance is the triangle hypotenuse.
      - text: '$\sqrt{28}$'
        correct: false
        rationale: |
          This subtracts squared changes before taking a root. The same squared changes are used. Check the sum in the distance formula.
      - text: '$100$'
        correct: false
        rationale: |
          This stops before taking the square root. The squared-distance total is a needed intermediate value. Check that distance is the positive root.
    explanation: |
      The horizontal change is $4-(-2)=6$, and the vertical change is $11-3=8$. The distance is $\sqrt{6^2+8^2}=\sqrt{100}=10$ units.

  - id: q-geometry-coordinate-geometry-0002
    type: direct-computation
    difficulty: easy
    stem: |
      What are the coordinates of the midpoint of the segment connecting point $P(-6, 8)$ and point $Q(2, -4)$?
    choices:
      - text: '$(-2, 2)$'
        correct: true
      - text: '$(-4, 4)$'
        correct: false
        rationale: |
          This adds coordinate pairs without averaging. The two sums are needed first. Check that each sum is divided by two.
      - text: '$(4, -6)$'
        correct: false
        rationale: |
          This takes half of the coordinate differences instead of sums. Both midpoint and half-difference formulas divide by two. Check whether sums or differences locate the midpoint.
      - text: '$(2, -2)$'
        correct: false
        rationale: |
          This reverses both midpoint signs. The coordinates have mixed signs. Check each signed average.
    explanation: |
      Average each coordinate pair. The x-coordinate is $\dfrac{-6+2}{2}=-2$, and the y-coordinate is $\dfrac{8-4}{2}=2$. The midpoint is $(-2,2)$.

  - id: q-geometry-coordinate-geometry-0003
    type: direct-computation
    difficulty: easy
    stem: |
      In the coordinate graph, line $L$ passes through point $A(1, 3)$ and point $B(5, 11)$. What is the slope of line $L$?
    choices:
      - text: '$2$'
        correct: true
      - text: '$\dfrac{1}{2}$'
        correct: false
        rationale: |
          This divides run by rise. Rise and run are both needed. Check that slope means rise over run.
      - text: '$-2$'
        correct: false
        rationale: |
          This subtracts the x-coordinates in the opposite order from the y-coordinates. Both formulas use differences. Check consistent subtraction order.
      - text: '$\dfrac{7}{3}$'
        correct: false
        rationale: |
          This adds coordinates instead of subtracting to find slope. The same two coordinate pairs are used. Check the slope differences rather than sums.
    explanation: |
      The rise is $11-3=8$, and the run is $5-1=4$. Slope is rise over run: $m=\dfrac{8}{4}=2$.

  - id: q-geometry-coordinate-geometry-0004
    type: direct-computation
    difficulty: easy
    stem: |
      Line $L_1$ has equation $y = 3x - 7$. Line $L_2$ is parallel to line $L_1$ and passes through the point $(2, 5)$. What is the slope of line $L_2$?
    choices:
      - text: '$3$'
        correct: true
      - text: '$-\dfrac{1}{3}$'
        correct: false
        rationale: |
          This uses the perpendicular slope rule. Both parallel and perpendicular comparisons use slope. Check whether parallel or perpendicular is stated.
      - text: '$-3$'
        correct: false
        rationale: |
          This changes the slope sign without a perpendicular relation. Both lines have the same steepness magnitude. Check that parallel nonvertical slopes are equal.
      - text: '$5$'
        correct: false
        rationale: |
          This reads the point's y-coordinate as slope. The point is given directly. Check the x coefficient of the given line.
    explanation: |
      The coefficient of x in $y=3x-7$ is the slope $3$. Parallel nonvertical lines have equal slopes. Therefore the second slope is $3$.

  - id: q-geometry-coordinate-geometry-0005
    type: direct-computation
    difficulty: easy
    stem: |
      Line $m$ graphed on the Cartesian plane has a slope of $-\dfrac{4}{5}$. What is the slope of any line perpendicular to line $m$?
    choices:
      - text: '$\dfrac{5}{4}$'
        correct: true
      - text: '$-\dfrac{5}{4}$'
        correct: false
        rationale: |
          This takes the reciprocal but keeps the negative sign. A reciprocal is needed. Check that the slope product is negative one.
      - text: '$\dfrac{4}{5}$'
        correct: false
        rationale: |
          This changes the sign but does not invert the fraction. A sign change is needed. Check that the slope product is negative one.
      - text: '$-\dfrac{4}{5}$'
        correct: false
        rationale: |
          This keeps the original slope. Equal slopes describe another line relationship. Check whether parallel or perpendicular is requested.
    explanation: |
      The given slope is finite and nonzero. A perpendicular slope is its negative reciprocal. Flip $-\dfrac{4}{5}$ to $-\dfrac{5}{4}$ and change its sign, giving $\dfrac{5}{4}$.

  - id: q-geometry-coordinate-geometry-0006
    type: direct-computation
    difficulty: medium
    stem: |
      What is the equation in slope-intercept form ($y = mx + b$) of the line passing through point $(3, -2)$ with a slope of $-4$?
    choices:
      - text: '$y = -4x + 10$'
        correct: true
      - text: '$y = -4x - 14$'
        correct: false
        rationale: |
          This computes the intercept as y plus mx instead of y minus mx. Both the point and slope are used. Check the intercept by substituting the point.
      - text: '$y = -4x + 14$'
        correct: false
        rationale: |
          This adds two instead of subtracting it when isolating y. The two is visible beside y. Check that moving positive two requires subtracting two.
      - text: '$y = 4x - 10$'
        correct: false
        rationale: |
          This negates only the right side of the correct equation. Negating can seem like a way to make a leading coefficient positive. Check that equivalent equations apply an operation to both sides.
    explanation: |
      Use $y=mx+b$ with $m=-4$. Substitute the point: $-2=-4(3)+b$. Thus $-2=-12+b$ and $b=10$. The equation is $y=-4x+10$.

  - id: q-geometry-coordinate-geometry-0007
    type: direct-computation
    difficulty: medium
    stem: |
      What is the slope of the perpendicular bisector of the line segment joining point $A(-3, 1)$ and point $B(5, 7)$?
    choices:
      - text: '$-\dfrac{4}{3}$'
        correct: true
      - text: '$\dfrac{3}{4}$'
        correct: false
        rationale: |
          This reports the original segment slope. That slope is needed first. Check that the requested line is perpendicular.
      - text: '$-\dfrac{3}{4}$'
        correct: false
        rationale: |
          This changes the sign without inverting the fraction. A negative sign is needed. Check the slope product.
      - text: '$\dfrac{4}{3}$'
        correct: false
        rationale: |
          This inverts the fraction without changing the sign. A reciprocal is needed. Check the slope product.
    explanation: |
      The segment slope is $\dfrac{7-1}{5-(-3)}=\dfrac{6}{8}=\dfrac{3}{4}$. Its perpendicular bisector has the negative reciprocal slope, $-\dfrac{4}{3}$.

  - id: q-geometry-coordinate-geometry-0008
    type: direct-computation
    difficulty: medium
    stem: |
      Vertices $A(2, 7)$, $B(8, 7)$, and $C(5, 3)$ form $\triangle ABC$ in the coordinate plane. What is the area of $\triangle ABC$?
    choices:
      - text: '$12$'
        correct: true
      - text: '$24$'
        correct: false
        rationale: |
          This omits the one-half factor in triangle area. Base times height is a useful area product. Check the triangle area formula.
      - text: '$10$'
        correct: false
        rationale: |
          This adds the correct base and height instead of using the area formula. Both geometric lengths are correct. Check that area is not a sum of lengths.
      - text: '$14$'
        correct: false
        rationale: |
          This uses four as the base and seven as the height. Both numbers appear in the coordinate data. Check the actual base endpoints and perpendicular height.
    explanation: |
      AB is horizontal with length $8-2=6$. The perpendicular height from C to that base is $7-3=4$. The triangle area is $\dfrac{1}{2}(6)(4)=12$ square units.

  - id: q-geometry-coordinate-geometry-0009
    type: direct-computation
    difficulty: medium
    stem: |
      Convert point-slope equation $y - 4 = -\dfrac{2}{3}(x + 6)$ into standard form $Ax + By = C$, where $A, B, C$ are integers and $A > 0$.
    choices:
      - text: '$2x + 3y = 0$'
        correct: true
      - text: '$2x + 3y = 24$'
        correct: false
        rationale: |
          This changes the sign of the right-side constant when distributing. Both sides contain a constant twelve. Check distribution with the sign of negative two.
      - text: '$2x - 3y = 0$'
        correct: false
        rationale: |
          This negates only the y coefficient when rearranging. Moving a term can involve a sign change. Check that the original slope is still negative.
      - text: '$3x + 2y = 0$'
        correct: false
        rationale: |
          This swaps the standard-form coefficients. Both coefficients occur in the equation. Check which coefficient belongs to each variable.
    explanation: |
      Multiply the point-slope equation by $3$: $3y-12=-2x-12$. Add $2x$ and $12$ to both sides. This gives standard form $2x+3y=0$.

  - id: q-geometry-coordinate-geometry-0010
    type: direct-computation
    difficulty: medium
    stem: |
      Three points $A(-1, k)$, $B(2, 5)$, and $C(5, 11)$ lie on the same straight line in the Cartesian plane. What is the value of $k$?
    choices:
      - text: '$-1$'
        correct: true
      - text: '$1$'
        correct: false
        rationale: |
          This reverses the final sign when solving five minus k equals six. The magnitude one appears in the result. Check the solved value in the original equation.
      - text: '$2$'
        correct: false
        rationale: |
          This uses a slope of one from dividing the y-change by itself. That rate is easier to use. Check that slope divides y-change by x-change.
      - text: '$11$'
        correct: false
        rationale: |
          This moves upward from B by six instead of downward. The rise of six is correct in magnitude. Check that A lies left of B on a positively sloped line.
    explanation: |
      From B to C, the slope is $\dfrac{11-5}{5-2}=2$. From B to A, x decreases by $3$, so y decreases by $2(3)=6$. Thus $k=5-6=-1$.

  - id: q-geometry-coordinate-geometry-0011
    type: direct-computation
    difficulty: hard
    stem: |
      What is the standard form equation $Ax + By = C$ of the line perpendicular to $3x - 4y = 12$ that passes through point $(6, -1)$?
    choices:
      - text: '$4x + 3y = 21$'
        correct: true
      - text: '$3x - 4y = 22$'
        correct: false
        rationale: |
          This keeps the original slope and only changes the intercept. The point still determines a constant. Check that the new slope product is negative one.
      - text: '$4x - 3y = 27$'
        correct: false
        rationale: |
          This inverts the original slope without negating it. A reciprocal is needed. Check the slope product.
      - text: '$4x + 3y = 27$'
        correct: false
        rationale: |
          This substitutes positive one instead of negative one for y. The point's coordinate magnitude is one. Check the sign of the given point coordinate.
    explanation: |
      The given line has slope $\dfrac{3}{4}$. The perpendicular slope is $-\dfrac{4}{3}$. Through $(6,-1)$, write $y+1=-\dfrac{4}{3}(x-6)$. Multiply by $3$: $3y+3=-4x+24$. Rearrange to $4x+3y=21$.

  - id: q-geometry-coordinate-geometry-0012
    type: direct-computation
    difficulty: hard
    stem: |
      Quadrilateral $OABC$ has vertices at $O(0, 0)$, $A(6, 0)$, $B(8, 5)$, and $C(2, 5)$ in the Cartesian plane. What is the area of parallelogram $OABC$?
    choices:
      - text: '$30$'
        correct: true
      - text: '$15$'
        correct: false
        rationale: |
          This uses the triangle one-half factor. The diagonal can split the shape into triangles. Check which shape's area is requested.
      - text: '$40$'
        correct: false
        rationale: |
          This uses eight as the base length. Eight is the largest x-coordinate. Check the actual base endpoints.
      - text: '$20$'
        correct: false
        rationale: |
          This uses the horizontal difference between A and C as the base. Both x-values are given for vertices. Check that the base is OA, not AC.
    explanation: |
      The base OA lies on the x-axis and has length $6$. The opposite side lies at $y=5$, so the perpendicular height is $5$. The parallelogram area is $6(5)=30$ square units.

  - id: q-geometry-coordinate-geometry-0013
    type: direct-computation
    difficulty: hard
    stem: |
      The equation of a circle is $x^2 + y^2 - 6x + 8y - 11 = 0$. What are the center coordinates $(h, k)$ and the radius $r$ of the circle?
    choices:
      - text: 'Center $(3, -4)$, Radius $6$'
        correct: true
      - text: 'Center $(-3, 4)$, Radius $6$'
        correct: false
        rationale: |
          This keeps the signs of the half-coefficients as the center signs. The equation contains negative six x and positive eight y. Check the signs inside the squared expressions.
      - text: 'Center $(3, -4)$, Radius $36$'
        correct: false
        rationale: |
          This reports the radius squared. Thirty-six is found after completing squares. Check that the radius is a positive length.
      - text: 'Center $(-6, 8)$, Radius $11$'
        correct: false
        rationale: |
          This treats coefficients and the constant as center and radius directly. Those numbers are printed in the equation. Complete the squares before reading the circle parameters.
    explanation: |
      Rearrange the circle equation: $x^2-6x+y^2+8y=11$. Add $9+16$ to complete both squares. This gives $(x-3)^2+(y+4)^2=36$. In the circle form $(x-h)^2+(y-k)^2=r^2$, the center is $(3,-4)$ and the radius is $\sqrt{36}=6$.

  - id: q-geometry-coordinate-geometry-0014
    type: direct-computation
    difficulty: hard
    stem: |
      At what point $(x, y)$ do lines $2x + 3y = 13$ and $5x - 2y = 4$ intersect?
    choices:
      - text: '$(2, 3)$'
        correct: true
      - text: '$(3, 2)$'
        correct: false
        rationale: |
          This swaps the solved coordinates. Both coordinate values were found. Check the x-then-y order.
      - text: '$(1, 4)$'
        correct: false
        rationale: |
          This assumes x equals one and rounds the first equation's y value to four. Small whole coordinates can look natural. Check the exact pair in both equations without rounding.
      - text: '$(-2, 5)$'
        correct: false
        rationale: |
          This makes the solved x negative and truncates its first-equation y value to five. A nearby whole-number pair can look like a valid answer. Check the exact pair in both equations without truncating.
    explanation: |
      Multiply the first equation by $2$ to get $4x+6y=26$. Multiply the second by $3$ to get $15x-6y=12$. Add: $19x=38$, so $x=2$. Substitute into the first: $4+3y=13$, giving $y=3$. The intersection is $(2,3)$.

  - id: q-geometry-coordinate-geometry-0015
    type: direct-computation
    difficulty: hard
    stem: |
      Line $L$ given by equation $3x + 4y = 20$ intersects the axes to form a right triangle with the origin. What is the shortest perpendicular distance from origin $(0, 0)$ to line $L$?
    choices:
      - text: '$4$'
        correct: true
      - text: '$5$'
        correct: false
        rationale: |
          This reports the y-intercept distance along an axis. The line does meet that axis there. Check that distance to a line follows a perpendicular.
      - text: '$\dfrac{20}{3}$'
        correct: false
        rationale: |
          This reports the x-intercept distance along an axis. The line does meet that axis there. Check that distance to a line follows a perpendicular.
      - text: '$20$'
        correct: false
        rationale: |
          This stops at the formula numerator. The numerator is correctly found. Check that the normal-length denominator is used.
    explanation: |
      The distance from $(x_0,y_0)$ to $Ax+By+C=0$ is $\dfrac{|Ax_0+By_0+C|}{\sqrt{A^2+B^2}}$. Here the line is $3x+4y-20=0$. At the origin this gives $\dfrac{20}{\sqrt{3^2+4^2}}=\dfrac{20}{5}=4$ units.

  - id: q-geometry-coordinate-geometry-0016
    type: which-is-true
    difficulty: easy
    stem: |
      Which description of the line $x=5$ is correct?
    choices:
      - text: 'Vertical, undefined slope.'
        correct: true
      - text: 'Horizontal, zero slope.'
        rationale: |
          This uses the slope of a horizontal line for a vertical line. Both keep one coordinate constant. Check which coordinate is fixed.
      - text: 'Vertical, slope $5$.'
        rationale: |
          This treats the fixed x value as slope. Five appears in the equation. Check that slope is a ratio of coordinate changes.
      - text: 'Horizontal, undefined slope.'
        rationale: |
          This confuses the vertical and horizontal descriptions. Both types keep one coordinate constant. Check that fixed x means a vertical line.
    explanation: |
      Every point on this line has the same x-coordinate. Any two distinct points have zero horizontal change. The slope would divide by zero, so it is undefined.
    approved: false

  - id: q-geometry-coordinate-geometry-0017
    type: error-spotting
    difficulty: medium
    stem: |
      A student finds the slope through $(1,2)$ and $(4,8)$ as $\dfrac{8-2}{1-4}=-2$. What correction is needed?
    choices:
      - text: 'Use the same subtraction order in both parts.'
        correct: true
      - text: 'Square both differences before dividing them.'
        rationale: |
          This uses distance-formula operations for slope. Both formulas use coordinate differences. Check which measurement is requested.
      - text: 'Add the coordinates in both parts instead.'
        rationale: |
          This uses midpoint-style sums for slope. The same coordinates are involved. Check the rise-over-run differences.
      - text: 'Treat the negative slope as undefined.'
        rationale: |
          This confuses negative slope with zero run. Both can seem unusual. Check that a defined negative number is still a slope.
    explanation: |
      The numerator subtracts the first point from the second. The denominator must use that same order: $4-1=3$. Thus the slope is $\dfrac{8-2}{4-1}=\dfrac{6}{3}=2$.
    approved: false

  - id: q-geometry-coordinate-geometry-0018
    type: word-problem
    difficulty: hard
    stem: |
      A map grid marks the midpoint of a straight path as $M(1,-3)$. One endpoint is $A(6,2)$. What are the coordinates of the other endpoint B?
    choices:
      - text: '$(-4,-8)$'
        correct: true
      - text: '$(3.5,-0.5)$'
        rationale: |
          This finds the midpoint of A and M instead of the missing endpoint. Both given points are averaged. Check that M is already the midpoint.
      - text: '$(5,5)$'
        rationale: |
          This reports the displacement from M to A as a location. That displacement helps reflect A across M. Check that the result is an endpoint coordinate, not a change.
      - text: '$(-5,-5)$'
        rationale: |
          This reports the displacement from A to M. That change must be repeated from M. Check that it is added to the midpoint coordinates.
    explanation: |
      The midpoint averages the endpoints. Thus $x_B=2(1)-6=-4$ and $y_B=2(-3)-2=-8$. The other endpoint is $(-4,-8)$.
    approved: false

  - id: q-geometry-coordinate-geometry-0019
    type: which-is-true
    difficulty: hard
    stem: |
      Which pair of distinct lines is perpendicular even though the product-of-slopes test cannot be used?
    choices:
      - text: '$x=2$ and $y=7$.'
        correct: true
      - text: '$x=2$ and $x=7$.'
        rationale: |
          This treats two undefined slopes as a perpendicular pair. Both lines are vertical. Check their directions, which are parallel.
      - text: '$y=2$ and $y=7$.'
        rationale: |
          This treats two zero slopes as a perpendicular pair. Both lines are horizontal. Check that they are parallel.
      - text: '$y=2x$ and $y=-2x$.'
        rationale: |
          This negates a slope without taking its reciprocal. The lines tilt in opposite directions. Check that defined perpendicular slopes multiply to negative one.
    explanation: |
      The first line is vertical and has undefined slope. The second is horizontal and has slope zero. A vertical line and a horizontal line meet at a right angle, so they are perpendicular even though one slope is undefined.
    approved: false

  - id: q-geometry-coordinate-geometry-0020
    type: word-problem
    difficulty: exam
    stem: |
      On a coordinate map, a straight route is parallel to $2x+3y=9$ and passes through $(3,2)$. Which equation describes the route?
    choices:
      - text: '$2x+3y=12$'
        correct: true
      - text: '$2x+3y=9$'
        rationale: |
          This keeps the original line without checking the new point. Parallel lines do share slope. Check that the required point satisfies the equation.
      - text: '$3x-2y=5$'
        rationale: |
          This constructs a perpendicular line through the point. Swapping coefficients and changing one sign produces a right-angle slope. Check whether parallel or perpendicular is requested.
      - text: '$2x+3y=13$'
        rationale: |
          This swaps the point coordinates before substituting. Both numbers belong to the point. Check that the first coordinate is x and the second is y.
    explanation: |
      The original slope is $-\dfrac{2}{3}$. A parallel route keeps the same coefficients and has form $2x+3y=C$. Substitute $(3,2)$: $C=2(3)+3(2)=12$. Thus its equation is $2x+3y=12$.
    approved: false
