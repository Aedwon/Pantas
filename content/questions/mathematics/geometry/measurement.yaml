meta:
  subject: mathematics
  topic: geometry
  subtopic: measurement
  exams: [upcat, acet, dlsucet, ustet, pupcet]
questions:
  - id: q-geometry-measurement-0001
    type: word-problem
    difficulty: easy
    stem: |
      A rectangular vegetable garden has a length of $15\text{ m}$ and a width of $8\text{ m}$. What length of fencing material is required to completely enclose the perimeter of the garden?
    choices:
      - text: '$46\text{ m}$'
        correct: true
      - text: '$120\text{ m}$'
        correct: false
        rationale: |
          This finds garden area instead of perimeter. Multiplying the dimensions is a familiar rectangle formula. Check whether the requested quantity measures inside or around.
      - text: '$23\text{ m}$'
        correct: false
        rationale: |
          This adds one length and one width only. Both dimensions are included. Check all four sides.
      - text: '$60\text{ m}$'
        correct: false
        rationale: |
          This uses four copies of the longer side as if the garden were square. The longer side is the most visible measure. Check both rectangle dimensions.
    explanation: |
      A rectangle has two lengths and two widths. Add all four: $2(15+8)=2(23)=46$ meters.

  - id: q-geometry-measurement-0002
    type: direct-computation
    difficulty: easy
    stem: |
      A solid cube has an edge length of $5\text{ cm}$. What is its total surface area?
    choices:
      - text: '$150\text{ cm}^2$'
        correct: true
      - text: '$125\text{ cm}^3$'
        correct: false
        rationale: |
          This calculates cube volume instead of surface area. Volume also uses edge length. Check the requested units.
      - text: '$100\text{ cm}^2$'
        correct: false
        rationale: |
          This counts only four faces. Four side faces are easy to picture. Check all six faces.
      - text: '$30\text{ cm}^2$'
        correct: false
        rationale: |
          This multiplies edge length by six without squaring. There are six faces. Check that each face is a square area.
    explanation: |
      Each cube face has area $5^2=25$ square centimeters. There are six faces. Total surface area is $6(25)=150$ square centimeters.

  - id: q-geometry-measurement-0003
    type: word-problem
    difficulty: easy
    stem: |
      A cylindrical water tank has a base radius of $3\text{ m}$ and a height of $10\text{ m}$. What is the total volume of water the tank can hold?
    choices:
      - text: '$90\pi\text{ m}^3$'
        correct: true
      - text: '$30\pi\text{ m}^3$'
        correct: false
        rationale: |
          This uses the cone one-third factor for a cylinder. Both solids have circular bases. Check the solid shape.
      - text: '$60\pi\text{ m}^3$'
        correct: false
        rationale: |
          This uses the diameter in pi times radius times height instead of squaring radius. The same given length values are used. Check the full squared-radius formula.
      - text: '$300\pi\text{ m}^3$'
        correct: false
        rationale: |
          This squares height instead of radius. Both dimensions appear in the formula. Check which dimension is squared.
    explanation: |
      The cylinder base area is $\pi(3^2)=9\pi$ square meters. Multiply by height: $V=9\pi(10)=90\pi$ cubic meters.

  - id: q-geometry-measurement-0004
    type: direct-computation
    difficulty: easy
    stem: |
      A cone has a circular base radius of $6\text{ cm}$ and a height of $7\text{ cm}$. What is its volume?
    choices:
      - text: '$84\pi\text{ cm}^3$'
        correct: true
      - text: '$252\pi\text{ cm}^3$'
        correct: false
        rationale: |
          This omits the cone one-third factor. The base-height product is needed first. Check the cone formula.
      - text: '$42\pi\text{ cm}^3$'
        correct: false
        rationale: |
          This halves the cone volume a second time. Dividing is needed for a cone. Check that the one-third reduction is applied once.
      - text: '$126\pi\text{ cm}^3$'
        correct: false
        rationale: |
          This uses one half of the base-height product instead of one third. One half is used in some area formulas. Check the solid-volume formula.
    explanation: |
      A cone volume is one third of base area times height. Thus $V=\dfrac{1}{3}\pi(6^2)(7)=\dfrac{252\pi}{3}=84\pi$ cubic centimeters.

  - id: q-geometry-measurement-0005
    type: direct-computation
    difficulty: easy
    stem: |
      A spherical globe has a radius of $6\text{ cm}$. What is its total surface area?
    choices:
      - text: '$144\pi\text{ cm}^2$'
        correct: true
      - text: '$288\pi\text{ cm}^2$'
        correct: false
        rationale: |
          This uses sphere volume as surface area. Both sphere formulas use radius and pi. Check whether area or volume is requested.
      - text: '$36\pi\text{ cm}^2$'
        correct: false
        rationale: |
          This omits the surface-area factor four. A circle area uses just pi times radius squared. Check the full sphere surface-area formula.
      - text: '$72\pi\text{ cm}^2$'
        correct: false
        rationale: |
          This uses a factor two instead of four. Two appears in several circle formulas. Check the full sphere surface-area formula.
    explanation: |
      A sphere has surface area $4\pi r^2$. Substitute $r=6$: $4\pi(36)=144\pi$ square centimeters.

  - id: q-geometry-measurement-0006
    type: direct-computation
    difficulty: medium
    stem: |
      A trapezoid has parallel bases of $10\text{ cm}$ and $18\text{ cm}$. One non-parallel slant leg measures $5\text{ cm}$, and its vertical perpendicular height is $4\text{ cm}$. What is the area of the trapezoid?
    choices:
      - text: '$56\text{ cm}^2$'
        correct: true
      - text: '$70\text{ cm}^2$'
        correct: false
        rationale: |
          This uses the slant leg as height. The slant measure is explicitly given. Check that height is perpendicular to the bases.
      - text: '$112\text{ cm}^2$'
        correct: false
        rationale: |
          This omits the one-half factor in averaging bases. Both bases and height are used. Check the average-base factor.
      - text: '$28\text{ cm}^2$'
        correct: false
        rationale: |
          This reports the sum of bases and omits the area operations. The sum is a needed intermediate number. Check that area multiplies average base by height.
    explanation: |
      The average base length is $\dfrac{10+18}{2}=14$ cm. Multiply by the perpendicular height, $4$: $14(4)=56$ square centimeters.

  - id: q-geometry-measurement-0007
    type: direct-computation
    difficulty: medium
    stem: |
      A flat metal template is composed of a rectangle of length $12\text{ cm}$ and width $8\text{ cm}$, with a semicircle attached along one of its $8\text{ cm}$ sides. What is the total area of the compound shape?
    choices:
      - text: '$96 + 8\pi\text{ cm}^2$'
        correct: true
      - text: '$96 + 16\pi\text{ cm}^2$'
        correct: false
        rationale: |
          This adds a whole circle instead of a semicircle. A circle-area formula is used. Check what fraction of the circle is present.
      - text: '$96 + 32\pi\text{ cm}^2$'
        correct: false
        rationale: |
          This uses eight as the semicircle radius. The attached side length is eight. Halve the diameter before squaring.
      - text: '$104\pi\text{ cm}^2$'
        correct: false
        rationale: |
          This factors pi out of the rectangle area where no pi factor is present. Both coefficients can be added. Check which terms actually contain pi.
    explanation: |
      The rectangle area is $12(8)=96$ square centimeters. The semicircle diameter is $8$, so its radius is $4$ cm. Its area is $\dfrac{1}{2}\pi(4^2)=8\pi$ square centimeters. Add the two areas to get $96+8\pi$ square centimeters.

  - id: q-geometry-measurement-0008
    type: word-problem
    difficulty: medium
    stem: |
      A square metal plate has side length $10\text{ cm}$. A circular hole of maximum possible diameter is punched out from its center. What is the area of the remaining metal plate?
    choices:
      - text: '$100 - 25\pi\text{ cm}^2$'
        correct: true
      - text: '$100 - 100\pi\text{ cm}^2$'
        correct: false
        rationale: |
          This uses the hole diameter as its radius. The square side equals the hole diameter. Halve the diameter first.
      - text: '$25\pi - 100\text{ cm}^2$'
        correct: false
        rationale: |
          This subtracts the square area from the hole area. Both areas are calculated. Check that remaining area is outer minus removed.
      - text: '$100 - 10\pi\text{ cm}^2$'
        correct: false
        rationale: |
          This removes circumference rather than circle area. Circumference also uses radius and pi. Check the squared-radius area formula.
    explanation: |
      The square area is $10^2=100$ square centimeters. The largest centered circle has diameter $10$ and radius $5$ cm. Its area is $25\pi$ square centimeters. Subtract the hole: $100-25\pi$ square centimeters remain.

  - id: q-geometry-measurement-0009
    type: direct-computation
    difficulty: medium
    stem: |
      A rectangular wooden block has length $8\text{ cm}$, width $5\text{ cm}$, and height $3\text{ cm}$. What is its total surface area?
    choices:
      - text: '$158\text{ cm}^2$'
        correct: true
      - text: '$120\text{ cm}^3$'
        correct: false
        rationale: |
          This computes volume instead of surface area. The same three dimensions are used. Check the requested units.
      - text: '$79\text{ cm}^2$'
        correct: false
        rationale: |
          This counts each different face only once. The three face products are correct. Check the opposite matching faces.
      - text: '$160\text{ cm}^2$'
        correct: false
        rationale: |
          This rounds the face-area subtotal from seventy-nine to eighty before doubling. Round numbers make arithmetic easier. Keep exact values when the question requests an exact area.
    explanation: |
      The three different face areas are $8(5)=40$, $8(3)=24$, and $5(3)=15$ square centimeters. Each appears twice. Total surface area is $2(40+24+15)=2(79)=158$ square centimeters.

  - id: q-geometry-measurement-0010
    type: word-problem
    difficulty: medium
    stem: |
      A monument in the shape of a pyramid has a square base with side length $6\text{ m}$ and a perpendicular height of $9\text{ m}$. What is the volume of the pyramid?
    choices:
      - text: '$108\text{ m}^3$'
        correct: true
      - text: '$324\text{ m}^3$'
        correct: false
        rationale: |
          This omits the pyramid one-third factor. The base-height product is needed first. Check the pyramid formula.
      - text: '$54\text{ m}^3$'
        correct: false
        rationale: |
          This halves the pyramid volume again. A reduction is required for a pyramid. Check that the reduction is applied once.
      - text: '$162\text{ m}^3$'
        correct: false
        rationale: |
          This uses one half instead of one third. One half is used for triangle area. Check the pyramid formula.
    explanation: |
      The square base area is $6^2=36$ square meters. Pyramid volume is one third of base area times perpendicular height. Thus $V=\dfrac{1}{3}(36)(9)=108$ cubic meters.

  - id: q-geometry-measurement-0011
    type: direct-computation
    difficulty: hard
    stem: |
      A right circular cone has a base radius of $5\text{ cm}$ and a height of $12\text{ cm}$. What is its total surface area (including the base)? Use $SA=\pi r\ell+\pi r^2$, where $\ell$ is the slant height.
    choices:
      - text: '$90\pi\text{ cm}^2$'
        correct: true
      - text: '$65\pi\text{ cm}^2$'
        correct: false
        rationale: |
          This reports only the lateral area. The lateral part is needed first. Check that total includes the base.
      - text: '$85\pi\text{ cm}^2$'
        correct: false
        rationale: |
          This uses perpendicular height as slant height. Both are height measurements. Find slant height from the radius-height right triangle.
      - text: '$100\pi\text{ cm}^2$'
        correct: false
        rationale: |
          This rounds slant height thirteen to fifteen before calculating lateral area. A round slant height makes multiplication easier. Keep the exact slant height from the right triangle.
    explanation: |
      The slant height is $\sqrt{5^2+12^2}=\sqrt{169}=13$ cm. Cone lateral area is $\pi r\ell=\pi(5)(13)=65\pi$ square centimeters. The base area is $\pi(5^2)=25\pi$. Add them to get $90\pi$ square centimeters.

  - id: q-geometry-measurement-0012
    type: word-problem
    difficulty: hard
    stem: |
      A solid metallic sphere of radius $3\text{ cm}$ is melted down and completely recast into a solid cylinder of radius $3\text{ cm}$. What is the height of the cylinder?
    choices:
      - text: '$4\text{ cm}$'
        correct: true
      - text: '$3\text{ cm}$'
        correct: false
        rationale: |
          This uses the sphere radius as the new cylinder height. The radius stays the same. Use equal volumes to solve for the new height.
      - text: '$12\text{ cm}$'
        correct: false
        rationale: |
          This uses the radius without squaring it in the cylinder base. The original radius is given directly. Check that base area squares the radius.
      - text: '$6\text{ cm}$'
        correct: false
        rationale: |
          This uses base circumference instead of base area. The circle circumference is a meaningful base measure. Check that volume uses base area, not circumference.
    explanation: |
      The sphere volume is $\dfrac{4}{3}\pi(3^3)=36\pi$ cubic centimeters. Recasting keeps this volume. The cylinder volume is $\pi(3^2)h=9\pi h$. Set $9\pi h=36\pi$ and divide by $9\pi$ to get $h=4$ cm.

  - id: q-geometry-measurement-0013
    type: direct-computation
    difficulty: hard
    stem: |
      A storage silo is composed of a cylinder of radius $3\text{ m}$ and height $8\text{ m}$, topped by a hemisphere of radius $3\text{ m}$. What is the total volume of the storage silo?
    choices:
      - text: '$90\pi\text{ m}^3$'
        correct: true
      - text: '$108\pi\text{ m}^3$'
        correct: false
        rationale: |
          This adds a whole sphere instead of a hemisphere. The top is a spherical shape. Check that a hemisphere is half a sphere.
      - text: '$72\pi\text{ m}^3$'
        correct: false
        rationale: |
          This counts only the cylinder. The cylinder is the larger component. Check every solid component.
      - text: '$126\pi\text{ m}^3$'
        correct: false
        rationale: |
          This omits the sphere one-third factor before halving its volume. The sphere formula has several factors. Check the entire sphere-volume formula before halving.
    explanation: |
      The cylinder volume is $\pi(3^2)(8)=72\pi$ cubic meters. The hemisphere is half a sphere, so its volume is $\dfrac{1}{2}\left[\dfrac{4}{3}\pi(3^3)\right]=18\pi$ cubic meters. Add the parts: $72\pi+18\pi=90\pi$ cubic meters.

  - id: q-geometry-measurement-0014
    type: direct-computation
    difficulty: hard
    stem: |
      A large square has side length $12\text{ cm}$. Inside it, a smaller square is formed by connecting the midpoints of the adjacent sides of the large square. What is the area of the region inside the large square but outside the smaller square?
    choices:
      - text: '$72\text{ cm}^2$'
        correct: true
      - text: '$36\text{ cm}^2$'
        correct: false
        rationale: |
          This counts only two of the four corner triangles. Each triangle is part of the requested region. Check all four corner pieces.
      - text: '$108\text{ cm}^2$'
        correct: false
        rationale: |
          This treats the inner square side as six and subtracts its area. Midpoints divide the original sides in half. Check that a side of the inner square is not half of an outer side.
      - text: '$144\text{ cm}^2$'
        correct: false
        rationale: |
          This reports the whole outer square area. The outer square area is needed first. Check the region excluded by the inner square.
    explanation: |
      The outer square area is $12^2=144$ square centimeters. Midpoints cut each side into lengths of $6$ cm. Each of the four corner triangles has area $\dfrac{1}{2}(6)(6)=18$ square centimeters. Those corners are the region outside the inner square. Their total area is $4(18)=72$ square centimeters.

  - id: q-geometry-measurement-0015
    type: which-is-true
    difficulty: hard
    stem: |
      All edge lengths of a rectangular prism are scaled up by a factor of $3$. Which statement correctly describes the factor by which its total surface area and volume increase?
    choices:
      - text: 'Surface area $9$ times; volume $27$ times.'
        correct: true
      - text: 'Surface area $3$ times; volume $9$ times.'
        correct: false
        rationale: |
          This uses length scaling for surface area and square scaling for volume. The length factor is three. Check powers two and three for area and volume.
      - text: 'Surface area $6$ times; volume $9$ times.'
        correct: false
        rationale: |
          This multiplies three by dimension counts instead of using powers. Area and volume use two and three dimensions. Check that scale factors are powers, not products with dimension counts.
      - text: 'Surface area $27$ times; volume $9$ times.'
        correct: false
        rationale: |
          This exchanges square and cube scaling. Both nine and twenty-seven are correct scale values. Check which exponent belongs to each measurement.
    explanation: |
      Surface area scales with the square of the length factor. Its multiplier is $3^2=9$. Volume scales with the cube of the length factor. Its multiplier is $3^3=27$.

  - id: q-geometry-measurement-0016
    type: error-spotting
    difficulty: easy
    stem: |
      A triangle has base $10$ cm, a slanted side of $5$ cm, and perpendicular height $4$ cm. A student computes its area as $\dfrac{1}{2}(10)(5)=25$. What is the correct area?
    choices:
      - text: '$20$ square centimeters'
        correct: true
      - text: '$25$ square centimeters'
        rationale: |
          This uses the slanted side as height. The slant length is provided. Check for the perpendicular height.
      - text: '$40$ square centimeters'
        rationale: |
          This multiplies base and height without halving. That product is needed first. Check the triangle one-half factor.
      - text: '$10$ square centimeters'
        rationale: |
          This reports the base length as area. Ten is a given measure. Check that area uses two perpendicular lengths.
    explanation: |
      Triangle area uses the perpendicular height. Substitute $4$: $A=\dfrac{1}{2}(10)(4)=20$ square centimeters.
    approved: false

  - id: q-geometry-measurement-0017
    type: direct-computation
    difficulty: medium
    stem: |
      A sphere has surface area $36\pi$ square centimeters. What is its volume?
    choices:
      - text: '$36\pi$ cubic centimeters'
        correct: true
      - text: '$108\pi$ cubic centimeters'
        rationale: |
          This omits division by three in the volume formula. The numerator product is correct. Check the full sphere-volume formula.
      - text: '$12\pi$ cubic centimeters'
        rationale: |
          This squares the radius instead of cubing it for volume. Surface area did use the square. Check the exponent in the volume formula.
      - text: '$27\pi$ cubic centimeters'
        rationale: |
          This reports pi times radius cubed without the four-thirds factor. The cubed radius is correct. Check every factor in the sphere-volume formula.
    explanation: |
      Use $4\pi r^2=36\pi$ to get $r^2=9$ and $r=3$ cm. Then $V=\dfrac{4}{3}\pi(3^3)=36\pi$ cubic centimeters.
    approved: false

  - id: q-geometry-measurement-0018
    type: estimate-first
    difficulty: medium
    stem: |
      Using $\pi\approx3$, estimate the area of a circular mat with radius $5$ meters.
    choices:
      - text: '$75$ square meters'
        correct: true
      - text: '$15$ square meters'
        rationale: |
          This uses pi times radius without squaring. The two given values are multiplied. Check the squared radius in area.
      - text: '$150$ square meters'
        rationale: |
          This adds an extra factor two to the area. Circumference has a factor two. Check which formula is requested.
      - text: '$300$ square meters'
        rationale: |
          This treats five as a half-radius and doubles it before squaring. Circle problems often give a diameter. Check that the given length is already radius.
    explanation: |
      The area formula is $\pi r^2$. With the stated approximation, $A\approx3(5^2)=3(25)=75$ square meters.
    approved: false

  - id: q-geometry-measurement-0019
    type: word-problem
    difficulty: hard
    stem: |
      A rectangular strip is $2$ meters long and $30$ centimeters wide. What is its area in square centimeters?
    choices:
      - text: '$6000$ square centimeters'
        correct: true
      - text: '$60$ square centimeters'
        rationale: |
          This multiplies the unmatched numeric lengths. Both measurements belong to the rectangle. Check that units agree before multiplying.
      - text: '$600$ square centimeters'
        rationale: |
          This converts a meter as ten centimeters instead of one hundred. A length conversion is needed. Check the metric scale.
      - text: '$60000$ square centimeters'
        rationale: |
          This uses one thousand millimeters per meter as if it were centimeters. Both are smaller length units. Check the requested unit.
    explanation: |
      Convert $2$ meters to $200$ centimeters. Multiply matching units: $200(30)=6000$ square centimeters.
    approved: false

  - id: q-geometry-measurement-0020
    type: word-problem
    difficulty: exam
    stem: |
      An open-top rectangular box has an interior base $5$ cm by $4$ cm and height $3$ cm. Ignoring material thickness, what is the total area of its five faces, including the bottom?
    choices:
      - text: '$74$ square centimeters'
        correct: true
      - text: '$94$ square centimeters'
        rationale: |
          This uses the closed-box surface area and includes a top. The usual formula counts six faces. Check which face is absent.
      - text: '$54$ square centimeters'
        rationale: |
          This removes the bottom as well as the top. The box is open above. Check that its bottom is included.
      - text: '$60$ square centimeters'
        rationale: |
          This multiplies length, width, and height for volume. The same three dimensions are used. Check that face area uses square units.
    explanation: |
      The bottom area is $5(4)=20$. The two longer walls total $2(5)(3)=30$. The two shorter walls total $2(4)(3)=24$. Add them: $20+30+24=74$ square centimeters.
    approved: false
