meta:
  subject: 'mathematics'
  topic: 'geometry'
  subtopic: 'quadrilaterals-and-polygons'
  exams: ['upcat', 'acet', 'dlsucet', 'ustet', 'pupcet']
questions:
- id: 'q-geometry-quadrilaterals-and-polygons-0001'
  type: 'direct-computation'
  difficulty: 'easy'
  stem: |
    What is the sum of the interior angles of a convex octagon ($n = 8$ sides)?
  choices:
  - text: '$1080^\circ$'
    correct: true
  - text: '$1440^\circ$'
    correct: false
    rationale: |
      This uses n triangles instead of n minus two. Each triangle has a one-hundred-eighty-degree sum. Check the n-minus-two triangle count.
  - text: '$900^\circ$'
    correct: false
    rationale: |
      This subtracts three from the side count instead of two. The formula does subtract from n. Check the exact subtraction in the formula.
  - text: '$135^\circ$'
    correct: false
    rationale: |
      This reports one regular-octagon angle rather than the sum. A regular octagon has equal angles. Check whether one angle or the total is requested.
  explanation: |
    A convex n-sided polygon has interior-angle sum $(n-2)180^\circ$. For $n=8$, this gives $(8-2)180^\circ=1080^\circ$.
- id: 'q-geometry-quadrilaterals-and-polygons-0002'
  type: 'direct-computation'
  difficulty: 'easy'
  stem: |
    What is the sum of the same-direction exterior turning angles of a convex regular $15$-gon, one at each vertex?
  choices:
  - text: '$360^\circ$'
    correct: true
  - text: '$2340^\circ$'
    correct: false
    rationale: |
      This uses the interior-angle sum for exterior angles. Both sums concern the same polygon. Check the same-direction turning-angle rule.
  - text: '$24^\circ$'
    correct: false
    rationale: |
      This reports a single exterior angle. Twenty-four is a valid exterior angle here. Check whether one angle or the total is requested.
  - text: '$5400^\circ$'
    correct: false
    rationale: |
      This gives each vertex an entire full turn. Three hundred sixty is a familiar turn measure. Check that the full turn is shared across all vertices.
  explanation: |
    The same-direction exterior turning angles of a convex polygon make one complete turn. Their sum is therefore $360^\circ$.
- id: 'q-geometry-quadrilaterals-and-polygons-0003'
  type: 'direct-computation'
  difficulty: 'easy'
  stem: |
    In parallelogram $ABCD$, the measure of $\angle A = 72^\circ$. What is the measure of consecutive angle $\angle B$?
  choices:
  - text: '$108^\circ$'
    correct: true
  - text: '$72^\circ$'
    correct: false
    rationale: |
      This treats consecutive angles as equal opposite angles. Both are parallelogram angle rules. Check whether angles are consecutive or opposite.
  - text: '$18^\circ$'
    correct: false
    rationale: |
      This uses a complementary total. Ninety degrees is a familiar angle total. Check the supplementary total.
  - text: '$288^\circ$'
    correct: false
    rationale: |
      This uses a full-turn total. The whole quadrilateral has a three-hundred-sixty-degree sum. Check that only two consecutive angles are involved.
  explanation: |
    Consecutive parallelogram angles are supplementary. Thus $\angle B=180^\circ-72^\circ=108^\circ$.
- id: 'q-geometry-quadrilaterals-and-polygons-0004'
  type: 'direct-computation'
  difficulty: 'easy'
  stem: |
    A rhombus has a perimeter of $52\text{ cm}$. What is the length of each of its sides?
  choices:
  - text: '$13\text{ cm}$'
    correct: true
  - text: '$26\text{ cm}$'
    correct: false
    rationale: |
      This divides the perimeter by two instead of four. Opposite sides form two pairs. Check the four equal sides.
  - text: '$208\text{ cm}$'
    correct: false
    rationale: |
      This multiplies the perimeter by four instead of dividing it. Four is the number of equal sides. Check that one side must be shorter than the whole boundary.
  - text: '$52\text{ cm}$'
    correct: false
    rationale: |
      This reports the whole perimeter as one side. The perimeter is given directly. Check whether one side or the whole boundary is requested.
  explanation: |
    A rhombus has four equal sides. Divide its perimeter by four: $52\div4=13$ cm per side.
- id: 'q-geometry-quadrilaterals-and-polygons-0005'
  type: 'direct-computation'
  difficulty: 'easy'
  stem: |
    Rectangle $PQRS$ has diagonals $PR = 4x + 6$ and $QS = 6x - 10$. What is the value of $x$?
  choices:
  - text: '$8$'
    correct: true
  - text: '$16$'
    correct: false
    rationale: |
      This reports two x instead of x. Sixteen is a correct intermediate result. Check the remaining coefficient.
  - text: '$4$'
    correct: false
    rationale: |
      This divides by the coefficient difference twice. A factor two does need to be divided out. Check that each division step is applied once.
  - text: '$38$'
    correct: false
    rationale: |
      This reports the diagonal length instead of x. The diagonal is found from the same variable. Check whether the variable or a diagonal is requested.
  explanation: |
    Rectangle diagonals are equal, so $4x+6=6x-10$. Subtract $4x$ and add $10$ to get $2x=16$. Divide by $2$: $x=8$.
- id: 'q-geometry-quadrilaterals-and-polygons-0006'
  type: 'direct-computation'
  difficulty: 'medium'
  stem: |
    Each interior angle of a regular polygon measures $144^\circ$. How many sides does the polygon have?
  choices:
  - text: '$10$'
    correct: true
  - text: '$8$'
    correct: false
    rationale: |
      This treats the given angle as the regular-octagon angle of one hundred thirty-five degrees. Both angle measures are obtuse and close. Use the exact given angle to find its exterior partner.
  - text: '$12$'
    correct: false
    rationale: |
      This subtracts one hundred forty-four from one hundred eighty as thirty instead of thirty-six. Thirty is a familiar exterior angle. Check the subtraction carefully.
  - text: '$5$'
    correct: false
    rationale: |
      This uses one hundred eighty as the exterior-angle total. An interior and exterior angle form a straight angle. Check the full exterior turn.
  explanation: |
    The exterior angle is $180^\circ-144^\circ=36^\circ$. Equal exterior angles total $360^\circ$, so $n=360\div36=10$ sides.
- id: 'q-geometry-quadrilaterals-and-polygons-0007'
  type: 'direct-computation'
  difficulty: 'medium'
  stem: |
    Trapezoid $ABCD$ has parallel bases of lengths $AB = 14\text{ cm}$ and $CD = 26\text{ cm}$. What is the length of its median (midsegment)?
  choices:
  - text: '$20\text{ cm}$'
    correct: true
  - text: '$40\text{ cm}$'
    correct: false
    rationale: |
      This adds bases without averaging. The two bases are needed first. Check the average-base rule.
  - text: '$12\text{ cm}$'
    correct: false
    rationale: |
      This subtracts the bases instead of averaging them. Both base measures are used. Check the average-base rule.
  - text: '$10\text{ cm}$'
    correct: false
    rationale: |
      This halves the average a second time. The median formula includes halving. Check that averaging divides once by two.
  explanation: |
    A trapezoid midsegment length is the average of its bases. Thus $M=\dfrac{14+26}{2}=\dfrac{40}{2}=20$ cm.
- id: 'q-geometry-quadrilaterals-and-polygons-0008'
  type: 'direct-computation'
  difficulty: 'medium'
  stem: |
    A rhombus has diagonals of lengths $12\text{ cm}$ and $16\text{ cm}$. What is the perimeter of the rhombus?
  choices:
  - text: '$40\text{ cm}$'
    correct: true
  - text: '$20\text{ cm}$'
    correct: false
    rationale: |
      This counts two sides instead of four. The side length is found correctly. Check all four equal sides.
  - text: '$28\text{ cm}$'
    correct: false
    rationale: |
      This adds the diagonal lengths. Both diagonals are given. Check that a diagonal is not a side.
  - text: '$10\text{ cm}$'
    correct: false
    rationale: |
      This reports a single side length. The side length is needed first. Check that perimeter counts every side.
  explanation: |
    Rhombus diagonals are perpendicular and bisect each other. Their half-lengths are $6$ and $8$ cm. A side is the hypotenuse of that right triangle: $s=\sqrt{6^2+8^2}=10$ cm. Four sides give perimeter $4(10)=40$ cm.
- id: 'q-geometry-quadrilaterals-and-polygons-0009'
  type: 'direct-computation'
  difficulty: 'medium'
  stem: |
    In parallelogram $DEFG$, opposite angles are $\angle D = (5x + 12)^\circ$ and $\angle F = (3x + 48)^\circ$. What is the measure of consecutive angle $\angle E$?
  choices:
  - text: '$78^\circ$'
    correct: true
  - text: '$102^\circ$'
    correct: false
    rationale: |
      This reports D rather than its consecutive angle E. That measure is found first. Check the requested angle name.
  - text: '$18^\circ$'
    correct: false
    rationale: |
      This reports x instead of the angle. The variable is solved correctly. Substitute into an angle expression.
  - text: '$90^\circ$'
    correct: false
    rationale: |
      This leaves out the added $12^\circ$ when finding angle D. The product $5x$ is part of its measure. Check every term before taking the supplement.
  explanation: |
    Opposite parallelogram angles are equal: $5x+12=3x+48$. Thus $2x=36$ and $x=18$. Angle D is $5(18)+12=102^\circ$. Its consecutive angle E measures $180^\circ-102^\circ=78^\circ$.
- id: 'q-geometry-quadrilaterals-and-polygons-0010'
  type: 'direct-computation'
  difficulty: 'medium'
  stem: |
    The four interior angles of a quadrilateral are $(2x)^\circ$, $(3x + 10)^\circ$, $(4x - 15)^\circ$, and $(x + 25)^\circ$. What is the measure of the largest interior angle?
  choices:
  - text: '$121^\circ$'
    correct: true
  - text: '$112^\circ$'
    correct: false
    rationale: |
      This reports the second angle without comparing all four. That angle is evaluated correctly. Compare all evaluated angle measures.
  - text: '$34^\circ$'
    correct: false
    rationale: |
      This reports x instead of an angle. The variable is solved correctly. Substitute into each expression.
  - text: '$136^\circ$'
    correct: false
    rationale: |
      This stops at four x and omits the minus fifteen. The coefficient product is needed first. Check the complete angle expression.
  explanation: |
    The quadrilateral sum gives $2x+(3x+10)+(4x-15)+(x+25)=360$. Thus $10x+20=360$, so $x=34$. The measures are $68^\circ,112^\circ,121^\circ,$ and $59^\circ$. The largest is $121^\circ$.
- id: 'q-geometry-quadrilaterals-and-polygons-0011'
  type: 'direct-computation'
  difficulty: 'hard'
  stem: |
    A convex regular polygon has an interior angle sum of $1800^\circ$. How many diagonals can be drawn in this polygon?
  choices:
  - text: '$54$'
    correct: true
  - text: '$108$'
    correct: false
    rationale: |
      This counts each diagonal at both ends without halving. The vertex-based count is needed first. Check that each diagonal has two ends.
  - text: '$12$'
    correct: false
    rationale: |
      This reports the side count. The side count is needed first. Check whether sides or diagonals are requested.
  - text: '$66$'
    correct: false
    rationale: |
      This counts every pair of vertices, including adjacent pairs forming sides. Every diagonal connects two vertices. Exclude neighboring vertices from diagonal connections.
  explanation: |
    Use $(n-2)180=1800$ to get $n=12$. Each vertex connects by diagonals to nine others, excluding itself and its two neighbors. This counts $12(9)=108$ connections. Each diagonal is counted at both ends, so divide by $2$: $108\div2=54$.
- id: 'q-geometry-quadrilaterals-and-polygons-0012'
  type: 'direct-computation'
  difficulty: 'hard'
  stem: |
    In isosceles trapezoid $ABCD$ with $AB \parallel CD$ and $AD = BC$, base angle $\angle ADC = 65^\circ$. If diagonal $AC$ bisects angle $\angle BAD$, what is the measure of $\angle ACD$?
  choices:
  - text: '$57.5^\circ$'
    correct: true
  - text: '$65^\circ$'
    correct: false
    rationale: |
      This copies the given base angle. The given angle belongs to the same trapezoid. Check the requested angle name and bisected angle.
  - text: '$32.5^\circ$'
    correct: false
    rationale: |
      This bisects sixty-five degrees rather than the angle at A. A bisector is stated. Check which vertex the diagonal bisects.
  - text: '$115^\circ$'
    correct: false
    rationale: |
      This reports the full angle at A. That full angle is needed first. Check the triangle containing the requested angle.
  explanation: |
    Parallel bases make angles BAD and ADC supplementary. Thus BAD measures $180^\circ-65^\circ=115^\circ$. Its bisector gives CAD equal to $57.5^\circ$. In triangle ACD, subtract the other two angles from $180^\circ$: ACD is $180^\circ-65^\circ-57.5^\circ=57.5^\circ$.
- id: 'q-geometry-quadrilaterals-and-polygons-0013'
  type: 'direct-computation'
  difficulty: 'hard'
  stem: |
    The diagonal of a square measures $12\text{ cm}$. What is the area of the square?
  choices:
  - text: '$72\text{ cm}^2$'
    correct: true
  - text: '$144\text{ cm}^2$'
    correct: false
    rationale: |
      This uses the diagonal as a side. The given length spans the square. Check which length is the diagonal.
  - text: '$36\text{ cm}^2$'
    correct: false
    rationale: |
      This halves the diagonal before squaring. A diagonal bisects the square. Use the right triangle with two equal square sides.
  - text: '$288\text{ cm}^2$'
    correct: false
    rationale: |
      This doubles the diagonal square instead of halving it. The relationship does involve a factor two. Check that the diagonal square is twice the side square.
  explanation: |
    Let the square side be s. The diagonal forms a right triangle with two equal legs, so $s^2+s^2=12^2$. Hence $2s^2=144$ and $s^2=72$. The square area is $72$ square centimeters.
- id: 'q-geometry-quadrilaterals-and-polygons-0014'
  type: 'direct-computation'
  difficulty: 'hard'
  stem: |
    The ratio of an interior angle to an exterior angle of a regular polygon is $7 : 2$. How many sides does the polygon have?
  choices:
  - text: '$9$'
    correct: true
  - text: '$40$'
    correct: false
    rationale: |
      This reports the exterior angle as the side count. That angle is a useful result on the way. Check whether the question asks for an angle or a number of sides.
  - text: '$140$'
    correct: false
    rationale: |
      This reports the interior angle as the side count. The ratio gives that angle correctly. Check the unit and the requested quantity.
  - text: '$18$'
    correct: false
    rationale: |
      This treats one ratio part as the whole exterior angle. One part has measure twenty degrees. Check that the exterior uses two ratio parts.
  explanation: |
    The interior and adjacent exterior angle sum to $180^\circ$. Their ratio gives $7x+2x=180$, so $x=20$. The exterior angle is $2(20)=40^\circ$. Divide the full exterior turn by this measure: $360\div40=9$ sides.
- id: 'q-geometry-quadrilaterals-and-polygons-0015'
  type: 'direct-computation'
  difficulty: 'hard'
  stem: |
    In rhombus $ABCD$, diagonal $AC$ is drawn. If $\angle B = 110^\circ$, what is the measure of $\angle ACD$?
  choices:
  - text: '$35^\circ$'
    correct: true
  - text: '$55^\circ$'
    correct: false
    rationale: |
      This halves B instead of C. The diagonal bisects some rhombus angles. Check which vertices AC joins and bisects.
  - text: '$70^\circ$'
    correct: false
    rationale: |
      This reports C before bisection. C is a needed intermediate measure. Check the diagonal-bisection step.
  - text: '$110^\circ$'
    correct: false
    rationale: |
      This copies the given angle B. B is stated directly. Check the requested vertex.
  explanation: |
    The rhombus is a parallelogram, so angles B and C are supplementary. Thus C is $180^\circ-110^\circ=70^\circ$. Diagonal AC bisects C. Therefore ACD is $70^\circ\div2=35^\circ$.
- id: 'q-geometry-quadrilaterals-and-polygons-0016'
  type: 'which-is-true'
  difficulty: 'easy'
  stem: |
    Using the exclusive trapezoid convention, what is a quadrilateral with exactly one pair of parallel sides?
  choices:
  - text: 'Trapezoid'
    correct: true
  - text: 'Parallelogram'
    rationale: |
      This applies the two-pair parallel condition to a one-pair figure. Both are quadrilaterals with parallel sides. Check whether exactly one or both pairs are parallel.
  - text: 'Rectangle'
    rationale: |
      This identifies a rectangle from parallelism alone. Rectangles have two parallel pairs and four right angles. Check the number of pairs in the given figure.
  - text: 'Rhombus'
    rationale: |
      This identifies a rhombus without equal-side information. Rhombi are also parallelograms. Check that the figure has only one parallel pair.
  explanation: |
    The exclusive definition requires exactly one pair of parallel sides. That is the defining condition for a trapezoid in this convention.
  approved: false
- id: 'q-geometry-quadrilaterals-and-polygons-0017'
  type: 'error-spotting'
  difficulty: 'medium'
  stem: |
    A student adds the same-direction exterior turning angles of a convex hexagon using $(6-2)180^\circ=720^\circ$. Which total should replace this?
  choices:
  - text: '$360^\circ$'
    correct: true
  - text: '$720^\circ$'
    rationale: |
      This repeats the interior-angle sum. Both angle types belong to the same hexagon. Check whether interior angles or exterior turns are being added.
  - text: '$60^\circ$'
    rationale: |
      This reports a single exterior angle of a regular hexagon. The polygon has six vertices. Check that the question asks for the total.
  - text: '$120^\circ$'
    rationale: |
      This reports a single interior angle of a regular hexagon. One hundred twenty is a familiar hexagon measure. Check both the angle type and whether a sum is requested.
  explanation: |
    Those exterior turns trace one complete rotation around the polygon. Their total is $360^\circ$.
  approved: false
- id: 'q-geometry-quadrilaterals-and-polygons-0018'
  type: 'which-is-true'
  difficulty: 'medium'
  stem: |
    A quadrilateral is known to be a square. Which classifications must also apply?
  choices:
  - text: 'Rectangle and rhombus'
    correct: true
  - text: 'Rectangle, but never rhombus'
    rationale: |
      This excludes rhombi from the square class. The rectangle condition is correctly identified. Check the equal sides of a square.
  - text: 'Rhombus, but never rectangle'
    rationale: |
      This excludes rectangles from the square class. The equal-side condition is correctly identified. Check the right angles of a square.
  - text: 'Neither rectangle nor rhombus'
    rationale: |
      This treats shape classes as mutually exclusive. Their names are different. Check that a square satisfies both broader definitions.
  explanation: |
    A square has four right angles, meeting the rectangle definition. It also has four equal sides, meeting the rhombus definition. Therefore both classifications apply.
  approved: false
- id: 'q-geometry-quadrilaterals-and-polygons-0019'
  type: 'which-is-true'
  difficulty: 'hard'
  stem: |
    Which property holds for every rectangle?
  choices:
  - text: 'Its diagonals have equal length.'
    correct: true
  - text: 'Its diagonals are perpendicular.'
    rationale: |
      This uses the rhombus diagonal property for every rectangle. Squares have both properties. Check whether a nonsquare rectangle must have them too.
  - text: 'All four sides have equal length.'
    rationale: |
      This applies the square equal-side condition to every rectangle. A square is a rectangle. Check the direction of the classification claim.
  - text: 'Exactly one pair of sides is parallel.'
    rationale: |
      This uses the exclusive trapezoid condition. Both types have parallel sides. Check that rectangles have both pairs parallel.
  explanation: |
    Equal diagonal lengths are a rectangle property. Every rectangle has this property, including its square special cases.
  approved: false
- id: 'q-geometry-quadrilaterals-and-polygons-0020'
  type: 'word-problem'
  difficulty: 'exam'
  stem: |
    Two convex polygons have $8$ and $11$ sides. By how much does the second polygon's interior-angle sum exceed the first polygon's sum?
  choices:
  - text: '$540^\circ$'
    correct: true
  - text: '$1080^\circ$'
    rationale: |
      This reports the first polygon's sum. That value is needed for the subtraction. Check whether a sum or a difference is requested.
  - text: '$1620^\circ$'
    rationale: |
      This reports the second polygon's sum. That value is needed for the subtraction. Check whether a sum or a difference is requested.
  - text: '$360^\circ$'
    rationale: |
      This uses the exterior-angle total. Both polygons have the same exterior-turn total. Check that the comparison concerns interior sums.
  explanation: |
    The sums are $(8-2)180^\circ=1080^\circ$ and $(11-2)180^\circ=1620^\circ$. Their difference is $1620^\circ-1080^\circ=540^\circ$.
  approved: false
