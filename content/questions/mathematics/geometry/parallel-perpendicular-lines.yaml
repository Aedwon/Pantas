meta:
  subject: mathematics
  topic: geometry
  subtopic: parallel-perpendicular-lines
  exams: [upcat, acet, dlsucet, ustet, pupcet]
questions:
  - id: q-geometry-parallel-perpendicular-lines-0001
    type: direct-computation
    difficulty: easy
    stem: |
      Two parallel lines $L_1$ and $L_2$ are intersected by a transversal $T$. If one of the alternate interior angles measures $68^\circ$, what is the measure of the other alternate interior angle?
    choices:
      - text: '$68^\circ$'
        correct: true
      - text: '$112^\circ$'
        correct: false
        rationale: |
          This treats alternate interior angles as supplementary. Both pairs are made by a transversal. Check the angle-pair name.
      - text: '$22^\circ$'
        correct: false
        rationale: |
          This finds a complement of the given angle. Complementary angles are another familiar pair. Check that alternate interior angles are equal.
      - text: '$136^\circ$'
        correct: false
        rationale: |
          This doubles the given angle. Two related angles are being compared. Check that the relationship is equality, not a sum.
    explanation: |
      Alternate interior angles are equal when the lines are parallel. The other angle therefore measures $68^\circ$.

  - id: q-geometry-parallel-perpendicular-lines-0002
    type: direct-computation
    difficulty: easy
    stem: |
      Parallel lines $L_1$ and $L_2$ are cut by transversal $T$. If one same-side interior angle measures $115^\circ$, what is the measure of the other same-side interior angle?
    choices:
      - text: '$65^\circ$'
        correct: true
      - text: '$115^\circ$'
        correct: false
        rationale: |
          This treats same-side interior angles as equal. Other parallel-line pairs are equal. Check the same-side interior sum.
      - text: '$25^\circ$'
        correct: false
        rationale: |
          This finds the magnitude of a complement instead of the supplement. A ninety-degree total is familiar. Check the one-hundred-eighty-degree total.
      - text: '$230^\circ$'
        correct: false
        rationale: |
          This doubles the given measure. The same known measure is used. Check whether a supplement or a double is requested.
    explanation: |
      Same-side interior angles sum to $180^\circ$. Subtract the known measure: $180^\circ-115^\circ=65^\circ$.

  - id: q-geometry-parallel-perpendicular-lines-0003
    type: direct-computation
    difficulty: easy
    stem: |
      Two parallel lines are cut by a transversal. Angle $1$ and Angle $5$ are corresponding angles. If Angle $1 = (4x + 10)^\circ$ and Angle $5 = 70^\circ$, what is the value of $x$?
    choices:
      - text: '$15$'
        correct: true
      - text: '$25$'
        correct: false
        rationale: |
          This sets the corresponding angles to a supplementary total. Same-side pairs do use a sum. Check whether this pair is equal or supplementary.
      - text: '$20$'
        correct: false
        rationale: |
          This adds ten instead of subtracting it. The constant must be moved. Check the subtraction in solving the equation.
      - text: '$60$'
        correct: false
        rationale: |
          This reports four x rather than x. Sixty is a correct intermediate result. Check that the coefficient four has been divided out.
    explanation: |
      Corresponding angles are equal, so $4x+10=70$. Subtract $10$ to get $4x=60$. Divide by $4$: $x=15$.

  - id: q-geometry-parallel-perpendicular-lines-0004
    type: direct-computation
    difficulty: easy
    stem: |
      Line $L_1$ is parallel to line $L_2$. Transversal $T_1$ is perpendicular to line $L_1$. What is the measure of the angle formed at the intersection of transversal $T_1$ and line $L_2$?
    choices:
      - text: '$90^\circ$'
        correct: true
      - text: '$45^\circ$'
        correct: false
        rationale: |
          This halves a right angle. Angle bisectors do halve angles. Check whether any bisector is stated.
      - text: '$180^\circ$'
        correct: false
        rationale: |
          This reports the straight-angle total instead of the crossing angle. The two parallel lines are straight. Check the perpendicular relation.
      - text: '$0^\circ$'
        correct: false
        rationale: |
          This treats the transversal as parallel to the given lines. The original two lines are parallel. Check the direction of the transversal.
    explanation: |
      The corresponding angle on the second parallel line equals the right angle on the first. Thus it measures $90^\circ$, and the transversal is perpendicular to both.

  - id: q-geometry-parallel-perpendicular-lines-0005
    type: direct-computation
    difficulty: easy
    stem: |
      Two parallel lines are intersected by a transversal. Two alternate exterior angles measure $(5x - 20)^\circ$ and $(3x + 16)^\circ$. What is the value of $x$?
    choices:
      - text: '$18$'
        correct: true
      - text: '$23$'
        correct: false
        rationale: |
          This makes alternate exterior angles supplementary. Other parallel-line angle pairs are supplementary. Check the alternate exterior equality rule.
      - text: '$9$'
        correct: false
        rationale: |
          This halves the solved value again. The coefficient difference is two. Check that division by two is used once.
      - text: '$36$'
        correct: false
        rationale: |
          This reports two x rather than x. Thirty-six is found first. Check the remaining coefficient.
    explanation: |
      Alternate exterior angles are equal, so $5x-20=3x+16$. Subtract $3x$ and add $20$: $2x=36$. Divide by $2$: $x=18$.

  - id: q-geometry-parallel-perpendicular-lines-0006
    type: direct-computation
    difficulty: medium
    stem: |
      Parallel lines $L_1$ and $L_2$ are cut by transversal $T$. The measures of two same-side interior angles are $(7x - 15)^\circ$ and $(4x + 8)^\circ$. What is the measure of the larger angle?
    choices:
      - text: '$104^\circ$'
        correct: true
      - text: '$76^\circ$'
        correct: false
        rationale: |
          This reports the smaller angle. Both angles are found from the same x. Check whether larger or smaller is requested.
      - text: '$17^\circ$'
        correct: false
        rationale: |
          This reports x rather than an angle. The variable is solved correctly. Substitute into an angle expression.
      - text: '$119^\circ$'
        correct: false
        rationale: |
          This stops at seven x before subtracting fifteen. The multiplication is a correct intermediate step. Check the full angle expression.
    explanation: |
      The same-side interior sum gives $(7x-15)+(4x+8)=180$. Thus $11x-7=180$, so $x=17$. The angles are $7(17)-15=104^\circ$ and $4(17)+8=76^\circ$. The larger is $104^\circ$.

  - id: q-geometry-parallel-perpendicular-lines-0007
    type: direct-computation
    difficulty: medium
    stem: |
      Two horizontal parallel lines lie above and below point P. Segments connect P to points on each line, both to the left of P. The left-facing angle between the segments is $80^\circ$. The upper segment makes an acute angle of $35^\circ$ with the upper line. What acute angle does the lower segment make with the lower line?
    choices:
      - text: '$45^\circ$'
        correct: true
      - text: '$115^\circ$'
        correct: false
        rationale: |
          This adds the known outer inclination to the full middle angle. Both values are stated in the problem. Check that the full angle is made from both smaller parts.
      - text: '$80^\circ$'
        correct: false
        rationale: |
          This reports the full middle angle as the missing outer angle. The full angle is given directly. Check which angle is requested.
      - text: '$35^\circ$'
        correct: false
        rationale: |
          This assumes the two outer inclinations are equal. Parallel lines can suggest equal angles. Check that only corresponding positions force equality.
    explanation: |
      A horizontal helper line through P splits the left-facing angle into the two inclinations. Alternate interior angles make the upper part $35^\circ$. The full angle is $80^\circ$, so the lower part is $80^\circ-35^\circ=45^\circ$. Its matching angle on the lower parallel line is also $45^\circ$.

  - id: q-geometry-parallel-perpendicular-lines-0008
    type: direct-computation
    difficulty: medium
    stem: |
      Two lines $L_1$ and $L_2$ are cut by transversal $T$. Two corresponding angles are given by $(3x + 25)^\circ$ and $(5x - 15)^\circ$. For what value of $x$ will lines $L_1$ and $L_2$ be parallel?
    choices:
      - text: '$20$'
        correct: true
      - text: '$21.25$'
        correct: false
        rationale: |
          This makes corresponding angles supplementary. Some parallel-line angle pairs have that total. Check the corresponding-angle converse.
      - text: '$10$'
        correct: false
        rationale: |
          This divides the solved x by two again. The coefficient difference is two. Check that each solving step is performed once.
      - text: '$40$'
        correct: false
        rationale: |
          This reports two x rather than x. Forty is a correct intermediate result. Check the remaining coefficient.
    explanation: |
      The corresponding-angle converse requires equal measures. Set $3x+25=5x-15$. Rearrange to $2x=40$, so $x=20$.

  - id: q-geometry-parallel-perpendicular-lines-0009
    type: direct-computation
    difficulty: medium
    stem: |
      Parallel lines $AB$ and $CD$ are cut by transversal $EF$, intersecting $AB$ at $E$ and $CD$ at $F$. Angles $\angle BEF$ and $\angle CFE$ are alternate interior angles. Ray $EG$ bisects $\angle BEF$. If $\angle CFE = 110^\circ$, what is the measure of $\angle GEF$?
    choices:
      - text: '$55^\circ$'
        correct: true
      - text: '$110^\circ$'
        correct: false
        rationale: |
          This reports the full alternate interior angle. That full angle is needed first. Check that the full angle is bisected.
      - text: '$35^\circ$'
        correct: false
        rationale: |
          This supplements the alternate interior angle before halving. A supplement is another angle at the crossing. Check the stated alternate interior positions.
      - text: '$70^\circ$'
        correct: false
        rationale: |
          This supplements the full angle and omits bisection. The seventy-degree supplement is meaningful at the crossing. Check both the angle match and the bisector.
    explanation: |
      The stem states that BEF and CFE are alternate interior angles. Parallel lines make their measures equal, so BEF is $110^\circ$. The bisector divides it equally, giving $\angle GEF=110^\circ\div2=55^\circ$.

  - id: q-geometry-parallel-perpendicular-lines-0010
    type: direct-computation
    difficulty: medium
    stem: |
      Parallel lines $m$ and $n$ are cut by a transversal. Two same-side exterior angles measure $(9x - 14)^\circ$ and $(3x + 2)^\circ$. What is the measure of the smaller angle?
    choices:
      - text: '$50^\circ$'
        correct: true
      - text: '$130^\circ$'
        correct: false
        rationale: |
          This reports the larger angle. Both angles come from the same variable. Check whether smaller or larger is requested.
      - text: '$16^\circ$'
        correct: false
        rationale: |
          This reports x rather than an angle. The variable is solved correctly. Substitute into an angle expression.
      - text: '$48^\circ$'
        correct: false
        rationale: |
          This stops at three x before adding two. The multiplication is a correct intermediate result. Check the full angle expression.
    explanation: |
      Same-side exterior angles sum to $180^\circ$. Thus $(9x-14)+(3x+2)=180$, giving $12x=192$ and $x=16$. The measures are $130^\circ$ and $50^\circ$. The smaller is $50^\circ$.

  - id: q-geometry-parallel-perpendicular-lines-0011
    type: direct-computation
    difficulty: hard
    stem: |
      Two parallel lines $L_1 \parallel L_2$ are intersected by another set of parallel lines $M_1 \parallel M_2$, forming a parallelogram grid. One interior angle of the parallelogram is $(5x + 10)^\circ$ and its consecutive interior angle is $(3x + 10)^\circ$. What is the measure of the acute interior angle of the parallelogram?
    choices:
      - text: '$70^\circ$'
        correct: true
      - text: '$110^\circ$'
        correct: false
        rationale: |
          This reports the obtuse angle. The obtuse angle is found alongside the acute one. Check the acute-angle condition.
      - text: '$20^\circ$'
        correct: false
        rationale: |
          This reports x rather than an angle. The variable is solved correctly. Substitute before giving an angle.
      - text: '$60^\circ$'
        correct: false
        rationale: |
          This leaves out the constant ten from the acute-angle expression. The coefficient product is a correct first calculation. Check the complete angle expression.
    explanation: |
      Consecutive parallelogram angles are same-side interior angles of its parallel sides. Their sum gives $(5x+10)+(3x+10)=180$, so $x=20$. The angles are $110^\circ$ and $70^\circ$. The acute angle is $70^\circ$.

  - id: q-geometry-parallel-perpendicular-lines-0012
    type: direct-computation
    difficulty: hard
    stem: |
      Three horizontal parallel lines are crossed by two transversals that both rise from left to right. One transversal makes an acute inclination of $40^\circ$ to the positive horizontal direction, and the other makes $75^\circ$ to that same direction. What is the obtuse angle where the transversals intersect?
    choices:
      - text: '$145^\circ$'
        correct: true
      - text: '$35^\circ$'
        correct: false
        rationale: |
          This reports the acute angle between the transversals. The difference is needed first. Check whether the acute or obtuse angle is requested.
      - text: '$115^\circ$'
        correct: false
        rationale: |
          This adds inclinations as if the lines rose in opposite directions. A left-facing zigzag does add two inclinations. Check the stated common rise direction.
      - text: '$65^\circ$'
        correct: false
        rationale: |
          This supplements the inclination sum instead of its difference. The sum involves both stated values. Check the angle between the equally oriented transversals.
    explanation: |
      Both transversals rise in the same left-to-right direction. Their acute inclinations differ by $75^\circ-40^\circ=35^\circ$, which is the acute angle between them. The adjacent obtuse angle is its supplement: $180^\circ-35^\circ=145^\circ$.

  - id: q-geometry-parallel-perpendicular-lines-0013
    type: direct-computation
    difficulty: hard
    stem: |
      Line $L_1$ is parallel to line $L_2$. Line segment $AB$ is perpendicular to $L_1$ at point $A$ and intersects $L_2$ at point $B$. Ray $AC$ is drawn between $L_1$ and $L_2$ such that $\angle BAC = 32^\circ$. What is the measure of the acute angle that ray $AC$ makes with line $L_2$?
    choices:
      - text: '$58^\circ$'
        correct: true
      - text: '$32^\circ$'
        correct: false
        rationale: |
          This reports the angle to the perpendicular segment. That angle is given directly. Check which line the requested angle uses.
      - text: '$122^\circ$'
        correct: false
        rationale: |
          This reports the obtuse supplement of the requested acute angle. Both acute and obtuse angles occur at the crossing. Check the requested acute type.
      - text: '$148^\circ$'
        correct: false
        rationale: |
          This supplements the given thirty-two-degree angle directly. A supplementary relationship occurs among crossing angles. Check the perpendicular reference first.
    explanation: |
      AB is perpendicular to both parallel lines. At A, the ray makes $90^\circ-32^\circ=58^\circ$ with the first line. Parallel-line angle equality carries that acute measure to the second line. The requested angle is $58^\circ$.

  - id: q-geometry-parallel-perpendicular-lines-0014
    type: direct-computation
    difficulty: hard
    stem: |
      Parallel lines $L_1 \parallel L_2 \parallel L_3$ are crossed by transversal $T$. At the intersections with $L_1$ and $L_3$, a pair of corresponding acute angles measure $(3x + 15)^\circ$ and $(5x - 25)^\circ$. At point $B$, where $T$ intersects $L_2$, ray $BD$ bisects the adjacent obtuse angle formed by $T$ and $L_2$. What is the measure of the angle between ray $BD$ and line $L_2$?
    choices:
      - text: '$52.5^\circ$'
        correct: true
      - text: '$37.5^\circ$'
        correct: false
        rationale: |
          This bisects the acute angle instead of its adjacent obtuse angle. Both parts involve a bisector. Check which angle is bisected.
      - text: '$105^\circ$'
        correct: false
        rationale: |
          This reports the obtuse angle before bisection. The obtuse measure is a needed intermediate result. Check the final division by two.
      - text: '$75^\circ$'
        correct: false
        rationale: |
          This reports the initial acute angle. The corresponding measure is found first. Check the supplement and bisection steps.
    explanation: |
      Equal corresponding angles give $3x+15=5x-25$, so $x=20$. Their acute measure is $3(20)+15=75^\circ$. Its adjacent obtuse angle is $180^\circ-75^\circ=105^\circ$. Bisecting it gives $105^\circ\div2=52.5^\circ$.

  - id: q-geometry-parallel-perpendicular-lines-0015
    type: direct-computation
    difficulty: hard
    stem: |
      Two horizontal parallel lines $L_1$ and $L_2$ are intersected by two transversals $T_1$ and $T_2$ that meet at point $P$ between them. $T_1$ meets $L_1$ at a point to the left of $P$ and makes an interior angle of $50^\circ$ with $L_1$. $T_2$ meets $L_2$ at a point to the left of $P$ and makes an interior angle of $65^\circ$ with $L_2$. What is the measure of the left-facing angle between $T_1$ and $T_2$ at $P$?
    choices:
      - text: '$115^\circ$'
        correct: true
      - text: '$65^\circ$'
        correct: false
        rationale: |
          This reports only the lower angle piece. The lower piece is given directly. Check that both pieces contribute.
      - text: '$15^\circ$'
        correct: false
        rationale: |
          This subtracts the two pieces. Both given measures are used. Check that the two rays open to the same side of P.
      - text: '$130^\circ$'
        correct: false
        rationale: |
          This doubles the lower angle instead of adding the upper angle. Both segments appear to border the middle angle. Check the two different angle measures.
    explanation: |
      A horizontal helper line through P splits the left-facing angle into two pieces. Parallel-line angle equality gives an upper piece of $50^\circ$ and lower piece of $65^\circ$. Their sum is $115^\circ$.

  - id: q-geometry-parallel-perpendicular-lines-0016
    type: which-is-true
    difficulty: easy
    stem: |
      When a transversal cuts two lines, how are corresponding angle positions identified?
    choices:
      - text: 'Same corner at different crossings.'
        correct: true
      - text: 'Opposite sides, both between the lines.'
        rationale: |
          This describes alternate interior angles. Both types compare two crossings. Check whether positions match or alternate across the transversal.
      - text: 'Same side, both between the lines.'
        rationale: |
          This describes same-side interior angles. Both types use the same side of the transversal. Check the relative corner at each crossing.
      - text: 'Opposite angles at one crossing.'
        rationale: |
          This describes vertical angles. Those angles are equal too in their own setting. Check whether the pair is at one crossing or two.
    explanation: |
      Corresponding angles occupy the same relative corner at the two crossings, such as top left at both. Their position identifies the pair.
    approved: false

  - id: q-geometry-parallel-perpendicular-lines-0017
    type: error-spotting
    difficulty: medium
    stem: |
      A sketch shows a transversal crossing two lines. One corresponding angle is $50^\circ$. A student says its partner is also $50^\circ$ because the lines look parallel, though parallelism is not given. Which statement correctly evaluates this reasoning?
    choices:
      - text: 'A parallel-line condition is missing.'
        correct: true
      - text: 'Corresponding angles are equal for all pairs of lines.'
        rationale: |
          This removes the parallel-line requirement from the equality rule. The pair name is still correct. Check the hypotheses of the theorem.
      - text: 'The partner must always be $130^\circ$ instead.'
        rationale: |
          This assumes a supplementary relationship without enough information. One hundred thirty supplements fifty. Check the actual pair and line relationship.
      - text: 'The sketch alone proves the lines are parallel.'
        rationale: |
          This treats a drawing's appearance as proof. Diagrams can look parallel. Check the stated givens or marked relationships.
    explanation: |
      Corresponding-angle equality is guaranteed when the crossed lines are parallel. An appearance of parallelism is not a stated fact. Without a parallel-line condition, the partner measure is not determined.
    approved: false

  - id: q-geometry-parallel-perpendicular-lines-0018
    type: direct-computation
    difficulty: medium
    stem: |
      Two same-side interior angles formed by a transversal across parallel lines are equal. What is each angle measure?
    choices:
      - text: '$90^\circ$'
        correct: true
      - text: '$45^\circ$'
        rationale: |
          This divides the straight-angle total by four instead of two. There are several angles at the crossings. Check that this equation includes only the two named angles.
      - text: '$180^\circ$'
        rationale: |
          This reports the pair's total as one member. The total is needed first. Check that equal members divide it equally.
      - text: '$0^\circ$'
        rationale: |
          This reports the difference of equal angles. Equal angles do have zero difference. Check that their individual measures are requested.
    explanation: |
      The angles are supplementary, so their sum is $180^\circ$. If both equal $a$, then $2a=180^\circ$. Divide by $2$ to get $a=90^\circ$.
    approved: false

  - id: q-geometry-parallel-perpendicular-lines-0019
    type: error-spotting
    difficulty: hard
    stem: |
      Two same-side interior angles across parallel lines measure $(2x+30)^\circ$ and $(3x-10)^\circ$. A student sets them equal. Which equation should be used instead?
    choices:
      - text: '$2x+30+3x-10=180$'
        correct: true
      - text: '$2x+30=3x-10$'
        rationale: |
          This repeats the equal-angle rule for the wrong pair. Corresponding and alternate pairs do use equality. Check the same-side interior relationship.
      - text: '$2x+30+3x-10=90$'
        rationale: |
          This uses a complementary total. Ninety is a common angle benchmark. Check the supplementary total for this pair.
      - text: '$2x+30+3x-10=360$'
        rationale: |
          This uses a full-turn total. A full circle does have three hundred sixty degrees. Check that these two angles form a supplementary pair.
    explanation: |
      Same-side interior angles are supplementary. Add the two angle expressions and set the total to $180^\circ$. This gives $2x+30+3x-10=180$.
    approved: false

  - id: q-geometry-parallel-perpendicular-lines-0020
    type: which-is-true
    difficulty: exam
    stem: |
      Two distinct lines are cut by a transversal. Alternate interior angles measure $(3x+10)^\circ$ and $(5x-30)^\circ$. If $x=20$, what must the relationship between the two crossed lines be?
    choices:
      - text: 'Parallel'
        correct: true
      - text: 'Perpendicular'
        rationale: |
          This treats equality of angles as requiring a right angle. Equal angles can have other measures. Check whether the common measure is ninety degrees.
      - text: 'Intersecting at $70^\circ$'
        rationale: |
          This treats a transversal angle as the angle between the two crossed lines. Seventy is the measured angle in the setup. Check which two lines it belongs to.
      - text: 'No relationship can be determined.'
        rationale: |
          This ignores the converse of the parallel-line angle rules. The lines were not stated parallel at the start. Check whether equal corresponding angles can establish that fact.
    explanation: |
      Substitute $x=20$. The two measures are $3(20)+10=70^\circ$ and $5(20)-30=70^\circ$. Equal alternate interior angles give equal corresponding angles through a vertical-angle pair. The corresponding-angle converse therefore proves the crossed lines parallel.
    approved: false
