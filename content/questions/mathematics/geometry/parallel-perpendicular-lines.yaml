questions:
  - id: q-geometry-parallel-perpendicular-lines-0001
    type: direct-computation
    difficulty: easy
    stem: |
      Two parallel lines $L_1$ and $L_2$ are intersected by a transversal $T$. If one of the alternate interior angles measures $68^\circ$, what is the measure of the other alternate interior angle?
    choices:
      - text: '$68^\circ$'
        correct: true
      - text: '$112^\circ$'
        correct: false
        rationale: |
          You treated alternate interior angles like a supplementary pair. These two angles are equal, not a 180-degree pair.
      - text: '$22^\circ$'
        correct: false
        rationale: |
          You subtracted from the wrong benchmark. The alternate interior partner keeps the same measure as 68 degrees.
      - text: '$136^\circ$'
        correct: false
        rationale: |
          You doubled the given angle instead of matching it. Alternate interior angles stay congruent.
    explanation: |
      When two parallel lines are cut by a transversal, alternate interior angles are equal in measure.

      1. Identify the relationship: Alternate interior angles are congruent.
      2. Therefore, the measure of the other alternate interior angle is equal to $68^\circ$.

      Common Trap: Confusing alternate interior angles with same-side interior angles, which leads to calculating $180^\circ - 68^\circ = 112^\circ$.

  - id: q-geometry-parallel-perpendicular-lines-0002
    type: direct-computation
    difficulty: easy
    stem: |
      Parallel lines $L_1$ and $L_2$ are cut by transversal $T$. If one same-side interior angle measures $115^\circ$, what is the measure of the other same-side interior angle?
    choices:
      - text: '$65^\circ$'
        correct: true
      - text: '$115^\circ$'
        correct: false
        rationale: |
          You treated same-side interior angles like corresponding angles. They are supplementary, not equal.
      - text: '$25^\circ$'
        correct: false
        rationale: |
          You subtracted incorrectly from 180 degrees. The missing angle is $180 - 115$.
      - text: '$75^\circ$'
        correct: false
        rationale: |
          You made the supplement too large. Same-side interior angles must add to exactly 180 degrees.
    explanation: |
      Same-side interior angles formed by parallel lines cut by a transversal are supplementary (their sum is $180^\circ$).

      1. Set up equation: $\text{Angle}_1 + \text{Angle}_2 = 180^\circ$.
      2. Substitute $115^\circ$: $115^\circ + \text{Angle}_2 = 180^\circ$.
      3. Solve: $\text{Angle}_2 = 180^\circ - 115^\circ = 65^\circ$.

      Common Trap: Mistakenly assuming same-side interior angles are equal ($115^\circ$).

  - id: q-geometry-parallel-perpendicular-lines-0003
    type: direct-computation
    difficulty: easy
    stem: |
      Two parallel lines are cut by a transversal. Angle $1$ and Angle $5$ are corresponding angles. If Angle $1 = (4x + 10)^\circ$ and Angle $5 = 70^\circ$, what is the value of $x$?
    choices:
      - text: "$15$"
        correct: true
      - text: "$25$"
        correct: false
        rationale: |
          You made the corresponding angles add to 180 degrees. Corresponding angles on parallel lines are equal, not supplementary.
      - text: "$20$"
        correct: false
        rationale: |
          You may have moved the 10 incorrectly. After $4x + 10 = 70$, you need $4x = 60$.
      - text: "$10$"
        correct: false
        rationale: |
          You stopped too early in solving the equation. After subtracting 10, you still have to divide by 4.
    explanation: |
      Corresponding angles formed by parallel lines are equal.

      1. Set the expressions equal: $4x + 10 = 70$.
      2. Subtract $10$ from both sides: $4x = 60$.
      3. Divide by $4$: $x = 15$.

      Common Trap: Setting the sum equal to $180^\circ$ ($4x + 10 + 70 = 180 \implies 4x = 100 \implies x = 25$) by confusing corresponding angles with same-side interior angles.

  - id: q-geometry-parallel-perpendicular-lines-0004
    type: direct-computation
    difficulty: easy
    stem: |
      Line $L_1$ is parallel to line $L_2$. Transversal $T_1$ is perpendicular to line $L_1$. What is the measure of the angle formed at the intersection of transversal $T_1$ and line $L_2$?
    choices:
      - text: '$90^\circ$'
        correct: true
      - text: '$45^\circ$'
        correct: false
        rationale: |
          You halved a right angle for no reason. A line perpendicular to one of two parallel lines stays perpendicular to the other.
      - text: '$180^\circ$'
        correct: false
        rationale: |
          You used a straight angle instead of the angle formed by perpendicular lines. Perpendicular lines meet at 90 degrees.
      - text: '$0^\circ$'
        correct: false
        rationale: |
          You treated the lines as if they overlapped. Parallel lines and a perpendicular transversal still form right angles.
    explanation: |
      Perpendicularity propagates across parallel lines.

      1. If a line is perpendicular to one of two parallel lines, it is also perpendicular to the other parallel line.
      2. Since $T_1 \perp L_1$ and $L_1 \parallel L_2$, $T_1 \perp L_2$.
      3. Perpendicular lines intersect at an angle of $90^\circ$.

  - id: q-geometry-parallel-perpendicular-lines-0005
    type: direct-computation
    difficulty: easy
    stem: |
      Two parallel lines are intersected by a transversal. Two alternate exterior angles measure $(5x - 20)^\circ$ and $(3x + 16)^\circ$. What is the value of $x$?
    choices:
      - text: "$18$"
        correct: true
      - text: "$23$"
        correct: false
        rationale: |
          You made alternate exterior angles supplementary. On parallel lines, alternate exterior angles are equal.
      - text: "$9$"
        correct: false
        rationale: |
          You stopped after reaching $2x = 18$ in effect. The equation gives $2x = 36$, so you still need the full division.
      - text: "$36$"
        correct: false
        rationale: |
          You found $2x$ instead of $x$. After isolating $2x = 36$, divide by 2.
    explanation: |
      Alternate exterior angles formed by parallel lines are equal.

      1. Set up equation: $5x - 20 = 3x + 16$.
      2. Subtract $3x$ from both sides: $2x - 20 = 16$.
      3. Add $20$: $2x = 36$.
      4. Divide by $2$: $x = 18$.

      Common Trap: Setting the sum equal to $180^\circ$ ($8x - 4 = 180 \implies 8x = 184 \implies x = 23$) by confusing alternate exterior angles with same-side exterior angles.

  - id: q-geometry-parallel-perpendicular-lines-0006
    type: direct-computation
    difficulty: medium
    stem: |
      Parallel lines $L_1$ and $L_2$ are cut by transversal $T$. The measures of two same-side interior angles are $(7x - 15)^\circ$ and $(4x + 8)^\circ$. What is the measure of the larger angle?
    choices:
      - text: '$104^\circ$'
        correct: true
      - text: '$76^\circ$'
        correct: false
        rationale: |
          You found the smaller same-side interior angle. The question asks for the larger one after you compute both.
      - text: '$17^\circ$'
        correct: false
        rationale: |
          You reported the value of $x$ instead of the angle measure. You still have to substitute $x$ into the angle expression.
      - text: '$98^\circ$'
        correct: false
        rationale: |
          You made an arithmetic slip after finding $x = 17$. The larger angle is $7(17) - 15$.
    explanation: |
      Same-side interior angles are supplementary ($180^\circ$).

      1. Set up equation: $(7x - 15) + (4x + 8) = 180$.
      2. Combine like terms: $11x - 7 = 180 \implies 11x = 187 \implies x = 17$.
      3. Calculate first angle: $7(17) - 15 = 119 - 15 = 104^\circ$.
      4. Calculate second angle: $4(17) + 8 = 68 + 8 = 76^\circ$.
      5. The larger angle is $104^\circ$.

      Common Trap: Reporting the smaller angle ($76^\circ$) or stopping after finding $x = 17$.

  - id: q-geometry-parallel-perpendicular-lines-0007
    type: direct-computation
    difficulty: medium
    stem: |
      Two horizontal parallel lines $L_1$ and $L_2$ are joined by a bent line path forming an interior point $P$ between them. The ray from $L_1$ to $P$ makes an angle of $35^\circ$ with $L_1$, and the ray from $L_2$ to $P$ makes an angle of $45^\circ$ with $L_2$. What is the measure of the interior angle at point $P$ opening toward the left?
    choices:
      - text: '$80^\circ$'
        correct: true
      - text: '$10^\circ$'
        correct: false
        rationale: |
          You subtracted the two given angles instead of combining the two parts at point $P$. Both alternate interior pieces add together.
      - text: '$100^\circ$'
        correct: false
        rationale: |
          You found the supplement of the interior angle, not the interior angle opening to the left.
      - text: '$160^\circ$'
        correct: false
        rationale: |
          You doubled what should have been added once. The angle at $P$ is 35 degrees plus 45 degrees.
    explanation: |
      1. Draw an auxiliary line through point $P$ that is parallel to both $L_1$ and $L_2$.
      2. This auxiliary line divides the angle at $P$ into two smaller angles.
      3. The top part is an alternate interior angle to $35^\circ$, so it equals $35^\circ$.
      4. The bottom part is an alternate interior angle to $45^\circ$, so it equals $45^\circ$.
      5. Total interior angle at $P = 35^\circ + 45^\circ = 80^\circ$.

      Common Trap: Subtracting the two angles ($45^\circ - 35^\circ = 10^\circ$) or taking the supplement ($180^\circ - 80^\circ = 100^\circ$).

  - id: q-geometry-parallel-perpendicular-lines-0008
    type: direct-computation
    difficulty: medium
    stem: |
      Two lines $L_1$ and $L_2$ are cut by transversal $T$. Two corresponding angles are given by $(3x + 25)^\circ$ and $(5x - 15)^\circ$. For what value of $x$ will lines $L_1$ and $L_2$ be parallel?
    choices:
      - text: "$20$"
        correct: true
      - text: "$21.25$"
        correct: false
        rationale: |
          You treated corresponding angles as if they must add to 180 degrees. For the lines to be parallel, they must be equal.
      - text: "$10$"
        correct: false
        rationale: |
          You moved the constants or coefficients incorrectly. After $3x + 25 = 5x - 15$, you should get $2x = 40$.
      - text: "$40$"
        correct: false
        rationale: |
          You found $2x$ instead of $x$. Once the equation becomes $2x = 40$, divide by 2.
    explanation: |
      By the Corresponding Angles Postulate Converse, lines are parallel if and only if corresponding angles are equal.

      1. Set angles equal: $3x + 25 = 5x - 15$.
      2. Subtract $3x$ from both sides: $25 = 2x - 15$.
      3. Add $15$: $2x = 40$.
      4. Divide by $2$: $x = 20$.

      Common Trap: Setting the sum equal to $180^\circ$ ($8x + 10 = 180 \implies 8x = 170 \implies x = 21.25$).

  - id: q-geometry-parallel-perpendicular-lines-0009
    type: direct-computation
    difficulty: medium
    stem: |
      Parallel lines $AB$ and $CD$ are cut by transversal $EF$, intersecting $AB$ at $E$ and $CD$ at $F$. Ray $EG$ bisects $\angle BEF$. If $\angle CFE = 110^\circ$, what is the measure of $\angle GEF$?
    choices:
      - text: '$55^\circ$'
        correct: true
      - text: '$110^\circ$'
        correct: false
        rationale: |
          You found the full angle $\angle BEF$ and forgot that ray $EG$ bisects it into two equal parts.
      - text: '$35^\circ$'
        correct: false
        rationale: |
          You took the supplement first and then bisected the wrong angle. The alternate interior angle is already 110 degrees.
      - text: '$70^\circ$'
        correct: false
        rationale: |
          You changed the angle before bisecting. Once you match $\angle BEF$ to 110 degrees, the bisector gives 55 degrees.
    explanation: |
      1. $\angle CFE$ and $\angle BEF$ are alternate interior angles along parallel lines $AB \parallel CD$, so $\angle BEF = \angle CFE = 110^\circ$.
      2. Ray $EG$ bisects $\angle BEF$, dividing it into two equal angles.
      3. $\angle GEF = \frac{\angle BEF}{2} = \frac{110^\circ}{2} = 55^\circ$.

      Common Trap: Forgetting to divide by $2$ ($110^\circ$), or taking the supplement first ($180 - 110 = 70^\circ$) to get $35^\circ$.

  - id: q-geometry-parallel-perpendicular-lines-0010
    type: direct-computation
    difficulty: medium
    stem: |
      Parallel lines $m$ and $n$ are cut by a transversal. Two same-side exterior angles measure $(9x - 14)^\circ$ and $(3x + 2)^\circ$. What is the measure of the smaller angle?
    choices:
      - text: '$50^\circ$'
        correct: true
      - text: '$130^\circ$'
        correct: false
        rationale: |
          You found the larger same-side exterior angle. The question asks for the smaller one.
      - text: '$16^\circ$'
        correct: false
        rationale: |
          You reported the value of $x$ instead of the angle measure. You still need to substitute into the angle expressions.
      - text: '$40^\circ$'
        correct: false
        rationale: |
          You made an arithmetic error after solving for $x = 16$. The smaller angle is $3(16) + 2$.
    explanation: |
      Same-side exterior angles formed by parallel lines are supplementary.

      1. Set up equation: $(9x - 14) + (3x + 2) = 180$.
      2. Combine like terms: $12x - 12 = 180 \implies 12x = 192 \implies x = 16$.
      3. First angle: $9(16) - 14 = 144 - 14 = 130^\circ$.
      4. Second angle: $3(16) + 2 = 48 + 2 = 50^\circ$.
      5. The smaller angle is $50^\circ$.

      Common Trap: Reporting the larger angle ($130^\circ$) or stopping at $x = 16$.

  - id: q-geometry-parallel-perpendicular-lines-0011
    type: direct-computation
    difficulty: hard
    stem: |
      Two parallel lines $L_1 \parallel L_2$ are intersected by another set of parallel lines $M_1 \parallel M_2$, forming a parallelogram grid. One interior angle of the parallelogram is $(5x + 10)^\circ$ and its consecutive interior angle is $(3x + 10)^\circ$. What is the measure of the acute interior angle of the parallelogram?
    choices:
      - text: '$70^\circ$'
        correct: true
      - text: '$110^\circ$'
        correct: false
        rationale: |
          You found the obtuse interior angle, but the question asks for the acute one.
      - text: '$20^\circ$'
        correct: false
        rationale: |
          You reported the value of $x$ instead of the acute angle. You still have to evaluate the angle expressions.
      - text: '$80^\circ$'
        correct: false
        rationale: |
          You solved the supplementary pair incorrectly. The two consecutive angles must add to 180 degrees.
    explanation: |
      Consecutive interior angles along parallel lines are same-side interior angles, so they are supplementary ($180^\circ$).

      1. Set up equation: $(5x + 10) + (3x + 10) = 180$.
      2. Combine like terms: $8x + 20 = 180 \implies 8x = 160 \implies x = 20$.
      3. First angle: $5(20) + 10 = 110^\circ$ (obtuse).
      4. Second angle: $3(20) + 10 = 70^\circ$ (acute).
      5. The acute interior angle is $70^\circ$.

      Common Trap: Reporting the obtuse angle ($110^\circ$) instead of the acute angle.

  - id: q-geometry-parallel-perpendicular-lines-0012
    type: direct-computation
    difficulty: hard
    stem: |
      Three parallel lines $L_1 \parallel L_2 \parallel L_3$ are crossed by two transversals $T_1$ and $T_2$. Transversal $T_1$ makes an angle of $40^\circ$ with line $L_1$. Transversal $T_2$ intersects $T_1$ at a point between $L_1$ and $L_2$, making an angle of $75^\circ$ with $L_1$ on the same side. What is the measure of the obtuse angle formed at the intersection of $T_1$ and $T_2$?
    choices:
      - text: '$145^\circ$'
        correct: true
      - text: '$35^\circ$'
        correct: false
        rationale: |
          You found the acute angle between the transversals. The question asks for the obtuse angle at the same intersection.
      - text: '$115^\circ$'
        correct: false
        rationale: |
          You changed only one part of the angle relationship. First find the 35-degree acute angle, then take its supplement.
      - text: '$65^\circ$'
        correct: false
        rationale: |
          You used one given angle instead of the angle between the two transversals. Their intersection depends on both 40 degrees and 75 degrees.
    explanation: |
      1. Calculate the acute angle formed between $T_1$ and $T_2$ at their intersection:
         $$\text{Acute Angle} = 75^\circ - 40^\circ = 35^\circ$$
      2. Adjacent angles at an intersection form a linear pair, so they are supplementary.
      3. $\text{Obtuse Angle} = 180^\circ - 35^\circ = 145^\circ$.

      Common Trap: Reporting the acute angle ($35^\circ$) when asked for the obtuse angle.

  - id: q-geometry-parallel-perpendicular-lines-0013
    type: direct-computation
    difficulty: hard
    stem: |
      Line $L_1$ is parallel to line $L_2$. Line segment $AB$ is perpendicular to $L_1$ at point $A$ and intersects $L_2$ at point $B$. Ray $AC$ is drawn between $L_1$ and $L_2$ such that $\angle BAC = 32^\circ$. What is the measure of the acute angle that ray $AC$ makes with line $L_2$?
    choices:
      - text: '$58^\circ$'
        correct: true
      - text: '$32^\circ$'
        correct: false
        rationale: |
          You used $\angle BAC$ directly, but that angle is with the perpendicular segment, not with the parallel line.
      - text: '$122^\circ$'
        correct: false
        rationale: |
          You took the obtuse supplement instead of the acute angle the ray makes with $L_2$.
      - text: '$148^\circ$'
        correct: false
        rationale: |
          You added the wrong supplement. First find the complement of 32 degrees with the perpendicular line.
    explanation: |
      1. Since $AB \perp L_1$ and $L_1 \parallel L_2$, $AB$ is also perpendicular to $L_2$, so the angle between $AB$ and $L_2$ at $B$ is $90^\circ$.
      2. The angle ray $AC$ makes with line $L_1$ at point $A$ is $90^\circ - \angle BAC = 90^\circ - 32^\circ = 58^\circ$.
      3. By alternate interior angles between parallel lines $L_1$ and $L_2$, the acute angle ray $AC$ makes with $L_2$ is equal to $58^\circ$.

      Common Trap: Confusing $\angle BAC$ ($32^\circ$) directly with the alternate interior angle.

  - id: q-geometry-parallel-perpendicular-lines-0014
    type: direct-computation
    difficulty: hard
    stem: |
      Parallel lines $L_1 \parallel L_2 \parallel L_3$ are crossed by transversal $T$. At the intersections with $L_1$ and $L_3$, a pair of corresponding acute angles measure $(3x + 15)^\circ$ and $(5x - 25)^\circ$. At point $B$, where $T$ intersects $L_2$, ray $BD$ bisects the adjacent obtuse angle formed by $T$ and $L_2$. What is the measure of the angle between ray $BD$ and line $L_2$?
    choices:
      - text: '$52.5^\circ$'
        correct: true
      - text: '$37.5^\circ$'
        correct: false
        rationale: |
          You bisected the 75-degree acute angle itself. The ray bisects its adjacent obtuse supplement, not the acute angle.
      - text: '$105^\circ$'
        correct: false
        rationale: |
          You found the adjacent obtuse angle but forgot to bisect it. Ray $BD$ splits that angle into two equal parts.
      - text: '$75^\circ$'
        correct: false
        rationale: |
          You stopped before using the supplement and the bisector. The asked angle comes after both steps.
    explanation: |
      1. Corresponding angles are equal: $3x + 15 = 5x - 25 \implies 2x = 40 \implies x = 20$.
      2. The acute angle made by $T$ with each parallel line is $3(20) + 15 = 75^\circ$.
      3. The adjacent obtuse angle at $B$ is $180^\circ - 75^\circ = 105^\circ$.
      4. Ray $BD$ bisects this angle, so the angle between $BD$ and $L_2$ is $\frac{105^\circ}{2} = 52.5^\circ$.

      Common Trap: Bisecting the $75^\circ$ acute angle instead of its supplement gives $37.5^\circ$.

  - id: q-geometry-parallel-perpendicular-lines-0015
    type: direct-computation
    difficulty: hard
    stem: |
      Two parallel lines $L_1$ and $L_2$ are intersected by two transversals $T_1$ and $T_2$ that meet at point $P$ between the parallel lines. Transversal $T_1$ makes an interior angle of $50^\circ$ with $L_1$, and transversal $T_2$ makes an interior angle of $65^\circ$ with $L_2$. What is the measure of the interior angle $\angle T_1 P T_2$ facing the left side?
    choices:
      - text: '$115^\circ$'
        correct: true
      - text: '$65^\circ$'
        correct: false
        rationale: |
          You used only one of the two alternate interior pieces. The left-facing angle at $P$ is made from both parts together.
      - text: '$15^\circ$'
        correct: false
        rationale: |
          You subtracted the angles instead of adding the two pieces that meet at point $P$.
      - text: '$130^\circ$'
        correct: false
        rationale: |
          You made the angle too large by adding the wrong relationship. The two parts at $P$ are 50 degrees and 65 degrees.
    explanation: |
      1. Draw an auxiliary line through point $P$ parallel to both $L_1$ and $L_2$.
      2. By alternate interior angles, the upper part of $\angle T_1 P T_2$ equals $50^\circ$.
      3. By alternate interior angles, the lower part of $\angle T_1 P T_2$ equals $65^\circ$.
      4. Total angle $\angle T_1 P T_2 = 50^\circ + 65^\circ = 115^\circ$.

      Common Trap: Subtracting the two given angles ($65^\circ - 50^\circ = 15^\circ$) or reporting only one of the alternate angles.