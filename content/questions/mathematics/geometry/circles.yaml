meta:
  subject: mathematics
  topic: geometry
  subtopic: circles
  exams: [upcat, acet, dlsucet, ustet, pupcet]
questions:
  - id: q-geometry-circles-0001
    type: direct-computation
    difficulty: easy
    stem: |
      A central angle in a circle intercepts an arc measuring $84^\circ$. What is the measure of an inscribed angle that intercepts the exact same arc?
    choices:
      - text: '$42^\circ$'
        correct: true
      - text: '$84^\circ$'
        correct: false
        rationale: |
          This uses the central-angle rule for an inscribed angle. Both angles intercept the same arc. Check where the angle vertex lies.
      - text: '$168^\circ$'
        correct: false
        rationale: |
          This doubles the arc instead of halving it. The central-inscribed relationship involves a factor two. Check which measure is twice the other.
      - text: '$96^\circ$'
        correct: false
        rationale: |
          This finds a supplement of the arc measure. The arc measure is an angle value. Check the inscribed-angle rule.
    explanation: |
      An inscribed angle equals half of its intercepted arc. Divide $84^\circ$ by $2$ to get $42^\circ$.

  - id: q-geometry-circles-0002
    type: direct-computation
    difficulty: easy
    stem: |
      The diameter of a circle is $14\text{ cm}$. What is the area of the circle?
    choices:
      - text: '$49\pi\text{ cm}^2$'
        correct: true
      - text: '$196\pi\text{ cm}^2$'
        correct: false
        rationale: |
          This uses the diameter as the radius. The given length is fourteen. Halve the diameter before squaring.
      - text: '$14\pi\text{ cm}^2$'
        correct: false
        rationale: |
          This reports the circumference using the true radius but labels it as area. Both formulas contain pi and the radius. Check that area uses a squared radius.
      - text: '$28\pi\text{ cm}^2$'
        correct: false
        rationale: |
          This computes circumference with the diameter used as a radius and labels it as area. Both formula and diameter come from the problem. Check both the radius and the requested quantity.
    explanation: |
      The radius is half the diameter: $r=14\div2=7$ cm. Circle area is $\pi r^2$, so the area is $\pi(7^2)=49\pi$ square centimeters.

  - id: q-geometry-circles-0003
    type: direct-computation
    difficulty: easy
    stem: |
      $\triangle ABC$ is inscribed in a circle such that side $AB$ is the diameter of the circle. If $\angle BAC = 35^\circ$, what is the measure of $\angle ABC$?
    choices:
      - text: '$55^\circ$'
        correct: true
      - text: '$35^\circ$'
        correct: false
        rationale: |
          This assumes the two acute angles are equal. The triangle is inside a circle whose radii are equal. Check whether the triangle legs are given as equal.
      - text: '$90^\circ$'
        correct: false
        rationale: |
          This reports the angle at C. The diameter does create a right angle. Check the requested vertex.
      - text: '$145^\circ$'
        correct: false
        rationale: |
          This subtracts only the given angle from one hundred eighty degrees. Triangle angles do sum to one hundred eighty degrees. Check that the diameter gives a ninety-degree angle.
    explanation: |
      The angle opposite the diameter is $90^\circ$. The triangle angles sum to $180^\circ$. Thus $\angle ABC=180^\circ-90^\circ-35^\circ=55^\circ$.

  - id: q-geometry-circles-0004
    type: direct-computation
    difficulty: easy
    stem: |
      A circle has an area of $36\pi\text{ cm}^2$. What is its circumference?
    choices:
      - text: '$12\pi\text{ cm}$'
        correct: true
      - text: '$36\pi\text{ cm}$'
        correct: false
        rationale: |
          This reports the area coefficient as the circumference coefficient. Thirty-six is visible in the area. Recover the radius before using the circumference formula.
      - text: '$6\pi\text{ cm}$'
        correct: false
        rationale: |
          This omits the factor two in circumference. The radius was found correctly. Check the full circumference formula.
      - text: '$24\pi\text{ cm}$'
        correct: false
        rationale: |
          This uses the diameter as the radius in circumference. The diameter is another natural circle size. Check that the formula uses radius.
    explanation: |
      From area $\pi r^2=36\pi$, get $r^2=36$ and the positive radius $r=6$ cm. Circumference is $2\pi r=2\pi(6)=12\pi$ cm.

  - id: q-geometry-circles-0005
    type: direct-computation
    difficulty: easy
    stem: |
      A tangent line segment $PT$ touches a circle at point $T$. The circle has center $O$ and radius $OT = 5\text{ cm}$. Segment $OP = 13\text{ cm}$ connects the center to external point $P$. What is the length of tangent segment $PT$?
    choices:
      - text: '$12\text{ cm}$'
        correct: true
      - text: '$18\text{ cm}$'
        correct: false
        rationale: |
          This adds the two given lengths. The same two lengths are used. Check the right-triangle relationship.
      - text: '$8\text{ cm}$'
        correct: false
        rationale: |
          This subtracts the given lengths. The tangent looks like the remaining distance. Check the relationship between squared side lengths.
      - text: '$\sqrt{194}\text{ cm}$'
        correct: false
        rationale: |
          This treats the tangent as the hypotenuse and adds the squares. The theorem uses squared lengths. Check which side is opposite the right angle.
    explanation: |
      The tangent and touching radius are perpendicular. Their right triangle has hypotenuse $13$ and radius leg $5$. Thus $PT^2=13^2-5^2=169-25=144$. Take the positive root to get $PT=12$ cm.

  - id: q-geometry-circles-0006
    type: direct-computation
    difficulty: medium
    stem: |
      A circle has a radius of $12\text{ cm}$. What is the length of an arc intercepted by a central angle of $60^\circ$?
    choices:
      - text: '$4\pi\text{ cm}$'
        correct: true
      - text: '$24\pi\text{ cm}$'
        correct: false
        rationale: |
          This reports the full circumference. The circumference is a needed intermediate value. Check what fraction of the circle is intercepted.
      - text: '$8\pi\text{ cm}$'
        correct: false
        rationale: |
          This divides the angle by one hundred eighty instead of three hundred sixty. One hundred eighty degrees is another familiar total. Check the full-circle degree total.
      - text: '$2\pi\text{ cm}$'
        correct: false
        rationale: |
          This omits the factor two in the circumference before taking the arc fraction. The arc fraction is still correct. Check the full circumference formula.
    explanation: |
      The arc is $\dfrac{60}{360}=\dfrac{1}{6}$ of the circumference. The circumference is $2\pi(12)=24\pi$ cm. Its sixth is $4\pi$ cm.

  - id: q-geometry-circles-0007
    type: direct-computation
    difficulty: medium
    stem: |
      A central angle of $90^\circ$ bounds a sector in a circle of radius $8\text{ cm}$. What is the area of the sector?
    choices:
      - text: '$16\pi\text{ cm}^2$'
        correct: true
      - text: '$4\pi\text{ cm}^2$'
        correct: false
        rationale: |
          This uses the arc-length calculation but labels it as area. Both arc and sector use the same angle fraction. Check whether the requested unit is length or area.
      - text: '$64\pi\text{ cm}^2$'
        correct: false
        rationale: |
          This reports the full circle area. The full circle area is needed first. Check the angle fraction.
      - text: '$32\pi\text{ cm}^2$'
        correct: false
        rationale: |
          This uses one half instead of one quarter for the sector. Ninety degrees is half of a straight angle. Check the full-circle degree total.
    explanation: |
      The sector is $\dfrac{90}{360}=\dfrac{1}{4}$ of the circle. The full area is $\pi(8^2)=64\pi$ square centimeters. A quarter is $16\pi$ square centimeters.

  - id: q-geometry-circles-0008
    type: direct-computation
    difficulty: medium
    stem: |
      Quadrilateral $ABCD$ is inscribed in a circle. Angle $\angle A = (4x + 20)^\circ$ and opposite angle $\angle C = (2x + 40)^\circ$. What is the measure of $\angle C$?
    choices:
      - text: '$80^\circ$'
        correct: true
      - text: '$100^\circ$'
        correct: false
        rationale: |
          This reports angle A instead of C. A is found from the same variable. Check the requested vertex.
      - text: '$20^\circ$'
        correct: false
        rationale: |
          This reports the solved variable instead of angle C. The variable is found first. Substitute into the requested angle expression.
      - text: '$10^\circ$'
        correct: false
        rationale: |
          This makes opposite angles equal and reports the resulting variable. Equal-angle rules apply to other circle configurations. Check the cyclic-quadrilateral relation and the requested measure.
    explanation: |
      Opposite angles of an inscribed quadrilateral sum to $180^\circ$. Thus $(4x+20)+(2x+40)=180$, giving $6x=120$ and $x=20$. Substitute: $\angle C=2(20)+40=80^\circ$.

  - id: q-geometry-circles-0009
    type: direct-computation
    difficulty: medium
    stem: |
      Chords $AB$ and $CD$ intersect inside a circle at point $E$. Intercepted arc $AC = 70^\circ$ and intercepted arc $BD = 50^\circ$. What is the measure of angle $\angle AEC$?
    choices:
      - text: '$60^\circ$'
        correct: true
      - text: '$10^\circ$'
        correct: false
        rationale: |
          This takes half the arc difference instead of half their sum. Outside-circle angles do use a difference. Check whether the intersection is inside or outside.
      - text: '$120^\circ$'
        correct: false
        rationale: |
          This adds the arcs without halving. The two arcs are relevant. Check the factor one half.
      - text: '$35^\circ$'
        correct: false
        rationale: |
          This uses only the seventy-degree arc. An inscribed angle uses half of one arc. Check both intercepted arcs.
    explanation: |
      For chords crossing inside a circle, the angle equals half the sum of its intercepted arcs. Add $70^\circ+50^\circ=120^\circ$. Divide by $2$ to get $60^\circ$.

  - id: q-geometry-circles-0010
    type: direct-computation
    difficulty: medium
    stem: |
      Two secant lines intersect outside a circle at point $P$. The intercepted arcs between the secants are $110^\circ$ and $40^\circ$. What is the measure of angle $\angle P$?
    choices:
      - text: '$35^\circ$'
        correct: true
      - text: '$75^\circ$'
        correct: false
        rationale: |
          This takes half the arc sum instead of half their difference. Inside-circle angles do use a sum. Check whether the intersection is inside or outside.
      - text: '$70^\circ$'
        correct: false
        rationale: |
          This takes the difference without halving. The correct arc difference is found. Check the factor one half.
      - text: '$150^\circ$'
        correct: false
        rationale: |
          This adds the arc measures directly. Both arcs are relevant. Check the difference rule for external secants.
    explanation: |
      For two secants meeting outside a circle, the angle equals half the difference of the far and near arcs. Subtract $110^\circ-40^\circ=70^\circ$. Divide by $2$ to get $35^\circ$.

  - id: q-geometry-circles-0011
    type: direct-computation
    difficulty: hard
    stem: |
      Two concentric circles have radii of $5\text{ cm}$ and $13\text{ cm}$. A chord of the larger circle is tangent to the smaller circle. What is the total length of this chord?
    choices:
      - text: '$24\text{ cm}$'
        correct: true
      - text: '$12\text{ cm}$'
        correct: false
        rationale: |
          This reports half the chord. The half-chord is needed first. Check whether a half or the whole is requested.
      - text: '$18\text{ cm}$'
        correct: false
        rationale: |
          This adds the two radii as if they formed the chord. Both circle sizes are given. Use the right triangle formed by the center and the chord.
      - text: '$8\text{ cm}$'
        correct: false
        rationale: |
          This subtracts the two radii as if they formed the chord. Both circle sizes are given. Use the squared-length relationship in the right triangle.
    explanation: |
      The common center is $5$ cm from the tangent chord. Its perpendicular segment bisects that chord. A half-chord forms a right triangle with legs $5$ and $h$ and hypotenuse $13$. Thus $h^2=13^2-5^2=144$, so $h=12$ cm. The full chord is $2(12)=24$ cm.

  - id: q-geometry-circles-0012
    type: direct-computation
    difficulty: hard
    stem: |
      From an external point $P$, a tangent segment $PT$ touches a circle at $T$, and a secant line intersects the circle at points $A$ and $B$ (with $A$ between $P$ and $B$). If $PA = 4\text{ cm}$ and $AB = 5\text{ cm}$, what is the length of tangent segment $PT$?
    choices:
      - text: '$6\text{ cm}$'
        correct: true
      - text: '$2\sqrt{5}\text{ cm}$'
        correct: false
        rationale: |
          This uses only the inside secant part in the product. Both stated pieces are part of the secant. Check that the theorem uses the whole secant.
      - text: '$4.5\text{ cm}$'
        correct: false
        rationale: |
          This averages the two secant pieces. Both lengths are given directly. Check that the relationship is a squared-length product.
      - text: '$9\text{ cm}$'
        correct: false
        rationale: |
          This reports the whole secant as the tangent length. The full secant is a needed intermediate value. Check that the tangent has its own squared-length relation.
    explanation: |
      The whole secant from P to B is $4+5=9$ cm. The tangent-secant theorem gives $PT^2=PA(PB)=4(9)=36$. Taking the positive root gives $PT=6$ cm.

  - id: q-geometry-circles-0013
    type: direct-computation
    difficulty: hard
    stem: |
      A circle has a radius of $6\text{ cm}$. A square is inscribed inside the circle. What is the area of the region inside the circle but outside the square (shaded area)?
    choices:
      - text: '$36\pi - 72\text{ cm}^2$'
        correct: true
      - text: '$36\pi - 36\text{ cm}^2$'
        correct: false
        rationale: |
          This uses the circle radius as the square side. Both shapes share the same center. Check that the square diagonal is the diameter.
      - text: '$36\pi - 144\text{ cm}^2$'
        correct: false
        rationale: |
          This uses the square diagonal as its side. The diagonal spans the circle. Check which length is a side and which is a diagonal.
      - text: '$72 - 36\pi\text{ cm}^2$'
        correct: false
        rationale: |
          This reverses circle area minus square area. Both areas are needed. Check which region is being removed.
    explanation: |
      The circle area is $\pi(6^2)=36\pi$ square centimeters. The square diagonal equals the circle diameter, $12$ cm. If its side is $s$, then $s^2+s^2=12^2$, so its area $s^2$ is $72$ square centimeters. Subtract square area from circle area to get $36\pi-72$ square centimeters.

  - id: q-geometry-circles-0014
    type: direct-computation
    difficulty: hard
    stem: |
      In a circle with center $O$, chord $AB$ subtends central angle $\angle AOB = (5x - 10)^\circ$ and inscribed angle $\angle ACB = (2x + 10)^\circ$ standing on the same arc $AB$. What is the measure of central angle $\angle AOB$?
    choices:
      - text: '$140^\circ$'
        correct: true
      - text: '$70^\circ$'
        correct: false
        rationale: |
          This reports the inscribed angle. That angle is found from the same x. Check which vertex is requested.
      - text: '$30^\circ$'
        correct: false
        rationale: |
          This reports the variable instead of the angle. The variable is found first. Substitute into the requested angle expression.
      - text: '$160^\circ$'
        correct: false
        rationale: |
          This adds ten instead of subtracting ten after finding x. The constant ten is visible in the formula. Check the sign in the original expression.
    explanation: |
      The central angle is twice the inscribed angle over the same arc. Thus $5x-10=2(2x+10)$. Expand: $5x-10=4x+20$, so $x=30$. The central angle is $5(30)-10=140^\circ$.

  - id: q-geometry-circles-0015
    type: direct-computation
    difficulty: hard
    stem: |
      Two tangent segments $PA$ and $PB$ are drawn from external point $P$ to a circle with center $O$ and radius $r = 9\text{ cm}$. If $\angle APB = 60^\circ$, what is the distance from point $P$ to center $O$ ($OP$)?
    choices:
      - text: '$18\text{ cm}$'
        correct: true
      - text: '$9\sqrt{3}\text{ cm}$'
        correct: false
        rationale: |
          This reports the tangent length instead of OP. Both lengths belong to the same right triangle. Check which segment is requested.
      - text: '$9\text{ cm}$'
        correct: false
        rationale: |
          This reports the radius instead of the external-center distance. The radius is given directly. Check that P lies outside the circle.
      - text: '$36\text{ cm}$'
        correct: false
        rationale: |
          This doubles the hypotenuse a second time. The thirty-degree rule requires a doubling. Check that the radius is doubled only once.
    explanation: |
      The two tangent-radius triangles have equal radii and the same hypotenuse OP, so their angles at P are equal. Each is $60^\circ\div2=30^\circ$. In either right triangle, the radius $9$ is opposite $30^\circ$ and is half the hypotenuse. Thus $OP=2(9)=18$ cm.

  - id: q-geometry-circles-0016
    type: which-is-true
    difficulty: easy
    stem: |
      A chord of a circle has length $12$ cm. Which statement about its radius must be true?
    choices:
      - text: '$r\ge6$ cm.'
        correct: true
      - text: '$r=6$ cm in every case.'
        rationale: |
          This assumes the chord is a diameter. A diameter is one kind of chord. Check whether the chord passes through the center.
      - text: '$r=12$ cm in every case.'
        rationale: |
          This treats the chord as a radius. Both are segments inside a circle. Check whether one endpoint is the center.
      - text: '$r<6$ cm in every case.'
        rationale: |
          This reverses the longest-chord inequality. Half of twelve is six. Check that the diameter cannot be shorter than the chord.
    explanation: |
      The diameter is the longest chord, so it is at least $12$ cm. Radius is half the diameter, so $r\ge6$ cm.
    approved: false

  - id: q-geometry-circles-0017
    type: error-spotting
    difficulty: medium
    stem: |
      A student uses the diameter $10$ cm in $A=\pi r^2$ and reports $100\pi$ square centimeters. What is the correct area?
    choices:
      - text: '$25\pi$ square centimeters'
        correct: true
      - text: '$100\pi$ square centimeters'
        rationale: |
          This repeats the diameter-as-radius substitution. The diameter is the given length. Check that radius is half of it.
      - text: '$10\pi$ square centimeters'
        rationale: |
          This uses the circumference coefficient as the area coefficient. Both formulas contain pi. Check the squared-radius area formula.
      - text: '$50\pi$ square centimeters'
        rationale: |
          This halves the wrong area rather than halving the length first. Radius is half the diameter. Check that area changes with the square of radius.
    explanation: |
      The radius is $10\div2=5$ cm. Square the radius: $A=\pi(5^2)=25\pi$ square centimeters.
    approved: false

  - id: q-geometry-circles-0018
    type: word-problem
    difficulty: medium
    stem: |
      A circular garden is expanded so its radius is doubled. How many times its original area is the new area?
    choices:
      - text: '$4$'
        correct: true
      - text: '$2$'
        rationale: |
          This scales area directly with radius. Circumference does scale this way. Check the squared radius in area.
      - text: '$8$'
        rationale: |
          This uses the volume-style cube of the length scale. Some size measures use three dimensions. Check that area has two dimensions.
      - text: '$16$'
        rationale: |
          This doubles the radius twice before squaring. The radius changes once. Check the stated scale factor.
    explanation: |
      If the original radius is $r$, its area is $\pi r^2$. The new area is $\pi(2r)^2=4\pi r^2$. Thus the new area is four times the original.
    approved: false

  - id: q-geometry-circles-0019
    type: direct-computation
    difficulty: hard
    stem: |
      An arc of length $3\pi$ cm lies in a circle of radius $9$ cm. What is its central angle in degrees?
    choices:
      - text: '$60^\circ$'
        correct: true
      - text: '$120^\circ$'
        rationale: |
          This omits the factor two in circumference. That doubles the arc fraction. Check the full circumference formula.
      - text: '$30^\circ$'
        rationale: |
          This uses one hundred eighty degrees as the full circle. A semicircle does have that measure. Check the full-turn total.
      - text: '$6^\circ$'
        rationale: |
          This reports the number of equal arcs in the circumference as an angle. Six follows from the arc fraction. Check that the angle is a fraction of three hundred sixty degrees.
    explanation: |
      The full circumference is $2\pi(9)=18\pi$ cm. The arc fraction is $\dfrac{3\pi}{18\pi}=\dfrac{1}{6}$. Multiply the full turn by that fraction: $360^\circ\div6=60^\circ$.
    approved: false

  - id: q-geometry-circles-0020
    type: word-problem
    difficulty: exam
    stem: |
      A sector of a circle has radius $10$ cm and central angle $72^\circ$. Its boundary consists of two radii and the intercepted arc. What is the total boundary length?
    choices:
      - text: '$(20+4\pi)$ cm'
        correct: true
      - text: '$4\pi$ cm'
        rationale: |
          This reports only the curved arc. The arc is one part of the boundary. Check the two straight radii too.
      - text: '$(10+4\pi)$ cm'
        rationale: |
          This includes only one radius with the arc. A sector has two straight sides. Check every boundary piece.
      - text: '$(20+20\pi)$ cm'
        rationale: |
          This uses the whole circumference with the two radii. Full circumference is needed to find the arc. Check the sector fraction before adding the straight sides.
    explanation: |
      The arc fraction is $\dfrac{72}{360}=\dfrac{1}{5}$. Its arc length is $\dfrac{1}{5}[2\pi(10)]=4\pi$ cm. The two straight radii total $20$ cm. Add them to get $20+4\pi$ cm.
    approved: false
