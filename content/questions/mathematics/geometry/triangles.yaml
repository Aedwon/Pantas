meta:
  subject: 'mathematics'
  topic: 'geometry'
  subtopic: 'triangles'
  exams: ['upcat', 'acet', 'dlsucet', 'ustet', 'pupcet']
questions:
- id: 'q-geometry-triangles-0001'
  type: 'direct-computation'
  difficulty: 'easy'
  stem: |
    In $\triangle ABC$, the measure of $\angle A = 55^\circ$ and $\angle B = 65^\circ$. What is the measure of $\angle C$?
  choices:
  - text: '$60^\circ$'
    correct: true
  - text: '$120^\circ$'
    correct: false
    rationale: |
      This reports the sum of the two known angles. That sum is needed first. Check that all three angles together must total $180^\circ$.
  - text: '$115^\circ$'
    correct: false
    rationale: |
      This leaves out angle B when subtracting from $180^\circ$. Subtracting one known angle starts the calculation. Check that both given angles are included.
  - text: '$70^\circ$'
    correct: false
    rationale: |
      This uses $55^\circ$ twice. Both given angles are close in size. Check each stated angle before adding.
  explanation: |
    Triangle angles total $180^\circ$. The known angles total $55^\circ+65^\circ=120^\circ$. The remaining angle is $180^\circ-120^\circ=60^\circ$.
- id: 'q-geometry-triangles-0002'
  type: 'which-is-true'
  difficulty: 'easy'
  stem: |
    According to the Triangle Inequality Theorem, which set of three side lengths CANNOT form a valid triangle?
  choices:
  - text: '$6\text{ cm}, 8\text{ cm}, 14\text{ cm}$'
    correct: true
  - text: '$5\text{ cm}, 7\text{ cm}, 10\text{ cm}$'
    correct: false
    rationale: |
      This assumes the longest side cannot exceed either shorter side. That can make $10$ seem too large. Check the sum of the two shorter sides.
  - text: '$4\text{ cm}, 9\text{ cm}, 11\text{ cm}$'
    correct: false
    rationale: |
      This assumes unequal sides cannot make a triangle. The lengths look very different. Check their sums, not whether they match.
  - text: '$7\text{ cm}, 24\text{ cm}, 25\text{ cm}$'
    correct: false
    rationale: |
      This rejects a right-triangle triple. The largest side is much longer than the smallest. Check whether the two shorter sides together exceed it.
  explanation: |
    The two shorter sides must add to more than the longest side. Here $6+8=14$, exactly the longest side. These lengths would lie flat, so they cannot make a triangle.
- id: 'q-geometry-triangles-0003'
  type: 'direct-computation'
  difficulty: 'easy'
  stem: |
    An exterior angle of a triangle measures $125^\circ$. One of its remote interior angles measures $55^\circ$. What is the measure of the other remote interior angle?
  choices:
  - text: '$70^\circ$'
    correct: true
  - text: '$55^\circ$'
    correct: false
    rationale: |
      This reports the neighboring interior angle instead of the other remote angle. Subtracting the exterior angle from $180^\circ$ gives $55^\circ$. Check which angles the question calls remote.
  - text: '$180^\circ$'
    correct: false
    rationale: |
      This adds the given angles instead of subtracting. Both numbers appear in the exterior-angle rule. Check which angle is already the total.
  - text: '$125^\circ$'
    correct: false
    rationale: |
      This treats the whole exterior angle as one remote angle. The exterior angle is the stated total. Check that it must include two remote angles.
  explanation: |
    The exterior angle equals the two remote angles added together. Write $55^\circ+x=125^\circ$. Subtract $55^\circ$ to get $x=70^\circ$.
- id: 'q-geometry-triangles-0004'
  type: 'which-is-true'
  difficulty: 'easy'
  stem: |
    Which of the following shortcuts is NOT a valid criterion for proving that two triangles are congruent?
  choices:
  - text: 'SSA (Side-Side-Angle)'
    correct: true
  - text: 'SSS (Side-Side-Side)'
    correct: false
    rationale: |
      This rejects three matching side lengths. No angle is stated, so the information may seem incomplete. Check the SSS congruence rule.
  - text: 'SAS (Side-Angle-Side)'
    correct: false
    rationale: |
      This confuses an included angle with a non-included angle. Both tests name two sides and an angle. Check where the known angle lies.
  - text: 'AAS (Angle-Angle-Side)'
    correct: false
    rationale: |
      This assumes only the side between two angles can fix size. AAS uses a different side position. Check that two angles fix the third and the matching side fixes size.
  explanation: |
    SSA gives two sides and an angle that is not between them. Those facts can fit two different triangles. Therefore SSA alone does not guarantee the same shape and size.
- id: 'q-geometry-triangles-0005'
  type: 'direct-computation'
  difficulty: 'easy'
  stem: |
    A right triangle has legs of length $9\text{ cm}$ and $12\text{ cm}$. What is the length of its hypotenuse?
  choices:
  - text: '$15\text{ cm}$'
    correct: true
  - text: '$21\text{ cm}$'
    correct: false
    rationale: |
      This adds the leg lengths directly. Both lengths are needed. Check that the theorem adds their squares.
  - text: '$10.5\text{ cm}$'
    correct: false
    rationale: |
      This averages the legs. An average uses both measurements. Check that the hypotenuse must exceed each leg.
  - text: '$\sqrt{63}\text{ cm}$'
    correct: false
    rationale: |
      This subtracts the squared legs. Subtraction is useful when finding a missing leg. Check whether the unknown is a leg or the hypotenuse.
  explanation: |
    For the hypotenuse, add the squared legs: $c^2=9^2+12^2=81+144=225$. Take the positive square root: $c=15$ cm.
- id: 'q-geometry-triangles-0006'
  type: 'direct-computation'
  difficulty: 'medium'
  stem: |
    An isosceles right triangle ($45^\circ-45^\circ-90^\circ$) has a hypotenuse of length $10\sqrt{2}\text{ cm}$. What is the perimeter of the triangle?
  choices:
  - text: '$20 + 10\sqrt{2}\text{ cm}$'
    correct: true
  - text: '$30\sqrt{2}\text{ cm}$'
    correct: false
    rationale: |
      This treats all three sides as equal to the hypotenuse. The triangle has two equal sides. Check that only the legs are equal.
  - text: '$30\text{ cm}$'
    correct: false
    rationale: |
      This drops $\sqrt{2}$ from the hypotenuse. The two legs are each $10$ cm. Check that the given hypotenuse keeps its radical.
  - text: '$10 + 10\sqrt{2}\text{ cm}$'
    correct: false
    rationale: |
      This counts only one leg. One leg and the hypotenuse are part of the boundary. Check that perimeter includes all three sides.
  explanation: |
    Each leg is the hypotenuse divided by $\sqrt{2}$: $\dfrac{10\sqrt{2}}{\sqrt{2}}=10$ cm. Add the two legs and the hypotenuse: $10+10+10\sqrt{2}=20+10\sqrt{2}$ cm.
- id: 'q-geometry-triangles-0007'
  type: 'direct-computation'
  difficulty: 'medium'
  stem: |
    In $\triangle PQR$, $\angle P = 90^\circ$, $\angle Q = 60^\circ$, and $\angle R = 30^\circ$. If hypotenuse $QR = 16\text{ cm}$, what is the length of side $PR$ opposite the $60^\circ$ angle?
  choices:
  - text: '$8\sqrt{3}\text{ cm}$'
    correct: true
  - text: '$8\text{ cm}$'
    correct: false
    rationale: |
      This gives the short leg. Halving the hypotenuse is needed first. Check which angle is opposite the requested side.
  - text: '$16\sqrt{3}\text{ cm}$'
    correct: false
    rationale: |
      This multiplies the hypotenuse by $\sqrt{3}$. That factor belongs in the special-triangle rule. Check that it multiplies the short leg.
  - text: '$\dfrac{16}{\sqrt{3}}\text{ cm}$'
    correct: false
    rationale: |
      This treats the hypotenuse as the long leg and divides by $\sqrt{3}$. Division by that factor can find the short leg from the long one. Check the roles of the given and requested sides.
  explanation: |
    The short leg is half the hypotenuse: $16\div2=8$ cm. PR is opposite $60^\circ$, so it is the long leg. Multiply the short leg by $\sqrt{3}$ to get $8\sqrt{3}$ cm.
- id: 'q-geometry-triangles-0008'
  type: 'which-is-true'
  difficulty: 'medium'
  stem: |
    Given that $\triangle ABC \sim \triangle DEF$ with $AB = 6\text{ cm}$, $BC = 8\text{ cm}$, $AC = 10\text{ cm}$, and $DE = 9\text{ cm}$, which statement is true regarding the perimeter of $\triangle DEF$?
  choices:
  - text: 'The perimeter of $\triangle DEF$ is $36\text{ cm}$.'
    correct: true
  - text: 'The perimeter of $\triangle DEF$ is $27\text{ cm}$.'
    correct: false
    rationale: |
      This matches DE to BC instead of AB. Both are stated side lengths. Check the corresponding vertices in the triangle names.
  - text: 'The perimeter of $\triangle DEF$ is $54\text{ cm}$.'
    correct: false
    rationale: |
      This squares the scale factor for a perimeter. Squared factors apply to area. Check that perimeter is a length.
  - text: 'The perimeter of $\triangle DEF$ is $24\text{ cm}$.'
    correct: false
    rationale: |
      This keeps the first perimeter unchanged. Similar triangles share shape. Check that their sizes can differ.
  explanation: |
    The first perimeter is $6+8+10=24$ cm. Matching sides AB and DE give scale factor $\dfrac{9}{6}=1.5$. All side lengths grow by this factor, so the new perimeter is $24(1.5)=36$ cm.
- id: 'q-geometry-triangles-0009'
  type: 'direct-computation'
  difficulty: 'medium'
  stem: |
    The interior angles of a triangle are in the ratio $2 : 3 : 7$. What is the measure of the largest angle?
  choices:
  - text: '$105^\circ$'
    correct: true
  - text: '$45^\circ$'
    correct: false
    rationale: |
      This reports the middle angle. The three-part angle is calculated correctly. Check that the largest ratio part is seven.
  - text: '$30^\circ$'
    correct: false
    rationale: |
      This reports the smallest angle. The two-part angle is calculated correctly. Check which angle is requested.
  - text: '$70^\circ$'
    correct: false
    rationale: |
      This uses a $120^\circ$ total instead of $180^\circ$, giving ten degrees per part. $120^\circ$ is a familiar triangle angle. Check the total for all three angles.
  explanation: |
    The ratio has $2+3+7=12$ parts. Each part is $180^\circ\div12=15^\circ$. The largest angle has seven parts, so it measures $7(15^\circ)=105^\circ$.
- id: 'q-geometry-triangles-0010'
  type: 'direct-computation'
  difficulty: 'medium'
  stem: |
    In a right triangle, the hypotenuse has length $x + 2$, one leg has length $x$, and the other leg has length $x - 2$. What is the length of the hypotenuse?
  choices:
  - text: '$10$'
    correct: true
  - text: '$8$'
    correct: false
    rationale: |
      This stops at x. That value is the longer leg. Check the expression for the requested hypotenuse.
  - text: '$6$'
    correct: false
    rationale: |
      This gives the shorter leg. Substitution into a side expression is needed. Check which expression names the hypotenuse.
  - text: '$14$'
    correct: false
    rationale: |
      This adds the legs. Their sum uses both known side values. Check that the hypotenuse comes from the squared-length rule.
  explanation: |
    Use $x^2+(x-2)^2=(x+2)^2$. Expanding gives $2x^2-4x+4=x^2+4x+4$, so $x^2-8x=0$. Factor as $x(x-8)=0$. Positive side lengths require $x>2$, so $x=8$. The hypotenuse is $x+2=10$.
- id: 'q-geometry-triangles-0011'
  type: 'direct-computation'
  difficulty: 'hard'
  stem: |
    In $\triangle ABC$, side $BC$ is extended to point $D$ to form exterior angle $\angle ACD = (7x - 5)^\circ$. The remote interior angles are $\angle A = (3x + 10)^\circ$ and $\angle B = (2x + 15)^\circ$. What is the measure of interior angle $\angle ACB$?
  choices:
  - text: '$80^\circ$'
    correct: true
  - text: '$100^\circ$'
    correct: false
    rationale: |
      This gives the exterior angle. It is found correctly along the way. Check that the requested angle is inside the triangle.
  - text: '$55^\circ$'
    correct: false
    rationale: |
      This gives angle A. It is one of the remote angles used in the equation. Check the requested vertex.
  - text: '$45^\circ$'
    correct: false
    rationale: |
      This gives angle B. It is one of the remote angles used in the equation. Check the requested vertex.
  explanation: |
    The exterior-angle rule gives $7x-5=(3x+10)+(2x+15)$. Combine terms to get $2x=30$, so $x=15$. The exterior angle is $7(15)-5=100^\circ$. Its neighboring interior angle is $180^\circ-100^\circ=80^\circ$.
- id: 'q-geometry-triangles-0012'
  type: 'which-is-true'
  difficulty: 'hard'
  stem: |
    A triangle has two sides of length $7\text{ cm}$ and $11\text{ cm}$. Which inequality correctly expresses all possible values for the length of the third side $s$?
  choices:
  - text: '$4 < s < 18$'
    correct: true
  - text: '$4 \le s \le 18$'
    correct: false
    rationale: |
      This includes the endpoints. Equality can look allowed in an inequality. Check that equal sums make a flat figure.
  - text: '$7 < s < 11$'
    correct: false
    rationale: |
      This puts s between the given lengths. The two given sides look like natural bounds. Check the difference and sum instead.
  - text: '$0 < s < 18$'
    correct: false
    rationale: |
      This checks the upper bound but misses the lower bound. Every length must be positive. Check that a positive side can still be too short to close the triangle.
  explanation: |
    The third side must exceed the difference $11-7=4$ and be less than the sum $11+7=18$. Equality would make a straight line. Thus $4<s<18$.
- id: 'q-geometry-triangles-0013'
  type: 'direct-computation'
  difficulty: 'hard'
  stem: |
    In right $\triangle ABC$ with right angle at $C$, altitude $CD$ is drawn perpendicular to hypotenuse $AB$. If segment $AD = 4\text{ cm}$ and segment $DB = 9\text{ cm}$, what is the length of altitude $CD$?
  choices:
  - text: '$6\text{ cm}$'
    correct: true
  - text: '$6.5\text{ cm}$'
    correct: false
    rationale: |
      This takes the arithmetic mean of the two segments. An average seems to combine both lengths. Check the proportion from the similar triangles.
  - text: '$13\text{ cm}$'
    correct: false
    rationale: |
      This reports the full hypotenuse. Adding the two segments finds that length correctly. Check whether the question asks for AB or CD.
  - text: '$36\text{ cm}$'
    correct: false
    rationale: |
      This stops at the square of the altitude. The product of the segments is needed. Check whether a square root remains.
  explanation: |
    The two smaller right triangles are similar, with corresponding sides giving $\dfrac{4}{CD}=\dfrac{CD}{9}$. Cross multiply to get $CD^2=36$. The positive square root gives $CD=6$ cm.
- id: 'q-geometry-triangles-0014'
  type: 'direct-computation'
  difficulty: 'hard'
  stem: |
    Triangle 1 is a $30^\circ-60^\circ-90^\circ$ triangle where $6\text{ cm}$ is the shorter leg. Triangle 2 is a $45^\circ-45^\circ-90^\circ$ triangle where $6\text{ cm}$ is one of its legs. What is the ratio of the length of the hypotenuse of Triangle 1 to the hypotenuse of Triangle 2?
  choices:
  - text: '$\sqrt{2}$'
    correct: true
  - text: '$\dfrac{\sqrt{3}}{\sqrt{2}}$'
    correct: false
    rationale: |
      This uses the long leg of Triangle 1 as its hypotenuse. The $\sqrt{3}$ factor belongs to that triangle. Check the side opposite the right angle.
  - text: '$2$'
    correct: false
    rationale: |
      This compares a hypotenuse with a leg. Both triangles have a stated six-centimeter leg. Check that both compared lengths are hypotenuses.
  - text: '$\dfrac{2}{\sqrt{3}}$'
    correct: false
    rationale: |
      This compares two sides of Triangle 1. The denominator is a valid long-leg length. Check that the denominator must come from Triangle 2.
  explanation: |
    Triangle 1 has hypotenuse $2(6)=12$ cm. Triangle 2 has hypotenuse $6\sqrt{2}$ cm. The requested ratio is $\dfrac{12}{6\sqrt{2}}=\dfrac{2}{\sqrt{2}}=\sqrt{2}$.
- id: 'q-geometry-triangles-0015'
  type: 'direct-computation'
  difficulty: 'hard'
  stem: |
    $\triangle ABC \sim \triangle PQR$. The area of $\triangle ABC$ is $32\text{ cm}^2$ and the area of $\triangle PQR$ is $72\text{ cm}^2$. If side $AB = 8\text{ cm}$, what is the length of corresponding side $PQ$?
  choices:
  - text: '$12\text{ cm}$'
    correct: true
  - text: '$18\text{ cm}$'
    correct: false
    rationale: |
      This uses the area ratio as a length ratio. Both ratios compare the same two triangles. Check that lengths use the square root of the area ratio.
  - text: '$16\text{ cm}$'
    correct: false
    rationale: |
      This rounds the area ratio to two and applies it to a side. The larger area is a little more than double. Check the exact area ratio before taking its square root.
  - text: '$9.6\text{ cm}$'
    correct: false
    rationale: |
      This scales the side by $1.2$. That makes it longer, as the larger area suggests. Check whether squaring that scale factor gives the stated area ratio.
  explanation: |
    For similar triangles, the area ratio is the square of the side ratio. Thus $\left(\dfrac{PQ}{8}\right)^2=\dfrac{72}{32}=\dfrac{9}{4}$. Take positive square roots: $\dfrac{PQ}{8}=\dfrac{3}{2}$. Multiply by $8$ to get $PQ=12$ cm.
- id: 'q-geometry-triangles-0016'
  type: 'error-spotting'
  difficulty: 'medium'
  stem: |
    A student computes the hypotenuse of a right triangle with legs $5$ cm and $12$ cm. Step 1: $c^2=5^2+12^2$. Step 2: $c^2=169$. Step 3: $c=169$. Which is the first incorrect step?
  choices:
  - text: 'Step 3'
    correct: true
  - text: 'Step 1'
    rationale: |
      This rejects adding the squared legs. Adding ordinary lengths would be wrong. Check that the lengths are squared here.
  - text: 'Step 2'
    rationale: |
      This rejects the sum of the squares. The total is much larger than either leg. Check the arithmetic before judging its size.
  - text: 'No step is incorrect.'
    rationale: |
      This treats a squared length as a length. The computation reaches a familiar total. Check whether the final square root was taken.
  explanation: |
    Step 3 must take the positive square root of $169$. That gives $c=13$ cm.
  approved: false
- id: 'q-geometry-triangles-0017'
  type: 'word-problem'
  difficulty: 'hard'
  stem: |
    On level ground, a vertical $2$-meter pole casts a $3$-meter shadow. At the same time, a vertical flagpole casts a $12$-meter shadow. What is the flagpole height?
  choices:
  - text: '$8$ m'
    correct: true
  - text: '$18$ m'
    rationale: |
      This reverses the height-to-shadow ratio. Both stated pole lengths are used. Check that matching lengths stay in the same order.
  - text: '$11$ m'
    rationale: |
      This adds the nine-meter shadow increase to the height. Both shadows differ by nine. Check that similar triangles scale by multiplication.
  - text: '$4$ m'
    rationale: |
      This reports the shadow scale factor as a height. Four is a correct intermediate result. Check that the factor still multiplies the known height.
  explanation: |
    The shadow scale factor is $12\div3=4$. Similar triangles have the same height factor. Thus the flagpole height is $2(4)=8$ m.
  approved: false
- id: 'q-geometry-triangles-0018'
  type: 'which-is-true'
  difficulty: 'medium'
  stem: |
    In triangle ABC, $\angle A=40^\circ$, $\angle B=85^\circ$, and $\angle C=55^\circ$. Which side is longest?
  choices:
  - text: 'AC'
    correct: true
  - text: 'AB'
    rationale: |
      This uses the side opposite the second-largest angle. That angle is larger than the smallest. Check the largest angle first.
  - text: 'BC'
    rationale: |
      This puts the longest side opposite the smallest angle. Side and angle size are connected. Check that the larger angle faces the longer side.
  - text: 'All sides are equal.'
    rationale: |
      This treats the triangle as equilateral. Every triangle has three sides. Check whether the three angles are equal.
  explanation: |
    The largest angle is B at $85^\circ$. The longest side lies opposite that angle. The side opposite B is AC.
  approved: false
- id: 'q-geometry-triangles-0019'
  type: 'which-is-true'
  difficulty: 'hard'
  stem: |
    Two right triangles have equal hypotenuses and one pair of equal corresponding legs. Which criterion proves they are congruent?
  choices:
  - text: 'HL'
    correct: true
  - text: 'AAA'
    rationale: |
      This uses matching angles to prove equal size. Right triangles share a right angle. Check that angles alone guarantee shape, not size.
  - text: 'SAS'
    rationale: |
      This places the known right angle between the hypotenuse and a leg. SAS is a valid test when its conditions hold. Check that the right angle lies between the two legs.
  - text: 'SSS'
    rationale: |
      This treats the third matching side as given. Three matching sides would be enough. Check how many pairs of side lengths are stated.
  explanation: |
    The hypotenuse-leg rule applies to right triangles. Their hypotenuses match and one pair of legs matches. These are exactly the HL conditions.
  approved: false
- id: 'q-geometry-triangles-0020'
  type: 'word-problem'
  difficulty: 'exam'
  stem: |
    A triangular brace must have perimeter $30$ cm. Two sides measure $8$ cm and $10$ cm. Which conclusion is correct?
  choices:
  - text: 'It can be built with a 12 cm third side.'
    correct: true
  - text: 'It cannot be built because 12 exceeds 10.'
    rationale: |
      This assumes the third side cannot be the longest. The computed length exceeds both given lengths. Check the sum of the shorter sides.
  - text: 'It can be built with a 22 cm third side.'
    rationale: |
      This subtracts only the eight-centimeter side from the perimeter. That leaves part of the boundary. Check that both known sides are subtracted.
  - text: 'It cannot be built because the sides differ.'
    rationale: |
      This assumes only equal-sided triangles are possible. Matching sides are needed for special classes. Check the triangle inequality for a general triangle.
  explanation: |
    The third side is $30-8-10=12$ cm. The two shorter sides total $8+10=18>12$. The side lengths therefore form a triangle.
  approved: false
