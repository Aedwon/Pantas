meta:
  subject: mathematics
  topic: geometry
  subtopic: basic-geometric-concepts
  exams: [upcat, acet, dlsucet, ustet, pupcet]
questions:
  - id: q-geometry-basic-geometric-concepts-0001
    type: which-is-true
    difficulty: easy
    stem: |
      If Angle $A$ and Angle $B$ are complementary angles and the measure of Angle $A$ is $35^\circ$, what is the measure of Angle $B$?
    choices:
      - text: '$55^\circ$'
        correct: true
      - text: '$145^\circ$'
        correct: false
        rationale: |
          This uses a supplement instead of a complement. Both relationships describe angle pairs. Check whether the sum is ninety or one hundred eighty degrees.
      - text: '$35^\circ$'
        correct: false
        rationale: |
          This assumes complementary angles are equal. Equal-angle pairs are also common in geometry. Check whether the given relationship says equal or says a total.
      - text: '$325^\circ$'
        correct: false
        rationale: |
          This subtracts the angle from a full circle. A full circle is another familiar angle total. Check the total in the stated relationship.
    explanation: |
      Complementary angles sum to $90^\circ$. Subtract the known angle: $B=90^\circ-35^\circ=55^\circ$.

  - id: q-geometry-basic-geometric-concepts-0002
    type: which-is-true
    difficulty: easy
    stem: |
      Angle $X$ and Angle $Y$ form a linear pair on a straight line. If the measure of Angle $X$ is $112^\circ$, what is the measure of Angle $Y$?
    choices:
      - text: '$68^\circ$'
        correct: true
      - text: '$22^\circ$'
        correct: false
        rationale: |
          This takes the magnitude of a ninety-degree subtraction. Complement problems use ninety degrees. Check the straight-line total.
      - text: '$112^\circ$'
        correct: false
        rationale: |
          This assumes a linear pair has equal members. Vertical angles do have equal measures. Check whether the angles are opposite or adjacent.
      - text: '$56^\circ$'
        correct: false
        rationale: |
          This halves the given angle as if it were bisected. Half-angle rules apply to bisectors. Check whether a bisector is stated.
    explanation: |
      A linear pair sums to $180^\circ$. Thus $Y=180^\circ-112^\circ=68^\circ$.

  - id: q-geometry-basic-geometric-concepts-0003
    type: which-is-true
    difficulty: easy
    stem: |
      Line $AB$ and Line $CD$ intersect at point $P$, forming vertical angles $\angle APC$ and $\angle BPD$. If $\angle APC = 48^\circ$, which statement must be true regarding $\angle BPD$?
    choices:
      - text: '$\angle BPD = 48^\circ$ because vertical angles are equal.'
        correct: true
      - text: '$\angle BPD = 132^\circ$ because vertical angles are supplementary.'
        correct: false
        rationale: |
          This confuses opposite vertical angles with an adjacent linear pair. Both pairs occur at the same crossing. Check opposite versus adjacent positions.
      - text: '$\angle BPD = 42^\circ$ because vertical angles are complementary.'
        correct: false
        rationale: |
          This uses a complement for a vertical angle. A complement is another angle-pair relationship. Check the stated vertical-angle relationship.
      - text: '$\angle BPD = 180^\circ$ because vertical angles form a straight line.'
        correct: false
        rationale: |
          This reports the straight-angle total as one angle. The crossing contains straight lines. Check whether one angle or a pair total is requested.
    explanation: |
      Vertical angles are the opposite pair formed by two intersecting lines. Their measures are equal. Therefore $\angle BPD=\angle APC=48^\circ$.

  - id: q-geometry-basic-geometric-concepts-0004
    type: which-is-true
    difficulty: easy
    stem: |
      Which of the following statements correctly distinguishes a ray from a line segment?
    choices:
      - text: 'A ray has one endpoint; a segment has two.'
        correct: true
      - text: 'A ray extends infinitely in both directions, whereas a line segment has one endpoint.'
        correct: false
        rationale: |
          This describes a line as a ray and a ray as a segment. All three objects are parts of a line. Check endpoints and direction for each object.
      - text: 'A line segment has fixed length, whereas a ray has no endpoints.'
        correct: false
        rationale: |
          This gives a ray no endpoint. A ray does extend forever. Check where the ray starts.
      - text: 'A ray can be measured in length, whereas a line segment cannot.'
        correct: false
        rationale: |
          This swaps which object has a finite total length. Both objects have points on them. Check whether the entire object stops at both ends.
    explanation: |
      A ray starts at one endpoint and extends forever in one direction. A segment is bounded at both ends. Thus a ray has one endpoint and a segment has two.

  - id: q-geometry-basic-geometric-concepts-0005
    type: which-is-true
    difficulty: easy
    stem: |
      Ray $BD$ is the angle bisector of $\angle ABC$. If $\angle ABD = 28^\circ$, what is the measure of the entire angle $\angle ABC$?
    choices:
      - text: '$56^\circ$'
        correct: true
      - text: '$14^\circ$'
        correct: false
        rationale: |
          This halves the given half-angle again. A bisector does halve an angle. Check whether the given measure is a half or the whole.
      - text: '$28^\circ$'
        correct: false
        rationale: |
          This reports a half as the entire angle. The given part is an actual angle measure. Check whether the full angle is requested.
      - text: '$62^\circ$'
        correct: false
        rationale: |
          This finds the complement of the given half-angle. The given angle is acute. Check the stated bisector rather than assuming a complement.
    explanation: |
      The bisector makes two equal parts of the full angle. Each part is $28^\circ$. Add them: $28^\circ+28^\circ=56^\circ$.

  - id: q-geometry-basic-geometric-concepts-0006
    type: which-is-true
    difficulty: medium
    stem: |
      Point $M$ is the midpoint of line segment $AB$. If $AM = 3x + 4$ and $MB = 5x - 8$, which statement is true regarding the total length of segment $AB$?
    choices:
      - text: 'The length of $AB$ is $44$.'
        correct: true
      - text: 'The length of $AB$ is $22$.'
        correct: false
        rationale: |
          This reports only half the segment. The half-length is needed first. Check whether half or whole is requested.
      - text: 'The length of $AB$ is $6$.'
        correct: false
        rationale: |
          This reports the solved variable as the length. The variable is solved correctly. Substitute the variable into the length formula.
      - text: 'The length of $AB$ is $12$.'
        correct: false
        rationale: |
          This doubles the variable instead of a half-length. The segment has two equal halves. Find the half-length before doubling.
    explanation: |
      A midpoint gives $AM=MB$, so $3x+4=5x-8$. Rearrange: $12=2x$, giving $x=6$. Each half is $3(6)+4=22$. The whole segment is $22+22=44$.

  - id: q-geometry-basic-geometric-concepts-0007
    type: which-is-true
    difficulty: medium
    stem: |
      Two angles are complementary. The measure of the larger angle is $15^\circ$ less than twice the measure of the smaller angle. Which statement is true regarding the larger angle?
    choices:
      - text: 'The larger angle measures $55^\circ$.'
        correct: true
      - text: 'The larger angle measures $35^\circ$.'
        correct: false
        rationale: |
          This reports the smaller angle. The smaller measure is found first. Check which angle is requested.
      - text: 'The larger angle measures $115^\circ$.'
        correct: false
        rationale: |
          This uses a supplementary total. One hundred eighty degrees is a common angle total. Check the complementary total.
      - text: 'The larger angle measures $65^\circ$.'
        correct: false
        rationale: |
          This uses fifteen more instead of fifteen less. Both phrases involve a fifteen-degree difference. Check the word less in the relationship.
    explanation: |
      Let the smaller angle be $s$. The larger is $2s-15$ degrees. Their sum gives $s+(2s-15)=90$, so $3s=105$ and $s=35$. The larger angle is $2(35)-15=55^\circ$.

  - id: q-geometry-basic-geometric-concepts-0008
    type: which-is-true
    difficulty: medium
    stem: |
      An angle measure is given by the algebraic expression $(3x - 10)^\circ$. If $x$ satisfies $30 < x < 60$, which statement best describes the classification of the angle for all possible values of $x$?
    choices:
      - text: 'It can be acute, right, or obtuse.'
        correct: true
      - text: 'The angle is strictly acute for all allowed values of $x$.'
        correct: false
        rationale: |
          This extends the acute part of the interval to all allowed values. Some allowed inputs give acute angles. Check the whole input interval.
      - text: 'The angle is strictly obtuse for all allowed values of $x$.'
        correct: false
        rationale: |
          This extends the obtuse part of the interval to all allowed values. Some allowed inputs give obtuse angles. Check the whole input interval.
      - text: 'The angle becomes a reflex angle when $x > 50$.'
        correct: false
        rationale: |
          This assumes x above fifty makes the angle exceed one hundred eighty degrees. Larger inputs do give larger angle measures. Check the upper bound of the angle expression.
    explanation: |
      Multiplying $30<x<60$ by $3$ and subtracting $10$ gives $80<3x-10<170$. This interval contains angles below $90^\circ$, equal to $90^\circ$, and between $90^\circ$ and $180^\circ$. The possible types are acute, right, and obtuse.

  - id: q-geometry-basic-geometric-concepts-0009
    type: which-is-true
    difficulty: medium
    stem: |
      Two intersecting lines form vertical angles with measures $(4x + 18)^\circ$ and $(6x - 14)^\circ$. Which statement is true regarding the measure of an angle adjacent to these vertical angles?
    choices:
      - text: 'An adjacent angle measures $98^\circ$.'
        correct: true
      - text: 'An adjacent angle measures $82^\circ$.'
        correct: false
        rationale: |
          This reports a vertical angle instead of its adjacent angle. That angle is found while solving. Check whether the requested angle is opposite or adjacent.
      - text: 'An adjacent angle measures $8^\circ$.'
        correct: false
        rationale: |
          This uses a complement instead of a supplement. The vertical angle is acute. Check that a linear pair totals one hundred eighty degrees.
      - text: 'An adjacent angle measures $16^\circ$.'
        correct: false
        rationale: |
          This reports the variable instead of an angle measure. The variable is solved correctly. Substitute before answering.
    explanation: |
      The vertical angles are equal: $4x+18=6x-14$. Thus $2x=32$ and $x=16$. Each vertical angle is $4(16)+18=82^\circ$. Its adjacent angle forms a linear pair, so it measures $180^\circ-82^\circ=98^\circ$.

  - id: q-geometry-basic-geometric-concepts-0010
    type: which-is-true
    difficulty: medium
    stem: |
      Three adjacent angles $\angle AOB = (2x)^\circ$, $\angle BOC = (3x + 10)^\circ$, and $\angle COD = (x + 20)^\circ$ lie along a straight line $AD$. What is the measure of $\angle BOC$?
    choices:
      - text: '$\angle BOC = 85^\circ$'
        correct: true
      - text: '$\angle BOC = 25^\circ$'
        correct: false
        rationale: |
          This reports the variable instead of the requested angle. The variable is solved correctly. Substitute into the requested angle expression.
      - text: '$\angle BOC = 50^\circ$'
        correct: false
        rationale: |
          This reports angle AOB instead of angle BOC. That angle is part of the same straight angle. Check the requested angle name.
      - text: '$\angle BOC = 45^\circ$'
        correct: false
        rationale: |
          This reports angle COD instead of angle BOC. That angle is part of the same straight angle. Check the requested angle name.
    explanation: |
      The three adjacent angles fill a straight angle. Add them: $2x+(3x+10)+(x+20)=180$. Thus $6x+30=180$ and $x=25$. The requested angle is $3(25)+10=85^\circ$.

  - id: q-geometry-basic-geometric-concepts-0011
    type: which-is-true
    difficulty: hard
    stem: |
      Angles $\angle AOC$ and $\angle BOC$ form a linear pair. Ray $OX$ bisects $\angle AOC$ and Ray $OY$ bisects $\angle BOC$. Which statement accurately describes the geometric relationship between Ray $OX$ and Ray $OY$?
    choices:
      - text: 'Ray $OX$ and Ray $OY$ are perpendicular to each other.'
        correct: true
      - text: 'Ray $OX$ and Ray $OY$ are parallel to each other.'
        correct: false
        rationale: |
          This treats the two bisectors as having the same direction. Both rays are bisectors. Check the sum of the two half-angles.
      - text: 'Ray $OX$ and Ray $OY$ form a straight angle of $180^\circ$.'
        correct: false
        rationale: |
          This uses the full linear-pair angle instead of half its measure. The original angles total one hundred eighty degrees. Check that both angles have been bisected.
      - text: 'Ray $OX$ and Ray $OY$ form an angle of $45^\circ$.'
        correct: false
        rationale: |
          This halves the sum of the bisected angles a second time. Forty-five is half of a right angle. Check that each original angle is halved only once.
    explanation: |
      Let the two linear-pair angles be $\alpha$ and $\beta$, so $\alpha+\beta=180^\circ$. Their bisectors make an angle of $\dfrac{\alpha}{2}+\dfrac{\beta}{2}=90^\circ$. Rays meeting at $90^\circ$ are perpendicular.

  - id: q-geometry-basic-geometric-concepts-0012
    type: which-is-true
    difficulty: hard
    stem: |
      The measure of the supplement of an angle is equal to four times the measure of its complement. Which statement is true regarding this angle?
    choices:
      - text: 'The angle measures $60^\circ$, which is an acute angle.'
        correct: true
      - text: 'The angle measures $30^\circ$, which is an acute angle.'
        correct: false
        rationale: |
          This reports the complement of the solved angle. The complement is a meaningful related measure. Check whether the angle or its complement is requested.
      - text: 'The angle measures $45^\circ$, which is an acute angle.'
        correct: false
        rationale: |
          This uses three times the complement instead of four. Three times produces another valid equation. Check the multiplier in the stem.
      - text: 'The angle measures $120^\circ$, which is an obtuse angle.'
        correct: false
        rationale: |
          This reports the supplement of the solved angle. The supplement is a meaningful related measure. Check whether the angle or its supplement is requested.
    explanation: |
      Let the angle measure be $x$ degrees. Its supplement is $180-x$ and its complement is $90-x$. The condition gives $180-x=4(90-x)$. Expand to get $180-x=360-4x$, so $3x=180$ and $x=60$. Since $60^\circ$ is between $0^\circ$ and $90^\circ$, the angle is acute.

  - id: q-geometry-basic-geometric-concepts-0013
    type: which-is-true
    difficulty: hard
    stem: |
      Points $A, B, C,$ and $D$ lie in order along line segment $AD$. Point $B$ is the midpoint of segment $AC$, and point $C$ is the midpoint of segment $BD$. If the total length $AD = 36\text{ cm}$, what is the length of segment $BC$?
    choices:
      - text: 'The length of $BC$ is $12\text{ cm}$.'
        correct: true
      - text: 'The length of $BC$ is $18\text{ cm}$.'
        correct: false
        rationale: |
          This treats BC as half of the entire segment. Two midpoint conditions are stated. Check which shorter segments the midpoints belong to.
      - text: 'The length of $BC$ is $9\text{ cm}$.'
        correct: false
        rationale: |
          This divides by four because there are four labeled points. Four labels are visible. Count pieces between points, not points.
      - text: 'The length of $BC$ is $24\text{ cm}$.'
        correct: false
        rationale: |
          This reports two of the equal pieces instead of BC alone. The larger segment has two equal pieces. Check the endpoints of BC.
    explanation: |
      Because B is the midpoint of AC, $AB=BC$. Because C is the midpoint of BD, $BC=CD$. Thus the whole segment has three equal pieces. Each is $36\div3=12$ cm, so $BC=12$ cm.

  - id: q-geometry-basic-geometric-concepts-0014
    type: which-is-true
    difficulty: hard
    stem: |
      Three rays meeting at point $O$ form angles $\angle AOB = (4x - 5)^\circ$, $\angle BOC = (2x + 15)^\circ$, and reflex angle $\angle COA = (10x - 10)^\circ$. Which statement is true regarding the measure of $\angle AOB$?
    choices:
      - text: 'The measure of $\angle AOB$ is $85^\circ$.'
        correct: true
      - text: 'The measure of $\angle AOB$ is $60^\circ$.'
        correct: false
        rationale: |
          This reports angle BOC instead of angle AOB. That angle is also part of the full turn. Check the requested angle name.
      - text: 'The measure of $\angle AOB$ is $215^\circ$.'
        correct: false
        rationale: |
          This reports the reflex angle instead of angle AOB. That angle is also part of the full turn. Check the requested angle name.
      - text: 'The measure of $\angle AOB$ is $22.5^\circ$.'
        correct: false
        rationale: |
          This reports the variable instead of an angle measure. The variable is solved correctly. Substitute into the requested expression.
    explanation: |
      The three sectors around O fill $360^\circ$. Their measures give $(4x-5)+(2x+15)+(10x-10)=360$. Collect terms: $16x=360$, so $x=22.5$. Therefore $\angle AOB=4(22.5)-5=85^\circ$.

  - id: q-geometry-basic-geometric-concepts-0015
    type: which-is-true
    difficulty: hard
    stem: |
      Angle $P$ and Angle $Q$ are supplementary angles. The measure of Angle $P$ is $20^\circ$ less than three times the measure of Angle $Q$. If Angle $R$ is complementary to Angle $Q$, what is the measure of Angle $R$?
    choices:
      - text: 'The measure of Angle $R$ is $40^\circ$.'
        correct: true
      - text: 'The measure of Angle $R$ is $50^\circ$.'
        correct: false
        rationale: |
          This reports angle Q instead of its complement. That measure is found first. Check that R is the complement of Q.
      - text: 'The measure of Angle $R$ is $130^\circ$.'
        correct: false
        rationale: |
          This reports angle P instead of angle R. P is also a solved angle. Check the requested angle name.
      - text: 'The measure of Angle $R$ is $140^\circ$.'
        correct: false
        rationale: |
          This reports the supplement of R after finding R. A supplement is another familiar partner. Check that no second supplementary step is requested.
    explanation: |
      The supplementary condition is $P+Q=180^\circ$. With $P=3Q-20^\circ$, this gives $4Q-20^\circ=180^\circ$, so $Q=50^\circ$. Since R complements Q, $R=90^\circ-50^\circ=40^\circ$.

  - id: q-geometry-basic-geometric-concepts-0016
    type: which-is-true
    difficulty: easy
    stem: |
      For distinct points A and B, how do rays $\overrightarrow{AB}$ and $\overrightarrow{BA}$ compare?
    choices:
      - text: 'They are different rays with different endpoints.'
        correct: true
      - text: 'They are the same ray because they use the same two points.'
        rationale: |
          This ignores the order of the ray name. The same two point labels are used. Check that the first letter names the endpoint.
      - text: 'They are segments with the same two fixed endpoints.'
        rationale: |
          This reads ray notation as segment notation. Both symbols are written above two letters. Check whether the symbol has an arrow.
      - text: 'They both extend forever in both directions.'
        rationale: |
          This describes a line instead of a ray. Both rays lie on the same line. Check that each ray extends in only one direction.
    explanation: |
      Ray AB starts at A and passes through B. Ray BA starts at B and passes through A. Their endpoints differ, so they are different rays.
    approved: false

  - id: q-geometry-basic-geometric-concepts-0017
    type: error-spotting
    difficulty: medium
    stem: |
      M is the midpoint of AB, and $AM=7$ cm. A student reports $AB=3.5$ cm because a midpoint halves a segment. What is the correction?
    choices:
      - text: '$AB=14$ cm.'
        correct: true
      - text: '$AB=7$ cm.'
        rationale: |
          This reports one half as the whole. The half-length is given directly. Check the endpoints of the requested segment.
      - text: '$AB=3.5$ cm.'
        rationale: |
          This halves an already halved segment again. Midpoints do divide a whole in half. Check whether the given length is already one half.
      - text: '$AB=21$ cm.'
        rationale: |
          This counts three pieces for three point labels. A, M, and B are three points. Check that they form only two consecutive pieces.
    explanation: |
      A midpoint makes $AM=MB=7$ cm. Add the two halves: $AB=7+7=14$ cm.
    approved: false

  - id: q-geometry-basic-geometric-concepts-0018
    type: which-is-true
    difficulty: medium
    stem: |
      Which fact alone is insufficient to prove that two angles form a linear pair?
    choices:
      - text: 'They are adjacent.'
        correct: true
      - text: 'Their noncommon sides are opposite rays and they are adjacent.'
        rationale: |
          This treats the defining opposite-ray condition as insufficient. Adjacent angles can have many arrangements. Check that opposite outer rays make a straight angle.
      - text: 'They are adjacent and sum to $180^\circ$.'
        rationale: |
          This overlooks the straight-angle total for adjacent angles. Supplementary angles alone need not be adjacent. Check that this statement includes both conditions.
      - text: 'They fill a straight angle without overlapping interiors.'
        rationale: |
          This overlooks that filling a straight angle without overlap creates adjacent supplementary parts. The wording differs from the definition. Check the geometry described.
    explanation: |
      Adjacent angles share a vertex and one side without overlapping. This does not force their outer sides to be opposite rays. A linear pair needs that additional straight-line condition.
    approved: false

  - id: q-geometry-basic-geometric-concepts-0019
    type: direct-computation
    difficulty: hard
    stem: |
      A ray bisects an angle into parts measuring $(3x+2)^\circ$ and $(5x-8)^\circ$. What is the full angle measure?
    choices:
      - text: '$34^\circ$'
        correct: true
      - text: '$17^\circ$'
        rationale: |
          This reports only one part. That part is needed first. Check whether the full angle is requested.
      - text: '$5^\circ$'
        rationale: |
          This reports the variable instead of an angle. The variable is solved correctly. Check the angle expression.
      - text: '$68^\circ$'
        rationale: |
          This doubles the full angle a second time. A bisector requires combining two parts. Check that doubling happens only once.
    explanation: |
      The bisected parts are equal, so $3x+2=5x-8$. This gives $2x=10$ and $x=5$. Each part is $3(5)+2=17^\circ$. The full angle is $17^\circ+17^\circ=34^\circ$.
    approved: false

  - id: q-geometry-basic-geometric-concepts-0020
    type: which-is-true
    difficulty: exam
    stem: |
      An angle is obtuse. What type must its supplement be?
    choices:
      - text: 'Acute'
        correct: true
      - text: 'Right'
        rationale: |
          This treats supplementary angles as equal halves of a straight angle. Equal halves are right angles. Check that the given angle is strictly obtuse.
      - text: 'Obtuse'
        rationale: |
          This assumes an angle and its supplement have the same type. Both belong to the same pair. Check that two obtuse angles would sum to more than one hundred eighty degrees.
      - text: 'Reflex'
        rationale: |
          This uses a full-turn partner instead of a supplement. A reflex angle completes some smaller angles to a full turn. Check that a supplement uses one hundred eighty degrees.
    explanation: |
      An obtuse angle lies strictly between $90^\circ$ and $180^\circ$. Its supplement is $180^\circ$ minus that angle. This lies strictly between $0^\circ$ and $90^\circ$, so it is acute.
    approved: false
