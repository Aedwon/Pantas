questions:
  - id: q-geometry-basic-geometric-concepts-0001
    type: which-is-true
    difficulty: easy
    stem: |
      If Angle $A$ and Angle $B$ are complementary angles and the measure of Angle $A$ is $35^\circ$, what is the measure of Angle $B$?
    choices:
      - text: '$55^\circ$'
        correct: true
      - text: '$145^\circ$'
        correct: false
        rationale: |
          You used supplementary ($180^\circ$) instead of
          complementary ($90^\circ$). Complementary angles add to
          $90^\circ$: $90 - 35 = 55$.
      - text: '$35^\circ$'
        correct: false
        rationale: |
          You assumed the two angles are equal. Complementary means
          they add to $90^\circ$, not that they match.
      - text: '$325^\circ$'
        correct: false
        rationale: |
          You subtracted from $360^\circ$ instead of $90^\circ$.
          Complementary angles add to $90^\circ$, not $360^\circ$.
    explanation: |
      Complementary angles are two angles whose sum is equal to $90^\circ$.

      1. Set up the equation: $\angle A + \angle B = 90^\circ$.
      2. Substitute the given value: $35^\circ + \angle B = 90^\circ$.
      3. Solve for $\angle B$: $\angle B = 90^\circ - 35^\circ = 55^\circ$.

      Common Trap: Confusing complementary angles ($90^\circ$) with supplementary angles ($180^\circ$), which leads to $180^\circ - 35^\circ = 145^\circ$.

  - id: q-geometry-basic-geometric-concepts-0002
    type: which-is-true
    difficulty: easy
    stem: |
      Angle $X$ and Angle $Y$ form a linear pair on a straight line. If the measure of Angle $X$ is $112^\circ$, what is the measure of Angle $Y$?
    choices:
      - text: '$68^\circ$'
        correct: true
      - text: '$22^\circ$'
        correct: false
        rationale: |
          You subtracted from $90^\circ$ instead of $180^\circ$.
          A linear pair is supplementary, not complementary.
      - text: '$112^\circ$'
        correct: false
        rationale: |
          You assumed the two angles are equal. A linear pair adds
          to $180^\circ$: $180 - 112 = 68$.
      - text: '$78^\circ$'
        correct: false
        rationale: |
          You subtracted $112$ from $190$ or miscomputed
          $180 - 112$. The correct subtraction is
          $180 - 112 = 68$.
    explanation: |
      Angles that form a linear pair are supplementary, meaning their sum is $180^\circ$.

      1. Set up the linear pair equation: $\angle X + \angle Y = 180^\circ$.
      2. Substitute $112^\circ$: $112^\circ + \angle Y = 180^\circ$.
      3. Subtract $112^\circ$ from $180^\circ$: $\angle Y = 180^\circ - 112^\circ = 68^\circ$.

      Common Trap: Confusing linear pairs with complementary angles gives $90^\circ - 112^\circ = -22^\circ$ or $22^\circ$.

  - id: q-geometry-basic-geometric-concepts-0003
    type: which-is-true
    difficulty: easy
    stem: |
      Line $AB$ and Line $CD$ intersect at point $P$, forming vertical angles $\angle APC$ and $\angle BPD$. If $\angle APC = 48^\circ$, which statement must be true regarding $\angle BPD$?
    choices:
      - text: '$\angle BPD = 48^\circ$ because vertical angles are equal.'
        correct: true
      - text: '$\angle BPD = 132^\circ$ because vertical angles are supplementary.'
        correct: false
        rationale: |
          You treated vertical angles as supplementary. Vertical
          angles are equal, not supplementary. The adjacent angles
          are the ones that add to $180^\circ$.
      - text: '$\angle BPD = 42^\circ$ because vertical angles are complementary.'
        correct: false
        rationale: |
          You subtracted from $90^\circ$. Vertical angles are
          equal, and there is no complementary rule for them.
      - text: '$\angle BPD = 180^\circ$ because vertical angles form a straight line.'
        correct: false
        rationale: |
          You confused vertical angles with a linear pair. Vertical
          angles are the opposite pair at an intersection. They are
          equal, not supplementary.
    explanation: |
      Vertical angles are opposite angles formed by two intersecting lines.

      1. Vertical angles are always equal in measure.
      2. Since $\angle APC$ and $\angle BPD$ are vertical angles, $\angle BPD = \angle APC = 48^\circ$.

      Common Trap: Mistakenly assuming vertical angles are supplementary ($180^\circ - 48^\circ = 132^\circ$) instead of equal.

  - id: q-geometry-basic-geometric-concepts-0004
    type: which-is-true
    difficulty: easy
    stem: |
      Which of the following statements correctly distinguishes a ray from a line segment?
    choices:
      - text: "A ray has one endpoint and extends infinitely in one direction, whereas a line segment has two fixed endpoints."
        correct: true
      - text: "A ray extends infinitely in both directions, whereas a line segment has one endpoint."
        correct: false
        rationale: |
          You described a line, not a ray. A line extends in both
          directions. A ray starts at one point and goes one way.
      - text: "A line segment has fixed length, whereas a ray has no endpoints."
        correct: false
        rationale: |
          You said a ray has no endpoints. A ray has one endpoint
          where it starts. A line is the one with no endpoints.
      - text: "A ray can be measured in length, whereas a line segment cannot."
        correct: false
        rationale: |
          You swapped the two. A line segment has a measurable
          length because it has two endpoints. A ray extends
          forever and cannot be measured.
    explanation: |
      By standard geometric definitions:
      - A line segment is bounded by two distinct endpoints and has a measurable length.
      - A ray starts at one initial endpoint and extends infinitely in one direction (it cannot be measured in full).
      - A line extends infinitely in both directions with no endpoints.

  - id: q-geometry-basic-geometric-concepts-0005
    type: which-is-true
    difficulty: easy
    stem: |
      Ray $BD$ is the angle bisector of $\angle ABC$. If $\angle ABD = 28^\circ$, what is the measure of the entire angle $\angle ABC$?
    choices:
      - text: '$56^\circ$'
        correct: true
      - text: '$14^\circ$'
        correct: false
        rationale: |
          You halved the $28^\circ$ again. The bisector already
          split the angle in half. $28^\circ$ is one half, so
          the full angle is $28 + 28 = 56$.
      - text: '$28^\circ$'
        correct: false
        rationale: |
          You used the half-angle as the whole angle. A bisector
          cuts the angle into two equal parts, so the full angle
          is $2 \times 28 = 56$.
      - text: '$62^\circ$'
        correct: false
        rationale: |
          You subtracted from $90^\circ$: $90 - 28 = 62$. The
          question asks for the full bisected angle, not the
          complement.
    explanation: |
      An angle bisector divides an angle into two congruent (equal) halves.

      1. Since Ray $BD$ bisects $\angle ABC$, $\angle ABD = \angle DBC = 28^\circ$.
      2. The full angle $\angle ABC = \angle ABD + \angle DBC = 28^\circ + 28^\circ = 56^\circ$.

      Common Trap: Giving half the angle ($14^\circ$) when asked for the whole angle, or confusing the half with the whole.

  - id: q-geometry-basic-geometric-concepts-0006
    type: which-is-true
    difficulty: medium
    stem: |
      Point $M$ is the midpoint of line segment $AB$. If $AM = 3x + 4$ and $MB = 5x - 8$, which statement is true regarding the total length of segment $AB$?
    choices:
      - text: "The length of $AB$ is $44$."
        correct: true
      - text: "The length of $AB$ is $22$."
        correct: false
        rationale: |
          You found $AM = 22$ and stopped. That is half the
          segment. The full length is $AM + MB = 22 + 22 = 44$.
      - text: "The length of $AB$ is $6$."
        correct: false
        rationale: |
          You used $x = 6$ as the length. $x$ is the variable
          you solved for, not the segment length. Plug it back
          in: $AM = 3(6) + 4 = 22$.
      - text: "The length of $AB$ is $12$."
        correct: false
        rationale: |
          You used $2x = 12$ as the total length. The total is
          $AM + MB = 22 + 22 = 44$, not $2x$.
    explanation: |
      Because $M$ is the midpoint of $AB$, the two sub-segments $AM$ and $MB$ are equal in length.

      1. Set up the equation: $AM = MB \implies 3x + 4 = 5x - 8$.
      2. Solve for $x$: $2x = 12 \implies x = 6$.
      3. Calculate segment $AM$: $AM = 3(6) + 4 = 22$.
      4. Calculate total length $AB$: $AB = AM + MB = 22 + 22 = 44$.

      Common Trap: Stopping after finding half the length ($22$) or after solving for $x$ ($6$) instead of multiplying half by $2$ to find the total segment length.

  - id: q-geometry-basic-geometric-concepts-0007
    type: which-is-true
    difficulty: medium
    stem: |
      Two angles are complementary. The measure of the larger angle is $15^\circ$ less than twice the measure of the smaller angle. Which statement is true regarding the larger angle?
    choices:
      - text: 'The larger angle measures $55^\circ$.'
        correct: true
      - text: 'The larger angle measures $35^\circ$.'
        correct: false
        rationale: |
          You gave the smaller angle. The question asks for the
          larger one, which is $2(35) - 15 = 55^\circ$.
      - text: 'The larger angle measures $115^\circ$.'
        correct: false
        rationale: |
          You used supplementary ($180^\circ$) instead of
          complementary ($90^\circ$). With $180^\circ$ the equation
          gives $x = 65$ and $2(65) - 15 = 115$.
      - text: 'The larger angle measures $75^\circ$.'
        correct: false
        rationale: |
          You set up the equation with $+15$ instead of $-15$,
          or misapplied the relationship. The correct larger
          angle is $2(35) - 15 = 55^\circ$.
    explanation: |
      Let $x$ be the measure of the smaller angle. The larger angle is $2x - 15$.

      1. Since the angles are complementary, their sum is $90^\circ$:
         $$x + (2x - 15) = 90$$
      2. Simplify: $3x - 15 = 90 \implies 3x = 105 \implies x = 35^\circ$.
      3. Calculate the larger angle: $2(35^\circ) - 15^\circ = 70^\circ - 15^\circ = 55^\circ$.

      Common Trap: Reporting the smaller angle ($35^\circ$) instead of the larger angle, or using $180^\circ$ for supplementary angles to get $115^\circ$.

  - id: q-geometry-basic-geometric-concepts-0008
    type: which-is-true
    difficulty: medium
    stem: |
      An angle measure is given by the algebraic expression $(3x - 10)^\circ$. If $x$ satisfies $30 < x < 60$, which statement best describes the classification of the angle for all possible values of $x$?
    choices:
      - text: "The angle can be acute, right, or obtuse, but it is never a reflex angle."
        correct: true
      - text: "The angle is strictly acute for all allowed values of $x$."
        correct: false
        rationale: |
          You checked only one part of the interval. At $x = 31$,
          the angle is $83^\circ$ and acute, but later values do
          not stay acute.
      - text: "The angle is strictly obtuse for all allowed values of $x$."
        correct: false
        rationale: |
          You checked only one part of the interval. At $x = 59$,
          the angle is $167^\circ$ and obtuse, but smaller allowed
          values do not stay obtuse.
      - text: "The angle becomes a reflex angle when $x > 50$."
        correct: false
        rationale: |
          You assumed the angle passes $180^\circ$ inside the
          interval. Even at $x = 59$, the angle is only
          $3(59) - 10 = 167^\circ$, which is still obtuse.
    explanation: |
      Evaluate the range of angle values as $x$ increases from $30$ to $60$:

      1. Lower bound ($x \to 30$): $3(30) - 10 = 80^\circ$ (acute).
      2. Upper bound ($x \to 60$): $3(60) - 10 = 170^\circ$ (obtuse).
      3. At $x = \dfrac{100}{3}$, $3\left(\dfrac{100}{3}\right) - 10 = 90^\circ$ (right angle).
      4. A reflex angle requires a measure greater than $180^\circ$. Since $80^\circ < \text{angle} < 170^\circ$, it is never reflex.

  - id: q-geometry-basic-geometric-concepts-0009
    type: which-is-true
    difficulty: medium
    stem: |
      Two intersecting lines form vertical angles with measures $(4x + 18)^\circ$ and $(6x - 14)^\circ$. Which statement is true regarding the measure of an angle adjacent to these vertical angles?
    choices:
      - text: 'An adjacent angle measures $98^\circ$.'
        correct: true
      - text: 'An adjacent angle measures $82^\circ$.'
        correct: false
        rationale: |
          You gave the vertical angle, not the adjacent one. The
          vertical angle is $82^\circ$, but the adjacent angle is
          supplementary: $180 - 82 = 98^\circ$.
      - text: 'An adjacent angle measures $8^\circ$.'
        correct: false
        rationale: |
          You subtracted from $90^\circ$: $90 - 82 = 8$. Adjacent
          angles on intersecting lines are supplementary, so
          subtract from $180^\circ$.
      - text: 'An adjacent angle measures $16^\circ$.'
        correct: false
        rationale: |
          You used $x = 16$ as the angle. $x$ is the variable you
          solved for. The angle is $4(16) + 18 = 82^\circ$, and
          the adjacent angle is $180 - 82 = 98^\circ$.
    explanation: |
      1. Vertical angles are equal: $4x + 18 = 6x - 14 \implies 2x = 32 \implies x = 16$.
      2. Find the vertical angle measure: $4(16) + 18 = 64 + 18 = 82^\circ$.
      3. An adjacent angle on intersecting lines forms a linear pair with the vertical angle, so they are supplementary ($180^\circ$):
         $$\text{Adjacent Angle} = 180^\circ - 82^\circ = 98^\circ$$

      Common Trap: Confusing vertical angles with adjacent angles leads to giving $82^\circ$ (equal) or $90^\circ - 82^\circ = 8^\circ$ (complementary).

  - id: q-geometry-basic-geometric-concepts-0010
    type: which-is-true
    difficulty: medium
    stem: |
      Three adjacent angles $\angle AOB = (2x)^\circ$, $\angle BOC = (3x + 10)^\circ$, and $\angle COD = (x + 20)^\circ$ lie along a straight line $AD$. What is the measure of $\angle BOC$?
    choices:
      - text: '$\angle BOC = 85^\circ$'
        correct: true
      - text: '$\angle BOC = 25^\circ$'
        correct: false
        rationale: |
          You used $x = 25$ as the angle. $x$ is the variable,
          not the angle. Plug it into $3x + 10$:
          $3(25) + 10 = 85^\circ$.
      - text: '$\angle BOC = 50^\circ$'
        correct: false
        rationale: |
          You computed $\angle AOB = 2(25) = 50^\circ$ instead
          of $\angle BOC$. The question asks for $\angle BOC$,
          which is $3(25) + 10 = 85^\circ$.
      - text: '$\angle BOC = 45^\circ$'
        correct: false
        rationale: |
          You computed $\angle COD = 25 + 20 = 45^\circ$ instead
          of $\angle BOC$. The question asks for $\angle BOC$,
          which is $3(25) + 10 = 85^\circ$.
    explanation: |
      Angles lying on a straight line sum to $180^\circ$.

      1. Set up the equation: $(2x) + (3x + 10) + (x + 20) = 180$.
      2. Combine like terms: $6x + 30 = 180 \implies 6x = 150 \implies x = 25$.
      3. Substitute $x = 25$ into $\angle BOC$:
         $$\angle BOC = 3(25) + 10 = 75 + 10 = 85^\circ$$

      Common Trap: Reporting $x = 25^\circ$ directly or calculating $\angle AOB = 50^\circ$ instead of $\angle BOC$.

  - id: q-geometry-basic-geometric-concepts-0011
    type: which-is-true
    difficulty: hard
    stem: |
      Angles $\angle AOC$ and $\angle BOC$ form a linear pair. Ray $OX$ bisects $\angle AOC$ and Ray $OY$ bisects $\angle BOC$. Which statement accurately describes the geometric relationship between Ray $OX$ and Ray $OY$?
    choices:
      - text: "Ray $OX$ and Ray $OY$ are perpendicular to each other."
        correct: true
      - text: "Ray $OX$ and Ray $OY$ are parallel to each other."
        correct: false
        rationale: |
          You assumed the bisectors go in the same direction. They
          split angles that add to $180^\circ$, so the bisectors
          meet at $90^\circ$, not $0^\circ$.
      - text: 'Ray $OX$ and Ray $OY$ form a straight angle of $180^\circ$.'
        correct: false
        rationale: |
          You assumed the bisectors lie on a straight line. The
          half-angles add to $90^\circ$, not $180^\circ$.
      - text: 'Ray $OX$ and Ray $OY$ form an angle of $45^\circ$.'
        correct: false
        rationale: |
          You halved the $90^\circ$ again. The bisectors already
          account for halving. Their angle is $a + b = 90^\circ$,
          not $45^\circ$.
    explanation: |
      Let $\angle AOC = 2a$ and $\angle BOC = 2b$.

      1. Since $\angle AOC$ and $\angle BOC$ form a linear pair, $2a + 2b = 180^\circ$.
      2. Divide by $2$: $a + b = 90^\circ$.
      3. Ray $OX$ bisects $\angle AOC$, so $\angle XOC = a$.
      4. Ray $OY$ bisects $\angle BOC$, so $\angle COY = b$.
      5. The angle between the two bisectors is $\angle XOY = \angle XOC + \angle COY = a + b = 90^\circ$.
      6. An angle of $90^\circ$ means Ray $OX$ and Ray $OY$ are perpendicular.

  - id: q-geometry-basic-geometric-concepts-0012
    type: which-is-true
    difficulty: hard
    stem: |
      The measure of the supplement of an angle is equal to four times the measure of its complement. Which statement is true regarding this angle?
    choices:
      - text: 'The angle measures $60^\circ$, which is an acute angle.'
        correct: true
      - text: 'The angle measures $30^\circ$, which is an acute angle.'
        correct: false
        rationale: |
          You found $x = 60$ correctly but then gave its
          complement $90 - 60 = 30$ instead of the angle itself.
          The question asks for the angle, which is $60^\circ$.
      - text: 'The angle measures $45^\circ$, which is an acute angle.'
        correct: false
        rationale: |
          You used $180 - x = 3(90 - x)$ (three times) instead of
          four times. That gives $x = 45$. The problem says four
          times, which gives $x = 60$.
      - text: 'The angle measures $120^\circ$, which is an obtuse angle.'
        correct: false
        rationale: |
          You found the supplement of $60^\circ$:
          $180 - 60 = 120$. The question asks for the angle
          itself, which is $60^\circ$.
    explanation: |
      Let $x$ be the measure of the angle.
      - Complement $= 90 - x$
      - Supplement $= 180 - x$

      1. Set up the equation: $180 - x = 4(90 - x)$.
      2. Expand: $180 - x = 360 - 4x$.
      3. Solve for $x$: $3x = 180 \implies x = 60^\circ$.
      4. Since $60^\circ < 90^\circ$, it is an acute angle.

      Common Trap: Setting $180 - x = 3(90 - x)$ leads to $x = 30^\circ$.

  - id: q-geometry-basic-geometric-concepts-0013
    type: which-is-true
    difficulty: hard
    stem: |
      Points $A, B, C,$ and $D$ lie in order along line segment $AD$. Point $B$ is the midpoint of segment $AC$, and point $C$ is the midpoint of segment $BD$. If the total length $AD = 36\text{ cm}$, what is the length of segment $BC$?
    choices:
      - text: 'The length of $BC$ is $12\text{ cm}$.'
        correct: true
      - text: 'The length of $BC$ is $18\text{ cm}$.'
        correct: false
        rationale: |
          You assumed $B$ is the midpoint of the whole segment
          $AD$: $36/2 = 18$. $B$ is the midpoint of $AC$ only,
          not of $AD$.
      - text: 'The length of $BC$ is $9\text{ cm}$.'
        correct: false
        rationale: |
          You divided $36$ by $4$, assuming four equal parts.
          There are three equal parts ($AB = BC = CD$), so
          each part is $36/3 = 12$.
      - text: 'The length of $BC$ is $24\text{ cm}$.'
        correct: false
        rationale: |
          You used $2x = 24$ instead of $x = 12$. $BC = x$, one
          of the three equal parts, so $BC = 12$.
    explanation: |
      Let the length of segment $AB$ be $x$.

      1. Since $B$ is the midpoint of $AC$, $BC = AB = x$, so $AC = 2x$.
      2. Since $C$ is the midpoint of $BD$, $CD = BC = x$.
      3. The total segment $AD = AB + BC + CD = x + x + x = 3x$.
      4. Given $AD = 36\text{ cm}$: $3x = 36 \implies x = 12\text{ cm}$.
      5. Thus, $BC = x = 12\text{ cm}$.

      Common Trap: Assuming $B$ is the midpoint of the entire segment $AD$, which incorrectly yields $BC = 36 / 2 = 18\text{ cm}$.

  - id: q-geometry-basic-geometric-concepts-0014
    type: which-is-true
    difficulty: hard
    stem: |
      Three rays meeting at point $O$ form angles $\angle AOB = (4x - 5)^\circ$, $\angle BOC = (2x + 15)^\circ$, and reflex angle $\angle COA = (10x - 10)^\circ$. Which statement is true regarding the measure of $\angle AOB$?
    choices:
      - text: 'The measure of $\angle AOB$ is $85^\circ$.'
        correct: true
      - text: 'The measure of $\angle AOB$ is $60^\circ$.'
        correct: false
        rationale: |
          You computed $\angle BOC = 2(22.5) + 15 = 60^\circ$
          instead of $\angle AOB$. The question asks for
          $\angle AOB = 4(22.5) - 5 = 85^\circ$.
      - text: 'The measure of $\angle AOB$ is $215^\circ$.'
        correct: false
        rationale: |
          You computed the reflex angle $\angle COA =
          10(22.5) - 10 = 215^\circ$ instead of $\angle AOB$.
          The question asks for $\angle AOB$.
      - text: 'The measure of $\angle AOB$ is $22.5^\circ$.'
        correct: false
        rationale: |
          You used $x = 22.5$ as the angle measure. $x$ is the
          variable, not the angle. Plug it in:
          $4(22.5) - 5 = 85^\circ$.
    explanation: |
      The sum of angles around a single point is $360^\circ$.

      1. Set up equation: $(4x - 5) + (2x + 15) + (10x - 10) = 360$.
      2. Combine like terms: $16x = 360 \implies x = 22.5$.
      3. Calculate $\angle AOB$:
         $$\angle AOB = 4(22.5) - 5 = 90 - 5 = 85^\circ$$

      Common Trap: Confusing $\angle AOB$ with $\angle BOC = 2(22.5) + 15 = 60^\circ$ or reporting $x = 22.5^\circ$.

  - id: q-geometry-basic-geometric-concepts-0015
    type: which-is-true
    difficulty: hard
    stem: |
      Angle $P$ and Angle $Q$ are supplementary angles. The measure of Angle $P$ is $20^\circ$ less than three times the measure of Angle $Q$. If Angle $R$ is complementary to Angle $Q$, what is the measure of Angle $R$?
    choices:
      - text: 'The measure of Angle $R$ is $40^\circ$.'
        correct: true
      - text: 'The measure of Angle $R$ is $50^\circ$.'
        correct: false
        rationale: |
          You stopped at $Q = 50^\circ$ and reported it as $R$.
          One more step: $R$ is the complement of $Q$, so
          $R = 90 - 50 = 40^\circ$.
      - text: 'The measure of Angle $R$ is $130^\circ$.'
        correct: false
        rationale: |
          You used $P = 130^\circ$ as $R$. $P$ is the supplement
          of $Q$, but $R$ is the complement: $R = 90 - 50 = 40$.
      - text: 'The measure of Angle $R$ is $140^\circ$.'
        correct: false
        rationale: |
          You found the supplement of $R$ instead of $R$ itself.
          $R = 90 - 50 = 40$, not $180 - 40 = 140$.
    explanation: |
      1. Since $P$ and $Q$ are supplementary: $P + Q = 180$.
      2. Express $P$ in terms of $Q$: $P = 3Q - 20$.
      3. Substitute into the supplementary equation:
         $$(3Q - 20) + Q = 180 \implies 4Q - 20 = 180 \implies 4Q = 200 \implies Q = 50^\circ$$
      4. Find $P$: $P = 180 - 50 = 130^\circ$.
      5. Angle $R$ is complementary to Angle $Q$:
         $$R = 90^\circ - Q = 90^\circ - 50^\circ = 40^\circ$$

      Common Trap: Stopping at Angle $Q = 50^\circ$, or finding the supplement of $Q$ ($140^\circ$) instead of the complement ($40^\circ$).
