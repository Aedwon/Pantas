questions:
  - id: q-geometry-logic-and-reasoning-0001
    type: which-is-true
    difficulty: easy
    stem: |
      Given the conditional statement: "If a shape is a square, then it has four equal sides." Which statement represents its converse?
    choices:
      - text: "If a shape has four equal sides, then it is a square."
        correct: true
      - text: "If a shape is not a square, then it does not have four equal sides."
      - text: "If a shape does not have four equal sides, then it is not a square."
      - text: "A shape is a square if and only if it has four equal sides."
    explanation: |
      The converse of a conditional statement "If P, then Q" swaps the hypothesis P and conclusion Q to form "If Q, then P".

      - Original: P = "a shape is a square", Q = "it has four equal sides".
      - Converse: "If a shape has four equal sides, then it is a square."

      Common Trap: Confusing the converse with the inverse ("If not P, then not Q") or contrapositive ("If not Q, then not P").

  - id: q-geometry-logic-and-reasoning-0002
    type: which-is-true
    difficulty: easy
    stem: |
      Given the conditional statement: "If two angles are vertical angles, then they are equal in measure." Which statement represents its contrapositive?
    choices:
      - text: "If two angles are not equal in measure, then they are not vertical angles."
        correct: true
      - text: "If two angles are equal in measure, then they are vertical angles."
      - text: "If two angles are not vertical angles, then they are not equal in measure."
      - text: "Two angles are vertical angles if and only if they are equal in measure."
    explanation: |
      The contrapositive of a conditional statement "If P, then Q" swaps AND negates both parts to form "If not Q, then not P".

      - Original: P = "two angles are vertical angles", Q = "they are equal in measure".
      - Contrapositive: "If two angles are not equal in measure, then they are not vertical angles."

  - id: q-geometry-logic-and-reasoning-0003
    type: which-is-true
    difficulty: easy
    stem: |
      Which statement is ALWAYS logically equivalent (possesses the exact same truth value under all conditions) to the conditional statement "If $P$, then $Q$"?
    choices:
      - text: "Its contrapositive ('If not $Q$, then not $P$')"
        correct: true
      - text: "Its converse ('If $Q$, then $P$')"
      - text: "Its inverse ('If not $P$, then not $Q$')"
      - text: "Its negation ('$P$ and not $Q$')"
    explanation: |
      A conditional statement and its contrapositive are logically equivalent. If a conditional statement is true, its contrapositive is guaranteed to be true. Conversely and inversely, the converse and inverse do NOT necessarily share the same truth value as the original statement.

  - id: q-geometry-logic-and-reasoning-0004
    type: which-is-true
    difficulty: easy
    stem: |
      What constitutes a valid counterexample to a conditional statement "If $P$, then $Q$"?
    choices:
      - text: "A specific case where hypothesis $P$ is true, but conclusion $Q$ is false."
        correct: true
      - text: "A specific case where hypothesis $P$ is false, and conclusion $Q$ is false."
      - text: "A specific case where hypothesis $P$ is true, and conclusion $Q$ is true."
      - text: "A specific case where hypothesis $P$ is false, but conclusion $Q$ is true."
    explanation: |
      To disprove a conditional statement "If P, then Q" with a counterexample, you must provide an instance where the hypothesis P is satisfied (true), but the conclusion Q fails (false).

      Common Trap: Trying to use a case where hypothesis P is false, which cannot serve as a counterexample because the statement is vacuously true when P is false.

  - id: q-geometry-logic-and-reasoning-0005
    type: which-is-true
    difficulty: easy
    stem: |
      Given the true premises:
      1. "If an angle measures $90^\circ$, then it is a right angle."
      2. "If an angle is a right angle, then its adjacent supplementary angle also measures $90^\circ$."
      What conclusion logically follows by the Law of Syllogism?
    choices:
      - text: "If an angle measures $90^\circ$, then its adjacent supplementary angle also measures $90^\circ$."
        correct: true
      - text: "If an angle is a right angle, then it measures $90^\circ$."
      - text: "If an angle does not measure $90^\circ$, then it is not a right angle."
      - text: "No conclusion can be drawn."
    explanation: |
      The Law of Syllogism states that if "If P, then Q" and "If Q, then R" are both true statements, then "If P, then R" is also a true statement.

      - P = "an angle measures $90^\circ$"
      - Q = "it is a right angle"
      - R = "its adjacent supplementary angle measures $90^\circ$"
      - Conclusion (If P, then R): "If an angle measures $90^\circ$, then its adjacent supplementary angle also measures $90^\circ$."

  - id: q-geometry-logic-and-reasoning-0006
    type: which-is-true
    difficulty: medium
    stem: |
      Consider the statement: "If a polygon is a regular hexagon, then the sum of its exterior angles is $360^\circ$." Which evaluation of this statement and its converse is correct?
    choices:
      - text: "The original statement is true, but its converse is false."
        correct: true
      - text: "The original statement and its converse are both true."
      - text: "The original statement is false, but its converse is true."
      - text: "The original statement and its converse are both false."
    explanation: |
      1. Original statement: TRUE. All convex polygons (including regular hexagons) have exterior angle sum equal to $360^\circ$.
      2. Converse: "If the sum of the exterior angles of a polygon is $360^\circ$, then it is a regular hexagon."
      3. Evaluating converse: FALSE. EVERY convex polygon (e.g. triangles, rectangles, pentagons) has exterior angle sum $360^\circ$, so it does not have to be a regular hexagon.

      Common Trap: Assuming the converse of a true statement is automatically true.

  - id: q-geometry-logic-and-reasoning-0007
    type: which-is-true
    difficulty: medium
    stem: |
      Consider the conditional: "If a triangle is equilateral, then it is isosceles." A student claims that the inverse statement "If a triangle is not equilateral, then it is not isosceles" is true. Which triangle serves as a counterexample to the student's claim?
    choices:
      - text: "An isosceles triangle with side lengths $5\text{ cm}, 5\text{ cm}, 8\text{ cm}$."
        correct: true
      - text: "An equilateral triangle with side lengths $6\text{ cm}, 6\text{ cm}, 6\text{ cm}$."
      - text: "A scalene triangle with side lengths $3\text{ cm}, 4\text{ cm}, 5\text{ cm}$."
      - text: "A right triangle with legs $3\text{ cm}$ and $4\text{ cm}$."
    explanation: |
      The student's inverse claim is: "If a triangle is not equilateral (P is true), then it is not isosceles (Q is false)."

      A counterexample requires a triangle that IS NOT equilateral, but IS isosceles.
      - A triangle with sides $5, 5, 8$ has two equal sides, so it IS isosceles.
      - It does not have three equal sides, so it IS NOT equilateral.
      - Therefore, it satisfies the hypothesis (not equilateral) while disproving the conclusion (it is isosceles), serving as a valid counterexample.

  - id: q-geometry-logic-and-reasoning-0008
    type: which-is-true
    difficulty: medium
    stem: |
      Under what logical condition is a biconditional statement ("$P$ if and only if $Q$") considered true?
    choices:
      - text: "When both the conditional statement ($P \implies Q$) and its converse ($Q \implies P$) are true."
        correct: true
      - text: "Whenever the conditional statement ($P \implies Q$) is true, regardless of the converse."
      - text: "When the conditional statement is true and the inverse statement is false."
      - text: "Only when both $P$ and $Q$ are false."
    explanation: |
      A biconditional statement "$P \iff Q$" ("P if and only if Q") is defined as the conjunction of two conditionals: $(P \implies Q) \land (Q \implies P)$. Thus, it is true if and only if both the conditional and its converse are true (meaning $P$ and $Q$ have identical truth values).

  - id: q-geometry-logic-and-reasoning-0009
    type: which-is-true
    difficulty: medium
    stem: |
      Given the true conditional statement: "If two lines are perpendicular, then they intersect at a $90^\circ$ angle." Which option correctly states its inverse and evaluates its truth value in plane geometry?
    choices:
      - text: "Inverse: 'If two lines are not perpendicular, then they do not intersect at a $90^\circ$ angle.' (True)"
        correct: true
      - text: "Inverse: 'If two lines do not intersect at a $90^\circ$ angle, then they are not perpendicular.' (True)"
      - text: "Inverse: 'If two lines intersect at a $90^\circ$ angle, then they are perpendicular.' (False)"
      - text: "Inverse: 'If two lines are not perpendicular, then they do not intersect at a $90^\circ$ angle.' (False)"
    explanation: |
      1. To form the inverse of "If P, then Q", negate both parts without swapping: "If not P, then not Q".
      2. Inverse: "If two lines are not perpendicular, then they do not intersect at a $90^\circ$ angle."
      3. Truth value: In Euclidean plane geometry, non-perpendicular lines by definition do not intersect at $90^\circ$, so the inverse statement is TRUE.

  - id: q-geometry-logic-and-reasoning-0010
    type: which-is-true
    difficulty: medium
    stem: |
      Given premise: "If a quadrilateral is a rhombus, then its diagonals are perpendicular."
      Fact: Quadrilateral $ABCD$ has perpendicular diagonals.
      What valid conclusion, if any, can be drawn regarding quadrilateral $ABCD$?
    choices:
      - text: "No valid conclusion can be drawn that $ABCD$ is a rhombus."
        correct: true
      - text: "Quadrilateral $ABCD$ must be a rhombus."
      - text: "Quadrilateral $ABCD$ must be a square."
      - text: "Quadrilateral $ABCD$ cannot be a rhombus."
    explanation: |
      The premise is "If P (rhombus), then Q (perpendicular diagonals)".
      Given Q is true (perpendicular diagonals), concluding P (must be rhombus) is the logical fallacy of Affirming the Consequent (or Converse Error).

      Kites and non-equilateral quadrilaterals can also have perpendicular diagonals without being rhombuses. Therefore, no valid conclusion can be drawn.

  - id: q-geometry-logic-and-reasoning-0011
    type: which-is-true
    difficulty: hard
    stem: |
      What is the contrapositive of the geometric statement: "If two same-side interior angles sum to $180^\circ$, then the two intersected lines are parallel"?
    choices:
      - text: "If two intersected lines are not parallel, then the two same-side interior angles do not sum to $180^\circ$."
        correct: true
      - text: "If two intersected lines are parallel, then the two same-side interior angles sum to $180^\circ$."
      - text: "If two same-side interior angles do not sum to $180^\circ$, then the two intersected lines are not parallel."
      - text: "If two same-side interior angles sum to $180^\circ$, then the two intersected lines are not parallel."
    explanation: |
      The contrapositive negates AND swaps hypothesis P and conclusion Q.

      - P = "two same-side interior angles sum to $180^\circ$"
      - Q = "the two intersected lines are parallel"
      - Not Q = "the two intersected lines are not parallel"
      - Not P = "the two same-side interior angles do not sum to $180^\circ$"
      - Contrapositive: "If two intersected lines are not parallel, then the two same-side interior angles do not sum to $180^\circ$."

  - id: q-geometry-logic-and-reasoning-0012
    type: which-is-true
    difficulty: hard
    stem: |
      Consider the statement: "If a quadrilateral has diagonals of equal length, then it is a rectangle." Which of the following quadrilaterals serves as a counterexample proving this statement FALSE?
    choices:
      - text: "An isosceles trapezoid"
        correct: true
      - text: "A square"
      - text: "A non-rectangular rhombus"
      - text: "A general parallelogram"
    explanation: |
      A valid counterexample must have equal diagonals (P is true) but NOT be a rectangle (Q is false).

      - An isosceles trapezoid has diagonals of equal length ($AC = BD$), satisfying the hypothesis.
      - However, an isosceles trapezoid has only one pair of parallel sides, so it is NOT a rectangle.
      - Thus, an isosceles trapezoid disproves the statement.

  - id: q-geometry-logic-and-reasoning-0013
    type: which-is-true
    difficulty: hard
    stem: |
      What is the logical negation of the universal statement: "All triangles have at least one acute angle"?
    choices:
      - text: "There exists at least one triangle that has no acute angles."
        correct: true
      - text: "No triangles have acute angles."
      - text: "All triangles have no acute angles."
      - text: "Some triangles have acute angles."
    explanation: |
      The negation of a universal statement "All X have property P" is an existential statement "There exists at least one X that does NOT have property P".

      - Universal statement: "All triangles have at least one acute angle."
      - Logical negation: "There exists at least one triangle that has no acute angles."

      Common Trap: Confusing negation with opposite universal ("No triangles have acute angles").

  - id: q-geometry-logic-and-reasoning-0014
    type: which-is-true
    difficulty: hard
    stem: |
      Given the true premises:
      1. "If line $L_1 \perp L_2$, then $\angle 1 = 90^\circ$."
      2. "If line $L_2$ is not parallel to line $L_3$, then $\angle 1 \ne 90^\circ$."
      What valid conclusion logically follows if line $L_1 \perp L_2$?
    choices:
      - text: "Line $L_2$ is parallel to line $L_3$."
        correct: true
      - text: "Line $L_2$ is not parallel to line $L_3$."
      - text: "Line $L_1$ is parallel to line $L_3$."
      - text: "No conclusion can be drawn."
    explanation: |
      1. Premise 2 contrapositive: "If $\angle 1 = 90^\circ$, then line $L_2$ IS parallel to line $L_3$."
      2. Chain premises together:
         $$L_1 \perp L_2 \implies \angle 1 = 90^\circ \implies L_2 \parallel L_3$$
      3. Since $L_1 \perp L_2$ is given, by Law of Detachment, line $L_2$ is parallel to line $L_3$.

  - id: q-geometry-logic-and-reasoning-0015
    type: which-is-true
    difficulty: hard
    stem: |
      Which pair of logical statements ALWAYS share the exact same truth value as each other for any conditional statement?
    choices:
      - text: "The converse of the conditional statement and the inverse of the conditional statement."
        correct: true
      - text: "The original conditional statement and its converse."
      - text: "The original conditional statement and its inverse."
      - text: "The converse of the conditional statement and the contrapositive of the conditional statement."
    explanation: |
      - Original conditional: $P \implies Q$
      - Converse: $Q \implies P$
      - Inverse: $\neg P \implies \neg Q$
      - The inverse ($\neg P \implies \neg Q$) is the contrapositive of the converse ($Q \implies P$).
      - Since any statement and its contrapositive are logically equivalent, the converse and the inverse ALWAYS share the exact same truth value.
