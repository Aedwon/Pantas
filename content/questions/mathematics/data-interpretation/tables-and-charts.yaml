meta:
  subject: mathematics
  topic: data-interpretation
  subtopic: tables-and-charts
  exams: [cse-pro]
questions:
  - id: q-data-interpretation-tables-and-charts-0001
    type: word-problem
    difficulty: easy
    stem: |
      Consider the following hypothetical table showing monthly office supply expenditures (in PHP):

      | Month | Paper | Ink | Furniture |
      | :--- | :--- | :--- | :--- |
      | January | 12000 | 18000 | 5000 |
      | February | 15000 | 22000 | 8000 |
      | March | 11000 | 19000 | 4000 |

      What was the total expenditure on Paper across the three months?
    choices:
      - text: '$38000$'
        correct: true
      - text: '$27000$'
        rationale: |
          This omits March Paper. The first two months have been included. Check all requested months.
      - text: '$26000$'
        rationale: |
          This omits January Paper. The later two months have been included. Check all requested months.
      - text: '$46000$'
        rationale: |
          This uses March Ink instead of March Paper. The Ink entry is adjacent to the requested column. Check each column heading.
    explanation: |
      Read the Paper column for all three months. Its total is $12000+15000+11000=38000$ pesos.

  - id: q-data-interpretation-tables-and-charts-0002
    type: word-problem
    difficulty: easy
    stem: |
      Consider the following hypothetical table showing monthly office supply expenditures (in PHP):

      | Month | Paper | Ink | Furniture |
      | :--- | :--- | :--- | :--- |
      | January | 12000 | 18000 | 5000 |
      | February | 15000 | 22000 | 8000 |
      | March | 11000 | 19000 | 4000 |

      What was the total expenditure for all three supply categories combined in February?
    choices:
      - text: '$45000$'
        correct: true
      - text: '$37000$'
        rationale: |
          This omits Furniture. The two largest categories have been included. Check all three category headings.
      - text: '$30000$'
        rationale: |
          This omits Paper. The two rightmost categories have been included. Check all three category headings.
      - text: '$23000$'
        rationale: |
          This omits Ink. The first and last categories have been included. Check all three category headings.
    explanation: |
      Read the February row across all three categories. Its total is $15000+22000+8000=45000$ pesos.

  - id: q-data-interpretation-tables-and-charts-0003
    type: which-is-true
    difficulty: medium
    stem: |
      Consider the following hypothetical table of regional agricultural crop yields (in metric tons):

      | Region | Rice | Corn | Sugarcane |
      | :--- | :--- | :--- | :--- |
      | Region A | 450 | 300 | 600 |
      | Region B | 520 | 280 | 750 |
      | Region C | 380 | 410 | 500 |

      Which region produced the highest total metric tons across all three crops?
    choices:
      - text: 'Region B'
        correct: true
      - text: 'Region A'
        rationale: |
          This uses Region C rice and sugarcane values in the Region B total. The neighboring row has the same crop headings. Check that every row total uses one region's entries.
      - text: 'Region C'
        rationale: |
          This picks the region with the largest Corn yield. Corn is one of the three crops. Check that all crops contribute to the regional total.
      - text: 'Cannot determine without a Total column.'
        rationale: |
          This treats the absent total column as missing data. No ready-made total is printed. Check whether the supplied entries can be added.
    explanation: |
      The regional totals are $450+300+600=1350$ for A, $520+280+750=1550$ for B, and $380+410+500=1290$ for C. The largest total is Region B's $1550$ metric tons.

  - id: q-data-interpretation-tables-and-charts-0004
    type: word-problem
    difficulty: easy
    stem: |
      Consider the following hypothetical table of regional agricultural crop yields (in metric tons):

      | Region | Rice | Corn | Sugarcane |
      | :--- | :--- | :--- | :--- |
      | Region A | 450 | 300 | 600 |
      | Region B | 520 | 280 | 750 |
      | Region C | 380 | 410 | 500 |

      By how many metric tons does the combined Rice yield exceed the combined Corn yield?
    choices:
      - text: '$360$ metric tons'
        correct: true
      - text: '$990$ metric tons'
        rationale: |
          This reports the Corn total. That column sum is needed first. Check whether a total or a difference is requested.
      - text: '$1350$ metric tons'
        rationale: |
          This reports the Rice total. That column sum is needed first. Check whether a total or a difference is requested.
      - text: '$2340$ metric tons'
        rationale: |
          This adds both category totals instead of subtracting. Both totals are relevant. Check the word exceed.
    explanation: |
      Rice totals $450+520+380=1350$ metric tons. Corn totals $300+280+410=990$. Subtract: $1350-990=360$ metric tons.

  - id: q-data-interpretation-tables-and-charts-0005
    type: word-problem
    difficulty: medium
    stem: |
      Consider the following hypothetical table of quarterly municipal revenue (in million PHP):

      | Quarter | Tax | Licenses | Property |
      | :--- | :--- | :--- | :--- |
      | Q1 | 14 | 6 | 10 |
      | Q2 | 18 | 8 | 12 |
      | Q3 | 15 | 5 | 11 |
      | Q4 | 21 | 9 | 15 |

      What is the average quarterly Licenses revenue, in million pesos?
    choices:
      - text: '$7$ million pesos'
        correct: true
      - text: '$28$ million pesos'
        rationale: |
          This reports the four-quarter total. The total is needed before averaging. Check whether total or average is requested.
      - text: '$8$ million pesos'
        rationale: |
          This reports only Q2 Licenses revenue. Eight is one of the four entries. Check all four quarters.
      - text: '$1.75$ million pesos'
        rationale: |
          This divides the quarterly average by four again. The average formula does divide by four. Check that averaging divides only once.
    explanation: |
      The four Licenses values total $6+8+5+9=28$ million pesos. Divide by four quarters: $28\div4=7$ million pesos per quarter.

  - id: q-data-interpretation-tables-and-charts-0006
    type: word-problem
    difficulty: medium
    stem: |
      Consider the following hypothetical table of quarterly municipal revenue (in million PHP):

      | Quarter | Tax | Licenses | Property |
      | :--- | :--- | :--- | :--- |
      | Q1 | 14 | 6 | 10 |
      | Q2 | 18 | 8 | 12 |
      | Q3 | 15 | 5 | 11 |
      | Q4 | 21 | 9 | 15 |

      In pesos, by how much does Q4 Tax revenue exceed Q1 Tax revenue?
    choices:
      - text: '$7000000$ pesos'
        correct: true
      - text: '$5000000$ pesos'
        rationale: |
          This compares Property rather than Tax. Property also rises over these quarters. Check the requested revenue heading.
      - text: '$3000000$ pesos'
        rationale: |
          This compares Licenses rather than Tax. Licenses also rises over these quarters. Check the requested revenue heading.
      - text: '$35000000$ pesos'
        rationale: |
          This adds the two Tax amounts instead of finding their difference. Both Tax entries are relevant. Check whether the question asks for a difference.
    explanation: |
      The Tax values are $21$ and $14$ million pesos. The difference is $21-14=7$ million pesos. Convert the unit: $7(1000000)=7000000$ pesos.

  - id: q-data-interpretation-tables-and-charts-0007
    type: word-problem
    difficulty: easy
    stem: |
      Consider the following hypothetical table of civil service exam applicants per testing center:

      | Testing Center | Male | Female |
      | :--- | :--- | :--- |
      | Manila | 1200 | 1500 |
      | Cebu | 800 | 950 |
      | Davao | 650 | 750 |

      Across all three centers, how many more female applicants than male applicants are listed?
    choices:
      - text: '$550$'
        correct: true
      - text: '$3200$'
        rationale: |
          This reports female applicants alone. That total is needed first. Check that the requested difference uses both groups.
      - text: '$2650$'
        rationale: |
          This reports male applicants alone. That total is needed first. Check that the requested difference uses both groups.
      - text: '$-550$'
        rationale: |
          This reverses the subtraction order. Both totals are correctly found. Check which group exceeds the other.
    explanation: |
      Female applicants total $1500+950+750=3200$. Male applicants total $1200+800+650=2650$. The difference is $3200-2650=550$.

  - id: q-data-interpretation-tables-and-charts-0008
    type: word-problem
    difficulty: medium
    stem: |
      Consider the following hypothetical table of civil service exam applicants per testing center:

      | Testing Center | Male | Female |
      | :--- | :--- | :--- |
      | Manila | 1200 | 1500 |
      | Cebu | 800 | 950 |
      | Davao | 650 | 750 |

      How many more total applicants attended the Manila testing center than the Davao testing center?
    choices:
      - text: '$1300$'
        correct: true
      - text: '$550$'
        rationale: |
          This compares only male applicants. The male column does give a difference. Check that total includes both genders.
      - text: '$750$'
        rationale: |
          This compares only female applicants. The female column does give a difference. Check that total includes both genders.
      - text: '$4100$'
        rationale: |
          This adds the two center totals. Both centers must be read. Check the phrase how many more.
    explanation: |
      Manila lists $1200+1500=2700$ applicants. Davao lists $650+750=1400$. Their difference is $2700-1400=1300$.

  - id: q-data-interpretation-tables-and-charts-0009
    type: word-problem
    difficulty: easy
    stem: |
      Consider the following hypothetical table of public library book circulation per category:

      | Month | Fiction | Non-Fiction | Reference |
      | :--- | :--- | :--- | :--- |
      | April | 400 | 250 | 150 |
      | May | 480 | 310 | 190 |
      | June | 520 | 340 | 200 |

      Across April and May combined, how much greater is Fiction circulation than Non-Fiction circulation?
    choices:
      - text: '$320$'
        correct: true
      - text: '$880$'
        rationale: |
          This reports the combined Fiction count. That sum is needed first. Check whether the question asks for a difference.
      - text: '$560$'
        rationale: |
          This reports the combined Non-Fiction count. That sum is needed first. Check whether the question asks for a difference.
      - text: '$170$'
        rationale: |
          This calculates only the May difference. May is one of the requested months. Check both requested months.
    explanation: |
      Fiction circulation in April and May is $400+480=880$. Non-Fiction circulation is $250+310=560$. The difference is $880-560=320$.

  - id: q-data-interpretation-tables-and-charts-0010
    type: word-problem
    difficulty: medium
    stem: |
      Consider the following hypothetical table of public library book circulation per category:

      | Month | Fiction | Non-Fiction | Reference |
      | :--- | :--- | :--- | :--- |
      | April | 400 | 250 | 150 |
      | May | 480 | 310 | 190 |
      | June | 520 | 340 | 200 |

      How many June circulations are listed outside the Reference category?
    choices:
      - text: '$860$'
        correct: true
      - text: '$1060$'
        rationale: |
          This includes Reference in the total. The full row is a meaningful total. Check which category is excluded.
      - text: '$720$'
        rationale: |
          This combines Fiction with Reference instead of Non-Fiction. Reference is a neighboring category. Check the two included category headings.
      - text: '$540$'
        rationale: |
          This combines Non-Fiction with Reference instead of Fiction. Reference is a neighboring category. Check the two included category headings.
    explanation: |
      Outside Reference, June lists Fiction and Non-Fiction. Add those entries: $520+340=860$ circulations.

  - id: q-data-interpretation-tables-and-charts-0011
    type: which-is-true
    difficulty: easy
    stem: |
      Consider the following hypothetical table of hospital emergency admissions per department:

      | Shift | Medical | Surgical | Pediatric |
      | :--- | :--- | :--- | :--- |
      | Morning | 45 | 30 | 25 |
      | Afternoon | 60 | 40 | 35 |
      | Night | 35 | 20 | 15 |

      Which department has the largest increase in admissions from Morning to Afternoon?
    choices:
      - text: 'Medical'
        correct: true
      - text: 'Surgical'
        rationale: |
          This focuses on Surgical's ten-person rise without comparing Medical. Ten is a real increase in that department. Compare every department's change.
      - text: 'Pediatric'
        rationale: |
          This focuses on Pediatric's ten-person rise without comparing Medical. Ten is a real increase in that department. Compare every department's change.
      - text: 'All three increases are equal.'
        rationale: |
          This extends the matching Surgical and Pediatric increases to all three departments. Two changes do match. Check Medical's change too.
    explanation: |
      Medical rises by $60-45=15$, Surgical by $40-30=10$, and Pediatric by $35-25=10$. The largest increase is Medical's $15$.

  - id: q-data-interpretation-tables-and-charts-0012
    type: which-is-true
    difficulty: medium
    stem: |
      Consider the following hypothetical table of hospital emergency admissions per department:

      | Shift | Medical | Surgical | Pediatric |
      | :--- | :--- | :--- | :--- |
      | Morning | 45 | 30 | 25 |
      | Afternoon | 60 | 40 | 35 |
      | Night | 35 | 20 | 15 |

      Which shift has the largest Surgical admission count?
    choices:
      - text: 'Afternoon'
        correct: true
      - text: 'Morning'
        rationale: |
          This reports the first shift without checking the larger entry. Morning is listed first. Compare all entries in the Surgical column.
      - text: 'Night'
        rationale: |
          This reports the lowest entry instead of the highest. Night is the final row. Check whether largest or smallest is requested.
      - text: 'Morning and Night combined'
        rationale: |
          This combines two shifts before comparing with a single shift. The combined total is larger than either component. Check that one shift is requested.
    explanation: |
      The Surgical counts are $30$ in Morning, $40$ in Afternoon, and $20$ at Night. The largest is the Afternoon count of $40$.

  - id: q-data-interpretation-tables-and-charts-0013
    type: direct-computation
    difficulty: easy
    stem: |
      A hypothetical table lists office purchases in thousands of pesos: chairs $12$, desks $8$, and lamps $5$. What is the combined expense in pesos?
    choices:
      - text: '$25000$'
        correct: true
      - text: '$25$'
        rationale: |
          This adds correctly but ignores the thousand-peso unit. The printed total is twenty-five. Check the unit caption.
      - text: '$20000$'
        rationale: |
          This omits lamps. Chairs and desks are the two larger entries. Check every requested category.
      - text: '$250000$'
        rationale: |
          This multiplies by ten thousand instead of one thousand. The unit requires a scale conversion. Check the stated unit exactly.
    explanation: |
      Add the entries: $12+8+5=25$ thousands. Multiply by $1000$ to get $25000$ pesos.
    approved: false

  - id: q-data-interpretation-tables-and-charts-0014
    type: word-problem
    difficulty: medium
    stem: |
      A hypothetical monthly sales table, in units, reads January $40$, February $55$, March $50$, April $70$. Which adjacent-month interval has the largest increase?
    choices:
      - text: 'March to April'
        correct: true
      - text: 'January to February'
        rationale: |
          This chooses the first increase without comparing the last. Fifteen is a real increase. Check every adjacent pair.
      - text: 'February to March'
        rationale: |
          This treats a decrease as an increase. Both values belong to adjacent months. Check the sign of new minus old.
      - text: 'January to April'
        rationale: |
          This compares nonadjacent months. Their overall rise is larger. Check the requested adjacent intervals.
    explanation: |
      The adjacent changes are $55-40=15$, $50-55=-5$, and $70-50=20$. The largest increase is $20$, from March to April.
    approved: false

  - id: q-data-interpretation-tables-and-charts-0015
    type: word-problem
    difficulty: medium
    stem: |
      A hypothetical delivery table lists Monday $18$ parcels, Tuesday $24$, and Wednesday an unknown count. The three-day total is $65$. How many parcels were delivered on Wednesday?
    choices:
      - text: '$23$'
        correct: true
      - text: '$42$'
        rationale: |
          This reports the known-day subtotal. That amount is needed first. Check whether the missing day or the known days are requested.
      - text: '$47$'
        rationale: |
          This subtracts only Monday from the total. Monday is the first known day. Check both known counts.
      - text: '$41$'
        rationale: |
          This subtracts only Tuesday from the total. Tuesday is one known day. Check both known counts.
    explanation: |
      The known days total $18+24=42$ parcels. Subtract this from the complete total: $65-42=23$ parcels.
    approved: false

  - id: q-data-interpretation-tables-and-charts-0016
    type: error-spotting
    difficulty: hard
    stem: |
      A hypothetical admissions table lists January $0$, February $12$, and March $18$. A student averages only the two nonzero months and reports $15$. What is the average across all three months?
    choices:
      - text: '$10$'
        correct: true
      - text: '$15$'
        rationale: |
          This leaves the zero month out of the month count. Zero does not change the total. Check that it still represents a recorded period.
      - text: '$30$'
        rationale: |
          This reports the total rather than the average. Summing is the first step. Check the number of months.
      - text: '$6$'
        rationale: |
          This divides the March count by three and omits February. March has the largest value. Check all entries before dividing.
    explanation: |
      The three-month total is $0+12+18=30$. All three recorded months count, including the zero month. Divide by $3$ to get $10$ admissions per month.
    approved: false

  - id: q-data-interpretation-tables-and-charts-0017
    type: error-spotting
    difficulty: hard
    stem: |
      A hypothetical table is labeled Revenue, in million pesos. Its two entries are $3.2$ and $4.8$. A student adds them and reports eight thousand pesos. What is the correct total?
    choices:
      - text: '$8000000$ pesos'
        correct: true
      - text: '$8000$ pesos'
        rationale: |
          This changes the caption from millions to thousands. Both units are common in finance tables. Check the printed unit.
      - text: '$8$ pesos'
        rationale: |
          This ignores the scale after adding. Eight is the correct table-unit total. Check the caption before reporting pesos.
      - text: '$80000000$ pesos'
        rationale: |
          This uses ten million as the scale instead of one million. Large place values are easy to misread. Check that a million has six zeros.
    explanation: |
      The sum is $3.2+4.8=8$. Each unit in the table is a million pesos. The total is $8(1000000)=8000000$ pesos.
    approved: false

  - id: q-data-interpretation-tables-and-charts-0018
    type: which-is-true
    difficulty: hard
    stem: |
      A hypothetical chart has a vertical axis labeled Visitors, in hundreds. A bar reaches $2.4$. Which statement is correct?
    choices:
      - text: 'It represents $240$ visitors.'
        correct: true
      - text: 'It represents $2.4$ visitors.'
        rationale: |
          This reads the bar value without its scale. The number two point four is visible. Check the axis unit.
      - text: 'It represents $24$ visitors.'
        rationale: |
          This uses tens instead of hundreds. A scale multiplication is needed. Check the number of zeros in one hundred.
      - text: 'It represents $2400$ visitors.'
        rationale: |
          This uses thousands instead of hundreds. Both are possible chart units. Check the actual axis label.
    explanation: |
      The axis unit is one hundred visitors. Multiply $2.4$ by $100$ to get $240$ visitors.
    approved: false

  - id: q-data-interpretation-tables-and-charts-0019
    type: which-is-true
    difficulty: exam
    stem: |
      A hypothetical production table lists Morning $120$, Afternoon $150$, and Night $90$ units. Another column lists workers as $6,10,5$ respectively. Which statement follows directly from the production totals?
    choices:
      - text: 'Afternoon has the most units.'
        correct: true
      - text: 'Night produced the most units.'
        rationale: |
          This chooses the shift with the fewest workers instead of the most produced units. Five is the smallest worker count. Check which column is requested.
      - text: 'Every shift produced $120$ units.'
        rationale: |
          This replaces individual totals with their average. The three-shift mean is one hundred twenty. Check that the statement is about each shift's actual total.
      - text: 'Morning produced the most units.'
        rationale: |
          This uses output per worker rather than total production. Morning has the highest rate at twenty units per worker. Check which quantity the question asks to compare.
    explanation: |
      Compare only the production column: $120,150,90$. Its largest value is $150$, which belongs to Afternoon.
    approved: false

  - id: q-data-interpretation-tables-and-charts-0020
    type: word-problem
    difficulty: exam
    stem: |
      A hypothetical table lists tasks completed by Teams A, B, and C in two weeks: A has $30,45$, B has $40,50$, and C has $25,40$. Which teams tie for the largest absolute increase?
    choices:
      - text: 'Teams A and C'
        correct: true
      - text: 'Teams A and B'
        rationale: |
          This includes B because it has the largest final total. Both final totals are high. Check changes rather than final levels.
      - text: 'Teams B and C'
        rationale: |
          This includes B because it completes the most tasks in week two. That is a valid maximum in another comparison. Check the week-to-week increases.
      - text: 'All three teams'
        rationale: |
          This assumes every increase has the same size. All three teams do improve. Check the numerical differences.
    explanation: |
      The increases are $45-30=15$ for A, $50-40=10$ for B, and $40-25=15$ for C. The largest increase is $15$, shared by A and C.
    approved: false
