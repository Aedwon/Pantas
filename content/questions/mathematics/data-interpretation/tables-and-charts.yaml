meta:
  subject: mathematics
  topic: data-interpretation
  subtopic: tables-and-charts
  exams:
    - cse-pro
questions:
  - id: q-data-interpretation-tables-and-charts-0001
    type: single_choice
    difficulty: easy
    stem: |
      Consider the following table showing monthly office supply expenditures (in PHP):

      | Month | Paper | Ink | Furniture |
      | :--- | :--- | :--- | :--- |
      | January | 12000 | 18000 | 5000 |
      | February | 15000 | 22000 | 8000 |
      | March | 11000 | 19000 | 4000 |

      What was the total expenditure on Paper across the three months?
    choices:
      - text: '$38,000$'
        correct: true
      - text: '$27,000$'
        rationale: |
          You added January and February Paper but left out March Paper.
          Include all three months: $12{,}000 + 15{,}000 + 11{,}000$.
      - text: '$26,000$'
        rationale: |
          You added February and March Paper but left out January Paper.
          January adds another $12{,}000$ to the Paper total.
      - text: '$46,000$'
        rationale: |
          You used March Ink $19{,}000$ instead of March Paper $11{,}000$.
          Stay in the Paper column for every month.
    explanation: |
      Summing Paper expenditures across the three months:
      $$\text{Total} = 12000 + 15000 + 11000 = 38000\text{ PHP}$$

  - id: q-data-interpretation-tables-and-charts-0002
    type: single_choice
    difficulty: easy
    stem: |
      Refer to the supply expenditure table above. What was the total expenditure for all three supply categories combined in February?
    choices:
      - text: '$45,000$'
        correct: true
      - text: '$37,000$'
        rationale: |
          You added February Paper and Ink but left out Furniture. Add the
          February Furniture amount of $8{,}000$.
      - text: '$30,000$'
        rationale: |
          You added February Ink and Furniture but left out Paper. Add the
          February Paper amount of $15{,}000$.
      - text: '$23,000$'
        rationale: |
          You added February Paper and Furniture but left out Ink. Add the
          February Ink amount of $22{,}000$.
    explanation: |
      Summing all categories for February:
      $$\text{Total} = 15000 + 22000 + 8000 = 45000\text{ PHP}$$

  - id: q-data-interpretation-tables-and-charts-0003
    type: single_choice
    difficulty: medium
    stem: |
      Consider the following table of regional agricultural crop yields (in metric tons):

      | Region | Rice | Corn | Sugarcane |
      | :--- | :--- | :--- | :--- |
      | Region A | 450 | 300 | 600 |
      | Region B | 520 | 280 | 750 |
      | Region C | 380 | 410 | 500 |

      Which region produced the highest total metric tons across all three crops?
    choices:
      - text: Region B
        correct: true
      - text: Region A
        rationale: |
          You may have focused on one crop, but you need the total across all three crops. Region A totals 1,350, which is less than Region B.
      - text: Region C
        rationale: |
          You may have noticed Region C leads in corn, but the question asks for the full row total. Region C totals 1,290.
      - text: All equal
        rationale: |
          You treated the rows as balanced without adding them. The totals are different, and Region B is highest.
    explanation: |
      Calculate total yield per region:
      $$\text{Region A} = 450 + 300 + 600 = 1350$$
      $$\text{Region B} = 520 + 280 + 750 = 1550$$
      $$\text{Region C} = 380 + 410 + 500 = 1290$$
      Region B produced the highest total yield ($1,550$ metric tons).

  - id: q-data-interpretation-tables-and-charts-0004
    type: single_choice
    difficulty: easy
    stem: |
      Refer to the agricultural crop yield table above. What is the total combined yield of Corn across Regions A, B, and C?
    choices:
      - text: '$990\text{ metric tons}$'
        correct: true
      - text: '$580\text{ metric tons}$'
        rationale: |
          You added Corn for Regions A and B but left out Region C. Region C
          contributes another 410 metric tons.
      - text: '$1,350\text{ metric tons}$'
        rationale: |
          You used the total for Region A instead of the Corn column. Region
          A has $450 + 300 + 600 = 1{,}350$ metric tons.
      - text: '$690\text{ metric tons}$'
        rationale: |
          You added Corn for Regions B and C but left out Region A. Region A
          contributes another 300 metric tons.
    explanation: |
      Summing Corn yields:
      $$\text{Total Corn} = 300 + 280 + 410 = 990\text{ metric tons}$$

  - id: q-data-interpretation-tables-and-charts-0005
    type: single_choice
    difficulty: medium
    stem: |
      Consider the following table of quarterly municipal revenue (in million PHP):

      | Quarter | Tax | Licenses | Property |
      | :--- | :--- | :--- | :--- |
      | Q1 | 14 | 6 | 10 |
      | Q2 | 18 | 8 | 12 |
      | Q3 | 15 | 5 | 11 |
      | Q4 | 21 | 9 | 15 |

      What was the total municipal revenue collected in Q4?
    choices:
      - text: '$45\text{ million PHP}$'
        correct: true
      - text: '$36\text{ million PHP}$'
        rationale: |
          You added Q4 Tax and Property but left out Licenses. Add the Q4
          Licenses amount of 9 million PHP.
      - text: '$30\text{ million PHP}$'
        rationale: |
          You added only Q4 Tax and Licenses. The missing Q4 Property value is
          15 million PHP.
      - text: '$24\text{ million PHP}$'
        rationale: |
          You added Q4 Licenses and Property but left out Tax. Add the Q4 Tax
          amount of 21 million PHP.
    explanation: |
      Summing revenue streams for Q4:
      $$\text{Total Q4} = 21 + 9 + 15 = 45\text{ million PHP}$$

  - id: q-data-interpretation-tables-and-charts-0006
    type: single_choice
    difficulty: medium
    stem: |
      Refer to the quarterly revenue table above. By how much did total Tax revenue in Q4 exceed total Tax revenue in Q1?
    choices:
      - text: '$7\text{ million PHP}$'
        correct: true
      - text: '$5\text{ million PHP}$'
        rationale: |
          You compared Property revenue instead of Tax revenue. Property rose
          from 10 to 15, but Tax rose from 14 to 21.
      - text: '$3\text{ million PHP}$'
        rationale: |
          You compared Licenses instead of Tax. Licenses rose from 6 to 9,
          while Tax rose from 14 to 21.
      - text: '$35\text{ million PHP}$'
        rationale: |
          You added Q1 and Q4 Tax revenue instead of finding how much Q4
          exceeded Q1. Subtract $21 - 14$ rather than add them.
    explanation: |
      Subtract Q1 Tax revenue from Q4 Tax revenue:
      $$\text{Difference} = 21 - 14 = 7\text{ million PHP}$$

  - id: q-data-interpretation-tables-and-charts-0007
    type: single_choice
    difficulty: easy
    stem: |
      Consider the following table of civil service exam applicants per testing center:

      | Testing Center | Male | Female |
      | :--- | :--- | :--- |
      | Manila | 1200 | 1500 |
      | Cebu | 800 | 950 |
      | Davao | 650 | 750 |

      What was the total number of female applicants across all three testing centers?
    choices:
      - text: '$3,200$'
        correct: true
      - text: '$2,450$'
        rationale: |
          You added female applicants in Manila and Cebu but left out Davao.
          Add Davao's 750 female applicants.
      - text: '$1,700$'
        rationale: |
          You added female applicants in Cebu and Davao but left out Manila.
          Manila adds 1,500 female applicants.
      - text: '$5,850$'
        rationale: |
          You added every applicant in the table. $5{,}850$ is the grand total
          of male and female applicants across all three centers.
    explanation: |
      Summing female applicants:
      $$\text{Total Female} = 1500 + 950 + 750 = 3200$$

  - id: q-data-interpretation-tables-and-charts-0008
    type: single_choice
    difficulty: medium
    stem: |
      Refer to the applicant table above. How many more total applicants attended the Manila testing center than the Davao testing center?
    choices:
      - text: '$1,300$'
        correct: true
      - text: '$550$'
        rationale: |
          You compared only male applicants: $1{,}200 - 650 = 550$. The
          question asks for all applicants at both centers.
      - text: '$750$'
        rationale: |
          You compared only female applicants: $1{,}500 - 750 = 750$. Include
          both male and female applicants before subtracting.
      - text: '$4,100$'
        rationale: |
          You added the Manila and Davao totals. The question asks how many
          more attended Manila, so subtract $2{,}700 - 1{,}400$.
    explanation: |
      Calculate totals for Manila and Davao:
      $$\text{Manila} = 1200 + 1500 = 2700$$
      $$\text{Davao} = 650 + 750 = 1400$$
      $$\text{Difference} = 2700 - 1400 = 1300$$

  - id: q-data-interpretation-tables-and-charts-0009
    type: single_choice
    difficulty: easy
    stem: |
      Consider the following table of public library book circulation per category:

      | Month | Fiction | Non-Fiction | Reference |
      | :--- | :--- | :--- | :--- |
      | April | 400 | 250 | 150 |
      | May | 480 | 310 | 190 |
      | June | 520 | 340 | 200 |

      What was the total circulation of Non-Fiction books over the three months?
    choices:
      - text: '$900$'
        correct: true
      - text: '$560$'
        rationale: |
          You added April and May Non-Fiction but left out June. Add June's
          340 Non-Fiction books.
      - text: '$650$'
        rationale: |
          You added May and June Non-Fiction but left out April. Add April's
          250 Non-Fiction books.
      - text: '$1,400$'
        rationale: |
          You totaled the Fiction column instead of Non-Fiction. Use 250,
          310, and 340 from the Non-Fiction column.
    explanation: |
      Summing Non-Fiction circulation:
      $$\text{Total} = 250 + 310 + 340 = 900$$

  - id: q-data-interpretation-tables-and-charts-0010
    type: single_choice
    difficulty: medium
    stem: |
      Refer to the library circulation table above. What was the total book circulation across all three categories in June?
    choices:
      - text: '$1,060$'
        correct: true
      - text: '$860$'
        rationale: |
          You added June Fiction and Non-Fiction but left out Reference. Add
          the June Reference count of 200.
      - text: '$720$'
        rationale: |
          You added June Fiction and Reference but left out Non-Fiction. Add
          the June Non-Fiction count of 340.
      - text: '$540$'
        rationale: |
          You added June Non-Fiction and Reference but left out Fiction. Add
          the June Fiction count of 520.
    explanation: |
      Summing all categories for June:
      $$\text{June Total} = 520 + 340 + 200 = 1060$$

  - id: q-data-interpretation-tables-and-charts-0011
    type: single_choice
    difficulty: easy
    stem: |
      Consider the following table of hospital emergency admissions per department:

      | Shift | Medical | Surgical | Pediatric |
      | :--- | :--- | :--- | :--- |
      | Morning | 45 | 30 | 25 |
      | Afternoon | 60 | 40 | 35 |
      | Night | 35 | 20 | 15 |

      What was the total number of admissions during the Afternoon shift?
    choices:
      - text: '$135$'
        correct: true
      - text: '$100$'
        rationale: |
          You added Afternoon Medical and Afternoon Surgical, but left out
          Afternoon Pediatric $35$.
      - text: '$120$'
        rationale: |
          You used Morning Medical $45$ instead of Afternoon Medical $60$.
      - text: '$95$'
        rationale: |
          You added Afternoon Medical and Pediatric but left out Surgical.
          Add the Afternoon Surgical count of 40.
    explanation: |
      Summing Afternoon shift admissions:
      $$\text{Total} = 60 + 40 + 35 = 135$$

  - id: q-data-interpretation-tables-and-charts-0012
    type: single_choice
    difficulty: medium
    stem: |
      Refer to the emergency admissions table above. What was the total number of Surgical admissions across all three shifts?
    choices:
      - text: '$90$'
        correct: true
      - text: '$70$'
        rationale: |
          You added Morning and Afternoon Surgical but left out Night. Add the
          Night Surgical count of 20.
      - text: '$60$'
        rationale: |
          You added Afternoon and Night Surgical but left out Morning. Add the
          Morning Surgical count of 30.
      - text: '$140$'
        rationale: |
          You totaled the Medical column instead of Surgical. Use 30, 40, and
          20 from the Surgical column.
    explanation: |
      Summing Surgical admissions:
      $$\text{Total Surgical} = 30 + 40 + 20 = 90$$
