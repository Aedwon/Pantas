meta:
  subject: mathematics
  topic: data-interpretation
  subtopic: rates-ratios-and-percentages-in-context
  exams: [cse-pro]
questions:
  - id: q-data-interpretation-rates-ratios-and-percentages-in-context-0001
    lesson: lesson-data-interpretation-percentage-change
    keyPoint: 1
    type: word-problem
    difficulty: easy
    stem: |
      Consider the following hypothetical table showing annual sales revenue (in million PHP) for two product lines:

      | Year | Product A | Product B |
      | :--- | :--- | :--- |
      | 2024 | 40 | 60 |
      | 2025 | 50 | 75 |

      What was the percentage increase in Product A revenue from 2024 to 2025?
    choices:
      - text: '$25\%$'
        correct: true
      - text: '$20\%$'
        rationale: |
          This divides the rise by the new revenue. The new revenue is a stated value. Check the original-value denominator.
      - text: '$125\%$'
        rationale: |
          This reports new revenue as a percentage of old revenue. The new-to-old ratio is a meaningful comparison. Check whether increase or final level is requested.
      - text: '$10\%$'
        rationale: |
          This labels the ten-million-peso increase as a percentage. The absolute increase was calculated correctly. Check that percent needs a ratio.
    explanation: |
      Product A rises by $50-40=10$ million pesos. Divide by the original $40$: $\dfrac{10}{40}=0.25$. The increase is $25\%$.

  - id: q-data-interpretation-rates-ratios-and-percentages-in-context-0002
    lesson: lesson-data-interpretation-percentages-and-ratios-of-groups
    keyPoint: 2
    type: word-problem
    difficulty: easy
    stem: |
      Consider the following hypothetical table showing annual sales revenue (in million PHP) for two product lines:

      | Year | Product A | Product B |
      | :--- | :--- | :--- |
      | 2024 | 40 | 60 |
      | 2025 | 50 | 75 |

      What is the ratio of Product A revenue to Product B revenue in 2025 in simplest form?
    choices:
      - text: '$2:3$'
        correct: true
      - text: '$3:2$'
        rationale: |
          This reverses the product order. The same two values still appear. Check the named order.
      - text: '$2:5$'
        rationale: |
          This compares Product A with the combined total. A part-to-total ratio is also meaningful. Check whether the comparison is to B or to the total.
      - text: '$4:5$'
        rationale: |
          This compares the two years of Product A instead of the two products. Both values belong to Product A. Check the year and product headings.
    explanation: |
      The requested values are $50$ and $75$. Divide both by their GCF, $25$, to get $50:75=2:3$.

  - id: q-data-interpretation-rates-ratios-and-percentages-in-context-0003
    lesson: lesson-data-interpretation-percentages-and-ratios-of-groups
    keyPoint: 1
    type: word-problem
    difficulty: medium
    stem: |
      Consider the following hypothetical table of municipal population data across three barangays:

      | Barangay | Total Population | Senior Citizens |
      | :--- | :--- | :--- |
      | Barangay 1 | 8000 | 1200 |
      | Barangay 2 | 10000 | 1500 |
      | Barangay 3 | 12000 | 2100 |

      What percentage of the total population in Barangay 1 is comprised of senior citizens?
    choices:
      - text: '$15\%$'
        correct: true
      - text: '$12\%$'
        rationale: |
          This uses Barangay 2 total as the denominator for Barangay 1 seniors. Both barangay populations are listed. Check that part and total come from the same row.
      - text: '$17.5\%$'
        rationale: |
          This reports Barangay 3 senior percentage. That is another valid percentage in the table. Check the named barangay.
      - text: '$150\%$'
        rationale: |
          This uses eight hundred instead of eight thousand as the total. Removing a zero makes division easier. Check every zero in the denominator.
    explanation: |
      The senior population is $1200$ out of $8000$. Its fraction is $\dfrac{1200}{8000}=0.15$. Multiply by $100\%$ to get $15\%$.

  - id: q-data-interpretation-rates-ratios-and-percentages-in-context-0004
    lesson: lesson-data-interpretation-percentages-and-ratios-of-groups
    keyPoint: 2
    type: word-problem
    difficulty: medium
    stem: |
      Consider the following hypothetical table of municipal population data across three barangays:

      | Barangay | Total Population | Senior Citizens |
      | :--- | :--- | :--- |
      | Barangay 1 | 8000 | 1200 |
      | Barangay 2 | 10000 | 1500 |
      | Barangay 3 | 12000 | 2100 |

      Across Barangays 2 and 3 combined, what is the ratio of seniors to nonseniors in lowest terms?
    choices:
      - text: '$9:46$'
        correct: true
      - text: '$9:55$'
        rationale: |
          This uses all residents as the second ratio group. The combined population is needed first. Check that nonseniors exclude seniors.
      - text: '$46:9$'
        rationale: |
          This reverses the senior-to-nonsenior order. Both groups were counted correctly. Check the requested group order.
      - text: '$5:7$'
        rationale: |
          This compares the two senior counts rather than seniors and nonseniors combined. Both senior counts appear in the data. Check which two groups are being compared.
    explanation: |
      The combined senior count is $1500+2100=3600$. The combined population is $10000+12000=22000$. Thus nonseniors total $22000-3600=18400$. Divide $3600:18400$ by $400$ to get $9:46$.

  - id: q-data-interpretation-rates-ratios-and-percentages-in-context-0005
    lesson: lesson-data-interpretation-percentage-change
    keyPoint: 1
    type: word-problem
    difficulty: easy
    stem: |
      Consider the following hypothetical table of quarterly electricity consumption (in megawatt-hours):

      | Quarter | Facility X | Facility Y |
      | :--- | :--- | :--- |
      | Q1 | 120 | 180 |
      | Q2 | 150 | 210 |

      By how many percentage points does Facility X growth exceed Facility Y growth from Q1 to Q2? Use the difference between their percentage increases.
    choices:
      - text: '$8\dfrac{1}{3}$ points'
        correct: true
      - text: '$0$ points'
        rationale: |
          This compares equal absolute increases instead of their percentage growth. Both facilities add thirty units. Check the original amount for each growth rate.
      - text: '$16\dfrac{2}{3}$ points'
        rationale: |
          This reports Facility Y growth alone. That percentage is needed for the comparison. Check that the question asks for a difference.
      - text: '$41\dfrac{2}{3}$ points'
        rationale: |
          This adds the growth rates instead of taking their difference. Both percentages have been computed. Check whether the rates must be added or subtracted.
    explanation: |
      Facility X grows by $\dfrac{150-120}{120}(100\%)=25\%$. Facility Y grows by $\dfrac{210-180}{180}(100\%)=16\dfrac{2}{3}\%$. Subtract these percentages: $25-16\dfrac{2}{3}=8\dfrac{1}{3}$ percentage points.

  - id: q-data-interpretation-rates-ratios-and-percentages-in-context-0006
    lesson: lesson-data-interpretation-percentages-and-ratios-of-groups
    keyPoint: 1
    type: word-problem
    difficulty: medium
    stem: |
      Consider the following hypothetical table of quarterly electricity consumption (in megawatt-hours):

      | Quarter | Facility X | Facility Y |
      | :--- | :--- | :--- |
      | Q1 | 120 | 180 |
      | Q2 | 150 | 210 |

      What proportion of the combined Q1 consumption was used by Facility Y?
    choices:
      - text: '$60\%$'
        correct: true
      - text: '$40\%$'
        rationale: |
          This reports Facility X share. Both shares use the same total. Check the named facility.
      - text: '$50\%$'
        rationale: |
          This assumes equal consumption by both facilities. There are two facilities. Check the actual consumption amounts.
      - text: '$150\%$'
        rationale: |
          This compares Y with X alone rather than their combined total. Both quantities are stated in the table. Check that a share uses the combined total.
    explanation: |
      The combined Q1 consumption is $120+180=300$ megawatt-hours. Facility Y uses $180$ of that total. Its fraction is $\dfrac{180}{300}=0.60$, or $60\%$.

  - id: q-data-interpretation-rates-ratios-and-percentages-in-context-0007
    lesson: lesson-data-interpretation-percentage-change
    keyPoint: 1
    type: word-problem
    difficulty: medium
    stem: |
      Consider the following hypothetical table showing quarterly tax collection (in million PHP) by a city treasurer:

      | Category | Q1 | Q2 |
      | :--- | :--- | :--- |
      | Business Tax | 20 | 28 |
      | Real Property Tax | 30 | 36 |

      What is the percentage increase in the combined tax collections from Q1 to Q2?
    choices:
      - text: '$28\%$'
        correct: true
      - text: '$30\%$'
        rationale: |
          This averages the separate growth rates of forty and twenty percent. Both categories do contribute to the total. Check each category's original weight before combining.
      - text: '$60\%$'
        rationale: |
          This adds the separate category growth rates. Each category increases. Check the growth of the total itself.
      - text: '$21.875\%$'
        rationale: |
          This uses the new combined total as the percentage-change base. The new total is a stated amount. Check the original-value denominator.
    explanation: |
      The original combined total is $20+30=50$ million pesos. The new total is $28+36=64$ million pesos. The increase is $14$. Its fraction of the original total is $\dfrac{14}{50}=0.28$, or $28\%$.

  - id: q-data-interpretation-rates-ratios-and-percentages-in-context-0008
    lesson: lesson-data-interpretation-percentages-and-ratios-of-groups
    keyPoint: 2
    type: word-problem
    difficulty: easy
    stem: |
      Consider the following hypothetical table showing quarterly tax collection (in million PHP) by a city treasurer:

      | Category | Q1 | Q2 |
      | :--- | :--- | :--- |
      | Business Tax | 20 | 28 |
      | Real Property Tax | 30 | 36 |

      What fraction of Q2 Real Property Tax equals the increase in Business Tax from Q1 to Q2?
    choices:
      - text: '$\dfrac{2}{9}$'
        correct: true
      - text: '$\dfrac{7}{9}$'
        rationale: |
          This compares the entire Q2 Business Tax with Q2 Real Property Tax. The two Q2 amounts are displayed together. Check that only the increase belongs in the numerator.
      - text: '$\dfrac{2}{5}$'
        rationale: |
          This compares the increase with Q1 Business Tax. The increase is measured from Q1 for a growth rate. Check the requested reference amount.
      - text: '$\dfrac{9}{2}$'
        rationale: |
          This reverses the requested fraction. The same two quantities are divided. Check the direction of the comparison.
    explanation: |
      Business Tax increases by $28-20=8$ million pesos. Q2 Real Property Tax is $36$ million pesos. Their fraction is $\dfrac{8}{36}=\dfrac{2}{9}$.

  - id: q-data-interpretation-rates-ratios-and-percentages-in-context-0009
    lesson: lesson-data-interpretation-percentages-and-ratios-of-groups
    keyPoint: 1
    type: word-problem
    difficulty: easy
    stem: |
      Consider the following hypothetical table of annual university graduates:

      | Degree | Male Graduates | Female Graduates |
      | :--- | :--- | :--- |
      | Engineering | 300 | 200 |
      | Education | 150 | 450 |

      What fraction of all male graduates in these two degrees completed Engineering?
    choices:
      - text: '$\dfrac{2}{3}$'
        correct: true
      - text: '$\dfrac{3}{2}$'
        rationale: |
          This compares Engineering males with Education males only. Both counts belong to the male column. Check that a share uses all male graduates.
      - text: '$\dfrac{3}{5}$'
        rationale: |
          This divides by all Engineering graduates instead of all males. Engineering has two listed gender counts. Check the group used as the denominator.
      - text: '$\dfrac{3}{11}$'
        rationale: |
          This divides by all graduates across both degrees. All table entries form a larger total. Check that the total is restricted to male graduates.
    explanation: |
      The male total is $300+150=450$. Engineering contributes $300$. Its fraction is $\dfrac{300}{450}=\dfrac{2}{3}$.

  - id: q-data-interpretation-rates-ratios-and-percentages-in-context-0010
    lesson: lesson-data-interpretation-percentages-and-ratios-of-groups
    keyPoint: 1
    type: word-problem
    difficulty: medium
    stem: |
      Consider the following hypothetical table of annual university graduates:

      | Degree | Male Graduates | Female Graduates |
      | :--- | :--- | :--- |
      | Engineering | 300 | 200 |
      | Education | 150 | 450 |

      By how many percentage points does the female share of Education graduates exceed that of Engineering graduates? Use the difference between their percentages.
    choices:
      - text: '$35$ points'
        correct: true
      - text: '$50$ points'
        rationale: |
          This subtracts the male Education count as a percent of its category from the female share. Education has seventy-five percent female and twenty-five percent male. Check that the requested comparison is between degrees.
      - text: '$75$ points'
        rationale: |
          This reports Education female share alone. Education has the larger female share. Check that the question asks for the difference.
      - text: '$40$ points'
        rationale: |
          This reports Engineering female share alone. Engineering has a valid female percentage. Check that the larger and smaller shares are both used.
    explanation: |
      The female Education share is $\dfrac{450}{150+450}=75\%$. The female Engineering share is $\dfrac{200}{300+200}=40\%$. Their difference is $75-40=35$ percentage points.

  - id: q-data-interpretation-rates-ratios-and-percentages-in-context-0011
    lesson: lesson-data-interpretation-percentage-change
    keyPoint: 1
    type: which-is-true
    difficulty: easy
    stem: |
      Consider the following hypothetical table showing vehicle registrations over two years:

      | Vehicle Type | Year 1 | Year 2 |
      | :--- | :--- | :--- |
      | Motorcycles | 4000 | 5000 |
      | Automobiles | 2000 | 2200 |

      Which statement about the absolute increases from Year 1 to Year 2 is correct?
    choices:
      - text: 'The motorcycle increase is five times the automobile increase.'
        correct: true
      - text: 'The automobile increase is five times the motorcycle increase.'
        rationale: |
          This reverses the two increases. The factor five is correct in the opposite direction. Check the comparison order.
      - text: 'The motorcycle increase is one quarter of the automobile increase.'
        rationale: |
          This uses the motorcycle percentage-growth fraction as a comparison of absolute increases. The motorcycle growth rate is twenty-five percent. Check whether counts or growth percentages are requested.
      - text: 'The motorcycle and automobile increases are equal.'
        rationale: |
          This treats equal direction of change as equal amounts. Both counts do rise. Check each numerical increase.
    explanation: |
      Motorcycles increase by $5000-4000=1000$. Automobiles increase by $2200-2000=200$. Since $1000\div200=5$, the motorcycle increase is five times the automobile increase.

  - id: q-data-interpretation-rates-ratios-and-percentages-in-context-0012
    lesson: lesson-data-interpretation-percentages-and-ratios-of-groups
    keyPoint: 1
    type: word-problem
    difficulty: medium
    stem: |
      Consider the following hypothetical table showing vehicle registrations over two years:

      | Vehicle Type | Year 1 | Year 2 |
      | :--- | :--- | :--- |
      | Motorcycles | 4000 | 5000 |
      | Automobiles | 2000 | 2200 |

      To two decimal places, what percentage of total registrations in Year 1 were automobiles?
    choices:
      - text: '$33.33\%$'
        correct: true
      - text: '$25.00\%$'
        rationale: |
          This doubles the motorcycle count but keeps the automobile count. The new denominator uses numbers from the table. Check that each vehicle count is included once.
      - text: '$50.00\%$'
        rationale: |
          This compares automobiles with motorcycles instead of all registrations. The motorcycle count is another available denominator. Check that the denominator contains both types.
      - text: '$66.67\%$'
        rationale: |
          This reports the motorcycle share. The two shares add to one hundred percent. Check the named vehicle type.
    explanation: |
      The Year 1 total is $4000+2000=6000$. Automobiles are $\dfrac{2000}{6000}=\dfrac{1}{3}$ of that total. Multiply by $100\%$ and round to two decimal places: $33.33\%$.

  - id: q-data-interpretation-rates-ratios-and-percentages-in-context-0013
    lesson: lesson-data-interpretation-percentage-change
    keyPoint: 2
    type: which-is-true
    difficulty: easy
    stem: |
      A hypothetical office has zero volunteers in January and twelve in February. Which statement about ordinary percentage growth is correct?
    choices:
      - text: 'Undefined: the starting count is zero.'
        correct: true
      - text: 'The percentage increase is exactly $12\%$.'
        rationale: |
          This labels the twelve-person change as a percentage. The increase count is known. Check that percent change needs an original-value denominator.
      - text: 'The percentage increase is exactly $100\%$.'
        rationale: |
          This assumes creating a new group always means doubling. One hundred percent growth doubles a nonzero base. Check that the starting value is zero.
      - text: 'The percentage increase is exactly $0\%$.'
        rationale: |
          This treats an undefined division as zero. Zero is the original count. Check that an undefined ratio is not a numerical growth rate.
    explanation: |
      The ordinary growth formula divides the change by the original count. Here that would divide $12-0$ by $0$. Division by zero is undefined, so an ordinary percent increase cannot be reported.
    approved: false

  - id: q-data-interpretation-rates-ratios-and-percentages-in-context-0014
    lesson: lesson-data-interpretation-percentage-change
    keyPoint: 1
    type: error-spotting
    difficulty: medium
    stem: |
      A hypothetical fund rises from $80$ to $100$ thousand pesos. A student calculates growth as $\dfrac{100-80}{100}\times100\%=20\%$. Which correction is needed?
    choices:
      - text: 'Use $80$ as the denominator.'
        correct: true
      - text: 'Use $100$ as the numerator.'
        rationale: |
          This uses the new level instead of the increase. The new value is given directly. Check that the numerator is new minus original.
      - text: 'Subtract $100$ from $80$ instead.'
        rationale: |
          This reverses the growth direction. Both values belong in the subtraction. Check that an increase uses new minus original.
      - text: 'Multiply the change by $80$.'
        rationale: |
          This replaces a comparison ratio with multiplication. The original base is relevant. Check that the change must be divided by that base.
    explanation: |
      Growth is measured against the original value, $80$. The change is $20$. Thus the percentage growth is $\dfrac{20}{80}(100\%)=25\%$.
    approved: false

  - id: q-data-interpretation-rates-ratios-and-percentages-in-context-0015
    lesson: lesson-data-interpretation-percentages-and-ratios-of-groups
    keyPoint: 1
    type: word-problem
    difficulty: medium
    stem: |
      In a hypothetical survey, $30$ of $50$ customers at Branch A and $10$ of $50$ at Branch B rate service excellent. What percentage of all surveyed customers gives this rating?
    choices:
      - text: '$40\%$'
        correct: true
      - text: '$80\%$'
        rationale: |
          This adds the two branch percentages instead of pooling counts. Both branches contribute ratings. Check that the combined total is one hundred customers.
      - text: '$60\%$'
        rationale: |
          This reports only Branch A percentage. Branch A has more excellent ratings. Check that both branches are included.
      - text: '$20\%$'
        rationale: |
          This reports only Branch B percentage. Its rate is one valid part of the survey. Check that both branches are included.
    explanation: |
      Excellent ratings total $30+10=40$. Surveyed customers total $50+50=100$. Their fraction is $\dfrac{40}{100}=0.40$, or $40\%$.
    approved: false

  - id: q-data-interpretation-rates-ratios-and-percentages-in-context-0016
    lesson: lesson-data-interpretation-percentage-change
    keyPoint: 1
    type: which-is-true
    difficulty: hard
    stem: |
      A hypothetical program reports a $20\%$ increase in participants. Which conclusion must follow if its original participant count is positive?
    choices:
      - text: 'New count is $1.20$ times the old count.'
        correct: true
      - text: 'New count is exactly $20$ more than the old count.'
        rationale: |
          This treats a percent change as a fixed number of people. The number twenty is stated in the report. Check that the absolute gain depends on the old count.
      - text: 'Old count is $80\%$ of the new count.'
        rationale: |
          This reverses an increase by subtracting the same percentage. Reversing a change does require a new comparison. Check that the percentage bases differ.
      - text: 'The increase is $20\%$ of the new count.'
        rationale: |
          This uses the new count as the percentage base. It is another meaningful count. Check that an increase is measured from the old count.
    explanation: |
      A twenty-percent increase adds $0.20$ times the original count. The new count is therefore $1+0.20=1.20$ times the original.
    approved: false

  - id: q-data-interpretation-rates-ratios-and-percentages-in-context-0017
    lesson: lesson-data-interpretation-percentage-change
    keyPoint: 1
    type: estimate-first
    difficulty: hard
    stem: |
      In a hypothetical record, monthly visits rise from $498$ to $601$. Which estimate is closest to the percentage increase?
    choices:
      - text: '$20\%$'
        correct: true
      - text: '$17\%$'
        rationale: |
          This uses the new value as the base, giving about one hundred over six hundred. That is a familiar fraction. Check that ordinary growth uses the old value.
      - text: '$100\%$'
        rationale: |
          This labels the increase of about one hundred visits as a percent. The count increase is near one hundred. Check that it must be compared with the starting count.
      - text: '$120\%$'
        rationale: |
          This reports the new level relative to the old level. The new count is about one hundred twenty percent of the old count. Check that growth excludes the original one hundred percent.
    explanation: |
      The increase is $601-498=103$. Estimate it as $100$ and the starting value as $500$. The ratio is about $\dfrac{100}{500}=0.20$, so the increase is about $20\%$.
    approved: false

  - id: q-data-interpretation-rates-ratios-and-percentages-in-context-0018
    lesson: lesson-data-interpretation-percentages-and-ratios-of-groups
    keyPoint: 2
    type: word-problem
    difficulty: hard
    stem: |
      A hypothetical report lists $1.5$ million pesos for Road Works and $750$ thousand pesos for Drainage. What is the Road Works-to-Drainage ratio in simplest form?
    choices:
      - text: '$2:1$'
        correct: true
      - text: '$1:500$'
        rationale: |
          This compares one point five with seven hundred fifty without matching units. Both numbers are printed directly. Check that the money units agree.
      - text: '$1:2$'
        rationale: |
          This reverses the project order after matching units. The ratio uses the same amounts. Check which project is named first.
      - text: '$3:1$'
        rationale: |
          This compares the combined budget with Drainage alone. The total is three drainage-sized parts. Check that the numerator is Road Works, not the total.
    explanation: |
      Write both amounts in thousands: Road Works is $1500$, and Drainage is $750$. The ratio is $1500:750=2:1$.
    approved: false

  - id: q-data-interpretation-rates-ratios-and-percentages-in-context-0019
    lesson: lesson-data-interpretation-percentage-change
    keyPoint: 1
    type: error-spotting
    difficulty: exam
    stem: |
      A hypothetical club falls from $100$ members to $80$, then returns to $100$. A student says both changes are $20\%$ because the counts change by $20$. What is the second change?
    choices:
      - text: '$25\%$ increase'
        correct: true
      - text: '$20\%$ increase'
        rationale: |
          This uses the first period's original count for the second period. Both changes have the same absolute size. Check each period's starting value.
      - text: '$20\%$ decrease'
        rationale: |
          This keeps the direction of the first change. The size twenty appears in both periods. Check whether the second count rises or falls.
      - text: '$125\%$ increase'
        rationale: |
          This reports the final count as a percentage of the second starting count. That ratio is one hundred twenty-five percent. Check that an increase removes the starting one hundred percent.
    explanation: |
      The second change starts from $80$ and adds $20$. Its rate is $\dfrac{20}{80}(100\%)=25\%$, an increase.
    approved: false

  - id: q-data-interpretation-rates-ratios-and-percentages-in-context-0020
    lesson: lesson-data-interpretation-percentage-change
    keyPoint: 1
    type: word-problem
    difficulty: exam
    stem: |
      A hypothetical budget starts with $80$ thousand pesos for Supplies and $20$ thousand for Training. Supplies increases by $10\%$, and Training by $50\%$. What is the combined budget increase?
    choices:
      - text: '$18\%$'
        correct: true
      - text: '$30\%$'
        rationale: |
          This averages the two category rates without their different budget sizes. Both categories are named once. Check their original weights.
      - text: '$60\%$'
        rationale: |
          This adds the two category rates. Both rates are increases. Check the actual added money before finding total growth.
      - text: '$15.25\%$'
        rationale: |
          This divides the gain eighteen by the new total one hundred eighteen and rounds. The new total is a meaningful value. Check that ordinary growth divides by the old total.
    explanation: |
      Supplies adds $80(0.10)=8$ thousand pesos. Training adds $20(0.50)=10$ thousand. The combined gain is $18$ on an original total of $100$. Thus the increase is $18\%$.
    approved: false

  - id: q-data-interpretation-rates-ratios-and-percentages-in-context-0021
    lesson: lesson-data-interpretation-unit-rates-and-direct-proportion
    keyPoint: 1
    type: word-problem
    difficulty: exam
    stem: |
      In a hypothetical trial, a scanner processes $315$ pages in $45$ minutes without stopping. At this constant rate, how many pages can it process per hour?
    choices:
      - text: '$420$ pages'
        correct: true
      - text: '$7$ pages'
        rationale: |
          This gives pages per minute. Dividing by $45$ finds that rate. Multiply by $60$ to get pages per hour.
      - text: '$315$ pages'
        rationale: |
          This keeps the trial's page count. That count covers only $45$ minutes. Match the time to one full hour.
      - text: '$18,900$ pages'
        rationale: |
          This multiplies the entire trial count by $60$. An hour does have $60$ minutes. Find the count for one minute before multiplying.
    explanation: |
      The scanner processes $315\div45=7$ pages per minute. One hour is $60$ minutes, so its hourly rate is $7\times60=420$ pages.

  - id: q-data-interpretation-rates-ratios-and-percentages-in-context-0022
    lesson: lesson-data-interpretation-unit-rates-and-direct-proportion
    keyPoint: 1
    type: word-problem
    difficulty: exam
    stem: |
      A hypothetical procurement record lists $8$ boxes of envelopes, with $25$ envelopes per box, for a total of $1,260$ pesos. What is the cost per envelope?
    choices:
      - text: '$6.30$ pesos'
        correct: true
      - text: '$157.50$ pesos'
        rationale: |
          This divides the cost by the box count. It gives the cost per box. Divide by the total envelope count for cost per envelope.
      - text: '$50.40$ pesos'
        rationale: |
          This divides the cost by the envelopes in one box. There are $8$ boxes. Count all envelopes before dividing.
      - text: '$0.16$ pesos'
        rationale: |
          This divides envelopes by pesos and rounds. Both totals are used. Put pesos on top to find pesos per envelope.
    explanation: |
      The order contains $8\times25=200$ envelopes. The cost per envelope is $\dfrac{1,260}{200}=6.30$ pesos.

  - id: q-data-interpretation-rates-ratios-and-percentages-in-context-0023
    lesson: lesson-data-interpretation-unit-rates-and-direct-proportion
    keyPoint: 2
    type: word-problem
    difficulty: exam
    stem: |
      A hypothetical printing service charges $840$ pesos for $120$ pages. The charge per page is constant, with no fixed fee. How much will it charge for $180$ pages plus $30$ additional copies of a one-page form?
    choices:
      - text: '$1,470$ pesos'
        correct: true
      - text: '$1,260$ pesos'
        rationale: |
          This prices only the $180$ pages. The page rate is correct. Include the $30$ extra form pages.
      - text: '$1,050$ pesos'
        rationale: |
          This adds only the form cost to the original $840$ pesos. The original order had $120$ pages. Price the new $180$-page order first.
      - text: '$930$ pesos'
        rationale: |
          This adds the $90$ extra pages as $90$ pesos. The page increase is correct. Multiply extra pages by the price per page.
    explanation: |
      Each page costs $840\div120=7$ pesos. The new order has $180+30=210$ pages. Its cost is $210\times7=1,470$ pesos.

  - id: q-data-interpretation-rates-ratios-and-percentages-in-context-0024
    lesson: lesson-data-interpretation-unit-rates-and-direct-proportion
    keyPoint: 2
    type: word-problem
    difficulty: exam
    stem: |
      In a hypothetical test, a pump delivers $450$ liters in $12$ minutes at a constant rate. How many liters will it deliver during two separate $9$-minute runs at the same rate? Exclude the time between runs.
    choices:
      - text: '$675$ liters'
        correct: true
      - text: '$337.5$ liters'
        rationale: |
          This counts only one run. Each run lasts $9$ minutes. Include both runs in the pumping time.
      - text: '$300$ liters'
        rationale: |
          This scales the amount down when the pumping time increases. It uses the time ratio backward. At a constant rate, more pumping time gives more water.
      - text: '$900$ liters'
        rationale: |
          This doubles the test amount because there are two runs. Each new run is shorter than the test. Use the actual total pumping time.
    explanation: |
      The pump delivers $450\div12=37.5$ liters per minute. The two runs last $2\times9=18$ minutes. The amount delivered is $37.5\times18=675$ liters.

  - id: q-data-interpretation-rates-ratios-and-percentages-in-context-0025
    lesson: lesson-data-interpretation-inverse-proportion-and-ratio-parts
    keyPoint: 1
    type: word-problem
    difficulty: exam
    stem: |
      In a hypothetical office, $8$ clerks can index a fixed batch of records in $15$ hours. All clerks work at the same constant rate. After all $8$ clerks work for $5$ hours, $2$ leave. How many additional hours will the remaining clerks need to finish the batch?
    choices:
      - text: '$13\dfrac{1}{3}$ hours'
        correct: true
      - text: '$20$ hours'
        rationale: |
          This assigns the entire batch to the remaining clerks. Six clerks would need that long for the whole job. Subtract the work already finished.
      - text: '$18\dfrac{1}{3}$ hours'
        rationale: |
          This includes the first $5$ hours in the answer. It gives the time from the start. Check that only additional hours are requested.
      - text: '$7\dfrac{1}{2}$ hours'
        rationale: |
          This reduces the remaining time when the team gets smaller. It scales $10$ hours by $6\div8$. Fewer equal clerks need more time for the same remaining work.
    explanation: |
      The batch needs $8\times15=120$ clerk-hours. The first shift completes $8\times5=40$ clerk-hours, leaving $120-40=80$. There are $8-2=6$ clerks left. They need $\dfrac{80}{6}=13\dfrac{1}{3}$ additional hours.

  - id: q-data-interpretation-rates-ratios-and-percentages-in-context-0026
    lesson: lesson-data-interpretation-inverse-proportion-and-ratio-parts
    keyPoint: 1
    type: word-problem
    difficulty: exam
    stem: |
      In a hypothetical records unit, $9$ identical machines can finish one fixed scanning job in $8$ hours. Each machine works at the same constant rate. How many additional machines are needed to finish the same job in $6$ hours?
    choices:
      - text: '$3$ machines'
        correct: true
      - text: '$12$ machines'
        rationale: |
          This reports the total machines needed. That total is part of the solution. Subtract the $9$ machines already available.
      - text: '$2$ machines'
        rationale: |
          This treats the $2$-hour reduction as a machine count. The time difference is correct. Keep total machine-hours fixed to find the team size.
      - text: '$27$ machines'
        rationale: |
          This adds the shortfall of $72-54=18$ machine-hours to the original $9$ machines. Machine-hours and machines are different units. Divide the shortfall by $6$ to find the additional machines.
    explanation: |
      The job needs $9\times8=72$ machine-hours. To finish in $6$ hours requires $72\div6=12$ machines. The additional number is $12-9=3$ machines.

  - id: q-data-interpretation-rates-ratios-and-percentages-in-context-0027
    lesson: lesson-data-interpretation-inverse-proportion-and-ratio-parts
    keyPoint: 2
    type: word-problem
    difficulty: exam
    stem: |
      A hypothetical office reserves $12,000$ pesos from a $96,000$-peso fund for equipment. It divides the remaining money between training and travel in the ratio $3:4$. How much is allocated to travel?
    choices:
      - text: '$48,000$ pesos'
        correct: true
      - text: '$36,000$ pesos'
        rationale: |
          This gives the training share. Training has $3$ parts. Use the $4$ parts assigned to travel.
      - text: '$84,000$ pesos'
        rationale: |
          This gives all the money left after the reserve to travel. The reserve was removed correctly. Divide the remainder between both groups using the ratio.
      - text: '$63,000$ pesos'
        rationale: |
          This treats $3:4$ as the fraction of the remainder given to travel. The ratio terms compare two separate shares. Use their sum for the total number of parts.
    explanation: |
      The money to divide is $96,000-12,000=84,000$ pesos. The ratio has $3+4=7$ parts. Each part is $84,000\div7=12,000$ pesos. Travel receives $4\times12,000=48,000$ pesos.

  - id: q-data-interpretation-rates-ratios-and-percentages-in-context-0028
    lesson: lesson-data-interpretation-inverse-proportion-and-ratio-parts
    keyPoint: 2
    type: word-problem
    difficulty: exam
    stem: |
      A hypothetical supply office divides $360$ folders among Units A, B, and C in the ratio $2:3:4$. How many more folders does Unit C receive than Unit A?
    choices:
      - text: '$80$ folders'
        correct: true
      - text: '$160$ folders'
        rationale: |
          This gives Unit C's share alone. Unit C receives $4$ parts. Subtract Unit A's share to find how many more.
      - text: '$240$ folders'
        rationale: |
          This adds the shares of Units A and C. Both shares are needed. Find their difference instead.
      - text: '$120$ folders'
        rationale: |
          This divides the total equally among the three units. There are three units, but their shares differ. Add the ratio terms to find the number of parts.
    explanation: |
      There are $2+3+4=9$ parts. Each part is $360\div9=40$ folders. Unit C has $4-2=2$ more parts than Unit A, so the difference is $2\times40=80$ folders.
