questions:
  - id: q-algebra-word-problems-pshs-q-0001
    lesson: lesson-algebra-motion-meeting-and-separation
    keyPoint: 1
    type: word-problem
    difficulty: easy
    stem: |
      A delivery rider travels at a constant speed of 36 kilometers per hour. How many kilometers does she cover in 15 minutes?
    choices:
      - text: '9'
        correct: true
      - text: '5.4'
        rationale: |
          Writing 15 minutes as 0.15 hour gives $36(0.15)=5.4$. The decimal keeps the digits 15, which makes it look like the same time. Check by multiplying 0.15 hour by 60 minutes per hour.
      - text: '18'
        rationale: |
          This uses half an hour. Dividing an hour into equal parts is a good start. Check how many 15-minute parts make one hour.
      - text: '36'
        rationale: |
          This uses the distance for one hour. The speed tells how far the rider goes in an hour. Check what part of that hour she travels.
      - text: '540'
        rationale: |
          This multiplies 36 by 15. Multiplying speed by time is the right rule. Check that the time is in hours first.
    explanation: |
      Fifteen minutes is $\dfrac{15}{60}=\dfrac{1}{4}$ hour. In that time she covers $36\times\dfrac{1}{4}=9$ kilometers.

  - id: q-algebra-word-problems-pshs-q-0002
    lesson: lesson-algebra-motion-chase-problems
    keyPoint: 1
    type: word-problem
    difficulty: medium
    stem: |
      A van is 18 kilometers ahead of a car. The van moves at 44 kilometers per hour and the car at 60 kilometers per hour. They keep these speeds as they travel in the same direction on a straight road. How many kilometers apart are they 45 minutes later?
    choices:
      - text: '6'
        correct: true
      - text: '2'
        rationale: |
          This takes a full hour of gain off the starting gap. The car does gain 16 kilometers each hour. Check that only 45 minutes have passed.
      - text: '10'
        rationale: |
          This subtracts half of the hourly gain. Halving would work for 30 minutes. Check what fraction of an hour 45 minutes is.
      - text: '12'
        rationale: |
          This gives how much ground the car gains. It uses the speed difference and the right time. Check how much of the starting gap is left after that gain.
      - text: '30'
        rationale: |
          This adds the gain to the starting gap. Adding works when a gap grows. Check which vehicle is faster and where it starts.
    explanation: |
      The car gains $60-44=16$ kilometers each hour. In 45 minutes, or $\dfrac{3}{4}$ hour, it gains $16\times\dfrac{3}{4}=12$ kilometers. The gap left is $18-12=6$ kilometers.

  - id: q-algebra-word-problems-pshs-q-0003
    lesson: lesson-algebra-coin-and-digit-problems
    keyPoint: 1
    type: word-problem
    difficulty: medium
    stem: |
      A cash box contains 17 coins worth 130 pesos in all. Each coin is worth either 5 pesos or 10 pesos. How many pesos in the box come from the 5-peso coins?
    choices:
      - text: '40'
        correct: true
      - text: '45'
        rationale: |
          This multiplies the nine 10-peso coins by five. Five is the value named in the question. Check which group has nine coins.
      - text: '62.5'
        rationale: |
          Dividing the extra 45 pesos by 10 gives 4.5 coins and leaves 12.5 coins valued at 5 pesos each. Dividing by 10 would work if each new coin added the full 10 pesos. Check how much value it adds when it replaces a 5-peso coin.
      - text: '85'
        rationale: |
          This gives the value if all 17 coins are worth five pesos each. That is a good starting amount. Check how many of the 17 coins must actually be worth 10 pesos.
      - text: '90'
        rationale: |
          This gives the value of the nine 10-peso coins. That is one part of the total. Check which kind of coin the question asks about.
    explanation: |
      If all 17 coins were worth 5 pesos each, they would be worth $17\times5=85$ pesos. The box has $130-85=45$ pesos more. Each 10-peso coin adds 5 pesos to that starting value, so there are $45\div5=9$ of them. That leaves $17-9=8$ five-peso coins worth $8\times5=40$ pesos.

  - id: q-algebra-word-problems-pshs-q-0004
    lesson: lesson-algebra-motion-meeting-and-separation
    keyPoint: 2
    type: word-problem
    difficulty: medium
    stem: |
      Two students start at opposite ends of a straight, 1,200-meter path. They walk toward each other at constant speeds of 65 meters per minute and 55 meters per minute. How many meters apart are they after 7 minutes?
    choices:
      - text: '360'
        correct: true
      - text: '745'
        rationale: |
          This takes off the distance covered by the faster student. That student does close 455 meters of the gap. Check how much of the gap the other student closes too.
      - text: '815'
        rationale: |
          This takes off the distance covered by the slower student. That student does close 385 meters of the gap. Check whether the other student also moves toward the meeting point.
      - text: '840'
        rationale: |
          This gives the distance the two students cover together. It uses both speeds and the correct time. Check how much of the path is still between them.
      - text: '1130'
        rationale: |
          This uses the difference of the speeds to find how fast the gap closes. Subtracting works in a same-direction chase. Check whether both students cover part of the gap here.
    explanation: |
      The gap shrinks by $65+55=120$ meters each minute. In 7 minutes the students close $120\times7=840$ meters. They are still $1200-840=360$ meters apart.

  - id: q-algebra-word-problems-pshs-q-0005
    lesson: lesson-algebra-coin-and-digit-problems
    keyPoint: 2
    type: word-problem
    difficulty: hard
    stem: |
      A two-digit number and the number formed by reversing its digits add up to 132. In the original number, the units digit is four more than the tens digit. What is the tens digit of the original number?
    choices:
      - text: '4'
        correct: true
      - text: '8'
        rationale: |
          This gives the larger digit. Both digits are found from the same clues. Check which place holds the larger digit in the original number.
      - text: '6'
        rationale: |
          This splits the digit sum of 12 evenly. Both digits count the same in the sum. Check whether equal digits can differ by four.
      - text: '3'
        rationale: |
          This gives the tens digit of 39. Its digits do add to 12. Check the difference between 9 and 3.
      - text: '12'
        rationale: |
          This divides 132 by 11 and uses the result as the tens digit. Dividing by 11 does give the digit sum. Check whether 12 can fit in a single digit place.
    explanation: |
      Adding the number and its reverse counts each digit once in the tens place and once in the units place. So 132 is 11 times the digit sum. The digits add to $132\div11=12$. Take away the extra 4 from the units digit to leave two equal parts. Each part is $(12-4)\div2=4$, so the tens digit is 4.

  - id: q-algebra-word-problems-pshs-q-0006
    lesson: lesson-algebra-motion-chase-problems
    keyPoint: 1
    type: word-problem
    difficulty: hard
    stem: |
      A cyclist riding at 18 kilometers per hour is 9 kilometers ahead of a second cyclist. They ride in the same direction on a straight road and both keep constant speeds. The second cyclist catches up in 45 minutes. What is the second cyclist's speed in kilometers per hour?
    choices:
      - text: '30'
        correct: true
      - text: '12'
        rationale: |
          This gives the speed at which the gap closes. Dividing the gap by the time gives that speed. Check how fast the leading cyclist is moving while the second cyclist gains ground.
      - text: '27'
        rationale: |
          This adds 9 to the leading cyclist's speed. The 9 is the extra distance the second cyclist covers. Check how many kilometers of gain are needed per hour.
      - text: '38'
        rationale: |
          This uses 0.45 hour for 45 minutes. Both values show the digits 45. Check by multiplying 0.45 hour by 60 minutes per hour.
      - text: '24.75'
        rationale: |
          This multiplies 9 by 0.75 and adds the result to 18. Multiplying by time works when finding distance from speed. Check how to find speed from a distance and a time.
    explanation: |
      In 45 minutes, or $\dfrac{3}{4}$ hour, the second cyclist gains 9 kilometers. The gain per hour is $9\div\dfrac{3}{4}=12$ kilometers. The second cyclist rides at $18+12=30$ kilometers per hour.

  - id: q-algebra-word-problems-pshs-q-0007
    lesson: lesson-algebra-motion-meeting-and-separation
    keyPoint: 2
    type: word-problem
    difficulty: hard
    stem: |
      Two cyclists leave a barangay hall at the same time. They ride in opposite directions on a straight road at constant speeds. One rides at 220 meters per minute. After 5 minutes they are 1.5 kilometers apart. How fast is the other cyclist riding, in meters per minute?
    choices:
      - text: '80'
        correct: true
      - text: '300'
        rationale: |
          This gives how fast the gap grows. Dividing by five gives the distance both riders cover in one minute. Check how much of that distance comes from the cyclist whose speed is given.
      - text: '520'
        rationale: |
          This adds 220 to the rate at which the gap grows. Adding is part of the rule for opposite directions. Check which two speeds add to the rate at which the gap grows.
      - text: '256'
        rationale: |
          This subtracts 220 meters from the final gap and divides by five. Subtracting one cyclist's distance is a good start. Check how far that cyclist rides in all five minutes.
      - text: '220'
        rationale: |
          This assumes the cyclists ride at the same speed because they start together. They do ride for the same amount of time. Check whether two cyclists at 220 meters per minute would be 1,500 meters apart after five minutes.
    explanation: |
      The gap is 1,500 meters after 5 minutes. It grows by $1500\div5=300$ meters each minute. Both cyclists add to the gap, so the other cyclist rides at $300-220=80$ meters per minute.

  - id: q-algebra-word-problems-pshs-q-0008
    lesson: lesson-algebra-motion-chase-problems
    keyPoint: 1
    type: word-problem
    difficulty: exam
    stem: |
      A bus is 18 kilometers ahead of a van and travels at a constant 36 kilometers per hour. The van follows the bus in the same direction on a straight road. How many minutes sooner will the van catch the bus at a constant 60 kilometers per hour than at a constant 48 kilometers per hour?
    choices:
      - text: '45'
        correct: true
      - text: '12'
        rationale: |
          This subtracts the two van speeds. The difference tells how much faster one trip is in kilometers per hour. Check how long each speed takes to close the gap.
      - text: '90'
        rationale: |
          This gives the catch-up time at 48 kilometers per hour. It uses the gap and the slower closing speed. Check how many minutes the faster trip still takes.
      - text: '135'
        rationale: |
          This adds the two catch-up times. Both times are needed for the comparison. Check which operation gives the number of minutes saved.
      - text: '22.5'
        rationale: |
          This takes half of 45 minutes as the saving. Doubling the closing speed does halve the time. Check which of the two trips already takes 45 minutes.
    explanation: |
      At 48 kilometers per hour, the van gains $48-36=12$ kilometers per hour. It closes the gap in $18\div12=1.5$ hours, or 90 minutes. At 60 kilometers per hour, it gains $60-36=24$ kilometers per hour. It closes the gap in $18\div24=0.75$ hour, or 45 minutes. The van saves $90-45=45$ minutes.

  - id: q-algebra-word-problems-pshs-q-0009
    lesson: lesson-algebra-coin-and-digit-problems
    keyPoint: 2
    type: word-problem
    difficulty: exam
    stem: |
      The digits of a two-digit number add up to 13. First increase its tens digit by 2, keeping its units digit the same. Then reverse the two digits. The result is 11 more than the original number. What was the original tens digit?
    choices:
      - text: '6'
        correct: true
      - text: '7'
        rationale: |
          This gives the original units digit. It belongs to the number that fits both clues. Check which digit was increased before the reversal.
      - text: '5'
        rationale: |
          This gives 58 as the original number. Its digits add to 13, and increasing the tens digit gives 78. Check the difference after reversing 78.
      - text: '4'
        rationale: |
          This gives 49 as the original number. Its digits add to 13, and there is room to raise the tens digit by two. Check how much larger 96 is than 49.
      - text: '13'
        rationale: |
          This uses the total of the digits as the tens digit. Thirteen is one of the clues. Check whether it can fit in a single digit place.
    explanation: |
      When you reverse the digits, the original tens digit moves to the units place. The extra 2 then adds just 2 to the result. So reversing the original number by itself adds $11-2=9$. Moving the larger digit from the units place to the tens place adds nine times the difference between the digits. So the units digit is one more than the tens digit. The digits add to 13, so the tens digit is $(13-1)\div2=6$. The original is 67. Raising the tens digit gives 87, which reverses to 78.
