meta:
  subject: mathematics
  topic: algebra
  subtopic: polynomials
  exams: [upcat, acet, dlsucet, ustet, pupcet]
questions:
  - id: q-algebra-polynomials-0001
    type: direct-computation
    difficulty: easy
    stem: |
      Add $(3x^2 - 2x + 1) + (x^2 + 4x - 3)$.
    choices:
      - text: $4x^2 + 2x - 2$
        correct: true
      - text: $4x^2 + 6x - 2$
      - text: $4x^2 - 2x - 4$
      - text: $2x^2 + 2x - 2$
    explanation: |
      Combine like terms: $3x^2 + x^2 = 4x^2$, $-2x + 4x = 2x$, and $1 - 3 = -2$. Result: $4x^2 + 2x - 2$.

  - id: q-algebra-polynomials-0002
    type: direct-computation
    difficulty: medium
    stem: |
      Subtract $(5x^2 + 3x) - (2x^2 + x + 1)$.
    choices:
      - text: $3x^2 + 2x - 1$
        correct: true
      - text: $3x^2 + 4x + 1$
      - text: $7x^2 + 4x - 1$
      - text: $3x^2 + 2x + 1$
    explanation: |
      Distribute the negative sign: $(5x^2 + 3x) + (-2x^2 - x - 1) = 3x^2 + 2x - 1$.

  - id: q-algebra-polynomials-0003
    type: error-spotting
    difficulty: medium
    stem: |
      A student subtracts $(5x^2 + 3x) - (2x^2 + x + 1)$ and writes:
      $(5x^2 + 3x) - (2x^2 + x + 1) = 3x^2 + 2x + 1$

      What is the error?
    choices:
      - text: The constant term should be $-1$, not $+1$.
        correct: true
      - text: The $x^2$ coefficient should be different.
      - text: There is no error.
      - text: The $x$ term should be $2x$.
    explanation: |
      When subtracting, the negative sign must be distributed to every term in the second group, including the constant 1. It should be $3x^2 + 2x - 1$.

  - id: q-algebra-polynomials-0004
    type: direct-computation
    difficulty: medium
    stem: |
      Multiply $(x + 3)(x + 2)$ using FOIL.
    choices:
      - text: $x^2 + 5x + 6$
        correct: true
      - text: $x^2 + 5x + 5$
      - text: $x^2 + 6x + 6$
      - text: $2x + 5$
    explanation: |
      FOIL: First $x \cdot x = x^2$, Outer $x \cdot 2 = 2x$, Inner $3 \cdot x = 3x$, Last $3 \cdot 2 = 6$. Sum: $x^2 + 5x + 6$.

  - id: q-algebra-polynomials-0005
    type: direct-computation
    difficulty: medium
    stem: |
      Expand $(x + 3)^2$.
    choices:
      - text: $x^2 + 6x + 9$
        correct: true
      - text: $x^2 + 9$
      - text: $x^2 + 3x + 9$
      - text: $2x + 6$
    explanation: |
      $(x+3)^2 = (x+3)(x+3) = x^2 + 3x + 3x + 9 = x^2 + 6x + 9$.

  - id: q-algebra-polynomials-0006
    type: error-spotting
    difficulty: medium
    stem: |
      A student claims that $(x + 3)^2 = x^2 + 9$. What is missing?
    choices:
      - text: The middle term $6x$.
        correct: true
      - text: Nothing, this is correct.
      - text: The exponent should be different.
      - text: The constant should be larger.
    explanation: |
      The perfect square trinomial requires three terms: $x^2 + 2(x)(3) + 9 = x^2 + 6x + 9$. The middle term $6x$ is essential.

  - id: q-algebra-polynomials-0007
    type: direct-computation
    difficulty: medium
    stem: |
      Multiply $(x - 4)(x + 4)$.
    choices:
      - text: $x^2 - 16$
        correct: true
      - text: $x^2 + 16$
      - text: $x^2 - 8$
      - text: $2x$
    explanation: |
      Difference of squares: $(x-4)(x+4) = x^2 - 16$.

  - id: q-algebra-polynomials-0008
    type: direct-computation
    difficulty: medium
    stem: |
      Factor $x^2 - 5x + 6$.
    choices:
      - text: $(x - 2)(x - 3)$
        correct: true
      - text: $(x + 2)(x + 3)$
      - text: $(x - 1)(x - 6)$
      - text: $(x - 5)(x + 1)$
    explanation: |
      Find two numbers that multiply to 6 and add to -5. These are -2 and -3. So $x^2 - 5x + 6 = (x-2)(x-3)$.

  - id: q-algebra-polynomials-0009
    type: direct-computation
    difficulty: hard
    stem: |
      What is the remainder when $P(x) = x^4 - 3x^3 + 2x - 5$ is divided by $x - 2$?
    choices:
      - text: $-9$
        correct: true
      - text: $5$
      - text: $-5$
      - text: $9$
    explanation: |
      By the Remainder Theorem, substitute $x = 2$: $P(2) = 2^4 - 3(2^3) + 2(2) - 5 = 16 - 24 + 4 - 5 = -9$.

  - id: q-algebra-polynomials-0010
    type: direct-computation
    difficulty: hard
    stem: |
      If $x - 3$ is a factor of $x^3 - kx^2 + 4x - 12$, what is the value of $k$?
    choices:
      - text: $3$
        correct: true
      - text: $2$
      - text: $4$
      - text: $-3$
    explanation: |
      By the Factor Theorem, if $x - 3$ is a factor, then $P(3) = 0$. Substitute: $27 - 9k + 12 - 12 = 0$, so $27 = 9k$ and $k = 3$.

  - id: q-algebra-polynomials-0011
    type: direct-computation
    difficulty: hard
    stem: |
      If $A = 3x^2 - 2x + 5$ and $B = -x^2 + 4x - 1$, what is the simplified form of $2A - B$?
    choices:
      - text: $7x^2 - 8x + 11$
        correct: true
      - text: $7x^2 + 8x + 11$
      - text: $5x^2 - 8x + 4$
      - text: $6x^2 - 6x + 10$
    explanation: |
      $2A = 6x^2 - 4x + 10$. Subtract $B$: $(6x^2 - 4x + 10) - (-x^2 + 4x - 1) = 7x^2 - 8x + 11$.

  - id: q-algebra-polynomials-0012
    type: direct-computation
    difficulty: medium
    stem: |
      Factor $4x^2 + 8x$.
    choices:
      - text: $4x(x + 2)$
        correct: true
      - text: $4x(x + 4)$
      - text: $2x(2x + 4)$
      - text: $4(x^2 + 2x)$
    explanation: |
      Pull out the greatest common factor: $4x$. Then $4x^2 + 8x = 4x(x + 2)$.

  - id: q-algebra-polynomials-0013
    type: direct-computation
    difficulty: hard
    stem: |
      Multiply $(x - 3)(x + 3)(x^2 + 9)$.
    choices:
      - text: $x^4 - 81$
        correct: true
      - text: $x^4 + 81$
      - text: $x^4 - 27$
      - text: $x^3 - 27$
    explanation: |
      First, $(x-3)(x+3) = x^2 - 9$. Then $(x^2 - 9)(x^2 + 9) = x^4 - 81$ (difference of squares).

  - id: q-algebra-polynomials-0014
    type: which-is-true
    difficulty: medium
    stem: |
      Which expansion is correct?
    choices:
      - text: $(x + 2)^2 = x^2 + 4x + 4$
        correct: true
      - text: $(x + 2)^2 = x^2 + 4$
      - text: $(x + 2)^2 = x^2 + 2x + 4$
      - text: $(x + 2)^2 = x^2 + 2x + 2$
    explanation: |
      $(x+2)^2 = x^2 + 2(2)(x) + 4 = x^2 + 4x + 4$.

  - id: q-algebra-polynomials-0015
    type: direct-computation
    difficulty: medium
    stem: |
      Factor $6x^2 - 7x - 3$ using the AC method.
    choices:
      - text: $(3x + 1)(2x - 3)$
        correct: true
      - text: $(3x - 1)(2x + 3)$
      - text: $(2x + 1)(3x - 3)$
      - text: $(6x - 1)(x + 3)$
    explanation: |
      Multiply $a$ and $c$: $6 \times (-3) = -18$. Find numbers multiplying to -18 and adding to -7: -9 and 2. Split and group: $6x^2 - 9x + 2x - 3 = 3x(2x - 3) + 1(2x - 3) = (3x+1)(2x-3)$.

  - id: q-algebra-polynomials-0016
    type: error-spotting
    difficulty: hard
    stem: |
      A student uses synthetic division to divide by $x - 5$ and writes $-5$ in the synthetic box. What is the error?
    choices:
      - text: When dividing by $x - 5$, put $+5$ in the box, not $-5$.
        correct: true
      - text: There is no error.
      - text: Synthetic division cannot be used here.
      - text: The box should hold the coefficient, not the constant.
    explanation: |
      In synthetic division, when you divide by $x - 5$, you flip the sign and use $+5$ in the box. The divisor $x - 5$ has a zero at $x = 5$.

  - id: q-algebra-polynomials-0017
    type: direct-computation
    difficulty: hard
    stem: |
      Multiply $(2x + 1)(3x - 2)$.
    choices:
      - text: $6x^2 - x - 2$
        correct: true
      - text: $6x^2 + x - 2$
      - text: $6x^2 - 4x - 2$
      - text: $5x - 1$
    explanation: |
      FOIL: First $2x \cdot 3x = 6x^2$, Outer $2x \cdot (-2) = -4x$, Inner $1 \cdot 3x = 3x$, Last $1 \cdot (-2) = -2$. Sum: $6x^2 - x - 2$.

  - id: q-algebra-polynomials-0018
    type: which-is-true
    difficulty: medium
    stem: |
      Is $(x - 2)$ a factor of $x^3 - 3x^2 + 2x$?
    choices:
      - text: Yes, because $P(2) = 0$.
        correct: true
      - text: No, because $P(2) \ne 0$.
      - text: Cannot determine without factoring completely.
      - text: No, because the polynomial has three terms.
    explanation: |
      Use the Factor Theorem. Substitute $x = 2$: $P(2) = 8 - 12 + 4 = 0$. Since $P(2) = 0$, $(x-2)$ is a factor.
