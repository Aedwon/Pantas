meta:
  subject: mathematics
  topic: algebra
  subtopic: polynomials
  exams: [upcat, acet, dlsucet, ustet, pupcet]
questions:
  - id: q-algebra-polynomials-0001
    type: direct-computation
    difficulty: easy
    stem: |
      Add $(3x^2 - 2x + 1) + (x^2 + 4x - 3)$.
    choices:
      - text: '$4x^2+2x-2$'
        correct: true
      - text: '$4x^2+6x-2$'
        rationale: |
          This adds the magnitudes of $-2x$ and $4x$. Both terms have the same variable part. Check the sign attached to each coefficient.
      - text: '$4x^2+2x+4$'
        rationale: |
          This adds the magnitudes of the constants $1$ and $-3$. Grouping like terms is correct. Check that the negative sign stays with its number.
      - text: '$2x^2+2x-2$'
        rationale: |
          This subtracts the quadratic coefficients instead of adding them. The minus signs elsewhere can suggest subtraction. Check the sign between the two whole polynomials.
    explanation: |
      Combine terms with the same powers: $(3+1)x^2+(-2+4)x+(1-3)$. The result is $4x^2+2x-2$.

  - id: q-algebra-polynomials-0002
    type: direct-computation
    difficulty: medium
    stem: |
      Subtract $(5x^2 + 3x) - (2x^2 + x + 1)$.
    choices:
      - text: '$3x^2+2x-1$'
        correct: true
      - text: '$3x^2+4x+1$'
        rationale: |
          This changes the sign of only the first term of the subtracted polynomial. The quadratic terms are correctly combined. Check that subtraction applies to every term in the group.
      - text: '$7x^2+4x+1$'
        rationale: |
          This adds the two polynomials instead of subtracting them. All matching terms are combined. Check the operation between the parentheses.
      - text: '$3x^2+2x+1$'
        rationale: |
          This leaves the final constant positive. The first two terms are correctly subtracted. Check the sign before the entire second polynomial.
    explanation: |
      Distribute the subtraction: $5x^2+3x-2x^2-x-1$. Combine like terms to get $3x^2+2x-1$.

  - id: q-algebra-polynomials-0003
    type: error-spotting
    difficulty: medium
    stem: |
      A student subtracts $(5x^2 + 3x) - (2x^2 + x + 1)$ and writes:
      $(5x^2 + 3x) - (2x^2 + x + 1) = 3x^2 + 2x + 1$

      What is the error?
    choices:
      - text: 'The last constant was not subtracted.'
        correct: true
      - text: 'The quadratic coefficients were added.'
        rationale: |
          This blames addition of the quadratic coefficients. The displayed coefficient is already $5-2$. Check each power separately.
      - text: 'The linear coefficients were multiplied.'
        rationale: |
          This blames multiplication of the linear coefficients. The displayed coefficient is already $3-1$. Check how the coefficient 2 was obtained.
      - text: 'The subtraction rule was used correctly.'
        rationale: |
          This accepts keeping a positive constant under subtraction. The variable terms look correct. Check the sign of every term in the second group.
    explanation: |
      The subtraction before the second polynomial also applies to its constant $+1$. That contribution is $-1$. The correct result is $3x^2+2x-1$.

  - id: q-algebra-polynomials-0004
    type: direct-computation
    difficulty: medium
    stem: |
      Multiply $(x + 3)(x + 2)$ using FOIL.
    choices:
      - text: '$x^2+5x+6$'
        correct: true
      - text: '$x^2+5x+5$'
        rationale: |
          This adds $3+2$ instead of multiplying for the constant term. Adding is used for the middle coefficients. Check that the last FOIL product is $3$ times $2$.
      - text: '$x^2+6x+6$'
        rationale: |
          This multiplies 3 and 2 for the middle coefficient. Their product correctly gives the constant. Check that the cross terms are added.
      - text: '$x^2+6$'
        rationale: |
          This omits both cross terms. The first and last products are right. Check that each term multiplies every term of the other binomial.
    explanation: |
      Distribute: $x^2+2x+3x+6$. Combine the middle terms, $2x+3x=5x$. The product is $x^2+5x+6$.

  - id: q-algebra-polynomials-0005
    type: direct-computation
    difficulty: medium
    stem: |
      Expand $(x + 3)^2$.
    choices:
      - text: '$x^2+6x+9$'
        correct: true
      - text: '$x^2+9$'
        rationale: |
          This squares each term separately. That works for a product, so it can seem natural for a sum too. Check the cross products in the two binomials.
      - text: '$x^2+3x+9$'
        rationale: |
          This includes only one of the two equal cross terms. One product $3x$ is correctly found. Check that both copies contribute.
      - text: '$2x+6$'
        rationale: |
          This doubles the binomial instead of squaring it. The raised 2 can look like a coefficient. Check that a square means multiplying the expression by itself.
    explanation: |
      Write the square as $(x+3)(x+3)$. The products are $x^2$, $3x$, $3x$, and $9$. Add them to get $x^2+6x+9$.

  - id: q-algebra-polynomials-0006
    type: error-spotting
    difficulty: medium
    stem: |
      A student claims that $(x + 3)^2 = x^2 + 9$. What is missing?
    choices:
      - text: '$6x$'
        correct: true
      - text: '$3x$'
        rationale: |
          This includes only one cross product. Each cross product is $3x$. Check how many cross products the expansion has.
      - text: '$9x$'
        rationale: |
          This multiplies the two constants and attaches $x$. The constant product is part of the expansion. Check which products actually contain the variable.
      - text: '$6$'
        rationale: |
          This adds the constants instead of finding the cross products. Two copies of three are visible. Check that each cross product also contains $x$.
    explanation: |
      The cross products in $(x+3)(x+3)$ are $3x$ and $3x$. Together they give $6x$, the missing middle term.

  - id: q-algebra-polynomials-0007
    type: direct-computation
    difficulty: medium
    stem: |
      Multiply $(x - 4)(x + 4)$.
    choices:
      - text: '$x^2-16$'
        correct: true
      - text: '$x^2+16$'
        rationale: |
          This makes the constant product positive. Both binomials contain four. Check the product of $-4$ and $+4$.
      - text: '$x^2-8$'
        rationale: |
          This adds $-4-4$ instead of multiplying the constants. Subtraction appears in the first binomial. Check the last product when distributing.
      - text: '$x^2+8x+16$'
        rationale: |
          This treats both binomials as $x+4$. It uses the square-of-a-sum pattern. Check the sign in each original factor.
    explanation: |
      Expand to get $x^2+4x-4x-16$. The middle terms cancel. The result is $x^2-16$.

  - id: q-algebra-polynomials-0008
    type: direct-computation
    difficulty: medium
    stem: |
      Factor $x^2 - 5x + 6$.
    choices:
      - text: '$(x-2)(x-3)$'
        correct: true
      - text: '$(x+2)(x+3)$'
        rationale: |
          This chooses factors with positive sum five. Their product does give six. Check that the middle coefficient is negative.
      - text: '$(x-1)(x-6)$'
        rationale: |
          This checks the product six but not the sum. Both factors have negative constants. Check that the two constants also add to negative five.
      - text: '$(x-5)(x+1)$'
        rationale: |
          This uses negative five directly as one factor constant. That copies the middle coefficient. Check both the product and sum of the factor constants.
    explanation: |
      Find two numbers whose product is $6$ and whose sum is $-5$. They are $-2$ and $-3$. Thus $x^2-5x+6=(x-2)(x-3)$.

  - id: q-algebra-polynomials-0009
    type: direct-computation
    difficulty: hard
    stem: |
      What is the remainder when $P(x) = x^4 - 3x^3 + 2x - 5$ is divided by $x - 2$?
    choices:
      - text: '$-9$'
        correct: true
      - text: '$39$'
        rationale: |
          This treats the term $-3(2)^3$ as positive, giving $16+24+4-5$. The substituted input is positive. Check the coefficient’s sign separately from the power.
      - text: '$-5$'
        rationale: |
          This returns the constant term alone. The constant is the remainder when dividing by $x$. Check the value specified by the actual divisor.
      - text: '$9$'
        rationale: |
          This drops the negative sign after adding the terms. The magnitude is right. Check which total is larger, the positive terms or the negative terms.
    explanation: |
      Division by $x-2$ gives remainder $P(2)$. Substitute: $P(2)=16-24+4-5=-9$.

  - id: q-algebra-polynomials-0010
    type: direct-computation
    difficulty: hard
    stem: |
      If $x - 3$ is a factor of $x^3 - kx^2 + 4x - 12$, what is the value of $k$?
    choices:
      - text: '$3$'
        correct: true
      - text: '$9$'
        rationale: |
          This treats $3^2$ as 3 in the term $-kx^2$, giving $27-3k=0$. The root is correctly substituted. Check the exponent on its coefficient.
      - text: '$\dfrac{1}{3}$'
        rationale: |
          This reverses the division in $9k=27$. Both coefficients appear in the fraction. Check which number multiplies $k$.
      - text: '$-3$'
        rationale: |
          This changes $-9k= -27$ into a negative value for $k$. Moving the constant is otherwise correct. Check the signs of both sides before division.
    explanation: |
      If $x-3$ is a factor, then $P(3)=0$. This gives $27-9k+12-12=0$, so $27-9k=0$. Thus $9k=27$ and $k=3$.

  - id: q-algebra-polynomials-0011
    type: direct-computation
    difficulty: medium
    stem: |
      If $A = 3x^2 - 2x + 5$ and $B = -x^2 + 4x - 1$, what is the simplified form of $2A - B$?
    choices:
      - text: '$7x^2-8x+11$'
        correct: true
      - text: '$7x^2+11$'
        rationale: |
          This adds $4x$ from $B$ instead of subtracting it. The other terms of $B$ were correctly negated. Check that the subtraction changes all three signs.
      - text: '$5x^2+9$'
        rationale: |
          This adds $B$ instead of subtracting it. Doubling $A$ is correctly done. Check the operation before $B$.
      - text: '$7x^2-4x+11$'
        rationale: |
          This drops the linear term of $B$. The quadratic and constant terms are correctly subtracted. Check that all three terms of $B$ are used.
    explanation: |
      First find $2A=6x^2-4x+10$. Subtract $B$: $6x^2-4x+10+x^2-4x+1$. Combine like terms to get $7x^2-8x+11$.

  - id: q-algebra-polynomials-0012
    type: direct-computation
    difficulty: medium
    stem: |
      Factor $4x^2 + 8x$ completely by taking out the greatest common factor.
    choices:
      - text: '$4x(x+2)$'
        correct: true
      - text: '$4x(x+4)$'
        rationale: |
          This divides $8x$ by $2x$ instead of the extracted factor $4x$. The resulting number four looks plausible. Check every inside term by multiplying back.
      - text: '$2x(2x+4)$'
        rationale: |
          This takes out a common factor but not the greatest one. The expanded expression is equal to the original. Check whether the remaining terms still share a factor.
      - text: '$4(x^2+2x)$'
        rationale: |
          This takes out the numerical factor but leaves a common $x$ inside. The expanded expression is equal to the original. Check whether every inside term still contains $x$.
    explanation: |
      The greatest common factor of $4x^2$ and $8x$ is $4x$. Dividing each term by $4x$ gives $x$ and $2$. The complete factorization is $4x(x+2)$.

  - id: q-algebra-polynomials-0013
    type: word-problem
    difficulty: hard
    stem: |
      A square of side $x$ has $9$ square units of its area removed. The remaining area is then multiplied by $x^2+9$. For $x>3$, which polynomial gives the final quantity?
    choices:
      - text: '$x^4-81$'
        correct: true
      - text: '$x^4+81$'
        rationale: |
          This adds the squared terms when multiplying conjugates. Both $x^2$ and 9 are being squared. Check the sign of the constant product.
      - text: '$x^4-18x^2+81$'
        rationale: |
          This treats the last factor as $x^2-9$. The first two factors do combine to that expression. Check the sign of the separate third factor.
      - text: '$x^4-9$'
        rationale: |
          This leaves nine unsquared in the second difference-of-squares step. The first difference of squares is correctly formed. Check both squares in the second step.
    explanation: |
      The square of side $x$ has area $x^2$. Removing $9$ gives $x^2-9$. Multiply by the stated factor: $(x^2-9)(x^2+9)=x^4-9^2=x^4-81$.

  - id: q-algebra-polynomials-0014
    type: which-is-true
    difficulty: medium
    stem: |
      Which expression is a polynomial in $x$?
    choices:
      - text: '$x^2+1$'
        correct: true
      - text: '$x^{-1}+1$'
        rationale: |
          This allows a negative exponent on the variable. The expression otherwise resembles a polynomial sum. Check that variable exponents must be nonnegative integers.
      - text: '$\sqrt{x}+1$'
        rationale: |
          This allows a square root of the variable. Roots can look like ordinary algebra terms. Check that the exponent $\dfrac{1}{2}$ is not an integer.
      - text: '$x^{2.5}+1$'
        rationale: |
          This allows a positive fractional exponent. Positivity is only part of the rule. Check that each variable exponent is a whole number.
    explanation: |
      A polynomial uses nonnegative whole-number exponents on its variable. In $x^2+1$, the exponents are $2$ and $0$. Both meet that rule.

  - id: q-algebra-polynomials-0015
    type: direct-computation
    difficulty: medium
    stem: |
      Factor $6x^2 - 7x - 3$ using the AC method.
    choices:
      - text: '$(3x+1)(2x-3)$'
        correct: true
      - text: '$(3x-1)(2x+3)$'
        rationale: |
          This gives a positive middle coefficient. The first and last products match the original. Check the sum of the cross products.
      - text: '$(2x+1)(3x-3)$'
        rationale: |
          This matches the leading and constant terms but gives middle term $-3x$. Those endpoint terms are good starting checks. Check the cross products too.
      - text: '$(6x-1)(x+3)$'
        rationale: |
          This uses six directly in the first factor without checking the middle coefficient. The leading and constant terms match. Check the sum of the two cross products.
    explanation: |
      Multiply the leading and constant coefficients: $6(-3)=-18$. The numbers $-9$ and $2$ multiply to $-18$ and add to $-7$. Split and group: $6x^2-9x+2x-3=3x(2x-3)+(2x-3)=(3x+1)(2x-3)$.

  - id: q-algebra-polynomials-0016
    type: error-spotting
    difficulty: medium
    stem: |
      A student uses synthetic division to divide by $x - 5$ and writes $-5$ in the synthetic box. What is the error?
    choices:
      - text: 'The box needs the zero of the divisor.'
        correct: true
      - text: 'The box needs the divisor’s constant term.'
        rationale: |
          This copies the constant with its written sign. The divisor visibly ends in negative five. Check the number that makes the whole divisor zero.
      - text: 'The box needs the leading coefficient.'
        rationale: |
          This uses the coefficient of $x$ rather than the divisor’s zero. The coefficient is part of the divisor. Check the standard form $x-c$.
      - text: 'This linear divisor cannot use the shortcut.'
        rationale: |
          This rejects a divisor of the exact form the shortcut uses. Some polynomial divisors do not fit standard synthetic division. Check that this divisor is linear with leading coefficient one.
    explanation: |
      The synthetic number is $c$ in a divisor $x-c$. For $x-5$, solving $x-5=0$ gives $c=5$. The box therefore needs $5$.

  - id: q-algebra-polynomials-0017
    type: direct-computation
    difficulty: medium
    stem: |
      What is the coefficient of $x$ in the expanded product $(2x+1)(3x-2)$?
    choices:
      - text: '$-1$'
        correct: true
      - text: '$1$'
        rationale: |
          This adds the cross-term coefficients with a reversed sign on their total. Both cross terms are used. Check the signs before adding $-4$ and $3$.
      - text: '$-4$'
        rationale: |
          This includes only the cross product $2x(-2)$. That gives one term containing $x$. Check the other cross product.
      - text: '$3$'
        rationale: |
          This includes only the cross product $1(3x)$. That gives one term containing $x$. Check that both cross products contribute.
    explanation: |
      The terms containing $x$ are $2x(-2)=-4x$ and $1(3x)=3x$. They add to $-x$. Its coefficient is $-1$.

  - id: q-algebra-polynomials-0018
    type: which-is-true
    difficulty: medium
    stem: |
      Let $P(x)=x^3-3x^2+2x$. Which calculation establishes that $x-2$ is a factor?
    choices:
      - text: '$P(2)=0$'
        correct: true
      - text: '$P(0)=0$'
        rationale: |
          This establishes a factor of $x$ rather than $x-2$. Zero is a root of the polynomial. Check the root belonging to the named linear factor.
      - text: '$P(-2)=-24$'
        rationale: |
          This evaluates at the negative of the needed root. The factor contains a visible minus sign. Check which value makes $x-2$ zero.
      - text: '$P(1)=0$'
        rationale: |
          This establishes a factor of $x-1$. One is also a root of the polynomial. Check that the test is for the specified factor.
    explanation: |
      The Factor Theorem tests $x-2$ by evaluating at $2$. Here $P(2)=2^3-3(2^2)+2(2)=8-12+4=0$. Thus $x-2$ is a factor.

  - id: q-algebra-polynomials-0019
    type: direct-computation
    difficulty: hard
    stem: |
      Find the quotient when $x^3-2x^2-5x+6$ is divided by $x-1$.
    choices:
      - text: '$x^2-x-6$'
        correct: true
      - text: '$x^2-3x-2$'
        rationale: |
          This uses $-1$ in synthetic division. The divisor’s written constant is negative one. Check the zero of the divisor.
      - text: '$x^2-x+6$'
        rationale: |
          This loses the minus sign of the final quotient coefficient. The first two coefficients are correct. Check the last addition in synthetic division.
      - text: '$x^2-2x-5$'
        rationale: |
          This lowers every power by one without carrying out the subtractions. Dividing by $x$ alone would allow that shortcut for some terms. Check the full divisor $x-1$.
    explanation: |
      Use $1$ for synthetic division with coefficients $1,-2,-5,6$. Bring down $1$, then form $-2+1=-1$, $-5-1=-6$, and $6-6=0$. The quotient coefficients are $1,-1,-6$, so the quotient is $x^2-x-6$.
    approved: false

  - id: q-algebra-polynomials-0020
    type: direct-computation
    difficulty: exam
    stem: |
      The polynomial $P(x)=2x^3+ax^2+bx-6$ is divisible by $x^2-x-2$. What is $a+b$?
    choices:
      - text: '$-6$'
        correct: true
      - text: '$6$'
        rationale: |
          This reverses the sign of the final sum. The coefficients have opposite signs, which can make their total confusing. Check the sum with the negative coefficient intact.
      - text: '$1$'
        rationale: |
          This returns only $a$. Solving one coefficient is a necessary step. Check the quantity requested.
      - text: '$-7$'
        rationale: |
          This returns only $b$. The second coefficient is found near the end of the work. Check that the question asks for their sum.
    explanation: |
      Factor the divisor: $x^2-x-2=(x-2)(x+1)$. Thus $P(2)=0$ gives $16+4a+2b-6=0$, or $2a+b=-5$. Also $P(-1)=0$ gives $-2+a-b-6=0$, or $a-b=8$. Add the equations: $3a=3$, so $a=1$. Then $b=-7$. Their sum is $-6$.
    approved: false
