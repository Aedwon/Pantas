meta:
  subject: mathematics
  topic: algebra
  subtopic: polynomials
  exams: [upcat, acet, dlsucet, ustet, pupcet]
questions:
  - id: q-algebra-polynomials-0001
    type: direct-computation
    difficulty: easy
    stem: |
      Add $(3x^2 - 2x + 1) + (x^2 + 4x - 3)$.
    choices:
      - text: $4x^2 + 2x - 2$
        correct: true
      - text: $4x^2 + 6x - 2$
        rationale: |
          You added $-2x$ and $4x$ as $+6x$. $-2 + 4 = 2$, so the middle term is $+2x$, giving $4x^2 + 2x - 2$.
      - text: $4x^2 - 2x - 4$
        rationale: |
          You subtracted $4x$ instead of adding it, and miscalculated $1 - 3$. $-2x + 4x = 2x$ and $1 - 3 = -2$.
      - text: $2x^2 + 2x - 2$
        rationale: |
          You subtracted $x^2$ from $3x^2$ to get $2x^2$. Add $3x^2 + x^2 = 4x^2$.
    explanation: |
      Combine like terms: $3x^2 + x^2 = 4x^2$, $-2x + 4x = 2x$, and $1 - 3 = -2$. Result: $4x^2 + 2x - 2$.

  - id: q-algebra-polynomials-0002
    type: direct-computation
    difficulty: medium
    stem: |
      Subtract $(5x^2 + 3x) - (2x^2 + x + 1)$.
    choices:
      - text: $3x^2 + 2x - 1$
        correct: true
      - text: $3x^2 + 4x + 1$
        rationale: |
          You added $3x + x = 4x$ and kept $+1$. Subtracting the group requires flipping all inner signs to $-2x^2 - x - 1$.
      - text: $7x^2 + 4x - 1$
        rationale: |
          You added $5x^2 + 2x^2 = 7x^2$ instead of subtracting. Subtraction yields $5x^2 - 2x^2 = 3x^2$.
      - text: $3x^2 + 2x + 1$
        rationale: |
          You forgot to distribute the minus sign to the constant $+1$. Subtracting $+1$ yields $-1$, giving $3x^2 + 2x - 1$.
    explanation: |
      Distribute the negative sign: $(5x^2 + 3x) + (-2x^2 - x - 1) = 3x^2 + 2x - 1$.

  - id: q-algebra-polynomials-0003
    type: error-spotting
    difficulty: medium
    stem: |
      A student subtracts $(5x^2 + 3x) - (2x^2 + x + 1)$ and writes:
      $(5x^2 + 3x) - (2x^2 + x + 1) = 3x^2 + 2x + 1$

      What is the error?
    choices:
      - text: The constant term should be $-1$, not $+1$.
        correct: true
      - text: The $x^2$ coefficient should be different.
        rationale: |
          You claimed the $x^2$ term was wrong, but $5x^2 - 2x^2 = 3x^2$ is correct. The error is failing to flip $+1$ to $-1$.
      - text: There is no error.
        rationale: |
          You claimed there is no error, but subtracting $(2x^2 + x + 1)$ requires distributing the negative to 1, yielding $-1$.
      - text: The $x$ term should be $2x$.
        rationale: |
          You stated the $x$ term was incorrect, but $3x - x = 2x$ is already correct. The constant $+1$ should be $-1$.
    explanation: |
      When subtracting, the negative sign must be distributed to every term in the second group, including the constant 1. It should be $3x^2 + 2x - 1$.

  - id: q-algebra-polynomials-0004
    type: direct-computation
    difficulty: medium
    stem: |
      Multiply $(x + 3)(x + 2)$ using FOIL.
    choices:
      - text: $x^2 + 5x + 6$
        correct: true
      - text: $x^2 + 5x + 5$
        rationale: |
          You added $3 + 2 = 5$ for the last term instead of multiplying. The last term is $3 \times 2 = 6$.
      - text: $x^2 + 6x + 6$
        rationale: |
          You multiplied $3 \times 2 = 6$ for the middle coefficient instead of adding. The middle term is $(3 + 2)x = 5x$.
      - text: $2x + 5$
        rationale: |
          You added the terms $x + x$ and $3 + 2$ instead of multiplying polynomials. FOIL requires multiplying terms to get $x^2 + 5x + 6$.
    explanation: |
      FOIL: First $x \cdot x = x^2$, Outer $x \cdot 2 = 2x$, Inner $3 \cdot x = 3x$, Last $3 \cdot 2 = 6$. Sum: $x^2 + 5x + 6$.

  - id: q-algebra-polynomials-0005
    type: direct-computation
    difficulty: medium
    stem: |
      Expand $(x + 3)^2$.
    choices:
      - text: $x^2 + 6x + 9$
        correct: true
      - text: $x^2 + 9$
        rationale: |
          You squared both terms individually and omitted the middle term $2(x)(3) = 6x$. Squaring a binomial yields $x^2 + 6x + 9$.
      - text: $x^2 + 3x + 9$
        rationale: |
          You forgot to double the inner product $3x$. The middle term of $(x+3)^2$ is $2(3x) = 6x$, giving $x^2 + 6x + 9$.
      - text: $2x + 6$
        rationale: |
          You multiplied the binomial by 2 instead of squaring it. $(x+3)^2 = (x+3)(x+3) = x^2 + 6x + 9$.
    explanation: |
      $(x+3)^2 = (x+3)(x+3) = x^2 + 3x + 3x + 9 = x^2 + 6x + 9$.

  - id: q-algebra-polynomials-0006
    type: error-spotting
    difficulty: medium
    stem: |
      A student claims that $(x + 3)^2 = x^2 + 9$. What is missing?
    choices:
      - text: The middle term $6x$.
        correct: true
      - text: Nothing, this is correct.
        rationale: |
          You claimed the expansion is correct, but squaring a binomial creates a middle term $2 \cdot 3 \cdot x = 6x$.
      - text: The exponent should be different.
        rationale: |
          You thought the exponent was wrong, but the power 2 is correct. The error is the missing middle term $6x$.
      - text: The constant should be larger.
        rationale: |
          You thought 9 was too small, but $3^2 = 9$ is correct. The missing piece is the middle term $2(x)(3) = 6x$.
    explanation: |
      The perfect square trinomial requires three terms: $x^2 + 2(x)(3) + 9 = x^2 + 6x + 9$. The middle term $6x$ is essential.

  - id: q-algebra-polynomials-0007
    type: direct-computation
    difficulty: medium
    stem: |
      Multiply $(x - 4)(x + 4)$.
    choices:
      - text: $x^2 - 16$
        correct: true
      - text: $x^2 + 16$
        rationale: |
          You made the constant positive. Multiplying $-4 \times 4$ gives $-16$, resulting in the difference of squares $x^2 - 16$.
      - text: $x^2 - 8$
        rationale: |
          You added $-4 - 4 = -8$ or multiplied $-4 \times 2$. The product of $-4$ and $+4$ is $-16$, so the answer is $x^2 - 16$.
      - text: $2x$
        rationale: |
          You added the binomials instead of multiplying them. $(x-4)(x+4)$ produces a quadratic expression $x^2 - 16$.
    explanation: |
      Difference of squares: $(x-4)(x+4) = x^2 - 16$.

  - id: q-algebra-polynomials-0008
    type: direct-computation
    difficulty: medium
    stem: |
      Factor $x^2 - 5x + 6$.
    choices:
      - text: $(x - 2)(x - 3)$
        correct: true
      - text: $(x + 2)(x + 3)$
        rationale: |
          You used positive signs. Positive numbers add to $+5$, but the middle term is $-5x$, requiring $-2$ and $-3$.
      - text: $(x - 1)(x - 6)$
        rationale: |
          You used $-1$ and $-6$, which add to $-7$, not $-5$. You need $-2$ and $-3$ because $-2 - 3 = -5$ and $(-2)(-3) = 6$.
      - text: $(x - 5)(x + 1)$
        rationale: |
          You used $-5$ and $+1$, which multiply to $-5$, not $+6$. The factors must multiply to $+6$ and add to $-5$.
    explanation: |
      Find two numbers that multiply to 6 and add to -5. These are -2 and -3. So $x^2 - 5x + 6 = (x-2)(x-3)$.

  - id: q-algebra-polynomials-0009
    type: direct-computation
    difficulty: hard
    stem: |
      What is the remainder when $P(x) = x^4 - 3x^3 + 2x - 5$ is divided by $x - 2$?
    choices:
      - text: $-9$
        correct: true
      - text: $5$
        rationale: |
          You substituted $x = -2$ or miscalculated $P(2)$. Substituting $x = 2$ gives $16 - 24 + 4 - 5 = -9$.
      - text: $-5$
        rationale: |
          You evaluated only the constant term $P(0) = -5$. By the Remainder Theorem, evaluate $P(2) = 16 - 24 + 4 - 5 = -9$.
      - text: $9$
        rationale: |
          You miscalculated the sign of the result. $16 - 24 + 4 - 5 = -9$, not $+9$.
    explanation: |
      By the Remainder Theorem, substitute $x = 2$: $P(2) = 2^4 - 3(2^3) + 2(2) - 5 = 16 - 24 + 4 - 5 = -9$.

  - id: q-algebra-polynomials-0010
    type: direct-computation
    difficulty: hard
    stem: |
      If $x - 3$ is a factor of $x^3 - kx^2 + 4x - 12$, what is the value of $k$?
    choices:
      - text: $3$
        correct: true
      - text: $2$
        rationale: |
          You got $k = 2$. By the Factor Theorem, set $P(3) = 0$: $27 - 9k + 12 - 12 = 0 \implies 9k = 27 \implies k = 3$.
      - text: $4$
        rationale: |
          You set $k$ to the coefficient of $x$. Solve $P(3) = 27 - 9k = 0$ to get $9k = 27$, so $k = 3$.
      - text: $-3$
        rationale: |
          You made a sign error solving $27 - 9k = 0$. Subtracting 27 gives $-9k = -27$, so dividing by $-9$ yields $k = 3$.
    explanation: |
      By the Factor Theorem, if $x - 3$ is a factor, then $P(3) = 0$. Substitute: $27 - 9k + 12 - 12 = 0$, so $27 = 9k$ and $k = 3$.

  - id: q-algebra-polynomials-0011
    type: direct-computation
    difficulty: hard
    stem: |
      If $A = 3x^2 - 2x + 5$ and $B = -x^2 + 4x - 1$, what is the simplified form of $2A - B$?
    choices:
      - text: $7x^2 - 8x + 11$
        correct: true
      - text: $7x^2 + 8x + 11$
        rationale: |
          You added $-4x + 4x = 0$ or added $+8x$. Subtracting $B$ means $-4x - 4x = -8x$.
      - text: $5x^2 - 8x + 4$
        rationale: |
          You subtracted $B$ from $2A$ without doubling $A$'s constant $2(5) = 10$, and calculated $6x^2 - x^2 = 5x^2$. $2A - B$ gives $7x^2 - 8x + 11$.
      - text: $6x^2 - 6x + 10$
        rationale: |
          You did not subtract $B$ properly. $2A = 6x^2 - 4x + 10$, and subtracting $(-x^2 + 4x - 1)$ gives $7x^2 - 8x + 11$.
    explanation: |
      $2A = 6x^2 - 4x + 10$. Subtract $B$: $(6x^2 - 4x + 10) - (-x^2 + 4x - 1) = 7x^2 - 8x + 11$.

  - id: q-algebra-polynomials-0012
    type: direct-computation
    difficulty: medium
    stem: |
      Factor $4x^2 + 8x$.
    choices:
      - text: $4x(x + 2)$
        correct: true
      - text: $4x(x + 4)$
        rationale: |
          You wrote 4 inside instead of 2. Dividing $8x$ by $4x$ gives 2, so the factored form is $4x(x + 2)$.
      - text: $2x(2x + 4)$
        rationale: |
          You pulled out $2x$, but 2 is not the largest numerical factor. Divide both terms by $4x$ to complete factoring.
      - text: $4(x^2 + 2x)$
        rationale: |
          You extracted only the numerical factor 4. Since $x$ is shared by both terms, factor out $4x$ fully.
    explanation: |
      Pull out the greatest common factor: $4x$. Then $4x^2 + 8x = 4x(x + 2)$.

  - id: q-algebra-polynomials-0013
    type: direct-computation
    difficulty: hard
    stem: |
      Multiply $(x - 3)(x + 3)(x^2 + 9)$.
    choices:
      - text: $x^4 - 81$
        correct: true
      - text: $x^4 + 81$
        rationale: |
          You got $+81$ for the last term. $(x^2 - 9)(x^2 + 9)$ is a difference of squares, which equals $x^4 - 81$.
      - text: $x^4 - 27$
        rationale: |
          You calculated $3 \times 9 = 27$ or $3^3 = 27$. The constant term is $9 \times 9 = 81$, so $(x^2-9)(x^2+9) = x^4 - 81$.
      - text: $x^3 - 27$
        rationale: |
          You multiplied $(x-3)(x^2+9)$ and dropped factors. Multiplying all three terms gives $(x^2-9)(x^2+9) = x^4 - 81$.
    explanation: |
      First, $(x-3)(x+3) = x^2 - 9$. Then $(x^2 - 9)(x^2 + 9) = x^4 - 81$ (difference of squares).

  - id: q-algebra-polynomials-0014
    type: which-is-true
    difficulty: medium
    stem: |
      Which expansion is correct?
    choices:
      - text: $(x + 2)^2 = x^2 + 4x + 4$
        correct: true
      - text: $(x + 2)^2 = x^2 + 4$
        rationale: |
          You omitted the middle term $2(x)(2) = 4x$. Squaring $(x + 2)$ produces a trinomial $x^2 + 4x + 4$.
      - text: $(x + 2)^2 = x^2 + 2x + 4$
        rationale: |
          You forgot to double the product of $x$ and 2. The middle term is $2(2x) = 4x$, giving $x^2 + 4x + 4$.
      - text: $(x + 2)^2 = x^2 + 2x + 2$
        rationale: |
          You used 2 for both the middle coefficient and constant term. $(x+2)^2 = x^2 + 4x + 4$.
    explanation: |
      $(x+2)^2 = x^2 + 2(2)(x) + 4 = x^2 + 4x + 4$.

  - id: q-algebra-polynomials-0015
    type: direct-computation
    difficulty: medium
    stem: |
      Factor $6x^2 - 7x - 3$ using the AC method.
    choices:
      - text: $(3x + 1)(2x - 3)$
        correct: true
      - text: $(3x - 1)(2x + 3)$
        rationale: |
          You flipped the signs of the binomial factors. Multiplying $(3x - 1)(2x + 3)$ gives $6x^2 + 7x - 3$, not $-7x$.
      - text: $(2x + 1)(3x - 3)$
        rationale: |
          You did not simplify the second factor $(3x - 3)$, which has a common factor 3, and $(2x+1)(3x-3)$ gives $6x^2 - 3x - 3$.
      - text: $(6x - 1)(x + 3)$
        rationale: |
          You used factors of 6 and 1. Expanding $(6x - 1)(x + 3)$ yields $6x^2 + 17x - 3$, which does not match $-7x$.
    explanation: |
      Multiply $a$ and $c$: $6 \times (-3) = -18$. Find numbers multiplying to -18 and adding to -7: -9 and 2. Split and group: $6x^2 - 9x + 2x - 3 = 3x(2x - 3) + 1(2x - 3) = (3x+1)(2x-3)$.

  - id: q-algebra-polynomials-0016
    type: error-spotting
    difficulty: hard
    stem: |
      A student uses synthetic division to divide by $x - 5$ and writes $-5$ in the synthetic box. What is the error?
    choices:
      - text: When dividing by $x - 5$, put $+5$ in the box, not $-5$.
        correct: true
      - text: There is no error.
        rationale: |
          You claimed there is no error, but synthetic division uses the root of $x - 5 = 0$, which is $+5$.
      - text: Synthetic division cannot be used here.
        rationale: |
          You claimed synthetic division is invalid here, but it works for any linear divisor of the form $x - c$.
      - text: The box should hold the coefficient, not the constant.
        rationale: |
          You thought the box holds coefficients, but synthetic division uses the root of the divisor in the box.
    explanation: |
      In synthetic division, when you divide by $x - 5$, you flip the sign and use $+5$ in the box. The divisor $x - 5$ has a zero at $x = 5$.

  - id: q-algebra-polynomials-0017
    type: direct-computation
    difficulty: hard
    stem: |
      Multiply $(2x + 1)(3x - 2)$.
    choices:
      - text: $6x^2 - x - 2$
        correct: true
      - text: $6x^2 + x - 2$
        rationale: |
          You calculated $-4x + 3x = +x$. Combining $-4x$ and $3x$ gives $-1x$, so the middle term is $-x$.
      - text: $6x^2 - 4x - 2$
        rationale: |
          You forgot to add the inner product $1 \cdot 3x = 3x$. FOIL gives $-4x + 3x = -x$, so the middle term is $-x$.
      - text: $5x - 1$
        rationale: |
          You added coefficients instead of multiplying terms. FOIL requires multiplying $2x \cdot 3x = 6x^2$ to get $6x^2 - x - 2$.
    explanation: |
      FOIL: First $2x \cdot 3x = 6x^2$, Outer $2x \cdot (-2) = -4x$, Inner $1 \cdot 3x = 3x$, Last $1 \cdot (-2) = -2$. Sum: $6x^2 - x - 2$.

  - id: q-algebra-polynomials-0018
    type: which-is-true
    difficulty: medium
    stem: |
      Is $(x - 2)$ a factor of $x^3 - 3x^2 + 2x$?
    choices:
      - text: Yes, because $P(2) = 0$.
        correct: true
      - text: No, because $P(2) \ne 0$.
        rationale: |
          You claimed $P(2) \ne 0$, but evaluating $P(2) = 2^3 - 3(2^2) + 2(2) = 8 - 12 + 4 = 0$, proving $(x-2)$ is a factor.
      - text: Cannot determine without factoring completely.
        rationale: |
          You thought factoring was required, but the Factor Theorem lets you test divisibility by checking if $P(2) = 0$.
      - text: No, because the polynomial has three terms.
        rationale: |
          You claimed a three-term polynomial cannot have linear factors, but degree 3 polynomials can have up to 3 linear factors.
    explanation: |
      Use the Factor Theorem. Substitute $x = 2$: $P(2) = 8 - 12 + 4 = 0$. Since $P(2) = 0$, $(x-2)$ is a factor.

