meta:
  subject: mathematics
  topic: algebra
  subtopic: algebraic-expressions
  exams: [upcat, acet, dlsucet, ustet, pupcet]
questions:
  - id: q-algebra-algebraic-expressions-0001
    type: direct-computation
    difficulty: easy
    stem: |
      Translate "Three times a number $x$" into an algebraic expression.
    choices:
      - text: $3x$
        correct: true
      - text: $x + 3$
        rationale: |
          You added 3 to $x$ instead of multiplying. The phrase "three times" means multiplication, not addition.
      - text: $\frac{x}{3}$
        rationale: |
          You divided $x$ by 3 instead of multiplying. "Three times" indicates multiplication, not division.
      - text: $x - 3$
        rationale: |
          You subtracted 3 from $x$ instead of multiplying. "Three times" means you must multiply $x$ by 3.
    explanation: |
      "Three times" means multiply by 3, so the expression is $3x$.

  - id: q-algebra-algebraic-expressions-0002
    type: direct-computation
    difficulty: easy
    stem: |
      Translate "Seven less than a number $y$" into an algebraic expression.
    choices:
      - text: $y - 7$
        correct: true
      - text: $7 - y$
        rationale: |
          You subtracted $y$ from 7 instead of 7 from $y$. The word "than" means you must start with $y$ first.
      - text: $y + 7$
        rationale: |
          You added 7 to $y$ instead of subtracting. The phrase "less than" means subtraction, not addition.
      - text: $7y$
        rationale: |
          You multiplied 7 by $y$ instead of subtracting. The phrase "less than" indicates subtraction.
    explanation: |
      The word "than" means we swap the order. Seven less than $y$ means start with $y$ and subtract 7, giving $y - 7$.

  - id: q-algebra-algebraic-expressions-0003
    type: direct-computation
    difficulty: easy
    stem: |
      Evaluate $2x + 3$ when $x = 4$.
    choices:
      - text: $11$
        correct: true
      - text: $15$
        rationale: |
          You may have added 2 and 3 first to get 5, then multiplied by 3 instead of substituting $x = 4$.
      - text: $8$
        rationale: |
          You multiplied 2 by 4 to get 8, but forgot to add 3. Make sure to finish evaluating the whole expression.
      - text: $13$
        rationale: |
          You may have added an extra 2 after calculating $2(4) + 3 = 11$, or substituted the wrong value for $x$.
    explanation: |
      Replace $x$ with 4: $2(4) + 3 = 8 + 3 = 11$.

  - id: q-algebra-algebraic-expressions-0004
    type: direct-computation
    difficulty: easy
    stem: |
      Translate "A distance $d$ divided by 4" into an algebraic expression.
    choices:
      - text: $\frac{d}{4}$
        correct: true
      - text: $\frac{4}{d}$
        rationale: |
          You put 4 in the numerator and $d$ in the denominator. "Distance $d$ divided by 4" means $d$ is divided by 4.
      - text: $d - 4$
        rationale: |
          You subtracted 4 from $d$ instead of dividing. The phrase "divided by" indicates division, not subtraction.
      - text: $4d$
        rationale: |
          You multiplied $d$ by 4 instead of dividing. The phrase "divided by" means you must divide $d$ by 4.
    explanation: |
      "Divided by" means we use the division symbol. The distance $d$ goes on top, 4 goes on bottom: $\frac{d}{4}$.

  - id: q-algebra-algebraic-expressions-0005
    type: direct-computation
    difficulty: medium
    stem: |
      Simplify the expression $3a + 2a$.
    choices:
      - text: $5a$
        correct: true
      - text: $5a^2$
        rationale: |
          You squared the variable $a$ when adding like terms. When adding, keep the variable as $a$, do not change it to $a^2$.
      - text: $6a$
        rationale: |
          You multiplied the coefficients 3 and 2 instead of adding them. For addition of like terms, add $3 + 2 = 5$.
      - text: $a$
        rationale: |
          You subtracted the coefficients $3 - 2$ instead of adding them. The plus sign means you must add $3 + 2 = 5$.
    explanation: |
      Combine like terms. Both terms have $a$, so add the coefficients: $3 + 2 = 5$, giving $5a$.

  - id: q-algebra-algebraic-expressions-0006
    type: direct-computation
    difficulty: medium
    stem: |
      Simplify the expression $2(x + 3)$.
    choices:
      - text: $2x + 6$
        correct: true
      - text: $2x + 3$
        rationale: |
          You distributed the 2 to $x$ but forgot to multiply 3 by 2. You must multiply both terms inside the parentheses by 2.
      - text: $x + 6$
        rationale: |
          You multiplied 3 by 2 to get 6, but forgot to multiply $x$ by 2. Distribute 2 to every term inside the parentheses.
      - text: $2x + 2$
        rationale: |
          You replaced 3 with 2 instead of multiplying 3 by 2. Multiplying 3 by 2 gives 6, so the second term should be 6.
    explanation: |
      Distribute the 2 to both terms inside the parentheses. $2 \times x = 2x$ and $2 \times 3 = 6$, giving $2x + 6$.

  - id: q-algebra-algebraic-expressions-0007
    type: error-spotting
    difficulty: medium
    stem: |
      A student simplifies $3(a + 2)$ like this.

      Step 1: $3a + 2$
      Step 2: The simplified answer is $3a + 2$.

      Which step is wrong?
    choices:
      - text: Step 1
        correct: true
      - text: Step 2
        rationale: |
          You picked Step 2, but Step 2 simply repeats Step 1. The error occurred in Step 1 when 3 was not distributed to 2.
      - text: Both steps
        rationale: |
          You marked both steps as wrong, but the error started and ended in Step 1 where 3 was not distributed to 2.
      - text: No step is wrong.
        rationale: |
          You concluded the work is correct, but 3 was not multiplied by 2. Distributing 3 gives $3a + 6$, so Step 1 is incorrect.
    explanation: |
      Step 1 is wrong. The 3 must multiply both the $a$ and the 2. It should be $3a + 6$, not $3a + 2$. The distributive property applies to every term in the parentheses.

  - id: q-algebra-algebraic-expressions-0008
    type: direct-computation
    difficulty: medium
    stem: |
      Evaluate $x^2$ when $x = 3$.
    choices:
      - text: $9$
        correct: true
      - text: $6$
        rationale: |
          You multiplied the base 3 by the exponent 2. Squaring a number means multiplying it by itself: $3 \times 3 = 9$.
      - text: $3$
        rationale: |
          You kept the value of $x$ without applying the exponent. You must evaluate $3^2$, which equals $3 \times 3 = 9$.
      - text: $1$
        rationale: |
          You got 1, which happens if you divide 3 by 3. The expression asks for $3^2$, which means $3 \times 3 = 9$.
    explanation: |
      Replace $x$ with 3 and square it: $3^2 = 3 \times 3 = 9$.

  - id: q-algebra-algebraic-expressions-0009
    type: direct-computation
    difficulty: hard
    stem: |
      Evaluate $-x^2$ when $x = 2$.
    choices:
      - text: $-4$
        correct: true
      - text: $4$
        rationale: |
          You treated the expression as $(-x)^2$ and squared the negative sign. The negative is outside, so calculate $-(2^2) = -4$.
      - text: $-2$
        rationale: |
          You multiplied $-1$ by 2 without squaring 2 first. Exponents come before negation, so calculate $2^2 = 4$, then negate to get $-4$.
      - text: $2$
        rationale: |
          You returned the value of $x$ without squaring or applying the negative sign. You must evaluate $-(2^2) = -4$.
    explanation: |
      The negative sign is outside the exponent. First square the 2 to get 4, then apply the negative: $-(2^2) = -(4) = -4$.

  - id: q-algebra-algebraic-expressions-0010
    type: direct-computation
    difficulty: hard
    stem: |
      Evaluate $(-x)^2$ when $x = 2$.
    choices:
      - text: $4$
        correct: true
      - text: $-4$
        rationale: |
          You applied the negative sign after squaring. Because $-x$ is inside parentheses, square the entire term $(-2) \times (-2) = 4$.
      - text: $2$
        rationale: |
          You kept the value 2 without applying the negative sign or squaring. Substituting $x = 2$ gives $(-2)^2 = 4$.
      - text: $-2$
        rationale: |
          You evaluated $-x = -2$ but forgot to square the result. Squaring $-2$ gives $(-2) \times (-2) = 4$.
    explanation: |
      The negative is inside the parentheses, so it gets squared too. $(-2)^2 = (-2) \times (-2) = 4$.

  - id: q-algebra-algebraic-expressions-0011
    type: direct-computation
    difficulty: hard
    stem: |
      Simplify the expression $5x - (2x - 3)$.
    choices:
      - text: $3x + 3$
        correct: true
      - text: $3x - 3$
        rationale: |
          You subtracted $2x$ correctly to get $3x$, but did not distribute the negative sign to $-3$. Subtracting $-3$ gives $+3$.
      - text: $7x - 3$
        rationale: |
          You added $5x$ and $2x$ instead of subtracting $2x$. Distributing the minus sign gives $5x - 2x + 3 = 3x + 3$.
      - text: $3x$
        rationale: |
          You simplified the $x$ terms to $3x$ but dropped the constant term. Distributing the minus sign to $-3$ gives $+3$, so the answer is $3x + 3$.
    explanation: |
      When you subtract a group, flip all the signs inside. The $2x$ becomes $-2x$ and the $-3$ becomes $+3$. So $5x - 2x + 3 = 3x + 3$.

  - id: q-algebra-algebraic-expressions-0012
    type: error-spotting
    difficulty: hard
    stem: |
      A student simplifies $8 - (3 - x)$ like this.

      Step 1: $8 - 3 - x$
      Step 2: The answer is $5 - x$.

      Which step is wrong?
    choices:
      - text: Step 1
        correct: true
      - text: Step 2
        rationale: |
          You chose Step 2, but Step 2 correctly computed $8 - 3 = 5$ from Step 1. The mistake happened in Step 1 where $-(-x)$ was written as $-x$.
      - text: Both steps
        rationale: |
          You marked both steps as wrong. Step 2 logically follows from Step 1, but Step 1 is where the negative sign failed to flip $-x$ to $+x$.
      - text: No step is wrong.
        rationale: |
          You thought no step was wrong, but subtracting $(3 - x)$ requires flipping both signs to get $8 - 3 + x = 5 + x$. Step 1 is wrong.
    explanation: |
      Step 1 is wrong. When subtracting a group, both signs must flip. It should be $8 - 3 + x$, not $8 - 3 - x$. So the correct answer is $5 + x$.

  - id: q-algebra-algebraic-expressions-0013
    type: direct-computation
    difficulty: medium
    stem: |
      Translate "50% of a number $n$" into an algebraic expression.
    choices:
      - text: $0.5n$
        correct: true
      - text: $n + 0.5$
        rationale: |
          You added 0.5 to $n$ instead of multiplying. The word "of" in percent problems means multiplication, not addition.
      - text: $n - 0.5$
        rationale: |
          You subtracted 0.5 from $n$ instead of multiplying. Finding a percentage "of" a quantity requires multiplication.
      - text: $\frac{n}{0.5}$
        rationale: |
          You divided $n$ by 0.5 instead of multiplying. Multiplying $n$ by 0.5 gives $0.5n$, which represents 50% of $n$.
    explanation: |
      "Of" means multiply. 50% is 0.5, so the expression is $0.5n$.

  - id: q-algebra-algebraic-expressions-0014
    type: direct-computation
    difficulty: hard
    stem: |
      Simplify the expression $2(3x - 1) + 4x$.
    choices:
      - text: $10x - 2$
        correct: true
      - text: $10x + 4$
        rationale: |
          You got $+4$ as the constant term. Distributing 2 to $-1$ gives $-2$, not $+4$. Combining terms gives $10x - 2$.
      - text: $6x - 2$
        rationale: |
          You distributed $2(3x - 1)$ to get $6x - 2$, but forgot to add the $+4x$ term at the end to get $10x - 2$.
      - text: $5x - 1$
        rationale: |
          You added 2 and 3 to get 5 instead of multiplying $2 \times 3 = 6$. You must distribute by multiplying: $2(3x) = 6x$.
    explanation: |
      First distribute: $2(3x) = 6x$ and $2(-1) = -2$, giving $6x - 2 + 4x$. Combine like terms: $6x + 4x = 10x$. The answer is $10x - 2$.

  - id: q-algebra-algebraic-expressions-0015
    type: direct-computation
    difficulty: hard
    stem: |
      Evaluate $2a + b^2$ when $a = 3$ and $b = -2$.
    choices:
      - text: $10$
        correct: true
      - text: $-2$
        rationale: |
          You may have multiplied $b = -2$ by 4 or evaluated $(-2)^3$ instead of $(-2)^2 = 4$. Check your exponent calculation.
      - text: $2$
        rationale: |
          You evaluated $(-2)^2$ as $-4$ instead of $+4$. Squaring a negative number yields a positive result: $(-2)^2 = 4$, so $6 + 4 = 10$.
      - text: $6$
        rationale: |
          You calculated $2(3) = 6$ but forgot to add $b^2$. Since $b = -2$, $b^2 = 4$, making the final result $6 + 4 = 10$.
    explanation: |
      Replace $a$ with 3 and $b$ with $-2$. Calculate $2(3) = 6$. Calculate $(-2)^2 = 4$. Then $6 + 4 = 10$.

  - id: q-algebra-algebraic-expressions-0016
    type: direct-computation
    difficulty: medium
    stem: |
      Translate "The product of 4 and a number $x$, plus 5" into an algebraic expression.
    choices:
      - text: $4x + 5$
        correct: true
      - text: $4(x + 5)$
        rationale: |
          You multiplied 4 by the quantity $(x + 5)$. The phrase specifies the product of 4 and $x$ first, then adding 5, giving $4x + 5$.
      - text: $4x - 5$
        rationale: |
          You subtracted 5 instead of adding. The word "plus" indicates addition, so the expression is $4x + 5$.
      - text: $4 + x + 5$
        rationale: |
          You added 4 and $x$ instead of multiplying them. "Product" means multiplication, so 4 and $x$ multiply to form $4x$.
    explanation: |
      "Product of 4 and $x$" means $4x$. "Plus 5" means we add 5. The expression is $4x + 5$.

  - id: q-algebra-algebraic-expressions-0017
    type: error-spotting
    difficulty: medium
    stem: |
      A student tries to translate "6 less than twice a number $y$" and writes:

      Step 1: Twice a number $y$ is $2y$.
      Step 2: 6 less than $2y$ is $6 - 2y$.

      Which step is wrong?
    choices:
      - text: Step 1
        rationale: |
          You chose Step 1, but "twice a number $y$" is correctly translated as $2y$. The mistake is in Step 2.
      - text: Step 2
        correct: true
      - text: Both steps
        rationale: |
          You marked both steps wrong, but Step 1 correctly translated "twice a number $y$" as $2y$. Only Step 2 has an error.
      - text: No step is wrong.
        rationale: |
          You thought no step was wrong, but "6 less than $2y$" means starting with $2y$ and subtracting 6, which is $2y - 6$.
    explanation: |
      Step 2 is wrong. The word "than" means we swap the order. It should be $2y - 6$, not $6 - 2y$.

  - id: q-algebra-algebraic-expressions-0018
    type: direct-computation
    difficulty: medium
    stem: |
      Simplify the expression $3x + 2y - x + 4y$.
    choices:
      - text: $2x + 6y$
        correct: true
      - text: $2x + 2y$
        rationale: |
          You subtracted the $y$ terms to get $2y$. Both $2y$ and $4y$ are positive, so add them to get $2y + 4y = 6y$.
      - text: $4x + 6y$
        rationale: |
          You added $3x$ and $x$ to get $4x$. The term is $-x$, so you must subtract: $3x - x = 2x$.
      - text: $3x + 6y$
        rationale: |
          You combined the $y$ terms correctly but left $3x$ unchanged. You must combine $3x - x$ to get $2x$.
    explanation: |
      Combine the $x$ terms: $3x - x = 2x$. Combine the $y$ terms: $2y + 4y = 6y$. The answer is $2x + 6y$.

