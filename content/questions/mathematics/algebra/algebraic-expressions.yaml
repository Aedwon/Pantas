meta:
  subject: mathematics
  topic: algebra
  subtopic: algebraic-expressions
  exams: [upcat, acet, dlsucet, ustet, pupcet]
questions:
  - id: q-algebra-algebraic-expressions-0001
    type: direct-computation
    difficulty: easy
    stem: |
      Translate "Three times a number $x$" into an algebraic expression.
    choices:
      - text: '$3x$'
        correct: true
      - text: '$x + 3$'
        rationale: |
          This adds 3 instead of multiplying by 3. It treats "times" like "more." Check which operation the word names.
      - text: '$\dfrac{x}{3}$'
        rationale: |
          This divides by 3 instead of multiplying by 3. Both operations involve equal groups. Check whether the phrase asks for three copies or one third.
      - text: '$x - 3$'
        rationale: |
          This subtracts 3 instead of multiplying by 3. It treats the number 3 as an amount to remove. Check the word "times" before writing a sign.
    explanation: |
      "Three times" means three equal copies of $x$. Adding them gives $x + x + x = 3x$.

  - id: q-algebra-algebraic-expressions-0002
    type: direct-computation
    difficulty: easy
    stem: |
      Translate "Seven less than a number $y$" into an algebraic expression.
    choices:
      - text: '$y - 7$'
        correct: true
      - text: '$7 - y$'
        rationale: |
          This reverses the subtraction. It follows the order of the words. Check which amount must be reduced.
      - text: '$y + 7$'
        rationale: |
          This adds seven instead of removing seven. The number and variable are both present, so the expression can look complete. Check whether the result must be smaller.
      - text: '$7y$'
        rationale: |
          This multiplies by seven instead of subtracting seven. A number beside a letter can look like the usual algebra form. Check whether the phrase says "times" or "less than."
    explanation: |
      Start with the number $y$. Remove seven from it to get $y - 7$.

  - id: q-algebra-algebraic-expressions-0003
    type: direct-computation
    difficulty: easy
    stem: |
      Evaluate $2x + 3$ when $x = 4$.
    choices:
      - text: '$11$'
        correct: true
      - text: '$14$'
        rationale: |
          This groups $x + 3$ before multiplying by 2. It treats the expression as $2(x + 3)$. Check whether parentheses actually surround that sum.
      - text: '$8$'
        rationale: |
          This stops after multiplying 2 by 4. The product is one finished part of the expression. Check that every term has been used.
      - text: '$9$'
        rationale: |
          This adds $2 + 4 + 3$. Replacing the letter can make the nearby 2 look like another added number. Check that $2x$ means multiplication.
    explanation: |
      Replace $x$ with $4$: $2(4) + 3$. Multiply first to get $8 + 3$. The value is $11$.

  - id: q-algebra-algebraic-expressions-0004
    type: direct-computation
    difficulty: easy
    stem: |
      Translate "A distance $d$ divided by 4" into an algebraic expression.
    choices:
      - text: '$\dfrac{d}{4}$'
        correct: true
      - text: '$\dfrac{4}{d}$'
        rationale: |
          This reverses the dividend and divisor. Both numbers appear in a fraction, so the order can be missed. Check that the quantity being divided goes on top.
      - text: '$d - 4$'
        rationale: |
          This subtracts four instead of dividing by four. Both operations can make a positive distance smaller. Check the operation named in the phrase.
      - text: '$4d$'
        rationale: |
          This multiplies the distance by four. It treats four equal parts as four copies. Check whether the distance is being split or repeated.
    explanation: |
      The distance $d$ is split into four equal parts. Each part is $d \div 4 = \dfrac{d}{4}$.

  - id: q-algebra-algebraic-expressions-0005
    type: direct-computation
    difficulty: medium
    stem: |
      Simplify the expression $3a + 2a$.
    choices:
      - text: '$5a$'
        correct: true
      - text: '$5a^2$'
        rationale: |
          This changes the exponent when adding terms. Two copies of the letter can suggest a square. Check that exponents combine during multiplication, not addition.
      - text: '$6a$'
        rationale: |
          This multiplies the coefficients $3 	imes 2$. Coefficients are multiplied when whole terms are multiplied. Check the plus sign between these terms.
      - text: '$a$'
        rationale: |
          This subtracts the coefficients $3 - 2$. The two terms look like a familiar subtraction pair. Check the sign joining them.
    explanation: |
      Both terms have the same variable part, $a$. Add their coefficients: $3 + 2 = 5$. The result is $5a$.

  - id: q-algebra-algebraic-expressions-0006
    type: direct-computation
    difficulty: medium
    stem: |
      Simplify the expression $2(x + 3)$.
    choices:
      - text: '$2x + 6$'
        correct: true
      - text: '$2x + 3$'
        rationale: |
          This multiplies only the first term by two. The number touches $x$ first in the parentheses. Check that the outside factor reaches every term.
      - text: '$x + 6$'
        rationale: |
          This multiplies only the constant by two. The constant gives an easy product to calculate. Check that the variable term is multiplied too.
      - text: '$2x + 5$'
        rationale: |
          This adds $2 + 3$ for the constant term. The constant and outside number are both visible. Check that distributing uses multiplication for each term.
    explanation: |
      Multiply both terms inside the parentheses by $2$. This gives $2x + 2(3) = 2x + 6$.

  - id: q-algebra-algebraic-expressions-0007
    type: error-spotting
    difficulty: medium
    stem: |
      A student simplifies $3(a + 2)$ like this.

      Step 1: $3a + 2$
      Step 2: The simplified answer is $3a + 2$.

      Which step is the first incorrect step?
    choices:
      - text: 'Step 1'
        correct: true
      - text: 'Step 2'
        rationale: |
          This blames the repeated result instead of the first change. The final line also has the wrong expression. Check each change in order.
      - text: 'No step is wrong.'
        rationale: |
          This accepts multiplying only the first term. The $3a$ part is correct and can hide the missing multiplication. Check every term inside the parentheses.
      - text: 'A value of $a$ is needed.'
        rationale: |
          This assumes a number is needed to simplify. Letters can make the work seem unfinished. Check whether the task is simplifying or finding a numerical value.
    explanation: |
      Step 1 should multiply both terms by $3$. The products are $3a$ and $6$, so the expression becomes $3a + 6$. Step 1 is the first incorrect step.

  - id: q-algebra-algebraic-expressions-0008
    type: direct-computation
    difficulty: medium
    stem: |
      Evaluate $x^2$ when $x = 3$.
    choices:
      - text: '$9$'
        correct: true
      - text: '$6$'
        rationale: |
          This multiplies the base by the exponent: $3 	imes 2$. The raised 2 can look like a multiplier. Check that a square uses two copies of the base.
      - text: '$3$'
        rationale: |
          This substitutes 3 but stops before squaring it. Replacing the variable is a necessary first step. Check whether an exponent remains.
      - text: '$27$'
        rationale: |
          This uses three factors of 3 instead of two. The base 3 can be mistaken for the number of factors. Check the exponent to count the factors.
    explanation: |
      Replace $x$ with $3$. The square is $3^2 = 3 	imes 3 = 9$.

  - id: q-algebra-algebraic-expressions-0009
    type: direct-computation
    difficulty: hard
    stem: |
      Evaluate $-x^2$ when $x = 2$.
    choices:
      - text: '$-4$'
        correct: true
      - text: '$4$'
        rationale: |
          This includes the minus sign in the square. Squaring a negative number does give a positive result. Check whether parentheses place the minus sign inside the base.
      - text: '$-2$'
        rationale: |
          This leaves $-x$ without applying the square. Substitution produces a familiar negative number. Check that the exponent is evaluated.
      - text: '$2$'
        rationale: |
          This returns the substituted value alone. The given value looks like a ready answer. Check both the exponent and the minus sign in the expression.
    explanation: |
      The square applies to $x$ alone. With $x = 2$, first find $2^2 = 4$. Then apply the outside minus sign to get $-4$.

  - id: q-algebra-algebraic-expressions-0010
    type: word-problem
    difficulty: hard
    stem: |
      A machine uses the rule $x^2 + 3$ to change an input into an output. What output does it give for an input of $-2$?
    choices:
      - text: '$7$'
        correct: true
      - text: '$-1$'
        rationale: |
          This keeps the square of the negative input negative, giving $-4 + 3$. A negative base can suggest a negative result. Check the sign of a product of two negative factors.
      - text: '$1$'
        rationale: |
          This doubles the input, giving $2(-2) + 3$. The exponent can look like a multiplier. Check what squaring means.
      - text: '$5$'
        rationale: |
          This uses $|-2| + 3$. Making the input positive can seem to handle the negative sign. Check that the rule asks for a square, not just absolute value.
    explanation: |
      Put $-2$ into $x^2 + 3$: $(-2)^2 + 3$. The square is $(-2)(-2) = 4$. Add $3$ to get $7$.

  - id: q-algebra-algebraic-expressions-0011
    type: direct-computation
    difficulty: hard
    stem: |
      Simplify the expression $5x - (2x - 3)$.
    choices:
      - text: '$3x + 3$'
        correct: true
      - text: '$3x - 3$'
        rationale: |
          This leaves the constant negative when subtracting the group. Subtracting the first term correctly can hide the second sign error. Check that the minus sign changes every sign inside.
      - text: '$7x - 3$'
        rationale: |
          This adds the whole group instead of subtracting it. Dropping the outer minus sign keeps the inner expression familiar. Check the sign before the parentheses.
      - text: '$3x$'
        rationale: |
          This drops the constant after combining the variable terms. The matching $x$ terms attract attention first. Check that no term disappears.
    explanation: |
      Subtracting the group changes both signs: $5x - 2x + 3$. Combine the $x$ terms to get $3x + 3$.

  - id: q-algebra-algebraic-expressions-0012
    type: error-spotting
    difficulty: hard
    stem: |
      A student simplifies $8 - (3 - x)$ like this.

      Step 1: $8 - 3 - x$
      Step 2: The answer is $5 - x$.

      Which step is the first incorrect step?
    choices:
      - text: 'Step 1'
        correct: true
      - text: 'Step 2'
        rationale: |
          This blames the final line because it has the wrong result. That line follows from the earlier expression. Check for the first change that breaks the rule.
      - text: 'No step is wrong.'
        rationale: |
          This accepts removing parentheses without changing every sign. The subtraction of 3 is correct and can hide the other sign. Check both terms in the group.
      - text: 'A value of $x$ is needed.'
        rationale: |
          This assumes simplification requires a numerical value. The remaining letter can seem unfinished. Check whether the rules can simplify the expression for any $x$.
    explanation: |
      Subtract each term in the group: $8 - (3 - x) = 8 - 3 + x$. This simplifies to $5 + x$. Step 1 is the first incorrect step.

  - id: q-algebra-algebraic-expressions-0013
    type: direct-computation
    difficulty: medium
    stem: |
      Translate "50% of a number $n$" into an algebraic expression.
    choices:
      - text: '$0.5n$'
        correct: true
      - text: '$n + 0.5$'
        rationale: |
          This adds the decimal instead of taking a share of $n$. Converting the percent to $0.5$ is correct, which can hide the wrong operation. Check what "of" means.
      - text: '$n - 0.5$'
        rationale: |
          This removes a fixed $0.5$ instead of half the number. Both actions reduce many positive values. Check whether the amount removed should depend on $n$.
      - text: '$\dfrac{n}{0.5}$'
        rationale: |
          This divides by $0.5$ instead of multiplying by it. The percent was correctly changed to a decimal. Check that half of a positive number is smaller than the whole.
    explanation: |
      $50\% = \dfrac{50}{100} = 0.5$. To find that share of $n$, multiply: $0.5 	imes n = 0.5n$.

  - id: q-algebra-algebraic-expressions-0014
    type: direct-computation
    difficulty: hard
    stem: |
      Simplify the expression $2(3x - 1) + 4x$.
    choices:
      - text: '$10x - 2$'
        correct: true
      - text: '$10x - 1$'
        rationale: |
          This multiplies $3x$ by 2 but leaves $-1$ unchanged. The variable part is correctly expanded. Check that both terms receive the outside factor.
      - text: '$6x - 2$'
        rationale: |
          This stops after expanding the parentheses. That gives a complete-looking expression. Check for terms outside the parentheses.
      - text: '$14x - 2$'
        rationale: |
          This puts the outside $4x$ inside the multiplication by two. All terms can look like one group. Check exactly where the parentheses end.
    explanation: |
      Distribute $2$ to get $6x - 2 + 4x$. Add the matching variable terms: $6x + 4x = 10x$. The result is $10x - 2$.

  - id: q-algebra-algebraic-expressions-0015
    type: direct-computation
    difficulty: hard
    stem: |
      Evaluate $2a + b^2$ when $a = 3$ and $b = -2$.
    choices:
      - text: '$10$'
        correct: true
      - text: '$13$'
        rationale: |
          This treats $2a$ as $a^2$, giving $9+4$. The coefficient 2 can be confused with a square. Check whether the 2 is beside the letter or raised above it.
      - text: '$2$'
        rationale: |
          This treats the square of $-2$ as $-4$, giving $6 - 4$. A negative base can suggest a negative answer. Check the sign after multiplying two negative factors.
      - text: '$6$'
        rationale: |
          This uses only $2a$ and leaves out $b^2$. The first product is easy to finish. Check that each term contributes to the total.
    explanation: |
      Replace the letters: $2(3) + (-2)^2$. The first term is $6$ and the second is $4$. Add them to get $10$.

  - id: q-algebra-algebraic-expressions-0016
    type: direct-computation
    difficulty: medium
    stem: |
      Translate "The product of 4 and a number $x$, plus 5" into an algebraic expression.
    choices:
      - text: '$4x + 5$'
        correct: true
      - text: '$4(x + 5)$'
        rationale: |
          This multiplies the added five by four as well. The words can sound like one grouped amount. Check which quantities form the stated product.
      - text: '$4x - 5$'
        rationale: |
          This subtracts five after the product. The product part is correct, so the final sign can be overlooked. Check the word "plus."
      - text: '$4 + x + 5$'
        rationale: |
          This adds four and $x$ instead of multiplying them. Both quantities still appear in the expression. Check that "product" names multiplication.
    explanation: |
      The product of $4$ and $x$ is $4x$. Adding $5$ after that gives $4x + 5$.

  - id: q-algebra-algebraic-expressions-0017
    type: error-spotting
    difficulty: medium
    stem: |
      A student tries to translate "6 less than twice a number $y$" and writes:

      Step 1: Twice a number $y$ is $2y$.
      Step 2: 6 less than $2y$ is $6 - 2y$.

      Which step is the first incorrect step?
    choices:
      - text: 'Step 2'
        correct: true
      - text: 'Step 1'
        rationale: |
          This treats "twice" as addition rather than multiplication. A number and a letter can make the operation easy to misread. Check that twice means two equal copies.
      - text: 'Both steps'
        rationale: |
          This treats the whole translation as wrong because the final line fails. The first line still translates "twice" correctly. Check the two statements separately.
      - text: 'No step is wrong.'
        rationale: |
          This follows the spoken order for subtraction. The phrase begins with six, so six can seem to go first. Check which quantity is being reduced.
    explanation: |
      Twice $y$ is $2y$. To make it six less, subtract $6$ from that amount: $2y - 6$. The first incorrect step is Step 2.

  - id: q-algebra-algebraic-expressions-0018
    type: direct-computation
    difficulty: medium
    stem: |
      Simplify the expression $3x + 2y - x + 4y$.
    choices:
      - text: '$2x + 6y$'
        correct: true
      - text: '$2x + 2y$'
        rationale: |
          This combines the $x$ terms but drops $4y$. The first pair of like terms is finished. Check that all terms have been grouped.
      - text: '$4x + 6y$'
        rationale: |
          This adds $3x$ and $x$ despite the minus sign. Matching letters make them easy to combine automatically. Check the sign attached to each coefficient.
      - text: '$3x + 6y$'
        rationale: |
          This combines the $y$ terms but drops $-x$. The first $3x$ looks ready to keep. Check for every occurrence of each variable.
    explanation: |
      Group like terms: $(3x - x) + (2y + 4y)$. Their coefficients give $(3 - 1)x + (2 + 4)y = 2x + 6y$.

  - id: q-algebra-algebraic-expressions-0019
    type: which-is-true
    difficulty: easy
    stem: |
      Which statement correctly translates "$5$ is less than $x$"?
    choices:
      - text: '$5 < x$'
        correct: true
      - text: '$x - 5$'
        rationale: |
          This writes an amount instead of a comparison. "Less than" often signals subtraction in a phrase. Check whether the word "is" makes a statement.
      - text: '$5 > x$'
        rationale: |
          This reverses the comparison sign. The sign can look like an arrow pointing toward the smaller number. Check that its open side faces the larger quantity.
      - text: '$x = 5$'
        rationale: |
          This changes an inequality into equality. The word "is" often appears in equations. Check the whole phrase "is less than."
    explanation: |
      The sentence compares $5$ with $x$. Since $5$ is the smaller quantity, write $5 < x$.
    approved: false

  - id: q-algebra-algebraic-expressions-0020
    type: word-problem
    difficulty: exam
    stem: |
      The sum of three consecutive even integers is $S$. Which expression gives the smallest integer?
    choices:
      - text: '$\dfrac{S-6}{3}$'
        correct: true
      - text: '$\dfrac{S}{3}$'
        rationale: |
          This gives the middle integer by averaging. Three equally spaced numbers have their average in the center. Check whether the question asks for the smallest or middle integer.
      - text: '$\dfrac{S+6}{3}$'
        rationale: |
          This gives the largest integer. Moving two above the average is right for the largest. Check the direction needed to reach the smallest.
      - text: '$\dfrac{S-3}{3}$'
        rationale: |
          This uses gaps of one between consecutive even integers. Consecutive integers normally differ by one. Check that even integers differ by two.
    explanation: |
      Let the smallest integer be $n$. The next two are $n+2$ and $n+4$. Their sum is $3n+6=S$. Subtract $6$ and divide by $3$ to get $n=\dfrac{S-6}{3}$.
    approved: false

