meta:
  subject: mathematics
  topic: algebra
  subtopic: radicals-and-rationalization
  exams: [upcat, acet, dlsucet, ustet, pupcet]
questions:
  - id: q-algebra-radicals-and-rationalization-0001
    type: direct-computation
    difficulty: easy
    stem: |
      Simplify $\sqrt{72}$.
    choices:
      - text: '$6\sqrt{2}$'
        correct: true
      - text: '$36\sqrt{2}$'
        rationale: |
          This moves the square factor 36 outside without taking its root. Factoring $72=36(2)$ is correct. Check that the extracted coefficient is the square root of 36.
      - text: '$12$'
        rationale: |
          This treats $\sqrt{36(2)}$ as $2\sqrt{36}$. The factor two is visible in the radicand. Check whether it is also a perfect-square factor.
      - text: '$6\sqrt{12}$'
        rationale: |
          This extracts six but divides 72 by six rather than by thirty-six. The extracted coefficient is right. Check the square of every factor moved outside.
    explanation: |
      Factor $72=36(2)$. Since $\sqrt{36}=6$, the simplified form is $6\sqrt{2}$.

  - id: q-algebra-radicals-and-rationalization-0002
    type: estimate-first
    difficulty: easy
    stem: |
      Which interval contains $\sqrt{50}$?
    choices:
      - text: '$7<\sqrt{50}<8$'
        correct: true
      - text: '$6<\sqrt{50}<7$'
        rationale: |
          This places the root below seven after using the nearby square 49. The nearby square is a useful reference. Check whether 50 is above or below 49.
      - text: '$24<\sqrt{50}<26$'
        rationale: |
          This divides fifty by two instead of taking a square root. The root index is two. Check that a square root is a number whose square gives the radicand.
      - text: '$49<\sqrt{50}<51$'
        rationale: |
          This returns a value near the radicand itself. Fifty is the given number. Check whether the requested quantity is fifty or its root.
    explanation: |
      The nearby squares are $7^2=49$ and $8^2=64$. Since $49<50<64$, taking square roots gives $7<\sqrt{50}<8$.

  - id: q-algebra-radicals-and-rationalization-0003
    type: direct-computation
    difficulty: medium
    stem: |
      Simplify $3\sqrt{20} - \sqrt{45}$.
    choices:
      - text: '$3\sqrt{5}$'
        correct: true
      - text: '$5\sqrt{5}$'
        rationale: |
          This simplifies $\sqrt{45}$ as $\sqrt5$, omitting its square factor. The remaining radical part is right. Check all factors extracted from each radical.
      - text: '$-\sqrt{5}$'
        rationale: |
          This omits the coefficient three on the first radical, giving $2\sqrt5-3\sqrt5$. Each radical is simplified correctly. Check the coefficient outside the root too.
      - text: '$3\sqrt{15}$'
        rationale: |
          This subtracts radicands after moving the first coefficient inside, giving $\sqrt{180-45}$. Moving a positive coefficient inside as its square is valid. Check that separate roots cannot be combined by subtracting their radicands.
    explanation: |
      Simplify $\sqrt{20}=2\sqrt5$ and $\sqrt{45}=3\sqrt5$. Then $3(2\sqrt5)-3\sqrt5=(6-3)\sqrt5=3\sqrt5$.

  - id: q-algebra-radicals-and-rationalization-0004
    type: error-spotting
    difficulty: easy
    stem: |
      A student writes $\sqrt{9} + \sqrt{16} = \sqrt{25}$. What is the error?
    choices:
      - text: 'The radicands were added.'
        correct: true
      - text: 'The roots should have been multiplied.'
        rationale: |
          This replaces addition of roots with multiplication. Multiplication has a valid root-product rule for nonnegative factors. Check the original operation.
      - text: 'The root of sixteen is negative four.'
        rationale: |
          This confuses the principal root with the negative solution of a square equation. Negative four does square to sixteen. Check the meaning of the root symbol alone.
      - text: 'The addition rule was used correctly.'
        rationale: |
          This accepts combining roots by adding their radicands. The sum nine plus sixteen is correctly found. Check each square root before adding.
    explanation: |
      Take each root first: $\sqrt9=3$ and $\sqrt{16}=4$. Add the resulting numbers to get $3+4=7$. Adding the radicands does not perform those steps.

  - id: q-algebra-radicals-and-rationalization-0005
    type: direct-computation
    difficulty: medium
    stem: |
      Rationalize the denominator: $\dfrac{5}{\sqrt{5}}$.
    choices:
      - text: '$\sqrt5$'
        correct: true
      - text: '$5\sqrt5$'
        rationale: |
          This multiplies the numerator by the root but drops the new denominator. Multiplying by the root is part of rationalization. Check that both top and bottom receive the same factor.
      - text: '$\dfrac{\sqrt5}{5}$'
        rationale: |
          This rationalizes as if the original numerator were one. The usual reciprocal-root form looks familiar. Check the original numerator before simplifying.
      - text: '$5$'
        rationale: |
          This removes the root denominator without replacing it. A rational denominator is the goal. Check that the new fraction has the same value.
    explanation: |
      Multiply top and bottom by $\sqrt5$: $\dfrac{5\sqrt5}{5}$. Cancel the factor five to get $\sqrt5$.

  - id: q-algebra-radicals-and-rationalization-0006
    type: which-is-true
    difficulty: medium
    stem: |
      Which statement about $\dfrac{10}{\sqrt5}$ is true?
    choices:
      - text: 'It is defined and equals $2\sqrt5$.'
        correct: true
      - text: 'It is undefined until its denominator is rational.'
        rationale: |
          This treats rationalization as a condition for a fraction to exist. A radical denominator is often rewritten in class. Check that division only requires a nonzero denominator.
      - text: 'It equals $10\sqrt5$ after rationalization.'
        rationale: |
          This multiplies only the numerator by the root. That is half of the rationalization step. Check that multiplying a fraction by one changes both top and bottom.
      - text: 'It equals $2$ after its radical is removed.'
        rationale: |
          This cancels the radical as if it were a common factor in both top and bottom. The numbers ten and five do simplify. Check whether the numerator actually contains the same radical factor.
    explanation: |
      The denominator $\sqrt5$ is positive, so the fraction is defined. Multiply top and bottom by $\sqrt5$ to get $\dfrac{10\sqrt5}{5}=2\sqrt5$.

  - id: q-algebra-radicals-and-rationalization-0007
    type: direct-computation
    difficulty: hard
    stem: |
      Rationalize the denominator: $\dfrac{4}{3 - \sqrt{5}}$.
    choices:
      - text: '$3+\sqrt5$'
        correct: true
      - text: '$\dfrac{4}{3}-\sqrt5$'
        rationale: |
          This divides by three and then subtracts the root separately. That treats a sum in the denominator like separate divisions. Check that the whole denominator is one grouped quantity.
      - text: '$3-\sqrt5$'
        rationale: |
          This uses the original denominator as the final expression. The numerator cancels the conjugate product. Check which conjugate is left in the numerator.
      - text: '$3+4\sqrt5$'
        rationale: |
          This cancels the denominator factor four only from the constant term. The constant three looks correct. Check that a factor divides every numerator term.
    explanation: |
      Multiply by the conjugate $\dfrac{3+\sqrt5}{3+\sqrt5}$. The denominator becomes $9-5=4$. Cancel four from $\dfrac{4(3+\sqrt5)}4$ to get $3+\sqrt5$.

  - id: q-algebra-radicals-and-rationalization-0008
    type: direct-computation
    difficulty: hard
    stem: |
      For real $x,y$ with $x\ge0$, simplify $\sqrt{72x^3y^4}$.
    choices:
      - text: '$6xy^2\sqrt{2x}$'
        correct: true
      - text: '$6x^2y^2\sqrt2$'
        rationale: |
          This extracts all three factors of $x$ as $x^2$ and leaves no $x$ under the root. An odd power can make pair counting confusing. Check how many pairs are in $x^3$.
      - text: '$36xy^2\sqrt{2x}$'
        rationale: |
          This moves 36 outside without taking its square root. The other factor groups are right. Check the square root of each extracted perfect square.
      - text: '$6xy^4\sqrt{2x}$'
        rationale: |
          This leaves $y^4$ unchanged outside the square root. The fourth power is a perfect square. Check that its square root halves the exponent.
    explanation: |
      Write the radicand as $36x^2y^4(2x)$. For real $x,y$ with $x\ge0$, the square roots of the square factors are $6$, $x$, and $y^2$. The result is $6xy^2\sqrt{2x}$.

  - id: q-algebra-radicals-and-rationalization-0009
    type: which-is-true
    difficulty: medium
    stem: |
      What is the value of $\sqrt{25}$?
    choices:
      - text: '$5$'
        correct: true
      - text: '$\pm5$'
        rationale: |
          This gives both solutions of a square equation. Both numbers square to twenty-five. Check that the root symbol asks for the nonnegative principal value.
      - text: '$-5$'
        rationale: |
          This chooses the negative square-equation solution. Negative five does square to twenty-five. Check that a principal square root is nonnegative.
      - text: '$25$'
        rationale: |
          This returns the radicand unchanged. Twenty-five is the number shown under the root. Check which nonnegative number squares to it.
    explanation: |
      The principal square root is the nonnegative value whose square is twenty-five. Since $5^2=25$, $\sqrt{25}=5$.

  - id: q-algebra-radicals-and-rationalization-0010
    type: direct-computation
    difficulty: medium
    stem: |
      Simplify $\sqrt{18} + \sqrt{8}$.
    choices:
      - text: '$5\sqrt2$'
        correct: true
      - text: '$\sqrt{26}$'
        rationale: |
          This adds the radicands inside one root. Addition is the visible operation between the roots. Check that the product rule does not apply to sums.
      - text: '$3\sqrt2$'
        rationale: |
          This simplifies only $\sqrt{18}$ and omits $\sqrt8$. The first radical has been handled correctly. Check that every original term remains.
      - text: '$6\sqrt2$'
        rationale: |
          This multiplies the extracted coefficients three and two instead of adding them. Both radicals now match. Check the operation between the terms.
    explanation: |
      Simplify $\sqrt{18}=3\sqrt2$ and $\sqrt8=2\sqrt2$. Add their coefficients: $(3+2)\sqrt2=5\sqrt2$.

  - id: q-algebra-radicals-and-rationalization-0011
    type: direct-computation
    difficulty: medium
    stem: |
      Multiply $(\sqrt{3} + 2)(\sqrt{3} - 2)$.
    choices:
      - text: '$-1$'
        correct: true
      - text: '$-4$'
        rationale: |
          This omits the product of the radical terms. The constant product is correctly negative four. Check the first product as well as the last.
      - text: '$\sqrt3-4$'
        rationale: |
          This treats $\sqrt3\cdot\sqrt3$ as $\sqrt3$. The repeated radical can look unchanged. Check the product of a number with itself.
      - text: '$1$'
        rationale: |
          This reverses the order of the squared terms. The magnitude of their difference is right. Check which term is squared first in the conjugate product.
    explanation: |
      Use the difference of squares: $(\sqrt3)^2-2^2=3-4=-1$.

  - id: q-algebra-radicals-and-rationalization-0012
    type: error-spotting
    difficulty: hard
    stem: |
      For $x \ne 0$, a student rationalized $\dfrac{1}{\sqrt[3]{x}}$ by multiplying by $\dfrac{\sqrt[3]{x}}{\sqrt[3]{x}}$ and got $\dfrac{\sqrt[3]{x}}{x}$. What is the issue?
    choices:
      - text: 'The denominator is $\sqrt[3]{x^2}$.'
        correct: true
      - text: 'The denominator is $x^2$ after this step.'
        rationale: |
          This treats two cube-root factors as three. The exponent two appears after multiplication. Check that a cube root needs three copies of each factor.
      - text: 'Cube roots of negative inputs are not real.'
        rationale: |
          This applies an even-root restriction to an odd root. Negative radicands do fail for real square roots. Check the root index.
      - text: 'One copy of a cube root removes the radical.'
        rationale: |
          This assumes the square-root shortcut works for a cube root. Both methods multiply by a radical. Check the number of factors needed to complete a cube.
    explanation: |
      The written multiplication produces denominator $\sqrt[3]{x}\sqrt[3]{x}=\sqrt[3]{x^2}$. To obtain $x$ instead, multiply top and bottom by $\sqrt[3]{x^2}$. This gives $\dfrac{\sqrt[3]{x^2}}{x}$ for $x
      e0$.

  - id: q-algebra-radicals-and-rationalization-0013
    type: direct-computation
    difficulty: medium
    stem: |
      Simplify $2\sqrt{12} - \sqrt{27} + \sqrt{3}$.
    choices:
      - text: '$2\sqrt3$'
        correct: true
      - text: '$\sqrt3$'
        rationale: |
          This leaves out the final $\sqrt3$. The first two radicals have been combined correctly. Check that all three original terms are used.
      - text: '$3\sqrt3$'
        rationale: |
          This extracts two instead of three from $\sqrt{27}$. The common radical part is right. Check the square factor nine in twenty-seven.
      - text: '$0$'
        rationale: |
          This omits the outside coefficient two on $\sqrt{12}$. Simplifying the roots then gives coefficients $2-3+1$. Check coefficients already outside each root.
    explanation: |
      Simplify $\sqrt{12}=2\sqrt3$ and $\sqrt{27}=3\sqrt3$. The expression becomes $4\sqrt3-3\sqrt3+\sqrt3=(4-3+1)\sqrt3=2\sqrt3$.

  - id: q-algebra-radicals-and-rationalization-0014
    type: which-is-true
    difficulty: easy
    stem: |
      Which statement correctly compares the principal value $\sqrt{100}$ with the real solutions of $t^2=100$?
    choices:
      - text: '$\sqrt{100}=10,\ t=\pm10$'
        correct: true
      - text: '$\sqrt{100}=\pm10,\ t=\pm10$'
        rationale: |
          This gives two values to the principal root symbol. Both square-equation roots are correctly recognized. Check which notation asks for only the nonnegative root.
      - text: '$\sqrt{100}=10,\ t=10\text{ only}$'
        rationale: |
          This uses only the principal root as the equation’s solution. The positive root is valid. Check whether the negative value also squares to one hundred.
      - text: '$\sqrt{100}=-10,\ t=-10\text{ only}$'
        rationale: |
          This selects only the negative square-equation root and uses it as the principal root. Negative ten does square to one hundred. Check the sign required by the root symbol and both possibilities in the equation.
    explanation: |
      The principal square root is $\sqrt{100}=10$. The equation $t^2=100$ has both $t=10$ and $t=-10$ because both squares are one hundred.

  - id: q-algebra-radicals-and-rationalization-0015
    type: which-is-true
    difficulty: medium
    stem: |
      Let $x$ be a positive rational number. Which factor, applied to both numerator and denominator, guarantees a rational denominator in $\dfrac3{\sqrt{x}}$?
    choices:
      - text: '$\sqrt{x}$'
        correct: true
      - text: '$x$'
        rationale: |
          This uses a rational factor that leaves a square-root factor in the denominator. Multiplying by the radicand looks related to removing the root. Check whether the new denominator is rational for every allowed $x$.
      - text: '$\sqrt[3]{x}$'
        rationale: |
          This uses a cube root to complete a square-root denominator. Both factors are roots of $x$. Check that their indices must match.
      - text: '$\sqrt{x+3}$'
        rationale: |
          This combines the numerator three with the radicand by addition. Both quantities appear in the original fraction. Check that the needed factor makes the denominator’s product a perfect square.
    explanation: |
      Multiply top and bottom by $\sqrt{x}$. The denominator becomes $\sqrt{x}\sqrt{x}=x$. Since $x$ is a positive rational number, that denominator is rational and nonzero.

  - id: q-algebra-radicals-and-rationalization-0016
    type: direct-computation
    difficulty: hard
    stem: |
      For real $x$, simplify $\sqrt{200x^2}$.
    choices:
      - text: '$10|x|\sqrt2$'
        correct: true
      - text: '$10x\sqrt2$'
        rationale: |
          This replaces $\sqrt{x^2}$ with $x$ for negative inputs too. It is correct when $x$ is nonnegative. Check that a principal root cannot be negative.
      - text: '$100|x|\sqrt2$'
        rationale: |
          This moves the factor 100 outside without taking its root. The absolute value is correctly kept. Check the square root of the numerical square factor.
      - text: '$20|x|$'
        rationale: |
          This removes the unmatched factor two from the root as two. The square factor 100 is correctly extracted. Check which factors are perfect squares.
    explanation: |
      Write $\sqrt{200x^2}=\sqrt{100(2)x^2}$. For real $x$, $\sqrt{x^2}=|x|$. Therefore the expression is $10|x|\sqrt2$.

  - id: q-algebra-radicals-and-rationalization-0017
    type: error-spotting
    difficulty: medium
    stem: |
      For real $x$ and $y \ge 0$, a student claims $(x + \sqrt{y})(x - \sqrt{y}) = x^2 + y$. What is the error?
    choices:
      - text: 'The constant product has the wrong sign.'
        correct: true
      - text: 'The cross terms should add instead of cancel.'
        rationale: |
          This treats the two factors as identical rather than conjugate. Equal signs would give equal cross terms. Check that the signs of the radical terms are opposite.
      - text: 'The square of the radical stays a radical.'
        rationale: |
          This treats $(\sqrt y)^2$ as $\sqrt y$. The radical symbol can seem to remain attached to $y$. Check that squaring reverses the principal square root for $y\ge0$.
      - text: 'The first factor should be squared alone.'
        rationale: |
          This repeats the first factor instead of multiplying both different factors. A familiar square-of-a-sum rule can seem useful. Check the sign in the second factor.
    explanation: |
      Expanding gives $x^2-x\sqrt y+x\sqrt y-y$. The middle terms cancel and the constant product is $-y$. The result is $x^2-y$.

  - id: q-algebra-radicals-and-rationalization-0018
    type: direct-computation
    difficulty: hard
    stem: |
      Rationalize: $\dfrac{2}{2 + \sqrt{2}}$.
    choices:
      - text: '$2-\sqrt2$'
        correct: true
      - text: '$2+\sqrt2$'
        rationale: |
          This leaves the original sign after using a conjugate. The denominator product is correctly rational. Check which conjugate appears in the numerator.
      - text: '$1$'
        rationale: |
          This drops the radical term when simplifying the numerator. The rational part cancels with the denominator. Check that every numerator term is kept.
      - text: '$4-2\sqrt2$'
        rationale: |
          This stops at the conjugate numerator and omits division by two. The numerator is correctly expanded. Check the resulting denominator before stopping.
    explanation: |
      Multiply top and bottom by $2-\sqrt2$. The denominator is $4-2=2$. Divide the numerator $2(2-\sqrt2)$ by $2$ to get $2-\sqrt2$.

  - id: q-algebra-radicals-and-rationalization-0019
    type: direct-computation
    difficulty: hard
    stem: |
      Assume the nested expression $L=\sqrt{20+\sqrt{20+\cdots}}$ converges to a real limit. What is $L$?
    choices:
      - text: '$5$'
        correct: true
      - text: '$-4$'
        rationale: |
          This keeps the negative solution of the squared equation. That value does satisfy $L^2-L-20=0$. Check that the original expression is a principal square root.
      - text: '$\sqrt{20}$'
        rationale: |
          This stops at the first square root and drops the repeated tail. A truncated expression gives this value. Check that the convergent tail has the same value as the whole.
      - text: '$20$'
        rationale: |
          This returns the radicand’s fixed term. Twenty appears at every level. Check the outer square root and the repeated tail.
    explanation: |
      The repeated tail has value $L$, so $L=\sqrt{20+L}$. Square both sides: $L^2-L-20=0$. Factor: $(L-5)(L+4)=0$. A principal square root is nonnegative, so $L=5$.
    approved: false

  - id: q-algebra-radicals-and-rationalization-0020
    type: direct-computation
    difficulty: exam
    stem: |
      For real $x\ne0$, rationalize $\dfrac2{\sqrt[3]{4x}}$.
    choices:
      - text: '$\dfrac{\sqrt[3]{2x^2}}{x}$'
        correct: true
      - text: '$\dfrac{\sqrt[3]{4x}}{2x}$'
        rationale: |
          This uses one more copy of the original cube root instead of completing cubes. That is the familiar square-root method. Check that each radicand exponent becomes a multiple of three.
      - text: '$\dfrac{\sqrt[3]{2x^2}}{2x}$'
        rationale: |
          This cancels the factor two only from the numerator’s coefficient. The denominator $2x$ is correctly found. Check that cancellation removes the common factor from both top and bottom.
      - text: '$\dfrac{\sqrt[3]{2x^2}}{|x|}$'
        rationale: |
          This applies the absolute-value rule for square roots to a cube root. Even roots do require a nonnegative value. Check that an odd root preserves the sign of its input.
    explanation: |
      Multiply top and bottom by $\sqrt[3]{2x^2}$. The denominator becomes $\sqrt[3]{8x^3}=2x$. The fraction is $\dfrac{2\sqrt[3]{2x^2}}{2x}$. Cancel two to obtain $\dfrac{\sqrt[3]{2x^2}}{x}$.
    approved: false
