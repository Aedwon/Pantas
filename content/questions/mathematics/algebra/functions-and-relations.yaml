meta:
  subject: mathematics
  topic: algebra
  subtopic: functions-and-relations
  exams: [upcat, acet, dlsucet, ustet, pupcet]
questions:
  - id: q-algebra-functions-and-relations-0001
    type: which-is-true
    difficulty: easy
    stem: |
      Which relation is a function?
    choices:
      - text: '$\{(1,4),(2,5),(3,4)\}$'
        correct: true
      - text: '$\{(1,4),(1,5),(2,6)\}$'
        rationale: |
          This allows input 1 to have two outputs. Reading only the first pair for each input can hide the repeated input. Check every pair with the same first coordinate.
      - text: '$\{(2,3),(2,4),(3,5)\}$'
        rationale: |
          This allows input 2 to have two outputs. The pairs look different when read as whole pairs. Check the first coordinates separately.
      - text: '$\{(1,2),(2,3),(1,4)\}$'
        rationale: |
          This allows input 1 to have two outputs. The repeated input is separated by another pair. Check the whole list for repeated first coordinates.
    explanation: |
      The inputs are $1$, $2$, and $3$. Each has exactly one output. The output $4$ can be shared by two inputs, so this relation is a function.

  - id: q-algebra-functions-and-relations-0002
    type: direct-computation
    difficulty: easy
    stem: |
      For $f(x)=3x+2$, what is $f(x+2)-f(x)$?
    choices:
      - text: '$6$'
        correct: true
      - text: '$3$'
        rationale: |
          This counts an increase of one unit of input. The coefficient 3 is the change for one unit. Check how many units the input increases.
      - text: '$2$'
        rationale: |
          This returns the fixed term of the rule. That term is visible in both outputs. Check that fixed terms cancel when taking a difference.
      - text: '$8$'
        rationale: |
          This adds the fixed term to the change. It treats the change like a fresh total cost. Check whether the question asks for a total or an increase.
    explanation: |
      Find both outputs: $f(x+2)=3(x+2)+2=3x+8$ and $f(x)=3x+2$. Their difference is $(3x+8)-(3x+2)=6$.

  - id: q-algebra-functions-and-relations-0003
    type: direct-computation
    difficulty: medium
    stem: |
      If $f(x) = 2x^2 - 3x + 1$, find $f(-2)$.
    choices:
      - text: '$15$'
        correct: true
      - text: '$3$'
        rationale: |
          This treats $-3(-2)$ as $-6$, giving $8-6+1$. The visible minus sign can suggest a negative product. Check the sign of a product of two negatives.
      - text: '$-1$'
        rationale: |
          This treats $(-2)^2$ as $-4$, giving $-8+6+1$. A negative input can suggest a negative square. Check the two factors used in the square.
      - text: '$11$'
        rationale: |
          This drops the coefficient 2 from the squared term, giving $4+6+1$. Squaring the input is correctly done. Check that the coefficient still multiplies the square.
    explanation: |
      Substitute $-2$ with parentheses: $f(-2)=2(-2)^2-3(-2)+1$. The terms are $8$, $6$, and $1$. Add them to get $15$.

  - id: q-algebra-functions-and-relations-0004
    type: direct-computation
    difficulty: medium
    stem: |
      The proposed domain of the real-valued function $f(x)=\dfrac{5}{x-3}$ is $\{-1,0,3,5\}$. Which member must be removed?
    choices:
      - text: '$3$'
        correct: true
      - text: '$-1$'
        rationale: |
          This excludes a negative input even though the denominator is nonzero. Negative inputs sometimes fail under an even root. Check the actual kind of restriction in this rule.
      - text: '$0$'
        rationale: |
          This excludes zero just because division appears. Division by zero is invalid only when the denominator itself is zero. Check the value of $x-3$.
      - text: '$5$'
        rationale: |
          This excludes the numerator value instead of the zero of the denominator. The 5 is the other visible number in the rule. Check which part could make division undefined.
    explanation: |
      The denominator must be nonzero. Solve $x-3=0$ to find the excluded input, $x=3$. That is the member to remove from the proposed domain.

  - id: q-algebra-functions-and-relations-0005
    type: direct-computation
    difficulty: medium
    stem: |
      Find the domain of $g(x) = \sqrt{x - 2}$.
    choices:
      - text: '$x\ge2$'
        correct: true
      - text: '$x>2$'
        rationale: |
          This removes the endpoint 2. The square root is often thought to need a strictly positive input. Check that the square root of zero is defined.
      - text: '$\text{All real numbers}$'
        rationale: |
          This allows negative values inside the square root. Polynomial functions have no such restriction. Check the radicand of this function.
      - text: '$x\le2$'
        rationale: |
          This reverses the inequality when solving $x-2\ge0$. The subtraction sign can suggest reversing direction. Check whether a negative multiplier was used.
    explanation: |
      A real square root requires $x-2\ge0$. Add $2$ to both sides to get $x\ge2$. The endpoint is included because $\sqrt{0}=0$.

  - id: q-algebra-functions-and-relations-0006
    type: which-is-true
    difficulty: medium
    stem: |
      If $f$ is invertible, what does $f^{-1}(x)$ mean?
    choices:
      - text: 'The function that reverses $f$.'
        correct: true
      - text: 'The reciprocal $\dfrac{1}{f(x)}$.'
        rationale: |
          This reads the superscript $-1$ as an ordinary negative exponent. That notation does mean reciprocal for a number. Check whether it names a function inverse.
      - text: 'The function that negates every output.'
        rationale: |
          This treats the minus sign as changing output signs. Negation can look like a way to undo a value. Check whether the operation restores the original input.
      - text: 'The function that applies $f$ twice.'
        rationale: |
          This repeats the original function. Repeating a step can sometimes look like undoing it. Check that applying an inverse after $f$ restores the input.
    explanation: |
      The inverse reverses the input-output pairs of $f$. If $f(a)=b$, then $f^{-1}(b)=a$ on the inverse domain. It takes an output of $f$ back to its original input.

  - id: q-algebra-functions-and-relations-0007
    type: direct-computation
    difficulty: medium
    stem: |
      If $f(x) = 2x + 1$ and $g(x) = x^2 - 3$, find $(f \circ g)(2)$.
    choices:
      - text: '$3$'
        correct: true
      - text: '$1$'
        rationale: |
          This stops at $g(2)$. The inner calculation gives a finished number. Check that its output must still go through $f$.
      - text: '$5$'
        rationale: |
          This applies $f$ to 2 and stops. Reading the notation left to right can suggest using $f$ first. Check the function closest to the original input.
      - text: '$22$'
        rationale: |
          This computes $g(f(2))$. Both functions are used, so the result can look complete. Check the order named by $f\circ g$.
    explanation: |
      Apply $g$ first: $g(2)=2^2-3=1$. Feed that output into $f$: $f(1)=2(1)+1=3$.

  - id: q-algebra-functions-and-relations-0008
    type: word-problem
    difficulty: medium
    stem: |
      A number passes through two machines. The first adds $3$. The second squares its input and then doubles the square. What is the final output if the original input is $2$?
    choices:
      - text: '$50$'
        correct: true
      - text: '$8$'
        rationale: |
          This squares and doubles the original input without first adding three. The second rule produces a complete number. Check what enters the second rule.
      - text: '$5$'
        rationale: |
          This stops after the first machine adds three. That is the correct intermediate output. Check whether another machine still acts on it.
      - text: '$11$'
        rationale: |
          This reverses the two machines, giving $2(2)^2+3$. Both stated actions are used. Check their stated order.
    explanation: |
      The first machine changes $2$ to $2+3=5$. The second squares that output and doubles it: $2(5^2)=2(25)=50$.

  - id: q-algebra-functions-and-relations-0009
    type: direct-computation
    difficulty: hard
    stem: |
      Find $f^{-1}(x)$ for $f(x)=\dfrac{2x-3}{5}$.
    choices:
      - text: '$\dfrac{5x+3}{2}$'
        correct: true
      - text: '$\dfrac{5}{2x-3}$'
        rationale: |
          This takes the reciprocal of the formula. The superscript $-1$ can suggest a reciprocal. Check that an inverse reverses the input-output relationship.
      - text: '$\dfrac{5x-3}{2}$'
        rationale: |
          This subtracts three when undoing a subtraction. Keeping the original minus sign can seem consistent. Check the opposite operation needed to undo that step.
      - text: '$\dfrac{5x+3}{-2}$'
        rationale: |
          This gives the final division a negative divisor. Moving terms across an equation can lead to changing too many signs. Check the coefficient attached to the unknown after rearranging.
    explanation: |
      Write $y=\dfrac{2x-3}{5}$ and exchange $x$ and $y$: $x=\dfrac{2y-3}{5}$. Multiply by $5$, then add $3$: $5x+3=2y$. Divide by $2$ to get $f^{-1}(x)=\dfrac{5x+3}{2}$.

  - id: q-algebra-functions-and-relations-0010
    type: error-spotting
    difficulty: medium
    stem: |
      A student claims that the range of $f(x)=x^2$, with domain all real numbers, is all real numbers. What is the error?
    choices:
      - text: 'Negative outputs were included.'
        correct: true
      - text: 'Negative inputs were excluded.'
        rationale: |
          This confuses the domain with the range. Negative inputs are allowed in $x^2$. Check whether the claim concerns inputs or outputs.
      - text: 'Zero was included in the range.'
        rationale: |
          This assumes a square must be strictly positive. Many nonzero inputs do give positive squares. Check the output at zero.
      - text: 'Positive outputs were excluded.'
        rationale: |
          This claims the stated range omits positive numbers. The phrase "all real numbers" can be read too quickly. Check which numbers that phrase includes.
    explanation: |
      For a real input, $x^2\ge0$. Every nonnegative value $y$ is produced by $x=\sqrt{y}$. Thus the range is $[0,\infty)$, and the claim incorrectly includes negative outputs.

  - id: q-algebra-functions-and-relations-0011
    type: which-is-true
    difficulty: medium
    stem: |
      Can a function have two different $y$ values for the same $x$ value?
    choices:
      - text: 'No.'
        correct: true
      - text: 'Yes, if each output has only one input.'
        rationale: |
          This uses the test for an inverse instead of the test for a function. A unique input for each output sounds like a uniqueness rule. Check which direction the function definition controls.
      - text: 'Yes, if both outputs are real.'
        rationale: |
          This checks output type instead of output count. Real outputs can satisfy a domain requirement. Check whether one input still has two different outputs.
      - text: 'Yes, if the rule has a square root.'
        rationale: |
          This assumes the two signs of a square root may both be outputs. Solving a squared equation can give two roots. Check that a function must assign just one output per input.
    explanation: |
      The definition of a function requires exactly one output for each input in its domain. Two different outputs for the same input break that requirement.

  - id: q-algebra-functions-and-relations-0012
    type: direct-computation
    difficulty: medium
    stem: |
      If $f(x) = 3x - 2$, find $f^{-1}(7)$.
    choices:
      - text: '$3$'
        correct: true
      - text: '$19$'
        rationale: |
          This evaluates $f(7)$ instead of the inverse at 7. The given rule is easy to apply directly. Check whether 7 is an input or an output of $f$.
      - text: '$\dfrac{5}{3}$'
        rationale: |
          This subtracts two when undoing subtraction, giving $(7-2)/3$. The original minus sign can seem to carry over. Check the inverse operation.
      - text: '$\dfrac{7}{3}+2$'
        rationale: |
          This divides by three before undoing the subtraction. It follows the written order of the original rule. Check that undoing steps reverses their order.
    explanation: |
      Find the input whose output is $7$. Solve $3x-2=7$. Add $2$ to get $3x=9$, then divide by $3$ to get $x=3$. Therefore $f^{-1}(7)=3$.

  - id: q-algebra-functions-and-relations-0013
    type: direct-computation
    difficulty: hard
    stem: |
      Find the domain of $h(x) = \dfrac{\sqrt{x+1}}{x-2}$.
    choices:
      - text: '$x\ge-1,\ x\ne2$'
        correct: true
      - text: '$x\ge-1$'
        rationale: |
          This checks the square root but ignores the denominator. The radicand gives a clear lower limit. Check every part of the formula for restrictions.
      - text: '$x>2$'
        rationale: |
          This requires the denominator to be positive. A denominator only needs to be nonzero. Check which part of the formula requires a sign condition.
      - text: '$x\le-1,\ x\ne2$'
        rationale: |
          This reverses the square-root condition. Subtracting or adding one does not reverse an inequality. Check that the radicand must be nonnegative.
    explanation: |
      The square root requires $x+1\ge0$, so $x\ge-1$. The denominator requires $x-2
      e0$, so $x
      e2$. Both conditions must hold.

  - id: q-algebra-functions-and-relations-0014
    type: which-is-true
    difficulty: medium
    stem: |
      Which ordered pair, when added to $\{(2,1),(3,1),(4,1)\}$, makes the relation fail to be a function?
    choices:
      - text: '$(3,2)$'
        correct: true
      - text: '$(5,1)$'
        rationale: |
          This treats a repeated output as a repeated input. The output 1 is already present. Check the first coordinate, which is the input.
      - text: '$(6,2)$'
        rationale: |
          This treats any new pair as breaking the existing rule. This pair adds a new input. Check whether an old input receives a second output.
      - text: '$(7,1)$'
        rationale: |
          This rejects an output already shared by several inputs. Repeated outputs can look like duplicates. Check that only conflicting outputs for one input break the function rule.
    explanation: |
      Input $3$ already has output $1$. Adding $(3,2)$ gives that same input a second, different output. The enlarged relation is not a function.

  - id: q-algebra-functions-and-relations-0015
    type: direct-computation
    difficulty: medium
    stem: |
      If $f(x) = x^2 + 2x$, find $f(-3)$.
    choices:
      - text: '$3$'
        correct: true
      - text: '$15$'
        rationale: |
          This changes $2(-3)$ to $+6$, giving $9+6$. The square before it is positive. Check the sign of each term separately.
      - text: '$-15$'
        rationale: |
          This treats $(-3)^2$ as $-9$, giving $-9-6$. The input is negative. Check that the square multiplies two negative factors.
      - text: '$9$'
        rationale: |
          This stops after evaluating the square. That is the first complete calculation. Check the remaining linear term.
    explanation: |
      Substitute $-3$: $f(-3)=(-3)^2+2(-3)$. The terms are $9$ and $-6$. Their sum is $3$.

  - id: q-algebra-functions-and-relations-0016
    type: direct-computation
    difficulty: easy
    stem: |
      A function is defined only by $\{(-2,4),(0,4),(3,9)\}$. What is its range?
    choices:
      - text: '$\{4,9\}$'
        correct: true
      - text: '$\{-2,0,3\}$'
        rationale: |
          This lists the inputs rather than the outputs. Each ordered pair starts with its input. Check the second coordinates for the range.
      - text: '$\{0,4,9\}$'
        rationale: |
          This includes the input zero among the outputs. Zero is one of the listed numbers. Check its position in the ordered pair.
      - text: '$\{4,9,13\}$'
        rationale: |
          This includes the sum of the distinct outputs. Adding values can seem like a way to collect them. Check that a range is a set of produced values, not a total.
    explanation: |
      Read the second coordinates: $4$, $4$, and $9$. A set lists each value once. The range is $\{4,9\}$.
    approved: false

  - id: q-algebra-functions-and-relations-0017
    type: which-is-true
    difficulty: medium
    stem: |
      Which condition guarantees that a function has an inverse function on its given domain?
    choices:
      - text: 'Each output comes from only one input.'
        correct: true
      - text: 'Each input has exactly one output.'
        rationale: |
          This repeats the basic definition of a function. That guarantees a rule from inputs to outputs. Check that reversing the rule also gives only one output per input.
      - text: 'The range contains only positive values.'
        rationale: |
          This treats output sign as a test for invertibility. Positive ranges occur in many familiar functions. Check whether different inputs can share an output.
      - text: 'The domain contains no negative values.'
        rationale: |
          This treats input sign as a test for invertibility. Restricting a domain can help some functions become one-to-one. Check uniqueness on the actual domain.
    explanation: |
      The inverse reverses each input-output pair. If each output comes from only one input, reversing the pairs still assigns exactly one value to each inverse input. That gives an inverse function.
    approved: false

  - id: q-algebra-functions-and-relations-0018
    type: direct-computation
    difficulty: hard
    stem: |
      Let $f(u)=\sqrt{u}$ and $g(x)=x-4$, both real-valued. What is the domain of $f(g(x))$?
    choices:
      - text: '$x\ge4$'
        correct: true
      - text: '$x>4$'
        rationale: |
          This excludes an input that makes the radicand zero. Square roots of positive numbers are familiar. Check that a square root of zero is also allowed.
      - text: '$x\ge0$'
        rationale: |
          This applies the square-root condition to $x$ before using $g$. The outer rule requires a nonnegative input. Check that its input is $g(x)$, not $x$.
      - text: '$\text{All real numbers}$'
        rationale: |
          This checks only the inner linear function. That function accepts every real number. Check whether its output is allowed in the outer function.
    explanation: |
      The composition is $\sqrt{x-4}$. Its radicand must satisfy $x-4\ge0$. Adding $4$ gives $x\ge4$.
    approved: false

  - id: q-algebra-functions-and-relations-0019
    type: error-spotting
    difficulty: hard
    stem: |
      A student proposes $g(x)=x$ as the inverse of $f(x)=x^2$ on $[0,\infty)$ because $f(1)=1$ and $g(1)=1$. What is missing from this argument?
    choices:
      - text: 'A check for all allowed inputs.'
        correct: true
      - text: 'A check that the base is positive.'
        rationale: |
          This uses a condition for logarithms or some powers. The squared formula has a visible base. Check which condition establishes an inverse.
      - text: 'A check that the outputs are negative.'
        rationale: |
          This requires a sign change instead of undoing the function. Inverse notation contains a minus sign. Check that inverses restore inputs, whatever their sign.
      - text: 'A check that the functions have equal ranges.'
        rationale: |
          This demands equal ranges from inverse functions. Reversing a function exchanges its domain and range. Check the two compositions instead.
    explanation: |
      One matching pair does not establish an inverse on the whole domain. For instance, $f(2)=4$, but $g(4)=4$, so $g$ does not restore the input $2$. An inverse must undo the function for every allowed input.
    approved: false

  - id: q-algebra-functions-and-relations-0020
    type: word-problem
    difficulty: exam
    stem: |
      A store applies a 20% discount to an item, then adds a delivery fee of P30. Let $d(p)=0.8p$ and $c(p)=p+30$, where $p$ is the original price. Which expression gives the total payment?
    choices:
      - text: '$c(d(p))$'
        correct: true
      - text: '$d(c(p))$'
        rationale: |
          This adds delivery before applying the discount. Both required steps are used. Check that the delivery fee is not part of the discounted item price.
      - text: '$c(p)+d(p)$'
        rationale: |
          This adds two totals that each contain the item price. Both named functions appear, making the expression look complete. Check that the price is paid only once.
      - text: '$c(p)$'
        rationale: |
          This adds the fee without applying the discount. The last billing step is correctly represented. Check whether the discount has already been applied.
    explanation: |
      Apply the discount first to get $d(p)=0.8p$. Feed that discounted price into $c$, which adds $30$. The total is $c(d(p))=0.8p+30$.
    approved: false
