meta:
  subject: mathematics
  topic: algebra
  subtopic: exponents-and-logarithms
  exams: [upcat, acet, dlsucet, ustet, pupcet]
questions:
  - id: q-algebra-exponents-and-logarithms-0001
    type: direct-computation
    difficulty: easy
    stem: |
      Simplify $x^3 \cdot x^5$.
    choices:
      - text: $x^8$
        correct: true
      - text: $x^{15}$
      - text: $x^{-2}$
      - text: $x^2$
    explanation: |
      When multiplying powers with the same base, add the exponents: $x^3 \cdot x^5 = x^{3+5} = x^8$.

  - id: q-algebra-exponents-and-logarithms-0002
    type: direct-computation
    difficulty: easy
    stem: |
      Simplify $\dfrac{x^7}{x^3}$.
    choices:
      - text: $x^4$
        correct: true
      - text: $x^{10}$
      - text: $x^{-4}$
      - text: $x$
    explanation: |
      When dividing powers with the same base, subtract the exponents: $\dfrac{x^7}{x^3} = x^{7-3} = x^4$.

  - id: q-algebra-exponents-and-logarithms-0003
    type: direct-computation
    difficulty: easy
    stem: |
      Simplify $(x^3)^2$.
    choices:
      - text: $x^6$
        correct: true
      - text: $x^5$
      - text: $x^9$
      - text: $x^{3/2}$
    explanation: |
      When raising a power to a power, multiply the exponents: $(x^3)^2 = x^{3 \cdot 2} = x^6$.

  - id: q-algebra-exponents-and-logarithms-0004
    type: direct-computation
    difficulty: medium
    stem: |
      Evaluate $8^{-\frac{2}{3}}$.
    choices:
      - text: $\dfrac{1}{4}$
        correct: true
      - text: $4$
      - text: $-4$
      - text: $\dfrac{1}{2}$
    explanation: |
      Handle the negative: $\dfrac{1}{8^{\frac{2}{3}}}$. The fraction means cube root then square: $\sqrt[3]{8} = 2$, so $2^2 = 4$. Final answer: $\dfrac{1}{4}$.

  - id: q-algebra-exponents-and-logarithms-0005
    type: direct-computation
    difficulty: medium
    stem: |
      Simplify $2^{-3}$.
    choices:
      - text: $\dfrac{1}{8}$
        correct: true
      - text: $-8$
      - text: $-\dfrac{1}{8}$
      - text: $8$
    explanation: |
      A negative exponent means flip the fraction: $2^{-3} = \dfrac{1}{2^3} = \dfrac{1}{8}$.

  - id: q-algebra-exponents-and-logarithms-0006
    type: which-is-true
    difficulty: medium
    stem: |
      Which statement is true?
    choices:
      - text: $\log_2(8) = 3$ because $2^3 = 8$.
        correct: true
      - text: $\log_2(8) = 4$ because $2 \times 4 = 8$.
      - text: $\log_2(8) = 2$ because $2^2 = 4$.
      - text: $\log_2(8)$ is undefined.
    explanation: |
      The logarithm asks: "What power do I need on 2 to get 8?" Since $2^3 = 8$, the answer is 3.

  - id: q-algebra-exponents-and-logarithms-0007
    type: direct-computation
    difficulty: medium
    stem: |
      Evaluate $\log_3(81)$.
    choices:
      - text: $4$
        correct: true
      - text: $3$
      - text: $27$
      - text: $2$
    explanation: |
      Ask: "3 raised to what power gives 81?" Since $3^4 = 81$, the answer is 4.

  - id: q-algebra-exponents-and-logarithms-0008
    type: error-spotting
    difficulty: medium
    stem: |
      A student claims $2^3 \cdot 2^4 = 2^{12}$. What is the error?
    choices:
      - text: When multiplying powers with the same base, add the exponents, not multiply them. It should be $2^7$.
        correct: true
      - text: There is no error.
      - text: The bases should be different.
      - text: The answer should be $2^1$.
    explanation: |
      Multiply means add exponents: $2^3 \cdot 2^4 = 2^{3+4} = 2^7$. Multiplying the exponents gives $2^{12}$.

  - id: q-algebra-exponents-and-logarithms-0009
    type: error-spotting
    difficulty: medium
    stem: |
      A student solves $(2^2)^3$ and writes $2^{2+3} = 2^5$. What is the error?
    choices:
      - text: When raising a power to a power, multiply the exponents, not add them. It should be $2^6$.
        correct: true
      - text: There is no error.
      - text: The answer should be $2^{-1}$.
      - text: Powers cannot be raised to powers.
    explanation: |
      Power to a power means multiply: $(2^2)^3 = 2^{2 \times 3} = 2^6$. Adding gives $2^5$.

  - id: q-algebra-exponents-and-logarithms-0010
    type: direct-computation
    difficulty: hard
    stem: |
      Simplify $\dfrac{x^3 y^2 \cdot x^4 y^{-1}}{x^2 y^3}$.
    choices:
      - text: $\dfrac{x^5}{y^2}$
        correct: true
      - text: $x^5 y^2$
      - text: $\dfrac{x^3}{y^2}$
      - text: $x^2 y$
    explanation: |
      Combine top: $x^3 \cdot x^4 = x^7$ and $y^2 \cdot y^{-1} = y^1$. Divide by bottom: $\dfrac{x^7 y}{x^2 y^3} = \dfrac{x^5}{y^2}$.

  - id: q-algebra-exponents-and-logarithms-0011
    type: direct-computation
    difficulty: hard
    stem: |
      Simplify $2\log(x) + \log(y)$ as a single logarithm.
    choices:
      - text: $\log(x^2 y)$
        correct: true
      - text: $\log(2xy)$
      - text: $\log(x^2 + y)$
      - text: $\log(xy^2)$
    explanation: |
      Bring exponents back: $\log(x^2) + \log(y)$. Addition in logs means multiply: $\log(x^2 y)$.

  - id: q-algebra-exponents-and-logarithms-0012
    type: direct-computation
    difficulty: hard
    stem: |
      Solve $4^{2x-1} = 8^{x+1}$.
    choices:
      - text: $x = 5$
        correct: true
      - text: $x = 1$
      - text: $x = -1$
      - text: $x = 3$
    explanation: |
      Rewrite with base 2: $(2^2)^{2x-1} = (2^3)^{x+1}$. Multiply powers: $2^{4x-2} = 2^{3x+3}$. Set exponents equal: $4x - 2 = 3x + 3$, so $x = 5$.

  - id: q-algebra-exponents-and-logarithms-0013
    type: which-is-true
    difficulty: hard
    stem: |
      If $\log_{10}(2) = a$ and $\log_{10}(3) = b$, which expresses $\log_{10}(12)$?
    choices:
      - text: $2a + b$
        correct: true
      - text: $a + b$
      - text: $a + 2b$
      - text: $ab$
    explanation: |
      Write $12 = 4 \times 3 = 2^2 \times 3$. Then $\log_{10}(2^2 \times 3) = \log_{10}(2^2) + \log_{10}(3) = 2\log_{10}(2) + \log_{10}(3) = 2a + b$.

  - id: q-algebra-exponents-and-logarithms-0014
    type: error-spotting
    difficulty: medium
    stem: |
      A student evaluates $3^{-2}$ and writes $-9$. What is the error?
    choices:
      - text: A negative exponent means flip to make a fraction. It should be $\dfrac{1}{9}$, not $-9$.
        correct: true
      - text: There is no error.
      - text: The answer should be $-3$.
      - text: Negative exponents are undefined.
    explanation: |
      $3^{-2} = \dfrac{1}{3^2} = \dfrac{1}{9}$. The negative sign on the exponent is not a minus sign in the answer.

  - id: q-algebra-exponents-and-logarithms-0015
    type: direct-computation
    difficulty: hard
    stem: |
      Evaluate $16^{\frac{3}{4}}$.
    choices:
      - text: $8$
        correct: true
      - text: $12$
      - text: $4$
      - text: $64$
    explanation: |
      The fractional exponent means fourth root then cube: $\sqrt[4]{16} = 2$, and $2^3 = 8$.
