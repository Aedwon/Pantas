meta:
  subject: mathematics
  topic: algebra
  subtopic: linear-equations-inequalities
  exams: [upcat, acet, dlsucet, ustet, pupcet]
questions:
  - id: q-algebra-linear-equations-inequalities-0001
    type: direct-computation
    difficulty: easy
    stem: |
      Solve $2x + 3 = 7$ for $x$.
    choices:
      - text: $2$
        correct: true
      - text: $5$
        rationale: |
          You added 3 to 7 to get 10, then divided by 2. You must subtract 3 from 7 to get $2x = 4$, so $x = 2$.
      - text: $7$
        rationale: |
          You kept the right-side constant 7 as your answer without solving for $x$. Subtract 3 and divide by 2 to get $x = 2$.
      - text: $1$
        rationale: |
          You subtracted 3 to get 4, but divided 4 by 4 instead of 2. Dividing $2x = 4$ by 2 gives $x = 2$.
    explanation: |
      Subtract 3 from both sides: $2x = 4$. Divide by 2: $x = 2$.

  - id: q-algebra-linear-equations-inequalities-0002
    type: direct-computation
    difficulty: easy
    stem: |
      Solve $3x - 5 = 10$ for $x$.
    choices:
      - text: $5$
        correct: true
      - text: $15$
        rationale: |
          You added 5 to 10 to get 15, but forgot to divide by 3. Divide $3x = 15$ by 3 to get $x = 5$.
      - text: $3$
        rationale: |
          You subtracted 5 from 10 to get 5 instead of adding 5. Adding 5 gives $3x = 15$, so $x = 5$.
      - text: $2$
        rationale: |
          You divided 10 by 5 to get 2. You must add 5 to 10 to get $3x = 15$, then divide by 3 to get $x = 5$.
    explanation: |
      Add 5 to both sides: $3x = 15$. Divide by 3: $x = 5$.

  - id: q-algebra-linear-equations-inequalities-0003
    type: direct-computation
    difficulty: easy
    stem: |
      Solve the inequality $x + 4 < 9$.
    choices:
      - text: $x < 5$
        correct: true
      - text: $x > 5$
        rationale: |
          You flipped the inequality sign without multiplying or dividing by a negative number. Keep the sign as $<$ to get $x < 5$.
      - text: $x < 4$
        rationale: |
          You subtracted 5 from 9 instead of subtracting 4. Subtracting 4 from 9 gives $x < 5$.
      - text: $x > 4$
        rationale: |
          You subtracted 5 from 9 and flipped the sign. Subtracting 4 from both sides yields $x < 5$.
    explanation: |
      Subtract 4 from both sides: $x < 5$.

  - id: q-algebra-linear-equations-inequalities-0004
    type: error-spotting
    difficulty: medium
    stem: |
      A student solves $-2x > 10$ like this.

      Step 1: Divide by $-2$.
      Step 2: $x > -5$.

      Which step is wrong?
    choices:
      - text: Step 1
        rationale: |
          You picked Step 1, but dividing both sides by $-2$ is a valid method. The error occurs in Step 2.
      - text: Step 2
        correct: true
      - text: Both steps
        rationale: |
          You marked both steps as wrong, but Step 1 is a correct approach. Only Step 2 failed to flip the inequality sign.
      - text: No step is wrong.
        rationale: |
          You assumed the solution was correct, but dividing by $-2$ requires flipping the greater-than sign to less-than: $x < -5$.
    explanation: |
      Step 2 is wrong. When dividing by a negative number, we must flip the inequality sign. It should be $x < -5$.

  - id: q-algebra-linear-equations-inequalities-0005
    type: direct-computation
    difficulty: medium
    stem: |
      Solve $\dfrac{3x - 1}{2} = \dfrac{x + 4}{3}$ for $x$.
    choices:
      - text: $\dfrac{11}{7}$
        correct: true
      - text: $\dfrac{7}{11}$
        rationale: |
          You inverted the final fraction. Solving $7x = 11$ by dividing both sides by 7 yields $x = \dfrac{11}{7}$.
      - text: $-\dfrac{11}{7}$
        rationale: |
          You added $-3$ and $-8$ to get $-11$. Cross-multiplying gives $9x - 3 = 2x + 8$, so $7x = 11$ and $x = \dfrac{11}{7}$.
      - text: $3$
        rationale: |
          You rounded or miscalculated the linear combination. From $9x - 3 = 2x + 8$, subtracting $2x$ and adding 3 gives $7x = 11$, so $x = \dfrac{11}{7}$.
    explanation: |
      Cross-multiply: $3(3x - 1) = 2(x + 4)$, giving $9x - 3 = 2x + 8$. Combine like terms: $7x = 11$, so $x = \dfrac{11}{7}$.

  - id: q-algebra-linear-equations-inequalities-0006
    type: direct-computation
    difficulty: hard
    stem: |
      Solve the inequality $-2(x - 4) > 3x + 13$.
    choices:
      - text: $x < -1$
        correct: true
      - text: $x > -1$
        rationale: |
          You forgot to flip the inequality sign when dividing by $-5$. Dividing $-5x > 5$ by $-5$ flips the sign to $x < -1$.
      - text: $x < 1$
        rationale: |
          You distributed $-2(-4)$ as $-8$ instead of $+8$, getting $-5x > 21$ or miscalculating $13 - 8 = 5$.
      - text: $x > 1$
        rationale: |
          You made a sign error during distribution and forgot to flip the inequality sign. Distribute to get $-2x + 8 > 3x + 13$, so $x < -1$.
    explanation: |
      Distribute: $-2x + 8 > 3x + 13$. Combine terms: $-2x - 3x > 13 - 8$, giving $-5x > 5$. Divide by $-5$, flipping the sign: $x < -1$.

  - id: q-algebra-linear-equations-inequalities-0007
    type: direct-computation
    difficulty: medium
    stem: |
      What is the slope of the line $2x + 3y = 6$?
    choices:
      - text: $-\dfrac{2}{3}$
        correct: true
      - text: $\dfrac{2}{3}$
        rationale: |
          You forgot the negative sign in the slope formula $m = -\dfrac{A}{B}$. For $2x + 3y = 6$, $m = -\dfrac{2}{3}$.
      - text: $\dfrac{3}{2}$
        rationale: |
          You took $\dfrac{B}{A}$ without a negative sign. The slope of $Ax + By = C$ is $m = -\dfrac{A}{B} = -\dfrac{2}{3}$.
      - text: $-\dfrac{3}{2}$
        rationale: |
          You took $-\dfrac{B}{A}$ instead of $-\dfrac{A}{B}$. The coefficient of $x$ is 2 and $y$ is 3, so $m = -\dfrac{2}{3}$.
    explanation: |
      For a line in the form $Ax + By = C$, the slope is $m = -\dfrac{A}{B}$. Here, $m = -\dfrac{2}{3}$.

  - id: q-algebra-linear-equations-inequalities-0008
    type: which-is-true
    difficulty: medium
    stem: |
      A line has a slope of $3$. Which statement about a perpendicular line is true?
    choices:
      - text: A perpendicular line has slope $-\dfrac{1}{3}$.
        correct: true
      - text: A perpendicular line has slope $3$.
        rationale: |
          You gave the slope of a parallel line. Perpendicular lines have negative reciprocal slopes, so 3 becomes $-\dfrac{1}{3}$.
      - text: A perpendicular line has slope $\dfrac{1}{3}$.
        rationale: |
          You took the reciprocal without changing the sign. Perpendicular slopes are negative reciprocals: $-\dfrac{1}{3}$.
      - text: A perpendicular line has slope $-3$.
        rationale: |
          You negated the slope without taking the reciprocal. The perpendicular slope must be both flipped and negated: $-\dfrac{1}{3}$.
    explanation: |
      Perpendicular lines have slopes that are negative reciprocals. For slope $3 = \dfrac{3}{1}$, the perpendicular slope is $-\dfrac{1}{3}$.

  - id: q-algebra-linear-equations-inequalities-0009
    type: word-problem
    difficulty: medium
    stem: |
      A sari-sari store owner earns $\text{P}80$ profit on each shirt sold. If she wants to earn a total profit of $\text{P}800$ from these shirts, how many shirts must she sell?
    choices:
      - text: $10$
        correct: true
      - text: $8$
        rationale: |
          You divided 800 by 100 or miscalculated $800 \div 80$. Dividing $800 \div 80$ gives 10 shirts.
      - text: $12$
        rationale: |
          You added extra shirts to the quota. Solve $80s = 800$ by dividing 800 by 80 to get 10.
      - text: $15$
        rationale: |
          You miscalculated the division $800 \div 80$. Dividing 800 by 80 gives exactly 10 shirts.
    explanation: |
      Let $s$ be the number of shirts. At $\text{P}80$ profit per shirt, the equation is $80s = 800$. Divide by 80: $s = 10$.

  - id: q-algebra-linear-equations-inequalities-0010
    type: direct-computation
    difficulty: medium
    stem: |
      Solve $2(x + 3) = 10$ for $x$.
    choices:
      - text: $2$
        correct: true
      - text: $4$
        rationale: |
          You subtracted 2 from 6 or miscalculated $2x = 4$. Distributing gives $2x + 6 = 10$, so $2x = 4$ and $x = 2$.
      - text: $5$
        rationale: |
          You divided 10 by 2 to get 5, but forgot to subtract 3 afterwards. Dividing first gives $x + 3 = 5$, so $x = 2$.
      - text: $7$
        rationale: |
          You added 2 and 5 or miscalculated $2x + 6 = 10$. Subtracting 6 gives $2x = 4$, so $x = 2$.
    explanation: |
      Distribute: $2x + 6 = 10$. Subtract 6: $2x = 4$. Divide by 2: $x = 2$.

  - id: q-algebra-linear-equations-inequalities-0011
    type: error-spotting
    difficulty: medium
    stem: |
      A student solves $5 - x > 2$ like this.

      Step 1: $-x > 2 - 5$
      Step 2: $-x > -3$
      Step 3: $x > 3$

      Which step is wrong?
    choices:
      - text: Step 1
        rationale: |
          You selected Step 1, but subtracting 5 from both sides to get $-x > 2 - 5$ is correct.
      - text: Step 2
        rationale: |
          You selected Step 2, but calculating $2 - 5 = -3$ is correct. The error occurs in Step 3.
      - text: Step 3
        correct: true
      - text: No step is wrong.
        rationale: |
          You assumed all steps were accurate, but dividing by $-1$ reverses the inequality symbol, making $x < 3$ the true result.
    explanation: |
      Step 3 is wrong. When dividing by $-1$, we must flip the inequality sign. It should be $x < 3$.

  - id: q-algebra-linear-equations-inequalities-0012
    type: direct-computation
    difficulty: medium
    stem: |
      What is the slope of the line through the points $(1, 2)$ and $(3, 6)$?
    choices:
      - text: $2$
        correct: true
      - text: $\dfrac{1}{2}$
        rationale: |
          You calculated $\dfrac{\Delta x}{\Delta y} = \dfrac{3 - 1}{6 - 2} = \dfrac{2}{4} = \dfrac{1}{2}$. Slope is $\dfrac{\Delta y}{\Delta x} = \dfrac{4}{2} = 2$.
      - text: $1$
        rationale: |
          You subtracted coordinates from different points ($3 - 2 = 1$). To find slope, apply $\dfrac{y_2 - y_1}{x_2 - x_1} = \dfrac{6 - 2}{3 - 1} = 2$.
      - text: $3$
        rationale: |
          You used the x-coordinate of the second point. Calculate slope using $m = \dfrac{6 - 2}{3 - 1} = \dfrac{4}{2} = 2$.
    explanation: |
      Using the slope formula $m = \dfrac{y_2 - y_1}{x_2 - x_1}$, we get $m = \dfrac{6 - 2}{3 - 1} = \dfrac{4}{2} = 2$.

  - id: q-algebra-linear-equations-inequalities-0013
    type: direct-computation
    difficulty: medium
    stem: |
      Find the equation of the line with slope $2$ passing through the point $(1, 3)$.
    choices:
      - text: $y = 2x + 1$
        correct: true
      - text: $y = 2x + 3$
        rationale: |
          You used the y-coordinate 3 directly as the y-intercept $b$. Substitute $(1, 3)$ into $y = 2x + b$ to find $3 = 2(1) + b$, so $b = 1$.
      - text: $y = 2x - 1$
        rationale: |
          You subtracted 2 from 1 instead of calculating $b = 3 - 2 = 1$. Substituting $(1, 3)$ yields $y = 2x + 1$.
      - text: $y = 2x - 3$
        rationale: |
          You subtracted 3 instead of solving $3 = 2(1) + b$. The y-intercept is $b = 3 - 2 = 1$, giving $y = 2x + 1$.
    explanation: |
      Using point-slope form: $y - 3 = 2(x - 1)$. Expand: $y - 3 = 2x - 2$. Solve for $y$: $y = 2x + 1$.

  - id: q-algebra-linear-equations-inequalities-0014
    type: direct-computation
    difficulty: medium
    stem: |
      What is the y-intercept of the line $2x + 3y = 12$?
    choices:
      - text: $4$
        correct: true
      - text: $6$
        rationale: |
          You computed the x-intercept instead. To get the y-intercept, set $x = 0$, leading to $3y = 12$, which gives $y = 4$.
      - text: $2$
        rationale: |
          You picked the coefficient of $x$. To find the y-intercept, set $x = 0$ and solve $3y = 12$ to get $y = 4$.
      - text: $3$
        rationale: |
          You picked the coefficient of $y$. Divide the constant 12 by the coefficient 3 to get the y-intercept $y = 4$.
    explanation: |
      Cover the $x$ term with your finger. You see $3y = 12$, so $y = 4$.

  - id: q-algebra-linear-equations-inequalities-0015
    type: direct-computation
    difficulty: medium
    stem: |
      What is the x-intercept of the line $2x + 3y = 12$?
    choices:
      - text: $6$
        correct: true
      - text: $4$
        rationale: |
          You calculated the y-intercept instead. For the x-intercept, substitute $y = 0$ into $2x + 3y = 12$ to find $x = 6$.
      - text: $2$
        rationale: |
          You picked the coefficient of $x$. Divide 12 by 2 to get the x-intercept $x = 6$.
      - text: $3$
        rationale: |
          You chose 3, which is the coefficient of $y$. To find the x-intercept, set $y = 0$, giving $2x = 12$, so $x = 6$.
    explanation: |
      Cover the $y$ term with your finger. You see $2x = 12$, so $x = 6$.

  - id: q-algebra-linear-equations-inequalities-0016
    type: which-is-true
    difficulty: medium
    stem: |
      Which inequality would be graphed with a dashed boundary line?
    choices:
      - text: $x < 5$
        correct: true
      - text: $x \le 5$
        rationale: |
          You picked an inequality with $\le$, which includes the boundary and requires a solid line, not dashed.
      - text: $x \ge 5$
        rationale: |
          You selected $\ge$, which includes boundary points. A solid line represents $\ge$, whereas dashed lines are for strict inequalities.
      - text: $x = 5$
        rationale: |
          You picked an equation. Equations are drawn with solid lines, whereas strict inequalities use dashed boundary lines.
    explanation: |
      A dashed line is used for strict inequalities: $<$ or $>$. Non-strict inequalities ($\le$ or $\ge$) use solid lines.

  - id: q-algebra-linear-equations-inequalities-0017
    type: word-problem
    difficulty: easy
    stem: |
      A jeepney driver charges $\text{P}150$ per hour. If he earned $\text{P}1200$ in one day, how many hours did he work?
    choices:
      - text: $8$
        correct: true
      - text: $6$
        rationale: |
          You calculated $1200 \div 200 = 6$ or made an error dividing 1200 by 150. Dividing $1200 \div 150$ gives 8 hours.
      - text: $10$
        rationale: |
          You evaluated $1200 \div 120 = 10$. Solve $150h = 1200$ by dividing 1200 by 150 to get 8 hours.
      - text: $1200$
        rationale: |
          You picked the overall daily pay in pesos. To solve for hours, divide the total pay of 1200 pesos by the hourly rate of 150 pesos.
    explanation: |
      Let $h$ be the hours worked. The equation is $150h = 1200$. Divide by 150: $h = 8$.

  - id: q-algebra-linear-equations-inequalities-0018
    type: direct-computation
    difficulty: easy
    stem: |
      Solve $\dfrac{x}{2} - 3 = 5$ for $x$.
    choices:
      - text: $16$
        correct: true
      - text: $4$
        rationale: |
          You subtracted 3 from 5 to get 2, then multiplied by 2. You must add 3 to 5 to get $\dfrac{x}{2} = 8$, so $x = 16$.
      - text: $8$
        rationale: |
          You added 3 to 5 to get $\dfrac{x}{2} = 8$, but forgot to multiply by 2. Multiplying 8 by 2 gives $x = 16$.
      - text: $20$
        rationale: |
          You added 3 to 5 to get 8, then multiplied by something else, or added $5 \times 2 + 10$. Adding 3 gives $\dfrac{x}{2} = 8$, so $x = 16$.
    explanation: |
      Add 3 to both sides: $\dfrac{x}{2} = 8$. Multiply by 2: $x = 16$.
