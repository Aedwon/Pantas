meta:
  subject: mathematics
  topic: algebra
  subtopic: linear-equations-inequalities
  exams: [upcat, acet, dlsucet, ustet, pupcet]
questions:
  - id: q-algebra-linear-equations-inequalities-0001
    type: direct-computation
    difficulty: easy
    stem: |
      Solve $2x + 3 = 7$ for $x$.
    choices:
      - text: '$2$'
        correct: true
      - text: '$5$'
        rationale: |
          This adds three instead of subtracting it, giving $(7+3)/2$. The added term is being moved across the equation. Check the operation that undoes addition.
      - text: '$7$'
        rationale: |
          This uses the right side as the value of $x$. The equation already gives a number. Check whether that number equals $x$ or a whole expression.
      - text: '$8$'
        rationale: |
          This multiplies by two after subtracting three. The coefficient 2 suggests multiplication. Check the opposite operation needed to isolate $x$.
    explanation: |
      Subtract $3$ from both sides to get $2x=4$. Divide both sides by $2$ to get $x=2$.

  - id: q-algebra-linear-equations-inequalities-0002
    type: word-problem
    difficulty: easy
    stem: |
      Five is subtracted from three times a number. The result is ten. What is the number?
    choices:
      - text: '$5$'
        correct: true
      - text: '$15$'
        rationale: |
          This stops after adding five to ten. That correctly undoes the subtraction. Check whether the factor of three still needs to be undone.
      - text: '$\dfrac{5}{3}$'
        rationale: |
          This subtracts five from ten before dividing by three. The original minus sign is kept. Check the opposite operation needed to undo subtraction.
      - text: '$45$'
        rationale: |
          This multiplies fifteen by three instead of dividing. The phrase "three times" suggests multiplication. Check that solving reverses the original operation.
    explanation: |
      Let the number be $x$. The statement gives $3x-5=10$. Add $5$ to obtain $3x=15$. Divide by $3$ to get $x=5$.

  - id: q-algebra-linear-equations-inequalities-0003
    type: direct-computation
    difficulty: easy
    stem: |
      Solve the inequality $x + 4 < 9$.
    choices:
      - text: '$x<5$'
        correct: true
      - text: '$x>5$'
        rationale: |
          This reverses the inequality after subtracting four. Reversal is a real rule for some operations. Check that it happens only when multiplying or dividing by a negative number.
      - text: '$x<13$'
        rationale: |
          This adds four to nine instead of subtracting it. Both sides still contain the given numbers. Check the inverse operation for $+4$.
      - text: '$x\le5$'
        rationale: |
          This includes the boundary value five. That value is where the two sides are equal. Check whether the original comparison allows equality.
    explanation: |
      Subtract $4$ from both sides. This gives $x<9-4$, or $x<5$. Subtraction does not reverse the sign.

  - id: q-algebra-linear-equations-inequalities-0004
    type: error-spotting
    difficulty: medium
    stem: |
      A student solves $-2x > 10$ like this.

      Step 1: Divide by $-2$.
      Step 2: $x > -5$.

      Which step is the first incorrect step?
    choices:
      - text: 'Step 2'
        correct: true
      - text: 'Step 1'
        rationale: |
          This rejects dividing by a negative number. That division is allowed. Check whether the inequality sign changes afterward.
      - text: 'Both steps'
        rationale: |
          This treats the valid division as another error. The final inequality is wrong, so the earlier action can look wrong too. Check each step on its own.
      - text: 'No step is wrong.'
        rationale: |
          This keeps the comparison direction after a negative division. The numerical division is correctly done. Check the sign of the divisor.
    explanation: |
      Dividing both sides by $-2$ gives $x<-5$. The comparison reverses because the divisor is negative. Step 2 is the first incorrect step.

  - id: q-algebra-linear-equations-inequalities-0005
    type: direct-computation
    difficulty: medium
    stem: |
      Solve $\dfrac{3x - 1}{2} = \dfrac{x + 4}{3}$ for $x$.
    choices:
      - text: '$\dfrac{11}{7}$'
        correct: true
      - text: '$\dfrac{7}{11}$'
        rationale: |
          This reverses the final division in $7x=11$. Both numbers are in the fraction. Check which number is the coefficient of $x$.
      - text: '$-\dfrac{11}{7}$'
        rationale: |
          This subtracts the $x$ terms in reverse order but keeps the constant difference. Moving terms can make the signs confusing. Check that the same operation is applied to both sides.
      - text: '$\dfrac{5}{7}$'
        rationale: |
          This changes $3(3x-1)$ to $9x+3$. The outside factor is distributed, but the minus sign is lost. Check the sign of each product.
    explanation: |
      Cross-multiply: $3(3x-1)=2(x+4)$. Expand to get $9x-3=2x+8$. Subtract $2x$ and add $3$: $7x=11$. Divide by $7$ to get $x=\dfrac{11}{7}$.

  - id: q-algebra-linear-equations-inequalities-0006
    type: direct-computation
    difficulty: hard
    stem: |
      Solve the inequality $-2(x - 4) > 3x + 13$.
    choices:
      - text: '$x<-1$'
        correct: true
      - text: '$x>-1$'
        rationale: |
          This keeps the inequality direction when dividing by $-5$. The resulting boundary number is right. Check the sign of the divisor.
      - text: '$x<1$'
        rationale: |
          This uses $8-13$ for the constant difference while using $-2x-3x$ on the left. Rearranging both sides can make the subtraction order unclear. Check each move by applying the same operation to both sides.
      - text: '$x<-\dfrac{21}{5}$'
        rationale: |
          This changes $-2(-4)$ to $-8$ when distributing. A negative outside the parentheses can hide the second negative. Check the sign of each product.
    explanation: |
      Distribute: $-2x+8>3x+13$. Subtract $3x$ and $8$ to get $-5x>5$. Divide by $-5$ and reverse the sign to obtain $x<-1$.

  - id: q-algebra-linear-equations-inequalities-0007
    type: direct-computation
    difficulty: medium
    stem: |
      What is the slope of the line $2x + 3y = 6$?
    choices:
      - text: '$-\dfrac{2}{3}$'
        correct: true
      - text: '$\dfrac{2}{3}$'
        rationale: |
          This drops the negative sign when moving $2x$. The coefficient ratio is otherwise right. Check the sign when isolating $y$.
      - text: '$\dfrac{3}{2}$'
        rationale: |
          This reverses the coefficient ratio and drops the sign. It can look like rise over run with the axes reversed. Check which coefficient multiplies $x$ after isolating $y$.
      - text: '$-\dfrac{3}{2}$'
        rationale: |
          This uses $-B/A$ instead of $-A/B$. Both coefficients appear in the ratio. Check that the equation is solved for $y$.
    explanation: |
      Subtract $2x$ to get $3y=-2x+6$. Divide by $3$: $y=-\dfrac{2}{3}x+2$. The coefficient of $x$ is the slope, $-\dfrac{2}{3}$.

  - id: q-algebra-linear-equations-inequalities-0008
    type: which-is-true
    difficulty: medium
    stem: |
      A line has slope $3$. Which statement relates its slope to the slope of a perpendicular line?
    choices:
      - text: 'Their slopes have product $-1$.'
        correct: true
      - text: 'Their slopes are equal to each other.'
        rationale: |
          This uses the same slope as the original line. Equal slopes describe parallel lines. Check whether the question asks for parallel or perpendicular.
      - text: 'Their slopes have product $1$.'
        rationale: |
          This takes the reciprocal but keeps the sign. One part of the perpendicular rule is used. Check that nonzero perpendicular slopes have product $-1$.
      - text: 'Their slopes are negatives of each other.'
        rationale: |
          This changes the sign but keeps the magnitude. That can look like reversing the direction of the line. Check that the reciprocal is also required.
    explanation: |
      For a nonzero finite slope, the perpendicular slope is its negative reciprocal. Thus the slope is $-\dfrac{1}{3}$, and $3\left(-\dfrac{1}{3}
      ight)=-1$.

  - id: q-algebra-linear-equations-inequalities-0009
    type: word-problem
    difficulty: medium
    stem: |
      A sari-sari store owner earns $\text{P}80$ profit on each shirt sold. If she wants to earn a total profit of $\text{P}800$ from these shirts, how many shirts must she sell?
    choices:
      - text: '$10$'
        correct: true
      - text: '$100$'
        rationale: |
          This divides by eight instead of eighty. Dropping the zero makes the mental division familiar. Check the full profit per shirt.
      - text: '$0.1$'
        rationale: |
          This divides the profit per shirt by the target profit. Both required amounts are used. Check that total profit divided by profit per shirt gives a shirt count.
      - text: '$720$'
        rationale: |
          This subtracts one shirt’s profit from the target. That gives the amount still needed after one sale. Check that the question asks for a count of equal sales.
    explanation: |
      Let $n$ be the number of shirts. Then $80n=800$. Divide by $80$ to get $n=10$.

  - id: q-algebra-linear-equations-inequalities-0010
    type: direct-computation
    difficulty: medium
    stem: |
      Solve $2(x + 3) = 10$ for $x$.
    choices:
      - text: '$2$'
        correct: true
      - text: '$\dfrac{7}{2}$'
        rationale: |
          This distributes two to $x$ but not to three, giving $2x+3=10$. The first product is correct. Check that every term inside the parentheses receives the factor.
      - text: '$5$'
        rationale: |
          This divides ten by two and stops. That correctly removes the outside factor. Check the remaining addition inside the parentheses.
      - text: '$7$'
        rationale: |
          This subtracts three from ten without first undoing the outside factor. The number three is visibly added. Check the order in which the grouped operations are undone.
    explanation: |
      Divide both sides by $2$ to get $x+3=5$. Subtract $3$ to get $x=2$.

  - id: q-algebra-linear-equations-inequalities-0011
    type: error-spotting
    difficulty: medium
    stem: |
      A student solves $5 - x > 2$ like this.

      Step 1: $-x > 2 - 5$
      Step 2: $-x > -3$
      Step 3: $x > 3$

      Which step is the first incorrect step?
    choices:
      - text: 'Step 3'
        correct: true
      - text: 'Step 1'
        rationale: |
          This rejects subtracting five from both sides. Moving a term across the comparison can look unsafe. Check that addition and subtraction preserve the direction.
      - text: 'Step 2'
        rationale: |
          This treats $2-5=-3$ as an error. A negative result can seem suspicious. Check the subtraction on a number line.
      - text: 'No step is wrong.'
        rationale: |
          This accepts dropping the minus sign without reversing the comparison. The boundary number is right. Check the effect of dividing by $-1$.
    explanation: |
      The first two steps give $-x>-3$. Divide both sides by $-1$ and reverse the sign: $x<3$. Step 3 is the first incorrect step.

  - id: q-algebra-linear-equations-inequalities-0012
    type: direct-computation
    difficulty: medium
    stem: |
      What is the slope of the line through the points $(1, 2)$ and $(3, 6)$?
    choices:
      - text: '$2$'
        correct: true
      - text: '$\dfrac{1}{2}$'
        rationale: |
          This divides horizontal change by vertical change. Both differences are correctly calculated. Check that slope is rise divided by run.
      - text: '$4$'
        rationale: |
          This uses only the vertical change $6-2$. That is the numerator of the slope. Check the horizontal change too.
      - text: '$-2$'
        rationale: |
          This reverses the order in only one coordinate difference. The same two points are used. Check that both differences follow the same point order.
    explanation: |
      The rise is $6-2=4$ and the run is $3-1=2$. Their ratio is $\dfrac{4}{2}=2$.

  - id: q-algebra-linear-equations-inequalities-0013
    type: direct-computation
    difficulty: medium
    stem: |
      Find the equation of the line with slope $2$ passing through the point $(1, 3)$.
    choices:
      - text: '$y=2x+1$'
        correct: true
      - text: '$y=2x+3$'
        rationale: |
          This uses the point’s $y$-coordinate as the intercept. A point on the line can look like the starting point. Check whether its $x$-coordinate is zero.
      - text: '$y=2x-1$'
        rationale: |
          This reverses $3-2$ when finding the intercept. Subtracting the slope contribution is the right idea. Check the order by substituting the given point.
      - text: '$y=2x-3$'
        rationale: |
          This negates the point’s $y$-coordinate and uses it as the intercept. Point-slope form contains a subtraction of that coordinate. Check the complete rearrangement.
    explanation: |
      Use $y=2x+b$. Substitute $(1,3)$: $3=2(1)+b$. Thus $b=1$, and the equation is $y=2x+1$.

  - id: q-algebra-linear-equations-inequalities-0014
    type: direct-computation
    difficulty: medium
    stem: |
      What is the y-intercept of the line $2x + 3y = 12$?
    choices:
      - text: '$4$'
        correct: true
      - text: '$6$'
        rationale: |
          This finds the $x$-intercept by setting $y=0$. Both intercepts lie on an axis. Check which coordinate must be zero on the $y$-axis.
      - text: '$-4$'
        rationale: |
          This moves the constant with the wrong sign. Dividing by three is otherwise right. Check the original equation at $x=0$.
      - text: '$12$'
        rationale: |
          This leaves out division by the coefficient of $y$. The right side is the remaining constant. Check the coefficient still attached to $y$.
    explanation: |
      At the $y$-intercept, $x=0$. The equation becomes $3y=12$. Divide by $3$ to get $y=4$.

  - id: q-algebra-linear-equations-inequalities-0015
    type: which-is-true
    difficulty: medium
    stem: |
      Which point lies on the line $2x+3y=12$?
    choices:
      - text: '$(3,2)$'
        correct: true
      - text: '$(2,3)$'
        rationale: |
          This swaps the coefficients of $x$ and $y$, giving $3(2)+2(3)=12$. The point appears to satisfy a similar equation. Check the coefficient attached to each coordinate.
      - text: '$(6,4)$'
        rationale: |
          This combines the two separate intercept values into one point. Each value works when the other coordinate is zero. Check the two coordinates together in the equation.
      - text: '$(12,0)$'
        rationale: |
          This treats the $x$ term as $x$ instead of $2x$. The point would work for a coefficient of one. Check that the coefficient multiplies the input.
    explanation: |
      Substitute $x=3$ and $y=2$: $2(3)+3(2)=6+6=12$. Therefore $(3,2)$ lies on the line.

  - id: q-algebra-linear-equations-inequalities-0016
    type: which-is-true
    difficulty: medium
    stem: |
      Which inequality, drawn in the coordinate plane, uses a dashed vertical boundary?
    choices:
      - text: '$x<5$'
        correct: true
      - text: '$x\le5$'
        rationale: |
          This includes the boundary. The same vertical line separates the region. Check that equality requires a solid boundary.
      - text: '$x\ge5$'
        rationale: |
          This includes the boundary and shades the other side. Both are valid features of a different inequality. Check the comparison sign and whether it contains equality.
      - text: '$x=5$'
        rationale: |
          This gives the line alone instead of a region. It identifies the right boundary location. Check that an inequality also includes points on one side.
    explanation: |
      A strict inequality does not include its boundary. The inequality $x<5$ uses the dashed vertical line $x=5$ and includes points to its left.

  - id: q-algebra-linear-equations-inequalities-0017
    type: word-problem
    difficulty: easy
    stem: |
      A jeepney rental has a fixed booking fee of P300 plus P150 per hour. The total bill is P1200. For how many hours was the jeepney rented?
    choices:
      - text: '$6$'
        correct: true
      - text: '$8$'
        rationale: |
          This divides the full payment by the hourly rate without removing the booking fee. The hourly rate is correctly used. Check whether the total includes a fixed charge.
      - text: '$10$'
        rationale: |
          This adds the booking fee before dividing by the hourly rate. Both charges appear in the work. Check that the fee is already included in the payment.
      - text: '$900$'
        rationale: |
          This subtracts the booking fee but stops at the hourly earnings. That is a correct intermediate amount. Check that a time still needs to be found.
    explanation: |
      Let $h$ be the rental hours. The payment gives $300+150h=1200$. Subtract $300$ to get $150h=900$. Divide by $150$ to obtain $h=6$.

  - id: q-algebra-linear-equations-inequalities-0018
    type: direct-computation
    difficulty: easy
    stem: |
      Solve $\dfrac{x}{2} - 3 = 5$ for $x$.
    choices:
      - text: '$16$'
        correct: true
      - text: '$4$'
        rationale: |
          This divides by two after adding three. The original expression contains division by two. Check the opposite operation needed to isolate $x$.
      - text: '$8$'
        rationale: |
          This adds three but stops at $x/2=8$. That completes one solving step. Check whether $x$ is alone yet.
      - text: '$13$'
        rationale: |
          This doubles five before adding three, giving $10+3$. It undoes the operations in the wrong order. Check that the subtraction is undone before the division.
    explanation: |
      Add $3$ to both sides to get $\dfrac{x}{2}=8$. Multiply both sides by $2$ to get $x=16$.

  - id: q-algebra-linear-equations-inequalities-0019
    type: which-is-true
    difficulty: hard
    stem: |
      Which line is perpendicular to the line $x=4$?
    choices:
      - text: '$y=-2$'
        correct: true
      - text: '$x=-2$'
        rationale: |
          This uses another vertical line. The same form makes the directions match. Check that equal directions give parallel lines.
      - text: '$y=x+4$'
        rationale: |
          This uses slope one as a reciprocal of an undefined slope. A vertical line has no finite slope to invert. Check the horizontal-vertical perpendicular case.
      - text: '$y=-x+4$'
        rationale: |
          This uses a downward diagonal because it points in a different direction. Different directions do not always meet at a right angle. Check that a perpendicular to a vertical line is horizontal.
    explanation: |
      The line $x=4$ is vertical. A horizontal line meets it at a right angle. The equation $y=-2$ describes a horizontal line.
    approved: false

  - id: q-algebra-linear-equations-inequalities-0020
    type: word-problem
    difficulty: exam
    stem: |
      A region in the coordinate plane has a solid boundary through $(0,4)$ and $(2,0)$. The region includes $(0,0)$. Which inequality describes it?
    choices:
      - text: '$2x+y\le4$'
        correct: true
      - text: '$2x+y\ge4$'
        rationale: |
          This shades the side that excludes the origin. The boundary equation and solid-line sign are right. Check the stated included point.
      - text: '$2x+y<4$'
        rationale: |
          This excludes the boundary even though the line is solid. The side of the line is right. Check whether equality belongs in the comparison.
      - text: '$x+2y\le4$'
        rationale: |
          This swaps the coefficients and changes the boundary. Both intercept numbers appear in the equation. Check each given point by substitution.
    explanation: |
      The line through the intercepts is $2x+y=4$. A solid boundary includes equality. At the origin, $2(0)+0=0\le4$. Thus the included side is $2x+y\le4$.
    approved: false
