meta:
  subject: mathematics
  topic: algebra
  subtopic: sets-and-set-notation
  exams: [upcat, acet, dlsucet, ustet, pupcet]
questions:
  - id: q-algebra-sets-and-set-notation-0001
    type: direct-computation
    difficulty: easy
    stem: |
      Let $A = \{1, 3, 5, 7\}$ and $B = \{3, 5, 8, 9\}$. Find the intersection $A \cap B$.
    choices:
      - text: '$\{3,5\}$'
        correct: true
      - text: '$\{1,3,5,7,8,9\}$'
        rationale: |
          This finds the union instead of the intersection. Combining all members is a familiar set operation. Check whether the symbol asks for either set or both sets.
      - text: '$\{1,7\}$'
        rationale: |
          This keeps the members only in $A$. Removing the overlap can look like comparing two sets. Check that the intersection keeps the shared members.
      - text: '$\{8,9\}$'
        rationale: |
          This keeps the members only in $B$. They are the new members in the second list. Check that the intersection requires membership in both lists.
    explanation: |
      Read each member of $A$ and check whether it also appears in $B$. The shared members are $3$ and $5$. Thus $A\cap B=\{3,5\}$.

  - id: q-algebra-sets-and-set-notation-0002
    type: which-is-true
    difficulty: easy
    stem: |
      Which of the following statements correctly uses set notation to express that $5$ is an element of set $S = \{2, 4, 5, 8\}$?
    choices:
      - text: '$5\in S$'
        correct: true
      - text: '$5\subset S$'
        rationale: |
          This uses a subset symbol for one listed element. Both symbols describe belonging in some way. Check whether the left side names an element or a set.
      - text: '$S\in5$'
        rationale: |
          This reverses the element and set. Both names are present. Check that the member goes before the membership symbol.
      - text: '$5\subseteq S$'
        rationale: |
          This uses subset inclusion for a number treated as a single element. The extra equality bar can look like including the element. Check that membership uses $\in$.
    explanation: |
      The number $5$ appears in the list defining $S$. The symbol $\in$ means "is an element of." Therefore $5\in S$.

  - id: q-algebra-sets-and-set-notation-0003
    type: direct-computation
    difficulty: easy
    stem: |
      Let the universal set be $U = \{1, 2, 3, 4, 5, 6, 7, 8\}$ and set $A = \{2, 4, 6, 8\}$. Find the complement $A'$.
    choices:
      - text: '$\{1,3,5,7\}$'
        correct: true
      - text: '$\{2,4,6,8\}$'
        rationale: |
          This repeats $A$ instead of taking its complement. All these members belong to the universal set. Check that a complement excludes members of $A$.
      - text: '$\{1,2,3,4,5,6,7,8\}$'
        rationale: |
          This keeps the entire universal set. The complement is found within that set. Check that members of $A$ must be removed.
      - text: '$\emptyset$'
        rationale: |
          This assumes $A$ covers the entire universal set. Its four even members can look like a complete pattern. Check the odd members still outside $A$.
    explanation: |
      Remove the members of $A$ from $U$. The remaining members are $1$, $3$, $5$, and $7$. Hence $A^\prime=\{1,3,5,7\}$.

  - id: q-algebra-sets-and-set-notation-0004
    type: which-is-true
    difficulty: easy
    stem: |
      Which of the following statements is true regarding the empty set $\emptyset$?
    choices:
      - text: The empty set $\emptyset$ is a subset of every set.
        correct: true
      - text: The empty set contains the number 0.
        rationale: |
          You confused the empty set with a set holding zero. It holds nothing at
          all, not even 0.
      - text: The empty set is an element of every set.
        rationale: |
          You said element where subset belongs. It sits inside every set as a
          subset, not as a member of it.
      - text: The complement of any set is equal to the empty set.
        rationale: |
          You mixed up complement with the empty set. A complement depends on the
          universal set.
    explanation: |
      By definition, the empty set $\emptyset$ (containing zero elements) is a subset of every set. It does not contain the number 0; it contains no elements at all.

  - id: q-algebra-sets-and-set-notation-0005
    type: direct-computation
    difficulty: easy
    stem: |
      Let $A = \{a, b, c\}$ and $B = \{b, c, d, e\}$. Find the union $A \cup B$.
    choices:
      - text: '$\{a,b,c,d,e\}$'
        correct: true
      - text: '$\{b,c\}$'
        rationale: |
          This keeps only the intersection. Shared members belong in the union too, which can make the smaller set seem sufficient. Check that either-set membership is enough.
      - text: '$\{a\}$'
        rationale: |
          This keeps only the members exclusive to $A$. Comparing the lists identifies this difference. Check that the union includes $B$ too.
      - text: '$\{a,b,c,d,e,f\}$'
        rationale: |
          This extends the alphabet pattern to an unlisted $f$. Consecutive letters can suggest a continuing sequence. Check that every member appears in at least one stated set.
    explanation: |
      Include every element appearing in either list. List shared elements only once. The union is $\{a,b,c,d,e\}$.

  - id: q-algebra-sets-and-set-notation-0006
    type: word-problem
    difficulty: medium
    stem: |
      In a Grade 10 class of 40 students at Pasig City Science High School, 25 students join the Math Club and 20 students join the Science Club. If 10 students join both clubs, how many students join at least one of the two clubs?
    choices:
      - text: '$35$'
        correct: true
      - text: '$45$'
        rationale: |
          This adds both club counts without removing their overlap. Each count is correctly read. Check whether students in both clubs were counted twice.
      - text: '$15$'
        rationale: |
          This gives only the students in Math but not Science, $25-10$. That is one valid disjoint group. Check that "at least one" includes all three inside groups.
      - text: '$30$'
        rationale: |
          This subtracts the overlap from the entire class, $40-10$. That counts everyone outside the overlap, including neither club. Check that the target is club membership.
    explanation: |
      Add the club counts, then remove the overlap counted twice: $25+20-10=35$. Thus $35$ students join at least one club.

  - id: q-algebra-sets-and-set-notation-0007
    type: word-problem
    difficulty: medium
    stem: |
      In a survey of 50 students in Quezon City, 30 like halo-halo and 22 like bingsu. If 8 students like neither dessert, how many students like both halo-halo and bingsu?
    choices:
      - text: '$10$'
        correct: true
      - text: '$2$'
        rationale: |
          This assumes all fifty students like a dessert, giving $30+22-50$. The class total looks like the union size. Check whether a neither group is stated.
      - text: '$42$'
        rationale: |
          This gives the number who like at least one dessert. Removing the neither group is a correct first step. Check that the overlap still needs to be found.
      - text: '$8$'
        rationale: |
          This returns the neither count as the overlap. Both are separate Venn regions. Check whether the requested students belong to both sets or to neither.
    explanation: |
      The union has $50-8=42$ students. The two dessert counts sum to $30+22=52$. The extra count is the overlap: $52-42=10$.

  - id: q-algebra-sets-and-set-notation-0008
    type: which-is-true
    difficulty: medium
    stem: |
      If set $P$ contains 4 elements, how many total subsets does set $P$ have?
    choices:
      - text: $16$
        correct: true
      - text: $8$
        rationale: |
          You used $2 \times 4$. The count of subsets is $2$ raised to the number of
          elements.
      - text: $15$
        rationale: |
          You subtracted 1 to drop the empty set. It counts, so the total stays at
          16.
      - text: $4$
        rationale: |
          You gave the number of elements. Each element can be in or out, which
          multiplies the possibilities.
    explanation: |
      The total number of subsets for a set with $n$ elements is given by $2^n$. For $n = 4$, the number of subsets is $2^4 = 16$. (15 is the number of proper subsets).

  - id: q-algebra-sets-and-set-notation-0009
    type: word-problem
    difficulty: medium
    stem: |
      In a class of 45 students in Manila, 28 study Filipino and 18 study Spanish. If every student studies at least one of these two languages, how many students study ONLY Filipino?
    choices:
      - text: '$27$'
        correct: true
      - text: '$28$'
        rationale: |
          This includes all Filipino students, including the overlap. The reported twenty-eight is a true set total. Check the word "only."
      - text: '$1$'
        rationale: |
          This gives the overlap, $28+18-45$. That is a useful intermediate value. Check that Filipino-only excludes this overlap.
      - text: '$17$'
        rationale: |
          This gives Spanish-only, $18-1$. The overlap was correctly removed. Check which language group is requested.
    explanation: |
      Everyone studies at least one language. The overlap is $28+18-45=1$. Filipino-only is $28-1=27$.

  - id: q-algebra-sets-and-set-notation-0010
    type: which-is-true
    difficulty: medium
    stem: |
      Relative to a common universal set $U$, which expression represents elements in $A$ but not in $B$?
    choices:
      - text: '$A\cap B^\prime$'
        correct: true
      - text: '$A\cup B^\prime$'
        rationale: |
          This allows elements outside $A$ as long as they are outside $B$. Both requested set names are present. Check that the condition requires membership in $A$.
      - text: '$A^\prime\cap B$'
        rationale: |
          This selects elements in $B$ but outside $A$. The complement is attached to the other set. Check which membership is excluded.
      - text: '$(A\cap B)^\prime$'
        rationale: |
          This selects every element outside the shared region. That includes elements outside $A$ as well. Check that the element must satisfy both parts of the stated condition.
    explanation: |
      An element must be in $A$ and outside $B$. Outside $B$ means in $B^\prime$. Requiring both conditions gives $A\cap B^\prime$.

  - id: q-algebra-sets-and-set-notation-0011
    type: word-problem
    difficulty: hard
    stem: |
      A group of 100 Grade 11 students in Laguna were surveyed about their favorite sports: Basketball ($B$), Volleyball ($V$), and Badminton ($D$). The survey shows:
      - 50 like Basketball, 40 like Volleyball, 35 like Badminton
      - 15 like Basketball and Volleyball
      - 12 like Volleyball and Badminton
      - 10 like Basketball and Badminton
      - 5 like all three sports

      How many students like at least one of these three sports?

      Each stated pairwise count includes those in all three groups.
    choices:
      - text: '$93$'
        correct: true
      - text: '$125$'
        rationale: |
          This adds all three totals without correcting overlaps. Each reported set total is used. Check how many times a shared student is counted.
      - text: '$88$'
        rationale: |
          This subtracts the pairwise counts but does not restore the triple overlap. Pairwise subtraction is needed. Check that a student in all three was then subtracted too many times.
      - text: '$98$'
        rationale: |
          This adds the triple overlap twice after subtracting the pairs. Restoring the center is part of the formula. Check that it needs to be restored only once.
    explanation: |
      Add the three totals: $50+40+35=125$. Subtract the three pairwise overlaps: $125-15-12-10=88$. Restore the triple overlap once: $88+5=93$.

  - id: q-algebra-sets-and-set-notation-0013
    type: direct-computation
    difficulty: hard
    stem: |
      Let $A = \{x \in \mathbb{Z} \mid -2 \le x \le 3\}$ and $B = \{x \in \mathbb{Z} \mid x^2 < 9\}$. Find the relative complement $A \setminus B$.
    choices:
      - text: $\{3\}$
        correct: true
      - text: $\{-2, 3\}$
        rationale: |
          You kept $-2$, but $(-2)^2 = 4 < 9$, so $-2$ belongs to $B$ and must be removed from $A \setminus B$.
      - text: $\emptyset$
        rationale: |
          You removed every element. But $3$ belongs to $A$ and does not belong to $B$ because $3^2 = 9$ is not less than 9.
      - text: $\{-3, 3\}$
        rationale: |
          You added $-3$. The first set starts at $-2$, so $-3$ is not in $A$ and cannot belong to $A \setminus B$.
    explanation: |
      Listing elements in roster form: $A = \{-2, -1, 0, 1, 2, 3\}$. For set $B$, $x^2 < 9 \implies -3 < x < 3$, so integers in $B$ are $\{-2, -1, 0, 1, 2\}$. Subtracting $B$ from $A$ leaves $A \setminus B = \{3\}$.

  - id: q-algebra-sets-and-set-notation-0014
    type: which-is-true
    difficulty: medium
    stem: |
      Given two sets $A$ and $B$, which of the following set identities is always true according to De Morgan's Laws?
    choices:
      - text: $(A \cup B)' = A' \cap B'$
        correct: true
      - text: $(A \cup B)' = A' \cup B'$
        rationale: |
          You kept the union symbol on the right. De Morgan flips it: the complement
          of a union is an intersection.
      - text: $(A \cap B)' = A' \cap B'$
        rationale: |
          You applied it to an intersection and kept the intersection. That one
          flips to a union.
      - text: $A \cap (B \cup C) = (A \cap B) \cup C$
        rationale: |
          You picked the distributive rule, and it is written wrongly here as well.
    explanation: |
      De Morgan's Laws state that the complement of a union is the intersection of the complements: $(A \cup B)' = A' \cap B'$, and the complement of an intersection is the union of the complements: $(A \cap B)' = A' \cup B'$.

  - id: q-algebra-sets-and-set-notation-0015
    type: word-problem
    difficulty: hard
    stem: |
      In a barangay youth center in Cavite with 60 teenagers, 35 play mobile games, 25 play basketball, and 20 participate in the barangay choir. 10 play mobile games and basketball, 8 play basketball and choir, 7 play mobile games and choir, and 3 participate in all three activities. How many teenagers participate ONLY in the barangay choir?

      Each stated pairwise count includes those in all three groups.
    choices:
      - text: '$8$'
        correct: true
      - text: '$5$'
        rationale: |
          This subtracts both pairwise overlaps without restoring the triple group, giving $20-8-7$. The two overlap counts are correctly read. Check that their shared center was removed twice.
      - text: '$20$'
        rationale: |
          This uses the entire choir group. That includes students in other activities too. Check the word "only."
      - text: '$13$'
        rationale: |
          This subtracts only the gaming overlap, giving $20-7$. One shared region has been removed. Check the basketball overlap as well.
    explanation: |
      Choir-only is $20-8-7+3=8$. Add the triple overlap back once because both subtracted pairwise counts include those same three students.

  - id: q-algebra-sets-and-set-notation-0016
    type: direct-computation
    difficulty: medium
    stem: |
      Let $U=\{1,2,3,4,5,6\}$, $A=\{1,2,3\}$, and $B=\{3,4,5\}$. Find $(A\cup B)^\prime$ relative to $U$.
    choices:
      - text: '$\{6\}$'
        correct: true
      - text: '$\{3,6\}$'
        rationale: |
          This removes the shared member three from the union before taking its complement. Avoiding duplicate entries can be confused with excluding shared entries. Check that a union includes shared members once.
      - text: '$\{4,5,6\}$'
        rationale: |
          This complements only $A$. Finding a complement is the correct final action. Check that the union must be formed first.
      - text: '$\{1,2,6\}$'
        rationale: |
          This complements only $B$. The second set is read last and can get all the attention. Check the parentheses before taking the complement.
    explanation: |
      The union is $\{1,2,3,4,5\}$. Remove those members from $U$. Only $6$ remains, so the complement is $\{6\}$.
    approved: false

  - id: q-algebra-sets-and-set-notation-0017
    type: word-problem
    difficulty: exam
    stem: |
      Of 100 applicants, 45 prefer Engineering, 40 Business, and 35 Computer Science. The pairwise counts are 15 for Engineering and Business, 10 for Business and Computer Science, and 12 for Engineering and Computer Science. Five prefer all three. Pairwise counts include these five. How many prefer exactly one program?
    choices:
      - text: '$61$'
        correct: true
      - text: '$46$'
        rationale: |
          This subtracts all pairwise counts from each relevant program but does not restore the triple overlap, giving $120-2(37)$. Pairwise subtraction correctly removes double memberships. Check how often the center is removed.
      - text: '$83$'
        rationale: |
          This subtracts each pairwise count once from the total memberships, giving $120-37$. That resembles the union calculation. Check that exactly-one counting must remove both memberships of a two-program applicant.
      - text: '$120$'
        rationale: |
          This adds the program totals. All three totals are correctly read. Check that applicants choosing several programs appear in several totals.
    explanation: |
      Engineering-only is $45-15-12+5=23$. Business-only is $40-15-10+5=20$. Computer Science-only is $35-12-10+5=18$. Add the disjoint groups: $23+20+18=61$.
    approved: false

  - id: q-algebra-sets-and-set-notation-0018
    type: error-spotting
    difficulty: medium
    stem: |
      Thirty students join Chess, twenty join Debate, and eight join both. A report says forty-two students join exactly one club because $30+20-8=42$. What is wrong with the report?
    choices:
      - text: 'It counts students in both clubs too.'
        correct: true
      - text: 'It counts the shared students twice.'
        rationale: |
          This assumes the overlap was not corrected at all. Adding the two totals initially counts shared students twice. Check the subtraction already present in the formula.
      - text: 'It excludes the Chess-only students.'
        rationale: |
          This assumes the first club’s exclusive region is removed. The first club total is included. Check which members remain after subtracting the overlap once.
      - text: 'It excludes the Debate-only students.'
        rationale: |
          This assumes the second club’s exclusive region is removed. The second club total is included. Check that the subtraction only corrects shared membership.
    explanation: |
      The formula $30+20-8$ counts at least one club, including the shared group once. Exactly one requires the two exclusive groups: $(30-8)+(20-8)=22+12=34$.
    approved: false

  - id: q-algebra-sets-and-set-notation-0019
    type: which-is-true
    difficulty: easy
    stem: |
      Which set is a subset of $A=\{2,4,6\}$?
    choices:
      - text: '$\{2,6\}$'
        correct: true
      - text: '$\{2,8\}$'
        rationale: |
          This checks the member two but includes eight because it is even. All members of $A$ are even. Check actual membership, not just a shared pattern.
      - text: '$\{4,8\}$'
        rationale: |
          This checks the member four but includes an unlisted eight. An even-number pattern can suggest the list continues. Check every member against the stated finite set.
      - text: '$\{6,8\}$'
        rationale: |
          This checks the member six but includes the next even number. Six is the largest listed member. Check that no extra members are assumed.
    explanation: |
      Every member of a subset must belong to $A$. Both $2$ and $6$ appear in $A$, so $\{2,6\}$ is a subset.
    approved: false

  - id: q-algebra-sets-and-set-notation-0020
    type: direct-computation
    difficulty: hard
    stem: |
      Let $A=\{1,2\}$, $A\cup B=\{1,2,3,4\}$, and $A\cap B=\{2\}$. What is $B$?
    choices:
      - text: '$\{2,3,4\}$'
        correct: true
      - text: '$\{1,2,3,4\}$'
        rationale: |
          This gives the whole union to $B$. The union shows every member available. Check that one cannot be shared because the intersection is only two.
      - text: '$\{3,4\}$'
        rationale: |
          This keeps only the members outside $A$. Those members must belong to $B$. Check that the shared member two belongs to $B$ too.
      - text: '$\{2\}$'
        rationale: |
          This keeps only the intersection. The shared member is certainly in $B$. Check the members in the union that cannot come from $A$.
    explanation: |
      The intersection places $2$ in $B$ and excludes $1$ from $B$. The union also requires $3$ and $4$ in $B$ because neither is in $A$. Thus $B=\{2,3,4\}$.
    approved: false

  - id: q-algebra-sets-and-set-notation-0021
    type: word-problem
    difficulty: medium
    stem: |
      At a youth center, 30 members join exactly one of two clubs, 10 join both, and 5 join neither. How many join at least one club?
    choices:
      - text: '$40$'
        correct: true
      - text: '$45$'
        rationale: |
          This includes the five members in neither club. Adding every region gives the center’s total. Check that at least one excludes the outside region.
      - text: '$30$'
        rationale: |
          This counts only exactly-one membership. That is the largest stated region. Check that both-club members also satisfy at least one.
      - text: '$50$'
        rationale: |
          This counts the both-club region twice, giving $30+2(10)$. Each member belongs to two clubs. Check that the question counts members rather than memberships.
    explanation: |
      The exactly-one group and both-club group are disjoint. Both belong inside the union. Add them: $30+10=40$.
    approved: false
