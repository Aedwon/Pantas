meta:
  subject: mathematics
  topic: algebra
  subtopic: systems-of-equations
  exams: [upcat, acet, dlsucet, ustet, pupcet]
questions:
  - id: q-algebra-systems-of-equations-0001
    type: direct-computation
    difficulty: easy
    stem: |
      Solve the system: $y = x + 1$ and $x + y = 7$.
    choices:
      - text: '$(3, 4)$'
        correct: true
      - text: '$(2, 3)$'
        rationale: |
          This pair checks only the first equation. Its values differ by $1$, so it fits that condition. Check the sum in the second equation too.
      - text: '$(4, 5)$'
        rationale: |
          This pair checks only the difference between the variables. That makes the first equation look satisfied. Check that both original equations hold.
      - text: '$(1, 2)$'
        rationale: |
          This uses the constant $1$ as the value of $x$. It then follows the first equation correctly. Check the pair against the required sum.
    explanation: |
      Replace $y$ with $x+1$: $x+(x+1)=7$. Subtract $1$ to get $2x=6$, so $x=3$. Then $y=3+1=4$. The solution is $(3,4)$.

  - id: q-algebra-systems-of-equations-0002
    type: direct-computation
    difficulty: medium
    stem: |
      Solve the system: $2x + 3y = 12$ and $4x - 3y = 6$.
    choices:
      - text: '$(3, 2)$'
        correct: true
      - text: '$(2, 3)$'
        rationale: |
          This reverses the two solved values. Both numbers came from the working, so the pair looks familiar. Check that $x$ comes first.
      - text: '$(3, 6)$'
        rationale: |
          This stops at $3y=6$ and calls $6$ the value of $y$. It keeps the correct remainder. Check whether the variable still has a coefficient.
      - text: '$(3, -2)$'
        rationale: |
          This uses $6-12$ when solving $6+3y=12$. Moving a term can make a sign change seem enough. Check by putting the pair into the first equation.
    explanation: |
      Add the equations to get $6x=18$, so $x=3$. Put this into the first equation: $6+3y=12$. Subtract $6$ and divide by $3$ to get $y=2$. The solution is $(3,2)$.

  - id: q-algebra-systems-of-equations-0003
    type: direct-computation
    difficulty: hard
    stem: |
      Solve the system: $3x + 2y = 16$ and $2x + 5y = 18$.
    choices:
      - text: '$(4, 2)$'
        correct: true
      - text: '$(2, 4)$'
        rationale: |
          This reverses $x$ and $y$. The same two solved numbers appear in the pair. Check their order in either original equation.
      - text: '$(4, 4)$'
        rationale: |
          This stops at $2y=4$. The remaining number looks like a finished answer. Check whether division is still needed.
      - text: '$(4, -2)$'
        rationale: |
          This reverses the subtraction in $2y=16-12$. The terms are right but their order changes the sign. Check the pair in the first equation.
    explanation: |
      Multiply the first equation by $5$ and the second by $2$: $15x+10y=80$ and $4x+10y=36$. Subtract to get $11x=44$, so $x=4$. Then $12+2y=16$, giving $y=2$. The solution is $(4,2)$.

  - id: q-algebra-systems-of-equations-0004
    type: word-problem
    difficulty: medium
    stem: |
      A movie theater sold 50 tickets. Adult tickets cost $\text{P}100$ and child tickets cost $\text{P}60$. Total sales were $\text{P}4200$. How many adult tickets were sold?
    choices:
      - text: '$30$'
        correct: true
      - text: '$20$'
        rationale: |
          This reports the number of child tickets. That count also comes from the system. Check which kind of ticket the question asks for.
      - text: '$42$'
        rationale: |
          This divides all sales by the adult price. That works only if every ticket costs the same. Check that both ticket prices appear in the money equation.
      - text: '$25$'
        rationale: |
          This splits the tickets equally without using sales. Equal groups seem reasonable when there are two ticket types. Check the total money for that split.
    explanation: |
      Let $a$ be adult tickets and $c$ be child tickets. Then $a+c=50$ and $100a+60c=4200$. Replace $c$ with $50-a$: $100a+3000-60a=4200$. This gives $40a=1200$, so $a=30$.

  - id: q-algebra-systems-of-equations-0005
    type: which-is-true
    difficulty: medium
    stem: |
      What is the solution to the system: $2x + y = 5$ and $2x + y = 9$?
    choices:
      - text: 'No solution'
        correct: true
      - text: 'Infinite solutions'
        rationale: |
          This treats matching left sides as the same equation. The coefficients match, so the lines look identical. Check the constants as well.
      - text: '$(1, 3)$'
        rationale: |
          This tests the pair only in the first equation. It gives the required $5$ there. Check every equation in the system.
      - text: '$(2, 1)$'
        rationale: |
          This tests the pair only in the first equation. It gives the required $5$ there. Check the second equation before calling it a solution.
    explanation: |
      Subtract the first equation from the second. The left side becomes $0$ and the right side becomes $4$, giving $0=4$. That cannot be true. The system has no solution.

  - id: q-algebra-systems-of-equations-0006
    type: which-is-true
    difficulty: medium
    stem: |
      How many solutions does the system $2x+y=5$ and $4x+2y=10$ have?
    choices:
      - text: 'Infinite'
        correct: true
      - text: 'No solutions'
        rationale: |
          This assumes two written equations must describe different parallel lines. Their coefficients appear different. Check whether one whole equation is a multiple of the other.
      - text: 'Exactly one'
        rationale: |
          This assumes any two lines meet once. That is common for different lines. Check whether the equations actually describe the same line.
      - text: 'Exactly two'
        rationale: |
          This counts the two equations as two solutions. The two written statements can suggest two points. Check whether the graphs overlap along a whole line.
    explanation: |
      Multiply $2x+y=5$ by $2$ to get $4x+2y=10$. Both equations describe the same line. Every point on that line solves both equations, so there are infinitely many solutions.

  - id: q-algebra-systems-of-equations-0007
    type: which-is-true
    difficulty: hard
    stem: |
      How many solutions does the system $y = x^2 - 4$ and $y = 3x - 6$ have?
    choices:
      - text: '$2$'
        correct: true
      - text: '$0$'
        rationale: |
          This assumes the graphs never meet because their shapes differ. A line and a curve do look different. Check whether their equal-value equation has real roots.
      - text: '$1$'
        rationale: |
          This counts only one root of the factored equation. One crossing point already looks like a solution. Check both factors for roots.
      - text: 'Infinite'
        rationale: |
          This treats equal values at some points as identical graphs. Both equations use $y$, which can suggest an overlap. Check whether the formulas agree for every $x$.
    explanation: |
      Set the expressions for $y$ equal: $x^2-4=3x-6$. This gives $x^2-3x+2=0$, or $(x-1)(x-2)=0$. The two roots are $1$ and $2$. Each gives one shared point, so there are $2$ solutions.

  - id: q-algebra-systems-of-equations-0008
    type: word-problem
    difficulty: medium
    stem: |
      A metal shop needs 100 kg of an alloy that is 40% copper. They have alloy A (20% copper) and alloy B (60% copper). How much of alloy A do they need?
    choices:
      - text: '$50$'
        correct: true
      - text: '$40$'
        rationale: |
          This reports the mass of copper as the mass of alloy A. The desired mix contains $40$ kg of copper. Check whether the unknown is pure copper or an alloy.
      - text: '$60$'
        rationale: |
          This subtracts the target copper mass from the total mass. That gives the non-copper part of the final mix. Check that alloy A itself also contains copper.
      - text: '$100$'
        rationale: |
          This divides $20$ by $0.2$ after finding the excess copper. The $20\%$ label makes that divisor look relevant. Check that replacing B with A changes copper by the difference between their percentages.
    explanation: |
      Let $a$ and $b$ be the masses of alloys A and B. Then $a+b=100$ and $0.2a+0.6b=40$. Put $b=100-a$ into the copper equation: $0.2a+60-0.6a=40$. This gives $-0.4a=-20$, so $a=50$ kg.

  - id: q-algebra-systems-of-equations-0009
    type: error-spotting
    difficulty: hard
    stem: |
      A student subtracts $(4x + 10y) = 36$ from $(15x + 10y) = 80$ and writes:

      $(15x + 10y) - (4x + 10y) = 80 - 36$
      $15x - 4x + 10y + 10y = 44$

      What is the error?
    choices:
      - text: 'Wrong sign on the second $10y$.'
        correct: true
      - text: 'The right side should use $80+36$.'
        rationale: |
          This changes the subtraction on the right to addition. Sign changes are needed when removing brackets, so changing that operation can look useful. Check that both sides use the same subtraction.
      - text: 'The $x$ terms should add to $19x$.'
        rationale: |
          This adds the $x$ coefficients despite the minus before the bracket. Combining like terms can make addition seem automatic. Check the sign of each term first.
      - text: 'Every written sign is correct.'
        rationale: |
          This keeps the plus sign inside the second bracket. The original equation did contain $+10y$. Check the effect of the minus sign outside that bracket.
    explanation: |
      The minus sign before the second bracket applies to every term inside it. Thus $-(4x+10y)=-4x-10y$. The $y$ terms cancel, leaving $11x=44$.

  - id: q-algebra-systems-of-equations-0010
    type: which-is-true
    difficulty: medium
    stem: |
      For the system $y=3x+1$ and $2x+5y=14$, which equation correctly substitutes for $y$ in the second equation?
    choices:
      - text: '$2x+5(3x+1)=14$'
        correct: true
      - text: '$2x+15x+1=14$'
        rationale: |
          This multiplies $3x$ by $5$ but leaves $1$ unchanged. It uses part of the given expression correctly. Check that the coefficient multiplies the whole replacement.
      - text: '$2x+5x=14$'
        rationale: |
          This treats $y$ as if it equals $x$. Both are variables, so swapping them can seem allowed. Check the actual expression given for $y$.
      - text: '$2x+5(3x)+5y=14$'
        rationale: |
          This replaces only part of $y$ and leaves an extra $y$ term. The multiplier appears to be kept. Check that one replacement removes the original $y$ completely.
    explanation: |
      Substitution replaces $y$ with the entire expression $3x+1$. In the second equation, this gives $2x+5(3x+1)=14$. The brackets keep the whole expression multiplied by $5$.

  - id: q-algebra-systems-of-equations-0011
    type: word-problem
    difficulty: medium
    stem: |
      At a store, three notebooks and two pens cost $140$ pesos. One notebook and four pens cost $80$ pesos. Each item has the same unit price on both receipts. What is the price of one pen in pesos?
    choices:
      - text: '$10$'
        correct: true
      - text: '$20$'
        rationale: |
          This divides the second receipt by four and ignores its notebook. Four pens are listed, so division by four seems natural. Check that every purchased item is included.
      - text: '$40$'
        rationale: |
          This reports the notebook price. It is another value found from the receipts. Check which item price is requested.
      - text: '$100$'
        rationale: |
          This stops at $10p=100$. The money difference is a real intermediate result. Check the coefficient before reporting the price of one pen.
    explanation: |
      Let $n$ be the notebook price and $p$ the pen price. The receipts give $3n+2p=140$ and $n+4p=80$. Multiply the second by $3$: $3n+12p=240$. Subtract the first to get $10p=100$, so $p=10$ pesos.

  - id: q-algebra-systems-of-equations-0012
    type: direct-computation
    difficulty: medium
    stem: |
      Solve the system: $2x + y = 9$ and $x + 2y = 9$. What is the value of $y$?
    choices:
      - text: '$3$'
        correct: true
      - text: '$6$'
        rationale: |
          This uses $y=9-x$ instead of $y=9-2x$. Subtracting a single $x$ seems familiar. Check the coefficient in the original equation.
      - text: '$-3$'
        rationale: |
          This uses $y=2x-9$ after moving the $2x$ term. The same numbers appear, so the sign slip can be missed. Check the answer in $2x+y=9$.
      - text: '$0$'
        rationale: |
          This reads $x-y=0$ as saying each variable is zero. The zero remainder can suggest a zero answer. Check whether it instead means the variables are equal.
    explanation: |
      Subtract the equations to get $x-y=0$, so $x=y$. Put $x=y$ into $2x+y=9$: $3y=9$. Divide by $3$ to get $y=3$.

  - id: q-algebra-systems-of-equations-0013
    type: direct-computation
    difficulty: medium
    stem: |
      Given the system $3x + y = 10$ and $x + 3y = 6$, what is the value of $x + y$?
    choices:
      - text: '$4$'
        correct: true
      - text: '$16$'
        rationale: |
          This stops after adding the right sides. The sum $16$ is a correct intermediate number. Check the multiplier of $x+y$.
      - text: '$8$'
        rationale: |
          This divides by $2$ because there are two equations. Adding two equations can suggest halving their total. Check the actual combined coefficients.
      - text: '$3$'
        rationale: |
          This reports $x$ alone. Solving one variable can look like the end of the work. Check that the question asks for a sum.
    explanation: |
      Add the equations: $4x+4y=16$. Factor the left side as $4(x+y)$. Divide both sides by $4$ to get $x+y=4$.

  - id: q-algebra-systems-of-equations-0014
    type: which-is-true
    difficulty: easy
    stem: |
      Which ordered pair is a solution to the system $2x + y = 7$ and $x - y = 2$?
    choices:
      - text: '$(3, 1)$'
        correct: true
      - text: '$(2, 3)$'
        rationale: |
          This checks only $2x+y=7$. The pair satisfies that equation exactly. Check the difference $x-y$ too.
      - text: '$(1, 5)$'
        rationale: |
          This chooses another point on the first line only. Its weighted sum is indeed $7$. Check both equations before accepting a pair.
      - text: '$(1, 3)$'
        rationale: |
          This reverses the coordinates of the solution. Both solved values are still present. Check which coordinate is $x$.
    explanation: |
      Put $x=3$ and $y=1$ into both equations. The first gives $2(3)+1=7$. The second gives $3-1=2$. Thus $(3,1)$ satisfies the whole system.

  - id: q-algebra-systems-of-equations-0015
    type: direct-computation
    difficulty: medium
    stem: |
      If $3x+y=7$ and $x-y=1$, what is the product $xy$?
    choices:
      - text: '$2$'
        correct: true
      - text: '$3$'
        rationale: |
          This adds the solved values instead of multiplying them. The notation with two variables can look like a request to combine them in any way. Check that $xy$ means multiplication.
      - text: '$1$'
        rationale: |
          This reports $y$ alone. It is a solved value from the system. Check that the requested value uses both variables.
      - text: '$8$'
        rationale: |
          This stops at the right-side sum from elimination. The $8$ appears in a correct step. Check that the requested product has been calculated.
    explanation: |
      Add the equations to get $4x=8$, so $x=2$. From $x-y=1$, find $y=1$. Therefore $xy=2(1)=2$.

  - id: q-algebra-systems-of-equations-0016
    type: direct-computation
    difficulty: hard
    stem: |
      The system $y=2x-5$ and $3x+2y=4$ has a unique solution. What is $x-y$?
    choices:
      - text: '$3$'
        correct: true
      - text: '$1$'
        rationale: |
          This adds $x$ and $y$ instead of subtracting them. With a negative $y$, the sign is easy to overlook. Check both signs in $x-y$.
      - text: '$2$'
        rationale: |
          This stops at the value of $x$. That value is needed in the calculation. Check what expression the question requests.
      - text: '$-1$'
        rationale: |
          This stops at the value of $y$. It comes from a correct substitution. Check that both solved values enter the requested expression.
    explanation: |
      Replace $y$ in the second equation: $3x+2(2x-5)=4$. Expand to get $7x-10=4$, so $7x=14$ and $x=2$. Then $y=2(2)-5=-1$. Thus $x-y=2-(-1)=3$.

  - id: q-algebra-systems-of-equations-0017
    type: error-spotting
    difficulty: hard
    stem: |
      A student solves $y=x^2$ and $y=x$ by setting $x^2=x$, dividing both sides by $x$, and reporting $(1,1)$ as the only solution. What makes the answer incomplete?
    choices:
      - text: 'Division by $x$ loses the root $0$.'
        correct: true
      - text: 'Setting the two $y$ values equal is invalid.'
        rationale: |
          This rejects equating two expressions for the same $y$. The equations look different, which can suggest they cannot be combined. Check that both expressions represent the same value at a shared point.
      - text: 'The root $1$ fails the original equations.'
        rationale: |
          This rejects a root without substitution. The earlier division makes all the working look doubtful. Check the root in both original equations.
      - text: 'Every quadratic system has just one root.'
        rationale: |
          This assumes one line must give one intersection. Two straight lines often meet once. Check how many roots remain when a curve is involved.
    explanation: |
      From $x^2=x$, move the right side to get $x^2-x=0$. Factor: $x(x-1)=0$. Thus $x=0$ or $x=1$. Dividing by $x$ loses the solution $x=0$.

  - id: q-algebra-systems-of-equations-0018
    type: word-problem
    difficulty: hard
    stem: |
      A barge travels upstream at $(v - c)$ km/h and downstream at $(v + c)$ km/h, where $v$ is the barge speed and $c$ is the current speed. Going upstream 80 km takes 8 hours. Going downstream 100 km takes 5 hours. What is the barge speed?
    choices:
      - text: '$15$'
        correct: true
      - text: '$10$'
        rationale: |
          This reports the upstream speed. Dividing upstream distance by time gives a real travel speed. Check that it includes the slowing effect of the current.
      - text: '$20$'
        rationale: |
          This reports the downstream speed. Dividing downstream distance by time gives a real travel speed. Check that it includes the current as well as the barge.
      - text: '$5$'
        rationale: |
          This reports the current speed from half the difference. That is another unknown found from the same system. Check which speed is requested.
    explanation: |
      The upstream speed is $80\div8=10$ km/h, so $v-c=10$. The downstream speed is $100\div5=20$ km/h, so $v+c=20$. Add the equations: $2v=30$. Thus $v=15$ km/h.

  - id: q-algebra-systems-of-equations-0019
    type: error-spotting
    difficulty: easy
    stem: |
      A student solves $y=x+2$ and $2x+y=8$. The steps are: Step 1, $2x+(x+2)=8$; Step 2, $3x=10$; Step 3, $x=\dfrac{10}{3}$. Which step is the first incorrect one?
    choices:
      - text: 'Step 2'
        correct: true
      - text: 'Step 1'
        rationale: |
          This rejects a valid substitution. The new bracket makes the equation look changed. Check that $y$ is replaced with exactly $x+2$.
      - text: 'Step 3'
        rationale: |
          This focuses on a fraction at the end. A fractional result can look suspicious. Check the first step that changes an equality incorrectly.
      - text: 'No step is incorrect.'
        rationale: |
          This accepts adding $2$ when removing a positive $2$ from the left. Moving terms can make any sign change look valid. Check that the same operation is applied to both sides.
    explanation: |
      Step 1 correctly replaces $y$ with $x+2$. Combining terms gives $3x+2=8$. Subtracting $2$ gives $3x=6$, so Step 2 is the first incorrect step.
    approved: false

  - id: q-algebra-systems-of-equations-0020
    type: which-is-true
    difficulty: exam
    stem: |
      For which value of $k$ does the system $2x-3y=7$ and $4x-6y=k$ have infinitely many solutions?
    choices:
      - text: '$14$'
        correct: true
      - text: '$7$'
        rationale: |
          This copies the first constant without doubling it. The equations use the same variables, so the constant can seem unchanged. Check the multiplier of every term.
      - text: '$-14$'
        rationale: |
          This doubles the constant but changes its sign. The negative $y$ coefficient can suggest a negative right side. Check the sign of the multiplier.
      - text: '$0$'
        rationale: |
          This treats cancellation as requiring a zero original constant. Elimination does produce zero for identical equations. Check the constant before subtracting the equations.
    explanation: |
      Double the first equation to get $4x-6y=14$. The second equation must be identical for the two lines to overlap. Thus $k=14$.
    approved: false
