meta:
  subject: mathematics
  topic: algebra
  subtopic: word-problems
  exams: [upcat, acet, dlsucet, ustet, pupcet, cse-pro, cse-sub]
questions:
  - id: q-algebra-word-problems-0001
    type: word-problem
    difficulty: easy
    stem: |
      Kuya Ben is 4 years older than his sister Maya. If the sum of their ages is 24, how old is Maya?
    choices:
      - text: '$10\text{ years old}$'
        correct: true
      - text: '$14\text{ years old}$'
        rationale: |
          This reports Ben's age instead of Maya's. Both ages come from the same equation. Check whose age the question asks for.
      - text: '$12\text{ years old}$'
        rationale: |
          This divides $24$ by $2$ and ignores the age gap. Equal sharing looks natural for two people. Check whether their ages are equal.
      - text: '$8\text{ years old}$'
        rationale: |
          This halves the total before subtracting the full $4$-year gap. Both steps use numbers from the stem. Check that the gap is removed before halving.
    explanation: |
      Let $m$ be Maya's age. Ben is $m+4$. Their sum gives $m+(m+4)=24$. Subtract $4$ to get $2m=20$, then divide by $2$. Maya is $10$ years old.

  - id: q-algebra-word-problems-0002
    type: word-problem
    difficulty: easy
    stem: |
      A tricycle travels from the public market to Barangay San Jose at a constant speed of $30\text{ km/h}$. How many hours will it take to cover a distance of $45\text{ km}$?
    choices:
      - text: '$1.5\text{ hours}$'
        correct: true
      - text: '$15\text{ hours}$'
        rationale: |
          This divides by $3$ instead of $30$. Dropping the zero leaves a familiar division. Check the full speed value.
      - text: '$2\text{ hours}$'
        rationale: |
          This rounds $1.5$ up to a whole hour. Travel times are often described in whole hours. Check whether rounding is requested.
      - text: '$0.67\text{ hours}$'
        rationale: |
          This divides speed by distance. The two given numbers still appear in a quotient. Check that kilometers cancel to leave hours.
    explanation: |
      Time equals distance divided by speed. Thus $t=\dfrac{45}{30}=1.5$ hours.

  - id: q-algebra-word-problems-0003
    type: word-problem
    difficulty: easy
    stem: |
      Mang Juan can paint a barangay wall in 6 hours, while Mang Pedro can paint the same wall in 3 hours. How many hours will it take them to paint the wall if they work together?
    choices:
      - text: '$2\text{ hours}$'
        correct: true
      - text: '$4.5\text{ hours}$'
        rationale: |
          This averages $6$ and $3$ hours. Averaging seems natural when combining two workers. Check that the shared time is shorter than either solo time.
      - text: '$9\text{ hours}$'
        rationale: |
          This adds the two solo times. Adding seems natural when combining work. Check whether the workers act at the same time.
      - text: '$3\text{ hours}$'
        rationale: |
          This uses only the faster worker's time. That worker does set a useful upper bound. Check that a second worker makes completion faster.
    explanation: |
      The work rates are $\dfrac{1}{6}$ and $\dfrac{1}{3}$ wall per hour. Together they paint $\dfrac{1}{6}+\dfrac{2}{6}=\dfrac{1}{2}$ wall per hour. One wall takes $1\div\dfrac{1}{2}=2$ hours.

  - id: q-algebra-word-problems-0004
    type: word-problem
    difficulty: easy
    stem: |
      A sari-sari store owner has 10 liters of a $10\%$ sugar syrup solution. How many liters of pure sugar are in this solution?
    choices:
      - text: '$1\text{ liter}$'
        correct: true
      - text: '$0.1\text{ liters}$'
        rationale: |
          This reports the decimal form of $10\%$ as a volume. Converting the percentage is a valid first step. Check that it is multiplied by the total volume.
      - text: '$9\text{ liters}$'
        rationale: |
          This reports the nonsugar portion. Subtracting the sugar leaves another meaningful amount. Check which substance is requested.
      - text: '$10\text{ liters}$'
        rationale: |
          This reports the entire solution volume. Sugar is part of that solution. Check that only $10\%$ of the volume is sugar.
    explanation: |
      Ten percent is $0.10$. Multiply the solution volume by this fraction: $10(0.10)=1$ liter of sugar.

  - id: q-algebra-word-problems-0005
    type: word-problem
    difficulty: easy
    stem: |
      Aling Nena has a coin pouch containing only 1-peso coins and 5-peso coins. She has a total of 15 coins worth P47. How many 5-peso coins does she have?
    choices:
      - text: '$8$'
        correct: true
      - text: '$7$'
        rationale: |
          This reports the count of one-peso coins. That count is also found during the calculation. Check the denomination requested.
      - text: '$6.4$'
        rationale: |
          This divides the extra value by $5$ instead of $5-1$. Five pesos is the larger coin value. Check the value gained when one one-peso coin is replaced.
      - text: '$9.4$'
        rationale: |
          This divides all $47$ pesos by $5$. That works if every coin has the same value. Check that both denominations are present.
    explanation: |
      Let $y$ be the number of $5$-peso coins. There are $15-y$ one-peso coins. Their value gives $(15-y)+5y=47$. Combine terms: $15+4y=47$. Subtract $15$ and divide by $4$ to get $y=8$.

  - id: q-algebra-word-problems-0006
    type: error-spotting
    difficulty: easy
    stem: |
      Lito has $20$ coins consisting of five-peso and ten-peso coins, worth $160$ pesos. Let $f$ and $t$ be their respective counts. A student writes $f+t=20$ and $f+10t=160$. What should replace the second equation?
    choices:
      - text: '$5f+10t=160$'
        correct: true
      - text: '$5f+5t=160$'
        rationale: |
          This applies $5$ pesos to both coin counts. Both denominations are coins in the same pouch. Check the value of each kind separately.
      - text: '$10f+5t=160$'
        rationale: |
          This swaps the coin values. Both coefficients belong to the problem. Check that each coefficient matches its named count.
      - text: '$5f+10t=20$'
        rationale: |
          This uses the total count as the total value. Both totals describe the same pouch. Check whether the equation counts coins or pesos.
    explanation: |
      Each $5$-peso coin contributes $5$ pesos, and each $10$-peso coin contributes $10$ pesos. Multiplying each count by its coin value gives the value equation $5f+10t=160$.

  - id: q-algebra-word-problems-0007
    type: word-problem
    difficulty: medium
    stem: |
      A mother is currently 4 times as old as her daughter Ana. In 6 years, the mother will be 3 times as old as Ana. How old is Ana now?
    choices:
      - text: '$12\text{ years old}$'
        correct: true
      - text: '$48\text{ years old}$'
        rationale: |
          This reports the mother's age. It is another valid age found from the same equation. Check which person is asked about.
      - text: '$18\text{ years old}$'
        rationale: |
          This omits the mother's six-year increase, giving $4a=3(a+6)$. The future ratio is still visible. Check that time passes for both people.
      - text: '$6\text{ years old}$'
        rationale: |
          This halves the solved age again, treating $12$ as the total for two people. Dividing a combined age by $2$ is familiar. Check what the variable represents.
    explanation: |
      Let $a$ be Ana's age now. Her mother is $4a$. In six years, both ages increase by $6$, so $4a+6=3(a+6)$. Expand to get $4a+6=3a+18$. Subtract $3a$ and $6$ to get $a=12$.

  - id: q-algebra-word-problems-0008
    type: word-problem
    difficulty: medium
    stem: |
      A jeepney leaves Terminal A traveling at $40\text{ km/h}$. One hour later, an express van leaves Terminal A along the exact same route traveling at $60\text{ km/h}$. How many hours after the van starts will it catch up to the jeepney?
    choices:
      - text: '$2\text{ hours}$'
        correct: true
      - text: '$3\text{ hours}$'
        rationale: |
          This includes the jeepney's one-hour head start. The total elapsed time is a meaningful result. Check when the requested clock starts.
      - text: '$\dfrac{2}{3}\text{ hour}$'
        rationale: |
          This divides the gap by the van's speed alone. That would work for a stationary target. Check that the jeepney keeps moving.
      - text: '$0.4\text{ hour}$'
        rationale: |
          This adds the speeds to find the closing rate. Adding works for vehicles moving toward each other. Check that both vehicles move in the same direction.
    explanation: |
      The jeepney's head start is $40(1)=40$ km. The van closes the gap at $60-40=20$ km/h. Closing $40$ km takes $\dfrac{40}{20}=2$ hours after the van starts.

  - id: q-algebra-word-problems-0009
    type: word-problem
    difficulty: medium
    stem: |
      Ana can complete a research report in 8 hours. When Ana and Bea work together, they can complete the report in 3 hours. How many hours would it take Bea to complete the report alone?
    choices:
      - text: '$4.8\text{ hours}$'
        correct: true
      - text: '$5\text{ hours}$'
        rationale: |
          This subtracts $3$ hours from $8$ hours. The given times are easy to subtract. Check that work rates, not solo times, combine.
      - text: '$\dfrac{24}{11}\text{ hours}$'
        rationale: |
          This adds Ana's rate to the shared rate. Rate addition is used for two separate workers. Check that the shared rate already includes Ana.
      - text: '$\dfrac{5}{24}\text{ hour}$'
        rationale: |
          This reports Bea's rate as her time. The rate is a useful intermediate result. Check the units and take its reciprocal for hours.
    explanation: |
      Together they complete $\dfrac{1}{3}$ report per hour. Ana completes $\dfrac{1}{8}$ report per hour. Bea's rate is $\dfrac{1}{3}-\dfrac{1}{8}=\dfrac{5}{24}$. Her time is the reciprocal, $\dfrac{24}{5}=4.8$ hours.

  - id: q-algebra-word-problems-0010
    type: word-problem
    difficulty: medium
    stem: |
      A chemistry teacher in Cebu needs 20 liters of a $20\%$ salt solution. She has a $10\%$ salt solution and a $30\%$ salt solution available. How many liters of the $30\%$ salt solution should she mix with the $10\%$ solution to obtain the desired mixture?
    choices:
      - text: '$10\text{ liters}$'
        correct: true
      - text: '$4\text{ liters}$'
        rationale: |
          This reports the liters of salt needed. That amount is part of the mixture equation. Check whether the question asks for salt or solution.
      - text: '$20\text{ liters}$'
        rationale: |
          This uses the entire final volume as strong solution. The total volume is stated clearly. Check that some weak solution must also be included.
      - text: '$\dfrac{40}{3}\text{ liters}$'
        rationale: |
          This supplies all salt from the strong solution and ignores salt in the weak solution. Dividing $4$ by $0.30$ looks direct. Check the salt contribution from both liquids.
    explanation: |
      Let $x$ be the liters of strong solution. The weak solution has volume $20-x$. The salt balance is $0.30x+0.10(20-x)=0.20(20)$. Expand and combine: $0.20x+2=4$. Subtract $2$ and divide by $0.20$ to get $x=10$ liters.

  - id: q-algebra-word-problems-0011
    type: word-problem
    difficulty: medium
    stem: |
      The sum of the ages of Carlo and his father is 56. Four years ago, the father was 3 times as old as Carlo was then. How old is Carlo now?
    choices:
      - text: '$16\text{ years old}$'
        correct: true
      - text: '$40\text{ years old}$'
        rationale: |
          This reports the father's age. Both ages are found from the same total. Check which person is requested.
      - text: '$14\text{ years old}$'
        rationale: |
          This applies the three-to-one ratio to current ages. That gives a simple division of the total into four parts. Check the time named for the ratio.
      - text: '$12\text{ years old}$'
        rationale: |
          This reports Carlo's age four years ago. The past age is needed to build the equation. Check whether the requested age is now or then.
    explanation: |
      Let $c$ be Carlo's age now. His father is $56-c$. Four years ago their ages were $c-4$ and $52-c$. Thus $52-c=3(c-4)$. Expand to get $52-c=3c-12$. Add $c$ and $12$: $64=4c$. Hence $c=16$.

  - id: q-algebra-word-problems-0012
    type: word-problem
    difficulty: medium
    stem: |
      A jeepney driver has P280 in 5-peso coins and 10-peso coins. If the number of 5-peso coins is 8 more than twice the number of 10-peso coins, how many 10-peso coins does he have?
    choices:
      - text: '$12$'
        correct: true
      - text: '$32$'
        rationale: |
          This reports the five-peso coin count. That count is calculated from the ten-peso count. Check the denomination requested.
      - text: '$14$'
        rationale: |
          This omits the extra $8$ five-peso coins. The twice-as-many relationship still appears. Check every part of the count relationship.
      - text: '$13.6$'
        rationale: |
          This adds $8$ pesos instead of the value of $8$ five-peso coins. The number $8$ is copied directly from the stem. Check that coin counts are multiplied by their values.
    explanation: |
      Let $t$ be the number of ten-peso coins. The five-peso coin count is $2t+8$. Their value gives $10t+5(2t+8)=280$. Expand: $20t+40=280$. Subtract $40$ and divide by $20$ to get $t=12$.

  - id: q-algebra-word-problems-0013
    type: word-problem
    difficulty: hard
    stem: |
      Five years ago, Mr. Santos was 5 times as old as his son Mark. In 10 years, Mr. Santos will be twice as old as Mark. How old is Mark today?
    choices:
      - text: '$10\text{ years old}$'
        correct: true
      - text: '$30\text{ years old}$'
        rationale: |
          This reports the father's age. It is also found while solving the two equations. Check whose current age is requested.
      - text: '$15\text{ years old}$'
        rationale: |
          This reports Mark's age five years from now. Adding a time shift can seem like the last step. Check which time the question asks for.
      - text: '$5\text{ years old}$'
        rationale: |
          This reports Mark's age five years ago. That age appears in the first condition. Check that the requested age is today.
    explanation: |
      Let $m$ be Mark's age now and $s$ his father's. Five years ago, $s-5=5(m-5)$, so $s=5m-20$. In ten years, $s+10=2(m+10)$, so $s=2m+10$. Equate these: $5m-20=2m+10$. Thus $3m=30$ and $m=10$.

  - id: q-algebra-word-problems-0014
    type: word-problem
    difficulty: hard
    stem: |
      Two motorized outrigger boats (bangkas) start from the same port in Batangas at the same time, traveling in opposite directions. One boat travels at an average speed of $25\text{ km/h}$ and the other at $35\text{ km/h}$. After how many hours will they be $180\text{ km}$ apart?
    choices:
      - text: '$3\text{ hours}$'
        correct: true
      - text: '$18\text{ hours}$'
        rationale: |
          This subtracts $25$ from $35$ to find the separation rate. Speed differences work for a chase. Check whether the boats move apart or follow each other.
      - text: '$\dfrac{36}{7}\text{ hours}$'
        rationale: |
          This uses only the faster boat's $35$ km/h speed. One boat alone does travel away from the port. Check that both boats add to the gap.
      - text: '$6\text{ hours}$'
        rationale: |
          This averages the speeds before dividing the distance. An average seems natural for two speeds. Check that separation uses the sum of distances.
    explanation: |
      The boats separate at $25+35=60$ km/h. Divide the required gap by this rate: $t=\dfrac{180}{60}=3$ hours.

  - id: q-algebra-word-problems-0015
    type: word-problem
    difficulty: hard
    stem: |
      Pipe A can fill a water tank in Davao in 4 hours, while Pipe B can fill the same tank in 6 hours. Drain Pipe C can empty the full tank in 12 hours. If all three pipes are opened at the same time when the tank is empty, how many hours will it take to fill the tank?
    choices:
      - text: '$3\text{ hours}$'
        correct: true
      - text: '$2.4\text{ hours}$'
        rationale: |
          This ignores the drain. Adding the two fill rates is a correct start. Check for a rate that removes water.
      - text: '$4\text{ hours}$'
        rationale: |
          This uses only Pipe A's rate. Pipe A can fill the tank by itself. Check the effect of every open pipe.
      - text: '$2\text{ hours}$'
        rationale: |
          This counts the drain as a third filling pipe. All three rates are stated as positive fractions. Check the direction of each flow.
    explanation: |
      The fill rates are $\dfrac{1}{4}$ and $\dfrac{1}{6}$ tank per hour. The drain removes $\dfrac{1}{12}$ tank per hour. The net rate is $\dfrac{3+2-1}{12}=\dfrac{1}{3}$ tank per hour. Filling one tank takes $1\div\dfrac{1}{3}=3$ hours.

  - id: q-algebra-word-problems-0016
    type: word-problem
    difficulty: hard
    stem: |
      How many liters of pure water must be added to 12 liters of a $25\%$ sugar solution to dilute it into a $10\%$ sugar solution?
    choices:
      - text: '$18\text{ liters}$'
        correct: true
      - text: '$30\text{ liters}$'
        rationale: |
          This reports the final volume. That is a needed intermediate result. Check that the question asks only for added water.
      - text: '$15\text{ liters}$'
        rationale: |
          This subtracts $10$ from $25$ and calls the percentage-point drop a volume. The two percentage numbers are easy to subtract. Check that percent and liters have different units.
      - text: '$6\text{ liters}$'
        rationale: |
          This treats added water as half the original volume. Dilution does increase the volume. Check that the unchanged sugar volume equals $10\%$ of the final mixture.
    explanation: |
      The sugar volume stays $12(0.25)=3$ liters. For a $10\%$ solution, the total volume must satisfy $0.10V=3$. Thus $V=30$ liters. Subtract the original volume: $30-12=18$ liters of water.

  - id: q-algebra-word-problems-0017
    type: word-problem
    difficulty: hard
    stem: |
      A tricycle driver travels $12\text{ km}$ uphill from the town center to a mountain village at a speed of $15\text{ km/h}$. On the return trip downhill along the exact same route, his speed increases to $30\text{ km/h}$. What is the average speed of the tricycle for the entire round trip?
    choices:
      - text: '$20\text{ km/h}$'
        correct: true
      - text: '$22.5\text{ km/h}$'
        rationale: |
          This averages $15$ and $30$ directly. That works for equal travel times. Check that these trips have equal distances instead.
      - text: '$10\text{ km/h}$'
        rationale: |
          This uses one-way distance over total time. The distance $12$ km is given once in the stem. Check that both legs are included.
      - text: '$30\text{ km/h}$'
        rationale: |
          This divides round-trip distance by the uphill time only. That time is the longer part of the trip. Check that the return trip also takes time.
    explanation: |
      The uphill time is $\dfrac{12}{15}=0.8$ hours. The downhill time is $\dfrac{12}{30}=0.4$ hours. Total distance is $24$ km, and total time is $1.2$ hours. The average speed is $\dfrac{24}{1.2}=20$ km/h.

  - id: q-algebra-word-problems-0018
    type: word-problem
    difficulty: hard
    stem: |
      A vendor in Divisoria has P430 in a pouch containing 5-peso coins, 10-peso coins, and 20-peso coins. There are equal numbers of 5-peso and 10-peso coins, and the number of 20-peso coins is 3 less than the number of 5-peso coins. How many total coins are in the pouch?
    choices:
      - text: '$39\text{ coins}$'
        correct: true
      - text: '$14\text{ coins}$'
        rationale: |
          This reports only the count of each smaller coin. The variable does stand for a coin count. Check that all three groups are added.
      - text: '$42\text{ coins}$'
        rationale: |
          This assumes three equal coin counts. Two of the counts are equal. Check the stated difference for the twenty-peso coins.
      - text: '$36\text{ coins}$'
        rationale: |
          This also subtracts $3$ from the ten-peso coin count. The smaller count for twenty-peso coins can seem to apply to another group. Check which single group has fewer coins.
    explanation: |
      Let $x$ be the count of each smaller coin. The twenty-peso coin count is $x-3$. The value equation is $5x+10x+20(x-3)=430$. Combine terms: $35x-60=430$. Thus $35x=490$ and $x=14$. The total count is $14+14+(14-3)=39$.

  - id: q-algebra-word-problems-0019
    type: word-problem
    difficulty: medium
    stem: |
      The tens digit of a two-digit number is twice its units digit. The digits sum to $12$. What is the number?
    choices:
      - text: '$84$'
        correct: true
      - text: '$48$'
        rationale: |
          This reverses the digits. Both digits were found correctly. Check that the larger digit belongs in the tens place.
      - text: '$12$'
        rationale: |
          This reports the digit sum. That is one of the given conditions. Check that a two-digit number has value $10t+u$.
      - text: '$804$'
        rationale: |
          This multiplies the tens digit by $100$ instead of $10$. Place value does require multiplication. Check that a two-digit number has no hundreds place.
    explanation: |
      Let $u$ be the units digit. The tens digit is $2u$. Their sum gives $2u+u=12$, so $u=4$ and the tens digit is $8$. The number is $10(8)+4=84$.
    approved: false

  - id: q-algebra-word-problems-0020
    type: error-spotting
    difficulty: exam
    stem: |
      A shop has $8$ liters of a $50\%$ solution and adds $x$ liters of a $20\%$ solution to make a $30\%$ solution. A student writes $0.50(8)+0.20x=0.30(8)$. What correction is needed?
    choices:
      - text: 'Use $8+x$ as final volume.'
        correct: true
      - text: 'Use $0.50(8+x)$ on the left.'
        rationale: |
          This applies the original concentration to the entire final volume. The original liquid remains part of the mixture. Check that added liquid has its own concentration.
      - text: 'Replace $0.20x$ with $x$.'
        rationale: |
          This treats the added solution as pure substance. Its volume does enter the mixture. Check that only $20\%$ of that volume is the tracked substance.
      - text: 'Use $0.30x$ on the right.'
        rationale: |
          This omits the original $8$ liters from the final volume. The unknown is easy to treat as the total. Check that the two solution volumes add.
    explanation: |
      The final mixture contains the original $8$ liters plus the added $x$ liters. Its total volume is $8+x$. Its pure substance amount is therefore $0.30(8+x)$, which must equal the amount entering the mixture.
    approved: false
