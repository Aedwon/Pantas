passages:
  - id: rc-tt-sn-p1
    title: "The Marikina Forge"
    body: |
      The heat from the anvil rose in shimmering waves against Mateo's face as he hammered the glowing strip of leaf-spring steel. In the small Marikina workshop, Mang Tomas sat quietly on a wooden bench, smoking a clove cigarette and watching his apprentice's rhythm without uttering a single instruction. Mateo raised the heavy mallet for a sixth strike, eager to flatten the blade before the metal cooled from bright cherry red to dull orange.

      His arms burned with fatigue, yet a stubborn pride pushed him to swing faster. He wanted to prove that six months of apprenticeship had earned him the right to forge a complete kitchen knife independently. But as his hammer struck the hot edge, a hairline crack opened near the tang, splintering the glowing metal.

      Mateo froze, expecting a sharp reprimand. Instead, Mang Tomas stood up, extinguished his cigarette in an iron dish, and laid a heavy hand on Mateo's shoulder. "A knife forced by speed is already broken inside," the old smith said softly, retrieving a fresh steel bar from the rack. "Heat it again, and let the fire teach your hammer patience."

  - id: rc-tt-sn-p2
    title: "Night Watch at the Pier"
    body: |
      Heavy rain lashed the corrugated tin roof of Pier 14 as Benjamin shined his flashlight across the rows of stacked shipping containers. At two in the morning, the Manila port yard was a maze of dark shadows and slick asphalt. He was twenty minutes from finishing his eight-hour shift when a metallic banging caught his attention near container cluster B.

      Stepping closer, Benjamin saw that a heavy steel latch on a high-cube container had worked itself loose, swinging rhythmically against the corrugated wall with every gust of wind. Company protocol required night watchmen to secure unlatched doors immediately to prevent cargo theft and rainwater damage. However, reaching the upper latch meant climbing a rain-slicked iron ladder in near-zero visibility.

      His wet gloves slipped on his flashlight as another thunderclap shook the yard. Pausing at the base of the ladder, Benjamin looked back toward the warmth of the guardhouse, then unclipped his safety harness and hooked it to the lower ladder rung.

questions:
  - id: rc-tt-sn-0001
    passage: rc-tt-sn-p1
    type: identify
    difficulty: easy
    stem: |
      What central conflict does Mateo experience in "The Marikina Forge"?
    choices:
      - text: Internal conflict between rushed desire and patient craftsmanship.
        correct: true
      - text: External conflict between himself and a hostile rival apprentice in Marikina.
        rationale: |
          You introduced a rival apprentice character who does not exist in the passage.
      - text: Environmental conflict between his workshop and a sudden river flood.
        rationale: |
          You introduced a flood disaster that is not mentioned anywhere in the story.
      - text: Financial conflict over the cost of purchasing imported steel bars.
        rationale: |
          You introduced a financial cost dispute that is outside the personal craftsmanship focus of the text.
    explanation: |
      Mateo's internal struggle pits his eager pride and desire to prove independence against the patient discipline needed to forge metal properly.

  - id: rc-tt-sn-0002
    passage: rc-tt-sn-p1
    type: analyze
    difficulty: medium
    stem: |
      Which scene in the excerpt represents the turning point or climax of the narrative?
    choices:
      - text: The moment a hairline crack splinters the glowing steel edge.
        correct: true
      - text: Mang Tomas sitting quietly on the bench smoking a clove cigarette.
        rationale: |
          You picked a quiet background scene from the exposition rather than the moment of highest tension (the climax).
      - text: Mateo heating the initial leaf-spring steel bar in the forge.
        rationale: |
          You picked an opening action from the exposition before the conflict reaches its peak.
      - text: Mang Tomas retrieving a fresh steel bar from the workshop rack.
        rationale: |
          You picked part of the resolution after the climax has already occurred.
    explanation: |
      The cracking of the steel is the moment of highest tension and turning point (climax) where Mateo's rushed hammering fails and forces a resolution.

  - id: rc-tt-sn-0003
    passage: rc-tt-sn-p1
    type: infer
    difficulty: medium
    stem: |
      What can be inferred about Mang Tomas's character from his reaction to the broken blade?
    choices:
      - text: He is a wise mentor who uses mistakes as teaching opportunities.
        correct: true
      - text: He is a harsh disciplinarian who fires apprentices for minor errors.
        rationale: |
          You picked a harsh character trait that directly contradicts Mang Tomas's calm and encouraging reaction.
      - text: He is indifferent to the quality of the knives produced in his forge.
        rationale: |
          You inferred indifference, but his advice about fire and patience shows deep care for craftsmanship.
      - text: He is eager to finish work early to leave the workshop.
        rationale: |
          You inferred impatience, which contradicts his patient explanation to Mateo.
    explanation: |
      Rather than reprimanding Mateo, Mang Tomas gently explains the lesson ("let the fire teach your hammer patience") and provides fresh steel, showing patient wisdom.

  - id: rc-tt-sn-0004
    passage: rc-tt-sn-p1
    type: infer
    difficulty: hard
    stem: |
      Based on the end of the excerpt, what will Mateo most likely do next?
    choices:
      - text: Place the fresh steel into the fire and forge it with patience.
        correct: true
      - text: Quit his apprenticeship and leave the Marikina workshop immediately.
        rationale: |
          You inferred quitting, but Mang Tomas's encouraging words set up Mateo to try again patiently.
      - text: Sell the cracked steel blade to a neighboring market vendor.
        rationale: |
          You picked an action that ignores Mang Tomas handing him fresh steel to forge again.
      - text: Argue with Mang Tomas about the temperature of the forge fire.
        rationale: |
          You inferred an argumentative conflict that contradicts Mateo's respect for his master's guidance.
    explanation: |
      Mang Tomas hands him a fresh bar and instructs him to heat it again and practice patience, setting up a slower second forging attempt.

  - id: rc-tt-sn-0005
    passage: rc-tt-sn-p1
    type: evaluate
    difficulty: hard
    stem: |
      Which statement best expresses the underlying theme of "The Marikina Forge"?
    choices:
      - text: Craft requires discipline and patience over rushed pride.
        correct: true
      - text: Apprentice blacksmiths should avoid using heavy mallets.
        rationale: |
          You picked a narrow tool tip rather than the story's deeper moral lesson about patience and craftsmanship.
      - text: Clove cigarettes are essential for managing workshop fatigue.
        rationale: |
          You picked a minor character detail about Mang Tomas, mistaking it for the main theme.
      - text: Kitchen knives forged in Marikina are always prone to cracking.
        rationale: |
          You picked a negative generalization that misses the moral theme of learning from mistakes.
    explanation: |
      The story illustrates how rushing due to pride leads to broken work, while true craftsmanship depends on patient discipline.

  - id: rc-tt-sn-0006
    passage: rc-tt-sn-p2
    type: identify
    difficulty: easy
    stem: |
      What type of conflict is introduced in "Night Watch at the Pier"?
    choices:
      - text: Conflict between professional duty and personal safety during a storm.
        correct: true
      - text: Physical combat between Benjamin and cargo thieves inside the container.
        rationale: |
          You introduced a physical fight with thieves that is not described in the story.
      - text: Legal dispute between Benjamin and the Manila port authority over wages.
        rationale: |
          You picked an administrative wage dispute not mentioned in the narrative.
      - text: Personal disagreement between Benjamin and a fellow night watchman.
        rationale: |
          You introduced a rival watchman character who does not appear in the text.
    explanation: |
      Benjamin is torn between the safety protocol requiring him to climb a slippery ladder to secure the latch and the danger/discomfort of rain and fatigue.

  - id: rc-tt-sn-0007
    passage: rc-tt-sn-p2
    type: analyze
    difficulty: medium
    stem: |
      How does the setting of Pier 14 contribute to the mood of the passage?
    choices:
      - text: Heavy rain and thunderclaps create a tense atmosphere.
        correct: true
      - text: Bright sunshine and calm sea breezes create a cheerful and relaxed mood.
        rationale: |
          You picked a weather setting opposite to the midnight storm described in the text.
      - text: Busy market crowds and street music create a festive holiday environment.
        rationale: |
          You picked a cheerful market setting that contradicts the dark, rain-soaked port yard.
      - text: Quiet air-conditioned office rooms create an academic research setting.
        rationale: |
          You picked an indoor office setting that does not match the outdoor pier environment.
    explanation: |
      The midnight storm, dark container maze, slick ladder, and thunderclaps build a tense, hazardous mood.

  - id: rc-tt-sn-0008
    passage: rc-tt-sn-p2
    type: infer
    difficulty: medium
    stem: |
      What does Benjamin's action of unclipping his safety harness at the base of the ladder indicate?
    choices:
      - text: He has decided to climb the ladder despite the storm.
        correct: true
      - text: He has decided to abandon his job and run back to the guardhouse.
        rationale: |
          You picked an action opposite to Benjamin's choice to attach his harness and climb the ladder.
      - text: He is handing his equipment to a replacement watchman.
        rationale: |
          You introduced a secondary character who is not present in the scene.
      - text: He is throwing his flashlight into the sea.
        rationale: |
          You picked a random destructive action unsupported by the text.
    explanation: |
      Hooking his safety harness to the ladder shows he is preparing to climb up and secure the loose container latch.

  - id: rc-tt-sn-0009
    passage: rc-tt-sn-p2
    type: infer
    difficulty: hard
    stem: |
      What can a reader reasonably infer about Benjamin's character from this excerpt?
    choices:
      - text: He is a responsible worker who takes his duty seriously.
        correct: true
      - text: He is a careless watchman who frequently sleeps inside the guardhouse.
        rationale: |
          You picked a negative characterization that contradicts Benjamin leaving the guardhouse to check a noise.
      - text: He is an inexperienced worker who does not know port safety protocols.
        rationale: |
          You inferred inexperience, but Benjamin specifically follows company safety protocols despite the storm.
      - text: He is a suspicious character planning to steal container cargo.
        rationale: |
          You inferred criminal intent unsupported by Benjamin's duty to protect cargo.
    explanation: |
      Choosing to inspect the banging noise and climb a wet ladder near the end of a long shift demonstrates his conscientiousness and commitment to duty.

  - id: rc-tt-sn-0010
    passage: rc-tt-sn-p2
    type: evaluate
    difficulty: hard
    stem: |
      Which characteristic feature of fiction excerpts is demonstrated by the ending of this passage?
    choices:
      - text: It ends at a moment of suspense before action is complete.
        correct: true
      - text: It presents a complete historical timeline of Manila port construction.
        rationale: |
          You misidentified fiction as a non-fiction historical timeline of port construction.
      - text: It lists verified statistics on container shipping revenue.
        rationale: |
          You misidentified the story as a statistical report on shipping revenue.
      - text: It provides an authorial footnote explaining port legal codes.
        rationale: |
          You misidentified the narrative ending as a legal textbook footnote.
    explanation: |
      Fiction excerpts frequently conclude at a pivotal moment of suspense (preparing to climb the ladder), inviting the reader to infer what follows based on character setup.
