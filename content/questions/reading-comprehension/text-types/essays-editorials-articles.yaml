passages:
  - id: rc-tt-eea-p1
    title: "Cavite Coastal Dike Inauguration"
    body: |
      CAVITE CITY, Philippines: The Department of Public Works and Highways inaugurated a 3.2-kilometer coastal seawall along the shoreline of Cavite City on Monday morning, according to an official agency press release. The twenty-four-million-peso infrastructure project was constructed to protect approximately eight thousand coastal households from seasonal storm surges during typhoon season.

      Project director Engineer Ramon Cruz confirmed that construction began in January 2022 and was completed three weeks ahead of the original December schedule. The seawall incorporates reinforced concrete bulkheads and ten sluice gates designed to manage tidal outflow into Manila Bay. According to municipal disaster office records, the structure successfully withstood its first operational test during high tides last weekend.

      Local officials announced that phase two of the coastal protection plan, which includes expanding mangrove buffer zones along adjacent mudflats, will commence in early 2024 following environmental impact clearance.

  - id: rc-tt-eea-p2
    title: "Subsidies for Nueva Ecija Rice Farmers"
    body: |
      The persistent refusal of the department of agriculture to raise farmgate fertilizer subsidies for local rice producers is a shortsighted policy that severely undermines national food security. While imported rice flows freely through local ports, smallholder farmers in Nueva Ecija are forced to bear crushing input costs that eliminate their meager harvest profit margins.

      It is completely unacceptable for policymakers to lecture rural communities about productivity while denying them the essential financial relief granted to agricultural sectors in neighboring countries. Offering trivial emergency handouts after harvests fail is a band-aid solution that fails to address the structural crisis facing local agriculture.

      Congress must immediately mandate a fifty percent subsidy on organic fertilizers and establish floor prices for palay. Protecting our local rice farmers is not an act of charity; it is an urgent economic imperative that our leaders can no longer afford to ignore.

  - id: rc-cs-eea-p3
    title: "Lessons from a Bohol Basket Weaver"
    body: |
      Every Saturday morning during my childhood in Bohol, I sat on the bamboo slats of our outdoor kitchen watching my grandfather split raw rattan stalks into paper-thin strips. With steady hands shaped by decades of labor, he guided my clumsy fingers over and under the warp, teaching me how to weave sturdy harvesting baskets called 'bukag'.

      In those early years, I grew frustrated whenever my uneven weaving caused the basket sides to bulge awkwardly. My grandfather would gently unlace my work without a word of scolding, reminding me that true craft requires patience before speed. He taught me that every knot held a purpose, and that a basket built with rushed anger would inevitably unravel under its first real load.

      Years later, as a university student navigating complex deadlines in Manila, I often return to the memory of those quiet Saturday mornings. The lesson of the woven basket remains my anchor: true progress is built with patient hands, one deliberate thread at a time.

questions:
  - id: rc-tt-eea-0001
    passage: rc-tt-eea-p1
    type: identify
    difficulty: easy
    stem: |
      Which text type best classifies the passage about the Cavite coastal dike?
    choices:
      - text: News report (article)
        correct: true
      - text: Editorial opinion piece
      - text: Personal reflective essay
      - text: Dramatic theatrical script
    explanation: |
      The passage features a dateline ("CAVITE CITY, Philippines"), neutral objective reporting, and answers who, what, when, and where without personal opinions, matching a news article.

  - id: rc-tt-eea-0002
    passage: rc-tt-eea-p1
    type: analyze
    difficulty: medium
    stem: |
      Which structural feature characteristic of a news article is present in paragraph 1?
    choices:
      - text: A dateline and lead sentence summarizing essential facts and project details.
        correct: true
      - text: Emotional appeals urging citizens to protest government spending.
      - text: First-person narrative memories of growing up near Manila Bay.
      - text: Rhyming poetic couplets describing coastal tides.
    explanation: |
      The presence of a dateline ("CAVITE CITY") and an opening lead sentence providing key factual information is a defining feature of news articles.

  - id: rc-tt-eea-0003
    passage: rc-tt-eea-p1
    type: infer
    difficulty: medium
    stem: |
      How does the tone of the Cavite seawall passage differ from an editorial?
    choices:
      - text: It maintains a neutral, objective tone reporting official facts without value judgments.
        correct: true
      - text: It uses angry rhetorical questions to criticize municipal engineers.
      - text: It expresses deep personal nostalgia for historical seawalls.
      - text: It uses humorous satire to mock government announcements.
    explanation: |
      Unlike an editorial which uses opinionated value judgments, a news article maintains a neutral and objective tone reporting verified facts.

  - id: rc-tt-eea-0004
    passage: rc-tt-eea-p1
    type: evaluate
    difficulty: hard
    stem: |
      What evidence from paragraph 2 demonstrates the objective reporting style of the passage?
    choices:
      - text: Citing specific dates, names of officials, and official disaster office records.
        correct: true
      - text: Calling the seawall the most beautiful architectural marvel in Luzon.
      - text: Accusing project directors of wasting twenty-four million pesos.
      - text: Providing personal childhood memories of high tide flooding.
    explanation: |
      Citing specific verified sources ("Engineer Ramon Cruz", "disaster office records", dates) shows objective news reporting.

  - id: rc-tt-eea-0005
    passage: rc-tt-eea-p1
    type: analyze
    difficulty: hard
    stem: |
      What is the primary function of paragraph 3 in this news article format?
    choices:
      - text: To provide forward-looking context regarding phase two of the project.
        correct: true
      - text: To present a moral lesson about environmental protection.
      - text: To demand that Congress fire the department directors.
      - text: To describe how mangrove trees are harvested for timber.
    explanation: |
      In news articles (inverted pyramid structure), ending paragraphs provide additional context or future developments related to the main story.

  - id: rc-tt-eea-0006
    passage: rc-tt-eea-p2
    type: identify
    difficulty: easy
    stem: |
      Which text type best classifies the passage on Nueva Ecija rice subsidies?
    choices:
      - text: Editorial opinion piece
        correct: true
      - text: Neutral news report
      - text: Personal reflective essay
      - text: Technical instructional manual
    explanation: |
      The passage expresses a strong persuasive stance ("shortsighted policy", "completely unacceptable", "Congress must immediately mandate"), matching an editorial.

  - id: rc-tt-eea-0007
    passage: rc-tt-eea-p2
    type: analyze
    difficulty: medium
    stem: |
      Which feature of form in paragraph 1 signals that the text is an editorial?
    choices:
      - text: Use of strongly persuasive, value-laden opinion words like "shortsighted" and "crushing".
        correct: true
      - text: Inclusion of a city dateline and press release citations.
      - text: First-person narrative descriptions of farming memories.
      - text: Objective statistical charts comparing global fertilizer production.
    explanation: |
      Value-laden words expressing clear disapproval ("shortsighted policy", "crushing input costs") are key features of an editorial opinion piece.

  - id: rc-tt-eea-0008
    passage: rc-tt-eea-p2
    type: infer
    difficulty: medium
    stem: |
      What is the writer's primary goal in the final paragraph?
    choices:
      - text: To issue a call to action demanding specific policy changes from Congress.
        correct: true
      - text: To report the total tonnage of fertilizer imported in 2023.
      - text: To reflect nostalgically on ancient rice harvesting traditions.
      - text: To explain the chemical composition of organic fertilizers.
    explanation: |
      Editorials conclude with a clear call to action ("Congress must immediately mandate..."), attempting to convince leaders and readers to act.

  - id: rc-tt-eea-0009
    passage: rc-tt-eea-p2
    type: evaluate
    difficulty: hard
    stem: |
      How does the author's treatment of government policies differ from a news article's treatment?
    choices:
      - text: The author openly criticizes policies as "band-aid solutions" rather than reporting them neutrally.
        correct: true
      - text: The author presents both sides using official press release quotes.
      - text: The author avoids discussing agricultural policies altogether.
      - text: The author uses scientific data tables to calculate soil pH.
    explanation: |
      Editorials express clear critical judgment ("band-aid solution", "lecture rural communities") rather than presenting news in a neutral, balanced format.

  - id: rc-tt-eea-0010
    passage: rc-tt-eea-p2
    type: analyze
    difficulty: hard
    stem: |
      Which choice represents an opinion stated in the editorial rather than a verifiable fact?
    choices:
      - text: Offering emergency handouts is a band-aid solution that fails to address the crisis.
        correct: true
      - text: Rice is imported through local Philippine ports.
      - text: Smallholder farmers grow rice in Nueva Ecija.
      - text: Organic fertilizers contain nutrients used in agriculture.
    explanation: |
      Labeling government emergency handouts as a "band-aid solution" is a value judgment, whereas rice growing and importing are factual realities.

  - id: rc-cs-eea-0011
    passage: rc-cs-eea-p3
    type: identify
    difficulty: easy
    stem: |
      Which text type best classifies the passage about basket weaving in Bohol?
    choices:
      - text: Personal reflective essay
        correct: true
      - text: Neutral news report
      - text: Persuasive political editorial
      - text: Scientific research paper
    explanation: |
      The passage is written in the first person ("I", "my grandfather"), recounting a personal memory and reflecting on its life lesson, matching a personal essay.

  - id: rc-cs-eea-0012
    passage: rc-cs-eea-p3
    type: analyze
    difficulty: easy
    stem: |
      Which structural element distinguishes this personal essay from a news article?
    choices:
      - text: First-person narrative perspective combined with personal reflection on a life lesson.
        correct: true
      - text: A formal news dateline and quotes from city officials.
      - text: A call to action urging Congress to pass new laws.
      - text: A list of step-by-step instructions for manufacturing commercial baskets.
    explanation: |
      First-person narrative perspective ("I", "my grandfather") paired with reflecting on a personal lesson is a defining feature of personal essays.

  - id: rc-cs-eea-0013
    passage: rc-cs-eea-p3
    type: infer
    difficulty: medium
    stem: |
      What central insight or theme does the narrator explore in the final paragraph?
    choices:
      - text: Applying the lesson of patient craftsmanship to adult life and academic challenges.
        correct: true
      - text: Demanding that Bohol artisans receive higher government pensions.
      - text: Proving that bamboo baskets are superior to modern plastic containers.
      - text: Reporting the market price of hand-woven 'bukag' baskets in Manila.
    explanation: |
      The final paragraph reflects on how the lesson learned while weaving baskets ("true progress is built with patient hands") guides the narrator at university.

  - id: rc-cs-eea-0014
    passage: rc-cs-eea-p3
    type: evaluate
    difficulty: medium
    stem: |
      How does the grandfather's reaction to the narrator's weaving mistakes contribute to the essay's reflective tone?
    choices:
      - text: His patient, unlacing without scolding models the core lesson of patience over rushed anger.
        correct: true
      - text: His reaction demonstrates the legal rules governing basket exports in Bohol.
      - text: His reaction warns readers against studying at Manila universities.
      - text: His reaction proves that rattan stalks are too weak for weaving.
    explanation: |
      The grandfather's calm, silent unlacing of flawed work illustrates the values of patience and care, reinforcing the reflective tone of the essay.

  - id: rc-cs-eea-0015
    passage: rc-cs-eea-p3
    type: analyze
    difficulty: hard
    stem: |
      What is the main difference between the purpose of this personal essay and the purpose of an editorial?
    choices:
      - text: The essay shares a personal experience to explore a life lesson, while an editorial seeks to persuade readers on a public issue.
        correct: true
      - text: The essay reports objective news facts, while an editorial tells fictional short stories.
      - text: The essay contains step-by-step technical blueprints, while an editorial contains poetry.
      - text: The essay urges immediate voting, while an editorial reflects on childhood memories.
    explanation: |
      Personal essays explore personal experiences and insights, whereas editorials aim to persuade readers to adopt a specific stance on a public issue.
