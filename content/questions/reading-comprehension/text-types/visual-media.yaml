passages:
  - id: rc-tt-vm-p1
    title: "Dengue Prevention Infographic Description"
    body: |
      A public health infographic poster titled "Stop Dengue at the Source" features a bold red headline above three distinct visual sections against a light blue background. In the central section, a large pie chart illustrates household mosquito breeding sites: fifty percent is labeled "uncovered water drums", thirty percent is labeled "discarded tires and tin cans", fifteen percent is labeled "clogged roof gutters", and five percent is labeled "flower vase water".

      To the left of the pie chart, a magnified vector illustration of an Aedes aegypti mosquito is depicted with black and white striped legs, accompanied by a warning callout box in bright yellow. To the right, four sequential action icons demonstrate preventive measures: covering water containers, clearing roof gutters, recycling discarded tires, and applying insect repellent.

      At the bottom of the poster, a footer banner in dark blue displays the Department of Health hotline number and a prominent slogan reading "A Clean Yard is a Safe Yard".

  - id: rc-tt-vm-p2
    title: "Fuel Prices Editorial Cartoon Description"
    body: |
      An editorial cartoon depicts a sweat-drenched jeepney driver in a tattered shirt attempting to pull a massive wooden cart up a steep, crumbling mountain road. The cart is loaded with a colossal iron boulder labeled "fuel price increases", which towers over the driver. Attached to the driver's waist by a thin, frayed rope is a tiny, empty coin purse labeled "daily jeepney fare income".

      Standing safely at the top of the mountain peak are two neatly dressed figures in business suits labeled "oil importers". They are holding binoculars and calmly observing the driver's struggle while holding a large sign that reads "market forces".

      In the background, dark thunderclouds hover over a small city skyline labeled "commuter public", while a small road sign at the foot of the hill points backward toward a sign reading "economic relief".

questions:
  - id: rc-tt-vm-0001
    passage: rc-tt-vm-p1
    type: identify
    difficulty: easy
    stem: |
      Based on the pie chart described in the infographic, which site represents the largest percentage of household mosquito breeding places?
    choices:
      - text: Uncovered water drums (fifty percent)
        correct: true
      - text: Discarded tires and tin cans (thirty percent)
        rationale: |
          You picked thirty percent, which is the second largest slice in the chart, not the largest slice (fifty percent).
      - text: Clogged roof gutters (fifteen percent)
        rationale: |
          You picked fifteen percent, which is smaller than fifty percent for uncovered water drums.
      - text: Flower vase water (five percent)
        rationale: |
          You picked five percent, which represents the smallest percentage in the pie chart rather than the largest.
    explanation: |
      The passage explicitly states that fifty percent of breeding sites in the pie chart is labeled "uncovered water drums".

  - id: rc-tt-vm-0002
    passage: rc-tt-vm-p1
    type: analyze
    difficulty: medium
    stem: |
      What is the primary purpose of placing four sequential action icons to the right of the pie chart?
    choices:
      - text: To provide actionable steps to eliminate mosquito breeding.
        correct: true
      - text: To decorate the poster with artistic color illustrations.
        rationale: |
          You mistook functional health icons for mere artistic decoration without recognizing their instructional role.
      - text: To explain the biological life cycle of the Aedes aegypti mosquito.
        rationale: |
          You picked mosquito biology, but the icons illustrate human cleaning actions like covering drums and clearing gutters.
      - text: To display the historical budget of the Department of Health.
        rationale: |
          You picked financial budget information, which is not depicted by preventive action icons.
    explanation: |
      The action icons demonstrate preventive measures (covering drums, clearing gutters, recycling tires), providing clear actionable guidance for viewers.

  - id: rc-tt-vm-0003
    passage: rc-tt-vm-p1
    type: analyze
    difficulty: medium
    stem: |
      Why does the infographic use a bright yellow warning callout box next to the mosquito illustration?
    choices:
      - text: To draw visual attention to critical hazard warnings.
        correct: true
      - text: To hide the mosquito's black and white striped legs.
        rationale: |
          You inferred an attempt to conceal details, but callout boxes are designed to highlight information.
      - text: To indicate that mosquitoes only breed in yellow containers.
        rationale: |
          You took the yellow design color literally as a container color rule.
      - text: To match the light blue background of the headline.
        rationale: |
          You picked color matching, but yellow is used specifically to contrast against blue and signal a hazard warning.
    explanation: |
      Bright callout boxes are a visual design device used to attract immediate attention to high-priority safety warnings.

  - id: rc-tt-vm-0004
    passage: rc-tt-vm-p1
    type: infer
    difficulty: hard
    stem: |
      What is the primary overall objective of this public health infographic?
    choices:
      - text: To motivate residents to eliminate stagnant water sources.
        correct: true
      - text: To promote commercial sales of synthetic insect repellents.
        rationale: |
          You picked a commercial sales objective, whereas public health infographics focus on disease prevention.
      - text: To criticize municipal workers for failing to clean public roads.
        rationale: |
          You inferred political criticism, but the poster focuses on household action to prevent dengue.
      - text: To collect statistical data from hospital dengue patients.
        rationale: |
          You picked data collection, which is an administrative task rather than a public awareness goal.
    explanation: |
      Combining breeding site data, mosquito warnings, and practical cleaning steps aims to motivate residents to eliminate stagnant water.

  - id: rc-tt-vm-0005
    passage: rc-tt-vm-p1
    type: evaluate
    difficulty: hard
    stem: |
      Which visual element on the poster serves as the official authority marker and contact resource?
    choices:
      - text: The footer banner with the DOH hotline number.
        correct: true
      - text: The magnified vector illustration of the mosquito.
        rationale: |
          You picked the mosquito vector drawing, which is a hazard illustration rather than an official authority marker.
      - text: The pie chart slice showing five percent flower vase water.
        rationale: |
          You picked a data point from the chart, not the official agency contact resource located in the footer.
      - text: The yellow background color behind the action icons.
        rationale: |
          You picked a background design color rather than the official DOH hotline banner.
    explanation: |
      The footer banner displaying official agency information and hotline details provides the authority marker and emergency contact resource.

  - id: rc-tt-vm-0006
    passage: rc-tt-vm-p2
    type: identify
    difficulty: easy
    stem: |
      In the editorial cartoon description, what does the colossal iron boulder labeled "fuel price increases" symbolize?
    choices:
      - text: The financial burden on drivers from rising fuel costs.
        correct: true
      - text: The physical weight of passenger luggage carried on jeepney roofs.
        rationale: |
          You took the cartoon boulder literally as passenger luggage rather than a symbol for fuel price burdens.
      - text: The construction materials used to repair mountain roads.
        rationale: |
          You took the boulder literally as road construction material, ignoring its political label.
      - text: The high quality of imported petroleum products.
        rationale: |
          You inferred positive quality from an iron boulder, which is drawn as an oppressive crushing weight.
    explanation: |
      In editorial cartooning, a heavy crushing object labeled with a problem symbolizes an overwhelming burden on affected individuals.

  - id: rc-tt-vm-0007
    passage: rc-tt-vm-p2
    type: analyze
    difficulty: medium
    stem: |
      What is the cartoonist's stance regarding the relationship between the jeepney driver and the "oil importers"?
    choices:
      - text: Critical of oil importers who remain detached from the struggle.
        correct: true
      - text: Supportive of oil importers for providing financial aid to transport workers.
        rationale: |
          You inferred financial aid, which contradicts the importers standing detached with binoculars on a peak.
      - text: Neutral, showing both groups working together to push the cart.
        rationale: |
          You inferred cooperation, but the driver pulls alone while the importers watch from above.
      - text: Praising jeepney drivers for buying expensive binoculars.
        rationale: |
          You misread the text. The oil importers hold the binoculars, not the struggling driver.
    explanation: |
      Depicting figures in suits standing safely at the top holding binoculars and a "market forces" sign conveys a critical stance on their detachment from the driver's struggle.

  - id: rc-tt-vm-0008
    passage: rc-tt-vm-p2
    type: infer
    difficulty: medium
    stem: |
      What visual contrast is created between the iron boulder and the "tiny, empty coin purse"?
    choices:
      - text: Highlighting the gap between fuel costs and earnings.
        correct: true
      - text: Showing that coin purses are manufactured from iron metal.
        rationale: |
          You took the visual contrast literally as coin purse manufacturing material.
      - text: Proving that jeepney fares are higher than fuel prices.
        rationale: |
          You reversed the financial contrast. The tiny purse shows fares are inadequate to meet high fuel costs.
      - text: Demonstrating that watchmen should carry safety harnesses.
        rationale: |
          You mixed up details from the pier watchman passage into this editorial cartoon question.
    explanation: |
      Contrasting a colossal iron boulder with a tiny, empty purse visually emphasizes the disparity between heavy costs and small incomes.

  - id: rc-tt-vm-0009
    passage: rc-tt-vm-p2
    type: evaluate
    difficulty: hard
    stem: |
      What is the symbolic function of the dark thunderclouds hovering over the "commuter public" skyline?
    choices:
      - text: Representing economic hardship felt by the commuting community.
        correct: true
      - text: Indicating that a real typhoon storm is currently flooding the city.
        rationale: |
          You took the storm clouds literally as weather rather than a cartoon symbol for economic distress.
      - text: Showing that electric buses produce heavy air pollution.
        rationale: |
          You introduced electric buses and air pollution, which are not depicted in this editorial cartoon.
      - text: Decorating the top edge of the drawing with natural scenery.
        rationale: |
          You dismissed the clouds as background decoration, ignoring political cartoon symbolism.
    explanation: |
      Storm clouds in editorial cartoons frequently symbolize looming trouble, hardship, or economic distress affecting a population.

  - id: rc-tt-vm-0010
    passage: rc-tt-vm-p2
    type: analyze
    difficulty: hard
    stem: |
      Why does the cartoonist include a road sign pointing backward toward "economic relief"?
    choices:
      - text: To suggest economic relief is becoming increasingly distant.
        correct: true
      - text: To guide drivers toward the nearest commercial gasoline station.
        rationale: |
          You took the economic relief sign literally as a directional sign for a gas station.
      - text: To prove that mountain roads are safer than paved city streets.
        rationale: |
          You inferred road safety advice, which is unrelated to political cartoon symbolism.
      - text: To show that the jeepney driver is driving in the wrong direction.
        rationale: |
          You misinterpreted the sign as navigation error rather than relief receding into the past.
    explanation: |
      A sign pointing backward away from the climbing driver symbolizes that relief is moving out of reach as struggles increase.
