  stem: "Which appeal to emotion is fair when asking a school to fix a broken stair rail?"
  choices:
    - text: "A speaker describes a student’s documented fall and shares an inspection that found the rail loose."
      correct: true
    - text: "A speaker describes an invented fall as though it happened and asks the school to act at once."
      rationale: "The story makes a risk easy to imagine. Check whether the audience is told that the fall is invented."
    - text: "A speaker plays a frightening sound and says fear alone proves the rail needs repair."
      rationale: "Fear can draw attention to danger. Check whether the sound tells the audience anything about the rail."
    - text: "A speaker says the next student who touches the rail will certainly be hurt without checking its condition."
      rationale: "The claim sounds urgent. Check whether the speaker has enough evidence to promise that outcome."
  explanation: "The documented fall shows why the issue matters to students. The inspection gives a reason to believe the repair is needed."
