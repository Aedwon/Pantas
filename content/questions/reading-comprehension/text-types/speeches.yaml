      correct: true
    - text: "Explain the meaning of the word “meeting.”"
      rationale: "An explanation helps if a word is unfamiliar. Check which information the audience says it missed."
    - text: "Ask listeners to repeat the meeting time back."
      rationale: "Repeating back can check understanding. It works after listeners have actually heard the time."
