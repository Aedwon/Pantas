  type: "inferencing-and-conclusions"
  difficulty: "medium"
  stem: "A speaker uses the term “fermentation.” A listener hears the word clearly but says she does not know what it means. What should the speaker do first?"
  choices:
    - text: "Explain the term in familiar words and give an example."
      correct: true
    - text: "Say “fermentation” again in a louder voice."
      rationale: "A louder voice helps when a word is hard to hear. Check whether this listener heard it the first time."
    - text: "Write the term on the board without explaining it."
      rationale: "Seeing a word can help someone recognize it. Check whether seeing the same word explains its meaning."
    - text: "Speak more slowly using exactly the same sentence."
      rationale: "A slower pace lets a listener catch more words. Check whether the trouble is speed or an unfamiliar term."
  explanation: "The listener already heard the word. An explanation in familiar words and an example address the part she did not understand."
