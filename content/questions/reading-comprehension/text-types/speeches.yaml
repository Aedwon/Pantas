  type: "purpose-of-device"
  difficulty: "medium"
  stem: "Tess is looking for a ride. Her brother hands her his car keys and says, “I’ll drive you myself when you’re ready.” What is he mainly doing?"
  choices:
    - text: "Committing to drive Tess."
      correct: true
    - text: "Predicting that Tess will get a ride from someone."
      rationale: "The statement speaks about the future, so it can sound like a prediction. Check whether he offers his own action or makes a guess."
    - text: "Asking Tess whether she knows how to drive."
      rationale: "The keys may make you think Tess will drive. Check who says “I’ll drive.”"
    - text: "Announcing that the car is ready to leave right away."
