  keyPoint: 1
  type: "purpose-of-device"
  difficulty: "medium"
  stem: "At the start of an assembly, the host says, “Could the front row move closer to the aisle, please?” What act does the host perform by saying this?"
  choices:
    - text: "Requests that the front row move."
      correct: true
    - text: "Checks whether the people can physically move."
      rationale: "“Could” can ask about ability. Check whether the host needs information about ability or wants the audience to act."
    - text: "Promises to make more room near the aisle."
      rationale: "Moving could make room, which might sound like a plan. Check who is supposed to do something."
    - text: "Warns that the aisle is unsafe."
      rationale: "The aisle is mentioned, so safety may come to mind. Look for any words about a risk or danger."
  explanation: "The host’s words take the form of a question. In this setting, the host is politely asking the front row to move."
- id: "q-text-types-speeches-0026"
