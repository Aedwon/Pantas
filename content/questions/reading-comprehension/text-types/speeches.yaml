  type: "feature-of-form"
  difficulty: "medium"
  stem: "Which description gives the clearest evidence that a speech is extemporaneous?"
  choices:
    - text: "The speaker uses a list of main points and chooses the exact words while speaking."
      correct: true
    - text: "The speaker recites the full text memorized the day before."
      rationale: "Speaking without a page can look spontaneous. Check whether the exact wording was set in advance."
    - text: "The speaker reads a prepared text slowly with several pauses."
      rationale: "The pauses may feel natural. Find out when the words themselves were chosen."
    - text: "The speaker reads each sentence from a display instead of a printed page."
      rationale: "The speaker has no paper, which can look unscripted. Check whether the display already gives the wording."
  explanation: "The list gives the speaker a plan. The speaker chooses the wording in the moment, which makes the speech extemporaneous."
