  type: "inferencing-and-conclusions"
  difficulty: "medium"
  stem: "A speaker claims a new bus stop will shorten students’ walks. To support the claim, the speaker shows a survey about how many students like the colors of the bus. Which evidence check exposes the main problem?"
  choices:
    - text: "Relevance, because the survey does not measure or address walking distance."
      correct: true
    - text: "Source, because the speaker is not identified as a survey expert."
      rationale: "Expertise can affect trust in a survey. Check whether even an expert’s color survey would speak to walking distance."
    - text: "Method, because the survey should ask more students about their favorite colors."
      rationale: "A larger survey can improve a result. Ask whether a more accurate answer about colors supports this claim."
    - text: "Relevance, because a claim about a bus stop can only be supported by an official source."
      rationale: "Official sources can be useful. Relevance depends on the connection between what the evidence shows and what the speaker claims."
  explanation: "The survey measures color preferences. That result tells the audience nothing about how far students would walk to the new stop."
- id: "q-text-types-speeches-0028"
