    stem: |
      As used in the passage, the word in bold most nearly means
    choices:
      - text: "not settling the issue"
        correct: true
      - text: "giving the wrong final answer"
        rationale: |
          This confuses lack of a firm answer with a false answer. An uncertain report can sound mistaken. Check whether the first account actually chose a source.
      - text: "too costly for the office"
        rationale: |
          This supplies a financial meaning from the repair setting. Repairs may cost money. Use the contrast between uncertainty and a settled question.
      - text: "deliberately hiding evidence"
        rationale: |
          This adds a motive to an unclear finding. A missing answer can seem suspicious. Check whether the passage says the officer concealed anything.
    explanation: |
      The first account leaves the source uncertain. The later test settles it. This contrast shows that inconclusive means not settling the issue.
  - id: "q-comprehension-skills-context-clues-in-passages-0022"
    lesson: lesson-comprehension-skills-word-parts-in-passages
