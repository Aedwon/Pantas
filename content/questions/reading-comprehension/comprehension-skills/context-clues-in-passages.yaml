passages:
  - id: rc-cs-cc-p1
    title: "Aquaculture Strategies in Laguna de Bay"
    body: |
      Aquaculturists operating fish pens along Laguna de Bay face recurring environmental challenges caused by seasonal water quality fluctuations. During monsoon months, farm operators harbor juvenile bangus in shallow, net-enclosed nursery pens to protect the fragile fish from turbulent lake currents. By sheltering the young stock until they reach maturity, fish farmers significantly reduce mortality rates compared to open-water stocking.

      However, when warm summer weather triggers rapid green algae blooms, dissolved oxygen levels drop sharply at night, threatening the fish. During these emergency periods, cooperative leaders immediately table plans for expanding fingerling purchases, postponing all non-essential investments until water quality stabilizes. Instead, operators redirect their funds toward operating aeration pumps continuously.

      The ability of fish pen owners to harbor vulnerable stocks during storms and table expansion projects during environmental bottlenecks has kept the local aquaculture industry resilient for decades.

  - id: rc-cs-cc-p2
    title: "Abel Iloco Weaving Traditions"
    body: |
      Master weaver Aling Teresa preserves the traditional craft of Abel Iloco cloth in Vigan using centuries-old techniques. Before weaving begins, she must render raw, unrefined cotton fibers into smooth, continuous threads by manually combing out seeds and carding the cotton against wooden frames. Without this meticulous preparation, the cotton threads would snap under the high tension of the foot-pedal loom.

      To dye the thread, Aling Teresa relies on an organic indigo dye culture nurtured in large clay fermentation jars. This living fermentation vat, fed with rice wine and wood ash, requires daily stirring and temperature monitoring to maintain the active microorganisms that extract rich blue pigments. If the culture is neglected for even two days, the dye loses its intensity and produces uneven coloration.

      Through her mastery of preparing raw fibers and cultivating delicate dye vats, Aling Teresa produces textiles celebrated across the Philippines for their durability and cultural heritage.

questions:
  - id: rc-cs-cc-0001
    passage: rc-cs-cc-p1
    type: analyze
    difficulty: easy
    stem: |
      As used in the first paragraph, what is the meaning of the word "harbor"?
    choices:
      - text: To shelter or keep safe in a protected area
        correct: true
      - text: A natural coastal port for commercial ships
        rationale: |
          You picked the literal noun definition of a port for ships. In this passage, harbor is a verb that means to shelter or protect young fish.
      - text: To entertain secretive negative thoughts
        rationale: |
          You picked an idiom about holding bad feelings like grudges. The passage uses harbor as a physical action of protecting young fish.
      - text: To anchor a large motorized vessel
        rationale: |
          You picked a nautical action for ships. In this passage, harbor refers to holding and protecting young fish in nursery pens.
    explanation: |
      In the passage, "harbor juvenile bangus in shallow, net-enclosed nursery pens" means to shelter or protect the young fish from harsh currents.

  - id: rc-cs-cc-0002
    passage: rc-cs-cc-p1
    type: analyze
    difficulty: medium
    stem: |
      Which surrounding detail in paragraph 1 provides the strongest context clue for the word "harbor"?
    choices:
      - text: "protect the fragile fish from turbulent lake currents"
        correct: true
      - text: "recurring environmental challenges caused by seasonal water"
        rationale: |
          You picked a phrase that describes the environmental problem rather than the specific clue that defines what harbor means.
      - text: "dissolved oxygen levels drop sharply at night"
        rationale: |
          You picked a detail from paragraph 2 about algae blooms. Paragraph 1 uses harbor in the context of protecting young fish from currents.
      - text: "expanding fingerling purchases after monsoon months"
        rationale: |
          You picked a detail about business decisions mentioned later. It does not explain the meaning of sheltering fish in paragraph 1.
    explanation: |
      The phrase "protect the fragile fish from turbulent lake currents" directly explains the action of sheltering or harboring the fish.

  - id: rc-cs-cc-0003
    passage: rc-cs-cc-p1
    type: analyze
    difficulty: medium
    stem: |
      As used in the second paragraph, what does the word "table" mean?
    choices:
      - text: To postpone for future consideration
        correct: true
      - text: A flat piece of wooden furniture used for dining
        rationale: |
          You picked the everyday noun definition of furniture. In this context, table is used as a verb meaning to delay or postpone plans.
      - text: To present a mathematical statistical spreadsheet of data
        rationale: |
          You picked a technical definition used for data display. In this passage, table refers to delaying expansion investments.
      - text: To build a large wooden platform over open water
        rationale: |
          You picked a physical construction activity. The passage uses table procedurally to mean postponing spending on new fingerlings.
    explanation: |
      The passage explains that leaders "table plans... postponing all non-essential investments until water quality stabilizes", showing that "table" means to postpone.

  - id: rc-cs-cc-0004
    passage: rc-cs-cc-p1
    type: infer
    difficulty: hard
    stem: |
      Why is the word "table" used in contrast to operating aeration pumps?
    choices:
      - text: It shows expansion was delayed so funds could address aeration.
        correct: true
      - text: It proves that commercial aeration pumps require wooden tables to function properly.
        rationale: |
          You misinterpreted table as a physical piece of furniture rather than the procedural action of postponing expansion plans.
      - text: It indicates that local fish farmers permanently abandoned buying fingerlings.
        rationale: |
          You assumed the delay was permanent. The passage states that plans were postponed only until water quality stabilized.
      - text: It demonstrates that seasonal green algae blooms increase fish growth rates.
        rationale: |
          You picked a statement that contradicts the passage. Algae blooms drop oxygen levels and threaten fish rather than helping them grow.
    explanation: |
      The passage contrasts tabling (postponing) expansion plans with immediately redirecting funds toward running aeration pumps during oxygen drops.

  - id: rc-cs-cc-0005
    passage: rc-cs-cc-p1
    type: evaluate
    difficulty: hard
    stem: |
      Which common trap must a reader avoid when interpreting "table" in this passage?
    choices:
      - text: Assuming it refers to furniture rather than procedural delay.
        correct: true
      - text: Assuming the word means to accelerate a new commercial business proposal.
        rationale: |
          You picked the exact opposite of what table means here. The passage explains that table means to postpone or delay investments.
      - text: Confusing fragile juvenile bangus fish with microscopic green algae.
        rationale: |
          You picked a distractor about biological elements. The question specifically asks about avoiding traps when interpreting the word table.
      - text: Believing that net-enclosed fish pens are located in ocean waters.
        rationale: |
          You picked a distractor about location. The passage explicitly states the pens are located along Laguna de Bay, a lake.
    explanation: |
      The word "table" commonly refers to furniture in everyday speech, but in this operational context it means postponing a decision.

  - id: rc-cs-cc-0006
    passage: rc-cs-cc-p2
    type: analyze
    difficulty: easy
    stem: |
      As used in the first paragraph, what does the word "render" mean?
    choices:
      - text: To transform raw material into a refined state
        correct: true
      - text: To translate written text from one language into another
        rationale: |
          You picked a definition of render used for translation. Here, the weaver is processing raw cotton fibers into smooth thread.
      - text: To melt down raw animal fat for commercial cooking oil
        rationale: |
          You picked a culinary definition of render. In this passage, the word refers to converting raw cotton into continuous thread.
      - text: To formally surrender property to legal municipal authorities
        rationale: |
          You picked a legal definition of render. The passage uses the word to describe transforming raw cotton fibers into smooth yarn.
    explanation: |
      The passage describes how the weaver must "render raw, unrefined cotton fibers into smooth, continuous threads by manually combing out seeds", meaning to process or transform.

  - id: rc-cs-cc-0007
    passage: rc-cs-cc-p2
    type: analyze
    difficulty: medium
    stem: |
      Which clue in paragraph 1 clarifies the meaning of "render"?
    choices:
      - text: "combing out seeds and carding the cotton"
        correct: true
      - text: "preserves the traditional craft of Abel Iloco cloth"
        rationale: |
          You picked a general statement about preserving craft traditions. It does not describe the specific process of transforming the fiber.
      - text: "dye loses its intensity and produces uneven coloration"
        rationale: |
          You picked a detail about indigo dyeing from paragraph 2. The word render appears in paragraph 1 regarding cotton preparation.
      - text: "fed with rice wine and wood ash daily"
        rationale: |
          You picked a detail about maintaining the dye culture. This describes feeding microorganisms, not rendering raw cotton into thread.
    explanation: |
      The specific processing steps ("combing out seeds and carding") describe how the raw cotton is transformed or rendered into thread.

  - id: rc-cs-cc-0008
    passage: rc-cs-cc-p2
    type: analyze
    difficulty: medium
    stem: |
      As used in the second paragraph, what is the meaning of the word "culture"?
    choices:
      - text: A medium containing cultivated microorganisms.
        correct: true
      - text: The artistic customs and traditional heritage beliefs of a nation.
        rationale: |
          You picked the sociological definition of culture. In this context, the passage describes a living biological vat of dye microorganisms.
      - text: High social class refinement and formal academic university education.
        rationale: |
          You picked a definition referring to personal refinement. Here, culture refers to the living biological culture used for indigo dyeing.
      - text: A museum exhibition of ancient historical artifacts from Vigan.
        rationale: |
          You picked a distractor related to history and museums. The text uses culture to mean a living fermentation medium.
    explanation: |
      The passage describes the indigo dye as a "living fermentation vat... active microorganisms that extract rich blue pigments", showing that "culture" refers to cultivated microorganisms.

  - id: rc-cs-cc-0009
    passage: rc-cs-cc-p2
    type: infer
    difficulty: hard
    stem: |
      How does the second paragraph support the biological definition of "culture"?
    choices:
      - text: By describing it as a living vat requiring feeding and active microbes.
        correct: true
      - text: By mentioning that Abel Iloco woven textiles are celebrated as cultural heritage.
        rationale: |
          You picked a detail about social heritage from paragraph 3. That uses cultural in a sociological sense, not the biological sense asked about.
      - text: By explaining how traditional foot-pedal looms operate in Vigan workshops.
        rationale: |
          You picked a detail about loom equipment from paragraph 1. It does not explain or support the biological definition of dye culture.
      - text: By contrasting natural organic indigo dyes with synthetic commercial paints.
        rationale: |
          You picked an inference about synthetic paints that is not mentioned anywhere in the passage.
    explanation: |
      The paragraph explicitly mentions a "living fermentation vat, fed with rice wine... active microorganisms", reinforcing the biological meaning of a microorganism culture.

  - id: rc-cs-cc-0010
    passage: rc-cs-cc-p2
    type: evaluate
    difficulty: hard
    stem: |
      If a reader assumed "culture" meant "social traditions", how would that misinterpretation affect their understanding?
    choices:
      - text: They would fail to see why the vat requires daily feeding and care.
        correct: true
      - text: They would assume Aling Teresa stopped weaving traditional regional patterns.
        rationale: |
          You picked an unfounded conclusion. Misunderstanding culture as social tradition obscures the biological needs of the dye vat, not her patterns.
      - text: They would think the cotton threads were made from synthetic commercial nylon.
        rationale: |
          You picked a detail about yarn materials that is not mentioned or implied by confusing the definitions of culture.
      - text: They would believe that wild indigo plants grow exclusively in clay jars.
        rationale: |
          You picked a false claim about plant growth. Clay jars hold the fermented dye mixture, not wild growing plants.
    explanation: |
      Misinterpreting "culture" as social tradition obscures the passage's explanation of maintaining a living biological fermentation process requiring daily feeding and care.
