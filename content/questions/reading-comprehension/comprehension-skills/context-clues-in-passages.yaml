      - text: "Create a computer image"
        rationale: |
          This uses a digital meaning. A demonstration can present an image. Check the physical work described after the word.
      - text: "Melt fat for use in cooking"
        rationale: |
          This uses a cooking meaning. Rendering can process raw material. Check which material Teresa handles.
    explanation: |
      The passage follows raw fibers through cleaning and spinning into thread. Render describes that change from one state to another.
  - id: "rc-cs-cc-0007"
    lesson: lesson-comprehension-skills-definition-and-example-clues
    keyPoint: 1
    passage: "rc-cs-cc-p2"
    type: "context-clues-in-passages"
    difficulty: "medium"
    stem: |
