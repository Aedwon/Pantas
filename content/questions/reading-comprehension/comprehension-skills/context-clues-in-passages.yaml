    choices:
      - text: "unable to be read"
        correct: true
      - text: "written in a foreign language"
        rationale: |
          This treats difficulty reading as a language problem. Both can make labels hard to understand. Check the stated cause, which is faded letters.
      - text: "not permitted by office rules"
        rationale: |
          This confuses illegible with illegal. Their beginnings look alike. Read the description of the letters before choosing a meaning.
      - text: "not useful for sorting folders"
        rationale: |
          This chooses a possible effect as the word's meaning. Unreadable labels may hinder sorting. Look for what the word describes directly.
    explanation: |
      The prefix gives a negative meaning. The letters have faded so much that the numbers cannot be read. Together, these clues support unable to be read.
