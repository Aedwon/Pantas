  - id: "q-comprehension-skills-context-clues-in-passages-0026"
    lesson: lesson-comprehension-skills-filipino-possibility-and-time
    keyPoint: 1
    passage: "p-comprehension-skills-filipino-possibility-and-time-gap"
    type: "context-clues-in-passages"
    difficulty: "exam"
    stem: |
      Aling pahayag ang wastong nag-uugnay sa kilos at oras sa talata?
    choices:
      - text: "Tapos na ang panayam; ginagawa pa ang buod."
        correct: true
      - text: "Ginagawa pa ang panayam; tapos na ang buod kahapon."
        rationale: |
          Napagpalit ang dalawang kilos. Parehong bahagi ng ulat ang mga ito. Basahin ang natapos at isinusulat kasama ng oras.
      - text: "Tapos na ang pagpapabasa; gagawin pa lamang ang panayam."
        rationale: |
          Ginawang tapos ang posibleng kilos bukas. Ang panayam naman ay kahapon pa. Iugnay ang bawat pandiwa sa katabing hudyat ng oras.
      - text: "Sabay na natapos kahapon ang panayam at pagpapabasa."
        rationale: |
          Pinagsama ang magkaibang oras. Parehong kaugnay ng isinulat ang mga kilos. Suriin kung alin ang may bukas at maaaring.
    explanation: |
      Ang natapos na at kahapon ay nagsasaad na tapos ang panayam. Ang isinusulat at ngayon ay nagsasaad na ginagawa pa ang buod.
  - id: "q-comprehension-skills-context-clues-in-passages-0027"
    lesson: lesson-comprehension-skills-filipino-possibility-and-time
