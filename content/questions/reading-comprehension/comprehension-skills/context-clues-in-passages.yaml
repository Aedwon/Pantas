    stem: |
      Ano ang pinakamalapit na kahulugan ng unang salitang naka-bold batay sa talata?
    choices:
      - text: "maingat at maayos"
        correct: true
      - text: "mabilis ngunit padalos-dalos"
        rationale: |
          Napagkamalang bilis ang maayos na kilos. Maaaring mapabilis ng ayos ang paghahanap. Tingnan kung anong ugali ang ipinapakita ng petsa at sobre.
      - text: "mahigpit sa paniningil ng utang"
        rationale: |
          Nagbigay ng ugaling hindi ipinakita. May kinalaman sa bayad ang resibo. Suriin kung pag-iingat o paniningil ang inilalarawan.
      - text: "tahimik kapag may kausap"
        rationale: |
          Nagdagdag ng asal na wala sa talata. Maaaring tahimik ang isang maingat na tao. Hanapin ang kilos na tuwirang kaugnay ng salita.
    explanation: |
      Inayos ni Ruel ang mga resibo ayon sa petsa at itinago sa mga sobre. Ang mga kilos na ito ay nagpapakita ng maingat at maayos na pag-iingat.
  - id: "q-comprehension-skills-context-clues-in-passages-0025"
