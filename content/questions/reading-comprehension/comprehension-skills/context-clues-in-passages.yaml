      Alin ang hindi pa tiyak ayon sa talata?
    choices:
      - text: "Pagpapabasa ng buod bukas."
        correct: true
      - text: "Pagtatapos ng panayam kahapon."
        rationale: |
          Ginawang hindi tiyak ang tuwirang iniulat na natapos. Maaaring tumagal ang ibang gawain. Tingnan kung aling kilos ang may maaaring.
      - text: "Pagsulat ni Celia ng buod ngayon."
        rationale: |
          Hindi pinansin ang pandiwang nagsasaad ng kasalukuyang kilos. Hindi pa tapos ang buod, pero ginagawa na ito. Ihiwalay ang hindi tapos sa hindi tiyak.
      - text: "Paghihintay ni Celia sa tugon ng patnugot."
        rationale: |
          Ginawang posibleng kilos ang tahasang sinabing ginagawa pa. Ang tugon ang wala pa. Basahin kung sino ang kasalukuyang naghihintay.
    explanation: |
      Ang maaaring ay naglilimita sa pagpapabasa bukas. Hinihintay pa ang tugon tungkol sa oras ng patnugot, kaya hindi pa tiyak ang gawaing iyon.
