      - text: "Melt fat for use in cooking"
        rationale: |
          This uses a cooking meaning. Rendering can process raw material. Check which material Teresa handles.
    explanation: |
      The passage follows raw fibers through cleaning and spinning into thread. Render describes that change from one state to another.
  - id: "rc-cs-cc-0007"
    passage: "rc-cs-cc-p2"
