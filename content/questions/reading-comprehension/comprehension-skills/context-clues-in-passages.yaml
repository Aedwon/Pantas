passages:
  - id: "rc-cs-cc-p1"
    title: "Aquaculture Strategies in Laguna de Bay"
    body: |
      In this fictional account, a cooperative raising fish in Laguna de Bay faces changes in water quality. During storms, operators harbor juvenile bangus in protected nursery pens. They shelter the young fish from strong currents while checking their condition and growth. The nursery is one part of a larger effort to protect the stock through changing seasons.
      
      Later, heavy algae growth raises concern about oxygen use at night. The leaders table plans for expanding fish purchases, postponing those investments until conditions improve. Instead, they direct available funds toward aeration and closer monitoring. The plans remain on the cooperative's records for future consideration; they have not been canceled.
      
      Members must decide how to use limited resources without ignoring immediate needs. Sheltering young stock and delaying expansion are different actions, but both serve the same aim of keeping the existing fish safe. The cooperative can return to its longer-term plans once the urgent problem has been addressed and new information supports the decision.
  - id: "rc-cs-cc-p2"
    title: "Abel Iloco Weaving Traditions"
    body: |
      In a fictional weaving workshop, Aling Teresa prepares cotton for a demonstration. She must render the raw fibers into usable thread. First she removes seeds and combs the fibers, then spins them into a continuous strand. The change from loose fiber to thread takes care before the weaving itself can begin.
      
      At the dye station, she shows her visitors an indigo fermentation culture. This mixture contains living microorganisms that help make the dye usable. She monitors its conditions and feeds the culture to keep it active. If she neglects the mixture, it may stop producing the result she needs. The visitors see that caring for a living process is different from merely storing a colored liquid.
      
      Teresa also speaks about the region's weaving culture, meaning the skills, practices, and traditions shared by its people. Both uses of the word belong in the workshop, but they describe different things. Preparing fibers, maintaining the dye mixture, and passing on knowledge all contribute to the craft she wants her visitors to understand.
  - id: "p-comprehension-skills-context-clues-in-passages-0003"
    title: "The Community Newsletter"
    body: |
      The student editors met in the barangay hall with a draft of their newsletter. It was an early version, with blank spaces where interviews would go and notes asking writers to check names. Before printing anything, the team needed to turn that unfinished copy into a reliable account of local events.
      
      For the first issue, they chose a report on the new reading corner. This edition would also include a column by a volunteer who wrote regularly about gardening. Her piece was a section of the paper, not a feature of the hall's architecture. The editors wanted familiar voices as well as announcements.
      
      The team had to address several concerns about accuracy. They discussed each problem and asked the writers to confirm details. Only then did they send the pages to the press, where the printing machines would produce copies. By the end of the meeting, the newsletter had become a shared responsibility. Good writing mattered, but checking facts and giving readers a clear view of their community mattered just as much.
  - id: "p-comprehension-skills-context-clues-in-passages-0004"
    title: "Planning the School Fair"
    body: |
      The fair committee gave Neri charge of the entrance desk. She would supervise the volunteers there and decide how to handle questions from arriving visitors. The role involved responsibility, not collecting an extra fee. The committee wanted one person to coordinate the work without making every volunteer wait for a meeting.
      
      Before the fair, each club made a pitch for its proposed activity. Members explained their idea and tried to win the committee's support. A gardening club offered a planting demonstration. The organizers liked it, but asked the club to scale back the plan. Instead of several displays, it would prepare one smaller exhibit that the available volunteers could manage.
      
      Neri kept a current list of assignments, replacing old information whenever a plan changed. She also created a channel for volunteers to report problems: a shared message group where concerns could reach the committee quickly. The fair depended on people knowing both what to do and how to seek help. Clear roles and communication made the modest event easier to organize.
questions:
  - id: "rc-cs-cc-0001"
    passage: "rc-cs-cc-p1"
    type: "context-clues-in-passages"
    difficulty: "easy"
    stem: |
      In the cooperative passage, what does "harbor" mean?
    choices:
      - text: "Shelter"
        correct: true
      - text: "Hold a grudge against"
        rationale: |
          This uses the emotional meaning of harbor. The word can describe holding feelings. Check what receives protection in this passage.
      - text: "Provide a port for ships"
        rationale: |
          This uses the noun meaning associated with ships. The setting is a lake. Check whether harbor names a place or an action here.
      - text: "Keep something secret"
        rationale: |
          This uses the sense of hiding something. Protected pens keep fish contained. Check whether the purpose is secrecy or safety.
    explanation: |
      The next sentence says the operators shelter young fish from strong currents. That action explains harbor as providing protection.
  - id: "rc-cs-cc-0002"
    passage: "rc-cs-cc-p1"
    type: "context-clues-in-passages"
    difficulty: "medium"
    stem: |
      Which detail best clarifies "harbor" in the cooperative passage?
    choices:
      - text: "\"shelter the young fish\""
        correct: true
      - text: "\"changes in water quality\""
        rationale: |
          This names the wider problem. Water conditions motivate the work. Check which detail describes the action itself.
      - text: "\"plans remain on the cooperative's records\""
        rationale: |
          This selects a clue for a different word. Records explain that table does not mean cancel. Check the paragraph containing harbor.
      - text: "\"decide how to use limited resources\""
        rationale: |
          This selects the overall planning issue. Limited resources shape decisions. Check which phrase tells what happens to the fish.
    explanation: |
      The sheltering detail describes what the operators do for the young fish. It directly explains the protective action.
  - id: "rc-cs-cc-0003"
    passage: "rc-cs-cc-p1"
    type: "context-clues-in-passages"
    difficulty: "medium"
    stem: |
      What does "table" mean in the cooperative passage?
    choices:
      - text: "Postpone"
        correct: true
      - text: "Present for immediate discussion"
        rationale: |
          This uses another procedural meaning of table. Meetings can table a proposal for discussion. Check the explicit word postponing here.
      - text: "Organize information in rows"
        rationale: |
          This uses a data-related meaning. Cooperative records may include tables. Check that table acts on plans in this sentence.
      - text: "Provide a flat working surface"
        rationale: |
          This uses the familiar furniture meaning. Work areas can need tables. Check whether the sentence concerns a surface or a decision.
    explanation: |
      The sentence explains that the investments are postponed until conditions improve. The plans are kept for later consideration.
  - id: "rc-cs-cc-0004"
    passage: "rc-cs-cc-p1"
    type: "context-clues-in-passages"
    difficulty: "hard"
    stem: |
      What does the contrast between tabling expansion and directing funds toward aeration clarify?
    choices:
      - text: "Expansion waits while an urgent need receives funds."
        correct: true
      - text: "Expansion ends permanently when aeration begins."
        rationale: |
          This treats postponement as cancellation. The problem interrupts expansion. Check whether the plans remain for later consideration.
      - text: "Expansion receives funds before any monitoring occurs."
        rationale: |
          This reverses the order of priorities. Both projects require resources. Check which one receives funds now.
      - text: "Aeration is delayed until the cooperative buys more fish."
        rationale: |
          This transfers the delay to aeration. The word table appears near both actions. Check which action the verb actually describes.
    explanation: |
      The passage delays purchases and sends available funds to aeration and monitoring. The contrast shows which work waits and which receives attention now.
  - id: "rc-cs-cc-0005"
    passage: "rc-cs-cc-p1"
    type: "context-clues-in-passages"
    difficulty: "hard"
    stem: |
      Which later clue rules out interpreting "table" as cancel permanently?
    choices:
      - text: "Plans can be revisited."
        correct: true
      - text: "Members must use limited resources carefully."
        rationale: |
          This gives the reason for a decision but not its duration. Limited funds can lead to delay or cancellation. Check for a statement about returning to the plans.
      - text: "The nursery is part of a larger protection effort."
        rationale: |
          This explains protection, not the status of expansion. The nursery is related to the wider effort. Check which clue addresses future action.
      - text: "Heavy algae growth raises concern about oxygen."
        rationale: |
          This explains the urgent problem. It helps explain why spending changes. Check whether it tells how long expansion is set aside.
    explanation: |
      Returning to the plans means they remain available for later action. That clue supports temporary delay.
  - id: "rc-cs-cc-0006"
    passage: "rc-cs-cc-p2"
    type: "context-clues-in-passages"
    difficulty: "easy"
    stem: |
