        correct: true
      - text: "The visitors hear about regional traditions."
        rationale: |
          This follows another topic. Traditions are part of the workshop. Check which clue concerns the fibers' changed state.
      - text: "The dye mixture contains living microorganisms."
        rationale: |
          This follows the biological meaning of culture. Both are preparation processes. Check what material render acts on.
      - text: "Teresa monitors conditions at the dye station."
        rationale: |
          This selects an action from the dye section. Care is needed throughout the craft. Check the paragraph describing thread preparation.
    explanation: |
      Spinning loose fibers into a continuous strand shows the transformation into usable thread. That result explains render.
  - id: "rc-cs-cc-0008"
    passage: "rc-cs-cc-p2"
    type: "context-clues-in-passages"
    difficulty: "medium"
    stem: |
      What does "culture" mean at the dye station?
    choices:
      - text: "A mixture with living microorganisms"
        correct: true
      - text: "The shared customs of people in a region"
        rationale: |
          This uses the social meaning supplied later. Weaving is a regional tradition. Check the living mixture in the dye paragraph.
      - text: "An individual's refinement and education"
        rationale: |
          This uses the personal refinement meaning. Teresa is a skilled craft worker. Check whether culture names her qualities or the mixture.
      - text: "A particular style of patterned woven cloth"
        rationale: |
          This treats the craft's product as the culture. The workshop makes woven cloth. Check what Teresa feeds and monitors.
    explanation: |
      The passage says the mixture contains living microorganisms and must be kept active. Those details give culture its biological meaning.
  - id: "rc-cs-cc-0009"
    passage: "rc-cs-cc-p2"
    type: "context-clues-in-passages"
    difficulty: "hard"
    stem: |
      Which detail most strongly supports the biological meaning of "culture" at the dye station?
    choices:
      - text: "Living microorganisms must be kept active."
        correct: true
      - text: "Teresa demonstrates skills to workshop visitors."
        rationale: |
          This treats passing on knowledge as biological growth. A workshop preserves traditions. Check which detail names living organisms.
      - text: "Weaving traditions are shared by regional communities."
        rationale: |
          This uses the word's social meaning. Communities share a culture. Check which use the dye paragraph requires.
      - text: "Raw cotton fibers are spun into a continuous strand."
        rationale: |
          This confuses thread production with the living mixture. Both are workshop processes. Check whether the clue mentions organisms.
    explanation: |
      The presence of living microorganisms directly identifies a biological culture. Keeping them active explains why it needs care.
  - id: "rc-cs-cc-0010"
    passage: "rc-cs-cc-p2"
    type: "context-clues-in-passages"
    difficulty: "hard"
    stem: |
      The passage uses "culture" at the dye station and again for regional weaving traditions. What determines which meaning applies?
    choices:
      - text: "The surrounding descriptions"
        correct: true
      - text: "The assumption that one word keeps one meaning"
        rationale: |
          This ignores a change in context. Repeated words often share a meaning. Check the different things described near each use.
      - text: "The location of the workshop in the region"
        rationale: |
          This lets the general setting decide every use. Regional weaving suggests social customs. Check the more specific description at the dye station.
      - text: "The number of times the word appears in the passage"
        rationale: |
          This uses frequency as evidence of meaning. Repetition makes the word noticeable. Check what each occurrence refers to.
    explanation: |
      Descriptions of microorganisms show the biological meaning. Descriptions of shared skills and traditions show the social meaning. The surrounding words select each sense.
  - id: "q-comprehension-skills-context-clues-in-passages-0011"
