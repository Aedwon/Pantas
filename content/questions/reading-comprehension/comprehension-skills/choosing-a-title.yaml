passages:
  - id: rc-cs-ct-p1
    title: "Preserving the Ifugao Rice Terraces"
    body: |
      The ancient Ifugao Rice Terraces of the Philippine Cordilleras represent a masterpiece of indigenous engineering and communal land stewardship built over two thousand years ago. Carved into the steep contours of the mountains, the terraces rely on hand-built stone retaining walls and intricate gravity-fed irrigation channels that distribute mountain spring water across hundreds of terraced pond-fields.

      Maintaining these agricultural marvels, however, requires constant labor and traditional ecological knowledge passed down through generations. In recent decades, stone walls have collapsed during extreme monsoon rains due to lack of timely maintenance. Furthermore, many younger Ifugao residents are migrating to urban centers for higher-paying jobs, leaving elderly farmers to manage the demanding repair work alone.

      To prevent further deterioration, local cultural agencies and indigenous elders launched collaborative restoration workshops that train young volunteers in traditional stonemasonry while integrating modern soil stabilization techniques. Protecting the terraces requires balancing cultural heritage conservation with sustainable economic opportunities for mountain communities.

  - id: rc-cs-ct-p2
    title: "The Urban Benefits of Public Parks"
    body: |
      As Metro Manila experiences rapid urban density and rising summer heat, the strategic expansion of public urban parks has become an essential urban planning imperative. Dense concrete roads and tall buildings absorb solar radiation, creating urban heat islands where city temperatures run up to four degrees Celsius higher than surrounding rural areas. Shaded park trees and grassy lawns actively mitigate this heat effect by providing natural cooling.

      Beyond environmental temperature control, urban parks offer measurable public health benefits. Psychological studies demonstrate that spending twenty minutes in a tree-lined green space significantly lowers cortisol levels and reduces urban stress. Parks also provide accessible, cost-free spaces for exercise, recreational sports, and family gatherings, strengthening social cohesion across diverse neighborhood income groups.

      City planners must prioritize green infrastructure investments alongside commercial development. Investing in public parks is not a decorative luxury, but a vital investment in urban public health, climate cooling, and community well-being.

questions:
  - id: rc-cs-ct-0001
    passage: rc-cs-ct-p1
    type: analyze
    difficulty: easy
    stem: |
      Which title best captures the full scope and main focus of the Ifugao passage?
    choices:
      - text: "Preserving Ifugao Rice Terraces"
        correct: true
      - text: Ancient Mountain Stone Walls
      - text: How Gravity-Fed Water Channels Function in Mountain Rice Fields
      - text: The Complete History of Agriculture in the Cordilleras
    explanation: |
      The passage discusses the terraces' significance, maintenance challenges (wall collapse, youth migration), and restoration initiatives, making this title the complete fit.

  - id: rc-cs-ct-0002
    passage: rc-cs-ct-p1
    type: analyze
    difficulty: medium
    stem: |
      Why is "How Gravity-Fed Water Channels Function" a poor title for the passage?
    choices:
      - text: It focuses on a single engineering detail, ignoring restoration.
        correct: true
      - text: It is far too broad and could apply to any traditional irrigation project worldwide.
      - text: It directly contradicts the historical construction information presented in paragraph 1.
      - text: It fails to mention that young agricultural farmers migrate to urban centers.
    explanation: |
      Gravity-fed channels are mentioned in paragraph 1 as one engineering feature, so using it as the title makes it far too narrow.

  - id: rc-cs-ct-0003
    passage: rc-cs-ct-p1
    type: analyze
    difficulty: medium
    stem: |
      Why is the single-word title "Terraces" inappropriate for this passage?
    choices:
      - text: It is overly broad, failing to specify context or challenges.
        correct: true
      - text: It is far too narrow and mentions only ancient hand-built stone walls.
      - text: It focuses exclusively on modern urban youth migration trends.
      - text: It misstates the exact historical age of the mountain agricultural structures.
    explanation: |
      A single generic word like "Terraces" is far too broad and fails to specify the Ifugao context or the restoration thesis.

  - id: rc-cs-ct-0004
    passage: rc-cs-ct-p1
    type: infer
    difficulty: hard
    stem: |
      Which alternative title would also be appropriate for the Ifugao passage?
    choices:
      - text: "Sustaining Ifugao Terraces"
        correct: true
      - text: The Rise of Modern Concrete Buildings in Cordillera Mountain Cities
      - text: Commercial Rice Exporting in Northern Luzon
      - text: Monsoon Rainfall Patterns Across Two Thousand Years
    explanation: |
      This alternative title captures both the heritage conservation aspect and the restoration workshops training young volunteers.

  - id: rc-cs-ct-0005
    passage: rc-cs-ct-p1
    type: evaluate
    difficulty: hard
    stem: |
      What essential element must a strong title for this passage include?
    choices:
      - text: Reference to terrace values and restoration efforts.
        correct: true
      - text: Exact mathematical figures regarding stone retaining wall heights.
      - text: A detailed list of all high-paying jobs available in urban centers.
      - text: An exclusive focus on modern soil stabilization machinery.
    explanation: |
      A comprehensive title must encompass both the cultural engineering value and the active efforts to resolve maintenance threats.

  - id: rc-cs-ct-0006
    passage: rc-cs-ct-p2
    type: analyze
    difficulty: easy
    stem: |
      Which title best fits the passage on Metro Manila public parks?
    choices:
      - text: Urban Parks in Metro Manila
        correct: true
      - text: Measuring Cortisol Levels
      - text: Metro Manila Concrete Buildings
      - text: The Complete Architecture of Urban Heat Islands
    explanation: |
      The passage outlines how parks cool urban temperatures, improve mental health, and foster social cohesion, making this title accurate and complete.

  - id: rc-cs-ct-0007
    passage: rc-cs-ct-p2
    type: analyze
    difficulty: medium
    stem: |
      Why would "Measuring Cortisol Levels" be an unsatisfactory title for the park passage?
    choices:
      - text: It names only one specific physiological detail from paragraph 2.
        correct: true
      - text: It is far too broad and describes global public healthcare policies.
      - text: It contradicts the passage's argument about cooling urban heat islands.
      - text: It focuses exclusively on private commercial real estate investments.
    explanation: |
      Cortisol measurement is a supporting detail in paragraph 2 used to prove mental health benefits; as a title, it is far too narrow.

  - id: rc-cs-ct-0008
    passage: rc-cs-ct-p2
    type: analyze
    difficulty: medium
    stem: |
      Why is "Metro Manila Buildings" a poor choice for the title?
    choices:
      - text: It names a cause of heat islands without reflecting park benefits.
        correct: true
      - text: It is far too narrow and mentions only psychological stress reduction.
      - text: It misidentifies Metro Manila as a rural agricultural farming region.
      - text: It focuses exclusively on recreational sports rather than architecture.
    explanation: |
      Concrete buildings explain why urban heat islands form, but the passage's thesis advocates for expanding public parks to mitigate these problems.

  - id: rc-cs-ct-0009
    passage: rc-cs-ct-p2
    type: infer
    difficulty: hard
    stem: |
      Which title best reflects the argumentative stance taken in the final paragraph?
    choices:
      - text: "Urban Parks: Essential Public Investments"
        correct: true
      - text: Why Commercial Real Estate Development Should Replace All Public Parks
      - text: The History of Four-Degree Temperature Increases in Rural Areas
      - text: Decorative Landscaping in Metro Manila Shopping Malls
    explanation: |
      The final paragraph argues that parks are not luxuries but vital investments for urban health, cooling, and well-being, which this title captures.

  - id: rc-cs-ct-0010
    passage: rc-cs-ct-p2
    type: evaluate
    difficulty: hard
    stem: |
      Which test confirms that "Urban Green Spaces: Cooling, Health, and Community" is a well-balanced title?
    choices:
      - text: It covers environmental, psychological, and social dimensions.
        correct: true
      - text: It contains only one short word and is very easy to memorize.
      - text: It mentions only the four-degree temperature measurement figure.
      - text: It focuses exclusively on annual financial budget allocations for trees.
    explanation: |
      A well-balanced title reflects all main dimensions discussed in the text: environmental cooling, health/stress reduction, and community social cohesion.
