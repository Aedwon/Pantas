meta:
  subject: "reading-comprehension"
  topic: "comprehension-skills"
  subtopic: "inferencing-and-conclusions"
  exams:
    - "upcat"
    - "acet"
    - "dlsucet"
    - "ustet"
passages:
  - id: "rc-cs-ic-p1"
    title: "The Shifting Harvest in Isabela"
    body: |
      In this fictional field report, agricultural extension worker Ramon Gomez visited farm plots in Isabela for three consecutive years to document seasonal crop cycles. During his first visit in 2021, local farmers planted traditional wet-season rice varieties in late May, relying on predictable monsoonal rainfall. By 2023, however, Ramon noted that farmers had shifted their planting schedule to early April and substituted traditional seed varieties with short-maturing, drought-tolerant hybrid rice.
      
      Additionally, three farm owners had dug shallow tube wells along the perimeter of their fields and installed solar-powered water pumps. When Ramon reviewed municipal rainfall records, he observed that total annual precipitation had remained constant, but dry spells during the traditional growing months had doubled in duration. Furthermore, local farm cooperatives began purchasing communal crop insurance policies that provide financial protection against losses for the first time in their thirty-year history.
      
      Although the farmers did not issue formal statements regarding climate patterns, their operational adjustments reflected a coordinated effort to mitigate agricultural vulnerability. The rapid adoption of new technology and financial safeguards transformed how the community managed environmental risk.
  - id: "rc-cs-ic-p2"
    title: "Archaeological Finds in Cagayan"
    body: |
      In a fictional excavation report, archaeologists describe a buried settlement layer beside a river. The layer contains earthenware jars, carbonized rice grains, and clay weights used to hold fishing nets in place. The team also recovers stone tools and small metal tokens with designs associated with places beyond the valley. The report does not establish exactly how those tokens arrived.
      
      Testing the rice gives a date range between the tenth and twelfth centuries. Jars lie in orderly rows beside holes left by wooden posts, suggesting that structures once stood there. Most tokens are found near the former riverbank. Their location raises questions about whether the river connected the settlement with people elsewhere.
      
      No written records are recovered. The team therefore compares the objects and their positions to build a cautious account of life at the site. Food remains and tools offer clues about activities. They do not, by themselves, reveal every occupation, belief, or event in the community's history. Further discoveries could strengthen or change the account.
  - id: "rc-cs-ic-p3"
    title: "Provincial Bus Line Safety Protocol"
    body: |
      In this fictional case study, a bus company changes several policies after reviewing driver work logs. It requires a rest break after four continuous hours of driving. A digital system records driving time and prevents a new departure when the driver has not taken the required break. The system acts before a trip starts; it does not switch off an engine while a bus is moving.
      
      The company also installs speed limiters and replaces payment per completed trip with fixed monthly salaries. Before the changes, drivers sometimes skipped breaks to complete extra trips and earn more. Within six months, passenger complaints about erratic driving decline, and driver turnover becomes more stable.
      
      The report presents these changes together. It does not include a separate test of each policy or a survey of driver satisfaction. Managers believe the reforms address both incentives and working conditions, but the observations do not establish how much each reform contributed. The company continues collecting logs so that it can evaluate the results more carefully over time.
  - id: "p-comprehension-skills-inferencing-and-conclusions-0004"
    title: "The Unopened Envelope"
    body: |
      At the scholarship office, Paolo placed an unopened envelope beside his application. The clerk asked for the original certificate, but he slid forward a photocopy. He said the original was in the envelope and asked whether he could keep it sealed until the final interview. The clerk checked the instructions and explained that she needed to see the original that afternoon.
      
      Paolo looked toward the waiting chairs, then at the clock. He had arrived before the office opened and had asked twice when applications would be accepted. Now he opened the envelope carefully along one edge and took out the certificate. The clerk compared it with the copy and returned it without comment.
      
      As Paolo left, another applicant said she had not brought an original. He pointed to the instruction sheet on the wall and told her where to ask about returning later. The scene did not reveal why he wanted to preserve the envelope or how either application would be decided. It showed the difference between what people could observe and what they might only guess.
questions:
  - id: "rc-cs-ic-0001"
    passage: "rc-cs-ic-p1"
    type: "inferencing-and-conclusions"
    difficulty: "easy"
    stem: |
      What is best supported by the farmers' choice of short-maturing, drought-tolerant rice?
    choices:
      - text: "They changed crops in response to dry spells."
        correct: true
      - text: "They expected every traditional variety to disappear."
        rationale: |
          This turns a local change into extinction. New seeds replace old ones on these plots. Check the geographic and biological scope of the evidence.
      - text: "They wanted to stop growing rice permanently."
        rationale: |
          This turns an adaptation within rice farming into abandoning it. The farmers change seed varieties. Check whether rice is still planted.
      - text: "They believed annual rainfall totals had doubled."
        rationale: |
          This confuses dry-spell duration with rainfall volume. Both are weather measures. Check which one the records say changed.
    explanation: |
      The report links longer growing-season dry spells with crops that tolerate drought and mature sooner. The change addresses that risk.
  - id: "rc-cs-ic-0002"
    passage: "rc-cs-ic-p1"
    type: "inferencing-and-conclusions"
    difficulty: "medium"
    stem: |
      What does buying crop insurance alongside new irrigation tools suggest?
    choices:
      - text: "The cooperatives wanted protection from crop losses."
        correct: true
      - text: "The cooperatives were certain all future crops would fail."
        rationale: |
          This turns risk management into certainty of failure. Insurance prepares for loss. Check whether preparing proves that loss will occur.
      - text: "The farmers intended to replace irrigation with insurance."
        rationale: |
          This treats complementary measures as substitutes. Both require spending. Check whether the passage says pumps were removed.
      - text: "The policies guaranteed that crops would mature faster."
        rationale: |
          This transfers a crop property to a financial policy. Faster maturity appears in the seed description. Check what insurance actually protects.
    explanation: |
      The passage defines insurance as financial protection against losses. Buying it alongside tools to handle dry spells suggests concern about crop risk.
  - id: "rc-cs-ic-0003"
    passage: "rc-cs-ic-p1"
    type: "inferencing-and-conclusions"
    difficulty: "medium"
    stem: |
      Why might unchanged annual rainfall totals hide a growing-season problem?
    choices:
      - text: "The timing of rainfall can still change."
        correct: true
      - text: "The totals prove dry spells cannot become longer."
        rationale: |
          This treats total volume as a schedule. An unchanged total can look reassuring. Check whether it tells when the rain falls.
      - text: "The pumps must have made rain fall less frequently."
        rationale: |
          This reverses response and cause. Pumps appear with changing weather. Check whether they move water or control rain.
      - text: "The records establish that every season became wetter."
        rationale: |
          This expands a yearly total into each season. A total combines the whole year. Check the separate growing-season evidence.
    explanation: |
      The records report the same annual amount but longer dry spells during growing months. Combining those details shows that timing can change even when the yearly total does not.
  - id: "rc-cs-ic-0004"
    passage: "rc-cs-ic-p1"
    type: "inferencing-and-conclusions"
    difficulty: "hard"
    stem: |
      Which conclusion about the farmers' use of technology is best supported?
    choices:
      - text: "They adopted tools to address a growing risk."
        correct: true
      - text: "They rejected all tools until an official forced them."
        rationale: |
          This supplies a mandate that is absent. Major changes can follow rules. Check whether the report mentions coercion.
      - text: "They viewed every traditional method as worthless."
        rationale: |
          This turns use of new tools into total rejection of tradition. Some practices change. Check the scope of the attitude the evidence supports.
      - text: "They were certain new tools would prevent every loss."
        rationale: |
          This turns a protective measure into a guarantee. The tools may help. Check whether the report promises complete protection.
    explanation: |
      The farmers install pumps as dry spells grow longer. Their actions show willingness to use tools to address the risk.
  - id: "rc-cs-ic-0005"
    passage: "rc-cs-ic-p1"
    type: "inferencing-and-conclusions"
    difficulty: "hard"
    stem: |
      What conclusion can be drawn by comparing the early and later field visits?
    choices:
      - text: "Practices changed alongside longer dry spells."
        correct: true
      - text: "Ramon caused the weather changes by visiting the plots."
        rationale: |
          This assumes an observer caused what he recorded. Visits and changes occur together. Check whether the worker altered rainfall.
      - text: "Annual rainfall reached its record maximum in 2021."
        rationale: |
          This supplies a historical ranking. A rainfall record is consulted. Check whether a record maximum is reported.
      - text: "Every farm in the province adopted the same equipment."
        rationale: |
          This expands observations beyond the sampled farms. Several owners install pumps. Check whether every provincial farm is included.
    explanation: |
      The visits show changed seeds, schedules, and equipment alongside longer dry spells. Together they support a change in practice as risk grew.
  - id: "rc-cs-ic-0006"
    passage: "rc-cs-ic-p2"
    type: "inferencing-and-conclusions"
    difficulty: "easy"
    stem: |
      What do the rice grains and fishing-net weights support about the settlement?
    choices:
      - text: "Rice use and fishing activity"
        correct: true
      - text: "Proof that all rice was grown locally"
        rationale: |
          This turns food remains into proof of local cultivation. Rice can be grown or obtained elsewhere. Check whether fields or cultivation evidence are given.
      - text: "Proof that the settlement never traded for food"
        rationale: |
          This turns local tools into complete independence from trade. Fishing gear suggests local activity. Check whether it excludes imported food.
      - text: "Certainty that fishing was the only occupation"
        rationale: |
          This makes one activity the whole economy. Net weights are clear clues. Check what the other objects add.
    explanation: |
      Rice grains show rice was present at the site. Tools described as fishing-net weights support fishing activity. These clues together support both uses.
  - id: "rc-cs-ic-0007"
    passage: "rc-cs-ic-p2"
    type: "inferencing-and-conclusions"
    difficulty: "medium"
    stem: |
      What is the strongest cautious inference from non-local token designs near the former riverbank?
    choices:
      - text: "Contact beyond the valley is plausible."
        correct: true
      - text: "All tokens were used only to purchase imported rice."
        rationale: |
          This assigns a specific transaction to the objects. Tokens may suggest exchange. Check whether the report identifies what they bought.
      - text: "The riverbank was the settlement's exclusive trading area."
        rationale: |
          This turns concentration into exclusivity. Many tokens are near the bank. Check whether the report rules out activity elsewhere.
      - text: "The tokens prove direct visits to every neighboring island."
        rationale: |
          This turns a broad connection into a complete travel history. Non-local designs suggest contact. Check how many locations the objects establish.
    explanation: |
      The non-local designs suggest a connection with places outside the valley. Their riverbank location makes river-linked contact plausible, while the precise route remains unknown.
  - id: "rc-cs-ic-0008"
    passage: "rc-cs-ic-p2"
    type: "inferencing-and-conclusions"
    difficulty: "medium"
    stem: |
      What is best supported by jars beside holes left by wooden posts?
    choices:
      - text: "Built structures likely stood at the site."
        correct: true
      - text: "Permanent homes certainly occupied every part of the site."
        rationale: |
          This turns evidence of structures into certainty about permanence and extent. Post holes suggest construction. Check which details establish duration or every location.
      - text: "A particular earthquake destroyed the settlement."
        rationale: |
          This invents a cause of abandonment. Buried objects may suggest a vanished settlement. Check whether earthquake evidence is supplied.
      - text: "The inhabitants lived only in caves far from the river."
        rationale: |
          This overlooks construction evidence. Ancient living arrangements can vary. Check the wooden-post holes beside the jars.
    explanation: |
      Post holes indicate places where wooden posts once stood. Nearby orderly jars support the possibility of built structures in use there.
  - id: "rc-cs-ic-0009"
    passage: "rc-cs-ic-p2"
    type: "inferencing-and-conclusions"
    difficulty: "hard"
    stem: |
      What conclusion does testing the carbonized rice help the archaeologists draw?
    choices:
      - text: "An estimated time range for the layer"
        correct: true
      - text: "The exact reason the inhabitants left the settlement"
        rationale: |
          This treats dating as an explanation of abandonment. A date can locate an event. Check whether it reveals a motive or cause.
      - text: "The particular trade route taken by each metal token"
        rationale: |
          This treats the rice date as a route map for tokens. The objects share a layer. Check what the test actually measures.
      - text: "The full list of crops grown by every household"
        rationale: |
          This expands one sample into all farming. Rice is found at the site. Check whether a date test identifies every crop.
    explanation: |
      The test gives a date range between the tenth and twelfth centuries. It helps place the layer in time.
  - id: "rc-cs-ic-0010"
    passage: "rc-cs-ic-p2"
    type: "inferencing-and-conclusions"
    difficulty: "hard"
    stem: |
      Which combined conclusion stays within the excavation evidence?
    choices:
      - text: "Structures, food use, and outside contact are supported."
        correct: true
      - text: "A permanent trading city with written law is proved."
        rationale: |
          This adds political organization and writing. Several objects suggest a community. Check whether laws or city status are established.
      - text: "Every inhabitant farmed rice and traded metal daily."
        rationale: |
          This assigns the same tasks to everyone. The objects support some activities. Check whether they identify each person's work.
      - text: "The absence of recovered writing proves nobody could write."
        rationale: |
          This treats missing evidence as proof of absence. No writing was recovered. Check whether that establishes what everyone could do.
    explanation: |
      Post holes support structures, rice and net weights support food-related activity, and non-local designs suggest outside contact. The combined account stays close to those clues.
  - id: "rc-cs-ic-0011"
    passage: "rc-cs-ic-p3"
    type: "inferencing-and-conclusions"
    difficulty: "easy"
    stem: |
      Which earlier incentive did the pay reform directly address?
    choices:
      - text: "Extra trips increased drivers' earnings."
        correct: true
      - text: "Fewer passengers automatically raised drivers' salaries."
        rationale: |
          This invents a pay rule about passenger numbers. Demand can affect transport work. Check how the case describes commissions.
      - text: "Electronic badges prevented every rest break."
        rationale: |
          This reverses the timing. Digital logging is part of the reform. Check whether it existed before the skipped breaks.
      - text: "Drivers earned more by reporting fewer completed trips."
        rationale: |
          This reverses the commission incentive. Trip records affect earnings. Check whether more or fewer completed trips increased pay.
    explanation: |
      Before the reform, pay depended on completed trips. Extra trips could raise earnings, which helps explain the incentive to skip breaks.
  - id: "rc-cs-ic-0012"
    passage: "rc-cs-ic-p3"
    type: "inferencing-and-conclusions"
    difficulty: "medium"
    stem: |
      Why might fixed salaries reduce pressure to skip breaks?
    choices:
      - text: "Extra trips no longer increase that salary."
        correct: true
      - text: "The company no longer needs any safety enforcement."
        rationale: |
          This treats changed pay as complete safety control. Incentives matter. Check the separate rest and speed policies.
      - text: "Every driver is guaranteed to feel fully satisfied."
        rationale: |
          This turns a pay arrangement into certainty about feelings. Predictable pay may be welcomed. Check whether driver satisfaction was measured.
      - text: "All routes must take less time under the new pay system."
        rationale: |
          This turns changed incentives into shorter routes. Drivers may face less rushing pressure. Check whether distances or schedules changed.
    explanation: |
      With a fixed monthly salary, completing another trip does not raise that salary. The direct pay incentive for extra trips is removed.
  - id: "rc-cs-ic-0013"
    passage: "rc-cs-ic-p3"
    type: "inferencing-and-conclusions"
    difficulty: "medium"
    stem: |
      What can stable turnover alone establish about driver satisfaction?
    choices:
      - text: "Satisfaction cannot be determined from it alone."
        correct: true
      - text: "Every driver preferred all the new safety policies."
        rationale: |
          This treats staying as approval of every rule. Drivers may remain for many reasons. Check whether their views were measured.
      - text: "Most drivers were unhappy with fixed monthly pay."
        rationale: |
          This treats stable departures as proof of unhappiness. Pay changes can upset some people. Check for evidence of what most drivers felt.
      - text: "Every remaining driver welcomed each enforced break."
        rationale: |
          This assigns one motive to every remaining driver. Breaks may be useful. Check whether individual preferences were recorded.
    explanation: |
      A stable departure rate records a pattern of leaving. It does not directly measure feelings about the policies. The report has no satisfaction survey.
  - id: "rc-cs-ic-0014"
    passage: "rc-cs-ic-p3"
    type: "inferencing-and-conclusions"
    difficulty: "hard"
    stem: |
      Why would the digital system prevent a new departure after excessive continuous driving?
    choices:
      - text: "To enforce the required rest period"
        correct: true
      - text: "To replace the speed limiters on every route"
        rationale: |
          This mixes two separate controls. Both affect safety. Check which system responds to elapsed driving time.
      - text: "To collect extra passenger fares at checkpoints"
        rationale: |
          This invents a fare-collection purpose. Logging records activity. Check what condition triggers the departure block.
      - text: "To guarantee drivers liked the new payment policy"
        rationale: |
          This mistakes enforcement for approval. Drivers must follow the policy. Check whether compliance measures feelings.
    explanation: |
      The system records driving time and blocks a new departure until the required break is taken. Its design enforces the rest rule.
  - id: "rc-cs-ic-0015"
    passage: "rc-cs-ic-p3"
    type: "inferencing-and-conclusions"
    difficulty: "hard"
    stem: |
      Which conclusion about the combined reforms is justified by the case study?
    choices:
      - text: "They accompanied a decline in complaints."
        correct: true
      - text: "Fixed pay alone caused the entire decline in complaints."
        rationale: |
          This assigns the whole change to one policy. Fixed pay alters incentives. Check whether separate policy tests were conducted.
      - text: "The company proved each policy was equally effective."
        rationale: |
          This assigns equal contributions without measurement. The policies were introduced together. Check whether their individual effects are known.
      - text: "Stable turnover proves complaints can never rise again."
        rationale: |
          This treats one observed pattern as a permanent guarantee. Turnover stabilized. Check whether it establishes future complaint levels.
    explanation: |
      Complaints declined after the pay, rest, and speed policies changed together. The observations support that association with the combined reforms.
  - id: "q-comprehension-skills-inferencing-and-conclusions-0016"
    passage: "p-comprehension-skills-inferencing-and-conclusions-0004"
    type: "inferencing-and-conclusions"
    difficulty: "easy"
    stem: |
      What is the strongest inference from Paolo arriving early, asking when applications open, and watching the clock?
    choices:
      - text: "He is attentive to completing the application."
        correct: true
      - text: "He is certain that his scholarship has been approved."
        rationale: |
          This turns preparation into knowledge of the result. Paolo brings documents. Check whether any award decision is stated.
      - text: "He dislikes every person waiting in the office."
        rationale: |
          This assigns a hostile motive to looking at the chairs. He notices the waiting area. Check whether his feelings toward others are described.
      - text: "He knows the clerk will reject every photocopy."
        rationale: |
          This turns concern about timing into knowledge of policy. Documents matter to the process. Check what he actually asks about.
    explanation: |
      His early arrival and repeated timing checks connect his behavior to the application process. They support attentiveness to completing it.
    approved: false
  - id: "q-comprehension-skills-inferencing-and-conclusions-0017"
    passage: "p-comprehension-skills-inferencing-and-conclusions-0004"
    type: "inferencing-and-conclusions"
    difficulty: "medium"
    stem: |
      What can be concluded about why Paolo wanted the envelope sealed?
    choices:
      - text: "The passage does not establish his reason."
        correct: true
      - text: "He certainly intended to hide a false certificate."
        rationale: |
          This turns caution into proof of dishonesty. A sealed envelope may suggest secrecy. Check for evidence that the certificate is false.
      - text: "He definitely feared the clerk would damage the paper."
        rationale: |
          This chooses one possible concern as certain. Careful opening may suggest protecting the paper. Check whether damage is mentioned as his reason.
      - text: "He had been ordered by the scholarship office to keep it shut."
        rationale: |
          This turns his request into an official instruction. The office has document rules. Check what the clerk actually requires.
    explanation: |
      Paolo asks to keep the envelope sealed, but the passage supplies no reason for that request. His motive remains unknown.
    approved: false
  - id: "q-comprehension-skills-inferencing-and-conclusions-0018"
    passage: "p-comprehension-skills-inferencing-and-conclusions-0004"
    type: "inferencing-and-conclusions"
    difficulty: "hard"
    stem: |
      Which action best supports the inference that Paolo wants to preserve the envelope while following the requirement?
    choices:
      - text: "He opens it carefully along one edge."
        correct: true
      - text: "He arrived before the office opened."
        rationale: |
          This supports attention to timing. Arriving early shows preparation. Check whether it says how he treats the envelope.
      - text: "He asks twice when applications will be accepted."
        rationale: |
          This supports concern about the application schedule. Repeated questions show attention. Check which action combines compliance and care.
      - text: "He points another applicant toward the instruction sheet."
        rationale: |
          This supports helping another applicant. The instructions are relevant to documents. Check which action concerns his own envelope.
    explanation: |
      Opening the envelope meets the clerk's requirement. Doing so carefully along one edge suggests an effort to preserve it while complying.
    approved: false
  - id: "q-comprehension-skills-inferencing-and-conclusions-0019"
    passage: "p-comprehension-skills-inferencing-and-conclusions-0004"
    type: "inferencing-and-conclusions"
    difficulty: "hard"
    stem: |
      What does Paolo's response to the other applicant most reasonably suggest?
    choices:
      - text: "He is willing to direct her to useful information."
        correct: true
      - text: "He knows she will receive the same scholarship as him."
        rationale: |
          This turns sharing guidance into knowledge of awards. Both are applicants. Check whether any decision has been made.
      - text: "He believes the clerk never accepts any late return."
        rationale: |
          This turns guidance into a definite rule about returns. He directs her to ask. Check whether he states that return is forbidden.
      - text: "He intends to complete her application on her behalf."
        rationale: |
          This turns limited help into taking over the process. He offers information. Check whether he fills in or submits her application.
    explanation: |
      Paolo points out the instructions and where to ask about returning. Those actions show willingness to help her find information.
    approved: false
  - id: "q-comprehension-skills-inferencing-and-conclusions-0020"
    passage: "p-comprehension-skills-inferencing-and-conclusions-0004"
    type: "inferencing-and-conclusions"
    difficulty: "exam"
    stem: |
      Which conclusion follows most securely from the clerk comparing the certificate and returning it?
    choices:
      - text: "The original was presented for inspection."
        correct: true
      - text: "The application was approved immediately afterward."
        rationale: |
          This treats a document check as final approval. Inspection is part of the process. Check whether an award decision follows.
      - text: "The clerk established that Paolo deserves the award."
        rationale: |
          This treats verifying a document as ranking merit. Certificates can support applications. Check what the clerk actually evaluates here.
      - text: "The other applicant was disqualified from consideration."
        rationale: |
          This transfers Paolo's document check to another person's outcome. The other applicant lacks an original. Check whether a disqualification is announced.
    explanation: |
      Paolo opens the envelope and hands over the certificate. The clerk compares it with the copy, so the original has been presented for inspection.
    approved: false
