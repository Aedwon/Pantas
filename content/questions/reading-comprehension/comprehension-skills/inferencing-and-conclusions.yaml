passages:
  - id: rc-cs-ic-p1
    title: "The Shifting Harvest in Isabela"
    body: |
      Agricultural extension worker Ramon Gomez visited farm plots in Isabela for three consecutive years to document seasonal crop cycles. During his first visit in 2021, local farmers planted traditional wet-season rice varieties in late May, relying on predictable monsoonal rainfall. By 2023, however, Ramon noted that farmers had shifted their planting schedule to early April and substituted traditional seed varieties with short-maturing, drought-tolerant hybrid rice.

      Additionally, three farm owners had dug shallow tube wells along the perimeter of their fields and installed solar-powered water pumps. When Ramon reviewed municipal rainfall records, he observed that total annual precipitation had remained constant, but dry spells during the traditional growing months had doubled in duration. Furthermore, local farm cooperatives began purchasing communal crop insurance policies for the first time in their thirty-year history.

      Although the farmers did not issue formal statements regarding climate patterns, their operational adjustments reflected a coordinated effort to mitigate agricultural vulnerability. The rapid adoption of new technology and financial safeguards transformed how the community managed environmental risk.

  - id: rc-cs-ic-p2
    title: "Archaeological Finds in Cagayan"
    body: |
      During a salvage excavation along the lower Cagayan River basin, archaeologists uncovered a buried occupational layer containing low-fired earthenware jars, carbonized rice grains, and perforated clay net sinkers. Deeper within the same soil stratum, the team recovered smooth basalt adzes, animal bone fragments showing butcher marks, and small lead-alloy tokens bearing non-local decorative motifs.

      Radiometric testing of the carbonized rice established that the site was occupied between the tenth and twelfth centuries. Significantly, the earthenware jars were found arranged in orderly rows near a series of post-hole impressions, while the lead-alloy tokens were concentrated exclusively near the ancient riverbank edge.

      No written records survived from the settlement. However, the spatial distribution of the artifacts and the presence of non-local metallic items provided clear material evidence regarding the economic life and subsistence strategies of the valley's early inhabitants.

  - id: rc-cs-ic-p3
    title: "Provincial Bus Line Safety Protocol"
    body: |
      Following a series of scheduling audits, Northern Express Transit implemented a mandatory digital logging system across its fleet of long-haul provincial buses operating between Manila and Ilocos. Drivers were required to swipe an electronic badge at designated checkpoints every two hours, automatically locking the vehicle ignition if a driver exceeded four continuous hours of steering without a mandatory thirty-minute break.

      Simultaneously, the transit company installed tamper-evident speed limiters calibrated to eighty kilometers per hour and replaced traditional daily trip commissions with fixed monthly salaries. Within six months of implementing these policies, passenger complaints regarding erratic driving dropped by seventy percent, while driver turnover rates stabilized across all routes.

      Internal logs revealed that prior to the policy change, drivers frequently skipped meal breaks to complete extra round trips and maximize their daily commission earnings. The structural reforms fundamentally altered driver incentives and operational safety standards.

questions:
  - id: rc-cs-ic-0001
    passage: rc-cs-ic-p1
    type: infer
    difficulty: easy
    stem: |
      What can be inferred from the farmers' shift to short-maturing, drought-tolerant rice varieties?
    choices:
      - text: Farmers adapted crops to withstand longer dry spells.
        correct: true
      - text: Traditional wet-season rice varieties became completely extinct across Isabela.
        rationale: |
          You inferred total extinction. The passage describes farmers switching crops on farm plots, not total species extinction.
      - text: Municipal authorities banned the use of monsoonal rainfall for crop irrigation.
        rationale: |
          You inferred an official ban not mentioned in the text. The farmers changed seed varieties voluntarily to adapt to weather.
      - text: Farmers stopped growing rice to focus exclusively on commercial solar power generation.
        rationale: |
          You inferred a complete change of business. Solar pumps were installed to irrigate rice fields, not to sell solar electricity.
    explanation: |
      The passage notes that dry spells during growing months had doubled in duration, so shifting to drought-tolerant, short-maturing rice directly reflects an adaptation to these longer dry periods.

  - id: rc-cs-ic-0002
    passage: rc-cs-ic-p1
    type: infer
    difficulty: medium
    stem: |
      What does the purchase of communal crop insurance policies suggest about the farm cooperatives?
    choices:
      - text: Cooperatives sought protection against weather crop losses.
        correct: true
      - text: Insurance companies mandated that all Isabela farmers stop using tube wells.
        rationale: |
          You picked a false mandate. Farmers dug tube wells and bought insurance as complementary risk management strategies.
      - text: The farmers expected their crop yields to double within the next growing year.
        rationale: |
          You inferred rapid yield growth. Insurance is purchased for risk protection against loss, not to double crop yields.
      - text: Government regulations required all agricultural extension workers to sell insurance.
        rationale: |
          You inferred an unsupported administrative regulation. Cooperatives bought policies to protect their financial investment.
    explanation: |
      Purchasing crop insurance for the first time in thirty years alongside purchasing pumps and drought-tolerant seeds indicates that cooperatives sought financial safeguards against crop failure risks.

  - id: rc-cs-ic-0003
    passage: rc-cs-ic-p1
    type: infer
    difficulty: medium
    stem: |
      The passage suggests that total annual precipitation figures alone can be misleading because:
    choices:
      - text: Rainfall distribution can shift while volume stays constant.
        correct: true
      - text: Municipal records always undercount total annual rainfall in rural areas.
        rationale: |
          You inferred record inaccuracy. The passage explicitly states that rainfall volume was constant, but dry spells doubled.
      - text: Solar-powered pumps increase the total amount of rain falling on crops.
        rationale: |
          You picked an absurd physical claim. Solar pumps move groundwater; they do not alter atmospheric rainfall amounts.
      - text: Short-maturing rice requires twice as much annual rainfall as traditional rice.
        rationale: |
          You picked a claim that contradicts the passage. Short-maturing hybrid rice is drought-tolerant, requiring less water time.
    explanation: |
      The text notes that total annual precipitation remained constant, but dry spells during growing months doubled, showing that rainfall distribution across months changed significantly.

  - id: rc-cs-ic-0004
    passage: rc-cs-ic-p1
    type: infer
    difficulty: hard
    stem: |
      Which inference about the farmers' attitude toward technological innovation is best supported by the text?
    choices:
      - text: They invested in tools when risks threatened yields.
        correct: true
      - text: They rejected modern technology until forced by municipal legislation.
        rationale: |
          You inferred legislative coercion. The passage shows farmers voluntarily adopted pumps and hybrid seeds to protect crops.
      - text: They preferred manual water fetching over solar-powered pumps.
        rationale: |
          You inferred an attitude opposite to their actions. Farmers installed solar pumps to irrigate fields efficiently.
      - text: They distrusted hybrid seeds because of high purchase costs.
        rationale: |
          You inferred distrust that contradicts the text. Farmers rapidly substituted traditional varieties with drought-tolerant hybrids.
    explanation: |
      The rapid adoption of tube wells, solar pumps, and hybrid seeds within two years demonstrates their willingness to adopt technological innovations when environmental risks threatened their livelihoods.

  - id: rc-cs-ic-0005
    passage: rc-cs-ic-p1
    type: analyze
    difficulty: hard
    stem: |
      What is the primary purpose of comparing field observations from 2021 and 2023?
    choices:
      - text: To highlight rapid agricultural adaptations over two years.
        correct: true
      - text: To prove that Isabela experienced its highest annual rainfall in 2021.
        rationale: |
          You picked a detail about rainfall levels not supported by the text. Annual rainfall remained constant between visits.
      - text: To criticize Ramon Gomez for visiting fields only once every three years.
        rationale: |
          You inferred criticism of the extension worker. His observations documented changes across three consecutive years.
      - text: To argue that traditional farming methods are superior to modern technology.
        rationale: |
          You picked a conclusion opposite to the passage theme, which highlights successful technology adoption.
    explanation: |
      Comparing 2021 and 2023 demonstrates the contrast between traditional practices and the recent rapid technological and operational adaptations.

  - id: rc-cs-ic-0006
    passage: rc-cs-ic-p2
    type: infer
    difficulty: easy
    stem: |
      What can be inferred from the discovery of clay net sinkers and carbonized rice at the site?
    choices:
      - text: The inhabitants engaged in both fishing and grain agriculture for sustenance.
        correct: true
      - text: The settlement depended entirely on imported food from neighboring islands.
        rationale: |
          You inferred total trade dependence. Local net sinkers and carbonized rice demonstrate local fishing and farming.
      - text: The inhabitants used net sinkers to crush rice grains into flour.
        rationale: |
          You misidentified tool function. Net sinkers are weights for fishing nets, while pestles or mortars crush grain.
      - text: The community suffered from chronic food shortages throughout the tenth century.
        rationale: |
          You inferred chronic famine. The presence of food remains (rice and fish gear) indicates active subsistence strategies.
    explanation: |
      Net sinkers indicate fishing activity, while carbonized rice indicates grain consumption/agriculture, showing that the community relied on both subsistence activities.

  - id: rc-cs-ic-0007
    passage: rc-cs-ic-p2
    type: infer
    difficulty: medium
    stem: |
      The concentration of lead-alloy tokens near the ancient riverbank edge suggests that:
    choices:
      - text: Trade transactions took place primarily along the river waterway.
        correct: true
      - text: Lead tokens were accidentally dropped during fishpond construction.
        rationale: |
          You introduced modern fishponds into an ancient tenth-century site context where they were not mentioned.
      - text: The ancient riverbank was used exclusively as a burial ground.
        rationale: |
          You inferred a burial site. The text connects tokens near the riverbank to riverine trade and economic activity.
      - text: Inhabitants melted metallic tokens to build river boats.
        rationale: |
          You inferred boat building from trade tokens. Non-local metallic tokens point to trade exchanges along the river edge.
    explanation: |
      Recovering non-local metallic tokens exclusively near the river edge suggests that river-based trade and commercial exchanges occurred along the water's edge.

  - id: rc-cs-ic-0008
    passage: rc-cs-ic-p2
    type: infer
    difficulty: medium
    stem: |
      What does the presence of post-hole impressions near orderly earthenware jars imply?
    choices:
      - text: The site featured permanent residential or storage structures.
        correct: true
      - text: The jars fell from passing modern river barges.
        rationale: |
          You introduced modern barges into an ancient archaeological stratum dating between the tenth and twelfth centuries.
      - text: The settlement was destroyed by a major earthquake in the twelfth century.
        rationale: |
          You inferred an unmentioned catastrophe. Post-hole impressions and arranged jars indicate orderly structure, not destruction.
      - text: Ancient residents lived exclusively in natural limestone caves.
        rationale: |
          You inferred cave living, which contradicts the physical post-hole evidence of built ground structures.
    explanation: |
      Orderly rows of storage jars alongside post-hole impressions imply built wooden or bamboo structures used for living or storage.

  - id: rc-cs-ic-0009
    passage: rc-cs-ic-p2
    type: infer
    difficulty: hard
    stem: |
      Why did archaeologists rely on radiometric testing of carbonized rice?
    choices:
      - text: To establish an absolute timeframe for the settlement layer.
        correct: true
      - text: To determine whether the rice was imported from external trade partners.
        rationale: |
          You misidentified the purpose of radiometric dating. Radiometric carbon testing determines age, not trade origin.
      - text: To clean the basalt adzes discovered in the lower soil layer.
        rationale: |
          You confused dating methods with artifact cleaning procedures. Radiometric testing dates organic material like rice.
      - text: To locate written records buried beneath the riverbank.
        rationale: |
          You picked an unmentioned goal. The passage explicitly notes that no written records survived from the settlement.
    explanation: |
      The text notes that radiometric testing established that the site was occupied between the tenth and twelfth centuries, providing an accurate timeframe in the absence of written records.

  - id: rc-cs-ic-0010
    passage: rc-cs-ic-p2
    type: analyze
    difficulty: hard
    stem: |
      Which conclusion about the ancient Cagayan inhabitants is best supported by the artifact evidence?
    choices:
      - text: They maintained a settled community in riverine trade networks.
        correct: true
      - text: They lived as nomadic hunter-gatherers who avoided river systems.
        rationale: |
          You picked a conclusion that contradicts the evidence of post-hole structures, rice farming, and riverbank trade tokens.
      - text: They possessed advanced written alphabets recorded on clay tablets.
        rationale: |
          You picked a claim that contradicts the text statement that no written records survived from the settlement.
      - text: They focused exclusively on metal mining to the exclusion of agriculture.
        rationale: |
          You inferred exclusive mining, ignoring the carbonized rice and clay net sinkers showing farming and fishing.
    explanation: |
      The combination of rice, permanent post-holes, fishing gear, and non-local trade tokens supports the conclusion of a settled riverine trading community.

  - id: rc-cs-ic-0011
    passage: rc-cs-ic-p3
    type: infer
    difficulty: easy
    stem: |
      What can be inferred about the primary cause of erratic driving prior to the policy changes?
    choices:
      - text: Driver fatigue from long hours without breaks to maximize pay.
        correct: true
      - text: Mechanical failures caused by defective engine manufacturing.
        rationale: |
          You inferred mechanical manufacturing defects. Paragraph 3 connects erratic driving directly to fatigue and commission pressure.
      - text: Lack of passenger interest in provincial bus transportation.
        rationale: |
          You inferred low passenger interest, which does not explain driver behavior or fatigue on long-haul routes.
      - text: Strict speed limit regulations imposed by municipal traffic police.
        rationale: |
          You inferred police speed regulation as a cause of bad driving. Limiters were installed later by the transit company.
    explanation: |
      The text connects skipping meal breaks and driving over four hours to maximize commissions with previous erratic driving, showing fatigue under commission incentives was the cause.

  - id: rc-cs-ic-0012
    passage: rc-cs-ic-p3
    type: infer
    difficulty: medium
    stem: |
      Why did replacing daily commissions with fixed monthly salaries help reduce complaints?
    choices:
      - text: It removed financial pressure to rush trips recklessly for pay.
        correct: true
      - text: It forced drivers to buy their own digital logging badges.
        rationale: |
          You inferred driver equipment purchases. Salaries reduced complaints by removing the financial incentive to rush.
      - text: It allowed drivers to set their own speed limits above eighty kilometers per hour.
        rationale: |
          You picked a claim opposite to the text. Speed limiters were calibrated to capped maximum speeds.
      - text: It reduced the total number of buses operating between Manila and Ilocos.
        rationale: |
          You inferred fleet reduction. The safety improvements came from changing driver incentives and resting schedules.
    explanation: |
      Under commission pay, drivers rushed and skipped breaks to earn more; fixed salaries removed the financial incentive to drive dangerously fast or tired.

  - id: rc-cs-ic-0013
    passage: rc-cs-ic-p3
    type: infer
    difficulty: medium
    stem: |
      What does the stabilization of driver turnover rates suggest about the drivers' response to the reforms?
    choices:
      - text: Drivers appreciated predictable earnings and rest periods.
        correct: true
      - text: Drivers preferred working without electronic badges or speed limiters.
        rationale: |
          You inferred dissatisfaction with safety tech. Stabilized turnover rates show drivers chose to stay with the company.
      - text: Most drivers resigned to join un-regulated city bus lines.
        rationale: |
          You picked a claim that contradicts stabilized turnover. Lower turnover means fewer drivers resigned.
      - text: The company replaced all human drivers with automated steering systems.
        rationale: |
          You inferred autonomous buses. Human drivers continued driving under mandatory logging and fixed salaries.
    explanation: |
      Stabilized turnover rates indicate that drivers stayed with the company, benefiting from fixed pay and enforced rest breaks despite mandatory speed limiters.

  - id: rc-cs-ic-0014
    passage: rc-cs-ic-p3
    type: infer
    difficulty: hard
    stem: |
      The digital logging system's automatic ignition lock mechanism was designed primarily to enforce:
    choices:
      - text: Compliance with rest periods after four hours of driving.
        correct: true
      - text: Complete adherence to the eighty-kilometer-per-hour speed limit.
        rationale: |
          You confused the ignition lock with speed limiters. Ignition locks engaged when driving exceeded four hours without rest.
      - text: Timely collection of cash passenger fares at designated checkpoints.
        rationale: |
          You inferred fare collection. Checkpoints verified driver identity and driving hours via electronic badge.
      - text: Daily engine maintenance checks at terminal garages.
        rationale: |
          You inferred garage maintenance. The logging system tracked active driving hours to mandate thirty-minute rest breaks.
    explanation: |
      The text directly links the ignition lock to exceeding four continuous hours of driving without taking a mandatory thirty-minute break.

  - id: rc-cs-ic-0015
    passage: rc-cs-ic-p3
    type: analyze
    difficulty: hard
    stem: |
      Which statement summarizes the central lesson of the bus company's management experience?
    choices:
      - text: Aligning incentives with safety enforcement improves outcomes.
        correct: true
      - text: Daily trip commissions are essential for maintaining high driver morale.
        rationale: |
          You picked a statement that contradicts the passage. Replacing trip commissions with fixed pay improved outcomes.
      - text: Passenger complaints cannot be reduced without increasing ticket prices.
        rationale: |
          You introduced ticket price increases not mentioned in the text. Complaints dropped due to safety and pay reforms.
      - text: Speed limiters should be turned off during long-haul night trips.
        rationale: |
          You picked a claim that undermines safety rules. Speed limiters were calibrated to enforce eighty km/h caps continuously.
    explanation: |
      Combining structural compensation changes (fixed salary) with automated safety enforcement (limiters, digital badges) successfully improved safety and driver retention.
