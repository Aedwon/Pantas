    stem: |
      Which statement is the conclusion that the officer seeks to support?
    choices:
      - text: "The department should replace its paper slips."
        correct: true
      - text: "Staff currently type information from paper slips into a register."
        rationale: |
          This selects a reason for the proposal. It describes the current problem. Look for the action the officer asks the department to take.
      - text: "The proposed online form would put entries directly into the register."
        rationale: |
          This selects a premise about the proposed tool. It explains how the change could help. Find the recommendation supported by that premise.
      - text: "Every department should remove all paper from every records process."
        rationale: |
          This expands the proposal beyond its scope. Replacing slips sounds broad. Check that the officer refers only to those slips and that repeated typing.
