passages:
  - id: "rc-cs-nsd-p1"
    title: "A Fictional Bridge Project"
    body: |
      In this fictional project account, the Bay Link Bridge opens for commercial operation in April 2022. Construction began in March 2018. The 8.9-kilometer route connects a city with an island municipality and is designed for up to fifty thousand vehicles daily. Its main towers rise 145 meters above sea level, while a separate approach span is 200 meters long.
      
      Engineer Elena Cruz designs the approach roads, and Engineer Ramon Vega supervises their construction. Manuel Santos serves as chief structural inspector during the final bridge phase. Rosa Santos prepares the final expenditure report. Their duties differ even though they work on the same project.
      
      Operators introduce electronic toll tags in July 2022 and complete the planned phaseout of cash booths in December 2022. The initial cost estimate is twenty-six billion pesos; the final investment is thirty-three billion pesos. A separate maintenance proposal, not part of construction, lists fourteen billion pesos over a much longer period. The account distinguishes the project's dates, dimensions, roles, and costs so readers can locate each detail accurately.
  - id: "rc-cs-nsd-p2"
    title: "A Fictional Festival Schedule"
    body: |
      This fictional town account describes the Harbor Festival, a celebration held in honor of Saint Clement. The old parade took place on November 23. In 2010, organizers expanded it into two weeks of cultural activities beginning in mid-November. The main procession still takes place on November 23, while a separate lantern exhibition opens on October 31 and closes on December 1.
      
      Artists originally made giant parade figures using bamboo frames and heads of paper-mache formed from recycled newspapers. In 1998, the guild introduced lightweight aluminum frames and fiberglass resin heads. Carved wooden figures remain in a museum display, but they are not the giant figures used in this account's procession.
      
      Each barangay contributes at least two giants. In the fictional 2023 report, fifty-six giants appear in the procession, and forty thousand visitors watch along a three-kilometer route. A separate five-kilometer charity walk takes place the following day. Organizers record these events separately so the parade totals are not confused with other activities.
  - id: "rc-cs-nsd-p3"
    title: "A Fictional Coffee Cooperative"
    body: |
      In this fictional account, founded in 2014 with just fourteen founding members, the Mountain Arabica Coffee Cooperative has grown to include over two hundred smallholder farmers in a mountain municipality. The cooperative specializes in growing high-altitude Arabica coffee beans cultivated at elevations between 1,200 and 1,600 meters above sea level, where cool temperatures allow coffee cherries to mature slowly.
      
      Harvesting takes place exclusively between November and February, when farm workers hand-pick only fully ripened red cherries. In 2021, the cooperative established a centralized wet-milling facility funded by a three-million-peso agricultural grant. Before this facility was built, individual farmers processed cherries at home using manual hand-cranked pulpers, resulting in inconsistent bean quality.
      
      The introduction of centralized moisture testing and raised drying beds boosted the cooperative's specialty coffee rating to eighty-six points on the international coffee scale. Consequently, farmgate prices for green coffee beans rose from two hundred pesos per kilogram in 2019 to five hundred fifty pesos per kilogram by 2023.
  - id: "p-comprehension-skills-noting-specific-details-0004"
    title: "The Archive Notice"
    body: |
      The school archive will move to the east wing on Monday, October 12. Until the move, visitors may use the old reading room beside the library. After the move, the archive entrance will be opposite the science office. The library itself will remain in its current location. Staff ask visitors to check the signs because the two rooms share similar names.
      
      Requests for photographs must reach Ms. Dela Cruz by Friday, October 9. Requests for written records go to Mr. Lim, who accepts them until Monday morning. Ms. Dela Cruz prepares the digital photo files; Mr. Lim checks the written records before releasing copies. Neither deadline changes the date of the move.
      
      The archive will open at nine in the morning on weekdays and close at four in the afternoon. Its former opening time was eight. A student orientation begins at ten on the first day in the east wing. Students attending it should use the new archive entrance, while regular library users should follow the existing library signs.
questions:
  - id: "rc-cs-nsd-0001"
    passage: "rc-cs-nsd-p1"
    type: "noting-specific-details"
    difficulty: "easy"
    stem: |
      In what month and year does the Bay Link Bridge open for commercial operation?
    choices:
      - text: "April 2022"
        correct: true
      - text: "July 2022"
        rationale: |
          This selects the toll-tag introduction. Both occur in the same year. Check which date is linked to opening.
      - text: "December 2022"
        rationale: |
          This selects the end of the cash-booth phaseout. It is an operating milestone. Check the first date for commercial operation.
      - text: "March 2018"
        rationale: |
          This selects the start of construction. It begins the project timeline. Check whether the question asks about building or opening.
    explanation: |
      The opening sentence states that commercial operation begins in April 2022.
  - id: "rc-cs-nsd-0002"
    passage: "rc-cs-nsd-p1"
    type: "noting-specific-details"
    difficulty: "easy"
    stem: |
      What final construction investment does the bridge account report?
    choices:
      - text: "33 billion pesos"
        correct: true
      - text: "Twenty-six billion pesos"
        rationale: |
          This selects the initial estimate. It is also a construction figure. Check the word final.
      - text: "Fourteen billion pesos"
        rationale: |
          This selects the separate maintenance proposal. Both are large costs. Check which one belongs to construction.
      - text: "Seven billion pesos"
        rationale: |
          This gives the difference between estimate and final cost. Subtracting the two figures yields seven. Check that the question asks for the total, not the increase.
    explanation: |
      The final paragraph identifies thirty-three billion pesos as the final investment.
