      - text: "200 meters"
        rationale: |
          This selects the approach span length. Both are measured in meters. Check whether the number describes height or length.
      - text: "8.9 meters"
        rationale: |
          This transfers the route length into tower height and changes its unit. The route is 8.9 kilometers. Check the measured feature and unit.
      - text: "50 meters"
        rationale: |
          This borrows the leading number from vehicle capacity. Fifty thousand describes traffic. Check that the answer measures height.
    explanation: |
      The first paragraph states that the main towers rise 145 meters above sea level.
