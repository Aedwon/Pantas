# suggestedMinutes is required by the section parser but is read only when an
# exam is timed part by part (sectionalTiming: sectional). This paper is one
# booklet with one clock, so no student sees it. It repeats the whole-paper
# minutes rather than inventing a per-section figure.
_id: mock_blueprint_cse_pro
schemaVersion: 2
isActive: true
exam: exam_cse_pro
name: CSE Professional (Pantas practice exam, not the official format)
durationMinutes: 190
sectionalTiming: roamable
unscoredItems: 20
source: reported
sourceNote: 'CSC Examination Advisory No. 19, s. 2026, page 7, lists 150 Test
  Proper items, 20 Examinee Descriptive Questionnaire items, and 190 minutes
  for the Professional Test Proper. Pantas uses a practice allocation of 20
  General Information, 55 Verbal Ability, 35 Analytical Ability, and 40 Numerical
  Ability questions. The CSC advisory does not give section counts. The first
  three follow the recollection of an examinee who sat the Professional level,
  relayed by Aedwon on 19 October 2026 (20, 55, 35 and 45 Numerical Ability);
  Numerical Ability is cut to 40 so the total matches the advisory (lead ruling,
  24 November 2026). No totalPublishedItems: the mock setup screen shows that
  field as the paper size (Aedwon, 19 October 2026). It is one booklet with one
  clock, no sectional timing. The topic weights within each section are an even
  split chosen here, not a published composition, except Numerical Ability:
  0.6 arithmetic and 0.4 algebra, because the bank holds only 20 CSE algebra
  questions and an even split asks for 23. They are a sampling
  parameter and are never printed to a student.'
sections:
  - id: sec_cse_pro_general_information
    name: General Information
    questionCount: 20
    suggestedMinutes: 190
    topicIds:
      - topic_cse_pro_philippine_constitution
      - topic_cse_pro_code_of_conduct_ra_6713
      - topic_cse_pro_peace_and_human_rights
      - topic_cse_pro_environment_management
    topicWeights:
