_id: mock_blueprint_ustet
schemaVersion: 2
isActive: true
exam: exam_ustet
name: 'USTET (Pantas practice exam, not the official format)'
durationMinutes: 165
sectionalTiming: sectional
source: reported
sourceNote: >-
  Pantas practice exam, not the official format.
  UST publishes the four college subtest names in its admissions FAQ:
  https://ustet.ust.edu.ph/.
  Reported counts from prepPH are Mental Ability 80, English 80, Mathematics 60,
  and Science 80, for 300 questions: https://prepph.com/blog/ustet-coverage.
  EdgePrep reports separate timers of 30, 45, 45, and 45 minutes, respectively,
  which add up to 165 minutes of test time in this practice paper. It gives a different
  count for English (45), so the reports disagree on that size.
  https://edgeprep.ph/ustet-exam-guide.
  Topic weights are Pantas-set. Mental Ability draws 20 spatial and abstract
  reasoning questions from a pool of 22. English draws 1 comprehension
  question from a single-question passage. Larger draws can come up short
  with mixed-size passage groups.
