source: reported
sourceNote: >-
  Pantas practice exam, not the official format.
  DLSU's admissions page confirms the test but gives no section counts or times:
  https://old.dlsu.edu.ph/admissions/undergraduate/freshmen-procedures/.
  A firsthand report on the 2019 DCAT gives these sections and figures
  (questions/minutes): Mental Ability 40/40, Reading Comprehension 25/30,
  Writing Skills 40/30, General Mathematics 45/50, Statistics and Probability
  45/50, Science Proficiency 50/30.
  https://www.chinoy.tv/chinoytips-for-college-entrance-tests/.
  More recent coverage reports Reading Comprehension and Statistics:
  https://prepph.com/blog/dcat-coverage. EdgePrep groups them under English and
  Mathematics and reports a different total time: https://edgeprep.ph/dcat-exam-guide.
  Pantas-set Reading Comprehension is scaled to 15 questions and 18 minutes.
  It draws 1 comprehension question from a single-question passage and 14
  vocabulary questions. The approved text-types pool has one question, and larger
  comprehension draws can come up short with mixed-size passage groups.
  The Pantas-set paper totals 235 questions and 218 minutes. Topic weights
  are Pantas-set. Writing Skills uses multiple-choice questions.
