# suggestedMinutes is required by the section parser but is read only when an
# exam is timed part by part (sectionalTiming: sectional). This paper is one
# booklet with one clock, so no student sees it. It repeats the whole-paper
# minutes rather than inventing a per-section figure.
_id: mock_blueprint_cse_sub
schemaVersion: 2
isActive: true
exam: exam_cse_sub
name: CSE Subprofessional (Pantas practice exam, not the official format)
durationMinutes: 160
sectionalTiming: roamable
unscoredItems: 20
source: reported
sourceNote: 'CSC Examination Advisory No. 10, s. 2026 (School Assignment and
  Important Reminders for the 09 August 2026 CSE-PPT), page 7, lists 145 Test
  Proper items, 20 Examinee Descriptive Questionnaire items, and a time limit
  of 2 hours 40 minutes (160 minutes) for the Subprofessional level. No
  totalPublishedItems: the mock setup screen shows that field as the paper
  size and would report the test items as a shortfall; Aedwon chose to show
  the test items only (October 19, 2026). The advisory lists the four areas
  but gives no per-area item counts, so the setup screen prints none. The
  split of 36 Verbal, 36 Numerical, 36 Clerical and 37 General Information is
  an even division chosen here as a sampling parameter, never printed to a
  student. The topic weights within each section are also an even split chosen
  here, except Verbal Ability. Verbal Ability assigns 5 of 36 questions to
  comprehension skills so five-question passage groups fit exactly. The other
  Verbal topics share the remaining 31 questions in their current proportions.
  The CSC publishes no topic weights. These weights are a sampling parameter
  never printed to a student. One booklet, no sectional timing.'
sections:
  - id: sec_cse_sub_verbal_ability
    name: Verbal Ability
    questionCount: 36
    suggestedMinutes: 160
    topicIds:
      - topic_cse_sub_vocabulary
      - topic_cse_sub_grammar_and_structure
      - topic_cse_sub_language_application
      - topic_cse_sub_comprehension_skills
    topicWeights:
      # Comprehension gets 5/36; the other topics share 31/36 in their current proportions.
      topic_cse_sub_vocabulary: 0.28703703703703703
      topic_cse_sub_grammar_and_structure: 0.28703703703703703
      topic_cse_sub_language_application: 0.28703703703703703
      topic_cse_sub_comprehension_skills: 0.1388888888888889
  - id: sec_cse_sub_numerical_ability
    name: Numerical Ability
    questionCount: 36
    suggestedMinutes: 160
    topicIds:
      - topic_cse_sub_arithmetic_number_sense
      - topic_cse_sub_algebra
    topicWeights:
      topic_cse_sub_arithmetic_number_sense: 0.5
      topic_cse_sub_algebra: 0.5
  - id: sec_cse_sub_clerical_ability
    name: Clerical Ability
    questionCount: 36
    suggestedMinutes: 160
    topicIds:
      - topic_cse_sub_clerical_ability
    topicWeights:
      topic_cse_sub_clerical_ability: 1
  - id: sec_cse_sub_general_information
