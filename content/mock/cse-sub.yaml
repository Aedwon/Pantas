# suggestedMinutes is required by the section parser but is read only when an
# exam is timed part by part (sectionalTiming: sectional). This paper is one
# booklet with one clock, so no student sees it. It repeats the whole-paper
# minutes rather than inventing a per-section figure.
_id: mock_blueprint_cse_sub
schemaVersion: 2
isActive: true
exam: exam_cse_sub
name: CSE Subprofessional Practice Paper
durationMinutes: 160
sectionalTiming: roamable
source: reported
sourceNote: 'No totalPublishedItems: the mock setup screen shows that
  field as the paper size and would report the test items as a shortfall;
  Aedwon chose to show the test items only (October 19, 2026). Placeholder split. Total of 145 test items comes from a 2020 CSC
  advisory (150 test items plus 20 descriptive questionnaire items for the
  Professional level, 145 plus 20 for the Subprofessional level); whether that
  still holds is unconfirmed. The 165 items for the whole paper (145 plus 20)
  and the time of 2 hours 40 minutes (160) are as relayed in reports by the PIA
  and by CSC-relaying outlets. The Civil Service Commission publishes no
  per-area item counts: the split of 36 Verbal, 36 Numerical, 36 Clerical and
  37 General Information is an even division chosen here until a taker of this
  level supplies the real counts. The topic weights within each section are
  also an even split chosen here, a sampling parameter never printed to a
  student. One booklet, no sectional timing.'
sections:
  - id: sec_cse_sub_verbal_ability
    name: Verbal Ability
    questionCount: 36
    suggestedMinutes: 160
    topicIds:
