name: CI

# Standard hosted runners are free for this public repository, so the full
# checks run here and focused tests stay local. Logs are public: use test data
# and no secrets. Decision: docs/superpowers/decisions/2026-10-19-pwa-launch-log.md.
on:
  pull_request:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']
  push:
    # Staging only fast-forwards to a commit that already ran here.
    branches: [main, 'web/**', '!web/staging-candidate-r1']
    paths-ignore: ['docs/**', '**.md']

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-app

      - name: dart format check
        # lib and test only, which is what the repo formats. Generated
        # files now exist by this point and they are not ours to format.
        run: dart format --output=none --set-exit-if-changed lib test

      - name: dart analyze
        run: flutter analyze

      - name: Layering check
        run: dart run tool/check_layering.dart

      - name: AI-attribution check
        run: dart run tool/check_no_ai_attribution.dart

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config-path: .gitleaks.toml

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
        with:
          # The release runner tests read an older commit's files.
          fetch-depth: 0

      - uses: ./.github/actions/setup-app

      - name: Unit + widget tests
        run: flutter test --coverage --total-shards 6 --shard-index ${{ matrix.shard }}

      - uses: actions/upload-artifact@v4
        with:
          name: lcov-${{ matrix.shard }}
          path: coverage/lcov.info
          retention-days: 1

  coverage:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.6'
          cache: true

      - run: flutter pub get

      - uses: actions/download-artifact@v4
        with:
          pattern: lcov-*
          path: shards

      - name: Merge the shards
        # A file can appear in several shards. The gate counts every DA line,
        # so each line must appear once, with its hits summed.
        run: |
          mkdir -p coverage
          cat shards/*/lcov.info | awk -F'[:,]' '
            /^SF:/ { file = substr($0, 4); files[file] = 1; next }
            /^DA:/ {
              if (!((file, $2) in hits)) lines[file] = lines[file] " " $2
              hits[file, $2] += $3
            }
            END {
              for (file in files) {
                print "SF:" file
                count = split(lines[file], numbers, " ")
                for (i = 1; i <= count; i++) print "DA:" numbers[i] "," hits[file, numbers[i]]
                print "end_of_record"
              }
            }' > coverage/lcov.info

      - name: Coverage gate (overall >= 70%)
        run: dart run tool/check_coverage.dart --min 70 --write-filtered coverage/lcov.filtered.info

  functions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - run: npm ci --no-audit --no-fund
        working-directory: functions

      - name: Backend and emulator tests
        run: npm test
        working-directory: functions

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-app

      - name: Release web build
        run: flutter build web --release --no-web-resources-cdn -t lib/main_dev.dart

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-app

      - name: Write a placeholder Firebase config
        # The real file is never tracked. This one only lets the debug build compile.
        run: |
          cat > android/app/src/dev/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "ci-placeholder",
              "storage_bucket": "ci-placeholder.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                "android_client_info": { "package_name": "com.aedwon.pantas.dev" }
              },
              "api_key": [{ "current_key": "ci-placeholder" }]
            }],
            "configuration_version": "1"
          }
          JSON

      - name: Build dev APK (debug, unsigned)
        run: flutter build apk --debug --flavor dev -t lib/main_dev.dart

  sast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/owasp-top-ten
            p/security-audit
            p/dart
            p/flutter
            p/secrets

  osv:
    # Reports known vulnerabilities without blocking: dependency updates are
    # their own decision, and an always-red run hides real failures.
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: google/osv-scanner-action/osv-scanner-action@v2.7.0
        with:
          scan-args: |-
            --recursive
            ./
