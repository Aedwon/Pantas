name: S3 probe
# Temporary: measures whether build/test_cache saves time on a cold shard. Removed after the measurement.
on:
  push:
    branches: ['web/ci-speed-r1']
    paths: ['.github/workflows/s3-probe.yml']
permissions:
  contents: read
jobs:
  cold:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-app
      - name: Shard 0, no test cache
        run: |
          dart tool/ci/shard_tests.dart --shard 0 --shards 8 > shard-files.txt
          mapfile -t files < shard-files.txt
          start=$(date +%s)
          flutter test --coverage "${files[@]}" > /dev/null 2>&1 || true
          echo "cold shard seconds: $(( $(date +%s) - start ))"
          ls build; du -sh build/test_cache build/unit_test_assets .dart_tool/flutter_build 2>&1 | head
          find build -maxdepth 2 -type d | head -20
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build/test_cache
          key: probe-test-cache-${{ github.run_id }}
  warm:
    needs: [cold]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-app
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build/test_cache
          key: probe-test-cache-${{ github.run_id }}
      - name: Shard 0, restored test cache
        run: |
          du -sh build/test_cache 2>&1
          dart tool/ci/shard_tests.dart --shard 0 --shards 8 > shard-files.txt
          mapfile -t files < shard-files.txt
          start=$(date +%s)
          flutter test --coverage "${files[@]}" > /dev/null 2>&1 || true
          echo "warm shard seconds: $(( $(date +%s) - start ))"
