name: S7 probe
# Temporary: times each backend emulator test file. Removed after the measurement.
on:
  push:
    branches: ['web/ci-speed-r1']
    paths: ['.github/workflows/s7-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: functions
      - name: Time every emulator file
        working-directory: functions
        run: |
          npm run build
          cat > /tmp/each.sh <<'SH'
          for f in test/*.rules.mjs test/*.emulator.mjs; do
            s=$(date +%s.%N)
            node --test "$f" > /dev/null 2>&1 || echo "FAILED $f"
            e=$(date +%s.%N)
            echo "TIMING $f $(echo "$e - $s" | bc)"
          done
          SH
          npx firebase emulators:exec --only auth,firestore,storage --project demo-pantas-test "bash /tmp/each.sh"
