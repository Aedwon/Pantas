name: OSV report

# Reports known vulnerabilities without blocking: dependency updates are their
# own decision. Moved out of the per-push CI to cut the job count (CI speed
# plan S2): it runs weekly, and when a lock file changes.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'
  push:
    branches: [main, 'web/**', '!web/staging-candidate-r1']
    paths: ['pubspec.lock', 'functions/package-lock.json']

permissions:
  contents: read

jobs:
  osv:
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: google/osv-scanner-action/osv-scanner-action@v2.7.0
        with:
          scan-args: |-
            --recursive
            ./
