name: CI (main)

# Manual only (Nov 11). ci.yml runs every check this job runs (analyze,
# layering, attribution, tests with coverage, backend tests, the dev APK) on
# main and web/** with Flutter 3.44.6. jobs.ci stays as it is, because the
# native release runner (tools/release/e2e) and its tests pin it.
on:
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.x'

      - run: flutter pub get
      - name: Generate code
        run: |
          dart run build_runner build --delete-conflicting-outputs
          flutter gen-l10n

      - name: Build the content asset
        # Gitignored and built, never committed. Without it `flutter
        # analyze` warns that a declared asset is missing and exits 1, and
        # the bundled-database test has nothing to open. Built from the corpus.
        run: |
          mkdir -p build
          dart run tools/build_content_export/build_content_export.dart build/export.json --assets-out assets/seed
          dart run tools/build_content_seed/seed_writer.dart \
            build/export.json \
            assets/seed/content.db

      - run: flutter analyze
      - run: dart run tool/check_layering.dart
      - run: dart run tool/check_no_ai_attribution.dart
      - run: flutter test --coverage
      - run: npm test
        working-directory: functions

      - name: Build dev APK (debug, unsigned)
        run: flutter build apk --debug --flavor dev -t lib/main_dev.dart
