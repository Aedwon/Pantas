name: CI (main)

on:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.x'

      - run: flutter pub get
      - name: Generate code
        run: |
          dart run build_runner build --delete-conflicting-outputs
          flutter gen-l10n

      - name: Build the content asset
        # Gitignored and built, never committed. Without it `flutter
        # analyze` warns that a declared asset is missing and exits 1, and
        # the bundled-database test has nothing to open. Built from the corpus.
        run: |
          mkdir -p build
          dart run tools/build_content_export/build_content_export.dart build/export.json
          dart run tools/build_content_seed/seed_writer.dart \
            build/export.json \
            assets/seed/content.db

      - run: flutter analyze
      - run: dart run tool/check_layering.dart
      - run: dart run tool/check_no_ai_attribution.dart
      - run: flutter test --coverage
      - run: npm test
        working-directory: functions

      - name: Build dev APK (debug, unsigned)
        run: flutter build apk --debug --flavor dev -t lib/main_dev.dart

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-dev-debug
          path: build/app/outputs/flutter-apk/app-dev-debug.apk
          retention-days: 14

  integration:
    runs-on: macos-13
    timeout-minutes: 30
    needs: ci
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.x'
      - run: flutter pub get
      - name: Generate code
        run: |
          dart run build_runner build --delete-conflicting-outputs
          flutter gen-l10n

      - name: Set up iOS simulator
        run: |
          xcrun simctl list devices
          xcrun simctl boot "iPhone 15" || true

      - name: Run integration tests
        run: |
          if ls integration_test/*_test.dart 2>/dev/null; then
            flutter test integration_test
          else
            echo "no integration tests yet — skipping"
          fi
