name: Wave 8 audit gates red test

on:
  pull_request:
    branches: [main]

jobs:
  focused-red:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.x'
      - run: flutter pub get
      - name: Create uncommitted declared asset placeholder
        run: |
          mkdir -p assets/seed
          : > assets/seed/content.db
      - name: Required focused test against old checker
        run: flutter test test/tools/check_lesson_illustrations_test.dart
