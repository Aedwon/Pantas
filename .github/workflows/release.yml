name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.x'
      - run: flutter pub get
      - name: Generate bundled content seed
        env:
          SANITY_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID }}
          SANITY_DATASET: ${{ secrets.SANITY_DATASET }}
          SANITY_READ_TOKEN: ${{ secrets.SANITY_READ_TOKEN }}
        run: |
          npm ci --prefix tools/build_content_seed
          mkdir -p build assets/seed
          node tools/build_content_seed/build.mjs > build/seed_data.json
          dart run tools/build_content_seed/seed_writer.dart build/seed_data.json assets/seed/content.db
      - name: Build Android App Bundle (prod, unsigned)
        run: flutter build appbundle --release --flavor prod -t lib/main_prod.dart
      - uses: actions/upload-artifact@v4
        with:
          name: app-prod-release-aab-${{ github.ref_name }}
          path: build/app/outputs/bundle/prodRelease/app-prod-release.aab
          retention-days: 90

  build-ios:
    runs-on: macos-13
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.x'
      - run: flutter pub get
      - name: Build iOS archive (prod, unsigned)
        run: flutter build ipa --release --flavor prod -t lib/main_prod.dart --no-codesign
      - uses: actions/upload-artifact@v4
        with:
          name: app-prod-release-ipa-${{ github.ref_name }}
          path: build/ios/archive/Runner.xcarchive
          retention-days: 90
