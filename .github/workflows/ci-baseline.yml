name: CI baseline (temporary)

# CI speed plan S0. One unsharded run with timing, test identities and
# coverage, plus a flutter test -j comparison on one fixed file set.
# Temporary: removed after the baseline is recorded.
on:
  push:
    branches: ['web/ci-speed-r1']
    paths-ignore: ['docs/**', '**.md']

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-app

      - name: Full suite, unsharded
        run: |
          start=$(date +%s)
          flutter test --coverage --file-reporter json:baseline-reporter.json
          echo "test step seconds: $(( $(date +%s) - start ))" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Timing, identities, coverage
        if: always()
        run: |
          mkdir -p out
          dart run tool/ci/test_timing.dart baseline-reporter.json \
            --timing out/test_timings.json --identities out/identities.tsv \
            | tee -a "$GITHUB_STEP_SUMMARY"
          dart run tool/check_coverage.dart --min 0 | tee -a "$GITHUB_STEP_SUMMARY"
          cp coverage/lcov.info out/lcov.info
          cp baseline-reporter.json out/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: baseline
          path: out
          retention-days: 30

  parallelism:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        jobs: [2, 4, 6, 8]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-app

      - name: Every 8th test file, -j ${{ matrix.jobs }}
        run: |
          find test -name '*_test.dart' | LC_ALL=C sort | awk 'NR % 8 == 0' > files.txt
          echo "files: $(wc -l < files.txt)"
          start=$(date +%s)
          flutter test -j ${{ matrix.jobs }} $(cat files.txt)
          echo "-j ${{ matrix.jobs }}: $(( $(date +%s) - start )) s for $(wc -l < files.txt) files" | tee -a "$GITHUB_STEP_SUMMARY"
